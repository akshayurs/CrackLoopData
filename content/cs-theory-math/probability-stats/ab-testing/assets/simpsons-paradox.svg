<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Simpson's paradox: segments vs aggregate</text>

  <text x="140" y="55" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">New users</text>
  <rect x="70" y="70" width="60" height="90" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="65" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Ctrl 20%</text>
  <rect x="150" y="100" width="60" height="60" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="180" y="95" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Treat 15%</text>
  <text x="140" y="180" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">treatment LOSES here</text>

  <text x="470" y="55" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Returning users</text>
  <rect x="400" y="90" width="60" height="70" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="430" y="85" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Ctrl 60%</text>
  <rect x="480" y="70" width="60" height="90" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="510" y="65" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Treat 65%</text>
  <text x="470" y="180" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">treatment wins here</text>

  <text x="320" y="230" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">If treatment happened to get more returning users, the aggregate can still show treatment "winning" overall</text>
  <text x="320" y="250" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">&#8212; despite losing in the new-user segment and only modestly winning in returning users.</text>
</svg>