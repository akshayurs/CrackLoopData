<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Prior &#8594; likelihood &#8594; posterior</text>

  <rect x="40" y="90" width="160" height="70" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="120" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="var(--dg-ink, #202124)">Prior P(A)</text>
  <text x="120" y="136" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">belief before evidence</text>

  <line x1="200" y1="125" x2="260" y2="125" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowb)"/>
  <text x="230" y="112" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">&#215; Likelihood</text>
  <text x="230" y="150" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">P(B|A)</text>

  <rect x="260" y="90" width="120" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="var(--dg-ink, #202124)">Evidence B</text>
  <text x="320" y="136" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">observed data</text>

  <line x1="380" y1="125" x2="440" y2="125" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowb)"/>
  <text x="410" y="112" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">&#247; P(B)</text>

  <rect x="440" y="90" width="160" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="520" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="var(--dg-ink, #202124)">Posterior P(A|B)</text>
  <text x="520" y="136" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">updated belief</text>

  <text x="320" y="215" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The posterior can become next round's prior &#8212; Bayesian updating repeats this cycle.</text>
</svg>