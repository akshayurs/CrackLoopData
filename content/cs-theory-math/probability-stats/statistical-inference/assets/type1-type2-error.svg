<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Type I vs Type II error</text>

  <path d="M60,200 Q180,60 300,200 Z" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2"/>
  <path d="M220,200 Q340,80 460,200 Z" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>

  <path d="M280,200 Q300,140 310,120 L310,200 Z" fill="var(--dg-fill, #F1F3F4)" opacity="0.9"/>
  <text x="300" y="220" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">&#945; (Type I)</text>

  <path d="M220,200 Q250,140 280,120 L280,200 Z" fill="var(--dg-accent-bg, #E3F3F1)" opacity="0.9"/>
  <text x="250" y="220" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">&#946; (Type II)</text>

  <text x="150" y="55" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">null distribution</text>
  <text x="430" y="70" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">alternative distribution</text>

  <line x1="295" y1="55" x2="295" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="295" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">decision threshold</text>

  <text x="320" y="265" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">&#945; = falsely reject a true null; &#946; = fail to reject a false null</text>
</svg>