<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">PMF (discrete) vs PDF (continuous) vs CDF</text>

  <text x="110" y="50" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">PMF</text>
  <g fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5">
    <rect x="55" y="120" width="20" height="20"/>
    <rect x="85" y="90" width="20" height="50"/>
    <rect x="115" y="70" width="20" height="70"/>
    <rect x="145" y="100" width="20" height="40"/>
  </g>
  <line x1="45" y1="140" x2="175" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="110" y="160" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">P(X=x) as bars</text>

  <text x="320" y="50" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">PDF</text>
  <path d="M250,140 Q320,60 390,140" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <path d="M290,140 Q320,95 350,140 Z" fill="var(--dg-accent-bg, #E3F3F1)" stroke="none" opacity="0.7"/>
  <line x1="240" y1="140" x2="400" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="320" y="160" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">area = P(a&#8804;X&#8804;b)</text>

  <text x="530" y="50" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">CDF</text>
  <path d="M470,145 Q530,145 530,90 Q530,60 590,60" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <line x1="460" y1="145" x2="600" y2="145" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="460" y1="145" x2="460" y2="55" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="530" y="165" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">F(x)=P(X&#8804;x), 0&#8594;1</text>

  <text x="320" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">PMF and PDF describe the shape; CDF is the running total, always non-decreasing.</text>
</svg>