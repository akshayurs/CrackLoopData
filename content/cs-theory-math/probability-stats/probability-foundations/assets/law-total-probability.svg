<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Law of total probability: A sliced by a partition</text>

  <rect x="60" y="50" width="520" height="150" rx="4" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <line x1="190" y1="50" x2="190" y2="200" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <line x1="360" y1="50" x2="360" y2="200" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <ellipse cx="330" cy="125" rx="200" ry="50" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" opacity="0.75"/>

  <text x="125" y="45" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">B&#8321;</text>
  <text x="275" y="45" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">B&#8322;</text>
  <text x="470" y="45" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">B&#8323;</text>
  <text x="330" y="130" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">A</text>

  <text x="320" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">P(A) = sum of A's slice within each Bi, weighted by P(Bi)</text>
</svg>