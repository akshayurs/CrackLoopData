<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowt" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Probability tree</text>

  <circle cx="60" cy="150" r="8" fill="var(--dg-ink, #202124)"/>

  <line x1="65" y1="145" x2="230" y2="80" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowt)"/>
  <text x="140" y="100" font-size="12" fill="var(--dg-muted, #5F6368)">P(B) = 0.3</text>
  <line x1="65" y1="155" x2="230" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowt)"/>
  <text x="140" y="215" font-size="12" fill="var(--dg-muted, #5F6368)">P(B&#39;) = 0.7</text>

  <circle cx="235" cy="80" r="6" fill="var(--dg-accent, #0C8F88)"/>
  <circle cx="235" cy="220" r="6" fill="var(--dg-stroke, #9AA0A6)"/>

  <line x1="240" y1="75" x2="420" y2="40" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowt)"/>
  <text x="320" y="45" font-size="12" fill="var(--dg-muted, #5F6368)">P(A|B) = 0.6</text>
  <line x1="240" y1="85" x2="420" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowt)"/>
  <text x="320" y="115" font-size="12" fill="var(--dg-muted, #5F6368)">P(A&#39;|B) = 0.4</text>

  <line x1="240" y1="215" x2="420" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowt)"/>
  <text x="320" y="185" font-size="12" fill="var(--dg-muted, #5F6368)">P(A|B&#39;) = 0.2</text>
  <line x1="240" y1="225" x2="420" y2="260" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowt)"/>
  <text x="320" y="265" font-size="12" fill="var(--dg-muted, #5F6368)">P(A&#39;|B&#39;) = 0.8</text>

  <text x="470" y="40" font-size="12" fill="var(--dg-ink, #202124)">P(A&#8745;B)=0.18</text>
  <text x="470" y="120" font-size="12" fill="var(--dg-ink, #202124)">P(A&#39;&#8745;B)=0.12</text>
  <text x="470" y="180" font-size="12" fill="var(--dg-ink, #202124)">P(A&#8745;B&#39;)=0.14</text>
  <text x="470" y="260" font-size="12" fill="var(--dg-ink, #202124)">P(A&#39;&#8745;B&#39;)=0.56</text>

  <text x="320" y="295" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Multiply probabilities down each path to get the joint probability of that outcome.</text>
</svg>