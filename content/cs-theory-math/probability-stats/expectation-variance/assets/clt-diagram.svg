<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Central Limit Theorem</text>

  <text x="130" y="50" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Original: skewed</text>
  <path d="M50,180 L60,180 L70,150 L80,110 L90,80 L100,65 L110,90 L120,130 L130,160 L140,175 L150,180 L200,180" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="2"/>
  <line x1="50" y1="180" x2="200" y2="180" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <text x="320" y="90" text-anchor="middle" font-size="20" fill="var(--dg-muted, #5F6368)">&#8594;</text>
  <text x="320" y="115" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">average many samples</text>

  <text x="490" y="50" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Sampling distribution of the mean</text>
  <path d="M420,180 Q490,90 560,180" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>
  <line x1="410" y1="180" x2="570" y2="180" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <text x="320" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The original data's shape doesn't matter &#8212; the mean's sampling distribution still trends bell-shaped.</text>
</svg>