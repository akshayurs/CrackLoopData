<svg viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowSum" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-ink, #202124)"/>
    </marker>
  </defs>
  <text x="250" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Vector addition: the parallelogram rule</text>

  <line x1="60" y1="270" x2="440" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <line x1="60" y1="270" x2="60" y2="60" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>

  <line x1="60" y1="270" x2="220" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5" marker-end="url(#arrowA)"/>
  <text x="215" y="140" font-size="13" fill="var(--dg-accent, #0C8F88)">a = [2,2]</text>

  <line x1="60" y1="270" x2="260" y2="230" stroke="var(--dg-line, #5F6368)" stroke-width="2.5" marker-end="url(#arrowB)"/>
  <text x="240" y="250" font-size="13" fill="var(--dg-muted, #5F6368)">b = [3,1]</text>

  <line x1="220" y1="150" x2="380" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowB)"/>
  <line x1="260" y1="230" x2="380" y2="110" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowA)"/>

  <line x1="60" y1="270" x2="380" y2="110" stroke="var(--dg-ink, #202124)" stroke-width="2.5" marker-end="url(#arrowSum)"/>
  <text x="330" y="95" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">a+b = [5,3]</text>

  <text x="250" y="300" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Place b's tail at a's head (dashed) - the sum is the diagonal from the origin.</text>
</svg>
