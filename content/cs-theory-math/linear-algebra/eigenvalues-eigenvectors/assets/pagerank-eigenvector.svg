<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowP" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="240" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">PageRank as a stationary eigenvector</text>

  <circle cx="100" cy="130" r="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="135" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">A</text>

  <circle cx="240" cy="70" r="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="75" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">B</text>

  <circle cx="240" cy="200" r="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="205" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">C</text>

  <circle cx="380" cy="130" r="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="380" y="135" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">D</text>

  <line x1="122" y1="112" x2="215" y2="82" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <line x1="122" y1="148" x2="215" y2="188" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <line x1="265" y1="85" x2="355" y2="118" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <line x1="265" y1="188" x2="355" y2="145" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <line x1="380" y1="164" x2="140" y2="145" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowP)"/>

  <text x="240" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Rank scores settle into the dominant eigenvector of the link matrix - a stable, self-consistent distribution.</text>
</svg>
