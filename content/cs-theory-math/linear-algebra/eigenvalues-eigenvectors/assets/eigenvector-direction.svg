<svg viewBox="0 0 480 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowE" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
    <marker id="arrowO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="240" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Eigenvectors: directions that don't rotate</text>

  <line x1="240" y1="230" x2="240" y2="50" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <line x1="60" y1="140" x2="420" y2="140" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>

  <line x1="240" y1="140" x2="360" y2="80" stroke="var(--dg-muted, #5F6368)" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowO)"/>
  <text x="370" y="75" font-size="11" fill="var(--dg-muted, #5F6368)">generic v</text>

  <line x1="240" y1="140" x2="340" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrowO)"/>
  <text x="350" y="195" font-size="11" fill="var(--dg-muted, #5F6368)">Mv (rotated)</text>

  <line x1="240" y1="140" x2="330" y2="110" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5" marker-end="url(#arrowE)"/>
  <text x="340" y="105" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">eigenvector x</text>

  <line x1="240" y1="140" x2="200" y2="80" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrowE)"/>
  <text x="140" y="75" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">Mx = &#955;x</text>

  <text x="240" y="260" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A generic vector rotates under M; an eigenvector only stretches by &#955;, same line.</text>
</svg>
