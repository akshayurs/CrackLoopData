<svg viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="280" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Gaussian elimination: reduce to row echelon form</text>

  <rect x="40" y="60" width="150" height="90" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="115" y="90" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-family="monospace">2  1 | 5</text>
  <text x="115" y="110" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-family="monospace">4  3 | 11</text>
  <text x="115" y="140" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">original</text>

  <line x1="210" y1="105" x2="260" y2="105" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="235" y="90" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">R2 -= 2R1</text>

  <rect x="270" y="60" width="150" height="90" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="345" y="90" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-family="monospace">2  1 | 5</text>
  <text x="345" y="110" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-family="monospace">0  1 | 1</text>
  <text x="345" y="140" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">row echelon form</text>

  <line x1="440" y1="105" x2="490" y2="105" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="465" y="90" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">back-sub</text>

  <rect x="490" y="60" width="60" height="90" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="520" y="95" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-family="monospace">y=1</text>
  <text x="520" y="115" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-family="monospace">x=2</text>

  <text x="280" y="200" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Eliminate below the pivot column by column, then solve bottom-up by back-substitution.</text>
</svg>
