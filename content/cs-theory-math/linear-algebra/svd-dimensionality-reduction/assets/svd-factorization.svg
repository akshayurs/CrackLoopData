<svg viewBox="0 0 560 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="280" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">SVD: A = U Sigma V^T</text>

  <rect x="30" y="70" width="90" height="110" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="75" y="130" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)">A</text>
  <text x="75" y="200" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">m x n</text>

  <text x="150" y="130" text-anchor="middle" font-size="18" fill="var(--dg-muted, #5F6368)">=</text>

  <rect x="180" y="70" width="80" height="110" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="220" y="130" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">U</text>
  <text x="220" y="200" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">m x m</text>
  <text x="220" y="55" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">left singular vecs</text>

  <rect x="280" y="100" width="60" height="50" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="310" y="130" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">&#931;</text>
  <text x="310" y="55" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">singular values</text>
  <text x="310" y="170" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">m x n, diagonal</text>

  <rect x="360" y="70" width="150" height="60" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="435" y="105" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">V&#7488;</text>
  <text x="435" y="145" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">n x n</text>
  <text x="435" y="55" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">right singular vecs</text>

  <text x="280" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Works for ANY shape m x n - no square-matrix requirement, unlike eigen-decomposition.</text>
</svg>
