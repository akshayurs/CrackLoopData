<svg viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="280" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Matrix multiplication: dimension rule</text>

  <rect x="40" y="70" width="120" height="80" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="115" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)">A</text>
  <text x="100" y="170" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">m x n</text>

  <text x="200" y="115" text-anchor="middle" font-size="20" fill="var(--dg-muted, #5F6368)">&#215;</text>

  <rect x="240" y="70" width="80" height="120" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="280" y="135" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)">B</text>
  <text x="280" y="210" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">n x p</text>

  <text x="360" y="115" text-anchor="middle" font-size="20" fill="var(--dg-muted, #5F6368)">=</text>

  <rect x="400" y="70" width="80" height="80" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="440" y="115" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)">AB</text>
  <text x="440" y="170" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)">m x p</text>

  <text x="280" y="235" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The inner dimensions (n, n) must match and cancel; the outer ones (m, p) survive.</text>
</svg>
