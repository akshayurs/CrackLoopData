<svg viewBox="0 0 520 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowT" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="260" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A matrix as a transformation</text>

  <text x="120" y="55" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">before</text>
  <line x1="60" y1="240" x2="60" y2="70" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <line x1="60" y1="240" x2="230" y2="240" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <rect x="60" y="180" width="60" height="60" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="90" y="270" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)">unit square</text>

  <line x1="250" y1="150" x2="310" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrowT)"/>
  <text x="280" y="135" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">apply M</text>

  <text x="410" y="55" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">after</text>
  <line x1="350" y1="240" x2="350" y2="70" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <line x1="350" y1="240" x2="510" y2="240" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <polygon points="350,240 460,220 480,140 370,160" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="420" y="270" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)">rotated + scaled</text>

  <text x="260" y="292" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Multiplying every point by M rotates and stretches the whole square in one step.</text>
</svg>
