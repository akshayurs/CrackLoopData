<svg viewBox="0 0 560 160" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowC" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="280" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">What we actually know: the containment chain</text>

  <g font-size="13" fill="var(--dg-ink, #202124)">
    <rect x="15" y="70" width="60" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="45" y="95" text-anchor="middle">L</text>

    <rect x="115" y="70" width="60" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="145" y="95" text-anchor="middle">NL</text>

    <rect x="215" y="70" width="60" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="245" y="95" text-anchor="middle">P</text>

    <rect x="315" y="70" width="60" height="40" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="345" y="95" text-anchor="middle">NP</text>

    <rect x="415" y="70" width="90" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="460" y="95" text-anchor="middle">PSPACE</text>
  </g>

  <line x1="78" y1="90" x2="112" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowC)"/>
  <line x1="178" y1="90" x2="212" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowC)"/>
  <line x1="278" y1="90" x2="312" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowC)"/>
  <line x1="378" y1="90" x2="412" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowC)"/>

  <text x="280" y="140" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Every arrow is a proven subseteq; whether any is a STRICT subset is mostly open.</text>
</svg>
