<svg viewBox="0 0 440 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="220" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">PSPACE contains NP (known, not proven strict)</text>

