<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="240" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">P, NP, and NP-complete (believed picture)</text>

  <ellipse cx="240" cy="150" rx="210" ry="95" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="70" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">NP (verifiable fast)</text>

  <ellipse cx="180" cy="160" rx="100" ry="60" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="150" y="160" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">P</text>

  <ellipse cx="320" cy="160" rx="90" ry="55" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="320" y="165" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">NP-complete</text>

  <text x="240" y="235" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">P = NP is unproven; most believe P is a strict subset, with NP-complete the "hardest of NP".</text>
</svg>
