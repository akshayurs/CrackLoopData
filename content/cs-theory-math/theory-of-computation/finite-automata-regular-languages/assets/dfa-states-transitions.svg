<svg viewBox="0 0 480 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowD" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="240" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A DFA: states and transitions</text>

  <line x1="20" y1="130" x2="60" y2="130" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrowD)"/>
  <text x="35" y="115" font-size="10" fill="var(--dg-muted, #5F6368)">start</text>

  <circle cx="90" cy="130" r="32" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="135" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">q0</text>

  <circle cx="240" cy="130" r="32" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="135" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">q1</text>

  <circle cx="390" cy="130" r="32" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>
  <circle cx="390" cy="130" r="26" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="390" y="135" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">q2</text>

  <line x1="122" y1="122" x2="208" y2="122" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowD)"/>
  <text x="165" y="110" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">a</text>

  <line x1="272" y1="122" x2="358" y2="122" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowD)"/>
  <text x="315" y="110" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">b</text>

  <path d="M 90 98 A 40 40 0 0 1 130 130" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowD)"/>
  <text x="120" y="80" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">b (self)</text>

  <text x="240" y="210" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Double circle q2 = accepting state. Every state has exactly one transition per symbol.</text>
</svg>
