<svg viewBox="0 0 480 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowPd" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="240" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Pushdown automaton: finite control + stack</text>

  <circle cx="100" cy="120" r="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="115" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">finite</text>
  <text x="100" y="130" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">control</text>

  <line x1="134" y1="120" x2="190" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowPd)"/>
  <text x="162" y="105" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">push/pop</text>

  <rect x="210" y="60" width="60" height="140" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="214" y="160" width="52" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <text x="240" y="182" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">(</text>
  <rect x="214" y="124" width="52" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <text x="240" y="146" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">(</text>
  <text x="240" y="55" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">stack (unbounded)</text>

  <text x="360" y="115" font-size="12" fill="var(--dg-muted, #5F6368)">input: ( ( ) )</text>

  <text x="240" y="225" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Push on "(", pop on ")" - the stack tracks unbounded nesting depth a DFA can't.</text>
</svg>
