<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="240" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A parse tree for S -&gt; A + A</text>

  <circle cx="240" cy="60" r="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="240" y="65" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">S</text>

  <line x1="240" y1="86" x2="140" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="240" y1="86" x2="240" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="240" y1="86" x2="340" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>

  <circle cx="140" cy="160" r="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="140" y="165" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">A</text>

  <rect x="222" y="140" width="36" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="240" y="160" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">+</text>

  <circle cx="340" cy="160" r="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="340" y="165" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">A</text>

  <line x1="140" y1="184" x2="140" y2="215" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="140" y="230" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)">"a"</text>

  <line x1="340" y1="184" x2="340" y2="215" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="340" y="230" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)">"a"</text>

  <text x="240" y="250" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each production S -&gt; A + A, A -&gt; "a" becomes one level of the tree.</text>
</svg>
