<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="240" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The Chomsky hierarchy</text>

  <ellipse cx="240" cy="170" rx="220" ry="110" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="70" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">recursively enumerable</text>

  <ellipse cx="240" cy="185" rx="165" ry="85" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="112" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">context-sensitive</text>

  <ellipse cx="240" cy="200" rx="110" ry="60" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="240" y="153" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">context-free</text>

  <ellipse cx="240" cy="215" rx="55" ry="32" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="240" y="220" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">regular</text>

  <text x="240" y="290" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each ring strictly contains the one inside it - more power, more machinery needed.</text>
</svg>
