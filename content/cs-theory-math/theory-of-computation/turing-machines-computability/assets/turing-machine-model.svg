<svg viewBox="0 0 500 230" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowTm" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="250" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Turing machine: tape, head, states</text>

  <g>
    <rect x="30" y="70" width="55" height="45" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="57" y="98" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-family="monospace">1</text>
    <rect x="85" y="70" width="55" height="45" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="112" y="98" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-family="monospace">0</text>
    <rect x="140" y="70" width="55" height="45" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
    <text x="167" y="98" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-family="monospace">1</text>
    <rect x="195" y="70" width="55" height="45" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="222" y="98" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-family="monospace">_</text>
    <rect x="250" y="70" width="55" height="45" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="277" y="98" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-family="monospace">_</text>
  </g>
  <text x="167" y="60" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">head here</text>
  <line x1="167" y1="145" x2="167" y2="120" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrowTm)"/>

  <circle cx="380" cy="95" r="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="380" y="100" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">state</text>
  <text x="380" y="55" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">finite control</text>

  <text x="250" y="180" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each step: read symbol, write a symbol, move left/right, change state.</text>
  <text x="250" y="200" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The tape is unbounded in both directions - infinite memory.</text>
</svg>
