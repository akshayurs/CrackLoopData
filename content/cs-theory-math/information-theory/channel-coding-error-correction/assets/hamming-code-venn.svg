<svg viewBox="0 0 460 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="230" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Hamming(7,4): three overlapping parity circles</text>

  <circle cx="180" cy="140" r="90" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" opacity="0.7"/>
  <circle cx="280" cy="140" r="90" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" opacity="0.7"/>
  <circle cx="230" cy="210" r="90" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" opacity="0.7"/>

  <text x="120" y="100" font-size="11" fill="var(--dg-accent, #0C8F88)">P1 circle</text>
  <text x="320" y="100" font-size="11" fill="var(--dg-muted, #5F6368)">P2 circle</text>
  <text x="215" y="270" font-size="11" fill="var(--dg-muted, #5F6368)">P3 circle</text>

  <text x="150" y="130" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">d1</text>
  <text x="310" y="130" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">d2</text>
  <text x="230" y="240" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">d3</text>
  <text x="230" y="150" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">d4</text>

  <text x="230" y="150" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)"> </text>
  <text x="230" y="20" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)"> </text>

  <text x="230" y="255" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" transform="translate(0,-5)"> </text>
