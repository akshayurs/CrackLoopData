<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowN" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="250" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The noisy channel model</text>

  <rect x="20" y="80" width="90" height="60" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="65" y="115" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">sender</text>

  <line x1="110" y1="110" x2="175" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrowN)"/>
  <text x="140" y="98" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">encode</text>

  <rect x="180" y="70" width="130" height="80" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="245" y="105" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">noisy</text>
  <text x="245" y="122" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">channel</text>
  <text x="245" y="60" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">bit flips happen here</text>

  <line x1="310" y1="110" x2="375" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrowN)"/>
  <text x="342" y="98" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">decode</text>

  <rect x="380" y="80" width="100" height="60" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="430" y="115" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">receiver</text>

  <text x="250" y="185" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Add redundancy before the channel so the receiver can detect/correct flips after it.</text>
</svg>
