<svg viewBox="0 0 460 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="230" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A prefix code as a binary tree</text>

  <circle cx="230" cy="60" r="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <line x1="230" y1="70" x2="140" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="175" y="100" font-size="11" fill="var(--dg-muted, #5F6368)">0</text>
  <line x1="230" y1="70" x2="320" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="285" y="100" font-size="11" fill="var(--dg-muted, #5F6368)">1</text>

  <circle cx="140" cy="130" r="22" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="140" y="135" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">A: 0</text>

  <circle cx="320" cy="130" r="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <line x1="320" y1="140" x2="270" y2="190" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="285" y="170" font-size="11" fill="var(--dg-muted, #5F6368)">0</text>
  <line x1="320" y1="140" x2="370" y2="190" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="355" y="170" font-size="11" fill="var(--dg-muted, #5F6368)">1</text>

  <circle cx="270" cy="200" r="22" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="270" y="205" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">B: 10</text>

  <circle cx="370" cy="200" r="22" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="370" y="205" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">C: 11</text>

  <text x="230" y="232" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Codes are only leaves - no code (e.g. "0") is a prefix of another, so decoding is unambiguous.</text>
</svg>
