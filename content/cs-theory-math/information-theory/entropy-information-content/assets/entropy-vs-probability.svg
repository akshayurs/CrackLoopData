<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="240" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Entropy of a biased coin, by p(heads)</text>

  <line x1="60" y1="210" x2="420" y2="210" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <line x1="60" y1="210" x2="60" y2="50" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="240" y="235" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">p(heads)</text>
  <text x="25" y="60" font-size="12" fill="var(--dg-muted, #5F6368)">H(p)</text>

  <path d="M 60 210 Q 130 60 240 55 Q 350 60 420 210" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>

  <line x1="240" y1="210" x2="240" y2="55" stroke="var(--dg-line, #5F6368)" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="240" cy="55" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <text x="240" y="40" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">p=0.5: max entropy (1 bit)</text>

  <circle cx="60" cy="210" r="4" fill="var(--dg-muted, #5F6368)"/>
  <text x="60" y="230" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">p=0</text>
  <circle cx="420" cy="210" r="4" fill="var(--dg-muted, #5F6368)"/>
  <text x="420" y="230" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">p=1</text>

  <text x="240" y="20" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)"> </text>
</svg>
