<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="300" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Inclusion-exclusion: |A &#8746; B| = |A| + |B| &#8722; |A &#8745; B|</text>

  <circle cx="240" cy="150" r="70" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" opacity="0.9"/>
  <circle cx="340" cy="150" r="70" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" opacity="0.9"/>
  <path d="M300,90 a70,70 0 0 1 0,120 a70,70 0 0 1 0,-120 z" fill="var(--dg-accent, #0C8F88)" opacity="0.55"/>

  <text x="200" y="150" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">A</text>
  <text x="380" y="150" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">B</text>
  <text x="300" y="250" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">darker overlap = |A &#8745; B|, counted twice by |A|+|B|, subtracted once</text>
  <text x="300" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">so it ends up counted exactly once in the total</text>
</svg>