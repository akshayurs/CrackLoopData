<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="360" y="28" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">De Morgan's laws: negating AND / OR</text>

  <text x="180" y="58" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)">&#172;(p &#8743; q) &#8801; &#172;p &#8744; &#172;q</text>
  <circle cx="150" cy="130" r="55" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" opacity="0.85"/>
  <circle cx="210" cy="130" r="55" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" opacity="0.85"/>
  <text x="130" y="135" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">p</text>
  <text x="230" y="135" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">q</text>
  <text x="180" y="210" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">shaded = outside both circles</text>
  <text x="180" y="228" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">&#172;p &#8744; &#172;q: at least one is false</text>

  <line x1="360" y1="70" x2="360" y2="320" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="540" y="58" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)">&#172;(p &#8744; q) &#8801; &#172;p &#8743; &#172;q</text>
  <circle cx="510" cy="130" r="55" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" opacity="0.85"/>
  <circle cx="570" cy="130" r="55" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" opacity="0.85"/>
  <text x="490" y="135" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">p</text>
  <text x="590" y="135" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">q</text>
  <text x="540" y="210" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">shaded = outside the union entirely</text>
  <text x="540" y="228" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">&#172;p &#8743; &#172;q: both are false</text>

  <text x="360" y="290" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Negate "both" and you get "at least one isn't"; negate "either" and you get "neither is".</text>
  <text x="360" y="310" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Same shape as flipping &#8704; and &#8707; when negating quantified statements.</text>
</svg>