<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Recursion tree: T(n) = 2T(n/2) + n</text>

  <g stroke="var(--dg-line, #5F6368)" stroke-width="1.2" fill="none">
    <line x1="320" y1="55" x2="180" y2="115"/><line x1="320" y1="55" x2="460" y2="115"/>
    <line x1="180" y1="130" x2="110" y2="190"/><line x1="180" y1="130" x2="250" y2="190"/>
    <line x1="460" y1="130" x2="390" y2="190"/><line x1="460" y1="130" x2="530" y2="190"/>
  </g>

  <rect x="270" y="40" width="100" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">n work</text>

  <rect x="130" y="115" width="100" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="180" y="135" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">n/2</text>
  <rect x="410" y="115" width="100" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="460" y="135" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">n/2</text>
  <text x="565" y="135" font-size="12" fill="var(--dg-muted, #5F6368)">level total: n</text>

  <rect x="65" y="190" width="90" height="28" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="209" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">n/4</text>
  <rect x="205" y="190" width="90" height="28" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="209" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">n/4</text>
  <rect x="345" y="190" width="90" height="28" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="390" y="209" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">n/4</text>
  <rect x="485" y="190" width="90" height="28" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="209" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">n/4</text>
  <text x="565" y="209" font-size="12" fill="var(--dg-muted, #5F6368)">level total: n</text>

  <text x="320" y="260" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">log n levels, each summing to n of work &#8658; T(n) = O(n log n)</text>
</svg>