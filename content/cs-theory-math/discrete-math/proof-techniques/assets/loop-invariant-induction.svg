<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="360" y="28" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Loop invariant &#8596; induction</text>

  <rect x="30" y="70" width="180" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="120" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="var(--dg-ink, #202124)">Initialization</text>
  <text x="120" y="113" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">invariant true before loop</text>

  <text x="255" y="105" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)">=</text>

  <rect x="280" y="70" width="180" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="370" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="var(--dg-ink, #202124)">Base case</text>
  <text x="370" y="113" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">P(n&#8320;) holds</text>

  <rect x="30" y="170" width="180" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="120" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="var(--dg-ink, #202124)">Maintenance</text>
  <text x="120" y="213" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">true before iter i &#8658; true before i+1</text>

  <text x="255" y="205" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)">=</text>

  <rect x="280" y="170" width="180" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="370" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="var(--dg-ink, #202124)">Inductive step</text>
  <text x="370" y="213" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">P(k) &#8658; P(k+1)</text>

  <rect x="540" y="120" width="150" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="615" y="145" text-anchor="middle" font-size="13" font-weight="600" fill="var(--dg-ink, #202124)">Termination</text>
  <text x="615" y="163" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">invariant + exit &#8658; correctness</text>

  <line x1="460" y1="100" x2="538" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="460" y1="200" x2="538" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <text x="360" y="285" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Initialization + maintenance is exactly base case + inductive step; the loop's exit gives the final claim.</text>
</svg>