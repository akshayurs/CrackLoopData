<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="160" y="26" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">K&#8325; (5 mutually connected)</text>
  <g stroke="var(--dg-line, #5F6368)" stroke-width="1.2" fill="none">
    <line x1="160" y1="60" x2="80" y2="130"/><line x1="160" y1="60" x2="240" y2="130"/>
    <line x1="160" y1="60" x2="120" y2="220"/><line x1="160" y1="60" x2="200" y2="220"/>
    <line x1="80" y1="130" x2="240" y2="130"/><line x1="80" y1="130" x2="120" y2="220"/>
    <line x1="80" y1="130" x2="200" y2="220"/><line x1="240" y1="130" x2="120" y2="220"/>
    <line x1="240" y1="130" x2="200" y2="220"/><line x1="120" y1="220" x2="200" y2="220"/>
  </g>
  <g fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5">
    <circle cx="160" cy="60" r="12"/><circle cx="80" cy="130" r="12"/><circle cx="240" cy="130" r="12"/>
    <circle cx="120" cy="220" r="12"/><circle cx="200" cy="220" r="12"/>
  </g>
  <text x="160" y="260" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">no way to draw flat, crossing-free</text>

  <line x1="330" y1="30" x2="330" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="480" y="26" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">K&#8323;,&#8323; (3 houses, 3 utilities)</text>
  <g stroke="var(--dg-line, #5F6368)" stroke-width="1.2" fill="none">
    <line x1="420" y1="70" x2="420" y2="220"/><line x1="420" y1="70" x2="480" y2="220"/><line x1="420" y1="70" x2="540" y2="220"/>
    <line x1="480" y1="70" x2="420" y2="220"/><line x1="480" y1="70" x2="480" y2="220"/><line x1="480" y1="70" x2="540" y2="220"/>
    <line x1="540" y1="70" x2="420" y2="220"/><line x1="540" y1="70" x2="480" y2="220"/><line x1="540" y1="70" x2="540" y2="220"/>
  </g>
  <g fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5">
    <circle cx="420" cy="70" r="10"/><circle cx="480" cy="70" r="10"/><circle cx="540" cy="70" r="10"/>
    <circle cx="420" cy="220" r="10"/><circle cx="480" cy="220" r="10"/><circle cx="540" cy="220" r="10"/>
  </g>
  <text x="480" y="255" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">each house to each utility, no crossings possible</text>
</svg>