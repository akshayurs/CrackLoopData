<svg viewBox="0 0 500 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="250" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Hasse diagram: divides, on {1,2,3,4,6,12}</text>

  <line x1="250" y1="330" x2="150" y2="260" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="250" y1="330" x2="330" y2="260" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="150" y1="260" x2="150" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="150" y1="180" x2="100" y2="100" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="150" y1="180" x2="200" y2="100" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="330" y1="260" x2="200" y2="100" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="330" y1="260" x2="330" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="330" y1="180" x2="200" y2="100" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>

  <g fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5">
    <circle cx="250" cy="330" r="20"/>
    <circle cx="150" cy="260" r="20"/>
    <circle cx="330" cy="260" r="20"/>
    <circle cx="150" cy="180" r="20"/>
    <circle cx="330" cy="180" r="20"/>
    <circle cx="200" cy="100" r="20"/>
  </g>
  <text x="250" y="335" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">1</text>
  <text x="150" y="265" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">2</text>
  <text x="330" y="265" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">3</text>
  <text x="150" y="185" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">4</text>
  <text x="330" y="185" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">6</text>
  <text x="200" y="105" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">12</text>

  <text x="250" y="365" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">2 and 3 have no edge or path between them &#8212; incomparable, not equal, not ordered.</text>
</svg>