<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">A DMA transfer, step by step</text>

  <!-- Column headers -->
  <text x="110" y="52" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">CPU</text>
  <text x="320" y="52" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">DMA controller</text>
  <text x="530" y="52" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Device ↔ Memory</text>

  <rect x="60" y="62" width="100" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="84" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">1. Configure</text>

  <line x1="160" y1="80" x2="270" y2="80" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="270" y="62" width="100" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="84" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">set up transfer</text>

  <rect x="60" y="120" width="100" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="110" y="140" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">2. CPU free —</text>
  <text x="110" y="156" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">runs other work</text>

  <line x1="320" y1="98" x2="320" y2="126" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>

  <line x1="370" y1="145" x2="470" y2="145" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <rect x="270" y="120" width="100" height="50" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="140" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">3. moves data</text>
  <text x="320" y="156" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">directly</text>

  <rect x="470" y="120" width="110" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="525" y="140" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">device</text>
  <text x="525" y="156" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">↕ memory</text>

  <line x1="320" y1="170" x2="320" y2="198" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="270" y1="216" x2="160" y2="216" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="270" y="198" width="100" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="220" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">4. transfer done</text>

  <rect x="60" y="198" width="100" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="220" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">5. interrupt fires</text>

  <text x="320" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">CPU touches this only at steps 1 and 5 — the transfer itself never uses CPU cycles.</text>
</svg>
