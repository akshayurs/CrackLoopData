<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Garbage collection: relocate, then erase</text>

  <!-- Fragmented block -->
  <rect x="40" y="46" width="240" height="120" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="64" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Fragmented block</text>

  <rect x="52" y="76" width="50" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="77" y="97" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">live</text>

  <rect x="106" y="76" width="50" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 2"/>
  <text x="131" y="97" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">stale</text>

  <rect x="160" y="76" width="50" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="185" y="97" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">live</text>

  <rect x="214" y="76" width="50" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 2"/>
  <text x="239" y="97" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">stale</text>

  <text x="160" y="140" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Step 1: identify live vs stale pages</text>

  <line x1="290" y1="106" x2="360" y2="106" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="325" y="96" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">copy live</text>

  <!-- Fresh block -->
  <rect x="360" y="46" width="240" height="120" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="480" y="64" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Fresh block (live relocated)</text>

  <rect x="372" y="76" width="50" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="397" y="97" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">live</text>

  <rect x="426" y="76" width="50" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="451" y="97" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">live</text>

  <rect x="480" y="76" width="50" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="2 2"/>
  <text x="505" y="97" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">free</text>

  <text x="480" y="140" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Step 2: original block now erasable</text>

  <text x="320" y="200" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Only after every live page is safely copied out does the controller</text>
  <text x="320" y="218" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">erase the original block and return it to the free pool.</text>
</svg>
