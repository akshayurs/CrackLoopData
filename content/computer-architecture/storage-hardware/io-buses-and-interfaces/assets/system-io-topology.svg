<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">A simplified system I/O topology</text>

  <rect x="255" y="120" width="130" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="145" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">CPU +</text>
  <text x="320" y="162" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">memory controller</text>

  <!-- lanes fanning out -->
  <line x1="320" y1="120" x2="150" y2="60" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="120" x2="320" y2="50" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="385" y1="140" x2="520" y2="70" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="180" x2="320" y2="250" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="30" width="180" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="55" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">GPU (x16 lanes)</text>

  <rect x="250" y="20" width="140" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="41" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">System RAM</text>

  <rect x="440" y="45" width="180" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="70" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">NVMe SSD (x4 lanes)</text>

  <rect x="230" y="250" width="180" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="275" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Other peripherals (USB, NIC)</text>

  <text x="320" y="210" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Total lanes are a fixed budget — more to the GPU means fewer elsewhere.</text>
</svg>
