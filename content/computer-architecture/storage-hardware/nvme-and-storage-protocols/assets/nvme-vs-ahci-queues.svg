<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="160" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">AHCI: one queue</text>
  <text x="480" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">NVMe: many queues</text>

  <!-- AHCI side -->
  <rect x="40" y="44" width="220" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="69" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">1 queue, depth 32</text>

  <line x1="150" y1="84" x2="150" y2="112" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>

  <rect x="70" y="112" width="160" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="142" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">SSD (one path in)</text>

  <text x="150" y="200" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Every command funnels through</text>
  <text x="150" y="216" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">a single choke point.</text>

  <!-- NVMe side -->
  <g>
    <rect x="330" y="44" width="80" height="30" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="370" y="64" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Q0</text>

    <rect x="420" y="44" width="80" height="30" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="460" y="64" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Q1</text>

    <rect x="510" y="44" width="80" height="30" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="550" y="64" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">… Qn</text>
  </g>

  <line x1="370" y1="74" x2="450" y2="112" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="460" y1="74" x2="460" y2="112" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="550" y1="74" x2="470" y2="112" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>

  <rect x="380" y="112" width="160" height="50" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="460" y="142" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">SSD (multi-channel)</text>

  <text x="460" y="200" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Many queues feed the SSD's</text>
  <text x="460" y="216" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">independent channels in parallel.</text>
</svg>
