<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Platter, tracks, and the head arm</text>

  <circle cx="260" cy="160" r="120" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="260" cy="160" r="88" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <circle cx="260" cy="160" r="56" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <circle cx="260" cy="160" r="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <!-- sector lines -->
  <g stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1">
    <line x1="260" y1="40" x2="260" y2="280"/>
    <line x1="140" y1="160" x2="380" y2="160"/>
    <line x1="175" y1="75" x2="345" y2="245"/>
    <line x1="345" y1="75" x2="175" y2="245"/>
  </g>

  <!-- track highlighted -->
  <circle cx="260" cy="160" r="88" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="3" stroke-dasharray="4 300"/>

  <!-- head arm -->
  <line x1="520" y1="60" x2="330" y2="130" stroke="var(--dg-line, #5F6368)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="330" cy="130" r="6" fill="var(--dg-accent, #0C8F88)"/>
  <rect x="500" y="44" width="30" height="20" rx="3" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="515" y="58" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">arm</text>

  <text x="330" y="115" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">head</text>
  <text x="260" y="200" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">tracks</text>

  <text x="320" y="272" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Arm sweeps to change tracks (seek); platter spins to bring the sector under the head (rotation).</text>
</svg>
