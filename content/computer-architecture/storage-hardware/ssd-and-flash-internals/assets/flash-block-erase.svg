<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">A flash block: many pages, one erase unit</text>

  <rect x="80" y="46" width="480" height="150" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="100" y="66" font-size="12" fill="var(--dg-muted, #5F6368)">Block (erased as one unit)</text>

  <g>
    <rect x="100" y="78" width="80" height="50" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="140" y="107" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Page 0</text>

    <rect x="190" y="78" width="80" height="50" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="230" y="107" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Page 1</text>

    <rect x="280" y="78" width="80" height="50" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="320" y="107" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Page 2</text>

    <rect x="370" y="78" width="80" height="50" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="410" y="107" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Page 3</text>

    <rect x="460" y="78" width="80" height="50" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="500" y="107" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">…</text>
  </g>

  <text x="320" y="160" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">To rewrite any one page, the entire block must be erased first —</text>
  <text x="320" y="178" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">taking every other page in it along with it.</text>

  <text x="320" y="228" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">This is why SSDs redirect writes to fresh pages instead of erasing on every small update.</text>
</svg>
