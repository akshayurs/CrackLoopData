<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="140" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Core A</text>
  <rect x="60" y="30" width="160" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="140" y="53" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">x = 1</text>
  <rect x="60" y="80" width="160" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="140" y="103" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">y = 1</text>
  <text x="140" y="130" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">program order: x then y</text>

  <text x="500" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Core B</text>
  <rect x="420" y="30" width="160" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="500" y="53" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">read y → sees 1</text>
  <rect x="420" y="80" width="160" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="500" y="103" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">read x → sees 0 (!)</text>

  <line x1="220" y1="65" x2="420" y2="98" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <line x1="220" y1="98" x2="420" y2="48" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="20" y="160" font-size="12" fill="var(--dg-muted, #5F6368)">A's store buffer let y=1 become visible before x=1 did.</text>
  <text x="20" y="180" font-size="12" fill="var(--dg-muted, #5F6368)">Under sequential consistency this outcome is forbidden;</text>
  <text x="20" y="200" font-size="12" fill="var(--dg-muted, #5F6368)">under a relaxed model, it's legal and does happen in practice.</text>
</svg>
