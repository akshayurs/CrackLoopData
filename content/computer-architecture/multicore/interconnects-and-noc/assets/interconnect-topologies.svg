<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <text x="100" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Bus</text>
  <line x1="20" y1="60" x2="180" y2="60" stroke="var(--dg-line, #5F6368)" stroke-width="3"/>
  <circle cx="40" cy="60" r="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <circle cx="80" cy="60" r="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <circle cx="120" cy="60" r="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <circle cx="160" cy="60" r="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="100" y="90" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">one shared line</text>

  <text x="320" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Crossbar</text>
  <circle cx="260" cy="50" r="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <circle cx="380" cy="50" r="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <circle cx="260" cy="110" r="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <circle cx="380" cy="110" r="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <line x1="260" y1="50" x2="380" y2="50" stroke="var(--dg-line, #5F6368)" stroke-width="1"/>
  <line x1="260" y1="50" x2="380" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="1"/>
  <line x1="260" y1="50" x2="260" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="1"/>
  <line x1="380" y1="50" x2="260" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="1"/>
  <line x1="380" y1="50" x2="380" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="1"/>
  <line x1="260" y1="110" x2="380" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="1"/>
  <text x="320" y="140" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">any-to-any, N² wiring</text>

  <text x="540" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Mesh (NoC)</text>
  <circle cx="500" cy="50" r="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <circle cx="580" cy="50" r="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <circle cx="500" cy="110" r="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <circle cx="580" cy="110" r="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <line x1="500" y1="50" x2="580" y2="50" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="500" y1="110" x2="580" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="500" y1="50" x2="500" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="580" y1="50" x2="580" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="540" y="140" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">local links, hop routing</text>

  <text x="20" y="180" font-size="12" fill="var(--dg-muted, #5F6368)">Bus: one bottleneck.  Crossbar: fast but quadratic cost.  Mesh: local wiring only, cost scales linearly with core count.</text>
</svg>
