<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <line x1="50" y1="220" x2="600" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="50" y1="220" x2="50" y2="20" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="580" y="240" font-size="12" fill="var(--dg-muted, #5F6368)">cores</text>
  <text x="15" y="30" font-size="12" fill="var(--dg-muted, #5F6368)">speedup</text>

  <path d="M50,220 C120,140 180,90 260,70 C340,55 420,50 500,48 C540,47 570,47 600,46" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="420" y="35" font-size="11" fill="var(--dg-muted, #5F6368)">theoretical (Amdahl ceiling)</text>

  <path d="M50,220 C120,150 180,110 260,95 C340,105 420,130 500,160 C540,175 570,185 600,195" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>
  <text x="420" y="150" font-size="11" fill="var(--dg-accent, #0C8F88)">real curve (sync overhead + imbalance)</text>

  <text x="20" y="255" font-size="11" fill="var(--dg-muted, #5F6368)">Amdahl caps the dashed curve; contention and imbalance pull the real (solid) curve down further, even regressing at high core counts.</text>
</svg>
