<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <text x="150" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">4 scalar adds</text>
  <rect x="20" y="30" width="60" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="50" y="50" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">ADD</text>
  <rect x="90" y="30" width="60" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="120" y="50" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">ADD</text>
  <rect x="160" y="30" width="60" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="190" y="50" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">ADD</text>
  <rect x="230" y="30" width="60" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="260" y="50" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">ADD</text>
  <text x="150" y="85" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">4 separate instructions, fetched/decoded 4x</text>

  <text x="480" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">1 SIMD add</text>
  <rect x="360" y="30" width="240" height="30" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <line x1="420" y1="30" x2="420" y2="60" stroke="var(--dg-accent, #0C8F88)"/>
  <line x1="480" y1="30" x2="480" y2="60" stroke="var(--dg-accent, #0C8F88)"/>
  <line x1="540" y1="30" x2="540" y2="60" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="390" y="50" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">a0+b0</text>
  <text x="450" y="50" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">a1+b1</text>
  <text x="510" y="50" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">a2+b2</text>
  <text x="570" y="50" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">a3+b3</text>
  <text x="480" y="85" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">1 instruction, 1 fetch/decode, 4 lanes at once</text>

  <text x="20" y="150" font-size="12" fill="var(--dg-muted, #5F6368)">Both compute the same four sums (a0+b0 ... a3+b3).</text>
  <text x="20" y="170" font-size="12" fill="var(--dg-muted, #5F6368)">SIMD amortizes fetch/decode/issue cost across all four results.</text>
</svg>
