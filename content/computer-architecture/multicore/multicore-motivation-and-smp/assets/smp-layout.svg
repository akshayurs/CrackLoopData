<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <text x="320" y="18" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)">Symmetric multiprocessing (4 cores)</text>

  <g>
    <rect x="20" y="30" width="120" height="90" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="80" y="55" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Core 0</text>
    <text x="80" y="78" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">L1 / L2</text>
    <text x="80" y="94" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">private</text>
  </g>
  <g>
    <rect x="170" y="30" width="120" height="90" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="230" y="55" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Core 1</text>
    <text x="230" y="78" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">L1 / L2</text>
    <text x="230" y="94" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">private</text>
  </g>
  <g>
    <rect x="320" y="30" width="120" height="90" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="380" y="55" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Core 2</text>
    <text x="380" y="78" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">L1 / L2</text>
    <text x="380" y="94" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">private</text>
  </g>
  <g>
    <rect x="470" y="30" width="120" height="90" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="530" y="55" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Core 3</text>
    <text x="530" y="78" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">L1 / L2</text>
    <text x="530" y="94" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">private</text>
  </g>

  <rect x="20" y="150" width="570" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="305" y="180" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Shared L3 cache</text>

  <rect x="20" y="220" width="570" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="305" y="240" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Main memory (shared, all cores)</text>
</svg>
