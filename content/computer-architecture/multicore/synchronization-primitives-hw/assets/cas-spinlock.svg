<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="270" y="10" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="320" y="32" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">lock = 0</text>

  <rect x="60" y="80" width="180" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="150" y="105" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Thread A: CAS(0→1) ✓</text>

  <rect x="400" y="80" width="180" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="490" y="105" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Thread B: CAS(0→1) ✗ retry</text>

  <line x1="270" y1="44" x2="160" y2="80" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="44" x2="480" y2="80" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="150" width="180" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="150" y="175" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">A holds lock, does work</text>

  <rect x="400" y="150" width="180" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="490" y="175" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">B keeps spinning (CAS fails)</text>

  <line x1="150" y1="120" x2="150" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="120" x2="490" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="20" y="225" font-size="12" fill="var(--dg-muted, #5F6368)">Release: A stores lock = 0 (plain store — A is the sole writer). B's next CAS then succeeds.</text>
</svg>
