<svg viewBox="0 0 620 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="310" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Full adder: two half adders + OR</text>

  <text x="30" y="64" font-size="12" fill="var(--dg-ink, #202124)">A</text>
  <text x="30" y="104" font-size="12" fill="var(--dg-ink, #202124)">B</text>
  <text x="30" y="184" font-size="12" fill="var(--dg-ink, #202124)">Cin</text>

  <line x1="50" y1="60" x2="110" y2="60" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="50" y1="100" x2="110" y2="100" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>

  <!-- HA1 -->
  <rect x="110" y="50" width="100" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="85" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Half Adder 1</text>

  <line x1="210" y1="65" x2="260" y2="65" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="260" y1="65" x2="260" y2="170" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="260" y1="170" x2="300" y2="170" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="230" y="58" font-size="10" fill="var(--dg-muted, #5F6368)">sum1</text>

  <line x1="210" y1="95" x2="500" y2="95" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="500" y1="95" x2="500" y2="230" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="500" y1="230" x2="530" y2="230" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="400" y="88" font-size="10" fill="var(--dg-muted, #5F6368)">carry1</text>

  <line x1="50" y1="180" x2="300" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>

  <!-- HA2 -->
  <rect x="300" y="150" width="100" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="350" y="185" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Half Adder 2</text>

  <line x1="400" y1="165" x2="560" y2="165" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="575" y="169" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Sum</text>

  <line x1="400" y1="195" x2="440" y2="195" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="440" y1="195" x2="440" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="440" y1="220" x2="470" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="410" y="188" font-size="10" fill="var(--dg-muted, #5F6368)">carry2</text>

  <!-- OR gate -->
  <rect x="470" y="205" width="80" height="45" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="510" y="232" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">OR</text>

  <line x1="550" y1="227" x2="590" y2="227" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="595" y="231" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Cout</text>

  <text x="310" y="266" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Cout = carry1 OR carry2 -- carries in to a chained ripple-carry adder</text>
</svg>
