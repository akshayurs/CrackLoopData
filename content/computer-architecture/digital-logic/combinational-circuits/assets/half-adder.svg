<svg viewBox="0 0 520 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="260" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Half adder</text>

  <text x="40" y="74" font-size="12" fill="var(--dg-ink, #202124)">A</text>
  <text x="40" y="134" font-size="12" fill="var(--dg-ink, #202124)">B</text>
  <line x1="55" y1="70" x2="120" y2="70" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="55" y1="130" x2="120" y2="130" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="55" y1="70" x2="55" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="55" y1="90" x2="120" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="55" y1="130" x2="55" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="55" y1="110" x2="120" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>

  <!-- XOR gate -->
  <rect x="120" y="55" width="90" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="165" y="80" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">XOR</text>
  <line x1="210" y1="75" x2="270" y2="75" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="290" y="79" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Sum</text>

  <!-- AND gate -->
  <rect x="120" y="115" width="90" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="165" y="140" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">AND</text>
  <line x1="210" y1="135" x2="270" y2="135" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="290" y="139" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Carry</text>

  <text x="260" y="195" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Sum = A XOR B, Carry = A AND B</text>
</svg>
