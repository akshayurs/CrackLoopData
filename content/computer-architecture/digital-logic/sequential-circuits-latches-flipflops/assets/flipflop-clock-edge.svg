<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="310" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Edge-triggered flip-flop: Q updates only at the rising edge</text>

  <!-- Clock waveform -->
  <text x="30" y="64" font-size="12" fill="var(--dg-muted, #5F6368)">CLK</text>
  <polyline points="60,80 60,60 180,60 180,80 300,80 300,60 420,60 420,80 540,80 540,60" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="2"/>

  <!-- highlight rising edges -->
  <line x1="180" y1="60" x2="180" y2="200" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="420" y1="60" x2="420" y2="200" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="180" y="50" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">edge</text>
  <text x="420" y="50" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">edge</text>

  <!-- D waveform -->
  <text x="30" y="134" font-size="12" fill="var(--dg-muted, #5F6368)">D</text>
  <polyline points="60,150 140,150 140,120 320,120 320,150 460,150 460,120 560,120" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2"/>

  <!-- Q waveform: changes only at edges -->
  <text x="30" y="204" font-size="12" fill="var(--dg-muted, #5F6368)">Q</text>
  <polyline points="60,220 180,220 180,190 420,190 420,220 540,220" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>

  <text x="310" y="245" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">D changes freely between edges; Q only follows at the instant of each rising edge.</text>
</svg>
