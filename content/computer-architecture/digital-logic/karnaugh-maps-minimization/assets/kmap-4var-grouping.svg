<svg viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="260" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">4-variable K-map (AB rows x CD columns)</text>

  <text x="150" y="55" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">CD</text>
  <text x="60" y="90" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">AB</text>

  <!-- column headers -->
  <g font-size="12" fill="var(--dg-muted, #5F6368)" text-anchor="middle">
    <text x="150" y="75">00</text>
    <text x="240" y="75">01</text>
    <text x="330" y="75">11</text>
    <text x="420" y="75">10</text>
  </g>
  <!-- row headers -->
  <g font-size="12" fill="var(--dg-muted, #5F6368)" text-anchor="middle">
    <text x="105" y="115">00</text>
    <text x="105" y="195">01</text>
    <text x="105" y="275">11</text>
    <text x="105" y="355">10</text>
  </g>

  <!-- grid: 4x4 cells, each 90x80, starting x=105,y=85 -->
  <g stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" fill="var(--dg-fill, #F1F3F4)">
    <rect x="105" y="85" width="90" height="80"/>
    <rect x="195" y="85" width="90" height="80"/>
    <rect x="285" y="85" width="90" height="80"/>
    <rect x="375" y="85" width="90" height="80"/>

    <rect x="105" y="165" width="90" height="80"/>
    <rect x="195" y="165" width="90" height="80"/>
    <rect x="285" y="165" width="90" height="80"/>
    <rect x="375" y="165" width="90" height="80"/>

    <rect x="105" y="245" width="90" height="80"/>
    <rect x="195" y="245" width="90" height="80"/>
    <rect x="285" y="245" width="90" height="80"/>
    <rect x="375" y="245" width="90" height="80"/>

    <rect x="105" y="325" width="90" height="80"/>
    <rect x="195" y="325" width="90" height="80"/>
    <rect x="285" y="325" width="90" height="80"/>
    <rect x="375" y="325" width="90" height="80"/>
  </g>

  <!-- cell values: top two rows all 1 (8-cell group), bottom-right 2x2 block =1 (4-cell group), rest 0 -->
  <g font-size="13" fill="var(--dg-ink, #202124)" text-anchor="middle">
    <text x="150" y="130">1</text><text x="240" y="130">1</text><text x="330" y="130">1</text><text x="420" y="130">1</text>
    <text x="150" y="210">1</text><text x="240" y="210">1</text><text x="330" y="210">1</text><text x="420" y="210">1</text>
    <text x="150" y="290">0</text><text x="240" y="290">0</text><text x="330" y="290">1</text><text x="420" y="290">1</text>
    <text x="150" y="370">0</text><text x="240" y="370">0</text><text x="330" y="370">1</text><text x="420" y="370">1</text>
  </g>

  <!-- 8-cell group: top two rows -->
  <rect x="110" y="90" width="350" height="150" rx="12" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="3"/>

  <!-- 4-cell group: bottom-right 2x2 -->
  <rect x="290" y="250" width="170" height="150" rx="12" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="3" stroke-dasharray="6 4"/>

  <text x="260" y="415" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Solid group (8 cells) = A'; dashed group (4 cells) = CD</text>
</svg>
