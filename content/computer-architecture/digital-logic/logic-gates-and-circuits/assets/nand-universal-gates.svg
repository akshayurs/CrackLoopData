<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Building NOT, AND, OR from NAND gates only</text>

  <!-- NOT from NAND -->
  <g>
    <text x="115" y="60" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)" font-weight="600">NOT</text>
    <line x1="60" y1="90" x2="90" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
    <line x1="60" y1="110" x2="90" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
    <text x="50" y="94" text-anchor="end" font-size="11" fill="var(--dg-muted, #5F6368)">A</text>
    <rect x="90" y="80" width="60" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="120" y="105" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">NAND</text>
    <line x1="150" y1="100" x2="180" y2="100" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
    <text x="190" y="104" font-size="11" fill="var(--dg-muted, #5F6368)">= NOT A</text>
  </g>

  <!-- AND from NAND+NAND -->
  <g>
    <text x="380" y="60" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)" font-weight="600">AND</text>
    <line x1="300" y1="82" x2="330" y2="82" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
    <line x1="300" y1="108" x2="330" y2="108" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
    <text x="292" y="86" text-anchor="end" font-size="11" fill="var(--dg-muted, #5F6368)">A</text>
    <text x="292" y="112" text-anchor="end" font-size="11" fill="var(--dg-muted, #5F6368)">B</text>
    <rect x="330" y="75" width="55" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="357" y="99" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">NAND</text>
    <line x1="385" y1="95" x2="405" y2="95" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
    <line x1="405" y1="82" x2="405" y2="108" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
    <line x1="405" y1="82" x2="420" y2="82" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
    <line x1="405" y1="108" x2="420" y2="108" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
    <rect x="420" y="75" width="55" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="447" y="99" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">NAND</text>
    <line x1="475" y1="95" x2="505" y2="95" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
    <text x="515" y="99" font-size="11" fill="var(--dg-muted, #5F6368)">= A AND B</text>
  </g>

  <!-- OR from De Morgan -->
  <g>
    <text x="380" y="160" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)" font-weight="600">OR</text>
    <line x1="300" y1="182" x2="315" y2="182" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
    <line x1="300" y1="208" x2="315" y2="208" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
    <text x="292" y="186" text-anchor="end" font-size="11" fill="var(--dg-muted, #5F6368)">A</text>
    <text x="292" y="212" text-anchor="end" font-size="11" fill="var(--dg-muted, #5F6368)">B</text>
    <rect x="315" y="175" width="45" height="18" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
    <text x="337" y="188" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">invert</text>
    <rect x="315" y="199" width="45" height="18" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
    <text x="337" y="212" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">invert</text>
    <line x1="360" y1="184" x2="385" y2="184" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
    <line x1="360" y1="208" x2="385" y2="208" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
    <rect x="385" y="177" width="55" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="412" y="201" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">NAND</text>
    <line x1="440" y1="197" x2="470" y2="197" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
    <text x="480" y="201" font-size="11" fill="var(--dg-muted, #5F6368)">= A OR B</text>
  </g>

  <text x="360" y="248" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Every gate here is built from copies of a single NAND gate.</text>
</svg>
