<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="310" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Two AND gates feeding an OR gate</text>

  <!-- inputs -->
  <text x="40" y="64" font-size="12" fill="var(--dg-ink, #202124)">A=1</text>
  <text x="40" y="104" font-size="12" fill="var(--dg-ink, #202124)">B=1</text>
  <text x="40" y="144" font-size="12" fill="var(--dg-ink, #202124)">B=1</text>
  <text x="40" y="184" font-size="12" fill="var(--dg-ink, #202124)">C=0</text>

  <line x1="70" y1="60" x2="130" y2="60" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="70" y1="60" x2="70" y2="80" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="70" y1="80" x2="130" y2="80" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="70" y1="140" x2="130" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="70" y1="180" x2="130" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>

  <!-- top AND -->
  <rect x="130" y="55" width="90" height="45" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="175" y="82" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">AND</text>

  <!-- bottom AND -->
  <rect x="130" y="155" width="90" height="45" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="175" y="182" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">AND</text>

  <line x1="220" y1="77" x2="280" y2="77" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="250" y="70" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">= 1</text>

  <line x1="220" y1="177" x2="280" y2="177" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="250" y="170" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">= 0</text>

  <line x1="280" y1="77" x2="280" y2="115" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <line x1="280" y1="177" x2="280" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>

  <!-- OR gate -->
  <rect x="300" y="105" width="100" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="350" y="134" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">OR</text>

  <line x1="400" y1="130" x2="460" y2="130" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="500" y="126" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">output = 1</text>

  <text x="310" y="234" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">AND(A,B)=1, AND(B,C)=0, OR(1,0)=1</text>
</svg>
