<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Moore FSM: detecting the sequence 1101</text>

  <!-- states S0..S4 -->
  <circle cx="80" cy="150" r="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="155" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">S0</text>

  <circle cx="220" cy="150" r="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="220" y="155" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">S1</text>

  <circle cx="360" cy="150" r="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="360" y="155" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">S2</text>

  <circle cx="500" cy="150" r="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="155" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">S3</text>

  <circle cx="640" cy="150" r="36" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>
  <text x="640" y="155" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">S4</text>

  <!-- forward transitions -->
  <line x1="114" y1="150" x2="186" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="140" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">1</text>

  <line x1="254" y1="150" x2="326" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="290" y="140" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">1</text>

  <line x1="394" y1="150" x2="466" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="140" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">0</text>

  <line x1="534" y1="150" x2="604" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <text x="570" y="140" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">1</text>

  <!-- S2 self loop on 1 -->
  <path d="M348,120 C330,90 390,90 372,120" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="82" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">1</text>

  <!-- reset-to-S0 arcs on 0 -->
  <path d="M220,184 C220,240 80,240 80,184" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="150" y="255" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">0 (S1-&gt;S0)</text>

  <path d="M500,184 C500,270 80,270 80,184" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="290" y="288" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">0 (S3-&gt;S0)</text>

  <!-- S4 overlap arcs -->
  <path d="M640,184 C640,290 220,220 220,184" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowAccent)"/>
  <text x="500" y="235" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">1 (S4-&gt;S1, overlap)</text>

  <path d="M628,116 C560,40 120,40 82,116" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="360" y="35" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">0 (S4-&gt;S0)</text>

  <!-- S0 self loop -->
  <path d="M62,120 C40,90 100,90 98,120" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="80" y="82" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">0</text>

  <text x="360" y="310" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">S4 (teal) is the Moore output state -- reached only after the full sequence 1101 is seen.</text>
</svg>
