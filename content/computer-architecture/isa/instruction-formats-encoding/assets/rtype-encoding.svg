<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">32-bit R-type instruction word</text>

  <rect x="20" y="60" width="100" height="50" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="70" y="82" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">opcode</text>
  <text x="70" y="98" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">6 bits</text>

  <rect x="120" y="60" width="90" height="50" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="165" y="82" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">rs</text>
  <text x="165" y="98" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">5 bits</text>

  <rect x="210" y="60" width="90" height="50" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="255" y="82" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">rt</text>
  <text x="255" y="98" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">5 bits</text>

  <rect x="300" y="60" width="90" height="50" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="345" y="82" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">rd</text>
  <text x="345" y="98" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">5 bits</text>

  <rect x="390" y="60" width="90" height="50" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="435" y="82" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">shamt</text>
  <text x="435" y="98" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">5 bits</text>

  <rect x="480" y="60" width="110" height="50" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="535" y="82" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">funct</text>
  <text x="535" y="98" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">6 bits</text>

  <text x="20" y="145" font-size="12" fill="var(--dg-muted, #5F6368)">31</text>
  <text x="590" y="145" font-size="12" fill="var(--dg-muted, #5F6368)">0</text>

  <text x="340" y="190" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">opcode + funct together select the exact operation (e.g. ADD)</text>
  <text x="340" y="212" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">rs, rt = source registers &#183; rd = destination register</text>
</svg>
