<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">One CISC instruction to several micro-ops</text>

  <rect x="200" y="48" width="240" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="76" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">add [mem], reg</text>

  <line x1="320" y1="94" x2="320" y2="122" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="112" font-size="11" fill="var(--dg-muted, #5F6368)">decoder</text>

  <rect x="140" y="122" width="360" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="148" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">x86 front-end decoder</text>

  <line x1="240" y1="164" x2="150" y2="200" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <line x1="320" y1="164" x2="320" y2="200" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <line x1="400" y1="164" x2="490" y2="200" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>

  <rect x="70" y="200" width="160" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="150" y="225" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">uop: load mem-&gt;t1</text>

  <rect x="240" y="200" width="160" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="225" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">uop: add t1, reg</text>

  <rect x="410" y="200" width="160" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="490" y="225" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">uop: store reg-&gt;mem</text>

  <text x="320" y="280" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Everything past the decoder schedules and executes RISC-like micro-ops</text>
</svg>
