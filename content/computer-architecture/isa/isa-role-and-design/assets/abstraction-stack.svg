<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Abstraction stack: language to gates</text>

  <rect x="180" y="46" width="280" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="72" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">High-level language (C)</text>

  <line x1="320" y1="88" x2="320" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="110" width="280" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="136" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Compiler / Assembler</text>

  <line x1="320" y1="152" x2="320" y2="174" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="140" y="174" width="360" height="52" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="320" y="196" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="700">ISA — instructions, registers, memory model</text>
  <text x="320" y="215" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">hardware / software boundary</text>

  <line x1="320" y1="226" x2="320" y2="248" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="248" width="280" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="274" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Microarchitecture</text>

  <line x1="320" y1="290" x2="320" y2="312" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="312" width="280" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="338" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Logic gates / transistors</text>

  <text x="320" y="400" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Software (above the line) never needs to know what's below it</text>
</svg>
