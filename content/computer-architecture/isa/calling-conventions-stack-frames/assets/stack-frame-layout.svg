<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">A function's stack frame</text>

  <text x="160" y="52" font-size="11" fill="var(--dg-muted, #5F6368)">higher addresses</text>

  <rect x="160" y="62" width="240" height="42" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="280" y="88" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Caller's arguments (extras)</text>

  <rect x="160" y="104" width="240" height="42" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="280" y="130" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Saved return address</text>

  <rect x="160" y="146" width="240" height="42" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="280" y="172" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Saved caller's frame pointer</text>

  <rect x="160" y="188" width="240" height="42" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="280" y="214" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Saved callee-saved registers</text>

  <rect x="160" y="230" width="240" height="60" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="280" y="256" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Local variables</text>
  <text x="280" y="274" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">(local arrays live here)</text>

  <text x="160" y="312" font-size="11" fill="var(--dg-muted, #5F6368)">lower addresses</text>

  <line x1="440" y1="65" x2="440" y2="285" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="450" y="180" font-size="11" fill="var(--dg-muted, #5F6368)">stack grows down</text>

  <text x="280" y="345" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A buffer overflow in locals can reach up and overwrite the return address</text>
</svg>
