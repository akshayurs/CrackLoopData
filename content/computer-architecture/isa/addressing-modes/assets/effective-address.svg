<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Effective address = base + index &#215; scale + displacement</text>

  <rect x="20" y="60" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="88" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">base reg</text>

  <text x="165" y="90" text-anchor="middle" font-size="18" fill="var(--dg-muted, #5F6368)">+</text>

  <rect x="185" y="60" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="82" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">index reg</text>
  <text x="250" y="98" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">&#215; scale</text>

  <text x="330" y="90" text-anchor="middle" font-size="18" fill="var(--dg-muted, #5F6368)">+</text>

  <rect x="350" y="60" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="415" y="88" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">displacement</text>

  <line x1="250" y1="106" x2="250" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="130" y="150" width="240" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="250" y="180" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Effective address</text>

  <line x1="250" y1="200" x2="250" y2="230" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="150" y="230" width="200" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="258" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Memory access</text>

  <text x="530" y="90" font-size="12" fill="var(--dg-muted, #5F6368)">e.g. arr[i].field:</text>
  <text x="530" y="110" font-size="11" fill="var(--dg-muted, #5F6368)">base = arr start</text>
  <text x="530" y="128" font-size="11" fill="var(--dg-muted, #5F6368)">index = i, scale = sizeof(elem)</text>
  <text x="530" y="146" font-size="11" fill="var(--dg-muted, #5F6368)">displacement = field offset</text>
</svg>
