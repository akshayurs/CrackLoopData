<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Register file: 2 read ports, 1 write port</text>

  <rect x="220" y="90" width="200" height="130" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="120" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Register file</text>
  <text x="320" y="140" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">r0 .. r31</text>

  <line x1="60" y1="115" x2="215" y2="115" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="65" y="108" font-size="11" fill="var(--dg-muted, #5F6368)">read addr A (rs1)</text>

  <line x1="60" y1="150" x2="215" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="65" y="143" font-size="11" fill="var(--dg-muted, #5F6368)">read addr B (rs2)</text>

  <line x1="420" y1="115" x2="560" y2="115" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="108" font-size="11" fill="var(--dg-muted, #5F6368)">data A -&gt; ALU</text>

  <line x1="420" y1="150" x2="560" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="143" font-size="11" fill="var(--dg-muted, #5F6368)">data B -&gt; ALU</text>

  <line x1="560" y1="195" x2="420" y2="195" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="430" y="188" font-size="11" fill="var(--dg-muted, #5F6368)">write data (from ALU/mem)</text>

  <line x1="60" y1="200" x2="215" y2="200" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="65" y="242" font-size="11" fill="var(--dg-muted, #5F6368)">write addr (rd)</text>

  <text x="320" y="265" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Matches one add rd, rs1, rs2 per cycle</text>
</svg>
