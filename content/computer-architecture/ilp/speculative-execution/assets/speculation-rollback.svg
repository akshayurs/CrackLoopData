<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="30" width="90" height="150" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="65" y="20" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">ROB (older, committed)</text>
  <text x="65" y="60" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">I1</text>
  <text x="65" y="85" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">I2</text>
  <text x="65" y="110" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Branch</text>

  <rect x="130" y="30" width="130" height="150" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3"/>
  <text x="195" y="20" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Speculative (discarded)</text>
  <text x="195" y="60" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">I3 (wrong path)</text>
  <text x="195" y="85" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">I4 (wrong path)</text>

  <line x1="150" y1="150" x2="230" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="230" y1="150" x2="150" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="195" y="170" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">flush + squash</text>

  <line x1="115" y1="105" x2="128" y2="105" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="330" y="60" width="150" height="80" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="405" y="45" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Register-map checkpoint</text>
  <text x="405" y="105" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">restored on misprediction</text>

  <line x1="480" y1="100" x2="560" y2="100" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="90" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">correct</text>
  <text x="600" y="105" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">path</text>

  <text x="20" y="205" font-size="11" fill="var(--dg-muted, #5F6368)">Wrong-path instructions are discarded before ever touching architectural state.</text>
</svg>
