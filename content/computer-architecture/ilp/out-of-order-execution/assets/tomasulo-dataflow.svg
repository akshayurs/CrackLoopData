<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="80" y="45" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Reservation Sta. 1</text>

  <rect x="20" y="110" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="80" y="135" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Reservation Sta. 2</text>

  <rect x="20" y="200" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="80" y="225" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Reservation Sta. 3</text>

  <rect x="220" y="65" width="90" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="265" y="90" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Func. Unit A</text>

  <rect x="220" y="155" width="90" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="265" y="180" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Func. Unit B</text>

  <line x1="140" y1="40" x2="220" y2="80" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="130" x2="220" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="130" x2="220" y2="175" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="220" x2="220" y2="185" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="380" y="0" width="30" height="280" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="395" y="140" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" transform="rotate(-90 395 140)">Common Data Bus (CDB)</text>

  <line x1="310" y1="85" x2="380" y2="85" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="310" y1="175" x2="380" y2="175" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="410" y1="60" x2="500" y2="30" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="140" x2="500" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="220" x2="500" y2="210" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="500" y="10" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="560" y="35" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Register status</text>

  <rect x="500" y="100" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="560" y="125" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Waiting stations</text>

  <rect x="500" y="190" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="560" y="215" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Reorder buffer</text>

  <text x="20" y="270" font-size="11" fill="var(--dg-muted, #5F6368)">A result on the CDB updates every listener in the same cycle.</text>
</svg>
