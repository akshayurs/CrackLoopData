<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="220" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="130" y="45" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">ADD R1, R2, R3</text>

  <rect x="20" y="160" width="220" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="130" y="185" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">MUL R1, R4, R5</text>

  <text x="130" y="90" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">same architectural name: R1</text>

  <line x1="240" y1="40" x2="380" y2="40" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="180" x2="380" y2="180" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="380" y="20" width="130" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="445" y="45" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Physical P7</text>

  <rect x="380" y="160" width="130" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="445" y="185" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Physical P12</text>

  <text x="380" y="10" font-size="12" fill="var(--dg-muted, #5F6368)">Rename table maps R1 →</text>

  <text x="20" y="215" font-size="12" fill="var(--dg-muted, #5F6368)">No collision remains — P7 and P12 are independent physical registers, safe to reorder.</text>
</svg>
