<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <circle cx="90" cy="50" r="28" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="90" y="55" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)">I1</text>

  <circle cx="90" cy="140" r="28" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="90" y="145" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)">I2</text>

  <circle cx="320" cy="50" r="28" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="320" y="55" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)">I3</text>

  <circle cx="90" cy="220" r="28" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="90" y="225" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)">I4</text>

  <line x1="90" y1="78" x2="90" y2="112" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="90" y1="168" x2="90" y2="192" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="150" y="30" font-size="12" fill="var(--dg-muted, #5F6368)">RAW chain: must run in order</text>
  <text x="380" y="30" font-size="12" fill="var(--dg-muted, #5F6368)">no dependence — runs anytime</text>

  <text x="20" y="238" font-size="12" fill="var(--dg-muted, #5F6368)">Critical path = I1 → I2 → I4 (3 steps), even though 4 instructions exist.</text>
</svg>
