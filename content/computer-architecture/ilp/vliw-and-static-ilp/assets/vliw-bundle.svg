<svg viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="20" y="20" width="600" height="80" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="320" y="10" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">One VLIW instruction bundle (issued together, every cycle)</text>

  <line x1="220" y1="20" x2="220" y2="100" stroke="var(--dg-stroke, #9AA0A6)"/>
  <line x1="420" y1="20" x2="420" y2="100" stroke="var(--dg-stroke, #9AA0A6)"/>

  <text x="120" y="55" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">ALU slot</text>
  <text x="120" y="75" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)">ADD R1,R2,R3</text>

  <text x="320" y="55" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Load/Store slot</text>
  <text x="320" y="75" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)">LOAD R4,[R5]</text>

  <text x="520" y="55" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Branch slot</text>
  <text x="520" y="75" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">NOP (unfilled)</text>

  <text x="20" y="135" font-size="12" fill="var(--dg-muted, #5F6368)">All three slots issue in the same cycle — the compiler decided this grouping ahead of time.</text>
  <text x="20" y="155" font-size="12" fill="var(--dg-muted, #5F6368)">The branch slot has no independent work this cycle, so it's a wasted no-op.</text>
</svg>
