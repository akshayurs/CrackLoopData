<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <circle cx="80" cy="110" r="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="80" y="106" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Strongly</text>
  <text x="80" y="120" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Not-taken</text>

  <circle cx="240" cy="110" r="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="240" y="106" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Weakly</text>
  <text x="240" y="120" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Not-taken</text>

  <circle cx="400" cy="110" r="40" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="400" y="106" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Weakly</text>
  <text x="400" y="120" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Taken</text>

  <circle cx="560" cy="110" r="40" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="560" y="106" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Strongly</text>
  <text x="560" y="120" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Taken</text>

  <path d="M120,95 L200,95" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="160" y="85" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">taken</text>
  <path d="M200,125 L120,125" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="160" y="145" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">not-taken</text>

  <path d="M280,95 L360,95" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="85" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">taken</text>
  <path d="M360,125 L280,125" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="145" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">not-taken</text>

  <path d="M440,95 L520,95" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="85" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">taken</text>
  <path d="M520,125 L440,125" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="145" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">not-taken</text>

  <text x="20" y="200" font-size="12" fill="var(--dg-muted, #5F6368)">Prediction only flips (crossing the middle boundary) after two consecutive opposite outcomes.</text>
</svg>
