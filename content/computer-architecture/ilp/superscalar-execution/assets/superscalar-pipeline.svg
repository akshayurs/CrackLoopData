<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="10" y="25" font-size="13" fill="var(--dg-muted, #5F6368)">Instruction slot A</text>
  <rect x="10" y="35" width="90" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="55" y="58" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Fetch A</text>
  <rect x="150" y="35" width="90" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="195" y="58" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Decode A</text>
  <rect x="290" y="35" width="90" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="335" y="58" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">ALU 1</text>

  <text x="10" y="115" font-size="13" fill="var(--dg-muted, #5F6368)">Instruction slot B</text>
  <rect x="10" y="125" width="90" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="55" y="148" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Fetch B</text>
  <rect x="150" y="125" width="90" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="195" y="148" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Decode B</text>
  <rect x="290" y="125" width="90" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="335" y="148" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">ALU 2</text>

  <line x1="100" y1="53" x2="150" y2="53" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="53" x2="290" y2="53" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="100" y1="143" x2="150" y2="143" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="143" x2="290" y2="143" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="410" y="80" width="200" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="510" y="105" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">2 instructions/cycle</text>

  <text x="10" y="195" font-size="12" fill="var(--dg-muted, #5F6368)">Two independent instructions move through duplicated stages in the same cycle.</text>
</svg>
