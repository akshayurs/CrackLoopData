<svg viewBox="0 0 500 460" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <rect x="150" y="20" width="200" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="250" y="42" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Program Counter</text>
  <text x="250" y="60" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">holds next address</text>

  <line x1="250" y1="70" x2="250" y2="112" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="150" y="112" width="200" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="142" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Fetch</text>

  <line x1="250" y1="162" x2="250" y2="204" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="150" y="204" width="200" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="234" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Decode</text>

  <line x1="250" y1="254" x2="250" y2="296" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="150" y="296" width="200" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="326" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Execute (+ mem, write-back)</text>

  <path d="M 150 321 C 60 321, 60 45, 148 45" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="30" y="185" font-size="11" fill="var(--dg-muted, #5F6368)" transform="rotate(-90 30 185)">updates PC</text>

  <text x="250" y="400" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Default: PC advances. Taken branch: PC jumps to a new target.</text>
</svg>
