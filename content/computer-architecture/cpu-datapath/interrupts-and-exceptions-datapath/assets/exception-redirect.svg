<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Exception: save state, redirect PC to handler</text>

  <rect x="30" y="70" width="160" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="98" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Instruction N (faults)</text>

  <line x1="190" y1="93" x2="240" y2="93" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="70" width="150" height="46" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="315" y="90" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Save return state</text>
  <text x="315" y="106" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">faulting PC, cause</text>

  <line x1="390" y1="93" x2="440" y2="93" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="440" y="70" width="160" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="520" y="98" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Handler executes</text>

  <line x1="600" y1="93" x2="600" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="600" y1="180" x2="60" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="330" y="198" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">handler resolves issue, restores saved PC, resumes</text>

  <rect x="30" y="210" width="160" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="235" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Resume at instr. N</text>

  <text x="320" y="278" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Precise exceptions guarantee a clean boundary to resume from</text>
</svg>
