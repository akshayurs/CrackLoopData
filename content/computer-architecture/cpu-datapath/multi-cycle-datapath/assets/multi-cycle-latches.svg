<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Multi-cycle datapath with internal latches</text>

  <rect x="20" y="120" width="80" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="147" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Memory</text>

  <line x1="100" y1="143" x2="130" y2="143" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="130" y="120" width="60" height="46" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="160" y="147" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">IR</text>

  <line x1="190" y1="143" x2="220" y2="143" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="220" y="90" width="80" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="260" y="117" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Reg file</text>

  <line x1="300" y1="113" x2="330" y2="113" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="330" y="90" width="50" height="46" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="355" y="117" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">A</text>

  <line x1="380" y1="113" x2="410" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="410" y="150" width="70" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="445" y="177" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">ALU</text>

  <line x1="480" y1="173" x2="510" y2="173" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="510" y="150" width="70" height="46" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="545" y="177" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">ALUOut</text>

  <line x1="545" y1="196" x2="545" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="545" y1="220" x2="60" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="238" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">ALUOut feeds back into memory as address next cycle</text>

  <rect x="580" y="150" width="70" height="46" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="615" y="177" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">MDR</text>

  <text x="350" y="275" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Shaded boxes (IR, A, ALUOut, MDR) are internal latches, absent in single-cycle design</text>
</svg>
