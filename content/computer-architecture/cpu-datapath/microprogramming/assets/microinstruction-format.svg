<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Microinstruction format</text>

  <rect x="40" y="60" width="360" height="60" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="220" y="86" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Control-signal bits</text>
  <text x="220" y="104" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">RegWrite, MemRead, ALUOp, ...</text>

  <rect x="400" y="60" width="200" height="60" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="86" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Next-address field</text>
  <text x="500" y="104" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">where to fetch next, incl. branches</text>

  <text x="320" y="155" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">One microinstruction executes per clock cycle</text>
  <text x="320" y="178" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Next-address field can branch on condition bits (e.g. is this a load?)</text>
  <text x="320" y="200" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">giving microcode real control flow, not just a flat sequence</text>
</svg>
