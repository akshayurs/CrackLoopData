<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Single-cycle datapath</text>

  <rect x="20" y="130" width="90" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="65" y="160" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">PC</text>

  <line x1="110" y1="155" x2="140" y2="155" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="140" y="130" width="110" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="195" y="160" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Instr. memory</text>

  <line x1="250" y1="155" x2="280" y2="155" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="280" y="110" width="110" height="90" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="335" y="160" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Register file</text>

  <line x1="390" y1="140" x2="420" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="170" x2="420" y2="170" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="420" y="110" width="30" height="70" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="435" y="149" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">MUX</text>

  <line x1="450" y1="145" x2="480" y2="145" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="480" y="120" width="90" height="60" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="525" y="154" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">ALU</text>

  <line x1="570" y1="150" x2="600" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="600" y="120" width="100" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="650" y="146" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Data memory</text>
  <text x="650" y="162" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">(load/store only)</text>

  <path d="M 650 180 C 650 260, 335 260, 335 200" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="255" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">write-back (mem data or ALU result)</text>

  <text x="360" y="300" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Every instruction flows through every block once, each clock cycle</text>
</svg>
