<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">A simple ALU: parallel ops, mux selects output</text>

  <rect x="20" y="60" width="60" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="50" y="82" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">A</text>
  <rect x="20" y="230" width="60" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="50" y="252" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">B</text>

  <line x1="80" y1="77" x2="180" y2="77" stroke="var(--dg-line, #5F6368)" stroke-width="1.2"/>
  <line x1="80" y1="247" x2="180" y2="247" stroke="var(--dg-line, #5F6368)" stroke-width="1.2"/>

  <rect x="180" y="55" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="80" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Adder</text>

  <rect x="180" y="105" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="130" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">AND gate</text>

  <rect x="180" y="155" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="180" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">OR gate</text>

  <rect x="180" y="205" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="230" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Subtractor</text>

  <line x1="300" y1="75" x2="370" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.2"/>
  <line x1="300" y1="125" x2="370" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.2"/>
  <line x1="300" y1="175" x2="370" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="1.2"/>
  <line x1="300" y1="225" x2="370" y2="170" stroke="var(--dg-line, #5F6368)" stroke-width="1.2"/>

  <rect x="370" y="120" width="40" height="80" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="390" y="164" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">MUX</text>

  <line x1="390" y1="90" x2="390" y2="118" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="105" font-size="10" fill="var(--dg-muted, #5F6368)">func select</text>

  <line x1="410" y1="160" x2="470" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="470" y="140" width="90" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="515" y="165" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Result</text>

  <text x="320" y="278" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">All ops compute in parallel; function-select just picks which one is output</text>
</svg>
