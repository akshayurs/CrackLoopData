<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">UTF-8 byte-length encoding rule</text>

  <!-- 1 byte -->
  <rect x="40" y="50" width="90" height="40" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="85" y="75" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">0xxxxxxx</text>
  <text x="170" y="75" font-size="13" fill="var(--dg-muted, #5F6368)">1 byte -- ASCII (0-127)</text>

  <!-- 2 byte -->
  <rect x="40" y="105" width="90" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="130" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">110xxxxx</text>
  <rect x="140" y="105" width="90" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="185" y="130" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">10xxxxxx</text>
  <text x="270" y="130" font-size="13" fill="var(--dg-muted, #5F6368)">2 bytes -- e.g. Latin accents</text>

  <!-- 3 byte -->
  <rect x="40" y="160" width="90" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="185" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">1110xxxx</text>
  <rect x="140" y="160" width="90" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="185" y="185" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">10xxxxxx</text>
  <rect x="240" y="160" width="90" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="285" y="185" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">10xxxxxx</text>
  <text x="370" y="185" font-size="13" fill="var(--dg-muted, #5F6368)">3 bytes -- e.g. most CJK</text>

  <!-- 4 byte -->
  <rect x="40" y="215" width="90" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="240" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">11110xxx</text>
  <rect x="140" y="215" width="90" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="185" y="240" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">10xxxxxx</text>
  <rect x="240" y="215" width="90" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="285" y="240" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">10xxxxxx</text>
  <rect x="340" y="215" width="90" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="385" y="240" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">10xxxxxx</text>
  <text x="470" y="240" font-size="13" fill="var(--dg-muted, #5F6368)">4 bytes -- e.g. emoji</text>

  <text x="360" y="280" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Leading byte's high bits encode length; every continuation byte starts 10xxxxxx.</text>
</svg>
