<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Q8.8 bit layout (16-bit fixed-point)</text>

  <!-- sign bit -->
  <rect x="60" y="60" width="40" height="50" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="90" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">S</text>

  <!-- integer bits (7) -->
  <rect x="100" y="60" width="245" height="50" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="222" y="90" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">integer (7 bits)</text>

  <!-- implicit point marker -->
  <line x1="345" y1="50" x2="345" y2="120" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="345" y="140" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">implicit point</text>

  <!-- fraction bits (8) -->
  <rect x="345" y="60" width="280" height="50" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="485" y="90" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">fraction (8 bits)</text>

  <line x1="80" y1="115" x2="80" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="80" y="178" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">sign</text>

  <text x="360" y="200" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">No bit stores the point itself -- position 8 is a convention the code must track.</text>
</svg>
