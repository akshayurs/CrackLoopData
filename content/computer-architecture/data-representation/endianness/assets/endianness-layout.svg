<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">0x12345678 stored little-endian vs big-endian</text>

  <text x="120" y="60" font-size="13" fill="var(--dg-muted, #5F6368)" font-weight="600">Little-endian (address increases -&gt;)</text>
  <g>
    <rect x="60" y="70" width="90" height="46" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="105" y="98" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">78</text>
    <rect x="150" y="70" width="90" height="46" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="195" y="98" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">56</text>
    <rect x="240" y="70" width="90" height="46" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="285" y="98" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">34</text>
    <rect x="330" y="70" width="90" height="46" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="375" y="98" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">12</text>
    <text x="105" y="132" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">addr 0 (LSB)</text>
    <text x="375" y="132" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">addr 3 (MSB)</text>
  </g>

  <text x="120" y="170" font-size="13" fill="var(--dg-muted, #5F6368)" font-weight="600">Big-endian (address increases -&gt;)</text>
  <g>
    <rect x="60" y="180" width="90" height="46" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="105" y="208" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">12</text>
    <rect x="150" y="180" width="90" height="46" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="195" y="208" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">34</text>
    <rect x="240" y="180" width="90" height="46" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="285" y="208" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">56</text>
    <rect x="330" y="180" width="90" height="46" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="375" y="208" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">78</text>
  </g>

  <text x="500" y="150" font-size="12" fill="var(--dg-muted, #5F6368)">Same value, opposite byte order --</text>
  <text x="500" y="168" font-size="12" fill="var(--dg-muted, #5F6368)">reading one as the other gives</text>
  <text x="500" y="186" font-size="12" fill="var(--dg-muted, #5F6368)">a different, wrong number.</text>
</svg>
