<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">32-bit float: 0 10000001 01000000000000000000000</text>

  <!-- sign -->
  <rect x="40" y="55" width="40" height="46" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="83" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">0</text>

  <!-- exponent -->
  <rect x="80" y="55" width="220" height="46" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="190" y="83" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">10000001</text>

  <!-- mantissa -->
  <rect x="300" y="55" width="380" height="46" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="83" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">01000000000000000000000</text>

  <line x1="60" y1="101" x2="60" y2="130" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="60" y="148" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">sign = +</text>

  <line x1="190" y1="101" x2="190" y2="130" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="190" y="148" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">129 - 127 = 2</text>

  <line x1="490" y1="101" x2="490" y2="130" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="148" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">1.01b = 1.25</text>

  <rect x="220" y="180" width="280" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="360" y="208" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">1.25 x 2^2 = 5.0</text>
</svg>
