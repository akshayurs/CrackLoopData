<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Grouping bits into nibbles -&gt; hex digits</text>

  <text x="360" y="60" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)">One byte: 10101100</text>

  <!-- Nibble 1 -->
  <rect x="120" y="80" width="200" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="220" y="111" text-anchor="middle" font-size="18" fill="var(--dg-ink, #202124)" font-weight="600">1010</text>

  <!-- Nibble 2 -->
  <rect x="400" y="80" width="200" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="500" y="111" text-anchor="middle" font-size="18" fill="var(--dg-ink, #202124)" font-weight="600">1100</text>

  <line x1="220" y1="130" x2="220" y2="168" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="130" x2="500" y2="168" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Hex digits -->
  <rect x="170" y="172" width="100" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="220" y="203" text-anchor="middle" font-size="18" fill="var(--dg-ink, #202124)" font-weight="600">A</text>

  <rect x="450" y="172" width="100" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="203" text-anchor="middle" font-size="18" fill="var(--dg-ink, #202124)" font-weight="600">C</text>

  <text x="360" y="248" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)">10101100 -&gt; nibbles 1010 | 1100 -&gt; hex 0xAC (one byte, two hex digits)</text>
</svg>
