<svg viewBox="0 0 460 460" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="230" y="28" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">4-bit two's-complement value wheel</text>

  <circle cx="230" cy="235" r="170" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <!-- 16 positions: bit pattern (i) -> signed value -->
  <!-- values: 0..7 positive, 8..15 => -8..-1 -->

  <g font-size="12">
    <!-- generate 16 ticks manually -->
    <!-- position 0 = 0000 (0) at top, clockwise -->
    <g transform="translate(230,235)">
      <!-- 0 -->
      <circle cx="0" cy="-170" r="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
      <text x="0" y="-166" text-anchor="middle" fill="var(--dg-ink, #202124)">0000</text>
      <text x="0" y="-198" text-anchor="middle" fill="var(--dg-muted, #5F6368)">0</text>

      <!-- 1 -->
      <circle cx="66" cy="-158" r="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
      <text x="66" y="-154" text-anchor="middle" fill="var(--dg-ink, #202124)">0001</text>
      <text x="90" y="-178" text-anchor="middle" fill="var(--dg-muted, #5F6368)">1</text>

      <!-- 2 -->
      <circle cx="120" cy="-120" r="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
      <text x="120" y="-116" text-anchor="middle" fill="var(--dg-ink, #202124)">0010</text>
      <text x="148" y="-140" text-anchor="middle" fill="var(--dg-muted, #5F6368)">2</text>

      <!-- 3 -->
      <circle cx="158" cy="-66" r="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
      <text x="158" y="-62" text-anchor="middle" fill="var(--dg-ink, #202124)">0011</text>
      <text x="188" y="-80" text-anchor="middle" fill="var(--dg-muted, #5F6368)">3</text>

      <!-- 4 -->
      <circle cx="170" cy="0" r="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
      <text x="170" y="4" text-anchor="middle" fill="var(--dg-ink, #202124)">0100</text>
      <text x="202" y="0" text-anchor="middle" fill="var(--dg-muted, #5F6368)">4</text>

      <!-- 5 -->
      <circle cx="158" cy="66" r="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
      <text x="158" y="70" text-anchor="middle" fill="var(--dg-ink, #202124)">0101</text>
      <text x="188" y="86" text-anchor="middle" fill="var(--dg-muted, #5F6368)">5</text>

      <!-- 6 -->
      <circle cx="120" cy="120" r="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
      <text x="120" y="124" text-anchor="middle" fill="var(--dg-ink, #202124)">0110</text>
      <text x="148" y="145" text-anchor="middle" fill="var(--dg-muted, #5F6368)">6</text>

      <!-- 7 -->
      <circle cx="66" cy="158" r="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
      <text x="66" y="162" text-anchor="middle" fill="var(--dg-ink, #202124)">0111</text>
      <text x="90" y="183" text-anchor="middle" fill="var(--dg-muted, #5F6368)">7</text>

      <!-- -8 = 1000 (wrap point, highlighted) -->
      <circle cx="0" cy="170" r="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-line, #5F6368)" stroke-width="2"/>
      <text x="0" y="166" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">1000</text>
      <text x="0" y="200" text-anchor="middle" fill="var(--dg-muted, #5F6368)">-8</text>

      <!-- -7 = 1001 -->
      <circle cx="-66" cy="158" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
      <text x="-66" y="162" text-anchor="middle" fill="var(--dg-ink, #202124)">1001</text>
      <text x="-90" y="183" text-anchor="middle" fill="var(--dg-muted, #5F6368)">-7</text>

      <!-- -6 = 1010 -->
      <circle cx="-120" cy="120" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
      <text x="-120" y="124" text-anchor="middle" fill="var(--dg-ink, #202124)">1010</text>
      <text x="-148" y="145" text-anchor="middle" fill="var(--dg-muted, #5F6368)">-6</text>

      <!-- -5 = 1011 -->
      <circle cx="-158" cy="66" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
      <text x="-158" y="70" text-anchor="middle" fill="var(--dg-ink, #202124)">1011</text>
      <text x="-188" y="86" text-anchor="middle" fill="var(--dg-muted, #5F6368)">-5</text>

      <!-- -4 = 1100 -->
      <circle cx="-170" cy="0" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
      <text x="-170" y="4" text-anchor="middle" fill="var(--dg-ink, #202124)">1100</text>
      <text x="-202" y="0" text-anchor="middle" fill="var(--dg-muted, #5F6368)">-4</text>

      <!-- -3 = 1101 -->
      <circle cx="-158" cy="-66" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
      <text x="-158" y="-62" text-anchor="middle" fill="var(--dg-ink, #202124)">1101</text>
      <text x="-188" y="-80" text-anchor="middle" fill="var(--dg-muted, #5F6368)">-3</text>

      <!-- -2 = 1110 -->
      <circle cx="-120" cy="-120" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
      <text x="-120" y="-116" text-anchor="middle" fill="var(--dg-ink, #202124)">1110</text>
      <text x="-148" y="-140" text-anchor="middle" fill="var(--dg-muted, #5F6368)">-2</text>

      <!-- -1 = 1111 -->
      <circle cx="-66" cy="-158" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
      <text x="-66" y="-154" text-anchor="middle" fill="var(--dg-ink, #202124)">1111</text>
      <text x="-90" y="-178" text-anchor="middle" fill="var(--dg-muted, #5F6368)">-1</text>
    </g>
  </g>

  <text x="230" y="440" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Teal = non-negative (0..7); grey = negative (-8..-1). Crossing 0111 -&gt; 1000 wraps 7 to -8.</text>
</svg>
