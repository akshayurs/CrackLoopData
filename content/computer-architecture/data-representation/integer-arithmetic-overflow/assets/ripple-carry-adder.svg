<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">4-bit ripple-carry adder</text>

  <!-- 4 full adder boxes -->
  <g>
    <rect x="60" y="70" width="120" height="70" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="120" y="100" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">FA0</text>
    <text x="120" y="118" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">bit 0 (LSB)</text>
  </g>
  <g>
    <rect x="220" y="70" width="120" height="70" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="280" y="100" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">FA1</text>
    <text x="280" y="118" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">bit 1</text>
  </g>
  <g>
    <rect x="380" y="70" width="120" height="70" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="440" y="100" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">FA2</text>
    <text x="440" y="118" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">bit 2</text>
  </g>
  <g>
    <rect x="540" y="70" width="120" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="600" y="100" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">FA3</text>
    <text x="600" y="118" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">bit 3 (sign)</text>
  </g>

  <!-- carry chain -->
  <line x1="180" y1="105" x2="220" y2="105" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="96" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">c1</text>
  <line x1="340" y1="105" x2="380" y2="105" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="96" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">c2</text>
  <line x1="500" y1="105" x2="540" y2="105" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="520" y="96" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">c3 (carry-in to sign bit)</text>

  <!-- carry-out -->
  <line x1="660" y1="105" x2="700" y2="105" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="700" y="90" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">carry-out</text>

  <!-- sum outputs -->
  <line x1="120" y1="140" x2="120" y2="170" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="140" x2="280" y2="170" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="140" x2="440" y2="170" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="140" x2="600" y2="170" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="120" y="188" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">S0</text>
  <text x="280" y="188" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">S1</text>
  <text x="440" y="188" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">S2</text>
  <text x="600" y="188" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">S3 (sign)</text>

  <!-- overflow gate -->
  <rect x="480" y="210" width="180" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="570" y="238" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">overflow = c3 XOR carry-out</text>
  <line x1="520" y1="105" x2="520" y2="210" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowAccent)"/>
  <line x1="680" y1="105" x2="680" y2="210" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowAccent)"/>

  <text x="360" y="284" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Only the sign-bit adder's carry-in vs carry-out feeds the overflow flag.</text>
</svg>
