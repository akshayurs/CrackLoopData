<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Speedup vs processor count, by serial fraction</text>

  <!-- axes -->
  <line x1="60" y1="280" x2="600" y2="280" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="60" y1="280" x2="60" y2="50" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="330" y="310" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Processor count</text>
  <text x="30" y="165" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" transform="rotate(-90 30 165)">Speedup</text>

  <!-- p=0.5 curve, ceiling 2x -->
  <path d="M 60 280 Q 150 180, 260 230 T 600 233" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2"/>
  <line x1="60" y1="233" x2="600" y2="233" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="605" y="237" font-size="11" fill="var(--dg-muted, #5F6368)">p=0.5 -&gt; ceiling 2x</text>

  <!-- p=0.9 curve, ceiling 10x -->
  <path d="M 60 280 Q 140 110, 260 100 T 600 90" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <line x1="60" y1="90" x2="600" y2="90" stroke="var(--dg-accent, #0C8F88)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="605" y="94" font-size="11" fill="var(--dg-accent, #0C8F88)">p=0.9 -&gt; ceiling 10x</text>

  <!-- p=0.99 curve, ceiling 100x, capped at chart edge -->
  <path d="M 60 280 Q 130 70, 260 55 T 600 50" fill="none" stroke="var(--dg-ink, #202124)" stroke-width="2"/>
  <text x="605" y="54" font-size="11" fill="var(--dg-ink, #202124)">p=0.99 -&gt; ceiling 100x (off-chart)</text>

  <text x="320" y="330" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Every curve flattens — the serial fraction sets a hard ceiling, however many processors are added.</text>
</svg>
