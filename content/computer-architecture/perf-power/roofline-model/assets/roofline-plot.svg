<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The roofline model (log-log axes)</text>

  <!-- axes -->
  <line x1="80" y1="300" x2="600" y2="300" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="80" y1="300" x2="80" y2="60" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="340" y="330" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Arithmetic intensity (FLOPs/byte) &#8594;</text>
  <text x="40" y="180" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" transform="rotate(-90 40 180)">Achievable GFLOP/s</text>

  <!-- memory bandwidth slope -->
  <line x1="80" y1="300" x2="260" y2="90" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="150" y="150" font-size="11" fill="var(--dg-accent, #0C8F88)" transform="rotate(-52 150 150)">memory bandwidth ceiling</text>

  <!-- compute ceiling -->
  <line x1="260" y1="90" x2="600" y2="90" stroke="var(--dg-ink, #202124)" stroke-width="2"/>
  <text x="430" y="78" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">peak compute ceiling</text>

  <!-- memory-bound workload point (dot product) -->
  <circle cx="130" cy="235" r="6" fill="#C0605A"/>
  <text x="145" y="232" font-size="11" fill="var(--dg-muted, #5F6368)">dot product (low intensity)</text>
  <line x1="130" y1="235" x2="130" y2="300" stroke="#C0605A" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- compute-bound workload point (dense matmul) -->
  <circle cx="420" cy="90" r="6" fill="#C0605A"/>
  <text x="435" y="105" font-size="11" fill="var(--dg-muted, #5F6368)">dense matmul (high intensity)</text>
  <line x1="420" y1="90" x2="420" y2="300" stroke="#C0605A" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="320" y="352" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Left of the "knee": memory-bound. Right of it, under the flat line: compute-bound.</text>
</svg>
