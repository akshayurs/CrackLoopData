<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Clock speed, power density, and core count over time</text>

  <line x1="70" y1="290" x2="600" y2="290" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="335" y="315" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Time (1990s -&gt; today)</text>

  <!-- clock speed: rises then flattens -->
  <path d="M 70 260 C 200 160, 300 90, 340 80 C 420 65, 500 62, 600 60" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>
  <text x="470" y="48" font-size="11" fill="var(--dg-accent, #0C8F88)">clock speed</text>

  <!-- core count: flat then rises after inflection -->
  <path d="M 70 275 C 200 273, 300 270, 340 265 C 420 220, 500 150, 600 100" fill="none" stroke="var(--dg-ink, #202124)" stroke-width="2.5"/>
  <text x="470" y="120" font-size="11" fill="var(--dg-ink, #202124)">core count</text>

  <!-- power density: rises then would exceed budget without intervention -->
  <path d="M 70 270 C 200 200, 300 130, 340 110 L 360 95" fill="none" stroke="#C0605A" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="240" y="150" font-size="11" fill="#C0605A" transform="rotate(-38 240 150)">power density (unsustainable past this point)</text>

  <line x1="340" y1="60" x2="340" y2="290" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="340" y="45" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">~mid-2000s inflection</text>

  <text x="320" y="332" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Clock speed flattens right where power density would have become unsustainable — core count rises instead.</text>
</svg>
