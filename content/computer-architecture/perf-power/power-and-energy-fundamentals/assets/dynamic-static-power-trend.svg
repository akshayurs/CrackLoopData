<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Dynamic vs static power share, across process nodes</text>

  <!-- 130nm -->
  <text x="110" y="60" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">130nm</text>
  <rect x="60" y="70" width="100" height="140" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <rect x="60" y="196" width="100" height="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="110" y="145" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Dynamic</text>
  <text x="110" y="205" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">static</text>

  <!-- 45nm -->
  <text x="290" y="60" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">45nm</text>
  <rect x="240" y="70" width="100" height="105" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <rect x="240" y="175" width="100" height="35" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="290" y="128" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Dynamic</text>
  <text x="290" y="196" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">static</text>

  <!-- 7nm -->
  <text x="470" y="60" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">7nm</text>
  <rect x="420" y="70" width="100" height="75" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <rect x="420" y="145" width="100" height="65" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="470" y="112" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Dynamic</text>
  <text x="470" y="180" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">static</text>

  <text x="320" y="290" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Illustrative trend: static (leakage) power's share grows sharply at smaller process nodes.</text>
</svg>
