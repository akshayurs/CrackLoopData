<svg viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="340" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">A branch misprediction flush</text>

  <g font-size="12" fill="var(--dg-muted, #5F6368)" text-anchor="middle">
    <text x="140" y="48">C1</text><text x="210" y="48">C2</text><text x="280" y="48">C3</text>
    <text x="350" y="48">C4</text><text x="420" y="48">C5</text><text x="490" y="48">C6</text>
  </g>

  <g font-size="13" fill="var(--dg-ink, #202124)">
    <text x="10" y="82">BR (branch)</text>
    <text x="10" y="122">wrong-path A</text>
    <text x="10" y="162">wrong-path B</text>
    <text x="10" y="202">correct target</text>
  </g>

  <g font-size="11" text-anchor="middle" fill="var(--dg-ink, #202124)">
    <rect x="105" y="64" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="135" y="84">IF</text>
    <rect x="175" y="64" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="205" y="84">ID</text>
    <rect x="245" y="64" width="60" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/><text x="275" y="84">EX resolves</text>

    <!-- wrong path instructions fetched speculatively, flushed at C3 -->
    <rect x="175" y="104" width="60" height="30" fill="none" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4 3"/><text x="205" y="124" fill="#C0392B">IF (X)</text>
    <rect x="245" y="104" width="60" height="30" fill="none" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4 3"/><text x="275" y="124" fill="#C0392B">ID (X)</text>

    <rect x="245" y="144" width="60" height="30" fill="none" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4 3"/><text x="275" y="164" fill="#C0392B">IF (X)</text>

    <!-- correct target refetched at C4 -->
    <rect x="315" y="184" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="345" y="204">IF</text>
  </g>

  <text x="340" y="228" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">branch resolves 'taken' at C3; both wrong-path instructions are flushed, fetch restarts at C4</text>
</svg>
