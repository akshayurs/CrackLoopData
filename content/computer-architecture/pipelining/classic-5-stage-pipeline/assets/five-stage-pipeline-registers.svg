<svg viewBox="0 0 740 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="370" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">5-stage datapath with pipeline registers</text>

  <!-- Stages -->
  <g font-size="13" fill="var(--dg-ink, #202124)" text-anchor="middle" font-weight="600">
    <rect x="20" y="70" width="100" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="70" y="110">IF</text>

    <rect x="180" y="70" width="100" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="230" y="110">ID</text>

    <rect x="340" y="70" width="100" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="390" y="110">EX</text>

    <rect x="500" y="70" width="100" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="550" y="110">MEM</text>

    <rect x="620" y="70" width="100" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="670" y="110">WB</text>
  </g>

  <!-- Pipeline registers (thin bars) -->
  <g fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5">
    <rect x="130" y="65" width="14" height="80"/>
    <rect x="290" y="65" width="14" height="80"/>
    <rect x="450" y="65" width="14" height="80"/>
    <rect x="605" y="65" width="14" height="80"/>
  </g>

  <!-- arrows through stages -->
  <g stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="120" y1="105" x2="128" y2="105"/>
    <line x1="144" y1="105" x2="178" y2="105"/>
    <line x1="280" y1="105" x2="288" y2="105"/>
    <line x1="304" y1="105" x2="338" y2="105"/>
    <line x1="440" y1="105" x2="448" y2="105"/>
    <line x1="464" y1="105" x2="498" y2="105"/>
    <line x1="600" y1="105" x2="603" y2="105"/>
    <line x1="619" y1="105" x2="618" y2="105"/>
  </g>

  <!-- register labels below -->
  <g font-size="10" fill="var(--dg-muted, #5F6368)" text-anchor="middle">
    <text x="137" y="165">IF/ID</text>
    <text x="297" y="165">ID/EX</text>
    <text x="457" y="165">EX/MEM</text>
    <text x="612" y="165">MEM/WB</text>
  </g>

  <text x="370" y="195" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">each register latches data + control signals for exactly one cycle</text>
</svg>
