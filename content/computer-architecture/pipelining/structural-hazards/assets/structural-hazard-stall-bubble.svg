<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A structural-hazard stall: shared memory port</text>

  <g font-size="12" fill="var(--dg-muted, #5F6368)" text-anchor="middle">
    <text x="150" y="48">C1</text><text x="220" y="48">C2</text><text x="290" y="48">C3</text>
    <text x="360" y="48">C4</text><text x="430" y="48">C5</text><text x="500" y="48">C6</text><text x="570" y="48">C7</text>
  </g>

  <g font-size="13" fill="var(--dg-ink, #202124)">
    <text x="15" y="82">I1 (load)</text>
    <text x="15" y="122">I2</text>
    <text x="15" y="162">I3</text>
    <text x="15" y="202">I4</text>
  </g>

  <g font-size="11" text-anchor="middle" fill="var(--dg-ink, #202124)">
    <!-- I1: IF ID EX MEM(uses port) WB -->
    <rect x="115" y="64" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="145" y="84">IF</text>
    <rect x="185" y="64" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="215" y="84">ID</text>
    <rect x="255" y="64" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="285" y="84">EX</text>
    <rect x="325" y="64" width="60" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/><text x="355" y="84">MEM</text>
    <rect x="395" y="64" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="425" y="84">WB</text>

    <!-- I2 -->
    <rect x="185" y="104" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="215" y="124">IF</text>
    <rect x="255" y="104" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="285" y="124">ID</text>
    <rect x="325" y="104" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="355" y="124">EX</text>
    <rect x="395" y="104" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="425" y="124">MEM</text>

    <!-- I3 -->
    <rect x="255" y="144" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="285" y="164">IF</text>
    <rect x="325" y="144" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="355" y="164">ID</text>

    <!-- I4: stalled bubble in IF at cycle 4 (would want the port) -->
    <rect x="325" y="184" width="60" height="30" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="355" y="204" fill="var(--dg-accent, #0C8F88)">bubble</text>
    <rect x="395" y="184" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="425" y="204">IF</text>
  </g>

  <text x="350" y="228" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">I1's MEM stage holds the port at C4, so I4's fetch is stalled one cycle</text>
</svg>
