<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Exception flush and redirect to handler</text>

  <g font-size="12" fill="var(--dg-muted, #5F6368)" text-anchor="middle">
    <text x="140" y="48">C1</text><text x="210" y="48">C2</text><text x="280" y="48">C3</text>
    <text x="350" y="48">C4</text><text x="420" y="48">C5</text>
  </g>

  <g font-size="13" fill="var(--dg-ink, #202124)">
    <text x="10" y="82">I_old (faults)</text>
    <text x="10" y="122">I_young1</text>
    <text x="10" y="162">I_young2</text>
    <text x="10" y="202">handler</text>
  </g>

  <g font-size="11" text-anchor="middle" fill="var(--dg-ink, #202124)">
    <rect x="105" y="64" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="135" y="84">IF</text>
    <rect x="175" y="64" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="205" y="84">ID</text>
    <rect x="245" y="64" width="60" height="30" fill="var(--dg-accent, #C0392B)" fill-opacity="0.18" stroke="var(--dg-accent, #C0392B)" stroke-width="1.5"/><text x="275" y="84" fill="var(--dg-accent, #C0392B)">EX (fault)</text>

    <rect x="175" y="104" width="60" height="30" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="205" y="124">IF</text>
    <rect x="245" y="104" width="60" height="30" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="275" y="124">ID (flush)</text>

    <rect x="245" y="144" width="60" height="30" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="275" y="164">IF (flush)</text>

    <rect x="315" y="184" width="60" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/><text x="345" y="204">IF</text>
  </g>

  <line x1="275" y1="94" x2="345" y2="184" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrowAccent)"/>
  <text x="340" y="226" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">I_old's fault confirmed at C3; both younger instructions are flushed</text>
  <text x="340" y="244" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">PC redirects to the handler at C4, exactly as if execution stopped at I_old</text>
</svg>
