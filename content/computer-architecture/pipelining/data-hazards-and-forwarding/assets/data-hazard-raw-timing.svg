<svg viewBox="0 0 620 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="310" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">RAW hazard: SUB needs R1 before ADD writes it</text>

  <g font-size="12" fill="var(--dg-muted, #5F6368)" text-anchor="middle">
    <text x="130" y="48">C1</text><text x="200" y="48">C2</text><text x="270" y="48">C3</text>
    <text x="340" y="48">C4</text><text x="410" y="48">C5</text>
  </g>

  <g font-size="13" fill="var(--dg-ink, #202124)">
    <text x="10" y="82">ADD R1..</text>
    <text x="10" y="122">SUB..R1</text>
  </g>

  <g font-size="11" text-anchor="middle" fill="var(--dg-ink, #202124)">
    <rect x="95" y="64" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="125" y="84">IF</text>
    <rect x="165" y="64" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="195" y="84">ID</text>
    <rect x="235" y="64" width="60" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/><text x="265" y="84">EX</text>
    <rect x="305" y="64" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="335" y="84">MEM</text>
    <rect x="375" y="64" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="405" y="84">WB</text>

    <rect x="165" y="104" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="195" y="124">IF</text>
    <rect x="235" y="104" width="60" height="30" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="4 3"/><text x="265" y="124" fill="var(--dg-accent, #0C8F88)">ID reads R1?</text>
    <rect x="305" y="104" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="335" y="124">EX</text>
  </g>

  <!-- gap arrow from ADD EX result to SUB ID need -->
  <line x1="265" y1="94" x2="265" y2="104" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="310" y="160" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">ADD's result exists at end of EX (C3) but SUB's ID (C3) reads the stale register file</text>
  <text x="310" y="180" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">ADD doesn't officially write back until C5 — a 2-cycle gap forwarding must close</text>
</svg>
