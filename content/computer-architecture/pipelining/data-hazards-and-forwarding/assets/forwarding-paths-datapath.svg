<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Forwarding paths into the EX stage</text>

  <!-- stages -->
  <g font-size="13" fill="var(--dg-ink, #202124)" text-anchor="middle" font-weight="600">
    <rect x="30" y="90" width="90" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="75" y="125">ID</text>

    <rect x="180" y="90" width="90" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="225" y="125">EX</text>

    <rect x="330" y="90" width="90" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="375" y="115">EX/MEM</text>
    <text x="375" y="132" font-size="10" font-weight="400" fill="var(--dg-muted, #5F6368)">register</text>

    <rect x="480" y="90" width="90" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="525" y="115">MEM/WB</text>
    <text x="525" y="132" font-size="10" font-weight="400" fill="var(--dg-muted, #5F6368)">register</text>
  </g>

  <!-- main flow arrows -->
  <g stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="120" y1="120" x2="178" y2="120"/>
    <line x1="270" y1="120" x2="328" y2="120"/>
    <line x1="420" y1="120" x2="478" y2="120"/>
  </g>

  <!-- forwarding paths back into EX (accent, curved) -->
  <path d="M375,90 C375,40 225,40 225,88" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <text x="300" y="45" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">forward from EX/MEM</text>

  <path d="M525,90 C560,20 200,10 210,88" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <text x="470" y="20" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">forward from MEM/WB</text>

  <text x="350" y="200" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">a mux at the ALU input picks: register file, EX/MEM, or MEM/WB</text>
  <text x="350" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">whichever holds the newest value the current instruction needs</text>
</svg>
