<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Four instructions overlapped across 5 stages</text>

  <!-- column headers: cycles 1-8 -->
  <g font-size="12" fill="var(--dg-muted, #5F6368)" text-anchor="middle">
    <text x="150" y="50">C1</text><text x="220" y="50">C2</text><text x="290" y="50">C3</text>
    <text x="360" y="50">C4</text><text x="430" y="50">C5</text><text x="500" y="50">C6</text>
    <text x="570" y="50">C7</text><text x="640" y="50">C8</text>
  </g>

  <!-- row labels -->
  <g font-size="13" fill="var(--dg-ink, #202124)">
    <text x="20" y="88">I1</text>
    <text x="20" y="128">I2</text>
    <text x="20" y="168">I3</text>
    <text x="20" y="208">I4</text>
  </g>

  <!-- stage cells, 5 stages: IF ID EX MEM WB -->
  <!-- I1: cycles 1-5 -->
  <g font-size="11" text-anchor="middle" fill="var(--dg-ink, #202124)">
    <rect x="115" y="70" width="60" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/><text x="145" y="90">IF</text>
    <rect x="185" y="70" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="215" y="90">ID</text>
    <rect x="255" y="70" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="285" y="90">EX</text>
    <rect x="325" y="70" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="355" y="90">MEM</text>
    <rect x="395" y="70" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="425" y="90">WB</text>

    <!-- I2: cycles 2-6 -->
    <rect x="185" y="110" width="60" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/><text x="215" y="130">IF</text>
    <rect x="255" y="110" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="285" y="130">ID</text>
    <rect x="325" y="110" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="355" y="130">EX</text>
    <rect x="395" y="110" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="425" y="130">MEM</text>
    <rect x="465" y="110" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="495" y="130">WB</text>

    <!-- I3: cycles 3-7 -->
    <rect x="255" y="150" width="60" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/><text x="285" y="170">IF</text>
    <rect x="325" y="150" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="355" y="170">ID</text>
    <rect x="395" y="150" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="425" y="170">EX</text>
    <rect x="465" y="150" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="495" y="170">MEM</text>
    <rect x="535" y="150" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="565" y="170">WB</text>

    <!-- I4: cycles 4-8 -->
    <rect x="325" y="190" width="60" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/><text x="355" y="210">IF</text>
    <rect x="395" y="190" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="425" y="210">ID</text>
    <rect x="465" y="190" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="495" y="210">EX</text>
    <rect x="535" y="190" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="565" y="210">MEM</text>
    <rect x="605" y="190" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="635" y="210">WB</text>
  </g>

  <!-- highlight column C4: all 5 stages busy at once -->
  <rect x="325" y="62" width="60" height="166" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="355" y="252" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)">Cycle 4: 4 stages busy at once</text>
  <text x="355" y="270" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">throughput = new instruction every cycle once full</text>
</svg>
