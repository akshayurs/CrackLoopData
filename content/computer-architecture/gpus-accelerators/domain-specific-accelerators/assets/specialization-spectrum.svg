<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">The specialization spectrum</text>

  <line x1="60" y1="130" x2="580" y2="130" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="100" cy="130" r="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="160" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">CPU</text>
  <text x="100" y="176" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">most flexible</text>

  <circle cx="320" cy="130" r="12" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="160" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">GPU</text>
  <text x="320" y="176" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">programmable, parallel</text>

  <circle cx="540" cy="130" r="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="540" y="160" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">ASIC</text>
  <text x="540" y="176" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">most efficient</text>

  <text x="60" y="70" font-size="12" fill="var(--dg-muted, #5F6368)">flexibility ↓</text>
  <text x="500" y="70" text-anchor="end" font-size="12" fill="var(--dg-muted, #5F6368)">efficiency at target task ↑</text>

  <text x="320" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each step right narrows what the chip can do, and raises how efficiently it does that one thing.</text>
</svg>
