<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">One instruction, one warp, many ALU lanes</text>

  <rect x="240" y="44" width="160" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="69" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Fetch / decode (1x)</text>

  <line x1="320" y1="84" x2="320" y2="104" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="120" y1="104" x2="520" y2="104" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>

  <g font-size="11" fill="var(--dg-ink, #202124)">
    <!-- 8 sample lanes representing the warp -->
    <line x1="140" y1="104" x2="140" y2="124" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
    <line x1="200" y1="104" x2="200" y2="124" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
    <line x1="260" y1="104" x2="260" y2="124" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
    <line x1="320" y1="104" x2="320" y2="124" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
    <line x1="380" y1="104" x2="380" y2="124" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
    <line x1="440" y1="104" x2="440" y2="124" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
    <line x1="500" y1="104" x2="500" y2="124" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>

    <rect x="118" y="124" width="44" height="34" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="178" y="124" width="44" height="34" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="238" y="124" width="44" height="34" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="298" y="124" width="44" height="34" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="358" y="124" width="44" height="34" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="418" y="124" width="44" height="34" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="478" y="124" width="44" height="34" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>

    <text x="140" y="146" text-anchor="middle">T0</text>
    <text x="200" y="146" text-anchor="middle">T1</text>
    <text x="260" y="146" text-anchor="middle">T2</text>
    <text x="320" y="146" text-anchor="middle">T3</text>
    <text x="380" y="146" text-anchor="middle">T4</text>
    <text x="440" y="146" text-anchor="middle">…</text>
    <text x="500" y="146" text-anchor="middle">T31</text>
  </g>

  <text x="320" y="185" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each lane pulls its own operands, applies the same instruction, and writes its own result.</text>
  <text x="320" y="205" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">One fetch/decode step serves all 32 lanes — the SIMT saving.</text>
  <text x="320" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">(32 threads shown compressed to 7 lanes for space.)</text>
</svg>
