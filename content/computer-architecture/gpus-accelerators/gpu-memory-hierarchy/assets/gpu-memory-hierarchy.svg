<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">GPU memory scope vs execution scope</text>

  <!-- Grid / global memory (outermost) -->
  <rect x="40" y="48" width="560" height="240" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="70" font-size="12" fill="var(--dg-muted, #5F6368)">Grid — global memory (all threads, high latency)</text>

  <!-- Block A / shared memory -->
  <rect x="66" y="86" width="230" height="180" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="80" y="106" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Block 0 — shared memory</text>

  <!-- Threads in block A / registers -->
  <rect x="80" y="118" width="90" height="130" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="125" y="138" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Thread 0</text>
  <text x="125" y="155" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">registers</text>

  <rect x="182" y="118" width="90" height="130" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="227" y="138" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Thread 1</text>
  <text x="227" y="155" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">registers</text>

  <!-- Block B / shared memory -->
  <rect x="326" y="86" width="230" height="180" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="340" y="106" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Block 1 — shared memory</text>

  <rect x="340" y="118" width="90" height="130" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="385" y="138" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Thread 0</text>
  <text x="385" y="155" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">registers</text>

  <rect x="442" y="118" width="90" height="130" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="487" y="138" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Thread 1</text>
  <text x="487" y="155" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">registers</text>

  <text x="320" y="300" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Registers: per-thread. Shared memory: per-block. Global memory: whole grid.</text>
  <text x="320" y="318" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Fast &amp; small at the center, slow &amp; large at the edge.</text>
</svg>
