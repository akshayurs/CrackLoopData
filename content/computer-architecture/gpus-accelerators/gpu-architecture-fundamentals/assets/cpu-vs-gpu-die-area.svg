<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="160" y="26" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">CPU die (rough area)</text>
  <text x="480" y="26" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">GPU die (rough area)</text>

  <!-- CPU die -->
  <rect x="40" y="44" width="240" height="200" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="40" y="44" width="240" height="120" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="160" y="100" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Control logic +</text>
  <text x="160" y="118" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">cache</text>
  <rect x="40" y="164" width="240" height="80" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="160" y="208" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">ALUs (few)</text>

  <!-- GPU die -->
  <rect x="360" y="44" width="240" height="200" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="360" y="44" width="240" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="480" y="66" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Control + small cache</text>
  <rect x="360" y="78" width="240" height="166" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="480" y="155" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Thousands of</text>
  <text x="480" y="173" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">simple ALUs</text>

  <text x="320" y="278" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Same die area, opposite trade: control/cache vs raw ALU count.</text>
</svg>
