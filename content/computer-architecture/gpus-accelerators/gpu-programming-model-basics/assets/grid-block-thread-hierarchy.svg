<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Grid → blocks → threads → hardware</text>

  <rect x="30" y="42" width="580" height="130" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="45" y="60" font-size="12" fill="var(--dg-muted, #5F6368)">Grid (this kernel launch)</text>

  <g>
    <rect x="50" y="70" width="160" height="86" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="130" y="88" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Block 0</text>
    <circle cx="80" cy="112" r="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <circle cx="110" cy="112" r="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <circle cx="140" cy="112" r="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <circle cx="180" cy="112" r="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="130" y="140" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">many threads</text>
  </g>

  <g>
    <rect x="240" y="70" width="160" height="86" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="320" y="88" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Block 1</text>
    <circle cx="270" cy="112" r="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <circle cx="300" cy="112" r="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <circle cx="330" cy="112" r="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <circle cx="370" cy="112" r="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="320" y="140" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">many threads</text>
  </g>

  <g>
    <rect x="430" y="70" width="160" height="86" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="510" y="88" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Block N</text>
    <text x="510" y="118" text-anchor="middle" font-size="14" fill="var(--dg-muted, #5F6368)">…</text>
    <text x="510" y="140" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">many threads</text>
  </g>

  <line x1="320" y1="172" x2="320" y2="200" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>

  <rect x="120" y="200" width="400" height="70" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="228" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Physical SIMT execution units</text>
  <text x="320" y="248" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Runtime schedules blocks onto available units,</text>
  <text x="320" y="262" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">queuing the rest until capacity frees up.</text>
</svg>
