<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowML" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Multi-level cache: size vs latency</text>

  <rect x="40" y="60" width="90" height="150" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="85" y="145" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">L1</text>
  <text x="85" y="235" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">32-64 KB</text>
  <text x="85" y="250" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">1-4 cycles</text>

  <rect x="170" y="100" width="110" height="110" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="225" y="160" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">L2</text>
  <text x="225" y="235" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">256 KB-2 MB</text>
  <text x="225" y="250" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">~10-20 cycles</text>

  <rect x="320" y="140" width="150" height="70" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="395" y="180" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">L3 (shared)</text>
  <text x="395" y="235" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">few-tens of MB</text>
  <text x="395" y="250" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">~30-70 cycles</text>

  <rect x="510" y="160" width="100" height="50" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="560" y="190" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">RAM</text>
  <text x="560" y="235" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">GBs</text>
  <text x="560" y="250" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">100+ cycles</text>

  <line x1="130" y1="130" x2="165" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowML)"/>
  <line x1="280" y1="160" x2="315" y2="170" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowML)"/>
  <line x1="470" y1="180" x2="505" y2="185" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowML)"/>

  <text x="320" y="280" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each step: roughly 10x more capacity, several times more latency.</text>
</svg>
