<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Same trace, two cache shapes: A, B, C, A, B (2 sets, size fixed)</text>

  <text x="20" y="60" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Direct-mapped (1-way, A and C alias to set 0)</text>
  <g font-size="11">
    <rect x="20" y="70" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="50" y="90" text-anchor="middle" fill="var(--dg-ink,#202124)">A miss</text>
    <rect x="85" y="70" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="115" y="90" text-anchor="middle" fill="var(--dg-ink,#202124)">B miss</text>
    <rect x="150" y="70" width="60" height="30" fill="#F6D8D6" stroke="#C0605A"/><text x="180" y="90" text-anchor="middle" fill="var(--dg-ink,#202124)">C conf.</text>
    <rect x="215" y="70" width="60" height="30" fill="#F6D8D6" stroke="#C0605A"/><text x="245" y="90" text-anchor="middle" fill="var(--dg-ink,#202124)">A conf.</text>
    <rect x="280" y="70" width="60" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/><text x="310" y="90" text-anchor="middle" fill="var(--dg-ink,#202124)">B hit</text>
  </g>
  <text x="20" y="130" font-size="11" fill="var(--dg-muted, #5F6368)">A and C collide on the same slot, so re-referencing A after C evicts it — a conflict miss.</text>

  <text x="20" y="175" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">2-way set-associative (A and C now coexist)</text>
  <g font-size="11">
    <rect x="20" y="185" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="50" y="205" text-anchor="middle" fill="var(--dg-ink,#202124)">A miss</text>
    <rect x="85" y="185" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="115" y="205" text-anchor="middle" fill="var(--dg-ink,#202124)">B miss</text>
    <rect x="150" y="185" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="180" y="205" text-anchor="middle" fill="var(--dg-ink,#202124)">C miss</text>
    <rect x="215" y="185" width="60" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/><text x="245" y="205" text-anchor="middle" fill="var(--dg-ink,#202124)">A hit</text>
    <rect x="280" y="185" width="60" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/><text x="310" y="205" text-anchor="middle" fill="var(--dg-ink,#202124)">B hit</text>
  </g>
  <text x="20" y="240" font-size="11" fill="var(--dg-muted, #5F6368)">All misses here are compulsory (first touch) — no conflicts, since A and C now fit in the same set together.</text>

  <text x="320" y="280" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Same trace, same total size — associativity alone removed the conflict misses.</text>
</svg>
