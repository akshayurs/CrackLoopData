<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Overlapping vs. serialized cache misses</text>

  <text x="30" y="58" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Out-of-order core</text>
  <line x1="30" y1="70" x2="610" y2="70" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <rect x="60" y="80" width="220" height="26" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="170" y="98" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">miss A</text>
  <rect x="150" y="112" width="130" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="215" y="130" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">miss B</text>
  <line x1="60" y1="150" x2="280" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="165" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">stall ~= max(A, B)</text>

  <text x="30" y="200" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">In-order core</text>
  <line x1="30" y1="212" x2="610" y2="212" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <rect x="60" y="222" width="220" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="170" y="240" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">miss A</text>
  <rect x="280" y="222" width="130" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="345" y="240" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">miss B</text>
  <line x1="60" y1="264" x2="410" y2="264" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="235" y="279" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">stall = latency(A) + latency(B)</text>
</svg>
