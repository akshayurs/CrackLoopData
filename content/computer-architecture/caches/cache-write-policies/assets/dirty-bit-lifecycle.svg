<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowDB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A dirty bit's lifecycle</text>

  <rect x="30" y="70" width="150" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="92" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Line fetched</text>
  <text x="105" y="108" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">dirty = 0</text>

  <line x1="180" y1="95" x2="230" y2="95" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowDB)"/>
  <text x="205" y="85" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">write</text>

  <rect x="230" y="70" width="150" height="50" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="305" y="92" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">CPU writes line</text>
  <text x="305" y="108" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">dirty = 1</text>

  <line x1="380" y1="95" x2="430" y2="95" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowDB)"/>
  <text x="405" y="85" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">evict</text>

  <rect x="430" y="70" width="180" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="520" y="92" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Check dirty bit</text>
  <text x="520" y="108" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">on eviction</text>

  <line x1="520" y1="120" x2="520" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="520" y1="160" x2="410" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowDB)"/>
  <line x1="520" y1="160" x2="610" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowDB)"/>

  <rect x="310" y="180" width="140" height="46" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="380" y="200" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">dirty = 1</text>
  <text x="380" y="216" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">write back, then drop</text>

  <rect x="470" y="180" width="140" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="540" y="200" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">dirty = 0</text>
  <text x="540" y="216" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">drop immediately</text>
</svg>
