<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowLRU" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">LRU order in a 4-way set, over time</text>

  <text x="90" y="55" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">after A,B,C,D</text>
  <g>
    <rect x="30" y="65" width="120" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="90" y="85" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">D (MRU)</text>
    <rect x="30" y="95" width="120" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="90" y="113" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">C</text>
    <rect x="30" y="121" width="120" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="90" y="139" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">B</text>
    <rect x="30" y="147" width="120" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="90" y="165" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">A (LRU)</text>
  </g>

  <line x1="160" y1="115" x2="220" y2="115" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowLRU)"/>
  <text x="190" y="105" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">hit A</text>

  <text x="320" y="55" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">after hit on A</text>
  <g>
    <rect x="260" y="65" width="120" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="320" y="85" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">A (MRU)</text>
    <rect x="260" y="95" width="120" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="320" y="113" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">D</text>
    <rect x="260" y="121" width="120" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="320" y="139" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">C</text>
    <rect x="260" y="147" width="120" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="320" y="165" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">B (LRU)</text>
  </g>

  <line x1="390" y1="115" x2="450" y2="115" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowLRU)"/>
  <text x="420" y="105" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">miss E</text>

  <text x="550" y="55" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">after miss on E</text>
  <g>
    <rect x="490" y="65" width="120" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="550" y="85" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">E (MRU)</text>
    <rect x="490" y="95" width="120" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="550" y="113" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">A</text>
    <rect x="490" y="121" width="120" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="550" y="139" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">D</text>
    <rect x="490" y="147" width="120" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="550" y="165" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">C (LRU)</text>
  </g>

  <text x="320" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">B was evicted (was at the LRU end) to make room for E — C now sits at the LRU end.</text>
</svg>
