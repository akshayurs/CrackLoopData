<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The memory hierarchy</text>

  <!-- registers -->
  <polygon points="290,44 350,44 370,90 270,90" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Registers</text>
  <text x="400" y="72" font-size="11" fill="var(--dg-muted, #5F6368)">~64 B · ~1 cycle</text>

  <!-- cache -->
  <polygon points="270,90 370,90 400,150 240,150" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="128" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">L1 / L2 / L3 Cache</text>
  <text x="420" y="128" font-size="11" fill="var(--dg-muted, #5F6368)">KB – tens of MB · 1–40 cycles</text>

  <!-- ram -->
  <polygon points="240,150 400,150 440,230 200,230" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="198" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">RAM</text>
  <text x="460" y="198" font-size="11" fill="var(--dg-muted, #5F6368)">GBs · 100–300 cycles</text>

  <!-- disk -->
  <polygon points="200,230 440,230 490,330 150,330" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="288" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Disk / SSD</text>
  <text x="510" y="288" font-size="11" fill="var(--dg-muted, #5F6368)">TBs · 10,000+ cycles</text>

  <text x="320" y="365" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Narrower = faster and smaller. Wider = slower and larger.</text>
</svg>
