<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowHM" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A memory request's two paths</text>

  <rect x="30" y="60" width="140" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="88" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">CPU request</text>

  <rect x="230" y="60" width="160" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="310" y="82" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Check cache tags</text>
  <text x="310" y="98" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">tag match?</text>

  <line x1="170" y1="83" x2="224" y2="83" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowHM)"/>

  <!-- hit path -->
  <line x1="310" y1="106" x2="310" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowHM)"/>
  <text x="330" y="132" font-size="11" fill="var(--dg-accent, #0C8F88)">hit</text>
  <rect x="230" y="150" width="160" height="46" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="310" y="178" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Return value</text>
  <line x1="310" y1="196" x2="310" y2="240" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowHM)"/>

  <!-- miss path -->
  <line x1="390" y1="83" x2="470" y2="83" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowHM)"/>
  <text x="400" y="72" font-size="11" fill="var(--dg-muted, #5F6368)">miss</text>
  <rect x="470" y="60" width="150" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="545" y="82" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Fetch block from</text>
  <text x="545" y="98" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">next level / RAM</text>

  <line x1="545" y1="106" x2="545" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowHM)"/>
  <rect x="470" y="150" width="150" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="545" y="178" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Install line</text>

  <line x1="470" y1="173" x2="400" y2="173" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowHM)"/>
  <line x1="390" y1="173" x2="390" y2="196" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>

  <rect x="230" y="240" width="160" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="310" y="268" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Value returned to CPU</text>

  <text x="320" y="308" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A miss detours through the next level before the value ever reaches the CPU.</text>
</svg>
