<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowMESI" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">One line's MESI state across two cores</text>

  <text x="150" y="55" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Core 1</text>
  <text x="490" y="55" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Core 2</text>

  <rect x="70" y="70" width="160" height="46" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="150" y="98" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Exclusive</text>
  <text x="20" y="95" font-size="11" fill="var(--dg-muted, #5F6368)">1. Core 1 reads</text>

  <line x1="150" y1="116" x2="150" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowMESI)"/>
  <rect x="70" y="150" width="160" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="178" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Shared</text>
  <text x="20" y="145" font-size="11" fill="var(--dg-muted, #5F6368)">2. Core 2 also reads</text>

  <rect x="410" y="150" width="160" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="178" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Shared</text>
  <line x1="230" y1="173" x2="405" y2="173" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowMESI)"/>

  <line x1="150" y1="196" x2="150" y2="230" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowMESI)"/>
  <rect x="70" y="230" width="160" height="46" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="150" y="258" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Modified</text>
  <text x="20" y="225" font-size="11" fill="var(--dg-muted, #5F6368)">3. Core 1 writes</text>

  <line x1="410" y1="173" x2="235" y2="240" stroke="var(--dg-accent, #C0605A)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowMESI)"/>
  <rect x="410" y="230" width="160" height="46" rx="6" fill="var(--dg-accent-bg, #F6D8D6)" stroke="var(--dg-accent, #C0605A)" stroke-width="1.5"/>
  <text x="490" y="258" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Invalid</text>
  <text x="480" y="225" font-size="11" fill="var(--dg-muted, #5F6368)">invalidated by write</text>

  <text x="320" y="305" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Core 1's write forces Core 2's copy to Invalid — only one writable copy ever exists.</text>
</svg>
