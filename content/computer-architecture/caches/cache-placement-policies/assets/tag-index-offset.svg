<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Splitting an address for cache lookup</text>

  <rect x="60" y="60" width="260" height="50" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="190" y="90" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Tag</text>

  <rect x="320" y="60" width="180" height="50" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="410" y="90" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Index</text>

  <rect x="500" y="60" width="100" height="50" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="550" y="90" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Offset</text>

  <text x="190" y="135" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">compared against way tag(s)</text>
  <text x="410" y="135" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">selects the set</text>
  <text x="550" y="135" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">selects byte in line</text>

  <text x="190" y="170" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">more ways -&gt; fewer index bits, more tag bits</text>

  <text x="320" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Fully associative caches have zero index bits — every way in the whole cache is compared.</text>
</svg>
