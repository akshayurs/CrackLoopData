  <g fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1">
    <rect x="30" y="65" width="24" height="24"/><rect x="58" y="65" width="24" height="24"/><rect x="86" y="65" width="24" height="24"/><rect x="114" y="65" width="24" height="24"/><rect x="142" y="65" width="24" height="24"/><rect x="170" y="65" width="24" height="24"/><rect x="198" y="65" width="24" height="24"/><rect x="226" y="65" width="24" height="24"/>
    <rect x="30" y="93" width="24" height="24"/><rect x="58" y="93" width="24" height="24"/><rect x="86" y="93" width="24" height="24"/><rect x="114" y="93" width="24" height="24"/><rect x="142" y="93" width="24" height="24"/><rect x="170" y="93" width="24" height="24"/><rect x="198" y="93" width="24" height="24"/><rect x="226" y="93" width="24" height="24"/>
    <rect x="30" y="121" width="24" height="24"/><rect x="58" y="121" width="24" height="24"/><rect x="86" y="121" width="24" height="24"/><rect x="114" y="121" width="24" height="24"/><rect x="142" y="121" width="24" height="24"/><rect x="170" y="121" width="24" height="24"/><rect x="198" y="121" width="24" height="24"/><rect x="226" y="121" width="24" height="24"/>
    <rect x="30" y="149" width="24" height="24"/><rect x="58" y="149" width="24" height="24"/><rect x="86" y="149" width="24" height="24"/><rect x="114" y="149" width="24" height="24"/><rect x="142" y="149" width="24" height="24"/><rect x="170" y="149" width="24" height="24"/><rect x="198" y="149" width="24" height="24"/><rect x="226" y="149" width="24" height="24"/>
  </g>
  <text x="170" y="195" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">512 entries needed for 2MB</text>

  <line x1="290" y1="130" x2="410" y2="130" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>

  <text x="550" y="52" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Huge 2MB page</text>
  <rect x="450" y="65" width="200" height="108" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="550" y="125" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">1 entry</text>
  <text x="550" y="195" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">1 entry covers the same 2MB</text>

  <text x="350" y="235" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">512x fewer TLB entries needed for the identical memory region</text>
