<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Four-level page-table walk (x86-64 style)</text>

  <!-- virtual address bar -->
  <g font-size="11" text-anchor="middle" fill="var(--dg-ink, #202124)">
    <rect x="20" y="45" width="110" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/><text x="75" y="65">L1 idx</text>
    <rect x="130" y="45" width="110" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/><text x="185" y="65">L2 idx</text>
    <rect x="240" y="45" width="110" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/><text x="295" y="65">L3 idx</text>
    <rect x="350" y="45" width="110" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/><text x="405" y="65">L4 idx</text>
    <rect x="460" y="45" width="110" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="515" y="65">offset</text>
  </g>
  <text x="290" y="92" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">virtual address, split into 5 fields</text>

  <!-- level boxes -->
  <g font-size="12" fill="var(--dg-ink, #202124)" text-anchor="middle">
    <rect x="50" y="120" width="90" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="95" y="145">L1 table</text>
    <rect x="190" y="120" width="90" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="235" y="145">L2 table</text>
    <rect x="330" y="120" width="90" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="375" y="145">L3 table</text>
    <rect x="470" y="120" width="90" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="515" y="145">L4 table</text>
    <rect x="610" y="120" width="90" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/><text x="655" y="145">frame</text>
  </g>

  <g stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="75" y1="75" x2="95" y2="118"/>
    <line x1="185" y1="75" x2="235" y2="118"/>
    <line x1="295" y1="75" x2="375" y2="118"/>
    <line x1="405" y1="75" x2="515" y2="118"/>
    <line x1="140" y1="140" x2="188" y2="140"/>
    <line x1="280" y1="140" x2="328" y2="140"/>
    <line x1="420" y1="140" x2="468" y2="140"/>
    <line x1="560" y1="140" x2="608" y2="140"/>
  </g>

  <line x1="515" y1="75" x2="655" y2="180" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
  <text x="655" y="195" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">+ offset</text>

  <text x="360" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">each level's entry points to the next table, or (at L4) directly to the physical frame</text>
  <text x="360" y="260" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">a missing entry anywhere means that region was never mapped</text>
</svg>
