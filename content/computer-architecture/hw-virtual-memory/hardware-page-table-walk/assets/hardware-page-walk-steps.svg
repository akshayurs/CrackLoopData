<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Step-by-step hardware page-table walk</text>

  <rect x="20" y="70" width="100" height="50" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="70" y="90" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">CR3 / root</text>
  <text x="70" y="105" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">known address</text>

  <rect x="170" y="70" width="100" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="220" y="90" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">L1 read</text>
  <text x="220" y="105" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">mem access 1</text>

  <rect x="320" y="70" width="100" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="370" y="90" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">L2 read</text>
  <text x="370" y="105" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">mem access 2</text>

  <rect x="470" y="70" width="100" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="520" y="90" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">L3 read</text>
  <text x="520" y="105" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">mem access 3</text>

  <rect x="580" y="150" width="100" height="50" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="630" y="170" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">frame</text>
  <text x="630" y="185" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">mem access 4</text>

  <g stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="120" y1="95" x2="168" y2="95"/>
    <line x1="270" y1="95" x2="318" y2="95"/>
    <line x1="420" y1="95" x2="468" y2="95"/>
  </g>
  <line x1="570" y1="110" x2="620" y2="148" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>

  <text x="350" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">each level's entry points to the next table (or, at the last level, the physical frame)</text>
  <text x="350" y="248" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">4 levels = up to 4 real memory reads, before the original access even proceeds</text>
</svg>
