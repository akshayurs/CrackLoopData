<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Virtual address to physical address via the MMU</text>

  <!-- Process A box -->
  <rect x="20" y="50" width="180" height="90" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="110" y="68" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Process A</text>
  <rect x="40" y="80" width="140" height="30" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="110" y="100" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">virtual 0x1000</text>

  <!-- Process B box -->
  <rect x="20" y="160" width="180" height="90" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="110" y="178" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Process B</text>
  <rect x="40" y="190" width="140" height="30" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="110" y="210" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">virtual 0x1000</text>

  <!-- MMU -->
  <rect x="290" y="120" width="120" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="350" y="150" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">MMU</text>
  <text x="350" y="168" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">translate + protect</text>

  <line x1="180" y1="95" x2="288" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="205" x2="288" y2="165" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Physical RAM -->
  <rect x="470" y="60" width="200" height="190" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="570" y="80" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Physical RAM</text>
  <rect x="490" y="95" width="160" height="26" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="570" y="113" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">frame for A's page</text>
  <rect x="490" y="200" width="160" height="26" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="570" y="218" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">frame for B's page</text>

  <line x1="410" y1="140" x2="488" y2="108" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="165" x2="488" y2="213" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="350" y="275" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">same virtual address, two different physical frames — isolation guaranteed</text>
</svg>
