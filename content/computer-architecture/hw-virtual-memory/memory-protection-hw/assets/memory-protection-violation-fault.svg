<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#C0392B"/>
    </marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">A protection violation traps into the OS</text>

  <rect x="30" y="80" width="140" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="105" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">User-mode</text>
  <text x="100" y="122" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">write attempt</text>

  <rect x="250" y="80" width="160" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="330" y="105" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">PTE check</text>
  <text x="330" y="122" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">read-only page</text>

  <rect x="480" y="80" width="160" height="60" rx="8" fill="#C0392B" fill-opacity="0.15" stroke="#C0392B" stroke-width="1.5"/>
  <text x="560" y="105" text-anchor="middle" font-size="12" fill="#C0392B" font-weight="600">Fault!</text>
  <text x="560" y="122" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">access denied</text>

  <line x1="170" y1="110" x2="248" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="110" x2="478" y2="110" stroke="#C0392B" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <rect x="330" y="190" width="180" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="420" y="220" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">OS fault handler</text>

  <line x1="560" y1="140" x2="440" y2="188" stroke="#C0392B" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <text x="340" y="255" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">the write never reaches memory — the OS decides what happens next</text>
</svg>
