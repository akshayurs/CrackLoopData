<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">The TLB in the memory access path</text>

  <rect x="30" y="90" width="110" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="125" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">CPU core</text>

  <rect x="200" y="90" width="130" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="265" y="115" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">TLB</text>
  <text x="265" y="133" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">cached translations</text>

  <rect x="400" y="30" width="130" height="55" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="465" y="63" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">cache / memory</text>
  <text x="465" y="45" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">hit path</text>

  <rect x="400" y="150" width="130" height="55" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="465" y="180" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">page-table walk</text>
  <text x="465" y="165" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">miss path</text>

  <line x1="140" y1="120" x2="198" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="170" y="112" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">virt addr</text>

  <line x1="330" y1="105" x2="398" y2="65" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="380" y="80" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">hit: phys addr</text>

  <line x1="330" y1="135" x2="398" y2="170" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="155" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">miss: walk</text>

  <path d="M465,150 C465,130 330,130 330,120" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
  <text x="440" y="220" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">walk result installed back into TLB</text>

  <text x="350" y="245" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">every access checks the TLB first; the walk is only the rare, slow path</text>
</svg>
