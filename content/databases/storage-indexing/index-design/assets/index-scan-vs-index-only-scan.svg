<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="160" y="26" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Regular index scan</text>
  <text x="480" y="26" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Index-only scan</text>
  <line x1="320" y1="10" x2="320" y2="320" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,4"/>

  <rect x="100" y="50" width="120" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="160" y="74" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">B+Tree index</text>
  <line x1="160" y1="90" x2="160" y2="128" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="100" y="128" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="152" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Leaf entry</text>

  <line x1="220" y1="148" x2="290" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="270" y="170" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">extra hop</text>

  <rect x="100" y="212" width="120" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="232" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Heap / table</text>
  <text x="160" y="248" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">fetch full row</text>

  <text x="160" y="300" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Index match, then a second hop to the heap for the row.</text>

  <rect x="420" y="50" width="120" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="480" y="74" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">B+Tree index</text>
  <line x1="480" y1="90" x2="480" y2="128" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="420" y="128" width="120" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="480" y="152" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Leaf entry ✓</text>

  <text x="480" y="300" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Stops at the leaf — every needed column is already there.</text>
</svg>
