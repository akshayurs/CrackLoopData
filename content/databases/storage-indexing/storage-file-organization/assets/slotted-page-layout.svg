<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Slotted page (8KB)</text>

  <rect x="80" y="50" width="480" height="230" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <rect x="80" y="50" width="480" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="72" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Page header</text>

  <rect x="94" y="98" width="220" height="40" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="204" y="115" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Slot array</text>
  <text x="204" y="130" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">offset pointers</text>
  <line x1="220" y1="118" x2="300" y2="118" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="260" y="108" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">grows -&gt;</text>

  <rect x="330" y="222" width="216" height="40" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="438" y="239" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Row data</text>
  <text x="438" y="254" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">variable-length rows</text>
  <line x1="330" y1="242" x2="320" y2="242" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="360" y="212" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">&lt;- grows</text>

  <rect x="94" y="150" width="452" height="60" rx="4" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="320" y="176" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Free space</text>
  <text x="320" y="192" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">slots and rows grow toward each other</text>

  <text x="320" y="300" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A slot moves without touching the row bytes it points to.</text>
</svg>
