  <text x="100" y="220" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Leaf</text>
  <text x="100" y="234" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">keys + row ptrs</text>

  <rect x="180" y="200" width="100" height="46" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="230" y="220" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Leaf</text>
  <text x="230" y="234" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">keys + row ptrs</text>

  <rect x="270" y="200" width="100" height="46" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="220" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Leaf</text>
  <text x="320" y="234" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">keys + row ptrs</text>

  <rect x="360" y="200" width="100" height="46" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="410" y="220" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Leaf</text>
  <text x="410" y="234" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">keys + row ptrs</text>

  <rect x="490" y="200" width="100" height="46" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="540" y="220" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Leaf</text>
  <text x="540" y="234" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">keys + row ptrs</text>

  <line x1="150" y1="223" x2="180" y2="223" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="280" y1="223" x2="270" y2="223" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow2)" marker-start="url(#arrow2)"/>
  <line x1="370" y1="223" x2="360" y2="223" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow2)" marker-start="url(#arrow2)"/>
  <line x1="460" y1="223" x2="490" y2="223" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow2)" marker-start="url(#arrow2)"/>

  <text x="320" y="290" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Internal nodes only route; leaves hold data and link left-to-right.</text>
  <text x="320" y="310" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Range scans walk this linked list instead of re-descending the tree.</text>
</svg>
