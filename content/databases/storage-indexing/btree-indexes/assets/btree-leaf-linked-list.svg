<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">B+Tree index (3 levels)</text>

  <rect x="260" y="42" width="120" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="66" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Root: keys</text>

  <line x1="290" y1="82" x2="180" y2="118" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="320" y1="82" x2="320" y2="118" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="350" y1="82" x2="460" y2="118" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="120" y="118" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="180" y="142" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Internal node</text>
  <rect x="260" y="118" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="142" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Internal node</text>
  <rect x="400" y="118" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="460" y="142" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Internal node</text>

  <line x1="150" y1="158" x2="100" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="210" y1="158" x2="230" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="320" y1="158" x2="320" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="430" y1="158" x2="410" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="490" y1="158" x2="540" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

