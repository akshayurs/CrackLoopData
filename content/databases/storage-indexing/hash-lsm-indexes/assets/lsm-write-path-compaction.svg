<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">LSM write path and compaction</text>

  <text x="80" y="52" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">write</text>
  <line x1="80" y1="58" x2="80" y2="78" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="30" y="80" width="140" height="44" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="100" y="106" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Memtable</text>

  <line x1="80" y1="80" x2="80" y2="60" stroke="var(--dg-line, #5F6368)"/>
  <line x1="80" y1="60" x2="250" y2="60" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="250" y="38" width="120" height="44" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="310" y="64" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">WAL (disk)</text>

  <line x1="100" y1="124" x2="100" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="150" y="145" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">flush when full</text>

  <text x="100" y="176" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Level 0</text>
  <rect x="30" y="182" width="50" height="34" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="55" y="203" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">SSTable</text>
  <rect x="90" y="182" width="50" height="34" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="115" y="203" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">SSTable</text>
  <rect x="150" y="182" width="50" height="34" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="175" y="203" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">SSTable</text>
  <rect x="210" y="182" width="50" height="34" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="235" y="203" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">SSTable</text>

  <line x1="145" y1="230" x2="145" y2="262" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="145" y="248" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">compaction</text>

  <text x="145" y="284" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Level 1</text>
  <rect x="70" y="290" width="80" height="36" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="312" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">merged file</text>
  <rect x="160" y="290" width="80" height="36" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="200" y="312" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">merged file</text>

  <line x1="155" y1="338" x2="155" y2="360" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="220" y="352" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">compaction</text>

  <text x="155" y="384" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Level 2</text>
  <rect x="80" y="390" width="150" height="0" fill="none"/>
  <rect x="90" y="392" width="140" height="4" fill="none"/>

  <rect x="380" y="80" width="220" height="260" rx="8" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="490" y="105" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">fewer, larger files</text>
  <text x="490" y="122" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">at each lower level</text>
  <rect x="410" y="145" width="160" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="165" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Level 1 file</text>
  <rect x="410" y="245" width="160" height="40" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="269" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Level 2 file</text>
  <line x1="490" y1="175" x2="490" y2="245" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="530" y="212" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">compaction</text>
