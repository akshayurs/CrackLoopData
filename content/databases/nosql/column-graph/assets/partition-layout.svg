<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Wide-column physical layout</text>

  <!-- hash funnel -->
  <polygon points="270,44 430,44 370,90 330,90" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="350" y="64" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">hash(partition</text>
  <text x="350" y="78" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">key)</text>

  <line x1="350" y1="90" x2="130" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="350" y1="90" x2="350" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="350" y1="90" x2="570" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <!-- Node A -->
  <rect x="70" y="130" width="120" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="130" y="164" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Node A</text>

  <!-- Node B (zoomed) -->
  <rect x="290" y="130" width="120" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="350" y="164" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Node B</text>

  <!-- Node C -->
  <rect x="510" y="130" width="120" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="570" y="164" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Node C</text>

  <line x1="350" y1="190" x2="350" y2="216" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <!-- zoom callout box -->
  <rect x="130" y="216" width="440" height="164" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="350" y="236" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Node B partition — sorted by clustering key (reading_time)</text>

  <!-- table header -->
  <line x1="150" y1="248" x2="550" y2="248" stroke="var(--dg-line, #5F6368)"/>
  <text x="220" y="264" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">reading_time</text>
  <text x="380" y="264" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">columns</text>
  <line x1="150" y1="272" x2="550" y2="272" stroke="var(--dg-line, #5F6368)"/>

  <!-- rows with sparse columns -->
  <text x="220" y="292" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">08:00:01</text>
  <text x="380" y="292" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">value, unit</text>

  <text x="220" y="314" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">08:00:02</text>
  <text x="380" y="314" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">value</text>

  <text x="220" y="336" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">08:00:03</text>
  <text x="380" y="336" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">value, unit, flag</text>

  <text x="350" y="364" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">rows sorted by time; each row's populated columns can differ</text>
</svg>
