<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Query cost vs relationship hops</text>

  <!-- left chart: relational joins -->
  <text x="170" y="48" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Relational joins</text>
  <line x1="70" y1="240" x2="70" y2="60" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="70" y1="240" x2="270" y2="240" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="40" y="150" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" transform="rotate(-90 40 150)">query cost</text>
  <text x="170" y="264" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">relationship hops (1-5)</text>
  <path d="M70,225 L110,222 L150,212 L190,180 L230,110" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>
  <text x="70" y="255" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">1</text>
  <text x="230" y="255" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">5</text>

  <!-- right chart: graph traversal -->
  <text x="530" y="48" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Graph traversal</text>
  <line x1="430" y1="240" x2="430" y2="60" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="430" y1="240" x2="630" y2="240" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="400" y="150" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" transform="rotate(-90 400 150)">query cost</text>
  <text x="530" y="264" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">relationship hops (1-5)</text>
  <path d="M430,222 L470,219 L510,215 L550,210 L590,204" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>
  <text x="430" y="255" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">1</text>
  <text x="590" y="255" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">5</text>

  <text x="350" y="304" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Join cost compounds past 2-3 hops; traversal cost stays nearly flat.</text>
</svg>
