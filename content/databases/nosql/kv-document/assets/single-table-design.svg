<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="360" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Single-table design layout</text>

  <!-- table -->
  <rect x="150" y="46" width="470" height="176" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <!-- header row -->
  <text x="230" y="68" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">PK</text>
  <text x="380" y="68" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">SK</text>
  <text x="540" y="68" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Attributes</text>
  <line x1="165" y1="78" x2="605" y2="78" stroke="var(--dg-line, #5F6368)"/>

  <!-- row 1 -->
  <text x="230" y="104" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">USER#123</text>
  <text x="380" y="104" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">PROFILE</text>
  <text x="540" y="104" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">name, email</text>

  <!-- row 2 -->
  <text x="230" y="140" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">USER#123</text>
  <text x="380" y="140" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">ORDER#456</text>
  <text x="540" y="140" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">total, status</text>

  <!-- row 3 -->
  <text x="230" y="176" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">USER#123</text>
  <text x="380" y="176" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">ORDER#789</text>
  <text x="540" y="176" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">total, status</text>

  <!-- highlight box around the 3 rows -->
  <rect x="200" y="88" width="60" height="102" rx="4" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>

  <!-- bracket on the left -->
  <path d="M120,90 C100,90 100,138 80,138 C100,138 100,186 120,186" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>

  <text x="60" y="260" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">one partition,</text>
  <text x="60" y="276" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">one query returns</text>
  <text x="60" y="292" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">user + all orders</text>
</svg>
