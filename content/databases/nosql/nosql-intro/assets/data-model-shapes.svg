<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="380" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Same data, four shapes</text>

  <!-- Panel 1: key-value -->
  <rect x="20" y="46" width="165" height="240" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="102" y="68" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Key-value</text>
  <rect x="45" y="140" width="115" height="60" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="102" y="166" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">opaque blob</text>
  <text x="102" y="182" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">key: CUST#123</text>
  <text x="102" y="264" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">get/put by key</text>

  <!-- Panel 2: document -->
  <rect x="205" y="46" width="165" height="240" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="287" y="68" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Document</text>
  <rect x="230" y="90" width="115" height="150" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="287" y="112" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">customer</text>
  <line x1="260" y1="122" x2="260" y2="200" stroke="var(--dg-line, #5F6368)"/>
  <line x1="260" y1="200" x2="300" y2="200" stroke="var(--dg-line, #5F6368)"/>
  <text x="310" y="204" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">order</text>
  <text x="287" y="140" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">name, email</text>
  <text x="287" y="222" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">nested tree</text>
  <text x="287" y="264" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">order embedded</text>

  <!-- Panel 3: wide-column -->
  <rect x="390" y="46" width="165" height="240" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="472" y="68" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Wide-column</text>
  <line x1="415" y1="90" x2="530" y2="90" stroke="var(--dg-line, #5F6368)"/>
  <text x="437" y="104" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">PK</text>
  <text x="472" y="104" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">CK</text>
  <text x="505" y="104" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">cols</text>
  <line x1="415" y1="112" x2="530" y2="112" stroke="var(--dg-line, #5F6368)"/>
  <text x="437" y="130" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">CUST#1</text>
  <text x="472" y="130" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">t1</text>
  <text x="505" y="130" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">name</text>
  <text x="437" y="150" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">CUST#1</text>
  <text x="472" y="150" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">t2</text>
  <text x="505" y="150" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">total</text>
  <text x="472" y="264" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">sparse columns</text>

  <!-- Panel 4: graph -->
  <rect x="575" y="46" width="165" height="240" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="657" y="68" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Graph</text>
  <circle cx="620" cy="150" r="28" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="620" y="154" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Customer</text>
  <circle cx="695" cy="150" r="28" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="695" y="154" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Order</text>
  <line x1="648" y1="150" x2="667" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="657" y="138" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">placed</text>
  <text x="657" y="264" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">nodes + edges</text>

  <text x="380" y="308" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Same customer-and-order data, four different physical shapes.</text>
</svg>
