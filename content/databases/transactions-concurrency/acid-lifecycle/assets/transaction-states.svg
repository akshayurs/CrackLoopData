<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Transaction lifecycle</text>

  <rect x="30" y="120" width="110" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="148" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Active</text>

  <rect x="200" y="120" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="275" y="148" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Partially committed</text>

  <rect x="420" y="120" width="150" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="495" y="148" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Committed</text>

  <rect x="120" y="230" width="110" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="175" y="258" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Failed</text>

  <rect x="300" y="230" width="110" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="355" y="258" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Aborted</text>

  <line x1="140" y1="143" x2="196" y2="143" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="143" x2="416" y2="143" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M 85 166 L 85 200 L 175 200 L 175 226" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="105" y="196" font-size="10" fill="var(--dg-muted, #5F6368)">on error</text>

  <path d="M 275 166 L 275 200 L 175 200" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="196" font-size="10" fill="var(--dg-muted, #5F6368)">durability failure</text>

  <line x1="230" y1="253" x2="296" y2="253" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="263" y="243" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">undo</text>

  <text x="320" y="20" text-anchor="middle" font-size="1" fill="none"></text>
  <text x="320" y="292" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Only durably-committed state survives a crash; every other path ends in Aborted.</text>
</svg>
