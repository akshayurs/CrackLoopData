<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Anomalies permitted by isolation level</text>

  <text x="190" y="50" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Dirty read</text>
  <text x="330" y="50" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Non-repeatable</text>
  <text x="470" y="50" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Phantom</text>

  <text x="70" y="88" font-size="12" fill="var(--dg-ink, #202124)">Read Uncommitted</text>
  <text x="70" y="128" font-size="12" fill="var(--dg-ink, #202124)">Read Committed</text>
  <text x="70" y="168" font-size="12" fill="var(--dg-ink, #202124)">Repeatable Read</text>
  <text x="70" y="208" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Serializable</text>

  <!-- Read Uncommitted: possible, possible, possible -->
  <rect x="160" y="70" width="60" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="190" y="88" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">possible</text>
  <rect x="300" y="70" width="60" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="330" y="88" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">possible</text>
  <rect x="440" y="70" width="60" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="470" y="88" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">possible</text>

  <!-- Read Committed: prevented, possible, possible -->
  <rect x="160" y="110" width="60" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="190" y="128" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">prevented</text>
  <rect x="300" y="110" width="60" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="330" y="128" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">possible</text>
  <rect x="440" y="110" width="60" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="470" y="128" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">possible</text>

  <!-- Repeatable Read: prevented, prevented, possible -->
  <rect x="160" y="150" width="60" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="190" y="168" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">prevented</text>
  <rect x="300" y="150" width="60" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="330" y="168" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">prevented</text>
  <rect x="440" y="150" width="60" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="470" y="168" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">possible*</text>

  <!-- Serializable: prevented, prevented, prevented -->
  <rect x="160" y="190" width="60" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="190" y="208" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">prevented</text>
  <rect x="300" y="190" width="60" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="330" y="208" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">prevented</text>
  <rect x="440" y="190" width="60" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="470" y="208" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">prevented</text>

  <line x1="30" y1="235" x2="580" y2="235" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="320" y="256" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each level down turns one more cell from possible to prevented - a strict staircase.</text>
  <text x="320" y="276" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">*Postgres and MySQL/InnoDB prevent phantoms here in practice; the SQL standard only requires it above.</text>
</svg>
