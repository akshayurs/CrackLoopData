<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Precedence graphs</text>

  <text x="150" y="54" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Conflict-serializable</text>
  <circle cx="80" cy="110" r="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="80" y="115" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">T1</text>
  <circle cx="150" cy="190" r="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="150" y="195" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">T2</text>
  <circle cx="220" cy="110" r="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="220" y="115" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">T3</text>

  <line x1="98" y1="126" x2="134" y2="176" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="166" y1="176" x2="202" y2="126" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="150" y="250" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">No cycle: T1 -&gt; T2 -&gt; T3</text>
  <text x="150" y="268" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">equivalent serial order T1, T2, T3</text>

  <line x1="320" y1="70" x2="320" y2="290" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="490" y="54" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Not conflict-serializable</text>
  <circle cx="420" cy="110" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="420" y="115" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">T1</text>
  <circle cx="490" cy="190" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="195" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">T2</text>
  <circle cx="560" cy="110" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="560" y="115" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">T3</text>

  <line x1="438" y1="126" x2="474" y2="176" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="506" y1="176" x2="542" y2="126" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <path d="M 542 100 Q 490 40 438 100" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowAccent)"/>

  <text x="490" y="250" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Cycle: T1 -&gt; T2 -&gt; T3 -&gt; T1</text>
  <text x="490" y="268" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">no valid serial order exists</text>

  <text x="320" y="320" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A precedence-graph cycle is exactly what strict 2PL is designed to prevent.</text>
</svg>
