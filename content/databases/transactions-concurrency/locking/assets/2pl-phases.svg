<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Two-phase locking: lock count over time</text>

  <text x="70" y="55" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Plain 2PL</text>
  <line x1="70" y1="130" x2="580" y2="130" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="590" y="134" font-size="11" fill="var(--dg-muted, #5F6368)">time</text>
  <line x1="70" y1="130" x2="70" y2="60" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>

  <polyline points="70,125 130,105 190,85 250,65 320,65 380,80 440,95 500,110 560,125" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <circle cx="130" cy="105" r="3" fill="var(--dg-accent, #0C8F88)"/>
  <text x="130" y="98" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">L1</text>
  <circle cx="190" cy="85" r="3" fill="var(--dg-accent, #0C8F88)"/>
  <text x="190" y="78" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">L2</text>
  <circle cx="250" cy="65" r="3" fill="var(--dg-accent, #0C8F88)"/>
  <text x="250" y="58" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">L3</text>
  <text x="285" y="52" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">lock point</text>

  <text x="150" y="150" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">growing phase</text>
  <text x="470" y="150" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">shrinking phase</text>

  <text x="70" y="200" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Strict 2PL</text>
  <line x1="70" y1="280" x2="580" y2="280" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="590" y="284" font-size="11" fill="var(--dg-muted, #5F6368)">time</text>
  <line x1="70" y1="280" x2="70" y2="210" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>

  <line x1="70" y1="215" x2="470" y2="215" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <line x1="470" y1="215" x2="470" y2="275" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <line x1="470" y1="275" x2="560" y2="275" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="470" y="205" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">COMMIT</text>
  <text x="270" y="235" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">all locks held flat</text>
</svg>
