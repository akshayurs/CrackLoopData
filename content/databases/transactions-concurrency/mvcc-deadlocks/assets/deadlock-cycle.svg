<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A two-transaction deadlock</text>

  <rect x="60" y="70" width="130" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="125" y="100" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">T1</text>

  <rect x="450" y="70" width="130" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="515" y="100" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">T2</text>

  <rect x="255" y="70" width="130" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="100" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">row A</text>

  <rect x="255" y="220" width="130" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="250" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">row B</text>

  <line x1="190" y1="90" x2="251" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="80" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">holds</text>

  <path d="M 320 120 L 320 180 Q 320 200 340 210 L 446 245" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowAccent)"/>
  <text x="330" y="175" font-size="10" fill="var(--dg-muted, #5F6368)">waits on</text>

  <line x1="450" y1="245" x2="389" y2="245" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="235" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">holds</text>

  <path d="M 515 66 Q 515 20 320 20 Q 200 20 125 65" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowAccent)"/>
  <text x="320" y="40" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">waits on</text>

  <text x="320" y="300" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Cycle: T1 -&gt; row B -&gt; T2 -&gt; row A -&gt; T1</text>
  <text x="320" y="320" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">money transfer: T1 does A-then-B, T2 does B-then-A concurrently</text>
</svg>
