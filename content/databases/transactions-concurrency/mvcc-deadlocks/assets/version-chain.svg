<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">One row, three versions</text>

  <rect x="60" y="70" width="150" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="135" y="92" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">v1</text>
  <text x="135" y="108" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">created T1 - superseded T2</text>

  <line x1="210" y1="98" x2="248" y2="98" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="248" y="70" width="150" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="323" y="92" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">v2</text>
  <text x="323" y="108" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">created T2 - superseded T5</text>

  <line x1="398" y1="98" x2="436" y2="98" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="436" y="70" width="150" height="56" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="511" y="92" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">v3</text>
  <text x="511" y="108" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">created T5 - still current</text>

  <line x1="323" y1="180" x2="323" y2="290" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="323" y="200" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">snapshot A (older)</text>
  <path d="M 323 210 L 323 150 L 323 126" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)" stroke-width="1.5"/>

  <line x1="511" y1="180" x2="511" y2="290" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="511" y="200" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">snapshot B (newer)</text>
  <path d="M 511 210 L 511 150 L 511 126" fill="none" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrowAccent)" stroke-width="1.5"/>

  <text x="323" y="308" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">reads v2</text>
  <text x="511" y="308" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">reads v3</text>

  <text x="320" y="250" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Two concurrent readers, two different consistent answers - neither blocks the other.</text>
</svg>
