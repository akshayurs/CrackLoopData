<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Hash join: build then probe</text>

  <text x="120" y="42" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">BUILD</text>
  <rect x="20" y="52" width="90" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="65" y="71" text-anchor="middle" font-size="10">smaller table</text>

  <line x1="110" y1="67" x2="150" y2="67" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="150" y="90" width="140" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="220" y="112" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">hash table</text>
  <text x="220" y="128" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">keyed by join</text>
  <text x="220" y="140" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">column</text>

  <text x="480" y="42" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">PROBE</text>
  <rect x="380" y="52" width="90" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="425" y="71" text-anchor="middle" font-size="10">larger table</text>

  <line x1="380" y1="67" x2="300" y2="105" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="300" y1="130" x2="450" y2="130" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="380" y="120" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">match found</text>

  <rect x="450" y="112" width="130" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="515" y="134" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">joined output</text>

  <text x="320" y="195" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The build side fully materializes before probing starts.</text>
</svg>
