<svg viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">SQL text to executed plan</text>

  <rect x="10" y="60" width="90" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="55" y="84" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">SQL text</text>

  <rect x="130" y="60" width="110" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="185" y="78" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Parser</text>
  <text x="185" y="92" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">syntax tree</text>

  <rect x="270" y="60" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="330" y="78" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Rewriter</text>
  <text x="330" y="92" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">logical plan</text>

  <rect x="420" y="52" width="130" height="56" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="485" y="72" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Optimizer</text>
  <text x="485" y="86" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">physical plan,</text>
  <text x="485" y="98" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">join order + algorithm</text>

  <rect x="570" y="60" width="60" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="600" y="78" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Exec</text>
  <text x="600" y="92" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">rows</text>

  <g stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)">
    <line x1="100" y1="80" x2="126" y2="80"/>
    <line x1="240" y1="80" x2="266" y2="80"/>
    <line x1="390" y1="80" x2="416" y2="80"/>
    <line x1="550" y1="80" x2="566" y2="80"/>
  </g>

  <text x="485" y="132" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="600">uses table statistics here</text>
  <line x1="485" y1="108" x2="485" y2="122" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>

  <text x="320" y="160" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Only the optimizer consults statistics to pick algorithms.</text>
</svg>
