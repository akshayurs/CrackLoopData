<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">From statistics to a chosen plan</text>

  <rect x="10" y="50" width="130" height="52" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="70" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Table statistics</text>
  <text x="75" y="84" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">counts, histograms,</text>
  <text x="75" y="94" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">common values</text>

  <rect x="170" y="50" width="130" height="52" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="235" y="72" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Cardinality</text>
  <text x="235" y="86" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">estimates for</text>
  <text x="235" y="96" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">predicates</text>

  <rect x="330" y="50" width="130" height="52" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="395" y="72" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Cost model</text>
  <text x="395" y="86" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">per-operator</text>
  <text x="395" y="96" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">cost formulas</text>

  <rect x="490" y="50" width="140" height="52" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="560" y="72" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Cheapest plan</text>
  <text x="560" y="88" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">chosen physical plan</text>

  <g stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)">
    <line x1="140" y1="76" x2="166" y2="76"/>
    <line x1="300" y1="76" x2="326" y2="76"/>
    <line x1="460" y1="76" x2="486" y2="76"/>
  </g>

  <path d="M 235 102 C 235 140, 335 150, 335 145" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-accent)"/>
  <text x="285" y="140" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">stale stats or column</text>
  <text x="285" y="152" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">correlation -&gt; wrong estimate</text>
  <text x="285" y="164" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">-&gt; wrong plan</text>

  <text x="320" y="200" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A wrong number at any stage propagates uncorrected to the plan.</text>
</svg>
