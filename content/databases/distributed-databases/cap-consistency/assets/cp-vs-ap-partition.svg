<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Choice during a network partition</text>

  <g>
    <text x="150" y="42" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">CP</text>
    <rect x="30" y="50" width="60" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="60" y="74" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Client</text>
    <line x1="90" y1="70" x2="120" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <rect x="120" y="50" width="70" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="155" y="74" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Left node</text>

    <line x1="200" y1="70" x2="200" y2="120" stroke="var(--dg-line, #5F6368)" stroke-dasharray="5,4"/>
    <line x1="200" y1="70" x2="200" y2="20" stroke="var(--dg-line, #5F6368)" stroke-dasharray="5,4"/>
    <text x="200" y="112" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">link down</text>

    <rect x="210" y="50" width="70" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="245" y="74" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Right node</text>

    <rect x="20" y="130" width="270" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="155" y="154" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Write refused</text>
    <text x="155" y="172" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">can't confirm right side is in sync</text>
  </g>

  <g>
    <text x="490" y="42" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">AP</text>
    <rect x="370" y="50" width="60" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="400" y="74" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Client</text>
    <line x1="430" y1="70" x2="460" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <rect x="460" y="50" width="70" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="495" y="74" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Left node</text>

    <line x1="540" y1="70" x2="540" y2="120" stroke="var(--dg-line, #5F6368)" stroke-dasharray="5,4"/>
    <line x1="540" y1="70" x2="540" y2="20" stroke="var(--dg-line, #5F6368)" stroke-dasharray="5,4"/>
    <text x="540" y="112" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">link down</text>

    <rect x="550" y="50" width="70" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="585" y="74" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Right node</text>

    <rect x="360" y="130" width="270" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="495" y="154" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Write accepted</text>
    <text x="495" y="172" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">sides disagree until partition heals</text>
  </g>

  <text x="320" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">CP refuses to risk inconsistency; AP refuses to risk unavailability.</text>
</svg>
