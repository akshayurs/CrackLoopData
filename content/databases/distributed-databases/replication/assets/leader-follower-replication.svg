<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Leader/follower replication</text>

  <rect x="20" y="90" width="80" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="114" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Client</text>

  <line x1="100" y1="110" x2="150" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="125" y="102" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">write</text>

  <rect x="150" y="80" width="150" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="225" y="102" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Leader</text>
  <text x="225" y="120" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">WAL pos 10</text>

  <line x1="300" y1="100" x2="420" y2="60" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="300" y1="120" x2="420" y2="180" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="345" y="70" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">stream WAL</text>
  <text x="345" y="205" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">stream WAL</text>

  <rect x="420" y="30" width="180" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="510" y="52" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Follower A</text>
  <text x="510" y="70" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">WAL pos 10 (caught up)</text>

  <rect x="420" y="150" width="180" height="70" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="510" y="172" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Follower B</text>
  <text x="510" y="190" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">WAL pos 8</text>
  <text x="510" y="207" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">lag: 2 positions behind</text>

  <text x="320" y="280" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Leader accepts the next write without waiting for followers to apply the last one.</text>
</svg>
