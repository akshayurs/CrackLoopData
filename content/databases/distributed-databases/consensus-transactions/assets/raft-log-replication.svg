<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="240" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Raft log replication</text>

  <rect x="180" y="40" width="120" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="240" y="66" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Leader (Node 1)</text>

  <line x1="240" y1="82" x2="70" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="240" y1="82" x2="200" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="240" y1="82" x2="290" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="240" y1="82" x2="410" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="240" y="102" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">appends entry, streams to followers</text>

  <rect x="20" y="132" width="100" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="70" y="152" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Node 2</text>
  <text x="70" y="168" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">stored</text>

  <rect x="150" y="132" width="100" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="200" y="152" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Node 3</text>
  <text x="200" y="168" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">stored</text>

  <rect x="240" y="132" width="100" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="290" y="152" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Node 4</text>
  <text x="290" y="168" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">pending</text>

  <rect x="360" y="132" width="100" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="410" y="152" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Node 5</text>
  <text x="410" y="168" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">pending</text>

  <rect x="130" y="210" width="220" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="240" y="234" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">check: 3 of 5 durably stored</text>
  <text x="240" y="250" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">entry committed</text>

  <text x="240" y="285" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Majority ack -&gt; committed, even before the last two catch up.</text>
</svg>
