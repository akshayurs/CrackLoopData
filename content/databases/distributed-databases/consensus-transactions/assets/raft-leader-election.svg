<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="240" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Raft leader election (term 7)</text>

  <circle cx="240" cy="90" r="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="240" y="86" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Node 1</text>
  <text x="240" y="100" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">candidate</text>

  <circle cx="80" cy="200" r="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="204" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Node 2</text>
  <circle cx="185" cy="230" r="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="185" y="234" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Node 3</text>
  <circle cx="300" cy="230" r="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="300" y="234" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Node 4</text>
  <circle cx="400" cy="200" r="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="400" y="204" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Node 5</text>

  <line x1="215" y1="115" x2="100" y2="178" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="222" y1="120" x2="195" y2="203" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="258" y1="120" x2="290" y2="203" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="265" y1="115" x2="385" y2="178" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="240" y="150" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">requests votes</text>

  <text x="80" y="240" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">vote granted</text>
  <text x="185" y="270" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">vote granted</text>
  <text x="400" y="240" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">no reply</text>

  <text x="240" y="300" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">3 of 5 votes -&gt; Node 1 becomes leader</text>
</svg>
