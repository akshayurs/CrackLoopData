<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">hash(user_id) mod 3</text>

  <rect x="230" y="42" width="180" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">users table</text>
  <text x="320" y="78" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">rows 0-8 by user_id</text>

  <line x1="320" y1="88" x2="150" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="320" y1="88" x2="320" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="320" y1="88" x2="490" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <g>
    <rect x="70" y="146" width="160" height="150" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="150" y="168" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Shard 0</text>
    <text x="150" y="188" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">hash mod 3 == 0</text>
    <text x="150" y="216" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">user_id 0 (hash 0)</text>
    <text x="150" y="236" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">user_id 3 (hash 3)</text>
    <text x="150" y="256" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">user_id 6 (hash 6)</text>
  </g>

  <g>
    <rect x="240" y="146" width="160" height="150" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="320" y="168" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Shard 1</text>
    <text x="320" y="188" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">hash mod 3 == 1</text>
    <text x="320" y="216" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">user_id 1 (hash 1)</text>
    <text x="320" y="236" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">user_id 4 (hash 4)</text>
    <text x="320" y="256" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">user_id 7 (hash 7)</text>
  </g>

  <g>
    <rect x="410" y="146" width="160" height="150" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="490" y="168" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Shard 2</text>
    <text x="490" y="188" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">hash mod 3 == 2</text>
    <text x="490" y="216" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">user_id 2 (hash 2)</text>
    <text x="490" y="236" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">user_id 5 (hash 5)</text>
    <text x="490" y="256" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">user_id 8 (hash 8)</text>
  </g>

  <text x="320" y="322" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Adjacent user_ids scatter across shards instead of landing on one.</text>
</svg>
