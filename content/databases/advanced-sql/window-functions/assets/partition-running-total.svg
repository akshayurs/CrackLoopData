<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Running total resets per partition</text>

  <text x="160" y="44" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">PARTITION BY region = East</text>
  <g font-size="11" fill="var(--dg-ink, #202124)">
    <rect x="40" y="54" width="90" height="30" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="85" y="73" text-anchor="middle">order 1</text>
    <rect x="140" y="54" width="90" height="30" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="185" y="73" text-anchor="middle">order 2</text>
    <rect x="240" y="54" width="90" height="30" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="285" y="73" text-anchor="middle">order 3</text>
  </g>
  <g font-size="10" fill="var(--dg-muted, #5F6368)">
    <text x="85" y="98" text-anchor="middle">running: 100</text>
    <text x="185" y="98" text-anchor="middle">running: 260</text>
    <text x="285" y="98" text-anchor="middle">running: 310</text>
  </g>

  <line x1="20" y1="115" x2="620" y2="115" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3"/>

  <text x="470" y="140" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">PARTITION BY region = West</text>
  <g font-size="11" fill="var(--dg-ink, #202124)">
    <rect x="380" y="150" width="90" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="425" y="169" text-anchor="middle">order 4</text>
    <rect x="480" y="150" width="90" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="525" y="169" text-anchor="middle">order 5</text>
  </g>
  <g font-size="10" fill="var(--dg-muted, #5F6368)">
    <text x="425" y="194" text-anchor="middle" font-weight="600">running: 80</text>
    <text x="525" y="194" text-anchor="middle">running: 210</text>
  </g>
  <text x="425" y="180" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600"> </text>

  <text x="320" y="225" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">West's total restarts at zero, independent of East.</text>
</svg>
