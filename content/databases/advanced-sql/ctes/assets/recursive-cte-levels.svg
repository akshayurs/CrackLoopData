<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Recursive CTE: one level per pass</text>

  <rect x="270" y="42" width="100" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="63" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">CEO</text>
  <text x="320" y="35" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">iteration 1</text>

  <line x1="290" y1="76" x2="220" y2="112" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="350" y1="76" x2="420" y2="112" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="160" y="112" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="220" y="133" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">VP 1</text>
  <rect x="360" y="112" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="420" y="133" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">VP 2</text>
  <text x="320" y="105" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">iteration 2</text>

  <line x1="200" y1="146" x2="150" y2="182" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="240" y1="146" x2="270" y2="182" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="400" y1="146" x2="370" y2="182" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="440" y1="146" x2="490" y2="182" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <g font-size="10" fill="var(--dg-ink, #202124)">
    <rect x="100" y="182" width="100" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="150" y="201" text-anchor="middle">Manager 1</text>
    <rect x="220" y="182" width="100" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="270" y="201" text-anchor="middle">Manager 2</text>
    <rect x="320" y="182" width="100" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="370" y="201" text-anchor="middle">Manager 3</text>
    <rect x="440" y="182" width="100" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="490" y="201" text-anchor="middle">Manager 4</text>
  </g>
  <text x="565" y="175" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">iteration 3</text>
</svg>
