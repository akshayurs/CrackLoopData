<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Join types as overlapping sets</text>

  <g>
    <text x="80" y="42" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">INNER JOIN</text>
    <circle cx="65" cy="90" r="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <circle cx="95" cy="90" r="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <path d="M 80 62 A 34 34 0 0 1 80 118 A 34 34 0 0 1 80 62 Z" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="50" y="94" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">A</text>
    <text x="110" y="94" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">B</text>
  </g>

  <g>
    <text x="240" y="42" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">LEFT JOIN</text>
    <circle cx="225" cy="90" r="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <circle cx="255" cy="90" r="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <path d="M 240 62 A 34 34 0 0 1 240 118 A 34 34 0 0 1 240 62 Z" fill="var(--dg-accent-bg, #E3F3F1)" stroke="none"/>
    <text x="210" y="94" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">A</text>
    <text x="270" y="94" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">B</text>
  </g>

  <g>
    <text x="400" y="42" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">RIGHT JOIN</text>
    <circle cx="385" cy="90" r="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <circle cx="415" cy="90" r="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <path d="M 400 62 A 34 34 0 0 1 400 118 A 34 34 0 0 1 400 62 Z" fill="var(--dg-accent-bg, #E3F3F1)" stroke="none"/>
    <text x="370" y="94" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">A</text>
    <text x="430" y="94" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">B</text>
  </g>

  <g>
    <text x="560" y="42" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">FULL OUTER</text>
    <circle cx="545" cy="90" r="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <circle cx="575" cy="90" r="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="530" y="94" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">A</text>
    <text x="590" y="94" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">B</text>
  </g>

  <text x="320" y="180" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The shaded region is exactly what survives into the result.</text>
</svg>
