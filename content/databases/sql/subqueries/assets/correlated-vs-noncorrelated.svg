<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Correlated vs non-correlated</text>

  <text x="150" y="48" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">Correlated</text>
  <rect x="40" y="60" width="90" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="85" y="77" text-anchor="middle" font-size="11">outer row 1</text>
  <rect x="40" y="94" width="90" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="85" y="111" text-anchor="middle" font-size="11">outer row 2</text>
  <rect x="40" y="128" width="90" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="85" y="145" text-anchor="middle" font-size="11">outer row 3</text>

  <rect x="180" y="90" width="120" height="44" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="240" y="108" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">subquery</text>
  <text x="240" y="123" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">runs per row</text>

  <line x1="130" y1="73" x2="180" y2="100" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <line x1="130" y1="107" x2="180" y2="112" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <line x1="130" y1="141" x2="180" y2="124" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <path d="M 300 100 C 340 70, 340 160, 130 160 L 130 155" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-accent)"/>
  <text x="330" y="60" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">feeds back into</text>
  <text x="330" y="72" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">that row's WHERE test</text>

  <line x1="20" y1="185" x2="620" y2="185" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>

  <text x="150" y="210" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Non-correlated</text>
  <rect x="40" y="222" width="90" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="85" y="239" text-anchor="middle" font-size="11">outer row 1</text>
  <rect x="40" y="256" width="90" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="85" y="273" text-anchor="middle" font-size="11">outer row 2</text>
  <rect x="40" y="290" width="90" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="85" y="307" text-anchor="middle" font-size="11">outer row 3</text>

  <rect x="180" y="252" width="120" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="270" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">subquery</text>
  <text x="240" y="285" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">one fixed value</text>

  <line x1="130" y1="235" x2="180" y2="266" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="130" y1="269" x2="180" y2="274" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="130" y1="303" x2="180" y2="282" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
</svg>
