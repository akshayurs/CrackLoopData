<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">GROUP BY customer_id</text>

  <text x="90" y="46" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">8 order rows</text>
  <g font-size="11" fill="var(--dg-ink, #202124)">
    <rect x="30" y="56" width="120" height="20" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="90" y="70" text-anchor="middle">order 1 - A</text>
    <rect x="30" y="80" width="120" height="20" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="90" y="94" text-anchor="middle">order 2 - A</text>
    <rect x="30" y="104" width="120" height="20" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="90" y="118" text-anchor="middle">order 3 - A</text>
    <rect x="30" y="128" width="120" height="20" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="90" y="142" text-anchor="middle">order 4 - B</text>
    <rect x="30" y="152" width="120" height="20" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="90" y="166" text-anchor="middle">order 5 - B</text>
    <rect x="30" y="176" width="120" height="20" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="90" y="190" text-anchor="middle">order 6 - B</text>
    <rect x="30" y="200" width="120" height="20" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="90" y="214" text-anchor="middle">order 7 - C</text>
    <rect x="30" y="224" width="120" height="20" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="90" y="238" text-anchor="middle">order 8 - C</text>
  </g>

  <line x1="160" y1="146" x2="260" y2="146" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="132" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">GROUP BY</text>

  <text x="470" y="46" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">3 summary rows</text>
  <g font-size="12" fill="var(--dg-ink, #202124)">
    <rect x="380" y="60" width="180" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="470" y="76" text-anchor="middle" font-weight="600">customer A</text>
    <text x="470" y="92" text-anchor="middle" font-size="11">COUNT 3, SUM total</text>

    <rect x="380" y="132" width="180" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="470" y="148" text-anchor="middle" font-weight="600">customer B</text>
    <text x="470" y="164" text-anchor="middle" font-size="11">COUNT 3, SUM total</text>

    <rect x="380" y="204" width="180" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="470" y="220" text-anchor="middle" font-weight="600">customer C</text>
    <text x="470" y="236" text-anchor="middle" font-size="11">COUNT 2, SUM total</text>
  </g>

  <text x="320" y="280" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Rows sharing a key collapse into one row per group.</text>
</svg>
