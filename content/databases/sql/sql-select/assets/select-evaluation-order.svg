<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Logical evaluation order</text>

  <g font-size="11">
    <rect x="10" y="60" width="68" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="44" y="82" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">FROM</text>
    <text x="44" y="112" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">raw rows</text>

    <rect x="86" y="60" width="68" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="120" y="82" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">WHERE</text>
    <text x="120" y="112" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">filtered rows</text>

    <rect x="162" y="60" width="76" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="200" y="82" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">GROUP BY</text>
    <text x="200" y="112" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">groups</text>

    <rect x="246" y="60" width="76" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="284" y="82" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">HAVING</text>
    <text x="284" y="112" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">filtered groups</text>

    <rect x="330" y="60" width="80" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="370" y="82" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">SELECT</text>
    <text x="370" y="112" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">projected cols</text>

    <rect x="418" y="60" width="80" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="458" y="82" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">DISTINCT</text>
    <text x="458" y="112" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">deduped rows</text>

    <rect x="506" y="60" width="72" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="542" y="82" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">ORDER BY</text>
    <text x="542" y="112" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">sorted rows</text>

    <rect x="586" y="60" width="48" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="610" y="82" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">LIMIT</text>
    <text x="610" y="112" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">capped rows</text>
  </g>

  <g stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)">
    <line x1="78" y1="80" x2="84" y2="80"/>
    <line x1="154" y1="80" x2="160" y2="80"/>
    <line x1="238" y1="80" x2="244" y2="80"/>
    <line x1="322" y1="80" x2="328" y2="80"/>
    <line x1="410" y1="80" x2="416" y2="80"/>
    <line x1="498" y1="80" x2="504" y2="80"/>
    <line x1="578" y1="80" x2="584" y2="80"/>
  </g>

  <text x="320" y="150" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each box only sees the previous box's output.</text>
</svg>
