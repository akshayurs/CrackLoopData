<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">price * quantity * (1 - discount)</text>

  <text x="150" y="42" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">discount is NULL</text>
  <g font-size="11">
    <rect x="20" y="52" width="80" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="60" y="73" text-anchor="middle" fill="var(--dg-ink, #202124)">NULL</text>

    <rect x="130" y="52" width="90" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="175" y="73" text-anchor="middle" fill="var(--dg-ink, #202124)">1 - discount</text>

    <rect x="250" y="52" width="90" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="295" y="73" text-anchor="middle" fill="var(--dg-ink, #202124)">quantity *</text>

    <rect x="370" y="52" width="90" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="415" y="73" text-anchor="middle" fill="var(--dg-ink, #202124)">price *</text>

    <rect x="490" y="52" width="120" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="550" y="73" text-anchor="middle" font-weight="600" fill="var(--dg-ink, #202124)">result: NULL</text>
  </g>
  <g stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow-accent)">
    <line x1="100" y1="69" x2="126" y2="69"/>
    <line x1="220" y1="69" x2="246" y2="69"/>
    <line x1="340" y1="69" x2="366" y2="69"/>
    <line x1="460" y1="69" x2="486" y2="69"/>
  </g>
  <text x="330" y="105" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">NULL poisons every downstream operation</text>

  <text x="150" y="145" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">discount is 0</text>
  <g font-size="11">
    <rect x="20" y="155" width="80" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="60" y="176" text-anchor="middle" fill="var(--dg-ink, #202124)">0</text>

    <rect x="130" y="155" width="90" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="175" y="176" text-anchor="middle" fill="var(--dg-ink, #202124)">1 - discount</text>

    <rect x="250" y="155" width="90" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="295" y="176" text-anchor="middle" fill="var(--dg-ink, #202124)">quantity *</text>

    <rect x="370" y="155" width="90" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="415" y="176" text-anchor="middle" fill="var(--dg-ink, #202124)">price *</text>

    <rect x="490" y="155" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="550" y="176" text-anchor="middle" font-weight="600" fill="var(--dg-ink, #202124)">result: 42.50</text>
  </g>
  <g stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="100" y1="172" x2="126" y2="172"/>
    <line x1="220" y1="172" x2="246" y2="172"/>
    <line x1="340" y1="172" x2="366" y2="172"/>
    <line x1="460" y1="172" x2="486" y2="172"/>
  </g>

  <text x="320" y="235" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">One NULL operand makes the whole expression NULL.</text>
</svg>
