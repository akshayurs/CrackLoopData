<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Pagination latency by page depth</text>

  <line x1="70" y1="240" x2="580" y2="240" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="70" y1="240" x2="70" y2="50" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="325" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">page number</text>
  <text x="30" y="145" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" transform="rotate(-90 30 145)">query latency</text>

  <polyline points="70,225 170,195 270,160 370,120 470,80 570,55" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>
  <text x="500" y="70" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">OFFSET</text>

  <polyline points="70,222 170,220 270,220 370,219 470,220 570,218" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="2.5"/>
  <text x="480" y="235" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">keyset</text>

  <text x="320" y="290" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Keyset seeks directly via an index; OFFSET still walks every earlier row.</text>
</svg>
