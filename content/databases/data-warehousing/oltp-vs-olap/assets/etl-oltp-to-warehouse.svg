<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">OLTP to warehouse via ETL</text>

  <rect x="20" y="50" width="110" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="71" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Orders DB</text>
  <rect x="20" y="98" width="110" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="119" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Users DB</text>
  <rect x="20" y="146" width="110" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="167" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Payments DB</text>
  <text x="75" y="196" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">OLTP apps</text>

  <line x1="130" y1="67" x2="230" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="130" y1="115" x2="230" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="130" y1="163" x2="230" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="230" y="90" width="110" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="285" y="112" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">ETL / ELT</text>
  <text x="285" y="128" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">pipeline</text>

  <line x1="340" y1="115" x2="430" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="430" y="90" width="120" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="112" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Data warehouse</text>
  <text x="490" y="128" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">OLAP store</text>

  <line x1="500" y1="90" x2="470" y2="40" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="500" y1="140" x2="470" y2="190" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="410" y="10" width="120" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="470" y="30" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">BI dashboard</text>

  <rect x="410" y="190" width="120" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="470" y="210" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">DS notebook</text>

  <text x="320" y="268" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Reports and notebooks query the warehouse — never the live OLTP databases.</text>
</svg>
