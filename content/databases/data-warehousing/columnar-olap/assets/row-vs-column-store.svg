<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Row-store vs column-store</text>

  <rect x="230" y="40" width="180" height="66" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="56" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">id</text>
  <text x="320" y="70" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">1 · 2 · 3</text>
  <text x="320" y="88" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">name / amount cols too</text>
  <text x="320" y="102" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">3 rows x 3 cols</text>

  <line x1="320" y1="106" x2="320" y2="128" stroke="var(--dg-line, #5F6368)"/>
  <line x1="150" y1="128" x2="490" y2="128" stroke="var(--dg-line, #5F6368)"/>
  <line x1="150" y1="128" x2="150" y2="146" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="490" y1="128" x2="490" y2="146" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="150" y="164" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Row-store</text>
  <rect x="40" y="176" width="220" height="30" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="150" y="195" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">row1: id, name, amount</text>
  <rect x="40" y="212" width="220" height="30" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="150" y="231" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">row2: id, name, amount</text>
  <rect x="40" y="248" width="220" height="30" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="150" y="267" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">row3: id, name, amount</text>
  <text x="150" y="296" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">bytes = complete rows in sequence</text>

  <text x="490" y="164" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Column-store</text>
  <rect x="380" y="176" width="220" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="195" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">id: 1, 2, 3</text>
  <rect x="380" y="212" width="220" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="231" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">name: a, b, c</text>
  <rect x="380" y="248" width="220" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="267" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">amount: 10, 20, 30</text>
  <text x="490" y="296" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">bytes = complete columns in sequence</text>

  <text x="320" y="326" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Same logical table, opposite physical byte order on disk.</text>
</svg>
