<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Relational model terminology</text>

  <rect x="180" y="50" width="280" height="130" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3" rx="6"/>
  <text x="470" y="115" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">relation</text>

  <g font-size="11" fill="var(--dg-ink, #202124)">
    <rect x="180" y="50" width="93" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="226" y="67" text-anchor="middle" font-weight="600">id</text>
    <rect x="273" y="50" width="93" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="320" y="67" text-anchor="middle" font-weight="600">name</text>
    <rect x="366" y="50" width="94" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="413" y="67" text-anchor="middle" font-weight="600">dept</text>

    <rect x="180" y="76" width="93" height="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="226" y="93" text-anchor="middle">1</text>
    <rect x="273" y="76" width="93" height="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="320" y="93" text-anchor="middle">Ada</text>
    <rect x="366" y="76" width="94" height="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="413" y="93" text-anchor="middle">Eng</text>

    <rect x="180" y="102" width="93" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="226" y="119" text-anchor="middle">2</text>
    <rect x="273" y="102" width="93" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="320" y="119" text-anchor="middle">Lin</text>
    <rect x="366" y="102" width="94" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="413" y="119" text-anchor="middle">Sales</text>

    <rect x="180" y="128" width="93" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="226" y="145" text-anchor="middle">3</text>
    <rect x="273" y="128" width="93" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="320" y="145" text-anchor="middle">Zed</text>
    <rect x="366" y="128" width="94" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="413" y="145" text-anchor="middle">Legal</text>
  </g>

  <text x="90" y="93" text-anchor="end" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">tuple (row 1)</text>
  <line x1="95" y1="89" x2="176" y2="89" stroke="var(--dg-accent, #0C8F88)" stroke-width="1" stroke-dasharray="3 2"/>

  <text x="226" y="35" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">attribute (id)</text>

  <text x="500" y="145" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">domain of dept:</text>
  <text x="500" y="160" font-size="10" fill="var(--dg-muted, #5F6368)">{ Eng, Sales, Legal }</text>

  <text x="320" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">table -&gt; relation, row -&gt; tuple, column -&gt; attribute.</text>
</svg>
