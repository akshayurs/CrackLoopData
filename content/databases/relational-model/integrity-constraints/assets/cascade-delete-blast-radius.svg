<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">ON DELETE CASCADE blast radius</text>

  <rect x="270" y="42" width="100" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Posts</text>
  <text x="320" y="75" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">post 1 (deleted)</text>

  <line x1="290" y1="82" x2="140" y2="140" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <line x1="350" y1="82" x2="500" y2="140" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <rect x="70" y="150" width="140" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="140" y="170" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Comments</text>
  <text x="140" y="186" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">3 rows removed</text>

  <rect x="430" y="150" width="140" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="500" y="170" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Likes</text>
  <text x="500" y="186" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">5 rows removed</text>

  <text x="320" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Deleting one post cascades to 9 rows across 3 tables.</text>
</svg>
