<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Query as an operator tree</text>

  <rect x="270" y="40" width="100" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">projection (name)</text>

  <line x1="320" y1="74" x2="320" y2="100" stroke="var(--dg-line, #5F6368)"/>

  <rect x="240" y="100" width="160" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="122" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">selection (total &gt; 100)</text>

  <line x1="320" y1="134" x2="320" y2="160" stroke="var(--dg-line, #5F6368)"/>

  <rect x="200" y="160" width="240" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="182" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">join (customer_id = id)</text>

  <line x1="270" y1="194" x2="180" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="370" y1="194" x2="460" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="120" y="226" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="180" y="248" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">orders</text>

  <rect x="400" y="226" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="460" y="248" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">customers</text>

  <text x="320" y="15" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)"> </text>
</svg>
