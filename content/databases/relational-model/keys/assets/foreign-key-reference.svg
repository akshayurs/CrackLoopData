<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Foreign key references a primary key</text>

  <rect x="60" y="60" width="200" height="80" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="82" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Orders</text>
  <text x="160" y="102" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">id</text>
  <rect x="90" y="112" width="140" height="22" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="160" y="127" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">customer_id</text>

  <rect x="380" y="60" width="200" height="80" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="480" y="82" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Customers</text>
  <rect x="410" y="92" width="140" height="22" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="480" y="107" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">id (primary key)</text>
  <text x="480" y="130" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">name, ...</text>

  <line x1="260" y1="123" x2="376" y2="103" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="100" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">references</text>

  <text x="320" y="180" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Every customer_id in Orders must exist as an id in Customers.</text>
</svg>
