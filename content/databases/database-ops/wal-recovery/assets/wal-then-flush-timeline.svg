<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">WAL write, then delayed page flush</text>

  <line x1="40" y1="150" x2="600" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>

  <circle cx="120" cy="150" r="5" fill="var(--dg-accent, #0C8F88)"/>
  <rect x="60" y="90" width="120" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="120" y="108" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Step 1: WAL</text>
  <text x="120" y="122" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">append + fsync</text>
  <text x="120" y="134" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="600">✓ durable</text>
  <line x1="120" y1="136" x2="120" y2="145" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow-accent)"/>

  <path d="M270,150 L290,130 L300,150 L280,150 L290,170 Z" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="290" y="195" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">crash</text>
  <text x="290" y="210" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">(page not yet</text>
  <text x="290" y="222" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">on disk)</text>

  <text x="290" y="248" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">recovery replays the WAL</text>
  <text x="290" y="261" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">record to redo this change</text>

  <line x1="145" y1="150" x2="500" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="6,5" marker-end="url(#arrow)"/>

  <circle cx="500" cy="150" r="5" fill="var(--dg-ink, #202124)"/>
  <rect x="440" y="90" width="120" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="108" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Step 2: flush</text>
  <text x="500" y="122" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">buffer pool page</text>
  <text x="500" y="134" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">to data file</text>
  <line x1="500" y1="136" x2="500" y2="145" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="320" y="278" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Log fsync is cheap and sequential; the data page write can wait.</text>
</svg>
