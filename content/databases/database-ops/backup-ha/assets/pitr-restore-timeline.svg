<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Point-in-time restore</text>

  <line x1="60" y1="120" x2="580" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>

  <circle cx="80" cy="120" r="5" fill="var(--dg-ink, #202124)"/>
  <text x="80" y="100" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Full backup</text>
  <text x="80" y="146" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">midnight</text>

  <rect x="110" y="112" width="360" height="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="290" y="105" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">archived WAL stream</text>

  <line x1="420" y1="80" x2="420" y2="112" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3,3"/>
  <text x="420" y="70" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">14:31:59</text>
  <text x="420" y="56" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">target restore point</text>

  <line x1="450" y1="80" x2="450" y2="112" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,3"/>
  <text x="450" y="196" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">14:32</text>
  <text x="450" y="210" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">accidental</text>
  <text x="450" y="223" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">DROP TABLE</text>
  <line x1="450" y1="128" x2="450" y2="180" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4,3"/>

  <path d="M80,180 C 200,220 320,220 420,180" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="250" y="242" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">restore full backup, replay WAL forward</text>
  <text x="250" y="256" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">stop exactly at 14:31:59</text>
