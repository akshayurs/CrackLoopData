<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">ER diagram to SQL tables</text>

  <text x="120" y="46" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">ER diagram</text>
  <rect x="40" y="60" width="90" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="85" y="82" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Customer</text>
  <rect x="150" y="60" width="90" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="195" y="82" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Order</text>
  <line x1="130" y1="78" x2="150" y2="78" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="140" y="70" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">1:N</text>

  <line x1="480" y1="78" x2="530" y2="78" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="560" y="46" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">SQL tables</text>
  <rect x="540" y="60" width="90" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="585" y="78" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Customer</text>
  <text x="585" y="94" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">id (PK)</text>

  <rect x="540" y="130" width="90" height="60" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="585" y="148" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Order</text>
  <text x="585" y="164" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">id (PK)</text>
  <text x="585" y="178" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">customer_id (FK)</text>

  <path d="M 585 106 C 585 118, 585 118, 585 128" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <text x="320" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A 1:N relationship becomes a foreign key on the "many" side.</text>
</svg>
