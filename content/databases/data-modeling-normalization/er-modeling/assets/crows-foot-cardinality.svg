<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Crow's-foot cardinality</text>

  <rect x="30" y="80" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="107" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Customer</text>

  <rect x="260" y="80" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="325" y="107" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Order</text>

  <line x1="160" y1="103" x2="256" y2="103" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="185" y1="95" x2="185" y2="111" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <path d="M 250 103 L 232 92 M 250 103 L 232 103 M 250 103 L 232 114" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="220" y="130" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">one to many</text>

  <rect x="480" y="80" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="545" y="107" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Product</text>

  <line x1="390" y1="103" x2="476" y2="103" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <path d="M 396 103 L 414 92 M 396 103 L 414 103 M 396 103 L 414 114" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <path d="M 474 103 L 456 92 M 474 103 L 456 103 M 474 103 L 456 114" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="433" y="130" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">many to many</text>
  <text x="433" y="145" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="600">needs junction table</text>

  <text x="320" y="185" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A single bar means one; a crow's-foot means many.</text>
</svg>
