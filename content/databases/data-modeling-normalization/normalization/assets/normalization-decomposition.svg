<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Normalization by decomposition</text>

  <text x="120" y="40" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">1NF/2NF violation</text>
  <rect x="30" y="50" width="180" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="120" y="68" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Enroll</text>
  <text x="120" y="82" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">student, course, instructor,</text>
  <text x="120" y="92" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">repeating phone_numbers</text>

  <line x1="210" y1="73" x2="250" y2="73" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="63" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">fix 1NF</text>

  <text x="330" y="40" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">after 1NF + 2NF</text>
  <rect x="260" y="50" width="100" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="310" y="69" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Students</text>
  <rect x="260" y="86" width="100" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="310" y="105" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Enrollments</text>
  <rect x="260" y="122" width="100" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="310" y="141" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Courses + instructor</text>

  <line x1="360" y1="137" x2="400" y2="137" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="127" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">fix 3NF</text>

  <text x="500" y="40" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">after 3NF</text>
  <rect x="410" y="50" width="100" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="460" y="69" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Students</text>
  <rect x="410" y="86" width="100" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="460" y="105" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Enrollments</text>
  <rect x="410" y="122" width="100" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="460" y="141" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Courses</text>
  <rect x="410" y="158" width="100" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="460" y="177" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Instructors</text>

  <text x="320" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each split removes exactly one class of anomaly.</text>
</svg>
