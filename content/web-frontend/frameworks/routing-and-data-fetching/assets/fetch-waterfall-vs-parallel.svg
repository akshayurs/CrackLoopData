<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/></marker>
<marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/></marker>
</defs>
<text x="320.0" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Fetch-on-render vs render-as-you-fetch</text>
<text x="20" y="60" text-anchor="start" font-size="10.5" fill="var(--dg-ink, #202124)" font-weight="600">waterfall</text>
<rect x="80" y="45" width="150" height="28" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="155.0" y="63.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Page renders</text>
<rect x="230" y="45" width="150" height="28" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="305.0" y="63.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">fetch user</text>
<rect x="380" y="45" width="150" height="28" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="455.0" y="63.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Profile renders + fetch posts</text>
<text x="320" y="95" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">total = sum of all three</text>
<text x="20" y="190" text-anchor="start" font-size="10.5" fill="var(--dg-ink, #202124)" font-weight="600">parallel loader</text>
<rect x="80" y="175" width="90" height="28" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="125.0" y="193.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Route matched</text>
<rect x="200" y="175" width="170" height="28" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="285.0" y="193.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">fetch user</text>
<rect x="200" y="215" width="170" height="28" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="285.0" y="233.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">fetch posts</text>
<rect x="200" y="255" width="170" height="28" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="285.0" y="273.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">page shell renders</text>
<line x1="170" y1="189" x2="198" y2="189" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<line x1="170" y1="189" x2="198" y2="229" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<line x1="170" y1="189" x2="198" y2="269" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<text x="370" y="300" text-anchor="middle" font-size="10.5" fill="var(--dg-accent, #0C8F88)" font-weight="400">total = the longer of the two, not the sum</text>
</svg>
