<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/></marker>
<marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/></marker>
</defs>
<text x="320.0" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Render, commit, paint, and effects</text>
<rect x="40" y="60" width="130" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="105.0" y="83.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Render</text>
<text x="105.0" y="99.0" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">(compute JSX)</text>
<rect x="190" y="60" width="130" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="255.0" y="83.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Commit</text>
<text x="255.0" y="99.0" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">(DOM updated)</text>
<rect x="340" y="60" width="130" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="405.0" y="89.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Browser paints</text>
<rect x="490" y="60" width="130" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="555.0" y="83.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">useEffect</text>
<text x="555.0" y="99.0" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">(async, after paint)</text>
<line x1="170" y1="85" x2="190" y2="85" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="320" y1="85" x2="340" y2="85" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="470" y1="85" x2="490" y2="85" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="190" y="180" width="130" height="44" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
<text x="255.0" y="200.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">useLayoutEffect</text>
<text x="255.0" y="216.0" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">runs here</text>
<line x1="255" y1="178" x2="255" y2="112" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<text x="255" y="240" text-anchor="middle" font-size="10.5" fill="var(--dg-accent, #0C8F88)" font-weight="400">blocks paint until it finishes</text>
</svg>
