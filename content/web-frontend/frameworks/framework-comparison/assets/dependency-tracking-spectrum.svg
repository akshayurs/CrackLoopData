<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/></marker>
<marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/></marker>
</defs>
<text x="320.0" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">When dependency tracking happens</text>
<line x1="60" y1="180" x2="580" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="120" cy="180" r="7" fill="var(--dg-accent, #0C8F88)"/>
<text x="120" y="155" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">React</text>
<text x="120" y="215" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">runtime, every render</text>
<text x="120" y="230" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">(re-run + diff)</text>
<circle cx="320" cy="180" r="7" fill="var(--dg-accent, #0C8F88)"/>
<text x="320" y="155" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">Vue</text>
<text x="320" y="215" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">runtime, once at setup</text>
<text x="320" y="230" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">(Proxy tracking)</text>
<circle cx="520" cy="180" r="7" fill="var(--dg-accent, #0C8F88)"/>
<text x="520" y="155" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">Svelte</text>
<text x="520" y="215" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">compile time, before</text>
<text x="520" y="230" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">app runs (static analysis)</text>
<line x1="120" y1="280" x2="520" y2="280" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<text x="320" y="300" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="400">work shifts earlier, left to right</text>
</svg>
