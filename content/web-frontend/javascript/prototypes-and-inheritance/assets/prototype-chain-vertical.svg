<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/></marker>
<marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/></marker>
</defs>
<text x="320.0" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The prototype chain, bottom to top</text>
<rect x="140" y="280" width="360" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="320.0" y="306.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">rex { name: 'Rex' }</text>
<text x="520" y="307" text-anchor="start" font-size="9.5" fill="var(--dg-muted, #5F6368)" font-weight="400">rex.bark() resolves through Dog.prototype</text>
<line x1="320" y1="280" x2="320" y2="254" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<rect x="140" y="196" width="360" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="320.0" y="222.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Dog.prototype { bark: fn }</text>
<text x="520" y="223" text-anchor="start" font-size="9.5" fill="var(--dg-muted, #5F6368)" font-weight="400">rex.toString() keeps going up</text>
<line x1="320" y1="196" x2="320" y2="170" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<rect x="140" y="112" width="360" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="320.0" y="138.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Object.prototype { toString, hasOwnProperty, ... }</text>
<text x="520" y="139" text-anchor="start" font-size="9.5" fill="var(--dg-muted, #5F6368)" font-weight="400">found here</text>
<line x1="320" y1="112" x2="320" y2="86" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<rect x="140" y="28" width="360" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="320.0" y="54.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">null</text>
<text x="520" y="55" text-anchor="start" font-size="9.5" fill="var(--dg-muted, #5F6368)" font-weight="400">chain ends</text>
</svg>
