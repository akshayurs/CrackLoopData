<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/></marker>
<marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/></marker>
</defs>
<text x="320.0" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The closure keeps the stack frame alive</text>
<rect x="60" y="60" width="220" height="90" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="170.0" y="103.0" text-anchor="middle" font-size="12.5" fill="var(--dg-muted, #5F6368)" font-weight="600">makeCounter() call</text>
<text x="170.0" y="119.0" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">count: 0</text>
<text x="170" y="175" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)" font-weight="400">stack frame after return</text>
<rect x="360" y="60" width="220" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="470.0" y="94.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">returned function</text>
<path d="M360,90 L170,105" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<text x="260" y="80" text-anchor="middle" font-size="9.5" fill="var(--dg-accent, #0C8F88)" font-weight="400">closure reference keeps it alive</text>
<line x1="90" y1="200" x2="115" y2="225" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
<line x1="115" y1="200" x2="90" y2="225" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
<text x="170" y="220" text-anchor="start" font-size="9.5" fill="var(--dg-accent, #0C8F88)" font-weight="400">not garbage collected — still reachable</text>
</svg>
