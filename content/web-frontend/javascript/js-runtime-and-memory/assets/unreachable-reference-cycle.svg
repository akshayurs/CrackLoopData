<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/></marker>
<marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/></marker>
</defs>
<text x="320.0" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A reference cycle with no path from roots</text>
<rect x="250" y="40" width="140" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="320.0" y="61.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Roots</text>
<circle cx="230" cy="180" r="45" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="230" y="185" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">a</text>
<circle cx="410" cy="180" r="45" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="410" y="185" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">b</text>
<path d="M275,165 L365,165" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<path d="M365,200 L275,200" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<text x="320" y="240" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="400">unreachable — collected despite referencing each other</text>
</svg>
