<text x="300.0" y="68.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Call stack</text>
<text x="300.0" y="84.0" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">(run to empty)</text>
