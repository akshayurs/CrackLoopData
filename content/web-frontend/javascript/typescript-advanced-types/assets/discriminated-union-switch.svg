<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/></marker>
<marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/></marker>
</defs>
<text x="320.0" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">switch(shape.kind) narrows the union</text>
<rect x="230" y="40" width="180" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="320.0" y="55.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Shape union</text>
<text x="320.0" y="71.0" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">circle | square | rectangle</text>
<rect x="230" y="110" width="180" height="30" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="320.0" y="129.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">switch (shape.kind)</text>
<line x1="320" y1="140" x2="320" y2="155" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="320" y1="155" x2="130" y2="190" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<rect x="40" y="190" width="180" height="30" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="130.0" y="209.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">case "circle"</text>
<rect x="40" y="235" width="180" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="130.0" y="255.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">narrowed to:</text>
<text x="130.0" y="271.0" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">{ kind: 'circle', radius }</text>
<line x1="320" y1="155" x2="330" y2="190" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<rect x="240" y="190" width="180" height="30" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="330.0" y="209.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">case "square"</text>
<rect x="240" y="235" width="180" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="330.0" y="255.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">narrowed to:</text>
<text x="330.0" y="271.0" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">{ kind: 'square', side }</text>
<line x1="320" y1="155" x2="530" y2="190" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<rect x="440" y="190" width="180" height="30" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="530.0" y="209.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">case "rectangle"</text>
<rect x="440" y="235" width="180" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="530.0" y="255.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">narrowed to:</text>
<text x="530.0" y="271.0" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">{ kind: 'rectangle', w, h }</text>
</svg>
