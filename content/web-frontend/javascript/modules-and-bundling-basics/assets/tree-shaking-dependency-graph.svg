<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/></marker>
<marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/></marker>
</defs>
<text x="320.0" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Tree-shaking removes unreachable exports</text>
<rect x="60" y="120" width="120" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="120.0" y="141.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">app.js</text>
<rect x="360" y="60" width="180" height="34" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
<text x="450.0" y="81.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">used()</text>
<rect x="360" y="180" width="180" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="450.0" y="201.0" text-anchor="middle" font-size="12.5" fill="var(--dg-muted, #5F6368)" font-weight="600">unused()</text>
<line x1="180" y1="130" x2="358" y2="78" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<text x="270" y="90" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="400">imported, kept</text>
