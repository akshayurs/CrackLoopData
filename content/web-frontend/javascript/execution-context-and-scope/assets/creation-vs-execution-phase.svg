<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/></marker>
<marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/></marker>
</defs>
<text x="320.0" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Creation phase vs execution phase</text>
<text x="160" y="50" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">Creation phase</text>
<text x="50" y="81" text-anchor="start" font-size="10.5" fill="var(--dg-ink, #202124)" font-weight="400">var x</text>
<text x="270" y="81" text-anchor="end" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">undefined</text>
<text x="50" y="113" text-anchor="start" font-size="10.5" fill="var(--dg-ink, #202124)" font-weight="400">let y</text>
<text x="270" y="113" text-anchor="end" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">TDZ (uninitialized)</text>
<text x="50" y="145" text-anchor="start" font-size="10.5" fill="var(--dg-ink, #202124)" font-weight="400">const z</text>
<text x="270" y="145" text-anchor="end" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">TDZ (uninitialized)</text>
<text x="50" y="177" text-anchor="start" font-size="10.5" fill="var(--dg-ink, #202124)" font-weight="400">function f(){}</text>
<text x="270" y="177" text-anchor="end" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">full function object</text>
<line x1="320" y1="80" x2="380" y2="80" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="480" y="50" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">Execution phase</text>
<text x="400" y="81" text-anchor="start" font-size="10.5" fill="var(--dg-ink, #202124)" font-weight="400">var x</text>
<text x="600" y="81" text-anchor="end" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="400">10</text>
<text x="400" y="113" text-anchor="start" font-size="10.5" fill="var(--dg-ink, #202124)" font-weight="400">let y</text>
<text x="600" y="113" text-anchor="end" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="400">5</text>
<text x="400" y="145" text-anchor="start" font-size="10.5" fill="var(--dg-ink, #202124)" font-weight="400">const z</text>
<text x="600" y="145" text-anchor="end" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="400">'a'</text>
<text x="400" y="177" text-anchor="start" font-size="10.5" fill="var(--dg-ink, #202124)" font-weight="400">function f(){}</text>
<text x="600" y="177" text-anchor="end" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="400">(unchanged)</text>
<line x1="320" y1="220" x2="320" y2="260" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="320" y="280" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">arrow moves down the source as lines execute</text>
</svg>
