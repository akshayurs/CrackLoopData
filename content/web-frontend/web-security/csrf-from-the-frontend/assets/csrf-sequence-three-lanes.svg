<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">CSRF: the only place a defense can act</text>

  <text x="100" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-muted, #5F6368)">Victim's browser</text>
  <text x="360" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-muted, #5F6368)">Attacker page</text>
  <text x="600" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-muted, #5F6368)">bank.example server</text>

  <line x1="100" y1="50" x2="100" y2="300" stroke="var(--dg-stroke, #9AA0A6)"/>
  <line x1="360" y1="50" x2="360" y2="300" stroke="var(--dg-stroke, #9AA0A6)"/>
  <line x1="600" y1="50" x2="600" y2="300" stroke="var(--dg-stroke, #9AA0A6)"/>

  <rect x="70" y="60" width="60" height="24" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="100" y="76" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">🔑 1</text>

  <text x="100" y="105" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">2. opens unrelated tab</text>

  <line x1="360" y1="130" x2="100" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="230" y="123" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">3. auto-submitting form delivered</text>

  <line x1="100" y1="160" x2="600" y2="160" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="153" text-anchor="middle" font-size="9.5" fill="var(--dg-accent, #0C8F88)">4. cookie attached automatically — destination-based, not origin-based</text>

  <text x="600" y="195" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">5. state change performed</text>

  <line x1="600" y1="215" x2="360" y2="215" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="330" y1="205" x2="390" y2="225" stroke="var(--dg-line, #5F6368)"/>
  <line x1="390" y1="205" x2="330" y2="225" stroke="var(--dg-line, #5F6368)"/>
  <text x="480" y="208" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">6. blocked by same-origin policy — attacker doesn't need it</text>

  <path d="M370,140 L370,205" stroke="var(--dg-accent, #0C8F88)" fill="none"/>
  <text x="530" y="255" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">[ the gap between steps 3 and 5 — the only place a defense can act ]</text>
</svg>
