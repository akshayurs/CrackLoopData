<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">Clickjacking: two stacked layers, one click</text>

  <rect x="60" y="50" width="400" height="160" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="260" y="75" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">Bottom: attacker's visible page</text>
  <rect x="150" y="140" width="220" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="260" y="164" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">"Claim your prize"</text>

  <rect x="120" y="100" width="280" height="140" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="5 4" opacity="0.5"/>
  <text x="260" y="120" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)" opacity="0.9">Top: victim site (iframe, 15% opacity)</text>
  <rect x="180" y="160" width="180" height="40" rx="8" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="270" y="184" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">"Authorise access"</text>

  <circle cx="270" cy="180" r="6" fill="var(--dg-ink, #202124)"/>
  <line x1="270" y1="60" x2="270" y2="170" stroke="var(--dg-ink, #202124)" stroke-width="1.5" marker-end="url(#cursor-arrow)"/>
  <defs>
    <marker id="cursor-arrow" markerWidth="10" markerHeight="10" refX="6" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="var(--dg-ink, #202124)"/>
    </marker>
  </defs>

  <text x="320" y="245" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">click lands on the framed page — real session, real CSRF token, Origin says victim-site</text>
  <text x="320" y="265" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">invisible and clickable are independent in CSS</text>
</svg>
