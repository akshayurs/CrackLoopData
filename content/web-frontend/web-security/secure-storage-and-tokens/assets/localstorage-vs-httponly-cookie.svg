<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">Choose which attack you defend, not whether you are safe</text>

  <line x1="350" y1="35" x2="350" y2="255" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3"/>

  <text x="175" y="55" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--dg-ink, #202124)">token in localStorage</text>
  <rect x="60" y="70" width="230" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="175" y="98" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">📦 storage: token</text>

  <line x1="290" y1="85" x2="330" y2="85" stroke="var(--dg-line, #5F6368)"/>
  <text x="220" y="140" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">CSRF — no credential attached, 401 ✓</text>
  <line x1="290" y1="150" x2="340" y2="150" stroke="var(--dg-ink, #202124)" stroke-dasharray="2 2"/>

  <line x1="290" y1="180" x2="450" y2="180" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="172" text-anchor="middle" font-size="9.5" fill="var(--dg-accent, #0C8F88)">XSS — one line reads it</text>
  <rect x="455" y="160" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="515" y="184" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">attacker server</text>
  <text x="175" y="220" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">portable, replayable off-device until expiry</text>

  <text x="525" y="55" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--dg-ink, #202124)">token in HttpOnly cookie</text>
  <rect x="410" y="70" width="230" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="525" y="98" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">🔒 cookie: token</text>

  <text x="525" y="140" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">XSS — cannot read ✓</text>
  <text x="525" y="172" text-anchor="middle" font-size="9.5" fill="var(--dg-accent, #0C8F88)">CSRF — cookie attached automatically</text>
  <text x="525" y="188" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">blocked by SameSite=Lax + token</text>

  <rect x="30" y="245" width="640" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="350" y="263" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">choose which attack you defend, not whether you are safe</text>
</svg>
