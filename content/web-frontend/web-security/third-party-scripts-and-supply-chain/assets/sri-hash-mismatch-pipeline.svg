  <line x1="450" y1="70" x2="480" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="485" y="45" width="110" height="50" rx="7" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
