  <text x="670" y="63" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">5. refused</text>
  <text x="670" y="78" text-anchor="middle" font-size="8.5" fill="var(--dg-muted, #5F6368)">0 lines run</text>

