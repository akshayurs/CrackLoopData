<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="340" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">Reading a CSP violation: three panes</text>

  <rect x="30" y="35" width="620" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="45" y="55" font-size="10" fill="var(--dg-ink, #202124)">Page</text>
  <rect x="60" y="65" width="180" height="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="150" y="80" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">&lt;script&gt; (failed to run)</text>

  <rect x="30" y="105" width="620" height="90" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="45" y="122" font-size="10" fill="var(--dg-ink, #202124)">Console</text>
  <text x="45" y="145" font-family="monospace" font-size="9" fill="var(--dg-ink, #202124)">Refused to execute inline script because it</text>
  <text x="45" y="158" font-family="monospace" font-size="9" fill="var(--dg-ink, #202124)">violates policy: script-src 'nonce-...'</text>
  <text x="45" y="180" font-size="8.5" fill="var(--dg-muted, #5F6368)">↑directive  ↑blocked resource  ↑source list  ↑fix hint</text>

  <rect x="30" y="205" width="620" height="80" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="45" y="222" font-size="10" fill="var(--dg-ink, #202124)">POST /csp-report</text>
  <text x="45" y="245" font-family="monospace" font-size="9" fill="var(--dg-ink, #202124)">{'{'} "documentURI": "...", "violatedDirective": "script-src",</text>
  <text x="45" y="260" font-family="monospace" font-size="9" fill="var(--dg-ink, #202124)">  "blockedURI": "inline", "effectiveDirective": "script-src" {'}'}</text>
</svg>
