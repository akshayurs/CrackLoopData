<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">One string, four destinations, four encodings</text>

  <rect x="10" y="105" width="140" height="50" rx="7" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="80" y="135" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">one untrusted string</text>

  <line x1="150" y1="120" x2="220" y2="60" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="150" y1="130" x2="220" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="150" y1="140" x2="220" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="150" y1="125" x2="220" y2="90" stroke="var(--dg-line, #5F6368)"/>

  <rect x="225" y="35" width="160" height="45" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="305" y="53" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">HTML body</text>
  <text x="305" y="68" text-anchor="middle" font-size="8.5" fill="var(--dg-muted, #5F6368)">&amp;lt; &amp;gt; &amp;amp;</text>

  <rect x="225" y="90" width="160" height="45" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="305" y="108" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">quoted attribute</text>
  <text x="305" y="123" text-anchor="middle" font-size="8.5" fill="var(--dg-muted, #5F6368)">entities + &amp;quot;</text>

  <rect x="225" y="145" width="160" height="45" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="305" y="163" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">JS string literal</text>
  <text x="305" y="178" text-anchor="middle" font-size="8.5" fill="var(--dg-accent, #0C8F88)">✕ backslash escapes needed</text>

  <rect x="225" y="200" width="160" height="45" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="305" y="218" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">URL parameter</text>
  <text x="305" y="233" text-anchor="middle" font-size="8.5" fill="var(--dg-accent, #0C8F88)">✕ percent-encoding needed</text>

  <text x="520" y="240" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">HTML entity encoding on the wrong destination</text>
  <text x="520" y="256" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">looks escaped, still exploitable</text>
</svg>
