<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="360" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">Stored XSS: four stages, one decision point</text>

  <rect x="10" y="50" width="140" height="55" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="80" y="72" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">1. Attacker posts</text>
  <text x="80" y="87" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">&lt;script&gt; comment</text>

  <line x1="150" y1="77" x2="200" y2="77" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="205" y="50" width="180" height="55" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="295" y="70" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">2. App server + DB</text>
  <text x="295" y="88" text-anchor="middle" font-size="8.5" fill="var(--dg-muted, #5F6368)">stored verbatim — length checked only</text>

  <line x1="385" y1="77" x2="440" y2="77" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="410" y="65" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">encode here</text>

  <rect x="445" y="50" width="150" height="55" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="520" y="70" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">3. Renders for victim</text>
  <text x="520" y="88" text-anchor="middle" font-size="8.5" fill="var(--dg-muted, #5F6368)">unencoded splice</text>

  <line x1="595" y1="77" x2="620" y2="77" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="625" y="50" width="90" height="55" rx="7" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="670" y="70" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">4. Victim's</text>
  <text x="670" y="83" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">browser</text>
  <text x="670" y="96" text-anchor="middle" font-size="7.5" fill="var(--dg-ink, #202124)">runs as first-party</text>

  <text x="360" y="150" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">the only place the outcome is decided: encode at the output boundary (step 2→3)</text>
</svg>
