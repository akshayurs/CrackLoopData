<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/></marker>
<marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/></marker>
</defs>
<text x="320.0" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Where a CSS change enters the rendering pipeline</text>
<rect x="60" y="160" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="120.0" y="184.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Style</text>
<rect x="220" y="160" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="280.0" y="184.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Layout</text>
<rect x="380" y="160" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="440.0" y="184.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Paint</text>
<rect x="540" y="160" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="600.0" y="184.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Composite</text>
<line x1="180" y1="180" x2="220" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="340" y1="180" x2="380" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="500" y1="180" x2="540" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="280" y1="60" x2="280" y2="158" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<text x="280" y="50" text-anchor="middle" font-size="9.5" fill="var(--dg-accent, #0C8F88)" font-weight="400">width, height, top,</text>
<text x="280" y="38" text-anchor="middle" font-size="9.5" fill="var(--dg-accent, #0C8F88)" font-weight="400">margin, display</text>
<text x="280" y="26" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)" font-weight="400">(most expensive)</text>
<line x1="440" y1="90" x2="440" y2="158" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<text x="440" y="78" text-anchor="middle" font-size="9.5" fill="var(--dg-accent, #0C8F88)" font-weight="400">background-color, color,</text>
<text x="440" y="66" text-anchor="middle" font-size="9.5" fill="var(--dg-accent, #0C8F88)" font-weight="400">box-shadow, border-radius</text>
<line x1="600" y1="120" x2="600" y2="158" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<text x="600" y="108" text-anchor="middle" font-size="9.5" fill="var(--dg-accent, #0C8F88)" font-weight="400">transform, opacity</text>
<text x="600" y="96" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)" font-weight="400">(cheapest, off main thread)</text>
</svg>
