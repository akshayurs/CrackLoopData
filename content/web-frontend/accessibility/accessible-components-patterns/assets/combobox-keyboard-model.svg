<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/></marker>
<marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/></marker>
</defs>
<text x="320.0" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Combobox keyboard model</text>
<rect x="180" y="50" width="280" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="320.0" y="71.0" text-anchor="middle" font-size="12.5" fill="var(--dg-muted, #5F6368)" font-weight="600">Search…</text>
<rect x="180" y="90" width="280" height="140" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="200" y="112" text-anchor="start" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="400">Alpha</text>
<rect x="182" y="125" width="276" height="35" fill="var(--dg-accent-bg, #E3F3F1)"/>
<text x="200" y="147" text-anchor="start" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="400">Bravo</text>
<text x="200" y="182" text-anchor="start" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="400">Charlie</text>
<text x="200" y="217" text-anchor="start" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="400">Delta</text>
<rect x="182" y="61" width="276" height="12" rx="2" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="465" y="70" text-anchor="start" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">real focus stays here</text>
<line x1="500" y1="108" x2="555" y2="108" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<text x="560" y="100" text-anchor="start" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Down/Up</text>
<text x="560" y="113" text-anchor="start" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">move highlight</text>
<line x1="500" y1="143" x2="555" y2="143" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<text x="560" y="138" text-anchor="start" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Enter</text>
<text x="560" y="151" text-anchor="start" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">commit into input</text>
<line x1="500" y1="178" x2="555" y2="178" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<text x="560" y="173" text-anchor="start" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Escape</text>
<text x="560" y="186" text-anchor="start" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">close, no commit</text>
<line x1="500" y1="213" x2="555" y2="213" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<text x="560" y="208" text-anchor="start" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Tab</text>
<text x="560" y="221" text-anchor="start" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">leave, list closes</text>
<text x="320.0" y="270" text-anchor="middle" font-size="11.5" fill="var(--dg-muted, #5F6368)" font-weight="400">One highlighted option at a time; DOM focus never leaves the input.</text>
</svg>
