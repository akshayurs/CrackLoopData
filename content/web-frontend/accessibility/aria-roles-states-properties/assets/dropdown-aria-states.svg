<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/></marker>
<marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/></marker>
</defs>
<text x="320.0" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">aria-expanded and aria-activedescendant flip together</text>
<text x="160" y="55" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">Closed</text>
<rect x="70" y="65" width="180" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="160.0" y="80.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Menu ▾</text>
<text x="160.0" y="96.0" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">aria-expanded="false"</text>
<rect x="70" y="115" width="180" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="160.0" y="149.0" text-anchor="middle" font-size="12.5" fill="var(--dg-muted, #5F6368)" font-weight="600">(menu hidden)</text>
<text x="480" y="55" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">Open</text>
<rect x="390" y="65" width="180" height="34" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
<text x="480.0" y="80.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Menu ▾</text>
<text x="480.0" y="96.0" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">aria-expanded="true"</text>
<rect x="390" y="108" width="180" height="26" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="480.0" y="125.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Alpha</text>
<rect x="390" y="134" width="180" height="26" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
<text x="480.0" y="151.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Bravo</text>
<text x="480" y="172" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)" font-weight="400">aria-activedescendant → this option</text>
<rect x="390" y="160" width="180" height="26" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="480.0" y="177.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Charlie</text>
<line x1="260" y1="82" x2="380" y2="82" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<text x="320" y="72" text-anchor="middle" font-size="10.5" fill="var(--dg-accent, #0C8F88)" font-weight="400">toggle</text>
<text x="320.0" y="320" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="400">aria-expanded and aria-activedescendant must update in the same interaction, or a screen reader announces a stale state.</text>
</svg>
