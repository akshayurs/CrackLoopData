<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/></marker>
<marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/></marker>
</defs>
<text x="320.0" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Two experiences of one failed submit</text>
<text x="70" y="55" text-anchor="start" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">Sighted user</text>
<rect x="140" y="40" width="160" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="220.0" y="61.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Submit clicked</text>
<line x1="300" y1="57" x2="340" y2="57" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<rect x="340" y="40" width="240" height="34" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
<text x="460.0" y="54.0" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">Eyes jump to red banner</text>
<text x="460.0" y="68.0" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">+ red inline text</text>
<text x="70" y="130" text-anchor="start" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">Screen reader user</text>
<rect x="140" y="115" width="160" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="220.0" y="136.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Submit clicked</text>
<line x1="300" y1="132" x2="340" y2="132" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<rect x="340" y="105" width="240" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="460.0" y="128.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">aria-live region announces:</text>
<text x="460.0" y="144.0" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">"1 error found: Email is required"</text>
<text x="460" y="172" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)" font-weight="400">focus never moves</text>
<line x1="460" y1="165" x2="460" y2="195" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="340" y="195" width="240" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="460.0" y="219.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">User activates link in summary</text>
<line x1="460" y1="235" x2="460" y2="260" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<rect x="300" y="260" width="320" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="460.0" y="281.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Email field gets focus</text>
<text x="460.0" y="297.0" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">aria-invalid, aria-describedby set</text>
</svg>
