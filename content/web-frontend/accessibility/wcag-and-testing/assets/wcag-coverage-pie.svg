<text x="220" y="350" text-anchor="middle" font-size="1" fill="var(--dg-ink, #202124)" font-weight="400"></text>
<text x="470" y="90" text-anchor="start" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">Automated tools catch:</text>
<text x="470" y="108" text-anchor="start" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="400">contrast, missing alt,</text>
<text x="470" y="123" text-anchor="start" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="400">invalid markup, missing labels</text>
<text x="470" y="165" text-anchor="start" font-size="11.5" fill="var(--dg-accent, #0C8F88)" font-weight="600">Needs manual/human judgment:</text>
<text x="470" y="183" text-anchor="start" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="400">meaningful alt text, keyboard</text>
<text x="470" y="198" text-anchor="start" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="400">behavior, reading order, live-</text>
<text x="470" y="213" text-anchor="start" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="400">region timing, clear errors</text>
<text x="470" y="260" text-anchor="start" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">Needs specialized tooling:</text>
<text x="470" y="278" text-anchor="start" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="400">seizure-risk video analysis</text>
