<text x="140.0" y="79.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">"The cat sat."</text>
<line x1="140" y1="90" x2="140" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60" y="110" width="160" height="30" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="140.0" y="129.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">insert "black " (local, instant)</text>
<line x1="140" y1="140" x2="140" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60" y="160" width="160" height="30" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="140.0" y="179.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">sent outward</text>
<text x="500" y="50" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">Client B</text>
<rect x="420" y="60" width="160" height="30" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="500.0" y="79.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">"The cat sat."</text>
<line x1="500" y1="90" x2="500" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="420" y="110" width="160" height="30" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="500.0" y="129.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">insert " quietly" (local, instant)</text>
<line x1="500" y1="140" x2="500" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="420" y="160" width="160" height="30" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="500.0" y="179.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">sent outward</text>
<path d="M140,190 L140,240 L320,260" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<path d="M500,190 L500,240 L320,260" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<rect x="180" y="262" width="280" height="34" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
<text x="320.0" y="283.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">"The black cat sat quietly."</text>
