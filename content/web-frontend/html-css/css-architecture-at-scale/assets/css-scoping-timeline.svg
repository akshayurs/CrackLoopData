<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/></marker>
<marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/></marker>
</defs>
<text x="320.0" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">When each styling approach resolves scoping</text>
<line x1="60" y1="180" x2="580" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="130" cy="180" r="7" fill="var(--dg-accent, #0C8F88)"/>
<text x="130" y="150" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">write time</text>
<text x="130" y="135" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">BEM</text>
<text x="130" y="210" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)" font-weight="400">developer discipline,</text>
<text x="130" y="225" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)" font-weight="400">no tooling</text>
<circle cx="330" cy="180" r="7" fill="var(--dg-accent, #0C8F88)"/>
<text x="330" y="150" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">build time</text>
<text x="330" y="135" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">CSS Modules / utility-first</text>
<text x="330" y="210" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)" font-weight="400">bundler generates scoped</text>
<text x="330" y="225" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)" font-weight="400">names / purges unused atoms</text>
<circle cx="520" cy="180" r="7" fill="var(--dg-accent, #0C8F88)"/>
<text x="520" y="150" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">runtime</text>
<text x="520" y="135" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">classic CSS-in-JS</text>
<text x="520" y="210" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)" font-weight="400">browser executes JS</text>
<text x="520" y="225" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)" font-weight="400">to inject styles on render</text>
<path d="M520,270 L360,270 L360,255" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrowAccent)"/>
<text x="430" y="285" text-anchor="middle" font-size="9.5" fill="var(--dg-accent, #0C8F88)" font-weight="400">compile-time CSS-in-JS moves back to build time</text>
</svg>
