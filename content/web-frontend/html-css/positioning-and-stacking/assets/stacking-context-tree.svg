<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/></marker>
<marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/></marker>
</defs>
<text x="320.0" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Stacking contexts trap z-index</text>
<rect x="260" y="45" width="120" height="30" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="320.0" y="64.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">document root</text>
<line x1="320" y1="75" x2="160" y2="105" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="100" y="105" width="120" height="30" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="160.0" y="124.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">z-index 1</text>
<line x1="320" y1="75" x2="340" y2="105" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="280" y="105" width="120" height="30" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
<text x="340.0" y="124.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">z-index 2</text>
<line x1="320" y1="75" x2="520" y2="105" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="460" y="105" width="120" height="30" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="520.0" y="124.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">z-index 3</text>
<line x1="280" y1="135" x2="260" y2="170" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="190" y="170" width="140" height="26" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="260.0" y="187.0" text-anchor="middle" font-size="12.5" fill="var(--dg-muted, #5F6368)" font-weight="600">z-index 1</text>
<line x1="280" y1="135" x2="340" y2="170" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="310" y="170" width="150" height="26" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="385.0" y="187.0" text-anchor="middle" font-size="12.5" fill="var(--dg-muted, #5F6368)" font-weight="600">z-index 9999</text>
<text x="390" y="215" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="400">still renders below root's z-index 3</text>
<line x1="460" y1="205" x2="500" y2="145" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrowAccent)"/>
<text x="390" y="232" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)" font-weight="400">trapped inside its parent's z-index 2 context</text>
</svg>
