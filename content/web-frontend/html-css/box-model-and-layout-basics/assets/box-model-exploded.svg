<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/></marker>
<marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/></marker>
</defs>
<text x="320.0" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The box model, exploded</text>
<rect x="60" y="60" width="500" height="260" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4,4"/>
<text x="320" y="45" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)" font-weight="400">margin (transparent, hatched)</text>
<rect x="100" y="100" width="420" height="180" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
<text x="320" y="95" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">border</text>
<rect x="130" y="130" width="360" height="120" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-stroke, #9AA0A6)"/>
<text x="320" y="125" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">padding</text>
<rect x="200" y="160" width="220" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
