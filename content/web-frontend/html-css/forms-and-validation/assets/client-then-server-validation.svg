<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/></marker>
<marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/></marker>
</defs>
<text x="320.0" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Client validation, then server validation</text>
<rect x="20" y="140" width="110" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="75.0" y="161.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Submit clicked</text>
<line x1="130" y1="157" x2="180" y2="157" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<polygon points="230,127.0 285.0,157 230,187.0 175.0,157" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="230" y="155.0" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">client</text>
<text x="230" y="167.0" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">validation</text>
<line x1="230" y1="127" x2="230" y2="80" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<rect x="160" y="50" width="140" height="30" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
<text x="230.0" y="69.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">fails: red X, stops</text>
<line x1="285" y1="157" x2="340" y2="157" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="310" y="145" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)" font-weight="400">passes</text>
<rect x="340" y="140" width="110" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="395.0" y="161.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">network request</text>
<line x1="450" y1="157" x2="500" y2="157" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<polygon points="550,127.0 605.0,157 550,187.0 495.0,157" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="550" y="155.0" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">server</text>
<text x="550" y="167.0" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">validation</text>
<line x1="550" y1="127" x2="550" y2="70" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<rect x="460" y="20" width="180" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
<text x="550.0" y="37.0" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">fails: error response</text>
<text x="550.0" y="51.0" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">→ shown to user</text>
<line x1="550" y1="187" x2="550" y2="250" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="475" y="250" width="150" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="550.0" y="264.0" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">passes: green check,</text>
<text x="550.0" y="278.0" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">operation completes</text>
</svg>
