<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/></marker>
<marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/></marker>
</defs>
<text x="320.0" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Which changes skip which stages</text>
<rect x="40" y="140" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="100.0" y="164.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Render tree</text>
<rect x="190" y="140" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="250.0" y="164.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Layout</text>
<rect x="340" y="140" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="400.0" y="164.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Paint</text>
<rect x="490" y="140" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="550.0" y="164.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Composite</text>
<line x1="160" y1="160" x2="190" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="310" y1="160" x2="340" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="460" y1="160" x2="490" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M100,100 L400,100" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<text x="250" y="88" text-anchor="middle" font-size="9.5" fill="var(--dg-accent, #0C8F88)" font-weight="400">width/display change — through all four</text>
<path d="M250,70 L400,130" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="250" y="60" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)" font-weight="400">color change — skips Layout</text>
<path d="M250,45 L550,130" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="400" y="35" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)" font-weight="400">transform/opacity — skips Layout + Paint</text>
</svg>
