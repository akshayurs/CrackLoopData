<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/></marker>
<marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/></marker>
</defs>
<text x="320.0" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Cookies vs localStorage vs sessionStorage vs IndexedDB</text>
<text x="227.5" y="50" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Cookies</text>
<text x="342.5" y="50" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">localStorage</text>
<text x="457.5" y="50" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">sessionStorage</text>
<text x="572.5" y="50" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">IndexedDB</text>
<text x="20" y="98" text-anchor="start" font-size="10.5" fill="var(--dg-ink, #202124)" font-weight="400">Sent automatically?</text>
<rect x="166" y="80" width="107" height="34" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
<text x="219.5" y="101.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Yes</text>
<rect x="281" y="80" width="107" height="34" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
<text x="334.5" y="101.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">No</text>
<rect x="396" y="80" width="107" height="34" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
<text x="449.5" y="101.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">No</text>
<rect x="511" y="80" width="107" height="34" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
<text x="564.5" y="101.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">No</text>
<text x="20" y="158" text-anchor="start" font-size="10.5" fill="var(--dg-ink, #202124)" font-weight="400">Typical size limit</text>
<rect x="166" y="140" width="107" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="219.5" y="161.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">~4KB</text>
<rect x="281" y="140" width="107" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="334.5" y="161.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">~5-10MB</text>
<rect x="396" y="140" width="107" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="449.5" y="161.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">~5-10MB</text>
<rect x="511" y="140" width="107" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="564.5" y="161.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">hundreds of MB+</text>
<text x="20" y="218" text-anchor="start" font-size="10.5" fill="var(--dg-ink, #202124)" font-weight="400">Lifetime</text>
<rect x="166" y="200" width="107" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="219.5" y="221.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">session/expiry</text>
<rect x="281" y="200" width="107" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="334.5" y="221.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">until cleared</text>
<rect x="396" y="200" width="107" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="449.5" y="221.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">until tab closed</text>
<rect x="511" y="200" width="107" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="564.5" y="221.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">until cleared</text>
<text x="320" y="280" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="400">'sent automatically' drives the token-storage decision</text>
</svg>
