<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/></marker>
<marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/></marker>
</defs>
<text x="320.0" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">CORS preflight, then the real request</text>
<text x="120" y="55" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)" font-weight="600">Browser (app.example.com)</text>
<text x="520" y="55" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)" font-weight="600">Server (api.example.com)</text>
<line x1="120" y1="65" x2="120" y2="300" stroke="var(--dg-line, #5F6368)" stroke-dasharray="2,3"/>
<line x1="520" y1="65" x2="520" y2="300" stroke="var(--dg-line, #5F6368)" stroke-dasharray="2,3"/>
<path d="M120,100 L520,100" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<text x="320" y="90" text-anchor="middle" font-size="8.7" fill="var(--dg-accent, #0C8F88)" font-weight="400">OPTIONS — Origin, Access-Control-Request-Method/Headers</text>
<path d="M520,150 L120,150" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<text x="320" y="140" text-anchor="middle" font-size="8.7" fill="var(--dg-accent, #0C8F88)" font-weight="400">200 — Access-Control-Allow-Origin/Methods/Headers</text>
<path d="M120,210 L520,210" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="320" y="200" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="400">PUT request</text>
<path d="M520,250 L120,250" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="320" y="240" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="400">response body</text>
<text x="320" y="280" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)" font-weight="400">browser checks Access-Control-Allow-Origin again before exposing body to JS</text>
</svg>
