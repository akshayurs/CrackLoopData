<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/></marker>
<marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/></marker>
</defs>
<text x="320.0" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Service worker lifecycle</text>
<rect x="20" y="120" width="110" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="75.0" y="144.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Register</text>
<rect x="150" y="120" width="110" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="205.0" y="144.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Install</text>
<rect x="280" y="120" width="110" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="335.0" y="144.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Waiting</text>
<rect x="410" y="120" width="110" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="465.0" y="144.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Activate</text>
<rect x="540" y="120" width="110" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="595.0" y="144.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Fetch</text>
<line x1="130" y1="140" x2="150" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="260" y1="140" x2="280" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="390" y1="140" x2="410" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="520" y1="140" x2="540" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="335" y="90" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)" font-weight="400">blocked here until all tabs controlled by OLD worker close,
unless skipWaiting() is called</text>
<line x1="335" y1="100" x2="335" y2="118" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="150" y="220" width="110" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="205.0" y="244.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Install (v2)</text>
<path d="M595,160 L595,240 L205,240 L205,218" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrowAccent)"/>
<text x="400" y="260" text-anchor="middle" font-size="9.5" fill="var(--dg-accent, #0C8F88)" font-weight="400">new sw.js detected on next registration check</text>
</svg>
