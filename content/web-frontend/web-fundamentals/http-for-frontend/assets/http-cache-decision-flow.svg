<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/></marker>
<marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/></marker>
</defs>
<text x="320.0" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">HTTP cache decision path</text>
<rect x="230" y="25" width="180" height="30" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="320.0" y="44.0" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Request for URL</text>
<line x1="320" y1="55" x2="320" y2="75" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<polygon points="320,80.0 425.0,105 320,130.0 215.0,105" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="320" y="103.0" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Cached response</text>
<text x="320" y="115.0" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">exists?</text>
<line x1="225" y1="115" x2="110" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<rect x="20" y="150" width="180" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="110.0" y="164.0" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">Full network request</text>
<text x="110.0" y="178.0" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">(cache miss)</text>
<line x1="415" y1="115" x2="470" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<polygon points="470,155.0 570.0,180 470,205.0 370.0,180" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="470" y="184.0" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Within max-age?</text>
<line x1="375" y1="190" x2="250" y2="225" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<rect x="150" y="225" width="200" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="250.0" y="242.0" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">Serve from cache,</text>
<text x="250.0" y="256.0" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">no network (fresh)</text>
<line x1="470" y1="205" x2="470" y2="230" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="370" y="230" width="200" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="470.0" y="249.0" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">Conditional request:</text>
<text x="470.0" y="263.0" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">If-None-Match / If-Mod-Since</text>
<line x1="470" y1="274" x2="470" y2="300" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrow)"/>
<polygon points="470,305.0 570.0,330 470,355.0 370.0,330" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="470" y="334.0" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">304 Not Modified?</text>
<line x1="375" y1="340" x2="250" y2="375" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<rect x="150" y="375" width="200" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="250.0" y="392.0" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">Serve cached body,</text>
<text x="250.0" y="406.0" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">refresh freshness clock</text>
<line x1="565" y1="340" x2="565" y2="375" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<rect x="455" y="375" width="200" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
<text x="555.0" y="392.0" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">Use new 200 body,</text>
<text x="555.0" y="406.0" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">update cache</text>
</svg>
