<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">fct_sales at the center of a star</text>

  <line x1="320" y1="150" x2="180" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="320" y1="150" x2="460" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="320" y1="250" x2="180" y2="310" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="320" y1="250" x2="460" y2="310" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="245" y="150" width="150" height="100" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="172" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">fct_sales</text>
  <text x="320" y="190" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">product_id</text>
  <text x="320" y="204" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">customer_id, store_id</text>
  <text x="320" y="218" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">date_id</text>
  <text x="320" y="234" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">quantity, revenue</text>

  <rect x="60" y="50" width="140" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="130" y="74" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">dim_product</text>
  <text x="130" y="90" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">name, category, brand</text>

  <rect x="440" y="50" width="140" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="510" y="74" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">dim_customer</text>
  <text x="510" y="90" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">name, segment, region</text>

  <rect x="60" y="290" width="140" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="130" y="314" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">dim_store</text>
  <text x="130" y="330" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">city, region, format</text>

  <rect x="440" y="290" width="140" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="510" y="314" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">dim_date</text>
  <text x="510" y="330" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">day, month, quarter</text>

  <text x="320" y="386" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Four foreign keys radiating outward — the shape reads as a star.</text>
</svg>
