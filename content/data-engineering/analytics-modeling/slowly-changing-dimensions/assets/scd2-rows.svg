    <text x="560" y="174" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">true</text>
  </g>

  <text x="320" y="222" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Contiguous, non-overlapping date ranges — only the last row is current.</text>
