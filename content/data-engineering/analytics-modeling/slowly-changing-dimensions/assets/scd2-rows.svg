  <text x="160" y="60" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="600">customer_id</text>
  <text x="260" y="60" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="600">tier</text>
