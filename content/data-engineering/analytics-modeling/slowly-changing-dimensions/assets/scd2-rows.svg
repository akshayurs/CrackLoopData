    <text x="260" y="94" font-size="11" fill="var(--dg-ink, #202124)">Silver</text>
    <text x="330" y="94" font-size="11" fill="var(--dg-ink, #202124)">2023-01-01</text>
    <text x="450" y="94" font-size="11" fill="var(--dg-ink, #202124)">2023-06-15</text>
    <text x="560" y="94" font-size="11" fill="var(--dg-muted, #5F6368)">false</text>
  </g>
  <g>
    <rect x="20" y="110" width="600" height="40" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="40" y="134" font-size="11" fill="var(--dg-ink, #202124)">902</text>
    <text x="160" y="134" font-size="11" fill="var(--dg-ink, #202124)">501</text>
    <text x="260" y="134" font-size="11" fill="var(--dg-ink, #202124)">Gold</text>
    <text x="330" y="134" font-size="11" fill="var(--dg-ink, #202124)">2023-06-15</text>
    <text x="450" y="134" font-size="11" fill="var(--dg-ink, #202124)">2024-03-02</text>
