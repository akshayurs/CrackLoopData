<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">dim_customer — SCD Type 2 for customer_id 501</text>

  <rect x="20" y="42" width="600" height="26" fill="var(--dg-fill, #F1F3F4)"/>
