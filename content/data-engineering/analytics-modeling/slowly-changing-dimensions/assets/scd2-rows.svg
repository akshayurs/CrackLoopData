  <text x="450" y="60" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="600">effective_end</text>
  <text x="560" y="60" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="600">is_current</text>

  <g>
