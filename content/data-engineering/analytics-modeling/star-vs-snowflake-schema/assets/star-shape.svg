<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="280" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Star schema — flat dimensions, no further branching</text>

  <line x1="280" y1="130" x2="150" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="280" y1="130" x2="410" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="280" y1="200" x2="150" y2="260" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="280" y1="200" x2="410" y2="260" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="210" y="130" width="140" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="280" y="170" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">fct_sales</text>

  <rect x="80" y="40" width="140" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="60" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">dim_product</text>
  <text x="150" y="76" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">name, category, brand</text>

  <rect x="340" y="40" width="140" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="410" y="60" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">dim_customer</text>
  <text x="410" y="76" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">name, segment, region</text>

  <rect x="80" y="230" width="140" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="250" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">dim_store</text>
  <text x="150" y="266" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">city, region, format</text>

  <rect x="340" y="230" width="140" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="410" y="250" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">dim_date</text>
  <text x="410" y="266" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">day, month, quarter</text>
</svg>
