<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="280" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Snowflake schema — dim_product normalized further out</text>

  <line x1="280" y1="150" x2="150" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="210" y="130" width="140" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="280" y="155" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">fct_sales</text>

  <rect x="20" y="130" width="130" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="155" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">dim_product</text>

  <line x1="85" y1="130" x2="85" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="10" y="50" width="130" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="75" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">dim_category</text>

  <line x1="85" y1="170" x2="85" y2="230" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="10" y="230" width="130" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="255" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">dim_brand</text>

  <text x="380" y="155" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Other dims stay flat, unlike the star</text>
</svg>
