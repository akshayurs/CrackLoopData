<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="300" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Every consumer goes through one shared layer</text>

  <rect x="30" y="50" width="140" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">BI dashboard</text>

  <rect x="230" y="50" width="140" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="300" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Jupyter notebook</text>

  <rect x="430" y="50" width="140" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Ad-hoc SQL client</text>

  <line x1="100" y1="100" x2="240" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="300" y1="100" x2="300" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="500" y1="100" x2="360" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="170" y="150" width="260" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="300" y="184" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Semantic / metrics layer</text>

  <line x1="300" y1="210" x2="300" y2="250" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="180" y="250" width="240" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="300" y="280" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Raw warehouse tables</text>
</svg>
