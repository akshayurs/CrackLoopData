<svg viewBox="0 0 660 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Same row, updated in place across the order lifecycle</text>

  <text x="90" y="46" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">t1: placed</text>
  <text x="330" y="46" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">t2: shipped</text>
  <text x="570" y="46" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">t3: delivered</text>

  <g>
    <rect x="20" y="56" width="140" height="150" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="90" y="76" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">order_id: 501</text>
    <text x="90" y="100" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">placed_date: 6/1</text>
    <text x="90" y="122" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">shipped_date: NULL</text>
    <text x="90" y="144" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">delivered_date: NULL</text>
  </g>

  <line x1="165" y1="130" x2="255" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <text x="210" y="122" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">UPDATE</text>

  <g>
    <rect x="260" y="56" width="140" height="150" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="330" y="76" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">order_id: 501</text>
    <text x="330" y="100" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">placed_date: 6/1</text>
    <text x="330" y="122" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">shipped_date: 6/2</text>
    <text x="330" y="144" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">delivered_date: NULL</text>
  </g>

  <line x1="405" y1="130" x2="495" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <text x="450" y="122" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">UPDATE</text>

  <g>
    <rect x="500" y="56" width="140" height="150" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="570" y="76" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">order_id: 501</text>
    <text x="570" y="100" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">placed_date: 6/1</text>
    <text x="570" y="122" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">shipped_date: 6/2</text>
    <text x="570" y="144" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">delivered_date: 6/5</text>
  </g>

  <text x="330" y="238" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">One row, mutated three times — never re-inserted.</text>
</svg>
