<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Schema registry as a publish gate</text>

  <rect x="20" y="50" width="120" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="77" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Producer</text>

  <rect x="250" y="50" width="150" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="325" y="77" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Schema Registry</text>

  <line x1="140" y1="73" x2="248" y2="73" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="194" y="63" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">register v7</text>

  <rect x="470" y="20" width="150" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="545" y="44" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">accepted: v7</text>
  <line x1="400" y1="60" x2="468" y2="38" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>

  <rect x="470" y="90" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="545" y="110" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">rejected:</text>
  <text x="545" y="124" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">removes field x</text>
  <line x1="400" y1="86" x2="468" y2="108" stroke="var(--dg-muted, #5F6368)" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <rect x="20" y="170" width="120" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="197" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Consumer</text>
  <line x1="325" y1="96" x2="140" y2="185" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="230" y="150" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">fetch schema by message's schema ID</text>
</svg>
