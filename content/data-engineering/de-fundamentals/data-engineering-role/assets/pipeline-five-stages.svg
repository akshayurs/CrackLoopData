<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Source to serving, five stages</text>

  <g font-size="11" fill="var(--dg-ink, #202124)">
    <rect x="10" y="50" width="118" height="64" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="69" y="72" text-anchor="middle" font-weight="600">Source</text>
    <text x="69" y="88" text-anchor="middle" fill="var(--dg-muted, #5F6368)">Postgres,</text>
    <text x="69" y="101" text-anchor="middle" fill="var(--dg-muted, #5F6368)">Stripe API</text>

    <rect x="146" y="50" width="118" height="64" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="205" y="72" text-anchor="middle" font-weight="600">Ingestion</text>
    <text x="205" y="88" text-anchor="middle" fill="var(--dg-muted, #5F6368)">Fivetran,</text>
    <text x="205" y="101" text-anchor="middle" fill="var(--dg-muted, #5F6368)">Airbyte</text>

    <rect x="282" y="50" width="118" height="64" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="341" y="72" text-anchor="middle" font-weight="600">Storage</text>
    <text x="341" y="88" text-anchor="middle" fill="var(--dg-muted, #5F6368)">S3 / warehouse</text>
    <text x="341" y="101" text-anchor="middle" fill="var(--dg-muted, #5F6368)">raw layer</text>

    <rect x="418" y="50" width="118" height="64" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="477" y="72" text-anchor="middle" font-weight="600">Transform</text>
    <text x="477" y="88" text-anchor="middle" fill="var(--dg-muted, #5F6368)">dbt / Spark</text>

    <rect x="554" y="50" width="118" height="64" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="613" y="72" text-anchor="middle" font-weight="600">Serving</text>
    <text x="613" y="88" text-anchor="middle" fill="var(--dg-muted, #5F6368)">BI tool,</text>
    <text x="613" y="101" text-anchor="middle" fill="var(--dg-muted, #5F6368)">ML features</text>
  </g>

  <g stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)">
    <line x1="128" y1="82" x2="144" y2="82"/>
    <line x1="264" y1="82" x2="280" y2="82"/>
    <line x1="400" y1="82" x2="416" y2="82"/>
    <line x1="536" y1="82" x2="552" y2="82"/>
  </g>

  <line x1="30" y1="150" x2="650" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="340" y="175" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">orchestrator schedules and sequences every stage</text>
</svg>
