<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Fraud detection: batch vs streaming</text>

  <text x="20" y="52" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Batch</text>
  <rect x="20" y="62" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="87" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Transactions table</text>
  <line x1="160" y1="83" x2="185" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="185" y="62" width="150" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="260" y="80" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">nightly Spark job</text>
  <text x="260" y="94" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">scores yesterday</text>
  <line x1="335" y1="83" x2="360" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="360" y="62" width="150" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="435" y="80" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">flagged rows</text>
  <text x="435" y="94" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">reviewed next morning</text>
  <text x="320" y="122" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">fraud already cleared and funds moved before review</text>

  <text x="20" y="152" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Streaming</text>
  <rect x="20" y="162" width="140" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="90" y="187" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">transaction event</text>
  <line x1="160" y1="183" x2="185" y2="183" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="185" y="162" width="150" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="260" y="180" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Flink job scores</text>
  <text x="260" y="194" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">within ~200ms</text>
  <line x1="335" y1="183" x2="360" y2="183" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="360" y="162" width="150" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="435" y="180" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">card declined</text>
  <text x="435" y="194" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">in real time</text>
  <text x="320" y="222" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">blocked before the transaction completes</text>
</svg>
