<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">The modern data stack, layer by layer</text>

  <g font-size="12" fill="var(--dg-ink, #202124)">
    <rect x="40" y="220" width="480" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="60" y="240" font-weight="600">Ingestion</text>
    <text x="60" y="257" font-size="11" fill="var(--dg-muted, #5F6368)">Fivetran, Airbyte, Debezium</text>

    <rect x="40" y="168" width="480" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="60" y="188" font-weight="600">Storage / Warehouse</text>
    <text x="60" y="205" font-size="11" fill="var(--dg-muted, #5F6368)">Snowflake, BigQuery, S3 + Iceberg</text>

    <rect x="40" y="116" width="480" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="60" y="136" font-weight="600">Transformation</text>
    <text x="60" y="153" font-size="11" fill="var(--dg-muted, #5F6368)">dbt, Spark</text>

    <rect x="40" y="64" width="480" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="60" y="84" font-weight="600">Serving / BI</text>
    <text x="60" y="101" font-size="11" fill="var(--dg-muted, #5F6368)">Looker, Tableau, reverse-ETL</text>

    <rect x="530" y="64" width="60" height="202" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="560" y="150" text-anchor="middle" font-weight="600" transform="rotate(90 560 150)">Orchestration</text>
  </g>

  <text x="280" y="285" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Orchestration coordinates every layer below it — it isn't a stage data passes through.</text>
</svg>
