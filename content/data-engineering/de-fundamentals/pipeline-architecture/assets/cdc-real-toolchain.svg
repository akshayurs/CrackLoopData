<svg viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">One real CDC toolchain</text>

  <g font-size="11" fill="var(--dg-ink, #202124)">
    <rect x="10" y="44" width="118" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="69" y="66" text-anchor="middle" font-weight="600">Source</text>
    <text x="69" y="82" text-anchor="middle" fill="var(--dg-muted, #5F6368)">Postgres</text>
    <text x="69" y="96" text-anchor="middle" fill="var(--dg-muted, #5F6368)">primary DB</text>

    <rect x="148" y="44" width="118" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="207" y="66" text-anchor="middle" font-weight="600">Ingestion</text>
    <text x="207" y="82" text-anchor="middle" fill="var(--dg-muted, #5F6368)">Debezium</text>
    <text x="207" y="96" text-anchor="middle" fill="var(--dg-muted, #5F6368)">CDC connector</text>

    <rect x="286" y="44" width="118" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="345" y="66" text-anchor="middle" font-weight="600">Storage</text>
    <text x="345" y="82" text-anchor="middle" fill="var(--dg-muted, #5F6368)">S3, raw events</text>
    <text x="345" y="96" text-anchor="middle" fill="var(--dg-muted, #5F6368)">partitioned by date</text>

    <rect x="424" y="44" width="118" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="483" y="66" text-anchor="middle" font-weight="600">Transform</text>
    <text x="483" y="82" text-anchor="middle" fill="var(--dg-muted, #5F6368)">Spark job cleans</text>
    <text x="483" y="96" text-anchor="middle" fill="var(--dg-muted, #5F6368)">and joins</text>

    <rect x="562" y="44" width="118" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="621" y="66" text-anchor="middle" font-weight="600">Serving</text>
    <text x="621" y="82" text-anchor="middle" fill="var(--dg-muted, #5F6368)">Snowflake</text>
    <text x="621" y="96" text-anchor="middle" fill="var(--dg-muted, #5F6368)">tables + BI</text>
  </g>

  <g stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow2)">
    <line x1="128" y1="74" x2="146" y2="74"/>
    <line x1="266" y1="74" x2="284" y2="74"/>
    <line x1="404" y1="74" x2="422" y2="74"/>
    <line x1="542" y1="74" x2="560" y2="74"/>
  </g>

  <text x="207" y="132" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">reads WAL, doesn't query the DB directly</text>
</svg>
