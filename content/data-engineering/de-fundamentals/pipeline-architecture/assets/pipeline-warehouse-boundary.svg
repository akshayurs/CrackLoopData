<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">One pipeline, five stages</text>

  <g font-size="11" fill="var(--dg-ink, #202124)">
    <rect x="10" y="46" width="110" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="65" y="78" text-anchor="middle" font-weight="600">Source</text>

    <rect x="140" y="46" width="110" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="195" y="78" text-anchor="middle" font-weight="600">Ingestion</text>

    <rect x="270" y="46" width="110" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="325" y="78" text-anchor="middle" font-weight="600">Storage</text>

    <rect x="400" y="46" width="110" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="455" y="78" text-anchor="middle" font-weight="600">Transform</text>

    <rect x="530" y="46" width="110" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="585" y="78" text-anchor="middle" font-weight="600">Serving</text>
  </g>

  <g stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)">
    <line x1="120" y1="74" x2="138" y2="74"/>
    <line x1="250" y1="74" x2="268" y2="74"/>
    <line x1="380" y1="74" x2="398" y2="74"/>
    <line x1="510" y1="74" x2="528" y2="74"/>
  </g>

  <rect x="262" y="36" width="256" height="76" rx="10" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="390" y="126" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">the warehouse / lakehouse</text>

  <rect x="290" y="160" width="100" height="30" rx="15" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="340" y="180" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">orchestrator</text>
  <g stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,3" marker-end="url(#arrow)">
    <line x1="65" y1="160" x2="290" y2="176"/>
    <line x1="195" y1="160" x2="305" y2="172"/>
    <line x1="390" y1="160" x2="390" y2="160"/>
    <line x1="455" y1="160" x2="400" y2="172"/>
    <line x1="585" y1="160" x2="400" y2="176"/>
  </g>
</svg>
