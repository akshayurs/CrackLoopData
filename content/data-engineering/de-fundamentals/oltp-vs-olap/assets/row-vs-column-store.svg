<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="150" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Row store</text>
  <text x="480" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Column store</text>

  <!-- Row store: each row one color -->
  <g font-size="10" fill="var(--dg-ink, #202124)">
    <!-- header -->
    <text x="60" y="50">id</text><text x="120" y="50">name</text><text x="200" y="50">amount</text><text x="260" y="50">date</text>

    <g stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1">
      <rect x="30" y="58" width="240" height="30" fill="var(--dg-accent-bg, #E3F3F1)"/>
      <rect x="30" y="90" width="240" height="30" fill="var(--dg-fill, #F1F3F4)"/>
      <rect x="30" y="122" width="240" height="30" fill="var(--dg-accent-bg, #E3F3F1)"/>
      <rect x="30" y="154" width="240" height="30" fill="var(--dg-fill, #F1F3F4)"/>
    </g>
    <text x="150" y="78" text-anchor="middle">1, Ann, 40, 6/1</text>
    <text x="150" y="110" text-anchor="middle">2, Bo, 15, 6/2</text>
    <text x="150" y="142" text-anchor="middle">3, Cy, 22, 6/3</text>
    <text x="150" y="174" text-anchor="middle">4, Dee, 9, 6/4</text>
  </g>
  <text x="150" y="205" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">each full row stored together</text>
  <text x="150" y="222" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">fast: SELECT * WHERE id=3</text>

  <!-- Column store: each column one color -->
  <g font-size="10" fill="var(--dg-ink, #202124)">
    <g stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1">
      <rect x="380" y="58" width="55" height="126" fill="var(--dg-accent-bg, #E3F3F1)"/>
      <rect x="440" y="58" width="55" height="126" fill="var(--dg-fill, #F1F3F4)"/>
      <rect x="500" y="58" width="55" height="126" fill="var(--dg-accent-bg, #E3F3F1)"/>
      <rect x="560" y="58" width="55" height="126" fill="var(--dg-fill, #F1F3F4)"/>
    </g>
    <text x="407" y="50" text-anchor="middle">id</text>
    <text x="467" y="50" text-anchor="middle">name</text>
    <text x="527" y="50" text-anchor="middle">amount</text>
    <text x="587" y="50" text-anchor="middle">date</text>
    <text x="407" y="78" text-anchor="middle">1</text><text x="407" y="98" text-anchor="middle">2</text><text x="407" y="118" text-anchor="middle">3</text><text x="407" y="138" text-anchor="middle">4</text>
    <text x="467" y="78" text-anchor="middle">Ann</text><text x="467" y="98" text-anchor="middle">Bo</text><text x="467" y="118" text-anchor="middle">Cy</text><text x="467" y="138" text-anchor="middle">Dee</text>
    <text x="527" y="78" text-anchor="middle">40</text><text x="527" y="98" text-anchor="middle">15</text><text x="527" y="118" text-anchor="middle">22</text><text x="527" y="138" text-anchor="middle">9</text>
    <text x="587" y="78" text-anchor="middle">6/1</text><text x="587" y="98" text-anchor="middle">6/2</text><text x="587" y="118" text-anchor="middle">6/3</text><text x="587" y="138" text-anchor="middle">6/4</text>
  </g>
  <text x="480" y="205" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">each field stored together across rows</text>
  <text x="480" y="222" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">fast: SUM(amount) across all rows</text>
</svg>
