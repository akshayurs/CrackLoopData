<svg viewBox="0 0 660 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="330" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Watermark steps forward as event times arrive out of order</text>

  <line x1="40" y1="120" x2="620" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>

  <circle cx="120" cy="120" r="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="120" y="105" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">10:02</text>

  <circle cx="230" cy="120" r="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="230" y="105" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">10:00</text>

  <circle cx="340" cy="120" r="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="340" y="105" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">10:03</text>

  <circle cx="450" cy="120" r="7" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="450" y="105" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">10:01 (late)</text>

  <line x1="60" y1="160" x2="140" y2="160" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <line x1="140" y1="160" x2="250" y2="160" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <line x1="250" y1="160" x2="360" y2="160" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="200" y="180" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">watermark = max(event time seen) − slack</text>

  <line x1="450" y1="127" x2="360" y2="158" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3 3"/>
  <text x="450" y="200" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">arrives behind current watermark position</text>
</svg>
