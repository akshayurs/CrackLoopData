<svg viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">One event's journey from produced to processed</text>

  <line x1="40" y1="90" x2="640" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="70" cy="90" r="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="70" y="75" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Produced</text>
  <text x="70" y="110" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">🕐 t=0ms</text>

  <circle cx="220" cy="90" r="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="220" y="75" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Buffered</text>
  <text x="220" y="110" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">🕐 +20ms</text>

  <circle cx="370" cy="90" r="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="370" y="75" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">In transit</text>
  <text x="370" y="110" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">🕐 +150ms</text>

  <circle cx="500" cy="90" r="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="75" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Queued</text>
  <text x="500" y="110" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">🕐 +400ms</text>

  <circle cx="620" cy="90" r="7" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="620" y="75" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">Processed</text>
  <text x="620" y="110" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">🕐 +900ms</text>

  <line x1="70" y1="140" x2="620" y2="140" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3"/>
  <text x="70" y="160" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">event time</text>
  <text x="620" y="160" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">processing time</text>
</svg>
