<svg viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="300" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">State store checkpoints to durable storage</text>

  <rect x="30" y="60" width="440" height="120" rx="10" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="52" font-size="10" fill="var(--dg-muted, #5F6368)">Stream Processor</text>

  <line x1="10" y1="100" x2="70" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="20" y="90" font-size="8" fill="var(--dg-muted, #5F6368)">events</text>

  <rect x="70" y="80" width="180" height="80" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="100" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">State Store</text>
  <text x="90" y="120" font-size="8" fill="var(--dg-muted, #5F6368)">key A: total=42</text>
  <text x="90" y="135" font-size="8" fill="var(--dg-muted, #5F6368)">key B: total=17</text>
  <text x="90" y="150" font-size="8" fill="var(--dg-muted, #5F6368)">key C: total=9</text>

  <line x1="160" y1="160" x2="160" y2="220" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
  <text x="200" y="195" font-size="9" fill="var(--dg-muted, #5F6368)">checkpoint (periodic)</text>

  <path d="M160 220 L160 260" stroke="none"/>
  <ellipse cx="160" cy="235" rx="70" ry="15" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="90" y="220" width="140" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="none"/>
  <ellipse cx="160" cy="220" rx="70" ry="15" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="238" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Durable Storage</text>

  <path d="M240 235 C 320 235, 320 130, 250 110" fill="none" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="330" y="180" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">restore on crash</text>
</svg>
