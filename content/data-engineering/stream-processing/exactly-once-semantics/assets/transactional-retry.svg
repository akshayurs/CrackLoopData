<svg viewBox="0 0 620 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="310" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">A crash mid-transaction redoes the whole thing</text>

  <rect x="30" y="50" width="540" height="90" rx="10" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="55" y="45" font-size="10" fill="var(--dg-muted, #5F6368)">Transaction</text>

  <rect x="55" y="75" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="125" y="99" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Read (offset N)</text>
  <line x1="195" y1="95" x2="240" y2="95" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="240" y="75" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="310" y="99" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Process</text>
  <text x="330" y="70" font-size="14" fill="var(--dg-ink, #202124)">💥</text>
  <line x1="380" y1="95" x2="425" y2="95" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="425" y="75" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="495" y="99" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Write (sink)</text>

  <path d="M495 115 C 495 175, 125 175, 125 115" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="190" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">on retry: redo entire transaction from offset N</text>
</svg>
