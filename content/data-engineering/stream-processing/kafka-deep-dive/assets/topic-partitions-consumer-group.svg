<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Topic partitions and a consumer group</text>

  <rect x="20" y="80" width="90" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="65" y="101" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Producer A</text>
  <rect x="20" y="130" width="90" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="65" y="151" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Producer B</text>

  <rect x="170" y="45" width="300" height="170" rx="8" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="40" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Topic</text>

  <rect x="185" y="60" width="270" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="320" y="79" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Partition 0: [1][2][3][4]</text>
  <rect x="185" y="95" width="270" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="320" y="114" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Partition 1: [1][2][3]</text>
  <rect x="185" y="130" width="270" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="320" y="149" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Partition 2: [1][2]</text>
  <rect x="185" y="165" width="270" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="320" y="184" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Partition 3: [1][2][3][4][5]</text>

  <line x1="110" y1="97" x2="180" y2="75" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="110" y1="147" x2="180" y2="145" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="145" y="120" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">key hash</text>

  <rect x="510" y="45" width="150" height="170" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="585" y="40" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Consumer Group</text>
  <rect x="525" y="65" width="120" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="585" y="88" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Consumer 1</text>
  <text x="585" y="104" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">partitions 0, 1</text>
  <rect x="525" y="135" width="120" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="585" y="158" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Consumer 2</text>
  <text x="585" y="174" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">partitions 2, 3</text>

  <line x1="455" y1="75" x2="525" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="455" y1="110" x2="525" y2="95" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="455" y1="145" x2="525" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="455" y1="180" x2="525" y2="165" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
</svg>
