<svg viewBox="0 0 660 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="330" y="18" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Tumbling, sliding, and session windows over the same events</text>

  <text x="30" y="50" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Tumbling</text>
  <line x1="30" y1="70" x2="630" y2="70" stroke="var(--dg-line, #5F6368)"/>
  <rect x="30" y="58" width="150" height="24" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <rect x="180" y="58" width="150" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <rect x="330" y="58" width="150" height="24" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <rect x="480" y="58" width="150" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>

  <text x="30" y="115" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Sliding</text>
  <line x1="30" y1="135" x2="630" y2="135" stroke="var(--dg-line, #5F6368)"/>
  <rect x="30" y="122" width="150" height="26" fill="var(--dg-accent-bg, #E3F3F1)" fill-opacity="0.6" stroke="var(--dg-accent, #0C8F88)"/>
  <rect x="105" y="122" width="150" height="26" fill="var(--dg-accent-bg, #E3F3F1)" fill-opacity="0.6" stroke="var(--dg-accent, #0C8F88)"/>
  <rect x="180" y="122" width="150" height="26" fill="var(--dg-accent-bg, #E3F3F1)" fill-opacity="0.6" stroke="var(--dg-accent, #0C8F88)"/>
  <rect x="255" y="122" width="150" height="26" fill="var(--dg-accent-bg, #E3F3F1)" fill-opacity="0.6" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="640" y="140" font-size="8" fill="var(--dg-muted, #5F6368)">overlap</text>

  <text x="30" y="180" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Session</text>
  <line x1="30" y1="200" x2="630" y2="200" stroke="var(--dg-line, #5F6368)"/>
  <rect x="30" y="187" width="90" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <rect x="230" y="187" width="180" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <rect x="500" y="187" width="130" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="175" y="205" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">gap 110s</text>
  <text x="455" y="205" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">gap 90s</text>

  <text x="330" y="240" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Same events, three different ways of grouping them by time.</text>
</svg>
