<svg viewBox="0 0 660 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Lambda architecture: batch and speed layers merge at serving</text>

  <rect x="20" y="90" width="90" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="65" y="120" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Raw source</text>

  <line x1="110" y1="105" x2="170" y2="65" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="110" y1="125" x2="170" y2="175" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="170" y="40" width="170" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="255" y="60" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Batch Layer</text>
  <text x="255" y="76" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">periodic, complete history</text>

  <rect x="170" y="150" width="170" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="255" y="170" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Speed Layer</text>
  <text x="255" y="186" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">live stream processing</text>

  <line x1="340" y1="65" x2="410" y2="65" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="410" y="45" width="110" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="465" y="70" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Batch View</text>

  <line x1="340" y1="175" x2="410" y2="175" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="410" y="155" width="110" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="465" y="180" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Real-time View</text>

  <line x1="520" y1="70" x2="580" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="520" y1="170" x2="580" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="580" y="100" width="70" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="615" y="118" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)" font-weight="600">Serving</text>
  <text x="615" y="130" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)" font-weight="600">Layer</text>
</svg>
