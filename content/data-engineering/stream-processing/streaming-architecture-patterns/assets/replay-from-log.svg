<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">The log itself is the reprocessing mechanism</text>

  <rect x="30" y="50" width="440" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="71" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">partitioned event log — offset N marked, retention window shown</text>
  <line x1="180" y1="50" x2="180" y2="84" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="180" y="45" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">offset N</text>

  <line x1="470" y1="67" x2="530" y2="67" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="530" y="50" width="90" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="575" y="71" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Streaming Pipeline</text>

  <line x1="575" y1="84" x2="575" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="590" y="110" font-size="8" fill="var(--dg-muted, #5F6368)">live processing</text>
  <rect x="530" y="130" width="90" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="575" y="151" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Serving Layer</text>

  <path d="M530 60 C 350 190, 220 190, 180 84" fill="none" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="330" y="200" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">replay from offset N for reprocessing / backfill</text>
</svg>
