<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Hash-partitioned shuffle by customer_id</text>
  <text x="100" y="40" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">map-side write</text>
  <text x="580" y="40" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">reduce-side read</text>

  <g font-size="8">
    <rect x="20" y="50" width="140" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="90" y="64" text-anchor="middle" fill="var(--dg-ink, #202124)">source partition 0</text>
    <rect x="30" y="70" width="25" height="14" fill="var(--dg-accent-bg, #E3F3F1)"/>
    <rect x="60" y="70" width="25" height="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="90" y="70" width="25" height="14" fill="var(--dg-accent-bg, #E3F3F1)"/>
    <rect x="120" y="70" width="25" height="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>

    <rect x="20" y="120" width="140" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="90" y="134" text-anchor="middle" fill="var(--dg-ink, #202124)">source partition 1</text>
    <rect x="30" y="140" width="25" height="14" fill="var(--dg-accent-bg, #E3F3F1)"/>
    <rect x="60" y="140" width="25" height="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="90" y="140" width="25" height="14" fill="var(--dg-accent-bg, #E3F3F1)"/>
    <rect x="120" y="140" width="25" height="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>

    <rect x="20" y="190" width="140" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="90" y="204" text-anchor="middle" fill="var(--dg-ink, #202124)">source partition 2</text>
    <rect x="30" y="210" width="25" height="14" fill="var(--dg-accent-bg, #E3F3F1)"/>
    <rect x="60" y="210" width="25" height="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="90" y="210" width="25" height="14" fill="var(--dg-accent-bg, #E3F3F1)"/>
    <rect x="120" y="210" width="25" height="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  </g>

  <line x1="160" y1="80" x2="500" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="160" y1="150" x2="500" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="160" y1="150" x2="500" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="160" y1="220" x2="500" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="330" y="115" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">network transfer</text>

  <rect x="500" y="60" width="150" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="575" y="76" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">dest partition 0</text>
  <rect x="510" y="82" width="25" height="14" fill="var(--dg-accent-bg, #E3F3F1)"/>
  <text x="575" y="105" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">key range hash % 4 == 0</text>

  <rect x="500" y="130" width="150" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="575" y="146" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">dest partition 1</text>
  <rect x="510" y="152" width="25" height="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="575" y="175" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">hash % 4 == 1</text>

  <text x="340" y="260" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Each destination collects only its assigned key range.</text>
</svg>
