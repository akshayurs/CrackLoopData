<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Word count: map, shuffle, reduce</text>

  <text x="90" y="42" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Map</text>
  <rect x="20" y="50" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="66" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">chunk 1: "data is data"</text>
  <text x="90" y="80" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">-&gt; (data,1)(is,1)(data,1)</text>

  <rect x="20" y="100" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="116" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">chunk 2: "data flows"</text>
  <text x="90" y="130" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">-&gt; (data,1)(flows,1)</text>

  <text x="340" y="42" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Shuffle</text>
  <line x1="160" y1="66" x2="440" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="160" y1="82" x2="440" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="160" y1="116" x2="440" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="290" y="95" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">all "data" pairs converge</text>

  <text x="580" y="42" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Reduce</text>
  <rect x="500" y="80" width="160" height="50" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="580" y="100" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">reducer for key "data"</text>
  <text x="580" y="118" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">sum 1+1+1 -&gt; (data,3)</text>

  <line x1="160" y1="130" x2="440" y2="180" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="500" y="160" width="160" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="580" y="176" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">reducer for key "is"/"flows"</text>
  <text x="580" y="190" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">(is,1) (flows,1)</text>

  <text x="340" y="230" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">"data" appears 3 times across 2 chunks — ends up as (data, 3) at one reducer.</text>
</svg>
