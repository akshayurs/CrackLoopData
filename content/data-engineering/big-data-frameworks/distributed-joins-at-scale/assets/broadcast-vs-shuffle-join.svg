<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="170" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Broadcast join</text>
  <text x="510" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Shuffle join</text>
  <line x1="340" y1="10" x2="340" y2="280" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>

  <rect x="140" y="35" width="60" height="24" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="170" y="52" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">small tbl</text>

  <g id="bexec">
    <rect x="20" y="90" width="130" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="85" y="108" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">executor 1</text>
    <text x="85" y="122" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">copy of small tbl</text>
    <text x="85" y="134" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">+ local slice, local join</text>
  </g>
  <rect x="170" y="90" width="130" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="235" y="108" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">executor 2</text>
  <text x="235" y="122" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">copy of small tbl</text>
  <text x="235" y="134" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">+ local slice, local join</text>

  <rect x="20" y="160" width="130" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="178" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">executor 3</text>
  <text x="85" y="192" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">copy of small tbl</text>
  <rect x="170" y="160" width="130" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="235" y="178" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">executor 4</text>
  <text x="235" y="192" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">copy of small tbl</text>

  <line x1="170" y1="59" x2="85" y2="90" stroke="var(--dg-line, #5F6368)"/>
  <line x1="170" y1="59" x2="235" y2="90" stroke="var(--dg-line, #5F6368)"/>
  <line x1="170" y1="59" x2="85" y2="160" stroke="var(--dg-line, #5F6368)"/>
  <line x1="170" y1="59" x2="235" y2="160" stroke="var(--dg-line, #5F6368)"/>
  <text x="170" y="235" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">No network arrows between executors</text>

  <rect x="380" y="90" width="120" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="440" y="112" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">executor 1</text>
  <rect x="530" y="90" width="120" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="590" y="112" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">executor 2</text>
  <rect x="380" y="160" width="120" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="440" y="182" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">executor 3</text>
  <rect x="530" y="160" width="120" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="590" y="182" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">executor 4</text>

  <line x1="440" y1="114" x2="590" y2="186" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <line x1="590" y1="114" x2="440" y2="186" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <line x1="440" y1="114" x2="440" y2="186" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <line x1="590" y1="114" x2="590" y2="186" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <text x="510" y="235" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Both A and B redistributed over the network before joining</text>
</svg>
