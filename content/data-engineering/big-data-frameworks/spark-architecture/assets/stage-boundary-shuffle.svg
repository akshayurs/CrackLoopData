<svg viewBox="0 0 660 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">groupBy is the shuffle boundary between stages</text>

  <rect x="20" y="40" width="90" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="65" y="61" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">filter</text>
  <line x1="110" y1="57" x2="150" y2="57" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="150" y="40" width="90" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="195" y="61" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">map</text>
  <line x1="240" y1="57" x2="280" y2="57" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="280" y="40" width="90" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="325" y="61" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">groupBy</text>

  <line x1="325" y1="10" x2="325" y2="200" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text x="325" y="90" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">shuffle boundary</text>

  <line x1="370" y1="57" x2="410" y2="57" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="410" y="40" width="90" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="455" y="61" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">map</text>

  <text x="150" y="105" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Stage 1</text>
  <text x="500" y="105" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Stage 2</text>

  <rect x="60" y="130" width="60" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="90" y="150" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">task p0</text>
  <rect x="140" y="130" width="60" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="170" y="150" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">task p1</text>
  <rect x="220" y="130" width="60" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="250" y="150" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">task p2</text>

  <rect x="430" y="130" width="60" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="460" y="150" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">task p0</text>
  <rect x="510" y="130" width="60" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="540" y="150" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">task p1</text>

  <text x="330" y="205" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Each stage fans out into one task per partition.</text>
</svg>
