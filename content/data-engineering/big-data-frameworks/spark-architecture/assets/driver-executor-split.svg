<svg viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="300" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Driver coordinates, executors execute</text>

  <rect x="220" y="35" width="160" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="300" y="63" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Driver</text>

  <line x1="300" y1="81" x2="300" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="200" y="120" width="200" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="300" y="145" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Cluster manager</text>
  <line x1="300" y1="160" x2="300" y2="185" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="330" y="100" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">request resources</text>
  <text x="330" y="175" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">allocate</text>

  <rect x="60" y="190" width="130" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="125" y="220" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Executor 1</text>
  <rect x="235" y="190" width="130" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="300" y="220" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Executor 2</text>
  <rect x="410" y="190" width="130" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="475" y="220" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Executor 3</text>

  <line x1="230" y1="65" x2="125" y2="190" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="370" y1="65" x2="475" y2="190" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="80" y="130" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">tasks / results</text>
</svg>
