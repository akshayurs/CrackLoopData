<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Driver asks Kubernetes to schedule executor pods</text>

  <rect x="30" y="45" width="140" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="100" y="73" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Spark driver pod</text>

  <line x1="170" y1="68" x2="250" y2="68" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="210" y="60" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">request executors</text>

  <rect x="250" y="45" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="325" y="73" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Kubernetes API server</text>

  <line x1="325" y1="91" x2="150" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="325" y1="91" x2="325" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="325" y1="91" x2="500" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="30" y="160" width="230" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="145" y="178" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Worker node A</text>
  <text x="145" y="192" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">executor-1: 2 CPU / 4Gi</text>

  <rect x="30" y="205" width="230" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="145" y="223" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">executor-2: 2 CPU / 4Gi</text>

  <rect x="400" y="160" width="230" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="515" y="178" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Worker node B</text>
  <text x="515" y="192" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">executor-3: 2 CPU / 4Gi</text>

  <text x="320" y="255" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Placement decided by available CPU/memory on each node.</text>
</svg>
