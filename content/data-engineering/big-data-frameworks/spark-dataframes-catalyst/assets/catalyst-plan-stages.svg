<svg viewBox="0 0 660 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Catalyst: logical to optimized to physical</text>

  <rect x="20" y="45" width="180" height="70" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="68" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Logical Plan</text>
  <text x="110" y="86" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">syntax-valid, unresolved</text>
  <text x="110" y="98" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">column/table references</text>

  <line x1="200" y1="80" x2="240" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="240" y="45" width="190" height="70" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="335" y="63" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Optimized Logical Plan</text>
  <text x="335" y="82" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">predicate pushdown,</text>
  <text x="335" y="96" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">column pruning applied</text>

  <line x1="430" y1="80" x2="470" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="470" y="45" width="170" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="555" y="63" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Physical Plan</text>
  <text x="555" y="82" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">join strategy + scan</text>
  <text x="555" y="96" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">method chosen for executors</text>

  <text x="330" y="160" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Each stage refines the plan before it ever runs on an executor.</text>
</svg>
