<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Layered lake zones</text>

  <rect x="20" y="120" width="130" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="145" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Bronze</text>
  <text x="85" y="162" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">raw, as ingested</text>

  <rect x="220" y="120" width="130" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="285" y="145" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Silver</text>
  <text x="285" y="162" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">cleaned, conformed</text>

  <rect x="420" y="110" width="140" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="490" y="138" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Gold</text>
  <text x="490" y="155" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">curated, business-</text>
  <text x="490" y="168" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">ready</text>

  <line x1="150" y1="150" x2="218" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="184" y="112" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">clean, dedupe,</text>
  <text x="184" y="123" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">conform schema</text>

  <line x1="350" y1="150" x2="418" y2="145" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="384" y="112" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">aggregate, join,</text>
  <text x="384" y="123" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">model for use</text>

  <line x1="490" y1="180" x2="490" y2="200" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
  <text x="490" y="215" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">dashboards / warehouse</text>
</svg>
