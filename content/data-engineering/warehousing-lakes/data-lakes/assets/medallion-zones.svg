<svg viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Medallion architecture: Bronze to Silver to Gold</text>

  <rect x="20" y="60" width="60" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="50" y="80" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">sources</text>
  <line x1="80" y1="75" x2="120" y2="75" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="120" y="45" width="150" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="195" y="70" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Bronze (raw)</text>

  <line x1="270" y1="75" x2="320" y2="75" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="295" y="65" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">clean, dedupe,</text>
  <text x="295" y="95" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">conform schema</text>

  <rect x="320" y="45" width="150" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="395" y="70" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Silver (cleaned)</text>

  <line x1="470" y1="75" x2="520" y2="75" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="495" y="65" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">aggregate, join,</text>
  <text x="495" y="95" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">model for consumption</text>

  <rect x="520" y="45" width="150" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="595" y="70" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Gold (curated)</text>

  <line x1="595" y1="105" x2="595" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="595" y="160" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">dashboards / warehouse</text>
</svg>
