<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Partition pruning: one folder read, four skipped</text>

  <rect x="220" y="40" width="200" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="60" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">WHERE order_date = 2024-06-03</text>

  <g font-size="10" fill="var(--dg-muted, #5F6368)">
    <g>
      <rect x="20" y="110" width="100" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" opacity="0.45"/>
      <text x="70" y="128" text-anchor="middle" fill="var(--dg-muted, #5F6368)">2024-06-01</text>
      <text x="70" y="150" text-anchor="middle" fill="var(--dg-muted, #5F6368)">skipped</text>
    </g>
    <g>
      <rect x="140" y="110" width="100" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" opacity="0.45"/>
      <text x="190" y="128" text-anchor="middle" fill="var(--dg-muted, #5F6368)">2024-06-02</text>
      <text x="190" y="150" text-anchor="middle" fill="var(--dg-muted, #5F6368)">skipped</text>
    </g>
    <g>
      <rect x="260" y="105" width="120" height="70" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
      <text x="320" y="126" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">2024-06-03</text>
      <text x="320" y="146" text-anchor="middle" fill="var(--dg-accent, #0C8F88)" font-weight="600">read</text>
    </g>
    <g>
      <rect x="400" y="110" width="100" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" opacity="0.45"/>
      <text x="450" y="128" text-anchor="middle" fill="var(--dg-muted, #5F6368)">2024-06-04</text>
      <text x="450" y="150" text-anchor="middle" fill="var(--dg-muted, #5F6368)">skipped</text>
    </g>
    <g>
      <rect x="520" y="110" width="100" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" opacity="0.45"/>
      <text x="570" y="128" text-anchor="middle" fill="var(--dg-muted, #5F6368)">2024-06-05</text>
      <text x="570" y="150" text-anchor="middle" fill="var(--dg-muted, #5F6368)">skipped</text>
    </g>
  </g>

  <line x1="320" y1="70" x2="320" y2="103" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="200" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">only the matching partition's files are ever touched</text>
</svg>
