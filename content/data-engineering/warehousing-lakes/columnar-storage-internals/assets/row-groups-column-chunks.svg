<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="310" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Row groups, column chunks, and stats</text>

  <rect x="20" y="34" width="580" height="204" rx="8" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="30" y="30" font-size="10" fill="var(--dg-muted, #5F6368)">one Parquet file</text>

  <g font-size="10" fill="var(--dg-ink, #202124)">
    <!-- Row group 1 -->
    <text x="30" y="52" fill="var(--dg-muted, #5F6368)">Row Group 1</text>
    <rect x="30" y="58" width="180" height="42" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="210" y="58" width="180" height="42" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="390" y="58" width="190" height="42" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="120" y="82" text-anchor="middle">Column A</text>
    <text x="300" y="82" text-anchor="middle">Column B</text>
    <text x="485" y="82" text-anchor="middle">Column C</text>
    <rect x="30" y="102" width="180" height="18" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="210" y="102" width="180" height="18" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="390" y="102" width="190" height="18" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="120" y="115" text-anchor="middle" font-size="9">min/max/null-count</text>
    <text x="300" y="115" text-anchor="middle" font-size="9">min/max/null-count</text>
    <text x="485" y="115" text-anchor="middle" font-size="9">min/max/null-count</text>

    <!-- Row group 2 -->
    <text x="30" y="140" fill="var(--dg-muted, #5F6368)">Row Group 2</text>
    <rect x="30" y="146" width="180" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="210" y="146" width="180" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="390" y="146" width="190" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="120" y="162" text-anchor="middle" font-size="9">Column A chunk</text>
    <text x="300" y="162" text-anchor="middle" font-size="9">Column B chunk</text>
    <text x="485" y="162" text-anchor="middle" font-size="9">Column C chunk</text>

    <!-- Row group 3 -->
    <text x="30" y="188" fill="var(--dg-muted, #5F6368)">Row Group 3</text>
    <rect x="30" y="194" width="180" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="210" y="194" width="180" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="390" y="194" width="190" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="120" y="210" text-anchor="middle" font-size="9">Column A chunk</text>
    <text x="300" y="210" text-anchor="middle" font-size="9">Column B chunk</text>
    <text x="485" y="210" text-anchor="middle" font-size="9">Column C chunk</text>
  </g>
  <text x="310" y="250" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">stats let a query engine skip a whole row group without reading it</text>
</svg>
