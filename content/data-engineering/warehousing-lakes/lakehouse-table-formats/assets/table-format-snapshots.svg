<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Table format metadata layer over plain files</text>

  <rect x="40" y="36" width="560" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="30" font-size="11" fill="var(--dg-muted, #5F6368)">metadata layer</text>
  <rect x="60" y="50" width="80" height="28" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="100" y="68" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">v1</text>
  <rect x="160" y="50" width="80" height="28" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="200" y="68" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">v2</text>
  <rect x="260" y="46" width="90" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="305" y="68" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">v3 (current)</text>

  <g font-size="10" fill="var(--dg-muted, #5F6368)">
    <rect x="30" y="150" width="30" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="70" y="150" width="30" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="110" y="150" width="30" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="150" y="150" width="30" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="190" y="150" width="30" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="230" y="150" width="30" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="270" y="150" width="30" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="310" y="150" width="30" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="350" y="150" width="30" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="390" y="150" width="30" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  </g>
  <text x="220" y="196" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">pool of plain Parquet data files</text>

  <g stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)">
    <line x1="100" y1="78" x2="45" y2="148"/>
    <line x1="100" y1="78" x2="85" y2="148"/>
    <line x1="200" y1="78" x2="165" y2="148"/>
    <line x1="200" y1="78" x2="205" y2="148"/>
  </g>
  <g stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)">
    <line x1="305" y1="82" x2="245" y2="148"/>
    <line x1="305" y1="82" x2="285" y2="148"/>
    <line x1="305" y1="82" x2="325" y2="148"/>
    <line x1="305" y1="82" x2="365" y2="148"/>
    <line x1="305" y1="82" x2="405" y2="148"/>
  </g>
  <text x="480" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">v1/v2 reference overlapping</text>
  <text x="480" y="214" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">but different file subsets than v3</text>
</svg>
