<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">MPP: scatter the query, gather the results</text>

  <rect x="250" y="34" width="140" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Query Coordinator</text>
  <text x="320" y="18" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">revenue by region, last quarter</text>

  <g font-size="10" fill="var(--dg-ink, #202124)">
    <rect x="20" y="140" width="130" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="85" y="158" text-anchor="middle" font-weight="600">Worker 1</text>
    <text x="85" y="174" text-anchor="middle" fill="var(--dg-muted, #5F6368)">partial sum</text>

    <rect x="180" y="140" width="130" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="245" y="158" text-anchor="middle" font-weight="600">Worker 2</text>
    <text x="245" y="174" text-anchor="middle" fill="var(--dg-muted, #5F6368)">partial sum</text>

    <rect x="340" y="140" width="130" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="405" y="158" text-anchor="middle" font-weight="600">Worker 3</text>
    <text x="405" y="174" text-anchor="middle" fill="var(--dg-muted, #5F6368)">partial sum</text>

    <rect x="500" y="140" width="130" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="565" y="158" text-anchor="middle" font-weight="600">Worker 4</text>
    <text x="565" y="174" text-anchor="middle" fill="var(--dg-muted, #5F6368)">partial sum</text>
  </g>

  <g stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)">
    <line x1="290" y1="76" x2="90" y2="138"/>
    <line x1="310" y1="76" x2="248" y2="138"/>
    <line x1="330" y1="76" x2="405" y2="138"/>
    <line x1="350" y1="76" x2="562" y2="138"/>
  </g>
  <g stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)">
    <line x1="90" y1="140" x2="295" y2="80"/>
    <line x1="248" y1="140" x2="312" y2="80"/>
    <line x1="405" y1="140" x2="328" y2="80"/>
    <line x1="562" y1="140" x2="345" y2="80"/>
  </g>
  <text x="320" y="222" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">coordinator re-aggregates partial sums into the final answer</text>
</svg>
