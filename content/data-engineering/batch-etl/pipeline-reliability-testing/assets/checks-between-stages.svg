<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Checks sit between stages, not bolted onto the end</text>

  <rect x="10" y="70" width="80" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="50" y="91" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">extract</text>
  <line x1="90" y1="87" x2="120" y2="87" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="120" y="70" width="90" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="165" y="91" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">load_raw</text>
  <line x1="210" y1="87" x2="240" y2="87" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <path d="M240 87 L260 67 L280 87 L260 107 Z" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="260" y="60" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">check: freshness+volume</text>
  <line x1="280" y1="87" x2="310" y2="87" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>

  <rect x="310" y="70" width="110" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="365" y="91" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">transform_staging</text>
  <line x1="420" y1="87" x2="450" y2="87" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <path d="M450 87 L470 67 L490 87 L470 107 Z" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="470" y="60" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">check: null-rate</text>
  <line x1="490" y1="87" x2="520" y2="87" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>

  <rect x="520" y="70" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="570" y="91" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">transform_marts</text>
  <line x1="620" y1="87" x2="650" y2="87" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <path d="M650 87 L670 67 L690 87" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <rect x="590" y="150" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="640" y="171" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">serve_to_bi</text>
  <line x1="660" y1="104" x2="650" y2="150" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
  <text x="670" y="130" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">pass</text>

  <path d="M470 107 L470 190" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="380" y="190" width="180" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="470" y="211" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">halt downstream + alert</text>
  <text x="475" y="180" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">fail</text>

  <text x="350" y="245" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">A bad batch is caught before it reaches downstream stages or humans.</text>
</svg>
