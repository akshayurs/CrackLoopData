<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Dependency-aware DAG</text>

  <rect x="10" y="40" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="61" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">extract_orders</text>

  <rect x="10" y="100" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="121" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">extract_customers</text>

  <line x1="130" y1="57" x2="180" y2="87" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="130" y1="117" x2="180" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="180" y="70" width="110" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="235" y="91" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">load_raw</text>

  <line x1="290" y1="87" x2="330" y2="87" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="330" y="70" width="130" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="395" y="91" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">run_dbt_staging</text>

  <line x1="460" y1="87" x2="500" y2="87" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="500" y="70" width="130" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="565" y="91" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">run_dbt_marts</text>
  <text x="565" y="55" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">only starts once staging succeeds</text>

  <line x1="565" y1="104" x2="500" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="565" y1="104" x2="630" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="430" y="160" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="181" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">export_to_bi</text>

  <rect x="570" y="160" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="630" y="181" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">notify_slack</text>

  <text x="350" y="230" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">A task becomes eligible only once every upstream task has succeeded.</text>
</svg>
