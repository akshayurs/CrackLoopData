<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">dbt layering: each stage depends only on the one before it</text>

  <rect x="10" y="50" width="140" height="70" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="70" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Sources</text>
  <text x="80" y="88" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">raw_orders</text>
  <text x="80" y="102" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">raw_customers</text>

  <line x1="150" y1="85" x2="180" y2="85" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="180" y="50" width="150" height="70" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="255" y="70" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Staging</text>
  <text x="255" y="88" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">stg_orders</text>
  <text x="255" y="102" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">stg_customers</text>

  <line x1="330" y1="85" x2="360" y2="85" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="360" y="50" width="150" height="70" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="435" y="70" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Intermediate</text>
  <text x="435" y="88" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">int_orders_joined</text>

  <line x1="510" y1="85" x2="540" y2="85" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="540" y="50" width="150" height="70" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="615" y="70" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Marts</text>
  <text x="615" y="88" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">fct_orders</text>
  <text x="615" y="102" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">dim_customers</text>

  <text x="350" y="160" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Never skips ahead or loops back — each layer depends only on the layer to its left.</text>
</svg>
