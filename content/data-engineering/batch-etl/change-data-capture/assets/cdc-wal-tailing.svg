<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Debezium tails the WAL — it never touches the tables</text>

  <rect x="30" y="50" width="150" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Application</text>

  <rect x="30" y="150" width="150" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="184" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Postgres tables</text>

  <line x1="105" y1="100" x2="105" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="115" y="128" font-size="9" fill="var(--dg-muted, #5F6368)">normal writes</text>

  <rect x="230" y="150" width="180" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="172" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">WAL (append-only)</text>
  <text x="320" y="190" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">e1 e2 e3 e4 e5 ...</text>

  <line x1="180" y1="180" x2="230" y2="180" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="230" y="40" width="180" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="66" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Debezium connector</text>
  <text x="320" y="84" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">reads log entries only</text>

  <line x1="320" y1="150" x2="320" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <line x1="410" y1="60" x2="480" y2="60" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="480" y="35" width="130" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="545" y="65" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Kafka topic</text>

  <text x="320" y="260" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The connector behaves like a replica reading the log — never like a query on the tables.</text>
</svg>
