<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="60" y="26" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">ETL</text>
  <rect x="20" y="36" width="90" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="65" y="60" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Source</text>
  <line x1="110" y1="56" x2="150" y2="56" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="150" y="36" width="150" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="225" y="55" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Transform engine</text>
  <text x="225" y="69" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">clean, join, aggregate</text>
  <line x1="300" y1="56" x2="340" y2="56" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="340" y="36" width="160" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="420" y="55" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Warehouse</text>
  <text x="420" y="69" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">no raw data here</text>

  <text x="60" y="126" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">ELT</text>
  <rect x="20" y="136" width="90" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="65" y="160" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Source</text>
  <line x1="110" y1="156" x2="150" y2="156" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="150" y="120" width="350" height="72" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="325" y="138" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Warehouse</text>
  <text x="325" y="152" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">raw AND curated data both live here</text>
  <rect x="165" y="158" width="150" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="240" y="175" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">raw tables land first</text>
  <line x1="320" y1="171" x2="360" y2="171" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="360" y="158" width="130" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="425" y="175" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">SQL/dbt transforms</text>

  <text x="320" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Same warehouse, different position of the transform step.</text>
</svg>
