<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="310" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">One catalog, one search bar, three systems underneath</text>

  <rect x="20" y="45" width="130" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="70" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Warehouse</text>

  <rect x="20" y="100" width="130" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="125" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Data lake</text>

  <rect x="20" y="155" width="130" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="180" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">BI tool</text>

  <line x1="150" y1="65" x2="260" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="150" y1="120" x2="260" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="150" y1="175" x2="260" y2="125" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="260" y="90" width="180" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="350" y="115" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Data Catalog</text>
  <text x="350" y="135" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">🔍 search across all sources</text>

  <line x1="440" y1="120" x2="510" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="475" y="112" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">query</text>
  <circle cx="540" cy="112" r="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="540" y="140" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">user</text>
</svg>
