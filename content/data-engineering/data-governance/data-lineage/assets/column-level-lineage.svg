<svg viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Where "Total Revenue" actually came from</text>

  <rect x="10" y="60" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="88" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">raw_orders</text>

  <line x1="150" y1="83" x2="200" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="175" y="75" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">order_total</text>

  <rect x="200" y="60" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="270" y="88" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">stg_orders</text>

  <line x1="340" y1="83" x2="390" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="365" y="75" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">order_total</text>

  <rect x="390" y="60" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="460" y="88" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">fct_orders</text>

  <line x1="530" y1="83" x2="580" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="555" y="75" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">sum(order_total)</text>

  <rect x="580" y="45" width="95" height="76" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="627" y="70" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">Revenue</text>
  <text x="627" y="84" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">Dashboard</text>
  <text x="627" y="100" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">Total Revenue</text>

  <text x="340" y="150" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Each arrow labels the specific column carried forward, not just table-to-table flow.</text>
</svg>
