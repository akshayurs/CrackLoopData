<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Same table, same query, different masking by role</text>

  <rect x="250" y="40" width="140" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="60" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">customer table</text>
  <text x="320" y="76" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">... salary column ...</text>

  <line x1="280" y1="90" x2="150" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="360" y1="90" x2="490" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="180" y="105" font-size="8" fill="var(--dg-muted, #5F6368)">same SQL</text>
  <text x="450" y="105" font-size="8" fill="var(--dg-muted, #5F6368)">same SQL</text>

  <rect x="40" y="130" width="220" height="80" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="150" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">HR Analyst</text>
  <text x="150" y="170" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">name: Jane Doe</text>
  <text x="150" y="188" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">salary: $95,000</text>

  <rect x="380" y="130" width="220" height="80" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="490" y="150" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Marketing Analyst</text>
  <text x="490" y="170" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">name: Jane Doe</text>
  <text x="490" y="188" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">salary: ***MASKED***</text>

  <text x="320" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Masking is enforced at the query layer, not by separate copies of the data.</text>
</svg>
