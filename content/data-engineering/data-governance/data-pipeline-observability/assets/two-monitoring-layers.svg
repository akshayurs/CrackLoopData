<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Two independent monitoring layers over the same pipeline</text>

  <rect x="20" y="150" width="150" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="175" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">raw</text>
  <rect x="245" y="150" width="150" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="175" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">staging</text>
  <rect x="470" y="150" width="150" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="545" y="175" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">mart</text>

  <rect x="20" y="100" width="600" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="122" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">infra monitoring: CPU, job status, queue depth</text>

  <rect x="20" y="50" width="600" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="72" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">data observability: freshness, volume, schema, distribution</text>

  <text x="320" y="220" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Both layers exist independently for the same three tables.</text>
</svg>
