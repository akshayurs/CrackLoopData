<svg viewBox="0 0 620 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="310" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">CI gate validates against the contract before merge</text>

  <rect x="20" y="90" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="115" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Pull request</text>

  <line x1="140" y1="110" x2="200" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <path d="M200 80 L260 110 L200 140 Z" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="215" y="65" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">validate against contract</text>

  <line x1="260" y1="95" x2="340" y2="60" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
  <text x="360" y="55" font-size="10" fill="var(--dg-ink, #202124)">✓ compatible</text>
  <rect x="340" y="65" width="120" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="400" y="87" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Merge</text>

  <line x1="260" y1="125" x2="340" y2="170" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="360" y="185" font-size="10" fill="var(--dg-ink, #202124)">✗ breaking change</text>
  <rect x="340" y="150" width="180" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="430" y="172" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">back to developer</text>

  <text x="310" y="225" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Breaking changes are caught before they ship, not after.</text>
</svg>
