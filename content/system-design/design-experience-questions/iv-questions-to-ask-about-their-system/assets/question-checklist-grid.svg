<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Four categories, always a question left to ask</text>

  <rect x="80" y="46" width="220" height="90" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="190" y="76" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Scale</text>
  <text x="190" y="98" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">what breaks next at 10x?</text>

  <rect x="340" y="46" width="220" height="90" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="450" y="76" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Ownership</text>
  <text x="450" y="98" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">who's on call, who owns this?</text>

  <rect x="80" y="150" width="220" height="90" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="190" y="180" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Debt</text>
  <text x="190" y="202" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">what would you redesign?</text>

  <rect x="340" y="150" width="220" height="90" rx="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="450" y="180" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Decision process</text>
  <text x="450" y="202" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">how do calls get made?</text>
</svg>
