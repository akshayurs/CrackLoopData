<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">One broken assumption, three concrete costs</text>

  <rect x="220" y="46" width="200" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">we assumed X</text>
  <path d="M 270 46 L 285 102 M 300 46 L 315 102" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>

  <line x1="270" y1="102" x2="130" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="320" y1="102" x2="320" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="370" y1="102" x2="510" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="50" y="150" width="160" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="130" y="180" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">outage</text>

  <rect x="240" y="150" width="160" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="172" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">data</text>
  <text x="320" y="188" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">inconsistency</text>

  <rect x="430" y="150" width="160" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="510" y="172" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">emergency</text>
  <text x="510" y="188" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">fix required</text>

  <text x="320" y="232" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">the blast radius is traceable, not random</text>
</svg>
