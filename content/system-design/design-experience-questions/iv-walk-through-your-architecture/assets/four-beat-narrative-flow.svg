<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Four beats, cause leading to outcome</text>

  <rect x="20" y="46" width="130" height="56" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="85" y="79" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Problem</text>
  <line x1="150" y1="74" x2="170" y2="74" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="170" y="46" width="130" height="56" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="235" y="79" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Constraints</text>
  <line x1="300" y1="74" x2="320" y2="74" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="320" y="46" width="150" height="56" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="395" y="79" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Key decisions</text>
  <line x1="470" y1="74" x2="490" y2="74" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="490" y="46" width="130" height="56" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="555" y="72" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">What changed</text>
  <text x="555" y="87" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">over time</text>

  <text x="320" y="140" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">rejected shape</text>
  <rect x="60" y="156" width="520" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="320" y="186" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">built X, then Y, then Z</text>
  <line x1="80" y1="220" x2="600" y2="192" stroke="var(--dg-muted, #5F6368)" stroke-width="1.5"/>

  <text x="320" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">a feature timeline leaves the interviewer to infer why</text>
</svg>
