<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Same decision point, then vs. now</text>

  <line x1="80" y1="120" x2="560" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>

  <circle cx="160" cy="120" r="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <rect x="80" y="140" width="160" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="162" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">then</text>
  <text x="160" y="180" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">decision made with X known</text>

  <circle cx="480" cy="120" r="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <rect x="400" y="140" width="160" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="480" y="162" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">now</text>
  <text x="480" y="180" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">same point, Y now known</text>

  <line x1="160" y1="112" x2="160" y2="90" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="480" y1="112" x2="480" y2="90" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="160" y1="90" x2="480" y2="90" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="320" y="76" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">what changed in between</text>
</svg>
