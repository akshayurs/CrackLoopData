<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Every real hard decision has both boxes filled</text>

  <rect x="80" y="46" width="200" height="150" rx="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="180" y="72" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Option A -- chosen</text>
  <text x="180" y="102" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">benefit</text>
  <rect x="100" y="112" width="160" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="180" y="129" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">what A gets right</text>
  <text x="180" y="160" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">cost</text>
  <rect x="100" y="168" width="160" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="180" y="185" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">accepted downside</text>

  <rect x="360" y="46" width="200" height="150" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="460" y="72" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Option B</text>
  <text x="460" y="102" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">benefit</text>
  <rect x="380" y="112" width="160" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="460" y="129" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">what B gets right</text>
  <text x="460" y="160" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">cost</text>
  <rect x="380" y="168" width="160" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="460" y="185" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">avoided downside</text>

  <text x="320" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">the cost of B was avoided, the cost of A was accepted</text>
</svg>
