<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="30" width="150" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="95" y="52" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">doc1: "the cat sat"</text>

  <rect x="20" y="80" width="150" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="95" y="102" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">doc2: "the dog ran"</text>

  <rect x="20" y="130" width="150" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="95" y="152" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">doc3: "the cat ran"</text>

  <line x1="180" y1="97" x2="230" y2="97" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="86" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">invert</text>

  <rect x="250" y="20" width="370" height="160" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="435" y="42" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">term -&gt; postings</text>

  <text x="270" y="70" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">cat</text>
  <text x="320" y="70" font-size="12" fill="var(--dg-ink, #202124)">-&gt; [doc1, doc3]</text>

  <text x="270" y="98" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">dog</text>
  <text x="320" y="98" font-size="12" fill="var(--dg-ink, #202124)">-&gt; [doc2]</text>

  <text x="270" y="126" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">ran</text>
  <text x="320" y="126" font-size="12" fill="var(--dg-ink, #202124)">-&gt; [doc2, doc3]</text>

  <text x="270" y="154" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">sat</text>
  <text x="320" y="154" font-size="12" fill="var(--dg-ink, #202124)">-&gt; [doc1]</text>

  <text x="320" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Built once per document; lookups after this never re-scan document text.</text>
</svg>
