<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="320" y="24" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">query: "pasta recipe"</text>

  <rect x="30" y="45" width="220" height="90" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="140" y="68" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Doc A</text>
  <text x="140" y="86" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">short snippet,</text>
  <text x="140" y="101" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">"pasta" once</text>
  <text x="140" y="120" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">score 1.2</text>

  <rect x="390" y="45" width="220" height="90" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="500" y="68" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Doc B</text>
  <text x="500" y="86" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">longer article,</text>
  <text x="500" y="101" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">"pasta" x3, normalized</text>
  <text x="500" y="120" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">score 3.8</text>

  <line x1="140" y1="135" x2="290" y2="190" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="500" y1="135" x2="350" y2="190" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="220" y="190" width="200" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="211" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Ranked results</text>
  <text x="320" y="228" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">1. Doc B   2. Doc A</text>
</svg>
