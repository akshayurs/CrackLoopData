<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <!-- grid of cells -->
  <g stroke="var(--dg-stroke, #9AA0A6)" fill="var(--dg-fill, #F1F3F4)" stroke-width="1.5">
    <rect x="120" y="60" width="140" height="140"/>
    <rect x="260" y="60" width="140" height="140"/>
  </g>
  <line x1="260" y1="50" x2="260" y2="210" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">cell boundary</text>

  <!-- points close together, opposite sides -->
  <circle cx="252" cy="130" r="6" fill="var(--dg-accent, #0C8F88)"/>
  <text x="252" y="105" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Point A</text>
  <text x="252" y="160" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">u4pr</text>

  <circle cx="268" cy="130" r="6" fill="var(--dg-accent, #0C8F88)"/>
  <text x="268" y="105" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Point B</text>
  <text x="268" y="160" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">u4qb</text>

  <line x1="252" y1="130" x2="268" y2="130" stroke="var(--dg-line, #5F6368)" stroke-width="1"/>
  <text x="260" y="185" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">meters apart</text>

  <text x="320" y="245" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Physically adjacent, but prefixes diverge at the first character</text>
</svg>
