<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="10" y="80" width="120" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="107" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Search box</text>

  <line x1="130" y1="103" x2="165" y2="103" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="165" y="80" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="230" y="100" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Query parsing</text>
  <text x="230" y="115" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">/ analysis</text>

  <line x1="295" y1="103" x2="330" y2="103" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="330" y="80" width="140" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="400" y="100" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Inverted index</text>
  <text x="400" y="115" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">lookup</text>

  <line x1="470" y1="103" x2="505" y2="103" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="505" y="80" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="570" y="100" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Ranking /</text>
  <text x="570" y="115" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">scoring</text>

  <path d="M 570 126 C 570 180, 70 180, 70 126" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="320" y="195" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Ordered results returned to the search box</text>
</svg>
