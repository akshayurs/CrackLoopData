<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="270" y="20" width="100" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="46" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Coordinator</text>

  <!-- shards -->
  <g font-size="11">
    <rect x="20" y="120" width="110" height="42" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="75" y="145" text-anchor="middle" fill="var(--dg-ink, #202124)">Shard 1</text>

    <rect x="180" y="120" width="110" height="42" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="235" y="145" text-anchor="middle" fill="var(--dg-ink, #202124)">Shard 2</text>

    <rect x="350" y="120" width="110" height="42" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="405" y="145" text-anchor="middle" fill="var(--dg-ink, #202124)">Shard 3</text>

    <rect x="510" y="120" width="110" height="42" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="565" y="145" text-anchor="middle" fill="var(--dg-ink, #202124)">Shard 4</text>
  </g>

  <!-- scatter arrows -->
  <line x1="290" y1="62" x2="90" y2="118" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="305" y1="62" x2="245" y2="118" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="335" y1="62" x2="395" y2="118" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="350" y1="62" x2="550" y2="118" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="320" y="90" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">scatter</text>

  <!-- gather arrows -->
  <line x1="90" y1="162" x2="290" y2="215" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="245" y1="162" x2="305" y2="215" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="395" y1="162" x2="335" y2="215" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="550" y1="162" x2="350" y2="215" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="220" y="215" width="200" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="236" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Merge and re-rank</text>
  <text x="320" y="251" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">(gather)</text>

  <text x="320" y="290" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Every shard runs the query; the coordinator returns one final ranked list</text>
</svg>
