<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="100" width="120" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="127" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">App server</text>

  <line x1="140" y1="115" x2="200" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="140" y1="135" x2="200" y2="180" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="200" y="45" width="160" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Primary database</text>
  <text x="280" y="82" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">source of truth</text>

  <rect x="200" y="155" width="160" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="280" y="176" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">CDC stream</text>
  <text x="280" y="192" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">reads write-ahead log</text>

  <line x1="360" y1="180" x2="450" y2="180" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="405" y="170" text-anchor="middle" font-size="16" fill="var(--dg-muted, #5F6368)">&#9201;</text>
  <text x="405" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">seconds of lag</text>

  <rect x="450" y="155" width="160" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="176" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Search index</text>
  <text x="530" y="192" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">derived copy</text>

  <text x="320" y="235" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Every write needs two destinations to end up consistent</text>
</svg>
