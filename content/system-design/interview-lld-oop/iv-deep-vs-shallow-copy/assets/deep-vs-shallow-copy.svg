<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="150" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Shallow copy</text>
  <text x="480" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Deep copy</text>
  <line x1="320" y1="16" x2="320" y2="220" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="40" y="50" width="100" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="74" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Cart A</text>
  <rect x="180" y="50" width="100" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="230" y="74" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Cart B</text>

  <path d="M 90 90 C 90 130 140 150 160 150" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 230 90 C 230 130 180 150 160 150" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="110" y="150" width="100" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="160" y="174" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">items list</text>
  <text x="160" y="205" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">one shared list</text>

  <rect x="370" y="50" width="100" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="420" y="74" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Cart A</text>
  <rect x="510" y="50" width="100" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="560" y="74" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Cart B</text>

  <line x1="420" y1="90" x2="420" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="90" x2="560" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="370" y="142" width="100" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="420" y="166" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">items list (own)</text>
  <rect x="510" y="142" width="100" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="560" y="166" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">items list (own)</text>
  <text x="490" y="205" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">two separate lists, same starting contents</text>

  <text x="320" y="245" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Shallow copy shares state and can diverge unexpectedly; deep copy can't.</text>
</svg>
