<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="160" y="26" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Static dispatch (compile-time)</text>
  <text x="480" y="26" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Dynamic dispatch (runtime)</text>
  <line x1="320" y1="16" x2="320" y2="240" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="50" y="55" width="220" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="79" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">reference type: Animal</text>

  <line x1="160" y1="95" x2="160" y2="128" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="50" y="130" width="220" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="160" y="154" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Animal.identify()</text>

  <text x="160" y="195" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">compiler binds directly from</text>
  <text x="160" y="210" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">the declared type — decided once</text>

  <rect x="370" y="55" width="220" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="480" y="79" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">object instance: Dog</text>

  <line x1="480" y1="95" x2="480" y2="128" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="370" y="130" width="220" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="480" y="154" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">object's vtable</text>

  <line x1="480" y1="170" x2="480" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="370" y="200" width="220" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="480" y="222" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Dog.speak()</text>
</svg>
