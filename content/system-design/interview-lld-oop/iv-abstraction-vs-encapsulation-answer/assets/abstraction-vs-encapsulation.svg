<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">One class, two properties</text>

  <rect x="220" y="60" width="200" height="120" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="82" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">BankAccount</text>
  <text x="320" y="105" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">- balance (private)</text>
  <text x="320" y="128" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">+ deposit()</text>
  <text x="320" y="145" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">+ withdraw()</text>
  <text x="320" y="162" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">+ getBalance()</text>

  <path d="M 218 100 C 140 100 120 100 100 100" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="30" y="70" width="150" height="46" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="105" y="90" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Encapsulation</text>
  <text x="105" y="106" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">hides the data</text>

  <path d="M 422 135 C 500 135 520 135 540 135" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="460" y="150" width="150" height="46" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="535" y="170" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Abstraction</text>
  <text x="535" y="186" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">hides the complexity</text>

  <text x="320" y="225" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Not competing techniques —</text>
  <text x="320" y="243" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">abstraction is what encapsulation makes possible.</text>
</svg>
