<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="150" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">if/else version</text>
  <text x="480" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Polymorphic version</text>
  <line x1="320" y1="16" x2="320" y2="250" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="90" y="45" width="120" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="150" y="66" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">new Pentagon</text>

  <line x1="150" y1="79" x2="150" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="40" y="102" width="90" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="85" y="121" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">edit totalArea</text>

  <rect x="140" y="102" width="90" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="185" y="121" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">edit drawAll</text>

  <rect x="240" y="102" width="90" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="220" y="121" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">edit exportShapes</text>

  <line x1="150" y1="79" x2="220" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="150" y1="79" x2="285" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="150" y="160" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">3 call sites need edits</text>

  <rect x="420" y="45" width="120" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="480" y="66" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">class Pentagon</text>

  <line x1="480" y1="79" x2="480" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="400" y="117" width="160" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="480" y="138" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">implements area()</text>

  <text x="480" y="175" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">no existing call site changes</text>

  <text x="320" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Open to a new Pentagon, closed to modifying anything that already worked.</text>
</svg>
