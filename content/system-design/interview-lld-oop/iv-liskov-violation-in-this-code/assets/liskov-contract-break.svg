<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Liskov substitution break</text>

  <rect x="250" y="55" width="180" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="340" y="78" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Rectangle</text>
  <text x="340" y="96" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">setWidth/setHeight independent</text>

  <line x1="340" y1="115" x2="340" y2="153" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="250" y="155" width="180" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="340" y="178" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Square</text>
  <text x="340" y="196" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">breaks: width/height</text>
  <text x="340" y="209" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">forced to move together</text>

  <rect x="30" y="65" width="150" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="105" y="90" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">resize() caller</text>

  <path d="M 180 85 C 210 85 220 85 248 85" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="215" y="70" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">only sees Rectangle</text>

  <text x="320" y="255" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Square honors a different contract than Rectangle promised —</text>
  <text x="320" y="272" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">substitutability requires the subtype to keep every promise the base type made.</text>
</svg>
