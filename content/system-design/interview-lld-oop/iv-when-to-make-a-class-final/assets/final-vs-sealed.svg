<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="150" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">final</text>
  <text x="480" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">sealed</text>
  <line x1="320" y1="16" x2="320" y2="230" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="90" y="55" width="120" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="82" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Shape</text>
  <text x="150" y="150" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">no lines extending downward</text>
  <text x="150" y="168" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">zero subclasses possible</text>

  <rect x="420" y="45" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="480" y="70" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Shape</text>

  <line x1="440" y1="85" x2="410" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="480" y1="85" x2="480" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="520" y1="85" x2="550" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="365" y="122" width="90" height="32" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="410" y="142" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Circle</text>
  <rect x="435" y="122" width="90" height="32" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="480" y="142" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Square</text>
  <rect x="505" y="122" width="90" height="32" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="550" y="142" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Triangle</text>

  <rect x="355" y="35" width="250" height="130" rx="10" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="480" y="180" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">fixed, enumerated set — no others allowed</text>

  <text x="320" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A sealed set is what lets code pattern-match exhaustively over it.</text>
</svg>
