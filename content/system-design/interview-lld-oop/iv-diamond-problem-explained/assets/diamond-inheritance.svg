<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The diamond problem</text>

  <rect x="255" y="45" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="65" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Animal</text>
  <text x="320" y="80" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">speak()</text>

  <rect x="110" y="140" width="150" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="185" y="162" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Dog</text>
  <text x="185" y="178" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">overrides speak()</text>

  <rect x="380" y="140" width="150" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="455" y="162" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">RoboAnimal</text>
  <text x="455" y="178" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">overrides speak()</text>

  <rect x="245" y="230" width="150" height="52" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="320" y="252" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">RoboDog</text>
  <text x="320" y="268" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="700">speak() ?</text>

  <line x1="280" y1="91" x2="200" y2="138" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="360" y1="91" x2="440" y2="138" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="200" y1="192" x2="300" y2="228" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="440" y1="192" x2="345" y2="228" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="320" y="296" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">RoboDog inherits from both — which override does it actually get?</text>
</svg>
