<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="170" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Before: hard-wired</text>
  <text x="510" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">After: a seam</text>

  <rect x="90" y="50" width="160" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="170" y="76" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">OrderService</text>

  <line x1="170" y1="92" x2="170" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="90" y="132" width="160" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="170" y="158" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">PostgresRepository</text>

  <text x="170" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">no room to substitute</text>

  <line x1="330" y1="140" x2="360" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="440" y="50" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="510" y="76" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">OrderService</text>

  <line x1="510" y1="92" x2="510" y2="118" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <rect x="440" y="120" width="140" height="36" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="510" y="143" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Repository (seam)</text>

  <line x1="480" y1="156" x2="440" y2="196" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="540" y1="156" x2="580" y2="196" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="360" y="198" width="140" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="430" y="222" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">PostgresRepository</text>

  <rect x="510" y="198" width="140" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="580" y="216" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">InMemoryRepository</text>
  <text x="580" y="230" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">used in tests</text>

  <text x="340" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The seam is the interface boundary — swap what's plugged in without touching OrderService.</text>
</svg>
