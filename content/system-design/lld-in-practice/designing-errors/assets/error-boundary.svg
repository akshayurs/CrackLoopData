<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">An error boundary at the module edge</text>

  <rect x="30" y="55" width="150" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="77" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">SqlTimeoutException</text>

  <rect x="30" y="98" width="150" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="120" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">ConnectionResetError</text>

  <rect x="30" y="141" width="150" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="163" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">DiskFullError</text>

  <line x1="180" y1="72" x2="290" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="180" y1="115" x2="290" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="180" y1="158" x2="290" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <line x1="320" y1="45" x2="320" y2="230" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="3"/>
  <text x="320" y="255" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">module boundary</text>

  <rect x="290" y="95" width="60" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="119" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">translate</text>

  <line x1="350" y1="115" x2="420" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="423" y="90" width="180" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="513" y="112" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">PaymentServiceError</text>
  <text x="513" y="128" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">with reason code</text>

  <line x1="603" y1="115" x2="638" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="640" y="112" font-size="10" fill="var(--dg-ink, #202124)">Caller</text>

  <text x="340" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The caller handles one stable contract, not every library underneath.</text>
</svg>
