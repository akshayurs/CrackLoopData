<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">One seam where variation actually lives</text>

  <rect x="20" y="60" width="110" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="84" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Validate cart</text>

  <line x1="130" y1="80" x2="160" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="163" y="60" width="110" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="218" y="84" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Apply discounts</text>

  <line x1="273" y1="80" x2="303" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="306" y="52" width="150" height="56" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="381" y="76" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">PaymentStrategy</text>
  <text x="381" y="94" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">the one seam</text>

  <line x1="456" y1="80" x2="486" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="489" y="60" width="110" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="544" y="84" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Send receipt</text>

  <line x1="330" y1="108" x2="200" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="381" y1="108" x2="381" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="432" y1="108" x2="560" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <rect x="120" y="152" width="160" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="200" y="178" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">StripeStrategy</text>

  <rect x="301" y="152" width="160" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="381" y="178" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">BankTransferStrategy</text>

  <rect x="480" y="152" width="160" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="560" y="178" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">WalletStrategy</text>

  <text x="350" y="234" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Only payment varies today — the rest of checkout has no seam because it doesn't need one.</text>
</svg>
