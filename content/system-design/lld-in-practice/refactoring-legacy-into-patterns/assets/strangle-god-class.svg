<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Strangling a god class, one responsibility at a time</text>

  <rect x="20" y="50" width="170" height="160" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="70" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">GodClass</text>
  <text x="105" y="92" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">billing()</text>
  <text x="105" y="108" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">emailing()</text>
  <text x="105" y="124" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">reporting()</text>
  <text x="105" y="140" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">validation()</text>
  <text x="105" y="190" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">stage 1</text>

  <line x1="190" y1="130" x2="225" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="228" y="50" width="140" height="120" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="298" y="70" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">GodClass</text>
  <text x="298" y="92" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">delegates billing</text>
  <text x="298" y="108" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">emailing()</text>
  <text x="298" y="124" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">reporting()</text>
  <text x="298" y="140" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">validation()</text>
  <text x="298" y="150" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">stage 2</text>

  <rect x="245" y="176" width="106" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="298" y="198" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">BillingService</text>
  <line x1="298" y1="130" x2="298" y2="176" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <line x1="368" y1="110" x2="403" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="406" y="50" width="120" height="80" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="466" y="70" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">GodClass</text>
  <text x="466" y="90" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">delegates all</text>
  <text x="466" y="106" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">thin coordinator</text>
  <text x="466" y="116" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">stage 3</text>

  <rect x="406" y="150" width="100" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="456" y="169" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">BillingService</text>

  <rect x="406" y="185" width="100" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="456" y="204" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">EmailService</text>

  <rect x="406" y="220" width="100" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="456" y="239" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">ReportService</text>

  <line x1="466" y1="130" x2="466" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="350" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">GodClass never stops working mid-refactor — it just delegates more with each extraction.</text>
</svg>
