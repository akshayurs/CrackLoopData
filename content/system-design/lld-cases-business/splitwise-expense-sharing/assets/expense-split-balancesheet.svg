  <text x="145" y="176" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">user: Alice, owed: 334</text>

  <rect x="245" y="140" width="150" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="160" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Split</text>
  <text x="320" y="176" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">user: Bob, owed: 333</text>

  <rect x="420" y="140" width="150" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="495" y="160" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Split</text>
