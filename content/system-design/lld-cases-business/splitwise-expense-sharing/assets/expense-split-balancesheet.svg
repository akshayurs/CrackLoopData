  <text x="320" y="251" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">BalanceSheet</text>
  <text x="320" y="267" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">aggregates Splits per user</text>
