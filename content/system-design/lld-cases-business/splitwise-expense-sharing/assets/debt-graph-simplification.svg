<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="160" y="22" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Before: raw pairwise debts</text>
  <text x="500" y="22" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">After: simplified</text>

  <line x1="330" y1="10" x2="330" y2="300" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3,3"/>

  <!-- left graph nodes: A top, B right, C bottom-right, D bottom-left, E left -->
  <circle cx="160" cy="60" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="65" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">A</text>
  <circle cx="260" cy="130" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="260" y="135" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">B</text>
  <circle cx="220" cy="230" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="220" y="235" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">C</text>
  <circle cx="100" cy="230" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="235" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">D</text>
  <circle cx="60" cy="130" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="135" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">E</text>

  <line x1="176" y1="76" x2="245" y2="118" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="255" y1="150" x2="230" y2="212" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="200" y1="230" x2="120" y2="230" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="90" y1="212" x2="65" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="72" y1="115" x2="148" y2="72" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="150" y1="78" x2="110" y2="215" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="245" y1="145" x2="115" y2="222" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <!-- right graph -->
  <circle cx="500" cy="60" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="65" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">A</text>
  <circle cx="600" cy="130" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="600" y="135" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">B</text>
  <circle cx="560" cy="230" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="560" y="235" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">C</text>
  <circle cx="440" cy="230" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="440" y="235" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">D</text>
  <circle cx="400" cy="130" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="400" y="135" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">E</text>

  <line x1="490" y1="240" x2="415" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <line x1="580" y1="145" x2="510" y2="230" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <text x="330" y="322" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Same five people, at most one net-settling edge per remaining nonzero balance.</text>
</svg>
