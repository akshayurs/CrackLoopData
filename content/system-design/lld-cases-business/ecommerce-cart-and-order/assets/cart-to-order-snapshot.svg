<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">The cart-to-order transition</text>

  <rect x="30" y="60" width="160" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="82" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">CartItem</text>
  <text x="110" y="98" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">live ref to Product</text>
  <text x="110" y="112" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">quantity</text>

  <rect x="30" y="150" width="160" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="174" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Product</text>
  <line x1="110" y1="150" x2="110" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <line x1="200" y1="90" x2="420" y2="90" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="310" y="78" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">checkout()</text>

  <rect x="430" y="50" width="180" height="80" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="520" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">OrderItem</text>
  <text x="520" y="88" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">productName (frozen)</text>
  <text x="520" y="102" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">unitPriceAtPurchase</text>
  <text x="520" y="116" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">quantity</text>

  <text x="520" y="150" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">no live link back to Product</text>

  <text x="320" y="230" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">checkout() copies fields by value; OrderItem never re-reads Product afterward.</text>
</svg>
