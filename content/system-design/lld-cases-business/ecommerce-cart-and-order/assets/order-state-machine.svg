<svg viewBox="0 0 660 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="330" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Order state machine</text>

  <rect x="20" y="90" width="110" height="40" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="114" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">PLACED</text>
  <line x1="130" y1="110" x2="170" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="170" y="90" width="90" height="40" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="215" y="114" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">PAID</text>
  <line x1="260" y1="110" x2="300" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="300" y="90" width="100" height="40" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="350" y="114" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">SHIPPED</text>
  <line x1="400" y1="110" x2="440" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="440" y="90" width="110" height="40" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="495" y="114" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">DELIVERED</text>

  <line x1="75" y1="130" x2="75" y2="190" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
  <line x1="215" y1="130" x2="130" y2="190" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

  <rect x="30" y="200" width="140" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="100" y="224" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">CANCELLED</text>

  <line x1="495" y1="130" x2="495" y2="190" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
  <rect x="425" y="200" width="140" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="495" y="224" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">RETURNED</text>

  <text x="330" y="278" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">CANCELLED only reaches before shipment; RETURNED only after delivery.</text>
</svg>
