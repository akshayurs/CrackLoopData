<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">One SKU, many StockLevels</text>

  <rect x="250" y="46" width="140" height="44" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="72" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">SKU</text>

  <line x1="320" y1="90" x2="150" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="320" y1="90" x2="320" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="320" y1="90" x2="490" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="70" y="130" width="160" height="80" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="150" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">StockLevel A</text>
  <text x="150" y="168" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">onHand: 40</text>
  <text x="150" y="183" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">reserved: 5</text>
  <text x="150" y="198" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">available: 35</text>

  <rect x="240" y="130" width="160" height="80" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="150" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">StockLevel B</text>
  <text x="320" y="168" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">onHand: 12</text>
  <text x="320" y="183" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">reserved: 0</text>
  <text x="320" y="198" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">available: 12</text>

  <rect x="410" y="130" width="160" height="80" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="150" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">StockLevel C</text>
  <text x="490" y="168" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">onHand: 8</text>
  <text x="490" y="183" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">reserved: 2</text>
  <text x="490" y="198" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">available: 6</text>

  <text x="150" y="228" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Warehouse 1</text>
  <text x="320" y="228" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Warehouse 2</text>
  <text x="490" y="228" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Warehouse 3</text>

  <line x1="150" y1="255" x2="150" y2="288" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="70" y="288" width="160" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="314" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Reservation</text>

  <text x="320" y="352" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">A Reservation always targets one StockLevel, never the SKU directly.</text>
</svg>
