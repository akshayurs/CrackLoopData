<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Reserve then fulfill: which number moves</text>

  <line x1="130" y1="55" x2="580" y2="55" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="90" y="59" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">time</text>

  <line x1="200" y1="45" x2="200" y2="260" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3,3"/>
  <line x1="440" y1="45" x2="440" y2="260" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3,3"/>

  <text x="120" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">start</text>
  <text x="200" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">reserve 20</text>
  <text x="440" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">fulfill</text>

  <text x="60" y="120" font-size="12" fill="var(--dg-muted, #5F6368)">onHand</text>
  <text x="120" y="120" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">100</text>
  <text x="200" y="120" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">100</text>
  <text x="440" y="120" text-anchor="middle" font-size="13" fill="var(--dg-accent, #0C8F88)" font-weight="600">80</text>

  <text x="60" y="160" font-size="12" fill="var(--dg-muted, #5F6368)">reserved</text>
  <text x="120" y="160" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">0</text>
  <text x="200" y="160" text-anchor="middle" font-size="13" fill="var(--dg-accent, #0C8F88)" font-weight="600">20</text>
  <text x="440" y="160" text-anchor="middle" font-size="13" fill="var(--dg-accent, #0C8F88)" font-weight="600">0</text>

  <text x="60" y="200" font-size="12" fill="var(--dg-muted, #5F6368)">available</text>
  <text x="120" y="200" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">100</text>
  <text x="200" y="200" text-anchor="middle" font-size="13" fill="var(--dg-accent, #0C8F88)" font-weight="600">80</text>
  <text x="440" y="200" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">80</text>

  <text x="320" y="245" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Reserving moves reserved and available only; onHand is untouched.</text>
  <text x="320" y="262" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Fulfilling moves onHand and reserved back; available stays at 80 throughout.</text>
</svg>
