<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Transaction state machine</text>

  <rect x="30" y="120" width="130" height="44" rx="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="147" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">PENDING</text>

  <line x1="160" y1="132" x2="260" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="160" y1="150" x2="260" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="260" y="55" width="150" height="44" rx="22" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="335" y="82" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">COMPLETED</text>

  <rect x="260" y="178" width="150" height="44" rx="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="335" y="205" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">FAILED</text>

  <line x1="410" y1="77" x2="480" y2="77" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
  <text x="445" y="66" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">new txn</text>

  <rect x="480" y="55" width="140" height="44" rx="22" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="550" y="82" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">REVERSED</text>

  <text x="320" y="260" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">REVERSED is a separate compensating Transaction, not an edit to the original.</text>
  <text x="320" y="278" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">A completed Transaction's own record never changes after it settles.</text>
</svg>
