<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">A transfer as two linked ledger entries</text>

  <rect x="30" y="48" width="130" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="74" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Wallet</text>

  <line x1="160" y1="69" x2="200" y2="69" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="180" y="60" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">wraps</text>

  <rect x="200" y="48" width="130" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="265" y="74" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Account (source)</text>

  <rect x="480" y="48" width="130" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="545" y="74" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Account (dest)</text>

  <rect x="240" y="130" width="160" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="156" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Transaction</text>

  <line x1="280" y1="172" x2="150" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="360" y1="172" x2="490" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="60" y="220" width="180" height="66" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="240" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">LedgerEntry</text>
  <text x="150" y="257" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">amount: -5000</text>
  <text x="150" y="272" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">account: source</text>

  <rect x="400" y="220" width="180" height="66" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="240" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">LedgerEntry</text>
  <text x="490" y="257" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">amount: +5000</text>
  <text x="490" y="272" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">account: dest</text>

  <text x="320" y="308" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Both entries share one transactionId; their amounts always sum to zero.</text>
</svg>
