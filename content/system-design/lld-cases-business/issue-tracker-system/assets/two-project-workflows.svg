<svg viewBox="0 0 660 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="160" y="22" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Project A workflow</text>
  <text x="500" y="22" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Project B workflow</text>
  <line x1="330" y1="10" x2="330" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3,3"/>

  <rect x="30" y="120" width="90" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="144" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Open</text>
  <line x1="120" y1="140" x2="150" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="150" y="120" width="110" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="205" y="144" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">In Progress</text>
  <line x1="260" y1="140" x2="290" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="205" y="185" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">3 statuses, linear</text>

  <rect x="60" y="60" width="90" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="84" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Done</text>

  <rect x="380" y="60" width="80" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="420" y="82" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Open</text>
  <line x1="460" y1="78" x2="490" y2="78" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="490" y="60" width="90" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="535" y="82" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">In Progress</text>
  <line x1="580" y1="96" x2="580" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="500" y="130" width="90" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="545" y="152" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">QA Review</text>
  <line x1="500" y1="148" x2="420" y2="148" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="540" y1="130" x2="540" y2="96" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
  <text x="600" y="125" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">reopen</text>
  <line x1="545" y1="166" x2="545" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="500" y="200" width="90" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="545" y="222" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Done</text>
  <text x="500" y="260" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">4 statuses, QA gate + reopen loop</text>

  <text x="330" y="290" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Both are the same Status/Transition classes; only the rows differ.</text>
</svg>
