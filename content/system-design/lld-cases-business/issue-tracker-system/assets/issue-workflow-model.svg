<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">An issue and its configurable workflow</text>

  <rect x="30" y="50" width="140" height="52" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="100" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Issue</text>
  <text x="100" y="88" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">current status</text>

  <line x1="170" y1="76" x2="240" y2="76" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="205" y="66" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">in a</text>

  <rect x="240" y="50" width="140" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="310" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Project</text>
  <text x="310" y="88" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">selects one Workflow</text>

  <line x1="380" y1="76" x2="440" y2="76" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="410" y="66" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">uses</text>

  <rect x="440" y="50" width="150" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="515" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Workflow</text>
  <text x="515" y="88" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">owns statuses + transitions</text>

  <line x1="515" y1="102" x2="515" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <circle cx="440" cy="200" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="440" y="205" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Open</text>
  <circle cx="530" cy="200" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="205" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Doing</text>
  <circle cx="620" cy="200" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="620" y="205" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Done</text>

  <line x1="466" y1="200" x2="504" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="556" y1="200" x2="594" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="490" y="190" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Transition</text>
  <text x="580" y="190" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Transition</text>

  <line x1="100" y1="102" x2="440" y2="180" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3,3"/>
  <text x="270" y="150" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Issue's Status is one of these nodes</text>

  <text x="320" y="280" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Issue holds only its current Status; Workflow owns the graph shape.</text>
</svg>
