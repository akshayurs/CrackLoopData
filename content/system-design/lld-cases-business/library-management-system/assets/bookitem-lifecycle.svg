<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">BookItem lifecycle</text>

  <rect x="30" y="120" width="130" height="44" rx="22" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="95" y="147" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">AVAILABLE</text>

  <line x1="160" y1="132" x2="250" y2="132" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="205" y="122" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">checkout</text>

  <rect x="250" y="110" width="150" height="44" rx="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="325" y="137" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">CHECKED_OUT</text>

  <line x1="325" y1="110" x2="150" y2="60" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="230" y="70" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">return, no queue</text>

  <line x1="250" y1="130" x2="180" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="230" y="105" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)"></text>

  <rect x="30" y="200" width="130" height="44" rx="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="227" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">ON_HOLD</text>

  <line x1="250" y1="150" x2="120" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="200" y="185" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">return, queue exists</text>

  <line x1="95" y1="200" x2="95" y2="164" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="65" y="185" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">expiry</text>

  <line x1="400" y1="132" x2="480" y2="132" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
  <text x="440" y="122" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">bad return</text>

  <rect x="480" y="110" width="150" height="44" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="555" y="137" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">LOST_OR_DAMAGED</text>

  <text x="320" y="275" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">LOST_OR_DAMAGED is a dead end for this copy; it never returns to AVAILABLE.</text>
</svg>
