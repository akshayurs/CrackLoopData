<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Core library entities</text>

  <rect x="30" y="44" width="150" height="58" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="105" y="66" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Book</text>
  <text x="105" y="82" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">title, author, ISBN</text>

  <line x1="180" y1="73" x2="230" y2="73" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="205" y="63" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">1 : N</text>

  <rect x="230" y="44" width="160" height="58" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="310" y="66" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">BookItem</text>
  <text x="310" y="82" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">barcode, condition, status</text>

  <rect x="440" y="44" width="150" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="515" y="70" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Member</text>

  <rect x="230" y="150" width="160" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="310" y="172" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Loan</text>
  <text x="310" y="188" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">member, bookItem, date range</text>

  <rect x="30" y="150" width="150" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="172" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Reservation</text>
  <text x="105" y="188" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">member, book, queue pos</text>

  <line x1="310" y1="102" x2="310" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="325" y="128" font-size="10" fill="var(--dg-muted, #5F6368)">binds to</text>

  <line x1="105" y1="102" x2="105" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="118" y="128" font-size="10" fill="var(--dg-muted, #5F6368)">binds to</text>

  <line x1="440" y1="86" x2="390" y2="165" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="440" y1="86" x2="180" y2="165" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="320" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Loan binds a Member to a specific BookItem (one physical copy).</text>
  <text x="320" y="258" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Reservation binds a Member to a Book title, before any copy is free.</text>
</svg>
