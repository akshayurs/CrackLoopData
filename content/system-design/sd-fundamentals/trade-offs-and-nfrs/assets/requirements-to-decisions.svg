<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Requirements to decisions</text>

  <rect x="30" y="60" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="80" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Read-heavy</text>
  <text x="105" y="95" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">100:1 ratio</text>

  <rect x="30" y="127" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="147" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">99.99% availability</text>
  <text x="105" y="162" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">stated target</text>

  <rect x="30" y="194" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="214" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Writes can be async</text>
  <text x="105" y="229" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">stated tolerance</text>

  <line x1="180" y1="83" x2="240" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="180" y1="150" x2="240" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="180" y1="217" x2="240" y2="217" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="245" y="60" width="150" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="88" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Add a cache</text>

  <rect x="245" y="127" width="150" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="150" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Add a standby</text>
  <text x="320" y="163" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">replica + failover</text>

  <rect x="245" y="194" width="150" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="222" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Add a queue</text>

  <text x="320" y="280" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Every box should trace back to a stated requirement.</text>
</svg>
