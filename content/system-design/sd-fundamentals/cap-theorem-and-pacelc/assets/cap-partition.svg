<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A partition forces the C-vs-A choice</text>

  <rect x="60" y="60" width="200" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="160" y="88" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Data center A</text>
  <text x="160" y="104" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">receives a write</text>
  <text x="160" y="118" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">for value X</text>

  <rect x="380" y="60" width="200" height="70" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="480" y="88" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Data center B</text>
  <text x="480" y="104" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">gets a read request</text>
  <text x="480" y="118" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">for the same value</text>

  <line x1="260" y1="95" x2="380" y2="95" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="3" stroke-dasharray="6,5"/>
  <text x="320" y="80" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">network cut</text>

  <line x1="480" y1="130" x2="480" y2="165" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="330" y="165" width="140" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="400" y="188" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">CP choice</text>
  <text x="400" y="203" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">refuse until synced</text>

  <rect x="490" y="165" width="140" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="560" y="188" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">AP choice</text>
  <text x="560" y="203" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">answer with stale X</text>

  <text x="320" y="280" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">The choice only exists while the link stays down.</text>
</svg>
