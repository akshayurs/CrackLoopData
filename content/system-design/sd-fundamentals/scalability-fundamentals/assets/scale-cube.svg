<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The AKF scale cube</text>

  <rect x="260" y="140" width="120" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="166" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Single app</text>
  <text x="320" y="182" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">+ one database</text>

  <line x1="320" y1="140" x2="320" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="220" y="40" width="200" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="64" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">X: clone the whole app</text>

  <line x1="260" y1="175" x2="110" y2="245" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="15" y="245" width="190" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="264" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Y: split by function</text>
  <text x="110" y="280" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">checkout, search, auth</text>

  <line x1="380" y1="175" x2="530" y2="245" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="435" y="245" width="190" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="264" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Z: split by data</text>
  <text x="530" y="280" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">shard A-M, N-Z</text>

  <text x="320" y="320" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Real systems usually combine more than one axis.</text>
</svg>
