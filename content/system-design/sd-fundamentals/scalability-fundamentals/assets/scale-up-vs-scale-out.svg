<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="160" y="26" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Scale up</text>
  <text x="480" y="26" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Scale out</text>

  <rect x="80" y="60" width="60" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="84" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">1 node</text>
  <line x1="140" y1="80" x2="185" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="190" y="45" width="120" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="250" y="76" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Bigger node</text>
  <text x="250" y="92" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">more CPU / RAM</text>

  <text x="195" y="150" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">One machine - a single point of failure</text>

  <rect x="450" y="45" width="70" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="485" y="66" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Load balancer</text>

  <line x1="485" y1="79" x2="420" y2="112" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="485" y1="79" x2="485" y2="112" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="485" y1="79" x2="550" y2="112" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="390" y="112" width="60" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="420" y="133" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Node 1</text>
  <rect x="455" y="112" width="60" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="485" y="133" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Node 2</text>
  <rect x="520" y="112" width="60" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="550" y="133" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Node 3</text>

  <text x="485" y="172" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Many small nodes - lose one, keep serving</text>
</svg>
