<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">RTT floor vs. the latency target</text>

  <line x1="80" y1="220" x2="580" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="330" y="245" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Latency (ms)</text>

  <rect x="100" y="185" width="60" height="35" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="130" y="170" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Target: 30ms</text>

  <rect x="250" y="70" width="60" height="150" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="280" y="60" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Physical floor: 80ms</text>

  <line x1="130" y1="185" x2="130" y2="140" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4,3"/>
  <line x1="130" y1="140" x2="280" y2="140" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="205" y="132" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">the gap physics won't close</text>

  <text x="320" y="270" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Closing the gap needs data closer to users, not faster code.</text>
</svg>
