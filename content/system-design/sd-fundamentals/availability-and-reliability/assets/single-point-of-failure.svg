<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Finding the single point of failure</text>

  <rect x="270" y="45" width="100" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="67" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Clients</text>

  <line x1="320" y1="81" x2="320" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="245" y="115" width="150" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="320" y="133" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">1 Load balancer</text>
  <text x="320" y="147" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">SPOF</text>

  <line x1="320" y1="155" x2="320" y2="188" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="160" y="188" width="90" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="205" y="210" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">App node A</text>
  <rect x="270" y="188" width="90" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="315" y="210" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">App node B</text>
  <rect x="380" y="188" width="90" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="425" y="210" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">App node C</text>

  <line x1="320" y1="224" x2="320" y2="250" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="245" y="250" width="150" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="320" y="270" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">1 DB primary</text>
  <text x="320" y="282" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">no replica - SPOF</text>

  <text x="320" y="308" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Three redundant app nodes still funnel through two SPOFs.</text>
</svg>
