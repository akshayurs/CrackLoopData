<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Standard building blocks</text>

  <rect x="10" y="90" width="70" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="45" y="114" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Client</text>

  <line x1="80" y1="110" x2="115" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="120" y="90" width="70" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="155" y="114" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">CDN</text>

  <line x1="190" y1="110" x2="225" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="230" y="90" width="80" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="270" y="114" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Load balancer</text>

  <line x1="310" y1="110" x2="345" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="350" y="90" width="70" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="385" y="114" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">App tier</text>

  <line x1="420" y1="110" x2="455" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="460" y="90" width="70" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="495" y="114" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Cache</text>

  <line x1="530" y1="110" x2="565" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="570" y="90" width="80" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="610" y="114" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Database</text>

  <line x1="385" y1="130" x2="385" y2="180" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="345" y="180" width="80" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="385" y="204" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Queue</text>

  <text x="350" y="245" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Queue handles work that doesn't block the response.</text>
