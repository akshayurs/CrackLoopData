<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">One request, traced through the stack</text>

  <rect x="30" y="55" width="150" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="79" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">View product page</text>

  <line x1="105" y1="95" x2="105" y2="128" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="30" y="128" width="150" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="105" y="148" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">App server checks</text>
  <text x="105" y="161" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">cache first</text>

  <line x1="180" y1="140" x2="230" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="235" y="100" width="130" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="300" y="120" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Cache hit</text>
  <text x="300" y="133" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">fast path</text>

  <line x1="180" y1="155" x2="230" y2="175" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="235" y="160" width="130" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="300" y="180" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Cache miss</text>
  <text x="300" y="193" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">query database</text>

  <rect x="420" y="55" width="170" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="79" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Post a review</text>

  <line x1="505" y1="95" x2="505" y2="128" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="420" y="128" width="170" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="505" y="152" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Push notify job to queue</text>

  <line x1="505" y1="168" x2="505" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="420" y="200" width="170" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="220" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Response returns</text>
  <text x="505" y="233" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">before email sends</text>

  <text x="320" y="290" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Fast path optimizes the common case; the fallback stays correct.</text>
</svg>
