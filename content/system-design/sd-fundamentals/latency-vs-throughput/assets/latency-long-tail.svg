<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Latency distribution</text>

  <line x1="60" y1="240" x2="600" y2="240" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="60" y1="240" x2="60" y2="50" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="270" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Latency (ms) - increasing right</text>

  <path d="M60,240 C 130,235 170,60 230,60 C 290,60 320,220 380,235 C 440,238 480,239 600,239.5"
        fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>

  <line x1="230" y1="60" x2="230" y2="240" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="230" y="255" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">p50</text>

  <line x1="330" y1="150" x2="330" y2="240" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="330" y="255" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">p99</text>

  <rect x="420" y="200" width="150" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="495" y="220" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Long tail</text>
  <text x="495" y="234" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">p999 lives here</text>
</svg>
