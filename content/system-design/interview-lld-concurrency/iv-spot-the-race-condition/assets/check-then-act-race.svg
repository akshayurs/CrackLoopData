<svg viewBox="0 0 660 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="20" y="70" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Thread A</text>
  <line x1="20" y1="90" x2="620" y2="90" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="20" y="180" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Thread B</text>
  <line x1="20" y1="200" x2="620" y2="200" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="120" cy="90" r="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="120" y="65" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">hasNext() -&gt; true</text>

  <circle cx="330" cy="200" r="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="330" y="225" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">next() drains last item</text>

  <circle cx="500" cy="90" r="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="500" y="65" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">next() -&gt; empty!</text>

  <line x1="120" y1="90" x2="120" y2="200" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="330" y1="90" x2="330" y2="200" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="500" y1="90" x2="500" y2="200" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 3"/>

  <line x1="120" y1="250" x2="500" y2="250" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="310" y="245" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="600">gap between check and act</text>
</svg>
