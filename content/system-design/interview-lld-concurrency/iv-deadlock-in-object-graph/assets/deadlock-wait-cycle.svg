<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <rect x="60" y="30" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="130" y="58" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Thread 1</text>

  <rect x="440" y="30" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="510" y="58" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Thread 2</text>

  <rect x="60" y="220" width="140" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="130" y="248" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Lock A</text>

  <rect x="440" y="220" width="140" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="510" y="248" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Lock B</text>

  <line x1="130" y1="76" x2="130" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="70" y="150" font-size="11" fill="var(--dg-muted, #5F6368)">holds</text>

  <line x1="510" y1="76" x2="510" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="150" font-size="11" fill="var(--dg-muted, #5F6368)">holds</text>

  <path d="M 200 45 C 320 20, 380 20, 440 45" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-accent)"/>
  <text x="320" y="20" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">waits for Lock B</text>

  <path d="M 440 245 C 320 275, 260 275, 200 245" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-accent)"/>
  <text x="320" y="292" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">waits for Lock A</text>
</svg>
