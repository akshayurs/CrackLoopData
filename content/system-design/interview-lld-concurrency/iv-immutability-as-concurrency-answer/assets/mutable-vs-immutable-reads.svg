  <rect x="450" y="120" width="70" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="485" y="141" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Immutable</text>
  <text x="485" y="155" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">snapshot</text>

  <rect x="390" y="40" width="60" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="420" y="57" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Reader 1</text>
  <rect x="520" y="40" width="60" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="550" y="57" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Reader 2</text>
  <rect x="390" y="200" width="60" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="420" y="217" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Reader 3</text>
  <rect x="520" y="200" width="60" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="550" y="217" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Reader 4</text>
  <rect x="455" y="235" width="60" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="485" y="252" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Reader 5</text>

  <line x1="425" y1="66" x2="460" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="545" y1="66" x2="510" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="425" y1="200" x2="460" y2="166" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="545" y1="200" x2="510" y2="166" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="485" y1="235" x2="485" y2="166" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="485" y="285" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">each reads independently, no lock</text>
