  <rect x="190" y="200" width="60" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="220" y="217" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Reader 4</text>
  <rect x="125" y="235" width="60" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="155" y="252" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Reader 5</text>

  <line x1="95" y1="66" x2="130" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
