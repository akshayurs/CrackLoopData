<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <rect x="30" y="80" width="70" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="65" y="108" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Producer</text>

  <g>
    <rect x="180" y="90" width="40" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="220" y="90" width="40" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="260" y="90" width="40" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="300" y="90" width="40" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="340" y="90" width="40" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  </g>
  <text x="280" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Bounded queue</text>

  <rect x="450" y="80" width="70" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="485" y="108" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Consumer</text>

  <line x1="100" y1="103" x2="178" y2="103" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="382" y1="103" x2="448" y2="103" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M 65 126 C 65 165, 200 175, 240 130" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-accent)"/>
  <text x="150" y="180" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">blocks on full</text>

  <path d="M 320 130 C 320 175, 420 170, 485 128" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-accent)"/>
  <text x="420" y="190" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">blocks on empty</text>
</svg>
