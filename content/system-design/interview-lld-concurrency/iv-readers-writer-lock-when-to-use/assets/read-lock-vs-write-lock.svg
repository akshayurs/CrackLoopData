<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="155" y="26" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Read lock: shared</text>
  <text x="485" y="26" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Write lock: exclusive</text>

  <rect x="105" y="150" width="100" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="155" y="178" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Read lock</text>

  <rect x="30" y="60" width="70" height="28" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="65" y="79" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Reader 1</text>
  <rect x="120" y="60" width="70" height="28" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="155" y="79" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Reader 2</text>
  <rect x="210" y="60" width="70" height="28" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="245" y="79" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Reader 3</text>

  <line x1="65" y1="88" x2="130" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="155" y1="88" x2="155" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="245" y1="88" x2="180" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="155" y="225" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">all three hold it at once</text>

  <rect x="435" y="150" width="100" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="485" y="178" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Write lock</text>

  <rect x="450" y="60" width="70" height="28" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="485" y="79" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Writer</text>

  <line x1="485" y1="88" x2="485" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="375" y="60" width="60" height="26" rx="6" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="405" y="77" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">no others</text>
  <rect x="535" y="60" width="60" height="26" rx="6" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="565" y="77" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">no others</text>

  <text x="485" y="225" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">blocks readers and writers alike</text>
</svg>
