<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="320" y="26" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">5-node cluster split by a partition</text>

  <line x1="320" y1="45" x2="270" y2="240" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="330" y="60" font-size="10" fill="var(--dg-muted, #5F6368)">partition</text>

  <text x="150" y="70" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Majority (3)</text>
  <circle cx="90" cy="110" r="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="90" y="115" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">N1</text>
  <text x="90" y="90" text-anchor="middle" font-size="14">&#9819;</text>
  <circle cx="150" cy="150" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="155" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">N2</text>
  <circle cx="210" cy="110" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="210" y="115" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">N3</text>
  <text x="150" y="200" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">keeps leader, accepts writes</text>

  <text x="500" y="70" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Minority (2)</text>
  <circle cx="460" cy="130" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" opacity="0.5"/>
  <text x="460" y="135" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">N4</text>
  <circle cx="540" cy="130" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" opacity="0.5"/>
  <text x="540" y="135" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">N5</text>
  <text x="500" y="200" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">read-only, stepped down</text>
</svg>
