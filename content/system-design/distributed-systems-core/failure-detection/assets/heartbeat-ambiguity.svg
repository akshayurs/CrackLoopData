<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Both look identical until the timeout</text>

  <text x="20" y="60" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">GC pause</text>
  <line x1="20" y1="75" x2="600" y2="75" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="60" cy="75" r="4" fill="var(--dg-ink, #202124)"/>
  <circle cx="110" cy="75" r="4" fill="var(--dg-ink, #202124)"/>
  <circle cx="160" cy="75" r="4" fill="var(--dg-ink, #202124)"/>
  <rect x="185" y="65" width="180" height="20" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3"/>
  <text x="275" y="79" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">GC pause</text>
  <circle cx="420" cy="75" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <text x="430" y="70" font-size="9" fill="var(--dg-muted, #5F6368)">resumes</text>
  <circle cx="470" cy="75" r="4" fill="var(--dg-accent, #0C8F88)"/>

  <text x="20" y="130" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Real crash</text>
  <line x1="20" y1="145" x2="600" y2="145" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="60" cy="145" r="4" fill="var(--dg-ink, #202124)"/>
  <circle cx="110" cy="145" r="4" fill="var(--dg-ink, #202124)"/>
  <circle cx="160" cy="145" r="4" fill="var(--dg-ink, #202124)"/>
  <text x="160" y="130" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">crash</text>
  <text x="360" y="140" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">silence forever</text>

  <line x1="365" y1="45" x2="365" y2="200" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="365" y="215" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">timeout threshold</text>
</svg>
