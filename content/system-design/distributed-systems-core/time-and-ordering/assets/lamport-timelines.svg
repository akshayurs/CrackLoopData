<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="120" y="26" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Node A</text>
  <line x1="120" y1="40" x2="120" y2="250" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="120" cy="90" r="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="132" y="94" font-size="10" fill="var(--dg-muted, #5F6368)">1</text>
  <circle cx="120" cy="150" r="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="132" y="154" font-size="10" fill="var(--dg-muted, #5F6368)">2</text>

  <text x="320" y="26" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Node B</text>
  <line x1="320" y1="40" x2="320" y2="250" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="320" cy="100" r="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="332" y="104" font-size="10" fill="var(--dg-muted, #5F6368)">1</text>
  <circle cx="320" cy="200" r="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="332" y="204" font-size="10" fill="var(--dg-muted, #5F6368)">max(A,B)+1 = 3</text>

  <line x1="120" y1="150" x2="320" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="200" y="165" font-size="10" fill="var(--dg-muted, #5F6368)">message</text>

  <text x="520" y="26" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Node C</text>
  <line x1="520" y1="40" x2="520" y2="250" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="520" cy="90" r="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="532" y="94" font-size="10" fill="var(--dg-muted, #5F6368)">1</text>
  <circle cx="520" cy="150" r="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="532" y="154" font-size="10" fill="var(--dg-muted, #5F6368)">2</text>

  <text x="520" y="230" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">concurrent — order</text>
  <text x="520" y="245" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">not determined</text>
</svg>
