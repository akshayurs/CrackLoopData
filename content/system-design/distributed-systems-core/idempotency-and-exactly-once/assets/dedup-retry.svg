<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <rect x="30" y="30" width="120" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="56" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Client</text>

  <rect x="470" y="30" width="140" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="540" y="56" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Server</text>

  <line x1="150" y1="45" x2="465" y2="45" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="300" y="35" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">charge card, req id=X</text>
  <line x1="465" y1="60" x2="150" y2="60" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3"/>
  <text x="300" y="78" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">ack lost / slow</text>

  <line x1="150" y1="110" x2="465" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="300" y="100" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">retry: charge card, req id=X</text>

  <rect x="470" y="140" width="140" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="540" y="160" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">dedup store</text>
  <text x="540" y="176" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">req id=X seen</text>
  <text x="540" y="190" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">reject duplicate</text>
  <line x1="540" y1="110" x2="540" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
</svg>
