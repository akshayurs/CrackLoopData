<svg viewBox="0 0 660 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="30" y="55" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Worker 1</text>
  <line x1="30" y1="70" x2="600" y2="70" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="70" y="55" width="70" height="30" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="105" y="75" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">acquires lock</text>

  <rect x="180" y="55" width="180" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3"/>
  <text x="270" y="75" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">GC pause</text>

  <line x1="360" y1="40" x2="360" y2="100" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="360" y="35" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">lock expiry</text>

  <rect x="500" y="55" width="90" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="545" y="75" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">resumes, writes</text>

  <text x="30" y="150" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Worker 2</text>
  <line x1="30" y1="165" x2="600" y2="165" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="370" y="150" width="220" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="480" y="170" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">acquires lock, writes</text>

  <rect x="500" y="200" width="90" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3"/>
  <text x="545" y="217" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">overlap</text>
  <line x1="545" y1="200" x2="545" y2="85" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3 3"/>
  <line x1="545" y1="200" x2="545" y2="180" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3 3"/>
  <text x="545" y="245" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">both workers write, unaware of each other</text>
</svg>
