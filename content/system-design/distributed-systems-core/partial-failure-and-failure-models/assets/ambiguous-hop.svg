<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <rect x="20" y="70" width="110" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="75" y="97" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Gateway</text>
  <line x1="130" y1="93" x2="185" y2="93" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="190" y="70" width="110" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="245" y="97" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Service A</text>

  <line x1="300" y1="93" x2="350" y2="93" stroke="var(--dg-line, #5F6368)" stroke-dasharray="5 4"/>
  <text x="325" y="80" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">connection</text>
  <text x="325" y="115" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">broken</text>

  <rect x="355" y="70" width="110" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="410" y="97" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Service B</text>
  <line x1="465" y1="93" x2="520" y2="93" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="525" y="70" width="100" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="575" y="97" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Database</text>

  <rect x="150" y="150" width="190" height="46" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="245" y="170" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">"did B receive it?"</text>
  <text x="245" y="186" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Service A can't tell</text>
  <line x1="245" y1="150" x2="245" y2="116" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3 3"/>
</svg>
