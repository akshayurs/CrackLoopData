<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Design partitioned by residency boundary</text>

  <rect x="40" y="60" width="240" height="130" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="160" y="82" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">EU region</text>
  <rect x="70" y="100" width="180" height="60" rx="7" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="126" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">EU user data</text>
  <text x="160" y="142" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">stays inside the boundary</text>

  <rect x="420" y="60" width="240" height="130" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="540" y="82" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">US region</text>
  <rect x="450" y="100" width="180" height="60" rx="7" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="540" y="126" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">US user data</text>
  <text x="540" y="142" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">stays inside the boundary</text>

  <rect x="250" y="210" width="200" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="350" y="230" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Shared metadata /</text>
  <text x="350" y="245" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">analytics store</text>

  <line x1="160" y1="190" x2="280" y2="222" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="540" y1="190" x2="420" y2="222" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="350" y="278" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">non-personal data replicates freely across the boundary</text>
</svg>
