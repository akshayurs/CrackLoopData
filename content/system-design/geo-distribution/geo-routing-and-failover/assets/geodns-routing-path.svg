<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Request routing path under normal operation</text>

  <rect x="20" y="110" width="100" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="135" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Client device</text>

  <line x1="120" y1="122" x2="158" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="135" y="98" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">1. DNS query</text>

  <rect x="160" y="60" width="110" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="215" y="85" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Resolver</text>

  <line x1="270" y1="81" x2="308" y2="81" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="310" y="60" width="140" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="380" y="81" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Authoritative GeoDNS</text>
  <text x="380" y="94" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">nearest healthy region</text>

  <line x1="380" y1="102" x2="130" y2="146" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="250" y="150" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">2. returns region IP</text>

  <line x1="70" y1="152" x2="490" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="270" y="195" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">3. request directly to that IP</text>

  <rect x="500" y="180" width="150" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="575" y="202" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Region load balancer</text>

  <text x="350" y="252" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">DNS resolution and the actual request are two separate trips — staleness enters right there.</text>
</svg>
