<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Single-region blast radius</text>

  <ellipse cx="240" cy="150" rx="200" ry="110" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="240" y="55" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">blast radius: one region</text>

  <rect x="150" y="90" width="180" height="34" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="112" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Load balancer</text>

  <line x1="240" y1="124" x2="240" y2="146" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="120" y="148" width="90" height="34" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="165" y="170" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">App server</text>
  <rect x="270" y="148" width="90" height="34" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="315" y="170" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">App server</text>

  <line x1="165" y1="182" x2="230" y2="206" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="315" y1="182" x2="250" y2="206" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="180" y="208" width="120" height="34" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="230" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Database</text>

  <line x1="450" y1="150" x2="510" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <rect x="512" y="115" width="170" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="597" y="140" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Region-wide outage</text>
  <text x="597" y="158" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">takes down 100% of</text>
  <text x="597" y="172" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">traffic</text>

  <text x="350" y="270" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Everything inside one region shares fate — total simplicity, but the blast radius is the whole service.</text>
</svg>
