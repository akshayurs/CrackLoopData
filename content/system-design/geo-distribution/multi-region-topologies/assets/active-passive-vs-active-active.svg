<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Active-passive vs active-active</text>

  <text x="165" y="52" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Active-passive</text>
  <rect x="55" y="66" width="100" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="105" y="87" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Primary (dead)</text>

  <rect x="185" y="66" width="100" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="235" y="87" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Standby -&gt; promoted</text>

  <line x1="155" y1="86" x2="183" y2="86" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="170" y="65" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">failover</text>

  <text x="170" y="130" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">one "before" / "after" moment —</text>
  <text x="170" y="144" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">traffic moves wholesale when</text>
  <text x="170" y="158" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">the primary dies</text>

  <line x1="350" y1="55" x2="350" y2="260" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="540" y="52" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Active-active</text>
  <rect x="465" y="90" width="50" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="109" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Router</text>

  <rect x="400" y="140" width="90" height="36" rx="7" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="445" y="162" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Region A</text>

  <rect x="580" y="140" width="90" height="36" rx="7" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="625" y="162" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Region B</text>

  <line x1="480" y1="118" x2="450" y2="138" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="500" y1="118" x2="620" y2="138" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <line x1="490" y1="158" x2="578" y2="158" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="535" y="148" text-anchor="middle" font-size="8" fill="var(--dg-accent, #0C8F88)">replication</text>

  <text x="540" y="220" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">no single moment — both regions</text>
  <text x="540" y="234" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">always live; the bidirectional</text>
  <text x="540" y="248" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">replication arrow is the tell</text>
</svg>
