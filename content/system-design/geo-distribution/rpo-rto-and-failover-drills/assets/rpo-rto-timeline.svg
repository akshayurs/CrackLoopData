<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">RPO and RTO on the timeline</text>

  <line x1="40" y1="120" x2="660" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="150" cy="120" r="5" fill="var(--dg-ink, #202124)"/>
  <text x="150" y="100" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Last backup</text>

  <circle cx="350" cy="120" r="6" fill="var(--dg-accent, #0C8F88)"/>
  <text x="350" y="100" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Failure</text>

  <circle cx="560" cy="120" r="5" fill="var(--dg-ink, #202124)"/>
  <text x="560" y="100" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Service restored</text>

  <line x1="150" y1="150" x2="350" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <line x1="150" y1="143" x2="150" y2="157" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <line x1="350" y1="143" x2="350" y2="157" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="250" y="172" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">RPO — data at risk</text>

  <line x1="350" y1="190" x2="560" y2="190" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2"/>
  <line x1="350" y1="183" x2="350" y2="197" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2"/>
  <line x1="560" y1="183" x2="560" y2="197" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2"/>
  <text x="455" y="212" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">RTO — time to restore</text>

  <text x="350" y="245" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">RPO looks backward from the failure; RTO looks forward — two different measurements.</text>
</svg>
