<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Shallow clone vs deep clone</text>

  <rect x="50" y="60" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="115" y="88" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">original</text>

  <rect x="150" y="150" width="120" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="210" y="178" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">nested list</text>

  <line x1="115" y1="106" x2="190" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="330" y="60" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="395" y="88" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">shallow clone</text>

  <line x1="395" y1="106" x2="240" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="130" font-size="9" fill="var(--dg-accent, #0C8F88)">same box</text>

  <rect x="480" y="60" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="545" y="88" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">deep clone</text>

  <line x1="545" y1="106" x2="545" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="480" y="150" width="130" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="545" y="178" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">own copy of list</text>

  <text x="320" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Shallow clone shares the nested list with the original — one mutation, two objects affected.</text>
  <text x="320" y="256" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Deep clone owns a fresh copy that only it can mutate.</text>
</svg>
