<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Three roles in Builder</text>

  <rect x="50" y="70" width="150" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="125" y="96" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Director</text>
  <text x="125" y="112" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">calls steps in fixed order</text>

  <line x1="200" y1="100" x2="245" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="245" y="70" width="150" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="96" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Builder</text>
  <text x="320" y="112" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">accumulates via chained setters</text>

  <line x1="395" y1="100" x2="440" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="440" y="70" width="150" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="515" y="96" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Product</text>
  <text x="515" y="112" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">returned by build()</text>

  <text x="320" y="180" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Director is optional — most code calls the Builder's methods directly.</text>
</svg>
