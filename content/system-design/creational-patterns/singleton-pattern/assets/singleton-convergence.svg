<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Every caller converges on one instance</text>

  <rect x="30" y="60" width="150" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="86" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">OrderService</text>

  <rect x="30" y="130" width="150" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="156" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">PaymentService</text>

  <rect x="30" y="200" width="150" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="226" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">ReportService</text>

  <line x1="180" y1="81" x2="400" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="180" y1="151" x2="400" y2="151" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="180" y1="221" x2="400" y2="162" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="290" y="120" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">getInstance()</text>

  <rect x="410" y="126" width="180" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="500" y="156" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">ConfigManager</text>

  <text x="320" y="235" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">the single instance</text>
