<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Abstract Factory keeps families consistent</text>

  <rect x="60" y="50" width="150" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="135" y="71" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">DarkUiFactory</text>

  <line x1="110" y1="84" x2="90" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="160" y1="84" x2="200" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="40" y="120" width="100" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="140" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">DarkButton</text>

  <rect x="150" y="120" width="100" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="200" y="140" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">DarkCheckbox</text>

  <rect x="430" y="50" width="150" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="71" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">LightUiFactory</text>

  <line x1="460" y1="84" x2="440" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="540" y1="84" x2="580" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="390" y="120" width="100" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="440" y="140" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">LightButton</text>

  <rect x="530" y="120" width="100" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="580" y="140" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">LightCheckbox</text>

  <line x1="90" y1="150" x2="580" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="335" y="170" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">DarkButton + LightCheckbox — not allowed</text>

  <text x="320" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Every product a factory creates comes from the same family — never mixed.</text>
</svg>
