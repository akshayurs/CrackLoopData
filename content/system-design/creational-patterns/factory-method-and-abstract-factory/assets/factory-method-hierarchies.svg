<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Two parallel hierarchies</text>

  <text x="160" y="48" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">creators</text>
  <rect x="80" y="56" width="160" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="77" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">DialogBox</text>

  <line x1="130" y1="90" x2="90" y2="120" stroke="var(--dg-line, #5F6368)"/>
  <line x1="190" y1="90" x2="230" y2="120" stroke="var(--dg-line, #5F6368)"/>

  <rect x="30" y="120" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="141" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">WindowsDialogBox</text>

  <rect x="170" y="120" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="230" y="141" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">MacDialogBox</text>

  <text x="480" y="48" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">products</text>
  <rect x="400" y="56" width="160" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="480" y="77" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Button</text>

  <line x1="450" y1="90" x2="410" y2="120" stroke="var(--dg-line, #5F6368)"/>
  <line x1="510" y1="90" x2="550" y2="120" stroke="var(--dg-line, #5F6368)"/>

  <rect x="350" y="120" width="120" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="410" y="141" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">WindowsButton</text>

  <rect x="490" y="120" width="120" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="550" y="141" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">MacButton</text>

  <line x1="90" y1="130" x2="410" y2="130" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="230" y1="130" x2="550" y2="130" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="320" y="180" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">createButton() pairs each creator with its matching product</text>

  <text x="320" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each creator subclass always returns exactly one matching product subclass.</text>
</svg>
