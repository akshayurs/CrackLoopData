<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The 23 GoF patterns, three families</text>

  <rect x="30" y="46" width="190" height="230" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="125" y="70" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Creational (5)</text>
  <text x="125" y="94" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Factory Method</text>
  <text x="125" y="114" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Abstract Factory</text>
  <text x="125" y="134" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Builder</text>
  <text x="125" y="154" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Singleton</text>
  <text x="125" y="174" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Prototype</text>

  <rect x="230" y="46" width="190" height="230" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="325" y="70" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Structural (7)</text>
  <text x="325" y="94" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Adapter, Bridge, Composite,</text>
  <text x="325" y="112" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Decorator, Facade, Flyweight,</text>
  <text x="325" y="130" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Proxy</text>

  <rect x="430" y="46" width="190" height="230" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="525" y="70" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Behavioral (11)</text>
  <text x="525" y="94" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Strategy, Observer, Command,</text>
  <text x="525" y="112" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">State, Template Method,</text>
  <text x="525" y="130" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Iterator, Visitor, and more</text>

</svg>
