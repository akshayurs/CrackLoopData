<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Time-series write path</text>

  <rect x="20" y="60" width="110" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Metric points</text>
  <text x="75" y="95" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">arriving continuously</text>

  <line x1="130" y1="83" x2="168" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="170" y="60" width="110" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="225" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Write buffer</text>
  <text x="225" y="95" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">batches points</text>

  <line x1="280" y1="83" x2="318" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="320" y="60" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="395" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Raw blocks (disk)</text>
  <text x="395" y="95" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">time-ordered, by range</text>

  <line x1="395" y1="106" x2="395" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="320" y="150" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="395" y="170" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Downsampler</text>
  <text x="395" y="185" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">reads recent raw blocks</text>

  <line x1="470" y1="173" x2="508" y2="173" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="510" y="150" width="150" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="585" y="170" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Rollup blocks</text>
  <text x="585" y="185" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">1-min averages</text>

  <rect x="320" y="230" width="150" height="40" rx="8" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.55"/>
  <text x="395" y="254" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">older raw blocks — deleted</text>
  <line x1="395" y1="196" x2="395" y2="228" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <text x="340" y="290" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Batching, downsampling, and retention run continuously, in parallel with ingest.</text>
</svg>
