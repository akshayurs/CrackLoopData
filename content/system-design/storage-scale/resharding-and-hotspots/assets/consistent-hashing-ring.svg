<svg viewBox="0 0 500 420" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="250" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Consistent hashing ring</text>

  <circle cx="250" cy="220" r="150" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <circle cx="250" cy="70" r="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="75" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">A</text>

  <circle cx="400" cy="220" r="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="400" y="225" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">B</text>

  <circle cx="250" cy="370" r="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="375" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">C</text>

  <circle cx="115" cy="145" r="17" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="115" y="150" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">D</text>
  <text x="115" y="115" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">new node</text>

  <path d="M 250 70 A 150 150 0 0 0 115 145" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="3"/>

  <text x="180" y="95" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">only this arc's</text>
  <text x="175" y="108" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">keys move to D</text>

  <text x="330" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">keys here still</text>
  <text x="330" y="163" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">go to A, unchanged</text>

  <text x="250" y="405" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">adding node D moves only ~1/N of keys; B and C are untouched</text>
</svg>
