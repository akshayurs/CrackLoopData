<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="360" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Record lifecycle</text>

  <rect x="10" y="90" width="140" height="52" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="80" y="112" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Primary store</text>
  <text x="80" y="128" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">hot, SSD</text>

  <line x1="150" y1="116" x2="188" y2="116" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="169" y="106" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">30 days</text>

  <rect x="190" y="90" width="140" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="260" y="112" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Warm tier</text>
  <text x="260" y="128" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">cheaper disk</text>

  <line x1="330" y1="116" x2="368" y2="116" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="349" y="106" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">1 year</text>

  <rect x="370" y="90" width="150" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="445" y="112" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Cold archive</text>
  <text x="445" y="128" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">object storage / tape-class</text>

  <line x1="520" y1="116" x2="558" y2="116" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="539" y="106" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">7 years</text>

  <rect x="560" y="90" width="140" height="52" rx="8" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.7"/>
  <text x="630" y="121" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Deleted</text>

  <line x1="80" y1="180" x2="630" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="90" y="196" text-anchor="start" font-size="10" fill="var(--dg-muted, #5F6368)">lower storage cost</text>
  <text x="80" y="212" text-anchor="start" font-size="10" fill="var(--dg-muted, #5F6368)">higher retrieval latency</text>
</svg>
