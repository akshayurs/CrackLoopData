<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="165" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Local secondary index</text>
  <text x="535" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Global secondary index</text>
  <line x1="345" y1="10" x2="345" y2="300" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,4" opacity="0.5"/>

  <rect x="110" y="40" width="110" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="165" y="63" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Read query</text>

  <line x1="140" y1="76" x2="55" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="165" y1="76" x2="165" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="190" y1="76" x2="275" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="10" y="130" width="100" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="150" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Shard 1</text>
  <text x="60" y="166" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">own local index</text>

  <rect x="120" y="130" width="100" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="170" y="150" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Shard 2</text>
  <text x="170" y="166" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">own local index</text>

  <rect x="230" y="130" width="100" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="280" y="150" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Shard 3</text>
  <text x="280" y="166" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">own local index</text>

  <text x="165" y="215" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">every read fans out to all shards</text>

  <rect x="480" y="40" width="110" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="535" y="63" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Read query</text>

  <line x1="535" y1="76" x2="535" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="465" y="107" width="140" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="535" y="132" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Index shard</text>

  <line x1="535" y1="147" x2="645" y2="185" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.75" marker-end="url(#arrow)"/>

  <rect x="380" y="187" width="90" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="425" y="217" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Data shard A</text>

  <rect x="480" y="187" width="90" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="525" y="217" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Data shard B</text>

  <rect x="600" y="187" width="90" height="52" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="645" y="207" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Data shard C</text>
  <text x="645" y="223" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">correct shard</text>

  <text x="535" y="270" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">two hops: index shard, then the one correct data shard</text>
  <text x="535" y="288" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">index shard must stay in sync with every write cluster-wide</text>
</svg>
