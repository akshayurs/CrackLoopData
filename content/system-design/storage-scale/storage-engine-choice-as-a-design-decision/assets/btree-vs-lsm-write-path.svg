<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="165" y="22" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">B-tree write</text>
  <text x="515" y="22" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">LSM-tree write</text>
  <line x1="335" y1="10" x2="335" y2="280" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,4" opacity="0.5"/>

  <text x="60" y="55" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">write</text>
  <line x1="30" y1="60" x2="90" y2="60" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="90" y="42" width="150" height="46" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="165" y="63" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Disk page</text>
  <text x="165" y="78" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">read-modify-write back</text>

  <path d="M 240 50 C 270 30, 270 30, 240 78" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="45" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">in-place loop</text>

  <text x="60" y="150" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">read</text>
  <line x1="30" y1="155" x2="90" y2="155" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="120" y1="155" x2="150" y2="90" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="165" y="175" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">one hop, same page</text>

  <text x="165" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Cost paid on every write; a read is a single hop</text>

  <text x="440" y="55" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">write</text>
  <line x1="410" y1="60" x2="450" y2="60" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="450" y="42" width="110" height="36" rx="7" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="505" y="64" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Memory buffer</text>

  <line x1="505" y1="78" x2="505" y2="102" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="540" y="95" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">flush</text>

  <rect x="450" y="104" width="110" height="20" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="118" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">file N (newest)</text>
  <rect x="450" y="126" width="110" height="20" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="140" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">file N-1</text>
  <rect x="450" y="148" width="110" height="20" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="162" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">file N-2 (older)</text>

  <path d="M 440 175 L 500 148 M 440 175 L 500 126 M 440 175 L 500 114" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.25" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="420" y="185" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">read fans out</text>

  <path d="M 560 175 C 610 175, 610 100, 570 105" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="625" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">compaction</text>
  <text x="625" y="163" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">merges files down</text>

  <text x="515" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Writes are sequential; reads and compaction pay the cost later</text>
</svg>
