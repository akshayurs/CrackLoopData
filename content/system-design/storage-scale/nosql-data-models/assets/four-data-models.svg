<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="360" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">The same user + orders, four ways</text>

  <rect x="10" y="45" width="160" height="220" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="65" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Key-value</text>
  <rect x="24" y="80" width="132" height="34" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <text x="90" y="101" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">key: user-42</text>
  <rect x="24" y="120" width="132" height="70" rx="5" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="90" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">value: opaque</text>
  <text x="90" y="164" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">blob (orders +</text>
  <text x="90" y="178" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">items packed in)</text>

  <rect x="190" y="45" width="160" height="220" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="270" y="65" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Document</text>
  <rect x="204" y="80" width="132" height="150" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <text x="270" y="98" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">{ user: 42,</text>
  <text x="280" y="114" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">orders: [</text>
  <text x="290" y="130" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">{ id, items:</text>
  <text x="295" y="146" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">[product...] }</text>
  <text x="280" y="162" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">] }</text>
  <text x="270" y="192" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">nesting preserved</text>

  <rect x="370" y="45" width="170" height="220" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="455" y="65" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Wide column</text>
  <rect x="384" y="80" width="142" height="24" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <text x="455" y="96" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">row key: user-42</text>
  <rect x="384" y="108" width="142" height="22" rx="4" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="455" y="123" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">order:1001 col</text>
  <rect x="384" y="134" width="142" height="22" rx="4" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="455" y="149" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">order:1002 col</text>
  <rect x="384" y="160" width="142" height="22" rx="4" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="455" y="175" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">order:1003 (new)</text>
  <text x="455" y="200" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">columns appended over time</text>

  <rect x="550" y="45" width="160" height="220" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="630" y="65" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Graph</text>
  <circle cx="600" cy="100" r="18" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.25"/>
  <text x="600" y="104" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">User</text>
  <circle cx="660" cy="150" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.25"/>
  <text x="660" y="154" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Order</text>
  <circle cx="600" cy="200" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.25"/>
  <text x="600" y="204" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Product</text>
  <line x1="615" y1="112" x2="648" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.25"/>
  <text x="650" y="120" font-size="8" fill="var(--dg-muted, #5F6368)">PLACED</text>
  <line x1="655" y1="165" x2="612" y2="190" stroke="var(--dg-line, #5F6368)" stroke-width="1.25"/>
  <text x="628" y="180" font-size="8" fill="var(--dg-muted, #5F6368)">CONTAINS</text>
  <text x="630" y="238" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">relationships are</text>
  <text x="630" y="252" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">queryable directly</text>
</svg>
