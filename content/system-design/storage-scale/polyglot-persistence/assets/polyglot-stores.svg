<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">One system, several stores</text>

  <rect x="270" y="45" width="140" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="340" y="73" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Application service</text>

  <line x1="290" y1="91" x2="130" y2="145" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="320" y1="91" x2="290" y2="145" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="360" y1="91" x2="420" y2="145" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="390" y1="91" x2="580" y2="145" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="40" y="147" width="180" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="130" y="168" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Postgres</text>
  <text x="130" y="184" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">orders — source of truth</text>

  <line x1="220" y1="173" x2="278" y2="173" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="248" y="164" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">sync via CDC</text>

  <rect x="280" y="147" width="200" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="380" y="168" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Elasticsearch</text>
  <text x="380" y="184" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">product search index — derived</text>

  <rect x="500" y="147" width="80" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="540" y="168" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Redis</text>
  <text x="540" y="184" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">session cache — ephemeral</text>

  <rect x="590" y="147" width="80" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="630" y="168" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">S3</text>
  <text x="630" y="184" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">images — source of truth</text>

  <text x="340" y="245" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">each store owns one slice of the data;</text>
  <text x="340" y="263" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">derived copies (search index) sync from a source of truth, not new facts</text>
</svg>
