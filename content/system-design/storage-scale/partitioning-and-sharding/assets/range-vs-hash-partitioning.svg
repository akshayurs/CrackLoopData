<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="165" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Range partitioning</text>
  <text x="535" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Hash partitioning</text>
  <line x1="345" y1="10" x2="345" y2="280" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,4" opacity="0.5"/>

  <rect x="10" y="55" width="70" height="46" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="45" y="75" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Shard 1</text>
  <text x="45" y="90" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">A-F</text>

  <rect x="90" y="55" width="70" height="46" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="125" y="75" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Shard 2</text>
  <text x="125" y="90" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">G-M</text>

  <rect x="170" y="55" width="70" height="46" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="205" y="75" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Shard 3</text>
  <text x="205" y="90" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">N-S</text>

  <rect x="250" y="55" width="70" height="46" rx="7" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="285" y="75" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Shard 4</text>
  <text x="285" y="90" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">T-Z</text>

  <line x1="285" y1="30" x2="285" y2="52" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="285" y="20" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">new sequential writes</text>

  <text x="165" y="130" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">hotspot — all new keys land on shard 4</text>
  <text x="165" y="150" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">keeps ranges together, so scans stay cheap</text>

  <rect x="470" y="55" width="60" height="42" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="80" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Shard 1</text>
  <rect x="540" y="55" width="60" height="42" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="570" y="80" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Shard 2</text>
  <rect x="610" y="55" width="60" height="42" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="640" y="80" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Shard 3</text>
  <rect x="470" y="105" width="60" height="42" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="130" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Shard 4</text>

  <text x="535" y="30" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">hash(key) scatters keys evenly</text>
  <line x1="500" y1="38" x2="500" y2="52" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="535" y1="38" x2="570" y2="52" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="570" y1="38" x2="640" y2="52" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="500" y1="38" x2="500" y2="102" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="535" y="180" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">even — writes spread across all shards</text>
  <text x="535" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">breaks key adjacency, so range scans scatter-gather</text>
</svg>
