<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Pre-signed upload flow</text>

  <text x="90" y="52" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Client</text>
  <line x1="90" y1="60" x2="90" y2="310" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.25"/>

  <text x="320" y="52" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">App server</text>
  <line x1="320" y1="60" x2="320" y2="310" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.25"/>

  <text x="560" y="52" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Object store</text>
  <line x1="560" y1="60" x2="560" y2="310" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.25"/>

  <line x1="90" y1="90" x2="312" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="205" y="84" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">1. request upload URL</text>

  <line x1="320" y1="118" x2="98" y2="118" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="205" y="112" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">2. pre-signed URL</text>

  <line x1="90" y1="150" x2="552" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="320" y="144" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">3. upload file bytes directly</text>
  <text x="320" y="164" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">bypasses the app server entirely</text>

  <line x1="560" y1="192" x2="98" y2="192" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="320" y="186" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">4. upload confirmed</text>

  <line x1="90" y1="222" x2="312" y2="222" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="205" y="216" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">5. confirm to app server</text>

  <rect x="270" y="234" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.25"/>
  <text x="320" y="255" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">writes metadata to DB</text>

  <rect x="480" y="280" width="160" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="560" y="303" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">CDN in front</text>
  <text x="560" y="316" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">caches downloads, skips app tier</text>
</svg>
