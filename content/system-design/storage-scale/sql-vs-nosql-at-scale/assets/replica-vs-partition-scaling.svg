<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="165" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Relational: replicas scale reads</text>
  <text x="535" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">NoSQL: partitions scale both</text>
  <line x1="345" y1="10" x2="345" y2="280" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,4" opacity="0.5"/>

  <rect x="110" y="45" width="110" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="165" y="68" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Primary</text>
  <text x="165" y="34" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">all writes land here</text>

  <line x1="140" y1="85" x2="60" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="165" y1="85" x2="165" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="190" y1="85" x2="270" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="15" y="130" width="90" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="156" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Read replica</text>
  <rect x="120" y="130" width="90" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="165" y="156" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Read replica</text>
  <rect x="225" y="130" width="90" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="270" y="156" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Read replica</text>

  <text x="165" y="205" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">reads scale out;</text>
  <text x="165" y="222" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">write capacity stays fixed at one primary</text>

  <rect x="390" y="70" width="90" height="80" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="435" y="100" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Partition 1</text>
  <text x="435" y="118" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">own reads</text>
  <text x="435" y="132" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">+ own writes</text>

  <rect x="490" y="70" width="90" height="80" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="535" y="100" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Partition 2</text>
  <text x="535" y="118" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">own reads</text>
  <text x="535" y="132" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">+ own writes</text>

  <rect x="590" y="70" width="90" height="80" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="635" y="100" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Partition 3</text>
  <text x="635" y="118" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">own reads</text>
  <text x="635" y="132" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">+ own writes</text>

  <text x="535" y="205" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">every partition takes its own share of</text>
  <text x="535" y="222" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">both reads and writes — no single write bottleneck</text>
</svg>
