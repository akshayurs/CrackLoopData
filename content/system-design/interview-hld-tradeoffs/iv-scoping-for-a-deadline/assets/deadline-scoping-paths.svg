<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="240" y="16" width="160" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="41" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Auto-scaling infra</text>

  <line x1="290" y1="56" x2="150" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="350" y1="56" x2="490" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="40" y="100" width="220" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="128" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Cut entirely</text>
  <text x="150" y="185" text-anchor="middle" font-size="20" fill="var(--dg-muted, #5F6368)">&#10005;</text>

  <rect x="380" y="95" width="220" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="490" y="118" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Downgrade</text>
  <text x="490" y="135" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">fixed generous instance</text>
  <text x="490" y="150" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">+ manual monitoring</text>

  <text x="490" y="200" text-anchor="middle" font-size="19" fill="var(--dg-accent, #0C8F88)">&#10003;</text>
  <text x="490" y="222" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">fast-follow to auto-scaling later</text>
</svg>
