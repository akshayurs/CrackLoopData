<svg viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="30" y="60" width="200" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="130" y="83" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">Simple: single DB,</text>
  <text x="130" y="99" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">single service</text>

  <line x1="230" y1="85" x2="380" y2="85" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="305" y="72" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">breaks at X</text>

  <rect x="380" y="60" width="220" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="90" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">Add Y</text>

  <text x="320" y="150" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Narrate the whole path; build only up to what's required</text>
</svg>
