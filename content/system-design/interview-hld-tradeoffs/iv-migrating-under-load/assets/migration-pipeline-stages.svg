<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="10" y="70" width="150" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="93" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Shadow</text>
  <text x="85" y="109" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">write new, read old</text>

  <circle cx="185" cy="98" r="12" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="185" y="102" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)">&#10003;</text>
  <line x1="160" y1="98" x2="173" y2="98" stroke="var(--dg-line, #5F6368)"/>
  <line x1="197" y1="98" x2="215" y2="98" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="215" y="70" width="150" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="290" y="93" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Dual-write</text>
  <text x="290" y="109" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">write both, diff reads</text>

  <circle cx="390" cy="98" r="12" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="390" y="102" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)">&#10003;</text>
  <line x1="365" y1="98" x2="378" y2="98" stroke="var(--dg-line, #5F6368)"/>
  <line x1="402" y1="98" x2="420" y2="98" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="420" y="70" width="150" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="495" y="88" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Phased cutover</text>
  <text x="495" y="103" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">increasing % reads</text>
  <text x="495" y="116" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">from new</text>

  <circle cx="595" cy="98" r="12" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="595" y="102" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)">&#10003;</text>
  <line x1="570" y1="98" x2="583" y2="98" stroke="var(--dg-line, #5F6368)"/>
  <line x1="607" y1="98" x2="625" y2="98" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="625" y="70" width="70" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="660" y="93" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)" font-weight="600">Decommission</text>
  <text x="660" y="107" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">old</text>

  <text x="350" y="165" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Each gate: verify before proceeding</text>
