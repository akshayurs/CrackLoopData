<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="160" y="26" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Separate databases</text>
  <rect x="30" y="50" width="80" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="73" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Team A</text>
  <rect x="210" y="50" width="80" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="73" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Team B</text>

  <line x1="70" y1="86" x2="70" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="250" y1="86" x2="250" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="30" y="120" width="80" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="70" y="144" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">DB A</text>
  <rect x="210" y="120" width="80" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="250" y="144" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">DB B</text>

  <text x="160" y="195" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">independent schema changes,</text>
  <text x="160" y="211" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">independent deploys</text>

  <line x1="320" y1="150" x2="320" y2="150" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <line x1="320" y1="40" x2="320" y2="260" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="480" y="26" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Shared database</text>
  <rect x="400" y="50" width="80" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="440" y="73" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Team A</text>
  <rect x="530" y="50" width="80" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="570" y="73" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Team B</text>

  <line x1="440" y1="86" x2="500" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="570" y1="86" x2="510" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="465" y="120" width="90" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="510" y="144" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Shared DB</text>

  <text x="510" y="195" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">blocked on each other's</text>
  <text x="510" y="211" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">migrations</text>
</svg>
