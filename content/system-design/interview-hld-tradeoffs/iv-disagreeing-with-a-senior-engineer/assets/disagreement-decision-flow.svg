<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="220" y="20" width="200" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="42" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Voice concern once</text>
  <text x="320" y="58" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">with reasoning and cost</text>

  <line x1="270" y1="66" x2="150" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="370" y1="66" x2="490" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="40" y="110" width="220" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="132" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">Heard fairly,</text>
  <text x="150" y="148" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">still disagree</text>

  <rect x="380" y="105" width="220" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="127" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">Severe, hard-to-reverse</text>
  <text x="490" y="143" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">risk</text>

  <line x1="150" y1="156" x2="150" y2="196" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="490" y1="161" x2="490" y2="196" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="30" y="196" width="240" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="223" text-anchor="middle" font-size="11.5" fill="var(--dg-muted, #5F6368)">Note and move on, low stakes</text>

  <rect x="370" y="196" width="240" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="490" y="223" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">Escalate to broader review</text>
</svg>
