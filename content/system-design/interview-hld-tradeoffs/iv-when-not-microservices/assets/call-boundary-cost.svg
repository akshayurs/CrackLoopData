<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="150" y="26" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">In one process</text>
  <rect x="40" y="60" width="80" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="84" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Function A</text>
  <line x1="120" y1="80" x2="180" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="180" y="60" width="80" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="220" y="84" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Function B</text>
  <text x="150" y="130" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">direct call, negligible cost</text>

  <text x="480" y="26" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Across a service boundary</text>
  <rect x="330" y="60" width="90" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="375" y="84" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Service A</text>

  <line x1="420" y1="80" x2="530" y2="80" stroke="var(--dg-line, #5F6368)" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="475" y="60" text-anchor="middle" font-size="16" fill="var(--dg-muted, #5F6368)">&#128337;</text>
  <text x="475" y="102" text-anchor="middle" font-size="16" fill="var(--dg-accent, #0C8F88)">&#128268;</text>

  <rect x="530" y="60" width="90" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="575" y="84" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Service B</text>

  <text x="475" y="145" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">new latency</text>
  <text x="475" y="163" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">new failure mode</text>
</svg>
