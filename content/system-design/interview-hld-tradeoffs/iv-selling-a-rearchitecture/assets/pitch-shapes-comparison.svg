<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="150" y="26" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Full budget upfront</text>
  <line x1="60" y1="180" x2="60" y2="60" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <line x1="60" y1="180" x2="240" y2="180" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="70" y="60" width="160" height="120" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="205" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">no visible progress</text>
  <text x="150" y="219" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">until the end</text>

  <text x="480" y="26" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Phased plan</text>
  <line x1="360" y1="180" x2="360" y2="60" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <line x1="360" y1="180" x2="600" y2="180" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <rect x="370" y="150" width="50" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <rect x="430" y="120" width="50" height="60" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <rect x="490" y="90" width="50" height="90" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <rect x="550" y="60" width="50" height="120" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>

  <text x="480" y="200" text-anchor="middle" font-size="19" fill="var(--dg-accent, #0C8F88)">&#10003;</text>
  <text x="480" y="222" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">value delivered at each step</text>
</svg>
