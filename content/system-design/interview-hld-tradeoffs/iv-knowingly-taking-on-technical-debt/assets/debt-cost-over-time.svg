<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="160" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Safe to defer</text>
  <text x="160" y="42" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">single-region, polling</text>

  <line x1="50" y1="180" x2="50" y2="60" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <line x1="50" y1="180" x2="270" y2="180" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <path d="M55 90 Q160 150 265 172" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>
  <text x="160" y="205" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">cost of fixing shrinks over time</text>

  <text x="480" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Not safe to defer</text>
  <text x="480" y="42" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">missing idempotency key</text>

  <line x1="370" y1="180" x2="370" y2="60" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <line x1="370" y1="180" x2="590" y2="180" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <path d="M375 172 Q480 150 585 70" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="480" y="205" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">cost of fixing grows over time</text>

  <text x="320" y="240" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Test: does the fix cost shrink or grow the longer it stays live?</text>
</svg>
