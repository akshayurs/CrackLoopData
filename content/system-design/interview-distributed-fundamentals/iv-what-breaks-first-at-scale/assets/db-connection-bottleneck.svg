<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Connection count caps before CPU does</text>

  <rect x="30" y="120" width="70" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="65" y="144" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">LB</text>

  <g id="app-servers">
    <rect x="150" y="50" width="60" height="34" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
    <rect x="150" y="92" width="60" height="34" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
    <rect x="150" y="134" width="60" height="34" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
    <rect x="150" y="176" width="60" height="34" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
    <rect x="150" y="218" width="60" height="34" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  </g>
  <text x="180" y="270" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">10 app servers</text>
  <text x="180" y="284" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">CPU: low</text>

  <line x1="100" y1="140" x2="150" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" marker-end="url(#arrow)"/>

  <line x1="210" y1="67" x2="380" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="210" y1="109" x2="380" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="210" y1="151" x2="380" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="210" y1="193" x2="380" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="210" y1="235" x2="380" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="380" y="100" width="150" height="80" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="455" y="130" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Database</text>
  <text x="455" y="160" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">connections: max</text>

  <rect x="580" y="120" width="16" height="40" fill="var(--dg-accent, #0C8F88)"/>
  <text x="588" y="105" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">conns</text>
</svg>
