<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">The resource rejects the stale token</text>

  <line x1="60" y1="70" x2="600" y2="70" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="62" text-anchor="end" font-size="10.5" fill="var(--dg-muted, #5F6368)">time</text>

  <rect x="60" y="52" width="130" height="16" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <text x="125" y="98" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">A holds token 33</text>

  <rect x="190" y="52" width="130" height="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="255" y="98" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">A pauses (GC)</text>
  <line x1="320" y1="52" x2="320" y2="230" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="320" y="120" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">lease expires</text>

  <rect x="340" y="52" width="140" height="16" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <text x="410" y="98" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">B acquires token 34</text>

  <rect x="480" y="52" width="100" height="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>

  <rect x="200" y="150" width="150" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="275" y="168" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">A resumes, writes token 33</text>

  <rect x="400" y="150" width="150" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="475" y="168" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">B writes token 34, succeeds</text>

  <rect x="200" y="200" width="350" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="375" y="221" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Resource expects &gt;= 34 — rejects token 33</text>
</svg>
