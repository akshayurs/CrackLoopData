<svg viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="250" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Any two majority groups of 5 overlap</text>

  <ellipse cx="180" cy="170" rx="130" ry="95" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" opacity="0.9"/>
  <text x="105" y="90" font-size="11" fill="var(--dg-muted, #5F6368)">Group {1,2,3}</text>

  <ellipse cx="320" cy="170" rx="130" ry="95" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" opacity="0.9"/>
  <text x="360" y="90" font-size="11" fill="var(--dg-muted, #5F6368)">Group {3,4,5}</text>

  <circle cx="140" cy="150" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="140" y="154" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">1</text>

  <circle cx="145" cy="210" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="145" y="214" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">2</text>

  <circle cx="250" cy="180" r="24" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="250" y="185" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">3</text>

  <circle cx="355" cy="150" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="355" y="154" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">4</text>

  <circle cx="360" cy="210" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="360" y="214" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">5</text>

  <text x="250" y="290" text-anchor="middle" font-size="11.5" fill="var(--dg-muted, #5F6368)">Node 3 is forced into both groups — 5 nodes can't fill two disjoint groups of 3</text>
</svg>
