<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">The ack is lost, not the charge</text>

  <text x="70" y="55" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Client</text>
  <text x="570" y="55" text-anchor="end" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Server</text>
  <line x1="70" y1="65" x2="70" y2="220" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <line x1="570" y1="65" x2="570" y2="220" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>

  <line x1="70" y1="85" x2="570" y2="85" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="78" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">"charge $10" request</text>

  <rect x="530" y="98" width="80" height="24" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="570" y="114" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">charge OK</text>

  <line x1="570" y1="135" x2="70" y2="165" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="320" y="145" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">ack sent...</text>
  <circle cx="220" cy="152" r="5" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="220" y="132" text-anchor="middle" font-size="10.5" fill="var(--dg-accent, #0C8F88)">ack lost</text>

  <rect x="30" y="178" width="90" height="24" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="194" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">times out</text>

  <line x1="70" y1="220" x2="570" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="213" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">retries — unsure if it already happened</text>
</svg>
