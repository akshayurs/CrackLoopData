<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Same gap, two possible explanations</text>

  <line x1="60" y1="70" x2="600" y2="70" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="62" text-anchor="end" font-size="10.5" fill="var(--dg-muted, #5F6368)">time</text>

  <path d="M 60 70 L 110 70 M 130 70 L 180 70 M 200 70 L 250 70 M 270 70 L 300 70" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <circle cx="85" cy="70" r="4" fill="var(--dg-line, #5F6368)"/>
  <circle cx="155" cy="70" r="4" fill="var(--dg-line, #5F6368)"/>
  <circle cx="225" cy="70" r="4" fill="var(--dg-line, #5F6368)"/>
  <text x="285" y="55" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">heartbeats</text>

  <line x1="300" y1="70" x2="300" y2="200" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="300" y="90" text-anchor="middle" font-size="10.5" fill="var(--dg-accent, #0C8F88)">pings stop</text>

  <path d="M 300 130 L 200 165" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 300 130 L 400 165" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="90" y="175" width="180" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="180" y="195" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">crashed, gone for good</text>
  <text x="180" y="210" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">will never respond</text>

  <rect x="330" y="175" width="220" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="440" y="195" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">alive but slow or partitioned</text>
  <text x="440" y="210" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">will resume shortly</text>
</svg>
