<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Slowdown propagates backward</text>

  <rect x="40" y="90" width="120" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="122" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Service A</text>

  <rect x="260" y="90" width="120" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="112" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Service B</text>
  <rect x="272" y="122" width="96" height="12" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <text x="320" y="152" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">queue filling</text>

  <rect x="480" y="90" width="120" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="540" y="112" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Service C</text>
  <rect x="492" y="122" width="96" height="12" fill="var(--dg-accent, #0C8F88)"/>
  <text x="540" y="152" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">queue full</text>

  <line x1="160" y1="120" x2="260" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="120" x2="480" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M 480 175 Q 320 210 160 175" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
  <text x="320" y="210" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">slowdown propagates backward, one hop at a time</text>
</svg>
