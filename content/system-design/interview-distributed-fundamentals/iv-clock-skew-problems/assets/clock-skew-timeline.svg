<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Causal order vs. wall-clock order</text>

  <text x="60" y="70" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Node A</text>
  <line x1="60" y1="80" x2="580" y2="80" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="220" cy="80" r="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="220" y="60" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">write @ 10:00:00.050</text>

  <text x="60" y="150" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Node B</text>
  <line x1="60" y1="160" x2="580" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="340" cy="160" r="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="340" y="140" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">write @ 10:00:00.020</text>

  <line x1="220" y1="86" x2="340" y2="154" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="290" y="115" text-anchor="middle" font-size="10.5" fill="var(--dg-accent, #0C8F88)">causally after</text>

  <rect x="120" y="200" width="400" height="42" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="218" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Timestamps say B is earlier (.020 &lt; .050)</text>
  <text x="320" y="234" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">B's clock runs 40ms behind A's</text>
</svg>
