<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Synchronized retries hit right as it recovers</text>

  <line x1="60" y1="220" x2="600" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="235" text-anchor="end" font-size="10.5" fill="var(--dg-muted, #5F6368)">time</text>

  <path d="M 60 200 Q 150 190 240 175 T 320 150" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="188" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">service degrading</text>

  <line x1="320" y1="60" x2="320" y2="220" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="320" y="52" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">all clients time out at once (2s mark)</text>

  <path d="M 320 150 Q 400 165 480 190" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="440" y="205" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">starting to recover</text>

  <rect x="330" y="75" width="150" height="65" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="405" y="70" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">retry spike</text>
  <line x1="345" y1="140" x2="345" y2="75" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <line x1="365" y1="140" x2="365" y2="85" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <line x1="385" y1="140" x2="385" y2="78" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <line x1="405" y1="140" x2="405" y2="82" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <line x1="425" y1="140" x2="425" y2="90" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <line x1="445" y1="140" x2="445" y2="80" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <line x1="465" y1="140" x2="465" y2="95" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>

  <text x="320" y="250" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">A brief blip becomes a sustained outage</text>
</svg>
