<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">A severed link forces a choice</text>

  <rect x="60" y="60" width="180" height="100" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="150" y="90" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">DC Left</text>
  <text x="150" y="112" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">write lands here</text>

  <rect x="400" y="60" width="180" height="100" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="90" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">DC Right</text>
  <text x="490" y="112" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">doesn't know yet</text>

  <line x1="240" y1="110" x2="400" y2="110" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="320" y="100" text-anchor="middle" font-size="10.5" fill="var(--dg-accent, #0C8F88)">link down</text>

  <line x1="490" y1="160" x2="490" y2="190" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="205" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">request arrives on the right</text>

  <line x1="440" y1="220" x2="270" y2="245" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="540" y1="220" x2="540" y2="245" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="60" y="245" width="210" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="165" y="264" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">answer, possibly stale</text>

  <rect x="410" y="245" width="200" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="510" y="264" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">refuse until reconnected</text>
</svg>
