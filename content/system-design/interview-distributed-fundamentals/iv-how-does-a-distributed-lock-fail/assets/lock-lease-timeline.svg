<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">A pauses past the lease TTL</text>

  <line x1="60" y1="60" x2="600" y2="60" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="52" text-anchor="end" font-size="10.5" fill="var(--dg-muted, #5F6368)">time</text>

  <rect x="60" y="42" width="120" height="16" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <text x="120" y="90" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">A acquires lock</text>

  <rect x="180" y="42" width="160" height="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="260" y="90" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">A pauses (GC / stall)</text>
  <line x1="340" y1="42" x2="340" y2="230" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="340" y="115" text-anchor="middle" font-size="10.5" fill="var(--dg-accent, #0C8F88)">lease expires</text>

  <rect x="360" y="42" width="150" height="16" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <text x="435" y="90" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">B acquires lock</text>

  <rect x="510" y="42" width="70" height="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>

  <rect x="180" y="150" width="120" height="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <rect x="300" y="150" width="280" height="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="440" y="164" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Client A: "I hold the lock" (stale)</text>

  <rect x="360" y="185" width="220" height="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="470" y="199" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Client B: "I hold the lock"</text>

  <line x1="360" y1="145" x2="360" y2="210" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="470" y="230" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Both beliefs overlap on the same time axis</text>
</svg>
