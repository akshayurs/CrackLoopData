<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Bulkhead: dedicated thread pool</text>

  <rect x="30" y="60" width="360" height="150" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="210" y="82" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">85 threads — cache &amp; other calls</text>
  <g fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1">
    <circle cx="60" cy="115" r="7"/><circle cx="80" cy="115" r="7"/><circle cx="100" cy="115" r="7"/><circle cx="120" cy="115" r="7"/><circle cx="140" cy="115" r="7"/><circle cx="160" cy="115" r="7"/><circle cx="180" cy="115" r="7"/><circle cx="200" cy="115" r="7"/><circle cx="220" cy="115" r="7"/><circle cx="240" cy="115" r="7"/><circle cx="260" cy="115" r="7"/><circle cx="280" cy="115" r="7"/><circle cx="300" cy="115" r="7"/><circle cx="320" cy="115" r="7"/><circle cx="340" cy="115" r="7"/><circle cx="360" cy="115" r="7"/>
    <circle cx="60" cy="140" r="7"/><circle cx="80" cy="140" r="7"/><circle cx="100" cy="140" r="7"/><circle cx="120" cy="140" r="7"/><circle cx="140" cy="140" r="7"/><circle cx="160" cy="140" r="7"/><circle cx="180" cy="140" r="7"/><circle cx="200" cy="140" r="7"/><circle cx="220" cy="140" r="7"/><circle cx="240" cy="140" r="7"/><circle cx="260" cy="140" r="7"/><circle cx="280" cy="140" r="7"/><circle cx="300" cy="140" r="7"/><circle cx="320" cy="140" r="7"/><circle cx="340" cy="140" r="7"/><circle cx="360" cy="140" r="7"/>
  </g>
  <text x="210" y="180" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">flowing normally, unaffected</text>

  <rect x="420" y="60" width="190" height="150" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="515" y="82" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">15 threads — enrichment API</text>
  <g stroke="var(--dg-accent, #0C8F88)" stroke-width="1" fill="var(--dg-accent-bg, #E3F3F1)">
    <circle cx="440" cy="115" r="7"/><circle cx="460" cy="115" r="7"/><circle cx="480" cy="115" r="7"/><circle cx="500" cy="115" r="7"/><circle cx="520" cy="115" r="7"/><circle cx="540" cy="115" r="7"/><circle cx="560" cy="115" r="7"/><circle cx="580" cy="115" r="7"/>
    <circle cx="440" cy="140" r="7"/><circle cx="460" cy="140" r="7"/><circle cx="480" cy="140" r="7"/><circle cx="500" cy="140" r="7"/><circle cx="520" cy="140" r="7"/><circle cx="540" cy="140" r="7"/><circle cx="560" cy="140" r="7"/>
  </g>
  <text x="515" y="180" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">fully saturated</text>
  <text x="515" y="195" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">walled off from the rest</text>

  <line x1="410" y1="135" x2="418" y2="135" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3,3"/>

  <text x="320" y="255" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A slow dependency can only ever exhaust its own 15-thread bulkhead.</text>
