<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Shrinking timeout budget</text>

  <rect x="20" y="60" width="130" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="85" y="90" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Gateway</text>
  <text x="85" y="108" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">5000ms</text>

  <rect x="185" y="70" width="115" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="242" y="97" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">API</text>
  <text x="242" y="114" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">4000ms</text>

  <rect x="335" y="82" width="100" height="48" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="385" y="102" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Service</text>
  <text x="385" y="118" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">2500ms</text>

  <rect x="470" y="92" width="80" height="38" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="510" y="108" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">DB</text>
  <text x="510" y="122" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">1000ms</text>

  <line x1="150" y1="95" x2="183" y2="95" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="300" y1="100" x2="333" y2="103" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="435" y1="106" x2="468" y2="108" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="320" y="175" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each hop gets strictly less time than its caller —</text>
  <text x="320" y="195" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">leaving room for its own network and processing overhead.</text>
</svg>
