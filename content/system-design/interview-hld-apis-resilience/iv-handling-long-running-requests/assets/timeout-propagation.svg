<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Timeout raise propagates backward</text>

  <rect x="20" y="70" width="120" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="97" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Load balancer</text>

  <rect x="180" y="70" width="120" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="97" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">API gateway</text>

  <rect x="340" y="70" width="120" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="400" y="97" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Reverse proxy</text>

  <rect x="500" y="70" width="120" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="560" y="97" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Slow service</text>

  <line x1="140" y1="93" x2="178" y2="93" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="300" y1="93" x2="338" y2="93" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="460" y1="93" x2="498" y2="93" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="320" y="150" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Every timeout dial must turn up to match, or that layer cuts the request off first:</text>

  <path d="M 560 116 C 560 170 400 170 400 170" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="480" y="185" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">raise proxy timeout</text>

  <path d="M 400 116 C 400 210 240 210 240 210" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="320" y="225" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">raise gateway timeout</text>

  <path d="M 240 116 C 240 250 80 250 80 250" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="160" y="265" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">raise LB timeout</text>

  <text x="320" y="292" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">One slow endpoint's needs ripple onto the entire stack's timeout config.</text>
</svg>
