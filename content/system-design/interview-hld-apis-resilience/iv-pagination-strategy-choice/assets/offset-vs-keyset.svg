<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Offset vs. keyset pagination</text>

  <text x="160" y="50" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">OFFSET 100000 LIMIT 20</text>
  <rect x="30" y="65" width="260" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="160" y="85" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">scans 100,000 rows first</text>
  <rect x="290" y="65" width="30" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <line x1="30" y1="65" x2="30" y2="95" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="160" y="115" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">discards 100,000 → returns 20</text>
  <path d="M 30 130 L 320 130" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="160" y="150" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">full table scan cost</text>

  <line x1="330" y1="40" x2="330" y2="280" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="480" y="50" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">WHERE (created_at,id)&gt;(?,?)</text>
  <rect x="380" y="65" width="20" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <path d="M 400 80 L 460 80" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="460" y="65" width="30" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="475" y="115" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">index seek → LIMIT 20</text>
  <path d="M 460 130 L 490 130" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="150" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">constant cost</text>

  <text x="320" y="200" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Same result set, drastically different work.</text>
  <text x="320" y="222" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Keyset pagination jumps straight to the right position via an index seek;</text>
  <text x="320" y="242" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">offset pagination still pays for every row it skips.</text>
</svg>
