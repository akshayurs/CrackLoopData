<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Out-of-order webhook delivery</text>

  <text x="20" y="60" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Sender</text>
  <text x="20" y="230" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Client endpoint</text>
  <line x1="90" y1="45" x2="90" y2="240" stroke="var(--dg-line, #5F6368)" stroke-width="1"/>

  <!-- event 1: fails first attempt -->
  <rect x="60" y="70" width="140" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="130" y="92" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">event 1 — attempt 1 (t=0, fails)</text>

  <rect x="220" y="130" width="150" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="295" y="152" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">event 1 — retry (t=200ms)</text>

  <!-- event 2: sent successfully first try -->
  <rect x="60" y="180" width="150" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="135" y="202" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">event 2 — attempt 1 (t=50ms)</text>

  <path d="M 200 87 C 250 100 260 110 280 130" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M 370 164 C 400 190 430 210 460 220" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <path d="M 210 197 C 350 205 400 210 460 215" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="460" y="200" width="150" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="535" y="222" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">arrives: event 2 (t=60ms)</text>

  <rect x="460" y="240" width="150" height="0" fill="none"/>
  <text x="535" y="255" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">then: event 1 retry (t=220ms)</text>

  <text x="320" y="272" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Event 2 lands before the retried event 1 — order is reversed at the client.</text>
</svg>
