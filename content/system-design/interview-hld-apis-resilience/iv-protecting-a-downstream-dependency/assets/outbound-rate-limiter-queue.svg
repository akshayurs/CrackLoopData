<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Client-side outbound rate limiting</text>

  <rect x="20" y="90" width="120" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="117" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Your service</text>

  <rect x="220" y="90" width="120" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="280" y="112" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Rate limiter</text>
  <text x="280" y="128" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">caps outbound rate</text>

  <rect x="230" y="150" width="100" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="280" y="174" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">queue</text>

  <rect x="450" y="90" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="525" y="112" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Partner API</text>
  <text x="525" y="128" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">rate-capped</text>

  <line x1="140" y1="113" x2="218" y2="113" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="280" y1="136" x2="280" y2="148" stroke="var(--dg-line, #5F6368)"/>
  <line x1="340" y1="113" x2="448" y2="113" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="320" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Excess requests wait in the queue and drain at a sustainable rate</text>
  <text x="320" y="238" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">instead of firing all at once and tripping the partner's own limit.</text>
</svg>
