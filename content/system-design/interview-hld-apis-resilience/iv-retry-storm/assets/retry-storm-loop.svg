<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Retry storm loop</text>

  <rect x="240" y="50" width="160" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="78" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Dependency fails</text>

  <rect x="440" y="150" width="160" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="520" y="178" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Clients retry</text>

  <rect x="240" y="250" width="160" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="278" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Load increases</text>

  <rect x="40" y="150" width="160" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="120" y="172" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">More failures,</text>
  <text x="120" y="188" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">worse each pass</text>

  <path d="M 400 65 C 460 90 500 110 500 150" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 500 196 C 480 220 420 240 400 260" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 240 265 C 180 250 140 220 130 196" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 130 150 C 150 110 200 80 240 65" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="320" y="335" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each pass through the loop adds load instead of removing it.</text>
</svg>
