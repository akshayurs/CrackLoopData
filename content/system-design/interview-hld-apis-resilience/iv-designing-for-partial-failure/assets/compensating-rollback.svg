<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Compensating rollback</text>

  <rect x="30" y="70" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="97" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Inventory decrement</text>

  <rect x="245" y="70" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="97" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Payment charge</text>

  <rect x="460" y="70" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="535" y="92" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Loyalty award</text>
  <text x="535" y="108" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">fails</text>

  <line x1="180" y1="93" x2="243" y2="93" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="395" y1="93" x2="458" y2="93" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <path d="M 460 130 C 400 165 360 165 320 145" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="390" y="182" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">compensating refund</text>

  <text x="320" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Since there's no real cross-service transaction, the failed step</text>
  <text x="320" y="248" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">triggers a compensating action that unwinds what already succeeded.</text>
</svg>
