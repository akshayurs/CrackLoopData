<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Token bucket: refill vs. drain</text>

  <line x1="130" y1="40" x2="130" y2="65" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="45" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">refill rate (tap)</text>

  <rect x="90" y="70" width="140" height="180" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <line x1="90" y1="90" x2="230" y2="90" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="240" y="94" font-size="11" fill="var(--dg-muted, #5F6368)">capacity</text>

  <rect x="92" y="150" width="136" height="98" fill="var(--dg-accent-bg, #E3F3F1)"/>
  <text x="160" y="200" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">tokens</text>

  <path d="M115,70 L115,150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="330" y="120" width="270" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="465" y="148" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">tryAcquire() calls</text>

  <line x1="230" y1="180" x2="326" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="290" y="165" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">drains in bursts</text>

  <text x="320" y="278" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Refill stops once the level hits capacity — the bucket never overflows even when idle.</text>
</svg>
