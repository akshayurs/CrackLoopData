<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Order state transition graph</text>

  <rect x="30" y="120" width="110" height="44" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="85" y="147" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">PENDING</text>

  <rect x="190" y="120" width="110" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="245" y="147" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">PAID</text>

  <rect x="350" y="120" width="110" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="405" y="147" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">SHIPPED</text>

  <rect x="500" y="120" width="120" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="560" y="147" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">DELIVERED</text>

  <rect x="190" y="220" width="120" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="247" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">CANCELLED</text>

  <line x1="140" y1="142" x2="186" y2="142" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="300" y1="142" x2="346" y2="142" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="460" y1="142" x2="496" y2="142" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <line x1="85" y1="164" x2="220" y2="222" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="245" y1="164" x2="245" y2="216" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <path d="M85,120 C85,70 385,70 400,116" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
  <text x="245" y="66" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">rejected — no edge exists</text>

  <text x="320" y="284" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Only drawn edges are valid transitions; the dashed jump has no path to follow.</text>
</svg>
