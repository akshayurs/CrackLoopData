<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Connection pool lifecycle</text>

  <rect x="70" y="70" width="130" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="135" y="98" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Idle</text>

  <rect x="440" y="70" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="98" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Borrowed</text>

  <rect x="440" y="180" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="208" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Returned</text>

  <rect x="70" y="230" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="135" y="253" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Health check</text>
  <text x="135" y="267" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">on next borrow</text>

  <rect x="240" y="270" width="150" height="46" rx="8" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="315" y="298" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Discarded / evicted</text>

  <line x1="200" y1="93" x2="436" y2="93" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="318" y="83" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">borrow()</text>

  <line x1="505" y1="116" x2="505" y2="176" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="558" y="150" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">release()</text>

  <line x1="436" y1="203" x2="200" y2="253" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="330" y="235" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">checked</text>

  <line x1="130" y1="230" x2="130" y2="118" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="90" y="175" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">alive</text>

  <line x1="200" y1="262" x2="240" y2="288" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
  <text x="230" y="255" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">dead</text>

</svg>
