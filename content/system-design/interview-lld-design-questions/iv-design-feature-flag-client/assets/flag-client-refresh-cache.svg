<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Feature flag client: refresh vs. reads</text>

  <rect x="470" y="30" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="535" y="58" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Remote backend</text>

  <rect x="240" y="110" width="150" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="315" y="134" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">In-memory</text>
  <text x="315" y="150" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">flag cache</text>

  <path d="M390,125 C440,100 470,80 500,72" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="98" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">refresh on timer</text>

  <rect x="30" y="40" width="140" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="66" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Caller A</text>

  <rect x="30" y="160" width="140" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="186" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Caller B</text>

  <rect x="30" y="220" width="140" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="246" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Caller C</text>

  <line x1="170" y1="62" x2="236" y2="122" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="170" y1="182" x2="236" y2="152" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="170" y1="242" x2="236" y2="162" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="200" y="105" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">isEnabled()</text>

  <text x="320" y="280" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">isEnabled reads only the local cache — refresh is the only path that ever touches the network.</text>
</svg>
