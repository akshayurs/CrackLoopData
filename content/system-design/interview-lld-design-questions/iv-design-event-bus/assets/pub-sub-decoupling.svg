<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Publisher / subscriber decoupling</text>

  <rect x="270" y="115" width="100" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="145" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Event</text>
  <text x="320" y="161" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">bus</text>

  <rect x="40" y="60" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="88" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Publisher A</text>
  <rect x="40" y="194" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="222" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Publisher B</text>

  <rect x="460" y="40" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="68" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Subscriber 1</text>
  <rect x="460" y="127" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="155" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Subscriber 2</text>
  <rect x="460" y="214" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="242" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Subscriber 3</text>

  <line x1="180" y1="83" x2="266" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="220" y="95" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">publish()</text>
  <line x1="180" y1="217" x2="266" y2="170" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="220" y="215" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">publish()</text>

  <line x1="374" y1="140" x2="456" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="374" y1="152" x2="456" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="374" y1="163" x2="456" y2="228" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="320" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Neither side holds a reference to the other — only the bus does.</text>
</svg>
