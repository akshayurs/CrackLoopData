<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Plugin lifecycle</text>

  <rect x="30" y="90" width="110" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="118" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">register</text>

  <rect x="185" y="90" width="110" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="118" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">init</text>

  <rect x="340" y="90" width="130" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="405" y="118" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">execute</text>

  <rect x="515" y="90" width="110" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="570" y="118" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">shutdown</text>

  <line x1="140" y1="113" x2="181" y2="113" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="295" y1="113" x2="336" y2="113" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="470" y1="113" x2="511" y2="113" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <path d="M405,90 C405,55 470,55 470,88" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="52" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">per request</text>

  <text x="85" y="160" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">host calls once</text>
  <text x="240" y="160" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">host calls once</text>
  <text x="405" y="160" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">host calls many times</text>
  <text x="570" y="160" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">host calls once</text>

  <text x="320" y="205" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">init always runs before the first execute; shutdown always runs after the last.</text>
</svg>
