<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Scheduler min-heap reordering</text>

  <text x="130" y="46" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">before</text>

  <circle cx="130" cy="80" r="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="130" y="84" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">t=5</text>

  <circle cx="80" cy="140" r="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="144" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">t=9</text>
  <circle cx="180" cy="140" r="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="180" y="144" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">t=12</text>

  <line x1="130" y1="106" x2="80" y2="116" stroke="var(--dg-line, #5F6368)"/>
  <line x1="130" y1="106" x2="180" y2="116" stroke="var(--dg-line, #5F6368)"/>

  <path d="M130,54 C130,20 200,20 200,54" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="220" y="35" font-size="11" fill="var(--dg-muted, #5F6368)">pop soonest, run</text>

  <line x1="270" y1="130" x2="330" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="300" y="118" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">reinsert</text>

  <text x="490" y="46" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">after</text>

  <circle cx="490" cy="80" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="84" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">t=9</text>

  <circle cx="440" cy="140" r="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="440" y="144" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">t=12</text>
  <circle cx="540" cy="140" r="24" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="540" y="144" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">t=18</text>

  <line x1="490" y1="106" x2="440" y2="116" stroke="var(--dg-line, #5F6368)"/>
  <line x1="490" y1="106" x2="540" y2="116" stroke="var(--dg-line, #5F6368)"/>

  <text x="540" y="180" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">t=5 task, new fire-time</text>

  <text x="320" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each cycle pops the soonest task and reinserts it at its new deadline; the heap reshapes around it.</text>
</svg>
