<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="30" y="70" font-size="12" fill="var(--dg-muted, #5F6368)">Request</text>
  <line x1="30" y1="80" x2="70" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="75" y="55" width="90" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="120" y="84" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Auth</text>
  <line x1="165" y1="80" x2="200" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="205" y="55" width="90" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="84" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Logging</text>
  <line x1="295" y1="80" x2="330" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="335" y="55" width="90" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="380" y="84" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Metrics</text>
  <line x1="425" y1="80" x2="460" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="465" y="45" width="130" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="530" y="85" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Handler</text>

  <path d="M530,115 Q530,160 380,160 Q250,160 120,160 Q60,160 60,115" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="185" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">response flows back through the same stages, reversed</text>
</svg>
