<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <rect x="245" y="205" width="150" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="235" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">NotificationSender</text>

  <line x1="320" y1="205" x2="320" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="255" y="20" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
