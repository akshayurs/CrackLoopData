  <text x="545" y="141" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">new channel, no edits</text>

  <line x1="380" y1="255" x2="530" y2="320" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="475" y="325" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
