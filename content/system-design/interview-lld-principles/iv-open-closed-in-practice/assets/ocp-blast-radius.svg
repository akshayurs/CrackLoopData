<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="150" y="24" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)" font-weight="600">Switch statement</text>
  <text x="480" y="24" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)" font-weight="600">Open/closed</text>
  <line x1="320" y1="10" x2="320" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4 4"/>

  <rect x="45" y="45" width="150" height="120" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="120" y="62" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">switch(type)</text>
  <text x="120" y="80" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">case A</text>
  <text x="120" y="96" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">case B</text>
  <text x="120" y="112" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">case C</text>
  <text x="120" y="128" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">case D</text>
  <text x="120" y="150" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="600">+ case E (edit here)</text>

  <line x1="45" y1="200" x2="90" y2="165" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3 3"/>
  <line x1="120" y1="215" x2="120" y2="165" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3 3"/>
  <line x1="195" y1="200" x2="150" y2="165" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3 3"/>
  <text x="120" y="235" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">every call site risks a regression</text>

  <rect x="380" y="55" width="55" height="42" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="407" y="80" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">A</text>
  <rect x="443" y="55" width="55" height="42" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="470" y="80" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">B</text>
  <rect x="380" y="105" width="55" height="42" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="407" y="130" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">C</text>
  <rect x="443" y="105" width="55" height="42" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="470" y="130" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">D</text>
  <text x="435" y="170" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">untouched, no arrows in</text>

  <rect x="525" y="80" width="60" height="42" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="555" y="105" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">E new</text>
  <text x="480" y="235" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">one class added, nothing else touched</text>
</svg>
