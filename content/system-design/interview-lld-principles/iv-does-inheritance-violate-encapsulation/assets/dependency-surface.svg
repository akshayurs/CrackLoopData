<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Base class</text>

  <rect x="140" y="45" width="280" height="180" rx="10" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="150" y="65" font-size="11" fill="var(--dg-muted, #5F6368)">actual dependency surface</text>

  <rect x="185" y="95" width="190" height="80" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="280" y="120" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">declared contract</text>
  <text x="280" y="140" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">public method</text>
  <text x="280" y="155" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">signatures</text>

  <text x="280" y="205" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">internal call order + side effects</text>

  <rect x="30" y="245" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="271" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Subclass</text>

  <line x1="170" y1="255" x2="260" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
</svg>
