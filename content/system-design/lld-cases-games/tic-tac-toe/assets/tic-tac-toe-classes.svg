<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="250" y="15" width="140" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="35" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Game</text>
  <text x="320" y="50" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">board, players, currentTurn</text>
  <text x="320" y="60" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">playTurn()</text>

  <line x1="280" y1="65" x2="130" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="360" y1="65" x2="500" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="320" y1="65" x2="320" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="60" y="110" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="130" y="130" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Board</text>
  <text x="130" y="144" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">grid, size, placeMove()</text>

  <rect x="255" y="110" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="130" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Player</text>
  <text x="320" y="144" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">symbol, PlayerStrategy</text>

  <rect x="430" y="110" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="130" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">WinChecker</text>
  <text x="505" y="144" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">lines, checkWinner()</text>

  <line x1="130" y1="156" x2="130" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="60" y="200" width="140" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="130" y="222" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Cell</text>
  <text x="130" y="234" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">row, col, symbol</text>

  <line x1="320" y1="156" x2="320" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="260" y="200" width="120" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="221" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Symbol enum</text>

  <path d="M 320 65 C 200 90, 220 250, 380 250 C 450 250, 460 200, 505 158" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="330" y="280" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Game calls WinChecker.checkWinner() after each Board.placeMove()</text>

  <text x="320" y="305" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Board never depends on WinChecker — it never knows a game can be won.</text>
</svg>
