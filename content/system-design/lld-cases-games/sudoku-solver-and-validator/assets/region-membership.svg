<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="var(--dg-ink, #202124)" stroke-width="2"/>
  <!-- row highlight -->
  <rect x="20" y="180" width="360" height="40" fill="var(--dg-accent-bg, #E3F3F1)"/>
  <!-- column highlight -->
  <rect x="180" y="20" width="40" height="360" fill="var(--dg-accent-bg, #E3F3F1)"/>
  <!-- box highlight -->
  <rect x="140" y="140" width="120" height="120" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>

  <!-- grid lines -->
  <g stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1">
    <line x1="60" y1="20" x2="60" y2="380"/>
    <line x1="100" y1="20" x2="100" y2="380"/>
    <line x1="140" y1="20" x2="140" y2="380"/>
    <line x1="180" y1="20" x2="180" y2="380"/>
    <line x1="220" y1="20" x2="220" y2="380"/>
    <line x1="260" y1="20" x2="260" y2="380"/>
    <line x1="300" y1="20" x2="300" y2="380"/>
    <line x1="340" y1="20" x2="340" y2="380"/>
    <line x1="20" y1="60" x2="380" y2="60"/>
    <line x1="20" y1="100" x2="380" y2="100"/>
    <line x1="20" y1="140" x2="380" y2="140"/>
    <line x1="20" y1="180" x2="380" y2="180"/>
    <line x1="20" y1="220" x2="380" y2="220"/>
    <line x1="20" y1="260" x2="380" y2="260"/>
    <line x1="20" y1="300" x2="380" y2="300"/>
    <line x1="20" y1="340" x2="380" y2="340"/>
  </g>
  <!-- box borders (bold every 3) -->
  <g stroke="var(--dg-ink, #202124)" stroke-width="2">
    <line x1="140" y1="20" x2="140" y2="380"/>
    <line x1="260" y1="20" x2="260" y2="380"/>
    <line x1="20" y1="140" x2="380" y2="140"/>
    <line x1="20" y1="260" x2="380" y2="260"/>
  </g>

  <!-- the cell: overlap of row, column, box -->
  <rect x="180" y="180" width="40" height="40" fill="var(--dg-accent, #0C8F88)" opacity="0.35" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>

  <text x="200" y="12" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Row, column, and box overlap at one cell</text>
</svg>
