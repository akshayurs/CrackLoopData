<svg viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="250" y="10" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="300" y="31" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">partial grid</text>

  <line x1="280" y1="44" x2="150" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="300" y1="44" x2="300" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="320" y1="44" x2="450" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="200" y="65" font-size="9" fill="var(--dg-muted, #5F6368)">try digit 1..9</text>

  <rect x="100" y="90" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="111" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">place digit 3</text>

  <rect x="250" y="90" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="300" y="111" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">place digit 5</text>

  <rect x="400" y="90" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="450" y="111" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">place digit 7</text>

  <text x="150" y="150" text-anchor="middle" font-size="16" fill="var(--dg-accent, #0C8F88)">✕</text>
  <path d="M 150 155 C 150 175, 250 175, 280 130" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="150" y="170" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">dead end, backtrack</text>

  <line x1="300" y1="124" x2="300" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="250" y="160" width="100" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="300" y="181" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">next empty cell</text>

  <line x1="300" y1="194" x2="300" y2="225" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="250" y="225" width="100" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="300" y="246" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">solved leaf</text>

  <text x="450" y="150" text-anchor="middle" font-size="16" fill="var(--dg-accent, #0C8F88)">✕</text>

  <text x="300" y="270" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Tree depth bounded by empty cells, at most 81.</text>
</svg>
