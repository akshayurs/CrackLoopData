<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="250" y="15" width="140" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="320" y="32" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Piece (abstract)</text>
  <text x="320" y="46" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">getCandidateMoves()</text>

  <line x1="270" y1="55" x2="60" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="295" y1="55" x2="170" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="315" y1="55" x2="290" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="325" y1="55" x2="380" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="345" y1="55" x2="470" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="370" y1="55" x2="570" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <g font-size="9" fill="var(--dg-ink, #202124)">
    <rect x="20" y="90" width="80" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="60" y="109" text-anchor="middle">Pawn</text>
    <rect x="130" y="90" width="80" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="170" y="109" text-anchor="middle">Knight</text>
    <rect x="250" y="90" width="80" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="290" y="109" text-anchor="middle">Bishop</text>
    <rect x="340" y="90" width="80" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="380" y="109" text-anchor="middle">Rook</text>
    <rect x="430" y="90" width="80" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="470" y="109" text-anchor="middle">Queen</text>
    <rect x="530" y="90" width="80" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="570" y="109" text-anchor="middle">King</text>
  </g>
  <text x="320" y="140" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">geometry lives in Piece subclasses</text>

  <rect x="150" y="170" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="220" y="198" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Board</text>

  <rect x="350" y="170" width="160" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="430" y="192" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">MoveValidator</text>
  <text x="430" y="205" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">board-state legality</text>

  <text x="320" y="240" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Check-safety legality lives in MoveValidator, above any individual piece.</text>
</svg>
