<svg viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="90" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="115" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">candidate move</text>

  <line x1="140" y1="110" x2="195" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="200" y="90" width="150" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="275" y="108" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">apply to scratch</text>
  <text x="275" y="121" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">copy of board</text>

  <line x1="350" y1="110" x2="405" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <polygon points="480,80 550,110 480,140 410,110" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="480" y="106" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">king under</text>
  <text x="480" y="118" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">attack?</text>

  <line x1="480" y1="140" x2="480" y2="185" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="495" y="165" font-size="9" fill="var(--dg-muted, #5F6368)">yes</text>
  <rect x="410" y="190" width="140" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="480" y="212" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">revert, illegal</text>

  <line x1="410" y1="110" x2="270" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="330" y="140" font-size="9" fill="var(--dg-muted, #5F6368)">no</text>
  <rect x="150" y="155" width="150" height="36" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="225" y="177" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">keep in legal-moves list</text>

  <text x="300" y="245" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">The real board is never mutated during this check.</text>
</svg>
