<svg viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="30" y="15" width="90" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="75" y="37" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Game</text>
  <line x1="75" y1="49" x2="75" y2="250" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>

  <rect x="255" y="15" width="90" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="300" y="37" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Dice</text>
  <line x1="300" y1="49" x2="300" y2="250" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>

  <rect x="480" y="15" width="90" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="525" y="37" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Board</text>
  <line x1="525" y1="49" x2="525" y2="250" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>

  <line x1="75" y1="70" x2="295" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="185" y="63" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">roll()</text>

  <line x1="300" y1="90" x2="80" y2="90" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="185" y="83" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">result</text>

  <text x="150" y="115" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">add to Player position -&gt; raw position</text>

  <line x1="75" y1="140" x2="520" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="300" y="133" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">resolvePosition(raw)</text>

  <line x1="525" y1="160" x2="80" y2="160" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="300" y="153" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">final position (after any Jump)</text>

  <text x="185" y="185" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Game updates Player position, checks win</text>

  <text x="300" y="270" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Every arrow points one direction — neither Dice nor Board calls back into Game.</text>
</svg>
