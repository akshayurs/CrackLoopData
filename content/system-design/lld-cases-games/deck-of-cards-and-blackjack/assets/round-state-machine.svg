<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="10" y="70" width="100" height="40" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="95" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Betting</text>

  <line x1="110" y1="90" x2="160" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="165" y="70" width="100" height="40" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="215" y="95" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Dealing</text>

  <line x1="265" y1="90" x2="315" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="320" y="70" width="120" height="40" rx="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="380" y="95" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">PlayerTurns</text>
  <path d="M 380 70 C 380 30, 440 30, 440 68" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="410" y="25" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">loops per player</text>

  <line x1="440" y1="90" x2="480" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="485" y="70" width="120" height="40" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="545" y="95" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">DealerTurn</text>

  <line x1="605" y1="90" x2="605" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <path d="M 605 140 C 605 160, 610 160, 610 160 L 300 160" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="200" y="140" width="100" height="40" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="165" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Payout</text>

  <text x="320" y="195" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">One-directional: no going back once players finish acting.</text>
</svg>
