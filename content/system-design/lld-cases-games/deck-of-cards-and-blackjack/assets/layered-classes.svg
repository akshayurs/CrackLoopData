<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="320" y="24" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">Blackjack-specific (top layer)</text>
  <rect x="20" y="35" width="110" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="75" y="59" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Shoe</text>

  <rect x="145" y="35" width="110" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="200" y="59" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Player</text>

  <rect x="270" y="35" width="110" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="325" y="59" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Dealer</text>

  <rect x="395" y="35" width="110" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="450" y="59" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Game</text>

  <rect x="520" y="35" width="110" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="575" y="53" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Blackjack</text>
  <text x="575" y="65" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Hand</text>

  <line x1="75" y1="75" x2="80" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="200" y1="75" x2="200" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="325" y1="75" x2="290" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="450" y1="75" x2="400" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="575" y1="75" x2="400" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="500" y="105" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">depends downward only</text>

  <text x="240" y="128" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">Generic, reusable (bottom layer)</text>
  <rect x="70" y="140" width="100" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="120" y="164" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Card</text>

  <rect x="180" y="140" width="100" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="230" y="164" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Deck</text>

  <rect x="290" y="140" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="350" y="164" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Hand</text>

  <text x="320" y="220" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">The bottom layer has zero imports from, or knowledge of, Blackjack.</text>
</svg>
