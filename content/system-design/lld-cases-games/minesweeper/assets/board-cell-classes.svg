<svg viewBox="0 0 600 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="150" height="70" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="38" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Cell</text>
  <text x="95" y="52" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">isMine, isRevealed</text>
  <text x="95" y="64" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">isFlagged</text>
  <text x="95" y="78" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">adjacentMineCount</text>

  <line x1="170" y1="55" x2="225" y2="55" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="197" y="47" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">2D array</text>

  <rect x="230" y="20" width="160" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="310" y="40" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Board</text>
  <text x="310" y="55" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">reveal(cell)</text>
  <text x="310" y="68" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">toggleFlag(cell)</text>

  <line x1="390" y1="55" x2="445" y2="55" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="450" y="20" width="130" height="70" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="515" y="40" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Game</text>
  <text x="515" y="55" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">board reference</text>
  <text x="515" y="68" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">remainingSafeCells</text>

  <text x="300" y="130" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Cell holds no game-outcome logic — it's pure state.</text>
  <text x="300" y="148" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Board.reveal() runs flood-fill; Game alone decides win or loss.</text>
</svg>
