<svg viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <!-- 6x6 grid -->
  <g stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1">
    <rect x="20" y="20" width="360" height="240" fill="none"/>
    <line x1="80" y1="20" x2="80" y2="260"/>
    <line x1="140" y1="20" x2="140" y2="260"/>
    <line x1="200" y1="20" x2="200" y2="260"/>
    <line x1="260" y1="20" x2="260" y2="260"/>
    <line x1="320" y1="20" x2="320" y2="260"/>
    <line x1="20" y1="60" x2="380" y2="60"/>
    <line x1="20" y1="100" x2="380" y2="100"/>
    <line x1="20" y1="140" x2="380" y2="140"/>
    <line x1="20" y1="180" x2="380" y2="180"/>
    <line x1="20" y1="220" x2="380" y2="220"/>
  </g>

  <!-- revealed zero-count region (shaded) -->
  <rect x="80" y="60" width="180" height="120" fill="var(--dg-accent-bg, #E3F3F1)"/>

  <!-- frontier cells about to be visited (dashed outline) -->
  <rect x="260" y="60" width="60" height="40" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="80" y="180" width="60" height="40" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="290" y="83" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">?</text>
  <text x="110" y="203" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">?</text>

  <!-- numbered boundary cells -->
  <text x="290" y="130" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">2</text>
  <text x="230" y="200" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">1</text>
  <text x="110" y="130" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">1</text>

  <text x="200" y="285" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Fill spreads only through the zero-count region.</text>
  <text x="200" y="300" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Numbered boundary cells reveal once, never enqueue neighbors.</text>
</svg>
