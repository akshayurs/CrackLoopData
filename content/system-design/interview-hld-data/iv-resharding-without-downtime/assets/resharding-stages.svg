<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <line x1="30" y1="150" x2="610" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="70" cy="150" r="5" fill="var(--dg-accent, #0C8F88)"/>
  <text x="70" y="175" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Dual-Write</text>

  <circle cx="210" cy="150" r="5" fill="var(--dg-accent, #0C8F88)"/>
  <text x="210" y="175" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Backfill</text>

  <circle cx="350" cy="150" r="5" fill="var(--dg-accent, #0C8F88)"/>
  <text x="350" y="175" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Verify</text>

  <circle cx="480" cy="150" r="5" fill="var(--dg-accent, #0C8F88)"/>
  <text x="480" y="175" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Cutover</text>

  <circle cx="590" cy="150" r="5" fill="var(--dg-line, #5F6368)"/>
  <text x="590" y="175" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Cleanup</text>

  <rect x="55" y="40" width="440" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="275" y="60" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">dual-write spans stages 1-4</text>

  <line x1="70" y1="70" x2="70" y2="145" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,3"/>
  <line x1="480" y1="70" x2="480" y2="145" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,3"/>

  <text x="320" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Dual-writing is the safety net across the whole migration, not just the first step.</text>
</svg>
