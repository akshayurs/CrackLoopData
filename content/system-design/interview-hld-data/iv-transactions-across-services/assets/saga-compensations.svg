<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="40" width="160" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="100" y="65" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Reserve Inventory</text>
  <line x1="180" y1="60" x2="230" y2="60" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="235" y="40" width="160" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="315" y="65" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Charge Payment</text>
  <line x1="395" y1="60" x2="445" y2="60" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="450" y="40" width="160" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="530" y="65" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Confirm Order</text>
  <text x="530" y="30" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">fails</text>

  <line x1="100" y1="80" x2="100" y2="140" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="20" y="145" width="160" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="100" y="170" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Release Inventory</text>

  <line x1="315" y1="80" x2="315" y2="140" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="235" y="145" width="160" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="315" y="170" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Refund Payment</text>

  <line x1="530" y1="80" x2="400" y2="140" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="5,4"/>

  <text x="320" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Every forward step needs a defined compensating action to run if a later step fails.</text>
</svg>
