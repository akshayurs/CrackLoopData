<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="230" y="20" width="180" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="43" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">App tier</text>

  <line x1="270" y1="56" x2="120" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="320" y1="56" x2="320" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="370" y1="56" x2="520" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="30" y="110" width="180" height="55" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="120" y="130" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Relational DB</text>
  <text x="120" y="146" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Accounts &amp; Sessions</text>

  <rect x="230" y="110" width="180" height="55" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="130" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Graph DB</text>
  <text x="320" y="146" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Follow Graph</text>

  <rect x="430" y="110" width="180" height="55" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="520" y="130" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Search Index</text>
  <text x="520" y="146" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Post Search</text>

  <line x1="120" y1="165" x2="470" y2="165" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3,3"/>
  <text x="320" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">posts write to both the relational store and the search index</text>

  <text x="320" y="225" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each store exists because the relational default can't serve one access pattern well.</text>
</svg>
