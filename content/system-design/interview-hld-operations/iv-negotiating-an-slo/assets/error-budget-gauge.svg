<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="105" y="24" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Mostly full</text>
  <rect x="55" y="40" width="100" height="120" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="55" y="55" width="100" height="105" fill="var(--dg-accent-bg, #E3F3F1)"/>
  <text x="105" y="180" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">deploys flow freely</text>

  <text x="320" y="24" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Half-spent</text>
  <rect x="270" y="40" width="100" height="120" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="270" y="100" width="100" height="60" fill="var(--dg-accent-bg, #E3F3F1)"/>
  <text x="320" y="180" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">extra caution on</text>
  <text x="320" y="193" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">risky changes</text>

  <text x="535" y="24" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Nearly empty</text>
  <rect x="485" y="40" width="100" height="120" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="485" y="150" width="100" height="10" fill="var(--dg-accent-bg, #E3F3F1)"/>
  <text x="535" y="180" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">deploy freeze,</text>
  <text x="535" y="193" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">reliability work first</text>

  <text x="320" y="212" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">Resets each month</text>
</svg>
