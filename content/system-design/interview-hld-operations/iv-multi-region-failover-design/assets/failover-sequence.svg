<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="30" width="140" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="59" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Primary region</text>

  <line x1="160" y1="55" x2="240" y2="55" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="200" y="42" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">async replicate</text>

  <rect x="240" y="30" width="140" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="310" y="59" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Standby region</text>

  <line x1="90" y1="80" x2="90" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="30" y="105" font-size="9" fill="var(--dg-muted, #5F6368)">health check</text>

  <rect x="20" y="120" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="90" y="144" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">primary down</text>

  <line x1="160" y1="140" x2="480" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="320" y="130" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">DNS / LB shifts traffic</text>

  <rect x="480" y="120" width="160" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="560" y="144" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">standby promoted</text>

  <line x1="310" y1="80" x2="310" y2="115" stroke="var(--dg-line, #5F6368)" stroke-dasharray="2 2"/>

  <text x="350" y="195" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">replicate &#8594; detect &#8594; shift traffic &#8594; promote</text>
</svg>
