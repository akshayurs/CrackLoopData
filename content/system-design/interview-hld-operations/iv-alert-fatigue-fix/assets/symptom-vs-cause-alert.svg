<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="30" y="30" width="240" height="56" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="150" y="53" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Checkout error rate &gt; 1%</text>
  <text x="150" y="70" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">symptom</text>

  <line x1="150" y1="86" x2="150" y2="126" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="150" y="150" text-anchor="middle" font-size="19" fill="var(--dg-accent, #0C8F88)">&#10003;</text>
  <text x="150" y="170" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">page immediately</text>

  <rect x="370" y="30" width="240" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="53" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">One of 50 pods restarted</text>
  <text x="490" y="70" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">cause</text>

  <line x1="490" y1="86" x2="490" y2="126" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="490" y="150" text-anchor="middle" font-size="18" fill="var(--dg-muted, #5F6368)">&#10005;</text>
  <text x="490" y="170" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">usually self-heals</text>
  <text x="490" y="185" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">page only if recurring</text>
</svg>
