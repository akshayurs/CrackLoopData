<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="120" y="26" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Traffic %</text>
  <rect x="40" y="45" width="160" height="18" rx="9" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="40" y="45" width="16" height="18" rx="9" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="120" y="82" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">tiny slice injected</text>

  <text x="330" y="26" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Abort condition</text>
  <rect x="260" y="45" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="330" y="69" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">pre-agreed, set</text>
  <text x="330" y="82" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">before test starts</text>

  <text x="540" y="26" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Kill switch</text>
  <circle cx="540" cy="65" r="24" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="540" y="71" text-anchor="middle" font-size="14" fill="var(--dg-accent, #0C8F88)">&#9724;</text>

  <line x1="120" y1="95" x2="120" y2="130" stroke="var(--dg-line, #5F6368)"/>
  <line x1="330" y1="95" x2="330" y2="130" stroke="var(--dg-line, #5F6368)"/>
  <line x1="540" y1="95" x2="540" y2="130" stroke="var(--dg-line, #5F6368)"/>
  <line x1="120" y1="130" x2="540" y2="130" stroke="var(--dg-line, #5F6368)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <line x1="330" y1="130" x2="330" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="230" y="160" width="200" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="330" y="185" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">immediate stop signal</text>
</svg>
