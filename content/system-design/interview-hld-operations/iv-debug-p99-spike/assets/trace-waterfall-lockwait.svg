<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">3-second request trace</text>

  <rect x="40" y="45" width="560" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="65" font-size="10" fill="var(--dg-ink, #202124)">handler</text>

  <rect x="90" y="80" width="510" height="30" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="110" y="100" font-size="10" fill="var(--dg-ink, #202124)">DB call — 2.8s</text>

  <rect x="140" y="115" width="420" height="26" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="160" y="133" font-size="10" fill="var(--dg-ink, #202124)">lock wait — most of the 2.8s</text>

  <rect x="140" y="145" width="60" height="18" rx="3" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="170" y="158" text-anchor="middle" font-size="8.5" fill="var(--dg-muted, #5F6368)">query exec</text>

  <text x="320" y="195" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">contention, not a slow query</text>
</svg>
