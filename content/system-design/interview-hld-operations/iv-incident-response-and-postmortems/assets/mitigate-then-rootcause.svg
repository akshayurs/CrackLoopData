<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="30" y="60" width="140" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="100" y="83" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Incident:</text>
  <text x="100" y="99" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">mitigate</text>
  <text x="100" y="140" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">rollback, failover, scale</text>
  <text x="100" y="45" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">short, urgent</text>

  <line x1="170" y1="90" x2="205" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="205" y="60" width="380" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="395" y="83" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Postmortem:</text>
  <text x="395" y="99" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">root-cause</text>
  <text x="395" y="45" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">longer, unhurried — off the clock of user impact</text>
</svg>
