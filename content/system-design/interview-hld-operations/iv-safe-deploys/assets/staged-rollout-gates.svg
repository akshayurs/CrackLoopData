<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="60" width="120" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="88" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">1%</text>
  <line x1="140" y1="83" x2="185" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="162" y="70" text-anchor="middle" font-size="14" fill="var(--dg-accent, #0C8F88)">&#9679;</text>

  <rect x="185" y="60" width="120" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="245" y="88" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">10%</text>
  <line x1="305" y1="83" x2="350" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="327" y="70" text-anchor="middle" font-size="14" fill="var(--dg-accent, #0C8F88)">&#9679;</text>

  <rect x="350" y="60" width="120" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="410" y="88" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">50%</text>
  <line x1="470" y1="83" x2="515" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="492" y="70" text-anchor="middle" font-size="14" fill="var(--dg-accent, #0C8F88)">&#9679;</text>

  <rect x="515" y="60" width="120" height="46" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="575" y="88" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">100%</text>

  <text x="327" y="45" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">gate: error rate / p99 held steady</text>

  <path d="M575 106 C 575 170, 80 170, 80 106" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="327" y="195" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">automatic rollback if any gate fails</text>
</svg>
