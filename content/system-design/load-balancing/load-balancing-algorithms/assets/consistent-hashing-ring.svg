<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="150" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Before: 3 nodes</text>
  <circle cx="150" cy="150" r="100" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="150" cy="50" r="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="150" y="36" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">A</text>
  <circle cx="236" cy="200" r="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="252" y="204" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">B</text>
  <circle cx="64" cy="200" r="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="48" y="204" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">C</text>

  <circle cx="110" cy="65" r="4" fill="var(--dg-ink, #202124)"/>
  <circle cx="205" cy="85" r="4" fill="var(--dg-ink, #202124)"/>
  <circle cx="200" cy="215" r="4" fill="var(--dg-ink, #202124)"/>
  <circle cx="90" cy="230" r="4" fill="var(--dg-ink, #202124)"/>
  <text x="150" y="280" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">each key served by the next node clockwise</text>

  <line x1="270" y1="150" x2="330" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="140" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">add D</text>

  <text x="490" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">After: node D inserted</text>
  <circle cx="490" cy="150" r="100" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="490" cy="50" r="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="36" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">A</text>
  <circle cx="576" cy="200" r="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="592" y="204" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">B</text>
  <circle cx="404" cy="200" r="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="388" y="204" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">C</text>
  <circle cx="435" cy="60" r="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="415" y="48" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">D</text>

  <circle cx="450" cy="65" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <circle cx="545" cy="85" r="4" fill="var(--dg-ink, #202124)"/>
  <circle cx="540" cy="215" r="4" fill="var(--dg-ink, #202124)"/>
  <circle cx="430" cy="230" r="4" fill="var(--dg-ink, #202124)"/>
  <text x="490" y="280" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">only the arc between C and D moves</text>
</svg>
