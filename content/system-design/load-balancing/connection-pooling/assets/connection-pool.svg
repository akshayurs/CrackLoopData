<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <rect x="220" y="60" width="200" height="140" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="46" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Connection pool</text>

  <rect x="240" y="80" width="70" height="34" rx="6" fill="var(--dg-stroke, #9AA0A6)" opacity="0.5"/>
  <text x="275" y="101" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">checked out</text>
  <rect x="330" y="80" width="70" height="34" rx="6" fill="var(--dg-stroke, #9AA0A6)" opacity="0.5"/>
  <text x="365" y="101" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">checked out</text>

  <rect x="240" y="130" width="70" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="275" y="151" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">idle</text>
  <rect x="330" y="130" width="70" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="365" y="151" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">idle</text>

  <rect x="40" y="60" width="110" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="81" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">active request A</text>
  <rect x="40" y="120" width="110" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="141" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">active request B</text>

  <path d="M150,77 L238,90" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M150,137 L328,95" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="480" y="60" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="540" y="81" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">new request</text>
  <path d="M478,77 L422,100" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="470" y="95" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">checkout</text>

  <rect x="480" y="150" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="540" y="171" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">completed request</text>
  <path d="M478,167 L422,150" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
  <text x="470" y="152" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">return</text>

  <text x="320" y="235" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Pool size caps how many requests to this destination run at once.</text>
</svg>
