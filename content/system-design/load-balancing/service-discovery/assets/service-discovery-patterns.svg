<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="150" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Client-side discovery</text>
  <rect x="30" y="110" width="70" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="65" y="131" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Caller</text>

  <rect x="150" y="55" width="90" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="195" y="79" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Registry</text>

  <path d="M100,120 Q125,90 150,72" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="120" y="90" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">lookup</text>

  <rect x="150" y="180" width="30" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="165" y="197" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">I1</text>
  <rect x="190" y="200" width="30" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="205" y="217" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">I2</text>
  <rect x="230" y="180" width="30" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="245" y="197" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">I3</text>

  <path d="M100,132 Q135,160 160,182" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
