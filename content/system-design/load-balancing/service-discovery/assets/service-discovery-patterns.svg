  <line x1="320" y1="10" x2="320" y2="260" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="490" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Server-side discovery</text>
  <rect x="360" y="110" width="70" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="395" y="131" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Caller</text>

  <rect x="460" y="105" width="100" height="44" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="510" y="131" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Load balancer</text>

  <path d="M430,127 L458,127" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="490" y="55" width="90" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="535" y="76" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Registry</text>
  <path d="M510,103 Q515,90 520,90" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="480" y="180" width="30" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="495" y="197" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">I1</text>
  <rect x="520" y="200" width="30" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="535" y="217" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">I2</text>
  <rect x="560" y="180" width="30" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="575" y="197" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">I3</text>

  <path d="M510,149 Q505,170 500,180" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="145" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">LB does the lookup</text>
</svg>
