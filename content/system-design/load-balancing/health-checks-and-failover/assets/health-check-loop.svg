<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <rect x="20" y="90" width="120" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="80" y="124" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Load balancer</text>

  <rect x="240" y="30" width="90" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="285" y="54" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Node 1</text>
  <rect x="240" y="100" width="90" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="285" y="124" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Node 2</text>
  <text x="285" y="152" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">unhealthy</text>
  <rect x="240" y="170" width="90" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="285" y="194" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Node 3</text>

  <path d="M140,100 Q190,50 240,50" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M240,60 Q190,80 140,110" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M140,140 Q190,140 238,120" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

  <path d="M140,140 Q190,180 240,190" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M240,200 Q190,210 140,150" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="80" y="180" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">health check every 5s</text>

  <line x1="360" y1="120" x2="410" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="385" y="108" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">threshold hit</text>

  <rect x="420" y="90" width="120" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="480" y="124" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Load balancer</text>

  <rect x="590" y="60" width="45" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="612" y="82" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">N1</text>
  <rect x="590" y="104" width="45" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
  <text x="612" y="126" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">N2</text>
  <rect x="590" y="148" width="45" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="612" y="170" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">N3</text>

  <path d="M540,110 L588,78" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M540,130 L588,166" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="320" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">After crossing the failure threshold, routing skips node 2 entirely.</text>
</svg>
