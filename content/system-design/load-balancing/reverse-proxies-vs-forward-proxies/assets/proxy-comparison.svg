<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="150" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Forward proxy</text>
  <rect x="20" y="50" width="50" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="45" y="69" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Client</text>
  <rect x="20" y="90" width="50" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="45" y="109" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Client</text>
  <rect x="20" y="130" width="50" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="45" y="149" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Client</text>

  <rect x="120" y="80" width="90" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="165" y="109" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Forward proxy</text>

  <path d="M70,65 L118,90" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M70,105 L118,105" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M70,145 L118,120" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M210,105 L270,105" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="95" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">internet</text>
  <circle cx="285" cy="105" r="14" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
