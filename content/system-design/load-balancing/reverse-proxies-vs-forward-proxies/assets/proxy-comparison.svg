  <text x="165" y="185" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="600">servers see one proxy IP,</text>
  <text x="165" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="600">not each client</text>

  <line x1="320" y1="10" x2="320" y2="240" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="490" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Reverse proxy</text>
  <rect x="355" y="90" width="50" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="380" y="109" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Client</text>

  <rect x="440" y="80" width="90" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="485" y="109" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Reverse proxy</text>

  <path d="M405,105 L438,105" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="580" y="60" width="45" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="602" y="77" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Backend</text>
  <rect x="580" y="95" width="45" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="602" y="112" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Backend</text>
  <rect x="580" y="130" width="45" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="602" y="147" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Backend</text>

  <path d="M530,90 L578,72" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M530,105 L578,108" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M530,120 L578,143" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="490" y="185" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="600">client sees one address,</text>
  <text x="490" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="600">not any backend</text>
</svg>
