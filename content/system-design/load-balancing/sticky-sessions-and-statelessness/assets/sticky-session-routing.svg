<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <rect x="20" y="30" width="70" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="55" y="49" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Request 1</text>
  <rect x="20" y="100" width="70" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="55" y="119" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Request 2</text>
  <rect x="20" y="170" width="70" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="55" y="189" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Request 3</text>
  <text x="55" y="215" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">session=abc123</text>

  <rect x="180" y="95" width="110" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="235" y="119" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Load balancer</text>

  <path d="M90,45 Q140,45 178,105" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <path d="M90,115 L178,115" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <path d="M90,185 Q140,185 178,125" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <rect x="420" y="30" width="90" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="465" y="52" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Node 1 (idle)</text>

  <rect x="420" y="97" width="90" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="465" y="119" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Node 2</text>

  <rect x="420" y="164" width="90" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="465" y="186" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Node 3 (idle)</text>

  <path d="M290,115 L418,115" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <text x="320" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Every request from this client goes to node 2 — nodes 1 and 3 sit unused for it.</text>
</svg>
