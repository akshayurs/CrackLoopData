<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <circle cx="80" cy="70" r="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="74" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">User</text>
  <text x="80" y="98" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">(India)</text>

  <rect x="260" y="50" width="140" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="330" y="70" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">GSLB / DNS</text>
  <text x="330" y="86" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">checks health + distance</text>

  <path d="M96,75 L258,72" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
  <text x="175" y="60" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">query</text>

  <rect x="500" y="30" width="120" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="560" y="55" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">US datacenter</text>

  <rect x="500" y="104" width="120" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="560" y="129" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Europe datacenter</text>
  <text x="560" y="160" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">unhealthy — excluded</text>

  <rect x="500" y="182" width="120" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="560" y="207" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">India datacenter</text>

  <path d="M400,68 L498,50" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M400,75 L498,125" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M400,82 L498,200" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <text x="320" y="260" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">DNS answer resolves to the nearest healthy region — the decision is made once, before the request is sent.</text>
</svg>
