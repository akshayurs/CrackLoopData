<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="150" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">No negative cache</text>
  <text x="45" y="60" font-size="9" fill="var(--dg-muted, #5F6368)">req 1</text>
  <text x="45" y="80" font-size="9" fill="var(--dg-muted, #5F6368)">req 2</text>
  <text x="45" y="100" font-size="9" fill="var(--dg-muted, #5F6368)">req 3</text>
  <rect x="100" y="55" width="60" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <text x="130" y="90" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">empty cache</text>
  <path d="M40,60 L98,65" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M40,80 L98,80" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M40,100 L98,95" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="210" y="60" width="90" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="255" y="90" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Database</text>
  <path d="M160,68 L208,72" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M160,85 L208,85" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M160,100 L208,98" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="255" y="128" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">every request hits the DB</text>

  <line x1="320" y1="10" x2="320" y2="240" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="480" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">With negative caching</text>
  <text x="365" y="60" font-size="9" fill="var(--dg-muted, #5F6368)">req 1</text>
  <text x="365" y="80" font-size="9" fill="var(--dg-muted, #5F6368)">req 2</text>
  <text x="365" y="100" font-size="9" fill="var(--dg-muted, #5F6368)">req 3</text>
  <rect x="420" y="55" width="70" height="60" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="455" y="90" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">negative</text>
  <text x="455" y="102" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">entry</text>

  <path d="M360,60 L418,68" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M360,80 L418,80" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
  <path d="M360,100 L418,92" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

  <rect x="540" y="60" width="80" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="580" y="90" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Database</text>
  <path d="M490,68 L538,72" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="500" y="130" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">only req 1 reaches the DB</text>
</svg>
