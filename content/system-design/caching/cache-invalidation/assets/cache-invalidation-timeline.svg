<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <line x1="40" y1="120" x2="600" y2="120" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="140" cy="120" r="5" fill="var(--dg-ink, #202124)"/>
  <text x="140" y="105" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">t=0</text>
  <text x="140" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">DB write</text>

  <rect x="80" y="45" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="140" y="66" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Cache: pre-write value</text>
  <line x1="140" y1="79" x2="140" y2="115" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,2"/>

  <circle cx="420" cy="120" r="5" fill="var(--dg-accent, #0C8F88)"/>
  <text x="420" y="105" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">t=1</text>
  <text x="420" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">user read</text>

  <rect x="350" y="160" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="420" y="177" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">receives stale value</text>
  <text x="420" y="192" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">(not yet invalidated)</text>
  <line x1="420" y1="125" x2="420" y2="158" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,2"/>

  <text x="600" y="105" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">time</text>
</svg>
