<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="150" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Read path (miss)</text>
  <rect x="20" y="50" width="80" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="71" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">App</text>
  <rect x="130" y="50" width="80" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="170" y="71" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Cache</text>
  <rect x="240" y="50" width="80" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="280" y="71" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Database</text>

  <path d="M100,67 L128,67" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="114" y="57" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">1 check</text>
  <path d="M170,84 Q170,105 240,105" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="98" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">2 miss → read</text>
  <path d="M240,120 Q170,140 170,88" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="150" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">3 backfill cache</text>

  <line x1="320" y1="10" x2="320" y2="240" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="480" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Write path</text>
  <rect x="350" y="50" width="80" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="390" y="71" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">App</text>
  <rect x="460" y="50" width="80" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="71" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Database</text>
  <rect x="570" y="50" width="60" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="600" y="71" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Cache</text>

  <path d="M430,67 L458,67" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="444" y="57" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">1 write</text>
  <path d="M540,67 L568,67" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="554" y="57" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">2 invalidate</text>

  <text x="320" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The app is in the loop on every step of both paths.</text>
</svg>
