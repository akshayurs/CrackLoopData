<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="15" y="60" width="120" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="86" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Browser</text>
  <circle cx="75" cy="45" r="9" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="75" y="32" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">browser cache</text>

  <rect x="175" y="60" width="120" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="235" y="86" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">CDN edge</text>
  <circle cx="235" cy="45" r="9" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="235" y="32" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">CDN cache</text>

  <rect x="335" y="60" width="120" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="395" y="86" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">App server</text>
  <circle cx="395" cy="45" r="9" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="395" y="32" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">app cache</text>

  <rect x="495" y="60" width="120" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="555" y="86" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Database</text>
  <circle cx="555" cy="45" r="9" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="555" y="32" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">query cache</text>

  <line x1="135" y1="82" x2="173" y2="82" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="295" y1="82" x2="333" y2="82" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="455" y1="82" x2="493" y2="82" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="320" y="175" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each layer skips a different kind of work — a well-cached request may hit none of them past the first.</text>
</svg>
