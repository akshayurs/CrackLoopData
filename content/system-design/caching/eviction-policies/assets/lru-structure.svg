<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="110" y="24" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Hashmap</text>
  <rect x="30" y="40" width="160" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="40" y="57" font-size="10" fill="var(--dg-ink, #202124)">key A → node</text>
  <rect x="30" y="72" width="160" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="40" y="89" font-size="10" fill="var(--dg-ink, #202124)">key B → node</text>
  <rect x="30" y="104" width="160" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="40" y="121" font-size="10" fill="var(--dg-ink, #202124)">key C → node</text>

  <text x="420" y="24" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Doubly linked list</text>
  <text x="240" y="45" font-size="9" fill="var(--dg-muted, #5F6368)">head (MRU)</text>
  <rect x="240" y="55" width="70" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="275" y="76" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">A</text>

  <rect x="340" y="55" width="70" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="375" y="76" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">B</text>

  <rect x="440" y="55" width="70" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="475" y="76" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">C</text>
  <text x="475" y="45" font-size="9" fill="var(--dg-muted, #5F6368)">tail (LRU)</text>

  <path d="M310,72 L338,72" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340,80 L312,80" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M410,72 L438,72" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M440,80 L412,80" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M475,89 L475,130 L540,130" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
  <text x="580" y="150" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">evict tail</text>
  <text x="580" y="122" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">when full</text>

  <text x="320" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">O(1) lookup via the hashmap, O(1) reorder and eviction via the list.</text>
</svg>
