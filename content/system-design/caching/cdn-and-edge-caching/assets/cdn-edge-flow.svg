<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <rect x="20" y="85" width="80" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="106" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">User</text>

  <rect x="180" y="70" width="120" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="240" y="104" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">CDN edge node</text>

  <path d="M100,102 L178,102" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M300,90 Q340,60 380,90" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="340" y="55" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">hit → respond directly</text>
  <path d="M380,110 Q340,140 300,110" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <rect x="380" y="70" width="80" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" opacity="0.6"/>
  <text x="420" y="104" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">User</text>

  <path d="M300,120 Q420,160 500,120" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="400" y="170" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">miss → fetch, cache, return</text>

  <rect x="500" y="85" width="110" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="555" y="106" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Origin server</text>

  <text x="320" y="215" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Only the first nearby request pays the full round trip to origin.</text>
</svg>
