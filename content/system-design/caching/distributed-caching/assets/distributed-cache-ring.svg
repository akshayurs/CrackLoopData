<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="200" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Distributed cache ring</text>

  <circle cx="200" cy="170" r="120" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <circle cx="200" cy="50" r="12" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="200" y="35" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Node A</text>

  <circle cx="320" cy="170" r="12" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="345" y="174" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Node B</text>

  <circle cx="200" cy="290" r="12" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="200" y="308" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Node C</text>

  <circle cx="80" cy="170" r="12" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="55" y="174" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Node D</text>

  <circle cx="245" cy="60" r="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="265" y="55" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Replica of A</text>

  <circle cx="145" cy="80" r="4" fill="var(--dg-ink, #202124)"/>
  <circle cx="290" cy="110" r="4" fill="var(--dg-ink, #202124)"/>
  <circle cx="290" cy="230" r="4" fill="var(--dg-ink, #202124)"/>
  <circle cx="145" cy="260" r="4" fill="var(--dg-ink, #202124)"/>

  <text x="200" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">keys mapped to</text>
  <text x="200" y="163" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">next node clockwise</text>
