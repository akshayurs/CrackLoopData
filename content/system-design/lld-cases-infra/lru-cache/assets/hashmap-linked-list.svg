<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="80" y="26" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Hashmap</text>
  <rect x="20" y="40" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="61" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">A</text>
  <rect x="20" y="84" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="105" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">B</text>
  <rect x="20" y="128" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="149" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">C</text>

  <line x1="140" y1="57" x2="270" y2="57" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="140" y1="101" x2="380" y2="101" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="140" y1="145" x2="490" y2="145" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="380" y="26" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Doubly linked list, head to tail</text>

  <rect x="270" y="40" width="100" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="61" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Node A</text>
  <text x="320" y="30" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">head: most recently used</text>

  <line x1="370" y1="57" x2="378" y2="101" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="378" y1="101" x2="370" y2="57" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="380" y="84" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="430" y="105" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Node B</text>

  <line x1="480" y1="101" x2="488" y2="145" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="488" y1="145" x2="480" y2="101" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="490" y="128" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="540" y="149" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Node C</text>
  <text x="540" y="180" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">tail: least recently used</text>

  <path d="M 540 162 C 540 210, 80 210, 80 162" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="310" y="225" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">map value and list node are the same object</text>
</svg>
