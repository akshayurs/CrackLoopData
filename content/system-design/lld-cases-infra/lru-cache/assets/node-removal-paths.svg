<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="250" y="20" width="160" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="330" y="42" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Node</text>
  <text x="330" y="58" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">LRU position (prev/next)</text>
  <text x="330" y="72" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">expiresAt timestamp</text>

  <rect x="40" y="140" width="150" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="115" y="164" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">get() call</text>

  <rect x="460" y="140" width="150" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="535" y="160" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">background timer</text>
  <text x="535" y="173" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">swept every N seconds</text>

  <line x1="115" y1="140" x2="180" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="90" y="115" font-size="9" fill="var(--dg-muted, #5F6368)">lazy: checked on access</text>

  <line x1="535" y1="140" x2="440" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="440" y="115" font-size="9" fill="var(--dg-muted, #5F6368)">active: swept every N sec</text>

  <rect x="270" y="200" width="120" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="330" y="220" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">removed from</text>
  <text x="330" y="234" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">map + list</text>

  <line x1="115" y1="180" x2="300" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="535" y1="180" x2="365" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
</svg>
