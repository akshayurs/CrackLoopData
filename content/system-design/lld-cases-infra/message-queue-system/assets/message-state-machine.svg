<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="90" width="100" height="40" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="115" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">queued</text>

  <line x1="120" y1="110" x2="180" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="185" y="90" width="110" height="40" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="115" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">in-flight</text>

  <line x1="295" y1="100" x2="360" y2="60" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="330" y="75" font-size="9" fill="var(--dg-muted, #5F6368)">ack</text>

  <rect x="365" y="35" width="100" height="40" rx="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="415" y="60" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">acked</text>

  <line x1="295" y1="120" x2="365" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="370" y="160" width="160" height="40" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="450" y="185" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">nacked / timed-out</text>

  <path d="M 370 175 C 250 175, 200 145, 200 132" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="270" y="200" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">retry, up to N times</text>

  <line x1="530" y1="180" x2="580" y2="180" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="555" y="170" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">after N fails</text>

  <rect x="540" y="160" width="90" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="540" y="230" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)"></text>
  <text x="585" y="185" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">dead-</text>
  <text x="585" y="197" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">lettered</text>

  <text x="320" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">The retry loop is what makes at-least-once delivery real.</text>
</svg>
