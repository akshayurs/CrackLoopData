<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="30" y="90" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="115" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Producer</text>

  <line x1="150" y1="110" x2="220" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="225" y="30" width="200" height="220" rx="10" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="325" y="50" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Queue</text>

  <rect x="245" y="65" width="160" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="325" y="93" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">pending messages</text>

  <rect x="245" y="195" width="160" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="325" y="223" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">in-flight (unacked)</text>

  <line x1="325" y1="111" x2="325" y2="193" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="340" y="150" font-size="9" fill="var(--dg-muted, #5F6368)">Consumer pulls</text>

  <path d="M 245 210 C 175 200, 175 100, 245 90" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="150" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">nack() or timeout</text>
  <text x="150" y="162" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">— requeue</text>

  <line x1="425" y1="215" x2="480" y2="215" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="460" y="205" font-size="9" fill="var(--dg-muted, #5F6368)">ack()</text>

  <rect x="485" y="195" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="545" y="219" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Consumer</text>

  <text x="325" y="270" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">In-flight is where all the reliability logic lives.</text>
</svg>
