<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="10" y="70" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="95" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">logger.info()</text>

  <line x1="130" y1="90" x2="185" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <polygon points="270,60 340,90 270,120 200,90" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="270" y="94" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">level check</text>

  <path d="M 270 120 C 270 200, 70 200, 70 115" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="170" y="215" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">dropped</text>

  <line x1="340" y1="90" x2="395" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="400" y="70" width="110" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="455" y="95" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Formatter</text>

  <line x1="510" y1="85" x2="580" y2="35" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="510" y1="90" x2="580" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="510" y1="95" x2="580" y2="145" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="585" y="15" width="90" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="630" y="37" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Console</text>

  <rect x="585" y="72" width="90" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="630" y="94" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">File</text>

  <rect x="585" y="127" width="90" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="630" y="149" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Cloud</text>

  <text x="340" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">One record formats once, then fans out to every registered appender.</text>
</svg>
