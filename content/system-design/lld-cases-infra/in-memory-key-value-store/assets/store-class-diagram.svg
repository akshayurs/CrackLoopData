<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="diamond" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,4 L6,0 L12,4 L6,8 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="260" y="20" width="120" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="46" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Store</text>

  <line x1="320" y1="62" x2="320" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#diamond)"/>
  <text x="335" y="82" font-size="10" fill="var(--dg-muted, #5F6368)">owns</text>

  <rect x="245" y="100" width="150" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="120" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Entry</text>
  <text x="320" y="134" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">value, expiresAt</text>

  <line x1="280" y1="20" x2="120" y2="100" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="150" y="60" font-size="10" fill="var(--dg-muted, #5F6368)">depends on</text>

  <line x1="360" y1="20" x2="520" y2="100" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="480" y="60" font-size="10" fill="var(--dg-muted, #5F6368)">depends on</text>

  <rect x="40" y="100" width="160" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="120" y="125" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">ExpiryPolicy</text>

  <rect x="440" y="100" width="180" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="125" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">PersistenceStrategy</text>

  <line x1="90" y1="140" x2="60" y2="190" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="150" y1="140" x2="200" y2="190" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="490" y1="140" x2="450" y2="190" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="570" y1="140" x2="610" y2="190" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="10" y="190" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="215" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">LazyExpiry</text>

  <rect x="150" y="190" width="150" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="225" y="215" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">ActiveSweepExpiry</text>

  <rect x="360" y="190" width="150" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="435" y="215" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">SnapshotPersistence</text>

  <rect x="530" y="190" width="100" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="580" y="210" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">AppendOnly</text>
  <text x="580" y="222" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">LogPersistence</text>

  <text x="320" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Store owns Entry directly, but only depends on the two interfaces.</text>
</svg>
