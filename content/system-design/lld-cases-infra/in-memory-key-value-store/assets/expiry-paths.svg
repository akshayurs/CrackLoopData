<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Lazy path</text>
  <rect x="20" y="45" width="130" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="70" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">get(key) call</text>

  <line x1="150" y1="65" x2="205" y2="65" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="210" y="45" width="140" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="280" y="70" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">expiresAt check</text>

  <line x1="350" y1="65" x2="405" y2="65" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="410" y="45" width="150" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="485" y="70" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">remove if expired</text>

  <text x="20" y="130" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Active-sweep path</text>
  <rect x="20" y="145" width="150" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="166" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">background timer</text>
  <text x="95" y="178" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">every N seconds</text>

  <line x1="170" y1="165" x2="225" y2="165" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="230" y="145" width="150" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="305" y="170" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">sample a batch</text>

  <line x1="380" y1="165" x2="435" y2="165" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="440" y="145" width="150" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="515" y="170" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">remove expired</text>

  <path d="M 590 165 C 620 165, 620 220, 95 220 C 40 220, 40 195, 40 185" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="320" y="235" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">loop back to timer</text>

  <path d="M 485 85 C 485 105, 305 105, 305 143" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3"/>
  <text x="400" y="105" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">both converge on the same removal</text>
</svg>
