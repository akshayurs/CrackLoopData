<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="240" y="20" width="150" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="315" y="45" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">UserPreference</text>

  <line x1="315" y1="60" x2="315" y2="90" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="330" y="78" font-size="9" fill="var(--dg-muted, #5F6368)">filters</text>

  <rect x="20" y="90" width="150" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="115" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Notification event</text>

  <line x1="170" y1="110" x2="245" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="250" y="90" width="130" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="315" y="115" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Dispatcher</text>

  <line x1="380" y1="105" x2="460" y2="60" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="380" y1="110" x2="460" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="380" y1="115" x2="460" y2="165" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="465" y="40" width="130" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="62" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">EmailChannel</text>

  <rect x="465" y="92" width="130" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="114" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">SmsChannel</text>

  <rect x="465" y="147" width="130" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="169" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">PushChannel</text>

  <rect x="330" y="185" width="80" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="370" y="204" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Template</text>
  <line x1="410" y1="200" x2="460" y2="60" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>
  <line x1="410" y1="200" x2="460" y2="110" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>
  <line x1="410" y1="200" x2="460" y2="165" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>

  <text x="320" y="255" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">One event, one dispatch — channels render independently after that.</text>
</svg>
