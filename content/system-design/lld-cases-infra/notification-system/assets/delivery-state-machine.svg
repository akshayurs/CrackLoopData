<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="90" width="100" height="40" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="115" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">pending</text>

  <line x1="120" y1="110" x2="180" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="185" y="90" width="100" height="40" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="235" y="115" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">sent</text>

  <line x1="285" y1="110" x2="345" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="350" y="90" width="100" height="40" rx="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="400" y="115" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">delivered</text>

  <line x1="235" y1="130" x2="235" y2="180" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="185" y="180" width="100" height="40" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="235" y="205" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">failed</text>

  <path d="M 185 195 C 130 195, 90 160, 75 132" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="90" y="165" font-size="9" fill="var(--dg-muted, #5F6368)">retry (up to cap)</text>

  <line x1="285" y1="200" x2="530" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="400" y="190" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">retries exhausted</text>

  <rect x="535" y="180" width="90" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="580" y="205" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">dead-letter</text>

  <text x="320" y="245" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Each (notification, channel) pair moves through this independently.</text>
</svg>
