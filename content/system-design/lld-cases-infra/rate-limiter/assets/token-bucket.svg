<svg viewBox="0 0 560 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="330" y="26" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">refill rate: e.g. 10/sec</text>
  <line x1="330" y1="34" x2="330" y2="70" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="270" y="70" width="120" height="140" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="270" y="130" width="120" height="80" fill="var(--dg-accent-bg, #E3F3F1)" stroke="none"/>
  <line x1="270" y1="130" x2="390" y2="130" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="400" y="134" font-size="9" fill="var(--dg-muted, #5F6368)">capacity</text>
  <text x="330" y="105" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">bucket</text>

  <rect x="30" y="120" width="130" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="142" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">request arrives</text>

  <line x1="160" y1="138" x2="265" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="200" y="130" font-size="9" fill="var(--dg-muted, #5F6368)">-1 token</text>

  <rect x="410" y="120" width="120" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="470" y="142" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">rejected (X)</text>
  <line x1="395" y1="140" x2="405" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="470" y="175" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">bucket empty</text>

  <text x="330" y="250" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Tokens drip in at a fixed rate; each request costs one token.</text>
</svg>
