<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="20" y="24" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Fixed window</text>
  <line x1="20" y1="90" x2="580" y2="90" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <line x1="300" y1="35" x2="300" y2="90" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3 3"/>
  <text x="150" y="45" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">window 1</text>
  <text x="450" y="45" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">window 2</text>

  <rect x="230" y="55" width="30" height="35" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <rect x="265" y="55" width="30" height="35" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <rect x="300" y="55" width="30" height="35" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <rect x="335" y="55" width="30" height="35" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>

  <path d="M 230 105 C 230 120, 365 120, 365 105" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="300" y="130" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">requests straddling boundary: ~2x intended limit</text>

  <text x="20" y="170" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Sliding window</text>
  <line x1="20" y1="230" x2="580" y2="230" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <path d="M 20 210 C 150 195, 450 195, 580 210" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="300" y="255" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">no hard reset point — rate stays flat across the boundary</text>
</svg>
