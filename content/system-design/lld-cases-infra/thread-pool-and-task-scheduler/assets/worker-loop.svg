<svg viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="180" y="20" width="150" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="255" y="46" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">pull task from queue</text>

  <line x1="255" y1="62" x2="255" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="180" y="100" width="150" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="255" y="126" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">execute task</text>

  <line x1="200" y1="142" x2="90" y2="180" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="115" y="165" font-size="9" fill="var(--dg-muted, #5F6368)">success</text>

  <line x1="310" y1="142" x2="410" y2="180" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="370" y="165" font-size="9" fill="var(--dg-muted, #5F6368)">failure</text>

  <rect x="330" y="185" width="150" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="405" y="203" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">catch exception,</text>
  <text x="405" y="217" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">log/report</text>

  <path d="M 40 200 C -10 250, 150 280, 240 260" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <path d="M 405 225 C 405 280, 260 280, 260 262" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="10" y="180" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="204" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">pull next task</text>

  <path d="M 130 200 C 160 200, 180 60, 180 41" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="255" y="300" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">The loop never exits on a task failure.</text>
</svg>
