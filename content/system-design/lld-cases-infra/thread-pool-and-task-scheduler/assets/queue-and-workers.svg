<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="120" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="42" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">submit(task)</text>

  <line x1="140" y1="38" x2="255" y2="38" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="260" y="20" width="160" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="340" y="42" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">TaskQueue</text>
  <text x="340" y="58" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">bounded, has capacity</text>

  <line x1="340" y1="70" x2="130" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="340" y1="70" x2="340" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="340" y1="70" x2="550" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="340" y="95" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">pull next task</text>

  <rect x="60" y="125" width="140" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="130" y="150" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">WorkerThread</text>

  <rect x="270" y="125" width="140" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="340" y="150" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">WorkerThread</text>

  <rect x="480" y="125" width="140" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="550" y="150" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">WorkerThread</text>

  <path d="M 60 145 C 20 145, 20 185, 55 185 L 90 185" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <path d="M 270 145 C 230 145, 230 185, 265 185 L 300 185" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <path d="M 480 145 C 440 145, 440 185, 475 185 L 510 185" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="130" y="200" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">loop</text>

  <line x1="420" y1="35" x2="480" y2="35" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="485" y="15" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="555" y="35" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">RejectionPolicy</text>
  <text x="555" y="49" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">triggered when full</text>

  <text x="320" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">One shared queue, N independent pullers.</text>
</svg>
