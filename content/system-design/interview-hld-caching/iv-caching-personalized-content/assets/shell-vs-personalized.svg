<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <rect x="60" y="30" width="520" height="160" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="20" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Page</text>

  <rect x="80" y="45" width="480" height="50" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="65" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Shared shell</text>
  <text x="320" y="82" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">cached at CDN, same for every user</text>

  <rect x="80" y="110" width="480" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="320" y="132" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Personalized widget</text>
  <text x="320" y="150" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">fetched fresh per request</text>
  <text x="320" y="164" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">stitched in via edge include</text>

  <text x="320" y="210" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The shell caches fully; the personalized piece never caches — and that's fine, it's cheap.</text>
</svg>
