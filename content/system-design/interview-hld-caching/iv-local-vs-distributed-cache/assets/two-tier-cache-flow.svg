<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="80" width="110" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="75" y="104" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">App node</text>
  <line x1="130" y1="100" x2="185" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="190" y="80" width="140" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="260" y="100" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Local cache</text>
  <text x="260" y="113" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">~80% hit</text>

  <line x1="330" y1="100" x2="385" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="358" y="92" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">miss</text>

  <rect x="390" y="80" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="460" y="100" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Redis (distributed)</text>
  <text x="460" y="113" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">~15% hit</text>

  <line x1="530" y1="100" x2="585" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="558" y="92" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">miss</text>

  <rect x="560" y="140" width="60" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="590" y="162" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">DB</text>
  <text x="590" y="130" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">~5%</text>
  <line x1="590" y1="120" x2="590" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="320" y="205" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Local absorbs the hottest keys before ever hitting the network hop to Redis.</text>
</svg>
