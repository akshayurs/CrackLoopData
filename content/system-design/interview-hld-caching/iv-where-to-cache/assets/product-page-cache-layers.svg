<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="230" y="20" width="180" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="45" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Product page</text>

  <line x1="270" y1="60" x2="130" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="320" y1="60" x2="320" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="370" y1="60" x2="510" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="40" y="110" width="180" height="55" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="130" y="130" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Images</text>
  <text x="130" y="145" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">CDN</text>
  <text x="130" y="158" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">static, cacheable long</text>

  <rect x="230" y="110" width="180" height="55" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="130" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Price</text>
  <text x="320" y="145" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">app-layer cache (Redis)</text>
  <text x="320" y="158" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">shared across users</text>

  <rect x="420" y="110" width="180" height="55" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="510" y="130" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Inventory</text>
  <text x="510" y="145" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">database</text>
  <text x="510" y="158" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">must be current</text>

  <text x="320" y="205" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each field is placed by how fresh it must be, not cached uniformly at one layer.</text>
</svg>
