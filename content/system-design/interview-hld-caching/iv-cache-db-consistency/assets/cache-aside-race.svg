<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="20" y="50" font-size="11" fill="var(--dg-muted, #5F6368)">Writer</text>
  <line x1="70" y1="45" x2="600" y2="45" stroke="var(--dg-line, #5F6368)"/>

  <text x="20" y="140" font-size="11" fill="var(--dg-muted, #5F6368)">Reader</text>
  <line x1="70" y1="135" x2="600" y2="135" stroke="var(--dg-line, #5F6368)"/>

  <circle cx="120" cy="45" r="5" fill="var(--dg-accent, #0C8F88)"/>
  <text x="120" y="30" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">delete key</text>

  <rect x="150" y="35" width="260" height="20" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="280" y="49" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">DB write in progress</text>

  <circle cx="410" cy="45" r="5" fill="var(--dg-accent, #0C8F88)"/>
  <text x="410" y="30" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">commit</text>

  <line x1="120" y1="50" x2="220" y2="130" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3,3"/>

  <circle cx="220" cy="135" r="5" fill="var(--dg-accent, #0C8F88)"/>
  <text x="220" y="120" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">miss, reads old value</text>

  <circle cx="300" cy="135" r="5" fill="var(--dg-accent, #0C8F88)"/>
  <text x="300" y="155" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">repopulates cache</text>
  <text x="300" y="168" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">with old value</text>

  <line x1="300" y1="130" x2="410" y2="55" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <text x="320" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A read slips between the delete and the commit, leaving the cache stale.</text>
</svg>
