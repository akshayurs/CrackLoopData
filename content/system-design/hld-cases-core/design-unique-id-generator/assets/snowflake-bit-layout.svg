<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">64-bit Snowflake ID layout</text>

  <rect x="20" y="60" width="20" height="44" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="40" y="60" width="270" height="44" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <rect x="310" y="60" width="70" height="44" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="380" y="60" width="80" height="44" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>

  <text x="30" y="86" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">1</text>
  <text x="175" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">41 bits</text>
  <text x="175" y="95" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">timestamp</text>
  <text x="345" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">10 bits</text>
  <text x="345" y="95" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">machine ID</text>
  <text x="420" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">12 bits</text>
  <text x="420" y="95" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">sequence</text>

  <text x="30" y="120" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">sign</text>
  <text x="175" y="120" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">~69 years range</text>
  <text x="345" y="120" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">1,024 machines</text>
  <text x="420" y="120" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">4,096 IDs / ms</text>

  <text x="320" y="165" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">More machine-ID bits -&gt; fewer sequence bits (or vice versa) —</text>
  <text x="320" y="183" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">the split is a design decision, not a fixed constant.</text>
</svg>
