<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Write quorum via coordinator</text>

  <text x="60" y="55" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Client</text>
  <line x1="60" y1="62" x2="60" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="2 3"/>
  <text x="220" y="55" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Coordinator</text>
  <line x1="220" y1="62" x2="220" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="2 3"/>
  <text x="380" y="55" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Replica 1</text>
  <line x1="380" y1="62" x2="380" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="2 3"/>
  <text x="480" y="55" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Replica 2</text>
  <line x1="480" y1="62" x2="480" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="2 3"/>
  <text x="580" y="55" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Replica 3</text>
  <line x1="580" y1="62" x2="580" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="2 3"/>

  <line x1="60" y1="85" x2="215" y2="85" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="140" y="80" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">write(K, V)</text>

  <line x1="225" y1="105" x2="375" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="225" y1="105" x2="475" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="225" y1="105" x2="575" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="400" y="100" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">forward to N replicas</text>

  <line x1="380" y1="135" x2="225" y2="135" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
  <text x="300" y="128" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">ack 1</text>
  <line x1="480" y1="155" x2="225" y2="155" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
  <text x="350" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">ack 2 (W reached)</text>

  <line x1="215" y1="185" x2="60" y2="185" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="140" y="178" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">success</text>

  <line x1="580" y1="215" x2="225" y2="215" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="400" y="210" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">ack 3 arrives later, async</text>

  <text x="320" y="290" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Client sees success at W acks; the coordinator need not own the key itself.</text>
</svg>
