<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Pastebin architecture</text>

  <rect x="20" y="100" width="80" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="124" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Client</text>

  <line x1="100" y1="120" x2="150" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="150" y="100" width="100" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="200" y="124" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">API server</text>

  <line x1="250" y1="110" x2="330" y2="65" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="330" y="45" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="390" y="69" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Object store</text>
  <text x="390" y="30" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">paste content</text>

  <line x1="250" y1="130" x2="330" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="330" y="110" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="390" y="134" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Database</text>
  <text x="390" y="163" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">metadata row</text>

  <line x1="250" y1="150" x2="330" y2="190" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="330" y="180" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="390" y="204" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Cache</text>
  <text x="390" y="235" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">read path, in front of object store</text>

  <line x1="390" y1="180" x2="390" y2="150" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3"/>
</svg>
