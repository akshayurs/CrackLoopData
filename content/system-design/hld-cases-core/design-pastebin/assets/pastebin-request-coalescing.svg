<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Request coalescing for a hot paste</text>

  <rect x="20" y="45" width="90" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="65" y="66" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Request 1</text>
  <rect x="20" y="90" width="90" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="65" y="111" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Request 2</text>
  <rect x="20" y="135" width="90" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="65" y="156" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Request N</text>

  <line x1="110" y1="62" x2="230" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="110" y1="107" x2="230" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="110" y1="152" x2="230" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="230" y="100" width="150" height="44" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="305" y="120" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Cache: coalesce</text>
  <text x="305" y="136" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">one in-flight fetch</text>

  <line x1="380" y1="122" x2="450" y2="122" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="450" y="100" width="130" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="515" y="126" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Object store</text>

  <line x1="305" y1="144" x2="65" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="10" y="200" width="180" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="224" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">All N waiters served</text>

  <text x="320" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">N concurrent misses become one fetch, fanned back out to all N waiters.</text>
</svg>
