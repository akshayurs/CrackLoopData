<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Hot-key splitting + local cache</text>

  <rect x="30" y="50" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="74" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Client requests</text>

  <rect x="30" y="110" width="120" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="90" y="128" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Local in-process</text>
  <text x="90" y="142" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">cache (hottest)</text>

  <line x1="90" y1="90" x2="90" y2="110" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="150" y="103" font-size="9" fill="var(--dg-muted, #5F6368)">skip network for extreme cases</text>

  <line x1="90" y1="70" x2="260" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="175" y="62" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">pick random suffix</text>

  <rect x="260" y="50" width="90" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="305" y="74" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">key#0</text>
  <rect x="370" y="50" width="90" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="415" y="74" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">key#1</text>
  <rect x="480" y="50" width="90" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="525" y="74" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">key#2</text>

  <line x1="305" y1="90" x2="305" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="415" y1="90" x2="415" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="525" y1="90" x2="525" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="260" y="150" width="90" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="305" y="177" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Node A</text>
  <rect x="370" y="150" width="90" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="415" y="177" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Node B</text>
  <rect x="480" y="150" width="90" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="525" y="177" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Node C</text>

  <text x="320" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Same value copied under suffixed keys, spread across nodes;</text>
  <text x="320" y="258" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">local cache skips the network hop entirely for the hottest reads.</text>
</svg>
