<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Client-side routing on the hash ring</text>

  <rect x="30" y="55" width="150" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="76" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Application</text>
  <text x="105" y="93" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">+ routing library</text>
  <text x="105" y="118" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">hashes key, knows ring</text>

  <circle cx="420" cy="180" r="90" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="420" cy="90" r="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="420" y="94" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">N1</text>
  <circle cx="500" cy="140" r="16" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="500" y="144" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">N2</text>
  <circle cx="480" cy="230" r="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="480" y="234" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">N3</text>
  <circle cx="360" cy="230" r="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="360" y="234" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">N4</text>
  <circle cx="340" cy="140" r="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="340" y="144" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">N5</text>

  <line x1="180" y1="80" x2="330" y2="60" stroke="var(--dg-line, #5F6368)"/>
  <line x1="330" y1="60" x2="490" y2="130" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="52" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">direct request, owning shard</text>

  <text x="320" y="290" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">No central router in the request path — every hop is one client-to-shard call.</text>
</svg>
