<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Sharded leaderboard merge</text>

  <rect x="40" y="50" width="140" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Shard A</text>
  <text x="110" y="88" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">sorted set, top-N</text>

  <rect x="250" y="50" width="140" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Shard B</text>
  <text x="320" y="88" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">sorted set, top-N</text>

  <rect x="460" y="50" width="140" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Shard C</text>
  <text x="530" y="88" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">sorted set, top-N</text>

  <line x1="110" y1="100" x2="290" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="320" y1="100" x2="320" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="530" y1="100" x2="350" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="220" y="160" width="200" height="52" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="182" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Merge layer</text>
  <text x="320" y="198" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">k-way merge of per-shard lists</text>

  <line x1="320" y1="212" x2="320" y2="240" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="200" y="240" width="240" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="265" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Global top-N + rank</text>
</svg>
