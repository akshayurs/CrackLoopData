<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">URL shortener architecture</text>

  <rect x="20" y="120" width="80" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="144" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Client</text>

  <line x1="100" y1="140" x2="140" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="140" y="120" width="80" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="180" y="144" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">LB</text>

  <line x1="220" y1="140" x2="260" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="260" y="120" width="100" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="310" y="144" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">API servers</text>

  <line x1="360" y1="130" x2="430" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="430" y="45" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="69" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Key Gen Service</text>
  <text x="410" y="65" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">write: new code</text>

  <line x1="360" y1="145" x2="430" y2="145" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="430" y="125" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="149" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Sharded DB</text>
  <text x="490" y="105" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">store / read mapping</text>

  <line x1="360" y1="155" x2="430" y2="210" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="430" y="200" width="120" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="490" y="224" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Cache</text>
  <text x="490" y="255" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">redirect read path: hit here first</text>

  <line x1="490" y1="200" x2="490" y2="165" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3"/>
  <text x="380" y="290" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Writes: client -&gt; API -&gt; KGS -&gt; DB.  Reads: client -&gt; API -&gt; cache (hit) or DB (miss).</text>
</svg>
