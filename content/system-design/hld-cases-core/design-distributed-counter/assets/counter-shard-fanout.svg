<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Sharded counter: write fan-out, read sum</text>

  <rect x="10" y="45" width="90" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="55" y="67" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Increment</text>

  <line x1="100" y1="63" x2="180" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="100" y1="63" x2="300" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="100" y1="63" x2="420" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="140" y="80" width="80" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="180" y="104" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Shard 1</text>
  <rect x="260" y="80" width="80" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="300" y="104" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Shard 2</text>
  <rect x="380" y="80" width="80" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="420" y="104" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Shard N</text>
  <text x="300" y="140" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">N shards for one logical counter</text>

  <line x1="180" y1="120" x2="260" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="300" y1="120" x2="300" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="420" y1="120" x2="340" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="230" y="200" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="300" y="222" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Read: sum all</text>
  <text x="300" y="238" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">shards -&gt; total count</text>

  <line x1="300" y1="246" x2="300" y2="270" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="300" y="290" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Total</text>
</svg>
