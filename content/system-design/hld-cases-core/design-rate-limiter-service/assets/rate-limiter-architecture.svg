<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Rate limiter architecture</text>

  <rect x="30" y="55" width="150" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="76" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Calling service</text>
  <text x="105" y="93" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">+ client SDK</text>

  <line x1="180" y1="80" x2="240" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="240" y="55" width="130" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="305" y="85" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Load balancer</text>

  <line x1="305" y1="105" x2="305" y2="140" stroke="var(--dg-line, #5F6368)"/>
  <line x1="200" y1="140" x2="410" y2="140" stroke="var(--dg-line, #5F6368)"/>
  <line x1="200" y1="140" x2="200" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="305" y1="140" x2="305" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="410" y1="140" x2="410" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="150" y="160" width="100" height="44" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="200" y="186" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Limiter node</text>
  <rect x="255" y="160" width="100" height="44" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="305" y="186" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Limiter node</text>
  <rect x="360" y="160" width="100" height="44" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="410" y="186" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Limiter node</text>
  <text x="305" y="222" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">stateless — scale horizontally</text>

  <line x1="200" y1="204" x2="280" y2="255" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="305" y1="204" x2="305" y2="255" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="410" y1="204" x2="330" y2="255" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="220" y="255" width="170" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="305" y="277" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Redis counter store</text>
  <text x="305" y="294" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">shared, holds all counts</text>

  <text x="320" y="330" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">All state lives in Redis, so limiter nodes stay interchangeable.</text>
</svg>
