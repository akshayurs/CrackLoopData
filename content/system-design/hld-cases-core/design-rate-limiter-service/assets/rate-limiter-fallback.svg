<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Normal vs. overload fallback path</text>

  <text x="20" y="60" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Normal</text>
  <rect x="20" y="70" width="90" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="65" y="94" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Client SDK</text>
  <line x1="110" y1="90" x2="150" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="150" y="70" width="90" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="195" y="94" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Limiter</text>
  <line x1="240" y1="90" x2="280" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="280" y="70" width="90" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="325" y="94" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Redis</text>
  <line x1="370" y1="90" x2="410" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="410" y="70" width="110" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="465" y="94" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Exact decision</text>

  <line x1="320" y1="140" x2="320" y2="165" stroke="var(--dg-line, #5F6368)"/>

  <text x="20" y="195" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Redis overload</text>
  <rect x="20" y="205" width="90" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="65" y="229" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Client SDK</text>
  <line x1="110" y1="225" x2="150" y2="225" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="150" y="205" width="90" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="195" y="229" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Limiter</text>
  <line x1="240" y1="225" x2="280" y2="225" stroke-dasharray="4 3" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
  <rect x="280" y="205" width="90" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="325" y="223" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Redis</text>
  <text x="325" y="237" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">(overloaded)</text>
  <line x1="195" y1="245" x2="195" y2="270" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="140" y="270" width="120" height="34" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="200" y="292" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Local approx. fallback</text>
</svg>
