<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Fixing one layer reveals the next</text>

  <rect x="30" y="70" width="130" height="50" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="93" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Load balancer</text>
  <text x="95" y="109" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">near-linear</text>

  <line x1="160" y1="95" x2="195" y2="95" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="195" y="70" width="130" height="50" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="260" y="93" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">App tier</text>
  <text x="260" y="109" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">near-linear</text>

  <line x1="325" y1="95" x2="360" y2="95" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="360" y="70" width="120" height="50" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="420" y="93" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Cache</text>
  <text x="420" y="109" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">absorbs reads</text>

  <line x1="480" y1="95" x2="515" y2="95" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="515" y="70" width="105" height="50" rx="7" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="567" y="93" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Database</text>
  <text x="567" y="109" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">hard ceiling</text>

  <path d="M 480 155 Q 555 175 567 130" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="530" y="180" text-anchor="middle" font-size="10.5" fill="var(--dg-accent, #0C8F88)">load shifts here once earlier layers scale</text>

  <text x="320" y="200" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">walk the pipeline in order — don't jump straight to sharding</text>
</svg>
