<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Three single points of failure</text>

  <rect x="40" y="105" width="110" height="42" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="95" y="128" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Load balancer</text>
  <text x="95" y="141" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">count: 1</text>

  <line x1="150" y1="126" x2="220" y2="126" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="220" y="105" width="130" height="42" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="285" y="128" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Auth service</text>
  <text x="285" y="141" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">count: 1</text>

  <line x1="350" y1="126" x2="420" y2="126" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="420" y="105" width="130" height="42" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="485" y="128" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">DB primary</text>
  <text x="485" y="141" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">count: 1</text>

  <line x1="285" y1="147" x2="285" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="285" y="195" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">every other service calls it</text>

  <text x="320" y="235" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Each has a count of one — any single failure takes the whole path down</text>
</svg>
