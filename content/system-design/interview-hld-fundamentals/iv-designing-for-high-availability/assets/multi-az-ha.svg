<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Two AZs, redundant at every layer</text>

  <rect x="40" y="45" width="260" height="180" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="170" y="65" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">AZ 1</text>
  <rect x="70" y="80" width="200" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3"/>
  <text x="170" y="98" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Load balancer</text>
  <rect x="70" y="118" width="200" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3"/>
  <text x="170" y="136" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">App instances</text>
  <rect x="70" y="156" width="200" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3"/>
  <text x="170" y="174" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">DB replica</text>

  <rect x="340" y="45" width="260" height="180" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="470" y="65" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">AZ 2</text>
  <rect x="370" y="80" width="200" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3"/>
  <text x="470" y="98" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Load balancer</text>
  <rect x="370" y="118" width="200" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3"/>
  <text x="470" y="136" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">App instances</text>
  <rect x="370" y="156" width="200" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3"/>
  <text x="470" y="174" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">DB replica</text>

  <line x1="270" y1="169" x2="370" y2="169" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="181" x2="270" y2="181" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">cross-AZ replication</text>

  <text x="320" y="255" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Losing one whole AZ still leaves the other serving traffic</text>
</svg>
