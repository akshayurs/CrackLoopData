<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Throughput vs. nodes added</text>

  <line x1="70" y1="230" x2="580" y2="230" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="70" y1="230" x2="70" y2="45" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="580" y="248" text-anchor="end" font-size="11" fill="var(--dg-muted, #5F6368)">nodes added</text>
  <text x="55" y="45" text-anchor="end" font-size="11" fill="var(--dg-muted, #5F6368)">throughput</text>

  <path d="M 70 230 L 340 100" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>
  <path d="M 340 100 L 580 100" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5" stroke-dasharray="6,5"/>

  <circle cx="340" cy="100" r="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <line x1="340" y1="100" x2="340" y2="230" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="340" y="245" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">single DB primary saturates</text>

  <text x="200" y="150" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">near-linear scaling</text>
  <text x="470" y="90" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">flat despite more app nodes</text>
</svg>
