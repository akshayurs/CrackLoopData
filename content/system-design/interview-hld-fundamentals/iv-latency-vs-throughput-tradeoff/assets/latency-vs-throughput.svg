<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="160" y="22" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Optimized for latency</text>
  <text x="480" y="22" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Optimized for throughput</text>
  <line x1="320" y1="10" x2="320" y2="240" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="40" y="70" width="55" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.3"/>
  <text x="67" y="87" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">client</text>
  <line x1="95" y1="83" x2="130" y2="83" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="130" y="70" width="55" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.3"/>
  <text x="157" y="87" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">queue</text>
  <line x1="185" y1="83" x2="220" y2="83" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="220" y="70" width="55" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3"/>
  <text x="247" y="87" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">worker</text>

  <text x="160" y="130" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">each request processed</text>
  <text x="160" y="144" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">immediately, one at a time</text>

  <rect x="360" y="70" width="55" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.3"/>
  <text x="387" y="87" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">client</text>
  <line x1="415" y1="83" x2="450" y2="83" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="450" y="60" width="80" height="46" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="490" y="87" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">queue (batch)</text>
  <line x1="530" y1="83" x2="560" y2="83" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="560" y="70" width="55" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.3"/>
  <text x="587" y="87" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">worker</text>

  <text x="490" y="140" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">requests collected into a</text>
  <text x="490" y="154" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">batch before processing</text>

  <text x="320" y="210" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">same components, different queueing discipline</text>
</svg>
