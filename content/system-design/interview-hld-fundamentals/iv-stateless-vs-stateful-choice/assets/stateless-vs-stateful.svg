<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="160" y="22" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Stateless app tier</text>
  <text x="480" y="22" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Stateful gateway tier</text>
  <line x1="320" y1="10" x2="320" y2="260" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="70" y="45" width="60" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.3"/>
  <text x="100" y="62" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">LB</text>

  <rect x="45" y="95" width="55" height="34" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.3"/>
  <text x="72" y="115" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">node</text>
  <rect x="115" y="95" width="55" height="34" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.3"/>
  <text x="142" y="115" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">node</text>
  <rect x="185" y="95" width="55" height="34" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.3"/>
  <text x="212" y="115" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">node</text>

  <line x1="100" y1="71" x2="72" y2="95" stroke="var(--dg-line, #5F6368)" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="100" y1="71" x2="142" y2="95" stroke="var(--dg-line, #5F6368)" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="100" y1="71" x2="212" y2="95" stroke="var(--dg-line, #5F6368)" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="90" y="165" width="140" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3"/>
  <text x="160" y="185" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">external Redis store</text>
  <line x1="72" y1="129" x2="140" y2="165" stroke="var(--dg-line, #5F6368)" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="142" y1="129" x2="160" y2="165" stroke="var(--dg-line, #5F6368)" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="212" y1="129" x2="180" y2="165" stroke="var(--dg-line, #5F6368)" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="160" y="222" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">any node can serve any request</text>

  <rect x="365" y="95" width="70" height="42" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.3"/>
  <text x="400" y="113" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">node 1</text>
  <text x="400" y="127" text-anchor="middle" font-size="8.5" fill="var(--dg-muted, #5F6368)">conns A,B</text>

  <rect x="450" y="95" width="70" height="42" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.3"/>
  <text x="485" y="113" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">node 2</text>
  <text x="485" y="127" text-anchor="middle" font-size="8.5" fill="var(--dg-muted, #5F6368)">conns C,D</text>

  <rect x="535" y="95" width="70" height="42" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.3"/>
  <text x="570" y="113" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">node 3</text>
  <text x="570" y="127" text-anchor="middle" font-size="8.5" fill="var(--dg-muted, #5F6368)">conns E,F</text>

  <text x="485" y="222" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">each node holds connections others don't have</text>
  <text x="485" y="238" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">no external store for that state</text>
</svg>
