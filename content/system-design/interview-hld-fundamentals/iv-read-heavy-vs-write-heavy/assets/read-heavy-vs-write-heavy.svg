  <rect x="440" y="150" width="150" height="24" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="515" y="166" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">thin, rare read path</text>

  <text x="320" y="215" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">same shape, opposite emphasis</text>
