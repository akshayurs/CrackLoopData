  <text x="267" y="62" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">caches</text>

  <rect x="80" y="95" width="180" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3"/>
