<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="160" y="22" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Read-heavy</text>
  <text x="480" y="22" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Write-heavy</text>
  <line x1="320" y1="10" x2="320" y2="240" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="50" y="45" width="60" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.3"/>
  <text x="80" y="62" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">client</text>
  <line x1="110" y1="58" x2="145" y2="58" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="145" y="45" width="55" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3"/>
  <text x="172" y="62" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">CDN</text>
