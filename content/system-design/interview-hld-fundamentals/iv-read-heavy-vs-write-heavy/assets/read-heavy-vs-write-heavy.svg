  <text x="170" y="166" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">lightweight write path</text>

  <rect x="360" y="45" width="60" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.3"/>
  <text x="390" y="62" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">client</text>
  <line x1="420" y1="58" x2="455" y2="58" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="455" y="45" width="60" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3"/>
  <text x="485" y="62" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">buffer/queue</text>
  <line x1="515" y1="58" x2="550" y2="58" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="550" y="45" width="60" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3"/>
  <text x="580" y="62" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">shards</text>

  <rect x="440" y="95" width="150" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3"/>
