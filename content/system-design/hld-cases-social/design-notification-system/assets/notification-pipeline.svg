<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Notification pipeline</text>

  <rect x="20" y="80" width="120" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="105" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Triggering event</text>

  <line x1="140" y1="101" x2="178" y2="101" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="180" y="68" width="160" height="66" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="260" y="92" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Template lookup</text>
  <text x="260" y="108" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">+ parameter</text>
  <text x="260" y="121" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">substitution</text>

  <line x1="340" y1="101" x2="378" y2="101" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="380" y="68" width="170" height="66" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="465" y="98" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Per-recipient</text>
  <text x="465" y="114" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">channel dispatch</text>

  <line x1="500" y1="134" x2="500" y2="164" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="465" y1="134" x2="420" y2="164" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="465" y1="134" x2="580" y2="164" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="360" y="166" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="420" y="190" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Push adapter</text>

  <rect x="440" y="166" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="190" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Email adapter</text>

  <rect x="520" y="166" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="580" y="190" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">SMS adapter</text>

  <text x="350" y="248" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Each stage maps to a real decision: template lookup keeps copy out of code,</text>
  <text x="350" y="268" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">and the channel branch exists because push, email, and SMS each speak to a different provider.</text>
</svg>
