<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">End-to-end architecture</text>

  <rect x="20" y="60" width="100" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="85" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Event source</text>

  <line x1="120" y1="81" x2="158" y2="81" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="160" y="60" width="120" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="220" y="85" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Ingestion queue</text>

  <line x1="280" y1="81" x2="318" y2="81" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="320" y="45" width="200" height="72" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="420" y="65" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Worker pool</text>
  <text x="420" y="82" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">dedup check, preference</text>
  <text x="420" y="96" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">check, template render</text>

  <line x1="420" y1="117" x2="420" y2="150" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="430" y="138" text-anchor="start" font-size="9" fill="var(--dg-muted, #5F6368)">read before send (dedup)</text>

  <rect x="560" y="45" width="120" height="72" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="620" y="76" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Delivery log</text>
  <text x="620" y="92" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">eventId, userId, channel</text>

  <line x1="520" y1="81" x2="558" y2="81" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <line x1="380" y1="117" x2="240" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="420" y1="117" x2="420" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="460" y1="117" x2="600" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="160" y="200" width="160" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="220" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Push adapter</text>
  <text x="240" y="234" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">retry + fallback</text>

  <rect x="340" y="200" width="160" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="420" y="220" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Email adapter</text>
  <text x="420" y="234" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">retry + fallback</text>

  <rect x="520" y="200" width="160" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="600" y="220" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">SMS adapter</text>
  <text x="600" y="234" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">retry + fallback</text>

  <line x1="240" y1="244" x2="600" y2="280" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3"/>
  <line x1="420" y1="244" x2="600" y2="280" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3"/>
  <line x1="600" y1="244" x2="620" y2="280" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="470" y="270" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">write back after send</text>

  <text x="350" y="330" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">The delivery log appears twice — read before sending, written after —</text>
  <text x="350" y="350" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">which is what makes the pipeline idempotent under at-least-once event delivery.</text>
</svg>
