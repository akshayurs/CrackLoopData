<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Sharding by follower ID vs by followee ID</text>

  <text x="175" y="52" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Shard by follower ID</text>
  <rect x="30" y="66" width="290" height="106" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="45" y="80" width="80" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="85" y="101" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Shard 1: user A's</text>
  <rect x="45" y="120" width="260" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="175" y="134" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">A's full "following" list — one shard</text>
  <text x="175" y="148" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">but celebrity's followers scattered across all shards</text>

  <text x="525" y="52" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Shard by followee ID</text>
  <rect x="380" y="66" width="290" height="106" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="395" y="80" width="80" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="435" y="101" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Shard 1: celeb C's</text>
  <rect x="395" y="120" width="260" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="525" y="134" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">C's full "followers" list — one shard</text>
  <text x="525" y="148" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">but any user's "following" list scattered across shards</text>

  <rect x="30" y="200" width="290" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="175" y="221" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">"Who do I follow" -&gt; single-shard read</text>
  <rect x="380" y="200" width="290" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="525" y="221" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">"Who follows me" -&gt; single-shard read</text>

  <text x="350" y="270" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">No shard key keeps both directions co-located.</text>
  <text x="350" y="290" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Whichever query you optimize into a single-shard read, the other becomes a scatter-gather.</text>
</svg>
