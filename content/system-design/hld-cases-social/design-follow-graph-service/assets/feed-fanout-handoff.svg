<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Fan-out hand-off between follow graph and feed</text>

  <rect x="20" y="90" width="110" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="115" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">New post</text>

  <line x1="130" y1="111" x2="168" y2="111" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="170" y="78" width="170" height="66" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="255" y="102" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Follow graph service</text>
  <text x="255" y="118" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">getFollowers(authorId)</text>
  <text x="255" y="132" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">celeb sub-sharding invisible here</text>

  <line x1="340" y1="111" x2="378" y2="111" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="358" y="98" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">follower list</text>

  <rect x="380" y="78" width="170" height="66" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="465" y="102" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Feed fan-out worker</text>
  <text x="465" y="118" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">per-follower feed-store</text>
  <text x="465" y="132" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">writes</text>

  <line x1="550" y1="111" x2="588" y2="111" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="590" y="90" width="90" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="635" y="115" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Feed stores</text>

  <text x="350" y="192" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">The follow graph doesn't know about feeds; the feed system doesn't store follows —</text>
  <text x="350" y="212" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">it just calls getFollowers and fans out over whatever comes back.</text>
</svg>
