<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Write path for a like</text>

  <rect x="20" y="140" width="100" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="165" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Like request</text>

  <line x1="120" y1="161" x2="158" y2="161" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="160" y="128" width="150" height="66" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="235" y="150" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Dedup check</text>
  <text x="235" y="165" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">per-user-per-post</text>
  <text x="235" y="179" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">like record</text>

  <line x1="310" y1="161" x2="348" y2="161" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="330" y="152" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">new</text>

  <rect x="350" y="128" width="150" height="66" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="425" y="150" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Async increment</text>
  <text x="425" y="165" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">one randomly</text>
  <text x="425" y="179" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">chosen shard</text>

  <line x1="235" y1="194" x2="235" y2="230" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="255" y="216" text-anchor="start" font-size="10" fill="var(--dg-muted, #5F6368)">already liked -&gt; no-op</text>

  <line x1="425" y1="194" x2="415" y2="228" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="425" y1="194" x2="455" y2="228" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="425" y1="194" x2="495" y2="228" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="375" y="230" width="70" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="410" y="252" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Shard 1</text>
  <rect x="455" y="230" width="70" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="252" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Shard 2</text>
  <rect x="535" y="230" width="70" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="570" y="252" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Shard N</text>

  <line x1="410" y1="266" x2="470" y2="296" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="490" y1="266" x2="480" y2="296" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="570" y1="266" x2="490" y2="296" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="400" y="296" width="180" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="316" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Background aggregator</text>
  <text x="490" y="330" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">sums shards into displayed count</text>
</svg>
