<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Comment thread rendering</text>

  <rect x="30" y="60" width="180" height="110" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="120" y="80" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Flat storage</text>
  <text x="120" y="96" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">keyed by postId</text>
  <text x="45" y="116" font-size="9" fill="var(--dg-ink, #202124)">c1 parentId: null</text>
  <text x="45" y="130" font-size="9" fill="var(--dg-ink, #202124)">c2 parentId: c1</text>
  <text x="45" y="144" font-size="9" fill="var(--dg-ink, #202124)">c3 parentId: null</text>
  <text x="45" y="158" font-size="9" fill="var(--dg-ink, #202124)">c4 parentId: c3</text>

  <line x1="210" y1="115" x2="248" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="250" y="80" width="170" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="335" y="103" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Paginated query</text>
  <text x="335" y="119" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">next page, ordered</text>
  <text x="335" y="133" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">by creation time</text>

  <line x1="420" y1="115" x2="458" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="460" y="55" width="210" height="120" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="565" y="76" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Client-side grouping</text>
  <text x="480" y="98" font-size="9" fill="var(--dg-ink, #202124)">c1</text>
  <text x="495" y="112" font-size="9" fill="var(--dg-muted, #5F6368)">↳ c2 (reply)</text>
  <text x="480" y="132" font-size="9" fill="var(--dg-ink, #202124)">c3</text>
  <text x="495" y="146" font-size="9" fill="var(--dg-muted, #5F6368)">↳ c4 (reply)</text>
  <text x="565" y="164" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">nested for display</text>

  <text x="350" y="220" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Pagination runs on the flat, storage-native order.</text>
  <text x="350" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Parent/reply nesting is a presentation-layer step applied after the page is fetched —</text>
  <text x="350" y="260" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">keeping the two concerns separate is what lets a thread with thousands of replies still paginate cheaply.</text>
</svg>
