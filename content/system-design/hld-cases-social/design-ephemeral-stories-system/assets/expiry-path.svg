<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Expiry path — two mechanisms together</text>

  <text x="175" y="52" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Lazy deletion (on read)</text>
  <rect x="60" y="66" width="90" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="91" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Read request</text>

  <line x1="150" y1="87" x2="188" y2="87" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="190" y="66" width="100" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="87" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Check TTL</text>
  <text x="240" y="100" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">expired?</text>

  <line x1="290" y1="87" x2="308" y2="87" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <rect x="310" y="66" width="120" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="370" y="87" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Treated as gone</text>
  <text x="370" y="100" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">even if not yet reaped</text>

  <line x1="350" y1="130" x2="350" y2="160" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="175" y="185" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Background reaper (periodic)</text>
  <rect x="60" y="198" width="130" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="125" y="219" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Periodic sweep</text>
  <text x="125" y="232" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">off-peak windows</text>

  <line x1="190" y1="219" x2="228" y2="219" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="230" y="198" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="300" y="219" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Batch-delete rows</text>
  <text x="300" y="232" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">past TTL</text>

  <line x1="370" y1="219" x2="408" y2="219" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="410" y="198" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="480" y="219" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Underlying storage</text>
  <text x="480" y="232" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">bytes physically freed</text>

  <text x="350" y="278" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Lazy deletion guarantees correctness for reads the instant a story expires;</text>
  <text x="350" y="298" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">the reaper guarantees storage is eventually actually reclaimed.</text>
</svg>
