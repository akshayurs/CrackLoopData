<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Story ring fan-out to followers</text>

  <rect x="20" y="120" width="110" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="145" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Posted story</text>

  <line x1="130" y1="141" x2="168" y2="141" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="170" y="108" width="160" height="66" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="250" y="130" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Story ring service</text>
  <text x="250" y="146" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">"does this followee have</text>
  <text x="250" y="158" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">an unexpired story now?"</text>

  <line x1="330" y1="130" x2="368" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="330" y1="141" x2="368" y2="141" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="330" y1="152" x2="368" y2="182" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="370" y="80" width="150" height="34" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="445" y="101" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Follower A's story ring</text>

  <rect x="370" y="124" width="150" height="34" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="445" y="145" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Follower B's story ring</text>

  <rect x="370" y="168" width="150" height="34" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="445" y="189" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Follower C's story ring</text>

  <text x="600" y="97" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">most-recent-first</text>
  <text x="600" y="141" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">or unviewed-first</text>
  <text x="600" y="185" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">no ranking step</text>

  <text x="350" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Structurally like news-feed fan-out but simpler — no relevance ranking to decide order,</text>
  <text x="350" y="260" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">just which followees currently have an active story.</text>
</svg>
