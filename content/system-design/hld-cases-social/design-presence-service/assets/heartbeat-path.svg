<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Heartbeat path</text>

  <rect x="20" y="130" width="110" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="154" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Client</text>
  <text x="75" y="168" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">heartbeat / 30s</text>

  <line x1="130" y1="152" x2="168" y2="152" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="170" y="130" width="120" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="230" y="156" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Gateway server</text>

  <line x1="290" y1="152" x2="328" y2="152" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="330" y="118" width="150" height="68" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="405" y="142" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Presence store</text>
  <text x="405" y="158" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">in-memory, TTL</text>
  <text x="405" y="172" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">refreshed each beat</text>

  <line x1="480" y1="152" x2="518" y2="152" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <polygon points="520,110 610,152 520,194 430,152" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="520" y="148" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Transition</text>
  <text x="520" y="161" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">detected?</text>

  <line x1="520" y1="110" x2="520" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="530" y="90" text-anchor="start" font-size="10" fill="var(--dg-muted, #5F6368)">no — nothing else happens</text>

  <line x1="600" y1="160" x2="638" y2="230" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="620" y="200" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">yes</text>

  <rect x="540" y="234" width="130" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="605" y="258" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Watcher fan-out</text>

  <text x="350" y="312" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Heartbeats just refresh a TTL — fan-out only fires on an actual state transition.</text>
</svg>
