<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Pub-sub topology for status updates</text>

  <rect x="30" y="60" width="180" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="120" y="84" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Status-change publisher</text>

  <line x1="210" y1="80" x2="248" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="250" y="60" width="150" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="325" y="84" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Topic: user 42</text>

  <rect x="30" y="130" width="180" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="120" y="154" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Status-change publisher</text>

  <line x1="210" y1="150" x2="248" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="250" y="130" width="150" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="325" y="154" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Topic: user 88</text>

  <text x="325" y="118" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">one topic per user (or sharded set)</text>

  <line x1="400" y1="72" x2="438" y2="55" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="400" y1="80" x2="438" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="400" y1="140" x2="438" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="400" y1="148" x2="438" y2="165" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="440" y="35" width="130" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="57" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Watcher A</text>

  <rect x="440" y="75" width="130" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="97" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Watcher B</text>

  <rect x="440" y="112" width="130" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="134" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Watcher C</text>

  <rect x="440" y="150" width="130" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="172" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Watcher D</text>

  <text x="350" y="220" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Each watcher subscribes only to the specific users it cares about.</text>
  <text x="350" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">One event per transition fans out only to that user's current subscribers —</text>
  <text x="350" y="260" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">not one global stream every server has to filter.</text>
</svg>
