<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Appeal flow</text>

  <rect x="15" y="120" width="110" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="140" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">User disputes</text>
  <text x="70" y="153" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">takedown</text>

  <line x1="125" y1="141" x2="163" y2="141" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="165" y="120" width="130" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="230" y="141" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Appeal queue</text>
  <text x="230" y="153" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">separate from initial review</text>

  <line x1="295" y1="141" x2="333" y2="141" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="335" y="120" width="150" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="410" y="141" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Different reviewer</text>
  <text x="410" y="153" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">not the original decision-maker</text>

  <line x1="440" y1="162" x2="410" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="480" y1="162" x2="560" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="330" y="202" width="130" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="395" y="226" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Uphold removal</text>

  <rect x="500" y="202" width="130" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="565" y="226" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Restore content</text>

  <line x1="395" y1="242" x2="500" y2="270" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="565" y1="242" x2="510" y2="270" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <rect x="440" y="270" width="140" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="510" y="288" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">logged to feedback loop</text>

  <text x="200" y="270" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">A different reviewer avoids re-confirming</text>
  <text x="200" y="286" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">the original judgment.</text>
</svg>
