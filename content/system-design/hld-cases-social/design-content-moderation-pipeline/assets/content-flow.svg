<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Content flow</text>

  <rect x="15" y="130" width="90" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="155" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Content ingest</text>

  <line x1="105" y1="151" x2="140" y2="151" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="142" y="130" width="110" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="197" y="155" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Automated classifier</text>

  <line x1="223" y1="130" x2="185" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="252" y1="151" x2="290" y2="151" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="223" y1="172" x2="185" y2="235" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="140" y="30" width="120" height="34" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="200" y="52" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Auto-clear</text>

  <rect x="140" y="237" width="120" height="34" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="200" y="259" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Auto-remove</text>

  <rect x="290" y="130" width="120" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="350" y="150" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Priority queue</text>
  <text x="350" y="164" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">for human review</text>

  <line x1="410" y1="151" x2="448" y2="151" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="450" y="130" width="110" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="155" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Human reviewer</text>

  <line x1="560" y1="151" x2="598" y2="151" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="600" y="112" width="90" height="78" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="645" y="132" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Action</text>
  <text x="645" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">remove</text>
  <text x="645" y="163" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">warn / ban</text>
  <text x="645" y="176" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">restore</text>

  <text x="350" y="290" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">The priority queue decides which borderline items a limited reviewer pool reaches first.</text>
</svg>
