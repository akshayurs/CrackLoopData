<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">End-to-end architecture</text>

  <text x="120" y="52" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">Write path</text>
  <rect x="20" y="62" width="80" height="38" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="86" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">publish()</text>

  <line x1="100" y1="81" x2="128" y2="81" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="130" y="62" width="90" height="38" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="175" y="86" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Post store</text>

  <line x1="220" y1="81" x2="258" y2="81" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="260" y="62" width="110" height="38" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="315" y="86" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Fan-out queue</text>

  <line x1="370" y1="81" x2="408" y2="81" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="410" y="62" width="130" height="38" rx="7" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="475" y="86" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Per-user feed stores</text>
  <text x="475" y="112" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">skipped for celebrity accounts</text>

  <line x1="350" y1="130" x2="350" y2="160" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="20" y1="145" x2="680" y2="145" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="120" y="180" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">Read path</text>
  <rect x="20" y="190" width="90" height="38" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="65" y="214" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">getFeed()</text>

  <line x1="110" y1="209" x2="148" y2="209" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="150" y="190" width="140" height="38" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="220" y="209" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Read precomputed</text>
  <text x="220" y="221" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">feed store</text>

  <line x1="290" y1="209" x2="328" y2="209" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="330" y="190" width="150" height="38" rx="7" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="405" y="209" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Merge with live pull</text>
  <text x="405" y="221" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">vs celebrity followees</text>

  <line x1="480" y1="209" x2="518" y2="209" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="520" y="190" width="80" height="38" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="560" y="214" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Ranking</text>

  <text x="560" y="240" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">-&gt; paginated response</text>

  <text x="350" y="290" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">The queue keeps publish() fast; the celebrity skip avoids the write storm;</text>
  <text x="350" y="310" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">the merge step is what a hybrid needs at read time.</text>
</svg>
