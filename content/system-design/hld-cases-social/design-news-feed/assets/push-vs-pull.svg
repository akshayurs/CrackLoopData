<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Push vs pull fan-out</text>

  <text x="165" y="50" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Push (fan-out-on-write)</text>
  <rect x="70" y="64" width="90" height="36" rx="7" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="115" y="86" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">One post</text>

  <line x1="140" y1="100" x2="60" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="115" y1="100" x2="115" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="90" y1="100" x2="170" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="20" y="142" width="70" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="55" y="161" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Feed store A</text>
  <rect x="100" y="142" width="70" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="135" y="161" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Feed store B</text>
  <rect x="180" y="142" width="70" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="215" y="161" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Feed store C</text>

  <text x="140" y="195" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">fans out to each follower's</text>
  <text x="140" y="209" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">store at publish time</text>

  <line x1="350" y1="70" x2="350" y2="250" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="540" y="50" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Pull (fan-out-on-read)</text>
  <rect x="495" y="64" width="90" height="36" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="540" y="86" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Post table</text>
  <text x="540" y="112" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">sits untouched</text>

  <rect x="470" y="140" width="70" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="505" y="159" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Followee 1</text>
  <rect x="550" y="140" width="70" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="585" y="159" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Followee 2</text>

  <line x1="505" y1="170" x2="530" y2="210" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="585" y1="170" x2="560" y2="210" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="495" y="212" width="90" height="36" rx="7" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="540" y="232" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">getFeed merge</text>

  <text x="350" y="290" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Push pays once at write time, spread across small writes; pull redoes the merge on every single read.</text>
</svg>
