<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Connection topology</text>

  <rect x="50" y="42" width="90" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="64" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Client A</text>
  <rect x="305" y="42" width="90" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="350" y="64" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Client B</text>
  <rect x="560" y="42" width="90" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="605" y="64" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Client C</text>

  <line x1="95" y1="78" x2="330" y2="112" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="350" y1="78" x2="350" y2="112" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="605" y1="78" x2="370" y2="112" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="230" y="112" width="240" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="350" y="136" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Load balancer (connection-aware)</text>

  <line x1="300" y1="152" x2="200" y2="192" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="400" y1="152" x2="500" y2="192" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="110" y="192" width="180" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="200" y="216" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Gateway server 1</text>
  <rect x="410" y="192" width="180" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="216" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Gateway server 2</text>
  <text x="350" y="252" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">(stateless — either can serve any client)</text>

  <line x1="170" y1="232" x2="130" y2="290" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="230" y1="232" x2="400" y2="290" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="470" y1="232" x2="300" y2="290" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="530" y1="232" x2="560" y2="290" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="60" y="290" width="180" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="312" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Message store</text>
  <text x="150" y="328" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">shared, read + write</text>

  <rect x="290" y="290" width="300" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="440" y="312" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Connection registry</text>
  <text x="440" y="328" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">userId -&gt; current gateway server</text>

  <text x="350" y="372" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Any gateway reaches any user by looking the registry up first.</text>
</svg>
