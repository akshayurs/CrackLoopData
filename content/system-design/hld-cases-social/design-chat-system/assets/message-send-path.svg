<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Message send path</text>

  <rect x="20" y="120" width="110" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="146" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Sender's client</text>

  <line x1="130" y1="141" x2="168" y2="141" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="170" y="120" width="120" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="230" y="146" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Sender's gateway</text>

  <line x1="290" y1="141" x2="328" y2="141" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="330" y="106" width="140" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="400" y="132" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Message store</text>
  <text x="400" y="148" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">sequence number</text>
  <text x="400" y="162" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">assigned + persisted</text>

  <line x1="470" y1="141" x2="508" y2="141" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="510" y="106" width="160" height="70" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="590" y="132" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Connection registry</text>
  <text x="590" y="148" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">lookup per recipient</text>
  <text x="590" y="162" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">userId -&gt; gateway</text>

  <line x1="560" y1="176" x2="440" y2="238" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="620" y1="176" x2="640" y2="238" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="340" y="238" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="410" y="264" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Recipient gateway 1</text>
  <rect x="560" y="238" width="120" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="620" y="264" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Recipient gateway 2</text>

  <line x1="410" y1="280" x2="410" y2="308" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="620" y1="280" x2="620" y2="308" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="410" y="322" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">push to open connection</text>
  <text x="620" y="322" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">push to open connection</text>

  <text x="350" y="348" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Recipient gateways rarely match the sender's — every send involves at least one inter-server hop.</text>
</svg>
