<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Stacked abstractions</text>

  <rect x="170" y="46" width="300" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="74" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">App: user.save()</text>

  <line x1="320" y1="92" x2="320" y2="118" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="170" y="118" width="300" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="146" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">ORM: generates SQL</text>

  <line x1="320" y1="164" x2="320" y2="190" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="170" y="190" width="300" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="218" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">DB engine: query plan + B-tree</text>

  <line x1="320" y1="236" x2="320" y2="262" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="170" y="262" width="300" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="290" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Disk: pages, fsync</text>

  <text x="320" y="326" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each layer hides the one below it from the layer above.</text>
</svg>
