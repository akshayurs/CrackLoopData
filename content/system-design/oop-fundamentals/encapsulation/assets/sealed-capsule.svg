<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Encapsulation: sealed capsule</text>

  <rect x="180" y="55" width="280" height="180" rx="90" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="82" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">private state (hidden)</text>

  <circle cx="280" cy="130" r="26" fill="none" stroke="var(--dg-muted, #5F6368)" stroke-width="1.5"/>
  <text x="280" y="134" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">balance</text>
  <circle cx="360" cy="130" r="26" fill="none" stroke="var(--dg-muted, #5F6368)" stroke-width="1.5"/>
  <text x="360" y="134" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">accountId</text>

  <rect x="230" y="185" width="180" height="30" rx="6" fill="none" stroke="var(--dg-muted, #5F6368)" stroke-dasharray="4 3"/>
  <text x="320" y="204" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">internals, no direct access</text>

  <rect x="150" y="255" width="120" height="34" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="210" y="277" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">deposit()</text>

  <rect x="270" y="255" width="120" height="34" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="330" y="277" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">withdraw()</text>

  <rect x="390" y="255" width="120" height="34" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="450" y="277" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">getBalance()</text>

  <line x1="60" y1="272" x2="145" y2="272" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="30" y="277" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">caller</text>

  <text x="320" y="322" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Callers only ever touch the ports on the surface, never the state inside.</text>
</svg>
