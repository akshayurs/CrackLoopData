<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Same call, different vtable</text>

  <rect x="30" y="46" width="130" height="38" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="95" y="70" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Shape shape</text>

  <line x1="160" y1="65" x2="230" y2="65" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="230" y="46" width="120" height="38" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="290" y="70" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Circle obj</text>

  <line x1="290" y1="84" x2="290" y2="118" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="330" y="105" font-size="9" fill="var(--dg-muted, #5F6368)">vtable ptr</text>

  <rect x="200" y="118" width="180" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="290" y="138" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Circle vtable</text>
  <text x="290" y="154" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">area -&gt; Circle.area code</text>

  <rect x="430" y="60" width="120" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" opacity="0.6"/>
  <text x="490" y="81" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Square obj</text>

  <line x1="490" y1="94" x2="490" y2="196" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" opacity="0.6" marker-end="url(#arrow)"/>

  <rect x="400" y="196" width="180" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" opacity="0.6"/>
  <text x="490" y="216" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Square vtable</text>
  <text x="490" y="232" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">area -&gt; Square.area code</text>

  <text x="320" y="278" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">shape.area() follows whichever vtable the object actually holds.</text>
</svg>
