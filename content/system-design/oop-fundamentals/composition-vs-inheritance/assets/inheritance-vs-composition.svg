<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="160" y="26" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Inheritance</text>
  <text x="480" y="26" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Composition</text>
  <line x1="320" y1="10" x2="320" y2="300" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>

  <rect x="70" y="60" width="180" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="84" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Car extends Engine</text>
  <text x="160" y="102" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">start() baked in</text>

  <circle cx="150" cy="150" r="14" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="150" y="155" text-anchor="middle" font-size="14" fill="var(--dg-accent, #0C8F88)">?</text>
  <text x="150" y="180" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Car isn't really</text>
  <text x="150" y="192" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">a kind of Engine</text>

  <text x="160" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Swapping engines needs a new</text>
  <text x="160" y="256" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">subclass, fixed at compile time</text>

  <rect x="400" y="60" width="120" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="460" y="88" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Car</text>

  <line x1="460" y1="106" x2="460" y2="134" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="480" y="122" font-size="10" fill="var(--dg-muted, #5F6368)">has-a</text>

  <rect x="400" y="134" width="120" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="460" y="162" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Engine</text>

  <text x="460" y="210" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Car.start() calls engine.start()</text>
  <text x="460" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">swap Engine implementation</text>
  <text x="460" y="256" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">freely, at runtime</text>
</svg>
