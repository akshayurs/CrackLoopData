<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="160" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Reference copy (Car a = b)</text>
  <text x="480" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Value copy (int x = y)</text>
  <line x1="320" y1="10" x2="320" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>

  <rect x="60" y="50" width="60" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">a</text>
  <rect x="200" y="50" width="60" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="230" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">b</text>

  <line x1="90" y1="84" x2="155" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="230" y1="84" x2="165" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="105" y="150" width="110" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="160" y="175" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Car object</text>
  <text x="160" y="192" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">one instance, heap</text>

  <text x="160" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">mutating through a is visible</text>
  <text x="160" y="256" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">through b — same object</text>

  <rect x="420" y="150" width="80" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="460" y="172" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">int x</text>
  <text x="460" y="188" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">5</text>

  <rect x="520" y="150" width="80" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="560" y="172" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">int y</text>
  <text x="560" y="188" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">5</text>

  <text x="480" y="230" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">two independent copies —</text>
  <text x="480" y="246" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">nothing shared to mutate</text>
</svg>
