<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The diamond problem</text>

  <rect x="250" y="46" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="72" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Animal</text>

  <line x1="180" y1="140" x2="290" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="460" y1="140" x2="350" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="110" y="140" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="180" y="166" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">FlyingAnimal</text>

  <rect x="390" y="140" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="460" y="166" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">SwimmingAnimal</text>

  <line x1="220" y1="234" x2="200" y2="184" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <line x1="420" y1="234" x2="440" y2="184" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <rect x="250" y="234" width="140" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="260" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Duck</text>

  <circle cx="320" cy="190" r="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="195" text-anchor="middle" font-size="13" fill="var(--dg-accent, #0C8F88)" font-weight="600">?</text>

  <text x="320" y="300" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">one shared Animal, or two duplicated copies?</text>
</svg>
