<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Method resolution walks up the hierarchy</text>

  <rect x="250" y="46" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="72" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Vehicle</text>

  <line x1="320" y1="88" x2="320" y2="126" stroke="var(--dg-line, #5F6368)"/>

  <rect x="250" y="126" width="140" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="150" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Car</text>
  <text x="320" y="163" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">overrides stop()</text>

  <line x1="320" y1="168" x2="320" y2="206" stroke="var(--dg-line, #5F6368)"/>

  <rect x="250" y="206" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="230" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">SportsCar</text>
  <text x="320" y="243" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">no override</text>

  <path d="M430,227 C 500,227 500,150 400,148" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-accent)"/>
  <text x="500" y="190" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">sportsCarInstance.stop()</text>
  <text x="500" y="204" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">resolves at Car.stop()</text>

  <text x="320" y="292" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Search starts at the object's real class and stops at the first override found.</text>
</svg>
