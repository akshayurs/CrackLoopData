<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">One extends, many implements</text>

  <rect x="250" y="120" width="140" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="320" y="148" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Circle</text>

  <line x1="320" y1="120" x2="320" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="345" y="102" font-size="10" fill="var(--dg-muted, #5F6368)">extends</text>

  <rect x="220" y="46" width="200" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="67" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">AbstractShape</text>
  <text x="320" y="98" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">toString() shared, area() abstract</text>

  <line x1="390" y1="140" x2="480" y2="120" stroke="var(--dg-line, #5F6368)" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="470" y="108" font-size="10" fill="var(--dg-muted, #5F6368)">implements</text>

  <rect x="460" y="122" width="150" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="535" y="143" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Comparable&lt;Circle&gt;</text>

  <text x="320" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Exactly one extends relationship (solid line, shared implementation),</text>
  <text x="320" y="238" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">but as many implements relationships (dashed, contracts only) as needed.</text>
</svg>
