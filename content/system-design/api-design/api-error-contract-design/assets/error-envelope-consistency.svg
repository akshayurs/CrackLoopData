<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Same envelope, three different statuses</text>

  <g>
    <rect x="20" y="50" width="180" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="110" y="67" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">400 Bad Request</text>
  </g>
  <g>
    <rect x="230" y="50" width="180" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="320" y="67" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">404 Not Found</text>
  </g>
  <g>
    <rect x="440" y="50" width="180" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="530" y="67" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">429 Too Many Requests</text>
  </g>

  <line x1="110" y1="76" x2="110" y2="100" stroke="var(--dg-line, #5F6368)"/>
  <line x1="320" y1="76" x2="320" y2="100" stroke="var(--dg-line, #5F6368)"/>
  <line x1="530" y1="76" x2="530" y2="100" stroke="var(--dg-line, #5F6368)"/>

  <g font-size="11" fill="var(--dg-ink, #202124)">
    <rect x="20" y="100" width="180" height="150" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="110" y="120" text-anchor="middle" font-weight="600">error</text>
    <text x="35" y="140">code:</text>
    <text x="35" y="156" fill="var(--dg-muted, #5F6368)">"invalid_field"</text>
    <text x="35" y="178">message:</text>
    <text x="35" y="194" fill="var(--dg-muted, #5F6368)">"email invalid"</text>
    <text x="35" y="216">details: {...}</text>

    <rect x="230" y="100" width="180" height="150" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="320" y="120" text-anchor="middle" font-weight="600">error</text>
    <text x="245" y="140">code:</text>
    <text x="245" y="156" fill="var(--dg-muted, #5F6368)">"not_found"</text>
    <text x="245" y="178">message:</text>
    <text x="245" y="194" fill="var(--dg-muted, #5F6368)">"order missing"</text>
    <text x="245" y="216">details: {...}</text>

    <rect x="440" y="100" width="180" height="150" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="530" y="120" text-anchor="middle" font-weight="600">error</text>
    <text x="455" y="140">code:</text>
    <text x="455" y="156" fill="var(--dg-muted, #5F6368)">"rate_limited"</text>
    <text x="455" y="178">message:</text>
    <text x="455" y="194" fill="var(--dg-muted, #5F6368)">"slow down"</text>
    <text x="455" y="216">details: {...}</text>
  </g>

  <text x="320" y="278" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Same shape every time — only code, message, and details content change.</text>
</svg>
