<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">HTTP/2 (gRPC)</text>

  <rect x="30" y="40" width="80" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="62" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Client</text>

  <rect x="530" y="40" width="80" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="570" y="62" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Server</text>

  <rect x="120" y="30" width="400" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <line x1="140" y1="44" x2="500" y2="44" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="320" y="40" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">one TCP connection</text>
  <line x1="140" y1="60" x2="500" y2="60" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="320" y="76" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">stream 1, stream 2, stream 3 — concurrent, no blocking</text>

  <text x="320" y="130" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">HTTP/1.1</text>

  <rect x="30" y="150" width="80" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="169" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Client</text>
  <rect x="530" y="150" width="80" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="570" y="169" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Server</text>
  <line x1="120" y1="158" x2="520" y2="158" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="320" y="152" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">connection A — call 1</text>

  <rect x="30" y="195" width="80" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="214" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Client</text>
  <rect x="530" y="195" width="80" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="570" y="214" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Server</text>
  <line x1="120" y1="203" x2="520" y2="203" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="320" y="197" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">connection B — call 2</text>

  <rect x="30" y="240" width="80" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="259" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Client</text>
  <rect x="530" y="240" width="80" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="570" y="259" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Server</text>
  <line x1="120" y1="248" x2="520" y2="248" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="320" y="242" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">connection C — call 3</text>
</svg>
