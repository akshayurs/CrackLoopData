<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="30" y="20" width="90" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="45" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Clients</text>

  <line x1="120" y1="40" x2="200" y2="40" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="200" y="15" width="200" height="55" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="300" y="37" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">API Gateway</text>
  <text x="300" y="55" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">auth + rate limit + route</text>

  <g stroke="var(--dg-line, #5F6368)" fill="none">
    <path d="M260,70 C230,120 130,150 90,180" marker-end="url(#arrow)"/>
    <path d="M290,70 C280,120 240,150 220,180" marker-end="url(#arrow)"/>
    <path d="M300,70 L300,180" marker-end="url(#arrow)"/>
    <path d="M310,70 C360,120 400,150 400,180" marker-end="url(#arrow)"/>
    <path d="M340,70 C400,120 470,150 510,180" marker-end="url(#arrow)"/>
  </g>

  <g font-size="11" fill="var(--dg-ink, #202124)">
    <rect x="30" y="180" width="110" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="85" y="204" text-anchor="middle">Users</text>

    <rect x="165" y="180" width="110" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="220" y="204" text-anchor="middle">Orders</text>

    <rect x="245" y="180" width="110" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" transform="translate(90,0)"/>
    <text x="400" y="204" text-anchor="middle">Inventory</text>

    <rect x="455" y="180" width="110" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="510" y="204" text-anchor="middle">Payments</text>
  </g>

  <rect x="245" y="230" width="150" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="254" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Notifications</text>
  <line x1="300" y1="70" x2="320" y2="230" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="320" y="292" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Every service only sees traffic already vetted by the gateway.</text>
</svg>
