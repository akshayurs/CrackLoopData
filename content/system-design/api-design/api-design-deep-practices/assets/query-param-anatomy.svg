<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="40" width="600" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="35" y="62" font-size="13" font-family="monospace" fill="var(--dg-ink, #202124)">GET /orders?status=active&amp;sort=-created_at&amp;fields=id,total</text>

  <line x1="80" y1="74" x2="80" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="20" y="100" width="120" height="44" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="80" y="118" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">/orders</text>
  <text x="80" y="134" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">resource</text>

  <line x1="240" y1="74" x2="240" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="170" y="100" width="140" height="44" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="240" y="118" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">status=active</text>
  <text x="240" y="134" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">filter</text>

  <line x1="380" y1="74" x2="380" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="320" y="100" width="140" height="44" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="390" y="118" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">sort=-created_at</text>
  <text x="390" y="134" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">sort</text>

  <line x1="560" y1="74" x2="560" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="480" y="100" width="140" height="44" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="550" y="118" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">fields=id,total</text>
  <text x="550" y="134" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">field selection</text>

  <text x="320" y="200" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Three independent, additive concerns — none changes which resource is addressed.</text>
</svg>
