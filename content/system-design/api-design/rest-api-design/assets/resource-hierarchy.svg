<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="30" width="140" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="90" y="52" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">/customers</text>
  <text x="90" y="66" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">collection</text>

  <line x1="160" y1="51" x2="220" y2="51" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="220" y="30" width="160" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="300" y="52" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">/customers/42</text>
  <text x="300" y="66" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">item</text>

  <line x1="380" y1="51" x2="440" y2="51" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="440" y="30" width="180" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="530" y="52" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">/customers/42/orders</text>
  <text x="530" y="66" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">nested collection</text>

  <line x1="530" y1="72" x2="530" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="420" y="110" width="220" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="132" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">/customers/42/orders/7</text>
  <text x="530" y="146" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">item</text>

  <text x="320" y="200" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The pattern repeats: collection, item, nested collection, item.</text>
</svg>
