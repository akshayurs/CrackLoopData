<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="30" y="30" width="120" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="58" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">v1 app</text>

  <rect x="30" y="190" width="120" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="218" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">v2 app</text>

  <rect x="250" y="110" width="140" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="138" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">API gateway</text>

  <line x1="150" y1="53" x2="250" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="180" y="80" font-size="10" fill="var(--dg-muted, #5F6368)">/v1/orders</text>

  <line x1="150" y1="213" x2="250" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="180" y="195" font-size="10" fill="var(--dg-muted, #5F6368)">/v2/orders</text>

  <rect x="470" y="30" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="540" y="58" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Backend: v1 shape</text>

  <rect x="470" y="190" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="540" y="218" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Backend: v2 shape</text>

  <line x1="390" y1="120" x2="470" y2="53" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="390" y1="150" x2="470" y2="213" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="320" y="258" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Both contracts run simultaneously on the same infrastructure.</text>
</svg>
