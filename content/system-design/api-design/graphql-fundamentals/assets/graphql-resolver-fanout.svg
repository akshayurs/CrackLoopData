<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="30" y="20" width="100" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="45" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Client</text>

  <line x1="130" y1="40" x2="220" y2="40" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="175" y="30" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">one query</text>

  <rect x="220" y="15" width="200" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="45" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">GraphQL server</text>

  <g stroke="var(--dg-line, #5F6368)" fill="none">
    <path d="M270,65 C220,110 150,140 110,160" marker-end="url(#arrow)"/>
    <path d="M320,65 L320,160" marker-end="url(#arrow)"/>
    <path d="M370,65 C420,110 490,140 530,160" marker-end="url(#arrow)"/>
  </g>

  <rect x="30" y="160" width="160" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="185" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Users service</text>

  <rect x="240" y="160" width="160" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="185" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Orders service</text>

  <rect x="450" y="160" width="160" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="185" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Inventory service</text>

  <g stroke="var(--dg-line, #5F6368)" fill="none" stroke-dasharray="4 3">
    <path d="M110,202 C160,230 260,240 300,220" marker-end="url(#arrow)"/>
    <path d="M320,202 L320,220" marker-end="url(#arrow)"/>
    <path d="M530,202 C480,230 380,240 340,220" marker-end="url(#arrow)"/>
  </g>

  <rect x="250" y="222" width="140" height="34" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="244" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">merged JSON</text>
</svg>
