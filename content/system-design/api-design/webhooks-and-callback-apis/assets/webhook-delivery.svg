<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="90" width="110" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="112" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">order.shipped</text>
  <text x="75" y="128" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">internal event</text>

  <line x1="130" y1="115" x2="180" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="180" y="90" width="130" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="245" y="112" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Delivery worker</text>
  <text x="245" y="128" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">signs payload</text>

  <line x1="310" y1="115" x2="400" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="355" y="106" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">POST + signature</text>

  <rect x="400" y="90" width="130" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="465" y="112" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Merchant server</text>
  <text x="465" y="128" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">registered URL</text>

  <path d="M530,150 C500,180 430,180 400,150" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="465" y="196" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">200 OK</text>

  <rect x="180" y="20" width="260" height="34" rx="8" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="310" y="41" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">payload + X-Signature header</text>

  <text x="320" y="235" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Provider reaches out; the consumer never asked for this specific call.</text>
</svg>
