<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="20" y="24" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Offset pagination</text>
  <line x1="20" y1="40" x2="600" y2="40" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="40" y="50" width="140" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="71" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">page 1: offset 0-20</text>

  <rect x="250" y="50" width="60" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="280" y="71" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">insert</text>

  <rect x="380" y="50" width="140" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="450" y="71" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">page 2: offset 20-40</text>
  <text x="450" y="102" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">row 20 shown twice</text>

  <text x="20" y="150" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Cursor pagination</text>
  <line x1="20" y1="166" x2="600" y2="166" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="40" y="176" width="140" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="197" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">page 1: after id 20</text>

  <rect x="250" y="176" width="60" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="280" y="197" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">insert</text>

  <rect x="380" y="176" width="140" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="450" y="197" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">page 2: after id 42</text>
  <text x="450" y="228" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">no duplicate</text>

  <text x="320" y="262" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The cursor anchors to a row, not a shifting position.</text>
</svg>
