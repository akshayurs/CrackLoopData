<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">GET: two independent hops</text>

  <rect x="30" y="130" width="140" height="54" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="100" y="161" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Client</text>

  <rect x="270" y="40" width="190" height="54" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="365" y="62" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Metadata service</text>
  <text x="365" y="78" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">key -&gt; shard locations</text>

  <rect x="220" y="240" width="110" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="275" y="267" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Storage node A</text>
  <rect x="350" y="240" width="110" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="405" y="267" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Storage node B</text>
  <rect x="480" y="240" width="110" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="535" y="267" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Storage node C</text>

  <line x1="150" y1="128" x2="278" y2="92" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="102" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">1. resolve(key)</text>

  <line x1="330" y1="96" x2="165" y2="145" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="285" y="135" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">node locations</text>

  <line x1="90" y1="184" x2="255" y2="238" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="100" y1="184" x2="400" y2="238" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="110" y1="184" x2="530" y2="238" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="210" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">2. fetch shards directly</text>

  <text x="350" y="320" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Metadata resolves *where*; a separate fetch retrieves *what* — client reassembles.</text>
</svg>
