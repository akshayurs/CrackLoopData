<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Erasure coding: 6 data + 3 parity shards</text>

  <rect x="280" y="36" width="140" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="350" y="61" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Object</text>

  <line x1="350" y1="76" x2="350" y2="108" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g font-size="11">
    <rect x="48" y="112" width="60" height="44" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="78" y="139" text-anchor="middle" fill="var(--dg-ink, #202124)">D1</text>
    <rect x="116" y="112" width="60" height="44" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="146" y="139" text-anchor="middle" fill="var(--dg-ink, #202124)">D2</text>
    <rect x="184" y="112" width="60" height="44" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="214" y="139" text-anchor="middle" fill="var(--dg-ink, #202124)">D3</text>
    <rect x="252" y="112" width="60" height="44" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="282" y="139" text-anchor="middle" fill="var(--dg-ink, #202124)">D4</text>
    <rect x="320" y="112" width="60" height="44" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="350" y="139" text-anchor="middle" fill="var(--dg-ink, #202124)">D5</text>
    <rect x="388" y="112" width="60" height="44" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="418" y="139" text-anchor="middle" fill="var(--dg-ink, #202124)">D6</text>

    <rect x="456" y="112" width="60" height="44" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="486" y="139" text-anchor="middle" fill="var(--dg-ink, #202124)">P1</text>
    <rect x="524" y="112" width="60" height="44" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="554" y="139" text-anchor="middle" fill="var(--dg-ink, #202124)">P2</text>
    <rect x="592" y="112" width="60" height="44" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="622" y="139" text-anchor="middle" fill="var(--dg-ink, #202124)">P3</text>
  </g>

  <text x="350" y="178" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">9 shards, each on a different storage node</text>

  <rect x="150" y="200" width="400" height="56" rx="8" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="350" y="224" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Any 6 of the 9 shards</text>
  <text x="350" y="242" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">fully reconstruct the original object</text>

  <text x="350" y="284" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Data shards (D) plus parity shards (P) — parity is computed from the data.</text>
</svg>
