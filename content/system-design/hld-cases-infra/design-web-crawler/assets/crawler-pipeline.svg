<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Crawler pipeline</text>

  <rect x="40" y="70" width="140" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="110" y="99" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Frontier queue</text>

  <rect x="280" y="70" width="160" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="360" y="93" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Fetcher workers</text>
  <text x="360" y="109" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">(pool)</text>

  <rect x="280" y="170" width="160" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="360" y="199" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Parser</text>

  <rect x="500" y="170" width="160" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="580" y="193" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Dedup store</text>
  <text x="580" y="209" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">(Bloom filter)</text>

  <rect x="280" y="280" width="160" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="360" y="309" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Storage</text>

  <line x1="180" y1="95" x2="278" y2="95" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="120" x2="360" y2="168" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="188" x2="498" y2="188" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="469" y="181" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">links</text>
  <line x1="360" y1="220" x2="360" y2="278" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="252" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">content</text>

  <polyline points="580,170 580,45 110,45 110,68" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="345" y="38" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">survivors re-enter frontier</text>

  <text x="350" y="352" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The pipeline is circular — fetch, parse, dedup, and requeue never stop.</text>
</svg>
