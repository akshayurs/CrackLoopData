<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Stateless gateway cluster</text>

  <rect x="280" y="34" width="140" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="350" y="59" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Clients</text>

  <rect x="280" y="106" width="140" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="350" y="132" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Load balancer</text>

  <line x1="350" y1="74" x2="350" y2="104" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="210" width="170" height="66" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="145" y="234" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Gateway instance A</text>
  <text x="145" y="250" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">routing + policy config</text>
  <text x="145" y="263" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">(identical copy)</text>

  <rect x="265" y="210" width="170" height="66" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="350" y="234" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Gateway instance B</text>
  <text x="350" y="250" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">routing + policy config</text>
  <text x="350" y="263" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">(identical copy)</text>

  <rect x="470" y="210" width="170" height="66" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="555" y="234" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Gateway instance C</text>
  <text x="555" y="250" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">routing + policy config</text>
  <text x="555" y="263" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">(identical copy)</text>

  <line x1="320" y1="150" x2="160" y2="208" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="150" x2="350" y2="208" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="150" x2="545" y2="208" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="350" y="292" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Any instance can handle any request — losing or adding one is routine capacity, not a special case.</text>
</svg>
