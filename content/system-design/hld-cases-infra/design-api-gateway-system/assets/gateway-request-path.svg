<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Request path through the gateway</text>

  <rect x="10" y="90" width="80" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="50" y="119" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Client</text>

  <rect x="112" y="90" width="90" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="157" y="112" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">TLS</text>
  <text x="157" y="126" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">termination</text>

  <rect x="224" y="90" width="90" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="269" y="119" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Auth</text>

  <rect x="336" y="90" width="100" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="386" y="112" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Rate</text>
  <text x="386" y="126" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">limiting</text>

  <rect x="458" y="90" width="100" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="508" y="112" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Routing</text>
  <text x="508" y="126" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">lookup</text>

  <rect x="590" y="90" width="100" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="640" y="112" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Backend</text>
  <text x="640" y="126" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">service</text>

  <line x1="92" y1="115" x2="110" y2="115" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="204" y1="115" x2="222" y2="115" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="316" y1="115" x2="334" y2="115" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="438" y1="115" x2="456" y2="115" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="115" x2="588" y2="115" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M 640 142 L 640 190 L 50 190 L 50 142" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="345" y="204" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">response flows back through the gateway to the client</text>

  <text x="350" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Any stage can reject and short-circuit — an unauthenticated request never reaches the backend.</text>
</svg>
