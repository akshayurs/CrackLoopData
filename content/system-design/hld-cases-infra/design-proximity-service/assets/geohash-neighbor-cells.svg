<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="250" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Query cell plus its 8 neighbors</text>

  <g stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" fill="var(--dg-accent-bg, #E3F3F1)">
    <rect x="70" y="60" width="118" height="118"/>
    <rect x="190" y="60" width="118" height="118"/>
    <rect x="310" y="60" width="118" height="118"/>
    <rect x="70" y="180" width="118" height="118"/>
    <rect x="190" y="180" width="118" height="118" stroke-width="2.5"/>
    <rect x="310" y="180" width="118" height="118"/>
    <rect x="70" y="300" width="118" height="118"/>
    <rect x="190" y="300" width="118" height="118"/>
    <rect x="310" y="300" width="118" height="118"/>
  </g>

  <circle cx="249" cy="239" r="6" fill="var(--dg-ink, #202124)"/>
  <line x1="249" y1="239" x2="249" y2="200" stroke="var(--dg-line, #5F6368)" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="249" y="196" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">query point</text>

  <line x1="360" y1="120" x2="420" y2="70" stroke="var(--dg-line, #5F6368)" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="440" y="60" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">neighbor</text>
  <text x="440" y="73" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">cell</text>

  <text x="250" y="378" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A point just across a boundary is only caught by including all 8 neighbor cells.</text>
</svg>
