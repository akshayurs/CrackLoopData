<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Write path and read path share one index</text>

  <rect x="30" y="50" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="78" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Driver apps</text>

  <rect x="240" y="50" width="180" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="330" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Write path</text>
  <text x="330" y="88" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">throttle / batch</text>

  <rect x="470" y="128" width="200" height="84" rx="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="570" y="160" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Sharded geohash</text>
  <text x="570" y="176" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">index</text>
  <text x="570" y="196" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">in-memory</text>

  <rect x="30" y="238" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="266" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Rider app</text>

  <rect x="240" y="234" width="180" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="330" y="256" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Read path</text>
  <text x="330" y="272" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">lookup cell + neighbors</text>

  <line x1="182" y1="73" x2="238" y2="73" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="65" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">updateLocation</text>

  <line x1="420" y1="80" x2="468" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="450" y="110" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">writes</text>

  <line x1="182" y1="261" x2="238" y2="261" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="253" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">findNearby</text>

  <line x1="420" y1="255" x2="468" y2="196" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="450" y="235" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">lookup</text>

  <line x1="240" y1="270" x2="182" y2="270" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="210" y="286" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">driver IDs</text>

  <text x="350" y="316" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Writes are constant, high-volume, single-object; reads are bursty and region-scoped.</text>
</svg>
