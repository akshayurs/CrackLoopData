<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Hash-based bucketing for a percentage rollout</text>

  <rect x="270" y="40" width="220" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="380" y="68" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">hash(userId + flagKey)</text>

  <line x1="380" y1="86" x2="380" y2="118" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="120" width="180" height="50" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <rect x="220" y="120" width="420" height="50" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="130" y="150" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">in (0-29)</text>
  <text x="430" y="150" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">out (30-99)</text>

  <line x1="220" y1="110" x2="220" y2="180" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="220" y="102" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">cutoff = 30</text>

  <text x="40" y="188" font-size="9" fill="var(--dg-muted, #5F6368)">0</text>
  <text x="640" y="188" text-anchor="end" font-size="9" fill="var(--dg-muted, #5F6368)">99</text>

  <circle cx="130" cy="145" r="5" fill="var(--dg-ink, #202124)"/>
  <line x1="130" y1="145" x2="130" y2="210" stroke="var(--dg-line, #5F6368)" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="130" y="224" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">user X -&gt; bucket 12</text>

  <text x="350" y="248" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Same input always lands in the same bucket — a user never flickers between in and out.</text>
</svg>
