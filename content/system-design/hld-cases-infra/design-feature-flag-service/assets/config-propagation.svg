<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Config propagation to SDKs</text>

  <rect x="270" y="40" width="160" height="54" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="350" y="62" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Control plane</text>
  <text x="350" y="78" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">source-of-truth config</text>

  <rect x="20" y="180" width="140" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="205" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">SDK instance</text>
  <text x="90" y="222" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">local cache</text>

  <rect x="187" y="180" width="140" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="257" y="205" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">SDK instance</text>
  <text x="257" y="222" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">local cache</text>

  <rect x="354" y="180" width="140" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="424" y="205" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">SDK instance</text>
  <text x="424" y="222" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">local cache</text>

  <rect x="521" y="180" width="140" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="591" y="205" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">SDK instance</text>
  <text x="591" y="222" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">local cache</text>

  <line x1="290" y1="94" x2="105" y2="178" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="94" x2="270" y2="178" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="94" x2="430" y2="178" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="94" x2="585" y2="178" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="140" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">stream (~1s) or poll (~10s)</text>

  <text x="350" y="278" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each SDK updates its own in-memory cache on receipt — no shared state between instances.</text>
</svg>
