<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Hot and cold storage tiers</text>

  <rect x="270" y="36" width="160" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="350" y="61" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Query (time range)</text>

  <line x1="310" y1="76" x2="200" y2="118" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="76" x2="500" y2="118" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="70" y="120" width="240" height="130" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="190" y="148" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Hot tier</text>
  <text x="190" y="170" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">last few days</text>
  <text x="190" y="186" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">full resolution</text>
  <text x="190" y="202" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">fast disks</text>

  <rect x="390" y="120" width="240" height="130" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="510" y="148" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Cold tier</text>
  <text x="510" y="170" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">older data</text>
  <text x="510" y="186" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">downsampled</text>
  <text x="510" y="202" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">cheap storage</text>

  <text x="350" y="278" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A query spanning both ranges reads from each tier and stitches the results into one.</text>
</svg>
