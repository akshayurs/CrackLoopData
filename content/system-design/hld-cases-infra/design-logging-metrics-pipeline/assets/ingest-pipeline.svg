<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Ingest pipeline end to end</text>

  <rect x="30" y="42" width="150" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="66" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Host A agent</text>
  <rect x="30" y="94" width="150" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="118" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Host B agent</text>
  <rect x="30" y="146" width="150" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="170" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Host C agent</text>

  <rect x="270" y="94" width="170" height="54" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="355" y="117" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Ingest buffer</text>
  <text x="355" y="133" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">(message queue)</text>

  <line x1="180" y1="62" x2="268" y2="105" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="114" x2="268" y2="118" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="166" x2="268" y2="132" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="270" y="200" width="170" height="54" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="355" y="223" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Stream processor</text>
  <text x="355" y="239" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">sample / aggregate / route</text>

  <line x1="355" y1="148" x2="355" y2="198" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="500" y="170" width="160" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="580" y="192" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Hot store</text>
  <text x="580" y="207" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">recent, full resolution</text>

  <rect x="500" y="234" width="160" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="580" y="256" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Cold store</text>
  <text x="580" y="271" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">older, downsampled</text>

  <line x1="440" y1="215" x2="498" y2="195" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="240" x2="498" y2="255" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="350" y="300" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The ingest buffer decouples emit rate from processing rate — a slowdown just backs up the queue.</text>
</svg>
