<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Offline refresh + real-time trending fast-path</text>

  <rect x="30" y="55" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="83" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Query logs</text>

  <rect x="230" y="55" width="180" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="76" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Offline aggregation</text>
  <text x="320" y="91" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">(hourly cycle)</text>

  <rect x="470" y="55" width="180" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="560" y="76" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">New trie snapshot</text>
  <text x="560" y="91" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">top-K per prefix</text>

  <rect x="470" y="200" width="180" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="560" y="230" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Serving fleet</text>

  <rect x="230" y="200" width="180" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="320" y="221" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Trending counter</text>
  <text x="320" y="236" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">(near real-time)</text>

  <line x1="170" y1="78" x2="228" y2="78" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="78" x2="468" y2="78" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="101" x2="560" y2="198" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="592" y="155" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">swap</text>

  <line x1="410" y1="225" x2="468" y2="225" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="440" y="217" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">boosts</text>

  <text x="350" y="278" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The trie is a periodic snapshot; only the trending counter updates in real time.</text>
</svg>
