<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Trie: precomputed top-K per node</text>

  <rect x="290" y="40" width="70" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="325" y="66" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">root</text>

  <line x1="325" y1="82" x2="325" y2="118" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="290" y="120" width="70" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="325" y="146" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">"c"</text>
  <line x1="360" y1="141" x2="430" y2="141" stroke="var(--dg-line, #5F6368)" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="432" y="120" width="200" height="42" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <text x="532" y="138" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">top-K for "c"</text>
  <text x="532" y="153" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">car, cat, city</text>

  <line x1="325" y1="162" x2="325" y2="198" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="290" y="200" width="70" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="325" y="226" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">"ca"</text>
  <line x1="360" y1="221" x2="430" y2="221" stroke="var(--dg-line, #5F6368)" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="432" y="200" width="200" height="42" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <text x="532" y="218" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">top-K for "ca"</text>
  <text x="532" y="233" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">cat, cab, cart</text>

  <line x1="325" y1="242" x2="325" y2="278" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="280" y="280" width="90" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="325" y="306" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">"cat"</text>
  <line x1="370" y1="301" x2="430" y2="301" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="432" y="280" width="200" height="42" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="532" y="296" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">returned directly</text>
  <text x="532" y="312" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">cat, catalog, category</text>

  <text x="350" y="352" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A lookup for "cat" walks 3 nodes and returns that node's cached list — no ranking at query time.</text>
</svg>
