<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Worker crash: lease expiry and re-dispatch</text>

  <line x1="40" y1="140" x2="660" y2="140" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <circle cx="80" cy="140" r="5" fill="var(--dg-accent, #0C8F88)"/>
  <text x="80" y="120" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Worker A</text>
  <text x="80" y="106" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">leases job</text>

  <circle cx="220" cy="140" r="5" fill="var(--dg-accent, #0C8F88)"/>
  <text x="220" y="160" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">heartbeat ok</text>

  <circle cx="340" cy="140" r="5" fill="var(--dg-ink, #202124)"/>
  <text x="340" y="120" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">crash</text>
  <text x="340" y="106" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">heartbeats stop</text>

  <line x1="340" y1="135" x2="450" y2="135" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="395" y="165" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">lease timer running out</text>

  <circle cx="450" cy="140" r="5" fill="var(--dg-ink, #202124)"/>
  <text x="450" y="120" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">lease expires</text>

  <circle cx="560" cy="140" r="5" fill="var(--dg-accent, #0C8F88)"/>
  <text x="560" y="160" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Worker B</text>
  <text x="560" y="174" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">re-dispatched</text>

  <circle cx="640" cy="140" r="5" fill="var(--dg-accent, #0C8F88)"/>
  <text x="640" y="120" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">starts fresh</text>

  <text x="350" y="222" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Worker B has no idea A ever touched the job — this is why job logic must be idempotent.</text>
</svg>
