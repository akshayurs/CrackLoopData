<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Leader, job store, worker pool</text>

  <rect x="30" y="120" width="160" height="54" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="110" y="152" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Scheduler leader</text>

  <rect x="270" y="40" width="160" height="54" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="350" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Job store</text>

  <rect x="500" y="50" width="170" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="585" y="78" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Worker 1</text>
  <rect x="500" y="130" width="170" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="585" y="158" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Worker 2</text>
  <rect x="500" y="210" width="170" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="585" y="238" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Worker 3</text>

  <line x1="192" y1="130" x2="268" y2="82" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="115" font-size="9" fill="var(--dg-muted, #5F6368)">poll due jobs</text>

  <line x1="270" y1="90" x2="194" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <line x1="190" y1="140" x2="498" y2="70" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="190" y1="147" x2="498" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="190" y1="154" x2="498" y2="230" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="205" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">dispatch with lease</text>

  <line x1="500" y1="90" x2="360" y2="96" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="450" y="112" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">heartbeat renews lease</text>

  <text x="350" y="290" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The leader decides what's due; the lease decides who's actually working on it now.</text>
</svg>
