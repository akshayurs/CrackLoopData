<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Sync server architecture</text>

  <rect x="20" y="40" width="130" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="66" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Client A</text>
  <rect x="20" y="112" width="130" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="138" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Client B</text>
  <rect x="20" y="184" width="130" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="210" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Client C</text>

  <rect x="260" y="105" width="170" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="345" y="131" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Sync server</text>
  <text x="345" y="147" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">append + broadcast</text>

  <line x1="150" y1="62" x2="258" y2="118" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="134" x2="258" y2="134" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="206" x2="258" y2="152" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="100" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">WebSocket (ops)</text>

  <rect x="500" y="60" width="170" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="585" y="82" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Per-document op-log</text>
  <text x="585" y="98" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">append-only</text>

  <line x1="430" y1="120" x2="498" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="500" y="160" width="170" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="585" y="182" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Document store</text>
  <text x="585" y="198" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">periodic persist</text>

  <line x1="585" y1="110" x2="585" y2="158" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <text x="350" y="290" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Every client for a document routes through this one sync server.</text>
</svg>
