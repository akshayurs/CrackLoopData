<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Concurrent edits converging via OT</text>

  <rect x="280" y="36" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="350" y="61" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Start: same doc</text>

  <line x1="320" y1="78" x2="180" y2="118" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="78" x2="520" y2="118" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="90" y="120" width="180" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="180" y="141" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">User A: insert</text>
  <text x="180" y="157" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">applied directly</text>

  <rect x="430" y="120" width="180" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="520" y="141" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">User B: delete</text>
  <text x="520" y="157" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">concurrent op</text>

  <line x1="520" y1="170" x2="520" y2="200" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="430" y="202" width="180" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="520" y="223" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Transform vs A's op</text>
  <text x="520" y="239" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">then apply</text>

  <line x1="180" y1="170" x2="320" y2="278" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="252" x2="400" y2="278" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="280" y="280" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="350" y="305" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Identical text</text>

</svg>
