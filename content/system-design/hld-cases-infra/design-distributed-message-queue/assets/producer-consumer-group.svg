<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Producer to consumer group offsets</text>

  <rect x="20" y="110" width="140" height="54" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="90" y="132" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Producer</text>
  <text x="90" y="148" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">hash(key) -&gt; partition</text>

  <rect x="270" y="40" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="330" y="64" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Partition 0</text>
  <rect x="270" y="100" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="330" y="124" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Partition 1</text>
  <rect x="270" y="160" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="330" y="184" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Partition 2</text>

  <line x1="160" y1="128" x2="268" y2="65" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="160" y1="135" x2="268" y2="122" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="160" y1="142" x2="268" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="450" y="24" width="220" height="200" rx="10" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="560" y="18" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">consumer group</text>

  <rect x="470" y="40" width="180" height="42" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="560" y="58" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Consumer 1</text>
  <text x="560" y="74" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">committed offset: 3</text>

  <rect x="470" y="100" width="180" height="42" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="560" y="118" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Consumer 2</text>
  <text x="560" y="134" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">committed offset: 1</text>

  <rect x="470" y="160" width="180" height="42" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="560" y="178" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Consumer 3</text>
  <text x="560" y="194" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">committed offset: 5</text>

  <line x1="390" y1="60" x2="468" y2="60" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="120" x2="468" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="180" x2="468" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="350" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each consumer owns one partition and tracks its own offset, independently of the others.</text>
</svg>
