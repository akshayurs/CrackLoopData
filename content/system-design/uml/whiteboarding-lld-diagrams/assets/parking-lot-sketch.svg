<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="320" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">Whiteboard sketch — parking lot (first 3 minutes)</text>

  <rect x="30" y="55" width="130" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="95" y="79" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">ParkingLot</text>
  <polygon points="163,75 181,67 199,75 181,83" fill="var(--dg-ink, #202124)"/>
  <line x1="199" y1="75" x2="260" y2="75" stroke="var(--dg-ink, #202124)" stroke-width="1.3"/>

  <rect x="263" y="55" width="110" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="318" y="79" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Level</text>
  <polygon points="376,75 394,67 412,75 394,83" fill="var(--dg-ink, #202124)"/>
  <line x1="412" y1="75" x2="470" y2="75" stroke="var(--dg-ink, #202124)" stroke-width="1.3"/>

  <rect x="473" y="55" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="543" y="79" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">ParkingSpot</text>

  <line x1="543" y1="95" x2="543" y2="130" stroke="var(--dg-ink, #202124)" stroke-width="1.3"/>
  <text x="570" y="118" font-size="9.5" fill="var(--dg-muted, #5F6368)">0..1</text>

  <rect x="473" y="130" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="543" y="154" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Vehicle (abstract)</text>

  <line x1="500" y1="170" x2="480" y2="205" stroke="var(--dg-ink, #202124)" stroke-width="1.3"/>
  <line x1="586" y1="170" x2="606" y2="205" stroke="var(--dg-ink, #202124)" stroke-width="1.3"/>
  <polygon points="543,178 533,196 553,196" fill="none" stroke="var(--dg-ink, #202124)" stroke-width="1.3"/>

  <rect x="420" y="208" width="120" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="480" y="230" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Car</text>

  <rect x="546" y="208" width="120" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="606" y="230" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Motorcycle</text>

  <text x="320" y="275" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">filled diamonds = composition; open triangle = inheritance; plain line = association</text>
