<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="320" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">Composition (filled diamond) vs. aggregation (open diamond)</text>

  <!-- Composition: Car diamond Engine -->
  <rect x="30" y="70" width="90" height="36" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="75" y="93" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Car</text>
  <polygon points="130,88 148,80 166,88 148,96" fill="var(--dg-ink, #202124)" stroke="var(--dg-ink, #202124)"/>
  <line x1="166" y1="88" x2="230" y2="88" stroke="var(--dg-ink, #202124)" stroke-width="1.3"/>
  <rect x="235" y="70" width="90" height="36" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="280" y="93" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Engine</text>
  <text x="200" y="60" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--dg-ink, #202124)">composition</text>
  <text x="200" y="130" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">destroy Car, Engine goes with it</text>

  <!-- Aggregation: Team open diamond Player -->
  <rect x="380" y="70" width="90" height="36" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="425" y="93" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Team</text>
  <polygon points="480,88 498,80 516,88 498,96" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-ink, #202124)" stroke-width="1.5"/>
  <line x1="516" y1="88" x2="580" y2="88" stroke="var(--dg-ink, #202124)" stroke-width="1.3"/>
  <rect x="585" y="70" width="90" height="36" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="630" y="93" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Player</text>
  <text x="550" y="60" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--dg-ink, #202124)">aggregation</text>
  <text x="550" y="130" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">disband Team, Players play elsewhere</text>

  <text x="320" y="180" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">both diamonds sit at the whole (Car, Team), never the part</text>
  <text x="320" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">delete-cascades-to-part → filled diamond; independent lifecycle → open diamond</text>
</svg>
