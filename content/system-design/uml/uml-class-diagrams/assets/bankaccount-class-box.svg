<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="320" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">UML class box: BankAccount</text>

  <rect x="230" y="40" width="200" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="330" y="60" text-anchor="middle" font-size="12" font-weight="600" fill="var(--dg-ink, #202124)">BankAccount</text>

  <rect x="230" y="70" width="200" height="80" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="245" y="90" font-size="10.5" fill="var(--dg-ink, #202124)">- accountId: String</text>
  <text x="245" y="110" font-size="10.5" fill="var(--dg-ink, #202124)"># balance: double</text>
  <text x="245" y="130" font-size="10.5" fill="var(--dg-ink, #202124)">+ owner: Customer</text>

  <rect x="230" y="150" width="200" height="90" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="245" y="170" font-size="10.5" fill="var(--dg-ink, #202124)">+ deposit(amt: double): void</text>
  <text x="245" y="190" font-size="10.5" fill="var(--dg-ink, #202124)">+ withdraw(amt: double): bool</text>
  <text x="245" y="210" font-size="10.5" fill="var(--dg-ink, #202124)">- validate(amt: double): bool</text>
  <text x="245" y="228" font-size="10" text-decoration="underline" fill="var(--dg-ink, #202124)">+ interestRate: double</text>

  <line x1="435" y1="90" x2="480" y2="90" stroke="var(--dg-line, #5F6368)"/>
  <text x="485" y="94" font-size="9.5" fill="var(--dg-muted, #5F6368)">"-" private</text>
  <line x1="435" y1="110" x2="480" y2="110" stroke="var(--dg-line, #5F6368)"/>
  <text x="485" y="114" font-size="9.5" fill="var(--dg-muted, #5F6368)">"#" protected</text>
  <line x1="435" y1="130" x2="480" y2="130" stroke="var(--dg-line, #5F6368)"/>
  <text x="485" y="134" font-size="9.5" fill="var(--dg-muted, #5F6368)">"+" public</text>
  <line x1="435" y1="228" x2="480" y2="228" stroke="var(--dg-line, #5F6368)"/>
  <text x="485" y="232" font-size="9.5" fill="var(--dg-muted, #5F6368)">underline = static member</text>

  <text x="330" y="270" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">compartments: name / attributes / methods</text>
</svg>
