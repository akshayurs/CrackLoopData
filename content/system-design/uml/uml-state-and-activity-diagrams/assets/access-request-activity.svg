<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">Activity diagram — access-request approval</text>

  <circle cx="140" cy="45" r="8" fill="var(--dg-ink, #202124)"/>
  <line x1="140" y1="53" x2="140" y2="72" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="70" y="75" width="140" height="34" rx="17" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="140" y="96" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Submit request</text>
  <line x1="140" y1="109" x2="140" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <polygon points="140,133 205,168 140,203 75,168" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="140" y="163" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Manager</text>
  <text x="140" y="175" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">approves?</text>

  <line x1="205" y1="168" x2="290" y2="168" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="248" y="160" text-anchor="middle" font-size="8.5" fill="var(--dg-muted, #5F6368)">No</text>
  <rect x="295" y="150" width="120" height="34" rx="17" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="355" y="171" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">Notify rejected</text>
  <line x1="355" y1="184" x2="355" y2="400" stroke="var(--dg-line, #5F6368)"/>

  <line x1="140" y1="203" x2="140" y2="225" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="155" y="219" font-size="8.5" fill="var(--dg-muted, #5F6368)">Yes</text>

  <polygon points="140,228 210,266 140,304 70,266" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="140" y="261" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Cost over</text>
  <text x="140" y="273" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">$10k?</text>

  <line x1="70" y1="266" x2="10" y2="266" stroke="var(--dg-line, #5F6368)"/>
  <line x1="10" y1="266" x2="10" y2="330" stroke="var(--dg-line, #5F6368)"/>
  <line x1="10" y1="330" x2="60" y2="330" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="40" y="255" text-anchor="middle" font-size="8.5" fill="var(--dg-muted, #5F6368)">No</text>
  <rect x="65" y="312" width="140" height="34" rx="17" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="135" y="333" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">Provision access</text>

  <line x1="210" y1="266" x2="290" y2="266" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="250" y="258" text-anchor="middle" font-size="8.5" fill="var(--dg-muted, #5F6368)">Yes</text>
  <rect x="295" y="248" width="130" height="34" rx="17" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="360" y="269" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">Finance review</text>

  <line x1="360" y1="282" x2="360" y2="300" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <polygon points="360,303 425,338 360,373 295,338" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="360" y="333" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Finance</text>
  <text x="360" y="345" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">approves?</text>

  <line x1="295" y1="338" x2="230" y2="338" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="260" y="330" text-anchor="middle" font-size="8.5" fill="var(--dg-muted, #5F6368)">No</text>
  <line x1="230" y1="338" x2="230" y2="167" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <line x1="360" y1="373" x2="360" y2="400" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="380" y="392" text-anchor="middle" font-size="8.5" fill="var(--dg-muted, #5F6368)">Yes</text>
  <rect x="290" y="400" width="140" height="34" rx="17" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="360" y="421" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">Provision access</text>

  <text x="320" y="450" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">small request skips finance; large request needs a second approval</text>
</svg>
