<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">UML state diagram — order lifecycle</text>

  <circle cx="40" cy="70" r="8" fill="var(--dg-ink, #202124)"/>
  <line x1="48" y1="70" x2="80" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="85" y="52" width="90" height="36" rx="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="130" y="75" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Created</text>

  <line x1="175" y1="70" x2="250" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="212" y="62" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">pay()</text>

  <rect x="255" y="52" width="90" height="36" rx="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="300" y="75" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Paid</text>

  <line x1="345" y1="70" x2="420" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="382" y="62" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">ship()</text>

  <rect x="425" y="52" width="90" height="36" rx="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="470" y="75" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Shipped</text>

  <line x1="515" y1="70" x2="590" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="552" y="62" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">deliver()</text>

  <rect x="595" y="52" width="95" height="36" rx="18" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="642" y="75" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Delivered</text>
  <circle cx="642" cy="105" r="10" fill="none" stroke="var(--dg-ink, #202124)" stroke-width="1.5"/>
  <circle cx="642" cy="105" r="5" fill="var(--dg-ink, #202124)"/>
  <line x1="642" y1="88" x2="642" y2="95" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <line x1="130" y1="88" x2="130" y2="170" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="150" y="140" font-size="9" fill="var(--dg-muted, #5F6368)">cancel()</text>

  <line x1="300" y1="88" x2="300" y2="170" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="308" y="140" font-size="9" fill="var(--dg-muted, #5F6368)">cancel()</text>
  <text x="308" y="152" font-size="8.5" fill="var(--dg-muted, #5F6368)">[not yet shipped]</text>

  <rect x="85" y="175" width="260" height="36" rx="18" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="215" y="198" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Cancelled</text>
  <circle cx="215" cy="228" r="10" fill="none" stroke="var(--dg-ink, #202124)" stroke-width="1.5"/>
  <circle cx="215" cy="228" r="5" fill="var(--dg-ink, #202124)"/>
  <line x1="215" y1="211" x2="215" y2="218" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="470" y="150" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">no cancel() transition out of Shipped — absent by design</text>
</svg>
