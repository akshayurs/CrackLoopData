<svg viewBox="0 0 460 460" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="230" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">UML activity diagram — place order</text>

  <circle cx="230" cy="45" r="9" fill="var(--dg-ink, #202124)"/>
  <line x1="230" y1="54" x2="230" y2="75" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="160" y="78" width="140" height="34" rx="17" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="230" y="100" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Validate order</text>
  <line x1="230" y1="112" x2="230" y2="135" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <polygon points="230,138 280,168 230,198 180,168" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="230" y="172" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">In stock?</text>

  <line x1="280" y1="168" x2="360" y2="168" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="320" y="160" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">No</text>
  <rect x="330" y="150" width="120" height="36" rx="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="390" y="172" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Notify: out of stock</text>
  <line x1="390" y1="186" x2="390" y2="400" stroke="var(--dg-line, #5F6368)"/>

  <line x1="230" y1="198" x2="230" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="245" y="214" font-size="9" fill="var(--dg-muted, #5F6368)">Yes</text>

  <rect x="160" y="222" width="140" height="34" rx="17" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="230" y="244" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Charge payment</text>
  <line x1="230" y1="256" x2="230" y2="278" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <polygon points="230,281 290,315 230,349 170,315" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="230" y="319" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">Payment ok?</text>

  <line x1="290" y1="315" x2="360" y2="315" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="325" y="307" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">No</text>
  <rect x="330" y="297" width="120" height="36" rx="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="390" y="319" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Notify: payment failed</text>
  <line x1="390" y1="333" x2="390" y2="400" stroke="var(--dg-line, #5F6368)"/>

  <line x1="230" y1="349" x2="230" y2="371" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="245" y="365" font-size="9" fill="var(--dg-muted, #5F6368)">Yes</text>

  <rect x="160" y="374" width="140" height="34" rx="17" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="230" y="396" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Confirm order</text>

  <line x1="230" y1="408" x2="230" y2="425" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="390" y1="400" x2="230" y2="425" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <circle cx="230" cy="435" r="10" fill="none" stroke="var(--dg-ink, #202124)" stroke-width="1.5"/>
  <circle cx="230" cy="435" r="5" fill="var(--dg-ink, #202124)"/>
</svg>
