<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrowSolid" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowOpen" markerWidth="12" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.2"/>
    </marker>
  </defs>
  <text x="310" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">UML sequence diagram — createOrder()</text>

  <rect x="30" y="35" width="120" height="28" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="90" y="54" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Client</text>
  <line x1="90" y1="63" x2="90" y2="270" stroke="var(--dg-stroke, #9AA0A6)"/>

  <rect x="240" y="35" width="150" height="28" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="315" y="54" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">OrderService</text>
  <line x1="315" y1="63" x2="315" y2="270" stroke="var(--dg-stroke, #9AA0A6)"/>

  <rect x="460" y="35" width="150" height="28" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="535" y="54" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">PaymentService</text>
  <line x1="535" y1="63" x2="535" y2="270" stroke="var(--dg-stroke, #9AA0A6)"/>

  <!-- activation bars -->
  <rect x="310" y="90" width="10" height="150" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <rect x="530" y="140" width="10" height="50" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>

  <!-- calls -->
  <line x1="90" y1="90" x2="308" y2="90" stroke="var(--dg-ink, #202124)" stroke-width="1.5" marker-end="url(#arrowSolid)"/>
  <text x="200" y="82" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">createOrder()</text>

  <line x1="320" y1="140" x2="528" y2="140" stroke="var(--dg-ink, #202124)" stroke-width="1.5" marker-end="url(#arrowSolid)"/>
  <text x="425" y="132" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">charge(amount)</text>

  <line x1="530" y1="190" x2="322" y2="190" stroke="var(--dg-muted, #5F6368)" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowOpen)"/>
  <text x="425" y="182" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">paymentOk</text>

  <line x1="310" y1="235" x2="92" y2="235" stroke="var(--dg-muted, #5F6368)" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowOpen)"/>
  <text x="200" y="227" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">orderConfirmed</text>

  <text x="310" y="290" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">solid = call, dashed = return; OrderService's bar nests inside the Client call</text>
</svg>
