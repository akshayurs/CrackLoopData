<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">One PDP, many PEPs</text>

  <rect x="270" y="120" width="160" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="350" y="145" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Policy decision point</text>
  <text x="350" y="162" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">evaluates the rule,</text>
  <text x="350" y="174" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">returns allow/deny</text>

  <rect x="30" y="40" width="140" height="40" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="65" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">API gateway (PEP)</text>

  <rect x="30" y="230" width="140" height="40" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="255" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Order service (PEP)</text>

  <rect x="530" y="135" width="140" height="40" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="600" y="160" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Billing service (PEP)</text>

  <line x1="170" y1="70" x2="278" y2="128" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="170" y1="240" x2="278" y2="175" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="530" y1="155" x2="432" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="215" y="90" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">who, what action,</text>
  <text x="215" y="102" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">what resource</text>
  <text x="480" y="130" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">allow/deny</text>

  <text x="350" y="250" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Every PEP sends the same shape of question and gets the same shape of answer —</text>
  <text x="350" y="270" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">the actual rule logic lives in exactly one place, no matter how many services enforce it.</text>
</svg>
