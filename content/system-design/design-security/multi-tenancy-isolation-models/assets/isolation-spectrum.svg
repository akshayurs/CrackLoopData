<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The isolation spectrum</text>

  <line x1="40" y1="90" x2="660" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="110" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="130" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Shared table</text>
  <text x="105" y="144" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">tenant_id column</text>

  <rect x="200" y="110" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="270" y="130" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Schema-per-tenant</text>
  <text x="270" y="144" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">own tables, one DB</text>

  <rect x="370" y="110" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="445" y="130" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Database-per-tenant</text>
  <text x="445" y="144" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">own database</text>

  <rect x="550" y="110" width="140" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="620" y="130" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Cluster-per-tenant</text>
  <text x="620" y="144" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">dedicated infra stack</text>

  <text x="40" y="185" font-size="10" fill="var(--dg-muted, #5F6368)">weaker isolation, lower cost</text>
  <text x="690" y="185" text-anchor="end" font-size="10" fill="var(--dg-muted, #5F6368)">stronger isolation, higher cost</text>

  <text x="350" y="225" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Each step right trades lower operational cost for a stronger, more structural isolation guarantee.</text>
</svg>
