<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Abuse-signal check before the core path</text>

  <rect x="20" y="110" width="110" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="135" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Incoming request</text>

  <line x1="130" y1="131" x2="168" y2="131" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="170" y="90" width="180" height="82" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="260" y="112" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Abuse-signal check</text>
  <text x="260" y="130" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">IP reputation</text>
  <text x="260" y="144" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">rate limit</text>
  <text x="260" y="158" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">device signal</text>

  <line x1="260" y1="90" x2="260" y2="55" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="380" y="60" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">rejected / challenged</text>
  <text x="380" y="74" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">never reaches core logic</text>

  <line x1="350" y1="131" x2="388" y2="131" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="368" y="121" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">passed</text>

  <rect x="390" y="110" width="200" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="130" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Core business logic</text>
  <text x="490" y="144" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">checkout, login, message send</text>

  <text x="350" y="220" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Rejected requests never touch the database or downstream services —</text>
  <text x="350" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">the expensive parts of the system never see the bulk of abusive traffic.</text>
</svg>
