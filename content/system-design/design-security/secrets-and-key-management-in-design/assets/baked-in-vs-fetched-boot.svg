<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Baked-in vs fetched-at-boot secrets</text>

  <text x="175" y="52" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Baked-in</text>
  <rect x="60" y="66" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="120" y="86" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Image build</text>
  <text x="120" y="99" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">secret embedded</text>

  <line x1="120" y1="106" x2="120" y2="138" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="60" y="140" width="120" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="120" y="160" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Service starts</text>
  <text x="120" y="173" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">secret already present</text>

  <text x="120" y="210" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">present in every image</text>
  <text x="120" y="224" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">layer, incl. old tags</text>

  <line x1="350" y1="70" x2="350" y2="250" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="530" y="52" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Fetched at boot</text>
  <rect x="465" y="66" width="130" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="86" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Service starts</text>
  <text x="530" y="99" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">no secret in image</text>

  <line x1="530" y1="106" x2="530" y2="138" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="465" y="140" width="130" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="160" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Authenticate to vault</text>
  <text x="530" y="173" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">using own identity</text>

  <line x1="530" y1="180" x2="530" y2="212" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="465" y="214" width="130" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="530" y="234" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Vault returns secret</text>
  <text x="530" y="247" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">held only in memory</text>

  <text x="350" y="290" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Baked-in starts instantly but leaves the secret in every image layer forever;</text>
  <text x="350" y="308" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">fetched-at-boot rotates by updating the vault once — no rebuild, no redeploy.</text>
</svg>
