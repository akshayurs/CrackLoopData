<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Login request to issued token</text>

  <line x1="90" y1="55" x2="90" y2="260" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="310" y1="55" x2="310" y2="260" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="560" y1="55" x2="560" y2="260" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 3"/>

  <rect x="30" y="46" width="120" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="66" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Client</text>

  <rect x="240" y="46" width="140" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="310" y="66" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">API gateway</text>

  <rect x="490" y="46" width="140" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="560" y="66" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Identity service</text>

  <line x1="90" y1="100" x2="308" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="200" y="93" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">1. credentials</text>

  <line x1="310" y1="120" x2="558" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="435" y="113" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">2. forward</text>

  <rect x="490" y="130" width="140" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="560" y="149" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">3. check user store,</text>
  <text x="560" y="160" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">mint signed token</text>

  <line x1="558" y1="180" x2="312" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="435" y="193" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">4. token</text>

  <line x1="308" y1="210" x2="92" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="200" y="215" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">5. token</text>

  <text x="90" y="245" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">attaches token to</text>
  <text x="90" y="258" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">every future request</text>

  <text x="350" y="286" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">The expensive user-store check happens exactly once, at login.</text>
</svg>
