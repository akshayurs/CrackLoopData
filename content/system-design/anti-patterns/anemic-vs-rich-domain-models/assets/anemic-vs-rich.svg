<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="160" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Anemic</text>
  <text x="480" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Rich</text>
  <line x1="320" y1="10" x2="320" y2="300" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4,4"/>

  <rect x="105" y="150" width="110" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="172" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Order</text>
  <text x="160" y="186" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">fields + getters/setters</text>

  <rect x="30" y="50" width="110" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="85" y="69" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">OrderService</text>
  <line x1="90" y1="80" x2="140" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="190" y="50" width="110" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="245" y="69" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">RefundService</text>
  <line x1="235" y1="80" x2="180" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="105" y="255" width="110" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="160" y="274" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">AdminPanel</text>
  <line x1="160" y1="255" x2="160" y2="202" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="410" y="150" width="160" height="80" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="490" y="172" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Order</text>
  <text x="490" y="188" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">cancel()</text>
  <text x="490" y="200" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">canCancel()</text>
  <text x="490" y="212" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">applyDiscount()</text>

  <rect x="430" y="60" width="120" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="490" y="79" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">OrderController</text>
  <line x1="490" y1="90" x2="490" y2="148" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="500" y="120" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">order.cancel()</text>

  <text x="320" y="288" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Anemic: many arrows into one data box. Rich: behavior lives inside the box itself.</text>
</svg>
