<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">requirement: send a welcome email</text>
  <line x1="320" y1="30" x2="320" y2="52" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="140" y="54" width="360" height="38" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="78" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">NotificationStrategyFactory</text>
  <line x1="320" y1="92" x2="320" y2="106" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="140" y="108" width="360" height="38" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="132" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">AbstractNotificationHandler</text>
  <line x1="320" y1="146" x2="320" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="140" y="162" width="360" height="38" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="186" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">NotificationPipelineBuilder</text>
  <line x1="320" y1="200" x2="320" y2="214" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="140" y="216" width="360" height="38" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="240" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">EmailNotificationVisitor</text>
  <line x1="320" y1="254" x2="320" y2="268" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="140" y="270" width="360" height="38" rx="7" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="294" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">actual code: call sendEmail()</text>

  <text x="560" y="180" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)" transform="rotate(90 560 180)">one caller, one implementation, at every layer</text>
</svg>
