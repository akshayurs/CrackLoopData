<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="160" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Before</text>
  <text x="480" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">After</text>
  <line x1="320" y1="10" x2="320" y2="290" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4,4"/>

  <rect x="40" y="50" width="240" height="150" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="74" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">calculateShipping()</text>
  <text x="55" y="96" font-size="10" fill="var(--dg-muted, #5F6368)">if type == STANDARD</text>
  <text x="65" y="112" font-size="9" fill="var(--dg-muted, #5F6368)">... inline logic</text>
  <text x="55" y="132" font-size="10" fill="var(--dg-muted, #5F6368)">else if type == EXPRESS</text>
  <text x="65" y="148" font-size="9" fill="var(--dg-muted, #5F6368)">... inline logic</text>
  <text x="55" y="168" font-size="10" fill="var(--dg-muted, #5F6368)">else if type == OVERNIGHT</text>
  <text x="65" y="184" font-size="9" fill="var(--dg-muted, #5F6368)">... inline logic</text>

  <rect x="400" y="46" width="200" height="34" rx="7" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="500" y="68" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">context.calculate()</text>

  <line x1="500" y1="80" x2="500" y2="98" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="400" y="100" width="200" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="500" y="120" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">ShippingCalculator (interface)</text>

  <rect x="380" y="150" width="70" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="415" y="167" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Standard</text>
  <text x="415" y="179" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Shipping</text>

  <rect x="465" y="150" width="70" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="500" y="167" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Express</text>
  <text x="500" y="179" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Shipping</text>

  <rect x="550" y="150" width="70" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="585" y="167" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Overnight</text>
  <text x="585" y="179" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Shipping</text>

  <line x1="415" y1="130" x2="415" y2="148" stroke="var(--dg-line, #5F6368)"/>
  <line x1="500" y1="130" x2="500" y2="148" stroke="var(--dg-line, #5F6368)"/>
  <line x1="585" y1="130" x2="585" y2="148" stroke="var(--dg-line, #5F6368)"/>

  <text x="320" y="266" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The branching didn't disappear — it moved into small classes, one per case.</text>
</svg>
