<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Replication lag makes a write vanish</text>

  <text x="90" y="55" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">User</text>
  <line x1="90" y1="65" x2="90" y2="250" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>

  <text x="310" y="55" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Primary</text>
  <line x1="310" y1="65" x2="310" y2="250" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>

  <text x="530" y="55" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Lagging replica</text>
  <line x1="530" y1="65" x2="530" y2="250" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>

  <line x1="90" y1="90" x2="308" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="200" y="82" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">posts comment</text>

  <line x1="310" y1="110" x2="310" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.3"/>
  <text x="330" y="130" font-size="10" fill="var(--dg-muted, #5F6368)">write lands</text>

  <line x1="90" y1="160" x2="308" y2="160" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="200" y="152" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">refreshes page</text>

  <path d="M 310 160 C 400 160 450 190 528 190" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="440" y="182" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">routed to replica</text>
  <text x="530" y="212" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">hasn't caught up yet</text>

  <line x1="530" y1="225" x2="92" y2="225" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="310" y="217" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">response: comment missing</text>

  <text x="320" y="265" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The user's own action appears to have been undone.</text>
</svg>
