<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">5-node cluster, partitioned</text>

  <rect x="30" y="55" width="270" height="150" rx="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="165" y="76" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Majority — 3 nodes</text>
  <circle cx="80" cy="140" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="145" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">N1</text>
  <circle cx="165" cy="150" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="165" y="155" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">N2</text>
  <circle cx="250" cy="140" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="145" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">N3</text>
  <text x="165" y="190" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">keeps accepting writes</text>

  <line x1="310" y1="40" x2="310" y2="240" stroke="var(--dg-line, #5F6368)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="330" y="245" font-size="10" fill="var(--dg-muted, #5F6368)">partition</text>

  <rect x="340" y="80" width="200" height="110" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="440" y="101" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Minority — 2 nodes</text>
  <circle cx="400" cy="150" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="400" y="155" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">N4</text>
  <circle cx="480" cy="150" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="480" y="155" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">N5</text>
  <text x="440" y="182" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">read-only or rejects writes</text>

  <text x="320" y="255" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">3 of 5 forms quorum; 2 of 5 never accepts a write that could silently diverge.</text>
</svg>
