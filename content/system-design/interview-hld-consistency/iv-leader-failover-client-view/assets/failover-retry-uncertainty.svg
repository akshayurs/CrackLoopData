<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Failover with an unacknowledged write</text>

  <text x="80" y="52" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Client</text>
  <line x1="80" y1="62" x2="80" y2="280" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>

  <text x="320" y="52" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Old leader</text>
  <line x1="320" y1="62" x2="320" y2="200" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>

  <text x="560" y="52" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">New leader</text>
  <line x1="560" y1="62" x2="560" y2="280" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>

  <line x1="80" y1="85" x2="318" y2="85" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="200" y="77" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">sends write</text>

  <rect x="290" y="100" width="60" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="320" y="117" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">crashes</text>

  <text x="80" y="150" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">no ack — did it land?</text>

  <line x1="320" y1="150" x2="560" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" stroke-dasharray="3,3"/>
  <text x="440" y="143" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">election</text>

  <line x1="80" y1="200" x2="558" y2="200" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="320" y="192" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">retry same write (idempotent)</text>

  <line x1="560" y1="220" x2="82" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="320" y="213" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">ack</text>

  <text x="320" y="255" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The client can't tell whether the original write landed —</text>
  <text x="320" y="273" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">only an idempotent retry against the new leader is safe either way.</text>
</svg>
