<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Cache-aside race on invalidation</text>

  <text x="80" y="52" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Writer</text>
  <line x1="80" y1="62" x2="80" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>

  <text x="270" y="52" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Database</text>
  <line x1="270" y1="62" x2="270" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>

  <text x="460" y="52" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Cache</text>
  <line x1="460" y1="62" x2="460" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>

  <text x="610" y="52" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Reader</text>
  <line x1="610" y1="62" x2="610" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>

  <line x1="80" y1="85" x2="268" y2="85" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="175" y="77" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">writes new value</text>

  <line x1="80" y1="105" x2="458" y2="105" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="270" y="98" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">invalidate cache entry</text>

  <line x1="610" y1="125" x2="462" y2="125" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="540" y="118" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">concurrent read: miss</text>

  <line x1="610" y1="145" x2="272" y2="145" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="440" y="138" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">fetches old value</text>

  <line x1="270" y1="165" x2="458" y2="165" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="365" y="158" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">repopulates with stale value</text>

  <line x1="610" y1="195" x2="462" y2="195" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="540" y="188" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">next read: stale hit</text>

  <text x="320" y="255" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The database was never wrong — a concurrent read re-cached the old</text>
  <text x="320" y="273" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">value milliseconds after invalidation, with no replica involved at all.</text>
</svg>
