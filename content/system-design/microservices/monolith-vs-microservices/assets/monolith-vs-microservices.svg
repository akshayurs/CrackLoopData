<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="150" y="24" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Monolith</text>
  <rect x="60" y="40" width="180" height="110" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="65" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Checkout</text>
  <text x="150" y="85" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Search</text>
  <text x="150" y="105" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Auth</text>
  <line x1="150" y1="150" x2="150" y2="175" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="115" y="175" width="70" height="30" rx="15" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="150" y="194" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">DB</text>

  <text x="480" y="24" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Microservices</text>
  <rect x="360" y="55" width="60" height="35" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="390" y="76" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Checkout</text>
  <rect x="440" y="55" width="60" height="35" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="470" y="76" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Search</text>
  <rect x="520" y="55" width="60" height="35" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="550" y="76" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Auth</text>

  <rect x="368" y="110" width="44" height="22" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="390" y="125" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">DB</text>
  <rect x="448" y="110" width="44" height="22" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="470" y="125" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">DB</text>
  <rect x="528" y="110" width="44" height="22" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="550" y="125" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">DB</text>

  <line x1="390" y1="90" x2="390" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="470" y1="90" x2="470" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="550" y1="90" x2="550" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <line x1="420" y1="72" x2="440" y2="72" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="500" y1="72" x2="520" y2="72" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="440" y="160" width="60" height="24" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="470" y="176" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Load balancer</text>
  <line x1="470" y1="184" x2="470" y2="0" stroke="none"/>
  <line x1="390" y1="132" x2="470" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="550" y1="132" x2="470" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="1" marker-end="url(#arrow)"/>

  <text x="320" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">One deployment unit and DB vs independently deployed services, each with its own store</text>
