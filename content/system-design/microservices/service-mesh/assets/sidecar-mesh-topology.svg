<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="230" y="15" width="180" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="39" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Control plane</text>

  <!-- pod A -->
  <rect x="60" y="120" width="180" height="110" rx="8" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="150" y="112" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Pod A</text>
  <rect x="80" y="135" width="140" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="150" y="157" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">App container</text>
  <rect x="80" y="185" width="140" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="150" y="207" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Sidecar proxy</text>
  <line x1="150" y1="171" x2="150" y2="185" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <!-- pod B -->
  <rect x="400" y="120" width="180" height="110" rx="8" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="490" y="112" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Pod B</text>
  <rect x="420" y="135" width="140" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="490" y="157" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">App container</text>
  <rect x="420" y="185" width="140" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="490" y="207" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Sidecar proxy</text>
  <line x1="490" y1="171" x2="490" y2="185" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <line x1="220" y1="203" x2="420" y2="203" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="195" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">sidecar to sidecar</text>

  <line x1="290" y1="55" x2="150" y2="185" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="350" y1="55" x2="490" y2="185" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="320" y="90" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">config, certs, policy</text>

  <text x="320" y="260" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">App code never calls another service directly — it always talks to its own sidecar</text>
</svg>
