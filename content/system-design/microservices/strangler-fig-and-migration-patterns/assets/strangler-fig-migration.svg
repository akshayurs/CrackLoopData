<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <!-- panel 1 -->
  <text x="105" y="18" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Panel 1</text>
  <rect x="60" y="30" width="90" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="105" y="47" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Proxy</text>
  <line x1="105" y1="56" x2="105" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="120" y="75" font-size="8" fill="var(--dg-muted, #5F6368)">100%</text>
  <rect x="55" y="90" width="100" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="118" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Monolith</text>

  <!-- panel 2 -->
  <text x="340" y="18" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Panel 2</text>
  <rect x="295" y="30" width="90" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="340" y="47" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Proxy</text>
  <line x1="330" y1="56" x2="310" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="350" y1="56" x2="400" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="410" y="75" font-size="8" fill="var(--dg-muted, #5F6368)">"search"</text>
  <rect x="270" y="90" width="90" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="315" y="118" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Monolith</text>
  <rect x="370" y="90" width="90" height="50" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="415" y="112" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Search</text>
  <text x="415" y="125" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Service</text>

  <!-- panel 3 -->
  <text x="575" y="18" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Panel 3</text>
  <rect x="530" y="30" width="90" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="575" y="47" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Proxy</text>
  <line x1="545" y1="56" x2="500" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="575" y1="56" x2="575" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="605" y1="56" x2="650" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="475" y="90" width="50" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="500" y="112" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Mono-</text>
  <text x="500" y="122" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">lith</text>
  <rect x="535" y="90" width="70" height="50" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="570" y="118" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Service A</text>
  <rect x="615" y="90" width="55" height="50" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="642" y="118" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Service B</text>

  <text x="340" y="220" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Only the proxy's routing table changes at each step</text>
</svg>
