<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="150" y="20" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Aligned</text>
  <rect x="45" y="35" width="60" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="75" y="54" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Team A</text>
  <rect x="120" y="35" width="60" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="150" y="54" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Team B</text>
  <rect x="195" y="35" width="60" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="225" y="54" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Team C</text>

  <line x1="75" y1="65" x2="75" y2="95" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="150" y1="65" x2="150" y2="95" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="225" y1="65" x2="225" y2="95" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="45" y="95" width="60" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="75" y="114" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Svc A</text>
  <rect x="120" y="95" width="60" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="150" y="114" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Svc B</text>
  <rect x="195" y="95" width="60" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="225" y="114" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Svc C</text>
  <text x="150" y="150" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">clean single-owner lines</text>

  <text x="490" y="20" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Misaligned</text>
  <rect x="420" y="35" width="55" height="28" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="447" y="53" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Team X</text>
  <rect x="480" y="35" width="55" height="28" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="507" y="53" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Team Y</text>
  <rect x="540" y="35" width="55" height="28" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="567" y="53" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Team Z</text>

  <line x1="447" y1="63" x2="507" y2="105" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="507" y1="63" x2="507" y2="105" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="567" y1="63" x2="507" y2="105" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <rect x="447" y="105" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2"/>
  <text x="507" y="126" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Shared Service</text>
  <text x="507" y="160" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">constant cross-team meetings</text>

  <text x="320" y="220" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Left: each team ships alone. Right: any change needs three teams to sync</text>
</svg>
