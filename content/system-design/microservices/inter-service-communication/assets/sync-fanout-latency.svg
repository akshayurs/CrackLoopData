<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <line x1="10" y1="40" x2="270" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="60" y="30" font-size="10" fill="var(--dg-muted, #5F6368)">incoming request</text>

  <rect x="270" y="100" width="120" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="330" y="128" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Order Service</text>

  <line x1="390" y1="115" x2="560" y2="50" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="480" y="20" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="550" y="38" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Inventory Service</text>
  <text x="550" y="52" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">~50ms</text>

  <line x1="390" y1="123" x2="560" y2="123" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="480" y="103" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="550" y="121" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Payments Service</text>
  <text x="550" y="135" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">~50ms</text>

  <line x1="390" y1="131" x2="560" y2="196" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="480" y="186" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="550" y="204" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Shipping Service</text>
  <text x="550" y="218" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">~50ms</text>

  <text x="320" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">One request becomes four calls; latency tracks the slowest downstream service</text>
</svg>
