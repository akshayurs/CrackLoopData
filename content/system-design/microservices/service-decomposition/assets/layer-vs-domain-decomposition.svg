<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="150" y="18" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Wrong: layer-based</text>
  <line x1="150" y1="30" x2="150" y2="55" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="150" y="45" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">"place order"</text>
  <rect x="70" y="55" width="160" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="150" y="76" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">UI Service</text>
  <line x1="150" y1="89" x2="150" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="70" y="100" width="160" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="150" y="121" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Business Logic Service</text>
  <line x1="150" y1="134" x2="150" y2="145" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="70" y="145" width="160" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="150" y="166" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Data Service</text>
  <text x="150" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">every action crosses all layers</text>

  <text x="480" y="18" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Right: domain-based</text>
  <line x1="480" y1="30" x2="480" y2="55" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="480" y="45" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">"place order"</text>
  <rect x="405" y="55" width="80" height="110" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="445" y="115" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Orders</text>
  <rect x="495" y="55" width="65" height="110" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="527" y="115" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Inventory</text>
  <rect x="570" y="55" width="65" height="110" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="602" y="115" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Payments</text>
  <text x="480" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">mostly stays within Orders Service</text>

  <text x="320" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Fewer network hops, and each hop maps to a real cross-team dependency</text>
</svg>
