<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="30" y="30" width="150" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="105" y="50" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Reserve Inventory</text>
  <text x="105" y="66" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">succeeds</text>

  <line x1="180" y1="53" x2="230" y2="53" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="230" y="30" width="150" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="305" y="50" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Charge Payment</text>
  <text x="305" y="66" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">succeeds</text>

  <line x1="380" y1="53" x2="430" y2="53" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="430" y="30" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="505" y="50" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Schedule Shipping</text>
  <text x="505" y="66" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">fails</text>

  <line x1="505" y1="76" x2="505" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="430" y="130" width="150" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="154" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Cancel Shipping (n/a)</text>

  <line x1="430" y1="150" x2="380" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="230" y="130" width="150" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="305" y="154" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Refund Payment</text>

  <line x1="230" y1="150" x2="180" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="30" y="130" width="150" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="148" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Release Inventory</text>
  <text x="105" y="162" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Reservation</text>

  <text x="320" y="205" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Compensations run in reverse order, each a local transaction — no global rollback</text>
</svg>
