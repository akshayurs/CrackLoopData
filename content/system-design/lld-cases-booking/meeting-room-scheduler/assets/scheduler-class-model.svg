<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="350" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Calendar interface, shared by Room and Attendee</text>

  <rect x="250" y="45" width="180" height="50" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="340" y="65" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">&lt;&lt;interface&gt;&gt;</text>
  <text x="340" y="80" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Calendar</text>
  <text x="340" y="93" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">hasConflict()</text>

  <line x1="290" y1="95" x2="150" y2="150" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3 2"/>
  <line x1="390" y1="95" x2="520" y2="150" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3 2"/>
  <text x="200" y="115" font-size="8" fill="var(--dg-muted, #5F6368)">implements</text>
  <text x="460" y="115" font-size="8" fill="var(--dg-muted, #5F6368)">implements</text>

  <rect x="70" y="150" width="110" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="125" y="174" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Room</text>

  <rect x="470" y="150" width="110" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="525" y="174" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Attendee</text>

  <rect x="250" y="200" width="200" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="350" y="220" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Meeting</text>
  <text x="350" y="235" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">room ref, attendee refs,</text>
  <text x="350" y="245" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">timeRange, RecurrenceRule?</text>

  <line x1="180" y1="170" x2="250" y2="215" stroke="var(--dg-line, #5F6368)"/>
  <line x1="470" y1="170" x2="450" y2="215" stroke="var(--dg-line, #5F6368)"/>
  <text x="200" y="200" font-size="8" fill="var(--dg-muted, #5F6368)">checks 1 Room</text>
  <text x="440" y="200" font-size="8" fill="var(--dg-muted, #5F6368)">+ several Attendees</text>
</svg>
