<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Auction lifecycle with anti-snipe</text>

  <rect x="20" y="90" width="110" height="44" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="116" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">SCHEDULED</text>

  <line x1="130" y1="112" x2="185" y2="112" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="157" y="102" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">start time</text>

  <rect x="185" y="90" width="90" height="44" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="230" y="116" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">OPEN</text>

  <line x1="275" y1="112" x2="340" y2="112" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="307" y="102" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">near end</text>

  <rect x="340" y="90" width="120" height="44" rx="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="400" y="116" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">CLOSING</text>

  <path d="M400,90 Q400,40 440,55 Q470,65 460,90" fill="none" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
  <text x="470" y="45" text-anchor="middle" font-size="8" fill="var(--dg-accent, #0C8F88)">bid arrives -&gt;</text>
  <text x="470" y="57" text-anchor="middle" font-size="8" fill="var(--dg-accent, #0C8F88)">extend, re-enter CLOSING</text>

  <line x1="460" y1="112" x2="520" y2="112" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="490" y="102" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">no bid in window</text>

  <rect x="520" y="90" width="110" height="44" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="575" y="116" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">CLOSED</text>
</svg>
