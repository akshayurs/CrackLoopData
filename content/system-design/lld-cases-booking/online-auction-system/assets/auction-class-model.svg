<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="350" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Class model: listing, auction, bids</text>

  <rect x="10" y="90" width="110" height="44" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="65" y="116" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Listing</text>

  <line x1="120" y1="112" x2="180" y2="112" stroke="var(--dg-line, #5F6368)"/>
  <text x="150" y="102" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">1--1</text>

  <rect x="180" y="90" width="120" height="44" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="240" y="116" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Auction</text>

  <line x1="300" y1="100" x2="380" y2="70" stroke="var(--dg-line, #5F6368)"/>
  <text x="340" y="70" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">1--*</text>

  <rect x="380" y="40" width="180" height="70" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="470" y="60" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Bid</text>
  <text x="470" y="75" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">bidderId, amount,</text>
  <text x="470" y="87" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">timestamp</text>
  <text x="470" y="100" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">+ isSystemGenerated flag</text>
  <text x="380" y="30" font-size="8" fill="var(--dg-muted, #5F6368)">append-only, ordered by timestamp</text>

  <line x1="300" y1="124" x2="380" y2="160" stroke="var(--dg-line, #5F6368)"/>
  <text x="340" y="155" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">1--*</text>

  <rect x="380" y="140" width="180" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="470" y="162" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">ProxyBid</text>
  <text x="470" y="178" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">one per auto-bidder</text>

  <path d="M470,190 Q470,215 470,140" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="530" y="215" font-size="8" fill="var(--dg-accent, #0C8F88)">generates system Bid</text>
</svg>
