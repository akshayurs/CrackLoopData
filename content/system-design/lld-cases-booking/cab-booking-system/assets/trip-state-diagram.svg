<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="360" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Trip lifecycle</text>

  <rect x="20" y="60" width="110" height="44" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="86" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">REQUESTED</text>

  <line x1="130" y1="82" x2="185" y2="82" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="157" y="72" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">driver assigned</text>

  <rect x="185" y="60" width="110" height="44" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="86" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">MATCHED</text>

  <line x1="295" y1="82" x2="350" y2="82" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="322" y="72" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">arrived, started</text>

  <rect x="350" y="60" width="130" height="44" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="415" y="86" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">IN_PROGRESS</text>

  <line x1="480" y1="82" x2="535" y2="82" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="507" y="72" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">drop, fare calc</text>

  <rect x="535" y="60" width="130" height="44" rx="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="600" y="86" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">COMPLETED</text>

  <rect x="230" y="180" width="130" height="44" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="295" y="206" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">CANCELLED</text>

  <path d="M75,104 Q75,180 230,200" fill="none" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="90" y="160" font-size="8" fill="var(--dg-muted, #5F6368)">no driver found /</text>
  <text x="90" y="172" font-size="8" fill="var(--dg-muted, #5F6368)">rider cancels early</text>

  <path d="M240,104 Q240,150 260,180" fill="none" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="245" y="150" font-size="8" fill="var(--dg-muted, #5F6368)">cancel before pickup</text>
</svg>
