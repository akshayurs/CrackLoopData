<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="350" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Class model: rider, driver, trip</text>

  <rect x="20" y="60" width="110" height="44" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="86" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Rider</text>

  <rect x="290" y="60" width="130" height="70" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="355" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Trip</text>
  <text x="355" y="96" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">pickupLocation</text>
  <text x="355" y="110" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">dropLocation</text>
  <text x="355" y="122" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">Location value objects</text>

  <rect x="570" y="60" width="110" height="44" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="625" y="86" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Driver</text>

  <line x1="130" y1="82" x2="290" y2="82" stroke="var(--dg-line, #5F6368)"/>
  <text x="210" y="76" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">1 -- *</text>

  <line x1="420" y1="82" x2="570" y2="82" stroke="var(--dg-line, #5F6368)"/>
  <text x="495" y="76" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">0..1 -- *</text>
  <text x="495" y="66" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">one active at most</text>

  <line x1="355" y1="130" x2="355" y2="180" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3"/>
  <text x="380" y="160" font-size="9" fill="var(--dg-muted, #5F6368)">dependency (calls, not owns)</text>
  <rect x="290" y="180" width="130" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="355" y="204" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">FareCalculator</text>

  <line x1="625" y1="104" x2="625" y2="150" stroke="var(--dg-line, #5F6368)"/>
  <text x="650" y="130" font-size="9" fill="var(--dg-muted, #5F6368)">1 -- 1</text>
  <rect x="570" y="150" width="110" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="625" y="174" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Location</text>
  <text x="625" y="270" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">current position, mutable</text>
  <line x1="625" y1="190" x2="625" y2="255" stroke="var(--dg-line, #5F6368)" stroke-dasharray="2 2"/>
</svg>
