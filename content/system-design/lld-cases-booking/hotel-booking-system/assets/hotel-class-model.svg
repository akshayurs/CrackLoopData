<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="360" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Inventory keyed by (roomType, date)</text>

  <rect x="10" y="90" width="90" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="55" y="114" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Hotel</text>

  <line x1="100" y1="110" x2="150" y2="110" stroke="var(--dg-line, #5F6368)"/>
  <text x="125" y="102" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">1--*</text>

  <rect x="150" y="90" width="100" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="200" y="114" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">RoomType</text>

  <line x1="250" y1="100" x2="330" y2="60" stroke="var(--dg-line, #5F6368)"/>
  <text x="285" y="72" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">1--*</text>

  <rect x="330" y="30" width="180" height="60" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="420" y="50" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">RoomInventory</text>
  <text x="420" y="65" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">remainingCount</text>
  <text x="420" y="78" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">key: (roomTypeId, date)</text>

  <line x1="250" y1="120" x2="330" y2="160" stroke="var(--dg-line, #5F6368)"/>
  <text x="285" y="150" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">1--*</text>

  <rect x="330" y="140" width="150" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="405" y="162" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Booking</text>
  <text x="405" y="177" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">checkIn, checkOut</text>

  <line x1="480" y1="170" x2="540" y2="170" stroke="var(--dg-line, #5F6368)"/>
  <text x="510" y="162" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">1--1</text>

  <rect x="540" y="150" width="110" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="595" y="174" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">RatePlan</text>

  <text x="420" y="230" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">no Room entity — physical assignment is separate, later-binding</text>
</svg>
