<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="350" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Room-type x date inventory grid</text>

  <g font-size="10" fill="var(--dg-ink, #202124)">
    <text x="20" y="70">Standard</text>
    <text x="20" y="120">Deluxe</text>
    <text x="20" y="170">Suite</text>
  </g>

  <g font-size="9" fill="var(--dg-muted, #5F6368)">
    <text x="150" y="45" text-anchor="middle">Jul 1</text>
    <text x="230" y="45" text-anchor="middle">Jul 2</text>
    <text x="310" y="45" text-anchor="middle">Jul 3</text>
    <text x="390" y="45" text-anchor="middle">Jul 4</text>
    <text x="470" y="45" text-anchor="middle">Jul 5</text>
  </g>

  <g fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)">
    <rect x="110" y="52" width="70" height="30"/><rect x="190" y="52" width="70" height="30"/><rect x="270" y="52" width="70" height="30"/><rect x="350" y="52" width="70" height="30"/><rect x="430" y="52" width="70" height="30"/>
    <rect x="110" y="102" width="70" height="30"/>
    <rect x="270" y="102" width="70" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <rect x="350" y="102" width="70" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <rect x="430" y="102" width="70" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <rect x="190" y="102" width="70" height="30"/>
    <rect x="110" y="152" width="70" height="30"/><rect x="190" y="152" width="70" height="30"/><rect x="270" y="152" width="70" height="30"/><rect x="350" y="152" width="70" height="30"/><rect x="430" y="152" width="70" height="30"/>
  </g>

  <g font-size="10" fill="var(--dg-ink, #202124)" text-anchor="middle">
    <text x="145" y="71">8</text><text x="225" y="71">8</text><text x="305" y="71">6</text><text x="385" y="71">6</text><text x="465" y="71">7</text>
    <text x="145" y="121">5</text><text x="225" y="121">5</text><text x="305" y="121" font-weight="600">3</text><text x="385" y="121" font-weight="600">3</text><text x="465" y="121" font-weight="600">3</text>
    <text x="145" y="171">2</text><text x="225" y="171">2</text><text x="305" y="171">2</text><text x="385" y="171">2</text><text x="465" y="171">2</text>
  </g>

  <text x="580" y="105" font-size="9" fill="var(--dg-accent, #0C8F88)">3-night stay: -1</text>
  <text x="580" y="118" font-size="9" fill="var(--dg-accent, #0C8F88)">in each cell</text>

  <path d="M550,140 Q450,170 305,145" fill="none" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="500" y="185" font-size="9" fill="var(--dg-muted, #5F6368)">cancellation restores same 3 cells</text>
</svg>
