<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="380" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Order lifecycle, cancellation shrinks over time</text>

  <rect x="10" y="70" width="90" height="40" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="55" y="94" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">PLACED</text>

  <line x1="100" y1="90" x2="150" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="150" y="70" width="100" height="40" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="200" y="94" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">ACCEPTED</text>

  <line x1="250" y1="90" x2="300" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="300" y="70" width="100" height="40" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="350" y="94" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">PREPARING</text>

  <line x1="400" y1="90" x2="450" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="450" y="70" width="105" height="40" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="502" y="94" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">PICKED_UP</text>

  <line x1="555" y1="90" x2="610" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="610" y="70" width="105" height="40" rx="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="662" y="94" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">DELIVERED</text>

  <rect x="260" y="190" width="120" height="40" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="320" y="214" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">CANCELLED</text>

  <path d="M55,110 Q100,170 260,205" fill="none" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="90" y="150" font-size="8" fill="var(--dg-muted, #5F6368)">customer</text>

  <path d="M200,110 Q220,160 260,195" fill="none" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="200" y="150" font-size="8" fill="var(--dg-muted, #5F6368)">restaurant</text>

  <path d="M350,110 Q350,150 350,190" fill="none" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="365" y="150" font-size="8" fill="var(--dg-muted, #5F6368)">system timeout</text>

  <text x="600" y="150" font-size="9" fill="var(--dg-muted, #5F6368)">no cancel branch after PICKED_UP</text>
</svg>
