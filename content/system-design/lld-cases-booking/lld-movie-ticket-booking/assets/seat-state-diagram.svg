<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Seat state within one show</text>

  <rect x="20" y="90" width="120" height="44" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="116" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">AVAILABLE</text>

  <path d="M140,105 Q220,80 300,105" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="220" y="80" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">hold-created</text>

  <rect x="300" y="90" width="110" height="44" rx="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="355" y="112" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">HELD</text>
  <text x="355" y="126" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">TTL 8 min</text>

  <path d="M300,132 Q220,160 140,132" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="220" y="160" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">TTL expiry / release</text>

  <line x1="410" y1="112" x2="470" y2="112" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="440" y="100" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">payment ok</text>

  <rect x="470" y="90" width="120" height="44" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="116" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">BOOKED</text>

  <path d="M530,134 Q530,190 470,220" fill="none" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="500" y="185" font-size="8" fill="var(--dg-muted, #5F6368)">refund flow only</text>
  <rect x="330" y="200" width="140" height="40" rx="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="400" y="224" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">CANCELLED</text>
</svg>
