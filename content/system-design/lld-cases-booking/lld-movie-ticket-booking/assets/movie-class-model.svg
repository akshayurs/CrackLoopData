<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="380" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Class model: theater to booking</text>

  <rect x="10" y="60" width="100" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="84" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Theater</text>

  <rect x="150" y="60" width="90" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="195" y="84" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Screen</text>
  <line x1="110" y1="80" x2="150" y2="80" stroke="var(--dg-line, #5F6368)"/>
  <text x="130" y="72" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">1--*</text>

  <rect x="150" y="130" width="120" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="210" y="150" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">SeatLayout</text>
  <text x="210" y="164" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">Seat: SILVER/GOLD/</text>
  <text x="210" y="174" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">RECLINER</text>
  <line x1="195" y1="100" x2="195" y2="130" stroke="var(--dg-line, #5F6368)"/>
  <text x="220" y="118" font-size="8" fill="var(--dg-muted, #5F6368)">1--1</text>

  <rect x="320" y="60" width="150" height="70" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="395" y="82" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Show</text>
  <text x="395" y="98" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">seatStates map</text>
  <text x="395" y="110" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">keyed by seatId</text>
  <text x="395" y="122" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">state lives here, per-show</text>
  <line x1="240" y1="80" x2="320" y2="90" stroke="var(--dg-line, #5F6368)"/>
  <text x="280" y="72" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">1--*</text>

  <rect x="530" y="60" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="590" y="84" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Booking</text>
  <line x1="470" y1="90" x2="530" y2="80" stroke="var(--dg-line, #5F6368)"/>
  <text x="500" y="72" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">1--*</text>

  <rect x="530" y="140" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="590" y="164" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Payment</text>
  <line x1="590" y1="100" x2="590" y2="140" stroke="var(--dg-line, #5F6368)"/>
  <text x="615" y="122" font-size="8" fill="var(--dg-muted, #5F6368)">1--1</text>

  <text x="590" y="200" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">+ seat ids (1--*)</text>
