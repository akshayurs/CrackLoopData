<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">The dual-write gap</text>

  <rect x="40" y="46" width="110" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="67" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Service</text>
  <line x1="95" y1="80" x2="95" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="270" y="46" width="110" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="325" y="67" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Database</text>
  <line x1="325" y1="80" x2="325" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="500" y="46" width="110" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="555" y="67" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Message broker</text>
  <line x1="555" y1="80" x2="555" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,3"/>

  <line x1="95" y1="110" x2="325" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="210" y="103" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">write order</text>

  <line x1="325" y1="140" x2="95" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="210" y="133" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">commit ok</text>

  <rect x="60" y="160" width="70" height="24" rx="4" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="95" y="176" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">crash</text>

  <line x1="95" y1="195" x2="545" y2="195" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="320" y="188" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">OrderConfirmed publish — never sent</text>

  <text x="95" y="235" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">order is real,</text>
  <text x="95" y="249" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">durably committed</text>

  <text x="555" y="235" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">event never</text>
  <text x="555" y="249" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">arrives</text>

  <text x="320" y="288" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">The commit and the publish are two separate operations — one can succeed while the other never happens</text>
</svg>
