<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">One stream, two schema versions</text>

  <rect x="150" y="45" width="340" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="69" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Event stream — mixed v1 and v2 messages</text>

  <line x1="260" y1="85" x2="150" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="380" y1="85" x2="490" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="40" y="132" width="180" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="130" y="153" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Old consumer</text>
  <text x="130" y="168" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">expects schema v1</text>

  <rect x="420" y="132" width="180" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="510" y="153" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">New consumer</text>
  <text x="510" y="168" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">expects schema v2</text>

  <rect x="30" y="195" width="200" height="46" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="130" y="212" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">reads v1 fields fine</text>
  <text x="130" y="227" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">must ignore new v2 fields</text>

  <rect x="410" y="195" width="200" height="46" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="510" y="212" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">reads v2 fields fine</text>
  <text x="510" y="227" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">must default missing v1-era fields</text>

  <text x="320" y="265" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Both read the same log — no message is formatted for just one version</text>
</svg>
