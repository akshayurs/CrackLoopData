<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Producer, queue, consumer</text>

  <rect x="20" y="60" width="120" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="87" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Producer</text>

  <line x1="140" y1="83" x2="248" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="195" y="73" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">publish</text>

  <rect x="250" y="60" width="140" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Durable queue</text>
  <text x="320" y="96" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">holds the message</text>

  <line x1="390" y1="83" x2="498" y2="83" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="445" y="73" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">consume, later</text>

  <rect x="500" y="60" width="120" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="560" y="87" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Consumer</text>

  <line x1="60" y1="160" x2="600" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="163" font-size="10" fill="var(--dg-muted, #5F6368)">time</text>

  <line x1="80" y1="150" x2="80" y2="170" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="80" y="188" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">publish</text>

  <line x1="440" y1="150" x2="440" y2="170" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="440" y="188" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">consume</text>

  <line x1="80" y1="160" x2="440" y2="160" stroke="var(--dg-accent, #0C8F88)" stroke-width="3" opacity="0.35"/>
  <text x="260" y="215" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">the gap: producer keeps going without waiting for a consumer to be ready</text>
</svg>
