<svg viewBox="0 0 660 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Event fan-out</text>

  <rect x="30" y="55" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="80" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Order service</text>

  <line x1="170" y1="76" x2="250" y2="76" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="205" y="68" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">OrderPlaced</text>

  <rect x="252" y="55" width="120" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="312" y="80" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Event bus</text>

  <line x1="372" y1="70" x2="440" y2="45" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="372" y1="76" x2="440" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="372" y1="82" x2="440" y2="215" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="442" y="20" width="180" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="532" y="38" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Inventory service</text>
  <text x="532" y="54" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">reserves stock</text>

  <rect x="442" y="105" width="180" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="532" y="123" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Email service</text>
  <text x="532" y="139" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">sends confirmation</text>

  <rect x="442" y="190" width="180" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="532" y="208" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Analytics service</text>
  <text x="532" y="224" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">logs the event</text>

  <text x="180" y="260" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">the order service never calls any of them directly, and doesn't know how many subscribers exist</text>
</svg>
