<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Topic partitions and a consumer group</text>

  <text x="30" y="55" font-size="11" fill="var(--dg-muted, #5F6368)">Topic</text>
  <g>
    <rect x="30" y="65" width="220" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.25"/>
    <text x="40" y="82" font-size="9" fill="var(--dg-ink, #202124)">P0: 0 1 2 3 4 5</text>
  </g>
  <g>
    <rect x="30" y="96" width="220" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.25"/>
    <text x="40" y="113" font-size="9" fill="var(--dg-ink, #202124)">P1: 0 1 2 3</text>
  </g>
  <g>
    <rect x="30" y="127" width="220" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.25"/>
    <text x="40" y="144" font-size="9" fill="var(--dg-ink, #202124)">P2: 0 1 2 3 4</text>
  </g>
  <g>
    <rect x="30" y="158" width="220" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.25"/>
    <text x="40" y="175" font-size="9" fill="var(--dg-ink, #202124)">P3: 0 1 2</text>
  </g>
  <text x="140" y="200" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">each partition: ordered, append-only, sequential offsets</text>

  <text x="500" y="55" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Consumer group</text>
  <rect x="420" y="65" width="80" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="460" y="87" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Consumer A</text>
  <rect x="420" y="115" width="80" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="460" y="137" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Consumer B</text>
  <rect x="420" y="165" width="80" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="460" y="187" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Consumer C</text>

  <line x1="250" y1="78" x2="415" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="250" y1="109" x2="415" y2="133" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="250" y1="140" x2="415" y2="183" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="250" y1="171" x2="415" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="530" y="230" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Consumer A covers two partitions —</text>
  <text x="530" y="244" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">consumer count doesn't have to match partition count</text>

  <text x="320" y="280" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">No partition is read by two consumers in the same group at once</text>
</svg>
