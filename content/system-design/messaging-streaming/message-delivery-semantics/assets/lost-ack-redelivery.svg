<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">A lost ack causes redelivery</text>

  <text x="120" y="52" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Broker</text>
  <line x1="120" y1="60" x2="120" y2="250" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.25"/>

  <text x="500" y="52" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Consumer</text>
  <line x1="500" y1="60" x2="500" y2="250" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.25"/>

  <line x1="120" y1="85" x2="492" y2="85" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="310" y="79" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">1. deliver message</text>

  <rect x="440" y="97" width="120" height="24" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="500" y="113" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">processes message</text>

  <line x1="500" y1="135" x2="128" y2="160" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4,3"/>
  <path d="M 300 149 L 285 148 M 300 149 L 297 137" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" fill="none"/>
  <text x="300" y="132" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">2. ack — lost on network</text>

  <text x="120" y="190" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">no ack received</text>
  <text x="120" y="203" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">= assume failure</text>

  <line x1="120" y1="215" x2="492" y2="215" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="310" y="209" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">3. redeliver same message</text>

  <text x="320" y="245" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">the consumer did its job — the broker just never found out</text>
</svg>
