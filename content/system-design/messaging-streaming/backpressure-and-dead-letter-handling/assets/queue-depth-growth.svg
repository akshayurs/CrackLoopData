<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Queue depth climbing</text>

  <line x1="70" y1="240" x2="580" y2="240" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.25"/>
  <line x1="70" y1="60" x2="70" y2="240" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.25"/>
  <text x="30" y="240" font-size="10" fill="var(--dg-muted, #5F6368)">0</text>
  <text x="320" y="262" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">time</text>
  <text x="30" y="70" font-size="10" fill="var(--dg-muted, #5F6368)">cumulative</text>

  <polyline points="70,220 580,80" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.75"/>
  <text x="570" y="72" text-anchor="end" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">produced</text>

  <polyline points="70,220 580,170" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.75"/>
  <text x="570" y="185" text-anchor="end" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">consumed</text>

  <line x1="500" y1="105" x2="500" y2="177" stroke="var(--dg-muted, #5F6368)" stroke-width="1.25" stroke-dasharray="4,3"/>
  <text x="512" y="145" font-size="10" fill="var(--dg-muted, #5F6368)">widening gap =</text>
  <text x="512" y="160" font-size="10" fill="var(--dg-muted, #5F6368)">growing backlog</text>

  <text x="320" y="288" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">producer rate exceeds consumer rate — the gap accumulates as queue depth</text>
</svg>
