<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="165" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Queue: competing consumers</text>
  <text x="535" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Pub/sub: fan-out</text>
  <line x1="345" y1="10" x2="345" y2="280" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,4" opacity="0.5"/>

  <rect x="100" y="45" width="130" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="165" y="65" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Queue: m1 m2 m3</text>

  <line x1="120" y1="75" x2="70" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="70" y="90" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">m1</text>
  <line x1="165" y1="75" x2="165" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="172" y="90" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">m2</text>
  <line x1="210" y1="75" x2="260" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="260" y="90" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">m3</text>

  <rect x="35" y="117" width="70" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="139" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Worker 1</text>
  <rect x="130" y="117" width="70" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="165" y="139" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Worker 2</text>
  <rect x="225" y="117" width="70" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="260" y="139" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Worker 3</text>

  <text x="165" y="195" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">messages split</text>
  <text x="165" y="213" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">each message goes to exactly one worker</text>

  <rect x="475" y="45" width="120" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="535" y="65" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Topic: one message</text>

  <line x1="495" y1="75" x2="440" y2="115" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="535" y1="75" x2="535" y2="115" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="575" y1="75" x2="630" y2="115" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="400" y="117" width="80" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="440" y="139" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Sub A queue</text>
  <rect x="495" y="117" width="80" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="535" y="139" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Sub B queue</text>
  <rect x="590" y="117" width="80" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="630" y="139" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Sub C queue</text>

  <text x="535" y="195" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">message cloned</text>
  <text x="535" y="213" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">every subscriber gets its own full copy</text>
</svg>
