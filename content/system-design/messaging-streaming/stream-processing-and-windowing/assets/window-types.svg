<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Tumbling, sliding, session windows</text>

  <circle cx="60" cy="60" r="3" fill="var(--dg-ink, #202124)"/>
  <circle cx="120" cy="60" r="3" fill="var(--dg-ink, #202124)"/>
  <circle cx="200" cy="60" r="3" fill="var(--dg-ink, #202124)"/>
  <circle cx="280" cy="60" r="3" fill="var(--dg-ink, #202124)"/>
  <circle cx="340" cy="60" r="3" fill="var(--dg-ink, #202124)"/>
  <circle cx="420" cy="60" r="3" fill="var(--dg-ink, #202124)"/>
  <circle cx="500" cy="60" r="3" fill="var(--dg-ink, #202124)"/>
  <circle cx="560" cy="60" r="3" fill="var(--dg-ink, #202124)"/>
  <text x="600" y="63" font-size="9" fill="var(--dg-muted, #5F6368)">events</text>

  <text x="20" y="98" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Tumbling</text>
  <rect x="30" y="105" width="180" height="24" rx="3" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.25"/>
  <rect x="210" y="105" width="180" height="24" rx="3" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.25"/>
  <rect x="390" y="105" width="180" height="24" rx="3" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.25"/>
  <text x="320" y="145" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">fixed, back-to-back, no overlap — each event in exactly one bucket</text>

  <text x="20" y="175" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Sliding</text>
  <rect x="30" y="182" width="160" height="18" rx="3" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <rect x="120" y="204" width="160" height="18" rx="3" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <rect x="210" y="182" width="160" height="18" rx="3" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <rect x="300" y="204" width="160" height="18" rx="3" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="240" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">fixed width, overlapping — one event can fall in several windows</text>

  <text x="20" y="270" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Session</text>
  <rect x="30" y="262" width="80" height="18" rx="3" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.25"/>
  <rect x="180" y="262" width="130" height="18" rx="3" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.25"/>
  <rect x="420" y="262" width="60" height="18" rx="3" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.25"/>
  <text x="145" y="277" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">gap</text>
  <text x="365" y="277" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">gap</text>
</svg>
