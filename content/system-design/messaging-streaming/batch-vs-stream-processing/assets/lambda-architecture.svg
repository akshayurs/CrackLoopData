<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Batch and speed layers into one serving layer</text>

  <rect x="20" y="45" width="110" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="72" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Raw events</text>

  <line x1="130" y1="60" x2="188" y2="60" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="130" y1="75" x2="188" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="190" y="45" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="265" y="65" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Batch layer</text>
  <text x="265" y="80" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">nightly, full history</text>

  <rect x="190" y="127" width="150" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="265" y="147" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Speed layer</text>
  <text x="265" y="162" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">real-time stream</text>

  <line x1="340" y1="68" x2="418" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="340" y1="150" x2="418" y2="128" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="420" y="100" width="160" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="120" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Serving layer</text>
  <text x="500" y="135" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">merges both for queries</text>

  <text x="265" y="105" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">exact, ground truth</text>
  <text x="265" y="192" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">fast, approximate</text>

  <line x1="500" y1="146" x2="500" y2="190" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="440" y="192" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="213" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Query result</text>

  <text x="320" y="260" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Speed-layer results are disposable — the next batch run replaces them with exact numbers</text>
</svg>
