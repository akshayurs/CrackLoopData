<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="10" y="35" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Replica A</text>
  <line x1="90" y1="60" x2="600" y2="60" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="100" cy="60" r="5" fill="var(--dg-line, #5F6368)"/>
  <text x="100" y="45" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">t=0</text>
  <circle cx="500" cy="60" r="5" fill="var(--dg-stroke, #9AA0A6)" opacity="0.4"/>
  <text x="500" y="45" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">t=40ms (discarded)</text>

  <text x="10" y="115" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Replica B</text>
  <line x1="90" y1="140" x2="600" y2="140" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="200" cy="140" r="5" fill="var(--dg-line, #5F6368)"/>
  <text x="200" y="125" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">t=10ms (hedge fires)</text>
  <circle cx="240" cy="140" r="6" fill="var(--dg-accent, #0C8F88)"/>
  <text x="240" y="165" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">t=14ms response used</text>

  <line x1="100" y1="70" x2="200" y2="130" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="150" y="95" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">10ms wait</text>

  <text x="320" y="200" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Only the first response wins; the other is discarded</text>
</svg>
