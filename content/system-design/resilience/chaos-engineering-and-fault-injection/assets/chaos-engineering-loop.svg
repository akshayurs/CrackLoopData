<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="10" y="30" width="150" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="54" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">1. Define</text>
  <text x="85" y="70" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">steady state</text>

  <line x1="160" y1="58" x2="190" y2="58" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="190" y="30" width="150" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="265" y="54" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">2. Inject fault</text>
  <text x="265" y="70" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">kill an instance</text>

  <line x1="340" y1="58" x2="370" y2="58" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="370" y="30" width="150" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="445" y="54" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">3. Observe</text>
  <text x="445" y="70" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">metrics</text>

  <line x1="520" y1="58" x2="550" y2="58" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="550" y="30" width="120" height="56" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="610" y="54" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">4. Compare</text>
  <text x="610" y="70" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">pass or fail</text>

  <rect x="200" y="140" width="300" height="50" rx="8" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="350" y="162" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Automatic abort</text>
  <text x="350" y="178" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">if user-facing harm detected</text>

  <path d="M 500 140 C 500 110, 550 100, 600 86" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="445" y1="86" x2="350" y2="140" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
</svg>
