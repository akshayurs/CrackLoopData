<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="10" y="30" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">No jitter</text>
  <line x1="10" y1="60" x2="610" y2="60" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <g stroke="var(--dg-accent, #0C8F88)" stroke-width="3">
    <line x1="150" y1="60" x2="150" y2="15"/>
    <line x1="153" y1="60" x2="153" y2="18"/>
    <line x1="156" y1="60" x2="156" y2="20"/>
    <line x1="300" y1="60" x2="300" y2="15"/>
    <line x1="303" y1="60" x2="303" y2="18"/>
    <line x1="306" y1="60" x2="306" y2="20"/>
    <line x1="450" y1="60" x2="450" y2="15"/>
    <line x1="453" y1="60" x2="453" y2="18"/>
    <line x1="456" y1="60" x2="456" y2="20"/>
  </g>
  <text x="153" y="75" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">t=100ms</text>
  <text x="303" y="75" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">t=200ms</text>
  <text x="453" y="75" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">t=400ms</text>
  <text x="580" y="45" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">spikes</text>

  <text x="10" y="140" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">With jitter</text>
  <line x1="10" y1="170" x2="610" y2="170" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <g stroke="var(--dg-line, #5F6368)" stroke-width="2">
    <line x1="120" y1="170" x2="120" y2="150"/>
    <line x1="140" y1="170" x2="140" y2="140"/>
    <line x1="165" y1="170" x2="165" y2="155"/>
    <line x1="185" y1="170" x2="185" y2="145"/>
    <line x1="270" y1="170" x2="270" y2="150"/>
    <line x1="290" y1="170" x2="290" y2="135"/>
    <line x1="315" y1="170" x2="315" y2="150"/>
    <line x1="335" y1="170" x2="335" y2="145"/>
    <line x1="420" y1="170" x2="420" y2="150"/>
    <line x1="440" y1="170" x2="440" y2="140"/>
    <line x1="465" y1="170" x2="465" y2="155"/>
    <line x1="485" y1="170" x2="485" y2="145"/>
  </g>
  <text x="580" y="150" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">smeared</text>

  <text x="320" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Same total retry volume — jitter changes whether it spikes or spreads</text>
</svg>
