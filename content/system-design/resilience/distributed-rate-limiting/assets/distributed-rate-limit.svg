<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="60" y="20" width="80" height="16" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="100" y="32" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Load balancer</text>

  <g>
    <rect x="20" y="60" width="60" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="50" y="82" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">App 1</text>
    <rect x="100" y="60" width="60" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="130" y="82" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">App 2</text>
    <rect x="180" y="60" width="60" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="210" y="82" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">App 3</text>
    <rect x="260" y="60" width="60" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="290" y="82" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">App 4</text>
    <rect x="340" y="60" width="60" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="370" y="82" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">App 5</text>
  </g>

  <line x1="50" y1="96" x2="270" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="130" y1="96" x2="280" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="210" y1="96" x2="290" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="290" y1="96" x2="300" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="370" y1="96" x2="310" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="240" y="150" width="120" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="300" y="170" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Redis</text>
  <text x="300" y="185" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">shared counter</text>

  <line x1="450" y1="130" x2="580" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="580" y1="130" x2="450" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <rect x="440" y="140" width="150" height="70" rx="8" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="515" y="130" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">5 local counters</text>
  <text x="515" y="230" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">don't agree</text>

  <text x="320" y="260" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">One shared source of truth means the limit is the same everywhere</text>
</svg>
