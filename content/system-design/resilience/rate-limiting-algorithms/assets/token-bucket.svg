<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <line x1="60" y1="20" x2="60" y2="200" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <line x1="60" y1="200" x2="600" y2="200" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="30" y="30" font-size="10" fill="var(--dg-muted, #5F6368)">10</text>
  <text x="30" y="205" font-size="10" fill="var(--dg-muted, #5F6368)">0</text>
  <text x="320" y="220" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">time</text>

  <!-- refill rising line 0 to 3s -->
  <line x1="60" y1="145" x2="240" y2="90" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <!-- sharp drop at t=3s -->
  <line x1="240" y1="90" x2="255" y2="190" stroke="var(--dg-line, #5F6368)" stroke-width="2"/>
  <!-- resumes refilling -->
  <line x1="255" y1="190" x2="500" y2="120" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>

  <text x="150" y="75" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">refill 2/sec</text>
  <circle cx="240" cy="90" r="4" fill="var(--dg-ink, #202124)"/>
  <text x="240" y="70" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">t=3s: burst of 8</text>
  <text x="255" y="205" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">drained sharply</text>

  <text x="320" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Capacity 10 — bursts drain instantly, refill stays at a fixed rate</text>
</svg>
