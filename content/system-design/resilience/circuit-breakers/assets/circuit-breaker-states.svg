<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <circle cx="140" cy="90" r="55" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="140" y="96" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Closed</text>

  <circle cx="500" cy="90" r="55" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2"/>
  <text x="500" y="96" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Open</text>

  <circle cx="320" cy="260" r="55" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2"/>
  <text x="320" y="255" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Half-Open</text>

  <!-- Closed -> Open -->
  <path d="M 195 75 C 300 40, 400 40, 445 75" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="35" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">failure threshold exceeded</text>

  <!-- Open -> Half-Open -->
  <path d="M 470 138 C 420 190, 390 210, 365 225" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="185" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">cooldown</text>
  <text x="470" y="199" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">timer elapses</text>

  <!-- Half-Open -> Closed -->
  <path d="M 275 225 C 240 190, 200 140, 170 138" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="195" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">trial requests</text>
  <text x="150" y="209" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">succeed</text>

  <!-- Half-Open -> Open -->
  <path d="M 370 235 C 420 210, 460 175, 480 145" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="470" y="230" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">trial requests fail</text>

  <text x="320" y="310" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Only one path leads back to full traffic: Half-Open succeeding</text>
</svg>
