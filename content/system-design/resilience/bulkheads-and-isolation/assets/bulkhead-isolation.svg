<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="150" y="24" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Shared pool</text>
  <rect x="30" y="40" width="240" height="150" rx="8" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <g>
    <!-- 10 small squares, 9 stuck on Recommendations, 1 free -->
    <rect x="45" y="55" width="24" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,2"/>
    <rect x="75" y="55" width="24" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,2"/>
    <rect x="105" y="55" width="24" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,2"/>
    <rect x="135" y="55" width="24" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,2"/>
    <rect x="165" y="55" width="24" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,2"/>
    <rect x="45" y="85" width="24" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,2"/>
    <rect x="75" y="85" width="24" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,2"/>
    <rect x="105" y="85" width="24" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,2"/>
    <rect x="135" y="85" width="24" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,2"/>
    <rect x="165" y="85" width="24" height="24" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  </g>
  <text x="150" y="130" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">9 stuck on Recommendations,</text>
  <text x="150" y="144" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">1 free for Payments + Search</text>
  <text x="150" y="172" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">10 threads total</text>

  <text x="490" y="24" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Bulkheaded pools</text>
  <rect x="370" y="40" width="80" height="70" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="410" y="60" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Payments</text>
  <text x="410" y="78" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">full &amp;</text>
  <text x="410" y="92" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">available</text>

  <rect x="460" y="40" width="80" height="70" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="500" y="60" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Recs</text>
  <text x="500" y="78" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">exhausted</text>

  <rect x="550" y="40" width="80" height="70" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="590" y="60" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Search</text>
  <text x="590" y="78" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">full &amp;</text>
  <text x="590" y="92" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">available</text>

  <text x="500" y="172" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">only Recs is degraded</text>

  <text x="320" y="230" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Similar total capacity — the wall stops one failure from spreading</text>
</svg>
