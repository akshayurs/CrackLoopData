<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="250" y="20" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="48" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">ATM</text>

  <line x1="250" y1="45" x2="90" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="390" y1="45" x2="550" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="300" y1="66" x2="240" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="340" y1="66" x2="400" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="20" y="100" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="126" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">CardReader</text>

  <rect x="480" y="100" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="550" y="126" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">CashDispenser</text>

  <rect x="170" y="100" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="126" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Session</text>

  <rect x="330" y="100" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="400" y="126" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Transaction</text>

  <line x1="400" y1="142" x2="400" y2="180" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="300" y="180" width="200" height="48" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="400" y="200" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">BankService</text>
  <text x="400" y="216" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">interface</text>

  <line x1="400" y1="228" x2="400" y2="256" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <rect x="290" y="256" width="220" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="400" y="277" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">bank-integration impl</text>

  <text x="40" y="290" font-size="10" fill="var(--dg-muted, #5F6368)">Note: no direct ATM → Account edge exists.</text>
</svg>
