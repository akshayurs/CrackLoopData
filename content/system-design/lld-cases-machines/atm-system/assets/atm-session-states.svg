<svg viewBox="0 -30 640 290" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="90" width="110" height="44" rx="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="117" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">idle</text>

  <line x1="130" y1="112" x2="180" y2="112" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="180" y="90" width="120" height="44" rx="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="117" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">cardInserted</text>

  <line x1="300" y1="112" x2="350" y2="112" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="350" y="90" width="120" height="44" rx="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="410" y="117" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">authenticated</text>

  <line x1="470" y1="112" x2="520" y2="112" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="520" y="80" width="110" height="64" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="575" y="105" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">transaction</text>
  <text x="575" y="118" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">InProgress</text>
  <line x1="575" y1="144" x2="575" y2="180" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="500" y="180" width="150" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="575" y="204" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">dispensing / complete</text>

  <!-- universal timeout back to idle -->
  <path d="M240,90 C 220,20 120,20 90,88" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <path d="M410,90 C 360,10 130,5 78,86" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <path d="M570,80 C 480,-20 130,-10 70,86" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="320" y="20" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">timeout — from every state</text>
</svg>
