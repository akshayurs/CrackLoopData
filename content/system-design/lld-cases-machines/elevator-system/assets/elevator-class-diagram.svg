<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="diamond" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,5 L5,0 L10,5 L5,10 Z" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-line, #5F6368)" stroke-width="1"/>
    </marker>
  </defs>

  <rect x="230" y="16" width="180" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="44" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">ElevatorController</text>

  <line x1="320" y1="62" x2="320" y2="100" stroke="var(--dg-line, #5F6368)" marker-start="url(#diamond)"/>
  <text x="336" y="86" font-size="11" fill="var(--dg-muted, #5F6368)">1..*</text>

  <rect x="230" y="100" width="180" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="122" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Elevator</text>
  <text x="320" y="138" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">own queue, own state</text>

  <line x1="320" y1="146" x2="320" y2="184" stroke="var(--dg-line, #5F6368)" marker-start="url(#diamond)"/>
  <text x="336" y="170" font-size="11" fill="var(--dg-muted, #5F6368)">queue*</text>

  <rect x="230" y="184" width="180" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="209" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Request</text>

  <line x1="290" y1="226" x2="180" y2="266" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="350" y1="226" x2="460" y2="266" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="80" y="266" width="200" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="180" y="288" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">ExternalCall</text>
  <text x="180" y="304" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">floor + direction</text>

  <rect x="360" y="266" width="200" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="460" y="288" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">InternalDestination</text>
  <text x="460" y="304" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">floor only</text>
</svg>
