<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="30" y="100" width="120" height="50" rx="25" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="130" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">idle</text>

  <path d="M150,115 C 220,85 260,85 320,105" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="230" y="80" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">request</text>

  <rect x="260" y="105" width="140" height="50" rx="25" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="330" y="126" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">movingUp /</text>
  <text x="330" y="142" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">movingDown</text>

  <path d="M400,120 C 460,95 480,95 500,110" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="450" y="88" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">arrived</text>

  <rect x="470" y="100" width="140" height="50" rx="25" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="540" y="122" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">doorOpen</text>
  <text x="540" y="138" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">interruptible</text>

  <path d="M470,140 C 300,205 150,205 90,150" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="280" y="215" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">doors close</text>

  <path d="M540,150 C 540,190 560,190 560,150" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="600" y="185" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">extend /</text>
  <text x="600" y="198" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">redirect</text>
</svg>
