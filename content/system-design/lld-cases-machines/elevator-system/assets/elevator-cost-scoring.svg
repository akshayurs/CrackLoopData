<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Request: floor 6, going up</text>

  <!-- shaft baseline -->
  <line x1="60" y1="260" x2="580" y2="260" stroke="var(--dg-line, #5F6368)"/>
  <text x="30" y="264" font-size="10" fill="var(--dg-muted, #5F6368)">L1</text>
  <line x1="60" y1="70" x2="580" y2="70" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="2,4"/>
  <text x="30" y="74" font-size="10" fill="var(--dg-muted, #5F6368)">L10</text>

  <!-- Elevator A -->
  <rect x="110" y="200" width="60" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="140" y="224" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">A</text>
  <text x="140" y="256" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">floor 4, up</text>
  <text x="140" y="272" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">cost 2</text>

  <!-- Elevator B -->
  <rect x="290" y="90" width="60" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="114" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">B</text>
  <text x="320" y="146" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">floor 8, down</text>
  <text x="320" y="162" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">cost 9</text>

  <!-- Elevator C: winner -->
  <rect x="450" y="215" width="60" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="480" y="239" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">C</text>
  <text x="480" y="272" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">floor 5, up</text>
  <text x="480" y="288" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">cost 1 · lowest</text>
</svg>
