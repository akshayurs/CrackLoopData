<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="diamond" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,5 L5,0 L10,5 L5,10 Z" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-line, #5F6368)" stroke-width="1"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="150" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="95" y="48" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Branch</text>

  <line x1="95" y1="66" x2="95" y2="104" stroke="var(--dg-line, #5F6368)" marker-start="url(#diamond)"/>
  <text x="110" y="90" font-size="11" fill="var(--dg-muted, #5F6368)">*</text>

  <rect x="20" y="104" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="126" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Vehicle</text>
  <text x="95" y="142" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">tagged with category</text>

  <line x1="95" y1="150" x2="95" y2="188" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="20" y="188" width="150" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="213" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">VehicleCategory</text>

  <rect x="250" y="104" width="180" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="340" y="126" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Reservation</text>
  <text x="340" y="142" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">category or vehicle</text>
  <text x="340" y="156" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">+ date range</text>

  <line x1="250" y1="122" x2="170" y2="122" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="205" y="112" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">category</text>

  <line x1="290" y1="164" x2="140" y2="188" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="240" y="196" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">optional, once assigned</text>

  <line x1="340" y1="164" x2="340" y2="202" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="356" y="188" font-size="11" fill="var(--dg-muted, #5F6368)">at pickup</text>

  <rect x="250" y="202" width="180" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="340" y="225" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">RentalAgreement</text>
  <text x="340" y="241" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">created from reservation</text>
</svg>
