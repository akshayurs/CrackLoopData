<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Same vehicle, two date ranges</text>

  <!-- axis -->
  <line x1="60" y1="180" x2="600" y2="180" stroke="var(--dg-line, #5F6368)"/>
  <g font-size="10" fill="var(--dg-muted, #5F6368)" text-anchor="middle">
    <text x="60" y="196">day 1</text>
    <text x="168" y="196">day 3</text>
    <text x="276" y="196">day 5</text>
    <text x="330" y="196">day 6</text>
    <text x="384" y="196">day 7</text>
    <text x="492" y="196">day 9</text>
    <text x="600" y="196">day 11</text>
  </g>

  <!-- existing booking day 3-7 -->
  <rect x="168" y="70" width="216" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="276" y="90" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">existing: day 3–7</text>

  <!-- candidate day 6-10 -->
  <rect x="330" y="110" width="216" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="438" y="130" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">candidate: day 6–10</text>

  <!-- overlap highlight -->
  <rect x="330" y="70" width="54" height="70" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="357" y="60" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">overlap</text>

  <line x1="330" y1="180" x2="330" y2="70" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="2,4"/>
  <line x1="384" y1="180" x2="384" y2="140" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="2,4"/>
</svg>
