<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="diamond" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,5 L5,0 L10,5 L5,10 Z" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-line, #5F6368)" stroke-width="1"/>
    </marker>
  </defs>

  <rect x="230" y="16" width="180" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="44" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Intersection</text>

  <line x1="320" y1="62" x2="320" y2="100" stroke="var(--dg-line, #5F6368)" marker-start="url(#diamond)"/>
  <text x="336" y="86" font-size="11" fill="var(--dg-muted, #5F6368)">*</text>

  <rect x="230" y="100" width="180" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="128" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">SignalGroup</text>

  <line x1="290" y1="146" x2="230" y2="184" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="235" y="170" font-size="11" fill="var(--dg-muted, #5F6368)">*</text>
  <rect x="120" y="184" width="180" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="210" y="209" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Light</text>
  <text x="210" y="222" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">red / yellow / green</text>

  <rect x="20" y="16" width="150" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="95" y="44" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Controller</text>

  <line x1="95" y1="62" x2="95" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="20" y="100" width="150" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="125" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Timer</text>

  <line x1="170" y1="35" x2="450" y2="35" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="310" y="24" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">current phase</text>
  <rect x="450" y="16" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="525" y="44" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Phase</text>

  <line x1="525" y1="62" x2="410" y2="112" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="480" y="86" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">maps to green groups</text>
</svg>
