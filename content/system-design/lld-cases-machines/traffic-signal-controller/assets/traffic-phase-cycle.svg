<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="60" y="30" width="180" height="50" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="60" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">NS-green / EW-red</text>

  <line x1="240" y1="55" x2="290" y2="55" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="290" y="30" width="150" height="50" rx="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="365" y="52" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">all-red</text>
  <text x="365" y="66" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">clearance</text>

  <line x1="440" y1="55" x2="490" y2="55" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="490" y="30" width="150" height="50" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="565" y="60" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">NS-red / EW-green</text>

  <line x1="565" y1="80" x2="565" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="490" y="130" width="150" height="50" rx="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="565" y="152" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">all-red</text>
  <text x="565" y="166" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">clearance</text>

  <path d="M490,155 C 300,240 200,200 150,80" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="280" y="230" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">cycle repeats</text>

  <text x="320" y="290" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">all-red clearance sits between every green-to-green transition, never skipped.</text>
</svg>
