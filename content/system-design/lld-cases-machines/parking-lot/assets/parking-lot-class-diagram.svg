<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="diamond" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,5 L5,0 L10,5 L5,10 Z" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
    </marker>
  </defs>

  <rect x="230" y="16" width="180" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="38" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">ParkingLot</text>
  <text x="320" y="54" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">aggregate root</text>

  <line x1="320" y1="62" x2="320" y2="100" stroke="var(--dg-line, #5F6368)" marker-start="url(#diamond)"/>
  <rect x="230" y="100" width="180" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="125" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Level</text>

  <line x1="320" y1="142" x2="320" y2="180" stroke="var(--dg-line, #5F6368)" marker-start="url(#diamond)"/>
  <rect x="220" y="180" width="200" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="200" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">ParkingSpot</text>
  <text x="320" y="216" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">compact / large / EV / handicap</text>

  <line x1="60" y1="62" x2="270" y2="20" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="20" y="20" width="150" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="45" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">EntryGate</text>

  <rect x="470" y="20" width="150" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="545" y="45" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">ExitGate</text>
  <line x1="470" y1="45" x2="410" y2="30" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="220" y="260" width="90" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="265" y="285" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Vehicle</text>
  <line x1="310" y1="281" x2="360" y2="248" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="360" y="230" width="90" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="405" y="255" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Ticket</text>

  <text x="40" y="300" font-size="10" fill="var(--dg-muted, #5F6368)">All access to spots/tickets goes through ParkingLot.</text>
</svg>
