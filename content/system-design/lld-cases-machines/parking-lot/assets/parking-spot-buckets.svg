<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="600" height="220" rx="10" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="40" y="42" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Level</text>

  <g font-size="11" fill="var(--dg-ink, #202124)">
    <rect x="50" y="60" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="110" y="82" text-anchor="middle">Compact</text>
    <rect x="50" y="110" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="110" y="132" text-anchor="middle">Large</text>
    <rect x="50" y="160" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="110" y="182" text-anchor="middle">EV</text>
  </g>

  <rect x="50" y="200" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="110" y="222" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Handicap</text>

  <line x1="170" y1="77" x2="260" y2="77" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="170" y1="127" x2="260" y2="127" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="170" y1="177" x2="260" y2="177" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="170" y1="217" x2="260" y2="217" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="260" y="60" width="300" height="174" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="410" y="82" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">free-spot queue per type</text>
  <text x="410" y="140" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">park(): poll spot out — O(1)</text>
  <text x="410" y="160" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">exit(): offer spot back — O(1)</text>

  <path d="M410,175 C 460,195 460,205 410,225" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="460" y="210" font-size="9" fill="var(--dg-muted, #5F6368)">exit</text>
</svg>
