<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="30" y="130" width="110" height="46" rx="23" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="158" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">idle</text>

  <line x1="140" y1="153" x2="190" y2="153" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="190" y="130" width="120" height="46" rx="23" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="158" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">selecting</text>

  <line x1="310" y1="153" x2="360" y2="153" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="360" y="130" width="120" height="46" rx="23" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="420" y="158" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">hasMoney</text>

  <line x1="480" y1="153" x2="530" y2="153" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="530" y="130" width="100" height="46" rx="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="580" y="158" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">dispensing</text>

  <path d="M530,150 C 300,240 150,240 90,178" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="310" y="255" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">done — back to idle</text>

  <rect x="230" y="30" width="160" height="46" rx="23" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="310" y="58" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">returningChange</text>

  <path d="M250,130 C 260,100 280,90 300,76" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="200" y="100" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">cancel</text>

  <path d="M420,130 C 400,95 380,85 350,74" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="440" y="100" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">cancel</text>

  <line x1="230" y1="53" x2="140" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="165" y="90" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">change given</text>

  <text x="580" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">no cancel path once dispensing starts</text>
</svg>
