<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Same incident, two alert designs</text>

  <text x="30" y="52" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">Cause-based</text>
  <rect x="30" y="65" width="160" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="89" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">"replica down"</text>

  <rect x="230" y="65" width="180" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="89" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">"connection pool 80%"</text>

  <rect x="450" y="65" width="160" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="89" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">"GC pause spike"</text>

  <text x="320" y="125" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">three pages, none clearly urgent alone</text>

  <line x1="20" y1="150" x2="620" y2="150" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="30" y="178" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">Symptom-based</text>
  <rect x="180" y="185" width="280" height="44" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="320" y="211" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">"checkout success rate below 99%"</text>

  <text x="320" y="250" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">one page, clearly tied to real user impact</text>
</svg>
