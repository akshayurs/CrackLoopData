<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">28-day error budget burn-down</text>

  <line x1="60" y1="200" x2="580" y2="200" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <line x1="60" y1="50" x2="60" y2="200" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="45" y="55" text-anchor="end" font-size="10" fill="var(--dg-muted, #5F6368)">100%</text>
  <text x="45" y="200" text-anchor="end" font-size="10" fill="var(--dg-muted, #5F6368)">0%</text>
  <text x="320" y="220" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">day 1 → day 28</text>

  <line x1="60" y1="80" x2="580" y2="80" stroke="var(--dg-accent, #0C8F88)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="590" y="84" font-size="9" fill="var(--dg-muted, #5F6368)">threshold</text>

  <polyline points="60,55 100,62 140,68 180,75 220,82 250,88 260,150 300,152 340,155 380,158 420,162 460,166 500,170 540,174 580,178"
    fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>

  <circle cx="260" cy="150" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <line x1="260" y1="88" x2="260" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="260" y="65" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">day 12 incident</text>

  <text x="580" y="185" text-anchor="end" font-size="9" fill="var(--dg-muted, #5F6368)">~20% left</text>

  <text x="320" y="248" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Small daily errors nibble the budget; one incident can burn a third of it in an hour.</text>
</svg>
