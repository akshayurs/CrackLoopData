<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <rect x="15" y="80" width="90" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="104" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Services</text>

  <rect x="150" y="80" width="90" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="195" y="104" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Collector</text>
  <line x1="105" y1="100" x2="148" y2="100" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="285" y="80" width="120" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="345" y="98" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">Sampling decision</text>
  <text x="345" y="112" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">head / tail / adaptive</text>
  <line x1="240" y1="100" x2="283" y2="100" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="480" y="35" width="130" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="545" y="59" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Trace storage</text>
  <path d="M405,90 Q450,60 478,55" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="440" y="55" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">kept</text>

  <rect x="480" y="130" width="130" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" opacity="0.5"/>
  <text x="545" y="154" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">discarded</text>
  <path d="M405,110 Q450,140 478,148" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="440" y="140" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">dropped</text>

  <text x="320" y="200" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Cost is controlled once at the sampling stage, before storage ever sees the volume.</text>
</svg>
