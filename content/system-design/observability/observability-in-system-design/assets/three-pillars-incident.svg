<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Same incident, three views</text>

  <rect x="20" y="45" width="180" height="200" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="65" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Metric</text>
  <polyline points="35,200 60,195 80,190 100,110 120,180 150,185 185,182" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <line x1="35" y1="210" x2="185" y2="210" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="100" y="228" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">latency spike at 14:02</text>

  <rect x="230" y="45" width="180" height="200" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="65" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Trace</text>
  <rect x="245" y="90" width="150" height="18" rx="3" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="252" y="103" font-size="8" fill="var(--dg-muted, #5F6368)">gateway</text>
  <rect x="255" y="115" width="30" height="18" rx="3" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="270" y="128" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">auth</text>
  <rect x="255" y="140" width="130" height="18" rx="3" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="153" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">payments — 4.8s</text>
  <text x="320" y="228" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">payments span dominates</text>

  <rect x="440" y="45" width="180" height="200" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="65" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Log</text>
  <rect x="455" y="100" width="150" height="60" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <text x="465" y="120" font-size="8" fill="var(--dg-ink, #202124)">payment gateway</text>
  <text x="465" y="134" font-size="8" fill="var(--dg-ink, #202124)">timeout after</text>
  <text x="465" y="148" font-size="8" fill="var(--dg-ink, #202124)">4800ms</text>
  <text x="530" y="228" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">exact reason for the delay</text>
</svg>
