<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="15" y="30" width="80" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="55" y="49" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Host + agent</text>
  <rect x="15" y="70" width="80" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="55" y="89" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Host + agent</text>
  <rect x="15" y="110" width="80" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="55" y="129" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Host + agent</text>

  <rect x="145" y="65" width="100" height="44" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="195" y="91" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Buffer / queue</text>

  <path d="M95,45 Q120,45 143,80" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M95,85 L143,87" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M95,125 Q120,125 143,95" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="65" width="110" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="355" y="86" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Ingestion +</text>
  <text x="355" y="99" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">indexing</text>
  <line x1="245" y1="87" x2="298" y2="87" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="460" y="65" width="90" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="91" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Search store</text>
  <line x1="410" y1="87" x2="458" y2="87" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="580" y="70" width="45" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="602" y="91" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Search UI</text>
  <line x1="550" y1="87" x2="578" y2="87" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="320" y="190" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The app never talks to the central store directly — the agent and buffer decouple it.</text>
