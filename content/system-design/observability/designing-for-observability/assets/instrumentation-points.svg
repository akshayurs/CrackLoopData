<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="80" width="110" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="106" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Load balancer</text>

  <rect x="180" y="80" width="110" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="235" y="106" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">API gateway</text>
  <circle cx="235" cy="60" r="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="235" y="45" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">metrics + trace start</text>

  <rect x="340" y="80" width="110" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="395" y="106" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Service</text>
  <circle cx="395" cy="60" r="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="395" y="45" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">health check</text>

  <rect x="500" y="80" width="110" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="555" y="106" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Database</text>
  <circle cx="555" cy="60" r="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="555" y="45" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">query latency</text>

  <line x1="130" y1="102" x2="178" y2="102" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="290" y1="102" x2="338" y2="102" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="102" x2="498" y2="102" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="320" y="190" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A small hook is attached at every hop a request crosses, not bolted on at the edge.</text>
</svg>
