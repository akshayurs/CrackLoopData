<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Trace waterfall — 2.1s total</text>

  <line x1="140" y1="40" x2="140" y2="215" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="600" y1="40" x2="600" y2="215" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="140" y="225" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">0s</text>
  <text x="600" y="225" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">2.1s</text>

  <text x="20" y="55" font-size="10" fill="var(--dg-ink, #202124)">API gateway</text>
  <rect x="140" y="45" width="460" height="18" rx="3" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <text x="30" y="85" font-size="10" fill="var(--dg-ink, #202124)">Auth</text>
  <rect x="150" y="75" width="18" height="16" rx="3" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="180" y="87" font-size="8" fill="var(--dg-muted, #5F6368)">80ms</text>

  <text x="20" y="115" font-size="10" fill="var(--dg-ink, #202124)">Pricing</text>
  <rect x="172" y="105" width="27" height="16" rx="3" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="215" y="117" font-size="8" fill="var(--dg-muted, #5F6368)">120ms</text>

  <text x="12" y="150" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Inventory</text>
  <rect x="203" y="138" width="373" height="20" rx="3" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="390" y="152" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">1.7s — slow span</text>

  <text x="10" y="188" font-size="10" fill="var(--dg-ink, #202124)">Response assembly</text>
  <rect x="560" y="176" width="40" height="16" rx="3" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="580" y="205" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">200ms</text>
