<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="150" y="22" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Rapid-fire (60-90s)</text>
  <text x="460" y="22" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Deep dive (10min)</text>
  <line x1="310" y1="10" x2="310" y2="240" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="30" y="55" width="70" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3"/>
  <text x="65" y="76" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Axis</text>
  <line x1="100" y1="72" x2="125" y2="72" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="125" y="55" width="70" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3"/>
  <text x="160" y="76" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Side</text>
  <line x1="195" y1="72" x2="220" y2="72" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="220" y="55" width="80" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3"/>
  <text x="260" y="76" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">One-sentence why</text>

  <text x="150" y="125" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">three short beats</text>

  <rect x="330" y="50" width="52" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="356" y="68" text-anchor="middle" font-size="8.5" fill="var(--dg-ink, #202124)">Reqs</text>
  <line x1="382" y1="65" x2="398" y2="65" stroke="var(--dg-line, #5F6368)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="398" y="50" width="52" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="424" y="68" text-anchor="middle" font-size="8.5" fill="var(--dg-ink, #202124)">Options</text>
  <line x1="450" y1="65" x2="466" y2="65" stroke="var(--dg-line, #5F6368)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="466" y="50" width="52" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="492" y="68" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Trade-offs</text>
  <line x1="518" y1="65" x2="534" y2="65" stroke="var(--dg-line, #5F6368)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="330" y="95" width="120" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="390" y="113" text-anchor="middle" font-size="8.5" fill="var(--dg-ink, #202124)">Chosen design</text>
  <line x1="384" y1="80" x2="384" y2="95" stroke="var(--dg-line, #5F6368)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="460" y="95" width="120" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="520" y="113" text-anchor="middle" font-size="8.5" fill="var(--dg-ink, #202124)">Follow-up depth</text>
  <line x1="450" y1="110" x2="460" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="460" y="150" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">five longer beats</text>

  <text x="310" y="210" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">Same underlying judgment, compressed to a different scale</text>
</svg>
