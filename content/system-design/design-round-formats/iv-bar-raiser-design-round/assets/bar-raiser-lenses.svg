<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="310" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Same answer, two evaluation lenses</text>

  <rect x="240" y="45" width="140" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="310" y="73" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Candidate answer</text>

  <line x1="255" y1="91" x2="120" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="365" y1="91" x2="500" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="155" width="220" height="90" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="130" y="178" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Peer interviewer</text>
  <text x="130" y="198" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Would this work with</text>
  <text x="130" y="212" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">our specific stack and team?</text>

  <rect x="380" y="155" width="220" height="90" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="178" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Bar-raiser</text>
  <text x="490" y="198" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Does this reasoning clear</text>
  <text x="490" y="212" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">the bar for any senior hire?</text>
</svg>
