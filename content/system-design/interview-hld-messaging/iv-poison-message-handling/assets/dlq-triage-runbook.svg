<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="90" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="110" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">DLQ alert</text>
  <text x="85" y="125" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">fires</text>

  <line x1="150" y1="113" x2="195" y2="113" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="200" y="90" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="275" y="110" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">On-call inspects</text>
  <text x="275" y="125" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">DLQ payload</text>

  <line x1="350" y1="105" x2="400" y2="55" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="350" y1="122" x2="400" y2="175" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="405" y="30" width="180" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="495" y="50" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Fix and replay</text>
  <text x="495" y="65" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">republish corrected message</text>

  <rect x="405" y="150" width="180" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="495" y="170" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Discard</text>
  <text x="495" y="185" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">document why it's safe</text>

  <text x="320" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Every DLQ message ends in one of two documented outcomes — never silence.</text>
</svg>
