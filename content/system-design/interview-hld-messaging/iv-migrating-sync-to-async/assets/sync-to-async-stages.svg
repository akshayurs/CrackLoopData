<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <line x1="40" y1="130" x2="600" y2="130" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="100" cy="130" r="6" fill="var(--dg-accent, #0C8F88)"/>
  <rect x="30" y="50" width="140" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="100" y="72" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Dual path</text>
  <text x="100" y="88" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">sync call + shadow</text>
  <text x="100" y="100" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">event consumer</text>

  <circle cx="320" cy="130" r="6" fill="var(--dg-accent, #0C8F88)"/>
  <rect x="250" y="150" width="140" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="320" y="172" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Cutover</text>
  <text x="320" y="188" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">event becomes primary,</text>
  <text x="320" y="200" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">sync kept idle 1 release</text>

  <circle cx="540" cy="130" r="6" fill="var(--dg-accent, #0C8F88)"/>
  <rect x="470" y="50" width="140" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4,3"/>
  <text x="540" y="72" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Sync deleted</text>
  <text x="540" y="88" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">endpoint removed</text>

  <text x="320" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The sync endpoint stays alive one release past cutover as a rollback option.</text>
</svg>
