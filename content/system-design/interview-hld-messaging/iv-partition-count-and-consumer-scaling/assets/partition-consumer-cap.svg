<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">10-partition topic, 30 pods</text>

  <text x="30" y="52" font-size="11" fill="var(--dg-muted, #5F6368)">Partitions</text>
  <text x="30" y="140" font-size="11" fill="var(--dg-muted, #5F6368)">Pods</text>

  <g id="active">
    <rect x="90" y="35" width="45" height="30" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="150" y="35" width="45" height="30" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="210" y="35" width="45" height="30" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="290" y="55" font-size="12" fill="var(--dg-muted, #5F6368)">... 10 total</text>
  </g>

  <line x1="112" y1="65" x2="112" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="172" y1="65" x2="172" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="232" y1="65" x2="232" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="90" y="105" width="45" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <rect x="150" y="105" width="45" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <rect x="210" y="105" width="45" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="290" y="125" font-size="12" fill="var(--dg-muted, #5F6368)">... 10 mapped</text>

  <rect x="380" y="105" width="45" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4,3" opacity="0.5"/>
  <rect x="435" y="105" width="45" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4,3" opacity="0.5"/>
  <rect x="490" y="105" width="45" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="580" y="125" font-size="12" fill="var(--dg-muted, #5F6368)">... 20 idle</text>

  <text x="440" y="175" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">No partition to attach to</text>

  <text x="320" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">One consumer group reads at most one consumer per partition — the 10th pod caps parallelism.</text>
</svg>
