<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <line x1="60" y1="190" x2="60" y2="30" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="60" y1="190" x2="600" y2="190" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="20" y="80" font-size="10" fill="var(--dg-muted, #5F6368)">depth</text>

  <line x1="60" y1="120" x2="600" y2="120" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="5,4"/>
  <text x="605" y="124" font-size="10" fill="var(--dg-muted, #5F6368)">10,000</text>

  <line x1="60" y1="60" x2="600" y2="60" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="5,4"/>
  <text x="605" y="64" font-size="10" fill="var(--dg-muted, #5F6368)">50,000</text>

  <rect x="120" y="80" width="160" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="200" y="99" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Autoscale</text>
  <text x="200" y="111" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">5 -&gt; 20 pods</text>

  <rect x="340" y="20" width="200" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4,3"/>
  <text x="440" y="39" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Shed oldest-first</text>
  <text x="440" y="51" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">fallback</text>

  <text x="320" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Scale first while it still works; shed only once scaling alone can't keep up.</text>
</svg>
