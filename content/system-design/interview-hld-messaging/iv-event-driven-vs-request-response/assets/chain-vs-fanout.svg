<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="150" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Synchronous chain</text>
  <text x="480" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Event fan-out</text>

  <rect x="20" y="45" width="80" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="60" y="67" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Checkout</text>
  <line x1="100" y1="63" x2="130" y2="63" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="135" y="45" width="90" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="180" y="67" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Fraud-check</text>
  <line x1="225" y1="63" x2="255" y2="63" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="260" y="45" width="80" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="300" y="67" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">3rd service</text>
  <text x="180" y="100" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">each waits on the previous</text>

  <rect x="440" y="45" width="90" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="485" y="67" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">order.placed</text>

  <line x1="485" y1="81" x2="400" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="485" y1="81" x2="460" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="485" y1="81" x2="520" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="485" y1="81" x2="580" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="360" y="145" width="80" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="400" y="166" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Billing</text>
  <rect x="425" y="145" width="80" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="465" y="166" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Shipping</text>
  <rect x="490" y="145" width="80" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="530" y="166" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Analytics</text>
  <rect x="555" y="145" width="70" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="590" y="166" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Fraud</text>

  <text x="480" y="200" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">no chain, no waiting</text>

  <text x="320" y="235" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The chain breaks at any link; the fan-out has no subscriber depending on another.</text>
</svg>
