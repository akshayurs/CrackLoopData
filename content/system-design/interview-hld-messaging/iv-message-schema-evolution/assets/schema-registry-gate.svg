<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="90" width="110" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="75" y="114" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Producer</text>
  <line x1="130" y1="110" x2="195" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="200" y="70" width="160" height="80" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="280" y="95" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Schema registry</text>
  <text x="280" y="112" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">checks compatibility</text>
  <text x="280" y="127" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">before publish</text>

  <line x1="360" y1="90" x2="420" y2="55" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="425" y="30" width="180" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="515" y="48" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Additive change</text>
  <text x="515" y="62" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">accepted</text>

  <line x1="360" y1="130" x2="420" y2="165" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="425" y="150" width="180" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4,3"/>
  <text x="515" y="168" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Field removed</text>
  <text x="515" y="182" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">rejected</text>

  <text x="320" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A breaking change is caught at deploy time, not by every consumer at runtime days later.</text>
</svg>
