<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="30" width="100" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="70" y="52" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Producer</text>
  <line x1="120" y1="48" x2="220" y2="48" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="225" y="30" width="100" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="275" y="52" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Broker</text>
  <line x1="325" y1="48" x2="425" y2="48" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="430" y="30" width="100" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="480" y="52" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Consumer</text>

  <text x="170" y="90" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Gap 1: producer-to-broker</text>
  <text x="170" y="104" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">closed by acks=all</text>

  <text x="275" y="140" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Gap 2: broker replication</text>
  <text x="275" y="154" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">sync replication to ISRs</text>

  <text x="480" y="90" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Gap 3: consumer processing</text>
  <text x="480" y="104" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">ack-after-persist</text>

  <text x="320" y="215" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each gap is closed by a distinct, separately-configured setting — no single flag closes all three.</text>
</svg>
