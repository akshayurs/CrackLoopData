<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="40" y="120" width="360" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="220" y="140" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">At-least-once delivery</text>
  <text x="220" y="155" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">broker retries/redelivers</text>

  <rect x="40" y="60" width="360" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="220" y="80" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Idempotent consumer</text>
  <text x="220" y="95" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">dedup key check</text>

  <line x1="405" y1="90" x2="450" y2="90" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="455" y="65" width="150" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="530" y="85" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Effectively-once</text>
  <text x="530" y="100" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">outcome</text>

  <text x="220" y="195" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Delivery alone duplicates side effects; idempotency alone has nothing to guard.</text>
</svg>
