<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="230" y="30" width="180" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="52" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">order_placed</text>

  <line x1="280" y1="64" x2="120" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="320" y1="64" x2="320" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="360" y1="64" x2="520" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="40" y="125" width="160" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="120" y="145" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Billing</text>
  <text x="120" y="160" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">own offset</text>

  <rect x="240" y="125" width="160" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="320" y="145" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Shipping</text>
  <text x="320" y="160" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">own offset</text>

  <rect x="440" y="125" width="160" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="520" y="145" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Analytics</text>
  <text x="520" y="160" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">own offset</text>

  <text x="320" y="205" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each subscriber reads at its own pace; none wait on or interfere with the others.</text>
</svg>
