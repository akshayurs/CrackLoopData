<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="30" width="130" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="56" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Kafka events</text>

  <line x1="150" y1="51" x2="195" y2="51" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="200" y="30" width="150" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="275" y="56" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Shadow table</text>

  <rect x="200" y="120" width="150" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="275" y="146" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Production table</text>

  <line x1="275" y1="72" x2="275" y2="200" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="275" y1="120" x2="275" y2="72" stroke="transparent"/>

  <rect x="360" y="75" width="120" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="420" y="101" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Diff row-by-row</text>

  <line x1="350" y1="51" x2="380" y2="80" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="141" x2="380" y2="112" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="480" y1="96" x2="530" y2="96" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="535" y="75" width="90" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="580" y="97" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Promote</text>
  <text x="580" y="111" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">if clean</text>

  <text x="320" y="225" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Promotion only happens after the diff confirms shadow output matches live output.</text>
</svg>
