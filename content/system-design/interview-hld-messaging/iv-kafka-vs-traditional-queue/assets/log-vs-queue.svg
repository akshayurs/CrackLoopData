<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="150" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Kafka topic (log)</text>
  <text x="480" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">SQS queue</text>

  <rect x="30" y="40" width="240" height="30" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="150" y="60" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">m1 m2 m3 m4 m5 m6 m7 m8</text>

  <text x="20" y="95" font-size="10" fill="var(--dg-muted, #5F6368)">billing</text>
  <circle cx="65" cy="55" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <line x1="65" y1="60" x2="65" y2="95" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3,3"/>

  <text x="20" y="118" font-size="10" fill="var(--dg-muted, #5F6368)">shipping</text>
  <circle cx="130" cy="55" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <line x1="130" y1="60" x2="130" y2="118" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3,3"/>

  <text x="20" y="141" font-size="10" fill="var(--dg-muted, #5F6368)">analytics</text>
  <circle cx="195" cy="55" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <line x1="195" y1="60" x2="195" y2="141" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3,3"/>

  <text x="150" y="165" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">each group keeps its own offset; log stays put</text>

  <rect x="380" y="40" width="240" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="440" y="60" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">m4 m5 m6</text>
  <text x="560" y="60" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" opacity="0.5">m1 m2 m3 gone</text>

  <rect x="440" y="95" width="120" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="500" y="115" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">consumer pool</text>
  <line x1="500" y1="70" x2="500" y2="95" stroke="var(--dg-line, #5F6368)"/>

  <text x="480" y="165" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">acked message vanishes for everyone</text>

  <text x="320" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The log staying put versus messages vanishing is the entire model difference.</text>
</svg>
