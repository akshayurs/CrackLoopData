<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="30" y="30" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="90" y="51" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">user 42 events</text>
  <line x1="150" y1="47" x2="185" y2="47" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="167" y="40" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">hash</text>

  <rect x="190" y="90" width="200" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="290" y="108" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Partition 3</text>
  <text x="290" y="122" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">debited -&gt; credited (in order)</text>

  <rect x="30" y="150" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="90" y="171" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">other users</text>
  <line x1="150" y1="167" x2="185" y2="167" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="190" y="150" width="90" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="235" y="171" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Partition 1</text>
  <rect x="300" y="150" width="90" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="345" y="171" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Partition 2</text>
  <text x="450" y="171" font-size="9" fill="var(--dg-muted, #5F6368)">... processed in parallel</text>

  <text x="320" y="225" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Hashing by user_id keeps one user's events ordered while others fan out in parallel.</text>
</svg>
