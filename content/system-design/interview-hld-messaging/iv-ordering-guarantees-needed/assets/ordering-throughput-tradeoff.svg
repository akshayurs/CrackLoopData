<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="150" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">1 partition</text>
  <text x="480" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">50 partitions (keyed)</text>

  <rect x="50" y="45" width="200" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="150" y="66" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">totally ordered</text>

  <rect x="90" y="95" width="120" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="150" y="114" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">1 consumer</text>

  <text x="150" y="150" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">low throughput</text>

  <rect x="380" y="45" width="240" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="500" y="66" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">per-key ordered</text>

  <rect x="390" y="95" width="60" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <rect x="460" y="95" width="60" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <rect x="530" y="95" width="60" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="500" y="140" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">up to 50 consumers</text>

  <text x="500" y="160" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">high throughput</text>

  <text x="320" y="210" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">50 partitions keeps the same per-key ordering guarantee at a fraction of the cost.</text>
</svg>
