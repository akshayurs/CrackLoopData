<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">DRY as a spectrum, not a switch</text>

  <line x1="60" y1="140" x2="580" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="50" width="130" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="125" y="72" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">block A</text>
  <text x="125" y="86" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">block B (~A)</text>
  <text x="125" y="100" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">block C (~A)</text>
  <text x="125" y="160" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">duplication</text>

  <rect x="255" y="115" width="130" height="50" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="136" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">one clear</text>
  <text x="320" y="150" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">abstraction</text>
  <text x="320" y="195" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">for one real shared rule</text>

  <rect x="450" y="50" width="130" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="515" y="72" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">one function</text>
  <text x="515" y="86" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">if (flagA) ...</text>
  <text x="515" y="100" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">if (flagB) ...</text>
  <text x="515" y="160" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">premature abstraction</text>

  <text x="320" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Both ends are failure modes; the target is the narrow zone in the middle.</text>
</svg>
