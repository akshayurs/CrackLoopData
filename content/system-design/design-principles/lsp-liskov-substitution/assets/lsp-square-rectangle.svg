<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Same client, different outcome</text>

  <rect x="230" y="50" width="180" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="72" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">client function</text>
  <text x="320" y="88" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">setWidth, setHeight, assert area</text>

  <line x1="270" y1="106" x2="180" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="370" y1="106" x2="460" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="80" y="150" width="150" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="155" y="172" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Rectangle</text>
  <text x="155" y="188" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">assertion passes</text>

  <rect x="400" y="150" width="150" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="475" y="172" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Square</text>
  <text x="475" y="188" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">assertion fails</text>

  <text x="320" y="234" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Substituting Square for Rectangle flips the same call sequence from</text>
  <text x="320" y="250" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">passing to failing — setWidth silently changed the height too.</text>
</svg>
