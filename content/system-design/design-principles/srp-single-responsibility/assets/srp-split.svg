<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="160" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">god class</text>
  <text x="480" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">one class per stakeholder</text>
  <line x1="320" y1="10" x2="320" y2="290" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>

  <rect x="60" y="110" width="200" height="130" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="128" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">InvoiceService</text>
  <text x="160" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Pricing Rules</text>
  <text x="160" y="170" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Database Access</text>
  <text x="160" y="190" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Email Formatting</text>

  <text x="30" y="150" font-size="9" fill="var(--dg-muted, #5F6368)">Finance</text>
  <line x1="55" y1="146" x2="60" y2="146" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="30" y="170" font-size="9" fill="var(--dg-muted, #5F6368)">DBA</text>
  <line x1="55" y1="166" x2="60" y2="166" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="30" y="190" font-size="9" fill="var(--dg-muted, #5F6368)">Marketing</text>
  <line x1="55" y1="186" x2="60" y2="186" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="400" y="70" width="150" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="475" y="94" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">InvoicePricer</text>
  <text x="370" y="94" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Finance</text>
  <line x1="395" y1="90" x2="400" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="400" y="130" width="150" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="475" y="154" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">InvoiceRepository</text>
  <text x="370" y="154" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">DBA</text>
  <line x1="395" y1="150" x2="400" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="400" y="190" width="150" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="475" y="214" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">InvoiceMailer</text>
  <text x="370" y="214" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Marketing</text>
  <line x1="395" y1="210" x2="400" y2="210" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="320" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each stakeholder gets exactly one class to own — no cross-team edits.</text>
</svg>
