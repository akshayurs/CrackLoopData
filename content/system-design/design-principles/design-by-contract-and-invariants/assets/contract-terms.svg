<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Precondition, postcondition, invariant</text>

  <rect x="30" y="70" width="4" height="130" fill="none"/>
  <rect x="20" y="80" width="600" height="110" rx="10" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3"/>
  <text x="320" y="98" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">invariant: balance &gt;= 0, always true before and after</text>

  <rect x="260" y="120" width="120" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="148" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">withdraw(amount)</text>

  <line x1="60" y1="143" x2="255" y2="143" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="155" y="120" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">precondition:</text>
  <text x="155" y="132" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">amount &gt; 0 and amount &lt;= balance</text>

  <line x1="385" y1="143" x2="585" y2="143" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="485" y="120" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">postcondition:</text>
  <text x="485" y="132" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">balance decreases by exactly amount</text>

  <text x="320" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Caller satisfies the precondition; the method keeps the postcondition and the invariant.</text>
</svg>
