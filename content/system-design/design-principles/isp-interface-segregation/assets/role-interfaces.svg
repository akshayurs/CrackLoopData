<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="160" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">one fat interface</text>
  <text x="480" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">segregated role interfaces</text>
  <line x1="320" y1="10" x2="320" y2="290" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>

  <rect x="70" y="46" width="180" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="66" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Worker</text>
  <text x="160" y="82" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">work(), eat(), sleep()</text>

  <line x1="120" y1="106" x2="120" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="200" y1="106" x2="200" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="60" y="150" width="120" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="120" y="175" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Human</text>

  <rect x="160" y="150" width="120" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="220" y="170" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Robot</text>
  <text x="220" y="184" text-anchor="middle" font-size="8" fill="var(--dg-accent, #0C8F88)">eat/sleep forced no-op</text>

  <rect x="400" y="46" width="90" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="445" y="66" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Workable</text>
  <rect x="500" y="46" width="90" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="545" y="66" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Eatable</text>
  <rect x="600" y="46" width="35" height="30" rx="6" fill="none" opacity="0"/>
  <rect x="450" y="86" width="90" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="495" y="106" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Sleepable</text>

  <line x1="445" y1="76" x2="445" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="495" y1="116" x2="480" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="545" y1="76" x2="500" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="445" y1="76" x2="560" y2="192" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="410" y="150" width="100" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="460" y="175" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Human</text>
  <text x="460" y="212" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">implements all three</text>

  <rect x="520" y="150" width="100" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="570" y="175" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Robot</text>
  <text x="570" y="212" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">implements Workable only</text>

  <text x="320" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Robot never implements Eatable or Sleepable — no forced no-op methods.</text>
</svg>
