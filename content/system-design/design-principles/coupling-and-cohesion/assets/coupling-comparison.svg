<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="160" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">tightly coupled</text>
  <text x="480" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">loosely coupled</text>
  <line x1="320" y1="10" x2="320" y2="250" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>

  <rect x="60" y="100" width="100" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="134" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Module A</text>
  <rect x="220" y="100" width="100" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="270" y="134" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Module B</text>

  <line x1="160" y1="112" x2="220" y2="112" stroke="var(--dg-line, #5F6368)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="160" y1="130" x2="220" y2="130" stroke="var(--dg-line, #5F6368)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="160" y1="148" x2="220" y2="148" stroke="var(--dg-line, #5F6368)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="190" y="185" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">reaches into internals</text>

  <rect x="400" y="100" width="90" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="445" y="134" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Module A</text>
  <rect x="550" y="100" width="90" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="595" y="134" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Module B</text>

  <rect x="495" y="118" width="50" height="24" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="520" y="134" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">interface</text>

  <line x1="490" y1="130" x2="495" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="545" y1="130" x2="550" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="320" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Tight coupling ripples changes through every direct connection.</text>
</svg>
