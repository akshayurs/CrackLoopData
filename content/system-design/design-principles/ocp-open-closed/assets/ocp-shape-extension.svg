<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Open for extension, closed for modification</text>

  <rect x="250" y="46" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="70" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Shape</text>
  <text x="320" y="83" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">area()</text>

  <line x1="150" y1="150" x2="290" y2="98" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="320" y1="150" x2="320" y2="98" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="490" y1="150" x2="350" y2="98" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <rect x="80" y="150" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="176" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Circle</text>

  <rect x="250" y="150" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="176" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Rectangle</text>

  <rect x="420" y="150" width="140" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="490" y="176" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Triangle</text>
  <text x="490" y="205" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">added later, no edits above</text>

  <text x="320" y="250" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Triangle plugs into the same contract without touching Shape, Circle, or Rectangle.</text>
</svg>
