<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="160" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">naive: high-level depends on low-level</text>
  <text x="480" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">inverted: both depend on the abstraction</text>
  <line x1="320" y1="10" x2="320" y2="290" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>

  <rect x="90" y="60" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="165" y="87" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">OrderService</text>

  <line x1="165" y1="106" x2="165" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="60" y="150" width="210" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="165" y="177" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">MySqlOrderRepository</text>

  <text x="165" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">business logic's stability</text>
  <text x="165" y="256" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">depends on the database layer</text>

  <rect x="410" y="60" width="130" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="475" y="85" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">OrderService</text>

  <rect x="410" y="180" width="130" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="475" y="205" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">MySqlOrderRepository</text>

  <rect x="415" y="122" width="120" height="36" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="475" y="145" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">OrderRepository</text>

  <line x1="475" y1="102" x2="475" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="475" y1="180" x2="475" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="475" y="255" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">both depend on the interface;</text>
  <text x="475" y="271" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">swap the implementation freely</text>
</svg>
