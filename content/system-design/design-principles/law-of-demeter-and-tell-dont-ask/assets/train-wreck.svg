<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="160" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">train wreck: 4 objects of knowledge</text>
  <text x="480" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">tell, don't ask</text>
  <line x1="320" y1="10" x2="320" y2="250" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>

  <text x="30" y="90" font-size="11" fill="var(--dg-ink, #202124)">caller</text>
  <line x1="60" y1="86" x2="90" y2="86" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="90" y="66" width="50" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="115" y="90" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Order</text>

  <line x1="140" y1="86" x2="170" y2="86" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="170" y="66" width="60" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="200" y="90" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Customer</text>

  <line x1="230" y1="86" x2="250" y2="86" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="250" y="66" width="55" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="277" y="90" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Address</text>

  <line x1="305" y1="86" x2="322" y2="86" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="330" y="90" font-size="9" fill="var(--dg-ink, #202124)">Country</text>
  <text x="30" y="130" font-size="10" fill="var(--dg-muted, #5F6368)">.getTaxRate() at the end</text>

  <text x="440" y="86" font-size="11" fill="var(--dg-ink, #202124)">caller</text>
  <line x1="470" y1="82" x2="500" y2="82" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="500" y="62" width="90" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="545" y="86" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Order.getTaxRate()</text>

  <path d="M545,102 C 545,130 590,140 590,170 C 590,190 560,195 545,190" fill="none" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3 2"/>
  <text x="545" y="215" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Order privately delegates</text>
  <text x="545" y="228" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">to Customer, Address, Country</text>

  <text x="160" y="230" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">caller must know all 4 objects</text>
</svg>
