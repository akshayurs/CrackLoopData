<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="250" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Storage estimate, line by line</text>

  <rect x="90" y="42" width="320" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="70" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">record size: 200 bytes</text>

  <line x1="250" y1="88" x2="250" y2="124" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270" y="110" font-size="10" fill="var(--dg-muted, #5F6368)">x 2 billion records</text>

  <rect x="90" y="126" width="320" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="154" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">raw total: 400 GB</text>

  <line x1="250" y1="172" x2="250" y2="208" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="194" font-size="10" fill="var(--dg-muted, #5F6368)">x 3 replication</text>

  <rect x="90" y="210" width="320" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="238" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">replicated total: 1.2 TB</text>

  <line x1="250" y1="256" x2="250" y2="292" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="90" y="294" width="320" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="250" y="324" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="700">final footprint: 1.2 TB</text>

  <text x="250" y="374" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each step and multiplier is visible — an auditable estimate, not one opaque number.</text>
</svg>
