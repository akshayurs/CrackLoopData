<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">24-hour traffic curve</text>

  <line x1="60" y1="40" x2="60" y2="300" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <line x1="60" y1="300" x2="660" y2="300" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="10" y="45" font-size="10" fill="var(--dg-muted, #5F6368)">QPS</text>

  <text x="60" y="316" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">0h</text>
  <text x="210" y="316" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">6h</text>
  <text x="360" y="316" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">12h</text>
  <text x="510" y="316" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">18h</text>
  <text x="660" y="316" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">24h</text>

  <path d="M60,150 L110,190 L135,260 L185,255 L260,180 L360,140 L435,120 L535,60 L560,55 L585,65 L660,150 L660,300 L60,300 Z"
        fill="var(--dg-accent-bg, #E3F3F1)" stroke="none"/>
  <path d="M60,150 L110,190 L135,260 L185,255 L260,180 L360,140 L435,120 L535,60 L560,55 L585,65 L660,150"
        fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>

  <line x1="60" y1="170" x2="660" y2="170" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="666" y="174" font-size="10" fill="var(--dg-muted, #5F6368)">average</text>

  <text x="135" y="275" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">trough</text>
  <text x="560" y="45" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">peak</text>

  <line x1="500" y1="62" x2="500" y2="168" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="168" x2="500" y2="62" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="380" y="205" width="160" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <text x="460" y="221" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">peak-to-average ratio</text>
  <text x="460" y="236" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">roughly 2.5-3x here</text>

  <text x="350" y="350" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Average is what your math produces; peak is what determines whether the system falls over.</text>
</svg>
