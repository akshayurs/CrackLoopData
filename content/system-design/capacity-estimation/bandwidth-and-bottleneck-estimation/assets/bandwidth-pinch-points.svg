<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Where bandwidth actually pinches</text>

  <path d="M40,80 L120,80 L140,100 L180,100 L200,80 L320,80 L340,100 L380,100 L400,80 L520,80 L540,100 L580,100 L600,80 L660,80
           L660,140 L600,140 L580,120 L540,120 L520,140 L400,140 L380,120 L340,120 L320,140 L200,140 L180,120 L140,120 L120,140 L40,140 Z"
        fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <rect x="140" y="100" width="40" height="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="340" y="100" width="40" height="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="540" y="100" width="40" height="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="3,2"/>

  <text x="10" y="114" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Client</text>
  <text x="670" y="114" text-anchor="end" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">DB</text>

  <text x="160" y="175" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">last-mile link</text>
  <text x="160" y="190" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">rarely the bottleneck</text>

  <text x="360" y="175" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">load balancer NIC</text>
  <text x="360" y="190" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">fixed cap, all traffic funnels here</text>

  <text x="560" y="175" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">replication link</text>
  <text x="560" y="190" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">between DB nodes</text>

  <text x="350" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Check all three separately — the tightest pinch, not the average, sets your ceiling.</text>
</svg>
