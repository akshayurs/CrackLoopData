<svg viewBox="0 0 620 440" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="310" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Latency numbers ladder</text>

  <line x1="60" y1="50" x2="60" y2="400" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <rect x="60" y="370" width="60" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="130" y="390" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">L1 cache reference — ~1 ns</text>

  <rect x="60" y="310" width="90" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="330" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">main memory — ~100 ns</text>
  <text x="160" y="345" font-size="9" fill="var(--dg-muted, #5F6368)">~100x over L1</text>

  <rect x="60" y="250" width="150" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="220" y="270" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">random SSD read — ~100 µs</text>
  <text x="220" y="285" font-size="9" fill="var(--dg-muted, #5F6368)">~1,000x over memory</text>

  <rect x="60" y="190" width="220" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="290" y="210" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">same-datacenter round trip — ~0.5 ms</text>
  <text x="290" y="225" font-size="9" fill="var(--dg-muted, #5F6368)">~5x over SSD</text>

  <rect x="60" y="130" width="280" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="350" y="150" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">disk seek — ~10 ms</text>
  <text x="350" y="165" font-size="9" fill="var(--dg-muted, #5F6368)">~20x over same-DC round trip</text>

  <rect x="60" y="70" width="340" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="410" y="90" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">cross-region round trip — ~150 ms</text>
  <text x="410" y="105" font-size="9" fill="var(--dg-muted, #5F6368)">~300x over same-DC round trip</text>

  <text x="310" y="425" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The jumps matter more than the absolute values — each rung is where a design's latency budget gets spent.</text>
</svg>
