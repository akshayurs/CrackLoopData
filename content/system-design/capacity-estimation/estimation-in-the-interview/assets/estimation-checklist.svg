<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">The estimation checklist</text>

  <circle cx="655" cy="24" r="16" fill="none" stroke="var(--dg-muted, #5F6368)" stroke-width="1.5"/>
  <line x1="655" y1="24" x2="655" y2="14" stroke="var(--dg-muted, #5F6368)" stroke-width="1.5"/>
  <line x1="655" y1="24" x2="662" y2="28" stroke="var(--dg-muted, #5F6368)" stroke-width="1.5"/>
  <text x="655" y="52" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">~5 min</text>

  <g>
    <rect x="22" y="70" width="155" height="90" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <path d="M34,84 L38,88 L46,78" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="99" y="112" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Traffic</text>
    <text x="99" y="130" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">DAU -&gt; QPS</text>
    <text x="99" y="143" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">(avg + peak)</text>
  </g>

  <line x1="177" y1="115" x2="187" y2="115" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="189" y="70" width="155" height="90" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <path d="M201,84 L205,88 L213,78" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="266" y="112" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Storage</text>
    <text x="266" y="130" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">record size -&gt; total</text>
    <text x="266" y="143" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">-&gt; overhead</text>
  </g>

  <line x1="344" y1="115" x2="354" y2="115" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="356" y="70" width="155" height="90" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <path d="M368,84 L372,88 L380,78" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="433" y="112" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Bandwidth</text>
    <text x="433" y="130" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">QPS x payload</text>
    <text x="433" y="143" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">-&gt; Gbps</text>
  </g>

  <line x1="511" y1="115" x2="521" y2="115" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="523" y="70" width="155" height="90" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <path d="M535,84 L539,88 L547,78" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="600" y="112" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Servers</text>
    <text x="600" y="130" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">binding resource</text>
    <text x="600" y="143" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">-&gt; count</text>
  </g>

  <text x="350" y="195" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Narrate through this checklist — one or two sentences plus one line of arithmetic per box.</text>
</svg>
