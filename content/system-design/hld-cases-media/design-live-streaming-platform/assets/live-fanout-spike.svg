<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="380" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Fan-out tree during a viewer spike</text>

  <rect x="10" y="120" width="90" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="55" y="144" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">1 ingest</text>

  <line x1="100" y1="140" x2="150" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="100" y1="140" x2="150" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="100" y1="140" x2="150" y2="190" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="150" y="70" width="120" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="210" y="93" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Regional node</text>
  <rect x="150" y="122" width="120" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="210" y="145" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Regional node</text>
  <rect x="150" y="174" width="120" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="210" y="197" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Regional node</text>

  <g stroke="var(--dg-line, #5F6368)" fill="none">
    <path d="M270,88 L340,40" marker-end="url(#arrow)"/>
    <path d="M270,88 L340,90" marker-end="url(#arrow)"/>
    <path d="M270,140 L340,140" marker-end="url(#arrow)"/>
    <path d="M270,140 L340,190" marker-end="url(#arrow)"/>
    <path d="M270,192 L340,240" marker-end="url(#arrow)"/>
    <path d="M270,192 L340,290" marker-end="url(#arrow)"/>
  </g>

  <g fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)">
    <circle cx="350" cy="30" r="10"/>
    <circle cx="350" cy="90" r="10"/>
    <circle cx="350" cy="140" r="10"/>
    <circle cx="350" cy="190" r="10"/>
    <circle cx="350" cy="240" r="10"/>
    <circle cx="350" cy="285" r="10"/>
  </g>
  <text x="350" y="12" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">edge nodes -&gt; many viewers each</text>

  <rect x="420" y="30" width="330" height="140" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3"/>
  <text x="435" y="50" font-size="11" fill="var(--dg-muted, #5F6368)">callout: same tree later</text>
  <text x="440" y="72" font-size="10" fill="var(--dg-ink, #202124)">Viewers: 1,000 -&gt; 100,000</text>
  <g stroke="var(--dg-line, #5F6368)" fill="none">
    <path d="M440,110 L470,90" marker-end="url(#arrow)"/>
    <path d="M440,110 L470,110" marker-end="url(#arrow)"/>
    <path d="M440,110 L470,130" marker-end="url(#arrow)"/>
  </g>
  <g fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)">
    <circle cx="480" cy="80" r="7"/><circle cx="500" cy="75" r="7"/><circle cx="520" cy="82" r="7"/>
    <circle cx="480" cy="105" r="7"/><circle cx="500" cy="100" r="7"/><circle cx="520" cy="108" r="7"/><circle cx="540" cy="100" r="7"/>
    <circle cx="480" cy="130" r="7"/><circle cx="500" cy="135" r="7"/><circle cx="520" cy="128" r="7"/><circle cx="540" cy="135" r="7"/><circle cx="560" cy="125" r="7"/>
  </g>
  <text x="585" y="112" font-size="10" fill="var(--dg-ink, #202124)">much wider</text>
  <text x="585" y="126" font-size="10" fill="var(--dg-ink, #202124)">fan-out</text>

  <text x="585" y="270" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Tree must scale in minutes, not the ingest stream</text>
</svg>
