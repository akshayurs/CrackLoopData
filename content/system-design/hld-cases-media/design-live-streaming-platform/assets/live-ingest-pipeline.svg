<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="400" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Ingest to viewer, hop by hop</text>

  <rect x="10" y="60" width="100" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="90" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Encoder</text>

  <line x1="110" y1="85" x2="150" y2="85" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="130" y="72" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">~200ms</text>

  <rect x="150" y="60" width="110" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="205" y="90" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Ingest endpoint</text>

  <line x1="260" y1="85" x2="300" y2="85" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="280" y="72" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">~500ms</text>

  <rect x="300" y="45" width="130" height="80" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="365" y="68" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Real-time</text>
  <text x="365" y="83" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">transcode</text>
  <text x="365" y="100" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">rendition ladder</text>

  <line x1="365" y1="125" x2="365" y2="150" stroke="var(--dg-line, #5F6368)"/>
  <line x1="330" y1="150" x2="400" y2="150" stroke="var(--dg-line, #5F6368)"/>
  <line x1="330" y1="150" x2="330" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="365" y1="150" x2="365" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="400" y1="150" x2="400" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="305" y="160" width="45" height="24" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="327" y="176" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">1080p</text>
  <rect x="343" y="160" width="45" height="24" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="365" y="176" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">720p</text>
  <rect x="381" y="160" width="45" height="24" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="403" y="176" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">480p</text>

  <line x1="430" y1="85" x2="470" y2="85" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="450" y="72" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">~1-2s</text>

  <rect x="470" y="60" width="130" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="535" y="90" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Low-latency CDN</text>

  <line x1="600" y1="85" x2="650" y2="85" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <circle cx="680" cy="70" r="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <circle cx="710" cy="85" r="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <circle cx="680" cy="100" r="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="695" y="128" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">many viewers</text>

  <rect x="150" y="200" width="480" height="36" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="390" y="223" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Total end-to-end latency = sum of every hop's delay</text>
</svg>
