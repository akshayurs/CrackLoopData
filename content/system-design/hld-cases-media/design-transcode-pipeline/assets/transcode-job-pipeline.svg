<svg viewBox="0 0 780 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="390" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Job pipeline: upload to status update</text>

  <rect x="10" y="70" width="90" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="55" y="96" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Upload event</text>

  <line x1="100" y1="92" x2="135" y2="92" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="135" y="70" width="90" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="180" y="96" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Job created</text>

  <line x1="225" y1="92" x2="260" y2="92" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="260" y="70" width="90" height="44" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="305" y="90" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Queue</text>
  <text x="305" y="104" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">per job type</text>

  <line x1="350" y1="92" x2="385" y2="92" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="385" y="70" width="100" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="435" y="96" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Worker pool</text>

  <line x1="485" y1="92" x2="520" y2="92" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="520" y="70" width="100" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="570" y="96" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Output storage</text>

  <line x1="435" y1="114" x2="435" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="360" y="150" width="150" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="435" y="174" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Job-state table</text>

  <line x1="510" y1="170" x2="640" y2="170" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="640" y="150" width="120" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="700" y="167" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Status update /</text>
  <text x="700" y="180" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">webhook</text>

  <text x="640" y="55" font-size="10" fill="var(--dg-muted, #5F6368)">every arrow after Queue can fail independently</text>
</svg>
