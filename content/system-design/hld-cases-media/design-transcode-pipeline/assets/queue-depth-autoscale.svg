<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Autoscaling on queue depth</text>

  <line x1="50" y1="200" x2="620" y2="200" stroke="var(--dg-stroke, #9AA0A6)"/>
  <line x1="50" y1="200" x2="50" y2="50" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="20" y="55" font-size="9" fill="var(--dg-muted, #5F6368)">depth</text>
  <text x="600" y="215" font-size="9" fill="var(--dg-muted, #5F6368)">time</text>

  <path d="M50,190 Q150,190 220,90 Q320,60 400,90 Q500,190 620,190" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>

  <line x1="220" y1="90" x2="220" y2="215" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3 2"/>
  <text x="220" y="230" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">backlog builds</text>

  <line x1="400" y1="90" x2="400" y2="215" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3 2"/>
  <text x="400" y="230" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">backlog clears</text>

  <g font-size="9" fill="var(--dg-ink, #202124)">
    <rect x="200" y="30" width="16" height="16"/>
    <rect x="220" y="26" width="16" height="20"/>
    <rect x="240" y="22" width="16" height="24"/>
  </g>
  <text x="280" y="35" font-size="9" fill="var(--dg-muted, #5F6368)">autoscaler adds workers</text>

  <g font-size="9" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)">
    <rect x="380" y="30" width="16" height="24"/>
    <rect x="400" y="34" width="16" height="20"/>
    <rect x="420" y="38" width="16" height="16"/>
  </g>
  <text x="460" y="35" font-size="9" fill="var(--dg-muted, #5F6368)">autoscaler removes workers</text>
</svg>
