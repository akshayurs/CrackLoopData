<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Multi-CDN routing on health signals</text>

  <circle cx="60" cy="130" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="134" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Viewers</text>

  <line x1="86" y1="130" x2="150" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="150" y="100" width="140" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="220" y="126" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Routing layer</text>
  <text x="220" y="144" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">health / error rate</text>

  <line x1="290" y1="115" x2="360" y2="60" stroke="var(--dg-line, #5F6368)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="300" y="80" font-size="10" fill="var(--dg-muted, #5F6368)">most traffic (before)</text>

  <line x1="290" y1="145" x2="360" y2="200" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="300" y="185" font-size="10" fill="var(--dg-accent, #0C8F88)">shifted traffic (after)</text>

  <rect x="360" y="30" width="150" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="435" y="56" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">CDN A</text>
  <text x="435" y="74" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">elevated errors</text>

  <rect x="360" y="170" width="150" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="435" y="196" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">CDN B</text>
  <text x="435" y="214" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">healthy</text>

  <text x="580" y="55" font-size="14" fill="var(--dg-ink, #202124)">!</text>
  <circle cx="577" cy="50" r="10" fill="none" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3 2"/>

  <text x="600" y="245" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Continuous, automatic re-routing — not a manual failover</text>
</svg>
