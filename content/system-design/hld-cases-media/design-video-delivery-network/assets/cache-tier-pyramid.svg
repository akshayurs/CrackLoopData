<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Three-tier cache pyramid</text>

  <polygon points="260,40 380,40 420,100 220,100" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="65" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Origin</text>
  <text x="320" y="82" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">full catalog</text>

  <polygon points="220,100 420,100 470,180 170,180" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="135" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Regional caches</text>
  <text x="320" y="152" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">large popular subset</text>

  <polygon points="170,180 470,180 540,280 100,280" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="220" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Edge caches</text>
  <text x="320" y="238" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">many, near viewers</text>
  <text x="320" y="254" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">tiny hot subset</text>

  <text x="30" y="270" font-size="11" fill="var(--dg-ink, #202124)">Play request</text>
  <line x1="30" y1="278" x2="30" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="10" y="255" font-size="9" fill="var(--dg-accent, #0C8F88)">hit (common)</text>
  <text x="10" y="180" font-size="9" fill="var(--dg-muted, #5F6368)">miss (less common)</text>
  <text x="10" y="105" font-size="9" fill="var(--dg-muted, #5F6368)">rare, last resort</text>
</svg>
