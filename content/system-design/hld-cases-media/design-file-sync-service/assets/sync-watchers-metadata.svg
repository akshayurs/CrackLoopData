<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Watchers, metadata, and block storage</text>

  <rect x="20" y="55" width="110" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="82" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Laptop watcher</text>

  <rect x="20" y="150" width="110" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="177" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Phone watcher</text>

  <line x1="130" y1="77" x2="230" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="130" y="105" font-size="9" fill="var(--dg-muted, #5F6368)">uploadChunk / getChanges</text>
  <line x1="130" y1="172" x2="230" y2="135" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="230" y="95" width="170" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="315" y="118" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Metadata service</text>
  <text x="315" y="134" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">file-tree + version</text>
  <text x="315" y="147" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">state</text>

  <line x1="400" y1="125" x2="460" y2="125" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="420" y="115" font-size="9" fill="var(--dg-muted, #5F6368)">references</text>

  <rect x="460" y="100" width="130" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="525" y="130" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Block store</text>

  <path d="M315,95 Q315,40 130,40 L60,40" fill="none" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M315,95 Q315,220 130,220 L60,220" fill="none" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="200" y="235" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">notification: something changed -&gt; pull promptly</text>
</svg>
