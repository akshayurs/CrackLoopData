<svg viewBox="0 0 660 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Block-level diff after an edit</text>

  <text x="30" y="60" font-size="11" fill="var(--dg-muted, #5F6368)">Before</text>
  <g font-size="10" fill="var(--dg-ink, #202124)">
    <rect x="30" y="70" width="80" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="70" y="91" text-anchor="middle">B1</text>
    <rect x="110" y="70" width="80" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="150" y="91" text-anchor="middle">B2</text>
    <rect x="190" y="70" width="80" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="230" y="91" text-anchor="middle">B3</text>
    <rect x="270" y="70" width="80" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="310" y="91" text-anchor="middle">B4</text>
    <rect x="350" y="70" width="80" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="390" y="91" text-anchor="middle">B5</text>
    <rect x="430" y="70" width="80" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="470" y="91" text-anchor="middle">B6</text>
  </g>

  <line x1="330" y1="104" x2="330" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="380" y="122" font-size="9" fill="var(--dg-muted, #5F6368)">edit changes B3</text>

  <text x="30" y="155" font-size="11" fill="var(--dg-muted, #5F6368)">After (diff vs hashes)</text>
  <g font-size="10">
    <rect x="30" y="165" width="80" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" opacity="0.5"/>
    <text x="70" y="186" text-anchor="middle" fill="var(--dg-muted, #5F6368)">B1</text>
    <rect x="110" y="165" width="80" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" opacity="0.5"/>
    <text x="150" y="186" text-anchor="middle" fill="var(--dg-muted, #5F6368)">B2</text>
    <rect x="190" y="165" width="80" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
    <text x="230" y="186" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">B3</text>
    <rect x="270" y="165" width="80" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" opacity="0.5"/>
    <text x="310" y="186" text-anchor="middle" fill="var(--dg-muted, #5F6368)">B4</text>
    <rect x="350" y="165" width="80" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" opacity="0.5"/>
    <text x="390" y="186" text-anchor="middle" fill="var(--dg-muted, #5F6368)">B5</text>
    <rect x="430" y="165" width="80" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" opacity="0.5"/>
    <text x="470" y="186" text-anchor="middle" fill="var(--dg-muted, #5F6368)">B6</text>
  </g>
  <line x1="230" y1="199" x2="230" y2="215" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="540" y="186" font-size="10" fill="var(--dg-ink, #202124)">only B3 travels</text>
  <text x="540" y="200" font-size="10" fill="var(--dg-ink, #202124)">over the wire</text>
</svg>
