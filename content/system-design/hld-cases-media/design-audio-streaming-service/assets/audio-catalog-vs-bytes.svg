<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Two hops, two shapes of system</text>

  <circle cx="50" cy="130" r="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="50" y="134" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Client</text>

  <line x1="74" y1="115" x2="150" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="90" y="85" font-size="9" fill="var(--dg-muted, #5F6368)">track info query</text>

  <rect x="150" y="40" width="150" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="225" y="63" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Catalog / Metadata</text>
  <text x="225" y="80" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">backed by cache</text>
  <text x="225" y="93" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">small, hot, read-heavy</text>

  <line x1="74" y1="145" x2="150" y2="190" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="80" y="200" font-size="9" fill="var(--dg-muted, #5F6368)">signed stream URL</text>

  <rect x="150" y="160" width="150" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="225" y="183" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">CDN</text>
  <text x="225" y="200" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">fronts object store</text>

  <line x1="300" y1="190" x2="360" y2="190" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="360" y="160" width="140" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="430" y="185" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Object store</text>
  <text x="430" y="202" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">large, cold by default</text>

  <path d="M225,220 Q225,235 50,235 Q10,235 10,190 L10,155" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="120" y="232" font-size="9" fill="var(--dg-muted, #5F6368)">CDN serves audio bytes back</text>
</svg>
