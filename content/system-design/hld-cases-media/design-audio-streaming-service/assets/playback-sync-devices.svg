<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Cross-device playback sync</text>

  <rect x="30" y="50" width="110" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="70" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Phone</text>
  <text x="85" y="86" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">pauses at 1:32</text>

  <line x1="140" y1="73" x2="250" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="150" y="105" font-size="9" fill="var(--dg-muted, #5F6368)">update position</text>

  <rect x="250" y="105" width="140" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="126" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Sync service</text>
  <text x="320" y="142" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">keyed: user + track</text>

  <line x1="250" y1="140" x2="140" y2="195" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="150" y="185" font-size="9" fill="var(--dg-muted, #5F6368)">pull position</text>

  <rect x="30" y="195" width="110" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="215" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Laptop</text>
  <text x="85" y="231" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">resumes at 1:32</text>

  <rect x="420" y="120" width="180" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3"/>
  <text x="510" y="140" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">not 0:00 —</text>
  <text x="510" y="155" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">same position, new device</text>
</svg>
