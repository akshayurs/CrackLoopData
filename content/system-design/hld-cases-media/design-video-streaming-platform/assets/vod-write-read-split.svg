<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="380" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Write side vs read side</text>

  <rect x="10" y="50" width="90" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="55" y="78" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Upload</text>

  <line x1="100" y1="73" x2="140" y2="73" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="140" y="35" width="130" height="76" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="205" y="58" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Transcode</text>
  <text x="205" y="72" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">workers</text>
  <text x="205" y="90" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">-&gt; renditions</text>

  <line x1="270" y1="73" x2="310" y2="73" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="310" y="50" width="110" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="365" y="78" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Object storage</text>

  <line x1="420" y1="73" x2="460" y2="73" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="460" y="50" width="90" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="505" y="78" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">CDN edge</text>

  <line x1="550" y1="73" x2="600" y2="73" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <circle cx="630" cy="73" r="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="630" y="78" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Player</text>

  <path d="M630,93 Q560,150 300,150 Q220,150 205,111" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="420" y="145" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">manifest request</text>

  <rect x="150" y="160" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="215" y="184" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Manifest /</text>
  <text x="215" y="198" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">metadata DB</text>

  <line x1="215" y1="111" x2="215" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="240" y="135" font-size="9" fill="var(--dg-muted, #5F6368)">writes</text>

  <rect x="30" y="225" width="330" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3"/>
  <text x="195" y="242" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Write side — happens once per video</text>

  <rect x="420" y="225" width="320" height="26" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3"/>
  <text x="580" y="242" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Read side — happens on every view</text>
</svg>
