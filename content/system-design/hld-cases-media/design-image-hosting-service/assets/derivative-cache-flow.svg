<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">On-demand derivative generation</text>

  <rect x="10" y="90" width="100" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="110" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Client request</text>
  <text x="60" y="124" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">size + format</text>

  <line x1="110" y1="112" x2="150" y2="112" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="150" y="90" width="90" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="195" y="116" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">CDN</text>

  <line x1="240" y1="100" x2="290" y2="55" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
  <text x="245" y="65" font-size="9" fill="var(--dg-accent, #0C8F88)">hit -&gt; served directly</text>

  <line x1="240" y1="124" x2="290" y2="165" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="245" y="180" font-size="9" fill="var(--dg-muted, #5F6368)">miss</text>

  <rect x="290" y="140" width="140" height="70" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="360" y="160" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Origin checks</text>
  <text x="360" y="174" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">precomputed</text>
  <text x="360" y="188" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">derivative</text>

  <line x1="430" y1="175" x2="470" y2="175" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="435" y="165" font-size="9" fill="var(--dg-muted, #5F6368)">none exists</text>

  <rect x="470" y="150" width="120" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="530" y="170" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Resize + store</text>
  <text x="530" y="184" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">as new derivative</text>

  <path d="M530,150 Q530,60 300,55" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="500" y="70" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">returned, cached</text>
  <text x="500" y="84" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">next request = hit</text>
</svg>
