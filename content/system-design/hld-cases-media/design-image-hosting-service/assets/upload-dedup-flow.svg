<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Upload dedup before storage write</text>

  <rect x="10" y="90" width="90" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="55" y="116" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Upload</text>

  <line x1="100" y1="112" x2="135" y2="112" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="135" y="90" width="90" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="180" y="116" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Hash bytes</text>

  <line x1="225" y1="112" x2="260" y2="112" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="260" y="90" width="120" height="44" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="110" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Dedup check</text>
  <text x="320" y="124" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">against hash index</text>

  <line x1="380" y1="100" x2="440" y2="50" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="390" y="60" font-size="9" fill="var(--dg-muted, #5F6368)">new</text>
  <rect x="440" y="20" width="160" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="520" y="45" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Store original +</text>
  <text x="520" y="60" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">enqueue derivatives</text>

  <line x1="380" y1="124" x2="440" y2="170" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="385" y="155" font-size="9" fill="var(--dg-muted, #5F6368)">duplicate</text>
  <rect x="440" y="150" width="160" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="520" y="172" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Add reference</text>
  <text x="520" y="187" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">skip storage write</text>

  <path d="M600,50 Q650,110 600,170" fill="none" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="640" y="115" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">same content id</text>
</svg>
