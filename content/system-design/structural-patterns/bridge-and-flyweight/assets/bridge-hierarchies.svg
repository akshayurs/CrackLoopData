<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Bridge: two independent hierarchies</text>

  <rect x="60" y="50" width="150" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="135" y="74" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Shape</text>

  <line x1="135" y1="90" x2="135" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="60" y="122" width="150" height="38" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="135" y="146" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Circle</text>

  <rect x="60" y="182" width="150" height="38" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="135" y="206" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Square</text>

  <line x1="90" y1="160" x2="90" y2="182" stroke="var(--dg-line, #5F6368)"/>
  <line x1="90" y1="160" x2="180" y2="160" stroke="var(--dg-line, #5F6368)"/>

  <rect x="430" y="50" width="150" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="505" y="74" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Renderer</text>

  <line x1="505" y1="90" x2="505" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="415" y="122" width="180" height="38" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="146" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">VectorRenderer</text>

  <rect x="415" y="182" width="180" height="38" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="206" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">RasterRenderer</text>

  <line x1="450" y1="160" x2="450" y2="182" stroke="var(--dg-line, #5F6368)"/>
  <line x1="450" y1="160" x2="540" y2="160" stroke="var(--dg-line, #5F6368)"/>

  <line x1="210" y1="70" x2="425" y2="70" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="317" y="60" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">has-a</text>

  <text x="320" y="264" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The hierarchies never inherit from each other — only the has-a arrow bridges them.</text>
</svg>
