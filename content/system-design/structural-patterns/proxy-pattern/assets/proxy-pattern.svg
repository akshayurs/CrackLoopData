<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Client → Proxy → Real subject</text>

  <text x="320" y="52" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">both implement ImageLoader interface</text>

  <rect x="20" y="100" width="110" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="127" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Client</text>

  <line x1="130" y1="123" x2="200" y2="123" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="205" y="90" width="200" height="66" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="305" y="114" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">ImageLoaderProxy</text>
  <circle cx="230" cy="135" r="8" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="230" y="138" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">$</text>
  <text x="325" y="140" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">cache</text>

  <line x1="405" y1="123" x2="470" y2="123" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="475" y="100" width="145" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="547" y="127" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">RealImageLoader</text>

  <text x="305" y="185" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">implements ImageLoader</text>
  <text x="547" y="185" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">implements ImageLoader</text>

  <text x="320" y="228" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The client's arrow always points at the proxy, never at the real object directly.</text>
</svg>
