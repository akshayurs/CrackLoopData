<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Composite: a FileSystemNode tree</text>

  <rect x="255" y="42" width="130" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="65" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Folder (root)</text>
  <text x="320" y="78" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">get_size()</text>

  <line x1="290" y1="84" x2="170" y2="118" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="350" y1="84" x2="470" y2="118" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="110" y="120" width="120" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="170" y="143" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Folder A</text>
  <text x="170" y="156" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">get_size()</text>

  <rect x="410" y="120" width="120" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="470" y="143" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Folder B</text>
  <text x="470" y="156" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">get_size()</text>

  <line x1="140" y1="162" x2="70" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="190" y1="162" x2="220" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="470" y1="162" x2="470" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="20" y="202" width="100" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="224" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">File a.txt</text>
  <text x="70" y="236" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">get_size()</text>

  <rect x="170" y="202" width="100" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="220" y="224" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">File b.txt</text>
  <text x="220" y="236" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">get_size()</text>

  <rect x="420" y="202" width="100" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="470" y="224" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">File c.txt</text>
  <text x="470" y="236" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">get_size()</text>

  <text x="320" y="278" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">One call at the root fans out to every leaf; sizes sum back up the same tree.</text>
</svg>
