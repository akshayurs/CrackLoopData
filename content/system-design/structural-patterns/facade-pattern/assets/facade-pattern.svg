<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Facade over a subsystem</text>

  <rect x="30" y="130" width="90" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="156" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Client</text>

  <line x1="120" y1="151" x2="185" y2="151" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="190" y="120" width="160" height="62" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="270" y="147" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">CheckoutFacade</text>
  <text x="270" y="164" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">checkout()</text>

  <line x1="350" y1="128" x2="410" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="350" y1="142" x2="410" y2="118" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="350" y1="160" x2="410" y2="188" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="350" y1="174" x2="410" y2="236" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="415" y="42" width="180" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="67" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">InventoryService</text>

  <rect x="415" y="94" width="180" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="119" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">PaymentGateway</text>

  <rect x="415" y="166" width="180" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="191" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">ShippingCalculator</text>

  <rect x="415" y="216" width="180" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="241" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">NotificationService</text>

  <text x="320" y="292" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The client sees one box; four subsystem classes still do the specialized work behind it.</text>
</svg>
