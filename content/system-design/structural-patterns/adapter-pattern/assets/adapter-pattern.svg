<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Adapter: translating one interface into another</text>

  <rect x="15" y="100" width="110" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="127" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Client</text>

  <line x1="125" y1="123" x2="190" y2="123" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="157" y="113" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">log(msg)</text>

  <rect x="195" y="88" width="220" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="305" y="112" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">AnalyticsLoggerAdapter</text>
  <text x="305" y="128" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">implements Logger</text>
  <text x="305" y="143" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">calls writeEntry()</text>

  <line x1="415" y1="123" x2="480" y2="123" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="447" y="113" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">writeEntry()</text>

  <rect x="485" y="100" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="555" y="120" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Adaptee</text>
  <text x="555" y="135" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">analytics library</text>

  <text x="320" y="228" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Only the adapter knows both shapes exist — the adaptee never knows it's being adapted.</text>
</svg>
