<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Blast radius of a shared component</text>

  <rect x="260" y="120" width="120" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="150" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Shared component</text>

  <line x1="260" y1="130" x2="90" y2="65" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="20" y="35" width="140" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="59" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Team A</text>
  <text x="90" y="90" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">on-call burden</text>

  <line x1="380" y1="130" x2="550" y2="65" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="480" y="35" width="140" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="550" y="59" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Team B</text>
  <text x="550" y="90" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">migration effort</text>

  <line x1="320" y1="170" x2="320" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="250" y="220" width="140" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="244" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Team C</text>
  <text x="320" y="278" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">new dependency risk</text>
