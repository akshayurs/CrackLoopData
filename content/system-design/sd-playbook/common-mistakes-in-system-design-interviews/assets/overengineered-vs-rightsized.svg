<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Same requirement, two designs</text>

  <text x="160" y="46" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">Over-engineered</text>
  <rect x="40" y="56" width="60" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="75" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Shard DB</text>
  <rect x="115" y="56" width="60" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="145" y="75" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Shard DB</text>
  <rect x="190" y="56" width="60" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="220" y="75" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Shard DB</text>
  <rect x="40" y="96" width="105" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="92" y="115" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">L1 cache</text>
  <rect x="150" y="96" width="105" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="202" y="115" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">L2 cache</text>
  <rect x="80" y="136" width="150" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="155" y="155" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Message queue</text>
  <rect x="80" y="176" width="150" height="24" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="155" y="192" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">…and more layers</text>

  <line x1="320" y1="60" x2="320" y2="220" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>

  <text x="480" y="46" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">Right-sized</text>
  <rect x="420" y="70" width="120" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="480" y="92" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">API layer</text>
  <rect x="420" y="120" width="120" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="480" y="142" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Single database</text>

  <text x="320" y="245" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Both labeled with the same small-scale requirement number.</text>
  <text x="320" y="263" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Only the right-sized design actually matches it.</text>
</svg>
