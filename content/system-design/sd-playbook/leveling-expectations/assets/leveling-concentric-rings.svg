<svg viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="250" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Leveling is additive</text>

  <circle cx="250" cy="175" r="130" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="250" cy="175" r="85" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <circle cx="250" cy="175" r="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <text x="250" y="172" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Mid-level</text>
  <text x="250" y="186" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">correct core</text>

  <text x="250" y="105" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Senior</text>
  <text x="250" y="119" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">+ trade-off ownership,</text>
  <text x="250" y="130" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">failure modes</text>

  <text x="250" y="58" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Staff+</text>
  <text x="250" y="72" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">+ org judgment, cost,</text>
  <text x="250" y="83" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">migration path</text>

  <text x="250" y="300" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each ring adds judgment on top of the same correct core.</text>
</svg>
