<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Deep dive: zoom into one box</text>

  <rect x="40" y="60" width="80" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="81" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">API</text>
  <line x1="120" y1="77" x2="160" y2="77" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="160" y="60" width="90" height="34" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="205" y="81" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Datastore</text>
  <line x1="250" y1="77" x2="290" y2="77" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="290" y="60" width="80" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="330" y="81" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Cache</text>

  <line x1="205" y1="94" x2="205" y2="120" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="220" y="112" font-size="9" fill="var(--dg-muted, #5F6368)">explode</text>

  <rect x="70" y="140" width="500" height="110" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="320" y="160" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Datastore internals</text>

  <rect x="100" y="175" width="110" height="44" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="155" y="201" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Primary</text>
  <line x1="210" y1="197" x2="270" y2="197" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="270" y="175" width="110" height="44" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="325" y="201" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Replicas</text>
  <line x1="155" y1="219" x2="155" y2="235" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="440" y="175" width="110" height="44" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="495" y="195" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Write-ahead</text>
  <text x="495" y="209" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">log</text>
  <line x1="210" y1="197" x2="440" y2="197" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
</svg>
