<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Same architecture, two whiteboards</text>

  <text x="150" y="46" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">Clean</text>
  <rect x="60" y="60" width="80" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="81" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Client</text>
  <line x1="140" y1="77" x2="180" y2="77" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="180" y="60" width="80" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="220" y="81" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">API</text>
  <line x1="220" y1="94" x2="220" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="180" y="130" width="80" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="220" y="151" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">DB</text>
  <text x="150" y="195" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">consistent shapes,</text>
  <text x="150" y="210" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">labeled arrows, whitespace</text>

  <line x1="320" y1="55" x2="320" y2="230" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>

  <text x="490" y="46" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">Cluttered</text>
  <rect x="420" y="60" width="70" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="455" y="79" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Client</text>
  <rect x="460" y="75" width="70" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="495" y="94" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">API</text>
  <rect x="440" y="100" width="70" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="475" y="119" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">DB</text>
  <line x1="455" y1="90" x2="495" y2="105" stroke="var(--dg-line, #5F6368)"/>
  <line x1="495" y1="105" x2="475" y2="115" stroke="var(--dg-line, #5F6368)"/>
  <line x1="420" y1="70" x2="510" y2="120" stroke="var(--dg-line, #5F6368)"/>
  <text x="475" y="195" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">overlapping boxes,</text>
  <text x="475" y="210" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">unlabeled lines, no convention</text>
</svg>
