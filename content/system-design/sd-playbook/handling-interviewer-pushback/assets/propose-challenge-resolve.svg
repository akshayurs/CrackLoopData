<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Pushback exchange</text>

  <rect x="20" y="60" width="150" height="56" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="95" y="84" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Propose</text>
  <text x="95" y="100" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">decision + reasoning</text>

  <line x1="170" y1="88" x2="230" y2="88" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="230" y="60" width="150" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="305" y="84" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Challenge</text>
  <text x="305" y="100" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">interviewer raises concern</text>

  <line x1="380" y1="88" x2="440" y2="88" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="440" y="60" width="150" height="56" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="515" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Resolve</text>
  <text x="515" y="96" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">defend or update,</text>
  <text x="515" y="108" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">explicitly stated</text>

  <path d="M 515 116 C 515 170, 95 170, 95 116" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="305" y="185" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">loop for the next decision</text>
</svg>
