<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Minimal first draft: URL shortener</text>

  <rect x="20" y="70" width="120" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="98" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Client</text>

  <line x1="140" y1="93" x2="180" y2="93" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="160" y="85" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">request</text>

  <rect x="180" y="70" width="120" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="98" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">API layer</text>

  <line x1="300" y1="93" x2="340" y2="93" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="320" y="85" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">shorten</text>

  <rect x="340" y="70" width="140" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="410" y="98" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Shortening Service</text>

  <line x1="480" y1="93" x2="520" y2="93" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="500" y="85" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">store</text>

  <rect x="520" y="70" width="100" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="570" y="98" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Datastore</text>

  <text x="320" y="160" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">No caches, queues, or CDNs — every added box needs a stated reason.</text>
</svg>
