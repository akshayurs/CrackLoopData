<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Minute 45: same design, two canvases</text>

  <text x="150" y="46" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">Legible</text>
  <rect x="50" y="60" width="70" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="79" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Client</text>
  <line x1="120" y1="75" x2="160" y2="75" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="160" y="60" width="70" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="195" y="79" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">API</text>
  <line x1="195" y1="90" x2="195" y2="125" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="160" y="125" width="70" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="195" y="144" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">DB</text>
  <text x="150" y="195" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">whitespace preserved,</text>
  <text x="150" y="210" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">labels still readable</text>

  <line x1="320" y1="55" x2="320" y2="230" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>

  <text x="490" y="46" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">Hairball</text>
  <rect x="430" y="70" width="60" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="455" y="82" width="60" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="440" y="100" width="60" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <line x1="440" y1="80" x2="500" y2="115" stroke="var(--dg-line, #5F6368)"/>
  <line x1="500" y1="85" x2="450" y2="115" stroke="var(--dg-line, #5F6368)"/>
  <line x1="435" y1="105" x2="510" y2="90" stroke="var(--dg-line, #5F6368)"/>
  <text x="470" y="195" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">shrunk to fit, overlapping,</text>
  <text x="470" y="210" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">illegible text</text>

  <text x="320" y="248" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Same underlying design — only legibility differs.</text>
</svg>
