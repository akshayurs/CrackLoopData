<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="250" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Design-under-ambiguity loop</text>

  <rect x="170" y="55" width="160" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="250" y="83" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">State an assumption</text>

  <line x1="330" y1="90" x2="400" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="330" y="160" width="160" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="410" y="184" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Make a design</text>
  <text x="410" y="198" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">decision on it</text>

  <line x1="400" y1="216" x2="330" y2="290" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="170" y="290" width="160" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="314" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Checkpoint out loud:</text>
  <text x="250" y="330" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">"does this match</text>
  <text x="250" y="342" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">what you had in mind?"</text>

  <line x1="170" y1="310" x2="100" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="115" y="230" font-size="9" fill="var(--dg-muted, #5F6368)">next unknown</text>

  <text x="250" y="400" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Repeats in miniature for every unknown that appears,</text>
  <text x="250" y="418" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">each one small enough that being wrong costs little.</text>
</svg>
