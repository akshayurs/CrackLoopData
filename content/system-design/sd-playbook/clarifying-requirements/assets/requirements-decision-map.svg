<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Requirement question -&gt; design decision</text>

  <text x="150" y="48" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">Question</text>
  <text x="490" y="48" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">Decision it drives</text>

  <rect x="30" y="58" width="240" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="80" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Read : write ratio</text>
  <line x1="270" y1="75" x2="370" y2="75" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="370" y="58" width="240" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="490" y="80" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Caching strategy</text>

  <rect x="30" y="102" width="240" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="124" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Latency target</text>
  <line x1="270" y1="119" x2="370" y2="119" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="370" y="102" width="240" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="490" y="124" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Database choice</text>

  <rect x="30" y="146" width="240" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="168" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Consistency needs</text>
  <line x1="270" y1="163" x2="370" y2="163" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="370" y="146" width="240" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="490" y="168" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Replication model</text>

  <rect x="30" y="190" width="240" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="212" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Scale</text>
  <line x1="270" y1="207" x2="370" y2="207" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="370" y="190" width="240" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="490" y="212" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Sharding</text>
</svg>
