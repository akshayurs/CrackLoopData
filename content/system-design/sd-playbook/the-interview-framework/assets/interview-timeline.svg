<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">45-minute interview timeline</text>

  <rect x="20" y="70" width="70" height="44" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="55" y="96" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Requirements</text>

  <rect x="90" y="70" width="45" height="44" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="112" y="96" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Estimation</text>

  <rect x="135" y="70" width="110" height="44" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="190" y="96" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">High-Level Design</text>

  <rect x="245" y="60" width="220" height="64" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="355" y="96" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Deep Dive</text>

  <rect x="465" y="70" width="70" height="44" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="96" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Wrap-up</text>

  <text x="55" y="130" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">5-10 min</text>
  <text x="112" y="130" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">5 min</text>
  <text x="190" y="130" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">10-15 min</text>
  <text x="355" y="140" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">15-20 min</text>
  <text x="500" y="130" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">2-5 min</text>

  <text x="320" y="175" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Deep dive gets the most time and the most scoring weight.</text>
</svg>
