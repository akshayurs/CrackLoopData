<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="260" y="20" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="45" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Same start state</text>

  <line x1="290" y1="60" x2="150" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="350" y1="60" x2="490" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="80" y="110" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="132" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Replica A</text>
  <text x="150" y="148" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">applies update X</text>

  <rect x="420" y="110" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="132" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Replica B</text>
  <text x="490" y="148" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">applies update Y</text>

  <line x1="180" y1="156" x2="280" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="460" y1="156" x2="360" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="320" y="185" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">merge</text>

  <rect x="220" y="200" width="200" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="222" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Same final state</text>
  <text x="320" y="238" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">contains both X and Y</text>
</svg>
