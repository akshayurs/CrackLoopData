<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="160" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Genuine conflict</text>

  <rect x="30" y="50" width="120" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="78" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">{A:1, B:0}</text>

  <text x="160" y="80" text-anchor="middle" font-size="14" fill="var(--dg-muted, #5F6368)">?</text>

  <rect x="190" y="50" width="120" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="78" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">{A:0, B:1}</text>

  <text x="160" y="115" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">neither &gt;= the other</text>

  <text x="480" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Clear happened-before</text>

  <rect x="360" y="50" width="120" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="420" y="78" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">{A:1, B:0}</text>

  <line x1="480" y1="73" x2="530" y2="73" stroke="var(--dg-line, #5F6368)" marker-end="url(#a2)"/>
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="530" y="50" width="90" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="575" y="78" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">{A:2, B:1}</text>

  <text x="480" y="115" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">every count &lt;= — dominates</text>

  <text x="320" y="200" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Mutual non-domination is the signature of a real conflict, not a race in arrival time.</text>
</svg>
