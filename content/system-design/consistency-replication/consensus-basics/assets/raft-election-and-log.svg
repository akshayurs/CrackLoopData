<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="107" y="20" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">1. Election</text>
  <circle cx="60" cy="60" r="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="60" y="65" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">A</text>
  <circle cx="150" cy="30" r="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="35" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">B</text>
  <circle cx="150" cy="95" r="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="100" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">C</text>
  <line x1="82" y1="50" x2="128" y2="35" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="82" y1="70" x2="128" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="107" y="115" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">"vote for me"</text>

  <line x1="215" y1="60" x2="245" y2="60" stroke="var(--dg-stroke, #9AA0A6)"/>

  <text x="320" y="20" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">2. Majority votes</text>
  <circle cx="270" cy="60" r="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="270" y="65" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">A</text>
  <text x="270" y="95" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">leader</text>
  <circle cx="360" cy="30" r="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="360" y="35" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">B</text>
  <circle cx="360" cy="95" r="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="360" y="100" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">C</text>
  <line x1="337" y1="35" x2="293" y2="50" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="337" y1="90" x2="293" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <line x1="425" y1="60" x2="455" y2="60" stroke="var(--dg-stroke, #9AA0A6)"/>

  <text x="530" y="20" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">3. Log replication</text>
  <circle cx="480" cy="60" r="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="480" y="65" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">A</text>
  <circle cx="580" cy="30" r="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="580" y="35" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">B</text>
  <circle cx="580" cy="95" r="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="580" y="100" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">C</text>
  <line x1="503" y1="50" x2="557" y2="35" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="503" y1="70" x2="557" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="530" y="115" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">entry + ack</text>

  <rect x="150" y="170" width="340" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="195" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Entry committed once a majority acknowledges</text>

  <text x="320" y="250" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Same majority requirement as a write quorum.</text>
</svg>
