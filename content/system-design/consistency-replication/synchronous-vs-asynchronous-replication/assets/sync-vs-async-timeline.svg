<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="20" y="24" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Synchronous</text>
  <line x1="20" y1="40" x2="480" y2="40" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="30" y1="30" x2="30" y2="50" stroke="var(--dg-ink, #202124)"/>
  <text x="30" y="65" font-size="10" fill="var(--dg-muted, #5F6368)">write</text>
  <line x1="30" y1="40" x2="230" y2="40" stroke="var(--dg-accent, #0C8F88)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="130" y="30" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">leader -&gt; follower</text>
  <line x1="230" y1="40" x2="430" y2="40" stroke="var(--dg-accent, #0C8F88)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="330" y="30" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">ack -&gt; leader -&gt; client</text>
  <rect x="430" y="30" width="10" height="20" fill="var(--dg-accent, #0C8F88)"/>
  <text x="470" y="65" font-size="10" fill="var(--dg-muted, #5F6368)">client sees ack</text>

  <text x="20" y="130" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Asynchronous</text>
  <line x1="20" y1="146" x2="480" y2="146" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="30" y1="136" x2="30" y2="156" stroke="var(--dg-ink, #202124)"/>
  <text x="30" y="171" font-size="10" fill="var(--dg-muted, #5F6368)">write</text>
  <line x1="30" y1="146" x2="90" y2="146" stroke="var(--dg-accent, #0C8F88)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="60" y="136" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">leader acks</text>
  <text x="110" y="171" font-size="10" fill="var(--dg-muted, #5F6368)">client sees ack (fast)</text>

  <line x1="90" y1="146" x2="260" y2="200" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="220" y="215" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">follower catches up later</text>

  <text x="320" y="245" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Async latency stops at the leader; sync includes a follower round trip.</text>
</svg>
