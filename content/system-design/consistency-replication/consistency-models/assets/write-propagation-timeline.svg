<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <line x1="60" y1="40" x2="600" y2="40" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="600" y="30" text-anchor="end" font-size="10" fill="var(--dg-muted, #5F6368)">time</text>

  <line x1="90" y1="30" x2="90" y2="50" stroke="var(--dg-ink, #202124)"/>
  <text x="90" y="20" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">t=0</text>
  <text x="90" y="65" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">write lands: Primary</text>

  <rect x="30" y="90" width="120" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="90" y="112" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Primary: new</text>

  <line x1="240" y1="30" x2="240" y2="50" stroke="var(--dg-ink, #202124)"/>
  <text x="240" y="20" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">t=50ms</text>
  <rect x="180" y="90" width="120" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="240" y="112" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Replica B: new</text>

  <line x1="360" y1="30" x2="360" y2="50" stroke="var(--dg-ink, #202124)"/>
  <text x="360" y="20" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">t=100ms</text>
  <rect x="300" y="140" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="360" y="162" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">read replica C</text>
  <text x="360" y="188" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">returns old value</text>

  <line x1="540" y1="30" x2="540" y2="50" stroke="var(--dg-ink, #202124)"/>
  <text x="540" y="20" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">t=200ms</text>
  <rect x="480" y="90" width="120" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="540" y="112" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Replica C: new</text>

  <text x="320" y="228" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Convergence is guaranteed — timing during propagation isn't.</text>
</svg>
