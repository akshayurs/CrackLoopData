      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="30" y="80" width="110" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="102" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Client</text>
  <text x="85" y="117" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">read, R=3</text>

  <line x1="140" y1="90" x2="230" y2="40" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="140" y1="103" x2="230" y2="103" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="140" y1="116" x2="230" y2="170" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="230" y="20" width="130" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="295" y="45" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Replica: v5</text>

  <rect x="230" y="83" width="130" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="295" y="108" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Replica: v5</text>

  <rect x="230" y="150" width="130" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="295" y="175" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Replica: v3</text>

