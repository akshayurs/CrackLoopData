<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">N=3 replicas</text>

  <rect x="100" y="50" width="110" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="155" y="78" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Replica 1</text>

  <rect x="265" y="50" width="110" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="320" y="78" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Replica 2</text>

  <rect x="430" y="50" width="110" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="485" y="78" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Replica 3</text>

  <rect x="90" y="120" width="295" height="30" rx="14" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="237" y="140" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">write, W=2 (replicas 1, 2)</text>

  <rect x="255" y="160" width="295" height="30" rx="14" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="402" y="180" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">read, R=2 (replicas 2, 3)</text>

  <text x="320" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Replica 2 overlaps both sets — with W+R&gt;N, an overlap always exists.</text>
</svg>
