<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="360" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Expand-contract migration</text>

  <rect x="20" y="50" width="150" height="130" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="70" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Expand</text>
  <text x="95" y="94" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">old field: active</text>
  <text x="95" y="110" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">new field: added</text>
  <text x="95" y="130" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">both written</text>
  <text x="95" y="154" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">callers: on old</text>

  <line x1="170" y1="115" x2="205" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="208" y="50" width="150" height="130" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="283" y="70" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Migrate</text>
  <text x="283" y="94" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">backfill: old -&gt; new</text>
  <text x="283" y="110" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">historical data copied</text>
  <text x="283" y="130" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">callers move one by one</text>
  <text x="283" y="154" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">callers: dual-write</text>

  <line x1="358" y1="115" x2="393" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="396" y="50" width="150" height="130" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="471" y="70" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Contract</text>
  <text x="471" y="94" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">old field: removed</text>
  <text x="471" y="110" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">only once nothing</text>
  <text x="471" y="126" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">depends on it</text>
  <text x="471" y="154" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">callers: fully on new</text>

  <line x1="546" y1="115" x2="581" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="584" y="50" width="116" height="130" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="642" y="70" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Done</text>
  <text x="642" y="94" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">one clean</text>
  <text x="642" y="108" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">shape only</text>

  <text x="360" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">At every point on this timeline, the system is in a valid, working state.</text>
  <text x="360" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">You can pause for a week between any two stages and nothing is broken.</text>
</svg>
