<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Total cost of ownership over three years</text>

  <line x1="60" y1="270" x2="600" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <text x="130" y="288" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Year 1</text>
  <text x="290" y="288" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Year 2</text>
  <text x="450" y="288" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Year 3</text>

  <rect x="100" y="230" width="36" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <rect x="150" y="200" width="36" height="70" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <text x="118" y="222" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">Build</text>
  <text x="168" y="192" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">Buy</text>

  <rect x="260" y="180" width="36" height="90" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <rect x="310" y="190" width="36" height="80" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <text x="278" y="172" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">Build</text>
  <text x="328" y="182" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">Buy</text>

  <rect x="420" y="120" width="36" height="150" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <rect x="470" y="182" width="36" height="88" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <text x="438" y="112" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">Build</text>
  <text x="488" y="174" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">Buy</text>

  <rect x="20" y="304" width="14" height="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="40" y="315" font-size="10" fill="var(--dg-muted, #5F6368)">Build in-house — build+run+maintain grows each year</text>

  <rect x="20" y="322" width="14" height="14" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <text x="40" y="333" font-size="10" fill="var(--dg-muted, #5F6368)">Buy / managed — higher upfront, stays flat</text>
</svg>
