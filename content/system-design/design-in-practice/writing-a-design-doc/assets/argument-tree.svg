<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A design doc as an argument tree</text>

  <rect x="270" y="40" width="140" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="340" y="68" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Decision</text>

  <line x1="90" y1="150" x2="300" y2="88" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="20" y="152" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="178" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Problem</text>

  <line x1="340" y1="150" x2="340" y2="88" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="270" y="152" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="340" y="178" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Goals</text>

  <line x1="500" y1="150" x2="385" y2="88" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="440" y="152" width="120" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="500" y="172" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Alternative A</text>
  <text x="500" y="188" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">rejected: too slow</text>

  <line x1="640" y1="150" x2="400" y2="82" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="580" y="152" width="120" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="640" y="172" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Alternative B</text>
  <text x="640" y="188" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">rejected: too costly</text>

  <text x="340" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Read bottom-up: problem, goals, and rejected alternatives justify the decision.</text>
  <text x="340" y="260" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">A report describes; an argument tree justifies.</text>
</svg>
