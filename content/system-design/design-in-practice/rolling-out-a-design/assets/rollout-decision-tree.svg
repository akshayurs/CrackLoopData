<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Rollout as a decision tree with abort points</text>

  <g>
    <rect x="130" y="42" width="140" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="200" y="64" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">1% — check metrics</text>
  </g>
  <line x1="200" y1="76" x2="200" y2="102" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="216" y="94" font-size="9" fill="var(--dg-muted, #5F6368)">pass</text>

  <g>
    <rect x="130" y="104" width="140" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="200" y="126" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">5% — check metrics</text>
  </g>
  <line x1="200" y1="138" x2="200" y2="164" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="216" y="156" font-size="9" fill="var(--dg-muted, #5F6368)">pass</text>

  <g>
    <rect x="130" y="166" width="140" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="200" y="188" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">25% — check metrics</text>
  </g>
  <line x1="200" y1="200" x2="200" y2="226" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="216" y="218" font-size="9" fill="var(--dg-muted, #5F6368)">pass</text>

  <g>
    <rect x="130" y="228" width="140" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="200" y="250" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">100% — shipped</text>
  </g>

  <line x1="270" y1="59" x2="400" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3" marker-end="url(#arrow-accent)"/>
  <line x1="270" y1="121" x2="400" y2="170" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3" marker-end="url(#arrow-accent)"/>
  <line x1="270" y1="183" x2="400" y2="190" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3" marker-end="url(#arrow-accent)"/>
  <text x="345" y="115" font-size="9" fill="var(--dg-muted, #5F6368)">fail</text>
  <text x="345" y="150" font-size="9" fill="var(--dg-muted, #5F6368)">fail</text>
  <text x="345" y="185" font-size="9" fill="var(--dg-muted, #5F6368)">fail</text>

  <rect x="400" y="150" width="200" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="500" y="174" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Abort</text>
  <text x="500" y="192" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">roll back / disable flag</text>

  <text x="320" y="300" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Every stage has the same abort branch back to a known-safe state.</text>
  <text x="320" y="320" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">If you can't name the abort action, that stage isn't ready to ship.</text>
</svg>
