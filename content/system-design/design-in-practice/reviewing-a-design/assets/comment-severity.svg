<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Tagging review comments by severity</text>

  <rect x="30" y="46" width="220" height="200" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="140" y="66" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">Design doc</text>
  <line x1="45" y1="78" x2="235" y2="78" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <line x1="45" y1="96" x2="235" y2="96" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <line x1="45" y1="114" x2="235" y2="114" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <line x1="45" y1="132" x2="200" y2="132" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <line x1="45" y1="160" x2="235" y2="160" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <line x1="45" y1="178" x2="235" y2="178" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <line x1="45" y1="196" x2="180" y2="196" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>

  <rect x="290" y="46" width="330" height="86" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="455" y="66" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Must fix</text>
  <text x="455" y="86" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">"Blast radius: this write isn't atomic,</text>
  <text x="455" y="102" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">two callers can double-decrement stock"</text>
  <text x="455" y="120" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">gates sign-off</text>

  <rect x="290" y="150" width="330" height="86" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="455" y="170" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Consider</text>
  <text x="455" y="190" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">"Wording: 'cache' -&gt; 'read replica'</text>
  <text x="455" y="206" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">would be clearer here"</text>
  <text x="455" y="224" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">nice-to-have, non-blocking</text>

  <line x1="455" y1="132" x2="455" y2="148" stroke="var(--dg-line, #5F6368)"/>

  <line x1="455" y1="236" x2="500" y2="280" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="380" y="280" width="240" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="500" y="304" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Author addresses "Must fix" before merge</text>

  <text x="320" y="310" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Only "must fix" gates approval — "consider" comments don't block.</text>
</svg>
