<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="360" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Room booking flow</text>

  <rect x="20" y="60" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Search finds</text>
  <text x="85" y="95" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">a room</text>

  <line x1="150" y1="83" x2="185" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="188" y="60" width="140" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="258" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">holdRoom</text>
  <text x="258" y="95" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">reserve range + expiry</text>

  <line x1="328" y1="83" x2="363" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="366" y="60" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="431" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Enter payment</text>
  <text x="431" y="95" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">checkout UI</text>

  <line x1="496" y1="83" x2="531" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="534" y="60" width="170" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="619" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">confirmBooking</text>
  <text x="619" y="95" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">finalizes reservation</text>

  <line x1="619" y1="106" x2="619" y2="150" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="258" y1="106" x2="258" y2="150" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="619" y1="173" x2="295" y2="173" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3"/>

  <rect x="130" y="150" width="255" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="257" y="171" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">payment not completed in time</text>
  <text x="257" y="187" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">hold silently expires, range reopens</text>

  <text x="360" y="234" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Same hold-then-confirm shape as ticket booking — a date range, not a single seat.</text>
</svg>
