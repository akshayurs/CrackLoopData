<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Search fan-out vs live query</text>

  <rect x="30" y="46" width="170" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="115" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">"Austin, Jun 10-13"</text>

  <line x1="200" y1="67" x2="240" y2="67" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="243" y="46" width="170" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="328" y="66" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Search index</text>
  <text x="328" y="80" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">thousands of properties</text>

  <line x1="413" y1="67" x2="453" y2="67" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="456" y="46" width="180" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="546" y="66" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Ranked results</text>
  <text x="546" y="80" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">date-filtered</text>

  <text x="328" y="112" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">refreshed on a short interval — discovery, not source of truth</text>

  <line x1="115" y1="88" x2="115" y2="230" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3"/>
  <text x="115" y="160" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" transform="rotate(-90 115 160)">not this path</text>

  <rect x="30" y="232" width="170" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="115" y="252" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">One property's</text>
  <text x="115" y="268" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">live booking table</text>

  <text x="290" y="255" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">A live query per property, thousands of times,</text>
  <text x="290" y="271" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">would be far too slow for one search.</text>

  <text x="340" y="304" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">holdRoom still checks the real booking data — search is only discovery.</text>
</svg>
