<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Ride-hailing architecture</text>

  <rect x="270" y="40" width="160" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="350" y="66" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">requestRide</text>

  <line x1="350" y1="82" x2="350" y2="118" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="260" y="120" width="180" height="52" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="350" y="142" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Matching Engine</text>
  <text x="350" y="160" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">stateless, CPU-bound</text>

  <rect x="30" y="120" width="180" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="120" y="142" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Location Service</text>
  <text x="120" y="160" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">geospatial index, ephemeral</text>

  <rect x="490" y="120" width="180" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="580" y="142" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Pricing Service</text>
  <text x="580" y="160" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">surge multiplier per zone</text>

  <line x1="260" y1="146" x2="215" y2="146" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="238" y="138" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">candidates</text>

  <line x1="90" y1="172" x2="90" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="130" y="200" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">driverLocationUpdate</text>

  <rect x="30" y="222" width="180" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="120" y="248" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Driver apps</text>

  <line x1="350" y1="172" x2="350" y2="218" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="405" y="200" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">match result</text>

  <rect x="260" y="220" width="180" height="52" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="350" y="242" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Trip Service</text>
  <text x="350" y="260" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">durable ride state machine</text>

  <line x1="490" y1="146" x2="440" y2="146" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="465" y="138" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">multiplier</text>

  <text x="350" y="308" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each service scales on its own axis: write-heavy, stateless, durable, and aggregating.</text>
</svg>
