<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The match loop</text>

  <rect x="220" y="42" width="200" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="68" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">requestRide</text>

  <line x1="320" y1="84" x2="320" y2="112" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="180" y="114" width="280" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="134" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Query candidates in radius</text>
  <text x="320" y="150" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">score by ETA + heading</text>

  <line x1="320" y1="160" x2="320" y2="188" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="200" y="190" width="240" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="212" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Offer to top candidate</text>
  <text x="320" y="228" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">best score first</text>

  <line x1="440" y1="213" x2="500" y2="213" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="500" y1="213" x2="500" y2="134" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3"/>
  <line x1="500" y1="134" x2="462" y2="134" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="565" y="175" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">decline or</text>
  <text x="565" y="188" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">timeout:</text>
  <text x="565" y="201" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">next candidate</text>

  <line x1="320" y1="236" x2="320" y2="264" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="180" y="266" width="280" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="286" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">acceptMatch</text>
  <text x="320" y="302" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">remove driver from pool, update trip service</text>

  <text x="320" y="352" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A declined offer advances to the next-ranked candidate, not a fresh search.</text>
</svg>
