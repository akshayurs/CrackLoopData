<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Two buyers, one seat</text>

  <rect x="60" y="46" width="150" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="135" y="72" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Alice: hold 14C</text>

  <rect x="430" y="46" width="150" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="72" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Bob: hold 14C</text>

  <text x="320" y="70" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">same millisecond</text>

  <line x1="150" y1="88" x2="290" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="495" y1="88" x2="360" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="200" y="140" width="240" height="52" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="162" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">seat_status row: 14C</text>
  <text x="320" y="180" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">WHERE status = 'available'</text>

  <line x1="270" y1="192" x2="150" y2="240" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="192" x2="490" y2="240" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <rect x="60" y="240" width="180" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="150" y="262" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Alice: write succeeds</text>
  <text x="150" y="278" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">status -&gt; held</text>

  <rect x="400" y="240" width="180" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="490" y="262" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Bob: write fails</text>
  <text x="490" y="278" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">"seat unavailable"</text>

  <text x="320" y="320" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The conditional WHERE clause is the single point where the tie is broken.</text>
</svg>
