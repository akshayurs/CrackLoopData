<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="360" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">End-to-end booking flow</text>

  <rect x="20" y="60" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Search seats</text>
  <text x="85" y="95" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">read replica</text>

  <line x1="150" y1="83" x2="185" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="188" y="60" width="130" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="253" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Hold seat</text>
  <text x="253" y="95" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">conditional write</text>

  <line x1="318" y1="83" x2="353" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="356" y="60" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="421" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Enter payment</text>
  <text x="421" y="95" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">checkout UI</text>

  <line x1="486" y1="83" x2="521" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="524" y="60" width="170" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="609" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">confirmBooking</text>
  <text x="609" y="95" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">charge -&gt; status=sold</text>

  <line x1="609" y1="106" x2="609" y2="150" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="253" y1="106" x2="253" y2="150" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="609" y1="173" x2="290" y2="173" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3"/>

  <rect x="130" y="150" width="250" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="255" y="171" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">payment failure or timeout</text>
  <text x="255" y="187" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">hold expires -&gt; status=available</text>

  <text x="360" y="234" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Only confirmBooking is permanent — everything before it reverses by design.</text>
</svg>
