<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Batching two nearby orders</text>

  <text x="170" y="48" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Batched: one courier trip</text>

  <rect x="40" y="60" width="90" height="38" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="83" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Restaurant A</text>

  <rect x="200" y="60" width="90" height="38" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="245" y="83" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Restaurant B</text>

  <rect x="40" y="140" width="90" height="38" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="163" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Customer A</text>

  <rect x="200" y="140" width="90" height="38" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="245" y="163" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Customer B</text>

  <path d="M85,98 L85,120 Q85,130 100,130 L215,130 Q230,130 230,140 L245,140" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M85,98 L85,178" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M245,98 L245,178" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="165" y="118" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">one courier, one route</text>

  <text x="510" y="48" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Unbatched: two trips</text>

  <rect x="390" y="60" width="90" height="38" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="435" y="83" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Restaurant A</text>

  <rect x="550" y="60" width="90" height="38" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="595" y="83" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Restaurant B</text>

  <rect x="390" y="140" width="90" height="38" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="435" y="163" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Customer A</text>

  <rect x="550" y="140" width="90" height="38" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="595" y="163" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Customer B</text>

  <line x1="435" y1="98" x2="435" y2="138" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="595" y1="98" x2="595" y2="138" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="435" y="118" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">courier 1</text>
  <text x="595" y="118" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">courier 2</text>

  <text x="340" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Batching pays off only when ready-times and locations overlap enough.</text>
  <text x="340" y="250" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Restaurants ten minutes apart just delay both orders for no gain.</text>
</svg>
