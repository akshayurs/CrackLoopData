<svg viewBox="0 0 500 420" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="250" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">One order record, three apps</text>

  <rect x="165" y="180" width="170" height="56" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="250" y="204" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Order record</text>
  <text x="250" y="222" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">single source of truth</text>

  <rect x="170" y="50" width="160" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="76" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Customer app</text>
  <line x1="240" y1="92" x2="220" y2="178" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="260" y1="178" x2="260" y2="92" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="20" y="320" width="160" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="346" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Restaurant app</text>
  <line x1="130" y1="320" x2="195" y2="234" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="150" y1="234" x2="90" y2="318" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="320" y="320" width="160" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="400" y="346" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Courier app</text>
  <line x1="370" y1="320" x2="310" y2="234" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="350" y1="234" x2="410" y2="318" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="250" y="270" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">read status / write updates</text>

  <text x="250" y="398" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A star, not a triangle — no app talks directly to another.</text>
</svg>
