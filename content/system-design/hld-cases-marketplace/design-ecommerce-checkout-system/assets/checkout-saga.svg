<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Checkout saga: forward and compensating</text>

  <rect x="40" y="60" width="160" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="120" y="88" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Reserve inventory</text>

  <line x1="200" y1="83" x2="235" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="238" y="60" width="160" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="318" y="88" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Charge payment</text>

  <line x1="398" y1="83" x2="433" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="436" y="60" width="160" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="516" y="88" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Create shipment</text>
  <text x="516" y="132" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">fails here — saga unwinds</text>

  <text x="350" y="128" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">forward path (success)</text>

  <line x1="516" y1="106" x2="516" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3" marker-end="url(#arrow-accent)"/>
  <line x1="516" y1="172" x2="318" y2="172" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3" marker-end="url(#arrow-accent)"/>

  <rect x="238" y="174" width="160" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="318" y="198" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Refund payment</text>
  <text x="318" y="212" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">compensating action</text>

  <line x1="238" y1="196" x2="200" y2="196" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3" marker-end="url(#arrow-accent)"/>

  <rect x="40" y="174" width="160" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="120" y="198" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Release inventory</text>
  <text x="120" y="212" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">compensating action</text>

  <text x="350" y="252" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">compensating path (unwind on failure, reverse order)</text>

  <text x="350" y="292" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Only the steps that actually committed get undone.</text>
</svg>
