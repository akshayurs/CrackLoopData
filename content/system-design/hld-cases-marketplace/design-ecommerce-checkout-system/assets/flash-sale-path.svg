<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Flash-sale path: reserve first</text>

  <rect x="30" y="50" width="130" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="72" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Checkout req A</text>
  <rect x="30" y="92" width="130" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="114" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Checkout req B</text>
  <rect x="30" y="134" width="130" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="156" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Checkout req C</text>
  <text x="95" y="184" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">same limited SKU</text>

  <line x1="160" y1="67" x2="220" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="160" y1="109" x2="220" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="160" y1="151" x2="220" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="220" y="100" width="220" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="330" y="124" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Reserve inventory</text>
  <text x="330" y="140" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">atomic: WHERE stock &gt; 0</text>
  <text x="330" y="154" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">first saga step</text>

  <line x1="440" y1="120" x2="480" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="460" y="112" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">secured</text>

  <rect x="483" y="100" width="130" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="548" y="126" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Payment</text>

  <line x1="440" y1="150" x2="480" y2="200" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="490" y="170" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">stock=0</text>

  <rect x="483" y="202" width="130" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="548" y="222" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Sold out</text>
  <text x="548" y="236" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">rejected before payment</text>

  <text x="320" y="290" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Failing fast on scarce stock avoids wasting a payment authorization call.</text>
</svg>
