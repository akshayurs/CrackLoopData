<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Fraud filtering ahead of the aggregator</text>

  <rect x="20" y="60" width="130" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="86" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Raw click stream</text>

  <line x1="150" y1="81" x2="185" y2="81" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="188" y="50" width="220" height="62" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="298" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Fraud filter</text>
  <text x="298" y="87" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">bot user-agent/IP patterns</text>
  <text x="298" y="101" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">rate limits, click-spam bursts</text>

  <line x1="408" y1="70" x2="443" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="425" y="62" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">clean</text>

  <rect x="446" y="50" width="200" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="546" y="76" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Windowed aggregator</text>

  <line x1="330" y1="112" x2="330" y2="160" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="330" y="130" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">flagged</text>

  <rect x="220" y="162" width="220" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="330" y="188" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Review / discard path</text>

  <text x="340" y="248" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Filtering before aggregation avoids reissuing invoices for fraud folded into a billed count.</text>
</svg>
