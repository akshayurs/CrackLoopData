<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="360" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Click aggregation pipeline</text>

  <rect x="20" y="60" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Event ingest</text>
  <text x="90" y="96" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">recordClick stream</text>

  <line x1="160" y1="83" x2="195" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="198" y="60" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="273" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Dedup / fraud filter</text>
  <text x="273" y="96" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">removes what shouldn't count</text>

  <line x1="348" y1="83" x2="383" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="386" y="60" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="461" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Windowed aggregation</text>
  <text x="461" y="96" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">1-min buckets per ad</text>

  <line x1="536" y1="83" x2="571" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="574" y="60" width="130" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="639" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Aggregate store</text>
  <text x="639" y="96" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">billing reads here</text>

  <line x1="639" y1="106" x2="639" y2="150" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <rect x="559" y="152" width="160" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="639" y="177" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">getAggregate</text>

  <text x="360" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Fraud filtering sits before aggregation, not after.</text>
</svg>
