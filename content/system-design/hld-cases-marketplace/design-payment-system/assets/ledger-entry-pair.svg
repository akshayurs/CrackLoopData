<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A $50 charge as a ledger entry pair</text>

  <rect x="40" y="50" width="240" height="66" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="160" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Debit: customer account</text>
  <text x="160" y="88" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">-$50.00</text>
  <text x="160" y="104" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">txn id T-1042</text>

  <rect x="360" y="50" width="240" height="66" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="480" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Credit: platform revenue</text>
  <text x="480" y="88" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">+$50.00</text>
  <text x="480" y="104" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">txn id T-1042</text>

  <line x1="280" y1="83" x2="360" y2="83" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="76" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">written together, atomically</text>

  <text x="320" y="150" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">versus</text>

  <rect x="220" y="170" width="200" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="320" y="192" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">balance field</text>
  <text x="320" y="208" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">incremented directly, mutable</text>

  <text x="320" y="260" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A correction is a new reversing pair, never an edit to history.</text>
</svg>
