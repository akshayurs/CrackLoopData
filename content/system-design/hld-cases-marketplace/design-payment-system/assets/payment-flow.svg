<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Charge flow with async reconciliation</text>

  <rect x="20" y="60" width="120" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="86" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Client</text>

  <line x1="140" y1="81" x2="175" y2="81" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="178" y="60" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="248" y="86" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Payment service</text>

  <line x1="318" y1="81" x2="353" y2="81" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="356" y="60" width="150" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="431" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">External processor</text>
  <text x="431" y="95" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">synchronous charge</text>

  <line x1="506" y1="81" x2="541" y2="81" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="544" y="60" width="140" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="614" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Ledger</text>
  <text x="614" y="95" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">two balanced entries</text>

  <rect x="356" y="160" width="328" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="520" y="181" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Async reconciliation job</text>
  <text x="520" y="197" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">pulls processor report, diffs vs ledger</text>

  <line x1="431" y1="102" x2="450" y2="158" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="614" y1="102" x2="590" y2="158" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="520" y="130" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">periodic pull + diff, flags mismatches</text>

  <text x="350" y="248" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Reconciliation runs out of band — it never blocks a live charge.</text>
</svg>
