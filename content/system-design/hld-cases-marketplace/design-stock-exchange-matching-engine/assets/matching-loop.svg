<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The matching loop</text>

  <rect x="220" y="42" width="200" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="68" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Incoming buy order</text>

  <line x1="320" y1="84" x2="320" y2="112" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <path d="M260,114 L380,114 L410,146 L380,178 L260,178 L230,146 Z" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="142" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Price crosses</text>
  <text x="320" y="158" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">best ask?</text>

  <line x1="410" y1="146" x2="460" y2="146" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="435" y="138" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">yes</text>

  <rect x="460" y="122" width="160" height="48" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="540" y="142" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Emit trade</text>
  <text x="540" y="158" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">at resting order's price</text>

  <path d="M540,170 L540,210 L410,210" fill="none" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="490" y="202" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">qty remains: next-best ask</text>

  <line x1="230" y1="146" x2="180" y2="146" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="205" y="138" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">no</text>

  <rect x="20" y="122" width="160" height="48" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="142" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Rest in book</text>
  <text x="100" y="158" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">at price level, time order</text>

  <text x="320" y="252" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Check best opposite price, match or rest, repeat.</text>
  <text x="320" y="270" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Simplicity here protects the microsecond budget.</text>
</svg>
