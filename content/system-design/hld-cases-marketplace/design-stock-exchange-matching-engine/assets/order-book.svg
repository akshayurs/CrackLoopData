<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Order book for one symbol</text>

  <text x="160" y="52" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Bids</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Asks</text>

  <rect x="60" y="62" width="200" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="160" y="85" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">$101.20 — best bid</text>

  <rect x="60" y="102" width="200" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="160" y="121" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">$101.10 — 3 orders</text>

  <rect x="60" y="132" width="200" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="160" y="151" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">$101.00 — 5 orders</text>

  <rect x="60" y="162" width="200" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="160" y="181" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">$100.90 — 2 orders</text>

  <rect x="380" y="62" width="200" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="480" y="85" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">$101.30 — best ask</text>

  <rect x="380" y="102" width="200" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="480" y="121" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">$101.40 — 4 orders</text>

  <rect x="380" y="132" width="200" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="480" y="151" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">$101.50 — 2 orders</text>

  <rect x="380" y="162" width="200" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="480" y="181" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">$101.60 — 6 orders</text>

  <text x="160" y="212" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">highest price at top</text>
  <text x="480" y="212" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">lowest price at top</text>

  <text x="320" y="252" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">each price level: time-ordered queue of individual orders</text>

  <text x="320" y="300" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Only the best bid and best ask can match immediately; everything below waits its turn.</text>
</svg>
