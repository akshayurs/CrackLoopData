<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="380" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Migration pipeline</text>

  <rect x="10" y="70" width="90" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="55" y="96" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Callers</text>

  <line x1="100" y1="91" x2="140" y2="91" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="140" y="70" width="120" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="200" y="96" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">PaymentFacade</text>

  <line x1="260" y1="91" x2="300" y2="91" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="300" y="70" width="150" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="375" y="96" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">PaymentProvider</text>

  <line x1="450" y1="91" x2="490" y2="91" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="490" y="50" width="130" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="555" y="76" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">LegacyGatewayAdapter</text>

  <line x1="620" y1="71" x2="655" y2="71" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="655" y="50" width="95" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="702" y="70" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">LegacyPayment</text>
  <text x="702" y="83" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Gateway</text>

  <rect x="490" y="160" width="130" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="555" y="186" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">NewGatewayProvider</text>

  <line x1="555" y1="92" x2="555" y2="160" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="500" y="130" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">swapped</text>

  <text x="380" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Callers and Facade never change; only the adapter box is replaced.</text>
</svg>
