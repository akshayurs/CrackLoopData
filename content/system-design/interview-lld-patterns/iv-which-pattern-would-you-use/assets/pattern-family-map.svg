<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="340" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Pattern family lookup map</text>

  <rect x="20" y="46" width="200" height="230" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="120" y="70" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Creational</text>
  <text x="120" y="90" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">how is it built?</text>
  <text x="120" y="130" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Factory</text>
  <text x="120" y="152" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Builder</text>
  <text x="120" y="174" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Singleton</text>

  <rect x="240" y="46" width="200" height="230" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="340" y="70" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Structural</text>
  <text x="340" y="90" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">how is it composed?</text>
  <text x="340" y="130" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Adapter</text>
  <text x="340" y="152" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Facade</text>
  <text x="340" y="174" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Decorator</text>

  <rect x="460" y="46" width="200" height="230" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="560" y="70" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Behavioral</text>
  <text x="560" y="90" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">how does it behave?</text>
  <text x="560" y="130" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Strategy</text>
  <text x="560" y="152" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Observer</text>
  <text x="560" y="174" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Template Method</text>
</svg>
