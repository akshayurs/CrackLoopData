<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="40" width="300" height="180" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="170" y="66" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Before</text>
  <rect x="50" y="90" width="240" height="50" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="170" y="112" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">formatMessage()</text>
  <text x="170" y="128" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">edit source to add PUSH</text>
  <text x="170" y="175" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">every new case touches</text>
  <text x="170" y="190" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">existing, tested code</text>

  <rect x="380" y="40" width="300" height="180" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="66" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">After</text>
  <rect x="410" y="90" width="240" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="111" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">FormatterRegistry</text>
  <line x1="530" y1="124" x2="530" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="425" y="150" width="210" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="530" y="171" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">register("PUSH", ...)</text>
  <text x="530" y="203" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">zero changes to the class</text>

  <text x="350" y="245" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Adding a case shrinks from an edit to a registration call.</text>
</svg>
