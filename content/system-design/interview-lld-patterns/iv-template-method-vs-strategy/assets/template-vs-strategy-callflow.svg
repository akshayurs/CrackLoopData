<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="175" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Template Method</text>
  <rect x="60" y="60" width="230" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="175" y="88" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">base.process()</text>
  <path d="M 290 72 C 340 72, 340 130, 290 130" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="325" y="102" text-anchor="middle" font-size="10.5" fill="var(--dg-accent, #0C8F88)">self-call</text>
  <text x="175" y="128" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">calls its own overridden</text>
  <text x="175" y="143" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">transform()</text>

  <line x1="350" y1="140" x2="350" y2="200" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="2,3"/>

  <text x="525" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Strategy</text>
  <rect x="410" y="60" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="485" y="88" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">DataPipeline</text>

  <line x1="560" y1="83" x2="600" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="600" y="60" width="80" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="640" y="88" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Transform</text>
  <text x="485" y="128" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">calls out to a separate</text>
  <text x="485" y="143" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">Strategy object it holds</text>

  <text x="350" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Template Method's arrow curves back in; Strategy's arrow points out.</text>
</svg>
