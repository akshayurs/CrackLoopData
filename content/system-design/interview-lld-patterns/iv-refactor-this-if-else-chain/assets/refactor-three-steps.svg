<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Refactor order</text>

  <rect x="20" y="60" width="190" height="90" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="115" y="85" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">1. Extract</text>
  <text x="115" y="106" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">each branch into</text>
  <text x="115" y="121" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">its own method</text>

  <line x1="210" y1="105" x2="250" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="255" y="60" width="190" height="90" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="350" y="85" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">2. Classify</text>
  <text x="350" y="106" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">what branches vary</text>
  <text x="350" y="121" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">on: type / state / config</text>

  <line x1="445" y1="105" x2="485" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="490" y="60" width="190" height="90" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="585" y="85" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">3. Replace</text>
  <text x="585" y="106" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">with polymorphism,</text>
  <text x="585" y="121" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">lookup map, or keep chain</text>

  <text x="350" y="190" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Extract before classify, classify before replace — each step compiles and tests.</text>
</svg>
