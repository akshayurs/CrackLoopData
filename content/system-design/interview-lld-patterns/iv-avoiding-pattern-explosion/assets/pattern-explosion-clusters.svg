  <line x1="562" y1="93" x2="580" y2="93" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="541" y1="106" x2="541" y2="170" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
