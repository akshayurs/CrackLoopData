  <line x1="122" y1="93" x2="140" y2="93" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="101" y1="106" x2="101" y2="170" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="161" y1="106" x2="161" y2="170" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="122" y1="183" x2="140" y2="183" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

