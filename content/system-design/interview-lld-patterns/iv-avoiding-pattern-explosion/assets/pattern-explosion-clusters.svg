  <ellipse cx="350" cy="140" rx="110" ry="90" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <ellipse cx="570" cy="140" rx="110" ry="90" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- cluster 1 -->
  <rect x="80" y="80" width="42" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <rect x="140" y="80" width="42" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
