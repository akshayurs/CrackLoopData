  <line x1="342" y1="93" x2="360" y2="93" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="321" y1="106" x2="321" y2="170" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="381" y1="106" x2="381" y2="170" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="342" y1="183" x2="360" y2="183" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

