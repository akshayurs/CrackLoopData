<svg viewBox="0 0 660 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">DI container as one big factory</text>

  <rect x="255" y="50" width="150" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="330" y="78" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">DI Container</text>

  <line x1="290" y1="96" x2="110" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="180" y="120" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">gateway param</text>

  <line x1="330" y1="96" x2="330" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="330" y="130" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">repo param</text>

  <line x1="370" y1="96" x2="550" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="480" y="120" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">svc param</text>

  <rect x="40" y="160" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="186" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">StripeGateway</text>

  <rect x="260" y="160" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="330" y="186" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">OrderRepository</text>

  <rect x="480" y="160" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="550" y="186" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">PaymentService</text>

  <text x="330" y="250" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">One factory's construction logic, scaled up to build the whole object graph.</text>
</svg>
