<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">LRU cache: one lock guards both structures</text>

  <rect x="80" y="46" width="480" height="150" rx="10" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="320" y="70" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">one lock guards both structures together</text>

  <rect x="110" y="90" width="200" height="70" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="210" y="118" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">hash map</text>
  <text x="210" y="136" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">key -&gt; node</text>

  <rect x="330" y="90" width="200" height="70" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="430" y="118" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">recency list</text>
  <text x="430" y="136" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">doubly linked</text>

  <line x1="210" y1="30" x2="210" y2="46" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="150" y="40" font-size="11" fill="var(--dg-muted, #5F6368)">get()</text>
  <line x1="430" y1="30" x2="430" y2="46" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="480" y="40" font-size="11" fill="var(--dg-muted, #5F6368)">put()</text>

  <text x="320" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">State that must change together shares one lock, not two</text>
</svg>
