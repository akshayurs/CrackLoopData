<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Linearizability: put and get on the same key</text>

  <text x="20" y="60" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Thread A</text>
  <line x1="90" y1="54" x2="600" y2="54" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="150" y="40" width="140" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="220" y="60" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">put(k, 1)</text>

  <text x="20" y="130" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Thread B</text>
  <line x1="90" y1="124" x2="600" y2="124" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="330" y="110" width="140" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="400" y="130" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">get(k) -&gt; 1</text>

  <line x1="290" y1="90" x2="330" y2="90" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="290" y1="70" x2="290" y2="90" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="330" y1="90" x2="330" y2="110" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="310" y="105" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">B starts after A returns</text>

  <rect x="60" y="170" width="520" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="194" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">each operation appears to happen at one instant on a shared timeline</text>
  <text x="320" y="214" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">a get() that starts after a put() returns must see that put()'s value</text>
</svg>
