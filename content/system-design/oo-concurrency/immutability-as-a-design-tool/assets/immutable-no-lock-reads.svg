<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Immutable object: no lock needed</text>

  <rect x="245" y="80" width="150" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="110" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Point(3, 7)</text>

  <line x1="70" y1="50" x2="255" y2="88" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="250" y1="40" x2="290" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="390" y1="40" x2="350" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="570" y1="50" x2="385" y2="88" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="60" y="42" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Thread A</text>
  <text x="250" y="32" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Thread B</text>
  <text x="390" y="32" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Thread C</text>
  <text x="580" y="42" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Thread D</text>

  <text x="320" y="152" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">all read .getX() at once, no queue</text>

  <rect x="60" y="190" width="200" height="90" rx="10" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="160" y="212" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">contrast: mutable</text>
  <rect x="100" y="230" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="251" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">1 thread inside</text>
  <text x="160" y="270" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">others queue</text>
</svg>
