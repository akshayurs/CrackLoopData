<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Compare-and-swap retry</text>

  <rect x="30" y="46" width="140" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="67" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">A reads 5</text>
  <line x1="170" y1="63" x2="220" y2="63" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="220" y="46" width="150" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="295" y="67" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">A computes 6</text>
  <line x1="370" y1="63" x2="420" y2="63" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="420" y="46" width="190" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="515" y="67" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">CAS(expect 5, new 6)</text>

  <rect x="420" y="110" width="190" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="515" y="131" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">B's update lands: value 6</text>
  <line x1="515" y1="110" x2="515" y2="80" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="3 3"/>

  <text x="515" y="164" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">A's CAS fails</text>

  <path d="M 420 176 C 250 200, 130 200, 100 96" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="216" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">retry: re-read current value (6)</text>

  <rect x="30" y="230" width="140" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="251" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">A reads 6</text>
  <line x1="170" y1="247" x2="380" y2="247" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="380" y="230" width="230" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="495" y="251" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">CAS(expect 6, new 7) succeeds</text>
</svg>
