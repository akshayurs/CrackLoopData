<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">One lock, two threads</text>

  <text x="20" y="60" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Thread A</text>
  <line x1="90" y1="54" x2="600" y2="54" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="20" y="150" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Thread B</text>
  <line x1="90" y1="144" x2="600" y2="144" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="140" y="60" width="240" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="260" y="84" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">critical section</text>
  <text x="260" y="102" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">lock held</text>

  <rect x="200" y="150" width="160" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="280" y="171" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">blocked, queued</text>

  <rect x="380" y="150" width="150" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="455" y="171" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">enters, proceeds</text>

  <line x1="380" y1="120" x2="380" y2="150" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="440" y="130" font-size="11" fill="var(--dg-muted, #5F6368)">A releases lock</text>

  <text x="320" y="220" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">B does no useful work while blocked</text>
  <text x="320" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Correctness costs one thread's full stop</text>
</svg>
