<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Lost update: counter starts at 5</text>

  <text x="20" y="52" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Thread A</text>
  <line x1="90" y1="46" x2="600" y2="46" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="20" y="132" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Thread B</text>
  <line x1="90" y1="126" x2="600" y2="126" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="100" y="30" width="110" height="32" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="155" y="51" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">read total (5)</text>

  <rect x="240" y="30" width="130" height="32" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="305" y="51" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">compute 5+1=6</text>

  <rect x="400" y="30" width="130" height="32" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="465" y="51" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">write 6</text>

  <rect x="180" y="110" width="110" height="32" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="235" y="131" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">read total (5)</text>

  <rect x="320" y="110" width="130" height="32" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="385" y="131" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">compute 5+1=6</text>

  <rect x="480" y="110" width="130" height="32" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="545" y="131" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">write 6</text>

  <line x1="235" y1="110" x2="155" y2="62" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="290" y="90" font-size="11" fill="var(--dg-muted, #5F6368)">B reads before A writes</text>

  <text x="320" y="180" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Both write 6 -- one increment is lost</text>
  <text x="320" y="200" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Ends at 6, not the correct 7</text>
</svg>
