<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="320" y="26" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">"design a parking lot"</text>
  <text x="150" y="52" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">Category</text>
  <text x="480" y="52" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">Scoped answer</text>

  <rect x="20" y="65" width="260" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="86" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Core actions</text>
  <rect x="300" y="65" width="320" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="460" y="86" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">park and unpark</text>

  <rect x="20" y="110" width="260" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="131" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Variants</text>
  <rect x="300" y="110" width="320" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="460" y="131" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">cars and motorcycles only</text>

  <rect x="20" y="155" width="260" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="176" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Scale</text>
  <rect x="300" y="155" width="320" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="460" y="176" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">single multi-level lot</text>

  <rect x="20" y="200" width="260" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="221" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Out-of-scope</text>
  <rect x="300" y="200" width="320" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="460" y="221" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">payment, license-plate recognition</text>
</svg>
