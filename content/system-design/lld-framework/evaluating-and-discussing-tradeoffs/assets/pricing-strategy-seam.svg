<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="tri" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect x="250" y="15" width="140" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="40" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">ParkingLot</text>

  <rect x="240" y="95" width="160" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="320" y="120" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">PricingStrategy</text>
  <line x1="320" y1="95" x2="320" y2="55" stroke="var(--dg-line, #5F6368)" marker-end="url(#tri)"/>

  <rect x="30" y="180" width="130" height="38" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="204" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">HourlyPricing</text>
  <line x1="95" y1="180" x2="280" y2="135" stroke="var(--dg-line, #5F6368)" marker-end="url(#tri)"/>

  <rect x="180" y="180" width="130" height="38" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="245" y="204" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">DailyPricing</text>
  <line x1="245" y1="180" x2="300" y2="135" stroke="var(--dg-line, #5F6368)" marker-end="url(#tri)"/>

  <rect x="330" y="180" width="130" height="38" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="395" y="204" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">ElectricPricing</text>
  <line x1="395" y1="180" x2="340" y2="135" stroke="var(--dg-line, #5F6368)" marker-end="url(#tri)"/>

  <rect x="480" y="180" width="150" height="38" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="555" y="204" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">SubscriptionPricing</text>
  <text x="555" y="235" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">new, slots in beside them</text>
  <line x1="555" y1="180" x2="380" y2="135" stroke="var(--dg-line, #5F6368)" marker-end="url(#tri)" stroke-dasharray="4 3"/>
