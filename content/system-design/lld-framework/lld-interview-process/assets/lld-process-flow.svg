  </defs>
  <rect x="15" y="60" width="115" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="72" y="82" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Scope</text>
