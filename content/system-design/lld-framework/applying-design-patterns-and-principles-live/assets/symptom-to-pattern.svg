<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="150" y="24" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)" font-weight="600">Symptom</text>
  <text x="480" y="24" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)" font-weight="600">Pattern / principle</text>

  <rect x="20" y="40" width="260" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="61" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">growing if/else on type</text>
  <line x1="280" y1="57" x2="400" y2="57" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="405" y="40" width="215" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="512" y="61" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Strategy / State</text>

  <rect x="20" y="90" width="260" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="111" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">objects react to another's changes</text>
  <line x1="280" y1="107" x2="400" y2="107" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="405" y="90" width="215" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="512" y="111" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Observer</text>

  <rect x="20" y="140" width="260" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="161" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">similar-but-different configs</text>
  <line x1="280" y1="157" x2="400" y2="157" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="405" y="140" width="215" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="512" y="161" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Builder / Factory</text>

  <rect x="20" y="190" width="260" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="211" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">one class, two unrelated jobs</text>
  <line x1="280" y1="207" x2="400" y2="207" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="405" y="190" width="215" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="512" y="211" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Single Responsibility</text>
</svg>
