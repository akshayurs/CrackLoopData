<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="160" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Without Mediator: full mesh</text>
  <text x="480" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">With Mediator: hub</text>

  <line x1="320" y1="10" x2="320" y2="300" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4,4"/>

  <g id="mesh">
    <!-- five users around a circle, left panel center (160,175) radius 95 -->
    <line x1="160" y1="80" x2="255" y2="140" stroke="var(--dg-line, #5F6368)"/>
    <line x1="160" y1="80" x2="225" y2="245" stroke="var(--dg-line, #5F6368)"/>
    <line x1="160" y1="80" x2="95" y2="245" stroke="var(--dg-line, #5F6368)"/>
    <line x1="160" y1="80" x2="65" y2="140" stroke="var(--dg-line, #5F6368)"/>
    <line x1="255" y1="140" x2="225" y2="245" stroke="var(--dg-line, #5F6368)"/>
    <line x1="255" y1="140" x2="95" y2="245" stroke="var(--dg-line, #5F6368)"/>
    <line x1="255" y1="140" x2="65" y2="140" stroke="var(--dg-line, #5F6368)"/>
    <line x1="225" y1="245" x2="95" y2="245" stroke="var(--dg-line, #5F6368)"/>
    <line x1="225" y1="245" x2="65" y2="140" stroke="var(--dg-line, #5F6368)"/>
    <line x1="95" y1="245" x2="65" y2="140" stroke="var(--dg-line, #5F6368)"/>

    <circle cx="160" cy="80" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <circle cx="255" cy="140" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <circle cx="225" cy="245" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <circle cx="95" cy="245" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <circle cx="65" cy="140" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="160" y="84" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">U1</text>
    <text x="255" y="144" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">U2</text>
    <text x="225" y="249" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">U3</text>
    <text x="95" y="249" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">U4</text>
    <text x="65" y="144" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">U5</text>
  </g>

  <g id="hub">
    <!-- five users around a circle, right panel center (480,175) -->
    <line x1="480" y1="175" x2="480" y2="80" stroke="var(--dg-line, #5F6368)"/>
    <line x1="480" y1="175" x2="575" y2="140" stroke="var(--dg-line, #5F6368)"/>
    <line x1="480" y1="175" x2="545" y2="245" stroke="var(--dg-line, #5F6368)"/>
    <line x1="480" y1="175" x2="415" y2="245" stroke="var(--dg-line, #5F6368)"/>
    <line x1="480" y1="175" x2="385" y2="140" stroke="var(--dg-line, #5F6368)"/>

    <circle cx="480" cy="175" r="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="480" y="179" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">ChatRoom</text>

    <circle cx="480" cy="80" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <circle cx="575" cy="140" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <circle cx="545" cy="245" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <circle cx="415" cy="245" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <circle cx="385" cy="140" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="480" y="84" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">U1</text>
    <text x="575" y="144" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">U2</text>
    <text x="545" y="249" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">U3</text>
    <text x="415" y="249" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">U4</text>
    <text x="385" y="144" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">U5</text>
  </g>

  <text x="320" y="308" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Ten mesh connections collapse into five spokes through one hub.</text>
</svg>
