<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Originator, Memento, Caretaker</text>

  <rect x="30" y="90" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="118" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Originator</text>

  <rect x="250" y="90" width="120" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="310" y="112" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Memento</text>
  <text x="310" y="127" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">sealed box</text>

  <rect x="470" y="80" width="150" height="66" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="545" y="103" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Caretaker</text>
  <text x="545" y="120" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">stores a history</text>
  <text x="545" y="133" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">of mementos</text>

  <line x1="160" y1="105" x2="248" y2="105" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="204" y="95" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">can read/restore</text>

  <line x1="370" y1="113" x2="468" y2="113" stroke="var(--dg-line, #5F6368)" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="419" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">cannot read contents</text>

  <text x="320" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Only the originator can open a memento; the caretaker just manages timing.</text>
</svg>
