<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Invoker → Command → Receiver</text>

  <rect x="30" y="80" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="108" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Invoker</text>

  <line x1="170" y1="103" x2="240" y2="103" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="205" y="93" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">execute()</text>

  <rect x="245" y="70" width="150" height="66" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="100" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">BoldCommand</text>
  <text x="320" y="117" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">holds range + receiver</text>

  <line x1="395" y1="103" x2="465" y2="103" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="430" y="93" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">applyBold(range)</text>

  <rect x="470" y="80" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="540" y="108" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Document</text>

  <text x="320" y="188" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The invoker only ever calls execute() — it never touches the receiver directly.</text>
</svg>
