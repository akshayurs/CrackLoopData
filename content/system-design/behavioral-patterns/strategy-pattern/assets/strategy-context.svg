<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Context holding a swappable Strategy</text>

  <rect x="80" y="42" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="68" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Context</text>

  <line x1="220" y1="63" x2="290" y2="63" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="255" y="53" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">strategy.execute()</text>

  <rect x="295" y="42" width="150" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="370" y="68" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Strategy</text>

  <line x1="330" y1="84" x2="180" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="370" y1="84" x2="370" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="410" y1="84" x2="560" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="110" y="162" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="180" y="188" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">StrategyA</text>

  <rect x="300" y="162" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="370" y="188" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">StrategyB</text>

  <rect x="490" y="162" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="560" y="188" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">StrategyC</text>

  <text x="320" y="260" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Swapping strategies is reassigning one reference — the context's code never changes.</text>
</svg>
