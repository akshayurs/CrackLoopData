<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Template Method: fixed sequence, some steps deferred</text>

  <rect x="20" y="42" width="600" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">DataImporter.import()</text>

  <line x1="320" y1="72" x2="320" y2="92" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="20" y="94" width="140" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="118" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">readFile()</text>

  <rect x="180" y="94" width="140" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="250" y="118" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">parse()</text>

  <rect x="340" y="94" width="140" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="410" y="118" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">validate()</text>

  <rect x="500" y="94" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="560" y="118" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">saveToDb()</text>

  <line x1="160" y1="114" x2="178" y2="114" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="320" y1="114" x2="338" y2="114" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="480" y1="114" x2="498" y2="114" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="90" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">implemented</text>
  <text x="250" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">abstract hook</text>
  <text x="410" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">abstract hook</text>
  <text x="560" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">implemented</text>

  <line x1="250" y1="134" x2="250" y2="180" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4,3"/>
  <line x1="410" y1="134" x2="410" y2="180" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4,3"/>

  <rect x="200" y="182" width="280" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="340" y="203" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">CsvImporter</text>
  <text x="340" y="219" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">provides concrete parse() + validate()</text>

  <text x="320" y="272" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The base class controls order; subclasses only fill in the hooks they're given.</text>
</svg>
