<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A request traveling handler to handler</text>

  <line x1="10" y1="90" x2="60" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="35" y="80" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">request</text>

  <rect x="65" y="65" width="150" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="140" y="95" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">AuthHandler</text>

  <line x1="215" y1="90" x2="255" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="235" y="80" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">pass along</text>

  <rect x="260" y="65" width="150" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="335" y="95" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">RateLimitHandler</text>

  <line x1="410" y1="90" x2="450" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="430" y="80" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">pass along</text>

  <rect x="455" y="65" width="165" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="537" y="95" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">BusinessLogicHandler</text>

  <line x1="140" y1="115" x2="140" y2="165" stroke="var(--dg-line, #5F6368)" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="335" y1="115" x2="335" y2="165" stroke="var(--dg-line, #5F6368)" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="537" y1="115" x2="537" y2="165" stroke="var(--dg-line, #5F6368)" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="140" y="180" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">reject/short-circuit</text>
  <text x="335" y="180" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">reject/short-circuit</text>
  <text x="537" y="180" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">reject/short-circuit</text>

  <text x="320" y="228" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each handler only knows its own next link, never the chain's full length.</text>
</svg>
