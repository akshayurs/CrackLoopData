<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Order state machine as State objects</text>

  <rect x="30" y="55" width="90" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Order</text>

  <line x1="120" y1="76" x2="185" y2="76" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <text x="152" y="66" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">current</text>

  <rect x="190" y="55" width="130" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="255" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">PlacedState</text>

  <line x1="320" y1="76" x2="380" y2="76" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="350" y="66" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">ship()</text>

  <rect x="385" y="55" width="130" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="450" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">ShippedState</text>

  <line x1="515" y1="76" x2="575" y2="76" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="545" y="66" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">deliver()</text>

  <rect x="475" y="130" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="545" y="155" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">DeliveredState</text>
  <line x1="580" y1="97" x2="580" y2="128" stroke="var(--dg-line, #5F6368)"/>
  <line x1="580" y1="128" x2="545" y2="128" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="320" y="212" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each transition is a method call on the current state that hands off to the next.</text>
</svg>
