<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Independent iterators over one collection</text>

  <rect x="40" y="70" width="170" height="150" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="125" y="92" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Collection</text>

  <circle cx="90" cy="120" r="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <circle cx="160" cy="120" r="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <circle cx="90" cy="170" r="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <circle cx="160" cy="170" r="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <line x1="90" y1="120" x2="90" y2="170" stroke="var(--dg-line, #5F6368)" stroke-width="1"/>
  <line x1="90" y1="120" x2="160" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1"/>
  <line x1="160" y1="120" x2="160" y2="170" stroke="var(--dg-line, #5F6368)" stroke-width="1"/>

  <rect x="380" y="60" width="220" height="52" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="490" y="83" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Iterator A</text>
  <text x="490" y="98" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">current position: node (90,120)</text>

  <rect x="380" y="180" width="220" height="52" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="203" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Iterator B</text>
  <text x="490" y="218" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">current position: node (160,170)</text>

  <line x1="378" y1="86" x2="215" y2="120" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="378" y1="206" x2="215" y2="170" stroke="var(--dg-line, #5F6368)" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="320" y="256" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Position lives in the iterator, not the collection — so two can walk it independently.</text>
</svg>
