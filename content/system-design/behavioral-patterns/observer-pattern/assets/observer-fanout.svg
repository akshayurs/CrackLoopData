<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Subject fan-out to observers</text>

  <rect x="30" y="90" width="140" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="100" y="115" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Subject</text>
  <text x="100" y="132" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">list of Observers</text>

  <line x1="170" y1="100" x2="250" y2="55" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="170" y1="120" x2="250" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="170" y1="140" x2="250" y2="188" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="205" y="70" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">update()</text>
  <text x="205" y="112" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">update()</text>
  <text x="205" y="176" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">update()</text>

  <rect x="255" y="30" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="325" y="58" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Chart</text>

  <rect x="255" y="97" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="325" y="125" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">PortfolioValue</text>

  <rect x="255" y="164" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="325" y="192" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">PriceAlert</text>

  <text x="320" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">One event, three independent reactions — no observer aware of the others.</text>
</svg>
