<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Visitor traversing an AST via accept()</text>

  <rect x="180" y="46" width="150" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="255" y="71" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">BinaryOpNode</text>

  <line x1="220" y1="88" x2="130" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="290" y1="88" x2="360" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="60" y="132" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="130" y="157" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">NumberNode</text>

  <rect x="290" y="132" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="360" y="157" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">VariableNode</text>

  <rect x="470" y="88" width="150" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="545" y="112" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Visitor</text>
  <text x="545" y="128" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">visitX() per type</text>

  <line x1="330" y1="60" x2="468" y2="98" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="420" y="72" text-anchor="middle" font-size="8" fill="var(--dg-accent, #0C8F88)">accept → visitBinaryOpNode</text>

  <line x1="200" y1="146" x2="468" y2="118" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="360" y="200" text-anchor="middle" font-size="8" fill="var(--dg-accent, #0C8F88)">accept → visitNumberNode</text>

  <line x1="430" y1="146" x2="468" y2="140" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="480" y="200" text-anchor="middle" font-size="8" fill="var(--dg-accent, #0C8F88)">accept → visitVariableNode</text>

  <text x="320" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The tree stays the same; swapping the Visitor object changes the operation.</text>
</svg>
