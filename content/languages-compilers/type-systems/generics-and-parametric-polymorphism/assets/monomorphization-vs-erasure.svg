<svg viewBox="0 0 560 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <rect x="220" y="24" width="120" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Box&lt;T&gt; source</text>

  <line x1="240" y1="54" x2="130" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="150" y="72" font-size="9" fill="var(--dg-muted, #5F6368)">monomorphization</text>

  <rect x="40" y="90" width="110" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="95" y="110" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Box_Int</text>
  <rect x="160" y="90" width="120" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="220" y="110" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Box_String</text>
  <text x="150" y="140" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">separate compiled boxes, own concrete fields</text>

  <line x1="320" y1="54" x2="420" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="400" y="72" font-size="9" fill="var(--dg-muted, #5F6368)">erasure</text>

  <rect x="360" y="90" width="140" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="430" y="110" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Box_Object (shared)</text>
  <line x1="430" y1="120" x2="430" y2="145" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="390" y="145" width="80" height="26" rx="5" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="430" y="163" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">cast at output</text>

  <text x="280" y="215" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">One source, two compile strategies with different runtime trade-offs.</text>
</svg>
