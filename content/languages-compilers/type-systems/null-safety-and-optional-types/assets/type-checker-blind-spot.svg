<svg viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <rect x="10" y="60" width="130" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="84" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">findUser(id): String</text>

  <line x1="140" y1="80" x2="190" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <circle cx="215" cy="80" r="24" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="215" y="84" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)">&#10003;</text>
  <text x="215" y="118" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">no nullability concept</text>

  <line x1="240" y1="80" x2="290" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="290" y="60" width="130" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="355" y="84" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">name.length()</text>

  <line x1="420" y1="80" x2="470" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="470" y="55" width="140" height="50" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="540" y="77" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">NullPointerException</text>
  <text x="540" y="92" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">runtime crash</text>

  <text x="310" y="160" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">The type checker approved every step along the way.</text>
</svg>
