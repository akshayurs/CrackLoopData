<svg viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="300" y="20" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Base: Dog &#8594; Animal (Dog is a subtype)</text>

  <text x="100" y="55" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Covariant</text>
  <text x="60" y="90" font-size="10" fill="var(--dg-ink, #202124)">Container&lt;Dog&gt;</text>
  <line x1="150" y1="86" x2="185" y2="86" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="190" y="90" font-size="10" fill="var(--dg-ink, #202124)">Container&lt;Animal&gt;</text>

  <text x="300" y="140" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Contravariant</text>
  <text x="230" y="175" font-size="10" fill="var(--dg-ink, #202124)">Container&lt;Animal&gt;</text>
  <line x1="365" y1="171" x2="330" y2="171" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="370" y="175" font-size="10" fill="var(--dg-ink, #202124)">Container&lt;Dog&gt;</text>

  <text x="500" y="55" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Invariant</text>
  <text x="440" y="90" font-size="10" fill="var(--dg-ink, #202124)">Container&lt;Dog&gt;</text>
  <text x="440" y="115" font-size="10" fill="var(--dg-ink, #202124)">Container&lt;Animal&gt;</text>
  <text x="500" y="135" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">no relation either way</text>

  <text x="300" y="230" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Whether a generic wrapper preserves, reverses, or drops the subtype relation.</text>
</svg>
