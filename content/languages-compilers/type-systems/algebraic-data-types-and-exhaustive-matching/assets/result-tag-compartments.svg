<svg viewBox="0 0 560 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="280" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Result&lt;T, E&gt; under its two tags</text>

  <rect x="60" y="46" width="180" height="110" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="80" y="40" width="60" height="24" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="110" y="57" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Ok</text>
  <rect x="90" y="90" width="120" height="50" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="150" y="120" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">T</text>

  <rect x="340" y="46" width="180" height="110" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="360" y="40" width="60" height="24" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="390" y="57" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Err</text>
  <rect x="370" y="90" width="120" height="50" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="430" y="120" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">E</text>

  <text x="150" y="180" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">E compartment absent</text>
  <text x="430" y="180" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">T compartment absent</text>
