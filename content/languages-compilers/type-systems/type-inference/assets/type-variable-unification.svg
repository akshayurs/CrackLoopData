<svg viewBox="0 0 480 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="240" y="20" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Inferring the type of `x + x`</text>

  <rect x="40" y="40" width="70" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="60" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">x : T</text>
  <rect x="330" y="40" width="70" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="365" y="60" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">x : T</text>

  <line x1="75" y1="70" x2="200" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="365" y1="70" x2="260" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="180" y="110" width="100" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="230" y="131" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">+ node</text>
  <text x="230" y="160" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">"T must be numeric"</text>

  <line x1="230" y1="144" x2="230" y2="180" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="230" y="196" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">T &#8594; int</text>

  <text x="230" y="220" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">propagates up: double : int -&gt; int</text>
</svg>
