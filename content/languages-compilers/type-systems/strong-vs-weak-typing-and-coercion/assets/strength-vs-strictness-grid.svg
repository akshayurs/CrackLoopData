<svg viewBox="0 0 460 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="230" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Static/dynamic &#215; strong/weak</text>

  <line x1="230" y1="40" x2="230" y2="260" stroke="var(--dg-line, #5F6368)" stroke-width="1"/>
  <line x1="60" y1="150" x2="400" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1"/>

  <text x="60" y="40" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Static</text>
  <text x="400" y="40" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Dynamic</text>
  <text x="30" y="70" font-size="10" fill="var(--dg-muted, #5F6368)" transform="rotate(-90 30 70)">Strong</text>
  <text x="30" y="250" font-size="10" fill="var(--dg-muted, #5F6368)" transform="rotate(-90 30 250)">Weak</text>

  <rect x="80" y="60" width="130" height="70" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="145" y="90" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Java</text>
  <text x="145" y="108" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Rust</text>

  <rect x="250" y="60" width="130" height="70" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="315" y="99" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Python</text>

  <rect x="80" y="160" width="130" height="70" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="145" y="199" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">C</text>

  <rect x="250" y="160" width="130" height="70" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="315" y="199" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">JavaScript</text>

  <text x="230" y="285" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Two independent axes — strength is not the same as static checking.</text>
</svg>
