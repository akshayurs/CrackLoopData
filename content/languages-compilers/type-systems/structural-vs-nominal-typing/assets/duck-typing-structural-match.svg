<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="40" y="30" width="140" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="50" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Duck</text>
  <text x="110" y="68" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">quack()</text>

  <rect x="320" y="30" width="140" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="390" y="50" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Person</text>
  <text x="390" y="68" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">quack()</text>

