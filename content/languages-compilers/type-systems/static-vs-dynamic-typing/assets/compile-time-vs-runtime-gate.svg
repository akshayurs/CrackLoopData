<svg viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="150" y="20" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Static</text>
  <text x="470" y="20" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Dynamic</text>

  <rect x="30" y="40" width="150" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="60" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">call: numeric(string)</text>
  <line x1="105" y1="70" x2="105" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="30" y="100" width="150" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="105" y="118" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">compile-time gate</text>
  <text x="105" y="133" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)">&#10007;</text>
  <text x="105" y="160" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">rejected, never runs</text>

  <rect x="380" y="40" width="150" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="455" y="60" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">call: numeric(string)</text>
  <line x1="455" y1="70" x2="455" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="380" y="100" width="150" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="455" y="119" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">running program</text>
  <line x1="455" y1="130" x2="455" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="380" y="150" width="150" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="455" y="171" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">runtime type-tag check fails</text>
</svg>
