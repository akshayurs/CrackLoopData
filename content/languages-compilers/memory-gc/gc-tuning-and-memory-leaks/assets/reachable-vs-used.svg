<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="310" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">A "leak" via a growing reachable cache</text>

  <rect x="240" y="34" width="130" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="305" y="54" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">static cache</text>

  <g font-size="9" fill="var(--dg-muted, #5F6368)">
    <rect x="40" y="100" width="70" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" opacity="0.5"/>
    <text x="75" y="117" text-anchor="middle">user_1042</text>
    <rect x="120" y="100" width="70" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" opacity="0.5"/>
    <text x="155" y="117" text-anchor="middle">user_1043</text>
    <rect x="200" y="100" width="70" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" opacity="0.5"/>
    <text x="235" y="117" text-anchor="middle">user_1044</text>
    <rect x="280" y="100" width="70" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" opacity="0.5"/>
    <text x="315" y="117" text-anchor="middle">user_1045</text>
    <rect x="360" y="100" width="70" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" opacity="0.5"/>
    <text x="395" y="117" text-anchor="middle">user_1046</text>
    <rect x="440" y="100" width="70" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" opacity="0.5"/>
    <text x="475" y="117" text-anchor="middle">user_1047</text>
    <rect x="520" y="100" width="60" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" opacity="0.5"/>
    <text x="550" y="117" text-anchor="middle">...</text>
  </g>

  <line x1="270" y1="64" x2="120" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)" opacity="0.5"/>
  <line x1="290" y1="64" x2="230" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)" opacity="0.5"/>
  <line x1="310" y1="64" x2="320" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)" opacity="0.5"/>
  <line x1="330" y1="64" x2="410" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)" opacity="0.5"/>
  <line x1="350" y1="64" x2="490" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)" opacity="0.5"/>

  <rect x="80" y="160" width="150" height="46" rx="8" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="155" y="180" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">actually needed</text>
  <text x="155" y="195" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">right now</text>
  <line x1="155" y1="160" x2="155" y2="127" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="310" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Reachable is not the same as used — the GC can't tell the difference.</text>
</svg>
