<svg viewBox="0 0 620 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="310" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Move semantics and automatic drop</text>

  <text x="90" y="46" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">1. owner</text>
  <rect x="60" y="54" width="60" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="90" y="72" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-family="monospace">a</text>
  <line x1="90" y1="80" x2="90" y2="110" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
  <rect x="55" y="110" width="70" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="90" y="128" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">"data"</text>

  <line x1="130" y1="67" x2="240" y2="67" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="290" y="46" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">2. moved-from</text>
  <rect x="260" y="54" width="60" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" opacity="0.4"/>
  <text x="290" y="72" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-family="monospace">a &#10005;</text>

  <text x="420" y="46" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">new owner</text>
  <rect x="390" y="54" width="60" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="420" y="72" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-family="monospace">b</text>
  <line x1="420" y1="80" x2="420" y2="110" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
  <rect x="385" y="110" width="70" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="420" y="128" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">"data"</text>

  <line x1="450" y1="67" x2="540" y2="67" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="580" y="55" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">3. end of</text>
  <text x="580" y="68" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">scope</text>
  <rect x="540" y="105" width="60" height="34" rx="5" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="570" y="126" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">freed</text>

  <text x="310" y="190" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">No explicit free() call — the compiler inserts the drop at scope exit.</text>
</svg>
