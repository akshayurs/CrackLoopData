<svg viewBox="0 0 620 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="150" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Mark phase</text>
  <text x="470" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Sweep phase</text>

  <rect x="20" y="40" width="30" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="35" y="58" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">root</text>

  <g stroke="var(--dg-accent, #0C8F88)" fill="var(--dg-accent-bg, #E3F3F1)" stroke-width="1.5">
    <rect x="80" y="40" width="34" height="26" rx="5"/>
    <rect x="130" y="80" width="34" height="26" rx="5"/>
    <rect x="80" y="120" width="34" height="26" rx="5"/>
  </g>
  <rect x="180" y="80" width="34" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="197" y="97" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">unreach.</text>

  <line x1="50" y1="53" x2="80" y2="53" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="114" y1="53" x2="145" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="80" y1="60" x2="97" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="350" y="40" width="34" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <rect x="400" y="80" width="34" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <rect x="350" y="120" width="34" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <rect x="450" y="80" width="34" height="26" rx="5" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <text x="467" y="97" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">free</text>

  <text x="150" y="185" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">flood-fill from roots along pointers</text>
  <text x="470" y="185" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">unmarked boxes removed, gaps left behind</text>

  <text x="310" y="230" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Only what's unreachable from any root becomes free space.</text>
</svg>
