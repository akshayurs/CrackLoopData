<svg viewBox="0 0 620 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="310" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Three ways manual memory goes wrong</text>

  <text x="20" y="55" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">leak</text>
  <rect x="70" y="42" width="70" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="105" y="59" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">malloc</text>
  <line x1="140" y1="55" x2="180" y2="55" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="180" y="42" width="120" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="240" y="59" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">out of scope, no free</text>
  <line x1="300" y1="55" x2="340" y2="55" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="340" y="42" width="130" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="405" y="59" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">marked allocated forever</text>

  <text x="20" y="115" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">double-free</text>
  <rect x="90" y="102" width="70" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="125" y="119" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">malloc</text>
  <line x1="160" y1="115" x2="200" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="200" y="102" width="60" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="230" y="119" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">free</text>
  <line x1="260" y1="115" x2="300" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="300" y="102" width="60" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="330" y="119" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">free</text>
  <line x1="360" y1="115" x2="400" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="400" y="102" width="130" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="465" y="119" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">metadata corrupted</text>

  <text x="20" y="175" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">dangling</text>
  <rect x="90" y="162" width="70" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="125" y="179" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">malloc</text>
  <line x1="160" y1="175" x2="200" y2="175" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="200" y="162" width="60" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="230" y="179" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">free</text>
  <line x1="260" y1="175" x2="300" y2="175" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="300" y="162" width="230" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="415" y="179" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">later read/write touches reused memory</text>

  <text x="310" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Every bug traces to the same source: no one entity owns "when to free."</text>
</svg>
