<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="150" y="22" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Young generation</text>
  <text x="450" y="22" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Old generation</text>

  <rect x="30" y="40" width="240" height="140" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <g>
    <rect x="45" y="55" width="30" height="24" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" opacity="0.35"/>
    <rect x="80" y="55" width="30" height="24" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="115" y="55" width="30" height="24" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" opacity="0.35"/>
    <rect x="150" y="55" width="30" height="24" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" opacity="0.35"/>
    <rect x="45" y="88" width="30" height="24" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" opacity="0.35"/>
    <rect x="80" y="88" width="30" height="24" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" opacity="0.35"/>
    <rect x="115" y="88" width="30" height="24" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="150" y="88" width="30" height="24" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" opacity="0.35"/>
  </g>
  <text x="150" y="160" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">most objects die young</text>

  <line x1="270" y1="100" x2="330" y2="100" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="90" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">promote</text>

  <rect x="330" y="40" width="260" height="140" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <g>
    <rect x="345" y="55" width="34" height="24" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="385" y="55" width="34" height="24" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="425" y="55" width="34" height="24" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="465" y="55" width="34" height="24" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="345" y="88" width="34" height="24" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="385" y="88" width="34" height="24" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="425" y="88" width="34" height="24" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="465" y="88" width="34" height="24" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  </g>
  <text x="460" y="160" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">mostly long-lived survivors</text>

  <text x="150" y="205" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">minor GC — frequent, fast</text>
  <text x="460" y="205" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">major/full GC — rare, slow, scans whole region</text>

  <text x="310" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Splitting by age lets the collector skip the region unlikely to have garbage.</text>
</svg>
