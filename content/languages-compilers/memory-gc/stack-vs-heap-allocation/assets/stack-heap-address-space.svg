<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="200" y="22" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">A process's address space</text>

  <rect x="100" y="40" width="200" height="120" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="60" y="50" font-size="10" fill="var(--dg-muted, #5F6368)">stack</text>
  <rect x="120" y="46" width="160" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="200" y="63" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">main</text>
  <rect x="135" y="76" width="130" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="200" y="93" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">foo</text>
  <rect x="150" y="106" width="100" height="26" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="200" y="123" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">bar</text>

  <line x1="200" y1="132" x2="200" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="240" y="145" font-size="9" fill="var(--dg-muted, #5F6368)">grows &#8595;, shrinks &#8593; on return</text>

  <rect x="100" y="210" width="200" height="90" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="60" y="205" font-size="10" fill="var(--dg-muted, #5F6368)">heap</text>
  <rect x="115" y="225" width="40" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <rect x="165" y="225" width="60" height="26" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <rect x="240" y="225" width="30" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <rect x="130" y="260" width="50" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <rect x="200" y="260" width="70" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>

  <path d="M170,120 C 170,180 195,200 195,225" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
