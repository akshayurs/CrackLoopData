<svg viewBox="0 0 620 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="310" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Reference counts through a reassignment</text>

  <g font-size="10" fill="var(--dg-ink, #202124)">
    <text x="80" y="46" text-anchor="middle" fill="var(--dg-muted, #5F6368)">step 1</text>
    <rect x="30" y="54" width="100" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="80" y="74" text-anchor="middle">A</text>
    <circle cx="118" cy="58" r="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="118" y="62" text-anchor="middle" font-size="9">2</text>
    <rect x="150" y="54" width="100" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="200" y="74" text-anchor="middle">B</text>
    <circle cx="238" cy="58" r="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="238" y="62" text-anchor="middle" font-size="9">1</text>
  </g>

  <line x1="280" y1="69" x2="330" y2="69" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <g font-size="10" fill="var(--dg-ink, #202124)">
    <text x="400" y="46" text-anchor="middle" fill="var(--dg-muted, #5F6368)">step 2</text>
    <rect x="350" y="54" width="100" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="400" y="74" text-anchor="middle">A</text>
    <circle cx="438" cy="58" r="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="438" y="62" text-anchor="middle" font-size="9">1</text>
    <rect x="470" y="54" width="100" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="520" y="74" text-anchor="middle">B</text>
    <circle cx="558" cy="58" r="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="558" y="62" text-anchor="middle" font-size="9">2</text>
  </g>

  <line x1="120" y1="100" x2="120" y2="130" stroke="var(--dg-line, #5F6368)"/>
  <line x1="120" y1="130" x2="560" y2="130" stroke="var(--dg-line, #5F6368)"/>
  <line x1="560" y1="130" x2="560" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="340" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">step 3: variable reassigned, then goes out of scope &#8594; A:1, B:1 (both survive, nothing freed yet)</text>

  <text x="310" y="195" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">A count only reaches 0, and frees, when every reference is gone.</text>
</svg>
