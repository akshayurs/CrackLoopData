<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Exhaustive match over Shape</text>

  <g font-size="9" fill="var(--dg-ink, #202124)">
    <rect x="20" y="45" width="110" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="75" y="64" text-anchor="middle">Circle(r: 4)</text>
    <rect x="20" y="90" width="110" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="75" y="109" text-anchor="middle">Rectangle(3,5)</text>
    <rect x="20" y="135" width="110" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="75" y="154" text-anchor="middle">Triangle(6,2)</text>
  </g>

  <line x1="130" y1="62" x2="230" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="130" y1="107" x2="230" y2="107" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="130" y1="152" x2="230" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <path d="M230,80 L280,107 L230,134 L180,107 Z" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="230" y="111" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">match</text>

  <line x1="280" y1="100" x2="360" y2="55" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="280" y1="107" x2="360" y2="107" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="280" y1="114" x2="360" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <g font-size="9" fill="var(--dg-ink, #202124)">
    <rect x="360" y="35" width="230" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="475" y="54" text-anchor="middle" font-family="monospace">Circle -&gt; pi * r^2</text>
    <rect x="360" y="92" width="230" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="475" y="111" text-anchor="middle" font-family="monospace">Rectangle -&gt; w * h</text>
    <rect x="360" y="145" width="230" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="475" y="164" text-anchor="middle" font-family="monospace">Triangle -&gt; 0.5*b*h</text>
  </g>

  <line x1="280" y1="118" x2="360" y2="205" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="360" y="190" width="230" height="30" rx="5" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3"/>
  <text x="475" y="209" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">unlisted variant -&gt; compiler error</text>

  <text x="320" y="255" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Adding a fourth Shape variant later breaks every match that forgot it — at compile time.</text>
</svg>
