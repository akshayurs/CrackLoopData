<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="310" y="22" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Matching over a Shape sum type</text>

  <rect x="20" y="42" width="140" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="62" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Circle(r: 4)</text>
  <rect x="20" y="82" width="140" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="102" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Rectangle(3,5)</text>
  <rect x="20" y="122" width="140" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="142" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Triangle(6,2)</text>

  <line x1="160" y1="57" x2="230" y2="97" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="160" y1="97" x2="230" y2="97" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="160" y1="137" x2="230" y2="97" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <polygon points="270,67 320,97 270,127 220,97" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="270" y="101" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">match</text>

  <line x1="320" y1="90" x2="400" y2="40" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="320" y1="97" x2="400" y2="97" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="320" y1="104" x2="400" y2="154" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="320" y1="110" x2="400" y2="205" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <rect x="400" y="24" width="200" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="44" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">case Circle -&gt; pi*r^2</text>
  <rect x="400" y="82" width="200" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="102" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">case Rectangle -&gt; w*h</text>
  <rect x="400" y="140" width="200" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="160" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">case Triangle -&gt; 0.5*b*h</text>
  <rect x="400" y="190" width="200" height="30" rx="6" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="500" y="210" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">&#9888; any other variant</text>

  <text x="310" y="255" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Exhaustiveness checking: an unhandled variant is a compiler error, not a runtime surprise.</text>
</svg>
