<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">map -&gt; filter -&gt; reduce</text>

  <rect x="10" y="70" width="100" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="60" y="90" text-anchor="middle" font-size="10" font-family="monospace" fill="var(--dg-ink, #202124)">[1,2,3,4,5]</text>

  <line x1="110" y1="85" x2="150" y2="85" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="150" y="55" width="110" height="60" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="205" y="76" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">map: double</text>
  <text x="205" y="100" text-anchor="middle" font-size="9" font-family="monospace" fill="var(--dg-muted, #5F6368)">[2,4,6,8,10]</text>

  <line x1="260" y1="85" x2="300" y2="85" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="300" y="55" width="110" height="60" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="355" y="76" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">filter: &gt;4</text>
  <text x="355" y="100" text-anchor="middle" font-size="9" font-family="monospace" fill="var(--dg-muted, #5F6368)">[6,8,10]</text>

  <line x1="410" y1="85" x2="450" y2="85" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="450" y="55" width="100" height="60" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="500" y="76" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">reduce: sum</text>

  <line x1="550" y1="85" x2="590" y2="85" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="612" y="90" text-anchor="middle" font-size="14" font-family="monospace" fill="var(--dg-ink, #202124)" font-weight="600">24</text>

  <text x="320" y="160" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Three named stages, three full passes over the data — not one pass.</text>
</svg>
