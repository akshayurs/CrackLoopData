<svg viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="280" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Mapping "+1" over a boxed value</text>

  <path d="M180,36 L230,36 L245,54 L165,54 Z" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="205" y="49" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">+1</text>
  <line x1="205" y1="54" x2="205" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="140" y="70" width="130" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="205" y="98" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Some(5) &#8594; Some(6)</text>

  <path d="M180,146 L230,146 L245,164 L165,164 Z" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" opacity="0.4"/>
  <line x1="205" y1="146" x2="245" y2="164" stroke="var(--dg-muted, #5F6368)" stroke-width="1.5"/>
  <line x1="245" y1="146" x2="205" y2="164" stroke="var(--dg-muted, #5F6368)" stroke-width="1.5"/>
  <text x="205" y="157" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">+1</text>
  <line x1="205" y1="164" x2="205" y2="180" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="140" y="180" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="205" y="208" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">None &#8594; None</text>

  <text x="400" y="98" font-size="11" fill="var(--dg-muted, #5F6368)">function runs, box stays a box</text>
  <text x="400" y="208" font-size="11" fill="var(--dg-muted, #5F6368)">function never runs on empty</text>
</svg>
