<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">map over Some and None</text>

  <path d="M240,45 L280,65 L240,85 L200,65 Z" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="240" y="69" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">+1</text>
  <line x1="240" y1="45" x2="240" y2="30" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="150" y="90" width="180" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="200" y="115" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Some(5)</text>
  <line x1="240" y1="90" x2="260" y2="90" stroke="var(--dg-line, #5F6368)"/>
  <text x="290" y="115" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">-&gt; 6</text>

  <line x1="240" y1="130" x2="240" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="150" y="150" width="180" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="240" y="175" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Some(6)</text>

  <path d="M480,45 L520,65 L480,85 L440,65 Z" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-muted, #5F6368)" opacity="0.5"/>
  <text x="480" y="69" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">+1</text>
  <line x1="440" y1="65" x2="520" y2="65" stroke="var(--dg-muted, #5F6368)" stroke-width="1.5" opacity="0.6"/>
  <line x1="440" y1="45" x2="520" y2="85" stroke="var(--dg-muted, #5F6368)" stroke-width="1.5" opacity="0.6"/>
  <line x1="480" y1="45" x2="480" y2="30" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="420" y="90" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="480" y="115" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">None</text>
  <line x1="480" y1="130" x2="480" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="420" y="150" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="480" y="175" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">None</text>

  <text x="320" y="225" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">map applies +1 only when there's a value; None passes through untouched.</text>
</svg>
