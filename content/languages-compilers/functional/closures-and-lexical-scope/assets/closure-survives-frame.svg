<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">A closure outlives its creating frame</text>

  <text x="150" y="42" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">while outer() is running</text>
  <rect x="50" y="55" width="200" height="90" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="74" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">outer() frame</text>
  <rect x="65" y="82" width="60" height="24" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="95" y="98" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">n = 5</text>
  <rect x="150" y="82" width="80" height="24" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="190" y="98" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">inner fn</text>
  <line x1="190" y1="106" x2="95" y2="106" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>

  <text x="480" y="42" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">after outer() returns</text>
  <rect x="380" y="55" width="200" height="90" rx="8" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="480" y="74" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">outer() frame gone</text>
  <rect x="470" y="82" width="80" height="24" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="510" y="98" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">inner fn</text>
  <line x1="480" y1="106" x2="440" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="400" y="150" width="70" height="28" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="435" y="169" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">heap: n=5</text>

  <line x1="290" y1="100" x2="350" y2="100" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="320" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The compiler must move captured variables to the heap so they outlive the frame.</text>
</svg>
