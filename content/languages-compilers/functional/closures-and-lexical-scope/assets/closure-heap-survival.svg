<svg viewBox="0 0 620 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="150" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">During the call</text>
  <text x="470" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">After the outer function returns</text>

  <rect x="50" y="44" width="200" height="90" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="64" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">outer() frame</text>
  <text x="150" y="82" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-family="monospace">n = 5</text>
  <rect x="90" y="94" width="120" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="150" y="113" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">inner() (returned)</text>
  <line x1="150" y1="94" x2="150" y2="83" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="370" y="70" width="150" height="34" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="445" y="91" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">inner() (floating)</text>

  <rect x="240" y="30" width="140" height="90" rx="8" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <text x="310" y="20" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">outer() frame gone</text>

  <line x1="445" y1="104" x2="445" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="400" y="150" width="90" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="445" y="171" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-family="monospace">n = 5</text>
  <text x="445" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">heap-allocated cell</text>

  <text x="310" y="250" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">The variable survives on the heap because the closure still references it.</text>
</svg>
