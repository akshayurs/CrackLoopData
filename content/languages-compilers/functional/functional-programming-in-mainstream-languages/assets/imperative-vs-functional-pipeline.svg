<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Total the price of completed orders, two ways</text>

  <text x="150" y="44" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">imperative-OOP</text>
  <rect x="40" y="55" width="220" height="90" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <path d="M60,70 a30,30 0 1,0 0.1,0" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="60" y="74" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">for</text>
  <rect x="110" y="60" width="90" height="24" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="155" y="76" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">total += ...</text>
  <rect x="90" y="95" width="140" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="160" y="110" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">if completed:</text>
  <text x="160" y="120" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">add order.price</text>

  <text x="480" y="44" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">functional pipeline</text>
  <rect x="360" y="60" width="80" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="400" y="77" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">filter:</text>
  <text x="400" y="87" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">completed</text>
  <line x1="440" y1="73" x2="465" y2="73" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="465" y="60" width="80" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="505" y="77" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">map:</text>
  <text x="505" y="87" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">get price</text>
  <line x1="440" y1="73" x2="440" y2="110" stroke="var(--dg-line, #5F6368)"/>
  <line x1="380" y1="110" x2="600" y2="110" stroke="var(--dg-line, #5F6368)"/>
  <line x1="600" y1="110" x2="600" y2="86" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="565" y="60" width="70" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="600" y="77" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">reduce: sum</text>

  <line x1="160" y1="145" x2="160" y2="185" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="600" y1="86" x2="480" y2="185" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="270" y="185" width="100" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="206" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">same total</text>

  <text x="320" y="245" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Different style, identical result — behavioral equivalence.</text>
</svg>
