<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="150" y="22" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Imperative-OOP</text>
  <text x="470" y="22" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Functional pipeline</text>

  <rect x="40" y="42" width="220" height="110" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <path d="M60,60 a20,20 0 1 1 0,1" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="90" y="66" font-size="10" fill="var(--dg-ink, #202124)">for order in orders:</text>
  <rect x="70" y="78" width="100" height="24" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="120" y="94" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">total += ?</text>
  <text x="90" y="122" font-size="10" fill="var(--dg-ink, #202124)">if completed:</text>
  <text x="90" y="140" font-size="10" fill="var(--dg-muted, #5F6368)">mutate total each turn</text>

  <rect x="330" y="60" width="90" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="375" y="81" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">filter:</text>
  <text x="375" y="94" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">completed</text>
  <line x1="420" y1="77" x2="450" y2="77" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="450" y="60" width="90" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="495" y="81" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">map:</text>
  <text x="495" y="94" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">get price</text>

  <line x1="495" y1="94" x2="495" y2="120" stroke="var(--dg-line, #5F6368)"/>
  <line x1="495" y1="120" x2="375" y2="120" stroke="var(--dg-line, #5F6368)"/>
  <line x1="375" y1="120" x2="375" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="330" y="140" width="90" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="375" y="161" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">reduce: sum</text>

  <text x="310" y="220" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Same result — a mutable accumulator vs. named, composable stages.</text>
</svg>
