<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="150" y="22" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">pure</text>
  <text x="470" y="22" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">impure</text>

  <line x1="40" y1="80" x2="90" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="30" y="70" font-size="9" fill="var(--dg-muted, #5F6368)" text-anchor="middle">inputs</text>
  <rect x="90" y="60" width="120" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="150" y="94" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">f(x)</text>
  <line x1="210" y1="90" x2="260" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="270" y="70" font-size="9" fill="var(--dg-muted, #5F6368)" text-anchor="middle">return</text>

  <line x1="360" y1="80" x2="410" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="410" y="60" width="120" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="470" y="94" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">g(x)</text>
  <line x1="530" y1="90" x2="580" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <path d="M420,60 L400,30" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <circle cx="390" cy="20" r="10" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="390" y="10" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">network</text>

  <path d="M420,80 L385,60" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="365" y="45" width="24" height="18" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="377" y="42" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">db</text>

  <path d="M470,120 L470,160" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="420" y="160" width="100" height="26" rx="5" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="470" y="177" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">mutated var</text>

  <path d="M530,110 L560,150" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="565" y="165" font-size="9" fill="var(--dg-muted, #5F6368)">log</text>

  <text x="310" y="230" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Hidden wires are what make impure code hard to reason about from its signature.</text>
</svg>
