<svg viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="310" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Consuming a lazy list [1, 2, 3, 4, 5...]</text>

  <rect x="20" y="50" width="70" height="44" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="55" y="77" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">1</text>

  <rect x="100" y="50" width="70" height="44" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="135" y="77" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">2</text>

  <line x1="200" y1="72" x2="200" y2="72" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="2 4"/>
  <rect x="180" y="50" width="90" height="44" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="225" y="70" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">thunk:</text>
  <text x="225" y="83" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">compute 3rd</text>

  <rect x="290" y="50" width="60" height="44" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="320" y="77" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">4</text>
  <rect x="360" y="50" width="60" height="44" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="390" y="77" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">...&#8734;</text>

  <line x1="170" y1="105" x2="170" y2="130" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="170" y="150" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">take(3) forces up to here, no further</text>

  <text x="310" y="185" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Nothing computes ahead of where you've actually asked.</text>
</svg>
