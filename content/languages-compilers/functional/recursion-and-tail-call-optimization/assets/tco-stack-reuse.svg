<svg viewBox="0 0 560 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="140" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">without TCO</text>
  <text x="420" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">with TCO</text>

  <g font-size="10" fill="var(--dg-ink, #202124)">
    <rect x="70" y="30" width="140" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="140" y="47" text-anchor="middle">frame 1 (+ pending)</text>
    <rect x="70" y="60" width="140" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="140" y="77" text-anchor="middle">frame 2 (+ pending)</text>
    <rect x="70" y="90" width="140" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="140" y="107" text-anchor="middle">frame 3 (+ pending)</text>
    <rect x="70" y="120" width="140" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="140" y="137" text-anchor="middle">frame 4 (+ pending)</text>
    <rect x="70" y="150" width="140" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="140" y="167" text-anchor="middle">frame 5 (base case)</text>
  </g>
  <text x="140" y="195" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">stack grows with recursion depth</text>

  <rect x="350" y="80" width="140" height="30" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="420" y="100" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">frame (reused in place)</text>
  <path d="M490,90 C 520,70 520,120 490,100" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="140" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">same frame relabelled each call</text>
  <text x="420" y="195" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">constant stack space, any depth</text>

  <text x="280" y="255" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">TCO reuses the current frame instead of pushing a new one for each call.</text>
</svg>
