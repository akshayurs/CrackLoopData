<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Two threads, one shared counter</text>

  <rect x="270" y="105" width="100" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="129" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">counter = 5</text>

  <text x="80" y="50" font-size="11" fill="var(--dg-ink, #202124)">Thread A</text>
  <line x1="40" y1="60" x2="620" y2="60" stroke="var(--dg-stroke, #9AA0A6)"/>
  <line x1="90" y1="55" x2="90" y2="65" stroke="var(--dg-line, #5F6368)"/>
  <line x1="180" y1="55" x2="180" y2="65" stroke="var(--dg-line, #5F6368)"/>
  <line x1="270" y1="55" x2="270" y2="65" stroke="var(--dg-line, #5F6368)"/>
  <text x="90" y="45" font-size="8" fill="var(--dg-muted, #5F6368)">read 5</text>
  <text x="180" y="45" font-size="8" fill="var(--dg-muted, #5F6368)">+1</text>
  <line x1="180" y1="60" x2="290" y2="105" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
  <line x1="270" y1="105" x2="270" y2="65" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3 2"/>
  <text x="270" y="45" font-size="8" fill="var(--dg-muted, #5F6368)">write 6</text>

  <text x="80" y="210" font-size="11" fill="var(--dg-ink, #202124)">Thread B</text>
  <line x1="40" y1="220" x2="620" y2="220" stroke="var(--dg-stroke, #9AA0A6)"/>
  <line x1="120" y1="215" x2="120" y2="225" stroke="var(--dg-line, #5F6368)"/>
  <line x1="220" y1="215" x2="220" y2="225" stroke="var(--dg-line, #5F6368)"/>
  <line x1="320" y1="215" x2="320" y2="225" stroke="var(--dg-line, #5F6368)"/>
  <text x="120" y="235" font-size="8" fill="var(--dg-muted, #5F6368)">read 5</text>
  <text x="220" y="235" font-size="8" fill="var(--dg-muted, #5F6368)">+1</text>
  <line x1="120" y1="220" x2="290" y2="145" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
  <line x1="320" y1="145" x2="320" y2="220" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3 2"/>
  <text x="320" y="235" font-size="8" fill="var(--dg-muted, #5F6368)">write 6</text>

  <text x="320" y="90" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">both read 5 before either writes — one increment is lost</text>
</svg>
