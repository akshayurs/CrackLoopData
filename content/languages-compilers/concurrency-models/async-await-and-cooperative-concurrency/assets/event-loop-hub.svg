<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">The event loop</text>

  <circle cx="320" cy="160" r="55" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="156" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">event loop</text>
  <text x="320" y="172" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">1 task running</text>

  <g font-size="9" fill="var(--dg-ink, #202124)">
    <rect x="90" y="60" width="80" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="130" y="77" text-anchor="middle">network I/O</text>
    <line x1="150" y1="86" x2="280" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

    <rect x="480" y="60" width="80" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="520" y="77" text-anchor="middle">disk I/O</text>
    <line x1="490" y1="86" x2="365" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

    <rect x="90" y="220" width="80" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="130" y="237" text-anchor="middle">timer</text>
    <line x1="150" y1="220" x2="280" y2="185" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

    <rect x="480" y="220" width="90" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="525" y="237" text-anchor="middle">callback queue</text>
    <line x1="480" y1="220" x2="370" y2="190" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  </g>

  <text x="320" y="272" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Completed I/O dispatches its continuation back in — only one runs at a time.</text>
</svg>
