<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Actors: private state + mailbox</text>

  <g font-size="9" fill="var(--dg-ink, #202124)">
    <rect x="40" y="60" width="150" height="90" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="115" y="78" text-anchor="middle" font-weight="600">Actor A</text>
    <rect x="55" y="86" width="50" height="20" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="80" y="100" text-anchor="middle" font-size="8">state</text>
    <rect x="115" y="86" width="60" height="20" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="145" y="100" text-anchor="middle" font-size="8">mailbox</text>
    <text x="115" y="132" text-anchor="middle" font-size="8" fill="var(--dg-accent, #0C8F88)">processing one msg</text>

    <rect x="245" y="60" width="150" height="90" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="320" y="78" text-anchor="middle" font-weight="600">Actor B</text>
    <rect x="260" y="86" width="50" height="20" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="285" y="100" text-anchor="middle" font-size="8">state</text>
    <rect x="320" y="86" width="60" height="20" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="350" y="100" text-anchor="middle" font-size="8">mailbox</text>
    <text x="320" y="132" text-anchor="middle" font-size="8" fill="var(--dg-accent, #0C8F88)">processing one msg</text>

    <rect x="450" y="60" width="150" height="90" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="525" y="78" text-anchor="middle" font-weight="600">Actor C</text>
    <rect x="465" y="86" width="50" height="20" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="490" y="100" text-anchor="middle" font-size="8">state</text>
    <rect x="525" y="86" width="60" height="20" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="555" y="100" text-anchor="middle" font-size="8">mailbox</text>
    <text x="525" y="132" text-anchor="middle" font-size="8" fill="var(--dg-accent, #0C8F88)">processing one msg</text>
  </g>

  <line x1="115" y1="30" x2="115" y2="60" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="320" y1="30" x2="320" y2="60" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="525" y1="30" x2="525" y2="60" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="320" y="42" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">senders deliver messages independently</text>

  <text x="320" y="200" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each actor drains its own queue, one message at a time, isolated from the rest.</text>
</svg>
