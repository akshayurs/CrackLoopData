<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">CSP channels vs shared mutable state</text>

  <text x="170" y="42" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">goroutines connected by channels</text>
  <rect x="40" y="55" width="70" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="75" y="74" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">goroutine A</text>
  <line x1="110" y1="70" x2="170" y2="70" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="140" y="62" text-anchor="middle" font-size="8" fill="var(--dg-accent, #0C8F88)">value</text>
  <rect x="170" y="55" width="70" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="205" y="74" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">goroutine B</text>
  <line x1="240" y1="70" x2="300" y2="70" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="62" text-anchor="middle" font-size="8" fill="var(--dg-accent, #0C8F88)">value</text>
  <rect x="300" y="55" width="70" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="335" y="74" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">goroutine C</text>
  <text x="205" y="105" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">ownership of data moves with it through the pipe</text>

  <rect x="30" y="140" width="360" height="90" rx="8" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="210" y="130" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">alternative: shared mutable variable</text>
  <rect x="170" y="150" width="90" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="215" y="169" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">shared var</text>
  <line x1="90" y1="200" x2="180" y2="165" stroke="var(--dg-line, #5F6368)"/>
  <line x1="215" y1="200" x2="215" y2="180" stroke="var(--dg-line, #5F6368)"/>
  <line x1="340" y1="200" x2="250" y2="165" stroke="var(--dg-line, #5F6368)"/>
  <rect x="55" y="200" width="70" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="90" y="217" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">goroutine A</text>
  <rect x="180" y="200" width="70" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="215" y="217" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">goroutine B</text>
  <rect x="305" y="200" width="70" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="340" y="217" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">goroutine C</text>
  <line x1="30" y1="150" x2="390" y2="220" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <line x1="390" y1="150" x2="30" y2="220" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="420" y="185" font-size="10" fill="var(--dg-accent, #0C8F88)">don't do this</text>

  <text x="320" y="250" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Share by communicating, not by both touching the same box.</text>
</svg>
