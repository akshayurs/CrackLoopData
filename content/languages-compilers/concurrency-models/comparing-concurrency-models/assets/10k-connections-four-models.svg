<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">10,000 connections, four models</text>
  <text x="320" y="36" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">same incoming load in every panel</text>

  <g font-size="10" fill="var(--dg-ink, #202124)">
    <rect x="20" y="55" width="140" height="110" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="90" y="72" text-anchor="middle" font-weight="600">Threads</text>
    <g fill="var(--dg-muted, #5F6368)">
      <rect x="30" y="82" width="8" height="8"/><rect x="42" y="82" width="8" height="8"/><rect x="54" y="82" width="8" height="8"/><rect x="66" y="82" width="8" height="8"/><rect x="78" y="82" width="8" height="8"/><rect x="90" y="82" width="8" height="8"/><rect x="102" y="82" width="8" height="8"/><rect x="114" y="82" width="8" height="8"/><rect x="126" y="82" width="8" height="8"/><rect x="138" y="82" width="8" height="8"/>
      <rect x="30" y="94" width="8" height="8"/><rect x="42" y="94" width="8" height="8"/><rect x="54" y="94" width="8" height="8"/><rect x="66" y="94" width="8" height="8"/><rect x="78" y="94" width="8" height="8"/><rect x="90" y="94" width="8" height="8"/><rect x="102" y="94" width="8" height="8"/><rect x="114" y="94" width="8" height="8"/><rect x="126" y="94" width="8" height="8"/><rect x="138" y="94" width="8" height="8"/>
      <rect x="30" y="106" width="8" height="8"/><rect x="42" y="106" width="8" height="8"/><rect x="54" y="106" width="8" height="8"/><rect x="66" y="106" width="8" height="8"/><rect x="78" y="106" width="8" height="8"/><rect x="90" y="106" width="8" height="8"/><rect x="102" y="106" width="8" height="8"/><rect x="114" y="106" width="8" height="8"/><rect x="126" y="106" width="8" height="8"/><rect x="138" y="106" width="8" height="8"/>
    </g>
    <text x="90" y="130" text-anchor="middle" font-size="9">10,000 OS threads</text>
    <text x="90" y="150" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">high memory overhead</text>

    <rect x="175" y="55" width="140" height="110" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="245" y="72" text-anchor="middle" font-weight="600">Async/await</text>
    <circle cx="245" cy="110" r="35" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="245" y="113" text-anchor="middle" font-size="9">event loop</text>
    <text x="245" y="152" text-anchor="middle" font-size="9">10,000 lightweight tasks</text>

    <rect x="330" y="55" width="140" height="110" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="400" y="72" text-anchor="middle" font-weight="600">Actors</text>
    <g fill="var(--dg-muted, #5F6368)">
      <rect x="340" y="82" width="10" height="10" rx="2"/><rect x="356" y="82" width="10" height="10" rx="2"/><rect x="372" y="82" width="10" height="10" rx="2"/><rect x="388" y="82" width="10" height="10" rx="2"/><rect x="404" y="82" width="10" height="10" rx="2"/><rect x="420" y="82" width="10" height="10" rx="2"/><rect x="436" y="82" width="10" height="10" rx="2"/><rect x="452" y="82" width="10" height="10" rx="2"/>
      <rect x="340" y="98" width="10" height="10" rx="2"/><rect x="356" y="98" width="10" height="10" rx="2"/><rect x="372" y="98" width="10" height="10" rx="2"/><rect x="388" y="98" width="10" height="10" rx="2"/><rect x="404" y="98" width="10" height="10" rx="2"/><rect x="420" y="98" width="10" height="10" rx="2"/><rect x="436" y="98" width="10" height="10" rx="2"/><rect x="452" y="98" width="10" height="10" rx="2"/>
    </g>
    <text x="400" y="130" text-anchor="middle" font-size="9">one actor + mailbox</text>
    <text x="400" y="142" text-anchor="middle" font-size="9">per connection</text>

    <rect x="485" y="55" width="140" height="110" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="555" y="72" text-anchor="middle" font-weight="600">CSP</text>
    <rect x="510" y="85" width="90" height="20" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="555" y="99" text-anchor="middle" font-size="9">jobs channel</text>
    <line x1="530" y1="105" x2="530" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <line x1="555" y1="105" x2="555" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <line x1="580" y1="105" x2="580" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <rect x="515" y="120" width="26" height="20" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="542" y="120" width="26" height="20" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="569" y="120" width="26" height="20" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="555" y="152" text-anchor="middle" font-size="9">worker pool of goroutines</text>
  </g>

  <line x1="320" y1="185" x2="320" y2="200" stroke="var(--dg-line, #5F6368)"/>
  <text x="320" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Same load, four different unit-of-concurrency shapes.</text>
</svg>
