<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Structured vs unstructured concurrency</text>

  <text x="150" y="44" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Structured</text>
  <rect x="40" y="55" width="220" height="150" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="150" y="74" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">parent scope</text>
  <rect x="55" y="85" width="60" height="34" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="85" y="106" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">child 1</text>
  <rect x="120" y="85" width="60" height="34" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="150" y="106" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">child 2</text>
  <rect x="185" y="85" width="60" height="34" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="215" y="106" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">child 3</text>
  <text x="150" y="145" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">scope exit waits for</text>
  <text x="150" y="160" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">all three to finish</text>
  <rect x="65" y="170" width="170" height="20" rx="4" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3 2"/>
  <text x="150" y="184" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">exit gate</text>

  <text x="480" y="44" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Unstructured</text>
  <rect x="370" y="55" width="150" height="80" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="445" y="74" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">parent scope</text>
  <text x="445" y="95" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">(already exited)</text>
  <rect x="520" y="130" width="70" height="34" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 2"/>
  <text x="555" y="151" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">orphan task</text>
  <line x1="450" y1="120" x2="530" y2="140" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3 2"/>
  <text x="555" y="180" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">still running,</text>
  <text x="555" y="193" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">no owner</text>

  <text x="320" y="235" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A scope that outlives its owner can leak work no one is tracking.</text>
</svg>
