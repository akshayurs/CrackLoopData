<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Lock-free stack push: CAS retry loop</text>

  <rect x="30" y="120" width="150" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="105" y="136" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">read current top</text>
  <text x="105" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">oldTop</text>

  <line x1="180" y1="140" x2="230" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="230" y="120" width="150" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="305" y="136" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">build newNode</text>
  <text x="305" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">next = oldTop</text>

  <line x1="380" y1="140" x2="430" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="430" y="120" width="180" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="520" y="136" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">CAS(top, oldTop,</text>
  <text x="520" y="150" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">newNode)</text>

  <line x1="520" y1="160" x2="520" y2="200" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="185" font-size="10" fill="var(--dg-accent, #0C8F88)">success -&gt; done</text>

  <path d="M430,150 C 250,220 150,220 105,160" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="235" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">failure: top changed since read — re-read and retry</text>

  <text x="320" y="265" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">No lock ever held — a failed CAS just means try again with fresh state.</text>
</svg>
