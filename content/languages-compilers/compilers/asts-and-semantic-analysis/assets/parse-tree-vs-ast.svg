<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Parse tree -&gt; AST for 2 + 3 * 4</text>

  <text x="140" y="44" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">parse tree</text>
  <g font-size="11" fill="var(--dg-ink, #202124)">
    <rect x="95" y="54" width="90" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="140" y="71" text-anchor="middle">Expr</text>
    <line x1="140" y1="80" x2="80" y2="106" stroke="var(--dg-line, #5F6368)"/>
    <line x1="140" y1="80" x2="200" y2="106" stroke="var(--dg-line, #5F6368)"/>
    <rect x="40" y="106" width="80" height="24" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="80" y="122" text-anchor="middle">Term</text>
    <rect x="160" y="106" width="80" height="24" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="200" y="122" text-anchor="middle">+ Term</text>
    <line x1="80" y1="130" x2="80" y2="154" stroke="var(--dg-line, #5F6368)"/>
    <rect x="40" y="154" width="80" height="24" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="80" y="170" text-anchor="middle">Factor: 2</text>
    <line x1="200" y1="130" x2="200" y2="154" stroke="var(--dg-line, #5F6368)"/>
    <rect x="150" y="154" width="100" height="24" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="200" y="170" text-anchor="middle">Term * Factor</text>
    <line x1="180" y1="178" x2="150" y2="202" stroke="var(--dg-line, #5F6368)"/>
    <line x1="220" y1="178" x2="250" y2="202" stroke="var(--dg-line, #5F6368)"/>
    <rect x="110" y="202" width="80" height="24" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="150" y="218" text-anchor="middle">Factor: 3</text>
    <rect x="210" y="202" width="80" height="24" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="250" y="218" text-anchor="middle">Factor: 4</text>
  </g>

  <line x1="290" y1="150" x2="360" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="325" y="140" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">collapse</text>

  <text x="500" y="44" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">AST</text>
  <g font-size="12" fill="var(--dg-ink, #202124)">
    <rect x="455" y="60" width="90" height="30" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="500" y="80" text-anchor="middle" font-weight="600">Add</text>
    <line x1="480" y1="90" x2="440" y2="130" stroke="var(--dg-line, #5F6368)"/>
    <line x1="520" y1="90" x2="560" y2="130" stroke="var(--dg-line, #5F6368)"/>
    <rect x="405" y="130" width="70" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="440" y="148" text-anchor="middle">2</text>
    <rect x="525" y="130" width="80" height="30" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="565" y="150" text-anchor="middle" font-weight="600">Mul</text>
    <line x1="545" y1="160" x2="520" y2="190" stroke="var(--dg-line, #5F6368)"/>
    <line x1="585" y1="160" x2="610" y2="190" stroke="var(--dg-line, #5F6368)"/>
    <rect x="490" y="190" width="60" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="520" y="208" text-anchor="middle">3</text>
    <rect x="580" y="190" width="60" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="610" y="208" text-anchor="middle">4</text>
  </g>

  <text x="320" y="278" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Grammar bookkeeping (Expr/Term/Factor) is discarded; only operators and operands remain.</text>
</svg>
