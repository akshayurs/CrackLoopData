<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">AST vs control-flow graph for if/else</text>

  <text x="140" y="44" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">AST</text>
  <rect x="95" y="52" width="90" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="140" y="69" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">if/else</text>
  <line x1="140" y1="78" x2="140" y2="98" stroke="var(--dg-line, #5F6368)"/>
  <line x1="140" y1="98" x2="70" y2="120" stroke="var(--dg-line, #5F6368)"/>
  <line x1="140" y1="98" x2="140" y2="120" stroke="var(--dg-line, #5F6368)"/>
  <line x1="140" y1="98" x2="210" y2="120" stroke="var(--dg-line, #5F6368)"/>
  <rect x="35" y="120" width="70" height="24" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="70" y="136" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">cond</text>
  <rect x="105" y="120" width="70" height="24" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="140" y="136" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">then</text>
  <rect x="175" y="120" width="70" height="24" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="210" y="136" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">else</text>

  <line x1="290" y1="130" x2="350" y2="130" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="500" y="44" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">control-flow graph</text>
  <rect x="440" y="54" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="500" y="68" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">cond 3AC</text>
  <text x="500" y="82" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">cond. branch</text>
  <line x1="470" y1="88" x2="430" y2="112" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="530" y1="88" x2="570" y2="112" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="380" y="112" width="100" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="430" y="131" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">then-block</text>
  <rect x="520" y="112" width="100" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="570" y="131" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">else-block</text>
  <line x1="430" y1="142" x2="480" y2="176" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="570" y1="142" x2="520" y2="176" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="440" y="176" width="120" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="500" y="195" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">merge block</text>

  <text x="320" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Basic blocks as nodes, possible jumps as edges — reachability is a graph question.</text>
</svg>
