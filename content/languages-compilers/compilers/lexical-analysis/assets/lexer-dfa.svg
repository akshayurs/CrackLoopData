<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Lexer DFA scanning "total"</text>

  <circle cx="70" cy="90" r="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="94" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">start</text>

  <line x1="94" y1="90" x2="240" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="165" y="80" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">[a-zA-Z_]</text>

  <circle cx="280" cy="90" r="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <circle cx="280" cy="90" r="24" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="280" y="94" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">IDENT</text>
  <path d="M270,62 A30,30 0 0 1 310,72" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="330" y="55" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">[a-zA-Z0-9_]</text>

  <circle cx="70" cy="200" r="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="204" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">start</text>
  <line x1="94" y1="200" x2="240" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="165" y="190" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">[0-9]</text>
  <circle cx="280" cy="200" r="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <circle cx="280" cy="200" r="24" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="280" y="204" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">NUM</text>
  <path d="M270,172 A30,30 0 0 1 310,182" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="330" y="165" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">[0-9]</text>

  <rect x="420" y="60" width="200" height="160" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="520" y="82" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">source cursor</text>
  <text x="520" y="130" text-anchor="middle" font-size="20" font-family="monospace" fill="var(--dg-ink, #202124)">t o t | a l</text>
  <text x="490" y="150" text-anchor="middle" font-size="18" fill="var(--dg-accent, #0C8F88)">^</text>
  <text x="520" y="175" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">consumed "tot",</text>
  <text x="520" y="190" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">currently in IDENT state</text>

  <text x="320" y="255" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">One active state at a time, no backtracking — per-character scan is a table lookup.</text>
</svg>
