<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Tree-walking eval(2 + 3 * 4)</text>

  <rect x="270" y="40" width="100" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Add</text>

  <line x1="290" y1="70" x2="200" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="230" y="90" font-size="10" fill="var(--dg-accent, #0C8F88)">1: eval(2)</text>
  <rect x="160" y="110" width="80" height="28" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="200" y="129" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">2</text>
  <line x1="210" y1="110" x2="290" y2="82" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="270" y="98" font-size="9" fill="var(--dg-muted, #5F6368)">returns 2</text>

  <line x1="350" y1="70" x2="440" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="400" y="90" font-size="10" fill="var(--dg-accent, #0C8F88)">2: eval(Mul)</text>
  <rect x="400" y="110" width="80" height="28" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="440" y="129" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Mul</text>

  <line x1="420" y1="138" x2="390" y2="170" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="380" y="158" font-size="9" fill="var(--dg-accent, #0C8F88)">3: eval(3)</text>
  <rect x="350" y="170" width="70" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="385" y="187" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">3</text>

  <line x1="460" y1="138" x2="490" y2="170" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="500" y="158" font-size="9" fill="var(--dg-accent, #0C8F88)">4: eval(4)</text>
  <rect x="460" y="170" width="70" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="495" y="187" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">4</text>

  <line x1="420" y1="196" x2="440" y2="140" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="490" y1="196" x2="450" y2="140" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="460" y="212" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">3*4 returns 12</text>

  <line x1="440" y1="110" x2="330" y2="72" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="380" y="235" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)">Add(2, 12) returns 14</text>

  <text x="320" y="265" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Every node visit is a real function call — repeated fresh on every evaluation.</text>
</svg>
