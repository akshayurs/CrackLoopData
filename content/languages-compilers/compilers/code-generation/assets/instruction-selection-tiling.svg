<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Instruction selection as tree tiling</text>

  <rect x="50" y="40" width="220" height="110" rx="8" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="160" y="34" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">matches one x86 addressing mode</text>
  <rect x="130" y="52" width="60" height="24" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="160" y="68" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">+</text>
  <line x1="145" y1="76" x2="100" y2="100" stroke="var(--dg-line, #5F6368)"/>
  <line x1="175" y1="76" x2="220" y2="100" stroke="var(--dg-line, #5F6368)"/>
  <rect x="65" y="100" width="70" height="24" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="100" y="116" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">base reg</text>
  <rect x="185" y="100" width="70" height="24" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="220" y="116" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">*</text>
  <line x1="205" y1="124" x2="185" y2="140" stroke="var(--dg-line, #5F6368)"/>
  <line x1="235" y1="124" x2="250" y2="140" stroke="var(--dg-line, #5F6368)"/>
  <text x="185" y="150" font-size="9" fill="var(--dg-ink, #202124)">index</text>
  <text x="245" y="150" font-size="9" fill="var(--dg-ink, #202124)">elemSz</text>

  <line x1="270" y1="95" x2="360" y2="95" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="370" y="70" width="230" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="485" y="95" text-anchor="middle" font-size="12" font-family="monospace" fill="var(--dg-ink, #202124)">MOV reg, [base+index*4]</text>

  <text x="320" y="185" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">no single fused pattern -&gt; three chained instructions</text>
  <rect x="120" y="200" width="90" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="165" y="217" text-anchor="middle" font-size="10" font-family="monospace" fill="var(--dg-ink, #202124)">MUL t, i, sz</text>
  <line x1="210" y1="213" x2="240" y2="213" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="240" y="200" width="90" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="285" y="217" text-anchor="middle" font-size="10" font-family="monospace" fill="var(--dg-ink, #202124)">ADD a, b, t</text>
  <line x1="330" y1="213" x2="360" y2="213" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="360" y="200" width="90" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="405" y="217" text-anchor="middle" font-size="10" font-family="monospace" fill="var(--dg-ink, #202124)">LOAD [a]</text>

  <text x="320" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Selection tiles the IR tree with patterns, picking fewest, cheapest instructions.</text>
</svg>
