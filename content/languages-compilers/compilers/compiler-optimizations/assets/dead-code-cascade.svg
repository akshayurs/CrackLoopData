<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Cascading dead-code elimination</text>

  <text x="150" y="44" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">before</text>
  <rect x="70" y="52" width="160" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="150" y="69" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">cond: folds to false</text>
  <line x1="120" y1="78" x2="90" y2="102" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="180" y1="78" x2="210" y2="102" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="30" y="102" width="120" height="44" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="90" y="120" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">then-block</text>
  <text x="90" y="136" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">unused compute</text>
  <rect x="170" y="102" width="120" height="44" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="230" y="124" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">else-block</text>
  <text x="230" y="139" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">only path reached</text>
  <line x1="90" y1="146" x2="90" y2="168" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="230" y1="146" x2="230" y2="168" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="60" y="168" width="200" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="160" y="185" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">after if/else</text>

  <line x1="300" y1="130" x2="360" y2="130" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="118" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">optimize</text>

  <text x="490" y="44" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">after</text>
  <rect x="400" y="102" width="180" height="44" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="490" y="124" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">else-block only</text>
  <text x="490" y="139" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">condition + then-block gone</text>
  <line x1="490" y1="146" x2="490" y2="168" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="430" y="168" width="120" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="490" y="185" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">after if/else</text>

  <text x="320" y="248" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">One folded condition removes a block, and whatever fed only that block, too.</text>
</svg>
