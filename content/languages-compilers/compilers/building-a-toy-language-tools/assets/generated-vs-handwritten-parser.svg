<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Parser generator vs hand-written parser</text>

  <rect x="30" y="45" width="90" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="75" y="64" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">grammar file</text>
  <line x1="120" y1="60" x2="170" y2="60" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="170" y="45" width="120" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="230" y="64" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">parser generator</text>
  <line x1="290" y1="60" x2="340" y2="60" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="340" y="45" width="120" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="400" y="64" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">generated parser</text>
  <line x1="230" y1="75" x2="230" y2="100" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="255" y="100" font-size="9" fill="var(--dg-muted, #5F6368)">conflict report</text>

  <line x1="30" y1="140" x2="120" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="75" y="130" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">developer</text>
  <rect x="120" y="125" width="90" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="165" y="141" text-anchor="middle" font-size="9" font-family="monospace" fill="var(--dg-ink, #202124)">parse_expr</text>
  <rect x="220" y="125" width="90" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="265" y="141" text-anchor="middle" font-size="9" font-family="monospace" fill="var(--dg-ink, #202124)">parse_term</text>
  <rect x="320" y="125" width="90" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="365" y="141" text-anchor="middle" font-size="9" font-family="monospace" fill="var(--dg-ink, #202124)">parse_factor</text>
  <line x1="410" y1="138" x2="460" y2="138" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="500" y="132" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">working parser</text>

  <text x="320" y="210" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Generated: one extra step, free ambiguity check. Hand-written: fully on you.</text>
</svg>
