<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">The compilation pipeline</text>

  <rect x="10" y="60" width="290" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="155" y="80" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Front End</text>
  <rect x="310" y="60" width="320" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="470" y="80" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Back End</text>

  <g font-size="9" fill="var(--dg-ink, #202124)">
    <rect x="15" y="110" width="80" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="55" y="129" text-anchor="middle">Source</text>
    <line x1="95" y1="125" x2="115" y2="125" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <text x="105" y="115" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">text</text>

    <rect x="115" y="110" width="70" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="150" y="129" text-anchor="middle">Lexer</text>
    <line x1="185" y1="125" x2="205" y2="125" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <text x="195" y="115" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">tokens</text>

    <rect x="205" y="110" width="70" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="240" y="129" text-anchor="middle">Parser</text>
    <line x1="275" y1="125" x2="295" y2="125" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <text x="285" y="115" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">AST</text>

    <rect x="295" y="110" width="80" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="335" y="122" text-anchor="middle">Semantic</text>
    <text x="335" y="133" text-anchor="middle">Analysis</text>
    <line x1="375" y1="125" x2="395" y2="125" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <text x="385" y="115" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">ann. AST</text>

    <rect x="395" y="110" width="70" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="430" y="122" text-anchor="middle">IR Gen</text>
    <line x1="465" y1="125" x2="485" y2="125" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <text x="475" y="115" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">IR</text>

    <rect x="485" y="110" width="70" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="520" y="122" text-anchor="middle">Optimize</text>
    <line x1="555" y1="125" x2="575" y2="125" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <text x="565" y="115" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">opt. IR</text>

    <rect x="575" y="110" width="55" height="30" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="602" y="122" text-anchor="middle">Codegen</text>
  </g>

  <text x="500" y="175" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">-&gt; Machine Code</text>
  <text x="320" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each stage takes one input shape and produces one output shape — text, tree, IR, opcode.</text>
</svg>
