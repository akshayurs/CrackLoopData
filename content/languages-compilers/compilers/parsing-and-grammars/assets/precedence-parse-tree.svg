<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Parse tree for 2 + 3 * 4</text>

  <rect x="280" y="40" width="80" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="320" y="57" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Expr</text>

  <line x1="300" y1="66" x2="230" y2="90" stroke="var(--dg-line, #5F6368)"/>
  <line x1="320" y1="66" x2="320" y2="90" stroke="var(--dg-line, #5F6368)"/>
  <line x1="340" y1="66" x2="420" y2="90" stroke="var(--dg-line, #5F6368)"/>

  <rect x="190" y="90" width="80" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="230" y="107" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Expr</text>
  <text x="320" y="107" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">PLUS</text>
  <rect x="380" y="90" width="80" height="26" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="420" y="107" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Term</text>

  <line x1="230" y1="116" x2="230" y2="140" stroke="var(--dg-line, #5F6368)"/>
  <rect x="190" y="140" width="80" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="230" y="157" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Term</text>
  <line x1="230" y1="166" x2="230" y2="190" stroke="var(--dg-line, #5F6368)"/>
  <rect x="190" y="190" width="80" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="230" y="207" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">NUM: 2</text>

  <line x1="400" y1="116" x2="360" y2="140" stroke="var(--dg-line, #5F6368)"/>
  <line x1="420" y1="116" x2="420" y2="140" stroke="var(--dg-line, #5F6368)"/>
  <line x1="440" y1="116" x2="480" y2="140" stroke="var(--dg-line, #5F6368)"/>
  <rect x="320" y="140" width="80" height="26" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="360" y="157" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Term</text>
  <text x="420" y="157" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">STAR</text>
  <rect x="440" y="140" width="80" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="480" y="157" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">NUM: 4</text>

  <line x1="360" y1="166" x2="360" y2="190" stroke="var(--dg-line, #5F6368)"/>
  <rect x="320" y="190" width="80" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="360" y="207" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">NUM: 3</text>

  <text x="320" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Multiplication nests one level deeper — precedence made visible in tree shape.</text>
</svg>
