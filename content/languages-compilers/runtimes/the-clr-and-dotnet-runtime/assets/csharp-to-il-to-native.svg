<svg viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <rect x="10" y="60" width="110" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="65" y="84" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">C# source</text>

  <line x1="120" y1="80" x2="170" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="145" y="65" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">Roslyn</text>

  <rect x="170" y="60" width="150" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="245" y="84" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">IL inside .dll</text>

  <line x1="320" y1="80" x2="370" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="345" y="65" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">RyuJIT</text>

  <rect x="370" y="60" width="150" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="445" y="84" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Native machine code</text>

  <line x1="220" y1="100" x2="220" y2="140" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3"/>
  <text x="220" y="158" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">F# and VB.NET compile to the same IL</text>
  <text x="220" y="172" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">and join this pipeline at the same point</text>
</svg>
