<svg viewBox="0 0 560 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="280" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Two objects sharing one hidden class</text>

  <rect x="30" y="46" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="65" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">obj1</text>
  <text x="100" y="80" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">x: 1, y: 2</text>

  <rect x="390" y="46" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="460" y="65" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">obj2</text>
  <text x="460" y="80" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">x: 5, y: 7</text>

  <line x1="150" y1="92" x2="230" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="410" y1="92" x2="330" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="180" y="150" width="200" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="280" y="171" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Hidden Class C0</text>
  <text x="280" y="188" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">x @ offset 0, y @ offset 8</text>

  <text x="280" y="225" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Property access resolves through the shared class to a fixed offset, not a per-object lookup.</text>
</svg>
