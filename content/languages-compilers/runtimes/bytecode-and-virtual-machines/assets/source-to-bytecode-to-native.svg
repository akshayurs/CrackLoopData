<svg viewBox="0 0 620 180" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <rect x="10" y="60" width="110" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="65" y="84" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Source code</text>

  <line x1="120" y1="80" x2="170" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="145" y="65" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">compiler</text>

  <rect x="170" y="60" width="130" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="235" y="84" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Bytecode (.class)</text>

  <line x1="300" y1="80" x2="350" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="325" y="65" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">interpret / JIT</text>

  <rect x="350" y="40" width="160" height="80" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="430" y="30" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">this topic</text>
  <text x="430" y="66" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Virtual Machine</text>
  <text x="430" y="86" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">interpret or</text>
  <text x="430" y="100" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">JIT-compile</text>

  <line x1="510" y1="80" x2="560" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="590" y="76" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Running</text>
  <text x="590" y="90" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">native</text>
  <text x="590" y="104" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">instructions</text>

  <text x="310" y="160" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Bytecode is a portable middle format between source and native execution.</text>
</svg>
