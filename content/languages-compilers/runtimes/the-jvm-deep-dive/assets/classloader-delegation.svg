<svg viewBox="0 0 480 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="240" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Classloader delegation chain</text>

  <rect x="140" y="150" width="200" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="171" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Application ClassLoader</text>

  <line x1="240" y1="150" x2="240" y2="116" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="140" y="82" width="200" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="103" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Platform ClassLoader</text>

  <line x1="240" y1="82" x2="240" y2="48" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="140" y="14" width="200" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="240" y="35" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Bootstrap ClassLoader</text>

  <text x="140" y="65" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)" transform="rotate(-90 140 65)">delegates to parent first</text>

  <text x="240" y="215" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">java.lang.Object always resolves at Bootstrap level</text>
</svg>
