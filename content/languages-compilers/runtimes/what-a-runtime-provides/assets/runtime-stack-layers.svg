<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="240" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Where the runtime sits</text>

  <rect x="90" y="36" width="300" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="240" y="59" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Your Program</text>

  <line x1="240" y1="72" x2="240" y2="92" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="90" y="92" width="300" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="115" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Runtime (JVM / CLR / V8 / CPython)</text>

  <line x1="240" y1="128" x2="240" y2="148" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="90" y="148" width="300" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="171" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Operating System</text>

  <line x1="240" y1="184" x2="240" y2="204" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="90" y="204" width="300" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="227" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Hardware</text>
</svg>
