<svg viewBox="0 0 620 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="20" y="34" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">JIT</text>
  <rect x="80" y="20" width="110" height="28" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="135" y="38" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">interpreted</text>
  <rect x="190" y="20" width="110" height="28" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="245" y="38" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">C1 compiled</text>
  <rect x="300" y="20" width="150" height="28" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="375" y="38" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">C2, near-native</text>
  <path d="M80,90 C 200,90 300,50 450,35" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="470" y="30" font-size="9" fill="var(--dg-muted, #5F6368)">speed ramps up</text>

  <text x="20" y="140" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">AOT</text>
  <rect x="80" y="126" width="370" height="28" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="265" y="144" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">native speed, from the start</text>
  <line x1="80" y1="140" x2="450" y2="140" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>

  <line x1="30" y1="126" x2="70" y2="140" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3 2"/>
  <text x="10" y="185" font-size="9" fill="var(--dg-muted, #5F6368)" text-anchor="middle">compiled before</text>
  <text x="10" y="197" font-size="9" fill="var(--dg-muted, #5F6368)" text-anchor="middle">this timeline started</text>

  <text x="310" y="215" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">AOT trades warm-up ramp for slower, offline compilation.</text>
</svg>
