<svg viewBox="0 0 560 180" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="280" y="20" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">JIT warm-up for one method</text>

  <text x="130" y="45" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">calls: 1 2 3 ... N &#8593;</text>
  <rect x="40" y="60" width="200" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="140" y="82" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">interpreted, profiler counting</text>

  <line x1="240" y1="77" x2="290" y2="77" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="265" y="60" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">JIT compiles</text>
  <text x="265" y="120" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">in background</text>

  <rect x="290" y="60" width="230" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="405" y="82" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">running compiled native code</text>

  <text x="280" y="155" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Only methods that get hot enough are ever compiled.</text>
</svg>
