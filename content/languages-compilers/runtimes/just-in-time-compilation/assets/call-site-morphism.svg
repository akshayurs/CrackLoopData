<svg viewBox="0 0 620 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="100" y="24" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Monomorphic</text>
  <text x="310" y="24" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Polymorphic</text>
  <text x="520" y="24" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Megamorphic</text>

  <rect x="30" y="40" width="140" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="62" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">one shape observed</text>

  <rect x="240" y="40" width="140" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="310" y="62" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">2-3 shapes observed</text>

  <rect x="450" y="40" width="140" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="520" y="62" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">many scattered shapes</text>

  <line x1="100" y1="74" x2="100" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="310" y1="74" x2="310" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="520" y1="74" x2="520" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="30" y="110" width="140" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="100" y="134" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">fast direct call</text>

  <rect x="240" y="110" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="310" y="128" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">checked cache</text>
  <text x="310" y="142" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">with fallback</text>

  <rect x="450" y="110" width="140" height="40" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="520" y="134" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">generic slow dispatch</text>

  <text x="310" y="195" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">More observed shapes at a call site means less specialization the JIT can apply.</text>
</svg>
