<svg viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <rect x="10" y="60" width="130" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="84" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Managed (Java/C#)</text>

  <line x1="140" y1="72" x2="190" y2="72" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="190" y="40" width="220" height="100" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="300" y="60" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Marshaling layer</text>
  <text x="300" y="78" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">string conversion</text>
  <text x="300" y="93" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">struct layout</text>
  <text x="300" y="108" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">pointer / handle translation</text>

  <line x1="410" y1="90" x2="460" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="460" y="70" width="130" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="525" y="94" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Native (C/C++)</text>

  <path d="M525,110 C 450,150 250,150 190,110" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="155" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">result converted back through the marshaling layer</text>

  <text x="310" y="185" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Every call across the boundary pays this conversion cost both ways.</text>
</svg>
