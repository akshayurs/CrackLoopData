<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="280" y="22" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">?- grandparent(tom, W).</text>

  <rect x="210" y="34" width="140" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="280" y="53" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">parent(tom, Y)</text>

  <line x1="280" y1="64" x2="280" y2="96" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="300" y="85" font-size="10" fill="var(--dg-muted, #5F6368)">Y = bob</text>

  <rect x="210" y="96" width="140" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="280" y="115" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">parent(bob, Z)</text>

  <line x1="280" y1="126" x2="180" y2="170" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="280" y1="126" x2="380" y2="170" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="120" y="170" width="120" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="180" y="189" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Z = ann</text>

  <rect x="320" y="170" width="120" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="380" y="189" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Z = pat</text>

  <path d="M180,200 C 120,230 250,250 320,195" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="220" y="248" font-size="10" fill="var(--dg-muted, #5F6368)">backtrack: try next alternative</text>

  <text x="280" y="285" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Failing branches are undone; the engine retries the next binding.</text>
</svg>
