<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Mutation timeline</text>

  <g font-size="12">
    <text x="20" y="60" fill="var(--dg-ink, #202124)" font-family="monospace">x = 5</text>
    <rect x="220" y="44" width="90" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="265" y="61" text-anchor="middle" fill="var(--dg-ink, #202124)">x: &#8709;&#8594;5</text>

    <text x="20" y="105" fill="var(--dg-ink, #202124)" font-family="monospace">x = x + 1</text>
    <rect x="220" y="89" width="90" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="265" y="106" text-anchor="middle" fill="var(--dg-ink, #202124)">x: 5&#8594;6</text>

    <text x="20" y="150" fill="var(--dg-ink, #202124)" font-family="monospace">y = x * 2</text>
    <rect x="220" y="134" width="90" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="265" y="151" text-anchor="middle" fill="var(--dg-ink, #202124)">y: &#8709;&#8594;12</text>

    <text x="20" y="195" fill="var(--dg-ink, #202124)" font-family="monospace">x = 0</text>
    <rect x="220" y="179" width="90" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="265" y="196" text-anchor="middle" fill="var(--dg-ink, #202124)">x: 6&#8594;0</text>
  </g>

  <line x1="265" y1="70" x2="265" y2="89" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="265" y1="160" x2="265" y2="179" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M310,57 C 420,57 420,192 310,192" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="430" y="128" font-size="11" fill="var(--dg-muted, #5F6368)">x overwritten 3&#215;</text>

  <text x="280" y="255" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A variable's past values are not recoverable — only its current one is.</text>
</svg>
