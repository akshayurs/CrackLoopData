<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="160" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Imperative call stack</text>
  <text x="480" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Event loop</text>

  <rect x="90" y="50" width="140" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="73" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">main()</text>
  <rect x="105" y="96" width="110" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="119" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">f()</text>
  <rect x="120" y="142" width="80" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="165" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">g()</text>
  <line x1="160" y1="178" x2="160" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="160" y="216" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">returns in strict nested order</text>

  <circle cx="480" cy="150" r="72" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M540,100 A72,72 0 0 1 552,150" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="440" y="130" width="80" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="480" y="154" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">event loop</text>

  <rect x="360" y="60" width="76" height="28" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="398" y="79" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">click</text>
  <rect x="360" y="230" width="76" height="28" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="398" y="249" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">timer</text>
  <rect x="520" y="230" width="100" height="28" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="570" y="249" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">network resp.</text>

  <text x="480" y="298" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each dequeued event runs its handler to completion, then the loop checks again.</text>
</svg>
