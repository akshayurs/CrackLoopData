<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Same task, three paradigms</text>

  <rect x="20" y="46" width="150" height="34" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="67" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Orders list</text>

  <line x1="170" y1="63" x2="230" y2="63" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="170" y1="63" x2="230" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="170" y1="63" x2="230" y2="237" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="230" y="42" width="230" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="345" y="60" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Imperative</text>
  <text x="345" y="77" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">loop, total += order.amount</text>

  <rect x="230" y="130" width="230" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="345" y="148" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Object-Oriented</text>
  <text x="345" y="165" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">OrderBook.shippedRevenue()</text>

  <rect x="230" y="217" width="230" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="345" y="235" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Functional</text>
  <text x="345" y="252" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">filter -&gt; map -&gt; reduce</text>

  <line x1="460" y1="65" x2="540" y2="145" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="460" y1="153" x2="540" y2="153" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="460" y1="240" x2="540" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="540" y="128" width="80" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="580" y="149" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Same</text>
  <text x="580" y="165" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">total</text>

  <text x="320" y="298" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Identical output — the difference is where the logic lives and how it extends.</text>
</svg>
