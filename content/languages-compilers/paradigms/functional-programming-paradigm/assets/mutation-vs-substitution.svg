<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Squaring evens in [1,2,3,4]</text>

  <text x="20" y="52" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Imperative (mutation timeline)</text>
  <rect x="30" y="62" width="90" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="82" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">result = []</text>
  <line x1="120" y1="77" x2="160" y2="77" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="160" y="62" width="90" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="205" y="82" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">[4]</text>
  <line x1="250" y1="77" x2="290" y2="77" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="290" y="62" width="90" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="335" y="82" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">[4, 16]</text>
  <text x="450" y="82" font-size="11" fill="var(--dg-muted, #5F6368)">history = the sequence of appends</text>

  <text x="20" y="140" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Functional (substitution chain)</text>
  <rect x="30" y="150" width="200" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="130" y="172" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">map(sq, filter(even, [1,2,3,4]))</text>
  <line x1="230" y1="167" x2="270" y2="167" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="270" y="150" width="150" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="345" y="172" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">map(sq, [2, 4])</text>
  <line x1="420" y1="167" x2="460" y2="167" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="460" y="150" width="90" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="505" y="172" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">[4, 16]</text>
  <text x="320" y="215" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Each arrow replaces an expression with its value — no timeline, no accumulator.</text>

  <text x="320" y="245" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Both reach [4, 16] — states vs. expressions.</text>
</svg>
