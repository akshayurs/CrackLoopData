<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="150" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">calculateArea(shape)</text>
  <text x="470" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">shape.area()</text>

  <rect x="60" y="50" width="180" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="71" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">call site</text>
  <line x1="150" y1="84" x2="150" y2="116" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="60" y="116" width="180" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="150" y="140" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">one fixed function</text>
  <text x="150" y="176" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">known at compile time</text>

  <rect x="380" y="50" width="180" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="470" y="71" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">shape.area() message</text>
  <line x1="470" y1="84" x2="470" y2="106" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="400" y="106" width="140" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="470" y="125" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">dispatch table</text>

  <line x1="440" y1="136" x2="410" y2="170" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="500" y1="136" x2="530" y2="170" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="330" y="170" width="150" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="405" y="191" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Circle.area()</text>
  <rect x="490" y="170" width="150" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="565" y="191" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Rectangle.area()</text>

  <text x="470" y="230" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">which code runs depends on shape's runtime type</text>
</svg>
