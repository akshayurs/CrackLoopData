<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Devices contending for airtime</text>

  <rect x="290" y="100" width="140" height="55" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="360" y="132" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Access Point</text>

  <g stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.3" fill="none">
    <line x1="290" y1="115" x2="120" y2="60"/>
    <line x1="290" y1="127" x2="100" y2="130"/>
    <line x1="290" y1="140" x2="120" y2="200"/>
    <line x1="430" y1="120" x2="600" y2="70"/>
    <line x1="430" y1="145" x2="600" y2="190"/>
  </g>

  <g font-size="9" fill="var(--dg-ink, #202124)">
    <circle cx="100" cy="55" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="100" y="59" text-anchor="middle">Laptop</text>
    <circle cx="70" cy="130" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="70" y="134" text-anchor="middle">Phone</text>
    <circle cx="100" cy="205" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="100" y="209" text-anchor="middle">TV</text>
    <circle cx="618" cy="60" r="18" fill="#c0392b" opacity="0.85"/>
    <text x="618" y="64" text-anchor="middle" fill="#fff">4K</text>
    <circle cx="618" cy="195" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="618" y="199" text-anchor="middle">Tablet</text>
  </g>

  <text x="360" y="235" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">One device streaming 4K video visibly slows every other device sharing the same AP.</text>
</svg>
