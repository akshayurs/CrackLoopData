<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowW" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Associating with an access point</text>

  <circle cx="90" cy="140" r="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="145" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Device</text>

  <rect x="500" y="110" width="150" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="575" y="135" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Access Point</text>
  <text x="575" y="152" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">SSID + BSSID</text>

  <path d="M500,120 H115" stroke="var(--dg-line, #5F6368)" stroke-width="1.4" marker-end="url(#arrowW)"/>
  <text x="300" y="112" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">1. SSID broadcast (beacon)</text>

  <path d="M115,140 H500" stroke="var(--dg-line, #5F6368)" stroke-width="1.4" marker-end="url(#arrowW)"/>
  <text x="300" y="155" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">2. authentication request</text>

  <path d="M500,175 H115" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowW)"/>
  <text x="300" y="190" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">3. association response — connected to this BSSID</text>

  <text x="360" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A device picks a network by SSID but associates with one specific BSSID.</text>
</svg>
