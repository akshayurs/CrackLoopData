<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Handoff between towers</text>

  <circle cx="150" cy="150" r="90" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="90" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Tower A</text>

  <circle cx="490" cy="150" r="90" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="90" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Tower B</text>

  <rect x="255" y="105" width="130" height="90" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="320" y="130" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">overlap zone</text>
  <text x="320" y="146" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">handoff decision</text>
  <text x="320" y="160" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">made here, before</text>
  <text x="320" y="174" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">A's signal drops</text>

  <path d="M110,190 C220,220 420,220 530,190" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="235" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">phone moving mid-call</text>

  <circle cx="150" cy="150" r="6" fill="var(--dg-accent, #0C8F88)"/>
  <circle cx="490" cy="150" r="6" fill="var(--dg-accent, #0C8F88)"/>

  <text x="320" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Network monitors neighbor signal strength continuously and switches</text>
  <text x="320" y="288" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">towers before the old one becomes unusable — imperceptible if timed well.</text>
</svg>
