<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Hexagonal cell layout</text>

  <g stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" fill="var(--dg-fill, #F1F3F4)">
    <polygon points="220,70 260,93 260,139 220,162 180,139 180,93"/>
    <polygon points="320,70 360,93 360,139 320,162 280,139 280,93"/>
    <polygon points="420,70 460,93 460,139 420,162 380,139 380,93"/>
    <polygon points="270,145 310,168 310,214 270,237 230,214 230,168"/>
    <polygon points="370,145 410,168 410,214 370,237 330,214 330,168"/>
  </g>

  <circle cx="220" cy="116" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <circle cx="320" cy="116" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <circle cx="420" cy="116" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <circle cx="270" cy="191" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <circle cx="370" cy="191" r="4" fill="var(--dg-accent, #0C8F88)"/>

  <text x="220" y="105" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">tower</text>
  <text x="320" y="105" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">tower</text>

  <rect x="235" y="85" width="50" height="20" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4,3" opacity="0.85"/>
  <text x="260" y="99" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">overlap</text>

  <text x="320" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Cells overlap at their edges by design, so a phone is already in range</text>
  <text x="320" y="288" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">of the next tower before it needs to hand off from the current one.</text>
</svg>
