<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A lost packet: UDP vs TCP</text>

  <text x="160" y="52" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">UDP</text>
  <rect x="60" y="66" width="80" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="100" y="87" text-anchor="middle" font-size="11">pkt 1</text>
  <rect x="150" y="66" width="80" height="34" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3"/>
  <text x="190" y="87" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">pkt 2 lost</text>
  <rect x="240" y="66" width="80" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="280" y="87" text-anchor="middle" font-size="11">pkt 3</text>
  <line x1="320" y1="120" x2="320" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="190" y="130" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">gap simply passes to the app — never resent</text>

  <text x="500" y="52" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">TCP</text>
  <rect x="400" y="66" width="80" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="440" y="87" text-anchor="middle" font-size="11">seg 1</text>
  <rect x="490" y="66" width="80" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="530" y="87" text-anchor="middle" font-size="10">seg 2 lost</text>
  <rect x="580" y="66" width="80" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="620" y="87" text-anchor="middle" font-size="11">seg 3</text>
  <line x1="530" y1="100" x2="530" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="490" y="150" width="80" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="530" y="171" text-anchor="middle" font-size="10">seg 2 resent</text>
  <text x="530" y="205" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">app sees ordered, complete stream — later, not sooner</text>

  <text x="340" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Same lost packet, opposite fates: UDP moves on immediately, TCP recovers it at a time cost.</text>
</svg>
