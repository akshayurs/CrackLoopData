<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">UDP header vs TCP header</text>

  <text x="170" y="54" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">UDP — 8 bytes</text>
  <rect x="60" y="66" width="110" height="36" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="115" y="88" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Source port</text>
  <rect x="170" y="66" width="110" height="36" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="225" y="88" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Dest port</text>
  <rect x="60" y="102" width="110" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="115" y="124" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Length</text>
  <rect x="170" y="102" width="110" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="225" y="124" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Checksum</text>
  <rect x="60" y="138" width="220" height="36" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3"/>
  <text x="170" y="160" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Data (payload)</text>

  <text x="510" y="54" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">TCP — 20+ bytes</text>
  <g font-size="10" fill="var(--dg-ink, #202124)">
    <rect x="400" y="66" width="105" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="452" y="83" text-anchor="middle">Src/Dst port</text>
    <rect x="505" y="66" width="115" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="562" y="83" text-anchor="middle">Sequence #</text>
    <rect x="400" y="92" width="105" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="452" y="109" text-anchor="middle">ACK number</text>
    <rect x="505" y="92" width="115" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="562" y="109" text-anchor="middle">Flags/window</text>
    <rect x="400" y="118" width="105" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="452" y="135" text-anchor="middle">Checksum</text>
    <rect x="505" y="118" width="115" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="562" y="135" text-anchor="middle">Urgent ptr</text>
    <rect x="400" y="144" width="220" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="510" y="161" text-anchor="middle">Options (variable)</text>
    <rect x="400" y="180" width="220" height="30" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3"/>
    <text x="510" y="199" text-anchor="middle" fill="var(--dg-muted, #5F6368)">Data (payload)</text>
  </g>

  <text x="340" y="250" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">UDP carries only addressing and a checksum — no sequence numbers, no ACKs, no window.</text>
  <text x="340" y="272" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">That bookkeeping is exactly what buys TCP its ordering and reliability guarantees.</text>
</svg>
