<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">TCP state machine (simplified)</text>

  <g font-size="12" fill="var(--dg-ink, #202124)">
    <rect x="30" y="60" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="90" y="85" text-anchor="middle">LISTEN</text>

    <rect x="200" y="60" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="270" y="85" text-anchor="middle">SYN_RCVD</text>

    <rect x="400" y="60" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="470" y="85" text-anchor="middle">SYN_SENT</text>

    <rect x="270" y="150" width="180" height="46" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="360" y="178" text-anchor="middle" font-weight="600">ESTABLISHED</text>

    <rect x="60" y="240" width="150" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="135" y="265" text-anchor="middle">FIN_WAIT_1/2</text>

    <rect x="270" y="240" width="150" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="345" y="265" text-anchor="middle">CLOSE_WAIT</text>

    <rect x="490" y="240" width="150" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="565" y="265" text-anchor="middle">LAST_ACK</text>

    <rect x="60" y="320" width="150" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="135" y="345" text-anchor="middle">TIME_WAIT</text>

    <rect x="290" y="320" width="150" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="365" y="345" text-anchor="middle">CLOSED</text>
  </g>

  <line x1="150" y1="80" x2="200" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="340" y1="100" x2="360" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="470" y1="100" x2="380" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <line x1="300" y1="196" x2="150" y2="240" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="360" y1="196" x2="350" y2="240" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <line x1="135" y1="280" x2="135" y2="320" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="420" y1="260" x2="565" y2="260" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="565" y1="280" x2="370" y2="320" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="135" y1="360" x2="290" y2="345" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <text x="360" y="400" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Every socket sits in exactly one state, driven by the segments sent and received.</text>
</svg>
