<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">TCP three-way handshake</text>

  <rect x="40" y="50" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="75" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Client</text>

  <rect x="480" y="50" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="540" y="75" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Server</text>

  <line x1="100" y1="90" x2="100" y2="250" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="540" y1="90" x2="540" y2="250" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 3"/>

  <line x1="100" y1="120" x2="540" y2="120" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="112" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">SYN (seq=x)</text>

  <line x1="540" y1="170" x2="100" y2="170" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="162" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">SYN-ACK (seq=y, ack=x+1)</text>

  <line x1="100" y1="220" x2="540" y2="220" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="212" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">ACK (ack=y+1)</text>

  <text x="320" y="278" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Both sides now agree on starting sequence numbers — connection is ESTABLISHED.</text>
</svg>
