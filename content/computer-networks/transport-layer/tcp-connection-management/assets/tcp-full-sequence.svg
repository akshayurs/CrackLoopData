<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">One HTTP request: handshake to teardown</text>

  <rect x="40" y="46" width="110" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="95" y="69" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Client</text>
  <rect x="490" y="46" width="110" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="545" y="69" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Server</text>
  <line x1="95" y1="82" x2="95" y2="410" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>
  <line x1="545" y1="82" x2="545" y2="410" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>

  <g font-size="11" fill="var(--dg-ink, #202124)">
    <line x1="95" y1="100" x2="545" y2="100" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrowAccent)"/>
    <text x="320" y="94" text-anchor="middle">SYN</text>
    <line x1="545" y1="122" x2="95" y2="122" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrowAccent)"/>
    <text x="320" y="116" text-anchor="middle">SYN-ACK</text>
    <line x1="95" y1="144" x2="545" y2="144" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrowAccent)"/>
    <text x="320" y="138" text-anchor="middle">ACK</text>

    <line x1="95" y1="185" x2="545" y2="185" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <text x="320" y="179" text-anchor="middle">HTTP GET /page</text>
    <line x1="545" y1="217" x2="95" y2="217" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <text x="320" y="211" text-anchor="middle">HTTP 200 response</text>

    <line x1="95" y1="258" x2="545" y2="258" stroke="var(--dg-muted, #5F6368)" marker-end="url(#arrow)"/>
    <text x="320" y="252" text-anchor="middle">FIN</text>
    <line x1="545" y1="280" x2="95" y2="280" stroke="var(--dg-muted, #5F6368)" marker-end="url(#arrow)"/>
    <text x="320" y="274" text-anchor="middle">ACK</text>
    <line x1="545" y1="302" x2="95" y2="302" stroke="var(--dg-muted, #5F6368)" marker-end="url(#arrow)"/>
    <text x="320" y="296" text-anchor="middle">FIN</text>
    <line x1="95" y1="324" x2="545" y2="324" stroke="var(--dg-muted, #5F6368)" marker-end="url(#arrow)"/>
    <text x="320" y="318" text-anchor="middle">ACK</text>
  </g>

  <text x="320" y="360" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">3 segments to open, 2 for the request, 4 to close — 9 total for one small resource.</text>
  <text x="320" y="382" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Keep-alive reuses the open connection for the next request, skipping the handshake.</text>
</svg>
