<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="310" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Slow start: cwnd doubles each round trip</text>

  <line x1="70" y1="270" x2="580" y2="270" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="70" y1="270" x2="70" y2="50" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="30" y="270" font-size="11" fill="var(--dg-muted, #5F6368)">cwnd</text>
  <text x="580" y="290" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">RTT</text>

  <path d="M70,260 L130,240 L190,200 L250,120 L310,60" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>
  <circle cx="70" cy="260" r="3" fill="var(--dg-accent, #0C8F88)"/>
  <circle cx="130" cy="240" r="3" fill="var(--dg-accent, #0C8F88)"/>
  <circle cx="190" cy="200" r="3" fill="var(--dg-accent, #0C8F88)"/>
  <circle cx="250" cy="120" r="3" fill="var(--dg-accent, #0C8F88)"/>
  <circle cx="310" cy="60" r="3" fill="var(--dg-accent, #0C8F88)"/>

  <text x="70" y="285" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">2</text>
  <text x="130" y="285" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">4</text>
  <text x="190" y="285" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">8</text>
  <text x="250" y="285" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">16</text>
  <text x="310" y="285" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">32 segments</text>

  <line x1="310" y1="60" x2="580" y2="60" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="450" y="50" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">ssthresh reached -&gt; switch to linear growth</text>

  <text x="310" y="316" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Exponential growth gets to useful throughput fast, then hands off to gentler additive growth.</text>
</svg>
