<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Congestion window sawtooth over time</text>

  <line x1="70" y1="250" x2="600" y2="250" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="70" y1="250" x2="70" y2="50" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="30" y="250" font-size="11" fill="var(--dg-muted, #5F6368)">cwnd</text>
  <text x="600" y="270" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">time</text>

  <path d="M70,200 L180,90 L180,170 L290,80 L290,160 L400,70 L400,150 L510,60 L510,140 L580,100"
        fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>

  <line x1="180" y1="90" x2="180" y2="170" stroke="var(--dg-muted, #5F6368)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="180" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">loss: halve</text>
  <line x1="290" y1="80" x2="290" y2="160" stroke="var(--dg-muted, #5F6368)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="290" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">loss: halve</text>
  <line x1="400" y1="70" x2="400" y2="150" stroke="var(--dg-muted, #5F6368)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="400" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">loss: halve</text>

  <text x="320" y="290" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Additive climb, then a sharp halving at each loss — repeating indefinitely.</text>
</svg>
