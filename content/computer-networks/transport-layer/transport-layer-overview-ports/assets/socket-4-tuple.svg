<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The socket 4-tuple identifies one connection</text>

  <rect x="40" y="60" width="200" height="70" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="140" y="86" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Client</text>
  <text x="140" y="106" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">10.0.0.5</text>
  <text x="140" y="122" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">ephemeral port 51000</text>

  <rect x="480" y="60" width="200" height="70" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="580" y="86" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Server</text>
  <text x="580" y="106" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">203.0.113.9</text>
  <text x="580" y="122" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">well-known port 443</text>

  <line x1="240" y1="95" x2="478" y2="95" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="478" y1="112" x2="240" y2="112" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <rect x="140" y="170" width="440" height="120" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="360" y="196" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Socket = 5-tuple</text>
  <text x="360" y="220" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">protocol: TCP</text>
  <text x="360" y="240" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">local: 10.0.0.5 : 51000</text>
  <text x="360" y="260" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">remote: 203.0.113.9 : 443</text>

  <text x="360" y="318" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A different client IP or ephemeral port makes it a different socket, even on the same server port.</text>
</svg>
