<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Sliding window: bytes in flight</text>

  <g font-size="11" fill="var(--dg-ink, #202124)">
    <rect x="40" y="60" width="60" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="70" y="84" text-anchor="middle">acked</text>
    <rect x="100" y="60" width="60" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="130" y="84" text-anchor="middle">acked</text>

    <rect x="160" y="60" width="60" height="40" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
    <text x="190" y="84" text-anchor="middle">sent,</text>
    <rect x="220" y="60" width="60" height="40" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
    <text x="250" y="84" text-anchor="middle">unacked</text>
    <rect x="280" y="60" width="60" height="40" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
    <text x="310" y="84" text-anchor="middle">in flight</text>

    <rect x="340" y="60" width="60" height="40" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3"/>
    <text x="370" y="84" text-anchor="middle">allowed</text>
    <rect x="400" y="60" width="60" height="40" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3"/>
    <text x="430" y="84" text-anchor="middle">not sent</text>

    <rect x="460" y="60" width="60" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" opacity="0.5"/>
    <text x="490" y="84" text-anchor="middle" opacity="0.6">not yet</text>
    <rect x="520" y="60" width="60" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" opacity="0.5"/>
    <text x="550" y="84" text-anchor="middle" opacity="0.6">sendable</text>
  </g>

  <path d="M160,50 h220 v-8" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="270" y="36" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">the window (rwnd/cwnd bytes)</text>

  <text x="340" y="140" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">As ACKs confirm the left-most bytes, the window slides right — freeing new bytes to send.</text>
  <text x="340" y="162" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A bigger window means more unacknowledged data can be outstanding at once.</text>

  <rect x="90" y="190" width="60" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="120" y="214" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">acked</text>
  <rect x="150" y="190" width="60" height="40" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="180" y="214" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">in flight</text>
  <rect x="210" y="190" width="60" height="40" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="240" y="214" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">in flight</text>
  <rect x="270" y="190" width="60" height="40" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3"/>
  <text x="300" y="214" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">newly</text>
  <rect x="330" y="190" width="60" height="40" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3"/>
  <text x="360" y="214" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">allowed</text>
  <text x="240" y="248" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">window after two more segments are ACKed</text>
</svg>
