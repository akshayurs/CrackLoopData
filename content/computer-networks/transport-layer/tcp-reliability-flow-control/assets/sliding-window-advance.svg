<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Window edges advance as ACKs arrive</text>

  <text x="30" y="70" font-size="12" fill="var(--dg-muted, #5F6368)">before ACK:</text>
  <rect x="150" y="52" width="300" height="36" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="300" y="75" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">unacked bytes 1000-4000</text>
  <rect x="450" y="52" width="120" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="510" y="75" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">not sent</text>

  <line x1="150" y1="110" x2="150" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="150" y="165" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">left edge</text>
  <line x1="450" y1="110" x2="450" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="450" y="165" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">right edge</text>

  <line x1="150" y1="130" x2="270" y2="130" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="130" x2="570" y2="130" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="30" y="210" font-size="12" fill="var(--dg-muted, #5F6368)">after ACK(2000):</text>
  <rect x="270" y="192" width="300" height="36" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="420" y="215" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">unacked bytes 2000-5000</text>

  <text x="320" y="248" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Acked bytes (1000-1999) leave the window; new bytes (4001-5000) become sendable.</text>
</svg>
