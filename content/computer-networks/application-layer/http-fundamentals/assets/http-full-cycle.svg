<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">One connection, several requests (keep-alive)</text>

  <rect x="30" y="46" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="80" y="68" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Client</text>
  <rect x="500" y="46" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="550" y="68" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Server</text>
  <line x1="80" y1="80" x2="80" y2="290" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>
  <line x1="550" y1="80" x2="550" y2="290" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>

  <g font-size="11" fill="var(--dg-ink, #202124)">
    <line x1="80" y1="100" x2="550" y2="100" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
    <text x="315" y="94" text-anchor="middle">GET /page.html</text>
    <line x1="550" y1="122" x2="80" y2="122" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
    <text x="315" y="116" text-anchor="middle">200 OK (HTML)</text>

    <line x1="80" y1="160" x2="550" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <text x="315" y="154" text-anchor="middle">GET /style.css</text>
    <line x1="550" y1="182" x2="80" y2="182" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <text x="315" y="176" text-anchor="middle">200 OK (CSS)</text>

    <line x1="80" y1="220" x2="550" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <text x="315" y="214" text-anchor="middle">GET /logo.png</text>
    <line x1="550" y1="242" x2="80" y2="242" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <text x="315" y="236" text-anchor="middle">200 OK (image)</text>
  </g>

  <text x="320" y="308" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Same TCP connection reused for every follow-up request — no repeated handshake.</text>
</svg>
