<svg viewBox="0 0 620 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="310" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">HTTP request/response model</text>

  <rect x="40" y="60" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="88" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Client</text>

  <rect x="450" y="60" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="515" y="88" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Server</text>

  <line x1="170" y1="75" x2="448" y2="75" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="68" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Request</text>

  <line x1="448" y1="100" x2="170" y2="100" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="118" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Response</text>

  <text x="310" y="170" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">One request, one response — no server-initiated push, no built-in conversation state.</text>
</svg>
