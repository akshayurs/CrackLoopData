<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="310" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Anatomy of an HTTP request</text>

  <rect x="60" y="50" width="500" height="40" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="80" y="75" font-size="12" fill="var(--dg-ink, #202124)" font-family="monospace">GET /users/42 HTTP/1.1</text>
  <text x="565" y="45" text-anchor="end" font-size="10" fill="var(--dg-muted, #5F6368)">method + path</text>

  <rect x="60" y="90" width="500" height="70" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="112" font-size="12" fill="var(--dg-ink, #202124)" font-family="monospace">Host: api.example.com</text>
  <text x="80" y="132" font-size="12" fill="var(--dg-ink, #202124)" font-family="monospace">Authorization: Bearer &lt;token&gt;</text>
  <text x="80" y="152" font-size="12" fill="var(--dg-ink, #202124)" font-family="monospace">Accept: application/json</text>
  <text x="565" y="85" text-anchor="end" font-size="10" fill="var(--dg-muted, #5F6368)">headers</text>

  <rect x="60" y="170" width="500" height="60" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3"/>
  <text x="310" y="204" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">(optional body — common on POST/PUT)</text>

  <text x="310" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Method + path say what you want; headers say how to handle it.</text>
</svg>
