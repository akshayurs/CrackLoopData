<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="310" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The WebSocket upgrade handshake</text>

  <rect x="30" y="50" width="110" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="85" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Client</text>
  <rect x="480" y="50" width="110" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="535" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Server</text>

  <line x1="140" y1="80" x2="478" y2="80" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="74" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">GET / HTTP/1.1, Upgrade: websocket</text>

  <line x1="478" y1="110" x2="140" y2="110" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="104" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">101 Switching Protocols</text>

  <rect x="90" y="140" width="440" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="310" y="166" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Same TCP connection, new protocol</text>
  <text x="310" y="186" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">both sides now exchange WebSocket frames, either direction</text>

  <text x="310" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">No new connection or port — a protocol switch on the request that's already open.</text>
</svg>
