<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Persistent, bidirectional channel</text>

  <rect x="30" y="50" width="110" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="85" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Client</text>
  <rect x="500" y="50" width="110" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="555" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Server</text>

  <line x1="140" y1="100" x2="498" y2="100" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="94" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">client message anytime</text>

  <line x1="498" y1="130" x2="140" y2="130" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="150" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">server push, unprompted</text>

  <line x1="140" y1="170" x2="498" y2="170" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="192" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">no request/response pairing needed</text>

  <text x="320" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Either side sends whenever it has something — the server finally gets to speak first.</text>
</svg>
