<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Full resolution walkthrough</text>

  <g font-size="11" fill="var(--dg-ink, #202124)">
    <rect x="20" y="60" width="90" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="65" y="86" text-anchor="middle">Browser</text>
    <text x="65" y="102" text-anchor="middle" fill="var(--dg-muted, #5F6368)">cache</text>

    <rect x="130" y="60" width="90" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="175" y="86" text-anchor="middle">OS</text>
    <text x="175" y="102" text-anchor="middle" fill="var(--dg-muted, #5F6368)">resolver cache</text>

    <rect x="240" y="60" width="100" height="60" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="290" y="86" text-anchor="middle">Recursive</text>
    <text x="290" y="102" text-anchor="middle">resolver</text>

    <rect x="360" y="60" width="80" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="400" y="94" text-anchor="middle">Root</text>

    <rect x="460" y="60" width="80" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="500" y="94" text-anchor="middle">TLD</text>

    <rect x="560" y="60" width="100" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="610" y="86" text-anchor="middle">Authoritative</text>
    <text x="610" y="102" text-anchor="middle" fill="var(--dg-muted, #5F6368)">server</text>
  </g>

  <line x1="110" y1="90" x2="128" y2="90" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
  <line x1="220" y1="90" x2="238" y2="90" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
  <line x1="340" y1="90" x2="358" y2="90" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
  <line x1="440" y1="90" x2="458" y2="90" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
  <line x1="540" y1="90" x2="558" y2="90" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>

  <text x="340" y="160" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each stage checks its cache first — a hit anywhere ends the chain right there.</text>
  <text x="340" y="182" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A first-time lookup walks all the way to the authoritative server; a repeat lookup is nearly instant.</text>
</svg>
