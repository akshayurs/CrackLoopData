<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">DNS hierarchy</text>

  <rect x="260" y="50" width="120" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="76" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Root (.)</text>

  <line x1="320" y1="92" x2="320" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="150" y="130" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="220" y="156" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">.com TLD</text>
  <rect x="350" y="130" width="140" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="420" y="156" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">.org TLD</text>

  <line x1="220" y1="172" x2="220" y2="210" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="120" y="210" width="200" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="220" y="232" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">example.com</text>
  <text x="220" y="248" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">authoritative server</text>

  <text x="320" y="292" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each level only points to the next; only the leaf holds the real record.</text>
</svg>
