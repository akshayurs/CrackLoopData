<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Recursive vs iterative queries</text>

  <rect x="30" y="120" width="110" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="85" y="146" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Client</text>

  <rect x="230" y="120" width="150" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="305" y="146" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Recursive resolver</text>

  <rect x="500" y="40" width="150" height="38" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="575" y="64" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Root server</text>
  <rect x="500" y="140" width="150" height="38" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="575" y="164" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">TLD server</text>
  <rect x="500" y="240" width="150" height="38" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="575" y="264" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Authoritative</text>

  <line x1="140" y1="141" x2="228" y2="141" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <text x="184" y="131" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">recursive query</text>

  <line x1="380" y1="130" x2="498" y2="60" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="380" y1="140" x2="498" y2="155" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="380" y1="150" x2="498" y2="252" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="440" y="200" font-size="10" fill="var(--dg-muted, #5F6368)">iterative queries (referrals)</text>

  <text x="340" y="300" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Client asks once; the resolver walks the tree with iterative queries and returns one final answer.</text>
</svg>
