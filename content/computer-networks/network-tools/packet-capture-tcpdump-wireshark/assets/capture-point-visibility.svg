<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Capture point changes what you see</text>

  <rect x="30" y="90" width="110" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="115" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Client</text>

  <rect x="265" y="90" width="110" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="115" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Midpoint router</text>

  <rect x="500" y="90" width="110" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="555" y="115" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Server</text>

  <line x1="140" y1="111" x2="263" y2="111" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="375" y1="111" x2="498" y2="111" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="60" y="150" width="60" height="24" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4,3"/>
  <text x="90" y="167" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">capture</text>

  <rect x="290" y="150" width="60" height="24" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4,3"/>
  <text x="320" y="167" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">capture</text>

  <rect x="525" y="150" width="60" height="24" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4,3"/>
  <text x="555" y="167" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">capture</text>

  <text x="90" y="200" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">sees what left</text>
  <text x="90" y="214" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">the NIC only</text>

  <text x="320" y="200" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">sees the path</text>
  <text x="320" y="214" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">between (may miss</text>
  <text x="320" y="228" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">asymmetric routes)</text>

  <text x="555" y="200" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">sees what</text>
  <text x="555" y="214" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">arrived only</text>

  <text x="320" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Same conversation, three different slices — no single point sees it all.</text>
</svg>
