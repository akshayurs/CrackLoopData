<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Troubleshooting decision tree</text>

  <rect x="240" y="40" width="160" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="63" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Can't reach the site</text>

  <line x1="320" y1="76" x2="320" y2="104" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="240" y="104" width="160" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="127" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">DNS resolves?</text>
  <text x="140" y="122" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">no -&gt; resolution issue</text>
  <line x1="238" y1="122" x2="150" y2="122" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <line x1="320" y1="140" x2="320" y2="168" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="240" y="168" width="160" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="191" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Can connect on port?</text>
  <text x="140" y="186" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">no -&gt; server/firewall</text>
  <line x1="238" y1="186" x2="150" y2="186" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <line x1="320" y1="204" x2="320" y2="232" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="240" y="232" width="160" height="36" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="255" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">TLS ok?</text>
  <text x="140" y="250" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">no -&gt; cert/handshake</text>
  <line x1="238" y1="250" x2="150" y2="250" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <line x1="320" y1="268" x2="320" y2="292" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="240" y="292" width="160" height="24" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="308" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">HTTP status?</text>
</svg>
