<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">DevTools Network waterfall</text>

  <text x="30" y="55" font-size="11" fill="var(--dg-muted, #5F6368)">Request</text>
  <text x="180" y="55" font-size="11" fill="var(--dg-muted, #5F6368)">Timeline</text>
  <line x1="20" y1="62" x2="620" y2="62" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>

  <text x="30" y="82" font-size="12" fill="var(--dg-ink, #202124)">index.html</text>
  <rect x="180" y="70" width="18" height="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <rect x="198" y="70" width="12" height="16" fill="var(--dg-accent-bg, #E3F3F1)"/>
  <rect x="210" y="70" width="30" height="16" fill="var(--dg-accent, #0C8F88)"/>

  <text x="30" y="112" font-size="12" fill="var(--dg-ink, #202124)">styles.css</text>
  <rect x="245" y="100" width="20" height="16" fill="var(--dg-accent-bg, #E3F3F1)"/>
  <rect x="265" y="100" width="70" height="16" fill="var(--dg-accent, #0C8F88)"/>

  <text x="30" y="142" font-size="12" fill="var(--dg-ink, #202124)">app.js</text>
  <rect x="245" y="130" width="30" height="16" fill="var(--dg-accent-bg, #E3F3F1)"/>
  <rect x="275" y="130" width="100" height="16" fill="var(--dg-accent, #0C8F88)"/>

  <text x="30" y="172" font-size="12" fill="var(--dg-ink, #202124)">logo.svg</text>
  <rect x="380" y="160" width="10" height="16" fill="var(--dg-accent-bg, #E3F3F1)"/>
  <rect x="390" y="160" width="30" height="16" fill="var(--dg-accent, #0C8F88)"/>

  <text x="30" y="202" font-size="12" fill="var(--dg-ink, #202124)">api/data</text>
  <rect x="380" y="190" width="15" height="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <rect x="395" y="190" width="120" height="16" fill="var(--dg-accent-bg, #E3F3F1)"/>
  <rect x="515" y="190" width="65" height="16" fill="var(--dg-accent, #0C8F88)"/>

  <rect x="20" y="222" width="14" height="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="40" y="231" font-size="10" fill="var(--dg-muted, #5F6368)">DNS/connect</text>
  <rect x="140" y="222" width="14" height="10" fill="var(--dg-accent-bg, #E3F3F1)"/>
  <text x="160" y="231" font-size="10" fill="var(--dg-muted, #5F6368)">waiting (TTFB)</text>
  <rect x="280" y="222" width="14" height="10" fill="var(--dg-accent, #0C8F88)"/>
  <text x="300" y="231" font-size="10" fill="var(--dg-muted, #5F6368)">download</text>

  <text x="320" y="258" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each row is one request; its bar's start/length and colored segments</text>
  <text x="320" y="273" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">show when it ran and where the time inside it actually went.</text>
</svg>
