<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">One request's timing breakdown</text>

  <rect x="30" y="70" width="60" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="55" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">DNS lookup</text>

  <rect x="90" y="70" width="70" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="125" y="55" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">TCP connect</text>

  <rect x="160" y="70" width="70" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="195" y="55" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">TLS handshake</text>

  <rect x="230" y="70" width="220" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="340" y="55" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">waiting (TTFB)</text>

  <rect x="450" y="70" width="150" height="34" fill="var(--dg-accent, #0C8F88)"/>
  <text x="525" y="55" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">content download</text>

  <text x="60" y="120" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">resolver</text>
  <text x="125" y="120" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">network path</text>
  <text x="195" y="120" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">cert overhead</text>
  <text x="340" y="120" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">server processing</text>
  <text x="525" y="120" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">payload size</text>

  <text x="320" y="160" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Each segment points at a different fix</text>
  <text x="320" y="200" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A slow TTFB means the server is slow to respond;</text>
  <text x="320" y="218" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">a slow download means the payload itself is the bottleneck.</text>
</svg>
