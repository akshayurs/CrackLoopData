<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Five-hop traceroute latency</text>

  <line x1="50" y1="150" x2="590" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="60" cy="150" r="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="180" cy="150" r="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="300" cy="150" r="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="440" cy="150" r="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <circle cx="580" cy="150" r="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <text x="60" y="90" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Home router</text>
  <text x="60" y="105" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">1ms</text>

  <text x="180" y="90" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">ISP router</text>
  <text x="180" y="105" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">8ms</text>

  <text x="300" y="90" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Regional backbone</text>
  <text x="300" y="105" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">15ms</text>

  <text x="440" y="90" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Transit provider</text>
  <text x="440" y="105" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">40ms</text>

  <text x="580" y="90" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Destination</text>
  <text x="580" y="105" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">45ms</text>

  <path d="M300,170 L440,170" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="5,4" fill="none"/>
  <text x="370" y="190" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">+25ms jump</text>

  <text x="320" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The 15ms -&gt; 40ms jump localizes the delay to that specific link.</text>
</svg>
