<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">traceroute: increasing TTL</text>

  <rect x="20" y="120" width="80" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="144" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Source</text>

  <rect x="200" y="120" width="80" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="144" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Router 1</text>

  <rect x="380" y="120" width="80" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="420" y="144" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Router 2</text>

  <rect x="540" y="120" width="80" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="580" y="144" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Router 3</text>

  <line x1="100" y1="140" x2="198" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="149" y="130" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">TTL=1</text>

  <path d="M240,120 C240,90 130,90 130,90 L100,90" fill="none" stroke="var(--dg-stroke, #9AA0A6)" marker-end="url(#arrow)"/>
  <text x="170" y="80" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">TTL hits 0 -&gt; Time Exceeded</text>

  <line x1="100" y1="150" x2="378" y2="150" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="240" y="168" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">TTL=2</text>

  <path d="M420,120 C420,60 130,60 130,60 L100,60" fill="none" stroke="var(--dg-stroke, #9AA0A6)" marker-end="url(#arrow)"/>
  <text x="230" y="50" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">TTL hits 0 -&gt; Time Exceeded</text>

  <line x1="100" y1="180" x2="538" y2="180" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="320" y="198" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">TTL=3 (reaches destination)</text>

  <text x="320" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each hop decrements TTL; the router where it hits zero replies</text>
  <text x="320" y="258" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">with ICMP Time Exceeded, revealing itself as one hop on the path.</text>
</svg>
