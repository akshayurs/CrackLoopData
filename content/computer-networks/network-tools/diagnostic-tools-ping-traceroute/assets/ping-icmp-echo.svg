<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">ping: ICMP echo request / reply</text>

  <rect x="40" y="70" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="98" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Local host</text>

  <rect x="470" y="70" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="535" y="98" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Target host</text>

  <line x1="170" y1="90" x2="468" y2="90" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">ICMP echo request</text>

  <line x1="468" y1="140" x2="170" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="160" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">ICMP echo reply</text>

  <line x1="105" y1="116" x2="105" y2="185" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4,3"/>
  <line x1="535" y1="116" x2="535" y2="185" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4,3"/>
  <line x1="105" y1="185" x2="535" y2="185" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <path d="M105,195 L120,190 L120,200 Z" fill="var(--dg-muted, #5F6368)"/>
  <path d="M535,195 L520,190 L520,200 Z" fill="var(--dg-muted, #5F6368)"/>
  <text x="320" y="212" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">round-trip time (RTT)</text>

  <text x="320" y="244" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Time from sending the request to receiving the reply = RTT.</text>
</svg>
