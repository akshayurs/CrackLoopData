<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowRP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Client, reverse proxy, backends</text>

  <circle cx="80" cy="130" r="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="135" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Client</text>

  <path d="M104,130 H260" stroke="var(--dg-line, #5F6368)" stroke-width="1.6" marker-end="url(#arrowRP)"/>
  <text x="180" y="122" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">public address</text>

  <rect x="260" y="95" width="150" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="335" y="125" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Reverse</text>
  <text x="335" y="142" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Proxy</text>

  <path d="M410,115 H540" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowRP)"/>
  <path d="M410,130 H540" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowRP)"/>
  <path d="M410,145 H540" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowRP)"/>

  <rect x="540" y="70" width="140" height="35" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="610" y="92" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Backend 1</text>
  <rect x="540" y="112" width="140" height="35" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="610" y="134" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Backend 2</text>
  <rect x="540" y="154" width="140" height="35" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="610" y="176" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Backend 3</text>

  <text x="360" y="215" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The client never talks to a backend directly — only the proxy is reachable.</text>
</svg>
