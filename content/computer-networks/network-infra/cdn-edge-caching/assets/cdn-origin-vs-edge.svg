<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowE" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Origin vs edge PoPs</text>

  <rect x="300" y="130" width="120" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="360" y="160" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Origin</text>

  <g font-size="10" fill="var(--dg-ink, #202124)">
    <rect x="60" y="60" width="100" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="110" y="84" text-anchor="middle">Edge: Mumbai</text>
    <rect x="560" y="60" width="100" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="610" y="84" text-anchor="middle">Edge: London</text>
    <rect x="60" y="220" width="100" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="110" y="244" text-anchor="middle">Edge: Sao Paulo</text>
    <rect x="560" y="220" width="100" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="610" y="244" text-anchor="middle">Edge: Tokyo</text>
  </g>

  <path d="M160,80 C220,100 280,120 300,140" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowE)"/>
  <path d="M560,80 C500,100 440,120 420,140" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowE)"/>
  <path d="M160,240 C220,220 280,190 300,170" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowE)"/>
  <path d="M560,240 C500,220 440,190 420,170" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowE)"/>

  <circle cx="110" cy="140" r="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="110" y="144" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">user</text>
  <path d="M124,140 H160" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrowE)"/>

  <text x="360" y="290" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A user hits the nearest edge; edges pull from origin only on a cache miss.</text>
</svg>
