<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowH" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Cache hit vs miss request path</text>

  <text x="150" y="55" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">Hit</text>
  <circle cx="60" cy="100" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="105" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">User</text>
  <path d="M80,100 H210" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.8" marker-end="url(#arrowH)"/>
  <rect x="210" y="80" width="110" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="265" y="104" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Edge (hit)</text>
  <path d="M210,120 H80" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.8" marker-end="url(#arrowH)"/>
  <text x="150" y="140" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">served instantly, no origin call</text>

  <text x="150" y="180" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Miss</text>
  <circle cx="60" cy="225" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="230" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">User</text>
  <path d="M80,225 H210" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowH)"/>
  <rect x="210" y="205" width="110" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="265" y="229" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Edge (miss)</text>
  <path d="M320,220 H460" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowH)"/>
  <rect x="460" y="205" width="110" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="515" y="229" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Origin</text>
  <path d="M460,240 H320" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowH)"/>
  <path d="M210,245 H80" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowH)"/>
  <text x="265" y="265" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">origin pull, then cache for next time</text>

  <text x="360" y="290" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Hit rate — not raw traffic — is what CDN operators watch most closely.</text>
</svg>
