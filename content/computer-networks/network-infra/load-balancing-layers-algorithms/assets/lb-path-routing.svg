<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowP2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">L7 routing by path prefix</text>

  <circle cx="70" cy="140" r="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="145" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Client</text>

  <path d="M92,140 H230" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowP2)"/>
  <text x="160" y="132" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">GET /api/orders</text>

  <rect x="230" y="105" width="140" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="300" y="135" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">L7 Load</text>
  <text x="300" y="152" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Balancer</text>

  <path d="M370,125 H520" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowP2)"/>
  <text x="445" y="117" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">/api/*</text>
  <path d="M370,155 H520" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.6" marker-end="url(#arrowP2)" stroke-dasharray="5 3"/>
  <text x="445" y="172" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">/static/*</text>

  <rect x="520" y="95" width="150" height="45" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="595" y="122" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">API pool</text>

  <rect x="520" y="150" width="150" height="45" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="595" y="177" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Static pool</text>

  <text x="360" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The balancer reads the URL path before choosing which backend pool to forward to.</text>
</svg>
