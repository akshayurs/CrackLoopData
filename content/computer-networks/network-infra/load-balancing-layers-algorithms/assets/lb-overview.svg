<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowL" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Clients, a load balancer, and a backend pool</text>

  <circle cx="70" cy="80" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="85" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Client</text>
  <circle cx="70" cy="150" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="155" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Client</text>
  <circle cx="70" cy="220" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="225" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Client</text>

  <path d="M90,80 H260" stroke="var(--dg-line, #5F6368)" stroke-width="1.4" marker-end="url(#arrowL)"/>
  <path d="M90,150 H260" stroke="var(--dg-line, #5F6368)" stroke-width="1.4" marker-end="url(#arrowL)"/>
  <path d="M90,220 H260" stroke="var(--dg-line, #5F6368)" stroke-width="1.4" marker-end="url(#arrowL)"/>

  <rect x="260" y="110" width="140" height="80" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="330" y="145" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Load</text>
  <text x="330" y="162" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Balancer</text>

  <path d="M400,130 H540" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowL)"/>
  <path d="M400,150 H540" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowL)"/>
  <path d="M400,170 H540" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.6" marker-end="url(#arrowL)"/>

  <rect x="540" y="65" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="610" y="89" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Backend A</text>
  <rect x="540" y="135" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="610" y="159" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Backend B</text>
  <rect x="540" y="205" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="610" y="229" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Backend C</text>

  <text x="360" y="280" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Clients only know one address; the load balancer picks the backend per request.</text>
</svg>
