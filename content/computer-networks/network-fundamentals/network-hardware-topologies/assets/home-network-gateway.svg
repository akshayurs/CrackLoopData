<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A home network with a default gateway</text>

  <rect x="60" y="60" width="90" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="84" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">Laptop</text>

  <rect x="60" y="140" width="90" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="164" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">Phone</text>

  <rect x="60" y="220" width="90" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="244" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">Smart TV</text>

  <rect x="240" y="140" width="140" height="52" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="310" y="163" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Router</text>
  <text x="310" y="180" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">192.168.1.1 (gateway)</text>

  <line x1="150" y1="80" x2="238" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowg)"/>
  <line x1="150" y1="160" x2="238" y2="163" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowg)"/>
  <line x1="150" y1="240" x2="238" y2="178" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowg)"/>

  <line x1="380" y1="166" x2="480" y2="166" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrowg)"/>
  <text x="430" y="155" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">NAT</text>

  <path d="M480,146 a40,20 0 0 1 80,0 v30 a40,20 0 0 1 -80,0 z" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="520" y="166" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">Internet</text>

  <text x="320" y="286" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Every device sends off-LAN traffic to the gateway's IP; the router NATs it onto one public address.</text>
</svg>
