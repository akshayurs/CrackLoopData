<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="350" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Common network topologies</text>

  <g stroke="var(--dg-line, #5F6368)" stroke-width="1.5" fill="var(--dg-fill, #F1F3F4)">
    <line x1="30" y1="80" x2="150" y2="80" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
    <circle cx="50" cy="80" r="6" stroke="var(--dg-stroke, #9AA0A6)"/>
    <circle cx="90" cy="80" r="6" stroke="var(--dg-stroke, #9AA0A6)"/>
    <circle cx="130" cy="80" r="6" stroke="var(--dg-stroke, #9AA0A6)"/>
  </g>
  <text x="90" y="105" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">Bus</text>

  <g stroke="var(--dg-line, #5F6368)" stroke-width="1.5" fill="var(--dg-fill, #F1F3F4)">
    <circle cx="240" cy="80" r="7" stroke="var(--dg-accent, #0C8F88)"/>
    <circle cx="200" cy="50" r="6" stroke="var(--dg-stroke, #9AA0A6)"/>
    <circle cx="280" cy="50" r="6" stroke="var(--dg-stroke, #9AA0A6)"/>
    <circle cx="200" cy="110" r="6" stroke="var(--dg-stroke, #9AA0A6)"/>
    <circle cx="280" cy="110" r="6" stroke="var(--dg-stroke, #9AA0A6)"/>
    <line x1="240" y1="80" x2="200" y2="50"/>
    <line x1="240" y1="80" x2="280" y2="50"/>
    <line x1="240" y1="80" x2="200" y2="110"/>
    <line x1="240" y1="80" x2="280" y2="110"/>
  </g>
  <text x="240" y="135" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">Star</text>

  <g stroke="var(--dg-line, #5F6368)" stroke-width="1.5" fill="var(--dg-fill, #F1F3F4)">
    <circle cx="390" cy="50" r="6" stroke="var(--dg-stroke, #9AA0A6)"/>
    <circle cx="430" cy="80" r="6" stroke="var(--dg-stroke, #9AA0A6)"/>
    <circle cx="415" cy="120" r="6" stroke="var(--dg-stroke, #9AA0A6)"/>
    <circle cx="365" cy="120" r="6" stroke="var(--dg-stroke, #9AA0A6)"/>
    <circle cx="350" cy="80" r="6" stroke="var(--dg-stroke, #9AA0A6)"/>
    <path d="M390,50 L430,80 L415,120 L365,120 L350,80 Z" fill="none"/>
  </g>
  <text x="390" y="145" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">Ring</text>

  <g stroke="var(--dg-line, #5F6368)" stroke-width="1.5" fill="var(--dg-fill, #F1F3F4)">
    <circle cx="500" cy="50" r="6" stroke="var(--dg-stroke, #9AA0A6)"/>
    <circle cx="560" cy="50" r="6" stroke="var(--dg-stroke, #9AA0A6)"/>
    <circle cx="500" cy="110" r="6" stroke="var(--dg-stroke, #9AA0A6)"/>
    <circle cx="560" cy="110" r="6" stroke="var(--dg-stroke, #9AA0A6)"/>
    <line x1="500" y1="50" x2="560" y2="50"/>
    <line x1="500" y1="50" x2="500" y2="110"/>
    <line x1="500" y1="50" x2="560" y2="110"/>
    <line x1="560" y1="50" x2="500" y2="110"/>
    <line x1="560" y1="50" x2="560" y2="110"/>
    <line x1="500" y1="110" x2="560" y2="110"/>
  </g>
  <text x="530" y="135" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">Mesh</text>

  <g stroke="var(--dg-line, #5F6368)" stroke-width="1.5" fill="var(--dg-accent-bg, #E3F3F1)">
    <circle cx="650" cy="80" r="7" stroke="var(--dg-accent, #0C8F88)"/>
    <circle cx="620" cy="55" r="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <circle cx="680" cy="55" r="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <line x1="650" y1="80" x2="620" y2="55"/>
    <line x1="650" y1="80" x2="680" y2="55"/>
  </g>
  <text x="650" y="120" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">Hybrid</text>

  <text x="350" y="200" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Star (via a switch) is the near-universal LAN choice today</text>
  <text x="350" y="222" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">one bad cable takes down one node, not the whole segment — bus and ring share a single failure point</text>
</svg>
