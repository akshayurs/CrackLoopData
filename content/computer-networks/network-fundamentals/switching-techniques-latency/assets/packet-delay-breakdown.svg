<svg viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">One packet's delay, hop by hop across three routers</text>

  <circle cx="60" cy="120" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="125" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Host A</text>

  <circle cx="240" cy="120" r="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="240" y="125" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">R1</text>

  <circle cx="420" cy="120" r="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="420" y="125" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">R2</text>

  <circle cx="600" cy="120" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="600" y="125" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Host B</text>

  <line x1="86" y1="120" x2="214" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowd)"/>
  <line x1="266" y1="120" x2="394" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowd)"/>
  <line x1="446" y1="120" x2="574" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowd)"/>

  <text x="150" y="105" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">transmit + propagate</text>
  <text x="330" y="105" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">transmit + propagate</text>
  <text x="510" y="105" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">transmit + propagate</text>

  <rect x="200" y="150" width="80" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="168" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">queue +</text>
  <text x="240" y="182" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">process</text>

  <rect x="380" y="150" width="80" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="420" y="168" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">queue +</text>
  <text x="420" y="182" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">process</text>

  <g font-size="12">
    <rect x="60" y="230" width="14" height="14" fill="var(--dg-accent, #0C8F88)"/>
    <text x="82" y="242" fill="var(--dg-ink, #202124)">Transmission — pushing bits onto the link (depends on link rate)</text>
    <rect x="60" y="254" width="14" height="14" fill="var(--dg-line, #5F6368)"/>
    <text x="82" y="266" fill="var(--dg-ink, #202124)">Propagation — signal travel time (depends on distance, medium)</text>
    <rect x="60" y="278" width="14" height="14" fill="var(--dg-stroke, #9AA0A6)"/>
    <text x="82" y="290" fill="var(--dg-ink, #202124)">Queuing — waiting behind other packets at a busy router</text>
    <rect x="60" y="302" width="14" height="14" fill="var(--dg-muted, #5F6368)"/>
    <text x="82" y="314" fill="var(--dg-ink, #202124)">Processing — router deciding where to send it next</text>
  </g>
</svg>
