<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="360" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Six phases from URL to rendered page</text>

  <g font-size="11">
    <rect x="12" y="60" width="105" height="56" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="64" y="84" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">1. DNS</text>
    <text x="64" y="100" text-anchor="middle" fill="var(--dg-muted, #5F6368)">name → IP</text>

    <rect x="132" y="60" width="105" height="56" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="184" y="84" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">2. Routing</text>
    <text x="184" y="100" text-anchor="middle" fill="var(--dg-muted, #5F6368)">hop by hop</text>

    <rect x="252" y="60" width="105" height="56" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="304" y="84" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">3. TCP</text>
    <text x="304" y="100" text-anchor="middle" fill="var(--dg-muted, #5F6368)">handshake</text>

    <rect x="372" y="60" width="105" height="56" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="424" y="84" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">4. TLS</text>
    <text x="424" y="100" text-anchor="middle" fill="var(--dg-muted, #5F6368)">encrypt channel</text>

    <rect x="492" y="60" width="105" height="56" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="544" y="84" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">5. HTTP</text>
    <text x="544" y="100" text-anchor="middle" fill="var(--dg-muted, #5F6368)">req / resp</text>

    <rect x="612" y="60" width="96" height="56" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="660" y="84" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">6. Render</text>
    <text x="660" y="100" text-anchor="middle" fill="var(--dg-muted, #5F6368)">browser</text>
  </g>

  <line x1="117" y1="88" x2="130" y2="88" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowp)"/>
  <line x1="237" y1="88" x2="250" y2="88" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowp)"/>
  <line x1="357" y1="88" x2="370" y2="88" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowp)"/>
  <line x1="477" y1="88" x2="490" y2="88" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowp)"/>
  <line x1="597" y1="88" x2="610" y2="88" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowp)"/>

  <text x="360" y="152" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A repeat visit can skip phases 1, 3, 4 entirely via caching and connection reuse</text>
  <text x="360" y="172" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">(highlighted phases: where most first-visit latency actually accumulates)</text>
</svg>
