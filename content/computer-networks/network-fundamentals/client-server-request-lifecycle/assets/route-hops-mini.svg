<svg viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowrt" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The packet's hop-by-hop path to the server</text>

  <circle cx="50" cy="90" r="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="50" y="94" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">You</text>
  <circle cx="200" cy="90" r="22" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="200" y="94" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">ISP</text>
  <circle cx="350" cy="90" r="22" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="350" y="94" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Backbone</text>
  <circle cx="500" cy="90" r="22" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="500" y="94" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Peer AS</text>
  <circle cx="600" cy="90" r="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="600" y="94" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Server</text>

  <line x1="74" y1="90" x2="176" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowrt)"/>
  <line x1="224" y1="90" x2="326" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowrt)"/>
  <line x1="374" y1="90" x2="476" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowrt)"/>
  <line x1="524" y1="90" x2="576" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowrt)"/>

  <text x="320" y="150" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each hop's router does its own longest-prefix-match lookup — no single router knows the whole path</text>
</svg>
