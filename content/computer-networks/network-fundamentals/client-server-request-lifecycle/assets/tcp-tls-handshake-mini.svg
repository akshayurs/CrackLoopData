<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowh" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Two handshakes before one HTTP byte moves</text>

  <line x1="120" y1="50" x2="120" y2="230" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="120" y="42" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Client</text>
  <line x1="520" y1="50" x2="520" y2="230" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="520" y="42" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Server</text>

  <line x1="120" y1="72" x2="520" y2="72" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowh)"/>
  <text x="320" y="65" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">SYN</text>
  <line x1="520" y1="94" x2="120" y2="94" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowh)"/>
  <text x="320" y="87" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">SYN-ACK</text>
  <line x1="120" y1="116" x2="520" y2="116" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowh)"/>
  <text x="320" y="109" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">ACK — TCP connected</text>

  <line x1="120" y1="148" x2="520" y2="148" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowh)"/>
  <text x="320" y="141" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">ClientHello</text>
  <line x1="520" y1="170" x2="120" y2="170" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowh)"/>
  <text x="320" y="163" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">ServerHello + cert + key exchange</text>
  <line x1="120" y1="192" x2="520" y2="192" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowh)"/>
  <text x="320" y="185" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Finished — TLS encrypted channel ready</text>

  <text x="320" y="222" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Only after both complete does the actual HTTP request go out</text>
</svg>
