<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowdn" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">DNS: hostname to IP, in short</text>

  <rect x="20" y="70" width="90" height="42" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="65" y="95" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">Browser</text>

  <rect x="170" y="70" width="120" height="42" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="230" y="95" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">Recursive resolver</text>

  <rect x="360" y="30" width="90" height="38" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="405" y="54" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Root</text>

  <rect x="360" y="80" width="90" height="38" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="405" y="104" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">TLD (.com)</text>

  <rect x="360" y="130" width="90" height="38" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="405" y="154" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Authoritative</text>

  <line x1="110" y1="91" x2="168" y2="91" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowdn)"/>
  <line x1="290" y1="80" x2="358" y2="52" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowdn)"/>
  <line x1="290" y1="91" x2="358" y2="99" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowdn)"/>
  <line x1="290" y1="100" x2="358" y2="146" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowdn)"/>

  <text x="320" y="196" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The resolver walks root → TLD → authoritative once, then caches the answer</text>
</svg>
