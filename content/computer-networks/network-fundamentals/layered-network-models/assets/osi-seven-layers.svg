<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">OSI: 7 layers, bits at the bottom</text>

  <g font-size="12.5">
    <rect x="40" y="42" width="230" height="42" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="55" y="68" fill="var(--dg-ink, #202124)" font-weight="600">7 · Application</text>
    <text x="285" y="68" fill="var(--dg-muted, #5F6368)">user-facing protocols: HTTP, DNS, SMTP</text>

    <rect x="40" y="90" width="230" height="42" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="55" y="116" fill="var(--dg-ink, #202124)" font-weight="600">6 · Presentation</text>
    <text x="285" y="116" fill="var(--dg-muted, #5F6368)">encoding, encryption, compression</text>

    <rect x="40" y="138" width="230" height="42" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="55" y="164" fill="var(--dg-ink, #202124)" font-weight="600">5 · Session</text>
    <text x="285" y="164" fill="var(--dg-muted, #5F6368)">sets up/tears down dialog state</text>

    <rect x="40" y="186" width="230" height="42" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="55" y="212" fill="var(--dg-ink, #202124)" font-weight="600">4 · Transport</text>
    <text x="285" y="212" fill="var(--dg-muted, #5F6368)">process-to-process: TCP, UDP</text>

    <rect x="40" y="234" width="230" height="42" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="55" y="260" fill="var(--dg-ink, #202124)" font-weight="600">3 · Network</text>
    <text x="285" y="260" fill="var(--dg-muted, #5F6368)">host-to-host routing: IP</text>

    <rect x="40" y="282" width="230" height="42" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="55" y="308" fill="var(--dg-ink, #202124)" font-weight="600">2 · Data Link</text>
    <text x="285" y="308" fill="var(--dg-muted, #5F6368)">frames on one hop: Ethernet, MAC</text>

    <rect x="40" y="330" width="230" height="42" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="55" y="356" fill="var(--dg-ink, #202124)" font-weight="600">1 · Physical</text>
    <text x="285" y="356" fill="var(--dg-muted, #5F6368)">raw bits: cables, radio, voltages</text>
  </g>

  <line x1="155" y1="382" x2="155" y2="404" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="428" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Data flows down to send, up to receive. Only layers 3-4 (highlighted) map cleanly onto TCP/IP's own layers.</text>
</svg>
