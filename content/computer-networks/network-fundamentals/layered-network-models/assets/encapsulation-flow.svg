<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Encapsulation: an HTTP request wrapped for the wire</text>

  <rect x="240" y="46" width="160" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="68" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">HTTP data</text>

  <rect x="210" y="98" width="220" height="34" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="222" y="120" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">TCP hdr</text>
  <rect x="270" y="98" width="160" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="none"/>
  <text x="350" y="120" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">HTTP data</text>
  <text x="450" y="120" font-size="11.5" fill="var(--dg-muted, #5F6368)">= segment</text>

  <rect x="180" y="150" width="280" height="34" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="192" y="172" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">IP hdr</text>
  <rect x="240" y="150" width="220" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="none"/>
  <text x="350" y="172" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">TCP hdr + HTTP data</text>
  <text x="500" y="172" font-size="11.5" fill="var(--dg-muted, #5F6368)">= packet</text>

  <rect x="150" y="202" width="340" height="34" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="162" y="224" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Eth hdr</text>
  <rect x="210" y="202" width="280" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="none"/>
  <text x="350" y="224" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">IP hdr + TCP hdr + HTTP data</text>
  <text x="550" y="224" font-size="11.5" fill="var(--dg-muted, #5F6368)">= frame</text>

  <line x1="320" y1="80" x2="320" y2="94" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="320" y1="132" x2="320" y2="146" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="320" y1="184" x2="320" y2="198" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <text x="320" y="264" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Each layer adds its own header, treating everything above as opaque payload</text>
  <text x="320" y="286" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">the frame goes out onto the wire as raw bits (physical layer, not a header)</text>
</svg>
