<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">TCP/IP: the 4 layers the internet actually runs</text>

  <g font-size="12.5">
    <rect x="60" y="46" width="520" height="42" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="75" y="72" fill="var(--dg-ink, #202124)" font-weight="600">Application</text>
    <text x="260" y="72" fill="var(--dg-muted, #5F6368)">merges OSI's App + Presentation + Session — HTTP, DNS, TLS</text>

    <rect x="60" y="94" width="520" height="42" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="75" y="120" fill="var(--dg-ink, #202124)" font-weight="600">Transport</text>
    <text x="260" y="120" fill="var(--dg-muted, #5F6368)">TCP or UDP — process-to-process delivery</text>

    <rect x="60" y="142" width="520" height="42" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="75" y="168" fill="var(--dg-ink, #202124)" font-weight="600">Internet</text>
    <text x="260" y="168" fill="var(--dg-muted, #5F6368)">IP — best-effort routing between hosts</text>

    <rect x="60" y="190" width="520" height="42" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="75" y="216" fill="var(--dg-ink, #202124)" font-weight="600">Link</text>
    <text x="260" y="216" fill="var(--dg-muted, #5F6368)">merges OSI's Data Link + Physical — Ethernet, Wi-Fi</text>
  </g>

  <text x="320" y="260" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">TCP/IP won in practice: it shipped as working code (ARPANET/internet)</text>
  <text x="320" y="278" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">while OSI was still a committee spec. OSI survives as the teaching model.</text>
</svg>
