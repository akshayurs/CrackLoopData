<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowpat" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">PAT: one public IP, many hosts, via ports</text>

  <circle cx="60" cy="90" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="94" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">A</text>
  <text x="60" y="120" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">10.0.0.5:5001</text>

  <circle cx="60" cy="170" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="174" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">B</text>
  <text x="60" y="200" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">10.0.0.6:5001</text>

  <rect x="220" y="60" width="220" height="150" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="330" y="82" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">NAT table</text>
  <g font-family="ui-monospace, monospace" font-size="9.5">
    <text x="235" y="102" fill="var(--dg-ink, #202124)">10.0.0.5:5001 → 203.0.113.9:40001</text>
    <text x="235" y="122" fill="var(--dg-ink, #202124)">10.0.0.6:5001 → 203.0.113.9:40002</text>
  </g>

  <circle cx="600" cy="130" r="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="600" y="134" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Internet</text>

  <line x1="80" y1="90" x2="218" y2="100" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowpat)"/>
  <line x1="80" y1="170" x2="218" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowpat)"/>
  <line x1="440" y1="130" x2="576" y2="130" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrowpat)"/>
  <text x="510" y="120" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">203.0.113.9</text>

  <text x="330" y="250" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Same source port, different translated ports — that's what makes many-to-one work</text>
  <text x="330" y="272" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">a return packet to :40002 is unambiguously mapped back to Host B</text>
</svg>
