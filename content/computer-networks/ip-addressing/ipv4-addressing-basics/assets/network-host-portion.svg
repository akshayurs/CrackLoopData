<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Network portion vs host portion</text>

  <text x="320" y="70" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" fill="var(--dg-ink, #202124)">192.168.1.42 / 24</text>

  <rect x="100" y="100" width="270" height="46" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="235" y="128" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">192.168.1</text>

  <rect x="370" y="100" width="90" height="46" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="415" y="128" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">42</text>

  <text x="235" y="172" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Network portion — /24 = first 24 bits</text>
  <text x="415" y="172" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Host portion — remaining 8 bits</text>

  <text x="320" y="210" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">/24 means "the first 24 bits identify the network"; the rest identifies the host on it</text>
</svg>
