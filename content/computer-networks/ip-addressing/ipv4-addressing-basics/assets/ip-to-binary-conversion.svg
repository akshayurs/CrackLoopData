<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Converting 192.168.1.42 to binary, octet by octet</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5">
    <text x="40" y="70" fill="var(--dg-accent, #0C8F88)" font-weight="600">192</text>
    <text x="100" y="70" fill="var(--dg-muted, #5F6368)">=</text>
    <text x="130" y="70" fill="var(--dg-ink, #202124)">11000000</text>

    <text x="40" y="100" fill="var(--dg-accent, #0C8F88)" font-weight="600">168</text>
    <text x="100" y="100" fill="var(--dg-muted, #5F6368)">=</text>
    <text x="130" y="100" fill="var(--dg-ink, #202124)">10101000</text>

    <text x="40" y="130" fill="var(--dg-accent, #0C8F88)" font-weight="600">1</text>
    <text x="100" y="130" fill="var(--dg-muted, #5F6368)">=</text>
    <text x="130" y="130" fill="var(--dg-ink, #202124)">00000001</text>

    <text x="40" y="160" fill="var(--dg-accent, #0C8F88)" font-weight="600">42</text>
    <text x="100" y="160" fill="var(--dg-muted, #5F6368)">=</text>
    <text x="130" y="160" fill="var(--dg-ink, #202124)">00101010</text>
  </g>

  <text x="320" y="200" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each octet is independent: value ÷ 128, 64, 32, 16, 8, 4, 2, 1 — read off which bits fit</text>
</svg>
