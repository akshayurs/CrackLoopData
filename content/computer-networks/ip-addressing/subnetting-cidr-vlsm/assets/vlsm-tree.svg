<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="340" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">VLSM: a /24 split into uneven pieces by need</text>

  <rect x="20" y="44" width="640" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="340" y="66" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">10.0.0.0/24 — 256 addresses</text>

  <rect x="20" y="100" width="320" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="180" y="122" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">10.0.0.0/25 — Sales (100 hosts)</text>

  <rect x="350" y="100" width="150" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="425" y="122" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">10.0.0.128/26 — Ops (50)</text>

  <rect x="510" y="100" width="150" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="585" y="122" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">further split →</text>

  <rect x="510" y="150" width="75" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="547" y="172" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">/27 IT (20)</text>

  <rect x="585" y="150" width="75" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="622" y="172" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">/28 Guest (10)</text>

  <line x1="340" y1="78" x2="180" y2="98" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="340" y1="78" x2="425" y2="98" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="340" y1="78" x2="585" y2="98" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="585" y1="134" x2="547" y2="148" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="585" y1="134" x2="622" y2="148" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>

  <text x="340" y="230" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Each subnet is sized to what it actually needs, not one uniform block</text>
  <text x="340" y="252" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">a fixed-length split into four /26s would have wasted addresses on the 10- and 20-host subnets</text>
</svg>
