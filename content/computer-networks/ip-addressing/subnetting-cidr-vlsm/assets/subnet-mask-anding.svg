<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Finding the network: AND the address with the mask</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
    <text x="40" y="70" fill="var(--dg-muted, #5F6368)">Address:</text>
    <text x="180" y="70" fill="var(--dg-ink, #202124)">11000000.10101000.00000101.01101011</text>

    <text x="40" y="98" fill="var(--dg-muted, #5F6368)">Mask /26:</text>
    <text x="180" y="98" fill="var(--dg-accent, #0C8F88)" font-weight="600">11111111.11111111.11111111.11000000</text>

    <line x1="180" y1="108" x2="600" y2="108" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

    <text x="40" y="132" fill="var(--dg-muted, #5F6368)">AND (&amp;):</text>
    <text x="180" y="132" fill="var(--dg-ink, #202124)" font-weight="600">11000000.10101000.00000101.01000000</text>
  </g>

  <text x="320" y="170" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Result: 192.168.5.64 — the network address for this /26</text>
  <text x="320" y="192" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">only bits where the mask is 1 survive; host bits (mask = 0) are zeroed out</text>
</svg>
