<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="340" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">IPv4 header vs IPv6 header — what got simpler</text>

  <text x="170" y="52" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">IPv4 (13 fields)</text>
  <g font-size="10">
    <rect x="30" y="64" width="280" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="170" y="80" text-anchor="middle" fill="var(--dg-ink, #202124)">Version, IHL, ToS, Total Length</text>
    <rect x="30" y="88" width="280" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="170" y="104" text-anchor="middle" fill="var(--dg-ink, #202124)">Identification, Flags, Fragment offset</text>
    <rect x="30" y="112" width="280" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="170" y="128" text-anchor="middle" fill="var(--dg-ink, #202124)">TTL, Protocol, Header checksum</text>
    <rect x="30" y="136" width="280" height="24" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
    <text x="170" y="152" text-anchor="middle" fill="var(--dg-ink, #202124)">Source address (32 bits)</text>
    <rect x="30" y="160" width="280" height="24" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
    <text x="170" y="176" text-anchor="middle" fill="var(--dg-ink, #202124)">Destination address (32 bits)</text>
    <rect x="30" y="184" width="280" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="170" y="200" text-anchor="middle" fill="var(--dg-ink, #202124)">Options (variable)</text>
  </g>

  <text x="510" y="52" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">IPv6 (8 fields, fixed size)</text>
  <g font-size="10">
    <rect x="370" y="64" width="280" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="510" y="80" text-anchor="middle" fill="var(--dg-ink, #202124)">Version, Traffic class, Flow label</text>
    <rect x="370" y="88" width="280" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="510" y="104" text-anchor="middle" fill="var(--dg-ink, #202124)">Payload length, Next header, Hop limit</text>
    <rect x="370" y="112" width="280" height="24" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
    <text x="510" y="128" text-anchor="middle" fill="var(--dg-ink, #202124)">Source address (128 bits)</text>
    <rect x="370" y="136" width="280" height="24" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
    <text x="510" y="152" text-anchor="middle" fill="var(--dg-ink, #202124)">Destination address (128 bits)</text>
  </g>

  <text x="340" y="250" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">No header checksum, no in-header fragmentation, no options field</text>
  <text x="340" y="272" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">fixed 40-byte header is cheaper for routers to process, even though addresses are 4x longer</text>
  <text x="340" y="294" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">extensions move to optional "extension headers" chained via Next Header, instead of bloating every packet</text>
</svg>
