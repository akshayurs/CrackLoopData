<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrownh" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A packet's next-hop decision, two routers deep</text>

  <circle cx="60" cy="140" r="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="144" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Host</text>

  <rect x="200" y="110" width="120" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="260" y="135" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">Router 1</text>
  <text x="260" y="152" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">checks table → R2</text>

  <rect x="400" y="110" width="120" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="460" y="135" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">Router 2</text>
  <text x="460" y="152" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">checks table → dest</text>

  <circle cx="620" cy="140" r="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="620" y="144" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Server</text>

  <line x1="84" y1="140" x2="198" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrownh)"/>
  <line x1="320" y1="140" x2="398" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrownh)"/>
  <line x1="520" y1="140" x2="596" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrownh)"/>

  <text x="340" y="210" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Each router independently looks up the destination and picks its own next hop</text>
  <text x="340" y="232" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">no single device holds — or needs — the full end-to-end path</text>
</svg>
