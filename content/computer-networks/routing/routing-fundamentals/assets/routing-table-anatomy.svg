<svg viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="340" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Anatomy of a routing table entry</text>

  <g font-size="11">
    <rect x="30" y="50" width="140" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="100" y="71" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">Destination</text>
    <rect x="170" y="50" width="140" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="240" y="71" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">Next hop</text>
    <rect x="310" y="50" width="130" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="375" y="71" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">Interface</text>
    <rect x="440" y="50" width="100" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="490" y="71" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">Metric</text>

    <rect x="30" y="90" width="140" height="30" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="100" y="110" text-anchor="middle" fill="var(--dg-muted, #5F6368)" font-family="ui-monospace, monospace" font-size="10">10.1.0.0/16</text>
    <rect x="170" y="90" width="140" height="30" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="240" y="110" text-anchor="middle" fill="var(--dg-muted, #5F6368)" font-family="ui-monospace, monospace" font-size="10">192.168.0.1</text>
    <rect x="310" y="90" width="130" height="30" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="375" y="110" text-anchor="middle" fill="var(--dg-muted, #5F6368)" font-family="ui-monospace, monospace" font-size="10">eth0</text>
    <rect x="440" y="90" width="100" height="30" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="490" y="110" text-anchor="middle" fill="var(--dg-muted, #5F6368)" font-family="ui-monospace, monospace" font-size="10">2</text>

    <rect x="30" y="120" width="140" height="30" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="100" y="140" text-anchor="middle" fill="var(--dg-muted, #5F6368)" font-family="ui-monospace, monospace" font-size="10">0.0.0.0/0</text>
    <rect x="170" y="120" width="140" height="30" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="240" y="140" text-anchor="middle" fill="var(--dg-muted, #5F6368)" font-family="ui-monospace, monospace" font-size="10">203.0.113.1</text>
    <rect x="310" y="120" width="130" height="30" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="375" y="140" text-anchor="middle" fill="var(--dg-muted, #5F6368)" font-family="ui-monospace, monospace" font-size="10">wan0</text>
    <rect x="440" y="120" width="100" height="30" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="490" y="140" text-anchor="middle" fill="var(--dg-muted, #5F6368)" font-family="ui-monospace, monospace" font-size="10">1</text>
  </g>

  <text x="340" y="190" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">The router never knows the whole path — only the next hop for each destination</text>
  <text x="340" y="212" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">0.0.0.0/0 is the default route: matches anything not covered by a more specific entry</text>
</svg>
