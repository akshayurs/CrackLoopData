<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowex" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Distance-vector table exchange vs link-state flooding</text>

  <text x="170" y="48" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Distance-vector</text>
  <circle cx="90" cy="110" r="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="114" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">A</text>
  <circle cx="170" cy="160" r="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="170" y="164" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">B</text>
  <circle cx="250" cy="110" r="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="114" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">C</text>
  <line x1="108" y1="122" x2="152" y2="148" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowex)"/>
  <line x1="188" y1="148" x2="232" y2="122" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowex)"/>
  <text x="170" y="210" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">each neighbor shares its</text>
  <text x="170" y="225" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">whole table, only with neighbors</text>

  <line x1="340" y1="30" x2="340" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>

  <text x="510" y="48" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Link-state</text>
  <circle cx="430" cy="110" r="22" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="430" y="114" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">A</text>
  <circle cx="510" cy="160" r="22" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="510" y="164" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">B</text>
  <circle cx="590" cy="110" r="22" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="590" y="114" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">C</text>
  <line x1="448" y1="122" x2="492" y2="148" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <line x1="528" y1="148" x2="572" y2="122" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <line x1="430" y1="132" x2="590" y2="132" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="510" y="210" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">every router floods its own link</text>
  <text x="510" y="225" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">info to the whole area — each builds a full map</text>

  <text x="340" y="288" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">DV shares full tables locally; link-state shares partial info globally</text>
</svg>
