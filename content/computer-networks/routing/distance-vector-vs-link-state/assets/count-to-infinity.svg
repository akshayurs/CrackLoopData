<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowct" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Count-to-infinity: a stale route feeds on itself</text>

  <circle cx="80" cy="120" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="124" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">A</text>
  <circle cx="280" cy="120" r="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="280" y="124" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">B</text>
  <circle cx="480" cy="120" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="480" y="124" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">C</text>
  <text x="580" y="124" font-size="10.5" fill="var(--dg-muted, #5F6368)">X (down)</text>

  <line x1="106" y1="120" x2="254" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="306" y1="120" x2="454" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="506" y1="120" x2="555" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="4 3"/>

  <g font-family="ui-monospace, monospace" font-size="10.5">
    <text x="280" y="170" text-anchor="middle" fill="var(--dg-muted, #5F6368)">t0: C's link to X breaks. C should advertise "X unreachable."</text>
    <text x="280" y="190" text-anchor="middle" fill="var(--dg-muted, #5F6368)">t1: B still has a stale route "X via C, cost 2" and advertises it to C</text>
    <text x="280" y="210" text-anchor="middle" fill="var(--dg-muted, #5F6368)">t2: C believes B's stale route, sets "X via B, cost 3" — the loop begins</text>
  </g>

  <text x="340" y="250" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Fix: split horizon (don't advertise a route back to where you learned it) + poison reverse</text>
</svg>
