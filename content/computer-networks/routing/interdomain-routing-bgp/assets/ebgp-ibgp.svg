<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="340" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">eBGP between ASes, iBGP within one</text>

  <rect x="60" y="60" width="220" height="160" rx="10" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="170" y="80" text-anchor="middle" font-size="11.5" fill="var(--dg-muted, #5F6368)">AS 65001</text>

  <circle cx="120" cy="130" r="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="120" y="134" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">R1</text>
  <circle cx="220" cy="130" r="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="220" y="134" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">R2</text>
  <line x1="140" y1="130" x2="200" y2="130" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="170" y="118" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">iBGP</text>

  <rect x="400" y="60" width="220" height="160" rx="10" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="510" y="80" text-anchor="middle" font-size="11.5" fill="var(--dg-muted, #5F6368)">AS 65002</text>

  <circle cx="460" cy="130" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="460" y="134" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">R3</text>
  <circle cx="560" cy="130" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="560" y="134" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">R4</text>
  <line x1="480" y1="130" x2="540" y2="130" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="510" y="118" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">iBGP</text>

  <line x1="220" y1="150" x2="460" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="340" y="170" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">eBGP peering</text>

  <text x="340" y="250" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">eBGP peers exchange routes between organizations; iBGP spreads them internally</text>
  <text x="340" y="272" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">every router inside an AS needs the same externally-learned routes to forward consistently</text>
</svg>
