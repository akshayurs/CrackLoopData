<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowrp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="340" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A route advertisement growing its AS-path as it propagates</text>

  <circle cx="80" cy="140" r="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="80" y="136" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">AS 100</text>
  <text x="80" y="150" text-anchor="middle" font-size="8.5" fill="var(--dg-muted, #5F6368)">origin</text>

  <circle cx="260" cy="140" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="260" y="144" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">AS 200</text>

  <circle cx="440" cy="140" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="440" y="144" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">AS 300</text>

  <circle cx="620" cy="140" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="620" y="144" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">AS 400</text>

  <line x1="106" y1="140" x2="234" y2="140" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowrp)"/>
  <text x="170" y="128" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">path: [100]</text>

  <line x1="286" y1="140" x2="414" y2="140" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowrp)"/>
  <text x="350" y="128" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">path: [200,100]</text>

  <line x1="466" y1="140" x2="594" y2="140" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowrp)"/>
  <text x="530" y="128" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">path: [300,200,100]</text>

  <text x="340" y="210" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Every AS prepends itself before re-advertising — the AS-path both routes and prevents loops</text>
  <text x="340" y="232" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">if AS 100 ever sees its own number reappear in a received path, it discards the route (loop detected)</text>
</svg>
