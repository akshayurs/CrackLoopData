<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowM" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Three streams, one TCP connection</text>

  <rect x="30" y="55" width="150" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="105" y="77" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Stream 1 (large)</text>

  <rect x="30" y="103" width="150" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="125" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Stream 2</text>

  <rect x="30" y="151" width="150" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="173" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Stream 3</text>

  <line x1="180" y1="72" x2="250" y2="72" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowM)"/>
  <line x1="180" y1="120" x2="250" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowM)"/>
  <line x1="180" y1="168" x2="250" y2="168" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowM)"/>

  <rect x="250" y="60" width="220" height="150" rx="8" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="360" y="55" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">one TCP connection</text>

  <g font-size="11" fill="var(--dg-ink, #202124)">
    <rect x="265" y="80" width="46" height="20" rx="3" fill="var(--dg-accent, #0C8F88)"/>
    <text x="288" y="94" text-anchor="middle" fill="var(--dg-fill, #fff)">S1</text>
    <rect x="315" y="80" width="46" height="20" rx="3" fill="var(--dg-stroke, #9AA0A6)"/>
    <text x="338" y="94" text-anchor="middle" fill="var(--dg-fill, #fff)">S2</text>
    <rect x="365" y="80" width="46" height="20" rx="3" fill="var(--dg-accent, #0C8F88)"/>
    <text x="388" y="94" text-anchor="middle" fill="var(--dg-fill, #fff)">S1</text>

    <rect x="265" y="108" width="46" height="20" rx="3" fill="var(--dg-stroke, #9AA0A6)"/>
    <text x="288" y="122" text-anchor="middle" fill="var(--dg-fill, #fff)">S3</text>
    <rect x="315" y="108" width="46" height="20" rx="3" fill="var(--dg-accent, #0C8F88)"/>
    <text x="338" y="122" text-anchor="middle" fill="var(--dg-fill, #fff)">S1</text>
    <rect x="365" y="108" width="46" height="20" rx="3" fill="var(--dg-stroke, #9AA0A6)"/>
    <text x="388" y="122" text-anchor="middle" fill="var(--dg-fill, #fff)">S2</text>

    <rect x="265" y="136" width="46" height="20" rx="3" fill="var(--dg-accent, #0C8F88)"/>
    <text x="288" y="150" text-anchor="middle" fill="var(--dg-fill, #fff)">S1</text>
    <rect x="315" y="136" width="46" height="20" rx="3" fill="var(--dg-stroke, #9AA0A6)"/>
    <text x="338" y="150" text-anchor="middle" fill="var(--dg-fill, #fff)">S3</text>
    <rect x="365" y="136" width="46" height="20" rx="3" fill="var(--dg-accent, #0C8F88)"/>
    <text x="388" y="150" text-anchor="middle" fill="var(--dg-fill, #fff)">S1</text>
  </g>
  <text x="360" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">frames interleaved, tagged by stream ID</text>

  <line x1="470" y1="135" x2="540" y2="135" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowM)"/>

  <rect x="540" y="55" width="150" height="164" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="615" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Server</text>
  <text x="615" y="105" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">reassembles</text>
  <text x="615" y="120" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">each stream</text>
  <text x="615" y="135" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">by ID</text>

  <text x="360" y="300" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Stream 1's large payload no longer blocks streams 2 and 3 from making progress.</text>
</svg>
