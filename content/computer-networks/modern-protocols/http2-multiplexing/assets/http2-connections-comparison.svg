<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="180" y="26" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">HTTP/1.1</text>
  <circle cx="80" cy="170" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="175" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Client</text>
  <rect x="230" y="55" width="90" height="230" rx="8" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="275" y="45" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Server</text>
  <g stroke="var(--dg-line, #5F6368)" stroke-width="1.3" fill="none">
    <path d="M106,150 C160,75 200,75 232,75" marker-end="url(#arrowC)"/>
    <path d="M106,160 C160,120 200,120 232,120" marker-end="url(#arrowC)"/>
    <path d="M106,170 C160,170 200,170 232,170" marker-end="url(#arrowC)"/>
    <path d="M106,180 C160,220 200,220 232,220" marker-end="url(#arrowC)"/>
    <path d="M106,190 C160,265 200,265 232,265" marker-end="url(#arrowC)"/>
  </g>
  <text x="275" y="300" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">~6 connections, each with its own handshake</text>

  <line x1="360" y1="30" x2="360" y2="310" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="540" y="26" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">HTTP/2</text>
  <circle cx="440" cy="170" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="440" y="175" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Client</text>
  <rect x="590" y="55" width="90" height="230" rx="8" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="635" y="45" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Server</text>
  <path d="M466,170 C520,170 560,170 592,170" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5" marker-end="url(#arrowC)"/>
  <text x="530" y="150" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">multiplexed</text>
  <text x="635" y="300" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">1 connection, 1 handshake, many streams</text>
</svg>
