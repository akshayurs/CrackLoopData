<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="180" y="26" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">TCP (HTTP/2)</text>
  <g font-size="11" fill="var(--dg-ink, #202124)">
    <rect x="60" y="60" width="240" height="26" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="180" y="77" text-anchor="middle">Stream 1</text>
    <rect x="60" y="96" width="240" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="180" y="113" text-anchor="middle">Stream 2</text>
    <rect x="60" y="132" width="240" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="180" y="149" text-anchor="middle">Stream 3</text>
  </g>
  <rect x="60" y="66" width="34" height="14" fill="#c0392b" opacity="0.85"/>
  <text x="77" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">packet lost</text>
  <line x1="77" y1="188" x2="77" y2="84" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 2"/>
  <rect x="40" y="170" width="280" height="70" rx="6" fill="none" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="180" y="192" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">TCP delivers bytes strictly in order —</text>
  <text x="180" y="208" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">streams 2 and 3 also stall until the</text>
  <text x="180" y="224" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">lost segment is retransmitted</text>

  <line x1="360" y1="30" x2="360" y2="290" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="540" y="26" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">QUIC (HTTP/3)</text>
  <g font-size="11" fill="var(--dg-ink, #202124)">
    <rect x="420" y="60" width="240" height="26" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="540" y="77" text-anchor="middle">Stream 1</text>
    <rect x="420" y="96" width="240" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="540" y="113" text-anchor="middle">Stream 2 — flowing</text>
    <rect x="420" y="132" width="240" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="540" y="149" text-anchor="middle">Stream 3 — flowing</text>
  </g>
  <rect x="420" y="66" width="34" height="14" fill="#c0392b" opacity="0.85"/>
  <rect x="400" y="170" width="280" height="60" rx="6" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="540" y="192" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Only stream 1 waits on its own</text>
  <text x="540" y="208" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">retransmit — loss recovery is per-stream</text>

  <text x="360" y="300" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Per-stream loss recovery is what fixes transport-layer head-of-line blocking.</text>
</svg>
