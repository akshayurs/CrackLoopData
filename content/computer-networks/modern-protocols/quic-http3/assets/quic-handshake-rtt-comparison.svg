<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="180" y="26" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">TCP + TLS 1.3 + HTTP/2</text>
  <line x1="60" y1="60" x2="60" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <line x1="300" y1="60" x2="300" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="60" y="52" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Client</text>
  <text x="300" y="52" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Server</text>

  <path d="M60,90 H300" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="180" y="84" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">TCP SYN</text>
  <path d="M300,110 H60" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="180" y="104" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">SYN-ACK — RTT 1 done</text>

  <path d="M60,150 H300" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="180" y="144" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">TLS ClientHello</text>
  <path d="M300,170 H60" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="180" y="164" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">ServerHello + keys — RTT 2 done</text>

  <path d="M60,210 H300" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.8" marker-end="url(#arrowR)"/>
  <text x="180" y="204" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">first HTTP/2 request</text>

  <rect x="30" y="230" width="300" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="180" y="250" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">2 RTT before first byte</text>

  <line x1="360" y1="30" x2="360" y2="300" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="540" y="26" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">QUIC + HTTP/3</text>
  <line x1="420" y1="60" x2="420" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <line x1="660" y1="60" x2="660" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="420" y="52" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Client</text>
  <text x="660" y="52" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Server</text>

  <path d="M420,120 H660" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="540" y="114" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">QUIC + TLS 1.3 combined hello</text>
  <path d="M660,150 H420" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="540" y="144" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">handshake done — RTT 1</text>

  <path d="M420,190 H660" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.8" marker-end="url(#arrowR)"/>
  <text x="540" y="184" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">first HTTP/3 request</text>

  <rect x="390" y="210" width="300" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="540" y="230" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">1 RTT (0-RTT on resume)</text>
</svg>
