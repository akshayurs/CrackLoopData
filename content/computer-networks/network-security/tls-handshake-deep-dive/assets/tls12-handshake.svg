<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">TLS 1.2 handshake</text>

  <rect x="30" y="46" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="80" y="68" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Client</text>
  <rect x="510" y="46" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="560" y="68" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Server</text>

  <g font-size="11" fill="var(--dg-ink, #202124)">
    <line x1="80" y1="95" x2="560" y2="95" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
    <text x="320" y="89" text-anchor="middle">ClientHello (ciphers, random)</text>
    <line x1="560" y1="125" x2="80" y2="125" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
    <text x="320" y="119" text-anchor="middle">ServerHello + certificate + cipher</text>
    <line x1="80" y1="155" x2="560" y2="155" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
    <text x="320" y="149" text-anchor="middle">Key exchange material</text>
    <line x1="80" y1="185" x2="560" y2="185" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <line x1="560" y1="215" x2="80" y2="215" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <text x="320" y="205" text-anchor="middle">Finished / Finished</text>
  </g>

  <rect x="180" y="230" width="280" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="320" y="250" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">application data now encrypted with session key</text>

  <text x="320" y="288" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Two full round trips before any real data can move.</text>
</svg>
