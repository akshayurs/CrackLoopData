<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="240" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Certificate chain of trust</text>

  <rect x="140" y="50" width="200" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="72" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Root CA</text>
  <text x="240" y="90" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">trusted by OS/browser</text>

  <line x1="240" y1="100" x2="240" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="260" y="125" font-size="10" fill="var(--dg-muted, #5F6368)">signs</text>

  <rect x="140" y="140" width="200" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="162" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Intermediate CA</text>
  <text x="240" y="180" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">issued for daily use</text>

  <line x1="240" y1="190" x2="240" y2="230" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="260" y="215" font-size="10" fill="var(--dg-muted, #5F6368)">signs</text>

  <rect x="140" y="230" width="200" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="240" y="252" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Leaf certificate</text>
  <text x="240" y="270" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">example.com</text>

  <text x="240" y="316" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The browser walks up this chain until it reaches a root it already trusts.</text>
</svg>
