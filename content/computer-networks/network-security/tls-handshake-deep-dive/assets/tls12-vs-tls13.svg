<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">TLS 1.2 vs TLS 1.3 — round trips</text>

  <text x="160" y="50" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">TLS 1.2</text>
  <line x1="60" y1="70" x2="60" y2="180" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>
  <line x1="260" y1="70" x2="260" y2="180" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>
  <line x1="60" y1="90" x2="260" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="260" y1="115" x2="60" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="60" y1="140" x2="260" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="260" y1="165" x2="60" y2="165" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="160" y="200" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">2 round trips</text>

  <text x="520" y="50" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">TLS 1.3</text>
  <line x1="420" y1="70" x2="420" y2="180" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>
  <line x1="620" y1="70" x2="620" y2="180" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3"/>
  <line x1="420" y1="105" x2="620" y2="105" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="140" x2="420" y2="140" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="200" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">1 round trip</text>

  <text x="340" y="250" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Client guesses parameters upfront in TLS 1.3, so the server can reply with everything at once.</text>
  <text x="340" y="272" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">At 100ms RTT, that's roughly 100ms saved on every new connection.</text>
</svg>
