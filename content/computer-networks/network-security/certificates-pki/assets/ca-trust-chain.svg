<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="310" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Trust flows from a pre-installed root</text>

  <rect x="30" y="60" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="88" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Browser trust store</text>

  <line x1="180" y1="83" x2="240" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="210" y="73" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">trusts</text>

  <rect x="240" y="60" width="120" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="300" y="88" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Root CA</text>

  <line x1="300" y1="106" x2="300" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="320" y="132" font-size="10" fill="var(--dg-muted, #5F6368)">signs</text>

  <rect x="220" y="150" width="160" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="300" y="178" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Intermediate CA</text>

  <line x1="300" y1="196" x2="300" y2="238" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="320" y="220" font-size="10" fill="var(--dg-muted, #5F6368)">signs</text>

  <rect x="220" y="238" width="160" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="300" y="266" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">example.com cert</text>

  <text x="490" y="180" font-size="12" fill="var(--dg-muted, #5F6368)">A rogue root</text>
  <text x="490" y="198" font-size="12" fill="var(--dg-muted, #5F6368)">= trust for any</text>
  <text x="490" y="216" font-size="12" fill="var(--dg-muted, #5F6368)">cert it signs.</text>
</svg>
