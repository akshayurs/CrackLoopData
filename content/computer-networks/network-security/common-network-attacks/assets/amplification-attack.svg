<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Reflection / amplification attack</text>

  <rect x="30" y="70" width="120" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="98" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Attacker</text>

  <rect x="260" y="70" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="330" y="92" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Open DNS / NTP</text>
  <text x="330" y="107" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">server</text>

  <rect x="490" y="70" width="120" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="550" y="98" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Victim</text>

  <line x1="150" y1="93" x2="258" y2="93" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="204" y="80" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">small request</text>
  <text x="204" y="130" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">spoofed source:</text>
  <text x="204" y="143" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">victim's IP</text>

  <path d="M400,93 C450,93 460,150 490,150" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="470" y="180" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">large response</text>
  <text x="470" y="193" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">sent to victim</text>

  <text x="320" y="200" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Attacker never touches the victim directly — the amplifying server</text>
  <text x="320" y="218" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">does the flooding, unwittingly, on the attacker's behalf.</text>

  <rect x="230" y="240" width="180" height="50" rx="8" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="320" y="262" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Victim only sees</text>
  <text x="320" y="278" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">a flood of unsolicited replies</text>
</svg>
