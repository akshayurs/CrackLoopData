<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Man-in-the-middle</text>

  <rect x="30" y="110" width="120" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="140" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Client</text>

  <rect x="490" y="110" width="120" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="550" y="140" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Real server</text>

  <rect x="260" y="100" width="120" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="320" y="128" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Attacker</text>
  <text x="320" y="146" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">reads / alters</text>
  <text x="320" y="160" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">traffic</text>

  <line x1="150" y1="135" x2="258" y2="135" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="382" y1="135" x2="488" y2="135" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="488" y1="150" x2="382" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="258" y1="150" x2="150" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="90" y="200" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">believes it is</text>
  <text x="90" y="214" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">talking directly</text>
  <text x="550" y="200" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">believes it is</text>
  <text x="550" y="214" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">talking directly</text>

  <text x="320" y="256" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Same pattern at link (ARP), DNS, or app layer (fake Wi-Fi hotspot).</text>
  <text x="320" y="274" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Encryption alone doesn't stop this without identity verification.</text>
</svg>
