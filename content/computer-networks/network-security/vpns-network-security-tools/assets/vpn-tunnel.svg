<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, system-ui, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <rect x="16" y="80" width="120" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="76" y="106" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Site A</text>
  <text x="76" y="124" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">gateway</text>
  <rect x="504" y="80" width="120" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="564" y="106" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Site B</text>
  <text x="564" y="124" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">gateway</text>
  <rect x="176" y="66" width="288" height="88" rx="44" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="6 4"/>
  <text x="320" y="104" text-anchor="middle" font-size="13" fill="var(--dg-accent, #0C8F88)" font-weight="600">encrypted tunnel</text>
  <text x="320" y="124" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">over the untrusted Internet</text>
  <line x1="136" y1="110" x2="176" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#ar)"/>
  <line x1="464" y1="110" x2="504" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#ar)"/>
  <text x="320" y="40" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">public path &#183; anyone can see the packets, but not the plaintext</text>
</svg>
