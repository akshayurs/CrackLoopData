<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Ethernet II frame format</text>

  <g font-size="10.5">
    <rect x="20" y="60" width="60" height="50" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="50" y="82" text-anchor="middle" fill="var(--dg-ink, #202124)">Preamble</text>
    <text x="50" y="96" text-anchor="middle" fill="var(--dg-muted, #5F6368)">8 B</text>

    <rect x="80" y="60" width="110" height="50" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="135" y="82" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">Dest MAC</text>
    <text x="135" y="96" text-anchor="middle" fill="var(--dg-muted, #5F6368)">6 B</text>

    <rect x="190" y="60" width="110" height="50" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="245" y="82" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">Src MAC</text>
    <text x="245" y="96" text-anchor="middle" fill="var(--dg-muted, #5F6368)">6 B</text>

    <rect x="300" y="60" width="70" height="50" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="335" y="82" text-anchor="middle" fill="var(--dg-ink, #202124)">EtherType</text>
    <text x="335" y="96" text-anchor="middle" fill="var(--dg-muted, #5F6368)">2 B</text>

    <rect x="370" y="60" width="230" height="50" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="485" y="82" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">Payload (the IP packet)</text>
    <text x="485" y="96" text-anchor="middle" fill="var(--dg-muted, #5F6368)">46-1500 B — the MTU</text>

    <rect x="600" y="60" width="60" height="50" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="630" y="82" text-anchor="middle" fill="var(--dg-ink, #202124)">FCS</text>
    <text x="630" y="96" text-anchor="middle" fill="var(--dg-muted, #5F6368)">4 B (CRC)</text>
  </g>

  <text x="350" y="150" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">MTU = 1500 bytes is the payload cap, not the whole frame</text>
  <text x="350" y="172" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">EtherType tells the receiver what's inside the payload (0x0800 = IPv4, 0x86DD = IPv6)</text>
  <text x="350" y="194" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">FCS is the CRC covered in Framing &amp; Error Control</text>
</svg>
