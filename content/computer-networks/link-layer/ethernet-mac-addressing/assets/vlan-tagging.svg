<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowv" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">802.1Q: one switch, two isolated broadcast domains</text>

  <rect x="260" y="50" width="160" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="340" y="80" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Switch</text>

  <circle cx="100" cy="150" r="24" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="100" y="154" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">HR-1</text>
  <circle cx="220" cy="150" r="24" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="220" y="154" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">HR-2</text>
  <text x="160" y="196" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">VLAN 10 (HR)</text>

  <circle cx="460" cy="150" r="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="460" y="154" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Eng-1</text>
  <circle cx="580" cy="150" r="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="580" y="154" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Eng-2</text>
  <text x="520" y="196" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">VLAN 20 (Engineering)</text>

  <line x1="100" y1="126" x2="270" y2="98" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <line x1="220" y1="126" x2="290" y2="98" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <line x1="460" y1="126" x2="390" y2="98" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="580" y1="126" x2="410" y2="98" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>

  <text x="340" y="240" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">A broadcast from HR-1 reaches HR-2 but never Eng-1 or Eng-2</text>
  <text x="340" y="262" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">— one physical switch, two logically separate broadcast domains, tagged in each frame's 802.1Q header</text>
</svg>
