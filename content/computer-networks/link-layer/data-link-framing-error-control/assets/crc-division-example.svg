<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">CRC: appending the remainder of a binary division</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
    <text x="40" y="66" fill="var(--dg-muted, #5F6368)">Data:</text>
    <text x="120" y="66" fill="var(--dg-ink, #202124)">1101011011</text>

    <text x="40" y="94" fill="var(--dg-muted, #5F6368)">Generator (poly):</text>
    <text x="220" y="94" fill="var(--dg-accent, #0C8F88)" font-weight="600">10011</text>

    <text x="40" y="122" fill="var(--dg-muted, #5F6368)">Message + 4 zeros:</text>
    <text x="230" y="122" fill="var(--dg-ink, #202124)">11010110110000</text>

    <rect x="30" y="140" width="580" height="76" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="45" y="164" fill="var(--dg-ink, #202124)">divide (XOR) message by generator, bit by bit</text>
    <text x="45" y="186" fill="var(--dg-ink, #202124)">— repeat XOR-and-shift until fewer bits remain</text>
    <text x="45" y="206" fill="var(--dg-ink, #202124)">than the generator —&gt; remainder is the CRC</text>
  </g>

  <text x="40" y="248" font-family="ui-monospace, monospace" font-size="14" fill="var(--dg-muted, #5F6368)">Remainder (CRC):</text>
  <text x="260" y="248" font-family="ui-monospace, monospace" font-size="14" fill="var(--dg-accent, #0C8F88)" font-weight="600">0100</text>

  <text x="40" y="276" font-family="ui-monospace, monospace" font-size="14" fill="var(--dg-muted, #5F6368)">Transmitted frame:</text>
  <text x="260" y="276" font-family="ui-monospace, monospace" font-size="14" fill="var(--dg-ink, #202124)">11010110110100</text>
</svg>
