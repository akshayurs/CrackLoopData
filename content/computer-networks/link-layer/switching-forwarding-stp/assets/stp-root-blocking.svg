<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">STP: one loop broken by blocking a port</text>

  <rect x="270" y="46" width="100" height="42" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="320" y="70" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">Root bridge</text>

  <rect x="100" y="170" width="100" height="42" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="194" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">Switch B</text>

  <rect x="440" y="170" width="100" height="42" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="194" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">Switch C</text>

  <line x1="285" y1="88" x2="170" y2="168" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>
  <line x1="355" y1="88" x2="490" y2="168" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>
  <line x1="200" y1="191" x2="440" y2="191" stroke="var(--dg-line, #5F6368)" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="320" y="210" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">blocked (would form a loop)</text>

  <text x="200" y="255" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">Root bridge election picks the lowest bridge ID</text>
  <text x="200" y="277" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">every other switch computes its shortest path to root, then blocks any port that would create a second path</text>
</svg>
