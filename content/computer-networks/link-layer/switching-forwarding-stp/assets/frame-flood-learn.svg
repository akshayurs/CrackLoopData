<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowf" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A frame flooded once, then learned</text>

  <circle cx="80" cy="140" r="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="144" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">A</text>

  <rect x="200" y="60" width="90" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="245" y="84" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">SW1</text>

  <rect x="360" y="140" width="90" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="405" y="164" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">SW2</text>

  <rect x="520" y="60" width="90" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="565" y="84" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">SW3</text>

  <circle cx="620" cy="180" r="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="620" y="184" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">B</text>

  <line x1="104" y1="140" x2="198" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowf)"/>
  <line x1="290" y1="90" x2="358" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowf)"/>
  <line x1="450" y1="150" x2="518" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowf)"/>
  <line x1="610" y1="90" x2="620" y2="156" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowf)"/>

  <text x="340" y="220" text-anchor="middle" font-size="12.5" fill="var(--dg-ink, #202124)" font-weight="600">A → B, destination unknown: every switch floods out all ports but the one it arrived on</text>
  <text x="340" y="242" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">B's reply teaches every switch which port leads to B — the next A → B frame is forwarded, not flooded</text>
</svg>
