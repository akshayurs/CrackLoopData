<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowa" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowaAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">ARP: resolving 192.168.1.20 to a MAC on the LAN</text>

  <circle cx="90" cy="130" r="28" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="126" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Host A</text>
  <text x="90" y="140" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">.1.10</text>

  <circle cx="320" cy="60" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="64" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">Host C</text>

  <circle cx="320" cy="130" r="28" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="126" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Host B</text>
  <text x="320" y="140" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">.1.20</text>

  <circle cx="320" cy="200" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="204" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">Host D</text>

  <line x1="115" y1="118" x2="298" y2="66" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowa)"/>
  <line x1="118" y1="130" x2="292" y2="130" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowa)"/>
  <line x1="115" y1="142" x2="298" y2="194" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowa)"/>
  <text x="200" y="100" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">ARP request (broadcast): "who has .1.20?"</text>

  <line x1="292" y1="145" x2="118" y2="140" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrowaAccent)"/>
  <text x="205" y="168" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">ARP reply (unicast, only from B): "I'm B, here's my MAC"</text>

  <text x="320" y="240" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Only Host B replies; A caches B's MAC and skips ARP next time</text>
</svg>
