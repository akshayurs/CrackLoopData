<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowsp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">ARP spoofing: an attacker inserts itself between two hosts</text>

  <circle cx="80" cy="150" r="28" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="154" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Victim A</text>

  <circle cx="320" cy="90" r="28" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="320" y="94" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Attacker</text>

  <circle cx="560" cy="150" r="28" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="560" y="154" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Gateway</text>

  <line x1="105" y1="135" x2="295" y2="105" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowsp)"/>
  <text x="180" y="105" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">forged reply:</text>
  <text x="180" y="118" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">"gateway is my MAC"</text>

  <line x1="345" y1="105" x2="535" y2="135" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowsp)"/>
  <text x="460" y="105" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">forged reply:</text>
  <text x="460" y="118" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">"victim A is my MAC"</text>

  <path d="M105,165 Q320,230 535,165" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrowsp)"/>
  <text x="320" y="240" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)" font-weight="600">All traffic between A and the gateway now flows through the attacker unseen</text>
</svg>
