<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">4-year vesting schedule with a 1-year cliff</text>

  <line x1="60" y1="200" x2="620" y2="200" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="170" width="140" height="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="130" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">Cliff — $0 vested</text>

  <line x1="200" y1="140" x2="200" y2="210" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="200" y="130" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">Month 12</text>
  <text x="200" y="228" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">25% vests at once</text>

  <path d="M200,170 L600,90" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" fill="none"/>
  <circle cx="200" cy="170" r="3" fill="var(--dg-accent, #0C8F88)"/>
  <circle cx="300" cy="150" r="3" fill="var(--dg-accent, #0C8F88)"/>
  <circle cx="400" cy="130" r="3" fill="var(--dg-accent, #0C8F88)"/>
  <circle cx="500" cy="110" r="3" fill="var(--dg-accent, #0C8F88)"/>
  <circle cx="600" cy="90" r="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>

  <text x="300" y="145" font-size="9" fill="var(--dg-muted, #5F6368)">Q</text>
  <text x="400" y="125" font-size="9" fill="var(--dg-muted, #5F6368)">Q</text>
  <text x="500" y="105" font-size="9" fill="var(--dg-muted, #5F6368)">Q</text>

  <text x="600" y="75" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">100% vested</text>
  <text x="600" y="228" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Month 48</text>

  <text x="340" y="260" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Leave before month 12 and none of the grant has vested, regardless of headline size.</text>
</svg>
