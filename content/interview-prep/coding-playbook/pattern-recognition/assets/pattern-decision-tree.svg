<svg viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Pattern-recognition triage order</text>

  <rect x="220" y="34" width="240" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="340" y="56" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Is the input sorted?</text>
  <line x1="340" y1="68" x2="340" y2="86" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="360" y="80" font-size="10" fill="var(--dg-muted, #5F6368)">yes</text>
  <rect x="440" y="42" width="150" height="26" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="515" y="59" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Two pointers / binary search</text>
  <line x1="440" y1="55" x2="370" y2="51" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="220" y="90" width="240" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="340" y="112" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Contiguous run (subarray/substring)?</text>
  <line x1="340" y1="124" x2="340" y2="142" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="440" y="98" width="150" height="26" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="515" y="115" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Sliding window</text>
  <line x1="440" y1="111" x2="370" y2="107" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="220" y="146" width="240" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="340" y="168" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">"Top k" or "kth" phrasing?</text>
  <line x1="340" y1="180" x2="340" y2="198" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="440" y="154" width="150" height="26" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="515" y="171" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Heap</text>
  <line x1="440" y1="167" x2="370" y2="163" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="220" y="202" width="240" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="340" y="224" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">All combinations / subsets?</text>
  <line x1="340" y1="236" x2="340" y2="254" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="440" y="210" width="150" height="26" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="515" y="227" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Backtracking</text>
  <line x1="440" y1="223" x2="370" y2="219" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="220" y="258" width="240" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="340" y="280" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Optimal choice, overlapping subproblems?</text>
  <line x1="340" y1="292" x2="340" y2="310" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="440" y="266" width="150" height="26" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="515" y="283" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Dynamic programming</text>
  <line x1="440" y1="279" x2="370" y2="275" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="220" y="314" width="240" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="340" y="336" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">None of these?</text>
  <line x1="340" y1="348" x2="340" y2="366" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="270" y="370" width="140" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="340" y="387" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Brute force</text>

  <text x="340" y="430" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Cheapest-to-verify cue first, most expensive technique last.</text>
</svg>
