<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="340" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The shape of a 45-minute round</text>

  <rect x="30" y="90" width="45" height="46" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="52" y="117" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Intro</text>
  <text x="52" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">2-3m</text>

  <rect x="75" y="90" width="65" height="46" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="107" y="112" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Clarifying</text>
  <text x="107" y="124" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">questions</text>
  <text x="107" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">3-5m</text>

  <rect x="140" y="90" width="95" height="46" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="187" y="117" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Approach discussion</text>
  <text x="187" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">5-10m</text>

  <rect x="235" y="90" width="220" height="46" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="345" y="117" text-anchor="middle" font-size="10" font-weight="600" fill="var(--dg-ink, #202124)">Coding</text>
  <text x="345" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">15-20m</text>

  <rect x="455" y="90" width="150" height="46" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="112" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Testing /</text>
  <text x="530" y="124" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">refinement</text>
  <text x="530" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">5-10m</text>

  <rect x="605" y="90" width="45" height="46" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="627" y="112" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Your</text>
  <text x="627" y="124" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Qs</text>
  <text x="627" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">2-3m</text>

  <line x1="235" y1="70" x2="235" y2="180" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="235" y="196" text-anchor="middle" font-size="10" font-weight="600" fill="var(--dg-ink, #202124)">underprepared candidates</text>
  <text x="235" y="210" text-anchor="middle" font-size="10" font-weight="600" fill="var(--dg-ink, #202124)">are often still here</text>

  <text x="340" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Spending too long reaching an approach leaves little time to code or test.</text>
</svg>
