<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">How one candidate's answers flow into one decision</text>

  <rect x="15" y="170" width="70" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="50" y="200" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">Candidate</text>

  <line x1="85" y1="150" x2="150" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="85" y1="185" x2="150" y2="170" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="85" y1="205" x2="150" y2="230" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="85" y1="220" x2="150" y2="310" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="150" y="65" width="130" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="215" y="89" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Round 1: Behavioral</text>

  <rect x="150" y="150" width="130" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="215" y="174" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Round 2: System Design</text>

  <rect x="150" y="215" width="130" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="215" y="239" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Round 3: Coding</text>

  <rect x="150" y="290" width="130" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="215" y="314" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Round 4: Behavioral</text>

  <line x1="280" y1="85" x2="360" y2="180" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="280" y1="170" x2="360" y2="195" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="280" y1="235" x2="360" y2="210" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="280" y1="310" x2="360" y2="225" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="360" y="170" width="130" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="425" y="196" text-anchor="middle" font-size="10" font-weight="600" fill="var(--dg-ink, #202124)">Feedback Tool</text>
  <text x="425" y="211" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">visible after each</text>
  <text x="425" y="223" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">submits their own</text>

  <path d="M320,90 Q345,150 360,180" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="330" y="130" font-size="9" fill="var(--dg-muted, #5F6368)">consistency</text>
  <text x="330" y="142" font-size="9" fill="var(--dg-muted, #5F6368)">cross-check</text>

  <line x1="490" y1="200" x2="560" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="560" y="160" width="120" height="80" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="620" y="188" text-anchor="middle" font-size="10" font-weight="600" fill="var(--dg-ink, #202124)">Hiring</text>
  <text x="620" y="202" text-anchor="middle" font-size="10" font-weight="600" fill="var(--dg-ink, #202124)">Committee</text>
  <text x="620" y="220" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">reads all scorecards</text>
  <text x="620" y="232" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">+ hire/no-hire</text>

  <text x="350" y="370" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each interviewer scores independently; the committee sees everything together.</text>
</svg>
