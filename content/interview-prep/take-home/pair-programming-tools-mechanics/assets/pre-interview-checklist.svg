<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Pre-interview checklist (the day before)</text>

  <rect x="30" y="50" width="580" height="230" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <circle cx="65" cy="88" r="12" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <path d="M59,88 L64,93 L72,82" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="90" y="84" font-size="13" font-weight="600" fill="var(--dg-ink, #202124)">Test the exact named tool</text>
  <text x="90" y="100" font-size="11" fill="var(--dg-muted, #5F6368)">Not a similar one — the tool named in the invite</text>

  <circle cx="65" cy="140" r="12" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <path d="M59,140 L64,145 L72,134" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="90" y="136" font-size="13" font-weight="600" fill="var(--dg-ink, #202124)">Confirm a wired or strong connection</text>
  <text x="90" y="152" font-size="11" fill="var(--dg-muted, #5F6368)">Wired over wifi if possible</text>

  <circle cx="65" cy="192" r="12" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <path d="M59,192 L64,197 L72,186" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="90" y="188" font-size="13" font-weight="600" fill="var(--dg-ink, #202124)">Set editor font size for legibility</text>
  <text x="90" y="204" font-size="11" fill="var(--dg-muted, #5F6368)">So it reads clearly over screen-share</text>

  <circle cx="65" cy="244" r="12" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <path d="M59,244 L64,249 L72,238" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="90" y="240" font-size="13" font-weight="600" fill="var(--dg-ink, #202124)">Have a backup channel ready</text>
  <text x="90" y="256" font-size="11" fill="var(--dg-muted, #5F6368)">A phone number or backup video link</text>
</svg>
