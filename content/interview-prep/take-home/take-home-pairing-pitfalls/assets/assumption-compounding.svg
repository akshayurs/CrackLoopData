<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">One assumption, two outcomes</text>

  <text x="30" y="55" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Unclarified</text>
  <rect x="30" y="65" width="130" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="86" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">"assume single-user, no auth"</text>

  <line x1="160" y1="82" x2="220" y2="82" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="220" y="60" width="120" height="44" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="280" y="86" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Data model</text>

  <line x1="340" y1="82" x2="400" y2="82" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="400" y="52" width="140" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="470" y="86" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">API design</text>

  <line x1="540" y1="82" x2="600" y2="82" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="600" y="40" width="60" height="84" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="630" y="86" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Tests</text>

  <text x="340" y="150" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">each downstream box grows — the cost compounds</text>

  <text x="30" y="200" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Clarified upfront</text>
  <rect x="30" y="210" width="130" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="95" y="231" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">question asked, answered</text>

  <line x1="160" y1="227" x2="220" y2="227" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="220" y="212" width="80" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="260" y="231" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">design</text>

  <line x1="300" y1="227" x2="360" y2="227" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="360" y="212" width="80" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="400" y="231" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">built once</text>

  <text x="340" y="280" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">stays a single small branch, no rework downstream</text>

  <text x="340" y="330" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The cost of an unclarified assumption grows with everything built on top of it.</text>
</svg>
