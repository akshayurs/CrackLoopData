<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Where a reviewer's 20 minutes goes</text>

  <rect x="30" y="90" width="100" height="50" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="80" y="119" text-anchor="middle" font-size="12" font-weight="600" fill="var(--dg-ink, #202124)">README</text>
  <text x="80" y="160" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">5 min</text>

  <rect x="130" y="90" width="60" height="50" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="160" y="112" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">Structure</text>
  <text x="160" y="127" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">scan</text>
  <text x="160" y="160" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">3 min</text>

  <rect x="190" y="90" width="100" height="50" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="240" y="112" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">Run app</text>
  <text x="240" y="127" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">and tests</text>
  <text x="240" y="160" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">5 min</text>

  <rect x="290" y="90" width="140" height="50" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="360" y="112" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">Spot-check 2-3</text>
  <text x="360" y="127" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">code paths</text>
  <text x="360" y="160" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">7 min</text>

  <line x1="290" y1="80" x2="290" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="290" y="190" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">gate: README + "does it run" happen first</text>

  <text x="340" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">If the first two gates fail, the remaining time reviews the code in a less charitable mood.</text>
</svg>
