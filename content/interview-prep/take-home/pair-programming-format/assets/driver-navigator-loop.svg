<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The driver / navigator loop</text>

  <circle cx="320" cy="210" r="120" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="4,4"/>

  <rect x="240" y="90" width="160" height="56" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="var(--dg-ink, #202124)">Driver</text>
  <text x="320" y="130" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">types and narrates</text>

  <rect x="240" y="284" width="160" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="308" text-anchor="middle" font-size="13" font-weight="600" fill="var(--dg-ink, #202124)">Navigator</text>
  <text x="320" y="324" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">questions and catches mistakes</text>

  <path d="M400,110 A130,130 0 0,1 460,210" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="165" font-size="11" fill="var(--dg-muted, #5F6368)" text-anchor="middle">after a</text>
  <text x="480" y="178" font-size="11" fill="var(--dg-muted, #5F6368)" text-anchor="middle">sub-task</text>

  <path d="M460,225 A130,130 0 0,1 400,320" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="270" font-size="11" fill="var(--dg-muted, #5F6368)" text-anchor="middle">around the</text>
  <text x="500" y="283" font-size="11" fill="var(--dg-muted, #5F6368)" text-anchor="middle">halfway mark</text>

  <path d="M240,320 A130,130 0 0,1 180,220" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="270" font-size="11" fill="var(--dg-muted, #5F6368)" text-anchor="middle">when</text>
  <text x="150" y="283" font-size="11" fill="var(--dg-muted, #5F6368)" text-anchor="middle">stuck</text>

  <path d="M180,205 A130,130 0 0,1 240,110" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="320" y="220" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">shared codebase</text>

  <text x="320" y="375" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Roles swap at each marked point, keeping both people active throughout.</text>
</svg>
