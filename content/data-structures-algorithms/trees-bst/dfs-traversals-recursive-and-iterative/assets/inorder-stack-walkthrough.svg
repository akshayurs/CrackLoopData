<svg viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="210.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">The explicit stack's contents across an inorder traversal, frame by frame</text>
<rect x="30" y="40" width="100" height="32" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="80.0" y="61.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--dg-ink, #202124)">[2]</text><text x="150" y="61" text-anchor="start" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="400">walk left from root</text><rect x="30" y="84" width="100" height="32" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="80.0" y="105.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--dg-ink, #202124)">[2,1]</text><text x="150" y="105" text-anchor="start" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="400">walk left again</text><rect x="30" y="128" width="100" height="32" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="80.0" y="149.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--dg-ink, #202124)">[2]</text><text x="150" y="149" text-anchor="start" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="400">pop 1, output 1</text><rect x="30" y="172" width="100" height="32" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="80.0" y="193.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--dg-ink, #202124)">[]</text><text x="150" y="193" text-anchor="start" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="400">pop 2, output 2</text><rect x="30" y="216" width="100" height="32" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="80.0" y="237.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--dg-ink, #202124)">[3]</text><text x="150" y="237" text-anchor="start" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="400">move right, push 3</text><rect x="30" y="260" width="220" height="32" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" rx="4"/><text x="140.0" y="281.0" text-anchor="middle" font-size="12" font-weight="600" fill="var(--dg-ink, #202124)">output: 1, 2, 3</text>
</svg>