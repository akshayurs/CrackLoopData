<svg viewBox="0 0 460 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="230.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">The window expanding, hitting a duplicate, then contracting until the duplicate is expelled</text>
<rect x="30" y="40" width="130" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="95.0" y="60.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--dg-ink, #202124)">expand: p</text><rect x="30" y="80" width="130" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="95.0" y="100.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--dg-ink, #202124)">expand: pw</text><rect x="30" y="120" width="130" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="95.0" y="140.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--dg-ink, #202124)">hit duplicate w</text><rect x="30" y="160" width="130" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="95.0" y="180.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--dg-ink, #202124)">shrink: expel first w</text><rect x="30" y="200" width="130" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="95.0" y="220.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--dg-ink, #202124)">window: wk</text><text x="220" y="220" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">left steps forward until the duplicate leaves the window</text>
</svg>