  <text x="280.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Two Sum on a sorted array: advancing whichever pointer moves the sum toward the target</text>
<rect x="30" y="40" width="70" height="36" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" rx="4"/><text x="65.0" y="63.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">2</text><rect x="110" y="40" width="70" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="145.0" y="63.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">7</text><rect x="190" y="40" width="70" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="225.0" y="63.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">11</text><rect x="270" y="40" width="70" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="305.0" y="63.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">15</text><rect x="350" y="40" width="70" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="385.0" y="63.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">18</text><rect x="430" y="40" width="70" height="36" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" rx="4"/><text x="465.0" y="63.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">24</text><text x="65" y="25" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">left</text><text x="465" y="25" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">right</text><text x="300" y="110" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">sum too small -&gt; advance left (right's old spot can't pair smaller)</text><text x="300" y="130" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">sum too big -&gt; advance right (left's old spot can't pair bigger)</text>
