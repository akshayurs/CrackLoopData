  </defs>
  <text x="200.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">The atoi state machine</text>
<circle cx="90" cy="70" r="46" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2"/><text x="90" y="75" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">skip ws</text><circle cx="280" cy="70" r="46" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2"/><text x="280" y="75" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">read sign</text><circle cx="280" cy="200" r="46" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2"/><text x="280" y="205" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">read digits</text><circle cx="90" cy="200" r="46" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/><text x="90" y="205" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">done</text><path d="M 60 40 A 20 20 0 1 1 60 100" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="30" y="68" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">space</text><line x1="136" y1="70" x2="234" y2="70" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="185" y="58" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">non-space</text><line x1="280" y1="116" x2="280" y2="154" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="300" y="138" text-anchor="start" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">+/-/digit</text><path d="M 320 175 A 20 20 0 1 1 320 225" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="360" y="202" text-anchor="start" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">digit</text><line x1="234" y1="200" x2="136" y2="200" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="185" y="188" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">non-digit</text>
