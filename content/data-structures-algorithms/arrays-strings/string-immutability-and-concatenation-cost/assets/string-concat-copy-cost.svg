<svg viewBox="0 0 560 175" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="280.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Building a string with += in a loop</text>
<rect x="30" y="70" width="40" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="3"/><text x="50.0" y="88" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">len 1</text><rect x="80" y="70" width="60" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="3"/><text x="110.0" y="88" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">len 2</text><rect x="150" y="70" width="80" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="3"/><text x="190.0" y="88" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">len 3</text><rect x="240" y="70" width="100" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="3"/><text x="290.0" y="88" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">len 4</text><rect x="350" y="70" width="120" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="3"/><text x="410.0" y="88" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">len 5</text><rect x="480" y="70" width="140" height="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" rx="3"/><text x="550.0" y="88" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">len 6</text><text x="30" y="130" text-anchor="start" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="400">each += allocates a new, longer string and copies everything before it</text><text x="30" y="155" text-anchor="start" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">total copying = 1 + 2 + 3 + ... + n = O(n²)</text>
</svg>