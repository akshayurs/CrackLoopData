  <text x="230.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">The new interval widening to absorb overlapping bars, then replacing them</text>
<rect x="60" y="40" width="40" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><rect x="120" y="40" width="60" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><rect x="190" y="40" width="70" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><rect x="270" y="40" width="70" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><rect x="360" y="40" width="60" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><rect x="170" y="80" width="110" height="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="4,3"/><text x="225.0" y="98" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="400">new interval absorbs 2 and 3</text><rect x="60" y="150" width="40" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><rect x="270" y="150" width="70" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><rect x="360" y="150" width="60" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><rect x="170" y="150" width="110" height="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/><text x="225" y="195" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">final: merged block replaces bars 2-3, others unchanged</text>
