<svg viewBox="0 0 460 175" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="230.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Both pointers stepping forward, advancing whichever row's current bar ends first</text>
<rect x="60" y="30" width="40" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><rect x="120" y="30" width="60" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><rect x="190" y="30" width="70" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><rect x="270" y="30" width="60" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><rect x="350" y="30" width="60" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="20" y="46" text-anchor="end" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">A:</text><rect x="80" y="70" width="60" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><rect x="190" y="70" width="50" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><rect x="270" y="70" width="40" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><rect x="340" y="70" width="60" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="20" y="86" text-anchor="end" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">B:</text><rect x="120" y="20" width="60" height="84" fill="var(--dg-accent-bg, #E3F3F1)" fill-opacity="0.5" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/><text x="150" y="120" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">overlap region between current bars</text><line x1="170.0" y1="110.0" x2="190.0" y2="140.0" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="190" y="155" text-anchor="start" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="400">row whose bar ends first advances</text>
</svg>