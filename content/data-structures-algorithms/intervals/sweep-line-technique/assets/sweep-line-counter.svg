  <text x="220.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">A running counter stepping up on +1 ticks and down on -1 ticks as the sweep advances</text>
<line x1="60" y1="40" x2="60" y2="55" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/><text x="60" y="32" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="400">+1</text><line x1="120" y1="40" x2="120" y2="55" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/><text x="120" y="32" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="400">+1</text><line x1="180" y1="40" x2="180" y2="55" stroke="var(--dg-muted, #5F6368)" stroke-width="2"/><text x="180" y="32" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">-1</text><line x1="240" y1="40" x2="240" y2="55" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/><text x="240" y="32" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="400">+1</text><line x1="300" y1="40" x2="300" y2="55" stroke="var(--dg-muted, #5F6368)" stroke-width="2"/><text x="300" y="32" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">-1</text><line x1="360" y1="40" x2="360" y2="55" stroke="var(--dg-muted, #5F6368)" stroke-width="2"/><text x="360" y="32" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">-1</text><line x1="40.0" y1="20.0" x2="340.0" y2="20.0" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="190" y="10" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">sweep direction</text><rect x="60" y="138" width="60" height="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><rect x="120" y="116" width="60" height="44" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/><rect x="180" y="138" width="60" height="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><rect x="240" y="116" width="60" height="44" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/><rect x="300" y="138" width="60" height="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><rect x="360" y="160" width="60" height="0" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><circle cx="150" cy="106" r="14" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/><text x="150" y="185" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">peak value</text>
