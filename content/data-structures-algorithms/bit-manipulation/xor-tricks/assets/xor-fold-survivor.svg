<svg viewBox="0 0 440 160" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="220.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Folding an array down to the lone survivor with XOR</text>
<rect x="40" y="50" width="60" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="70.0" y="73.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">4</text><text x="70.0" y="110" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">xor=4</text><rect x="110" y="50" width="60" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="140.0" y="73.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">1</text><text x="140.0" y="110" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">xor=5</text><rect x="180" y="50" width="60" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="210.0" y="73.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">2</text><text x="210.0" y="110" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">xor=7</text><rect x="250" y="50" width="60" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="280.0" y="73.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">1</text><text x="280.0" y="110" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">xor=6</text><rect x="320" y="50" width="60" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="350.0" y="73.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">2</text><text x="350.0" y="110" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">xor=4</text><path d="M 135 45 Q 215.0 10 275 45" fill="none" stroke="var(--dg-muted, #5F6368)" stroke-width="1.5" stroke-dasharray="3,3"/><text x="215.0" y="8" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">two 1s cancel</text><path d="M 205 45 Q 250 18 345 45" fill="none" stroke="var(--dg-muted, #5F6368)" stroke-width="1.5" stroke-dasharray="3,3"/><text x="271.0" y="20" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">two 2s cancel</text><rect x="35" y="45" width="60" height="46" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5" rx="4"/><text x="40" y="140" text-anchor="start" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="400">every paired value cancels itself out; only the unpaired survivor remains</text>
</svg>