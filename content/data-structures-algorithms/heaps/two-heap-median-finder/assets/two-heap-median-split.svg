<svg viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="280.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Streaming numbers splitting between a max-heap of smaller values and a min-heap of larger values</text>
<text x="120" y="20" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">max-heap (smaller half)</text><circle cx="60" cy="60" r="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="60" y="65" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">5</text><circle cx="140" cy="60" r="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="140" y="65" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">3</text><circle cx="200" cy="110" r="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="200" y="115" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">4</text><text x="420" y="20" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">min-heap (larger half)</text><circle cx="400" cy="60" r="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="400" y="65" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">8</text><circle cx="480" cy="60" r="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="480" y="65" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">9</text><circle cx="440" cy="110" r="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="440" y="115" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">10</text><line x1="280" y1="10" x2="280" y2="160" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="5,3"/><text x="280" y="180" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">boundary shifts to keep both halves the same size</text>
</svg>