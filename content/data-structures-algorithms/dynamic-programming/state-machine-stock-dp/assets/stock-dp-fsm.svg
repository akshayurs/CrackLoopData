<svg viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="280.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">The hold/sold transition diagram</text>
<circle cx="160" cy="100" r="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="160" y="105" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">hold</text><circle cx="400" cy="100" r="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="400" y="105" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">sold</text><line x1="200.0" y1="100.0" x2="360.0" y2="100.0" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="280" y="85" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">sell: +price[i]</text><line x1="360.0" y1="100.0" x2="200.0" y2="100.0" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="280" y="130" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">buy: -price[i]</text><path d="M 130 70 A 22 22 0 1 1 130 130" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="85" y="100" text-anchor="end" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">do nothing</text><path d="M 430 70 A 22 22 0 1 0 430 130" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="475" y="100" text-anchor="start" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">do nothing</text>
</svg>