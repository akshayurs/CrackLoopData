<svg viewBox="0 0 460 265" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="230.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Binary exponentiation via repeated squaring for a^13</text>
<rect x="30" y="30" width="80" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" rx="4"/><text x="70.0" y="50.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--dg-ink, #202124)">bit=1</text><text x="70" y="75" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">pos 8</text><rect x="130" y="30" width="80" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" rx="4"/><text x="170.0" y="50.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--dg-ink, #202124)">bit=1</text><text x="170" y="75" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">pos 4</text><rect x="230" y="30" width="80" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="270.0" y="50.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--dg-ink, #202124)">bit=0</text><text x="270" y="75" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">pos 2</text><rect x="330" y="30" width="80" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" rx="4"/><text x="370.0" y="50.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--dg-ink, #202124)">bit=1</text><text x="370" y="75" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">pos 1</text><rect x="30" y="100" width="80" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="70.0" y="120.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--dg-ink, #202124)">a^1</text><line x1="110.0" y1="115.0" x2="130.0" y2="115.0" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="130" y="100" width="80" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="170.0" y="120.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--dg-ink, #202124)">a^2</text><line x1="210.0" y1="115.0" x2="230.0" y2="115.0" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="230" y="100" width="80" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="270.0" y="120.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--dg-ink, #202124)">a^4</text><line x1="310.0" y1="115.0" x2="330.0" y2="115.0" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="330" y="100" width="80" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="370.0" y="120.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--dg-ink, #202124)">a^8</text><text x="230" y="155" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="400">square each step: a^1 -&gt; a^2 -&gt; a^4 -&gt; a^8</text><rect x="60" y="190" width="340" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" rx="4"/><text x="230.0" y="212.0" text-anchor="middle" font-size="12" font-weight="600" fill="var(--dg-ink, #202124)">result = a^8 * a^4 * a^1</text><text x="230" y="245" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="400">bit-1 positions (8, 4, 1) feed the result; position 2 is skipped</text>
</svg>