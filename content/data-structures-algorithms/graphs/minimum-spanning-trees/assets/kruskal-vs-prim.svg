  </defs>
  <text x="300.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Kruskal's scattered merges vs Prim's single growing blob</text>
<text x="140" y="20" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Kruskal's: scattered fragments merge</text><line x1="60" y1="60" x2="120" y2="60" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/><line x1="180" y1="120" x2="240" y2="120" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/><line x1="60" y1="160" x2="60" y2="220" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/><circle cx="60" cy="60" r="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="60" y="65" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600"></text><circle cx="120" cy="60" r="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="120" y="65" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600"></text><circle cx="180" cy="120" r="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="180" y="125" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600"></text><circle cx="240" cy="120" r="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="240" y="125" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600"></text><circle cx="60" cy="160" r="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="60" y="165" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600"></text><circle cx="60" cy="220" r="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="60" y="225" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600"></text><text x="140" y="250" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="400">cheapest edge anywhere gets picked</text><text x="420" y="20" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Prim's: one blob grows outward</text><line x1="360" y1="60" x2="420" y2="60" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/><line x1="420" y1="60" x2="420" y2="120" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/><line x1="420" y1="120" x2="480" y2="160" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/><circle cx="360" cy="60" r="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="360" y="65" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600"></text><circle cx="420" cy="60" r="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="420" y="65" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600"></text><circle cx="420" cy="120" r="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="420" y="125" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600"></text><circle cx="480" cy="160" r="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="480" y="165" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600"></text><circle cx="540" cy="200" r="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="540" y="205" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600"></text><text x="420" y="250" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="400">always exactly one connected piece</text>
</svg>