/><text x="120" y="265" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">A2</text><line x1="149.08494335614967" y1="209.1013491267381" x2="130.91505664385033" y2="240.8986508732619" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="130.35294117647058" y1="240.58823529411765" x2="189.64705882352942" y2="129.41176470588235" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/><text x="60" y="220" text-anchor="start" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">back edge</text><text x="60" y="236" text-anchor="start" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="400">creates a cycle</text><line x1="182.0" y1="190.0" x2="398.0" y2="190.0" stroke="var(--dg-muted, #5F6368)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/><text x="290" y="205" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">cross edge — no cycle</text>
