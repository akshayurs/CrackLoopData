<svg viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="300.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">In-degree layers (Kahn's) vs reversed finish times (DFS)</text>
<text x="140" y="20" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Kahn's: layers by in-degree</text><circle cx="80" cy="60" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="80" y="65" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">L0</text><circle cx="40" cy="120" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="40" y="125" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">L1</text><circle cx="120" cy="120" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="120" y="125" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">L1</text><circle cx="80" cy="180" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="80" y="185" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">L2</text><text x="140" y="220" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="400">queue drains layer by layer</text><text x="420" y="20" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">DFS-based: finish times reversed</text><circle cx="340" cy="80" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="340" y="85" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">A</text><text x="340" y="110" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)" font-weight="400">finish=5</text><circle cx="430" cy="80" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="430" y="85" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">B</text><text x="430" y="110" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)" font-weight="400">finish=4</text><circle cx="520" cy="80" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="520" y="85" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">C</text><text x="520" y="110" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)" font-weight="400">finish=3</text><circle cx="340" cy="150" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="340" y="155" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">D</text><text x="340" y="180" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)" font-weight="400">finish=2</text><circle cx="430" cy="150" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="430" y="155" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">E</text><text x="430" y="180" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)" font-weight="400">finish=1</text><circle cx="520" cy="150" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/><text x="520" y="155" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">F</text><text x="520" y="180" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)" font-weight="400">finish=0</text><text x="420" y="220" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="400">reverse finish order = topo order</text>
</svg>