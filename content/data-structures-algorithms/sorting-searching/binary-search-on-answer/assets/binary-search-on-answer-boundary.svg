<svg viewBox="0 0 580 145" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="290.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">The feasible/infeasible split across the candidate answer range</text>
<line x1="40" y1="80" x2="540" y2="80" stroke="var(--dg-line, #5F6368)" stroke-width="2"/><rect x="40" y="70" width="300" height="20" fill="var(--dg-fill, #F1F3F4)" fill-opacity="0.5"/><rect x="340" y="70" width="200" height="20" fill="var(--dg-accent-bg, #E3F3F1)"/><text x="190" y="55" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="400">infeasible: too slow, hours needed &gt; h</text><text x="440" y="55" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">feasible: hours needed ≤ h</text><line x1="340" y1="60" x2="340" y2="100" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/><text x="340" y="120" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">the answer: binary search converges exactly here</text>
</svg>