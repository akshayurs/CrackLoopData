124)">7</text><rect x="284" y="140" width="38" height="32" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="303.0" y="161.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--dg-ink, #202124)">1</text><rect x="328" y="140" width="38" height="32" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="347.0" y="161.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--dg-ink, #202124)">6</text><line x1="86.0" y1="132.0" x2="306.0" y2="132.0" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="174.0" y="124" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="400">two pointers move inward, swap where out of place</text><line x1="196" y1="135" x2="196" y2="180" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/><text x="196" y="195" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="400">crossing point j — pivot not necessarily at index j</text><text x="174.0" y="110" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Hoare: pivot = first (5)</text>
