  <text x="240.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Swapping o for the greedy choice g without breaking validity</text>
<rect x="60" y="60" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2" rx="4"/><text x="90.0" y="80" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600"></text><rect x="130" y="60" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2" rx="4"/><text x="160.0" y="80" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600"></text><rect x="200" y="60" width="60" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" rx="4"/><text x="230.0" y="80" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">o</text><rect x="270" y="60" width="70" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2" rx="4"/><text x="305.0" y="80" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600"></text><text x="20" y="75" text-anchor="end" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">O:</text><rect x="60" y="140" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2" rx="4"/><rect x="130" y="140" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2" rx="4"/><rect x="180" y="140" width="55" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" rx="4"/><text x="207.5" y="160" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">g</text><rect x="270" y="140" width="70" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2" rx="4"/><text x="20" y="155" text-anchor="end" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">O':</text><text x="230" y="195" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">same count, still valid, now agrees with greedy</text>
