<svg viewBox="0 0 540 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="270.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">The tank balance dipping negative, then resetting</text>
<line x1="40" y1="180" x2="500" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/><path d="M 60 180 L 120 140 L 180 100 L 240 200 L 300 230 L 360 150 L 420 100 L 480 70" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/><circle cx="60" cy="180" r="4" fill="var(--dg-accent, #0C8F88)"/><text x="60" y="195" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">0</text><circle cx="120" cy="140" r="4" fill="var(--dg-accent, #0C8F88)"/><text x="120" y="195" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">1</text><circle cx="180" cy="100" r="4" fill="var(--dg-accent, #0C8F88)"/><text x="180" y="195" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">2</text><circle cx="240" cy="200" r="4" fill="var(--dg-accent, #0C8F88)"/><text x="240" y="195" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">3</text><circle cx="300" cy="230" r="4" fill="var(--dg-accent, #0C8F88)"/><text x="300" y="195" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">4</text><circle cx="360" cy="150" r="4" fill="var(--dg-accent, #0C8F88)"/><text x="360" y="195" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">5</text><circle cx="420" cy="100" r="4" fill="var(--dg-accent, #0C8F88)"/><text x="420" y="195" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">6</text><circle cx="480" cy="70" r="4" fill="var(--dg-accent, #0C8F88)"/><text x="480" y="195" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">7</text><line x1="240" y1="60" x2="240" y2="220" stroke="var(--dg-muted, #5F6368)" stroke-width="1.5" stroke-dasharray="4,3"/><text x="240" y="45" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">reset here (dips below 0)</text><text x="480" y="55" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">ends above 0</text>
