<svg viewBox="0 0 500 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="250.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">The call stack growing on the way in, unwinding on the way out</text>
<rect x="200" y="220" width="130" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="265.0" y="243.0" text-anchor="middle" font-size="13" font-weight="400" fill="var(--dg-ink, #202124)">f(4)</text><rect x="200" y="175" width="130" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="265.0" y="198.0" text-anchor="middle" font-size="13" font-weight="400" fill="var(--dg-ink, #202124)">f(3)</text><rect x="200" y="130" width="130" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="265.0" y="153.0" text-anchor="middle" font-size="13" font-weight="400" fill="var(--dg-ink, #202124)">f(2)</text><rect x="200" y="85" width="130" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="265.0" y="108.0" text-anchor="middle" font-size="13" font-weight="400" fill="var(--dg-ink, #202124)">f(1)</text><text x="185" y="250" text-anchor="end" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="400">call in</text><line x1="180.0" y1="240.0" x2="180.0" y2="135.0" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="350" y="103" text-anchor="start" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">pop off, top-down, on return</text><line x1="345.0" y1="115.0" x2="345.0" y2="240.0" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>