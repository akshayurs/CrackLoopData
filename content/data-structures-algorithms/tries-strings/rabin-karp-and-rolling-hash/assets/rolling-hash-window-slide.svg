<svg viewBox="0 0 560 130" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="280.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Sliding the rolling-hash window one character to the right</text>
<rect x="30" y="40" width="52" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="56.0" y="62.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">x</text><rect x="90" y="40" width="52" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="116.0" y="62.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">a</text><rect x="150" y="40" width="52" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" rx="4"/><text x="176.0" y="62.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">b</text><rect x="210" y="40" width="52" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" rx="4"/><text x="236.0" y="62.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">c</text><rect x="270" y="40" width="52" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" rx="4"/><text x="296.0" y="62.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">d</text><rect x="330" y="40" width="52" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" rx="4"/><text x="356.0" y="62.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">y</text><rect x="390" y="40" width="52" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="416.0" y="62.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">z</text><text x="116" y="30" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">-  leaves</text><text x="356" y="30" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="600">+  enters</text><text x="280" y="110" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="400">each remaining char's weight goes up one power of B; new char enters at B^0</text>
</svg>