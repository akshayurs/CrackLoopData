<svg viewBox="0 0 560 245" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="280.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">A monotonic stack popping on a bigger arrival, then rebuilding with smaller values</text>
<rect x="30" y="30" width="66" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="63.0" y="53.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">2</text><rect x="106" y="30" width="66" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="139.0" y="53.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">1</text><rect x="182" y="30" width="66" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="215.0" y="53.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">2</text><rect x="258" y="30" width="66" height="36" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" rx="4"/><text x="291.0" y="53.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">4</text><rect x="334" y="30" width="66" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="367.0" y="53.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">3</text><rect x="410" y="30" width="66" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="443.0" y="53.0" text-anchor="middle" font-size="14" font-weight="400" fill="var(--dg-ink, #202124)">1</text><rect x="30" y="100" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="60.0" y="120.0" text-anchor="middle" font-size="10" font-weight="400" fill="var(--dg-ink, #202124)">idx0</text><rect x="100" y="100" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="130.0" y="120.0" text-anchor="middle" font-size="10" font-weight="400" fill="var(--dg-ink, #202124)">idx1</text><rect x="170" y="100" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="200.0" y="120.0" text-anchor="middle" font-size="10" font-weight="400" fill="var(--dg-ink, #202124)">idx2</text><text x="120" y="145" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">stack after idx0-2: decreasing values</text><line x1="291.0" y1="68.0" x2="260.0" y2="130.0" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="320" y="105" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="600">4 arrives: pops idx0,1,2, each gets '4' as next-greater</text><rect x="30" y="180" width="60" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" rx="4"/><text x="60.0" y="200.0" text-anchor="middle" font-size="10" font-weight="400" fill="var(--dg-ink, #202124)">idx3(4)</text><rect x="100" y="180" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="130.0" y="200.0" text-anchor="middle" font-size="10" font-weight="400" fill="var(--dg-ink, #202124)">idx4(3)</text><rect x="170" y="180" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="200.0" y="200.0" text-anchor="middle" font-size="10" font-weight="400" fill="var(--dg-ink, #202124)">idx5(1)</text><text x="200" y="225" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">stack rebuilds as smaller trailing values push in</text>
</svg>