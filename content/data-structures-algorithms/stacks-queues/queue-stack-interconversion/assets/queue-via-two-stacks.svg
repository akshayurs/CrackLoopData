<svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="300.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Elements flowing from the in-stack to the out-stack to implement a queue</text>
<rect x="20" y="150" width="60" height="32" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="50.0" y="171.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--dg-ink, #202124)">1</text><rect x="20" y="114" width="60" height="32" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="50.0" y="135.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--dg-ink, #202124)">2</text><rect x="20" y="78" width="60" height="32" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="50.0" y="99.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--dg-ink, #202124)">3</text><text x="50" y="190" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">in</text><text x="140" y="190" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">out</text><text x="95" y="20" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">step 1: push 1,2,3 onto in</text><text x="270" y="190" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">in</text><rect x="330" y="150" width="60" height="32" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" rx="4"/><text x="360.0" y="171.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--dg-ink, #202124)">1</text><rect x="330" y="114" width="60" height="32" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" rx="4"/><text x="360.0" y="135.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--dg-ink, #202124)">2</text><rect x="330" y="78" width="60" height="32" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" rx="4"/><text x="360.0" y="99.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--dg-ink, #202124)">3</text><text x="360" y="190" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">out</text><text x="315" y="20" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">step 2: dequeue transfers all -&gt; out</text><rect x="460" y="150" width="60" height="32" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="490.0" y="171.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--dg-ink, #202124)">4</text><text x="490" y="190" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">in</text><rect x="550" y="150" width="60" height="32" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" rx="4"/><text x="580.0" y="171.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--dg-ink, #202124)">2</text><rect x="550" y="114" width="60" height="32" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" rx="4"/><text x="580.0" y="135.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--dg-ink, #202124)">3</text><text x="580" y="190" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">out</text><text x="535" y="20" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">step 3: pop 1 from out; push 4 to in</text>
</svg>