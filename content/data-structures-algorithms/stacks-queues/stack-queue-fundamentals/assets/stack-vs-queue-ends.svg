ke-width="1.5" rx="4"/><text x="405.0" y="121.0" text-anchor="middle" font-size="13" font-weight="400" fill="var(--dg-ink, #202124)">2</text><rect x="440" y="100" width="50" height="32" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="465.0" y="121.0" text-anchor="middle" font-size="13" font-weight="400" fill="var(--dg-ink, #202124)">3</text><rect x="500" y="100" width="50" height="32" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="525.0" y="121.0" text-anchor="middle" font-size="13" font-weight="400" fill="var(--dg-ink, #202124)">4</text><line x1="590.0" y1="60.0" x2="560.0" y2="100.0" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="560" y="55" text-anchor="end" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">enqueue (right)</text><line x1="320.0" y1="140.0" x2="280.0" y2="180.0" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="280" y="195" text-anchor="end" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="400">dequeue (left)</text><text x="470" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">queue: opposite ends</text>
