="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="240.0" y="121.0" text-anchor="middle" font-size="10" font-weight="400" fill="var(--dg-ink, #202124)">idx2(8)</text><rect x="290" y="100" width="80" height="32" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="330.0" y="121.0" text-anchor="middle" font-size="10" font-weight="400" fill="var(--dg-ink, #202124)">idx3(6)</text><text x="120" y="90" text-anchor="start" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="400">arrival of 9 pops 8, 6 off the back (value eviction)</text><rect x="400" y="100" width="80" height="32" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="440.0" y="121.0" text-anchor="middle" font-size="10" font-weight="400" fill="var(--dg-ink, #202124)">idx6(1)</text><line x1="60.0" y1="160.0" x2="60.0" y2="100.0" stroke="var(--dg-muted, #5F6368)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/><text x="60" y="175" text-anchor="start" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="400">front evicted once window passes it (position eviction)</text>
</svg>