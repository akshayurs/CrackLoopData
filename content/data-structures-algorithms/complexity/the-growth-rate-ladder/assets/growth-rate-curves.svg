  <text x="350.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">All seven growth-rate curves on one chart</text>
<line x1="50" y1="220" x2="560" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="50" y1="220" x2="50" y2="30" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="560" y="238" text-anchor="end" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="400">n</text><text x="35" y="35" text-anchor="end" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="400">ops</text><path d="M 50 210 L 550 210" fill="none" stroke="var(--dg-muted, #5F6368)" stroke-width="2"/><text x="570" y="40" text-anchor="start" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="600">O(1)</text><path d="M 50 210 Q 300 190 550 165" fill="none" stroke="var(--dg-muted, #5F6368)" stroke-width="2"/><text x="570" y="62" text-anchor="start" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="600">O(log n)</text><path d="M 50 210 L 550 60" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2"/><text x="570" y="84" text-anchor="start" font-size="10" fill="var(--dg-stroke, #9AA0A6)" font-weight="600">O(n)</text><path d="M 50 210 Q 300 120 550 35" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/><text x="570" y="106" text-anchor="start" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="600">O(n log n)</text><path d="M 50 210 Q 250 200 550 20" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2"/><text x="570" y="128" text-anchor="start" font-size="10" fill="var(--dg-stroke, #9AA0A6)" font-weight="600">O(n²)</text><path d="M 50 210 Q 150 205 220 20" fill="none" stroke="var(--dg-muted, #5F6368)" stroke-width="2"/><text x="570" y="150" text-anchor="start" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="600">O(2ⁿ)</text><path d="M 50 210 Q 120 205 165 15" fill="none" stroke="var(--dg-muted, #5F6368)" stroke-width="2"/><text x="570" y="172" text-anchor="start" font-size="10" fill="var(--dg-muted, #5F6368)" font-weight="600">O(n!)</text>
