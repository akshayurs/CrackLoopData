<svg viewBox="0 0 600 155" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="300.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">The space-time trade-off spectrum</text>
<line x1="40" y1="80" x2="560" y2="80" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow)"/><text x="60" y="55" text-anchor="start" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">recompute every time</text><text x="60" y="105" text-anchor="start" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="400">0 memory, most repeated work</text><text x="300" y="55" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">memoize on demand</text><text x="300" y="105" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="400">memory grows with queries</text><text x="540" y="55" text-anchor="end" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">precompute up front</text><text x="540" y="105" text-anchor="end" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="400">max memory, 0 repeated work</text><circle cx="90" cy="80" r="6" fill="var(--dg-accent, #0C8F88)"/><text x="90" y="135" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="400">trial division</text><circle cx="300" cy="80" r="6" fill="var(--dg-accent, #0C8F88)"/><text x="300" y="135" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="400">memoized fib</text><circle cx="500" cy="80" r="6" fill="var(--dg-accent, #0C8F88)"/><text x="500" y="135" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="400">prime sieve</text>
</svg>