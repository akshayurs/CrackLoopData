<svg viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="280.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Stack frames piling up, then unwinding</text>
<rect x="200" y="260" width="130" height="32" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="265.0" y="281.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--dg-ink, #202124)">sum(n)</text><rect x="200" y="222" width="130" height="32" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="265.0" y="243.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--dg-ink, #202124)">sum(n-1)</text><rect x="200" y="184" width="130" height="32" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="265.0" y="205.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--dg-ink, #202124)">sum(n-2)</text><rect x="200" y="146" width="130" height="32" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="265.0" y="167.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--dg-ink, #202124)">...</text><rect x="200" y="108" width="130" height="32" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="265.0" y="129.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--dg-ink, #202124)">sum(1)</text><rect x="200" y="70" width="130" height="32" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="265.0" y="91.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--dg-ink, #202124)">sum(0)</text><text x="185" y="290" text-anchor="end" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="400">call in</text><line x1="180" y1="280" x2="180" y2="72" stroke="var(--dg-muted, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="350" y="87" text-anchor="start" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">n+1 frames alive</text><line x1="345" y1="82" x2="345" y2="280" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/><text x="265.0" y="315" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="400">unwind: frames pop off top-down</text>
</svg>