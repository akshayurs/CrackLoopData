5.0" text-anchor="middle" font-size="9" font-weight="400" fill="var(--dg-ink, #202124)">count 4</text><line x1="400.0" y1="60.0" x2="440.0" y2="20.0" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="400" y="200" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">scan buckets high to low, collect into top-K</text>
