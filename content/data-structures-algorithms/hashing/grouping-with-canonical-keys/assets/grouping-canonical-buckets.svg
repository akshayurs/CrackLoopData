<svg viewBox="0 0 460 170" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="230.0" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Words flowing into buckets keyed by their canonical signature</text>
<rect x="20" y="30" width="60" height="28" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="50.0" y="49.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--dg-ink, #202124)">eat</text><rect x="90" y="30" width="60" height="28" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="120.0" y="49.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--dg-ink, #202124)">tan</text><rect x="160" y="30" width="60" height="28" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="190.0" y="49.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--dg-ink, #202124)">tea</text><rect x="230" y="30" width="60" height="28" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="260.0" y="49.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--dg-ink, #202124)">ate</text><rect x="300" y="30" width="60" height="28" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="330.0" y="49.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--dg-ink, #202124)">nat</text><rect x="60" y="100" width="140" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="130.0" y="120.0" text-anchor="middle" font-size="10" font-weight="400" fill="var(--dg-ink, #202124)">aet: [eat, tea, ate]</text><rect x="260" y="100" width="140" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" rx="4"/><text x="330.0" y="120.0" text-anchor="middle" font-size="10" font-weight="400" fill="var(--dg-ink, #202124)">ant: [tan, nat]</text><text x="230" y="150" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="400">each word's sorted letters become its bucket key</text>
</svg>