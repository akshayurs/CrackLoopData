<svg viewBox="0 0 480 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="240" y="22" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Resource type R — 10 total instances</text>

  <g font-size="9" fill="var(--dg-ink, #202124)" text-anchor="middle">
    <text x="90" y="50" font-weight="600">Allocation</text>
    <text x="240" y="50" font-weight="600">Max</text>
    <text x="380" y="50" font-weight="600">Need</text>
  </g>

  <g font-size="9" fill="var(--dg-ink, #202124)">
    <rect x="40" y="60" width="100" height="90" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="60" y="80">P1 = 3</text>
    <text x="60" y="105">P2 = 2</text>
    <text x="60" y="130">P3 = 2</text>

    <rect x="190" y="60" width="100" height="90" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="210" y="80">P1 = 7</text>
    <text x="210" y="105">P2 = 4</text>
    <text x="210" y="130">P3 = 3</text>

    <rect x="330" y="60" width="100" height="90" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="350" y="80">P1 = 4</text>
    <text x="350" y="105">P2 = 2</text>
    <text x="350" y="130">P3 = 1</text>
  </g>
  <text x="240" y="145" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">Need = Max − Allocation</text>

  <text x="240" y="185" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Available = 10 − (3+2+2) = 3</text>
  <text x="240" y="210" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">this exact table is traced through the safety algorithm next</text>
</svg>
