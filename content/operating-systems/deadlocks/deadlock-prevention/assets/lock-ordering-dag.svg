<svg viewBox="0 0 460 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="230" y="22" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Global lock ordering — always a DAG</text>

  <circle cx="60" cy="110" r="22" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="60" y="115" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">A</text>

  <circle cx="180" cy="110" r="22" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="180" y="115" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">B</text>

  <circle cx="300" cy="110" r="22" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="300" y="115" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">C</text>

  <circle cx="420" cy="110" r="22" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="420" y="115" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">D</text>

  <line x1="82" y1="110" x2="158" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="202" y1="110" x2="278" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="322" y1="110" x2="398" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <path d="M60,88 Q180,40 300,88" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <path d="M420,140 Q240,190 60,140" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="240" y="200" text-anchor="middle" font-size="8" fill="var(--dg-accent, #0C8F88)">D -&gt; A forbidden — would close a cycle</text>
</svg>
