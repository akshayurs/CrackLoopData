<svg viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="180" y="22" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Resource allocation graph — deadlock cycle</text>

  <circle cx="90" cy="90" r="24" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="90" y="95" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">P1</text>

  <circle cx="270" cy="90" r="24" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="270" y="95" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">P2</text>

  <rect x="78" y="200" width="36" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="96" y="222" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">R1</text>

  <rect x="252" y="200" width="36" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="270" y="222" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">R2</text>

  <line x1="96" y1="200" x2="90" y2="114" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="60" y="160" font-size="8" fill="var(--dg-accent, #0C8F88)">assigned</text>

  <line x1="112" y1="95" x2="248" y2="95" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="180" y="85" text-anchor="middle" font-size="8" fill="var(--dg-accent, #0C8F88)">requests</text>

  <line x1="270" y1="200" x2="270" y2="114" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="160" font-size="8" fill="var(--dg-accent, #0C8F88)">assigned</text>

  <line x1="248" y1="95" x2="118" y2="95" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)" transform="translate(0,15)"/>
  <text x="180" y="120" text-anchor="middle" font-size="8" fill="var(--dg-accent, #0C8F88)">requests</text>

  <text x="180" y="270" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">P1 -&gt; R2 -&gt; P2 -&gt; R1 -&gt; P1: a closed loop, no exit</text>
</svg>
