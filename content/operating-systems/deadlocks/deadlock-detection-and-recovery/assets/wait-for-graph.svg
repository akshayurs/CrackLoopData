<svg viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="210" y="22" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Wait-for graph</text>

  <circle cx="150" cy="80" r="22" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="150" y="85" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">P1</text>

  <circle cx="270" cy="80" r="22" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="270" y="85" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">P2</text>

  <circle cx="210" cy="180" r="22" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="210" y="185" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">P3</text>

  <circle cx="350" cy="180" r="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="350" y="185" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">P4</text>

  <path d="M170,90 Q210,60 250,90" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <path d="M260,100 Q245,140 225,158" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <path d="M195,165 Q160,120 140,102" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>

  <line x1="332" y1="170" x2="288" y2="95" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="210" y="240" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">P1 -&gt; P2 -&gt; P3 -&gt; P1 forms a cycle: deadlock</text>
  <text x="210" y="258" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">P4 -&gt; P2 is delayed, not part of any cycle</text>
</svg>
