<svg viewBox="0 0 560 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="140" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Spinlock</text>
  <text x="420" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Blocking mutex</text>

  <line x1="40" y1="150" x2="260" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="40" y1="150" x2="40" y2="50" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="30" y="55" text-anchor="end" font-size="8" fill="var(--dg-muted, #5F6368)">100%</text>
  <text x="30" y="150" text-anchor="end" font-size="8" fill="var(--dg-muted, #5F6368)">0%</text>
  <line x1="40" y1="55" x2="260" y2="55" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="150" y="45" text-anchor="middle" font-size="8" fill="var(--dg-accent, #0C8F88)">pegged, repeated checks</text>

  <line x1="320" y1="150" x2="540" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="320" y1="150" x2="320" y2="50" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="310" y="55" text-anchor="end" font-size="8" fill="var(--dg-muted, #5F6368)">100%</text>
  <text x="310" y="150" text-anchor="end" font-size="8" fill="var(--dg-muted, #5F6368)">0%</text>
  <polyline points="320,60 380,60 380,145 500,145 500,70 540,70" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="2"/>
  <text x="430" y="138" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">asleep on queue</text>
  <text x="505" y="60" text-anchor="middle" font-size="7" fill="var(--dg-ink, #202124)">context switch</text>

  <text x="280" y="200" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">CPU cycles now vs. two context switches later</text>
  <text x="280" y="218" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">spinning never drops even doing zero useful work</text>
</svg>
