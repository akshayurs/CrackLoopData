<svg viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="180" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Dining philosophers — deadlock</text>

  <circle cx="180" cy="190" r="90" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <g font-size="9" fill="var(--dg-ink, #202124)" text-anchor="middle">
    <circle cx="180" cy="80" r="16" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="180" y="84">P1</text>
    <circle cx="270" cy="130" r="16" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="270" y="134">P2</text>
    <circle cx="240" cy="260" r="16" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="240" y="264">P3</text>
    <circle cx="120" cy="260" r="16" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="120" y="264">P4</text>
    <circle cx="90" cy="130" r="16" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="90" y="134">P5</text>
  </g>

  <g font-size="12" fill="var(--dg-muted, #5F6368)" text-anchor="middle">
    <text x="225" y="100">🍴</text>
    <text x="255" y="195">🍴</text>
    <text x="180" y="270">🍴</text>
    <text x="105" y="195">🍴</text>
    <text x="135" y="100">🍴</text>
  </g>

  <text x="180" y="190" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">each holds only</text>
  <text x="180" y="205" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">left fork — stuck</text>

  <text x="180" y="330" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">5 forks, 5 philosophers — no spare to break the cycle</text>
</svg>
