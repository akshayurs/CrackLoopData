<svg viewBox="0 0 500 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="250" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Livelock: both moving, neither passing</text>

  <rect x="60" y="60" width="380" height="100" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="52" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">narrow hallway</text>

  <circle cx="180" cy="90" r="12" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="180" y="94" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">A</text>
  <circle cx="320" cy="90" r="12" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="320" y="94" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">B</text>

  <path d="M180,105 q0,20 -10,20" stroke="var(--dg-line, #5F6368)" fill="none" marker-end="url(#arrow)"/>
  <path d="M320,105 q0,20 10,20" stroke="var(--dg-line, #5F6368)" fill="none" marker-end="url(#arrow)"/>
  <text x="200" y="140" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">step left</text>

  <path d="M180,150 q0,-15 15,-15" stroke="var(--dg-line, #5F6368)" fill="none" marker-end="url(#arrow)"/>
  <path d="M320,150 q0,-15 -15,-15" stroke="var(--dg-line, #5F6368)" fill="none" marker-end="url(#arrow)"/>
  <text x="270" y="152" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">step right, repeat</text>

  <text x="90" y="30" font-size="16" fill="var(--dg-muted, #5F6368)">⟲</text>
  <text x="90" y="45" font-size="8" fill="var(--dg-muted, #5F6368)">loops forever</text>

  <text x="250" y="205" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Both are always in motion — nothing looks stuck</text>
  <text x="250" y="223" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">CPU graphs look busy while zero real work gets done</text>
</svg>
