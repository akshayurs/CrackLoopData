<svg viewBox="0 0 500 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="250" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Condition variable wait/wake cycle</text>

  <rect x="30" y="110" width="130" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="95" y="130" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">Running</text>
  <text x="95" y="144" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">holds mutex</text>

  <rect x="195" y="110" width="150" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="270" y="130" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">Waiting</text>
  <text x="270" y="144" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">mutex released</text>

  <rect x="380" y="110" width="100" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="430" y="130" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">Ready</text>
  <text x="430" y="144" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">re-acquiring</text>

  <line x1="160" y1="135" x2="190" y2="135" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="175" y="120" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">wait()</text>

  <line x1="345" y1="135" x2="375" y2="135" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="360" y="120" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">signal()</text>

  <path d="M430,160 Q430,220 95,220 L95,165" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="260" y="235" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">mutex re-acquired, recheck condition</text>

  <path d="M430,110 Q430,80 300,80 L200,80 Q170,80 170,105" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="300" y="72" text-anchor="middle" font-size="7" fill="var(--dg-accent, #0C8F88)">recheck fails — loop back to wait</text>

  <text x="250" y="255" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Waking up is a hint to recheck, not a guarantee</text>
</svg>
