<svg viewBox="0 0 420 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="210" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Lock-free stack push</text>

  <rect x="100" y="40" width="220" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="210" y="61" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Read current top pointer</text>

  <line x1="210" y1="74" x2="210" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="80" y="100" width="260" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="210" y="121" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Set new node's next -&gt; old top</text>

  <line x1="210" y1="134" x2="210" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="90" y="160" width="240" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="210" y="181" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">CAS(top, old_top, new_node)</text>

  <line x1="210" y1="194" x2="210" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <polygon points="210,220 270,255 210,290 150,255" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="210" y="259" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Succeeded?</text>

  <line x1="270" y1="255" x2="330" y2="255" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="300" y="248" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">Yes</text>
  <rect x="330" y="238" width="70" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="365" y="259" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Done</text>

  <path d="M150,255 Q40,255 40,57 L96,57" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="40" y="150" font-size="8" fill="var(--dg-accent, #0C8F88)" text-anchor="middle" transform="rotate(-90 40 150)">No — retry</text>

  <text x="210" y="330" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Retry on conflict instead of blocking</text>
  <text x="210" y="348" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">another thread changed top — redo with fresh data</text>
</svg>
