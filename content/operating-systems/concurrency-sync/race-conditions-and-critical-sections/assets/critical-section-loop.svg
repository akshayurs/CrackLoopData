<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Entry / critical / exit / remainder</text>

  <rect x="30" y="60" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="80" y="81" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Entry section</text>

  <rect x="160" y="60" width="100" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="210" y="81" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Critical section</text>

  <rect x="290" y="60" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="340" y="81" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Exit section</text>

  <rect x="420" y="60" width="110" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="475" y="81" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Remainder</text>

  <line x1="130" y1="77" x2="155" y2="77" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="260" y1="77" x2="285" y2="77" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="390" y1="77" x2="415" y2="77" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <path d="M475,94 Q475,130 80,130 L80,94" fill="none" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="280" y="150" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Thread 2 (same loop)</text>
  <rect x="30" y="165" width="100" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="80" y="184" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Entry section</text>

  <rect x="160" y="165" width="100" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,3"/>
  <text x="210" y="184" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">blocked (locked)</text>

  <line x1="130" y1="180" x2="155" y2="180" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="280" y="250" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">At most one thread inside Critical section at a time</text>
  <text x="280" y="268" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">everything else proceeds freely</text>
</svg>
