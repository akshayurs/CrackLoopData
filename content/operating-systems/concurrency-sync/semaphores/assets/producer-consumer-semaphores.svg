<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">empty / full semaphore counts (buffer size 5)</text>

  <line x1="60" y1="220" x2="520" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="60" y1="220" x2="60" y2="50" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="45" y="55" text-anchor="end" font-size="8" fill="var(--dg-muted, #5F6368)">5</text>
  <text x="45" y="220" text-anchor="end" font-size="8" fill="var(--dg-muted, #5F6368)">0</text>
  <text x="290" y="240" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">time</text>

  <polyline points="60,50 130,50 130,90 200,90 200,130 270,130 270,170 340,170 340,210 410,210 410,220 480,220" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="480" y="212" font-size="8" fill="var(--dg-accent, #0C8F88)">empty</text>

  <polyline points="60,220 130,220 130,180 200,180 200,140 270,140 270,100 340,100 340,60 410,60 410,50 480,50" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="480" y="45" font-size="8" fill="var(--dg-ink, #202124)">full</text>

  <circle cx="410" cy="220" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <text x="410" y="238" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">producer blocks here</text>

  <text x="280" y="270" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">empty + full always sums to buffer size</text>
</svg>
