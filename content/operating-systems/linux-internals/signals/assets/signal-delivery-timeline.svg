<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Signal delivery, step by step</text>

  <g font-size="11" fill="var(--dg-ink, #202124)">
    <rect x="20" y="40" width="640" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="340" y="60" text-anchor="middle">1. Sender or kernel raises the signal</text>
    <line x1="340" y1="70" x2="340" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

    <rect x="20" y="80" width="640" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="340" y="100" text-anchor="middle">2. Kernel marks signal pending in target's task_struct</text>
    <line x1="340" y1="110" x2="340" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

    <rect x="20" y="120" width="640" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="340" y="140" text-anchor="middle">3. Target interrupted at next chance (post-syscall / timer tick)</text>
    <line x1="340" y1="150" x2="340" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

    <rect x="20" y="160" width="640" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="340" y="180" text-anchor="middle">4. Kernel saves current register state</text>
    <line x1="340" y1="190" x2="340" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

    <rect x="20" y="200" width="640" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="340" y="220" text-anchor="middle">5. Handler runs on the process's own stack, in user mode</text>
    <line x1="340" y1="230" x2="340" y2="240" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

    <rect x="20" y="240" width="640" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="340" y="260" text-anchor="middle">6. Control returns to the interruption point, state restored</text>
  </g>
  <text x="340" y="292" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Pending is not instant — delivery waits for the process's next scheduling chance.</text>
</svg>
