<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Session, groups, and Ctrl+C</text>

  <rect x="220" y="40" width="200" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="58" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">session</text>
  <text x="320" y="74" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">controlling terminal /dev/pts/3</text>

  <line x1="270" y1="82" x2="180" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="370" y1="82" x2="460" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="60" y="120" width="240" height="80" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="180" y="140" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">foreground process group</text>
  <text x="180" y="164" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">grep -&gt; sort -&gt; uniq</text>
  <text x="180" y="182" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">running pipeline</text>

  <rect x="360" y="120" width="220" height="80" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="470" y="140" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">background process group</text>
  <text x="470" y="164" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">1 process (job &amp;)</text>
  <text x="470" y="182" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">detached</text>

  <line x1="320" y1="82" x2="180" y2="230" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="200" y="250" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">Ctrl+C</text>
  <text x="320" y="272" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">reaches only the foreground group, never the background one</text>
</svg>
