<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="340" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Load average 8 — two different stories</text>

  <text x="170" y="46" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">CPU-bound</text>
  <g>
    <rect x="40" y="60" width="60" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="70" y="84" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">core 1</text>
    <rect x="110" y="60" width="60" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="140" y="84" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">core 2</text>
    <rect x="180" y="60" width="60" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="210" y="84" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">core 3</text>
    <rect x="250" y="60" width="60" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="280" y="84" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">core 4</text>
  </g>
  <text x="170" y="114" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">4 processes running, all 4 cores busy</text>
  <rect x="90" y="126" width="160" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="170" y="146" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">4 more queued, waiting for CPU</text>
  <text x="170" y="176" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">load average 8</text>

  <line x1="340" y1="40" x2="340" y2="270" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3,3"/>

  <text x="510" y="46" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">I/O-bound</text>
  <g>
    <rect x="380" y="60" width="60" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="410" y="84" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">core 1</text>
    <rect x="450" y="60" width="60" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="480" y="84" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">idle</text>
    <rect x="520" y="60" width="60" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="550" y="84" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">idle</text>
    <rect x="590" y="60" width="60" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="620" y="84" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">core 4</text>
  </g>
  <text x="510" y="114" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">only 2 processes actually running</text>
  <rect x="430" y="126" width="160" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="510" y="146" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">6 blocked on disk I/O (clock icon)</text>
  <text x="510" y="176" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">load average 8</text>

  <text x="340" y="220" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Identical numbers, opposite causes — load average counts both runnable</text>
  <text x="340" y="236" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">and uninterruptible-sleep processes together.</text>
</svg>
