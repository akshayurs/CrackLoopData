<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">/proc as the only interface</text>

  <rect x="30" y="80" width="140" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="105" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">kernel</text>
  <text x="100" y="122" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">live process/system state</text>

  <line x1="170" y1="110" x2="230" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="230" y="80" width="180" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="105" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">/proc</text>
  <text x="320" y="122" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">pseudo-filesystem</text>

  <line x1="410" y1="95" x2="470" y2="60" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="410" y1="105" x2="470" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="410" y1="115" x2="470" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="410" y1="125" x2="470" y2="180" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="480" y="55" font-size="10" fill="var(--dg-ink, #202124)">ps reads status, stat, cmdline</text>
  <text x="480" y="95" font-size="10" fill="var(--dg-ink, #202124)">top reads status, stat, cmdline</text>
  <text x="480" y="135" font-size="10" fill="var(--dg-ink, #202124)">htop reads the same files</text>
  <text x="480" y="175" font-size="10" fill="var(--dg-ink, #202124)">free reads meminfo</text>

  <text x="320" y="220" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">No tool has special kernel access beyond normal file permissions.</text>
</svg>
