<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">exec() of a setuid-root binary</text>

  <rect x="30" y="50" width="220" height="90" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="140" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">before</text>
  <text x="140" y="94" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">ruid = 1000</text>
  <text x="140" y="112" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">euid = 1000</text>
  <text x="140" y="130" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">about to exec setuid-root file</text>

  <line x1="250" y1="95" x2="380" y2="95" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="315" y="82" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">kernel sees</text>
  <text x="315" y="112" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">setuid bit set</text>

  <rect x="380" y="50" width="230" height="90" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="495" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">after</text>
  <text x="495" y="94" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">ruid = 1000 (unchanged)</text>
  <text x="495" y="112" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">euid = 0 (root)</text>
  <text x="495" y="130" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">euid set to file owner's uid</text>

  <text x="320" y="180" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">ruid still identifies the original calling user, for accounting.</text>
</svg>
