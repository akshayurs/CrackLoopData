<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="340" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">What each tool watches</text>

  <rect x="40" y="40" width="600" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="60" font-size="11" fill="var(--dg-ink, #202124)">Application logic calling library functions</text>
  <text x="620" y="80" text-anchor="end" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">ltrace watches here</text>

  <rect x="40" y="100" width="600" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="120" font-size="11" fill="var(--dg-ink, #202124)">Library code calling into the kernel via syscalls</text>
  <text x="620" y="140" text-anchor="end" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">strace watches here</text>

  <rect x="40" y="160" width="600" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="60" y="180" font-size="11" fill="var(--dg-ink, #202124)">Kernel-tracked resources a process currently holds open</text>
  <text x="620" y="204" text-anchor="end" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">lsof: point-in-time snapshot</text>
  <text x="620" y="216" text-anchor="end" font-size="10" fill="var(--dg-muted, #5F6368)">not a live trace of activity</text>
</svg>
