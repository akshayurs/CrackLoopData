<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Same task, two PID views</text>

  <rect x="30" y="50" width="270" height="170" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="165" y="74" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Host PID namespace</text>
  <rect x="60" y="150" width="90" height="30" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="105" y="170" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">other PIDs</text>
  <rect x="170" y="120" width="100" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="220" y="141" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">PID 4821</text>

  <rect x="340" y="50" width="270" height="170" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="475" y="74" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Container's PID namespace</text>
  <rect x="425" y="120" width="100" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="475" y="141" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">PID 1</text>
  <text x="475" y="185" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">no visibility into host PIDs</text>

  <line x1="270" y1="137" x2="425" y2="137" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="320" y="248" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">same underlying task_struct, two different numbering views</text>
</svg>
