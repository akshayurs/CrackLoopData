<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">docker run setup steps</text>

  <rect x="270" y="34" width="140" height="34" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="340" y="56" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">docker run</text>

  <line x1="340" y1="68" x2="120" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="340" y1="68" x2="340" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="340" y1="68" x2="560" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="30" y="100" width="180" height="66" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="120" y="120" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">1. Namespaces</text>
  <text x="120" y="136" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">PID, net, mount, UTS,</text>
  <text x="120" y="148" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">IPC, user via clone()</text>

  <rect x="250" y="100" width="180" height="66" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="340" y="120" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">2. Cgroup limits</text>
  <text x="340" y="136" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">CPU / memory / IO</text>
  <text x="340" y="148" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">caps set on the group</text>

  <rect x="470" y="100" width="180" height="66" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="560" y="120" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">3. Root filesystem</text>
  <text x="560" y="136" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">overlayfs image layers,</text>
  <text x="560" y="148" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">pivot_root into it</text>

  <line x1="120" y1="166" x2="330" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="340" y1="166" x2="340" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="560" y1="166" x2="350" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="150" y="220" width="380" height="56" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="340" y="244" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">container entrypoint process</text>
  <text x="340" y="262" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">running inside all three constraints at once</text>
</svg>
