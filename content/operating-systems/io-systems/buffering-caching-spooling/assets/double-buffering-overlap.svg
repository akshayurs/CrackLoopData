<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Double buffering — overlapping fill/drain</text>

  <text x="40" y="55" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Buffer A</text>
  <rect x="120" y="42" width="120" height="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="180" y="59" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">filling</text>
  <rect x="240" y="42" width="120" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="300" y="59" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">draining</text>
  <rect x="360" y="42" width="120" height="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="420" y="59" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">filling</text>
  <rect x="480" y="42" width="120" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="540" y="59" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">draining</text>

  <text x="40" y="105" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Buffer B</text>
  <rect x="120" y="92" width="120" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="180" y="109" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">draining</text>
  <rect x="240" y="92" width="120" height="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="300" y="109" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">filling</text>
  <rect x="360" y="92" width="120" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="420" y="109" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">draining</text>
  <rect x="480" y="92" width="120" height="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="540" y="109" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">filling</text>

  <path d="M 120 140 L 120 152 L 600 152 L 600 140" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="360" y="172" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">continuous throughput</text>
  <text x="360" y="190" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">producer and consumer never wait on each other</text>
</svg>
