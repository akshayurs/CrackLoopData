<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">SSD garbage collection</text>

  <text x="120" y="48" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">before</text>
  <g transform="translate(40,58)">
    <rect x="0" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="20" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="40" y="0" width="18" height="18" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <line x1="40" y1="0" x2="58" y2="18" stroke="var(--dg-accent, #0C8F88)"/>
    <line x1="58" y1="0" x2="40" y2="18" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="60" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="80" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="100" y="0" width="18" height="18" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <line x1="100" y1="0" x2="118" y2="18" stroke="var(--dg-accent, #0C8F88)"/>
    <line x1="118" y1="0" x2="100" y2="18" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="120" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="140" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  </g>
  <text x="120" y="98" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">6 valid, 2 stale/invalid</text>

  <line x1="220" y1="68" x2="290" y2="68" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="255" y="55" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">garbage</text>
  <text x="255" y="90" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">collection</text>

  <text x="380" y="48" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">valid pages copied out</text>
  <g transform="translate(300,58)">
    <rect x="0" y="0" width="18" height="18" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="20" y="0" width="18" height="18" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="40" y="0" width="18" height="18" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="60" y="0" width="18" height="18" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="80" y="0" width="18" height="18" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="100" y="0" width="18" height="18" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  </g>
  <text x="380" y="98" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">new empty block</text>

  <line x1="120" y1="120" x2="120" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="120" y="170" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">original block erased</text>
  <g transform="translate(40,180)">
    <rect x="0" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="20" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="40" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="60" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="80" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="100" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="120" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="140" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  </g>
  <text x="120" y="220" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">returned to free pool</text>
</svg>
