<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Same operation, different CPU cost</text>

  <text x="40" y="52" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Polling</text>
  <rect x="40" y="60" width="560" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <g stroke="var(--dg-stroke, #9AA0A6)">
    <line x1="55" y1="60" x2="55" y2="90"/><line x1="70" y1="60" x2="70" y2="90"/><line x1="85" y1="60" x2="85" y2="90"/>
    <line x1="100" y1="60" x2="100" y2="90"/><line x1="115" y1="60" x2="115" y2="90"/><line x1="130" y1="60" x2="130" y2="90"/>
    <line x1="145" y1="60" x2="145" y2="90"/><line x1="160" y1="60" x2="160" y2="90"/><line x1="175" y1="60" x2="175" y2="90"/>
    <line x1="190" y1="60" x2="190" y2="90"/><line x1="205" y1="60" x2="205" y2="90"/><line x1="220" y1="60" x2="220" y2="90"/>
    <line x1="235" y1="60" x2="235" y2="90"/><line x1="250" y1="60" x2="250" y2="90"/><line x1="265" y1="60" x2="265" y2="90"/>
    <line x1="280" y1="60" x2="280" y2="90"/><line x1="295" y1="60" x2="295" y2="90"/><line x1="310" y1="60" x2="310" y2="90"/>
    <line x1="325" y1="60" x2="325" y2="90"/><line x1="340" y1="60" x2="340" y2="90"/><line x1="355" y1="60" x2="355" y2="90"/>
    <line x1="370" y1="60" x2="370" y2="90"/><line x1="385" y1="60" x2="385" y2="90"/><line x1="400" y1="60" x2="400" y2="90"/>
    <line x1="415" y1="60" x2="415" y2="90"/><line x1="430" y1="60" x2="430" y2="90"/><line x1="445" y1="60" x2="445" y2="90"/>
    <line x1="460" y1="60" x2="460" y2="90"/><line x1="475" y1="60" x2="475" y2="90"/><line x1="490" y1="60" x2="490" y2="90"/>
    <line x1="505" y1="60" x2="505" y2="90"/><line x1="520" y1="60" x2="520" y2="90"/><line x1="535" y1="60" x2="535" y2="90"/>
    <line x1="550" y1="60" x2="550" y2="90"/><line x1="565" y1="60" x2="565" y2="90"/><line x1="580" y1="60" x2="580" y2="90"/>
  </g>
  <text x="320" y="108" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">CPU 100% busy checking status — 0% useful work</text>

  <text x="40" y="142" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Interrupt-driven</text>
  <rect x="40" y="150" width="40" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="60" y="196" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">issue cmd</text>
  <rect x="80" y="150" width="470" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4,3"/>
  <text x="315" y="169" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">CPU runs OTHER processes</text>
  <rect x="550" y="150" width="50" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="575" y="196" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">interrupt -&gt; handler</text>

  <text x="320" y="222" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Both timelines cover the identical device-operation duration.</text>
</svg>
