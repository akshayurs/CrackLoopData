<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">DMA transfer</text>

  <rect x="270" y="40" width="100" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="65" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">CPU</text>

  <rect x="270" y="180" width="100" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="205" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">DMA Controller</text>

  <rect x="60" y="240" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="120" y="265" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Memory</text>

  <rect x="460" y="240" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="520" y="265" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Device</text>

  <line x1="290" y1="80" x2="290" y2="180" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="200" y="130" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">1. program transfer</text>
  <text x="200" y="144" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">(source, dest, length)</text>

  <line x1="180" y1="260" x2="460" y2="260" stroke="var(--dg-accent, #0C8F88)" stroke-width="3"/>
  <text x="320" y="300" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">2. bulk transfer — CPU not involved</text>

  <line x1="350" y1="180" x2="350" y2="80" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="440" y="130" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">3. interrupt:</text>
  <text x="440" y="144" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">transfer complete</text>
</svg>
