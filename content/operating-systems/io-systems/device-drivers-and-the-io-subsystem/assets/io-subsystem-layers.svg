<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">read() through the I/O layers</text>

  <rect x="120" y="36" width="400" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="58" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Application calls read()</text>
  <line x1="320" y1="70" x2="320" y2="86" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="120" y="86" width="400" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="108" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">System Call Layer</text>
  <line x1="320" y1="120" x2="320" y2="136" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="120" y="136" width="400" height="44" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="156" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Generic / VFS I/O Layer</text>
  <text x="320" y="172" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">identical code path for any device type</text>
  <line x1="320" y1="180" x2="320" y2="196" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="120" y="196" width="400" height="44" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="216" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Device Driver</text>
  <text x="320" y="232" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">different code per device model</text>
  <line x1="320" y1="240" x2="320" y2="256" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="120" y="256" width="400" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="278" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Physical Device</text>

  <text x="320" y="316" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Everything above the driver line is written once, for every device.</text>
</svg>
