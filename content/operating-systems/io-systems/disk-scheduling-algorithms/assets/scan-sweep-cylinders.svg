<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">SCAN: sweep to the end, then reverse</text>

  <line x1="40" y1="110" x2="640" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="40" y="130" font-size="10" fill="var(--dg-muted, #5F6368)">0</text>
  <text x="640" y="130" text-anchor="end" font-size="10" fill="var(--dg-muted, #5F6368)">199</text>

  <!-- head start at 50 -->
  <circle cx="190" cy="110" r="6" fill="var(--dg-accent, #0C8F88)"/>
  <text x="190" y="95" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">start: 50</text>

  <!-- pending requests passed rightward: 60,80,130,175 -->
  <g font-size="9" fill="var(--dg-ink, #202124)">
    <circle cx="220" cy="110" r="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="220" y="150" text-anchor="middle">60 &#10003;</text>
    <circle cx="280" cy="110" r="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="280" y="150" text-anchor="middle">80 &#10003;</text>
    <circle cx="460" cy="110" r="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="460" y="150" text-anchor="middle">130 &#10003;</text>
    <circle cx="600" cy="110" r="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="600" y="150" text-anchor="middle">175 &#10003;</text>
  </g>

  <line x1="190" y1="105" x2="636" y2="105" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="636" y="90" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">reach 199</text>

  <!-- reverse sweep, remaining requests 20, 5 -->
  <g font-size="9" fill="var(--dg-ink, #202124)">
    <circle cx="100" cy="110" r="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="100" y="150" text-anchor="middle">20 &#10003;</text>
    <circle cx="60" cy="110" r="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="60" y="150" text-anchor="middle">5 &#10003;</text>
  </g>
  <line x1="636" y1="118" x2="44" y2="118" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <text x="340" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Head travels all the way to 199 even though the last request was at 175.</text>
</svg>
