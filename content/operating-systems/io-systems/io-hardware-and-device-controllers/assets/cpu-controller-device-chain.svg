<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">CPU to physical device chain</text>

  <rect x="30" y="70" width="110" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="99" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">CPU</text>

  <line x1="140" y1="95" x2="240" y2="95" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="190" y="82" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">System Bus</text>
  <text x="190" y="115" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">register reads/writes</text>

  <rect x="240" y="55" width="200" height="90" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="340" y="75" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Device Controller</text>
  <rect x="255" y="85" width="50" height="24" rx="4" fill="none" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="280" y="101" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">status</text>
  <rect x="315" y="85" width="50" height="24" rx="4" fill="none" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="340" y="101" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">control</text>
  <rect x="375" y="85" width="50" height="24" rx="4" fill="none" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="400" y="101" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">data</text>

  <line x1="440" y1="95" x2="540" y2="95" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="490" y="82" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">device cable</text>
  <text x="490" y="115" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">device-specific protocol</text>

  <rect x="540" y="70" width="110" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="595" y="93" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Physical Device</text>
  <text x="595" y="109" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">disk platters</text>

  <text x="340" y="185" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Generic register protocol on the left, proprietary hardware protocol on the right.</text>
</svg>
