<svg viewBox="0 0 660 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="330" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Heap free list</text>

  <g font-size="9">
    <rect x="20" y="60" width="110" height="50" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="75" y="80" text-anchor="middle" fill="var(--dg-ink, #202124)">free (hdr)</text>
    <text x="75" y="96" text-anchor="middle" fill="var(--dg-muted, #5F6368)">hatched</text>

    <rect x="130" y="60" width="90" height="50" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="175" y="88" text-anchor="middle" fill="var(--dg-ink, #202124)">allocated</text>

    <rect x="220" y="60" width="120" height="50" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="280" y="80" text-anchor="middle" fill="var(--dg-ink, #202124)">free (hdr)</text>
    <text x="280" y="96" text-anchor="middle" fill="var(--dg-muted, #5F6368)">hatched</text>

    <rect x="340" y="60" width="80" height="50" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="380" y="88" text-anchor="middle" fill="var(--dg-ink, #202124)">allocated</text>

    <rect x="420" y="60" width="90" height="50" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="465" y="80" text-anchor="middle" fill="var(--dg-ink, #202124)">free (hdr)</text>
    <text x="465" y="96" text-anchor="middle" fill="var(--dg-muted, #5F6368)">hatched</text>

    <rect x="510" y="60" width="120" height="50" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="570" y="88" text-anchor="middle" fill="var(--dg-ink, #202124)">allocated</text>
  </g>

  <path d="M 75 110 C 75 140, 280 140, 280 110" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <path d="M 280 110 C 280 150, 465 150, 465 110" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="330" y="176" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">free list next pointer — skips over allocated chunks</text>
</svg>
