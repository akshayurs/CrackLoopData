<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">MMU base + limit translation</text>

  <rect x="30" y="60" width="90" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="84" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">CPU</text>

  <line x1="120" y1="80" x2="180" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="150" y="68" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">0x1500</text>

  <rect x="180" y="45" width="180" height="90" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="270" y="64" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">MMU</text>
  <text x="270" y="86" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">base = 0x14000</text>
  <text x="270" y="102" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">limit = 0x3000</text>
  <text x="270" y="120" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">physical = base + logical</text>

  <line x1="360" y1="80" x2="420" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="390" y="68" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">0x15500</text>

  <rect x="420" y="60" width="90" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="465" y="84" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">RAM</text>

  <line x1="270" y1="135" x2="270" y2="180" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="180" y="180" width="180" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="270" y="200" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">exceeds limit</text>
  <text x="270" y="214" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">trap / fault, not RAM</text>
</svg>
