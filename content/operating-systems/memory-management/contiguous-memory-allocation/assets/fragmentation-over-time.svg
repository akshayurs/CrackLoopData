<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="340" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Free space degrading across allocations</text>

  <g font-size="9" fill="var(--dg-ink, #202124)">
    <text x="115" y="52" text-anchor="middle" font-weight="600">T0</text>
    <rect x="30" y="60" width="170" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="115" y="80" text-anchor="middle">P1</text>
    <rect x="200" y="60" width="0" height="30"/>

    <text x="330" y="52" text-anchor="middle" font-weight="600">T1</text>
    <rect x="230" y="60" width="90" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="275" y="80" text-anchor="middle">P1</text>
    <rect x="320" y="60" width="70" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="355" y="80" text-anchor="middle">P2</text>
    <rect x="390" y="60" width="10" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>

    <text x="530" y="52" text-anchor="middle" font-weight="600">T2</text>
    <rect x="430" y="60" width="50" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="480" y="60" width="70" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="515" y="80" text-anchor="middle">P2</text>
    <rect x="550" y="60" width="30" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="580" y="60" width="60" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="610" y="80" text-anchor="middle">P3</text>
  </g>

  <g font-size="9" fill="var(--dg-ink, #202124)">
    <text x="340" y="122" text-anchor="middle" font-weight="600">T3 — many small scattered slivers</text>
    <rect x="30" y="130" width="20" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="50" y="130" width="40" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="90" y="130" width="15" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="105" y="130" width="60" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="165" y="130" width="10" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="175" y="130" width="50" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="225" y="130" width="25" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="250" y="130" width="70" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="320" y="130" width="18" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="338" y="130" width="80" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="418" y="130" width="12" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="430" y="130" width="60" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="490" y="130" width="22" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="512" y="130" width="90" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="602" y="130" width="38" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  </g>
  <text x="340" y="195" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">No single allocation is the problem — the free-space picture degrades over many rounds.</text>
</svg>
