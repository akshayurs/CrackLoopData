<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Swap out, swap in</text>

  <rect x="40" y="40" width="200" height="120" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="140" y="34" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">RAM (state A)</text>
  <rect x="55" y="55" width="120" height="50" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="115" y="83" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Process A</text>
  <rect x="55" y="115" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="85" y="134" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Proc B</text>

  <line x1="115" y1="105" x2="115" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="115" y="220" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">swap out</text>

  <rect x="60" y="200" width="110" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="115" y="224" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">backing store</text>

  <line x1="200" y1="220" x2="360" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="280" y="207" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">swap in</text>

  <rect x="400" y="40" width="200" height="120" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="34" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">RAM (state B)</text>
  <rect x="415" y="60" width="60" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="445" y="79" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Proc B</text>
  <rect x="415" y="110" width="120" height="50" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="475" y="138" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Process A</text>
  <text x="475" y="152" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">different location</text>
</svg>
