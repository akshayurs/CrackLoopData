<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Internal vs external fragmentation</text>

  <text x="150" y="50" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Internal fragmentation</text>
  <rect x="60" y="60" width="180" height="40" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="60" y="60" width="120" height="40" fill="var(--dg-accent-bg, #E3F3F1)"/>
  <text x="120" y="84" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">used</text>
  <rect x="180" y="60" width="60" height="40" fill="var(--dg-fill, #F1F3F4)"/>
  <text x="210" y="84" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">wasted</text>
  <text x="150" y="120" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">waste inside one process's own block</text>

  <text x="480" y="50" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">External fragmentation</text>
  <g font-size="9">
    <rect x="380" y="60" width="40" height="40" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="420" y="60" width="20" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="2,2"/>
    <rect x="440" y="60" width="35" height="40" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="475" y="60" width="15" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="2,2"/>
    <rect x="490" y="60" width="30" height="40" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <rect x="520" y="60" width="20" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="2,2"/>
    <rect x="540" y="60" width="40" height="40" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  </g>
  <text x="480" y="120" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">gaps sum to more than an incoming request needs,</text>
  <text x="480" y="134" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">but no single gap fits it</text>
  <line x1="480" y1="150" x2="480" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="480" y="165" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">incoming large request</text>
</svg>
