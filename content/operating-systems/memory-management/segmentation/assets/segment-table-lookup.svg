<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Segmented address translation</text>

  <rect x="60" y="42" width="120" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="120" y="62" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">segment = 2</text>
  <rect x="190" y="42" width="120" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="250" y="62" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">offset = 0x150</text>

  <line x1="120" y1="72" x2="120" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="40" y="100" width="220" height="130" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="118" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">segment table</text>
  <text x="55" y="138" font-size="9" fill="var(--dg-muted, #5F6368)">0: code</text>
  <text x="55" y="156" font-size="9" fill="var(--dg-muted, #5F6368)">1: data</text>
  <rect x="45" y="164" width="210" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="55" y="180" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">2: stack  base=0x9000</text>
  <text x="55" y="192" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">   limit=0x800</text>
  <text x="55" y="212" font-size="9" fill="var(--dg-muted, #5F6368)">3: heap</text>

  <line x1="260" y1="180" x2="380" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="250" y1="72" x2="380" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="380" y="100" width="220" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="490" y="122" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">bounds check: offset &lt; limit</text>
  <text x="490" y="142" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">base + offset</text>

  <line x1="490" y1="160" x2="490" y2="196" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="400" y="196" width="180" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="490" y="218" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">physical address 0x9150</text>
</svg>
