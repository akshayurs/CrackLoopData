<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Boot sequence</text>

  <line x1="30" y1="130" x2="670" y2="130" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g font-size="9" fill="var(--dg-ink, #202124)" text-anchor="middle">
    <circle cx="60" cy="130" r="5" fill="var(--dg-accent, #0C8F88)"/>
    <text x="60" y="110">Power On</text>

    <circle cx="180" cy="130" r="5" fill="var(--dg-accent, #0C8F88)"/>
    <text x="180" y="110">POST</text>
    <text x="180" y="160" fill="var(--dg-muted, #5F6368)">firmware self-test</text>

    <circle cx="300" cy="130" r="5" fill="var(--dg-accent, #0C8F88)"/>
    <text x="300" y="110">Firmware finds</text>
    <text x="300" y="160" fill="var(--dg-muted, #5F6368)">bootloader</text>

    <circle cx="420" cy="130" r="5" fill="var(--dg-accent, #0C8F88)"/>
    <text x="420" y="110">Bootloader</text>
    <text x="420" y="160" fill="var(--dg-muted, #5F6368)">GRUB1 -&gt; GRUB2, loads kernel</text>

    <circle cx="540" cy="130" r="5" fill="var(--dg-accent, #0C8F88)"/>
    <text x="540" y="110">Kernel init</text>
    <text x="540" y="160" fill="var(--dg-muted, #5F6368)">mounts real rootfs</text>

    <circle cx="630" cy="130" r="5" fill="var(--dg-accent, #0C8F88)"/>
    <text x="630" y="110">Init (PID 1)</text>
    <text x="630" y="160" fill="var(--dg-muted, #5F6368)">login/shell</text>
  </g>

  <g font-size="8" fill="var(--dg-muted, #5F6368)" text-anchor="middle">
    <text x="120" y="182">handoff</text>
    <text x="240" y="182">handoff</text>
    <text x="360" y="182">handoff</text>
    <text x="480" y="182">handoff</text>
    <text x="585" y="182">handoff</text>
  </g>
  <g stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="2,3">
    <line x1="120" y1="130" x2="120" y2="176"/>
    <line x1="240" y1="130" x2="240" y2="176"/>
    <line x1="360" y1="130" x2="360" y2="176"/>
    <line x1="480" y1="130" x2="480" y2="176"/>
    <line x1="585" y1="130" x2="585" y2="176"/>
  </g>

  <text x="350" y="220" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Each stage hands off control and then is finished</text>
  <text x="350" y="238" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">it never runs again until the next reboot</text>
</svg>
