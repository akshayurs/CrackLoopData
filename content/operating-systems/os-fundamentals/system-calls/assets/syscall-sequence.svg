<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">read() syscall path</text>

  <text x="90" y="52" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">App code</text>
  <text x="270" y="52" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">glibc</text>
  <text x="450" y="52" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">CPU / trap</text>
  <text x="600" y="52" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Kernel handler</text>

  <line x1="90" y1="60" x2="90" y2="340" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="2,3"/>
  <line x1="270" y1="60" x2="270" y2="340" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="2,3"/>
  <line x1="450" y1="60" x2="450" y2="340" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="2,3"/>
  <line x1="600" y1="60" x2="600" y2="340" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="2,3"/>

  <line x1="90" y1="78" x2="255" y2="78" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="175" y="72" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">read(fd, buf, n)</text>

  <line x1="270" y1="100" x2="270" y2="100" stroke="none"/>
  <rect x="200" y="92" width="140" height="24" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="270" y="108" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">loads syscall # + args</text>

  <line x1="270" y1="130" x2="435" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="352" y="124" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">svc / trap instruction</text>

  <rect x="380" y="150" width="140" height="24" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="450" y="166" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">switch to kernel mode</text>

  <line x1="450" y1="180" x2="585" y2="180" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="517" y="174" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">jump via syscall table</text>

  <rect x="530" y="200" width="140" height="24" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="600" y="216" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">sys_read runs</text>

  <rect x="530" y="234" width="140" height="24" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="600" y="250" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">copies data into buf</text>

  <line x1="530" y1="246" x2="465" y2="270" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="500" y="264" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">return + mode flip</text>

  <rect x="380" y="278" width="140" height="24" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="450" y="294" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">back to user mode</text>

  <line x1="380" y1="290" x2="285" y2="308" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="200" y1="316" x2="100" y2="316" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="150" y="330" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">unwinds back through glibc</text>
</svg>
