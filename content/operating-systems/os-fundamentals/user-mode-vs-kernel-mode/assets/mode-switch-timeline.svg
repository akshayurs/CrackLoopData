<svg viewBox="0 0 620 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="310" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Mode switch on a syscall</text>

  <text x="50" y="70" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">User mode</text>
  <line x1="120" y1="80" x2="590" y2="80" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <text x="50" y="160" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Kernel mode</text>
  <line x1="120" y1="150" x2="590" y2="150" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <rect x="130" y="65" width="120" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="190" y="84" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">user code runs</text>

  <line x1="250" y1="90" x2="330" y2="140" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
  <text x="270" y="120" font-size="8" fill="var(--dg-accent, #0C8F88)">syscall instr</text>

  <rect x="330" y="135" width="140" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="400" y="154" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">kernel handler runs</text>

  <line x1="470" y1="140" x2="530" y2="90" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
  <text x="475" y="115" font-size="8" fill="var(--dg-accent, #0C8F88)">return</text>

  <rect x="500" y="65" width="80" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="540" y="84" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">resumes</text>

  <text x="310" y="200" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Every crossing flips the privilege bit</text>
  <text x="310" y="218" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">and saves/restores registers on each side</text>
</svg>
