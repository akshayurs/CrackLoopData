<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="200" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">x86 privilege rings</text>

  <circle cx="200" cy="220" r="160" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="200" cy="220" r="120" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="200" cy="220" r="80" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="200" cy="220" r="40" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>

  <text x="200" y="224" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Ring 0</text>
  <text x="200" y="238" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">kernel</text>

  <text x="200" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Ring 1 (rarely used)</text>
  <text x="200" y="112" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Ring 2 (rarely used)</text>
  <text x="200" y="72" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Ring 3 — user apps</text>

  <line x1="200" y1="65" x2="200" y2="185" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)" stroke-dasharray="3,3"/>
  <text x="215" y="130" font-size="8" fill="var(--dg-muted, #5F6368)">call inward for privilege</text>

  <text x="200" y="392" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Linux/Windows use only Ring 0 and Ring 3 in practice</text>
</svg>
