<svg viewBox="0 0 660 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Interrupt handling timeline</text>

  <rect x="30" y="60" width="180" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="120" y="81" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Process A running</text>

  <line x1="210" y1="77" x2="240" y2="77" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="225" y="60" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">disk asserts IRQ</text>

  <rect x="240" y="60" width="120" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="300" y="76" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">save A's PC</text>
  <text x="300" y="88" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">and flags</text>

  <line x1="360" y1="77" x2="390" y2="77" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="375" y="60" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">vector table</text>

  <rect x="390" y="60" width="110" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="445" y="81" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">ISR runs</text>

  <line x1="500" y1="77" x2="530" y2="77" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="530" y="60" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="580" y="76" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">restore A's</text>
  <text x="580" y="88" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">state, resume</text>

  <line x1="240" y1="110" x2="240" y2="130" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,3"/>
  <line x1="500" y1="110" x2="500" y2="130" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,3"/>
  <line x1="240" y1="130" x2="500" y2="130" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="370" y="146" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">interrupt latency</text>

  <text x="330" y="186" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Process A resumes exactly where it left off</text>
  <text x="330" y="204" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">it has no idea an interrupt happened</text>
</svg>
