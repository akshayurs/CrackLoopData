<svg viewBox="0 0 500 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="250" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">OS layers</text>

  <rect x="100" y="40" width="300" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="62" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Applications</text>
  <text x="250" y="78" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">browser, editor, games</text>

  <line x1="250" y1="90" x2="250" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="100" y="110" width="300" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="132" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">System programs</text>
  <text x="250" y="148" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">shell, compilers, utilities</text>

  <line x1="250" y1="160" x2="250" y2="180" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="100" y="180" width="300" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="250" y="202" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Kernel</text>
  <text x="250" y="218" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">scheduler, memory manager,</text>
  <text x="250" y="230" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">drivers, filesystem</text>

  <line x1="250" y1="240" x2="250" y2="260" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="100" y="260" width="300" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="250" y="282" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Hardware</text>
  <text x="250" y="298" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">CPU, RAM, disk, NIC</text>

  <text x="440" y="60" font-size="8" fill="var(--dg-accent, #0C8F88)">syscalls</text>
  <text x="440" y="130" font-size="8" fill="var(--dg-accent, #0C8F88)">cross down</text>
</svg>
