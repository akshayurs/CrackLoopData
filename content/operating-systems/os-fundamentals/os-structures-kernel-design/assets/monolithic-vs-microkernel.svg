<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="165" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Monolithic</text>
  <text x="495" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Microkernel</text>

  <rect x="65" y="36" width="200" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="165" y="53" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Applications</text>
  <line x1="165" y1="62" x2="165" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="185" y="74" font-size="9" fill="var(--dg-muted, #5F6368)">syscall</text>

  <rect x="45" y="80" width="240" height="140" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="165" y="96" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Kernel space</text>
  <rect x="58" y="104" width="90" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="103" y="121" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Scheduler</text>
  <rect x="158" y="104" width="110" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="213" y="121" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Filesystem</text>
  <rect x="58" y="140" width="90" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="103" y="157" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Network stack</text>
  <rect x="158" y="140" width="110" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="213" y="157" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Drivers</text>
  <line x1="148" y1="117" x2="158" y2="117" stroke="var(--dg-line, #5F6368)"/>
  <line x1="103" y1="130" x2="103" y2="140" stroke="var(--dg-line, #5F6368)"/>
  <line x1="213" y1="130" x2="213" y2="140" stroke="var(--dg-line, #5F6368)"/>
  <line x1="148" y1="153" x2="158" y2="153" stroke="var(--dg-line, #5F6368)"/>
  <text x="165" y="210" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">direct function calls</text>

  <rect x="395" y="36" width="200" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="495" y="53" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Applications</text>
  <line x1="495" y1="62" x2="495" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="515" y="74" font-size="9" fill="var(--dg-muted, #5F6368)">syscall</text>

  <rect x="435" y="80" width="120" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="495" y="98" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Kernel</text>
  <text x="495" y="112" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Sched, mem, IPC</text>

  <rect x="365" y="150" width="80" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="405" y="169" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Filesystem</text>
  <rect x="455" y="150" width="80" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="495" y="169" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Network</text>
  <rect x="545" y="150" width="80" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="585" y="169" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Drivers</text>

  <line x1="405" y1="150" x2="465" y2="130" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="495" y1="150" x2="495" y2="130" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="585" y1="150" x2="525" y2="130" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="495" y="196" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">IPC message crossings</text>

  <text x="330" y="250" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Same interaction, twice the boundary crossings</text>
  <text x="330" y="268" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">left: one function call inside kernel space</text>
  <text x="330" y="284" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">right: same call becomes an IPC round trip</text>
</svg>
