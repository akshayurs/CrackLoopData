<svg viewBox="0 0 460 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="230" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Multilevel feedback queues</text>

  <rect x="100" y="40" width="260" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="230" y="58" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Queue 0 — quantum 8ms</text>
  <text x="230" y="72" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">highest priority</text>

  <rect x="100" y="100" width="260" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="230" y="124" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Queue 1 — quantum 16ms</text>

  <rect x="100" y="160" width="260" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="230" y="184" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Queue 2 — quantum 32ms</text>

  <rect x="100" y="220" width="260" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="230" y="240" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Queue 3 — quantum 64ms</text>
  <text x="230" y="253" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">FCFS, lowest priority</text>

  <line x1="230" y1="80" x2="230" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="230" y1="140" x2="230" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="230" y1="200" x2="230" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="380" y="95" font-size="7" fill="var(--dg-muted, #5F6368)">used full quantum,</text>
  <text x="380" y="107" font-size="7" fill="var(--dg-muted, #5F6368)">no block -&gt; demote</text>

  <path d="M100,240 Q20,240 20,60 L96,60" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="20" y="150" font-size="7" fill="var(--dg-accent, #0C8F88)" text-anchor="middle" transform="rotate(-90 20 150)">periodic priority boost</text>

  <text x="230" y="290" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">new process always enters at Queue 0</text>
  <text x="230" y="310" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">quantum grows as priority drops</text>
</svg>
