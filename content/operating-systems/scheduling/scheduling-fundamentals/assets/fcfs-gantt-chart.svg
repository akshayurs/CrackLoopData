<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="250" y="22" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">FCFS Gantt chart</text>

  <rect x="60" y="50" width="150" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="135" y="71" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">P1 (0-5)</text>

  <rect x="210" y="50" width="90" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="255" y="71" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">P2 (5-8)</text>

  <rect x="300" y="50" width="60" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="330" y="71" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">P3 (8-10)</text>

  <text x="60" y="100" font-size="8" fill="var(--dg-muted, #5F6368)">0</text>
  <text x="210" y="100" font-size="8" fill="var(--dg-muted, #5F6368)">5</text>
  <text x="300" y="100" font-size="8" fill="var(--dg-muted, #5F6368)">8</text>
  <text x="360" y="100" font-size="8" fill="var(--dg-muted, #5F6368)">10</text>

  <line x1="60" y1="130" x2="60" y2="140" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="60" y="152" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">P1 arrives 0</text>
  <line x1="60" y1="160" x2="210" y2="160" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="135" y="174" text-anchor="middle" font-size="7" fill="var(--dg-accent, #0C8F88)">wait 0</text>

  <text x="30" y="196" font-size="9" fill="var(--dg-ink, #202124)">P2 arrives at 1, waits 4 (starts at 5)</text>
  <text x="30" y="212" font-size="9" fill="var(--dg-ink, #202124)">P3 arrives at 2, waits 6 (starts at 8) — avg wait ≈ 3.33</text>
</svg>
