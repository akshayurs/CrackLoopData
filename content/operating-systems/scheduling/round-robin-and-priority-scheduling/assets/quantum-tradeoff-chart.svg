<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="240" y="22" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Quantum size trade-off</text>

  <line x1="60" y1="230" x2="440" y2="230" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="60" y1="230" x2="60" y2="50" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="250" y="255" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">quantum size</text>

  <rect x="200" y="55" width="100" height="170" fill="var(--dg-accent-bg, #E3F3F1)" opacity="0.6"/>
  <text x="250" y="70" text-anchor="middle" font-size="8" fill="var(--dg-accent, #0C8F88)">sweet spot</text>

  <path d="M65,60 Q150,80 250,150 T435,220" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2"/>
  <text x="410" y="215" font-size="8" fill="var(--dg-ink, #202124)">overhead %</text>

  <path d="M65,220 Q150,180 250,140 T435,60" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="400" y="55" font-size="8" fill="var(--dg-ink, #202124)">response time</text>

  <line x1="90" y1="50" x2="90" y2="230" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="2,3"/>
  <text x="90" y="245" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">too small</text>

  <line x1="400" y1="50" x2="400" y2="230" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="2,3"/>
  <text x="400" y="245" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">too large (-&gt; FCFS)</text>

  <text x="240" y="280" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">the two curves move in opposite directions</text>
</svg>
