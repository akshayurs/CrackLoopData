<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="310" y="22" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Rate Monotonic vs EDF — A(period4,exec2), B(period6,exec3)</text>

  <text x="40" y="60" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">RM</text>
  <g font-size="8">
    <rect x="60" y="45" width="80" height="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="100" y="62" text-anchor="middle" fill="var(--dg-ink, #202124)">A 0-2</text>
    <rect x="140" y="45" width="80" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="180" y="62" text-anchor="middle" fill="var(--dg-ink, #202124)">B 2-4</text>
    <rect x="220" y="45" width="80" height="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="260" y="62" text-anchor="middle" fill="var(--dg-ink, #202124)">A 4-6</text>
    <rect x="300" y="45" width="40" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="320" y="62" text-anchor="middle" fill="var(--dg-ink, #202124)">B 6-7</text>
    <rect x="340" y="45" width="40" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="360" y="62" text-anchor="middle" fill="var(--dg-ink, #202124)">B 7-8</text>
    <rect x="380" y="45" width="80" height="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="420" y="62" text-anchor="middle" fill="var(--dg-ink, #202124)">A 8-10</text>
    <rect x="460" y="45" width="80" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="500" y="62" text-anchor="middle" fill="var(--dg-ink, #202124)">B 10-12</text>
  </g>
  <line x1="300" y1="40" x2="300" y2="80" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="300" y="95" text-anchor="middle" font-size="8" fill="var(--dg-accent, #0C8F88)">B misses deadline 6</text>

  <text x="40" y="150" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">EDF</text>
  <g font-size="8">
    <rect x="60" y="135" width="80" height="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="100" y="152" text-anchor="middle" fill="var(--dg-ink, #202124)">A 0-2</text>
    <rect x="140" y="135" width="120" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="200" y="152" text-anchor="middle" fill="var(--dg-ink, #202124)">B 2-5</text>
    <rect x="260" y="135" width="80" height="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="300" y="152" text-anchor="middle" fill="var(--dg-ink, #202124)">A 5-7</text>
    <rect x="340" y="135" width="120" height="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="400" y="152" text-anchor="middle" fill="var(--dg-ink, #202124)">B 7-10</text>
    <rect x="460" y="135" width="80" height="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="500" y="152" text-anchor="middle" fill="var(--dg-ink, #202124)">A 10-12</text>
  </g>
  <text x="300" y="190" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">no missed deadlines — reordered by nearest deadline</text>

  <line x1="60" y1="220" x2="540" y2="220" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="60" y="234" font-size="8" fill="var(--dg-muted, #5F6368)">0</text>
  <text x="540" y="234" font-size="8" fill="var(--dg-muted, #5F6368)">12</text>

  <text x="310" y="270" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Total utilization = 2/4 + 3/6 = 1.0 — fully saturating the CPU</text>
</svg>
