<svg viewBox="0 0 460 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="230" y="22" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">CFS runqueue as a red-black tree</text>

  <circle cx="230" cy="70" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="230" y="66" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">C</text>
  <text x="230" y="78" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">210</text>

  <line x1="230" y1="90" x2="150" y2="140" stroke="var(--dg-line, #5F6368)"/>
  <line x1="230" y1="90" x2="330" y2="140" stroke="var(--dg-line, #5F6368)"/>

  <circle cx="150" cy="160" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="150" y="156" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">A</text>
  <text x="150" y="168" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">120</text>

  <circle cx="330" cy="160" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="330" y="156" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">E</text>
  <text x="330" y="168" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">340</text>

  <line x1="150" y1="180" x2="90" y2="230" stroke="var(--dg-line, #5F6368)"/>

  <circle cx="90" cy="250" r="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="90" y="246" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">B</text>
  <text x="90" y="258" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">95</text>

  <line x1="90" y1="270" x2="150" y2="290" stroke="var(--dg-line, #5F6368)" stroke-dasharray="2,2"/>
  <text x="185" y="294" font-size="7" fill="var(--dg-muted, #5F6368)">D=95 (tie, insertion order)</text>

  <line x1="60" y1="220" x2="90" y2="240" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
  <text x="30" y="200" font-size="8" fill="var(--dg-accent, #0C8F88)" text-anchor="middle">leftmost:</text>
  <text x="30" y="212" font-size="8" fill="var(--dg-accent, #0C8F88)" text-anchor="middle">picks B next</text>
</svg>
