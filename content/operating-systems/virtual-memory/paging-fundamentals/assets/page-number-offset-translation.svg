<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Paging translation</text>

  <rect x="140" y="40" width="140" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="210" y="62" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">page number</text>
  <rect x="280" y="40" width="140" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="350" y="62" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">offset (unchanged)</text>

  <line x1="210" y1="74" x2="210" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="120" y="100" width="180" height="120" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="210" y="118" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">page table</text>
  <text x="140" y="138" font-size="9" fill="var(--dg-muted, #5F6368)">0 -&gt; frame 4</text>
  <rect x="130" y="146" width="160" height="22" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="140" y="162" font-size="9" fill="var(--dg-ink, #202124)" font-weight="600">1 -&gt; frame 9</text>
  <text x="140" y="184" font-size="9" fill="var(--dg-muted, #5F6368)">2 -&gt; frame 2</text>
  <text x="140" y="204" font-size="9" fill="var(--dg-muted, #5F6368)">... -&gt; ...</text>

  <line x1="290" y1="157" x2="380" y2="157" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="330" y="145" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">frame 9</text>
  <line x1="350" y1="74" x2="420" y2="230" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="420" y="150" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">+ offset</text>

  <rect x="380" y="230" width="220" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="490" y="248" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">physical memory</text>
  <text x="490" y="264" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">equal-sized frames</text>
</svg>
