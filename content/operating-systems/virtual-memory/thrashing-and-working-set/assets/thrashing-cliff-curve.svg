<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">CPU utilization vs multiprogramming</text>

  <line x1="70" y1="240" x2="580" y2="240" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="70" y1="240" x2="70" y2="50" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="266" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">degree of multiprogramming</text>
  <text x="40" y="145" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" transform="rotate(-90 40 145)">CPU utilization</text>

  <path d="M 70 240 C 160 100, 260 60, 320 58 C 360 56, 380 90, 400 150 C 420 200, 440 232, 480 238 L 580 240"
        fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>

  <circle cx="320" cy="58" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <text x="320" y="42" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">optimal</text>

  <text x="470" y="150" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">thrashing</text>
  <text x="470" y="164" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">sharp collapse, not gradual</text>
</svg>
