<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="20" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">TLB hit vs TLB miss</text>

  <text x="40" y="52" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">TLB hit</text>
  <g font-size="9" fill="var(--dg-ink, #202124)">
    <rect x="100" y="40" width="90" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="145" y="57" text-anchor="middle">virtual addr</text>
    <line x1="190" y1="53" x2="230" y2="53" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <rect x="230" y="40" width="90" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="275" y="57" text-anchor="middle">TLB lookup &#10003;</text>
    <line x1="320" y1="53" x2="360" y2="53" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <rect x="360" y="40" width="90" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="405" y="57" text-anchor="middle">physical addr</text>
    <line x1="450" y1="53" x2="490" y2="53" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <rect x="490" y="40" width="90" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="535" y="57" text-anchor="middle">memory access</text>
  </g>
  <text x="275" y="86" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">~1-2 cycles</text>

  <text x="40" y="130" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">TLB miss</text>
  <g font-size="9" fill="var(--dg-ink, #202124)">
    <rect x="100" y="118" width="90" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="145" y="135" text-anchor="middle">virtual addr</text>
    <line x1="190" y1="131" x2="230" y2="131" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <rect x="230" y="118" width="90" height="26" rx="5" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,2"/>
    <text x="275" y="135" text-anchor="middle">TLB miss &#10007;</text>
    <line x1="320" y1="131" x2="360" y2="131" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <rect x="360" y="118" width="90" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="405" y="135" text-anchor="middle">walk step 1</text>
    <line x1="450" y1="131" x2="480" y2="131" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <rect x="480" y="118" width="90" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="525" y="135" text-anchor="middle">walk step 2</text>
  </g>
  <line x1="145" y1="144" x2="145" y2="170" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <g font-size="9" fill="var(--dg-ink, #202124)">
    <rect x="100" y="170" width="120" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="160" y="187" text-anchor="middle">physical found, TLB filled</text>
    <line x1="220" y1="183" x2="260" y2="183" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <rect x="260" y="170" width="90" height="26" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="305" y="187" text-anchor="middle">memory access</text>
  </g>
  <text x="325" y="216" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">~100s of cycles for the walk</text>
</svg>
