<svg viewBox="0 0 660 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="20" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Two-level page table walk</text>

  <g font-size="9" fill="var(--dg-ink, #202124)" text-anchor="middle">
    <rect x="20" y="36" width="80" height="24" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="60" y="52">outer index</text>
    <rect x="105" y="36" width="80" height="24" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="145" y="52">inner index</text>
    <rect x="190" y="36" width="70" height="24" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="225" y="52">offset</text>
  </g>

  <text x="45" y="82" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">CR3 root</text>
  <line x1="60" y1="60" x2="60" y2="96" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="20" y="96" width="140" height="140" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="112" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">outer table</text>
  <text x="30" y="130" font-size="8" fill="var(--dg-muted, #5F6368)">0: not present</text>
  <rect x="25" y="138" width="130" height="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="30" y="152" font-size="8" fill="var(--dg-ink, #202124)" font-weight="600">1: -&gt; inner table A</text>
  <text x="30" y="172" font-size="8" fill="var(--dg-muted, #5F6368)">2: not present</text>
  <text x="30" y="192" font-size="8" fill="var(--dg-muted, #5F6368)">3: not present</text>
  <text x="30" y="212" font-size="8" fill="var(--dg-muted, #5F6368)">4: not present</text>

  <line x1="160" y1="148" x2="220" y2="148" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="220" y="96" width="140" height="140" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="290" y="112" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">inner table A</text>
  <text x="230" y="130" font-size="8" fill="var(--dg-muted, #5F6368)">0: frame 12</text>
  <rect x="225" y="138" width="130" height="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="230" y="152" font-size="8" fill="var(--dg-ink, #202124)" font-weight="600">1: frame 87</text>
  <text x="230" y="172" font-size="8" fill="var(--dg-muted, #5F6368)">2: frame 3</text>

  <line x1="360" y1="148" x2="420" y2="148" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="260" y1="60" x2="420" y2="170" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <rect x="420" y="120" width="200" height="50" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="520" y="140" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">frame 87 + offset</text>
  <text x="520" y="156" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">= physical address</text>

  <text x="330" y="270" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Most outer-table rows point nowhere — unused regions never get an inner table.</text>
</svg>
