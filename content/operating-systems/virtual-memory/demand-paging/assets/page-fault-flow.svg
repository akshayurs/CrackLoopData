<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="20" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Page fault path</text>

  <g font-size="10" fill="var(--dg-ink, #202124)">
    <rect x="200" y="30" width="280" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="340" y="48" text-anchor="middle">1. CPU accesses virtual address</text>
    <line x1="340" y1="56" x2="340" y2="68" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

    <rect x="200" y="68" width="280" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="340" y="86" text-anchor="middle">2. MMU: page table invalid bit set</text>
    <line x1="340" y1="94" x2="340" y2="106" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

    <rect x="200" y="106" width="280" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="340" y="124" text-anchor="middle">3. trap to OS page-fault handler</text>
    <line x1="340" y1="132" x2="340" y2="144" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

    <rect x="200" y="144" width="280" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="340" y="162" text-anchor="middle">4. legitimate page in address space?</text>

    <line x1="340" y1="170" x2="200" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <text x="150" y="200" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">no</text>
    <rect x="40" y="220" width="220" height="30" rx="6" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4,3"/>
    <text x="150" y="240" text-anchor="middle" font-size="9">deliver SIGSEGV, terminate</text>

    <line x1="340" y1="170" x2="480" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
    <text x="440" y="200" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">yes</text>

    <rect x="340" y="220" width="280" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="480" y="240" text-anchor="middle" font-size="9">5. find/evict frame, disk I/O to load page</text>
    <line x1="480" y1="250" x2="480" y2="270" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

    <rect x="340" y="270" width="280" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="480" y="288" text-anchor="middle">6. update PTE: valid, frame number</text>
    <line x1="480" y1="296" x2="480" y2="308" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

    <rect x="340" y="308" width="280" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="480" y="326" text-anchor="middle">7. resume faulting instruction</text>
  </g>
  <text x="340" y="360" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Step 5 is the expensive one — an actual disk read.</text>
</svg>
