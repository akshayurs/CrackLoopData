      <rect x="0" y="10" width="60" height="24" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/><text x="30" y="27">2</text>
      <rect x="0" y="36" width="60" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="30" y="53">3</text>
      <rect x="0" y="62" width="60" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="30" y="79">1</text>
