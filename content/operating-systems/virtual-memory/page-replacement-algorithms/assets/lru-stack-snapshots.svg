      <rect x="0" y="36" width="60" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="30" y="53">2</text>
      <rect x="0" y="62" width="60" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/><text x="30" y="79">1</text>
    </g>
