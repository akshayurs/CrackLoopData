<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">From open() to disk blocks</text>

  <rect x="60" y="40" width="520" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="68" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Applications — open() / read() / write()</text>

  <line x1="320" y1="86" x2="320" y2="112" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="60" y="112" width="520" height="86" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="132" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">File System</text>
  <rect x="80" y="144" width="140" height="40" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="150" y="168" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Inode table</text>
  <rect x="250" y="144" width="140" height="40" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="320" y="168" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Directory entries</text>
  <rect x="420" y="144" width="140" height="40" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="490" y="168" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Free-space bitmap</text>

  <line x1="320" y1="198" x2="320" y2="224" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="60" y="224" width="520" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="244" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Raw Disk Blocks</text>
  <text x="320" y="260" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">0  1  2  3  ...  N (flat numbered array)</text>
</svg>
