<svg viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="340" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Free-space bitmap</text>
  <g>
    <!-- 32 squares, pattern with a run of 5 free (light) around index 14-18 -->
  </g>
  <g transform="translate(30,60)">
    <!-- generate manually: 1=allocated dark, 0=free light -->
    <!-- pattern: 1101 1011 0111 1000 0011 1101 0111 1010 (32 bits, contains run of 5 zeros at idx13-17? let's just hand place) -->
  </g>
  <g font-size="9">
    <!-- Row of 32 squares, 18px each starting x=20 -->
  </g>
  <g id="row" transform="translate(20,70)">
    <rect x="0" y="0" width="18" height="18" fill="var(--dg-stroke, #9AA0A6)"/>
    <rect x="20" y="0" width="18" height="18" fill="var(--dg-stroke, #9AA0A6)"/>
    <rect x="40" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="60" y="0" width="18" height="18" fill="var(--dg-stroke, #9AA0A6)"/>
    <rect x="80" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="100" y="0" width="18" height="18" fill="var(--dg-stroke, #9AA0A6)"/>
    <rect x="120" y="0" width="18" height="18" fill="var(--dg-stroke, #9AA0A6)"/>
    <rect x="140" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="160" y="0" width="18" height="18" fill="var(--dg-stroke, #9AA0A6)"/>
    <rect x="180" y="0" width="18" height="18" fill="var(--dg-stroke, #9AA0A6)"/>
    <rect x="200" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="220" y="0" width="18" height="18" fill="var(--dg-stroke, #9AA0A6)"/>
    <rect x="240" y="0" width="18" height="18" fill="var(--dg-stroke, #9AA0A6)"/>
    <!-- run of 5 free -->
    <rect x="260" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
    <rect x="280" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
    <rect x="300" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
    <rect x="320" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
    <rect x="340" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
    <rect x="360" y="0" width="18" height="18" fill="var(--dg-stroke, #9AA0A6)"/>
    <rect x="380" y="0" width="18" height="18" fill="var(--dg-stroke, #9AA0A6)"/>
    <rect x="400" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="420" y="0" width="18" height="18" fill="var(--dg-stroke, #9AA0A6)"/>
    <rect x="440" y="0" width="18" height="18" fill="var(--dg-stroke, #9AA0A6)"/>
    <rect x="460" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="480" y="0" width="18" height="18" fill="var(--dg-stroke, #9AA0A6)"/>
    <rect x="500" y="0" width="18" height="18" fill="var(--dg-stroke, #9AA0A6)"/>
    <rect x="520" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="540" y="0" width="18" height="18" fill="var(--dg-stroke, #9AA0A6)"/>
    <rect x="560" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <rect x="580" y="0" width="18" height="18" fill="var(--dg-stroke, #9AA0A6)"/>
    <rect x="600" y="0" width="18" height="18" fill="var(--dg-stroke, #9AA0A6)"/>
    <rect x="620" y="0" width="18" height="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  </g>
  <path d="M 280 96 L 280 108 L 380 108 L 380 96" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="330" y="126" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">free run of 5 blocks</text>
  <text x="330" y="150" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">usable for a 20KB file at 4KB/block</text>
</svg>
