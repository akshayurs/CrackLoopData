<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Journal commit timeline</text>

  <line x1="40" y1="120" x2="640" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="120" cy="120" r="5" fill="var(--dg-stroke, #9AA0A6)"/>
  <text x="120" y="150" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">1. Write to</text>
  <text x="120" y="164" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">journal (pending)</text>

  <circle cx="280" cy="120" r="5" fill="var(--dg-accent, #0C8F88)"/>
  <text x="280" y="150" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">2. Commit record</text>
  <text x="280" y="164" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">written (durable)</text>

  <circle cx="460" cy="120" r="5" fill="var(--dg-stroke, #9AA0A6)"/>
  <text x="460" y="150" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">3. Apply to real</text>
  <text x="460" y="164" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">structures (checkpoint)</text>

  <circle cx="600" cy="120" r="5" fill="var(--dg-stroke, #9AA0A6)"/>
  <text x="600" y="150" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">4. Journal space</text>
  <text x="600" y="164" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">reclaimed</text>

  <line x1="370" y1="60" x2="370" y2="190" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="370" y="46" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">crash here = safe</text>
  <text x="370" y="210" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">replay from commit record</text>
</svg>
