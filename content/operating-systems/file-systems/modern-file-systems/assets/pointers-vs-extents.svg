<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Block pointers vs extents</text>

  <text x="160" y="52" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Block pointers</text>
  <rect x="110" y="66" width="100" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="90" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">inode</text>
  <g stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)">
    <line x1="210" y1="76" x2="270" y2="150"/>
    <line x1="210" y1="80" x2="270" y2="170"/>
    <line x1="210" y1="86" x2="270" y2="190"/>
    <line x1="210" y1="92" x2="270" y2="210"/>
    <line x1="210" y1="98" x2="270" y2="230"/>
    <line x1="210" y1="104" x2="270" y2="250"/>
  </g>
  <g fill="none" stroke="var(--dg-stroke, #9AA0A6)">
    <rect x="270" y="140" width="50" height="20"/>
    <rect x="270" y="162" width="50" height="20"/>
    <rect x="270" y="184" width="50" height="20"/>
    <rect x="270" y="206" width="50" height="20"/>
    <rect x="270" y="228" width="50" height="20"/>
    <rect x="270" y="250" width="50" height="20"/>
  </g>
  <text x="295" y="284" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">8 separate pointers</text>

  <line x1="335" y1="20" x2="335" y2="290" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3,3"/>

  <text x="490" y="52" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Extents</text>
  <rect x="440" y="66" width="100" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="490" y="86" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">start: 4000</text>
  <text x="490" y="98" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">length: 8</text>

  <line x1="490" y1="106" x2="490" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="410" y="150" width="160" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="192" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">one contiguous run of 8 blocks</text>
</svg>
