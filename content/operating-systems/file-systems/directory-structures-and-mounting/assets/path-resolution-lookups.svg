<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Resolving /a/b/c.txt</text>

  <rect x="270" y="44" width="100" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="68" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">root</text>

  <line x1="320" y1="84" x2="180" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="230" y="105" font-size="11" fill="var(--dg-muted, #5F6368)">1: root's table -&gt; a's inode</text>

  <rect x="130" y="130" width="100" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="180" y="154" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">a</text>

  <rect x="290" y="130" width="180" height="46" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="380" y="144" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">a's table (name -&gt; inode)</text>
  <text x="380" y="158" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">b -&gt; inode 42</text>
  <text x="380" y="170" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">... -&gt; ...</text>

  <line x1="180" y1="170" x2="180" y2="216" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="230" y="196" font-size="11" fill="var(--dg-muted, #5F6368)">2: a's table -&gt; b's inode</text>

  <rect x="130" y="216" width="100" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="180" y="240" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">b</text>

  <rect x="290" y="216" width="180" height="46" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="380" y="230" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">b's table (name -&gt; inode)</text>
  <text x="380" y="244" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">c.txt -&gt; inode 91</text>
  <text x="380" y="256" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">... -&gt; ...</text>

  <line x1="180" y1="256" x2="180" y2="292" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="240" y="278" font-size="11" fill="var(--dg-muted, #5F6368)">3: b's table -&gt; c.txt's inode</text>

  <rect x="130" y="292" width="100" height="36" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="180" y="314" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">c.txt</text>
</svg>
