<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Indexed allocation</text>

  <rect x="20" y="120" width="90" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="65" y="145" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">directory</text>
  <line x1="110" y1="141" x2="150" y2="141" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="150" y="90" width="70" height="102" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="185" y="82" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Index Block</text>
  <text x="185" y="106" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">0 1 2 3</text>
  <text x="185" y="120" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">4 5 6 7</text>

  <!-- data blocks scattered -->
  <g font-size="10" fill="var(--dg-ink, #202124)">
    <rect x="320" y="20" width="60" height="34" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="350" y="41" text-anchor="middle">block 0</text>
    <line x1="220" y1="105" x2="320" y2="37" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

    <rect x="470" y="50" width="60" height="34" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="500" y="71" text-anchor="middle">block 3</text>
    <line x1="220" y1="112" x2="470" y2="67" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

    <rect x="320" y="100" width="60" height="34" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="350" y="121" text-anchor="middle">block 6</text>
    <line x1="220" y1="130" x2="320" y2="117" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

    <rect x="470" y="130" width="60" height="34" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="500" y="151" text-anchor="middle">block 2</text>
    <line x1="220" y1="137" x2="470" y2="147" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

    <rect x="320" y="180" width="60" height="34" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="350" y="201" text-anchor="middle">block 7</text>
    <line x1="220" y1="152" x2="320" y2="197" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

    <rect x="470" y="210" width="60" height="34" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="500" y="231" text-anchor="middle">block 5</text>
    <line x1="220" y1="160" x2="470" y2="227" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  </g>

  <text x="320" y="280" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Every arrow starts at the same index block — any entry resolves in one hop.</text>
</svg>
