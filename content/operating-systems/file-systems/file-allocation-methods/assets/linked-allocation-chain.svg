<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Linked allocation</text>

  <rect x="20" y="80" width="90" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="65" y="105" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">directory</text>

  <line x1="110" y1="101" x2="150" y2="101" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <g>
    <rect x="150" y="80" width="100" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="200" y="105" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Block 12</text>
  </g>
  <line x1="250" y1="101" x2="290" y2="101" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <g>
    <rect x="290" y="80" width="100" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="340" y="105" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Block 47</text>
  </g>
  <line x1="390" y1="101" x2="430" y2="101" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <g>
    <rect x="430" y="80" width="100" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="480" y="105" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Block 3</text>
  </g>
  <line x1="530" y1="101" x2="570" y2="101" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <g>
    <rect x="570" y="80" width="60" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="600" y="105" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Block 88</text>
  </g>

  <text x="320" y="160" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Directory stores only the first block; each block ends with a pointer to the next.</text>
</svg>
