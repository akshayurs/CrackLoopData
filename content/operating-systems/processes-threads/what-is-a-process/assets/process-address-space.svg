<svg viewBox="0 0 360 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="180" y="24" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Process address space</text>
  <text x="330" y="50" font-size="9" fill="var(--dg-muted, #5F6368)">high</text>
  <text x="330" y="360" font-size="9" fill="var(--dg-muted, #5F6368)">low</text>

  <rect x="70" y="50" width="180" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="160" y="80" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Stack</text>
  <line x1="160" y1="100" x2="160" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="200" y="112" font-size="8" fill="var(--dg-muted, #5F6368)">grows down</text>

  <rect x="70" y="150" width="180" height="80" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="2,3"/>
  <text x="160" y="194" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">unused gap</text>

  <line x1="160" y1="230" x2="160" y2="250" stroke="var(--dg-line, #5F6368)"/>
  <path d="M155,254 l5,-8 l5,8 z" fill="var(--dg-line, #5F6368)" transform="rotate(180 160 250)"/>

  <rect x="70" y="250" width="180" height="50" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="160" y="280" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Heap</text>
  <text x="200" y="245" font-size="8" fill="var(--dg-muted, #5F6368)">grows up</text>

  <rect x="70" y="304" width="180" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="160" y="324" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Data segment</text>

  <rect x="70" y="338" width="180" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="160" y="358" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Text segment (code)</text>
</svg>
