<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="310" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Process state transitions</text>

  <rect x="30" y="130" width="80" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="70" y="151" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">New</text>

  <rect x="160" y="130" width="80" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="200" y="151" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Ready</text>

  <rect x="290" y="130" width="80" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="330" y="151" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Running</text>

  <rect x="290" y="220" width="80" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="330" y="241" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Waiting</text>

  <rect x="470" y="130" width="90" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="515" y="151" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Terminated</text>

  <line x1="110" y1="147" x2="155" y2="147" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="132" y="140" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">admitted</text>

  <line x1="240" y1="140" x2="285" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="262" y="132" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">dispatch</text>

  <line x1="285" y1="155" x2="240" y2="155" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="262" y="172" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">preempted</text>

  <line x1="330" y1="164" x2="330" y2="216" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="345" y="192" font-size="7" fill="var(--dg-muted, #5F6368)">I/O wait</text>

  <line x1="290" y1="230" x2="200" y2="168" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="225" y="200" font-size="7" fill="var(--dg-muted, #5F6368)">I/O done</text>

  <line x1="370" y1="147" x2="465" y2="147" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="418" y="140" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">exit</text>

  <text x="310" y="290" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">No direct Waiting -&gt; Running arrow</text>
  <text x="310" y="308" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">a waking process always passes back through Ready</text>
</svg>
