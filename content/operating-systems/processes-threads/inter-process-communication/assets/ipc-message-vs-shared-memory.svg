<svg viewBox="0 0 660 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="165" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Message passing</text>
  <text x="495" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Shared memory</text>

  <rect x="45" y="50" width="70" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="80" y="71" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Process A</text>

  <rect x="145" y="50" width="80" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="185" y="71" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Kernel buf</text>

  <rect x="245" y="50" width="70" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="280" y="71" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Process B</text>

  <line x1="115" y1="67" x2="145" y2="67" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="130" y="55" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">copy 1</text>
  <line x1="225" y1="67" x2="245" y2="67" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="235" y="55" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">copy 2</text>

  <text x="165" y="110" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">two copies per message</text>

  <rect x="415" y="50" width="70" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="450" y="71" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Process A</text>

  <rect x="565" y="50" width="70" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="600" y="71" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Process B</text>

  <rect x="475" y="105" width="100" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="525" y="126" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Shared region</text>

  <line x1="450" y1="84" x2="500" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="600" y1="84" x2="550" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="525" y="164" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">zero copies after setup</text>

  <text x="330" y="220" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Copy count is the whole story</text>
  <text x="330" y="238" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">shared memory trades kernel mediation for raw speed</text>
</svg>
