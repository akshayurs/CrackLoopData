<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="150" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Single-threaded</text>
  <text x="450" y="24" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Multi-threaded (3 threads)</text>

  <rect x="60" y="40" width="180" height="230" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="75" y="52" width="150" height="30" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="150" y="71" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Code segment</text>
  <rect x="75" y="90" width="150" height="30" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="150" y="109" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Heap</text>
  <rect x="75" y="200" width="150" height="55" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="150" y="230" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Stack</text>

  <rect x="330" y="40" width="230" height="230" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="345" y="52" width="200" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="445" y="69" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Code segment (shared)</text>
  <rect x="345" y="84" width="200" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="445" y="101" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Heap (shared)</text>

  <rect x="345" y="130" width="58" height="130" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="374" y="150" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Stack T1</text>
  <rect x="416" y="130" width="58" height="130" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="445" y="150" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Stack T2</text>
  <rect x="487" y="130" width="58" height="130" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="516" y="150" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">Stack T3</text>

  <text x="300" y="292" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">code and heap stay the same size — only stacks multiply, one per thread</text>
</svg>
