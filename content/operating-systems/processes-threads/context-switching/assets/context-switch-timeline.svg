<svg viewBox="0 0 660 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="330" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Context switch timeline</text>

  <rect x="30" y="70" width="130" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="94" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Process A runs</text>

  <rect x="160" y="70" width="90" height="40" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="205" y="88" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">save A -&gt; PCB</text>
  <text x="205" y="100" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">load B &lt;- PCB</text>

  <rect x="250" y="70" width="130" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="315" y="94" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Process B runs</text>

  <rect x="380" y="70" width="120" height="40" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="440" y="88" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">save B -&gt; PCB</text>
  <text x="440" y="100" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">load A &lt;- PCB</text>
  <text x="440" y="60" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">page tables reloaded too</text>

  <rect x="500" y="70" width="130" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="565" y="94" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Process A runs</text>

  <text x="330" y="150" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Shaded blocks are pure overhead</text>
  <text x="330" y="168" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">no user-visible work happens during a switch</text>
</svg>
