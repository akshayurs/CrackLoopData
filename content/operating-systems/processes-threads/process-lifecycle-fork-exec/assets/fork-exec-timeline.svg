<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">fork() / exec() / wait()</text>

  <text x="60" y="60" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Parent</text>
  <line x1="100" y1="70" x2="600" y2="70" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <text x="60" y="180" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Child</text>
  <line x1="100" y1="170" x2="450" y2="170" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <circle cx="150" cy="70" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <text x="150" y="55" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">fork()</text>
  <line x1="150" y1="74" x2="150" y2="166" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3,3"/>

  <rect x="270" y="55" width="110" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="325" y="74" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">wait() blocked</text>

  <circle cx="200" cy="170" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <text x="200" y="160" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">exec()</text>

  <rect x="230" y="155" width="90" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="275" y="174" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">new program</text>

  <circle cx="420" cy="170" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <text x="420" y="160" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">exit()</text>

  <line x1="420" y1="166" x2="380" y2="90" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="440" y="120" font-size="8" fill="var(--dg-muted, #5F6368)">status returned</text>

  <text x="500" y="70" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">parent resumes</text>

  <text x="320" y="220" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Parent resumes only after the child's exit status arrives</text>
  <text x="320" y="238" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">everything in between is invisible to the parent</text>
</svg>
