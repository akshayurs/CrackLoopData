<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Progressive rollout: gated steps</text>

  <g font-size="12" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">
    <rect x="10" y="60" width="90" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="55" y="83">1%</text>
    <rect x="180" y="60" width="90" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="225" y="83">10%</text>
    <rect x="350" y="60" width="90" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="395" y="83">50%</text>
    <rect x="520" y="60" width="90" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="565" y="83">100%</text>
  </g>

  <g fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5">
    <rect x="122" y="65" width="26" height="26" transform="rotate(45 135 78)"/>
    <rect x="292" y="65" width="26" height="26" transform="rotate(45 305 78)"/>
    <rect x="462" y="65" width="26" height="26" transform="rotate(45 475 78)"/>
  </g>
  <g font-size="9" text-anchor="middle" fill="var(--dg-accent, #0C8F88)">
    <text x="135" y="112">gate</text>
    <text x="305" y="112">gate</text>
    <text x="475" y="112">gate</text>
  </g>

  <line x1="100" y1="78" x2="121" y2="78" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="149" y1="78" x2="178" y2="78" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="270" y1="78" x2="291" y2="78" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="319" y1="78" x2="348" y2="78" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="440" y1="78" x2="461" y2="78" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="489" y1="78" x2="518" y2="78" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <path d="M135 92 C 135 160, 55 160, 55 98" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M305 92 C 305 190, 55 190, 55 98" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M475 92 C 475 210, 55 210, 55 98" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="320" y="225" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">any gate can halt / roll back to 0%</text>
</svg>
