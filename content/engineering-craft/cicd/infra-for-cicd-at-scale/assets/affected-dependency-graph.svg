<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Affected-package graph (changed → dependents)</text>

  <rect x="270" y="230" width="120" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="330" y="248" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">shared-utils</text>
  <text x="330" y="262" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">changed</text>

  <rect x="120" y="150" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="180" y="168" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">checkout-service</text>
  <text x="180" y="182" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">affected — tests run</text>

  <rect x="270" y="150" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="330" y="168" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">payments-service</text>
  <text x="330" y="182" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">affected — tests run</text>

  <rect x="420" y="150" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="480" y="168" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">auth-lib</text>
  <text x="480" y="182" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">affected — tests run</text>

  <rect x="60" y="70" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="120" y="94" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">checkout-web</text>
  <text x="120" y="106" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">affected</text>

  <rect x="480" y="70" width="120" height="40" rx="6" fill="var(--dg-line, #5F6368)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" opacity="0.35"/>
  <text x="540" y="94" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">notifications-lib</text>
  <text x="540" y="106" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">unrelated — skipped</text>

  <line x1="180" y1="150" x2="330" y2="230" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="150" x2="330" y2="230" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="150" x2="360" y2="230" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="110" x2="175" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="110" x2="480" y2="150" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.5"/>

  <text x="320" y="300" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Walk arrows backward from the changed node to find every affected dependent.</text>
</svg>
