<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Canary: a small slice first</text>

  <line x1="30" y1="80" x2="150" y2="80" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="90" y="68" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">100% traffic</text>

  <path d="M150 60 L150 100 L300 82 L300 78 Z" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="300" y="60" width="160" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="380" y="84" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">v1 (stable) — 99%</text>

  <path d="M150 100 L150 60 L165 100 Z" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <line x1="150" y1="95" x2="300" y2="130" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="112" width="160" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="380" y="136" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">v2 (canary) — 1%</text>
  <circle cx="475" cy="132" r="7" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="475" y="136" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">M</text>

  <text x="320" y="180" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Split widens over time as metrics stay healthy</text>
  <g font-size="12" text-anchor="middle" fill="var(--dg-ink, #202124)">
    <text x="90" y="220">1%</text>
    <text x="240" y="220">→ 5%</text>
    <text x="390" y="220">→ 25%</text>
    <text x="540" y="220">→ 100%</text>
  </g>
  <line x1="30" y1="215" x2="600" y2="215" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
