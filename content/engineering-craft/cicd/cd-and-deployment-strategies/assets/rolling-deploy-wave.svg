<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Rolling deploy: batch by batch</text>

  <rect x="240" y="46" width="160" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="68" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Load balancer</text>
  <line x1="320" y1="80" x2="320" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <g font-size="11" text-anchor="middle" fill="var(--dg-ink, #202124)">
    <rect x="40" y="110" width="80" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="80" y="134">v2</text>
    <rect x="130" y="110" width="80" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="170" y="134">v2</text>

    <rect x="220" y="110" width="80" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="260" y="134">v1</text>
    <rect x="310" y="110" width="80" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="350" y="134">v1</text>

    <rect x="400" y="110" width="80" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="440" y="134">v1</text>
    <rect x="490" y="110" width="80" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="530" y="134">v1</text>
  </g>

  <path d="M220 106 L400 106" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="310" y="98" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">wave sweeps left to right, 2 servers at a time</text>

  <text x="80" y="176" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">batch 1: done</text>
  <text x="260" y="176" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">batch 2: next</text>
  <text x="440" y="176" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">batch 3: waiting</text>

  <text x="320" y="216" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Mid-rollout, the LB routes to a mix of v1 and v2 — both versions must be compatible.</text>
</svg>
