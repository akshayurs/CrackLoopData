<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Blue-green: before the switch</text>

  <rect x="60" y="70" width="180" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="150" y="96" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Blue (live)</text>
  <text x="150" y="114" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">current version</text>

  <rect x="400" y="70" width="180" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="96" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Green (idle)</text>
  <text x="490" y="114" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">new version</text>

  <rect x="280" y="85" width="80" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="104" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Router</text>

  <line x1="360" y1="100" x2="242" y2="100" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrowA)"/>
  <text x="320" y="140" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">all traffic → Blue</text>

  <text x="320" y="176" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">After the switch</text>
  <rect x="60" y="188" width="180" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="216" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Blue (idle)</text>
  <rect x="400" y="188" width="180" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="490" y="216" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Green (live)</text>
  <line x1="280" y1="211" x2="398" y2="211" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrowA)"/>
</svg>
