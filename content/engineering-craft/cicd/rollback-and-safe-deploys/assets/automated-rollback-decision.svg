<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Metric-driven rollback decision</text>

  <rect x="10" y="60" width="120" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="80" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Deploy new</text>
  <text x="70" y="93" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">small % of traffic</text>

  <rect x="170" y="60" width="130" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="235" y="80" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Monitor metrics</text>
  <text x="235" y="93" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">5-minute window</text>

  <rect x="340" y="52" width="24" height="24" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" transform="rotate(45 385 81)"/>
  <text x="385" y="60" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">within</text>
  <text x="385" y="72" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">threshold?</text>

  <line x1="130" y1="81" x2="168" y2="81" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="300" y1="81" x2="355" y2="81" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="470" y="60" width="140" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="540" y="80" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Increase rollout %</text>
  <text x="540" y="93" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">Yes</text>
  <line x1="410" y1="81" x2="468" y2="81" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="300" y="170" width="160" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="380" y="190" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Automatic rollback</text>
  <text x="380" y="203" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">No</text>
  <line x1="385" y1="105" x2="385" y2="168" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <path d="M300 191 C 200 191, 130 150, 130 105" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="180" y="230" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">routes back to prior stable version</text>

  <circle cx="600" cy="191" r="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="600" y="196" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">🔔</text>
  <line x1="460" y1="191" x2="584" y2="191" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="600" y="216" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">notify on-call</text>
</svg>
