<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">From push to PR status badge</text>

  <g font-size="12" text-anchor="middle" fill="var(--dg-ink, #202124)">
    <rect x="20" y="60" width="120" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="80" y="86">Push commit</text>

    <rect x="180" y="60" width="130" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="245" y="82">Build</text>
    <text x="245" y="96" font-size="10" fill="var(--dg-muted, #5F6368)">clean environment</text>

    <rect x="350" y="60" width="120" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="410" y="86">Run tests</text>

    <rect x="510" y="60" width="110" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="565" y="82">Report status</text>
    <text x="565" y="96" font-size="10" fill="var(--dg-muted, #5F6368)">to PR</text>
  </g>

  <line x1="140" y1="81" x2="178" y2="81" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="310" y1="81" x2="348" y2="81" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="470" y1="81" x2="508" y2="81" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <path d="M565 102 C 565 140, 490 140, 460 140" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="440" cy="140" r="12" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="440" y="145" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)">✓/✗</text>
  <text x="440" y="172" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">badge next to the merge button</text>
</svg>
