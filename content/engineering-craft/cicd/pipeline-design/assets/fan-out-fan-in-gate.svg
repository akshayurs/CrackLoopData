<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Fan out to 8 shards, fan in to one gate</text>

  <rect x="270" y="34" width="100" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="56" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Build</text>

  <g font-size="9" text-anchor="middle" fill="var(--dg-ink, #202124)">
    <!-- 8 shard boxes -->
    <rect x="10" y="110" width="66" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/><text x="43" y="129">shard 1</text>
    <rect x="86" y="110" width="66" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/><text x="119" y="129">shard 2</text>
    <rect x="162" y="110" width="66" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/><text x="195" y="129">shard 3</text>
    <rect x="238" y="110" width="66" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/><text x="271" y="129">shard 4</text>
    <rect x="314" y="110" width="66" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/><text x="347" y="129">shard 5</text>
    <rect x="390" y="110" width="66" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/><text x="423" y="129">shard 6</text>
    <rect x="466" y="110" width="66" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/><text x="499" y="129">shard 7</text>
    <rect x="542" y="110" width="66" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/><text x="575" y="129">shard 8</text>
  </g>

  <g stroke="var(--dg-line, #5F6368)" stroke-width="1">
    <line x1="320" y1="70" x2="43" y2="110" marker-end="url(#arrow)"/>
    <line x1="320" y1="70" x2="119" y2="110" marker-end="url(#arrow)"/>
    <line x1="320" y1="70" x2="195" y2="110" marker-end="url(#arrow)"/>
    <line x1="320" y1="70" x2="271" y2="110" marker-end="url(#arrow)"/>
    <line x1="320" y1="70" x2="347" y2="110" marker-end="url(#arrow)"/>
    <line x1="320" y1="70" x2="423" y2="110" marker-end="url(#arrow)"/>
    <line x1="320" y1="70" x2="499" y2="110" marker-end="url(#arrow)"/>
    <line x1="320" y1="70" x2="575" y2="110" marker-end="url(#arrow)"/>
  </g>

  <g stroke="var(--dg-accent, #0C8F88)" stroke-width="1">
    <line x1="43" y1="140" x2="320" y2="190" marker-end="url(#arrow)"/>
    <line x1="119" y1="140" x2="320" y2="190" marker-end="url(#arrow)"/>
    <line x1="195" y1="140" x2="320" y2="190" marker-end="url(#arrow)"/>
    <line x1="271" y1="140" x2="320" y2="190" marker-end="url(#arrow)"/>
    <line x1="347" y1="140" x2="320" y2="190" marker-end="url(#arrow)"/>
    <line x1="423" y1="140" x2="320" y2="190" marker-end="url(#arrow)"/>
    <line x1="499" y1="140" x2="320" y2="190" marker-end="url(#arrow)"/>
    <line x1="575" y1="140" x2="320" y2="190" marker-end="url(#arrow)"/>
  </g>

  <rect x="240" y="192" width="160" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="212" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Deploy gate</text>
  <text x="320" y="227" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">needs all 8 to succeed</text>
</svg>
