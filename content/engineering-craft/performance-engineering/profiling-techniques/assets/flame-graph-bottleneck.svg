<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Flame graph: wide, not deep</text>

  <rect x="20" y="210" width="600" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <rect x="20" y="184" width="240" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <rect x="280" y="184" width="300" height="24" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="430" y="200" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">wide bar — the bottleneck</text>

  <rect x="280" y="158" width="0" height="24" fill="none"/>
  <text x="430" y="150" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">no wide children above it</text>

  <rect x="60" y="158" width="40" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <rect x="65" y="132" width="30" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <rect x="68" y="106" width="24" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <rect x="70" y="80" width="20" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <rect x="72" y="54" width="16" height="24" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="150" y="70" font-size="9" fill="var(--dg-muted, #5F6368)">deep call chain — none of</text>
  <text x="150" y="82" font-size="9" fill="var(--dg-muted, #5F6368)">these narrow bars matter individually</text>

  <text x="320" y="252" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">x-axis: time  ·  y-axis: call stack depth</text>
</svg>
