<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Overall latency = slowest of ten</text>

  <g font-size="9" fill="var(--dg-ink, #202124)">
    <rect x="60" y="40" width="150" height="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <rect x="60" y="60" width="160" height="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <rect x="60" y="80" width="140" height="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <rect x="60" y="100" width="155" height="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <rect x="60" y="120" width="145" height="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <rect x="60" y="140" width="500" height="14" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <rect x="60" y="160" width="150" height="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <rect x="60" y="180" width="160" height="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <rect x="60" y="200" width="148" height="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <rect x="60" y="220" width="152" height="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  </g>
  <text x="565" y="152" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">slowest call</text>

  <line x1="560" y1="30" x2="560" y2="240" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="320" y="255" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">the response can only assemble once the longest bar finishes.</text>
</svg>
