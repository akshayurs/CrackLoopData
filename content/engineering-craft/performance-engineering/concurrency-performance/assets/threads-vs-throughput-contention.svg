<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">More threads, then less throughput</text>

  <line x1="50" y1="210" x2="590" y2="210" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <line x1="50" y1="210" x2="50" y2="40" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="235" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">number of threads</text>
  <text x="25" y="120" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" transform="rotate(-90 25 120)">throughput</text>

  <path d="M50 195 C 150 110, 220 70, 300 65 C 360 62, 420 90, 590 170" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.2"/>
  <line x1="300" y1="40" x2="300" y2="210" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="300" y="228" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">contention point</text>

  <text x="470" y="150" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">more threads now hurt, not help</text>
</svg>
