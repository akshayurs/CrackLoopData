<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A GC pause freezes every thread</text>

  <line x1="40" y1="190" x2="600" y2="190" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <path d="M40 175 L320 175 L340 50 L360 175 L600 175" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="340" y="40" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="600">GC pause</text>

  <rect x="380" y="90" width="220" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="490" y="108" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-family="monospace">GC log: pause=48ms</text>
  <text x="490" y="122" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)" font-family="monospace">ts=14:02:11.340</text>
  <line x1="380" y1="115" x2="340" y2="70" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 2"/>

  <text x="320" y="220" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">every thread froze, not just this request</text>
</svg>
