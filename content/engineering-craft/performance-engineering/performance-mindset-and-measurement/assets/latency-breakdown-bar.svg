<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">One request's total latency, broken down</text>

  <g font-size="9" text-anchor="middle" fill="var(--dg-ink, #202124)">
    <rect x="20" y="60" width="40" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="40" y="115">DNS/TLS</text>
    <rect x="60" y="60" width="30" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="75" y="115">LB queue</text>
    <rect x="90" y="60" width="60" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="120" y="115">app code</text>
    <rect x="150" y="60" width="380" height="40" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.8"/>
    <text x="340" y="85" font-size="12" font-weight="600">DB query</text>
    <rect x="530" y="60" width="50" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="555" y="115">downstream</text>
    <rect x="580" y="60" width="20" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="590" y="115" font-size="7">net</text>
  </g>

  <text x="340" y="145" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">this is the one worth optimizing</text>
</svg>
