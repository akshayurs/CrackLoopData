<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The knee: throughput plateaus, latency spikes</text>

  <line x1="50" y1="210" x2="590" y2="210" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <line x1="50" y1="210" x2="50" y2="40" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="235" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">offered load</text>

  <path d="M50 190 C 200 100, 280 70, 590 65" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="560" y="55" font-size="10" fill="var(--dg-accent, #0C8F88)">throughput</text>

  <path d="M50 195 C 250 195, 300 190, 340 120 C 380 60, 450 45, 590 40" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="2"/>
  <text x="530" y="35" font-size="10" fill="var(--dg-ink, #202124)">latency</text>

  <line x1="340" y1="40" x2="340" y2="210" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="340" y="228" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">the knee</text>

  <rect x="340" y="40" width="250" height="170" fill="var(--dg-accent-bg, #E3F3F1)" opacity="0.4"/>
  <text x="465" y="55" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">technically still up, but</text>
  <text x="465" y="67" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">SLO already broken</text>
</svg>
