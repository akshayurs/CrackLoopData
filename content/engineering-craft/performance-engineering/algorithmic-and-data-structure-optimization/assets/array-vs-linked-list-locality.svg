<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Same O(n), very different reality</text>

  <text x="160" y="48" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Array — contiguous</text>
  <g>
    <rect x="30" y="60" width="40" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.2"/>
    <rect x="70" y="60" width="40" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.2"/>
    <rect x="110" y="60" width="40" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.2"/>
    <rect x="150" y="60" width="40" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <rect x="190" y="60" width="40" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <rect x="230" y="60" width="40" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  </g>
  <rect x="28" y="58" width="124" height="38" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="150" y="112" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">cache-line window slides smoothly</text>
  <text x="150" y="126" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">prefetcher predicts this</text>

  <text x="470" y="48" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Linked list — scattered</text>
  <circle cx="380" cy="80" r="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <circle cx="470" cy="140" r="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <circle cx="420" cy="60" r="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <circle cx="550" cy="90" r="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <line x1="380" y1="80" x2="420" y2="60" stroke="var(--dg-line, #5F6368)" stroke-width="1.3"/>
  <line x1="420" y1="60" x2="470" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.3"/>
  <line x1="470" y1="140" x2="550" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.3"/>
  <text x="400" y="70" font-size="8" fill="var(--dg-accent, #0C8F88)">miss ~100ns</text>
  <text x="440" y="105" font-size="8" fill="var(--dg-accent, #0C8F88)">miss ~100ns</text>
  <text x="510" y="120" font-size="8" fill="var(--dg-accent, #0C8F88)">miss ~100ns</text>

  <text x="320" y="200" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Random heap addresses turn each hop into a cache miss the prefetcher can't predict.</text>
</svg>
