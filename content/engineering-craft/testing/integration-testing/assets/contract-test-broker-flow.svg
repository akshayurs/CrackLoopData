<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Consumer-driven contract testing</text>

  <rect x="20" y="60" width="170" height="54" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="82" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Consumer tests</text>
  <text x="105" y="98" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">run against mock provider</text>

  <rect x="235" y="60" width="170" height="54" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="82" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Contract broker</text>
  <text x="320" y="98" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">publishes the contract</text>

  <rect x="450" y="60" width="170" height="54" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="535" y="82" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Provider CI</text>
  <text x="535" y="98" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">replays contracts on real impl</text>

  <line x1="190" y1="87" x2="233" y2="87" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="405" y1="87" x2="448" y2="87" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="320" y="160" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">If a contract doesn't match, the provider's build fails —</text>
  <text x="320" y="178" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">before the mismatch reaches production.</text>
</svg>
