  <text x="320" y="73" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Unit under test</text>

  <line x1="320" y1="91" x2="320" y2="118" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

