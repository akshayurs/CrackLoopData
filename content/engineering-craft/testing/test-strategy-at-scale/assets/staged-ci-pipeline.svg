<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Staged CI: short-circuit early, parallelize the rest</text>

  <rect x="20" y="50" width="130" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="85" y="70" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">1. Lint + unit</text>
  <text x="85" y="83" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">&lt;2 min, blocks on fail</text>

  <rect x="190" y="30" width="170" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="275" y="50" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">2. Integration (sharded)</text>
  <text x="275" y="63" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">2-8 min</text>

  <rect x="190" y="90" width="170" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="275" y="110" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">3. Contract verify</text>
  <text x="275" y="123" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">concurrent with stage 2</text>

  <rect x="400" y="50" width="170" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="485" y="72" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">4. E2E smoke</text>
  <text x="485" y="86" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">5-15 min</text>
  <text x="485" y="98" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">gates deploy, not merge</text>

  <g stroke="var(--dg-line, #5F6368)" stroke-width="1.3">
    <line x1="150" y1="55" x2="188" y2="50" marker-end="url(#arrow)"/>
    <line x1="150" y1="80" x2="188" y2="105" marker-end="url(#arrow)"/>
    <line x1="360" y1="55" x2="398" y2="70" marker-end="url(#arrow)"/>
    <line x1="360" y1="115" x2="398" y2="90" marker-end="url(#arrow)"/>
  </g>

  <path d="M85 100 C 85 170, 300 170, 300 200" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="300" y="218" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">Stage 1 failure short-circuits before later stages start</text>
</svg>
