<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The test pyramid</text>

  <polygon points="320,50 380,110 260,110" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="95" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">E2E</text>

  <polygon points="260,110 380,110 430,175 210,175" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="150" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Integration</text>

  <polygon points="210,175 430,175 490,240 150,240" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="215" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Unit</text>

  <text x="520" y="70" font-size="10" fill="var(--dg-muted, #5F6368)">slow, expensive</text>
  <text x="520" y="230" font-size="10" fill="var(--dg-muted, #5F6368)">fast, cheap</text>
  <line x1="510" y1="60" x2="510" y2="230" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-stroke, #9AA0A6)"/>
    </marker>
  </defs>
  <text x="530" y="150" font-size="9" fill="var(--dg-muted, #5F6368)" transform="rotate(90 530 150)">speed / cost ↑</text>

  <text x="320" y="265" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Band width represents test count — many unit tests, few E2E.</text>
</svg>
