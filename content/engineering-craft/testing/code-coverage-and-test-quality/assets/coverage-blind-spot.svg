<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Coverage can't tell these tests apart</text>

  <rect x="120" y="90" width="400" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="110" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-family="monospace">return computeDiscount(order);</text>
  <text x="320" y="75" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="600">covered: 100%</text>

  <rect x="30" y="150" width="200" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="130" y="170" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Test A</text>
  <text x="130" y="184" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">calls it, asserts exact return</text>
  <line x1="150" y1="150" x2="250" y2="120" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>

  <rect x="410" y="150" width="200" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="510" y="170" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Test B</text>
  <text x="510" y="184" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">calls it, asserts nothing</text>
  <line x1="490" y1="150" x2="390" y2="120" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>

  <text x="320" y="225" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Both point to the identical green highlight — the report cannot tell them apart.</text>
</svg>
