<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Chosen vs. rejected: how the service publishes events</text>

  <rect x="240" y="60" width="160" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="87" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Service</text>

  <rect x="60" y="150" width="160" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.8"/>
  <text x="140" y="177" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Postgres outbox table</text>
  <text x="140" y="130" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="600">chosen: outbox + poller</text>
  <line x1="280" y1="106" x2="160" y2="148" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="60" y="220" font-size="9" fill="var(--dg-muted, #5F6368)">reuses existing Postgres HA setup</text>

  <rect x="420" y="150" width="160" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="177" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Kafka broker</text>
  <text x="500" y="130" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">rejected: direct produce</text>
  <line x1="360" y1="106" x2="470" y2="148" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="220" font-size="9" fill="var(--dg-muted, #5F6368)">couples write path to broker availability</text>
</svg>
