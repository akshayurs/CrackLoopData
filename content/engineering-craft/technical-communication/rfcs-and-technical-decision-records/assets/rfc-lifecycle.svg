<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">RFC / decision-record lifecycle</text>

  <g font-size="10" text-anchor="middle" fill="var(--dg-ink, #202124)">
    <rect x="10" y="45" width="100" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
    <text x="60" y="69">Draft</text>

    <rect x="130" y="45" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
    <text x="200" y="63">Open for comment</text>
    <text x="200" y="76" font-size="7" fill="var(--dg-muted, #5F6368)">deadline, named reviewers</text>

    <rect x="290" y="45" width="130" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.2"/>
    <text x="355" y="63">Decision</text>
    <text x="355" y="76" font-size="7" fill="var(--dg-accent, #0C8F88)">one named resolver</text>

    <rect x="440" y="45" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
    <text x="510" y="63">Archived record</text>
    <text x="510" y="76" font-size="7" fill="var(--dg-muted, #5F6368)">ADR frozen, read-only</text>
  </g>

  <g stroke="var(--dg-line, #5F6368)" stroke-width="1.3">
    <line x1="110" y1="65" x2="128" y2="65" marker-end="url(#arrow)"/>
    <line x1="270" y1="65" x2="288" y2="65" marker-end="url(#arrow)"/>
    <line x1="420" y1="65" x2="438" y2="65" marker-end="url(#arrow)"/>
  </g>

  <rect x="440" y="150" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="510" y="174" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Superseded</text>
  <path d="M510 150 C 510 110, 510 95, 510 87" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="600" y="130" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">new ADR replaces it,</text>
  <text x="600" y="142" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">old one kept</text>

  <path d="M355 85 C 355 130, 240 140, 200 140" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="230" y="155" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">rejected</text>
</svg>
