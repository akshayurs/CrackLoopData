<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The scope ladder</text>

  <rect x="180" y="260" width="280" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="280" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">IC task</text>
  <text x="320" y="296" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">affects: one person (you)</text>

  <rect x="150" y="200" width="340" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="220" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Project</text>
  <text x="320" y="236" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">affects: your immediate team</text>

  <rect x="110" y="140" width="420" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="160" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Cross-team initiative</text>
  <text x="320" y="176" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">affects: multiple teams</text>

  <rect x="70" y="80" width="500" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="100" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Org-wide impact</text>
  <text x="320" y="116" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">affects: the whole org / company</text>

  <text x="320" y="326" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each rung up affects roughly an order of magnitude more people.</text>
</svg>
