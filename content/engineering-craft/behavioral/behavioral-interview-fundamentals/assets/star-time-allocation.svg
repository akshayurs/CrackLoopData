<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Where 90 seconds of STAR should go</text>

  <rect x="40" y="70" width="35" height="46" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="75" y="70" width="25" height="46" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <rect x="100" y="70" width="400" height="46" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <rect x="500" y="70" width="100" height="46" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <text x="57" y="150" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Situation</text>
  <text x="57" y="166" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">~8s</text>

  <text x="87" y="150" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Task</text>
  <text x="87" y="166" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">~5s</text>

  <text x="300" y="150" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Action</text>
  <text x="300" y="168" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">~60s — roughly two-thirds of the answer</text>

  <text x="550" y="150" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Result</text>
  <text x="550" y="166" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">~17s</text>

  <text x="320" y="200" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Weak answers invert this — long Situation, almost no Action, rushed Result.</text>
</svg>
