<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Two contexts, two Customer models</text>

  <rect x="30" y="60" width="240" height="130" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="84" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Sales Context</text>
  <rect x="55" y="98" width="190" height="70" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.2"/>
  <text x="150" y="118" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Customer</text>
  <text x="150" y="136" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">dealStage</text>
  <text x="150" y="150" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">salesRep</text>

  <rect x="370" y="60" width="240" height="130" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="84" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Billing Context</text>
  <rect x="395" y="98" width="190" height="70" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.2"/>
  <text x="490" y="118" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Customer</text>
  <text x="490" y="136" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">paymentMethod</text>
  <text x="490" y="150" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">invoiceHistory</text>

  <line x1="270" y1="125" x2="368" y2="125" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="320" cy="125" r="13" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="129" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)">⚙</text>
  <text x="320" y="205" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">upstream → downstream</text>
  <text x="320" y="220" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">anti-corruption layer translates between models</text>
</svg>
