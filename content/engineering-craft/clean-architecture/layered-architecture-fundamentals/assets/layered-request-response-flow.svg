<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Request down, response up</text>

  <rect x="160" y="50" width="320" height="54" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="82" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Presentation</text>

  <rect x="160" y="120" width="320" height="54" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="152" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Business / Domain Logic</text>

  <rect x="160" y="190" width="320" height="54" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="222" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Data Access</text>

  <line x1="200" y1="104" x2="200" y2="118" stroke="var(--dg-line, #5F6368)" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="200" y1="174" x2="200" y2="188" stroke="var(--dg-line, #5F6368)" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="140" y="145" font-size="10" fill="var(--dg-muted, #5F6368)">request</text>

  <line x1="440" y1="188" x2="440" y2="174" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.8" marker-end="url(#arrowA)"/>
  <line x1="440" y1="118" x2="440" y2="104" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.8" marker-end="url(#arrowA)"/>
  <text x="500" y="145" font-size="10" fill="var(--dg-accent, #0C8F88)">response</text>

  <line x1="160" y1="217" x2="90" y2="217" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="90" y1="217" x2="90" y2="77" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="90" y1="77" x2="158" y2="77" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="70" y1="140" x2="110" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="1.8"/>
  <line x1="70" y1="160" x2="110" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.8"/>
  <text x="60" y="260" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">not allowed:</text>
  <text x="60" y="273" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Data → Presentation</text>
</svg>
