<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Ports and adapters</text>

  <polygon points="320,60 400,100 400,180 320,220 240,180 240,100" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="320" y="135" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Application</text>
  <text x="320" y="150" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Core</text>
  <text x="320" y="240" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">hexagon boundary = ports</text>

  <text x="120" y="55" font-size="11" fill="var(--dg-muted, #5F6368)">driving adapters</text>
  <rect x="20" y="70" width="140" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="90" y="90" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">REST Controller</text>
  <rect x="20" y="115" width="140" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="90" y="135" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">CLI</text>
  <rect x="20" y="160" width="140" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="90" y="180" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Scheduled Job</text>

  <line x1="160" y1="85" x2="238" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="160" y1="130" x2="238" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="160" y1="175" x2="238" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="530" y="55" font-size="11" fill="var(--dg-muted, #5F6368)">driven adapters</text>
  <rect x="480" y="70" width="150" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="555" y="90" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Postgres Repository</text>
  <rect x="480" y="115" width="150" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="555" y="135" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">SMTP Email Adapter</text>
  <rect x="480" y="160" width="150" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="555" y="180" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Stripe Payment Adapter</text>

  <line x1="402" y1="100" x2="478" y2="85" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="402" y1="130" x2="478" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="402" y1="160" x2="478" y2="175" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="320" y="290" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Adapters plug into the core through ports — the core never depends on a specific adapter.</text>
</svg>
