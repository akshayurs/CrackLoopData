<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The Dependency Rule</text>

  <circle cx="320" cy="175" r="140" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="320" cy="175" r="105" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" opacity="0.6"/>
  <circle cx="320" cy="175" r="70" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="320" cy="175" r="36" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>

  <text x="320" y="179" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Entities</text>
  <text x="320" y="115" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Use Cases</text>
  <text x="320" y="80" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Interface Adapters</text>
  <text x="320" y="45" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Frameworks &amp; Drivers</text>

  <line x1="480" y1="70" x2="356" y2="175" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="55" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="600">Dependency Rule:</text>
  <text x="470" y="290" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">source code dependencies point only inward</text>
</svg>
