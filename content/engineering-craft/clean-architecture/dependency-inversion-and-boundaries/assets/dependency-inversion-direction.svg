<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Compile-time vs. runtime direction</text>

  <rect x="190" y="60" width="260" height="110" rx="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Domain (core)</text>
  <rect x="215" y="92" width="210" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="320" y="112" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">interface OrderRepository</text>
  <text x="320" y="128" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">save()</text>
  <text x="320" y="142" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">findById()</text>

  <rect x="40" y="220" width="220" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="248" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">PostgresOrderRepository</text>
  <text x="150" y="208" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">infrastructure</text>

  <line x1="220" y1="220" x2="290" y2="172" stroke="var(--dg-line, #5F6368)" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="270" y="200" font-size="10" fill="var(--dg-ink, #202124)">implements</text>

  <path d="M400 160 C 460 190, 460 220, 340 245" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrowA)"/>
  <text x="470" y="215" font-size="10" fill="var(--dg-accent, #0C8F88)">calls at runtime</text>

  <text x="320" y="290" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Source dependency points inward (implements); the runtime call points outward.</text>
</svg>
