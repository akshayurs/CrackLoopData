  <rect x="340" y="160" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="317" y="184" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" transform="translate(93,0)">ShippingAddress</text>

  <line x1="220" y1="132" x2="125" y2="158" stroke="var(--dg-line, #5F6368)" stroke-width="1.2"/>
  <line x1="220" y1="132" x2="265" y2="158" stroke="var(--dg-line, #5F6368)" stroke-width="1.2"/>
