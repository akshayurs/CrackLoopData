  <line x1="400" y1="100" x2="458" y2="105" stroke="var(--dg-muted, #5F6368)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="430" y="90" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">customerId ref</text>

  <text x="320" y="260" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Everything inside is only reachable through the root; other aggregates hold just an id.</text>
