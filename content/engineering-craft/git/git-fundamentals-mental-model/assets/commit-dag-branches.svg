<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A commit DAG</text>

  <g stroke="var(--dg-line, #5F6368)" stroke-width="1.5">
    <line x1="80" y1="110" x2="130" y2="110" marker-end="url(#arrow)" transform="rotate(180 105 110)"/>
    <line x1="140" y1="110" x2="190" y2="110" marker-end="url(#arrow)" transform="rotate(180 165 110)"/>
    <line x1="200" y1="110" x2="250" y2="110" marker-end="url(#arrow)" transform="rotate(180 225 110)"/>
    <line x1="260" y1="110" x2="310" y2="110" marker-end="url(#arrow)" transform="rotate(180 285 110)"/>
    <line x1="380" y1="80" x2="430" y2="105" marker-end="url(#arrow)" transform="rotate(180 405 92.5)"/>
    <line x1="380" y1="140" x2="430" y2="115" marker-end="url(#arrow)" transform="rotate(180 405 127.5)"/>
    <line x1="440" y1="110" x2="490" y2="110" marker-end="url(#arrow)" transform="rotate(180 465 110)"/>
    <line x1="500" y1="110" x2="550" y2="110" marker-end="url(#arrow)" transform="rotate(180 525 110)"/>
  </g>

  <g fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5">
    <circle cx="70" cy="110" r="9"/>
    <circle cx="140" cy="110" r="9"/>
    <circle cx="210" cy="110" r="9"/>
    <circle cx="280" cy="110" r="9"/>
    <circle cx="350" cy="80" r="9"/>
    <circle cx="350" cy="140" r="9"/>
    <circle cx="490" cy="110" r="9"/>
    <circle cx="560" cy="110" r="9"/>
  </g>
  <circle cx="420" cy="110" r="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="420" y="140" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">merge commit</text>

  <rect x="530" y="55" width="60" height="24" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="560" y="71" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">main</text>
  <line x1="560" y1="79" x2="560" y2="100" stroke="var(--dg-line, #5F6368)" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="460" y="55" width="60" height="24" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="490" y="71" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">feature</text>
  <line x1="490" y1="79" x2="490" y2="100" stroke="var(--dg-line, #5F6368)" stroke-width="1" marker-end="url(#arrow)"/>

  <path d="M210 90 L200 70 L220 70 Z" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.2"/>
  <text x="210" y="60" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">tag (pinned)</text>

  <text x="320" y="200" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Arrows point to parents; branches are movable pointers, tags are fixed.</text>
</svg>
