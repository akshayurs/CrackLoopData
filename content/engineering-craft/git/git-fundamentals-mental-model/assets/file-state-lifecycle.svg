<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">File state lifecycle</text>

  <g font-size="12" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">
    <rect x="10" y="90" width="130" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="75" y="115">Untracked</text>

    <rect x="220" y="90" width="130" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="285" y="115">Staged</text>

    <rect x="430" y="90" width="130" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="495" y="115">Committed</text>
  </g>

  <line x1="140" y1="111" x2="218" y2="111" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="179" y="100" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">git add</text>

  <line x1="350" y1="111" x2="428" y2="111" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="389" y="100" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">git commit</text>

  <rect x="220" y="170" width="130" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="285" y="195" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Modified</text>

  <path d="M495 132 C 495 190, 350 191, 352 191" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="160" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">edit</text>

  <path d="M220 191 C 150 191, 75 170, 75 134" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="215" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">git add</text>
</svg>
