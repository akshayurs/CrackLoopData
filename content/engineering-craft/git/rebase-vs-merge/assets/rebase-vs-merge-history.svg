  <circle cx="230" cy="90" r="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="230" y="115" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">merge commit</text>

  <line x1="350" y1="90" x2="410" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="2"/>
  <circle cx="360" cy="90" r="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="400" cy="90" r="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <line x1="400" y1="90" x2="460" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="2"/>
  <circle cx="460" cy="90" r="7" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <line x1="460" y1="90" x2="520" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="2"/>
  <circle cx="520" cy="90" r="7" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <line x1="520" y1="90" x2="580" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="2"/>
  <circle cx="580" cy="90" r="7" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="460" y="115" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">feature's 3 commits, new hashes</text>
