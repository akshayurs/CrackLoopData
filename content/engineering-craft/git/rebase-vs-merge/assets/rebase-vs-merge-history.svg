  <text x="480" y="20" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Rebased</text>

  <line x1="30" y1="90" x2="90" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="2"/>
  <circle cx="40" cy="90" r="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="80" cy="90" r="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <line x1="80" y1="90" x2="150" y2="60" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <line x1="80" y1="90" x2="150" y2="120" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <circle cx="150" cy="60" r="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="150" cy="120" r="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="45" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">main</text>
