<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Commits share unchanged blobs</text>

  <rect x="40" y="45" width="110" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="66" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Commit A</text>
  <rect x="470" y="45" width="130" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="535" y="66" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Commit B (child)</text>

  <line x1="150" y1="62" x2="468" y2="62" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="55" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">parent</text>

  <g font-size="10" text-anchor="middle" fill="var(--dg-ink, #202124)">
    <rect x="60" y="110" width="120" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
    <text x="120" y="130">file1.txt → blob X</text>
    <rect x="60" y="150" width="120" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
    <text x="120" y="170">file2.txt → blob Y</text>
    <rect x="60" y="190" width="120" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
    <text x="120" y="210">file3.txt → blob Z</text>
  </g>

  <g font-size="10" text-anchor="middle" fill="var(--dg-ink, #202124)">
    <rect x="460" y="150" width="130" height="30" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="525" y="170">file2.txt → blob Y'</text>
    <rect x="460" y="110" width="130" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="525" y="130">file1.txt → blob X</text>
    <rect x="460" y="190" width="130" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
    <text x="525" y="210">file3.txt → blob Z</text>
  </g>

  <path d="M180 125 C 320 90, 320 90, 460 125" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <path d="M180 205 C 320 240, 320 240, 460 205" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <text x="320" y="255" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">file1.txt and file3.txt entries are the literal same arrows — unchanged, same blob.</text>
</svg>
