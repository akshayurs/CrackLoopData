<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Gitflow branch model</text>

  <line x1="60" y1="240" x2="600" y2="240" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>
  <text x="30" y="244" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">main</text>

  <line x1="60" y1="180" x2="600" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="2"/>
  <text x="30" y="184" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">develop</text>

  <path d="M180 180 C 200 150, 240 150, 260 180" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="145" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">feature branch</text>

  <line x1="330" y1="120" x2="330" y2="178" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="180" x2="330" y2="120" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="330" y="105" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">release</text>
  <line x1="330" y1="120" x2="470" y2="180" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="120" x2="500" y2="240" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="470" y="70" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">hotfix</text>
  <line x1="450" y1="240" x2="470" y2="80" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <line x1="470" y1="80" x2="540" y2="180" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="80" x2="560" y2="240" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="320" y="280" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">release merges into both main and develop; hotfix branches off main and merges to both.</text>
</svg>
