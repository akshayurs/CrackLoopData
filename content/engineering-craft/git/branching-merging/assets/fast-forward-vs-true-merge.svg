<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="160" y="22" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">Fast-forward</text>
  <text x="480" y="22" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)" font-weight="600">True merge</text>

  <line x1="40" y1="90" x2="280" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="2"/>
  <circle cx="60" cy="90" r="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="130" cy="90" r="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="200" cy="90" r="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="260" cy="90" r="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="60" y="115" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">main</text>
  <text x="260" y="115" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">feature tip</text>
  <path d="M60 60 C 130 40, 200 40, 260 60" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="160" y="45" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">main pointer slides to tip</text>
  <text x="160" y="145" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">no branch point drawn — one straight line</text>

  <line x1="360" y1="90" x2="440" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="2"/>
  <circle cx="380" cy="90" r="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <line x1="440" y1="90" x2="500" y2="55" stroke="var(--dg-line, #5F6368)" stroke-width="1.8"/>
  <line x1="440" y1="90" x2="500" y2="125" stroke="var(--dg-line, #5F6368)" stroke-width="1.8"/>
  <circle cx="500" cy="55" r="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="500" cy="125" r="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="45" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">main</text>
  <text x="500" y="145" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">feature</text>
  <line x1="500" y1="55" x2="560" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.8"/>
  <line x1="500" y1="125" x2="560" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.8"/>
  <circle cx="560" cy="90" r="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="560" y="115" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">merge commit</text>
  <text x="480" y="180" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">both lines gain commits, then join with two parents</text>
</svg>
