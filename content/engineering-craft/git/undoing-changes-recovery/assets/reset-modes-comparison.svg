<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">git reset: what each mode moves</text>

  <g font-size="12" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">
    <text x="140" y="55">--soft</text>
    <text x="330" y="55">--mixed</text>
    <text x="520" y="55">--hard</text>
  </g>

  <g font-size="11" text-anchor="middle" fill="var(--dg-ink, #202124)">
    <text x="30" y="95">HEAD</text>
    <text x="30" y="140">Staging (index)</text>
    <text x="30" y="185">Working directory</text>
  </g>

  <g stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1">
    <line x1="10" y1="70" x2="610" y2="70"/>
    <line x1="10" y1="115" x2="610" y2="115"/>
    <line x1="10" y1="160" x2="610" y2="160"/>
    <line x1="10" y1="200" x2="610" y2="200"/>
  </g>

  <g fill="var(--dg-accent, #0C8F88)" font-size="14" text-anchor="middle">
    <text x="140" y="98">✓</text>
    <text x="140" y="143" fill="var(--dg-muted, #5F6368)">—</text>
    <text x="140" y="188" fill="var(--dg-muted, #5F6368)">—</text>

    <text x="330" y="98">✓</text>
    <text x="330" y="143">✓</text>
    <text x="330" y="188" fill="var(--dg-muted, #5F6368)">—</text>

    <text x="520" y="98">✓</text>
    <text x="520" y="143">✓</text>
    <text x="520" y="188">✓</text>
  </g>

  <text x="320" y="230" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">--soft moves only HEAD; --mixed also unstages; --hard also discards working-dir changes.</text>
</svg>
