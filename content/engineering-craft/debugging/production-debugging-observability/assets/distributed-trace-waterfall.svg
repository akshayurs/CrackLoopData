<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Distributed trace: where the time goes</text>

  <rect x="40" y="45" width="560" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="46" y="63" font-size="10" fill="var(--dg-ink, #202124)">API Gateway</text>

  <rect x="60" y="85" width="80" height="24" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="100" y="101" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Auth</text>

  <rect x="150" y="85" width="100" height="24" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="200" y="101" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Order Service</text>

  <rect x="260" y="85" width="330" height="24" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="425" y="101" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Inventory Service — bottleneck (~5x)</text>

  <line x1="40" y1="130" x2="600" y2="130" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <g font-size="9" fill="var(--dg-muted, #5F6368)">
    <text x="40" y="145">0</text>
    <text x="180" y="145">50ms</text>
    <text x="340" y="145">100ms</text>
    <text x="500" y="145">150ms</text>
    <text x="590" y="145">200ms</text>
  </g>

  <text x="320" y="185" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Nested spans reveal Inventory Service dominates total latency, not Auth or Order.</text>
</svg>
