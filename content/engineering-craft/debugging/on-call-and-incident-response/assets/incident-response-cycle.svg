<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Incident response cycle</text>

  <g font-size="11" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">
    <rect x="10" y="70" width="105" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="62" y="90">🔔</text><text x="62" y="106">Detect</text>

    <rect x="140" y="70" width="105" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="192" y="90">🔍</text><text x="192" y="106">Triage</text>

    <rect x="270" y="70" width="105" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="322" y="90">🔧</text><text x="322" y="106">Mitigate</text>

    <rect x="400" y="70" width="105" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="452" y="90">✔</text><text x="452" y="106">Resolve</text>

    <rect x="530" y="70" width="105" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="582" y="90">📄</text><text x="582" y="106">Follow-up</text>
  </g>

  <g stroke="var(--dg-line, #5F6368)" stroke-width="1.5">
    <line x1="115" y1="93" x2="138" y2="93" marker-end="url(#arrow)"/>
    <line x1="245" y1="93" x2="268" y2="93" marker-end="url(#arrow)"/>
    <line x1="375" y1="93" x2="398" y2="93" marker-end="url(#arrow)"/>
    <line x1="505" y1="93" x2="528" y2="93" marker-end="url(#arrow)"/>
  </g>

  <path d="M582 118 C 582 190, 62 190, 62 118" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="320" y="200" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">prevents recurrence</text>
</svg>
