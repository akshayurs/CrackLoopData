<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Lost update: interleaved reads and writes</text>

  <text x="20" y="70" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Thread A</text>
  <line x1="20" y1="80" x2="600" y2="80" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <rect x="60" y="60" width="130" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="125" y="82" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">read counter=0</text>
  <rect x="420" y="60" width="150" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="495" y="82" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">write counter=1</text>

  <text x="20" y="150" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Thread B</text>
  <line x1="20" y1="160" x2="600" y2="160" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <rect x="220" y="140" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="280" y="162" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">read counter=0</text>
  <rect x="350" y="140" width="90" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="395" y="162" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">increment</text>
  <rect x="450" y="140" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="510" y="162" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">write counter=1</text>

  <line x1="510" y1="174" x2="495" y2="60" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="440" y="200" width="140" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="510" y="220" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">overwritten</text>

  <text x="320" y="245" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Both threads compute 1 from the same read — one increment is silently lost.</text>
</svg>
