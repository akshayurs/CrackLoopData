<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">One correlation_id, three services</text>

  <rect x="10" y="50" width="110" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="65" y="66" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">API Gateway</text>
  <text x="65" y="80" text-anchor="middle" font-size="8" fill="var(--dg-accent, #0C8F88)">mints a1b2c3</text>

  <g font-size="9" text-anchor="middle" fill="var(--dg-ink, #202124)">
    <rect x="170" y="50" width="130" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
    <text x="235" y="66">Order Service</text>
    <text x="235" y="80" font-size="8" fill="var(--dg-muted, #5F6368)">...id=a1b2c3</text>

    <rect x="330" y="50" width="130" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
    <text x="395" y="66">Payment Service</text>
    <text x="395" y="80" font-size="8" fill="var(--dg-muted, #5F6368)">...id=a1b2c3</text>

    <rect x="490" y="50" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
    <text x="560" y="64">Fulfillment</text>
    <text x="560" y="76">Worker (queue)</text>
    <text x="560" y="88" font-size="8" fill="var(--dg-muted, #5F6368)">...id=a1b2c3</text>
  </g>

  <g stroke="var(--dg-line, #5F6368)" stroke-width="1.3">
    <line x1="120" y1="70" x2="168" y2="70" marker-end="url(#arrow)"/>
    <line x1="300" y1="70" x2="328" y2="70" marker-end="url(#arrow)"/>
  </g>
  <line x1="460" y1="70" x2="488" y2="80" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <line x1="65" y1="130" x2="65" y2="90" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <line x1="65" y1="130" x2="620" y2="130" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <circle cx="235" cy="130" r="4" fill="var(--dg-ink, #202124)"/>
  <circle cx="395" cy="130" r="4" fill="var(--dg-ink, #202124)"/>
  <circle cx="560" cy="130" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <text x="560" y="150" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">logged minutes later</text>
  <text x="320" y="185" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Same correlation_id ties the async queue log back to the original request.</text>
</svg>
