<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">PR lifecycle</text>

  <g font-size="9" text-anchor="middle" fill="var(--dg-ink, #202124)">
    <rect x="10" y="50" width="90" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
    <text x="55" y="74">Draft</text>

    <rect x="115" y="50" width="90" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
    <text x="160" y="74">Ready for review</text>

    <rect x="220" y="50" width="95" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.2"/>
    <text x="267" y="68">Automated</text><text x="267" y="80">checks</text>

    <rect x="330" y="50" width="90" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
    <text x="375" y="68">Human</text><text x="375" y="80">review</text>

    <rect x="435" y="50" width="80" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
    <text x="475" y="74">Approval</text>

    <rect x="530" y="50" width="80" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.2"/>
    <text x="570" y="68">Merge</text><text x="570" y="80">queue</text>

    <rect x="625" y="50" width="70" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.2"/>
    <text x="660" y="68">Merge +</text><text x="660" y="80">deploy</text>
  </g>

  <g stroke="var(--dg-line, #5F6368)" stroke-width="1.3">
    <line x1="100" y1="70" x2="113" y2="70" marker-end="url(#arrow)"/>
    <line x1="205" y1="70" x2="218" y2="70" marker-end="url(#arrow)"/>
    <line x1="315" y1="70" x2="328" y2="70" marker-end="url(#arrow)"/>
    <line x1="420" y1="70" x2="433" y2="70" marker-end="url(#arrow)"/>
    <line x1="515" y1="70" x2="528" y2="70" marker-end="url(#arrow)"/>
    <line x1="610" y1="70" x2="623" y2="70" marker-end="url(#arrow)"/>
  </g>

  <path d="M375 90 C 375 140, 90 140, 55 92" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="215" y="150" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">changes requested</text>

  <path d="M267 90 C 267 190, 375 210, 375 90" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="290" y="205" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">fails here: never reaches a reviewer</text>
  <circle cx="267" cy="180" r="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.2"/>
  <text x="267" y="184" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">✗</text>

  <text x="350" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Accent stages are automated; plain stages need a human.</text>
</svg>
