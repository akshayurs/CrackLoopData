<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="280" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Core Data layered stack</text>

  <rect x="150" y="40" width="260" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="280" y="63" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Your code</text>
  <line x1="280" y1="76" x2="280" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="130" y="100" width="300" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="280" y="123" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">NSManagedObject instances</text>
  <line x1="280" y1="136" x2="280" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="90" y="160" width="380" height="52" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="280" y="182" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">NSManagedObjectContext</text>
  <text x="280" y="198" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">in-memory staging area, tracks changes</text>

  <line x1="250" y1="212" x2="250" y2="236" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="205" y="228" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">save() pushes down</text>
  <line x1="310" y1="236" x2="310" y2="212" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="355" y="228" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">fetch() pulls up</text>

  <rect x="130" y="236" width="300" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="280" y="259" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">NSPersistentStoreCoordinator</text>
  <line x1="280" y1="272" x2="280" y2="296" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="150" y="296" width="260" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="280" y="319" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">NSPersistentStore (SQLite file)</text>

  <text x="280" y="360" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Multiple contexts can sit above one coordinator, sharing the same store.</text>
</svg>
