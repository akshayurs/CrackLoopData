<svg viewBox="0 0 660 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">@State change to minimal view patch</text>

  <rect x="10" y="70" width="140" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="80" y="92" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">1. @State</text>
  <text x="80" y="107" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">value changes</text>

  <line x1="150" y1="95" x2="185" y2="95" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="185" y="70" width="140" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="255" y="92" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">2. body re-runs</text>
  <text x="255" y="107" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">new tree description</text>

  <line x1="325" y1="95" x2="360" y2="95" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="360" y="70" width="140" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="430" y="92" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">3. diff</text>
  <text x="430" y="107" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">vs previous tree</text>

  <line x1="500" y1="95" x2="535" y2="95" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="535" y="70" width="115" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="592" y="92" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">4. patch</text>
  <text x="592" y="107" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">changed view only</text>

  <rect x="360" y="160" width="60" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="390" y="184" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">changed</text>
  <rect x="440" y="160" width="60" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" opacity="0.4"/>
  <text x="470" y="184" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">sibling</text>
  <rect x="520" y="160" width="60" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" opacity="0.4"/>
  <text x="550" y="184" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">sibling</text>

  <text x="330" y="235" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Untouched siblings are never re-rendered — only the actual UIKit/AppKit views that changed get updated.</text>
</svg>
