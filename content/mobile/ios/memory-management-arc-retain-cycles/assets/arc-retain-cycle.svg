<svg viewBox="0 0 560 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-muted, #5F6368)"/>
    </marker>
  </defs>
  <text x="280" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A strong reference cycle keeps both objects alive</text>

  <rect x="90" y="90" width="130" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="155" y="120" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Object A</text>

  <rect x="340" y="90" width="130" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="405" y="120" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Object B</text>

  <path d="M220,105 C270,95 290,95 340,105" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="90" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">strong</text>

  <path d="M340,130 C290,140 270,140 220,130" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="155" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">strong</text>

  <path d="M30,60 C60,70 100,80 130,90" fill="none" stroke="var(--dg-muted, #5F6368)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowMuted)"/>
  <text x="60" y="55" font-size="10" fill="var(--dg-muted, #5F6368)">last external</text>
  <text x="60" y="68" font-size="10" fill="var(--dg-muted, #5F6368)">reference dropped</text>
  <line x1="30" y1="60" x2="30" y2="60" stroke="none"/>

  <text x="280" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Once the external reference is gone, A and B still point at each other —</text>
  <text x="280" y="248" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">neither reaches a retain count of zero, so ARC never deallocates either.</text>
</svg>
