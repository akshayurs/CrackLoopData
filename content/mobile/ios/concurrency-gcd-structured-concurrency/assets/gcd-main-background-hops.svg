<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Hopping off and back onto the main queue</text>

  <text x="30" y="70" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Main queue</text>
  <rect x="120" y="52" width="120" height="34" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="180" y="73" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">UI event</text>

  <rect x="480" y="52" width="130" height="34" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="545" y="73" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">UI update</text>

  <text x="30" y="150" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Background queue</text>
  <rect x="280" y="132" width="160" height="34" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="360" y="153" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">expensive operation</text>

  <path d="M240,69 C260,69 260,149 280,149" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="105" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">DispatchQueue.global().async</text>

  <path d="M440,149 C460,149 460,69 480,69" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="105" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">DispatchQueue.main.async</text>

  <text x="320" y="210" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">UI work stays on main; only the expensive step runs off it, then the result hops back.</text>
</svg>
