<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">App / Scene state machine</text>

  <rect x="30" y="120" width="110" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="146" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Not Running</text>

  <rect x="190" y="120" width="110" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="245" y="146" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Inactive</text>

  <rect x="350" y="120" width="110" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="405" y="146" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Active</text>

  <rect x="350" y="220" width="110" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="405" y="246" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Background</text>

  <rect x="190" y="220" width="110" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="245" y="246" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Suspended</text>

  <line x1="140" y1="141" x2="190" y2="141" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="165" y="132" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">willConnectTo</text>

  <line x1="300" y1="135" x2="350" y2="135" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="325" y="126" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">didBecomeActive</text>
  <line x1="350" y1="150" x2="300" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="325" y="166" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">willResignActive</text>

  <line x1="405" y1="162" x2="405" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="440" y="192" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">didEnterBackground</text>

  <line x1="350" y1="235" x2="300" y2="235" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="325" y="226" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">system suspends</text>

  <line x1="190" y1="241" x2="85" y2="162" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="120" y="200" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">terminate / didDiscardSceneSessions</text>

  <text x="320" y="290" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each arrow is a UISceneDelegate / UIApplicationDelegate callback firing the transition.</text>
</svg>
