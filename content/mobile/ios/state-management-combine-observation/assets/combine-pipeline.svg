<svg viewBox="0 0 660 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A Combine pipeline from publisher to sink</text>

  <rect x="20" y="70" width="100" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="70" y="90" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">textDidChange</text>
  <text x="70" y="104" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">publisher</text>

  <circle cx="150" cy="93" r="5" fill="var(--dg-accent, #0C8F88)"/>
  <line x1="120" y1="93" x2="180" y2="93" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="180" y="70" width="100" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="230" y="97" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">debounce</text>

  <circle cx="310" cy="93" r="5" fill="var(--dg-accent, #0C8F88)"/>
  <line x1="280" y1="93" x2="340" y2="93" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="340" y="70" width="100" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="390" y="97" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">map</text>

  <circle cx="470" cy="93" r="5" fill="var(--dg-accent, #0C8F88)"/>
  <line x1="440" y1="93" x2="500" y2="93" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="500" y="70" width="100" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="550" y="97" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">filter</text>

  <line x1="600" y1="93" x2="640" y2="93" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="330" y="150" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">sink &#8594; updates @Published property</text>

  <text x="330" y="190" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Values flow left to right through each operator stage before reaching the subscriber.</text>
</svg>
