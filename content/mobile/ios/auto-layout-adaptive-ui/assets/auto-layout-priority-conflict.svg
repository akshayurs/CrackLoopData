<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="310" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Required beats high-priority, not "unsatisfiable"</text>

  <rect x="60" y="60" width="150" height="120" rx="4" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="135" y="52" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">superview (150pt)</text>

  <rect x="60" y="90" width="220" height="60" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="170" y="115" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">view — rendered at 200pt</text>
  <text x="170" y="132" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">width = 200pt (priority 1000)</text>

  <line x1="280" y1="120" x2="330" y2="120" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="340" y="105" font-size="10" fill="var(--dg-muted, #5F6368)">overflows past</text>
  <text x="340" y="118" font-size="10" fill="var(--dg-muted, #5F6368)">superview edge</text>

  <text x="60" y="200" font-size="11" fill="var(--dg-ink, #202124)">trailing = superview trailing (priority 750)</text>
  <text x="60" y="218" font-size="10" fill="var(--dg-muted, #5F6368)">would force width to 150pt — but it's not required</text>

  <text x="310" y="260" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Auto Layout satisfies the required (1000) constraint and drops the lower-priority one instead of failing.</text>
</svg>
