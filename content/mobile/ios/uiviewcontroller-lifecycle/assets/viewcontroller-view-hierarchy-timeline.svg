<svg viewBox="0 0 660 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="330" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Controller callbacks vs. view hierarchy state</text>

  <text x="20" y="70" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Controller lifecycle</text>
  <text x="140" y="70" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">loadView</text>
  <text x="270" y="70" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">viewDidLoad</text>
  <text x="420" y="70" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">viewWillAppear</text>
  <text x="570" y="70" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">viewDidAppear</text>

  <line x1="140" y1="80" x2="140" y2="200" stroke="var(--dg-line, #5F6368)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="270" y1="80" x2="270" y2="200" stroke="var(--dg-line, #5F6368)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="420" y1="80" x2="420" y2="200" stroke="var(--dg-line, #5F6368)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="570" y1="80" x2="570" y2="200" stroke="var(--dg-line, #5F6368)" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="20" y="215" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">View hierarchy</text>
  <text x="140" y="215" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">views instantiated</text>
  <text x="270" y="215" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">added as subviews,</text>
  <text x="270" y="228" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">frames zero</text>
  <text x="420" y="215" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Auto Layout pass</text>
  <text x="570" y="215" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">frames final</text>

  <line x1="30" y1="90" x2="640" y2="90" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <line x1="30" y1="190" x2="640" y2="190" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2"/>
</svg>
