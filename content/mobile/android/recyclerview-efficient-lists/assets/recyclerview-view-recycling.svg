<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Views are recycled, not recreated</text>

  <rect x="60" y="42" width="200" height="200" rx="8" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="160" y="36" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">viewport (4 visible rows)</text>

  <rect x="75" y="52" width="170" height="38" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="160" y="76" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">row 1 — scrolling out</text>
  <rect x="75" y="96" width="170" height="38" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="120" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">row 2</text>
  <rect x="75" y="140" width="170" height="38" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="164" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">row 3</text>
  <rect x="75" y="184" width="170" height="38" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="208" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">row 4</text>

  <path d="M260,71 C330,71 330,71 380,71" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="390" y="46" width="150" height="52" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="465" y="68" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">recycled pool</text>
  <text x="465" y="84" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">holding view instance</text>

  <path d="M465,98 C465,150 300,190 260,204" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="140" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">rebind with new data</text>

  <rect x="75" y="228" width="170" height="38" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="160" y="252" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">row 5 — entering (reused view)</text>

  <text x="320" y="300" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">RecyclerView reuses the same finite pool of row views instead of inflating a new one per item.</text>
</svg>
