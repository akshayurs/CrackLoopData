<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="300" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Hilt component scope nesting</text>

  <rect x="30" y="46" width="540" height="270" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="50" y="70" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">ApplicationComponent (process lifetime)</text>

  <rect x="60" y="86" width="480" height="200" rx="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="80" y="110" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">ActivityComponent (per-Activity)</text>

  <rect x="90" y="130" width="200" height="120" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="190" y="195" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">FragmentComponent</text>

  <rect x="310" y="130" width="200" height="120" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="410" y="195" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">ViewModelComponent</text>

  <line x1="190" y1="130" x2="190" y2="112" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <defs>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <line x1="410" y1="130" x2="410" y2="112" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <line x1="300" y1="86" x2="300" y2="70" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>

  <text x="300" y="300" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Dependencies flow inward — outer scopes are visible to inner ones, never the reverse.</text>
</svg>
