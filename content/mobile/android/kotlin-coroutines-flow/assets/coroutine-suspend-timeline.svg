<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Suspension frees the thread, not the coroutine</text>

  <text x="40" y="70" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Thread A</text>
  <rect x="120" y="52" width="140" height="30" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="190" y="72" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">running (coroutine)</text>

  <rect x="260" y="52" width="160" height="30" rx="4" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="340" y="72" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">suspended — no thread held</text>

  <rect x="420" y="52" width="140" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="72" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">different coroutine</text>

  <text x="40" y="140" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Thread B</text>
  <rect x="260" y="122" width="20" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" opacity="0.4"/>
  <rect x="420" y="122" width="140" height="30" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="490" y="142" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">resumed (coroutine)</text>

  <line x1="40" y1="180" x2="600" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="1"/>
  <text x="190" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">launch</text>
  <text x="340" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">network call in flight</text>
  <text x="490" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">response arrives</text>

  <text x="320" y="235" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">During the gap, Thread A is free to run unrelated work — the coroutine holds no thread while suspended.</text>
</svg>
