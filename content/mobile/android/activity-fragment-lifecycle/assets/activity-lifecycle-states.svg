<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Activity lifecycle state machine</text>

  <rect x="30" y="60" width="110" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="86" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Created</text>

  <rect x="200" y="60" width="110" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="255" y="86" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Started</text>

  <rect x="370" y="60" width="110" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="425" y="86" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Resumed</text>

  <rect x="370" y="180" width="110" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="425" y="206" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Paused</text>

  <rect x="200" y="180" width="110" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="255" y="206" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Stopped</text>

  <rect x="30" y="180" width="110" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="206" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Destroyed</text>

  <line x1="140" y1="81" x2="200" y2="81" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="170" y="74" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">onCreate</text>

  <line x1="310" y1="81" x2="370" y2="81" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="340" y="74" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">onStart</text>

  <path d="M425,102 C425,130 445,130 445,155" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="475" y="130" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="600">onResume</text>
  <path d="M405,180 C405,145 405,145 405,102" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="365" y="140" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="600">onPause</text>
  <text x="425" y="140" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)" font-style="italic">loops freely</text>

  <line x1="370" y1="201" x2="310" y2="201" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="340" y="194" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">onPause done</text>

  <path d="M255,180 C255,150 255,150 255,102" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="215" y="145" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">onStart</text>
  <path d="M280,102 C280,150 280,150 280,180" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="145" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">onStop</text>
  <text x="255" y="160" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)" font-style="italic">no onCreate needed</text>

  <line x1="200" y1="201" x2="140" y2="201" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="170" y="194" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">onDestroy</text>

  <text x="350" y="310" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Resumed &#8596; Paused and Stopped &#8596; Started can loop indefinitely on the same instance.</text>
  <text x="350" y="330" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Only Destroyed &#8594; Created means a genuinely new Activity object was made.</text>
</svg>
