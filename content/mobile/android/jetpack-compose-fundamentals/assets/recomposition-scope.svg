<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="300" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Recomposition only touches what reads the state</text>

  <circle cx="300" cy="70" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" opacity="0.5"/>
  <text x="300" y="75" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Root</text>

  <line x1="300" y1="96" x2="180" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" opacity="0.5"/>
  <line x1="300" y1="96" x2="300" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <line x1="300" y1="96" x2="420" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" opacity="0.5"/>

  <circle cx="180" cy="180" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" opacity="0.5"/>
  <text x="180" y="185" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Sibling A</text>

  <circle cx="300" cy="180" r="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="300" y="184" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Changed</text>
  <text x="300" y="150" text-anchor="middle" font-size="14" fill="var(--dg-accent, #0C8F88)">&#8635;</text>

  <circle cx="420" cy="180" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" opacity="0.5"/>
  <text x="420" y="185" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Sibling B</text>

  <rect x="230" y="230" width="140" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="300" y="252" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">state variable</text>
  <line x1="300" y1="230" x2="300" y2="206" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrowAccent)"/>

  <text x="300" y="300" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Root and sibling nodes stay dimmed — only the node reading the changed state re-renders.</text>
</svg>
