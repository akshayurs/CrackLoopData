<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Choosing where background work runs</text>

  <rect x="240" y="46" width="160" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="68" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">User needs to see</text>
  <text x="320" y="82" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">this now?</text>

  <line x1="240" y1="80" x2="110" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="150" y="100" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">yes</text>
  <line x1="400" y1="80" x2="480" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="460" y="100" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">no</text>

  <rect x="30" y="130" width="170" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="115" y="158" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Foreground Service</text>

  <rect x="400" y="130" width="200" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="152" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Can be deferred and</text>
  <text x="500" y="166" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">survive app close/reboot?</text>

  <line x1="440" y1="176" x2="360" y2="230" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="380" y="200" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">no</text>
  <line x1="560" y1="176" x2="560" y2="230" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="590" y="205" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">yes</text>

  <rect x="260" y="230" width="200" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="360" y="252" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Plain Service /</text>
  <text x="360" y="266" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">coroutine scope</text>

  <rect x="470" y="230" width="150" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="545" y="258" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">WorkManager</text>
</svg>
