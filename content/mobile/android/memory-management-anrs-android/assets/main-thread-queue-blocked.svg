<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A blocked main thread backs up its own message queue</text>

  <rect x="40" y="60" width="260" height="46" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="170" y="88" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">blocking work — 6+ seconds</text>

  <rect x="310" y="66" width="70" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="345" y="87" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">tap event</text>
  <rect x="390" y="66" width="70" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="425" y="87" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">tap event</text>
  <rect x="470" y="66" width="70" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="505" y="87" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">tap event</text>

  <text x="170" y="130" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">main thread — frontmost message</text>

  <path d="M170,150 L163,166 L177,166 Z" fill="var(--dg-accent, #0C8F88)"/>
  <circle cx="170" cy="180" r="14" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <line x1="170" y1="180" x2="170" y2="170" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <line x1="170" y1="180" x2="178" y2="184" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="170" y="210" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">watchdog: past threshold</text>

  <text x="320" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Repeated taps queue up unprocessed behind the stuck message — the OS shows the ANR dialog.</text>
</svg>
