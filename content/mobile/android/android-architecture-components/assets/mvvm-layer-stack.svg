<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="310" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Unidirectional layer stack</text>

  <rect x="180" y="46" width="260" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="310" y="74" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">View (Composable)</text>

  <line x1="270" y1="92" x2="270" y2="128" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="215" y="112" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">user action</text>
  <line x1="350" y1="128" x2="350" y2="92" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="415" y="112" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">observable state</text>

  <rect x="180" y="128" width="260" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="310" y="156" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">ViewModel</text>

  <line x1="270" y1="174" x2="270" y2="210" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="215" y="194" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">request data</text>
  <line x1="350" y1="210" x2="350" y2="174" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="415" y="194" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">data stream</text>

  <rect x="180" y="210" width="260" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="310" y="238" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Repository</text>

  <line x1="250" y1="256" x2="220" y2="290" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="370" y1="256" x2="400" y2="290" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="120" y="290" width="180" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="210" y="315" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Local DB (Room)</text>

  <rect x="320" y="290" width="180" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="410" y="315" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Network API</text>

  <text x="310" y="20" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)"></text>
  <text x="30" y="150" font-size="11" fill="var(--dg-muted, #5F6368)">Each layer</text>
  <text x="30" y="165" font-size="11" fill="var(--dg-muted, #5F6368)">only talks</text>
  <text x="30" y="180" font-size="11" fill="var(--dg-muted, #5F6368)">to the one</text>
  <text x="30" y="195" font-size="11" fill="var(--dg-muted, #5F6368)">directly</text>
  <text x="30" y="210" font-size="11" fill="var(--dg-muted, #5F6368)">below it —</text>
  <text x="30" y="225" font-size="11" fill="var(--dg-muted, #5F6368)">no skipping.</text>
</svg>
