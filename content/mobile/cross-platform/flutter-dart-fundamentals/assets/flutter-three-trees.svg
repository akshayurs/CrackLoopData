<svg viewBox="0 0 660 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Widget, Element, and Render trees</text>

  <rect x="30" y="50" width="180" height="200" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="120" y="72" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Widget tree</text>
  <text x="120" y="90" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">immutable config,</text>
  <text x="120" y="103" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">recreated often</text>

  <line x1="210" y1="150" x2="240" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="225" y="140" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">feeds config</text>

  <rect x="240" y="50" width="180" height="200" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="330" y="72" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Element tree</text>
  <text x="330" y="90" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">long-lived, links widget</text>
  <text x="330" y="103" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">config to render object,</text>
  <text x="330" y="116" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">persists across rebuilds</text>

  <line x1="420" y1="150" x2="450" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="435" y="140" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">updates only</text>
  <text x="435" y="128" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">where changed</text>

  <rect x="450" y="50" width="180" height="200" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="540" y="72" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Render tree</text>
  <text x="540" y="90" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">does layout &amp; paint,</text>
  <text x="540" y="103" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">holds real size/position</text>

  <text x="330" y="280" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A new widget tree is cheap; the persistent element tree decides what actually needs re-rendering.</text>
</svg>
