<svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Native vs cross-platform decision path</text>

  <rect x="250" y="34" width="160" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="330" y="56" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">New mobile product</text>

  <line x1="330" y1="68" x2="330" y2="92" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="190" y="92" width="280" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="330" y="109" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Deep platform integration or</text>
  <text x="330" y="122" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">best-in-class graphics/AR core?</text>

  <line x1="250" y1="128" x2="130" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="160" y="140" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="600">yes</text>
  <rect x="30" y="150" width="150" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="105" y="172" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Native</text>

  <line x1="410" y1="128" x2="410" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="425" y="142" font-size="10" fill="var(--dg-muted, #5F6368)">no</text>
  <rect x="260" y="150" width="300" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="410" y="167" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Small team or fast simultaneous</text>
  <text x="410" y="180" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">iteration on both platforms critical?</text>

  <line x1="360" y1="190" x2="280" y2="212" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="300" y="204" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="600">yes</text>
  <rect x="180" y="212" width="200" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="280" y="234" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Cross-platform</text>

  <line x1="460" y1="190" x2="500" y2="212" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="480" y="204" font-size="10" fill="var(--dg-muted, #5F6368)">no</text>
  <rect x="400" y="212" width="260" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="229" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Most UI simple/content-driven,</text>
  <text x="530" y="242" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">occasional platform-specific screens?</text>

  <line x1="530" y1="252" x2="470" y2="276" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="500" y="266" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">yes</text>
  <rect x="330" y="276" width="290" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="475" y="298" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Cross-platform + native modules for exceptions</text>

  <text x="330" y="340" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Fallback tie-breaker: existing team skill set (native vs React/Dart).</text>
</svg>
