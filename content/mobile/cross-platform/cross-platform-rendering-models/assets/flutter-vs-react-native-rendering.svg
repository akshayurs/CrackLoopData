<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Two very different rendering pipelines</text>

  <text x="160" y="46" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Flutter</text>
  <rect x="60" y="58" width="200" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="78" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Dart widget tree</text>
  <line x1="160" y1="88" x2="160" y2="104" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="60" y="104" width="200" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="124" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Element tree</text>
  <line x1="160" y1="134" x2="160" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="60" y="150" width="200" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="160" y="170" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Render tree</text>
  <line x1="160" y1="180" x2="160" y2="196" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="60" y="196" width="200" height="30" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="160" y="216" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Skia/Impeller engine</text>
  <line x1="160" y1="226" x2="160" y2="242" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="160" y="260" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">raw pixels drawn directly to canvas</text>
  <text x="160" y="274" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">no OS widget involved</text>

  <line x1="330" y1="50" x2="330" y2="290" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4 3"/>

  <text x="500" y="46" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">React Native</text>
  <rect x="400" y="58" width="200" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="78" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">JS component tree</text>
  <line x1="500" y1="88" x2="500" y2="104" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="400" y="104" width="200" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="124" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">diff / reconciliation</text>
  <line x1="500" y1="134" x2="500" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="400" y="150" width="200" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="500" y="170" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">bridge / JSI boundary</text>
  <line x1="500" y1="180" x2="500" y2="196" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="400" y="196" width="200" height="30" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="500" y="216" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">real native views (UIView/View)</text>
  <line x1="500" y1="226" x2="500" y2="242" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="500" y="260" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">OS renders these normally</text>
</svg>
