<svg viewBox="0 0 660 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Crossing the platform-channel boundary is a round trip</text>

  <text x="80" y="60" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Dart/JS code</text>
  <rect x="480" y="46" width="0" height="0"/>
  <text x="330" y="60" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Bridge boundary</text>
  <text x="570" y="60" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Native (Swift/Kotlin)</text>

  <rect x="20" y="80" width="120" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="80" y="104" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">method call</text>

  <line x1="140" y1="100" x2="270" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="205" y="90" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">serialized</text>

  <rect x="270" y="80" width="120" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="330" y="104" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">channel / bridge</text>

  <line x1="390" y1="100" x2="510" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="510" y="80" width="130" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="575" y="104" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">native API call</text>

  <line x1="510" y1="150" x2="390" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="270" y1="150" x2="140" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="330" y="140" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">result crosses back</text>

  <rect x="20" y="160" width="120" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="80" y="180" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">result</text>

  <text x="330" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">This round trip is asynchronous with real latency — unlike an equivalent in-process native call.</text>
</svg>
