<svg viewBox="0 0 660 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">JavaScript and native lanes, crossing the bridge</text>

  <rect x="30" y="50" width="260" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="160" y="70" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">JavaScript thread</text>
  <text x="160" y="88" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">render logic,</text>
  <text x="160" y="101" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">event handler execution</text>

  <rect x="370" y="50" width="260" height="70" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="70" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Native / UI thread</text>
  <text x="500" y="88" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">view layout, painting,</text>
  <text x="500" y="101" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">gesture recognition</text>

  <line x1="290" y1="70" x2="370" y2="70" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="290" y1="100" x2="370" y2="100" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="330" y="45" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Bridge / JSI</text>

  <line x1="200" y1="130" x2="470" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="335" y="122" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">state update &#8594; view props</text>

  <line x1="470" y1="170" x2="200" y2="170" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="335" y="192" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">touch event &#8594; JS handler</text>

  <text x="330" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Every render decision and every touch crosses this boundary in one direction or the other.</text>
</svg>
