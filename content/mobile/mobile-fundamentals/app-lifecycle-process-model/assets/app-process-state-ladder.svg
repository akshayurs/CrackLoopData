<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="310" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">App process state ladder</text>

  <rect x="30" y="60" width="120" height="42" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="90" y="86" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Active</text>

  <line x1="150" y1="81" x2="200" y2="81" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="175" y="72" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">user leaves</text>

  <rect x="200" y="60" width="120" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="260" y="86" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Background</text>

  <line x1="320" y1="81" x2="370" y2="81" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="345" y="72" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">OS reclaims</text>

  <rect x="370" y="60" width="120" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="430" y="86" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Suspended</text>

  <line x1="490" y1="81" x2="540" y2="81" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="515" y="72" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">memory pressure</text>

  <rect x="540" y="60" width="120" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="490" y="86" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)"></text>
  <text x="600" y="86" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Killed</text>

  <path d="M600,102 C600,170 90,170 90,102" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="345" y="185" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">cold start</text>

  <text x="310" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A killed app has no path back except a full cold start — process state, not the same instance.</text>
</svg>
