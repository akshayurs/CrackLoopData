<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Safe area vs. content clipped by system UI</text>

  <rect x="60" y="46" width="220" height="240" rx="24" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2"/>
  <rect x="140" y="46" width="60" height="16" rx="8" fill="var(--dg-stroke, #9AA0A6)"/>
  <rect x="150" y="270" width="40" height="4" rx="2" fill="var(--dg-stroke, #9AA0A6)"/>
  <rect x="80" y="80" width="180" height="180" rx="4" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="100" y="100" width="140" height="26" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <text x="170" y="118" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">correct button</text>
  <text x="170" y="30" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">within safe area</text>

  <rect x="360" y="46" width="220" height="240" rx="24" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2"/>
  <rect x="440" y="46" width="60" height="16" rx="8" fill="var(--dg-stroke, #9AA0A6)"/>
  <rect x="450" y="270" width="40" height="4" rx="2" fill="var(--dg-stroke, #9AA0A6)"/>
  <rect x="380" y="80" width="180" height="180" rx="4" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="410" y="40" width="140" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="480" y="58" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">clipped by notch</text>
  <rect x="440" y="256" width="100" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="490" y="273" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">crowds indicator</text>
  <line x1="380" y1="30" x2="580" y2="290" stroke="var(--dg-line, #5F6368)" stroke-width="1.5"/>
  <text x="480" y="30" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">outside safe area</text>

  <text x="320" y="308" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Content must stay inside the dashed safe-area boundary, not just the phone's outer frame.</text>
</svg>
