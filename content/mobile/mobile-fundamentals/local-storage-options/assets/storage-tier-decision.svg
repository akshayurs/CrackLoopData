<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Picking the right local storage tier</text>

  <rect x="270" y="34" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="330" y="56" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">secret?</text>

  <line x1="290" y1="68" x2="150" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="200" y="80" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">yes</text>
  <rect x="60" y="100" width="180" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="150" y="122" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Keychain / Keystore</text>

  <line x1="370" y1="68" x2="400" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="410" y="85" font-size="9" fill="var(--dg-muted, #5F6368)">no</text>
  <rect x="330" y="100" width="140" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="400" y="122" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">structured?</text>

  <line x1="360" y1="134" x2="280" y2="166" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="300" y="152" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">yes</text>
  <rect x="200" y="166" width="160" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="280" y="188" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">SQLite / Room</text>

  <line x1="440" y1="134" x2="500" y2="166" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="480" y="150" font-size="9" fill="var(--dg-muted, #5F6368)">no</text>
  <rect x="420" y="166" width="160" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="188" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">large blob?</text>

  <line x1="460" y1="200" x2="420" y2="230" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="450" y="216" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">yes</text>
  <rect x="340" y="230" width="160" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="420" y="252" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">File system</text>

  <line x1="540" y1="200" x2="570" y2="230" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="565" y="216" font-size="9" fill="var(--dg-muted, #5F6368)">no</text>
  <rect x="510" y="230" width="140" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="580" y="252" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Key-value prefs</text>

  <text x="330" y="300" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Combined example: a database row storing metadata plus a file path to the blob on disk.</text>
</svg>
