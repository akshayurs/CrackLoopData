<svg viewBox="0 0 660 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Staged rollout with an independent kill switch</text>

  <polyline points="60,220 160,190 260,140 360,80 460,40" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>
  <circle cx="60" cy="220" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <text x="60" y="238" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">1%</text>
  <circle cx="160" cy="190" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <text x="160" y="208" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">10%</text>
  <circle cx="260" cy="140" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <text x="260" y="158" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">50%</text>
  <circle cx="460" cy="40" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <text x="460" y="30" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">100%</text>

  <path d="M60,180 L80,160 L80,180 L100,160" fill="none" stroke="var(--dg-line, #5F6368)"/>
  <text x="130" y="170" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">metrics healthy?</text>
  <text x="230" y="120" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">metrics healthy?</text>

  <circle cx="360" cy="170" r="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="360" y="174" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">halt</text>
  <line x1="330" y1="130" x2="360" y2="158" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
  <text x="400" y="195" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">rollout paused</text>

  <rect x="480" y="200" width="150" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="555" y="220" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Kill switch</text>
  <text x="555" y="236" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">instant, independent</text>
  <line x1="460" y1="200" x2="480" y2="223" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="3 2"/>

  <text x="330" y="280" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Rollout percentage climbs only while metrics stay healthy; the kill switch works regardless of rollout %.</text>
</svg>
