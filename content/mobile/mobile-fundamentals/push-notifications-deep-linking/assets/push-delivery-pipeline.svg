<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Push delivery pipeline — and where it silently drops</text>

  <g font-size="9" fill="var(--dg-ink, #202124)" text-anchor="middle">
    <rect x="10" y="80" width="90" height="34" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="55" y="101">Backend Event</text>
    <rect x="120" y="80" width="80" height="34" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="160" y="101">Your Server</text>
    <rect x="220" y="80" width="90" height="34" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="265" y="101">Push Service</text>
    <rect x="330" y="80" width="80" height="34" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="370" y="101">Device OS</text>
    <rect x="430" y="80" width="90" height="34" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="475" y="101">Notification</text>
    <rect x="540" y="80" width="60" height="34" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="570" y="101">Tap</text>
    <rect x="620" y="80" width="60" height="34" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="650" y="101">Deep Link</text>
  </g>

  <line x1="100" y1="97" x2="120" y2="97" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="200" y1="97" x2="220" y2="97" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="310" y1="97" x2="330" y2="97" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="410" y1="97" x2="430" y2="97" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="520" y1="97" x2="540" y2="97" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="600" y1="97" x2="620" y2="97" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="265" y="65" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">&#10060; stale token</text>
  <text x="370" y="65" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">&#10060; service outage</text>
  <text x="475" y="65" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">&#10060; notifications off</text>

  <text x="340" y="160" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Any one of these failure points means the user never sees the notification —</text>
  <text x="340" y="178" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">delivery has no guaranteed acknowledgment back to your server.</text>
</svg>
