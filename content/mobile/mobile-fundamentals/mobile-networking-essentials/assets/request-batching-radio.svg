<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Batching requests keeps the radio off longer</text>

  <text x="20" y="65" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Ten small requests</text>
  <line x1="180" y1="90" x2="600" y2="90" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <path d="M200,90 L210,55 L218,90 Z M240,90 L250,55 L258,90 Z M280,90 L290,55 L298,90 Z M320,90 L330,55 L338,90 Z M360,90 L370,55 L378,90 Z M400,90 L410,55 L418,90 Z M440,90 L450,55 L458,90 Z M480,90 L490,55 L498,90 Z M520,90 L530,55 L538,90 Z M560,90 L570,55 L578,90 Z" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1"/>
  <text x="390" y="110" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">radio ramps up + tails down, ten times</text>

  <text x="20" y="165" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">One batched request</text>
  <line x1="180" y1="190" x2="600" y2="190" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <path d="M220,190 L260,140 L340,140 L360,190 Z" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="290" y="210" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">same total bytes, one ramp-up + tail</text>

  <text x="320" y="230" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)"></text>
</svg>
