<svg viewBox="0 0 660 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Where secrets leak around secure storage</text>

  <rect x="20" y="70" width="90" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="65" y="94" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Server</text>
  <line x1="110" y1="90" x2="160" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="135" y="82" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">TLS</text>

  <rect x="160" y="70" width="90" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="205" y="94" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Client</text>
  <line x1="205" y1="110" x2="205" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="230" y="132" font-size="8" fill="var(--dg-muted, #5F6368)">write</text>

  <rect x="140" y="150" width="150" height="44" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="215" y="176" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Secure Storage</text>

  <line x1="290" y1="172" x2="360" y2="172" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="325" y="164" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">read per request</text>

  <rect x="360" y="150" width="120" height="44" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="420" y="176" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">API Call</text>

  <path d="M480,190 C520,220 300,235 215,194" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="400" y="228" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">delete on logout</text>

  <text x="65" y="60" font-size="9" fill="var(--dg-accent, #0C8F88)">&#9888; debug log</text>
  <text x="205" y="60" font-size="9" fill="var(--dg-accent, #0C8F88)">&#9888; crash report</text>
  <text x="420" y="140" font-size="9" fill="var(--dg-accent, #0C8F88)">&#9888; long-lived cache</text>

  <text x="330" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Each hop is a place secrets commonly leak outside the encrypted store.</text>
</svg>
