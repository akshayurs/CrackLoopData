<svg viewBox="0 0 660 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="330" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Doze cycles and app standby throttling</text>

  <text x="20" y="70" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Device idle</text>
  <rect x="120" y="52" width="120" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="180" y="71" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">suspended</text>
  <rect x="240" y="52" width="50" height="30" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="265" y="71" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">maint.</text>
  <rect x="290" y="52" width="120" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="350" y="71" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">suspended</text>
  <rect x="410" y="52" width="50" height="30" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="435" y="71" text-anchor="middle" font-size="8" fill="var(--dg-ink, #202124)">maint.</text>
  <rect x="460" y="52" width="150" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="535" y="71" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">suspended (longer)</text>

  <text x="20" y="140" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Low-usage app</text>
  <rect x="120" y="122" width="490" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="365" y="141" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">app-standby bucket — further throttled independently of doze</text>

  <text x="330" y="200" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Deferred work only executes in the short maintenance windows between repeating doze cycles.</text>
</svg>
