<svg viewBox="0 0 620 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="310" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">UI reads only from the local database</text>

  <rect x="30" y="100" width="140" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="100" y="134" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">UI</text>

  <line x1="170" y1="120" x2="230" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="200" y="112" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">write</text>
  <line x1="230" y1="150" x2="170" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="200" y="164" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">read</text>

  <rect x="230" y="90" width="180" height="80" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="120" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Local database</text>
  <text x="320" y="140" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">single source of truth</text>
  <text x="320" y="155" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">for the UI</text>

  <line x1="320" y1="170" x2="320" y2="200" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="340" y1="200" x2="340" y2="170" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="230" y="200" width="180" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="222" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Sync engine</text>
  <text x="320" y="238" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">async, independent of UI</text>

  <line x1="410" y1="220" x2="470" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="470" y1="240" x2="410" y2="240" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="470" y="195" width="120" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="230" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Server</text>
  <text x="530" y="245" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">sync target</text>

  <text x="310" y="270" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Sync push/pull happens independently — the UI never blocks on the network.</text>
</svg>
