<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Feed client: UI only ever talks to the paged cache</text>

  <rect x="30" y="120" width="120" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="140" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">UI</text>
  <text x="90" y="155" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">feed scroll view</text>

  <line x1="150" y1="145" x2="220" y2="145" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="220" y="105" width="180" height="80" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="310" y="140" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Paged local cache</text>
  <text x="310" y="158" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">UI never talks to network</text>

  <line x1="280" y1="185" x2="250" y2="215" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="340" y1="185" x2="370" y2="215" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="170" y="215" width="150" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="245" y="238" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Prefetcher</text>
  <text x="245" y="252" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">next page near bottom</text>

  <rect x="320" y="215" width="150" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="395" y="238" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Action queue</text>
  <text x="395" y="252" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">likes, comments (optimistic)</text>

  <rect x="500" y="200" width="120" height="80" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="560" y="245" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Remote API</text>
  <path d="M245,265 C245,300 480,290 500,255" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M395,265 C395,290 470,265 500,250" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="320" y="310" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Both the prefetcher and the action queue talk to the remote API; the UI never does.</text>
</svg>
