<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">BFF aggregates so the client makes one call</text>

  <rect x="20" y="90" width="100" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="117" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Mobile app</text>

  <line x1="120" y1="105" x2="200" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="160" y="97" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">1 request</text>

  <rect x="200" y="80" width="140" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="270" y="110" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Mobile BFF</text>
  <text x="270" y="128" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">aggregates for one screen</text>

  <line x1="340" y1="90" x2="420" y2="60" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="340" y1="115" x2="420" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="340" y1="140" x2="420" y2="170" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="420" y="35" width="160" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="60" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">User Service</text>
  <rect x="420" y="95" width="160" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="120" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Orders Service</text>
  <rect x="420" y="155" width="160" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="500" y="180" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Recommendations</text>

  <path d="M200,120 C160,160 120,150 120,136" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270" y="165" text-anchor="middle" font-size="8" fill="var(--dg-accent, #0C8F88)" font-weight="600">1 aggregated response</text>

  <line x1="120" y1="230" x2="640" y2="230" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="330" y="250" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Without a BFF: mobile app calls all three services directly —</text>
  <text x="330" y="266" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">3 round trips, and the device stitches the data together itself.</text>
</svg>
