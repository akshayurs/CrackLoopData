<svg viewBox="0 0 660 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">A miss falls through; a hit fills the layers above it</text>

  <rect x="20" y="60" width="140" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="90" y="80" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Memory cache</text>
  <text x="90" y="95" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">~1ms</text>

  <line x1="160" y1="85" x2="200" y2="85" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="180" y="75" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">miss</text>

  <rect x="200" y="60" width="140" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="270" y="80" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Disk cache</text>
  <text x="270" y="95" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">~10-50ms</text>

  <line x1="340" y1="85" x2="380" y2="85" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="360" y="75" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">miss</text>

  <rect x="380" y="60" width="140" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="450" y="80" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">CDN edge</text>
  <text x="450" y="95" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">~50-150ms</text>

  <line x1="520" y1="85" x2="560" y2="85" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="540" y="75" text-anchor="middle" font-size="7" fill="var(--dg-muted, #5F6368)">miss</text>

  <rect x="560" y="60" width="90" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="605" y="80" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Origin</text>
  <text x="605" y="95" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">~200ms+</text>

  <path d="M605,110 C605,160 90,160 90,110" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="330" y="175" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">a hit populates every layer above it</text>

  <text x="330" y="220" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">The next identical request short-circuits at a faster layer instead of repeating the walk.</text>
</svg>
