<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="280" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Dependencies point strictly downward</text>

  <rect x="130" y="46" width="300" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="280" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Presentation</text>
  <text x="280" y="90" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">UI, ViewModels</text>

  <line x1="280" y1="106" x2="280" y2="128" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="130" y="128" width="300" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="280" y="154" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Domain</text>
  <text x="280" y="172" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">use cases, business rules</text>

  <line x1="280" y1="188" x2="280" y2="210" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="130" y="210" width="300" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="280" y="236" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Data</text>
  <text x="280" y="254" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">repositories: network / DB / cache</text>

  <text x="280" y="300" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Domain depends only on the data layer's repository interface — implementation details never leak upward.</text>
</svg>
