<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Chat client: local DB as the source of truth</text>

  <rect x="30" y="120" width="120" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="90" y="140" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">UI</text>
  <text x="90" y="155" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">conversation screen</text>

  <line x1="150" y1="135" x2="220" y2="135" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="220" y1="155" x2="150" y2="155" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="220" y="105" width="180" height="80" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="310" y="135" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Local message DB</text>
  <text x="310" y="155" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">UI always renders</text>
  <text x="310" y="168" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">from here</text>

  <line x1="310" y1="185" x2="310" y2="215" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="220" y="215" width="180" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="310" y="238" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Outgoing queue</text>
  <text x="310" y="252" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">unsent messages</text>

  <line x1="400" y1="240" x2="450" y2="240" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="425" y="232" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">API call</text>

  <rect x="450" y="215" width="150" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="525" y="245" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Backend</text>

  <path d="M525,215 C500,150 450,110 400,105" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="95" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">real-time channel (WebSocket)</text>
  <text x="500" y="108" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">incoming messages write directly to local DB</text>

  <text x="320" y="300" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Sync engine drains the outgoing queue and pulls incoming messages, both feeding the same local DB.</text>
</svg>
