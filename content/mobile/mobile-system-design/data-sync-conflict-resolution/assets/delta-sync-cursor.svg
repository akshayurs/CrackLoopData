<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Server as the single relay for delta sync</text>

  <rect x="20" y="60" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="88" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Device A</text>

  <rect x="250" y="140" width="140" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="164" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Server</text>
  <text x="320" y="180" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">change cursor++</text>

  <rect x="490" y="220" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="555" y="248" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Device B</text>

  <path d="M150,83 C200,100 220,120 260,145" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="180" y="110" font-size="9" fill="var(--dg-ink, #202124)">push delta (record v2)</text>

  <path d="M390,182 C440,200 460,215 495,235" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="215" font-size="9" fill="var(--dg-ink, #202124)">pull since last cursor</text>

  <text x="555" y="290" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">merges delta locally</text>

  <path d="M85,106 C60,180 300,270 490,240" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="180" y="240" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">devices never sync directly</text>

  <text x="320" y="30" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)"></text>
</svg>
