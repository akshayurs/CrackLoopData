<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">An incident's timeline: page to postmortem</text>

  <line x1="50" y1="160" x2="670" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="90" cy="160" r="7" fill="var(--dg-accent, #0C8F88)"/>
  <text x="90" y="130" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Alert fires</text>
  <text x="90" y="185" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">on-call paged</text>

  <circle cx="220" cy="160" r="7" fill="var(--dg-accent, #0C8F88)"/>
  <text x="220" y="130" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Acknowledge</text>
  <text x="220" y="185" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">IC assigned</text>

  <circle cx="350" cy="160" r="7" fill="var(--dg-accent, #0C8F88)"/>
  <text x="350" y="130" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Mitigate</text>
  <text x="350" y="185" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">rollback / failover</text>

  <circle cx="480" cy="160" r="7" fill="var(--dg-accent, #0C8F88)"/>
  <text x="480" y="130" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Resolve</text>
  <text x="480" y="185" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">users unaffected</text>

  <circle cx="610" cy="160" r="7" fill="var(--dg-accent, #0C8F88)"/>
  <text x="610" y="130" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Postmortem</text>
  <text x="610" y="185" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">timeline + action items</text>

  <rect x="50" y="220" width="620" height="70" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="360" y="245" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Communication runs the whole way through</text>
  <text x="360" y="264" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">status page &#183; internal channel updates &#183; stakeholder notices</text>
  <text x="360" y="280" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">separate from the fix itself, owned by the incident commander</text>
</svg>
