<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="350" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The automation ladder</text>

  <rect x="40" y="260" width="110" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="290" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Manual</text>

  <rect x="160" y="220" width="110" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="215" y="250" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Documented</text>

  <rect x="280" y="180" width="110" height="50" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="335" y="210" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Scripted</text>

  <rect x="400" y="140" width="130" height="50" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="465" y="170" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Self-service</text>

  <rect x="540" y="100" width="120" height="50" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="600" y="130" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Eliminated</text>

  <line x1="150" y1="270" x2="165" y2="248" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="270" y1="230" x2="285" y2="208" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="190" x2="405" y2="168" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="150" x2="545" y2="128" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="95" y="316" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">someone SSHes in</text>
  <text x="215" y="330" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">runbook exists</text>
  <text x="335" y="326" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">a script runs it</text>
  <text x="465" y="326" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">anyone triggers it</text>
  <text x="600" y="326" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">problem can't recur</text>

  <text x="350" y="80" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each rung removes a human step until the toil disappears entirely</text>
</svg>
