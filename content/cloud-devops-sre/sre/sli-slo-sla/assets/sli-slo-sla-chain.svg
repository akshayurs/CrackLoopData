<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="350" y="28" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">SLI feeds SLO feeds SLA</text>

  <rect x="40" y="60" width="180" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="130" y="88" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">SLI</text>
  <text x="130" y="106" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">measured metric</text>
  <text x="130" y="120" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">e.g. 99.95% success</text>

  <line x1="220" y1="95" x2="270" y2="95" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="270" y="60" width="180" height="70" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="360" y="88" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">SLO</text>
  <text x="360" y="106" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">internal target</text>
  <text x="360" y="120" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">e.g. 99.9% over 30d</text>

  <line x1="450" y1="95" x2="500" y2="95" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="500" y="60" width="160" height="70" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="580" y="88" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">SLA</text>
  <text x="580" y="106" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">external promise</text>
  <text x="580" y="120" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">e.g. 99.5%, refund</text>

  <line x1="130" y1="150" x2="130" y2="290" stroke="var(--dg-line, #5F6368)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="360" y1="150" x2="360" y2="290" stroke="var(--dg-line, #5F6368)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="580" y1="150" x2="580" y2="290" stroke="var(--dg-line, #5F6368)" stroke-width="1" stroke-dasharray="4,3"/>

  <line x1="90" y1="230" x2="640" y2="230" stroke="var(--dg-muted, #5F6368)" stroke-width="1.5"/>
  <text x="90" y="200" font-size="12" fill="var(--dg-ink, #202124)">99.95%</text>
  <text x="345" y="200" font-size="12" fill="var(--dg-ink, #202124)">99.9%</text>
  <text x="565" y="200" font-size="12" fill="var(--dg-ink, #202124)">99.5%</text>

  <path d="M90,230 L345,205 L565,215" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="350" y="260" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">SLO sits above SLI's normal range; SLA sits looser than the SLO</text>
  <text x="350" y="278" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">— the gaps are the safety margins that absorb bad days</text>
</svg>
