<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="350" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A trace waterfall across four services</text>
  <g font-size="12" fill="var(--dg-ink, #202124)">
    <text x="10" y="60">Gateway</text>
    <rect x="90" y="48" width="560" height="18" rx="3" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>

    <text x="10" y="95">Auth</text>
    <rect x="100" y="83" width="60" height="18" rx="3" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>

    <text x="10" y="130">Orders</text>
    <rect x="170" y="118" width="380" height="18" rx="3" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>

    <text x="10" y="165">Inventory</text>
    <rect x="200" y="153" width="320" height="18" rx="3" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  </g>
  <text x="360" y="200" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">Orders -&gt; Inventory span dominates total latency</text>
  <text x="360" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Span width = time spent; nesting = parent-child call relationship.</text>
</svg>
