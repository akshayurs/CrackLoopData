<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="350" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">One request's footprint across the three pillars</text>
  <defs>
    <marker id="arrow-obs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <rect x="290" y="50" width="120" height="45" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="350" y="77" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">One request</text>

  <line x1="320" y1="95" x2="140" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow-obs)"/>
  <line x1="350" y1="95" x2="350" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow-obs)"/>
  <line x1="380" y1="95" x2="560" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow-obs)"/>

  <rect x="40" y="150" width="200" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="140" y="176" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Metrics</text>
  <text x="140" y="194" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">latency +1, error-rate ticks</text>

  <rect x="250" y="150" width="200" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="350" y="176" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Logs</text>
  <text x="350" y="194" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">one line, this request's ID</text>

  <rect x="460" y="150" width="200" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="560" y="176" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Traces</text>
  <text x="560" y="194" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">spans across every hop</text>

  <text x="350" y="250" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Same request ID ties all three together -- that correlation is what turns three</text>
  <text x="350" y="268" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">separate signals into one answerable story.</text>
</svg>
