<svg viewBox="0 0 740 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="370" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The logging pipeline, source to query</text>
  <defs>
    <marker id="arrow-log" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <g font-size="12" text-anchor="middle">
    <rect x="10" y="80" width="115" height="55" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="67" y="112" fill="var(--dg-ink, #202124)" font-weight="600">Agent</text>

    <rect x="150" y="80" width="115" height="55" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="207" y="112" fill="var(--dg-ink, #202124)" font-weight="600">Buffer/queue</text>

    <rect x="290" y="80" width="115" height="55" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="347" y="112" fill="var(--dg-ink, #202124)" font-weight="600">Processing</text>

    <rect x="430" y="80" width="115" height="55" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="487" y="112" fill="var(--dg-ink, #202124)" font-weight="600">Storage</text>

    <rect x="570" y="80" width="115" height="55" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="627" y="112" fill="var(--dg-ink, #202124)" font-weight="600">Query</text>

    <line x1="125" y1="107" x2="146" y2="107" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow-log)"/>
    <line x1="265" y1="107" x2="286" y2="107" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow-log)"/>
    <line x1="405" y1="107" x2="426" y2="107" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow-log)"/>
    <line x1="545" y1="107" x2="566" y2="107" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow-log)"/>
  </g>
  <text x="370" y="175" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The queue absorbs bursts; processing parses/filters/enriches before storage ever sees a line.</text>
</svg>
