<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Control plane: four components, one job</text>

  <rect x="40" y="52" width="640" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="360" y="78" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">API server</text>
  <text x="360" y="98" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">the only door in -&gt; validates, authenticates, exposes the REST API</text>

  <line x1="360" y1="122" x2="360" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="270" y="150" width="180" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="360" y="174" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">etcd</text>
  <text x="360" y="193" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">consistent key-value store</text>

  <line x1="200" y1="122" x2="130" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="150" width="180" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="130" y="174" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Scheduler</text>
  <text x="130" y="193" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">picks a node for new Pods</text>

  <line x1="520" y1="122" x2="590" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="500" y="150" width="180" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="590" y="174" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Controller manager</text>
  <text x="590" y="193" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">runs the reconciliation loops</text>

  <line x1="360" y1="240" x2="360" y2="266" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="257" font-size="12" fill="var(--dg-muted, #5F6368)">assigns &amp; watches</text>

  <rect x="120" y="266" width="480" height="120" rx="10" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="360" y="288" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Worker node</text>

  <rect x="150" y="300" width="130" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="215" y="325" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">kubelet</text>
  <text x="215" y="343" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">runs Pods here</text>

  <rect x="300" y="300" width="130" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="365" y="325" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">kube-proxy</text>
  <text x="365" y="343" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Service routing rules</text>

  <rect x="450" y="300" width="130" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="515" y="325" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Runtime</text>
  <text x="515" y="343" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">containerd / CRI-O</text>
</svg>
