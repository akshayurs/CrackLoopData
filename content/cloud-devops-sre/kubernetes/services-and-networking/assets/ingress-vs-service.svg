<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Request path: Ingress -&gt; Service -&gt; Pod</text>

  <rect x="20" y="50" width="120" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="80" y="78" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Internet user</text>

  <line x1="140" y1="73" x2="180" y2="73" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow4)"/>

  <rect x="180" y="50" width="180" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="270" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Ingress controller</text>
  <text x="270" y="88" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">host/path rules, TLS</text>

  <line x1="270" y1="96" x2="270" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow4)"/>
  <line x1="270" y1="96" x2="480" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow4)"/>

  <rect x="180" y="140" width="180" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="270" y="168" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Service: /api</text>

  <rect x="390" y="140" width="180" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="480" y="168" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Service: /web</text>

  <line x1="270" y1="186" x2="270" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow4)"/>
  <line x1="480" y1="186" x2="480" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow4)"/>

  <rect x="180" y="220" width="180" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="270" y="248" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">API Pods</text>

  <rect x="390" y="220" width="180" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="480" y="248" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Web Pods</text>
</svg>
