<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Deployment -&gt; ReplicaSet -&gt; Pods</text>

  <rect x="260" y="48" width="200" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="360" y="70" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Deployment</text>
  <text x="360" y="88" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">owns rollout history</text>

  <line x1="360" y1="98" x2="360" y2="126" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <rect x="240" y="126" width="240" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="360" y="148" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">ReplicaSet</text>
  <text x="360" y="166" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">keeps N Pods alive now</text>

  <line x1="300" y1="176" x2="180" y2="214" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="360" y1="176" x2="360" y2="214" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="420" y1="176" x2="540" y2="214" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <rect x="110" y="214" width="140" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="180" y="244" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Pod 1</text>

  <rect x="290" y="214" width="140" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="360" y="244" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Pod 2</text>

  <rect x="470" y="214" width="140" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="540" y="244" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Pod 3</text>

  <text x="360" y="300" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">New Pod spec -&gt; new ReplicaSet, old one scaled to zero</text>
</svg>
