<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Request/supply: PVC binds to a PV</text>

  <rect x="40" y="60" width="200" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="140" y="84" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Pod</text>
  <text x="140" y="102" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">references a PVC by name</text>

  <line x1="240" y1="90" x2="280" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow5)"/>

  <rect x="280" y="60" width="200" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="380" y="84" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">PVC</text>
  <text x="380" y="102" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">"I need 10Gi, RWO"</text>

  <line x1="480" y1="90" x2="520" y2="90" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow5)"/>
  <text x="500" y="76" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">binds</text>

  <rect x="520" y="60" width="160" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="600" y="84" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">PV</text>
  <text x="600" y="102" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">actual disk</text>

  <line x1="380" y1="120" x2="380" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow5)"/>
  <text x="380" y="152" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">no PV matches -></text>

  <rect x="240" y="160" width="280" height="56" rx="8" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="380" y="184" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">StorageClass</text>
  <text x="380" y="202" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">dynamically provisions a new PV</text>
</svg>
