<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="360" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Image layers stacked into one view</text>

  <g>
    <rect x="80" y="46" width="220" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="190" y="68" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">FROM node:18-slim</text>
    <rect x="80" y="80" width="220" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="190" y="102" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">COPY package.json .</text>
    <rect x="80" y="114" width="220" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="190" y="136" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">RUN npm install</text>
    <rect x="80" y="148" width="220" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="190" y="170" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">COPY . .</text>
    <rect x="80" y="182" width="220" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
    <text x="190" y="204" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Writable layer (runtime)</text>
    <text x="190" y="232" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Read-only layers, bottom to top</text>
  </g>

  <line x1="330" y1="115" x2="400" y2="115" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowL)"/>
  <defs>
    <marker id="arrowL" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <g>
    <rect x="420" y="46" width="220" height="170" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="530" y="70" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Union filesystem view</text>
    <text x="530" y="100" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">One merged tree the</text>
    <text x="530" y="118" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">running container sees</text>
    <text x="530" y="150" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Topmost layer's file</text>
    <text x="530" y="168" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">wins on any conflict</text>
  </g>

  <text x="360" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each instruction adds one read-only layer; the union filesystem merges them into a single view at runtime.</text>
</svg>
