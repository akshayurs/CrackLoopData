<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="360" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Containers vs virtual machines</text>

  <!-- Containers side -->
  <g>
    <text x="170" y="46" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Containers</text>
    <rect x="60" y="56" width="220" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="170" y="76" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">App A</text>
    <rect x="60" y="86" width="220" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="170" y="106" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">App B</text>
    <rect x="60" y="116" width="220" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="170" y="136" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Container runtime</text>
    <rect x="60" y="146" width="220" height="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="2"/>
    <text x="170" y="167" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Host kernel (shared)</text>
    <rect x="60" y="180" width="220" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="170" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Physical host</text>
  </g>

  <!-- VMs side -->
  <g>
    <text x="550" y="46" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">Virtual Machines</text>
    <rect x="440" y="56" width="100" height="94" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="490" y="76" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">App A</text>
    <text x="490" y="100" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Guest OS</text>
    <text x="490" y="116" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Guest kernel</text>

    <rect x="550" y="56" width="100" height="94" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="600" y="76" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">App B</text>
    <text x="600" y="100" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Guest OS</text>
    <text x="600" y="116" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Guest kernel</text>

    <rect x="440" y="150" width="210" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="545" y="170" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Hypervisor</text>
    <rect x="440" y="180" width="210" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="545" y="200" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Physical host</text>
  </g>

  <text x="360" y="250" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Containers share one host kernel; each VM boots its own guest OS and kernel above a hypervisor.</text>
</svg>
