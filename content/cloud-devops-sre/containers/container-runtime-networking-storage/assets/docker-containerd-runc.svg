<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="360" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Docker's delegation chain</text>

  <rect x="40" y="60" width="150" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="115" y="85" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">docker CLI</text>
  <text x="115" y="102" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">user-facing commands</text>

  <line x1="190" y1="90" x2="240" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <rect x="240" y="60" width="150" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="315" y="85" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">containerd</text>
  <text x="315" y="102" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">images + lifecycle</text>

  <line x1="390" y1="90" x2="440" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <rect x="440" y="60" width="150" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="515" y="85" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">runc</text>
  <text x="515" y="102" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">namespaces + cgroups</text>

  <line x1="590" y1="90" x2="640" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <text x="655" y="95" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">running</text>
  <text x="655" y="110" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">container</text>

  <rect x="240" y="150" width="150" height="40" rx="8" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="315" y="174" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Kubernetes calls here directly</text>
  <line x1="315" y1="150" x2="315" y2="122" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowR)"/>

  <defs>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="360" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">docker delegates to containerd, which delegates to runc for the actual container creation.</text>
</svg>
