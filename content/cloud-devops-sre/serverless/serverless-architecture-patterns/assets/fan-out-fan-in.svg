<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="350" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Fan-out / fan-in</text>

  <rect x="270" y="46" width="160" height="42" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="350" y="72" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">File upload event</text>

  <line x1="330" y1="88" x2="150" y2="130" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="88" x2="350" y2="130" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="88" x2="550" y2="130" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="80" y="130" width="140" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="150" y="158" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Generate thumbnail</text>

  <rect x="280" y="130" width="140" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="350" y="158" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Scan for viruses</text>

  <rect x="480" y="130" width="140" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="550" y="158" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Extract metadata</text>

  <text x="350" y="112" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">fan-out: parallel functions</text>

  <line x1="150" y1="176" x2="330" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="176" x2="350" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="176" x2="370" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="255" y="220" width="190" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="350" y="248" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Fan-in: mark upload ready</text>

  <text x="350" y="200" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">fan-in: wait for all three</text>

  <text x="350" y="298" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">One event, many parallel branches, one completion step once all finish.</text>
</svg>
