<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Order pipeline: functions chained by queues</text>

  <rect x="10" y="70" width="150" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="85" y="98" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Place order (HTTP)</text>

  <line x1="160" y1="93" x2="196" y2="93" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="178" y="82" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">queue</text>

  <rect x="196" y="70" width="150" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="271" y="98" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Charge payment</text>

  <line x1="346" y1="93" x2="382" y2="93" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="364" y="82" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">queue</text>

  <rect x="382" y="70" width="150" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="457" y="98" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Reserve inventory</text>

  <line x1="532" y1="93" x2="568" y2="93" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="550" y="82" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">queue</text>

  <rect x="568" y="70" width="145" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="640" y="98" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Send confirmation</text>

  <text x="360" y="160" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each step is a small, independently-deployable function.</text>
  <text x="360" y="182" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A failure at any step retries in place — earlier steps never re-run.</text>
</svg>
