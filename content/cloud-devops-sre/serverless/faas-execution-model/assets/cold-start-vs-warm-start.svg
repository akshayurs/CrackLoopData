<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Cold start vs warm start</text>

  <text x="20" y="64" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Cold</text>
  <rect x="70" y="46" width="110" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="125" y="70" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Trigger</text>
  <line x1="180" y1="66" x2="204" y2="66" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="204" y="46" width="130" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="269" y="66" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Provision sandbox</text>
  <line x1="334" y1="66" x2="358" y2="66" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="358" y="46" width="130" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="423" y="66" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Init runtime + deps</text>
  <line x1="488" y1="66" x2="512" y2="66" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="512" y="46" width="100" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="562" y="66" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Handler runs</text>
  <line x1="612" y1="66" x2="636" y2="66" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="636" y="46" width="70" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="671" y="66" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Response</text>

  <text x="269" y="104" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">setup time — most of a cold start's latency lives here</text>

  <line x1="20" y1="140" x2="700" y2="140" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 4"/>

  <text x="20" y="184" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Warm</text>
  <rect x="70" y="166" width="110" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="125" y="190" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Trigger</text>
  <line x1="180" y1="186" x2="358" y2="186" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="269" y="176" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">environment already alive — reused</text>

  <rect x="358" y="166" width="130" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="423" y="190" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Handler runs</text>
  <line x1="488" y1="186" x2="636" y2="186" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="636" y="166" width="70" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="671" y="190" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Response</text>

  <text x="360" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Cold: allocate -&gt; init runtime -&gt; load deps -&gt; run. Warm: skip straight to run.</text>
  <text x="360" y="262" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Same handler code; the gap is almost entirely in setup, not execution.</text>
</svg>
