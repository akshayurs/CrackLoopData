<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="350" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Why edge wins on latency: physical proximity</text>

  <circle cx="60" cy="150" r="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="155" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">User</text>

  <line x1="82" y1="140" x2="188" y2="100" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="140" y="105" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">~5ms</text>

  <rect x="190" y="70" width="150" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="265" y="92" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Edge point</text>
  <text x="265" y="108" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">of presence</text>

  <line x1="82" y1="162" x2="558" y2="230" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="245" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">~120ms across a continent</text>

  <rect x="560" y="205" width="130" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="625" y="227" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Cloud region</text>
  <text x="625" y="243" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">(central)</text>

  <text x="350" y="290" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Same code, same CPU speed — the edge point is just physically closer to the user.</text>
</svg>
