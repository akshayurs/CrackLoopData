<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="350" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Data plane vs control plane in a mesh</text>

  <rect x="40" y="50" width="620" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="350" y="75" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Control plane (e.g. Istiod)</text>
  <text x="350" y="95" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">configures routing rules, mTLS certs, policy — the "brain"</text>

  <line x1="150" y1="110" x2="150" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <line x1="350" y1="110" x2="350" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <line x1="550" y1="110" x2="550" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="360" y="132" font-size="10" fill="var(--dg-muted, #5F6368)">xDS config push</text>

  <rect x="90" y="150" width="120" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="180" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Sidecar proxy A</text>

  <rect x="290" y="150" width="120" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="350" y="180" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Sidecar proxy B</text>

  <rect x="490" y="150" width="120" height="50" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="550" y="180" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Sidecar proxy C</text>

  <rect x="90" y="230" width="120" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="258" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Service A</text>

  <rect x="290" y="230" width="120" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="350" y="258" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Service B</text>

  <rect x="490" y="230" width="120" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="550" y="258" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Service C</text>

  <line x1="150" y1="200" x2="150" y2="230" stroke="var(--dg-line, #5F6368)" stroke-width="1"/>
  <line x1="350" y1="200" x2="350" y2="230" stroke="var(--dg-line, #5F6368)" stroke-width="1"/>
  <line x1="550" y1="200" x2="550" y2="230" stroke="var(--dg-line, #5F6368)" stroke-width="1"/>

  <line x1="210" y1="175" x2="290" y2="175" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="175" x2="490" y2="175" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="300" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Data plane: sidecar proxies actually move every request,</text>
  <text x="350" y="318" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">applying mTLS, retries, and routing the control plane configured</text>
</svg>
