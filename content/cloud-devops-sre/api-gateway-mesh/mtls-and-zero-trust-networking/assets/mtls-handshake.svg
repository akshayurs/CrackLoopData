<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="340" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A mesh-enforced mTLS handshake</text>

  <rect x="60" y="70" width="180" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="150" y="98" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Service A sidecar</text>
  <text x="150" y="116" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">presents cert: spiffe://A</text>
  <text x="150" y="130" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">verifies B's cert</text>

  <rect x="440" y="70" width="180" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="530" y="98" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Service B sidecar</text>
  <text x="530" y="116" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">presents cert: spiffe://B</text>
  <text x="530" y="130" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">verifies A's cert</text>

  <line x1="240" y1="90" x2="440" y2="90" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="340" y="80" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">A's cert -&gt;</text>

  <line x1="440" y1="120" x2="240" y2="120" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="340" y="140" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">&lt;- B's cert</text>

  <rect x="230" y="180" width="220" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="340" y="204" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Mesh CA (control plane)</text>
  <text x="340" y="222" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">issues + rotates both certs</text>

  <line x1="150" y1="140" x2="280" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="530" y1="140" x2="400" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="340" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Both sides present and verify identity — not just the server,</text>
  <text x="340" y="286" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">which is what makes it mutual rather than ordinary one-way TLS</text>
</svg>
