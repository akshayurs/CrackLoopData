<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A request's path through an API gateway</text>

  <rect x="20" y="110" width="110" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="143" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Client</text>

  <line x1="130" y1="138" x2="175" y2="138" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="175" y="90" width="200" height="96" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="275" y="112" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">API Gateway</text>
  <text x="275" y="132" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">authenticate</text>
  <text x="275" y="148" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">rate limit</text>
  <text x="275" y="164" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">route + transform</text>

  <line x1="375" y1="115" x2="440" y2="60" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="375" y1="138" x2="440" y2="138" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="375" y1="161" x2="440" y2="216" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="440" y="30" width="140" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="510" y="63" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Users service</text>

  <rect x="440" y="110" width="140" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="510" y="143" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Orders service</text>

  <rect x="440" y="190" width="140" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="510" y="223" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Billing service</text>

  <text x="275" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">One entry point, north-south traffic —</text>
  <text x="275" y="248" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">backend services never see raw internet traffic directly</text>
</svg>
