<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="350" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Gateway at the edge, mesh internally</text>

  <rect x="20" y="70" width="110" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="100" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Internet</text>

  <line x1="130" y1="95" x2="175" y2="95" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="82" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">north-south</text>

  <rect x="175" y="70" width="160" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="255" y="92" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">API Gateway</text>
  <text x="255" y="108" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">auth, rate limit</text>

  <line x1="255" y1="120" x2="255" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="150" y="160" width="400" height="150" rx="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="350" y="182" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Service mesh (east-west)</text>

  <rect x="175" y="220" width="110" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="230" y="250" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Orders</text>

  <rect x="320" y="220" width="110" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="375" y="250" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Inventory</text>

  <line x1="285" y1="245" x2="320" y2="245" stroke="var(--dg-line, #5F6368)" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="465" y="220" width="110" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="520" y="250" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Payments</text>

  <line x1="430" y1="245" x2="465" y2="245" stroke="var(--dg-line, #5F6368)" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="350" y="332" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each layer solves what the other structurally can't reach</text>
</svg>
