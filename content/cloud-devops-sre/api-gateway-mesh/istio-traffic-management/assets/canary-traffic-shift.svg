<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="340" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Shifting 5% of traffic to a canary version</text>

  <rect x="40" y="60" width="140" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="90" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Clients</text>

  <line x1="180" y1="85" x2="230" y2="85" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="230" y="60" width="170" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="315" y="82" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">VirtualService</text>
  <text x="315" y="98" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">95% / 5% weighted rule</text>

  <line x1="315" y1="110" x2="230" y2="170" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="140" font-size="11" fill="var(--dg-ink, #202124)">95%</text>

  <line x1="315" y1="110" x2="450" y2="200" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <text x="400" y="150" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">5%</text>

  <rect x="130" y="170" width="180" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="220" y="195" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Subset: v1 (stable)</text>
  <text x="220" y="213" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">DestinationRule subset</text>

  <rect x="370" y="200" width="180" height="56" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="460" y="225" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Subset: v2 (canary)</text>
  <text x="460" y="243" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">watch error rate closely</text>

  <text x="340" y="295" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Same Service, two subsets by pod label — the split is enforced</text>
  <text x="340" y="311" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">by the mesh, independent of how many replicas each version runs</text>
</svg>
