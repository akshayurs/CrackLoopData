<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="340" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">How traffic gets redirected into the sidecar</text>

  <rect x="60" y="60" width="560" height="200" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="340" y="82" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">one Pod</text>

  <rect x="100" y="110" width="160" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="180" y="145" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">App container</text>

  <rect x="360" y="110" width="200" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="460" y="140" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Envoy sidecar</text>
  <text x="460" y="157" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">listener + route + cluster</text>

  <line x1="260" y1="140" x2="355" y2="140" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <text x="308" y="128" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">rewritten</text>

  <rect x="150" y="210" width="380" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="340" y="232" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">iptables NAT rules (or eBPF program)</text>

  <line x1="180" y1="170" x2="230" y2="210" stroke="var(--dg-line, #5F6368)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="130" y="196" font-size="10" fill="var(--dg-muted, #5F6368)">outbound call</text>

  <line x1="460" y1="210" x2="460" y2="170" stroke="var(--dg-line, #5F6368)" stroke-width="1.2" marker-end="url(#arrow)"/>

  <line x1="620" y1="140" x2="660" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="128" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">network</text>

  <text x="340" y="290" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The app thinks it's calling the network directly — the kernel silently</text>
  <text x="340" y="306" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">redirects every socket through the sidecar first, with no app code change</text>
</svg>
