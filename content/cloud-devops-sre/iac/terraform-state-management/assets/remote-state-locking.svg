<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow7" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A team sharing a locked remote backend</text>

  <rect x="30" y="60" width="150" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="90" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Engineer A</text>

  <rect x="30" y="200" width="150" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="105" y="230" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Engineer B</text>

  <line x1="180" y1="85" x2="270" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow7)"/>
  <line x1="180" y1="225" x2="270" y2="165" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow7)"/>

  <rect x="270" y="120" width="220" height="80" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="380" y="148" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Remote backend</text>
  <text x="380" y="168" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">S3 state + DynamoDB lock</text>
  <text x="380" y="186" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">only one apply at a time</text>

  <line x1="490" y1="160" x2="560" y2="160" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow7)"/>

  <rect x="560" y="130" width="130" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="625" y="154" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Cloud API</text>
  <text x="625" y="172" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">real resources</text>

  <text x="380" y="280" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Engineer B's apply waits for the lock Engineer A holds</text>
</svg>
