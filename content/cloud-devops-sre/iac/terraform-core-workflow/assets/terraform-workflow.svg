<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The core Terraform loop</text>

  <rect x="20" y="60" width="150" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="86" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">init</text>
  <text x="95" y="104" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">pull providers</text>

  <line x1="170" y1="90" x2="200" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow6)"/>

  <rect x="200" y="60" width="150" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="275" y="86" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">plan</text>
  <text x="275" y="104" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">preview the diff</text>

  <line x1="350" y1="90" x2="380" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow6)"/>

  <rect x="380" y="60" width="150" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="455" y="86" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">apply</text>
  <text x="455" y="104" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">execute the plan</text>

  <line x1="530" y1="90" x2="560" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow6)"/>

  <rect x="560" y="60" width="140" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="630" y="86" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">destroy</text>
  <text x="630" y="104" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">tear down (rare)</text>

  <text x="360" y="155" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">plan makes zero changes -&gt; apply is the only step that touches real infra</text>
</svg>
