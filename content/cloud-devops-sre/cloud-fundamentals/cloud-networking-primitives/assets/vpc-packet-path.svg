<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="360" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Packet path through a VPC</text>

  <text x="90" y="46" font-size="11" fill="var(--dg-muted, #5F6368)">Internet</text>
  <circle cx="70" cy="60" r="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="64" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">user</text>

  <rect x="40" y="100" width="640" height="210" rx="10" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="60" y="120" font-size="11" fill="var(--dg-muted, #5F6368)">VPC</text>

  <rect x="70" y="135" width="200" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="170" y="158" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Public subnet</text>
  <text x="170" y="176" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Internet GW + NAT GW</text>

  <rect x="300" y="135" width="180" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="390" y="158" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Private subnet</text>
  <text x="390" y="176" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">App tier</text>

  <rect x="510" y="135" width="180" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="600" y="158" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Private subnet</text>
  <text x="600" y="176" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Database tier</text>

  <line x1="88" y1="78" x2="150" y2="133" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <text x="90" y="110" font-size="9" fill="var(--dg-muted, #5F6368)">inbound HTTPS</text>

  <line x1="270" y1="165" x2="298" y2="165" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <line x1="480" y1="165" x2="508" y2="165" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowP)"/>

  <line x1="390" y1="195" x2="200" y2="230" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowP)"/>
  <text x="270" y="252" font-size="9" fill="var(--dg-muted, #5F6368)">outbound via NAT</text>

  <defs>
    <marker id="arrowP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="360" y="330" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Inbound reaches only the public subnet; private tiers route outbound traffic through the NAT gateway.</text>
</svg>
