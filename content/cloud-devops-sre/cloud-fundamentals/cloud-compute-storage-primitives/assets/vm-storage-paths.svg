<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">VM request path: block storage vs object storage</text>

  <rect x="300" y="50" width="120" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="360" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Virtual Machine</text>

  <!-- Block storage path -->
  <line x1="330" y1="100" x2="180" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowV)"/>
  <text x="220" y="120" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">local attach</text>
  <rect x="90" y="160" width="180" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="180" y="185" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Block storage</text>
  <text x="180" y="202" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">seen as a local disk</text>

  <!-- Object storage path -->
  <line x1="390" y1="100" x2="540" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowV)"/>
  <text x="500" y="120" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">HTTP API call</text>
  <rect x="450" y="160" width="180" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="540" y="185" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Object storage</text>
  <text x="540" y="202" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">reached over the network</text>

  <defs>
    <marker id="arrowV" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="360" y="260" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Block storage is a dedicated local attachment; object storage is an API call over the network.</text>
</svg>
