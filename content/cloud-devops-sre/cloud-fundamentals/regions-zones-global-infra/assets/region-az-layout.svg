<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A region's Availability Zone layout</text>

  <rect x="60" y="50" width="600" height="200" rx="10" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="80" y="70" font-size="12" fill="var(--dg-muted, #5F6368)">Region: us-east-1</text>

  <g>
    <rect x="90" y="90" width="150" height="130" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="165" y="112" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">AZ-a</text>
    <text x="165" y="132" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Power grid A</text>
    <text x="165" y="148" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Cooling A</text>
    <rect x="115" y="165" width="100" height="34" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="165" y="186" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Web + App</text>
  </g>

  <g>
    <rect x="285" y="90" width="150" height="130" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="360" y="112" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">AZ-b</text>
    <text x="360" y="132" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Power grid B</text>
    <text x="360" y="148" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Cooling B</text>
    <rect x="310" y="165" width="100" height="34" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="360" y="186" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Web + App</text>
  </g>

  <g>
    <rect x="480" y="90" width="150" height="130" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="555" y="112" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">AZ-c</text>
    <text x="555" y="132" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Power grid C</text>
    <text x="555" y="148" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Cooling C</text>
    <rect x="505" y="165" width="100" height="34" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="555" y="186" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">DB standby</text>
  </g>

  <line x1="240" y1="150" x2="285" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowAZ)"/>
  <line x1="285" y1="160" x2="240" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowAZ)"/>
  <line x1="435" y1="150" x2="480" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowAZ)"/>
  <line x1="480" y1="160" x2="435" y2="160" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowAZ)"/>
  <defs>
    <marker id="arrowAZ" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="360" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Low-latency private links connect AZs; each keeps independent power and cooling.</text>
</svg>
