<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Shared responsibility across service models</text>

  <text x="140" y="52" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)" font-weight="600">IaaS</text>
  <text x="360" y="52" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)" font-weight="600">PaaS</text>
  <text x="580" y="52" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)" font-weight="600">SaaS</text>

  <!-- IaaS column -->
  <g>
    <rect x="60" y="64" width="160" height="36" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="140" y="87" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Data + access</text>
    <rect x="60" y="100" width="160" height="36" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="140" y="123" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">App code</text>
    <rect x="60" y="136" width="160" height="36" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="140" y="159" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Runtime + OS</text>
    <rect x="60" y="172" width="160" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="140" y="195" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Virtualization</text>
    <rect x="60" y="208" width="160" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="140" y="231" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Physical hardware</text>
  </g>

  <!-- PaaS column -->
  <g>
    <rect x="280" y="64" width="160" height="36" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="360" y="87" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Data + access</text>
    <rect x="280" y="100" width="160" height="36" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="360" y="123" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">App code</text>
    <rect x="280" y="136" width="160" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="360" y="159" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Runtime + OS</text>
    <rect x="280" y="172" width="160" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="360" y="195" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Virtualization</text>
    <rect x="280" y="208" width="160" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="360" y="231" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Physical hardware</text>
  </g>

  <!-- SaaS column -->
  <g>
    <rect x="500" y="64" width="160" height="36" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="580" y="87" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Data + access</text>
    <rect x="500" y="100" width="160" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="580" y="123" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">App code</text>
    <rect x="500" y="136" width="160" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="580" y="159" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Runtime + OS</text>
    <rect x="500" y="172" width="160" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="580" y="195" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Virtualization</text>
    <rect x="500" y="208" width="160" height="36" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="580" y="231" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Physical hardware</text>
  </g>

  <rect x="60" y="264" width="14" height="14" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="80" y="275" font-size="11" fill="var(--dg-ink, #202124)">You secure this</text>
  <rect x="220" y="264" width="14" height="14" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="240" y="275" font-size="11" fill="var(--dg-ink, #202124)">Provider secures this</text>

  <text x="360" y="310" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The provider always owns hardware and virtualization; your slice shrinks as you move from IaaS toward SaaS.</text>
</svg>
