<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="350" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The GitOps reconciliation loop</text>
  <defs>
    <marker id="arrow-gitops" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <rect x="60" y="70" width="150" height="55" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="135" y="102" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Git repo</text>
  <text x="135" y="118" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">desired state</text>

  <rect x="280" y="70" width="150" height="55" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="355" y="102" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">GitOps agent</text>
  <text x="355" y="118" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">pulls + diffs</text>

  <rect x="500" y="70" width="150" height="55" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="575" y="102" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Cluster</text>
  <text x="575" y="118" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">actual state</text>

  <line x1="210" y1="97" x2="276" y2="97" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow-gitops)"/>
  <text x="243" y="88" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">pull</text>

  <line x1="430" y1="97" x2="496" y2="97" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow-gitops)"/>
  <text x="463" y="88" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">apply</text>

  <path d="M575,130 C575,200 355,200 355,130" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow-gitops)"/>
  <text x="465" y="215" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">observe actual state, diff vs desired, converge</text>

  <text x="350" y="260" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The agent inside the cluster pulls -- nothing outside pushes credentials in.</text>
</svg>
