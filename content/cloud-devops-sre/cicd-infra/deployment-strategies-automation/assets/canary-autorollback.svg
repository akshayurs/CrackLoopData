<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Automated canary: promote or abort on live metrics</text>
  <defs>
    <marker id="arrow-canary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <rect x="30" y="70" width="150" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="105" y="100" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Ship 5% traffic</text>

  <line x1="180" y1="95" x2="220" y2="95" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow-canary)"/>

  <rect x="220" y="70" width="180" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="310" y="93" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Analyze metrics</text>
  <text x="310" y="109" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">error rate, p99 latency</text>

  <line x1="400" y1="95" x2="440" y2="95" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow-canary)"/>

  <polygon points="440,95 480,70 520,95 480,120" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="480" y="99" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">healthy?</text>

  <line x1="500" y1="80" x2="560" y2="55" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow-canary)"/>
  <text x="600" y="50" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">yes</text>
  <rect x="540" y="60" width="150" height="45" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="615" y="87" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Promote to 100%</text>

  <line x1="480" y1="120" x2="480" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow-canary)"/>
  <text x="500" y="155" font-size="12" fill="var(--dg-muted, #5F6368)">no</text>
  <rect x="405" y="180" width="150" height="45" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="480" y="207" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Auto-rollback</text>

  <text x="360" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">No human watches the dashboard mid-rollout -- the gate itself decides promote vs abort.</text>
</svg>
