<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">From a tested artifact to a running Pod</text>
  <defs>
    <marker id="arrow-pipe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <g font-size="13" text-anchor="middle">
    <rect x="20" y="80" width="130" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="85" y="106" fill="var(--dg-ink, #202124)" font-weight="600">Build</text>
    <text x="85" y="124" fill="var(--dg-muted, #5F6368)" font-size="11">compile + package</text>

    <rect x="180" y="80" width="150" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="255" y="106" fill="var(--dg-ink, #202124)" font-weight="600">Containerize</text>
    <text x="255" y="124" fill="var(--dg-muted, #5F6368)" font-size="11">image w/ commit SHA tag</text>

    <rect x="360" y="80" width="130" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="425" y="106" fill="var(--dg-ink, #202124)" font-weight="600">Push</text>
    <text x="425" y="124" fill="var(--dg-muted, #5F6368)" font-size="11">to artifact registry</text>

    <rect x="520" y="80" width="180" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="610" y="106" fill="var(--dg-ink, #202124)" font-weight="600">Deploy</text>
    <text x="610" y="124" fill="var(--dg-muted, #5F6368)" font-size="11">same image, dev -&gt; stage -&gt; prod</text>

    <line x1="150" y1="110" x2="176" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow-pipe)"/>
    <line x1="330" y1="110" x2="356" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow-pipe)"/>
    <line x1="490" y1="110" x2="516" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow-pipe)"/>
  </g>
  <text x="360" y="185" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">One immutable artifact is built once, then promoted -&gt; never rebuilt per environment.</text>
</svg>
