<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Internet → DMZ → Internal network</text>

  <text x="70" y="50" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Internet</text>

  <rect x="240" y="40" width="160" height="150" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3"/>
  <text x="320" y="58" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">DMZ</text>
  <rect x="260" y="70" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="320" y="91" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Web server</text>
  <rect x="260" y="116" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="320" y="137" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Reverse proxy</text>

  <rect x="460" y="40" width="160" height="150" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3"/>
  <text x="540" y="58" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Internal</text>
  <rect x="480" y="70" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="540" y="91" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">App servers</text>
  <rect x="480" y="116" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="540" y="137" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Database</text>

  <line x1="100" y1="87" x2="240" y2="87" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="170" y="77" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">specific ports</text>

  <line x1="380" y1="87" x2="480" y2="87" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="77" text-anchor="middle" font-size="8" fill="var(--dg-accent, #0C8F88)">one narrow port</text>

  <line x1="100" y1="200" x2="600" y2="200" stroke="var(--dg-muted, #5F6368)" stroke-width="2"/>
  <line x1="90" y1="192" x2="110" y2="208" stroke="var(--dg-muted, #5F6368)" stroke-width="2"/>
  <line x1="110" y1="192" x2="90" y2="208" stroke="var(--dg-muted, #5F6368)" stroke-width="2"/>
  <text x="350" y="216" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">no direct internet-to-internal path</text>
</svg>
