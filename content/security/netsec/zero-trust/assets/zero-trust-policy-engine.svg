<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">A zero-trust access decision</text>

  <rect x="20" y="110" width="90" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="65" y="134" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Laptop request</text>

  <line x1="110" y1="130" x2="220" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="220" y="60" width="150" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="295" y="80" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Identity (MFA verified)</text>
  <rect x="220" y="115" width="150" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="295" y="135" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Device posture (managed)</text>
  <rect x="220" y="170" width="150" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="295" y="190" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Context (time, location)</text>

  <line x1="370" y1="75" x2="420" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="370" y1="130" x2="420" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="370" y1="185" x2="420" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="420" y="95" width="110" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="475" y="125" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Policy</text>
  <text x="475" y="140" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">engine</text>

  <line x1="530" y1="115" x2="580" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="530" y1="150" x2="580" y2="175" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="500" y="60" width="130" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="565" y="80" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Allow — scoped only</text>
  <rect x="500" y="160" width="130" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="565" y="180" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Deny / step-up auth</text>

  <text x="320" y="230" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">This same check runs on every request — not only at initial login.</text>
</svg>
