<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Mutual TLS between internal services</text>

  <rect x="60" y="60" width="130" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="125" y="82" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Service A</text>
  <text x="125" y="96" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">short-lived cert</text>

  <rect x="450" y="60" width="130" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="515" y="82" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Service B</text>
  <text x="515" y="96" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">short-lived cert</text>

  <line x1="190" y1="75" x2="450" y2="75" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="95" x2="190" y2="95" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="60" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="600">mutual verification — both directions</text>

  <line x1="190" y1="150" x2="450" y2="150" stroke="var(--dg-muted, #5F6368)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)" opacity="0.6"/>
  <text x="320" y="140" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">standard TLS — client verifies server only</text>

  <text x="320" y="200" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Both sides prove identity before any application request flows.</text>
</svg>
