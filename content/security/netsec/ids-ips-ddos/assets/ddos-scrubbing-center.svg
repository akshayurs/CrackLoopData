<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Traffic through a scrubbing center</text>

  <text x="70" y="60" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Internet</text>
  <line x1="70" y1="72" x2="70" y2="100" stroke="var(--dg-line, #5F6368)"/>
  <text x="70" y="95" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">attack traffic</text>
  <line x1="70" y1="110" x2="230" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="70" y="130" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">legit traffic</text>
  <line x1="70" y1="140" x2="230" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <!-- funnel -->
  <polygon points="230,110 400,110 340,190 290,190" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="315" y="135" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Scrubbing</text>
  <text x="315" y="150" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">center</text>

  <text x="245" y="170" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">✕ dropped</text>

  <line x1="315" y1="190" x2="315" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="315" y="200" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">clean only</text>

  <rect x="255" y="222" width="120" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="315" y="242" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Origin server</text>

  <text x="500" y="60" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">DNS/BGP rerouted</text>
  <text x="500" y="74" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">all traffic through</text>
  <text x="500" y="88" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">scrubbing center</text>
</svg>
