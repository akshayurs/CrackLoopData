<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">A remote-access tunnel into the office</text>

  <rect x="20" y="60" width="80" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="60" y="87" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Laptop</text>

  <rect x="130" y="55" width="170" height="56" rx="20" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="215" y="87" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">🔒 encrypted tunnel</text>
  <line x1="100" y1="83" x2="130" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="300" y1="83" x2="340" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="340" y="60" width="90" height="46" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="385" y="80" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">VPN gateway</text>
  <text x="385" y="96" text-anchor="middle" font-size="8" fill="var(--dg-accent, #0C8F88)">no further check</text>

  <line x1="430" y1="90" x2="530" y2="150" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="430" y1="90" x2="530" y2="200" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="430" y1="90" x2="530" y2="250" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <rect x="530" y="130" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="580" y="151" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">File server</text>
  <rect x="530" y="182" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="580" y="203" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Internal wiki</text>
  <rect x="530" y="234" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="580" y="255" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Database</text>

  <text x="320" y="284" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Once through the gateway, everything downstream is reachable for the whole session.</text>
</svg>
