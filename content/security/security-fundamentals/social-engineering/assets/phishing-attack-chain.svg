<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">A phishing attack chain</text>

  <!-- 5 stage boxes -->
  <g font-size="11" fill="var(--dg-ink, #202124)">
    <rect x="10" y="50" width="112" height="58" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="66" y="72" text-anchor="middle" font-weight="600">1. Spoofed</text>
    <text x="66" y="86" text-anchor="middle">"IT" email sent</text>

    <rect x="132" y="50" width="112" height="58" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="188" y="72" text-anchor="middle" font-weight="600">2. Victim</text>
    <text x="188" y="86" text-anchor="middle">clicks link</text>

    <rect x="254" y="50" width="112" height="58" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="310" y="72" text-anchor="middle" font-weight="600">3. Fake login</text>
    <text x="310" y="86" text-anchor="middle">creds entered</text>

    <rect x="376" y="50" width="112" height="58" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="432" y="72" text-anchor="middle" font-weight="600">4. Attacker</text>
    <text x="432" y="86" text-anchor="middle">logs in for real</text>

    <rect x="498" y="50" width="132" height="58" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
    <text x="564" y="72" text-anchor="middle" font-weight="600">5. Lateral move /</text>
    <text x="564" y="86" text-anchor="middle">exfiltration</text>
  </g>

  <line x1="122" y1="79" x2="132" y2="79" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="244" y1="79" x2="254" y2="79" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="366" y1="79" x2="376" y2="79" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="488" y1="79" x2="498" y2="79" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <!-- CIA property row -->
  <g font-size="10" fill="var(--dg-muted, #5F6368)">
    <text x="66" y="126" text-anchor="middle">Confidentiality</text>
    <text x="188" y="126" text-anchor="middle">Confidentiality</text>
    <text x="310" y="126" text-anchor="middle">Confidentiality</text>
    <text x="432" y="126" text-anchor="middle">Integrity</text>
    <text x="564" y="126" text-anchor="middle">Confidentiality + Integrity</text>
  </g>

  <!-- control that breaks the chain -->
  <line x1="66" y1="140" x2="66" y2="168" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="188" y1="140" x2="188" y2="168" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="432" y1="140" x2="432" y2="168" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>

  <rect x="10" y="168" width="112" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="66" y="184" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Email filtering</text>
  <text x="66" y="197" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">stops it here</text>

  <rect x="132" y="168" width="112" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="188" y="184" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Awareness</text>
  <text x="188" y="197" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">training</text>

  <rect x="376" y="168" width="112" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="432" y="184" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">MFA blocks</text>
  <text x="432" y="197" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">the login</text>

  <text x="320" y="240" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">No single control covers every stage.</text>
  <text x="320" y="258" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">MFA at stage 4 is the highest-leverage layer: it stops even a</text>
  <text x="320" y="274" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">correctly-harvested password from becoming a real login.</text>
</svg>
