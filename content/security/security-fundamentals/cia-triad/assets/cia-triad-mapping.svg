<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">CIA mapped onto a real system</text>

  <!-- client -->
  <rect x="10" y="130" width="80" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="50" y="157" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Client</text>

  <line x1="90" y1="153" x2="140" y2="153" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <!-- load balancer -->
  <rect x="140" y="130" width="90" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="185" y="150" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Load</text>
  <text x="185" y="163" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">balancer</text>

  <line x1="230" y1="153" x2="280" y2="153" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <!-- app servers -->
  <rect x="280" y="130" width="90" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="325" y="150" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">App</text>
  <text x="325" y="163" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">servers</text>

  <line x1="370" y1="153" x2="420" y2="153" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <!-- primary db -->
  <rect x="420" y="108" width="100" height="44" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="470" y="134" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Primary DB</text>
  <line x1="470" y1="152" x2="470" y2="178" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="420" y="178" width="100" height="44" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="470" y="204" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Replica</text>

  <!-- callouts -->
  <g font-size="10">
    <line x1="115" y1="130" x2="115" y2="215" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3 3"/>
    <text x="115" y="228" text-anchor="middle" fill="var(--dg-accent, #0C8F88)" font-weight="600">Confidentiality</text>
    <text x="115" y="241" text-anchor="middle" fill="var(--dg-muted, #5F6368)">TLS + encryption at rest</text>

    <line x1="325" y1="176" x2="325" y2="215" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3 3"/>
    <text x="325" y="228" text-anchor="middle" fill="var(--dg-accent, #0C8F88)" font-weight="600">Integrity</text>
    <text x="325" y="241" text-anchor="middle" fill="var(--dg-muted, #5F6368)">HMAC webhooks + audit log</text>

    <line x1="185" y1="176" x2="185" y2="260" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3 3"/>
    <line x1="470" y1="222" x2="470" y2="260" stroke="var(--dg-line, #5F6368)" stroke-dasharray="3 3"/>
    <text x="327" y="272" text-anchor="middle" fill="var(--dg-ink, #202124)" font-weight="600">Availability</text>
    <text x="327" y="285" text-anchor="middle" fill="var(--dg-muted, #5F6368)">load balancer + DB replica — spans both</text>
  </g>

  <text x="320" y="308" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Most real controls serve more than one property at once.</text>
</svg>
