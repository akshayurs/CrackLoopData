<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Layered controls around a sensitive asset</text>

  <circle cx="320" cy="215" r="175" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="320" cy="215" r="140" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="320" cy="215" r="105" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="320" cy="215" r="70" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <circle cx="320" cy="215" r="38" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="320" y="211" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">customer</text>
  <text x="320" y="223" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">payment data</text>

  <g font-size="10" fill="var(--dg-ink, #202124)">
    <text x="320" y="46" text-anchor="middle" font-weight="600">Perimeter firewall</text>
    <text x="320" y="59" text-anchor="middle" fill="var(--dg-muted, #5F6368)">stops scanning; nothing once through a legit port</text>

    <text x="320" y="81" text-anchor="middle" font-weight="600">Network segmentation / VLAN</text>
    <text x="320" y="94" text-anchor="middle" fill="var(--dg-muted, #5F6368)">limits lateral movement; nothing inside the segment</text>

    <text x="320" y="116" text-anchor="middle" font-weight="600">Host hardening &amp; patching</text>
    <text x="320" y="129" text-anchor="middle" fill="var(--dg-muted, #5F6368)">closes known exploits; nothing for zero-days</text>

    <text x="320" y="151" text-anchor="middle" font-weight="600">App input validation + authZ</text>
    <text x="320" y="164" text-anchor="middle" fill="var(--dg-muted, #5F6368)">stops injection; nothing if creds are already valid</text>

    <text x="320" y="203" text-anchor="middle" font-weight="600">Encryption at rest</text>
  </g>

  <text x="320" y="382" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">Breaching one ring still leaves every inner ring intact.</text>
</svg>
