<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Login flow — data flow diagram with trust boundaries</text>

  <!-- Browser -->
  <circle cx="60" cy="150" r="34" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="60" y="146" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Browser</text>
  <text x="60" y="160" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">(external)</text>

  <!-- trust boundary 1 -->
  <line x1="140" y1="50" x2="140" y2="300" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="140" y="42" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">internet → DMZ</text>

  <line x1="94" y1="150" x2="176" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <!-- API gateway -->
  <rect x="176" y="122" width="100" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="226" y="146" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">API gateway</text>
  <text x="226" y="160" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">(process)</text>

  <!-- trust boundary 2 -->
  <line x1="300" y1="50" x2="300" y2="300" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="300" y="42" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">DMZ → internal</text>

  <line x1="276" y1="150" x2="336" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <!-- auth service -->
  <rect x="336" y="122" width="100" height="56" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="386" y="146" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Auth service</text>
  <text x="386" y="160" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">(process)</text>

  <!-- session cache branches off -->
  <line x1="386" y1="178" x2="386" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="336" y="220" width="100" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="386" y="240" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Session cache</text>
  <text x="386" y="254" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">(process)</text>

  <!-- trust boundary 3 -->
  <line x1="460" y1="50" x2="460" y2="300" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="460" y="42" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">internal → data tier</text>

  <line x1="436" y1="150" x2="496" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <!-- user database -->
  <rect x="496" y="120" width="120" height="60" rx="4" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <line x1="496" y1="132" x2="616" y2="132" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="556" y="152" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">User database</text>
  <text x="556" y="166" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">(data store)</text>

  <text x="320" y="296" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">3 of the 4 elements sit behind at least one boundary — each crossing is</text>
  <text x="320" y="312" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">a place "already validated" must be checked, not assumed.</text>
</svg>
