<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="var(--dg-ink, #202124)">Misconfiguration chain, no exploit code needed</text>

  <rect x="20" y="60" width="90" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="65" y="85" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Internet</text>

  <rect x="150" y="50" width="170" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="235" y="72" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--dg-ink, #202124)">Load balancer</text>
  <text x="235" y="90" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">▲ admin console public,</text>
  <text x="235" y="102" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">default credentials</text>

  <rect x="370" y="50" width="170" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="455" y="72" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--dg-ink, #202124)">App server</text>
  <text x="455" y="90" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">▲ debug mode ON —</text>
  <text x="455" y="102" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">stack traces exposed</text>

  <rect x="590" y="50" width="100" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="640" y="72" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--dg-ink, #202124)">Database</text>
  <text x="640" y="90" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">▲ mgmt port open</text>
  <text x="640" y="102" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">to 0.0.0.0/0</text>

  <line x1="110" y1="80" x2="145" y2="80" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="320" y1="80" x2="365" y2="80" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="540" y1="80" x2="585" y2="80" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="350" y="150" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">attacker path: flag to flag, internet to database</text>
  <text x="350" y="175" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">no code exploit — a port scanner, admin/admin, and a stack trace naming</text>
  <text x="350" y="192" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">the ORM and version get an attacker to the database unaided</text>
</svg>
