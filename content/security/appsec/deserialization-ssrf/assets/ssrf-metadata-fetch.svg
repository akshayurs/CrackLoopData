<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="var(--dg-ink, #202124)">SSRF reaches the metadata service through a trusted proxy</text>

  <rect x="20" y="60" width="110" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="75" y="88" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Attacker</text>

  <rect x="180" y="40" width="480" height="170" rx="10" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="200" y="58" font-size="11" fill="var(--dg-muted, #5F6368)">cloud VPC</text>

  <line x1="130" y1="83" x2="175" y2="83" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="152" y="72" text-anchor="middle" font-size="18" fill="var(--dg-accent, #0C8F88)">✕</text>
  <text x="152" y="105" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">no direct path</text>

  <line x1="130" y1="83" x2="90" y2="83" stroke="var(--dg-line, #5F6368)"/>
  <line x1="90" y1="83" x2="90" y2="140" stroke="var(--dg-line, #5F6368)"/>
  <line x1="90" y1="140" x2="260" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="180" y="130" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">URL-fetch request → 169.254.169.254</text>

  <rect x="260" y="120" width="170" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="345" y="140" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--dg-ink, #202124)">Public app server</text>
  <text x="345" y="155" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">trusted, inside VPC</text>

  <line x1="430" y1="143" x2="500" y2="143" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="500" y="120" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="570" y="140" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Metadata svc</text>
  <text x="570" y="155" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">169.254.169.254</text>

  <path d="M500,150 C 400,200 200,200 90,155" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="345" y="205" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">IAM credentials returned to attacker</text>

  <text x="345" y="228" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">see Cloud Security IAM for what those credentials can then do</text>
</svg>
