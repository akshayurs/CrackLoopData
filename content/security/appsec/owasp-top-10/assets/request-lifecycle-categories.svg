<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="var(--dg-ink, #202124)">Top 10 categories by request-lifecycle stage</text>

  <rect x="20" y="45" width="160" height="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="100" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">Client</text>
  <rect x="190" y="45" width="160" height="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="270" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">Network</text>
  <rect x="360" y="45" width="180" height="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="450" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">Application</text>
  <rect x="550" y="45" width="150" height="20" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="625" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">Data</text>

  <rect x="20" y="80" width="160" height="70" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="100" y="102" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Cryptographic</text>
  <text x="100" y="116" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Failures (TLS)</text>
  <text x="100" y="136" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Software &amp; Data</text>
  <text x="100" y="148" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Integrity Failures</text>

  <rect x="190" y="80" width="160" height="70" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="270" y="102" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">SSRF</text>
  <text x="270" y="116" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">(outbound)</text>
  <text x="270" y="136" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Security</text>
  <text x="270" y="148" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Misconfiguration</text>

  <rect x="360" y="80" width="180" height="100" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="450" y="100" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Broken Access Control</text>
  <text x="450" y="118" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Injection</text>
  <text x="450" y="136" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Insecure Design</text>
  <text x="450" y="154" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Identification &amp;</text>
  <text x="450" y="168" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Authn Failures</text>

  <rect x="550" y="80" width="150" height="70" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="625" y="102" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Vulnerable &amp;</text>
  <text x="625" y="116" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Outdated Components</text>

  <rect x="20" y="200" width="680" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3"/>
  <text x="360" y="225" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Security Logging &amp; Monitoring Failures — cross-cutting, spans all four stages</text>

  <text x="360" y="270" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">Code review catches Application-stage bugs; config audits and dependency</text>
  <text x="360" y="286" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">scanning catch Network and Data-stage ones — one review style alone misses half.</text>
</svg>
