<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="var(--dg-ink, #202124)">GET /orders/1235 (user A's token)</text>

  <rect x="20" y="50" width="130" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="85" y="78" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Browser</text>

  <line x1="150" y1="73" x2="200" y2="73" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="205" y="50" width="180" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="295" y="70" text-anchor="middle" font-size="12" font-weight="600" fill="var(--dg-ink, #202124)">Auth middleware</text>
  <text x="295" y="86" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">token is valid ✓</text>

  <line x1="295" y1="96" x2="295" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)" stroke-dasharray="4 3"/>

  <rect x="200" y="130" width="190" height="46" rx="8" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="295" y="150" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">ownership check</text>
  <text x="295" y="165" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">— never happens</text>

  <line x1="295" y1="96" x2="500" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="410" y="130" width="200" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="510" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="var(--dg-ink, #202124)">DB query</text>
  <text x="510" y="166" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">WHERE id = 1235 (no owner filter)</text>

  <line x1="510" y1="176" x2="510" y2="210" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="500" y1="220" x2="150" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="150" y="200" width="360" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="330" y="225" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">returns user B's order to user A's browser</text>
</svg>
