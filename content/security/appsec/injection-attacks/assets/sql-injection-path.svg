<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="var(--dg-ink, #202124)">Where code and data merge</text>

  <rect x="20" y="60" width="150" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="82" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">Login form</text>
  <text x="95" y="98" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">password field</text>

  <line x1="170" y1="85" x2="230" y2="85" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="235" y="55" width="220" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="345" y="78" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--dg-ink, #202124)">App server</text>
  <text x="345" y="94" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">string-concatenates input into SQL</text>

  <text x="345" y="130" text-anchor="middle" font-size="10.5" fill="var(--dg-accent, #0C8F88)">▲ code and data merge here — the only fixable point</text>

  <line x1="455" y1="85" x2="520" y2="85" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="525" y="60" width="150" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="600" y="82" text-anchor="middle" font-size="11.5" fill="var(--dg-ink, #202124)">Database</text>
  <text x="600" y="98" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">executes clause, returns all rows</text>

  <text x="350" y="170" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">attacker-controlled clause runs with the query's full privileges</text>
</svg>
