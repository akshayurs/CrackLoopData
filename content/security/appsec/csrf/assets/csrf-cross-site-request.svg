<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="var(--dg-ink, #202124)">CSRF: an unrelated site triggers a bank request</text>

  <rect x="30" y="50" width="220" height="150" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="140" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="var(--dg-ink, #202124)">Victim's browser</text>
  <rect x="55" y="90" width="170" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.2"/>
  <text x="140" y="111" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">bank.com session cookie</text>
  <rect x="55" y="135" width="170" height="50" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <text x="140" y="155" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">visits evil.com — hidden</text>
  <text x="140" y="170" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">auto-submitting form</text>

  <line x1="250" y1="150" x2="420" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="335" y="138" text-anchor="middle" font-size="10.5" fill="var(--dg-accent, #0C8F88)">POST /transfer</text>
  <text x="335" y="168" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">cookie attached automatically —</text>
  <text x="335" y="180" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">same domain, doesn't matter which page triggered it</text>

  <rect x="425" y="90" width="220" height="90" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="535" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="var(--dg-ink, #202124)">bank.com server</text>
  <text x="535" y="140" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">processes transfer as if</text>
  <text x="535" y="155" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">the victim intended it</text>
</svg>
