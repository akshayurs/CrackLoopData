<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="var(--dg-ink, #202124)">Stored XSS: three steps, attacker and victim never meet</text>

  <rect x="20" y="55" width="150" height="55" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="78" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">1. Attacker</text>
  <text x="95" y="94" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">posts &lt;script&gt; comment</text>

  <line x1="170" y1="82" x2="230" y2="82" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="235" y="55" width="170" height="55" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="320" y="78" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">2. Database</text>
  <text x="320" y="94" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">payload persists here</text>

  <line x1="405" y1="82" x2="465" y2="82" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="470" y="55" width="210" height="55" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="575" y="78" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">3. Victim's browser</text>
  <text x="575" y="94" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">executes with victim's own session</text>

  <line x1="575" y1="110" x2="575" y2="150" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="470" y="150" width="210" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="575" y="170" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">session cookie sent to</text>
  <text x="575" y="185" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">attacker-controlled server</text>
</svg>
