<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">HMAC construction</text>

  <text x="150" y="46" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">Sender</text>

  <rect x="20" y="56" width="90" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="65" y="78" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Message</text>
  <rect x="20" y="102" width="90" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="65" y="124" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Secret key</text>

  <line x1="110" y1="74" x2="150" y2="90" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="110" y1="120" x2="150" y2="98" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="150" y="70" width="90" height="46" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="195" y="90" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Hash (SHA-256)</text>
  <text x="195" y="104" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">keyed</text>

  <line x1="240" y1="93" x2="280" y2="93" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="280" y="74" width="80" height="38" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="320" y="97" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Tag</text>

  <text x="320" y="150" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">message + tag travel together, in plaintext</text>
  <line x1="150" y1="160" x2="500" y2="160" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="500" y="188" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)" font-weight="600">Receiver</text>

  <rect x="440" y="198" width="90" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="485" y="220" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Message</text>
  <rect x="440" y="244" width="90" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="485" y="266" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Shared key</text>

  <line x1="530" y1="216" x2="450" y2="176" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="530" y1="262" x2="450" y2="176" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="410" y="140" width="90" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="455" y="162" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Recompute tag</text>

  <rect x="410" y="286" width="120" height="28" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="470" y="305" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Compare — match?</text>
</svg>
