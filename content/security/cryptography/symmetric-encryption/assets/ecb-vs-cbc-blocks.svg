<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Why mode selection matters, block by block</text>

  <!-- panel 1: plaintext pattern -->
  <text x="105" y="48" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Plaintext</text>
  <g stroke="var(--dg-stroke, #9AA0A6)">
    <rect x="45" y="58" width="120" height="120" fill="var(--dg-fill, #F1F3F4)"/>
    <rect x="45" y="58" width="30" height="30" fill="var(--dg-accent-bg, #E3F3F1)"/>
    <rect x="75" y="58" width="30" height="30" fill="var(--dg-accent-bg, #E3F3F1)"/>
    <rect x="105" y="58" width="30" height="30" fill="var(--dg-accent-bg, #E3F3F1)"/>
    <rect x="135" y="58" width="30" height="30" fill="var(--dg-accent-bg, #E3F3F1)"/>
    <rect x="75" y="88" width="30" height="30" fill="var(--dg-fill, #F1F3F4)"/>
    <rect x="105" y="88" width="30" height="30" fill="var(--dg-fill, #F1F3F4)"/>
    <rect x="45" y="118" width="30" height="30" fill="var(--dg-accent-bg, #E3F3F1)"/>
    <rect x="135" y="118" width="30" height="30" fill="var(--dg-accent-bg, #E3F3F1)"/>
    <rect x="45" y="148" width="120" height="30" fill="var(--dg-accent-bg, #E3F3F1)"/>
  </g>
  <text x="105" y="192" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">a shape with repeated regions</text>

  <!-- panel 2: ECB leak -->
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">ECB — each block alone</text>
  <g stroke="var(--dg-stroke, #9AA0A6)">
    <rect x="260" y="58" width="120" height="120" fill="var(--dg-fill, #F1F3F4)"/>
    <rect x="260" y="58" width="30" height="30" fill="var(--dg-accent, #0C8F88)" opacity="0.5"/>
    <rect x="290" y="58" width="30" height="30" fill="var(--dg-accent, #0C8F88)" opacity="0.5"/>
    <rect x="320" y="58" width="30" height="30" fill="var(--dg-accent, #0C8F88)" opacity="0.5"/>
    <rect x="350" y="58" width="30" height="30" fill="var(--dg-accent, #0C8F88)" opacity="0.5"/>
    <rect x="290" y="88" width="30" height="30" fill="var(--dg-fill, #F1F3F4)"/>
    <rect x="320" y="88" width="30" height="30" fill="var(--dg-fill, #F1F3F4)"/>
    <rect x="260" y="118" width="30" height="30" fill="var(--dg-accent, #0C8F88)" opacity="0.5"/>
    <rect x="350" y="118" width="30" height="30" fill="var(--dg-accent, #0C8F88)" opacity="0.5"/>
    <rect x="260" y="148" width="120" height="30" fill="var(--dg-accent, #0C8F88)" opacity="0.5"/>
  </g>
  <text x="320" y="192" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">identical blocks → identical ciphertext</text>
  <text x="320" y="204" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">the shape still leaks through</text>

  <!-- panel 3: CBC noise -->
  <text x="535" y="48" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">CBC — chained</text>
  <g stroke="var(--dg-stroke, #9AA0A6)">
    <rect x="475" y="58" width="120" height="120" fill="var(--dg-fill, #F1F3F4)"/>
    <rect x="475" y="58" width="15" height="15" fill="var(--dg-muted, #5F6368)" opacity="0.35"/>
    <rect x="505" y="58" width="15" height="15" fill="var(--dg-muted, #5F6368)" opacity="0.6"/>
    <rect x="535" y="73" width="15" height="15" fill="var(--dg-muted, #5F6368)" opacity="0.2"/>
    <rect x="565" y="58" width="15" height="15" fill="var(--dg-muted, #5F6368)" opacity="0.5"/>
    <rect x="490" y="88" width="15" height="15" fill="var(--dg-muted, #5F6368)" opacity="0.7"/>
    <rect x="520" y="103" width="15" height="15" fill="var(--dg-muted, #5F6368)" opacity="0.3"/>
    <rect x="550" y="88" width="15" height="15" fill="var(--dg-muted, #5F6368)" opacity="0.55"/>
    <rect x="475" y="118" width="15" height="15" fill="var(--dg-muted, #5F6368)" opacity="0.4"/>
    <rect x="505" y="133" width="15" height="15" fill="var(--dg-muted, #5F6368)" opacity="0.65"/>
    <rect x="565" y="118" width="15" height="15" fill="var(--dg-muted, #5F6368)" opacity="0.25"/>
    <rect x="490" y="148" width="15" height="15" fill="var(--dg-muted, #5F6368)" opacity="0.5"/>
    <rect x="535" y="163" width="15" height="15" fill="var(--dg-muted, #5F6368)" opacity="0.7"/>
  </g>
  <text x="535" y="192" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">each block depends on the one before</text>
  <text x="535" y="204" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">no structure survives</text>

  <text x="320" y="240" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Same key, same cipher, same plaintext — the mode decides the outcome.</text>
</svg>
