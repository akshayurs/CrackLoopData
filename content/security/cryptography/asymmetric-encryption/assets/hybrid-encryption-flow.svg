<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Hybrid encryption — how TLS and PGP actually work</text>

  <text x="90" y="46" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Sender</text>

  <rect x="20" y="56" width="60" height="34" rx="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="50" y="77" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">AES key</text>

  <line x1="80" y1="73" x2="150" y2="73" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="150" y="55" width="90" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="195" y="70" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">🔒 encrypt w/</text>
  <text x="195" y="82" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">recipient pubkey</text>

  <text x="195" y="105" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">slow, once, tiny data</text>

  <line x1="240" y1="73" x2="310" y2="73" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="310" y="58" width="90" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="355" y="77" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">encrypted key</text>

  <!-- bulk payload -->
  <rect x="20" y="130" width="120" height="60" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="80" y="155" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Bulk payload</text>
  <text x="80" y="170" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">(large)</text>
  <line x1="140" y1="160" x2="220" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="180" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">AES</text>
  <rect x="220" y="130" width="120" height="60" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="280" y="155" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">Ciphertext</text>
  <text x="280" y="170" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">fast, continuous</text>

  <!-- both sent together -->
  <line x1="355" y1="88" x2="490" y2="215" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="280" y1="190" x2="490" y2="230" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="530" y="205" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Recipient</text>
  <rect x="470" y="215" width="130" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="535" y="234" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">private key → AES key</text>
  <rect x="470" y="255" width="130" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="535" y="274" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">AES key → payload</text>
</svg>
