<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="240" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Certificate chain — leaf to root</text>

  <rect x="140" y="240" width="200" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="240" y="265" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">example.com</text>
  <text x="240" y="280" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">leaf certificate</text>

  <line x1="240" y1="240" x2="240" y2="188" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="270" y="216" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">signed by</text>

  <rect x="120" y="128" width="240" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="240" y="153" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Intermediate CA</text>
  <text x="240" y="168" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">certificate</text>

  <line x1="240" y1="128" x2="240" y2="76" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="270" y="104" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">signed by</text>

  <rect x="110" y="30" width="260" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="240" y="52" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Root CA</text>
  <text x="240" y="66" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">pre-installed, trusted by OS/browser</text>

  <text x="240" y="322" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">Verification walks bottom-to-top, checking each signature — until it hits a root already trusted.</text>
</svg>
