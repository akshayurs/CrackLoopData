<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">The general encrypt / decrypt pipeline</text>

  <rect x="20" y="90" width="120" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="80" y="120" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Plaintext</text>

  <line x1="140" y1="115" x2="230" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="185" y="105" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">encrypt(pt, key)</text>

  <rect x="230" y="90" width="150" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="305" y="120" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Ciphertext</text>

  <line x1="380" y1="115" x2="470" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="425" y="105" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">decrypt(ct, key)</text>

  <rect x="470" y="90" width="120" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="530" y="120" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Plaintext</text>

  <!-- key feeding both -->
  <rect x="270" y="180" width="80" height="36" rx="18" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="310" y="203" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">🔒 Key</text>
  <line x1="300" y1="180" x2="240" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="330" y1="180" x2="440" y2="140" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="320" y="238" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">The algorithm (boxes and arrows) is public — only the key is secret.</text>
</svg>
