<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Diffie-Hellman key exchange</text>
  <text x="320" y="38" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">shared public parameter known to both sides in advance</text>

  <text x="130" y="66" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Alice</text>
  <text x="510" y="66" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Bob</text>

  <rect x="60" y="76" width="140" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="130" y="97" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">private a → public A</text>

  <rect x="440" y="76" width="140" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="510" y="97" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">private b → public B</text>

  <!-- crossing arrows -->
  <line x1="200" y1="110" x2="440" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="320" y="110" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">A sent →</text>
  <line x1="440" y1="110" x2="200" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="320" y="150" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">← B sent</text>

  <!-- eavesdropper -->
  <circle cx="320" cy="128" r="22" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="320" y="132" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">👁</text>
  <line x1="306" y1="114" x2="334" y2="142" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <line x1="334" y1="114" x2="306" y2="142" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>

  <text x="320" y="172" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">eavesdropper sees A, B — can't derive the secret</text>

  <rect x="60" y="200" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="130" y="217" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">combine B with a</text>
  <text x="130" y="230" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">→ shared secret</text>

  <rect x="440" y="200" width="140" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="510" y="217" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">combine A with b</text>
  <text x="510" y="230" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">→ shared secret</text>

  <line x1="130" y1="240" x2="280" y2="280" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="510" y1="240" x2="360" y2="280" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="250" y="280" width="140" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="320" y="304" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">identical secret</text>
</svg>
