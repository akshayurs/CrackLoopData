<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">OAuth 2 Authorization Code + PKCE</text>

  <text x="90" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-muted, #5F6368)">Browser</text>
  <text x="350" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-muted, #5F6368)">Client app</text>
  <text x="610" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-muted, #5F6368)">Auth / Resource Server</text>

  <line x1="90" y1="50" x2="90" y2="300" stroke="var(--dg-stroke, #9AA0A6)"/>
  <line x1="350" y1="50" x2="350" y2="300" stroke="var(--dg-stroke, #9AA0A6)"/>
  <line x1="610" y1="50" x2="610" y2="300" stroke="var(--dg-stroke, #9AA0A6)"/>

  <line x1="350" y1="70" x2="90" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="220" y="65" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">1. redirect + code_challenge</text>

  <line x1="90" y1="100" x2="610" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="350" y="95" text-anchor="middle" font-size="9.5" fill="var(--dg-accent, #0C8F88)">2. user authenticates directly — password never touches the Client</text>

  <line x1="610" y1="130" x2="90" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="350" y="125" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">3. redirect back with short-lived code</text>

  <line x1="90" y1="160" x2="350" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="220" y="155" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">code arrives via browser</text>

  <line x1="350" y1="195" x2="610" y2="195" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="185" text-anchor="middle" font-size="9.5" fill="var(--dg-accent, #0C8F88)">4. code + code_verifier</text>
  <text x="480" y="210" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">server-to-server — token never in browser</text>

  <line x1="610" y1="230" x2="350" y2="230" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="480" y="225" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">access token</text>

  <line x1="350" y1="260" x2="610" y2="260" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="480" y="255" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">5. call Resource Server with access token</text>
</svg>
