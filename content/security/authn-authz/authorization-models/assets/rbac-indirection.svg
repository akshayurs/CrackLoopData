  <text x="320" y="46" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-muted, #5F6368)">Roles</text>
  <text x="560" y="46" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-muted, #5F6368)">Permissions</text>

  <rect x="15" y="60" width="90" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="60" y="80" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Alice</text>
  <rect x="15" y="110" width="90" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="60" y="130" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Bob</text>
  <rect x="15" y="160" width="90" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="60" y="180" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Carol</text>

  <rect x="255" y="55" width="130" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="320" y="75" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">admin</text>
  <rect x="255" y="115" width="130" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
