  <text x="545" y="63" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">create-post</text>
  <rect x="470" y="80" width="150" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
