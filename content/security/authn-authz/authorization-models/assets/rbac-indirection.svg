  <line x1="105" y1="125" x2="250" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="105" y1="175" x2="250" y2="190" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <line x1="385" y1="65" x2="465" y2="58" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
