  <line x1="385" y1="125" x2="465" y2="58" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="385" y1="130" x2="465" y2="93" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="385" y1="135" x2="465" y2="163" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="385" y1="188" x2="465" y2="163" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="320" y="240" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">users never connect directly to permissions — always through a role</text>
