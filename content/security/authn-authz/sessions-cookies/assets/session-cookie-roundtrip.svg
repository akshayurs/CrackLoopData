<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">Session cookie round trip</text>

  <text x="120" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-muted, #5F6368)">Browser</text>
  <text x="580" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-muted, #5F6368)">Server + Redis</text>

  <line x1="120" y1="50" x2="120" y2="300" stroke="var(--dg-stroke, #9AA0A6)"/>
  <line x1="580" y1="50" x2="580" y2="300" stroke="var(--dg-stroke, #9AA0A6)"/>

  <line x1="120" y1="75" x2="580" y2="75" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="350" y="68" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">1. POST /login (credentials)</text>

  <line x1="580" y1="115" x2="120" y2="115" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="100" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">2. session in Redis; Set-Cookie: id=…;</text>
  <text x="350" y="112" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">HttpOnly; Secure; SameSite=Lax</text>

  <rect x="60" y="130" width="120" height="26" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="120" y="147" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">🔑 cookie stored</text>

  <line x1="120" y1="170" x2="580" y2="170" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="350" y="163" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">3. every request: Cookie header attached automatically</text>
  <text x="350" y="185" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">no JavaScript involved</text>

  <line x1="580" y1="220" x2="120" y2="220" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="350" y="210" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">4. server looks up session ID in Redis each request</text>
  <text x="350" y="235" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">→ treated as authenticated</text>
</svg>
