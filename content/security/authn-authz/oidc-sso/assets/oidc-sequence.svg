<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">OIDC = OAuth + one scope, one token</text>

  <text x="90" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-muted, #5F6368)">Browser</text>
  <text x="350" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-muted, #5F6368)">Client</text>
  <text x="610" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-muted, #5F6368)">Authorization Server</text>

  <line x1="90" y1="50" x2="90" y2="300" stroke="var(--dg-stroke, #9AA0A6)"/>
  <line x1="350" y1="50" x2="350" y2="300" stroke="var(--dg-stroke, #9AA0A6)"/>
  <line x1="610" y1="50" x2="610" y2="300" stroke="var(--dg-stroke, #9AA0A6)"/>

  <line x1="350" y1="70" x2="90" y2="70" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="220" y="65" text-anchor="middle" font-size="9.5" fill="var(--dg-accent, #0C8F88)">1. redirect, scope=openid + oauth scopes</text>

  <line x1="90" y1="100" x2="610" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="350" y="95" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">2. user authenticates directly</text>

  <line x1="610" y1="130" x2="90" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="350" y="125" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">3. redirect back with code</text>

  <line x1="90" y1="160" x2="350" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <line x1="350" y1="195" x2="610" y2="195" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="480" y="185" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">4. exchange code, server-to-server</text>

  <line x1="610" y1="225" x2="350" y2="225" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="270" y="235" width="70" height="24" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="305" y="251" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">ID token</text>
  <rect x="345" y="235" width="90" height="24" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="390" y="251" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">access token</text>
  <text x="480" y="215" text-anchor="middle" font-size="9.5" fill="var(--dg-accent, #0C8F88)">BOTH tokens, one response</text>

  <line x1="350" y1="280" x2="610" y2="280" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="480" y="275" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">5. ID token read for identity; access token calls /userinfo</text>

  <text x="350" y="308" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">same flow as plain OAuth, one extra token, one extra scope</text>
</svg>
