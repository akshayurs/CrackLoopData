<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">JWT: stateless verification across services</text>

  <rect x="20" y="45" width="120" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="80" y="69" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Client</text>

  <line x1="140" y1="65" x2="200" y2="65" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="170" y="55" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">1. creds</text>

  <rect x="205" y="45" width="140" height="40" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="275" y="69" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Auth service</text>

  <text x="275" y="100" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">2. access token (short) + refresh token (server-stored)</text>

  <line x1="80" y1="85" x2="80" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="60" y="120" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">3. Authorization: token</text>

  <rect x="20" y="150" width="600" height="26" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3"/>

  <rect x="60" y="185" width="150" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="135" y="207" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Service A</text>
  <text x="135" y="222" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">verifies w/ pubkey</text>

  <rect x="255" y="185" width="150" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="330" y="207" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Service B</text>
  <text x="330" y="222" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">verifies w/ pubkey</text>

  <rect x="450" y="185" width="150" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="525" y="207" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Service C</text>
  <text x="525" y="222" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">verifies w/ pubkey</text>

  <text x="340" y="255" text-anchor="middle" font-size="10.5" fill="var(--dg-accent, #0C8F88)">4. stateless verification, fully decoupled — no call back to auth, no shared session store</text>
</svg>
