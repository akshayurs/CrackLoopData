<svg viewBox="0 0 660 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="330" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">Same password, unrecognizable hashes</text>

  <rect x="60" y="45" width="150" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="135" y="65" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">username</text>
  <rect x="210" y="45" width="150" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="285" y="65" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">salt</text>
  <rect x="360" y="45" width="240" height="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="480" y="65" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">password_hash</text>

  <rect x="60" y="75" width="150" height="34" fill="none" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="135" y="97" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">alice</text>
  <rect x="210" y="75" width="150" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="285" y="97" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">a1f9c2…</text>
  <rect x="360" y="75" width="240" height="34" fill="none" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="480" y="97" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">$2b$12$xJ3kq…9mZp</text>

  <rect x="60" y="109" width="150" height="34" fill="none" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="135" y="131" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">bob</text>
  <rect x="210" y="109" width="150" height="34" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="285" y="131" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">7be04d…</text>
  <rect x="360" y="109" width="240" height="34" fill="none" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="480" y="131" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">$2b$12$Qh8Ln…2vRk</text>

  <text x="330" y="165" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">both rows: password = "password123" — hash = bcrypt(password + row's own salt)</text>
  <text x="330" y="195" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">identical passwords, unrecognizable hashes — a precomputed table has</text>
  <text x="330" y="212" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">nothing to match against</text>
</svg>
