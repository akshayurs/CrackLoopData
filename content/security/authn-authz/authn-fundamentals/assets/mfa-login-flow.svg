<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="var(--dg-ink, #202124)">MFA login: two independent gates</text>

  <rect x="30" y="50" width="220" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="140" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="var(--dg-ink, #202124)">Step 1: password</text>
  <text x="140" y="90" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">"something you know"</text>

  <line x1="250" y1="80" x2="310" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="280" y="70" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">if ok</text>

  <rect x="315" y="50" width="230" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="430" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="var(--dg-ink, #202124)">Step 2: TOTP code</text>
  <text x="430" y="90" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">"something you have"</text>

  <line x1="430" y1="110" x2="430" y2="145" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="315" y="145" width="230" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="430" y="165" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">server compares expected code</text>
  <text x="430" y="180" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">both match → session issued</text>

  <line x1="140" y1="110" x2="140" y2="230" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="140" y="220" text-anchor="middle" font-size="10.5" fill="var(--dg-accent, #0C8F88)">attacker with only a</text>
  <text x="140" y="235" text-anchor="middle" font-size="10.5" fill="var(--dg-accent, #0C8F88)">breached password stops here</text>
</svg>
