<svg viewBox="0 0 660 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="330" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">PR diff: authentication present, authorization missing</text>

  <rect x="40" y="45" width="580" height="160" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="60" y="65" font-family="monospace" font-size="10" fill="var(--dg-ink, #202124)">@app.route("/documents/&lt;id&gt;")</text>
  <text x="60" y="85" font-family="monospace" font-size="10" fill="var(--dg-accent, #0C8F88)">+ user = get_current_user(request)</text>
  <rect x="55" y="72" width="300" height="20" fill="var(--dg-accent-bg, #E3F3F1)" opacity="0.5"/>
  <text x="60" y="115" font-family="monospace" font-size="10" fill="var(--dg-ink, #202124)">  doc = db.get_document(id)</text>

  <rect x="55" y="128" width="300" height="30" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3"/>
  <text x="65" y="147" font-family="monospace" font-size="9.5" fill="var(--dg-accent, #0C8F88)">  # missing: doc.owner == user.id ?</text>

  <text x="60" y="180" font-family="monospace" font-size="10" fill="var(--dg-ink, #202124)">  return doc</text>

  <text x="330" y="225" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">authenticated does not mean authorized — this check is missing, not wrong</text>
</svg>
