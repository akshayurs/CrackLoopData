<svg viewBox="0 0 660 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">Permissions-service timeout: two possible defaults</text>

  <rect x="30" y="45" width="180" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="120" y="70" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">Authorization check</text>

  <line x1="120" y1="85" x2="120" y2="115" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="30" y="115" width="180" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="120" y="140" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">normal response</text>

  <line x1="210" y1="135" x2="270" y2="135" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="275" y="115" width="200" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="375" y="140" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">proceeds on actual permission</text>

  <line x1="120" y1="85" x2="120" y2="185" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <text x="140" y="170" font-size="9.5" fill="var(--dg-muted, #5F6368)">timeout / exception</text>

  <rect x="30" y="185" width="200" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="3 3"/>
  <text x="130" y="205" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">fail-open:</text>
  <text x="130" y="220" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">request proceeds anyway</text>

  <rect x="260" y="185" width="220" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="370" y="205" text-anchor="middle" font-size="10" font-weight="600" fill="var(--dg-ink, #202124)">fail-safe (correct default):</text>
  <text x="370" y="220" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">request is denied</text>
</svg>
