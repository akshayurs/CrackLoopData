<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">Where SAST, DAST, and fuzzing attach to the pipeline</text>

  <line x1="40" y1="70" x2="660" y2="70" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-size="10.5" fill="var(--dg-ink, #202124)" text-anchor="middle">
    <text x="80" y="60">commit</text>
    <text x="230" y="60">build</text>
    <text x="360" y="60">test</text>
    <text x="500" y="60">staging deploy</text>
    <text x="620" y="60">prod release</text>
  </g>
  <circle cx="80" cy="70" r="5" fill="var(--dg-accent, #0C8F88)"/>
  <circle cx="230" cy="70" r="5" fill="var(--dg-stroke, #9AA0A6)"/>
  <circle cx="360" cy="70" r="5" fill="var(--dg-stroke, #9AA0A6)"/>
  <circle cx="500" cy="70" r="5" fill="var(--dg-accent, #0C8F88)"/>
  <circle cx="620" cy="70" r="5" fill="var(--dg-stroke, #9AA0A6)"/>

  <line x1="80" y1="75" x2="80" y2="105" stroke="var(--dg-line, #5F6368)"/>
  <rect x="20" y="105" width="120" height="40" rx="7" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="80" y="122" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">SAST</text>
  <text x="80" y="136" text-anchor="middle" font-size="8.5" fill="var(--dg-muted, #5F6368)">fast PR gate</text>

  <line x1="500" y1="75" x2="500" y2="105" stroke="var(--dg-line, #5F6368)"/>
  <rect x="440" y="105" width="120" height="40" rx="7" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="500" y="122" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">DAST</text>
  <text x="500" y="136" text-anchor="middle" font-size="8.5" fill="var(--dg-muted, #5F6368)">needs live instance</text>

  <rect x="230" y="175" width="280" height="46" rx="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3"/>
  <text x="370" y="195" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Fuzzing — continuous, parallel</text>
  <text x="370" y="210" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">against a high-risk component (file parser); gates nothing</text>
</svg>
