<svg viewBox="0 0 660 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">Leaky vs. safe API error responses</text>

  <rect x="30" y="45" width="270" height="150" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="165" y="65" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">leaky</text>
  <text x="50" y="85" font-family="monospace" font-size="9" fill="var(--dg-ink, #202124)">Traceback (most recent call):</text>
  <text x="50" y="100" font-family="monospace" font-size="9" fill="var(--dg-ink, #202124)">  File "/app/db/orders.py", line 82</text>
  <text x="50" y="115" font-family="monospace" font-size="9" fill="var(--dg-ink, #202124)">psycopg2: host=prod-db-3</text>
  <text x="50" y="130" font-family="monospace" font-size="9" fill="var(--dg-ink, #202124)">  user=app pass=***7f2</text>
  <text x="50" y="145" font-family="monospace" font-size="9" fill="var(--dg-ink, #202124)">Django 4.1.2 / Python 3.11</text>

  <rect x="360" y="45" width="270" height="150" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="495" y="65" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">safe</text>
  <text x="380" y="90" font-family="monospace" font-size="10" fill="var(--dg-ink, #202124)">{'{'}"error": "Internal error",</text>
  <text x="380" y="108" font-family="monospace" font-size="10" fill="var(--dg-ink, #202124)"> "error_id": "8f2a91"{'}'}</text>

  <line x1="450" y1="115" x2="450" y2="210" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
  <rect x="330" y="210" width="240" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="450" y="231" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">internal log: full detail, keyed by error_id</text>
</svg>
