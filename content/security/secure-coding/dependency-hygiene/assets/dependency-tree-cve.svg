<svg viewBox="0 0 660 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">A transitive dependency nobody chose</text>

  <rect x="270" y="35" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="330" y="57" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">your application</text>

  <line x1="330" y1="69" x2="150" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="330" y1="69" x2="330" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <line x1="330" y1="69" x2="500" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="90" y="100" width="120" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="150" y="120" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">dependency 1</text>
  <rect x="270" y="100" width="120" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="330" y="120" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">dependency 2</text>
  <rect x="440" y="100" width="120" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="500" y="120" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">dependency 3</text>

  <line x1="330" y1="130" x2="330" y2="155" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="270" y="155" width="120" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="330" y="175" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">second-level dep</text>

  <line x1="330" y1="185" x2="330" y2="210" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="250" y="210" width="160" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="330" y="228" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">third-level dep</text>
  <text x="330" y="240" text-anchor="middle" font-size="8.5" fill="var(--dg-accent, #0C8F88)">known CVE — never heard of</text>
</svg>
