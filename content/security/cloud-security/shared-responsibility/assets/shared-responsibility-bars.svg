  <text x="130" y="280" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">IaaS</text>

  <rect x="250" y="180" width="120" height="80" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
