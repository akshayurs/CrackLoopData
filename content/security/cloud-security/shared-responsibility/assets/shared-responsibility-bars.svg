  <text x="490" y="204" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">application</text>
  <rect x="430" y="60" width="120" height="80" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
