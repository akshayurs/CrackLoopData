  <text x="310" y="224" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">OS, runtime/platform</text>
  <rect x="250" y="60" width="120" height="120" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="310" y="120" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">application</text>
