  <text x="310" y="280" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">PaaS</text>

  <rect x="430" y="140" width="120" height="120" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="490" y="164" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">physical/hw, hypervisor</text>
