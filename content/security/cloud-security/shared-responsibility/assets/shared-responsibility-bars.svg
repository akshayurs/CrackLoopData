<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <text x="310" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">Shared responsibility across IaaS, PaaS, SaaS</text>

  <rect x="70" y="220" width="120" height="40" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
