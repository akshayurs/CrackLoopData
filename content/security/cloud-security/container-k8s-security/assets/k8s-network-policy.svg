<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">A namespace with a NetworkPolicy boundary</text>

  <rect x="360" y="50" width="240" height="170" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="5 3" stroke-width="1.5"/>
  <text x="480" y="68" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">payments namespace</text>

  <rect x="380" y="80" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="430" y="101" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">allowed pod</text>
  <rect x="380" y="150" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="430" y="171" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">database pod</text>
  <line x1="430" y1="114" x2="430" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="40" y="80" width="140" height="170" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="5 3"/>
  <text x="110" y="98" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">marketing</text>

  <rect x="60" y="115" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="110" y="136" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">pod</text>

  <line x1="160" y1="132" x2="380" y2="167" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="270" y="200" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">✕ denied by default</text>
  <text x="270" y="214" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">no matching policy allows this</text>
</svg>
