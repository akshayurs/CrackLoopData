<svg viewBox="0 0 660 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="330" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">NetworkPolicy denies cross-namespace traffic</text>

  <rect x="30" y="50" width="220" height="130" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="140" y="70" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">marketing namespace</text>
  <rect x="60" y="90" width="160" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="140" y="111" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">pod (marketing)</text>

  <rect x="380" y="50" width="250" height="180" rx="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="505" y="70" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">payments namespace</text>
  <text x="505" y="85" text-anchor="middle" font-size="9" fill="var(--dg-accent, #0C8F88)">NetworkPolicy boundary</text>
  <rect x="410" y="100" width="180" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="500" y="121" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">labeled pods (allowed)</text>
  <rect x="410" y="150" width="180" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="500" y="171" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">database pod</text>

  <line x1="220" y1="107" x2="405" y2="117" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="100" text-anchor="middle" font-size="20" fill="var(--dg-accent, #0C8F88)">✕</text>

  <text x="330" y="220" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">denied by default — no matching policy allows this</text>
</svg>
