<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">A service assuming a role to reach another resource</text>

  <rect x="30" y="70" width="120" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="90" y="92" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Compute instance</text>
  <text x="90" y="106" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">instance role attached</text>

  <line x1="150" y1="80" x2="250" y2="65" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <rect x="250" y="45" width="130" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="315" y="70" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Metadata service</text>

  <line x1="315" y1="85" x2="150" y2="110" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="230" y="102" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">temp credentials</text>

  <line x1="150" y1="105" x2="450" y2="105" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="140" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">call using short-lived credentials</text>

  <rect x="450" y="80" width="150" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="525" y="102" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Storage bucket</text>
  <text x="525" y="116" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">different account</text>
  <text x="525" y="129" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">trust policy names caller</text>

  <text x="320" y="200" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Credentials expire in under an hour.</text>
  <text x="320" y="216" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">No long-lived key exists anywhere in this diagram.</text>
</svg>
