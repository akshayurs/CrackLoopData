<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="var(--dg-ink, #202124)">Instance role → temporary cross-account credentials</text>

  <rect x="20" y="55" width="150" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="78" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">Compute instance</text>
  <text x="95" y="94" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">attached instance role</text>

  <line x1="95" y1="115" x2="95" y2="150" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="20" y="150" width="150" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="170" text-anchor="middle" font-size="10.5" fill="var(--dg-ink, #202124)">Metadata service</text>
  <text x="95" y="185" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">issues temp creds</text>

  <line x1="170" y1="173" x2="450" y2="140" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="140" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)">short-lived credentials</text>

  <rect x="460" y="55" width="220" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="570" y="78" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">Storage bucket (other account)</text>
  <text x="570" y="96" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">trust policy names calling</text>
  <text x="570" y="110" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">account explicitly</text>

  <line x1="170" y1="180" x2="460" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="350" y="210" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">credentials expire in under an hour</text>
  <text x="350" y="228" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">no long-lived key exists anywhere in this diagram</text>
</svg>
