<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">App fetching a secret from a vault at startup</text>

  <rect x="30" y="70" width="130" height="50" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="95" y="92" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">App container</text>
  <text x="95" y="106" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">starting up</text>

  <line x1="160" y1="85" x2="260" y2="85" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="210" y="75" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">auth via workload identity</text>

  <rect x="260" y="60" width="130" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="325" y="90" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">Secrets vault</text>

  <line x1="260" y1="115" x2="160" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="210" y="140" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">DB credential returned</text>

  <rect x="30" y="150" width="130" height="40" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="95" y="174" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">held in memory only</text>

  <line x1="160" y1="185" x2="240" y2="200" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <line x1="240" y1="185" x2="160" y2="200" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="270" y="197" font-size="9" fill="var(--dg-accent, #0C8F88)" font-weight="600">never touches disk</text>

  <rect x="30" y="215" width="130" height="26" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="95" y="233" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">config file / image layer</text>
</svg>
