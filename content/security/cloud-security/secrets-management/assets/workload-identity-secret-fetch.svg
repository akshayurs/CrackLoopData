<svg viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">Workload identity → in-memory secret only</text>

  <rect x="30" y="50" width="160" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="110" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">App container</text>
  <text x="110" y="90" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">own workload identity</text>

  <line x1="190" y1="80" x2="270" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="230" y="70" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">authenticate</text>

  <rect x="275" y="50" width="150" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="350" y="85" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">Secrets vault</text>

  <line x1="275" y1="100" x2="200" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="235" y="125" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">DB credential</text>

  <rect x="80" y="130" width="180" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="170" y="151" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">held in memory only</text>

  <line x1="170" y1="164" x2="170" y2="195" stroke="var(--dg-line, #5F6368)" stroke-dasharray="4 3"/>
  <text x="230" y="185" text-anchor="middle" font-size="16" fill="var(--dg-accent, #0C8F88)">✕</text>

  <rect x="80" y="195" width="180" height="34" rx="6" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3"/>
  <text x="170" y="216" text-anchor="middle" font-size="9.5" fill="var(--dg-muted, #5F6368)">config file / image layer</text>

  <text x="450" y="150" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">never touches disk</text>
</svg>
