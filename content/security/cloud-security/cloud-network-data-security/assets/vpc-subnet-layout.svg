<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="340" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="var(--dg-ink, #202124)">VPC: public and private subnets</text>

  <rect x="20" y="40" width="640" height="220" rx="10" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="58" font-size="11" fill="var(--dg-muted, #5F6368)">VPC</text>

  <rect x="40" y="70" width="290" height="90" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="185" y="88" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">Public subnet</text>
  <rect x="60" y="100" width="110" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="115" y="120" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">Load balancer</text>
  <text x="115" y="145" text-anchor="middle" font-size="8.5" fill="var(--dg-muted, #5F6368)">SG: 443 in</text>
  <rect x="190" y="100" width="120" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="250" y="120" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">→ Internet GW</text>

  <rect x="350" y="70" width="290" height="180" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="495" y="88" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dg-ink, #202124)">Private subnet</text>
  <rect x="370" y="100" width="110" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="425" y="118" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">App servers</text>
  <text x="425" y="132" text-anchor="middle" font-size="8.5" fill="var(--dg-muted, #5F6368)">SG: 8080 from LB</text>
  <rect x="490" y="100" width="130" height="40" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="555" y="118" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">Database</text>
  <text x="555" y="132" text-anchor="middle" font-size="8.5" fill="var(--dg-muted, #5F6368)">SG: 5432 from app</text>
  <rect x="420" y="160" width="130" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="485" y="181" text-anchor="middle" font-size="9.5" fill="var(--dg-ink, #202124)">NAT gateway</text>
  <text x="495" y="205" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">outbound-only, no inbound route</text>

  <text x="340" y="272" text-anchor="middle" font-size="10.5" fill="var(--dg-muted, #5F6368)">security groups attach per resource — each labelled with the exact ports it allows</text>
</svg>
