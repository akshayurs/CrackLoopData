<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="20" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">A VPC with public and private subnets</text>

  <rect x="30" y="40" width="580" height="200" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="58" font-size="10" fill="var(--dg-muted, #5F6368)">VPC</text>

  <rect x="50" y="70" width="230" height="80" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-dasharray="4 3"/>
  <text x="165" y="86" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Public subnet</text>
  <rect x="70" y="96" width="90" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="115" y="115" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Load balancer</text>
  <text x="230" y="116" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">→ IGW</text>

  <rect x="50" y="165" width="230" height="60" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-dasharray="4 3"/>
  <text x="165" y="181" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)" font-weight="600">Private subnet</text>
  <rect x="70" y="192" width="90" height="26" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="115" y="209" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">DB + app servers</text>

  <text x="70" y="150" font-size="8" fill="var(--dg-muted, #5F6368)">no route to IGW</text>

  <rect x="340" y="90" width="90" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="385" y="109" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">NAT gateway</text>
  <line x1="280" y1="195" x2="340" y2="120" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="330" y="160" text-anchor="middle" font-size="8" fill="var(--dg-muted, #5F6368)">outbound-only</text>

  <rect x="460" y="90" width="120" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="520" y="109" text-anchor="middle" font-size="9" fill="var(--dg-ink, #202124)">Internet gateway</text>
  <line x1="430" y1="100" x2="460" y2="100" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <text x="320" y="245" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">Security groups attach to each resource with specific allowed ports.</text>
</svg>
