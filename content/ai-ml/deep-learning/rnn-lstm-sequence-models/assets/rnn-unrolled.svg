<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowRnn" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowRnnAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">An RNN unrolled through time</text>

  <!-- 4 cells -->
  <g>
    <rect x="70" y="90" width="100" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="120" y="130" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Cell</text>
    <line x1="120" y1="170" x2="120" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowRnn)"/>
    <text x="120" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">x1</text>
  </g>
  <g>
    <rect x="230" y="90" width="100" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="280" y="130" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Cell</text>
    <line x1="280" y1="170" x2="280" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowRnn)"/>
    <text x="280" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">x2</text>
  </g>
  <g>
    <rect x="390" y="90" width="100" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="440" y="130" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Cell</text>
    <line x1="440" y1="170" x2="440" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowRnn)"/>
    <text x="440" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">x3</text>
  </g>
  <g>
    <rect x="550" y="90" width="100" height="70" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="600" y="130" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Cell</text>
    <line x1="600" y1="170" x2="600" y2="220" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowRnn)"/>
    <text x="600" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">x4</text>
  </g>

  <!-- hidden state arrows between cells -->
  <line x1="170" y1="125" x2="226" y2="125" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrowRnnAccent)"/>
  <line x1="330" y1="125" x2="386" y2="125" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrowRnnAccent)"/>
  <line x1="490" y1="125" x2="546" y2="125" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrowRnnAccent)"/>
  <text x="340" y="80" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)">hidden state h passed forward</text>

  <!-- outputs above -->
  <line x1="120" y1="90" x2="120" y2="60" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowRnn)"/>
  <line x1="280" y1="90" x2="280" y2="60" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowRnn)"/>
  <line x1="440" y1="90" x2="440" y2="60" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowRnn)"/>
  <line x1="600" y1="90" x2="600" y2="60" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowRnn)"/>

  <text x="340" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Every cell shares identical weights; only the hidden state and input differ at each step.</text>
</svg>
