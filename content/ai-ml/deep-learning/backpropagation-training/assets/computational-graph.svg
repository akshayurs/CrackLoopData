<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowFwd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowBwd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A computational graph and its gradient flow</text>

  <!-- nodes: x -> mul(w) -> add(b) -> f -> L -->
  <circle cx="70" cy="110" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="115" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">x</text>

  <circle cx="220" cy="110" r="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="220" y="106" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">w &#183; x</text>
  <text x="220" y="122" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">mul</text>

  <circle cx="380" cy="110" r="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="380" y="106" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">+ b</text>
  <text x="380" y="122" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">add</text>

  <circle cx="530" cy="110" r="30" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="530" y="106" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">f( )</text>
  <text x="530" y="122" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">activation</text>

  <circle cx="640" cy="110" r="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="640" y="115" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">L</text>

  <!-- forward arrows (top) -->
  <g stroke="var(--dg-line, #5F6368)" stroke-width="1.5">
    <line x1="96" y1="100" x2="188" y2="100" marker-end="url(#arrowFwd)"/>
    <line x1="250" y1="100" x2="348" y2="100" marker-end="url(#arrowFwd)"/>
    <line x1="410" y1="100" x2="498" y2="100" marker-end="url(#arrowFwd)"/>
    <line x1="558" y1="100" x2="612" y2="100" marker-end="url(#arrowFwd)"/>
  </g>
  <text x="340" y="80" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">forward pass -&gt; computes L</text>

  <!-- backward arrows (bottom) -->
  <g stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5">
    <line x1="612" y1="150" x2="558" y2="150" marker-end="url(#arrowBwd)"/>
    <line x1="498" y1="150" x2="410" y2="150" marker-end="url(#arrowBwd)"/>
    <line x1="348" y1="150" x2="250" y2="150" marker-end="url(#arrowBwd)"/>
    <line x1="188" y1="150" x2="96" y2="150" marker-end="url(#arrowBwd)"/>
  </g>
  <text x="340" y="185" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)">backward pass -&gt; dL/df &#183; dL/db &#183; dL/dw &#183; dL/dx</text>

  <text x="340" y="240" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each node stores its local derivative; the backward pass multiplies them, node by node, right to left.</text>
</svg>
