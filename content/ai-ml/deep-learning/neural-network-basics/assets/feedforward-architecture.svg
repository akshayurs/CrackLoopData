<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowFF" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A feedforward network's architecture</text>

  <!-- input layer -->
  <g>
    <circle cx="90" cy="110" r="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <circle cx="90" cy="180" r="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <circle cx="90" cy="250" r="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="90" y="300" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Input</text>
  </g>

  <!-- hidden layer 1 -->
  <g>
    <circle cx="270" cy="80" r="16" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <circle cx="270" cy="145" r="16" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <circle cx="270" cy="210" r="16" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <circle cx="270" cy="275" r="16" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="270" y="315" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Hidden 1</text>
  </g>

  <!-- hidden layer 2 -->
  <g>
    <circle cx="450" cy="110" r="16" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <circle cx="450" cy="180" r="16" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <circle cx="450" cy="250" r="16" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="450" y="300" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Hidden 2</text>
  </g>

  <!-- output layer -->
  <g>
    <circle cx="590" cy="180" r="16" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="590" y="230" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Output</text>
  </g>

  <!-- connections input -> hidden1 (simplified, subset) -->
  <g stroke="var(--dg-line, #5F6368)" stroke-width="1" opacity="0.6">
    <line x1="106" y1="110" x2="254" y2="80"/>
    <line x1="106" y1="110" x2="254" y2="145"/>
    <line x1="106" y1="110" x2="254" y2="210"/>
    <line x1="106" y1="180" x2="254" y2="80"/>
    <line x1="106" y1="180" x2="254" y2="145"/>
    <line x1="106" y1="180" x2="254" y2="275"/>
    <line x1="106" y1="250" x2="254" y2="145"/>
    <line x1="106" y1="250" x2="254" y2="210"/>
    <line x1="106" y1="250" x2="254" y2="275"/>
  </g>

  <!-- hidden1 -> hidden2 -->
  <g stroke="var(--dg-line, #5F6368)" stroke-width="1" opacity="0.6">
    <line x1="286" y1="80" x2="434" y2="110"/>
    <line x1="286" y1="80" x2="434" y2="180"/>
    <line x1="286" y1="145" x2="434" y2="110"/>
    <line x1="286" y1="145" x2="434" y2="180"/>
    <line x1="286" y1="210" x2="434" y2="180"/>
    <line x1="286" y1="210" x2="434" y2="250"/>
    <line x1="286" y1="275" x2="434" y2="180"/>
    <line x1="286" y1="275" x2="434" y2="250"/>
  </g>

  <!-- hidden2 -> output -->
  <g stroke="var(--dg-line, #5F6368)" stroke-width="1.2">
    <line x1="466" y1="110" x2="574" y2="180" marker-end="url(#arrowFF)"/>
    <line x1="466" y1="180" x2="574" y2="180" marker-end="url(#arrowFF)"/>
    <line x1="466" y1="250" x2="574" y2="180" marker-end="url(#arrowFF)"/>
  </g>

  <text x="320" y="345" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Signal flows one way — input to output — through weighted connections and activations.</text>
</svg>
