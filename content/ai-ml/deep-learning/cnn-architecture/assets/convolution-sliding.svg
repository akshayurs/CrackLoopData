<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowConv" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A convolution kernel sliding across an image</text>

  <!-- input grid 6x6 -->
  <g transform="translate(60,60)">
    <text x="90" y="-14" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Input (6x6)</text>
    <g stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" fill="var(--dg-fill, #F1F3F4)">
      <rect x="0" y="0" width="180" height="180"/>
      <line x1="30" y1="0" x2="30" y2="180"/><line x1="60" y1="0" x2="60" y2="180"/>
      <line x1="90" y1="0" x2="90" y2="180"/><line x1="120" y1="0" x2="120" y2="180"/><line x1="150" y1="0" x2="150" y2="180"/>
      <line x1="0" y1="30" x2="180" y2="30"/><line x1="0" y1="60" x2="180" y2="60"/>
      <line x1="0" y1="90" x2="180" y2="90"/><line x1="0" y1="120" x2="180" y2="120"/><line x1="0" y1="150" x2="180" y2="150"/>
    </g>
    <!-- kernel highlight 3x3 at position -->
    <rect x="30" y="30" width="90" height="90" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>
    <text x="75" y="80" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">3x3</text>
    <text x="75" y="95" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">kernel</text>
    <!-- dashed arrow showing slide direction -->
    <path d="M120,75 h40" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowConv)" fill="none"/>
  </g>

  <!-- arrow to output -->
  <line x1="270" y1="150" x2="330" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowConv)"/>

  <!-- output grid 4x4 -->
  <g transform="translate(360,75)">
    <text x="60" y="-14" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Output (4x4)</text>
    <g stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" fill="var(--dg-fill, #F1F3F4)">
      <rect x="0" y="0" width="120" height="120"/>
      <line x1="30" y1="0" x2="30" y2="120"/><line x1="60" y1="0" x2="60" y2="120"/><line x1="90" y1="0" x2="90" y2="120"/>
      <line x1="0" y1="30" x2="120" y2="30"/><line x1="0" y1="60" x2="120" y2="60"/><line x1="0" y1="90" x2="120" y2="90"/>
    </g>
    <rect x="0" y="0" width="30" height="30" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  </g>

  <text x="320" y="290" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The same 3x3 weights slide over every position, each producing one output value.</text>
</svg>
