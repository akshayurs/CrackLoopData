<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="350" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">One feature definition, two consistent stores</text>

  <rect x="260" y="50" width="180" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="350" y="78" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">shared feature definitions</text>

  <line x1="300" y1="96" x2="180" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="96" x2="520" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="150" width="240" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="180" y="176" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">offline store</text>
  <text x="180" y="196" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">historical values, warehouse-scale scans</text>

  <rect x="400" y="150" width="240" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="520" y="176" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">online store</text>
  <text x="520" y="196" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">latest values, low-latency key-value</text>

  <line x1="180" y1="210" x2="180" y2="250" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="210" x2="520" y2="250" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="250" width="240" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="180" y="278" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">training pipeline</text>

  <rect x="400" y="250" width="240" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="520" y="278" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">online serving</text>

  <text x="350" y="345" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">No second, independently-written feature implementation to silently drift out of sync.</text>
</svg>
