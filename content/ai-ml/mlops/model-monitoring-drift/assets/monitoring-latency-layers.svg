<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Monitoring layers by speed of signal</text>

  <line x1="180" y1="45" x2="180" y2="255" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <line x1="620" y1="250" x2="180" y2="250" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="620" y="268" text-anchor="end" font-size="11" fill="var(--dg-muted, #5F6368)">time to signal (log scale)</text>

  <!-- log-ish x positions: minutes=210, hours=320, days=440, weeks/months=580 -->
  <g>
    <rect x="185" y="55" width="30" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <line x1="200" y1="85" x2="200" y2="250" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="220" y="75" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Feature distribution</text>
    <text x="220" y="90" font-size="11" fill="var(--dg-muted, #5F6368)">fires in minutes</text>
  </g>

  <g>
    <rect x="290" y="100" width="30" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <line x1="305" y1="130" x2="305" y2="250" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="330" y="120" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Prediction distribution</text>
    <text x="330" y="135" font-size="11" fill="var(--dg-muted, #5F6368)">fires in hours</text>
  </g>

  <g>
    <rect x="410" y="145" width="30" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <line x1="425" y1="175" x2="425" y2="250" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="450" y="165" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Business metric</text>
    <text x="450" y="180" font-size="11" fill="var(--dg-muted, #5F6368)">fires in days</text>
  </g>

  <g>
    <rect x="545" y="190" width="30" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <line x1="560" y1="220" x2="560" y2="250" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="490" y="210" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Label-based accuracy</text>
    <text x="490" y="225" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">fires in weeks-months</text>
  </g>

  <text x="30" y="150" font-size="11" fill="var(--dg-muted, #5F6368)" transform="rotate(-90 30 150)">signal certainty -&gt;</text>
</svg>
