<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <!-- R matrix -->
  <rect x="20" y="40" width="150" height="150" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="95" y="30" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)">R (users × items)</text>
  <text x="95" y="120" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)">mostly</text>
  <text x="95" y="138" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)">empty</text>

  <text x="185" y="120" text-anchor="middle" font-size="20" fill="var(--dg-ink, #202124)">≈</text>

  <!-- P matrix -->
  <rect x="210" y="40" width="60" height="150" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="240" y="30" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)">P (users)</text>
  <text x="240" y="120" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)">latent</text>
  <text x="240" y="136" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)">k dims</text>

  <text x="290" y="120" text-anchor="middle" font-size="20" fill="var(--dg-ink, #202124)">×</text>

  <!-- Qt matrix -->
  <rect x="310" y="90" width="260" height="50" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="440" y="70" text-anchor="middle" font-size="14" fill="var(--dg-ink, #202124)">Qᵀ (items)</text>
  <text x="440" y="119" text-anchor="middle" font-size="12" fill="var(--dg-accent, #0C8F88)">latent, k dims</text>

  <line x1="270" y1="40" x2="310" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="320" y="220" font-size="12" fill="var(--dg-muted, #5F6368)">Every row of P is one user's taste vector.</text>
  <text x="320" y="238" font-size="12" fill="var(--dg-muted, #5F6368)">Every column of Qᵀ is one item's taste vector.</text>
</svg>
