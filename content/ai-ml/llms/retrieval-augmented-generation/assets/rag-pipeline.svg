<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="10" y="90" width="140" height="70" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="80" y="120" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Query</text>
  <text x="80" y="140" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">user question</text>

  <line x1="150" y1="125" x2="198" y2="125" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="200" y="90" width="150" height="70" rx="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="275" y="118" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Retrieve</text>
  <text x="275" y="138" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">vector search</text>
  <text x="275" y="152" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">top-k chunks</text>

  <line x1="275" y1="90" x2="275" y2="50" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="10" width="150" height="40" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="275" y="34" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">Document store</text>

  <line x1="350" y1="125" x2="398" y2="125" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="400" y="90" width="150" height="70" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="475" y="118" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Augment</text>
  <text x="475" y="138" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">chunks + query</text>
  <text x="475" y="152" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">into the prompt</text>

  <line x1="550" y1="125" x2="598" y2="125" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="600" y="90" width="110" height="70" rx="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="655" y="118" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Generate</text>
  <text x="655" y="138" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">LLM answer</text>
  <text x="655" y="152" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">+ citations</text>

  <text x="360" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Only as good as what gets retrieved in step 2 -&gt; garbage in, garbage out</text>
</svg>
