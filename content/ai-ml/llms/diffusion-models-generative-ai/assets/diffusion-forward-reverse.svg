<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <radialGradient id="noise0" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="var(--dg-accent-bg, #E3F3F1)"/>
      <stop offset="100%" stop-color="var(--dg-fill, #F1F3F4)"/>
    </radialGradient>
  </defs>

  <text x="360" y="24" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)" font-weight="600">Forward (noising) — training only, fixed schedule</text>

  <g>
    <circle cx="60" cy="70" r="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="60" y="75" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">image</text>
    <line x1="90" y1="70" x2="128" y2="70" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow3)"/>

    <circle cx="160" cy="70" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="160" y="75" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">+noise</text>
    <line x1="190" y1="70" x2="228" y2="70" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow3)"/>

    <circle cx="260" cy="70" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="260" y="75" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">noisier</text>
    <line x1="290" y1="70" x2="328" y2="70" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow3)"/>

    <circle cx="360" cy="70" r="26" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="360" y="75" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">static</text>
  </g>

  <line x1="60" y1="150" x2="360" y2="150" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>

  <text x="360" y="180" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)" font-weight="600">Reverse (denoising) — learned model, used to generate</text>

  <g>
    <circle cx="360" cy="220" r="20" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="360" y="224" text-anchor="middle" font-size="9" fill="var(--dg-muted, #5F6368)">noise</text>
  </g>

  <text x="580" y="70" font-size="11" fill="var(--dg-muted, #5F6368)">Generation starts here:</text>
  <text x="580" y="88" font-size="11" fill="var(--dg-muted, #5F6368)">pure random noise -&gt;</text>
  <text x="580" y="106" font-size="11" fill="var(--dg-muted, #5F6368)">repeated denoising step -&gt;</text>
  <text x="580" y="124" font-size="11" fill="var(--dg-ink, #202124)" font-weight="600">realistic image</text>

  <circle cx="620" cy="220" r="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="620" y="225" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">image</text>
  <line x1="384" y1="220" x2="588" y2="220" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" marker-end="url(#arrow3)"/>
</svg>
