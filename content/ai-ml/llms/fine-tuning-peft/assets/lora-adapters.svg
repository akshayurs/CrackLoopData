<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="140" y="30" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)">input x</text>
  <line x1="140" y1="40" x2="140" y2="70" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="60" y="70" width="160" height="80" rx="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="140" y="105" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">Frozen weight W</text>
  <text x="140" y="128" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">pretrained, unchanged</text>

  <line x1="300" y1="30" x2="300" y2="60" stroke="var(--dg-line, #5F6368)" stroke-width="2"/>
  <line x1="140" y1="30" x2="460" y2="30" stroke="var(--dg-line, #5F6368)" stroke-width="2"/>
  <line x1="460" y1="30" x2="460" y2="60" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="400" y="60" width="60" height="45" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="430" y="88" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">A</text>

  <line x1="430" y1="105" x2="430" y2="130" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="470" y="122" font-size="11" fill="var(--dg-muted, #5F6368)">rank r</text>

  <rect x="400" y="130" width="60" height="45" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="430" y="158" text-anchor="middle" font-size="15" fill="var(--dg-ink, #202124)" font-weight="600">B</text>

  <line x1="430" y1="175" x2="430" y2="200" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="470" y="192" font-size="11" fill="var(--dg-muted, #5F6368)">A·B</text>

  <line x1="140" y1="150" x2="140" y2="230" stroke="var(--dg-line, #5F6368)" stroke-width="2"/>
  <line x1="430" y1="200" x2="140" y2="230" stroke="var(--dg-line, #5F6368)" stroke-width="2"/>

  <circle cx="140" cy="245" r="18" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="140" y="251" text-anchor="middle" font-size="16" fill="var(--dg-accent, #0C8F88)" font-weight="700">+</text>

  <line x1="140" y1="263" x2="140" y2="290" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="140" y="308" text-anchor="middle" font-size="13" fill="var(--dg-muted, #5F6368)">output = Wx + (A·B)x</text>

  <text x="500" y="245" font-size="11" fill="var(--dg-muted, #5F6368)">A, B are trained;</text>
  <text x="500" y="262" font-size="11" fill="var(--dg-muted, #5F6368)">W stays frozen</text>
</svg>
