<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="350" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">BERT (bidirectional) vs GPT (causal)</text>

  <text x="30" y="65" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">BERT</text>
  <g font-size="12" fill="var(--dg-ink, #202124)">
    <rect x="90" y="50" width="60" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="120" y="70" text-anchor="middle">the</text>
    <rect x="160" y="50" width="60" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="190" y="70" text-anchor="middle">cat</text>
    <rect x="230" y="50" width="60" height="30" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="260" y="70" text-anchor="middle" font-weight="600">sat</text>
    <rect x="300" y="50" width="60" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="330" y="70" text-anchor="middle">down</text>
  </g>
  <path d="M260,50 C 260,20 190,20 190,50" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <path d="M260,50 C 260,20 330,20 330,50" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="500" y="70" font-size="12" fill="var(--dg-muted, #5F6368)">"sat" attends both left AND right</text>

  <line x1="20" y1="110" x2="680" y2="110" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="30" y="155" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">GPT</text>
  <g font-size="12" fill="var(--dg-ink, #202124)">
    <rect x="90" y="140" width="60" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="120" y="160" text-anchor="middle">the</text>
    <rect x="160" y="140" width="60" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="190" y="160" text-anchor="middle">cat</text>
    <rect x="230" y="140" width="60" height="30" rx="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="260" y="160" text-anchor="middle" font-weight="600">sat</text>
    <rect x="300" y="140" width="60" height="30" rx="5" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" opacity="0.4"/>
    <text x="330" y="160" text-anchor="middle" opacity="0.4">down</text>
  </g>
  <path d="M260,140 C 260,110 190,110 190,140" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <path d="M260,140 C 260,110 120,110 120,140" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <line x1="290" y1="155" x2="310" y2="155" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="2 3"/>
  <text x="500" y="160" font-size="12" fill="var(--dg-muted, #5F6368)">"sat" attends only LEFT — "down" is masked</text>

  <text x="350" y="220" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">BERT sees the whole sentence during pretraining; GPT never sees future tokens.</text>
  <text x="350" y="245" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">That's why BERT suits understanding tasks and GPT suits generation.</text>
</svg>
