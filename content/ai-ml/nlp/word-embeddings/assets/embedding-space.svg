<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="350" y="30" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Words that co-occur end up near each other</text>

  <line x1="60" y1="360" x2="640" y2="360" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="60" y1="360" x2="60" y2="60" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="645" y="365" font-size="12" fill="var(--dg-muted, #5F6368)">dim 1</text>
  <text x="50" y="55" font-size="12" fill="var(--dg-muted, #5F6368)" text-anchor="end">dim 2</text>

  <!-- animal cluster -->
  <circle cx="180" cy="140" r="60" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="150" cy="120" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <text x="160" y="123" font-size="13" fill="var(--dg-ink, #202124)">dog</text>
  <circle cx="200" cy="110" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <text x="210" y="113" font-size="13" fill="var(--dg-ink, #202124)">cat</text>
  <circle cx="170" cy="170" r="4" fill="var(--dg-accent, #0C8F88)"/>
  <text x="180" y="173" font-size="13" fill="var(--dg-ink, #202124)">puppy</text>
  <text x="180" y="205" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">animal words</text>

  <!-- vehicle cluster -->
  <circle cx="480" cy="270" r="60" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="460" cy="250" r="4" fill="var(--dg-ink, #202124)"/>
  <text x="470" y="253" font-size="13" fill="var(--dg-ink, #202124)">car</text>
  <circle cx="500" cy="245" r="4" fill="var(--dg-ink, #202124)"/>
  <text x="510" y="248" font-size="13" fill="var(--dg-ink, #202124)">truck</text>
  <circle cx="470" cy="295" r="4" fill="var(--dg-ink, #202124)"/>
  <text x="480" y="298" font-size="13" fill="var(--dg-ink, #202124)">engine</text>
  <text x="480" y="335" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">vehicle words</text>

  <text x="350" y="400" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Distance in the learned space approximates semantic distance — no dictionary was involved.</text>
</svg>
