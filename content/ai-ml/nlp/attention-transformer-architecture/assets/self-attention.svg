<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="350" y="28" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Self-attention: one query, weighted blend of all values</text>

  <!-- key tokens row -->
  <g font-size="13" fill="var(--dg-ink, #202124)">
    <rect x="40" y="70" width="90" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="85" y="93" text-anchor="middle">"animal"</text>
    <rect x="150" y="70" width="90" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="195" y="93" text-anchor="middle">"didn't"</text>
    <rect x="260" y="70" width="90" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="305" y="93" text-anchor="middle">"cross"</text>
    <rect x="370" y="70" width="90" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
    <text x="415" y="93" text-anchor="middle">"street"</text>
    <rect x="480" y="70" width="90" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="525" y="93" text-anchor="middle" font-weight="600">"it" (query)</text>
  </g>
  <text x="20" y="93" font-size="11" fill="var(--dg-muted, #5F6368)">keys →</text>

  <!-- attention weight lines from query to each key, thickness ~ weight -->
  <path d="M525,106 C 500,160 150,200 85,106" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1" opacity="0.5" marker-end="url(#arrow)"/>
  <path d="M525,106 C 500,160 250,200 195,106" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1" opacity="0.5" marker-end="url(#arrow)"/>
  <path d="M525,106 C 500,150 320,180 305,106" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow)"/>
  <path d="M525,106 C 500,140 420,160 415,106" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow)"/>

  <text x="350" y="210" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">softmax(QK&#183;T / &#8730;d) — "it" scores highest against "animal"</text>

  <line x1="525" y1="106" x2="85" y2="240" stroke="var(--dg-accent, #0C8F88)" stroke-width="3" marker-end="url(#arrowAccent)"/>
  <text x="290" y="260" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">highest weight</text>

  <!-- output -->
  <rect x="480" y="290" width="120" height="44" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="540" y="317" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">"it" output</text>
  <line x1="525" y1="106" x2="540" y2="290" stroke="var(--dg-line, #5F6368)" stroke-width="1" stroke-dasharray="4 3"/>

  <text x="350" y="365" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">"it"'s new vector is a weighted sum of all value vectors — mostly "animal"'s.</text>
</svg>
