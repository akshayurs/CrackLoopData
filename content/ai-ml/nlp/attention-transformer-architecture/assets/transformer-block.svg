<svg viewBox="0 0 620 560" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="310" y="28" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">One Transformer block</text>

  <rect x="140" y="50" width="180" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="230" y="75" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">block input</text>
  <line x1="230" y1="90" x2="230" y2="112" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="120" y="112" width="220" height="52" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="230" y="143" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">multi-head self-attention</text>

  <line x1="230" y1="164" x2="230" y2="186" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- residual bypass 1 -->
  <path d="M340,70 C 420,70 420,200 360,200" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="430" y="140" font-size="11" fill="var(--dg-muted, #5F6368)">residual +</text>

  <rect x="140" y="186" width="180" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="230" y="211" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">layer norm</text>

  <line x1="230" y1="226" x2="230" y2="248" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="120" y="248" width="220" height="52" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="230" y="279" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">feedforward network</text>

  <line x1="230" y1="300" x2="230" y2="322" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- residual bypass 2 -->
  <path d="M340,206 C 420,206 420,336 360,336" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="430" y="276" font-size="11" fill="var(--dg-muted, #5F6368)">residual +</text>

  <rect x="140" y="322" width="180" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="230" y="347" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">layer norm</text>

  <line x1="230" y1="362" x2="230" y2="384" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="140" y="384" width="180" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="230" y="409" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">block output</text>

  <text x="310" y="440" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" font-weight="600">stacked N times (12 in BERT-base, 96 in GPT-3)</text>
  <line x1="230" y1="424" x2="230" y2="470" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="310" y="500" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Residual connections keep gradients flowing through many stacked blocks.</text>
</svg>
