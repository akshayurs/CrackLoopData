<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="320" y="28" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Support vectors and the margin</text>

  <rect x="60" y="55" width="520" height="300" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <line x1="100" y1="330" x2="540" y2="90" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>
  <line x1="130" y1="330" x2="570" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="70" y1="330" x2="510" y2="90" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="5 4"/>

  <text x="480" y="105" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">decision boundary</text>

  <circle cx="150" cy="290" r="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-ink, #202124)" stroke-width="1.5"/>
  <circle cx="200" cy="260" r="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-ink, #202124)" stroke-width="1.5"/>
  <circle cx="120" cy="230" r="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-ink, #202124)" stroke-width="1.5"/>
  <circle cx="255" cy="300" r="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-ink, #202124)" stroke-width="2.5"/>
  <text x="180" y="355" font-size="12" fill="var(--dg-muted, #5F6368)">class 0</text>

  <rect x="400" y="130" width="10" height="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-ink, #202124)" stroke-width="1.5"/>
  <rect x="450" y="160" width="10" height="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-ink, #202124)" stroke-width="1.5"/>
  <rect x="480" y="110" width="10" height="10" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-ink, #202124)" stroke-width="1.5"/>
  <rect x="345" y="140" width="12" height="12" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-ink, #202124)" stroke-width="2.5"/>
  <text x="430" y="90" font-size="12" fill="var(--dg-muted, #5F6368)">class 1</text>

  <text x="255" y="325" font-size="10" fill="var(--dg-ink, #202124)" text-anchor="middle">support vector</text>
  <text x="351" y="165" font-size="10" fill="var(--dg-ink, #202124)" text-anchor="middle">support vector</text>

  <text x="320" y="385" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Only the highlighted support vectors pin the margin — every other point could move freely.</text>
</svg>
