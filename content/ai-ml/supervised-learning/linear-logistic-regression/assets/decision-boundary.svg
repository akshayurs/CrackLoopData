<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="320" y="30" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Logistic regression: a linear decision boundary</text>

  <rect x="60" y="55" width="520" height="300" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <line x1="90" y1="335" x2="150" y2="80" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>
  <text x="165" y="90" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">w&#183;x + b = 0</text>

  <circle cx="180" cy="290" r="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-ink, #202124)" stroke-width="1.5"/>
  <circle cx="230" cy="250" r="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-ink, #202124)" stroke-width="1.5"/>
  <circle cx="140" cy="230" r="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-ink, #202124)" stroke-width="1.5"/>
  <circle cx="200" cy="320" r="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-ink, #202124)" stroke-width="1.5"/>
  <circle cx="260" cy="300" r="7" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-ink, #202124)" stroke-width="1.5"/>
  <text x="130" y="360" font-size="12" fill="var(--dg-muted, #5F6368)">class 0 &#183; p &lt; 0.5</text>

  <rect x="380" y="110" width="10" height="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <rect x="430" y="150" width="10" height="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <rect x="470" y="100" width="10" height="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <rect x="500" y="170" width="10" height="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <rect x="410" y="190" width="10" height="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="440" y="80" font-size="12" fill="var(--dg-muted, #5F6368)">class 1 &#183; p &gt; 0.5</text>

  <line x1="230" y1="200" x2="270" y2="180" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="195" font-size="11" fill="var(--dg-muted, #5F6368)" transform="rotate(-28 250,195)">confidence rises</text>

  <text x="320" y="395" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">The sigmoid only shapes how fast probability grows away from the line — the split itself is straight.</text>
</svg>
