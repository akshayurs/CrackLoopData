<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="340" y="28" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Random forest: many trees, one vote each</text>

  <rect x="20" y="50" width="150" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="95" y="75" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">bootstrap sample 1</text>

  <rect x="265" y="50" width="150" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="340" y="75" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">bootstrap sample 2</text>

  <rect x="510" y="50" width="150" height="40" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="585" y="75" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">bootstrap sample N</text>

  <line x1="95" y1="90" x2="95" y2="130" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="90" x2="340" y2="130" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="585" y1="90" x2="585" y2="130" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="130" width="130" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="95" y="152" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Tree 1</text>
  <text x="95" y="168" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">random feature subset</text>

  <rect x="275" y="130" width="130" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="340" y="152" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Tree 2</text>
  <text x="340" y="168" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">random feature subset</text>

  <rect x="520" y="130" width="130" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="585" y="152" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Tree N</text>
  <text x="585" y="168" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">random feature subset</text>

  <text x="95" y="205" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">vote: yes</text>
  <text x="340" y="205" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">vote: no</text>
  <text x="585" y="205" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">vote: yes</text>

  <line x1="95" y1="215" x2="320" y2="270" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="215" x2="340" y2="270" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="585" y1="215" x2="360" y2="270" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="250" y="270" width="180" height="50" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <text x="340" y="292" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Majority vote</text>
  <text x="340" y="308" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">final prediction: yes</text>

  <text x="340" y="370" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each tree's independent mistakes cancel; only agreement across many trees survives the vote.</text>
</svg>
