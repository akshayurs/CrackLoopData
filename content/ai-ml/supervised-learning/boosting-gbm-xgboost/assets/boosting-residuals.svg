<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="340" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Boosting rounds shrinking the residual</text>

  <line x1="60" y1="330" x2="640" y2="330" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="60" y="350" font-size="11" fill="var(--dg-muted, #5F6368)">round 1</text>
  <text x="240" y="350" font-size="11" fill="var(--dg-muted, #5F6368)">round 2</text>
  <text x="420" y="350" font-size="11" fill="var(--dg-muted, #5F6368)">round 3</text>
  <text x="580" y="350" font-size="11" fill="var(--dg-muted, #5F6368)">round N</text>

  <rect x="70" y="90" width="60" height="220" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="100" y="80" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">large</text>

  <rect x="250" y="170" width="60" height="140" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="280" y="160" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">smaller</text>

  <rect x="430" y="230" width="60" height="80" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="460" y="220" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">small</text>

  <rect x="590" y="300" width="60" height="10" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="620" y="290" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">tiny</text>

  <line x1="140" y1="200" x2="240" y2="240" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="250" x2="420" y2="270" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="285" x2="580" y2="303" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="340" y="30" text-anchor="middle" font-size="1"> </text>
  <text x="340" y="368" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Bar height = remaining residual. Each round's tree targets what's left after all prior rounds.</text>
</svg>
