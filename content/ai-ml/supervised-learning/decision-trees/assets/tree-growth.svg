<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="340" y="28" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A tree growing, split by split</text>

  <rect x="270" y="48" width="140" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="340" y="76" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">income &gt; 50k?</text>

  <line x1="300" y1="94" x2="180" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="215" y="115" font-size="11" fill="var(--dg-muted, #5F6368)">no</text>
  <line x1="380" y1="94" x2="500" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="115" font-size="11" fill="var(--dg-muted, #5F6368)">yes</text>

  <rect x="110" y="140" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="180" y="168" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">age &gt; 40?</text>

  <rect x="430" y="140" width="140" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="500" y="160" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">leaf: approve</text>
  <text x="500" y="176" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">pure, stop</text>

  <line x1="150" y1="186" x2="90" y2="230" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="100" y="205" font-size="11" fill="var(--dg-muted, #5F6368)">no</text>
  <line x1="210" y1="186" x2="270" y2="230" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="255" y="205" font-size="11" fill="var(--dg-muted, #5F6368)">yes</text>

  <rect x="20" y="230" width="140" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="90" y="250" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">leaf: decline</text>
  <text x="90" y="266" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">pure, stop</text>

  <rect x="200" y="230" width="140" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="270" y="250" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">credit &gt; 700?</text>
  <text x="270" y="266" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">still mixed</text>

  <line x1="270" y1="276" x2="270" y2="320" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="270" y="340" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">recursion continues on this branch only</text>

  <text x="340" y="400" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each branch stops independently the moment its leaf is pure — depth varies branch to branch.</text>
</svg>
