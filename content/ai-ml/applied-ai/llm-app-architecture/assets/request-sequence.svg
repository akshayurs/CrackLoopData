<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A request's path through the stack</text>

  <line x1="70" y1="55" x2="70" y2="375" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <line x1="220" y1="55" x2="220" y2="375" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <line x1="370" y1="55" x2="370" y2="375" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <line x1="520" y1="55" x2="520" y2="375" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>

  <rect x="20" y="30" width="100" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="70" y="50" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">User</text>
  <rect x="165" y="30" width="110" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="220" y="50" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">App logic</text>
  <rect x="308" y="30" width="124" height="30" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="370" y="50" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Orchestration</text>
  <rect x="470" y="30" width="100" height="30" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="520" y="50" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Model API</text>

  <line x1="70" y1="80" x2="215" y2="80" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="145" y="73" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">request</text>

  <line x1="220" y1="105" x2="365" y2="105" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="292" y="98" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">validated</text>

  <rect x="600" y="128" width="24" height="30" rx="4" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1" transform="rotate(90 612 143)"/>
  <text x="605" y="147" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)" transform="rotate(90 605 147)">DB</text>

  <line x1="370" y1="135" x2="596" y2="135" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="483" y="128" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">query vector DB</text>
  <line x1="596" y1="160" x2="370" y2="160" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="483" y="153" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">retrieved context</text>

  <line x1="370" y1="195" x2="515" y2="195" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
  <text x="443" y="188" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">prompt + context</text>

  <rect x="500" y="212" width="40" height="70" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="520" y="252" text-anchor="middle" font-size="10" fill="var(--dg-ink, #202124)">tokens</text>

  <line x1="515" y1="300" x2="375" y2="300" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
  <text x="445" y="293" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">stream tokens</text>

  <line x1="365" y1="325" x2="225" y2="325" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="295" y="318" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">render chunks</text>

  <line x1="215" y1="350" x2="75" y2="350" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="145" y="343" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">response</text>

  <text x="320" y="392" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Retrieval happens once per request; the model streams tokens back the whole way.</text>
</svg>
