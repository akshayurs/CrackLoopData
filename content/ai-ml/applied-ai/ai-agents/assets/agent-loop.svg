<svg viewBox="0 0 500 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <circle cx="250" cy="90" r="65" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="250" y="85" text-anchor="middle" font-size="17" fill="var(--dg-ink, #202124)" font-weight="600">Think</text>
  <text x="250" y="105" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">reason, decide</text>
  <text x="250" y="119" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">next action</text>

  <circle cx="110" cy="290" r="65" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="110" y="285" text-anchor="middle" font-size="17" fill="var(--dg-ink, #202124)" font-weight="600">Act</text>
  <text x="110" y="305" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">call a tool,</text>
  <text x="110" y="319" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">run code</text>

  <circle cx="390" cy="290" r="65" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="390" y="285" text-anchor="middle" font-size="17" fill="var(--dg-ink, #202124)" font-weight="600">Observe</text>
  <text x="390" y="305" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">read the</text>
  <text x="390" y="319" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">result</text>

  <path d="M 200 130 A 140 140 0 0 0 130 235" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow4)"/>
  <path d="M 170 290 L 330 290" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow4)"/>
  <path d="M 370 235 A 140 140 0 0 0 300 130" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrow4)"/>

  <text x="250" y="395" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Repeats until the goal is met or a hard step/cost limit stops it</text>
</svg>
