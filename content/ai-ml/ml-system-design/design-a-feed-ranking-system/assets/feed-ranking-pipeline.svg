<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <rect x="20" y="70" width="150" height="80" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="95" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="var(--dg-ink, #202124)">Candidate</text>
  <text x="95" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="var(--dg-ink, #202124)">Generation</text>
  <text x="95" y="138" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">millions → ~500</text>

  <line x1="170" y1="110" x2="220" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="220" y="70" width="150" height="80" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)"/>
  <text x="295" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="var(--dg-ink, #202124)">Ranking</text>
  <text x="295" y="118" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">rich features,</text>
  <text x="295" y="134" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">~500 → scored</text>

  <line x1="370" y1="110" x2="420" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="420" y="70" width="150" height="80" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)"/>
  <text x="495" y="93" text-anchor="middle" font-size="13" font-weight="600" fill="var(--dg-ink, #202124)">Re-rank /</text>
  <text x="495" y="111" text-anchor="middle" font-size="13" font-weight="600" fill="var(--dg-ink, #202124)">Business Rules</text>
  <text x="495" y="131" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">diversity, freshness</text>

  <line x1="570" y1="110" x2="620" y2="110" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="650" y="115" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Feed</text>

  <text x="95" y="185" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">cheap · fast</text>
  <text x="295" y="185" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">expensive · precise</text>
  <text x="495" y="185" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">rules, not ML</text>
</svg>
