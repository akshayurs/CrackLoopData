<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Image to patch tokens</text>

  <g>
    <rect x="30" y="46" width="182" height="182" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="121" y="242" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">224x224 image, 14x14 grid</text>
    <!-- grid lines: 14x14, drawn coarsely for legibility -->
    <g stroke="var(--dg-line, #5F6368)" stroke-width="0.5" opacity="0.6">
      <line x1="56" y1="46" x2="56" y2="228"/><line x1="82" y1="46" x2="82" y2="228"/><line x1="108" y1="46" x2="108" y2="228"/>
      <line x1="134" y1="46" x2="134" y2="228"/><line x1="160" y1="46" x2="160" y2="228"/><line x1="186" y1="46" x2="186" y2="228"/>
      <line x1="30" y1="72" x2="212" y2="72"/><line x1="30" y1="98" x2="212" y2="98"/><line x1="30" y1="124" x2="212" y2="124"/>
      <line x1="30" y1="150" x2="212" y2="150"/><line x1="30" y1="176" x2="212" y2="176"/><line x1="30" y1="202" x2="212" y2="202"/>
    </g>
    <rect x="82" y="98" width="26" height="26" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
    <text x="95" y="90" text-anchor="middle" font-size="10" fill="var(--dg-accent, #0C8F88)" font-weight="600">16x16</text>
  </g>

  <line x1="95" y1="111" x2="290" y2="130" stroke="var(--dg-accent, #0C8F88)" marker-end="url(#arrow)"/>
  <text x="200" y="112" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">flatten</text>

  <rect x="290" y="112" width="130" height="36" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="355" y="135" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">patch vector</text>

  <line x1="420" y1="130" x2="470" y2="130" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="445" y="120" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">linear proj.</text>

  <rect x="470" y="112" width="130" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="535" y="135" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">embedding</text>

  <line x1="535" y1="148" x2="535" y2="185" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>
  <text x="580" y="170" text-anchor="middle" font-size="10" fill="var(--dg-muted, #5F6368)">+ position</text>

  <rect x="470" y="188" width="130" height="36" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="535" y="211" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">token + pos</text>

  <line x1="470" y1="206" x2="250" y2="270" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="60" y="252" width="410" height="46" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <g fill="var(--dg-accent, #0C8F88)">
    <rect x="75" y="266" width="18" height="18" rx="3" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  </g>
  <rect x="100" y="266" width="18" height="18" rx="3" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <rect x="125" y="266" width="18" height="18" rx="3" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="160" y="280" font-size="14" fill="var(--dg-muted, #5F6368)">...</text>
  <rect x="180" y="266" width="18" height="18" rx="3" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1"/>
  <text x="330" y="280" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">196-token sequence into Transformer encoder</text>

  <line x1="265" y1="298" x2="265" y2="330" stroke="var(--dg-line, #5F6368)" marker-end="url(#arrow)"/>

  <rect x="150" y="332" width="230" height="34" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="265" y="354" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Transformer encoder</text>
</svg>
