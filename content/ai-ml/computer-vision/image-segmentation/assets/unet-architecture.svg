<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="350" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">U-Net: contracting encoder, expanding decoder, skip connections</text>

  <!-- encoder (left, narrowing down) -->
  <rect x="60" y="55" width="140" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="130" y="77" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">input image</text>
  <line x1="130" y1="89" x2="130" y2="115" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="80" y="115" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="130" y="137" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">encoder stage 1</text>
  <line x1="130" y1="149" x2="130" y2="175" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="95" y="175" width="70" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="130" y="197" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">stage 2</text>
  <line x1="130" y1="209" x2="130" y2="235" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- bottleneck -->
  <rect x="280" y="245" width="140" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="350" y="267" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">bottleneck</text>
  <line x1="130" y1="235" x2="280" y2="255" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="255" x2="570" y2="235" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- decoder (right, widening up) -->
  <rect x="535" y="175" width="70" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="570" y="197" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">stage 2</text>
  <line x1="570" y1="175" x2="570" y2="149" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="520" y="115" width="100" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="570" y="137" text-anchor="middle" font-size="11" fill="var(--dg-ink, #202124)">decoder stage 1</text>
  <line x1="570" y1="115" x2="570" y2="89" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="500" y="55" width="140" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="570" y="77" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">pixel-wise mask</text>

  <!-- skip connections -->
  <path d="M180,132 C 280,60 420,60 520,132" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowAccent)"/>
  <text x="350" y="55" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">skip connection (stage 1)</text>

  <path d="M165,192 C 250,240 250,240 535,192" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowAccent)"/>
  <text x="350" y="330" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)">skip connection (stage 2)</text>

  <text x="350" y="370" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Skip connections re-inject fine spatial detail the encoder's downsampling discarded.</text>
</svg>
