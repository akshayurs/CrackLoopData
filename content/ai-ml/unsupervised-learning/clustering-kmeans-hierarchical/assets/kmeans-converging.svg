<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">K-means converging over iterations</text>

  <!-- Panel 1: iteration 1 (random init, messy) -->
  <g>
    <rect x="20" y="50" width="200" height="200" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="120" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Iteration 1</text>
    <circle cx="60" cy="90" r="4" fill="var(--dg-line, #5F6368)"/>
    <circle cx="80" cy="110" r="4" fill="var(--dg-line, #5F6368)"/>
    <circle cx="65" cy="130" r="4" fill="var(--dg-line, #5F6368)"/>
    <circle cx="180" cy="190" r="4" fill="var(--dg-line, #5F6368)"/>
    <circle cx="160" cy="210" r="4" fill="var(--dg-line, #5F6368)"/>
    <circle cx="190" cy="230" r="4" fill="var(--dg-line, #5F6368)"/>
    <circle cx="110" cy="160" r="4" fill="var(--dg-line, #5F6368)"/>
    <circle cx="140" cy="90" r="4" fill="var(--dg-line, #5F6368)"/>
    <text x="120" y="150" text-anchor="middle" font-size="18" fill="var(--dg-accent, #0C8F88)" font-weight="700">X</text>
    <text x="150" y="200" text-anchor="middle" font-size="18" fill="#C0392B" font-weight="700">X</text>
  </g>

  <!-- Panel 2: iteration 2 (moving) -->
  <g>
    <rect x="260" y="50" width="200" height="200" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="360" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Iteration 2</text>
    <circle cx="300" cy="90" r="4" fill="var(--dg-accent, #0C8F88)"/>
    <circle cx="320" cy="110" r="4" fill="var(--dg-accent, #0C8F88)"/>
    <circle cx="305" cy="130" r="4" fill="var(--dg-accent, #0C8F88)"/>
    <circle cx="420" cy="190" r="4" fill="#C0392B"/>
    <circle cx="400" cy="210" r="4" fill="#C0392B"/>
    <circle cx="430" cy="230" r="4" fill="#C0392B"/>
    <circle cx="350" cy="160" r="4" fill="var(--dg-accent, #0C8F88)"/>
    <circle cx="380" cy="90" r="4" fill="var(--dg-accent, #0C8F88)"/>
    <text x="325" y="120" text-anchor="middle" font-size="18" fill="var(--dg-accent, #0C8F88)" font-weight="700">X</text>
    <text x="405" y="210" text-anchor="middle" font-size="18" fill="#C0392B" font-weight="700">X</text>
  </g>

  <!-- Panel 3: iteration 4 (converged) -->
  <g>
    <rect x="500" y="50" width="200" height="200" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="600" y="270" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Iteration 4 (stable)</text>
    <circle cx="540" cy="90" r="4" fill="var(--dg-accent, #0C8F88)"/>
    <circle cx="560" cy="105" r="4" fill="var(--dg-accent, #0C8F88)"/>
    <circle cx="545" cy="120" r="4" fill="var(--dg-accent, #0C8F88)"/>
    <circle cx="590" cy="100" r="4" fill="var(--dg-accent, #0C8F88)"/>
    <circle cx="565" cy="80" r="4" fill="var(--dg-accent, #0C8F88)"/>
    <circle cx="660" cy="210" r="4" fill="#C0392B"/>
    <circle cx="640" cy="225" r="4" fill="#C0392B"/>
    <circle cx="670" cy="235" r="4" fill="#C0392B"/>
    <text x="562" y="103" text-anchor="middle" font-size="18" fill="var(--dg-accent, #0C8F88)" font-weight="700">X</text>
    <text x="655" y="223" text-anchor="middle" font-size="18" fill="#C0392B" font-weight="700">X</text>
  </g>

  <line x1="222" y1="150" x2="258" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowK)"/>
  <line x1="462" y1="150" x2="498" y2="150" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrowK)"/>
  <defs>
    <marker id="arrowK" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="360" y="300" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Centroids (X) drift toward the mean of their assigned points each round until assignments stop changing.</text>
</svg>
