<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="350" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">A dendrogram, and where to cut it</text>

  <g stroke="var(--dg-line, #5F6368)" stroke-width="1.5" fill="none">
    <!-- leaves -->
    <line x1="80" y1="300" x2="80" y2="260"/>
    <line x1="140" y1="300" x2="140" y2="260"/>
    <line x1="220" y1="300" x2="220" y2="230"/>
    <line x1="280" y1="300" x2="280" y2="230"/>
    <line x1="380" y1="300" x2="380" y2="200"/>
    <line x1="440" y1="300" x2="440" y2="200"/>
    <line x1="520" y1="300" x2="520" y2="170"/>
    <line x1="580" y1="300" x2="580" y2="170"/>

    <!-- merge A+B -> 110 -->
    <line x1="80" y1="260" x2="140" y2="260"/>
    <line x1="110" y1="260" x2="110" y2="150"/>
    <!-- merge C+D -> 250 -->
    <line x1="220" y1="230" x2="280" y2="230"/>
    <line x1="250" y1="230" x2="250" y2="150"/>
    <!-- merge (AB)+(CD) -> 180 at height 150 -->
    <line x1="110" y1="150" x2="250" y2="150"/>
    <line x1="180" y1="150" x2="180" y2="90"/>

    <!-- merge E+F -> 410 -->
    <line x1="380" y1="200" x2="440" y2="200"/>
    <line x1="410" y1="200" x2="410" y2="120"/>
    <!-- merge G+H -> 550 -->
    <line x1="520" y1="170" x2="580" y2="170"/>
    <line x1="550" y1="170" x2="550" y2="120"/>
    <!-- merge (EF)+(GH) -> 480 at 120 -->
    <line x1="410" y1="120" x2="550" y2="120"/>
    <line x1="480" y1="120" x2="480" y2="90"/>

    <!-- final merge left+right -> root -->
    <line x1="180" y1="90" x2="480" y2="90"/>
    <line x1="330" y1="90" x2="330" y2="60"/>
  </g>

  <!-- leaf labels -->
  <g font-size="12" fill="var(--dg-ink, #202124)" text-anchor="middle">
    <text x="80" y="316">A</text><text x="140" y="316">B</text>
    <text x="220" y="316">C</text><text x="280" y="316">D</text>
    <text x="380" y="316">E</text><text x="440" y="316">F</text>
    <text x="520" y="316">G</text><text x="580" y="316">H</text>
  </g>

  <!-- cut line -->
  <line x1="50" y1="140" x2="650" y2="140" stroke="var(--dg-accent, #0C8F88)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="655" y="144" font-size="12" fill="var(--dg-accent, #0C8F88)" font-weight="600">cut here -&gt; 4 clusters</text>

  <text x="350" y="355" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Merge height = dissimilarity. A horizontal cut's crossings = number of resulting clusters.</text>
</svg>
