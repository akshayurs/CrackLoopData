<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrowPca" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
    <marker id="arrowPca2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="320" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Principal components over a 2D scatter</text>

  <rect x="60" y="50" width="500" height="270" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>

  <!-- scatter points along a diagonal spread -->
  <g fill="var(--dg-muted, #5F6368)">
    <circle cx="140" cy="270" r="4"/>
    <circle cx="170" cy="250" r="4"/>
    <circle cx="200" cy="255" r="4"/>
    <circle cx="230" cy="225" r="4"/>
    <circle cx="260" cy="220" r="4"/>
    <circle cx="290" cy="195" r="4"/>
    <circle cx="310" cy="205" r="4"/>
    <circle cx="330" cy="175" r="4"/>
    <circle cx="360" cy="170" r="4"/>
    <circle cx="380" cy="150" r="4"/>
    <circle cx="410" cy="145" r="4"/>
    <circle cx="440" cy="120" r="4"/>
    <circle cx="460" cy="130" r="4"/>
    <circle cx="480" cy="100" r="4"/>
    <circle cx="500" cy="95" r="4"/>
  </g>

  <!-- PC1: along the spread -->
  <line x1="120" y1="285" x2="520" y2="85" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5" marker-end="url(#arrowPca)"/>
  <text x="530" y="80" font-size="13" fill="var(--dg-accent, #0C8F88)" font-weight="600">PC1</text>

  <!-- PC2: perpendicular -->
  <line x1="320" y1="230" x2="380" y2="115" stroke="var(--dg-line, #5F6368)" stroke-width="2" marker-end="url(#arrowPca2)"/>
  <text x="388" y="115" font-size="13" fill="var(--dg-muted, #5F6368)" font-weight="600">PC2</text>

  <text x="320" y="345" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">PC1 follows the widest spread; PC2 is perpendicular and captures what's left over.</text>
</svg>
