<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="350" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">5-fold cross-validation: every row validated on once</text>

  <text x="70" y="66" font-size="12" fill="var(--dg-muted, #5F6368)" text-anchor="middle">Run 1</text>
  <text x="70" y="102" font-size="12" fill="var(--dg-muted, #5F6368)" text-anchor="middle">Run 2</text>
  <text x="70" y="138" font-size="12" fill="var(--dg-muted, #5F6368)" text-anchor="middle">Run 3</text>
  <text x="70" y="174" font-size="12" fill="var(--dg-muted, #5F6368)" text-anchor="middle">Run 4</text>
  <text x="70" y="210" font-size="12" fill="var(--dg-muted, #5F6368)" text-anchor="middle">Run 5</text>

  <!-- 5 rows x 5 fold cells -->
  <g font-size="11" fill="var(--dg-ink, #202124)" text-anchor="middle">
    <!-- Row 1: fold1 val -->
    <rect x="120" y="46" width="96" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="168" y="67">val</text>
    <rect x="220" y="46" width="384" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="412" y="67">train</text>

    <!-- Row 2: fold2 val -->
    <rect x="120" y="82" width="96" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="168" y="103">train</text>
    <rect x="220" y="82" width="96" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="268" y="103">val</text>
    <rect x="320" y="82" width="284" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="462" y="103">train</text>

    <!-- Row 3: fold3 val -->
    <rect x="120" y="118" width="196" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="218" y="139">train</text>
    <rect x="320" y="118" width="96" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="368" y="139">val</text>
    <rect x="420" y="118" width="184" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="512" y="139">train</text>

    <!-- Row 4: fold4 val -->
    <rect x="120" y="154" width="296" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="268" y="175">train</text>
    <rect x="420" y="154" width="96" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="468" y="175">val</text>
    <rect x="520" y="154" width="84" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="562" y="175">train</text>

    <!-- Row 5: fold5 val -->
    <rect x="120" y="190" width="396" height="34" rx="6" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
    <text x="318" y="211">train</text>
    <rect x="520" y="190" width="84" height="34" rx="6" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
    <text x="562" y="211">val</text>
  </g>

  <line x1="350" y1="232" x2="350" y2="256" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="256" width="340" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="350" y="284" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">average the 5 scores -&gt; one estimate</text>

  <text x="350" y="326" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Each run trains on 4 folds and validates on the 1 held-out fold, rotating each time.</text>
</svg>
