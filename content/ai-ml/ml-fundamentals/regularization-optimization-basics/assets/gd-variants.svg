<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-muted, #5F6368)"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Three paths to the same minimum</text>

  <!-- contour bowl -->
  <ellipse cx="360" cy="260" rx="230" ry="140" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <ellipse cx="360" cy="260" rx="160" ry="98" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <ellipse cx="360" cy="260" rx="90" ry="55" fill="none" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.2"/>
  <circle cx="360" cy="260" r="5" fill="var(--dg-accent, #0C8F88)"/>
  <text x="360" y="285" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">minimum</text>

  <!-- Batch: one smooth curve -->
  <path d="M150,130 C 220,150 300,190 355,257" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="150" cy="130" r="4" fill="var(--dg-line, #5F6368)"/>

  <!-- Mini-batch: moderate zigzag -->
  <path d="M130,165 L185,190 L210,175 L250,220 L280,215 L320,245 L353,259" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.2" marker-end="url(#arrowAccent)"/>
  <circle cx="130" cy="165" r="4" fill="var(--dg-accent, #0C8F88)"/>

  <!-- SGD: noisy zigzag -->
  <path d="M115,205 L150,175 L125,235 L185,205 L155,270 L225,225 L195,290 L265,245 L235,300 L305,262 L352,262" fill="none" stroke="var(--dg-muted, #5F6368)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowMuted)"/>
  <circle cx="115" cy="205" r="4" fill="var(--dg-muted, #5F6368)"/>

  <!-- legend -->
  <g>
    <line x1="500" y1="130" x2="530" y2="130" stroke="var(--dg-line, #5F6368)" stroke-width="2.5"/>
    <text x="538" y="134" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Batch</text>
    <text x="538" y="150" font-size="11" fill="var(--dg-muted, #5F6368)">whole dataset/step</text>
    <text x="538" y="164" font-size="11" fill="var(--dg-muted, #5F6368)">smooth, slow, heavy</text>

    <line x1="500" y1="196" x2="530" y2="196" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.2"/>
    <text x="538" y="200" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">Mini-batch</text>
    <text x="538" y="216" font-size="11" fill="var(--dg-muted, #5F6368)">small batch/step</text>
    <text x="538" y="230" font-size="11" fill="var(--dg-muted, #5F6368)">balanced (default)</text>

    <line x1="500" y1="262" x2="530" y2="262" stroke="var(--dg-muted, #5F6368)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="538" y="266" font-size="12" fill="var(--dg-ink, #202124)" font-weight="600">SGD</text>
    <text x="538" y="282" font-size="11" fill="var(--dg-muted, #5F6368)">1 example/step</text>
    <text x="538" y="296" font-size="11" fill="var(--dg-muted, #5F6368)">noisy, fast/step</text>
  </g>

  <text x="360" y="420" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Same destination, different noise and compute per update.</text>
</svg>
