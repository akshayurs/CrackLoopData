<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="350" y="28" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Learning curves: error vs. training-set size</text>

  <!-- axes -->
  <line x1="80" y1="370" x2="640" y2="370" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="80" y1="370" x2="80" y2="40" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="360" y="400" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Training-set size -&gt;</text>
  <text x="60" y="205" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" transform="rotate(-90 60,205)">Error</text>

  <!-- training error curve (low, flat) -->
  <polyline points="80,300 134,298.6 188,297.2 242,295.8 296,294.4 350,293 404,291.6 458,290.2 512,288.8 566,287.4 620,286"
    fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>

  <!-- validation error curve (starts high, descends toward train) -->
  <polyline points="80,90 134,108.2 188,126.4 242,144.6 296,162.8 350,181 404,199.2 458,217.4 512,235.6 566,253.8 620,272"
    fill="none" stroke="var(--dg-muted, #5F6368)" stroke-width="2.5"/>

  <!-- gap bracket at left (high variance) -->
  <line x1="100" y1="90" x2="100" y2="300" stroke="var(--dg-ink, #202124)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="112" y="200" font-size="11" fill="var(--dg-ink, #202124)">gap = variance</text>

  <!-- convergence marker at right -->
  <line x1="600" y1="272" x2="600" y2="286" stroke="var(--dg-ink, #202124)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="530" y="330" font-size="11" fill="var(--dg-ink, #202124)">gap narrows with more data</text>

  <!-- legend -->
  <line x1="470" y1="60" x2="495" y2="60" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>
  <text x="502" y="64" font-size="12" fill="var(--dg-ink, #202124)">training error</text>
  <line x1="470" y1="80" x2="495" y2="80" stroke="var(--dg-muted, #5F6368)" stroke-width="2.5"/>
  <text x="502" y="84" font-size="12" fill="var(--dg-ink, #202124)">validation error</text>

  <text x="350" y="415" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">A gap that shrinks with more data signals variance; a flat, high floor signals bias.</text>
</svg>
