<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="350" y="28" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Error vs. model complexity</text>

  <!-- axes -->
  <line x1="80" y1="370" x2="640" y2="370" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="80" y1="370" x2="80" y2="40" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="400" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Model complexity -&gt;</text>
  <text x="60" y="205" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" transform="rotate(-90 60,205)">Error</text>

  <!-- bias curve (decreasing) -->
  <polyline points="80,161 134,219.4 188,260.6 242,289.7 296,310.1 350,324.5 404,334.8 458,341.9 512,347 566,350.5 620,353"
    fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>

  <!-- variance curve (increasing) -->
  <polyline points="80,353 134,350.5 188,347 242,341.9 296,334.8 350,324.5 404,310.1 458,289.7 512,260.6 566,219.4 620,161"
    fill="none" stroke="var(--dg-muted, #5F6368)" stroke-width="2.5"/>

  <!-- total error (U-shape) -->
  <polyline points="80,126.4 134,182.3 188,220 242,244 296,257.3 350,261.5 404,257.3 458,244 512,220 566,182.3 620,126.4"
    fill="none" stroke="var(--dg-ink, #202124)" stroke-width="3"/>

  <!-- sweet spot marker -->
  <circle cx="350" cy="261.5" r="5" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="2"/>
  <line x1="350" y1="261.5" x2="350" y2="370" stroke="var(--dg-accent, #0C8F88)" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="350" y="392" text-anchor="middle" font-size="11" fill="var(--dg-accent, #0C8F88)" font-weight="600">sweet spot</text>

  <!-- legend -->
  <line x1="470" y1="60" x2="495" y2="60" stroke="var(--dg-accent, #0C8F88)" stroke-width="2.5"/>
  <text x="502" y="64" font-size="12" fill="var(--dg-ink, #202124)">bias&#178;</text>
  <line x1="470" y1="80" x2="495" y2="80" stroke="var(--dg-muted, #5F6368)" stroke-width="2.5"/>
  <text x="502" y="84" font-size="12" fill="var(--dg-ink, #202124)">variance</text>
  <line x1="470" y1="100" x2="495" y2="100" stroke="var(--dg-ink, #202124)" stroke-width="3"/>
  <text x="502" y="104" font-size="12" fill="var(--dg-ink, #202124)">total error</text>

  <text x="350" y="415" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Total error = bias&#178; + variance + irreducible error, minimized between the extremes.</text>
</svg>
