<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="350" y="28" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">ROC curve: true positive rate vs. false positive rate</text>

  <!-- axes -->
  <line x1="80" y1="370" x2="640" y2="370" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="80" y1="370" x2="80" y2="40" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="360" y="400" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">False positive rate -&gt;</text>
  <text x="55" y="205" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)" transform="rotate(-90 55,205)">True positive rate</text>

  <!-- shaded AUC area -->
  <path d="M80,370 L80,370 134,222.6 188,182.2 242,153.5 296,130.7 350,111.1 404,94 458,78.8 512,64.8 566,51.9 620,40 L620,370 Z"
    fill="var(--dg-accent-bg, #E3F3F1)" opacity="0.6"/>

  <!-- diagonal chance line -->
  <line x1="80" y1="370" x2="620" y2="40" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="500" y="130" font-size="11" fill="var(--dg-muted, #5F6368)">chance (AUC = 0.5)</text>

  <!-- ROC curve -->
  <polyline points="80,370 134,222.6 188,182.2 242,153.5 296,130.7 350,111.1 404,94 458,78.8 512,64.8 566,51.9 620,40"
    fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="3"/>

  <text x="330" y="220" text-anchor="middle" font-size="13" fill="var(--dg-accent, #0C8F88)" font-weight="600">AUC</text>

  <text x="350" y="415" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">AUC = probability a random positive scores higher than a random negative. Closer to top-left is better.</text>
</svg>
