<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The four ways a model learns</text>

  <!-- Center node -->
  <rect x="270" y="46" width="180" height="46" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="360" y="74" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Machine learning</text>

  <!-- Connector lines to 4 quadrants -->
  <line x1="290" y1="92" x2="150" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="92" x2="570" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="290" y1="92" x2="150" y2="290" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="92" x2="570" y2="290" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Supervised -->
  <rect x="30" y="140" width="240" height="88" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="164" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Supervised</text>
  <text x="150" y="184" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">human-labeled (input -&gt; output)</text>
  <text x="150" y="202" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">spam detection, price prediction</text>

  <!-- Unsupervised -->
  <rect x="450" y="140" width="240" height="88" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="570" y="164" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Unsupervised</text>
  <text x="570" y="184" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">no labels, finds structure</text>
  <text x="570" y="202" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">customer segmentation</text>

  <!-- Reinforcement -->
  <rect x="30" y="290" width="240" height="88" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="150" y="314" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Reinforcement</text>
  <text x="150" y="334" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">learns by acting, reward signal</text>
  <text x="150" y="352" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">game-playing agents, robotics</text>

  <!-- Self-supervised -->
  <rect x="450" y="290" width="240" height="88" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="570" y="314" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Self-supervised</text>
  <text x="570" y="334" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">labels manufactured from raw data</text>
  <text x="570" y="352" text-anchor="middle" font-size="11" fill="var(--dg-muted, #5F6368)">predict a masked word</text>

  <text x="360" y="406" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">What differs across all four: where the training signal comes from.</text>
</svg>
