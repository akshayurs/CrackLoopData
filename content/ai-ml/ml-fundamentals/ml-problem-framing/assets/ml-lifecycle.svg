<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="380" y="26" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">The ML lifecycle is a loop, not a line</text>

  <!-- 5 stage boxes -->
  <rect x="20" y="110" width="128" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="84" y="145" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Data</text>

  <rect x="178" y="110" width="128" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="242" y="145" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Train</text>

  <rect x="336" y="110" width="128" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="400" y="145" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Evaluate</text>

  <rect x="494" y="110" width="128" height="60" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="558" y="145" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Deploy</text>

  <rect x="612" y="110" width="128" height="60" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="676" y="145" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Monitor</text>

  <!-- forward arrows -->
  <line x1="148" y1="140" x2="174" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="306" y1="140" x2="332" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="464" y1="140" x2="490" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="622" y1="140" x2="608" y2="140" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- feedback loop back to Data -->
  <path d="M676,170 V220 H84 V174" fill="none" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowAccent)"/>
  <text x="380" y="238" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">drift detected -&gt; new data feeds the next training round</text>

  <text x="380" y="272" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Evaluate happens offline on held-out data; Monitor happens live, after deploy.</text>
</svg>
