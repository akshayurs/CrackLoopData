<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <!-- Must-block group (red/warning) -->
  <text x="40" y="35" font-size="13" fill="#202124" font-weight="bold">Block-worthy</text>
  <rect x="40" y="50" width="200" height="56" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="140" y="74" text-anchor="middle" font-size="15" fill="#202124">Correctness</text>
  <text x="140" y="92" text-anchor="middle" font-size="12" fill="#202124">bugs, edge cases</text>

  <rect x="40" y="120" width="200" height="56" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="140" y="144" text-anchor="middle" font-size="15" fill="#202124">Security</text>
  <text x="140" y="162" text-anchor="middle" font-size="12" fill="#202124">injection, secrets</text>

  <rect x="40" y="190" width="200" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="140" y="214" text-anchor="middle" font-size="15" fill="#202124">Design</text>
  <text x="140" y="232" text-anchor="middle" font-size="12" fill="#202124">right abstraction</text>

  <!-- Important group (primary) -->
  <text x="270" y="35" font-size="13" fill="#202124" font-weight="bold">Important</text>
  <rect x="270" y="50" width="200" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="370" y="74" text-anchor="middle" font-size="15" fill="#202124">Tests</text>
  <text x="370" y="92" text-anchor="middle" font-size="12" fill="#202124">cover new logic</text>

  <rect x="270" y="120" width="200" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="370" y="144" text-anchor="middle" font-size="15" fill="#202124">Readability</text>
  <text x="370" y="162" text-anchor="middle" font-size="12" fill="#202124">names, clarity</text>

  <rect x="270" y="190" width="200" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="370" y="214" text-anchor="middle" font-size="15" fill="#202124">Performance</text>
  <text x="370" y="232" text-anchor="middle" font-size="12" fill="#202124">hot-path cost</text>

  <!-- Nice-to-have group (neutral) -->
  <text x="500" y="35" font-size="13" fill="#202124" font-weight="bold">Nice-to-have</text>
  <rect x="500" y="50" width="200" height="56" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="600" y="74" text-anchor="middle" font-size="15" fill="#202124">Style</text>
  <text x="600" y="92" text-anchor="middle" font-size="12" fill="#202124">let linter decide</text>

  <rect x="500" y="120" width="200" height="56" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="600" y="144" text-anchor="middle" font-size="15" fill="#202124">Docs</text>
  <text x="600" y="162" text-anchor="middle" font-size="12" fill="#202124">comments, README</text>

  <rect x="500" y="190" width="200" height="56" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="600" y="214" text-anchor="middle" font-size="15" fill="#202124">Naming nits</text>
  <text x="600" y="232" text-anchor="middle" font-size="12" fill="#202124">prefix "nit:"</text>

  <text x="360" y="300" text-anchor="middle" font-size="12" fill="#5F6368">Left blocks merge. Right are suggestions, not gates.</text>
</svg>
