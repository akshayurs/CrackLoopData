<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Merge sort: split down, merge up</text>

  <text x="120" y="60" text-anchor="middle" font-size="11" fill="#9AA0A6">split</text>
  <text x="600" y="60" text-anchor="middle" font-size="11" fill="#34A853">merge</text>

  <!-- Level 0 -->
  <rect x="280" y="50" width="160" height="36" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="73" text-anchor="middle" font-size="14" fill="#202124">[5, 2, 8, 1]</text>

  <!-- Level 1 -->
  <rect x="150" y="140" width="120" height="36" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="210" y="163" text-anchor="middle" font-size="14" fill="#202124">[5, 2]</text>

  <rect x="450" y="140" width="120" height="36" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="510" y="163" text-anchor="middle" font-size="14" fill="#202124">[8, 1]</text>

  <!-- Level 2 (leaves) -->
  <rect x="90" y="230" width="70" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="125" y="253" text-anchor="middle" font-size="14" fill="#202124">[5]</text>

  <rect x="200" y="230" width="70" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="235" y="253" text-anchor="middle" font-size="14" fill="#202124">[2]</text>

  <rect x="450" y="230" width="70" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="485" y="253" text-anchor="middle" font-size="14" fill="#202124">[8]</text>

  <rect x="560" y="230" width="70" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="595" y="253" text-anchor="middle" font-size="14" fill="#202124">[1]</text>

  <!-- Merged results -->
  <rect x="150" y="310" width="120" height="36" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="210" y="333" text-anchor="middle" font-size="14" fill="#202124">[2, 5]</text>

  <rect x="450" y="310" width="120" height="36" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="510" y="333" text-anchor="middle" font-size="14" fill="#202124">[1, 8]</text>

  <rect x="280" y="360" width="160" height="32" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="381" text-anchor="middle" font-size="14" fill="#202124">[1, 2, 5, 8]</text>

  <!-- Split edges -->
  <line x1="320" y1="86" x2="230" y2="140" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="86" x2="490" y2="140" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="185" y1="176" x2="140" y2="230" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="235" y1="176" x2="235" y2="230" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="485" y1="176" x2="485" y2="230" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="535" y1="176" x2="585" y2="230" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Merge edges -->
  <line x1="125" y1="266" x2="180" y2="310" stroke="#34A853" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="235" y1="266" x2="220" y2="310" stroke="#34A853" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="485" y1="266" x2="500" y2="310" stroke="#34A853" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="595" y1="266" x2="540" y2="310" stroke="#34A853" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="210" y1="346" x2="320" y2="360" stroke="#34A853" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="346" x2="400" y2="360" stroke="#34A853" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
