<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="80" y1="380" x2="660" y2="380" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="80" y1="380" x2="80" y2="40" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="405" font-size="12" fill="#202124" text-anchor="end">input size n</text>
  <text x="70" y="38" font-size="12" fill="#202124" text-anchor="end">operations</text>

  <!-- O(1) -->
  <line x1="80" y1="372" x2="660" y2="372" stroke="#34A853" stroke-width="2"/>
  <text x="600" y="365" font-size="12" fill="#34A853">O(1)</text>

  <!-- O(log n) -->
  <path d="M80,370 Q260,330 660,300" fill="none" stroke="#34A853" stroke-width="2"/>
  <text x="600" y="295" font-size="12" fill="#34A853">O(log n)</text>

  <!-- O(n) -->
  <line x1="80" y1="378" x2="560" y2="50" stroke="#4285F4" stroke-width="2"/>
  <text x="565" y="50" font-size="12" fill="#4285F4">O(n)</text>

  <!-- O(n log n) -->
  <path d="M80,378 Q300,260 420,50" fill="none" stroke="#4285F4" stroke-width="2"/>
  <text x="425" y="50" font-size="12" fill="#4285F4">O(n log n)</text>

  <!-- O(n^2) -->
  <path d="M80,378 Q230,330 300,50" fill="none" stroke="#FBBC04" stroke-width="2"/>
  <text x="300" y="48" font-size="12" fill="#FBBC04" text-anchor="middle">O(n²)</text>

  <!-- O(2^n) -->
  <path d="M80,378 Q150,360 195,50" fill="none" stroke="#EA4335" stroke-width="2"/>
  <text x="190" y="48" font-size="12" fill="#EA4335" text-anchor="middle">O(2ⁿ)</text>

  <!-- O(n!) -->
  <path d="M80,378 Q110,300 130,50" fill="none" stroke="#EA4335" stroke-width="2"/>
  <text x="120" y="48" font-size="12" fill="#EA4335" text-anchor="middle">O(n!)</text>
</svg>
