<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" font-size="15" fill="#202124" text-anchor="middle" font-weight="bold">Dynamic array: cost of each push</text>

  <!-- baseline -->
  <line x1="70" y1="240" x2="660" y2="240" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="262" font-size="11" fill="#202124" text-anchor="end">push #</text>
  <line x1="70" y1="240" x2="70" y2="60" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="60" y="58" font-size="11" fill="#202124" text-anchor="end">cost</text>

  <!-- cheap pushes (cost 1) -->
  <g fill="#E6F4EA" stroke="#34A853" stroke-width="1.5">
    <rect x="86" y="228" width="20" height="12"/>
    <rect x="130" y="228" width="20" height="12"/>
    <rect x="174" y="228" width="20" height="12"/>
    <rect x="218" y="228" width="20" height="12"/>
    <rect x="262" y="228" width="20" height="12"/>
    <rect x="306" y="228" width="20" height="12"/>
    <rect x="350" y="228" width="20" height="12"/>
    <rect x="438" y="228" width="20" height="12"/>
    <rect x="482" y="228" width="20" height="12"/>
    <rect x="526" y="228" width="20" height="12"/>
  </g>

  <!-- expensive doubling pushes (tall spikes) -->
  <rect x="108" y="180" width="20" height="60" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <rect x="196" y="150" width="20" height="90" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <rect x="372" y="110" width="20" height="130" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>

  <text x="118" y="172" font-size="10" fill="#EA4335" text-anchor="middle">copy 2</text>
  <text x="206" y="142" font-size="10" fill="#EA4335" text-anchor="middle">copy 4</text>
  <text x="382" y="102" font-size="10" fill="#EA4335" text-anchor="middle">copy 8</text>

  <!-- amortized line -->
  <line x1="86" y1="216" x2="560" y2="216" stroke="#4285F4" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="566" y="219" font-size="12" fill="#4285F4">avg ≈ O(1)</text>

  <text x="360" y="305" font-size="13" fill="#202124" text-anchor="middle">Rare resizes cost O(n), but they get rarer as the array grows.</text>
  <text x="360" y="328" font-size="13" fill="#202124" text-anchor="middle">Spread over all pushes, each push averages a constant — O(1) amortized.</text>
</svg>
