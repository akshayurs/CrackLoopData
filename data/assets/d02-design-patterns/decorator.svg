<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Outer wrappers nested -->
  <rect x="30" y="40" width="170" height="100" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="115" y="65" text-anchor="middle" font-size="13" fill="#202124">Logging</text>

  <rect x="220" y="40" width="170" height="100" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="305" y="65" text-anchor="middle" font-size="13" fill="#202124">Retry</text>

  <rect x="410" y="40" width="170" height="100" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="495" y="65" text-anchor="middle" font-size="13" fill="#202124">Caching</text>

  <!-- Core object -->
  <rect x="600" y="60" width="100" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="650" y="95" text-anchor="middle" font-size="13" fill="#202124">HttpClient</text>

  <!-- Arrows: each wraps the next (delegates) -->
  <line x1="200" y1="100" x2="218" y2="100" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="100" x2="408" y2="100" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="100" x2="598" y2="100" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="165" text-anchor="middle" font-size="11" fill="#5F6368">each wraps and delegates to the next, same interface</text>
</svg>
