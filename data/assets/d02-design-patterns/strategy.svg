<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Context -->
  <rect x="40" y="120" width="200" height="80" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="140" y="152" text-anchor="middle" font-size="15" fill="#202124">Context</text>
  <text x="140" y="172" text-anchor="middle" font-size="12" fill="#202124">PaymentService</text>

  <!-- Strategy interface -->
  <rect x="300" y="120" width="180" height="80" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="390" y="152" text-anchor="middle" font-size="15" fill="#202124">Strategy</text>
  <text x="390" y="172" text-anchor="middle" font-size="12" fill="#202124">pay(amount)</text>

  <!-- Concrete strategies -->
  <rect x="540" y="30" width="150" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="615" y="65" text-anchor="middle" font-size="13" fill="#202124">CreditCard</text>

  <rect x="540" y="130" width="150" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="615" y="165" text-anchor="middle" font-size="13" fill="#202124">PayPal</text>

  <rect x="540" y="230" width="150" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="615" y="265" text-anchor="middle" font-size="13" fill="#202124">Crypto</text>

  <!-- Arrows -->
  <line x1="240" y1="160" x2="298" y2="160" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="269" y="150" text-anchor="middle" font-size="11" fill="#5F6368">holds</text>

  <line x1="480" y1="150" x2="538" y2="70" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="160" x2="538" y2="160" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="170" x2="538" y2="250" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="120" text-anchor="middle" font-size="11" fill="#5F6368">implements</text>
</svg>
