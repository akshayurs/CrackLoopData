<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">A generic scalable web stack</text>

  <!-- Client -->
  <rect x="290" y="50" width="140" height="44" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="77" text-anchor="middle" font-size="14" fill="#202124">Client</text>

  <line x1="360" y1="94" x2="360" y2="120" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CDN -->
  <rect x="290" y="120" width="140" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="142" text-anchor="middle" font-size="14" fill="#202124">CDN</text>
  <text x="360" y="158" text-anchor="middle" font-size="11" fill="#5F6368">static / edge</text>

  <line x1="360" y1="164" x2="360" y2="190" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Load balancer -->
  <rect x="290" y="190" width="140" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="217" text-anchor="middle" font-size="14" fill="#202124">Load balancer</text>

  <!-- App servers -->
  <line x1="330" y1="234" x2="230" y2="270" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="234" x2="360" y2="270" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="234" x2="490" y2="270" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="160" y="270" width="130" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="225" y="297" text-anchor="middle" font-size="13" fill="#202124">app (stateless)</text>
  <rect x="295" y="270" width="130" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="297" text-anchor="middle" font-size="13" fill="#202124">app (stateless)</text>
  <rect x="430" y="270" width="130" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="495" y="297" text-anchor="middle" font-size="13" fill="#202124">app (stateless)</text>

  <!-- Down to data tier -->
  <line x1="225" y1="314" x2="160" y2="360" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="314" x2="360" y2="360" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="495" y1="314" x2="560" y2="360" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Cache -->
  <rect x="90" y="360" width="140" height="44" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="160" y="382" text-anchor="middle" font-size="13" fill="#202124">Cache</text>
  <text x="160" y="398" text-anchor="middle" font-size="11" fill="#5F6368">hot reads</text>

  <!-- Queue -->
  <rect x="290" y="360" width="140" height="44" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="382" text-anchor="middle" font-size="13" fill="#202124">Queue</text>
  <text x="360" y="398" text-anchor="middle" font-size="11" fill="#5F6368">async work</text>

  <!-- DB -->
  <rect x="490" y="360" width="140" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="560" y="382" text-anchor="middle" font-size="13" fill="#202124">Database</text>
  <text x="560" y="398" text-anchor="middle" font-size="11" fill="#5F6368">source of truth</text>

  <!-- Object store -->
  <rect x="490" y="420" width="140" height="34" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="560" y="442" text-anchor="middle" font-size="12" fill="#202124">Object store</text>
  <line x1="560" y1="404" x2="560" y2="420" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
