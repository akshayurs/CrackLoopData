<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">CAP: pick 2 when the network breaks</text>

  <!-- Triangle edges -->
  <line x1="360" y1="90" x2="160" y2="320" stroke="#9AA0A6" stroke-width="1.5"/>
  <line x1="360" y1="90" x2="560" y2="320" stroke="#9AA0A6" stroke-width="1.5"/>
  <line x1="160" y1="320" x2="560" y2="320" stroke="#9AA0A6" stroke-width="1.5"/>

  <!-- Corner: Consistency -->
  <rect x="290" y="70" width="140" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="92" text-anchor="middle" font-size="14" fill="#202124">Consistency</text>
  <text x="360" y="110" text-anchor="middle" font-size="11" fill="#5F6368">same data everywhere</text>

  <!-- Corner: Availability -->
  <rect x="90" y="320" width="140" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="160" y="342" text-anchor="middle" font-size="14" fill="#202124">Availability</text>
  <text x="160" y="360" text-anchor="middle" font-size="11" fill="#5F6368">always answers</text>

  <!-- Corner: Partition tolerance -->
  <rect x="490" y="320" width="150" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="565" y="342" text-anchor="middle" font-size="14" fill="#202124">Partition tol.</text>
  <text x="565" y="360" text-anchor="middle" font-size="11" fill="#5F6368">survives split</text>

  <!-- Edge labels -->
  <text x="240" y="205" text-anchor="middle" font-size="12" fill="#EA4335">CP</text>
  <text x="240" y="220" text-anchor="middle" font-size="10" fill="#5F6368">reject writes</text>
  <text x="480" y="205" text-anchor="middle" font-size="12" fill="#EA4335">AP</text>
  <text x="480" y="220" text-anchor="middle" font-size="10" fill="#5F6368">serve stale</text>

  <text x="360" y="400" text-anchor="middle" font-size="11" fill="#5F6368">P is mandatory in real networks, so the real choice is C vs A</text>
</svg>
