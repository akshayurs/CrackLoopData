<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#202124" font-weight="600">Binary search for target = 23 in a sorted array</text>

  <!-- Row 1: full range -->
  <text x="40" y="72" font-size="12" fill="#202124" font-weight="600">Step 1</text>
  <rect x="100" y="54" width="64" height="34" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="132" y="76" text-anchor="middle" font-size="13" fill="#202124">3</text>
  <rect x="172" y="54" width="64" height="34" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="204" y="76" text-anchor="middle" font-size="13" fill="#202124">9</text>
  <rect x="244" y="54" width="64" height="34" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="276" y="76" text-anchor="middle" font-size="13" fill="#202124">14</text>
  <rect x="316" y="54" width="64" height="34" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="348" y="76" text-anchor="middle" font-size="13" fill="#202124">18</text>
  <rect x="388" y="54" width="64" height="34" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="420" y="76" text-anchor="middle" font-size="13" fill="#202124">23</text>
  <rect x="460" y="54" width="64" height="34" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="492" y="76" text-anchor="middle" font-size="13" fill="#202124">31</text>
  <rect x="532" y="54" width="64" height="34" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="564" y="76" text-anchor="middle" font-size="13" fill="#202124">42</text>
  <text x="348" y="106" text-anchor="middle" font-size="11" fill="#4285F4">mid=18 &lt; 23, go right</text>

  <!-- Row 2: right half -->
  <text x="40" y="156" font-size="12" fill="#202124" font-weight="600">Step 2</text>
  <rect x="388" y="138" width="64" height="34" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="420" y="160" text-anchor="middle" font-size="13" fill="#202124">23</text>
  <rect x="460" y="138" width="64" height="34" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="492" y="160" text-anchor="middle" font-size="13" fill="#202124">31</text>
  <rect x="532" y="138" width="64" height="34" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="564" y="160" text-anchor="middle" font-size="13" fill="#202124">42</text>
  <text x="492" y="190" text-anchor="middle" font-size="11" fill="#4285F4">mid=31 &gt; 23, go left</text>

  <!-- Row 3: found -->
  <text x="40" y="240" font-size="12" fill="#202124" font-weight="600">Step 3</text>
  <rect x="388" y="222" width="64" height="34" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="420" y="244" text-anchor="middle" font-size="13" fill="#202124">23</text>
  <text x="420" y="274" text-anchor="middle" font-size="11" fill="#34A853">mid=23 = target, found</text>

  <text x="360" y="306" text-anchor="middle" font-size="13" fill="#202124">Each step throws away half the remaining range, so 7 items need only 3 looks.</text>
</svg>
