<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Root -->
  <rect x="280" y="20" width="160" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="42" text-anchor="middle" font-size="15" fill="#202124">Root node</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#202124">[ 50 | 100 ]</text>

  <!-- Internal nodes -->
  <rect x="60" y="150" width="160" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="140" y="172" text-anchor="middle" font-size="15" fill="#202124">Internal node</text>
  <text x="140" y="190" text-anchor="middle" font-size="12" fill="#202124">[ 20 | 35 ]</text>

  <rect x="280" y="150" width="160" height="50" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="172" text-anchor="middle" font-size="15" fill="#202124">Internal node</text>
  <text x="360" y="190" text-anchor="middle" font-size="12" fill="#202124">[ 70 | 85 ]</text>

  <rect x="500" y="150" width="160" height="50" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="580" y="172" text-anchor="middle" font-size="15" fill="#202124">Internal node</text>
  <text x="580" y="190" text-anchor="middle" font-size="12" fill="#202124">[ 120 | 150 ]</text>

  <!-- Leaf nodes -->
  <rect x="60" y="280" width="160" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="140" y="302" text-anchor="middle" font-size="15" fill="#202124">Leaf</text>
  <text x="140" y="320" text-anchor="middle" font-size="12" fill="#202124">36..49 + rows</text>

  <rect x="280" y="280" width="160" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="302" text-anchor="middle" font-size="15" fill="#202124">Leaf (key 72)</text>
  <text x="360" y="320" text-anchor="middle" font-size="12" fill="#202124">70..84 + rows</text>

  <rect x="500" y="280" width="160" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="580" y="302" text-anchor="middle" font-size="15" fill="#202124">Leaf</text>
  <text x="580" y="320" text-anchor="middle" font-size="12" fill="#202124">85..99 + rows</text>

  <!-- Root to internal -->
  <line x1="320" y1="70" x2="160" y2="150" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="70" x2="360" y2="150" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="70" x2="560" y2="150" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Internal to leaf (the search path 70-85 -> leaf 72) -->
  <line x1="320" y1="200" x2="160" y2="280" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="200" x2="360" y2="280" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="200" x2="560" y2="280" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Linked leaf pointers -->
  <line x1="220" y1="305" x2="280" y2="305" stroke="#34A853" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="440" y1="305" x2="500" y2="305" stroke="#34A853" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="360" y="115" text-anchor="middle" font-size="11" fill="#EA4335">search key = 72  →  pick 50..100 branch</text>
  <text x="600" y="345" text-anchor="middle" font-size="11" fill="#34A853">leaves linked for range scans</text>
</svg>
