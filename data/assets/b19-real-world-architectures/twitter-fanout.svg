<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="180" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Fan-out-on-write (push)</text>
  <text x="540" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Fan-out-on-read (pull)</text>

  <!-- LEFT: write path -->
  <rect x="80" y="55" width="200" height="46" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="180" y="78" text-anchor="middle" font-size="15" fill="#202124">User tweets</text>
  <text x="180" y="94" text-anchor="middle" font-size="12" fill="#202124">write once</text>

  <line x1="180" y1="101" x2="180" y2="135" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="122" text-anchor="middle" font-size="11" fill="#5F6368">copy to all</text>

  <rect x="40" y="140" width="120" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="100" y="167" text-anchor="middle" font-size="13" fill="#202124">Follower cache</text>
  <rect x="200" y="140" width="120" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="260" y="167" text-anchor="middle" font-size="13" fill="#202124">Follower cache</text>

  <line x1="180" y1="184" x2="180" y2="225" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="60" y="230" width="240" height="46" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="180" y="252" text-anchor="middle" font-size="15" fill="#202124">Read timeline</text>
  <text x="180" y="268" text-anchor="middle" font-size="12" fill="#202124">cheap, pre-built</text>

  <rect x="40" y="320" width="280" height="62" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="180" y="345" text-anchor="middle" font-size="13" fill="#202124">Fast reads, slow writes</text>
  <text x="180" y="365" text-anchor="middle" font-size="12" fill="#202124">celebrity fan-out explodes</text>

  <!-- divider -->
  <line x1="360" y1="50" x2="360" y2="390" stroke="#9AA0A6" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- RIGHT: read path -->
  <rect x="440" y="55" width="200" height="46" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="540" y="78" text-anchor="middle" font-size="15" fill="#202124">User tweets</text>
  <text x="540" y="94" text-anchor="middle" font-size="12" fill="#202124">store once</text>

  <line x1="540" y1="101" x2="540" y2="135" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="450" y="140" width="180" height="44" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="540" y="167" text-anchor="middle" font-size="13" fill="#202124">Tweets table</text>

  <line x1="540" y1="184" x2="540" y2="225" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="610" y="207" text-anchor="middle" font-size="11" fill="#5F6368">merge at read</text>
  <rect x="420" y="230" width="240" height="46" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="540" y="252" text-anchor="middle" font-size="15" fill="#202124">Query N follows</text>
  <text x="540" y="268" text-anchor="middle" font-size="12" fill="#202124">sort + merge live</text>

  <rect x="400" y="320" width="280" height="62" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="540" y="345" text-anchor="middle" font-size="13" fill="#202124">Cheap writes, costly reads</text>
  <text x="540" y="365" text-anchor="middle" font-size="12" fill="#202124">good for huge fan-out</text>
</svg>
