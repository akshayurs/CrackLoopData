<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#202124" font-weight="600">Interval Scheduling: pick earliest finish time</text>

  <!-- time axis -->
  <line x1="60" y1="300" x2="680" y2="300" stroke="#9AA0A6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="60" y="320" font-size="11" fill="#202124">0</text>
  <text x="200" y="320" font-size="11" fill="#202124">3</text>
  <text x="340" y="320" font-size="11" fill="#202124">6</text>
  <text x="480" y="320" font-size="11" fill="#202124">9</text>
  <text x="660" y="320" font-size="11" fill="#202124">time</text>

  <!-- Interval A: chosen (0-3) -->
  <rect x="60" y="60" width="140" height="34" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="130" y="82" text-anchor="middle" font-size="13" fill="#202124">A  pick</text>

  <!-- Interval B: rejected, overlaps A (1-5) -->
  <rect x="106" y="104" width="140" height="34" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="176" y="126" text-anchor="middle" font-size="13" fill="#202124">B  skip</text>

  <!-- Interval C: chosen (3-6) -->
  <rect x="200" y="148" width="140" height="34" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="270" y="170" text-anchor="middle" font-size="13" fill="#202124">C  pick</text>

  <!-- Interval D: rejected, overlaps C (4-8) -->
  <rect x="246" y="192" width="140" height="34" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="316" y="214" text-anchor="middle" font-size="13" fill="#202124">D  skip</text>

  <!-- Interval E: chosen (6-9) -->
  <rect x="340" y="236" width="140" height="34" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="410" y="258" text-anchor="middle" font-size="13" fill="#202124">E  pick</text>
</svg>
