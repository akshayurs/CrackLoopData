<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#202124" font-weight="600">When greedy fails: coin change, coins {1, 3, 4}, make 6</text>

  <!-- Greedy path (top) -->
  <text x="40" y="70" font-size="13" fill="#202124" font-weight="600">Greedy</text>
  <rect x="120" y="52" width="120" height="40" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="180" y="72" text-anchor="middle" font-size="13" fill="#202124">take 4</text>
  <text x="180" y="86" text-anchor="middle" font-size="11" fill="#202124">left: 2</text>

  <line x1="240" y1="72" x2="290" y2="72" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="290" y="52" width="120" height="40" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="350" y="72" text-anchor="middle" font-size="13" fill="#202124">take 1</text>
  <text x="350" y="86" text-anchor="middle" font-size="11" fill="#202124">left: 1</text>

  <line x1="410" y1="72" x2="460" y2="72" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="460" y="52" width="120" height="40" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="520" y="72" text-anchor="middle" font-size="13" fill="#202124">take 1</text>
  <text x="520" y="86" text-anchor="middle" font-size="11" fill="#202124">left: 0</text>

  <rect x="600" y="52" width="90" height="40" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="645" y="77" text-anchor="middle" font-size="14" fill="#202124">3 coins</text>

  <!-- Optimal path (bottom) -->
  <text x="40" y="240" font-size="13" fill="#202124" font-weight="600">Optimal</text>
  <rect x="120" y="222" width="120" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="180" y="242" text-anchor="middle" font-size="13" fill="#202124">take 3</text>
  <text x="180" y="256" text-anchor="middle" font-size="11" fill="#202124">left: 3</text>

  <line x1="240" y1="242" x2="290" y2="242" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="290" y="222" width="120" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="350" y="242" text-anchor="middle" font-size="13" fill="#202124">take 3</text>
  <text x="350" y="256" text-anchor="middle" font-size="11" fill="#202124">left: 0</text>

  <rect x="460" y="222" width="90" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="505" y="247" text-anchor="middle" font-size="14" fill="#202124">2 coins</text>

  <text x="360" y="330" text-anchor="middle" font-size="13" fill="#202124">Grabbing the biggest coin first is locally optimal but globally worse.</text>
</svg>
