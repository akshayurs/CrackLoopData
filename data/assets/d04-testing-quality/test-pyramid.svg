<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Pyramid tiers -->
  <polygon points="360,40 460,130 260,130" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="360" y="95" text-anchor="middle" font-size="15" fill="#202124">End-to-End</text>
  <text x="360" y="113" text-anchor="middle" font-size="12" fill="#202124">few, slow</text>

  <polygon points="260,135 460,135 540,250 180,250" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="190" text-anchor="middle" font-size="15" fill="#202124">Integration</text>
  <text x="360" y="208" text-anchor="middle" font-size="12" fill="#202124">some, medium</text>

  <polygon points="180,255 540,255 620,380 100,380" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="312" text-anchor="middle" font-size="15" fill="#202124">Unit</text>
  <text x="360" y="330" text-anchor="middle" font-size="12" fill="#202124">many, fast</text>

  <!-- Axis arrows -->
  <line x1="60" y1="40" x2="60" y2="380" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="48" y="215" text-anchor="middle" font-size="11" fill="#5F6368" transform="rotate(-90 48 215)">more tests, faster, cheaper</text>

  <line x1="660" y1="380" x2="660" y2="40" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="678" y="215" text-anchor="middle" font-size="11" fill="#5F6368" transform="rotate(90 678 215)">more realistic, slower</text>
</svg>
