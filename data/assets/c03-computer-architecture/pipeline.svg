<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#202124">5-Stage Pipeline (one new instruction finishes each cycle)</text>

  <!-- stage headers -->
  <text x="120" y="62" text-anchor="middle" font-size="12" fill="#5F6368">Cycle 1</text>
  <text x="230" y="62" text-anchor="middle" font-size="12" fill="#5F6368">Cycle 2</text>
  <text x="340" y="62" text-anchor="middle" font-size="12" fill="#5F6368">Cycle 3</text>
  <text x="450" y="62" text-anchor="middle" font-size="12" fill="#5F6368">Cycle 4</text>
  <text x="560" y="62" text-anchor="middle" font-size="12" fill="#5F6368">Cycle 5</text>

  <!-- row labels -->
  <text x="40" y="95" font-size="12" fill="#202124">Instr 1</text>
  <text x="40" y="135" font-size="12" fill="#202124">Instr 2</text>
  <text x="40" y="175" font-size="12" fill="#202124">Instr 3</text>

  <!-- Instr 1 -->
  <rect x="80"  y="78" width="80" height="28" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="120" y="97" text-anchor="middle" font-size="12">Fetch</text>
  <rect x="190" y="78" width="80" height="28" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="230" y="97" text-anchor="middle" font-size="12">Decode</text>
  <rect x="300" y="78" width="80" height="28" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/><text x="340" y="97" text-anchor="middle" font-size="12">Execute</text>
  <rect x="410" y="78" width="80" height="28" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="450" y="97" text-anchor="middle" font-size="12">Memory</text>
  <rect x="520" y="78" width="80" height="28" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="560" y="97" text-anchor="middle" font-size="12">WriteBack</text>

  <!-- Instr 2 -->
  <rect x="190" y="118" width="80" height="28" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="230" y="137" text-anchor="middle" font-size="12">Fetch</text>
  <rect x="300" y="118" width="80" height="28" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="340" y="137" text-anchor="middle" font-size="12">Decode</text>
  <rect x="410" y="118" width="80" height="28" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/><text x="450" y="137" text-anchor="middle" font-size="12">Execute</text>
  <rect x="520" y="118" width="80" height="28" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="560" y="137" text-anchor="middle" font-size="12">Memory</text>

  <!-- Instr 3 -->
  <rect x="300" y="158" width="80" height="28" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="340" y="177" text-anchor="middle" font-size="12">Fetch</text>
  <rect x="410" y="158" width="80" height="28" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="450" y="177" text-anchor="middle" font-size="12">Decode</text>
  <rect x="520" y="158" width="80" height="28" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/><text x="560" y="177" text-anchor="middle" font-size="12">Execute</text>

  <line x1="80" y1="210" x2="640" y2="210" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="228" text-anchor="middle" font-size="11" fill="#5F6368">time</text>

  <text x="360" y="270" text-anchor="middle" font-size="12" fill="#202124">Stages overlap, so throughput approaches 1 instruction per cycle even though each</text>
  <text x="360" y="290" text-anchor="middle" font-size="12" fill="#202124">instruction still takes 5 cycles end to end.</text>
</svg>
