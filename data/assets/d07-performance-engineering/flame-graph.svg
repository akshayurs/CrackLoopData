<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#202124">Flame graph: width = time on CPU</text>

  <!-- frame 0: root, full width -->
  <rect x="40" y="50" width="640" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="74" text-anchor="middle" font-size="13" fill="#202124">handleRequest (100%)</text>

  <!-- frame 1: two children -->
  <rect x="40" y="100" width="200" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="140" y="124" text-anchor="middle" font-size="12" fill="#202124">parseInput (20%)</text>

  <rect x="250" y="100" width="430" height="40" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="465" y="124" text-anchor="middle" font-size="12" fill="#202124">buildResponse (67%)</text>

  <!-- frame 2: under buildResponse -->
  <rect x="250" y="150" width="120" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="310" y="174" text-anchor="middle" font-size="12" fill="#202124">fetch (18%)</text>

  <rect x="380" y="150" width="300" height="40" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="530" y="174" text-anchor="middle" font-size="12" fill="#202124">serialize (47%)</text>

  <!-- frame 3: the hot leaf -->
  <rect x="380" y="200" width="300" height="40" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="530" y="224" text-anchor="middle" font-size="12" fill="#202124">jsonEncode (45%)</text>

  <!-- pointer to widest leaf -->
  <line x1="530" y1="290" x2="530" y2="244" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="380" y="292" width="300" height="48" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="530" y="312" text-anchor="middle" font-size="13" fill="#202124">Widest leaf = hot path</text>
  <text x="530" y="330" text-anchor="middle" font-size="12" fill="#202124">fix this first</text>

  <text x="140" y="312" text-anchor="middle" font-size="11" fill="#9AA0A6">narrow = cheap, skip</text>
</svg>
