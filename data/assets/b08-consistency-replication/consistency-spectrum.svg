<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Consistency spectrum: strong (left) to weak (right)</text>

  <!-- axis -->
  <line x1="40" y1="70" x2="680" y2="70" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="40" y="60" font-size="11" fill="#5F6368">Stronger / slower</text>
  <text x="680" y="60" text-anchor="end" font-size="11" fill="#5F6368">Weaker / faster</text>

  <!-- Linearizable -->
  <rect x="40" y="95" width="150" height="70" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="115" y="125" text-anchor="middle" font-size="15" fill="#202124">Linearizable</text>
  <text x="115" y="145" text-anchor="middle" font-size="12" fill="#202124">Single recent copy</text>

  <!-- Sequential -->
  <rect x="210" y="95" width="150" height="70" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="285" y="125" text-anchor="middle" font-size="15" fill="#202124">Sequential</text>
  <text x="285" y="145" text-anchor="middle" font-size="12" fill="#202124">One global order</text>

  <!-- Causal -->
  <rect x="380" y="95" width="150" height="70" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="455" y="125" text-anchor="middle" font-size="15" fill="#202124">Causal</text>
  <text x="455" y="145" text-anchor="middle" font-size="12" fill="#202124">Cause before effect</text>

  <!-- Eventual -->
  <rect x="550" y="95" width="130" height="70" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="615" y="125" text-anchor="middle" font-size="15" fill="#202124">Eventual</text>
  <text x="615" y="145" text-anchor="middle" font-size="12" fill="#202124">Converges later</text>

  <text x="115" y="195" text-anchor="middle" font-size="11" fill="#5F6368">Acts like one node</text>
  <text x="285" y="195" text-anchor="middle" font-size="11" fill="#5F6368">Agreed order, maybe stale</text>
  <text x="455" y="195" text-anchor="middle" font-size="11" fill="#5F6368">Related writes ordered</text>
  <text x="615" y="195" text-anchor="middle" font-size="11" fill="#5F6368">No guarantee meanwhile</text>
</svg>
