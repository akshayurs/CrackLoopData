<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Quorum overlap: N=3, W=2, R=2 (R+W &gt; N)</text>

  <!-- Three replicas -->
  <rect x="270" y="60" width="80" height="55" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="310" y="92" text-anchor="middle" font-size="15" fill="#202124">Node A</text>
  <rect x="370" y="60" width="80" height="55" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="410" y="92" text-anchor="middle" font-size="15" fill="#202124">Node B</text>
  <rect x="470" y="60" width="80" height="55" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="510" y="92" text-anchor="middle" font-size="15" fill="#202124">Node C</text>

  <!-- Write quorum -->
  <rect x="60" y="160" width="240" height="110" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="180" y="190" text-anchor="middle" font-size="15" fill="#202124">Write touches A, B</text>
  <text x="180" y="212" text-anchor="middle" font-size="12" fill="#202124">W = 2</text>

  <!-- Read quorum -->
  <rect x="420" y="160" width="240" height="110" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="540" y="190" text-anchor="middle" font-size="15" fill="#202124">Read touches B, C</text>
  <text x="540" y="212" text-anchor="middle" font-size="12" fill="#202124">R = 2</text>

  <!-- overlap callout -->
  <rect x="305" y="225" width="110" height="55" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="250" text-anchor="middle" font-size="13" fill="#202124">Overlap: B</text>
  <text x="360" y="269" text-anchor="middle" font-size="11" fill="#202124">latest write seen</text>

  <line x1="180" y1="160" x2="290" y2="115" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="160" x2="395" y2="115" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="160" x2="425" y2="115" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="160" x2="510" y2="115" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
