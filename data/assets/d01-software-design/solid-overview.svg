<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#5F6368"/>
    </marker>
  </defs>

  <rect x="280" y="20" width="160" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="42" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">SOLID</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#202124">design for change</text>

  <rect x="20" y="140" width="125" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="82" y="165" text-anchor="middle" font-size="15" fill="#202124">S — SRP</text>
  <text x="82" y="184" text-anchor="middle" font-size="12" fill="#202124">one reason to change</text>

  <rect x="160" y="140" width="125" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="222" y="165" text-anchor="middle" font-size="15" fill="#202124">O — OCP</text>
  <text x="222" y="184" text-anchor="middle" font-size="12" fill="#202124">extend not edit</text>

  <rect x="300" y="140" width="125" height="60" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="362" y="165" text-anchor="middle" font-size="15" fill="#202124">L — LSP</text>
  <text x="362" y="184" text-anchor="middle" font-size="12" fill="#202124">subtypes substitute</text>

  <rect x="440" y="140" width="125" height="60" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="502" y="165" text-anchor="middle" font-size="15" fill="#202124">I — ISP</text>
  <text x="502" y="184" text-anchor="middle" font-size="12" fill="#202124">small interfaces</text>

  <rect x="580" y="140" width="125" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="642" y="165" text-anchor="middle" font-size="15" fill="#202124">D — DIP</text>
  <text x="642" y="184" text-anchor="middle" font-size="12" fill="#202124">depend on abstractions</text>

  <line x1="320" y1="70" x2="100" y2="138" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="70" x2="235" y2="138" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="70" x2="362" y2="138" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="70" x2="490" y2="138" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="70" x2="625" y2="138" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="360" y="250" text-anchor="middle" font-size="12" fill="#9AA0A6">All five reduce coupling and isolate change</text>
</svg>
