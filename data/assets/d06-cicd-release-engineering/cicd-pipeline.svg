<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Commit -->
  <rect x="10" y="70" width="100" height="56" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="60" y="94" font-size="15" fill="#202124" text-anchor="middle">Commit</text>
  <text x="60" y="112" font-size="12" fill="#202124" text-anchor="middle">push to repo</text>

  <!-- Build -->
  <rect x="140" y="70" width="100" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="190" y="94" font-size="15" fill="#202124" text-anchor="middle">Build</text>
  <text x="190" y="112" font-size="12" fill="#202124" text-anchor="middle">compile</text>

  <!-- Test -->
  <rect x="270" y="70" width="100" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="320" y="94" font-size="15" fill="#202124" text-anchor="middle">Test</text>
  <text x="320" y="112" font-size="12" fill="#202124" text-anchor="middle">unit + integ</text>

  <!-- Scan -->
  <rect x="400" y="70" width="100" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="450" y="94" font-size="15" fill="#202124" text-anchor="middle">Scan</text>
  <text x="450" y="112" font-size="12" fill="#202124" text-anchor="middle">SAST + deps</text>

  <!-- Package -->
  <rect x="530" y="70" width="100" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="580" y="94" font-size="15" fill="#202124" text-anchor="middle">Package</text>
  <text x="580" y="112" font-size="12" fill="#202124" text-anchor="middle">build artifact</text>

  <!-- Deploy -->
  <rect x="610" y="10" width="100" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="660" y="32" font-size="15" fill="#202124" text-anchor="middle">Deploy</text>
  <text x="660" y="49" font-size="12" fill="#202124" text-anchor="middle">to prod</text>

  <!-- Arrows -->
  <line x1="110" y1="98" x2="138" y2="98" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="98" x2="268" y2="98" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="98" x2="398" y2="98" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="98" x2="528" y2="98" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="80" x2="660" y2="62" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="360" y="160" font-size="11" fill="#202124" text-anchor="middle">A red stage fails the build and stops the pipeline (a CI gate)</text>
</svg>
