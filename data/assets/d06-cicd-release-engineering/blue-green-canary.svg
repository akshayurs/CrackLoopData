<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="180" y="24" font-size="15" fill="#202124" text-anchor="middle" font-weight="bold">Blue-Green</text>
  <text x="540" y="24" font-size="15" fill="#202124" text-anchor="middle" font-weight="bold">Canary</text>

  <!-- ===== Blue-Green ===== -->
  <rect x="120" y="50" width="120" height="46" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="180" y="78" font-size="15" fill="#202124" text-anchor="middle">Router</text>

  <rect x="30" y="150" width="130" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="95" y="174" font-size="15" fill="#202124" text-anchor="middle">Blue (old)</text>
  <text x="95" y="192" font-size="12" fill="#202124" text-anchor="middle">live now</text>

  <rect x="200" y="150" width="130" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="265" y="174" font-size="15" fill="#202124" text-anchor="middle">Green (new)</text>
  <text x="265" y="192" font-size="12" fill="#202124" text-anchor="middle">idle, ready</text>

  <line x1="150" y1="96" x2="95" y2="148" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="210" y1="96" x2="265" y2="148" stroke="#5F6368" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="180" y="250" font-size="11" fill="#202124" text-anchor="middle">Flip 100% at once;</text>
  <text x="180" y="266" font-size="11" fill="#202124" text-anchor="middle">rollback = flip back</text>

  <!-- divider -->
  <line x1="360" y1="40" x2="360" y2="290" stroke="#9AA0A6" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- ===== Canary ===== -->
  <rect x="480" y="50" width="120" height="46" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="540" y="78" font-size="15" fill="#202124" text-anchor="middle">Router</text>

  <rect x="400" y="150" width="130" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="465" y="174" font-size="15" fill="#202124" text-anchor="middle">Old (95%)</text>
  <text x="465" y="192" font-size="12" fill="#202124" text-anchor="middle">most traffic</text>

  <rect x="570" y="150" width="130" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="635" y="174" font-size="15" fill="#202124" text-anchor="middle">New (5%)</text>
  <text x="635" y="192" font-size="12" fill="#202124" text-anchor="middle">canary</text>

  <line x1="510" y1="96" x2="465" y2="148" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="96" x2="635" y2="148" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="250" font-size="11" fill="#202124" text-anchor="middle">Shift slowly: 5%, 25%, 100%;</text>
  <text x="540" y="266" font-size="11" fill="#202124" text-anchor="middle">watch metrics, abort if bad</text>
</svg>
