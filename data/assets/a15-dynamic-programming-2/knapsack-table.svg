<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">0/1 Knapsack, capacity 5</text>
  <text x="360" y="42" text-anchor="middle" font-size="12" fill="#9AA0A6">items: A(w2,v3) B(w3,v4) C(w4,v5) ; dp[i][c] = best value</text>

  <!-- capacity column headers 0..5 -->
  <g font-size="13" fill="#202124" text-anchor="middle">
    <text x="130" y="74">c=0</text>
    <text x="190" y="74">1</text>
    <text x="250" y="74">2</text>
    <text x="310" y="74">3</text>
    <text x="370" y="74">4</text>
    <text x="430" y="74">5</text>
  </g>
  <!-- row labels -->
  <g font-size="13" fill="#202124" text-anchor="middle">
    <text x="80" y="114">none</text>
    <text x="80" y="154">+A</text>
    <text x="80" y="194">+B</text>
    <text x="80" y="234">+C</text>
  </g>

  <!-- row 0: no items -->
  <rect x="105" y="90"  width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="130" y="113" text-anchor="middle" font-size="14" fill="#202124">0</text>
  <rect x="165" y="90"  width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="190" y="113" text-anchor="middle" font-size="14" fill="#202124">0</text>
  <rect x="225" y="90"  width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="250" y="113" text-anchor="middle" font-size="14" fill="#202124">0</text>
  <rect x="285" y="90"  width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="310" y="113" text-anchor="middle" font-size="14" fill="#202124">0</text>
  <rect x="345" y="90"  width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="370" y="113" text-anchor="middle" font-size="14" fill="#202124">0</text>
  <rect x="405" y="90"  width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="430" y="113" text-anchor="middle" font-size="14" fill="#202124">0</text>

  <!-- row A -->
  <rect x="105" y="130" width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="130" y="153" text-anchor="middle" font-size="14" fill="#202124">0</text>
  <rect x="165" y="130" width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="190" y="153" text-anchor="middle" font-size="14" fill="#202124">0</text>
  <rect x="225" y="130" width="50" height="36" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="250" y="153" text-anchor="middle" font-size="14" fill="#202124">3</text>
  <rect x="285" y="130" width="50" height="36" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="310" y="153" text-anchor="middle" font-size="14" fill="#202124">3</text>
  <rect x="345" y="130" width="50" height="36" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="370" y="153" text-anchor="middle" font-size="14" fill="#202124">3</text>
  <rect x="405" y="130" width="50" height="36" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="430" y="153" text-anchor="middle" font-size="14" fill="#202124">3</text>

  <!-- row B -->
  <rect x="105" y="170" width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="130" y="193" text-anchor="middle" font-size="14" fill="#202124">0</text>
  <rect x="165" y="170" width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="190" y="193" text-anchor="middle" font-size="14" fill="#202124">0</text>
  <rect x="225" y="170" width="50" height="36" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="250" y="193" text-anchor="middle" font-size="14" fill="#202124">3</text>
  <rect x="285" y="170" width="50" height="36" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/><text x="310" y="193" text-anchor="middle" font-size="14" fill="#202124">4</text>
  <rect x="345" y="170" width="50" height="36" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/><text x="370" y="193" text-anchor="middle" font-size="14" fill="#202124">4</text>
  <rect x="405" y="170" width="50" height="36" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="430" y="193" text-anchor="middle" font-size="14" fill="#202124">7</text>

  <!-- row C -->
  <rect x="105" y="210" width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="130" y="233" text-anchor="middle" font-size="14" fill="#202124">0</text>
  <rect x="165" y="210" width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="190" y="233" text-anchor="middle" font-size="14" fill="#202124">0</text>
  <rect x="225" y="210" width="50" height="36" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="250" y="233" text-anchor="middle" font-size="14" fill="#202124">3</text>
  <rect x="285" y="210" width="50" height="36" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="310" y="233" text-anchor="middle" font-size="14" fill="#202124">4</text>
  <rect x="345" y="210" width="50" height="36" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="370" y="233" text-anchor="middle" font-size="14" fill="#202124">5</text>
  <rect x="405" y="210" width="50" height="36" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="430" y="233" text-anchor="middle" font-size="14" fill="#202124">7</text>

  <!-- arrow showing choice at B,c=5: take B -> 4 + dp[A][2]=3 = 7 -->
  <path d="M430,168 L260,134" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="345" y="125" text-anchor="middle" font-size="11" fill="#5F6368">take B: 4 + dp[A][2]</text>

  <!-- legend / recurrence -->
  <text x="505" y="92" font-size="12" fill="#9AA0A6">Each cell = max of:</text>
  <rect x="505" y="104" width="18" height="18" rx="4" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="531" y="118" font-size="12" fill="#202124">skip: dp[i-1][c]</text>
  <rect x="505" y="134" width="18" height="18" rx="4" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="531" y="148" font-size="12" fill="#202124">take: v + dp[i-1][c-w]</text>
  <rect x="505" y="164" width="18" height="18" rx="4" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="531" y="178" font-size="12" fill="#202124">answer = 7</text>

  <text x="360" y="276" text-anchor="middle" font-size="12" fill="#202124">Best at capacity 5 = take A + B = value 7</text>
  <text x="360" y="296" text-anchor="middle" font-size="12" fill="#9AA0A6">Iterate capacity high to low to reuse one row (0/1)</text>
</svg>
