<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Edit distance: "SAT" to "CATS"</text>
  <text x="360" y="44" text-anchor="middle" font-size="12" fill="#9AA0A6">dp[i][j] = edits to turn first i of SAT into first j of CATS</text>

  <!-- column headers -->
  <g font-size="13" fill="#202124" text-anchor="middle">
    <text x="120" y="76">""</text>
    <text x="180" y="76">C</text>
    <text x="240" y="76">A</text>
    <text x="300" y="76">T</text>
    <text x="360" y="76">S</text>
  </g>
  <!-- row headers -->
  <g font-size="13" fill="#202124" text-anchor="middle">
    <text x="80" y="116">""</text>
    <text x="80" y="156">S</text>
    <text x="80" y="196">A</text>
    <text x="80" y="236">T</text>
  </g>

  <!-- grid cells: 4 rows x 5 cols, cell 50x36 starting at x=95 y=92 -->
  <!-- helper: each cell rect + value -->
  <!-- row 0 -->
  <rect x="95"  y="92"  width="50" height="36" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="120" y="115" text-anchor="middle" font-size="14" fill="#202124">0</text>
  <rect x="155" y="92"  width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="180" y="115" text-anchor="middle" font-size="14" fill="#202124">1</text>
  <rect x="215" y="92"  width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="240" y="115" text-anchor="middle" font-size="14" fill="#202124">2</text>
  <rect x="275" y="92"  width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="300" y="115" text-anchor="middle" font-size="14" fill="#202124">3</text>
  <rect x="335" y="92"  width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="360" y="115" text-anchor="middle" font-size="14" fill="#202124">4</text>
  <!-- row 1 (S) -->
  <rect x="95"  y="132" width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="120" y="155" text-anchor="middle" font-size="14" fill="#202124">1</text>
  <rect x="155" y="132" width="50" height="36" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/><text x="180" y="155" text-anchor="middle" font-size="14" fill="#202124">1</text>
  <rect x="215" y="132" width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="240" y="155" text-anchor="middle" font-size="14" fill="#202124">2</text>
  <rect x="275" y="132" width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="300" y="155" text-anchor="middle" font-size="14" fill="#202124">3</text>
  <rect x="335" y="132" width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="360" y="155" text-anchor="middle" font-size="14" fill="#202124">3</text>
  <!-- row 2 (A) -->
  <rect x="95"  y="172" width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="120" y="195" text-anchor="middle" font-size="14" fill="#202124">2</text>
  <rect x="155" y="172" width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="180" y="195" text-anchor="middle" font-size="14" fill="#202124">2</text>
  <rect x="215" y="172" width="50" height="36" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="240" y="195" text-anchor="middle" font-size="14" fill="#202124">1</text>
  <rect x="275" y="172" width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="300" y="195" text-anchor="middle" font-size="14" fill="#202124">2</text>
  <rect x="335" y="172" width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="360" y="195" text-anchor="middle" font-size="14" fill="#202124">3</text>
  <!-- row 3 (T) -->
  <rect x="95"  y="212" width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="120" y="235" text-anchor="middle" font-size="14" fill="#202124">3</text>
  <rect x="155" y="212" width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="180" y="235" text-anchor="middle" font-size="14" fill="#202124">3</text>
  <rect x="215" y="212" width="50" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="240" y="235" text-anchor="middle" font-size="14" fill="#202124">2</text>
  <rect x="275" y="212" width="50" height="36" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="300" y="235" text-anchor="middle" font-size="14" fill="#202124">1</text>
  <rect x="335" y="212" width="50" height="36" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="360" y="235" text-anchor="middle" font-size="14" fill="#202124">2</text>

  <!-- traceback arrows along the green/red diagonal -->
  <path d="M352,228 L308,196" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M292,212 L248,180" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M232,172 L188,140" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M172,132 L128,116" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <!-- legend -->
  <rect x="440" y="120" width="18" height="18" rx="4" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="466" y="134" font-size="12" fill="#202124">match: copy diagonal</text>
  <rect x="440" y="150" width="18" height="18" rx="4" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="466" y="164" font-size="12" fill="#202124">answer = 2 edits</text>
  <rect x="440" y="180" width="18" height="18" rx="4" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="466" y="194" font-size="12" fill="#202124">mismatch: 1 + min(3)</text>

  <text x="440" y="240" font-size="12" fill="#9AA0A6">Recurrence:</text>
  <text x="440" y="262" font-size="12" fill="#202124">match: dp[i-1][j-1]</text>
  <text x="440" y="282" font-size="12" fill="#202124">else: 1 + min(left, up, diag)</text>

  <text x="360" y="300" text-anchor="middle" font-size="12" fill="#9AA0A6">Arrows trace one optimal path back to dp[0][0]</text>
</svg>
