<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Place Order Saga</text>

  <!-- Forward path -->
  <rect x="40" y="60" width="150" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="115" y="84" text-anchor="middle" font-size="13" fill="#202124">Order svc</text>
  <text x="115" y="102" text-anchor="middle" font-size="11" fill="#5F6368">create PENDING</text>

  <rect x="285" y="60" width="150" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="84" text-anchor="middle" font-size="13" fill="#202124">Payment svc</text>
  <text x="360" y="102" text-anchor="middle" font-size="11" fill="#5F6368">charge card</text>

  <rect x="530" y="60" width="150" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="605" y="84" text-anchor="middle" font-size="13" fill="#202124">Inventory svc</text>
  <text x="605" y="102" text-anchor="middle" font-size="11" fill="#5F6368">reserve stock</text>

  <line x1="190" y1="88" x2="283" y2="88" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="237" y="80" text-anchor="middle" font-size="11" fill="#5F6368">event</text>
  <line x1="435" y1="88" x2="528" y2="88" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="482" y="80" text-anchor="middle" font-size="11" fill="#5F6368">event</text>

  <!-- own DB each -->
  <rect x="65" y="150" width="100" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="115" y="175" text-anchor="middle" font-size="11" fill="#202124">Order DB</text>
  <rect x="310" y="150" width="100" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="175" text-anchor="middle" font-size="11" fill="#202124">Payment DB</text>
  <rect x="555" y="150" width="100" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="605" y="175" text-anchor="middle" font-size="11" fill="#202124">Inventory DB</text>

  <line x1="115" y1="116" x2="115" y2="148" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="116" x2="360" y2="148" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="605" y1="116" x2="605" y2="148" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- failure -->
  <rect x="530" y="240" width="150" height="48" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="605" y="262" text-anchor="middle" font-size="13" fill="#202124">Out of stock</text>
  <text x="605" y="279" text-anchor="middle" font-size="11" fill="#5F6368">step fails</text>
  <line x1="605" y1="190" x2="605" y2="238" stroke="#EA4335" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- compensation path -->
  <rect x="285" y="320" width="150" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="344" text-anchor="middle" font-size="13" fill="#202124">Payment svc</text>
  <text x="360" y="362" text-anchor="middle" font-size="11" fill="#5F6368">refund card</text>

  <rect x="40" y="320" width="150" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="115" y="344" text-anchor="middle" font-size="13" fill="#202124">Order svc</text>
  <text x="115" y="362" text-anchor="middle" font-size="11" fill="#5F6368">mark CANCELLED</text>

  <line x1="530" y1="290" x2="437" y2="330" stroke="#FBBC04" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="318" text-anchor="middle" font-size="11" fill="#5F6368">compensate</text>
  <line x1="285" y1="348" x2="192" y2="348" stroke="#FBBC04" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="238" y="340" text-anchor="middle" font-size="11" fill="#5F6368">compensate</text>

  <text x="360" y="404" text-anchor="middle" font-size="12" fill="#202124">No 2PC: each step commits locally, failures trigger compensations</text>
</svg>
