<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" font-size="16" font-weight="bold" text-anchor="middle" fill="#202124">Forward proxy — sits in front of clients</text>

  <rect x="40" y="55" width="120" height="56" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="100" y="79" font-size="15" text-anchor="middle" fill="#202124">Client</text>
  <text x="100" y="97" font-size="12" text-anchor="middle" fill="#5F6368">internal user</text>

  <rect x="260" y="55" width="140" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="330" y="79" font-size="15" text-anchor="middle" fill="#202124">Forward proxy</text>
  <text x="330" y="97" font-size="12" text-anchor="middle" fill="#5F6368">hides client</text>

  <rect x="510" y="55" width="140" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="580" y="79" font-size="15" text-anchor="middle" fill="#202124">Internet</text>
  <text x="580" y="97" font-size="12" text-anchor="middle" fill="#5F6368">any website</text>

  <line x1="160" y1="83" x2="260" y2="83" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="83" x2="510" y2="83" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="40" y1="175" x2="680" y2="175" stroke="#DADCE0" stroke-width="1.5" stroke-dasharray="6 4"/>

  <text x="360" y="218" font-size="16" font-weight="bold" text-anchor="middle" fill="#202124">Reverse proxy — sits in front of servers</text>

  <rect x="40" y="245" width="120" height="56" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="100" y="269" font-size="15" text-anchor="middle" fill="#202124">Internet</text>
  <text x="100" y="287" font-size="12" text-anchor="middle" fill="#5F6368">any user</text>

  <rect x="260" y="245" width="140" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="330" y="269" font-size="15" text-anchor="middle" fill="#202124">Reverse proxy</text>
  <text x="330" y="287" font-size="12" text-anchor="middle" fill="#5F6368">hides servers</text>

  <rect x="510" y="245" width="140" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="580" y="269" font-size="15" text-anchor="middle" fill="#202124">Your servers</text>
  <text x="580" y="287" font-size="12" text-anchor="middle" fill="#5F6368">app pool</text>

  <line x1="160" y1="273" x2="260" y2="273" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="273" x2="510" y2="273" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
