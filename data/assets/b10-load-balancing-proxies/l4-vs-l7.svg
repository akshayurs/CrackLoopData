<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="180" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#202124">L4 (Transport)</text>
  <text x="540" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#202124">L7 (Application)</text>
  <line x1="360" y1="20" x2="360" y2="340" stroke="#DADCE0" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- L4 side -->
  <rect x="100" y="55" width="160" height="46" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="180" y="76" font-size="15" text-anchor="middle" fill="#202124">Reads IP + port</text>
  <text x="180" y="93" font-size="12" text-anchor="middle" fill="#5F6368">TCP/UDP only</text>

  <rect x="100" y="130" width="160" height="46" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="180" y="151" font-size="15" text-anchor="middle" fill="#202124">Just forwards</text>
  <text x="180" y="168" font-size="12" text-anchor="middle" fill="#5F6368">packets</text>

  <rect x="100" y="205" width="160" height="46" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="180" y="226" font-size="15" text-anchor="middle" fill="#202124">Very fast</text>
  <text x="180" y="243" font-size="12" text-anchor="middle" fill="#5F6368">low CPU</text>

  <rect x="100" y="280" width="160" height="46" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="180" y="301" font-size="15" text-anchor="middle" fill="#202124">Blind to content</text>
  <text x="180" y="318" font-size="12" text-anchor="middle" fill="#5F6368">no URL/header</text>

  <line x1="180" y1="101" x2="180" y2="130" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="176" x2="180" y2="205" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- L7 side -->
  <rect x="460" y="55" width="160" height="46" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="540" y="76" font-size="15" text-anchor="middle" fill="#202124">Reads HTTP</text>
  <text x="540" y="93" font-size="12" text-anchor="middle" fill="#5F6368">URL, headers, cookie</text>

  <rect x="460" y="130" width="160" height="46" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="540" y="151" font-size="15" text-anchor="middle" fill="#202124">Route by path</text>
  <text x="540" y="168" font-size="12" text-anchor="middle" fill="#5F6368">/api vs /img</text>

  <rect x="460" y="205" width="160" height="46" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="540" y="226" font-size="15" text-anchor="middle" fill="#202124">More CPU</text>
  <text x="540" y="243" font-size="12" text-anchor="middle" fill="#5F6368">parse + TLS</text>

  <rect x="460" y="280" width="160" height="46" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="540" y="301" font-size="15" text-anchor="middle" fill="#202124">Smart features</text>
  <text x="540" y="318" font-size="12" text-anchor="middle" fill="#5F6368">retries, sticky, WAF</text>

  <line x1="540" y1="101" x2="540" y2="130" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="176" x2="540" y2="205" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
