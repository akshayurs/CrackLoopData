<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">TCP congestion window over time</text>

  <!-- Axes -->
  <line x1="70" y1="340" x2="690" y2="340" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="70" y1="340" x2="70" y2="50" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="375" text-anchor="middle" font-size="12" fill="#202124">time (round trips)</text>
  <text x="40" y="190" text-anchor="middle" font-size="12" fill="#202124" transform="rotate(-90 40 190)">cwnd (window size)</text>

  <!-- ssthresh line -->
  <line x1="70" y1="140" x2="690" y2="140" stroke="#FBBC04" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="120" y="132" font-size="11" fill="#202124">ssthresh</text>

  <!-- Slow start: exponential -->
  <path d="M70,330 C110,320 140,200 175,90" fill="none" stroke="#34A853" stroke-width="2.5"/>
  <text x="100" y="80" font-size="11" fill="#34A853">slow start</text>
  <text x="100" y="94" font-size="11" fill="#34A853">(exponential)</text>

  <!-- Loss point 1 -->
  <circle cx="175" cy="90" r="5" fill="#EA4335"/>
  <text x="190" y="80" font-size="11" fill="#EA4335">loss: halve</text>

  <!-- AIMD sawtooth: linear rise then drop -->
  <line x1="175" y1="210" x2="320" y2="100" stroke="#4285F4" stroke-width="2.5"/>
  <circle cx="320" cy="100" r="5" fill="#EA4335"/>
  <line x1="320" y1="155" x2="465" y2="80" stroke="#4285F4" stroke-width="2.5"/>
  <circle cx="465" cy="80" r="5" fill="#EA4335"/>
  <line x1="465" y1="145" x2="610" y2="70" stroke="#4285F4" stroke-width="2.5"/>
  <circle cx="610" cy="70" r="5" fill="#EA4335"/>
  <line x1="610" y1="135" x2="680" y2="100" stroke="#4285F4" stroke-width="2.5"/>

  <text x="380" y="200" font-size="11" fill="#4285F4">congestion avoidance (AIMD: +1 per RTT, halve on loss)</text>
</svg>
