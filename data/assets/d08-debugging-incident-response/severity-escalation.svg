<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="160" y="30" font-size="13" fill="#202124" text-anchor="middle" font-weight="bold">Severity</text>
  <text x="540" y="30" font-size="13" fill="#202124" text-anchor="middle" font-weight="bold">Who responds</text>

  <rect x="40" y="50" width="240" height="50" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="160" y="71" font-size="15" fill="#202124" text-anchor="middle">SEV1 - critical outage</text>
  <text x="160" y="89" font-size="12" fill="#202124" text-anchor="middle">major loss, all users</text>

  <rect x="40" y="120" width="240" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="160" y="141" font-size="15" fill="#202124" text-anchor="middle">SEV2 - serious</text>
  <text x="160" y="159" font-size="12" fill="#202124" text-anchor="middle">key feature down</text>

  <rect x="40" y="190" width="240" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="160" y="211" font-size="15" fill="#202124" text-anchor="middle">SEV3 - minor</text>
  <text x="160" y="229" font-size="12" fill="#202124" text-anchor="middle">limited impact</text>

  <rect x="40" y="260" width="240" height="50" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="160" y="281" font-size="15" fill="#202124" text-anchor="middle">SEV4 - low</text>
  <text x="160" y="299" font-size="12" fill="#202124" text-anchor="middle">cosmetic, no rush</text>

  <rect x="440" y="50" width="240" height="50" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="560" y="71" font-size="14" fill="#202124" text-anchor="middle">IC + leadership + exec</text>
  <text x="560" y="89" font-size="12" fill="#202124" text-anchor="middle">page everyone now</text>

  <rect x="440" y="120" width="240" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="560" y="141" font-size="14" fill="#202124" text-anchor="middle">on-call + IC</text>
  <text x="560" y="159" font-size="12" fill="#202124" text-anchor="middle">page primary</text>

  <rect x="440" y="190" width="240" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="560" y="211" font-size="14" fill="#202124" text-anchor="middle">on-call engineer</text>
  <text x="560" y="229" font-size="12" fill="#202124" text-anchor="middle">handle in hours</text>

  <rect x="440" y="260" width="240" height="50" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="560" y="281" font-size="14" fill="#202124" text-anchor="middle">normal backlog</text>
  <text x="560" y="299" font-size="12" fill="#202124" text-anchor="middle">next sprint</text>

  <line x1="280" y1="75" x2="438" y2="75" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="145" x2="438" y2="145" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="215" x2="438" y2="215" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="285" x2="438" y2="285" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
