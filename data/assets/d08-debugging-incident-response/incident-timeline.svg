<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <line x1="40" y1="170" x2="700" y2="170" stroke="#9AA0A6" stroke-width="1.5"/>

  <rect x="40" y="60" width="140" height="60" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="110" y="86" font-size="15" fill="#202124" text-anchor="middle">Detect</text>
  <text x="110" y="104" font-size="12" fill="#202124" text-anchor="middle">alert fires</text>

  <rect x="220" y="60" width="140" height="60" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="290" y="86" font-size="15" fill="#202124" text-anchor="middle">Mitigate</text>
  <text x="290" y="104" font-size="12" fill="#202124" text-anchor="middle">stop the bleeding</text>

  <rect x="400" y="60" width="140" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="470" y="86" font-size="15" fill="#202124" text-anchor="middle">Resolve</text>
  <text x="470" y="104" font-size="12" fill="#202124" text-anchor="middle">real fix shipped</text>

  <rect x="560" y="60" width="140" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="630" y="86" font-size="15" fill="#202124" text-anchor="middle">Postmortem</text>
  <text x="630" y="104" font-size="12" fill="#202124" text-anchor="middle">learn, prevent</text>

  <line x1="180" y1="90" x2="218" y2="90" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="90" x2="398" y2="90" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="90" x2="558" y2="90" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="110" y1="120" x2="110" y2="170" stroke="#9AA0A6" stroke-width="1"/>
  <line x1="290" y1="120" x2="290" y2="170" stroke="#9AA0A6" stroke-width="1"/>
  <line x1="470" y1="120" x2="470" y2="170" stroke="#9AA0A6" stroke-width="1"/>

  <text x="200" y="190" font-size="11" fill="#5F6368" text-anchor="middle">TTD</text>
  <text x="380" y="190" font-size="11" fill="#5F6368" text-anchor="middle">TTM (time to mitigate)</text>
  <text x="110" y="205" font-size="11" fill="#5F6368" text-anchor="middle">customers hurting</text>
  <text x="290" y="205" font-size="11" fill="#5F6368" text-anchor="middle">impact stops here</text>
