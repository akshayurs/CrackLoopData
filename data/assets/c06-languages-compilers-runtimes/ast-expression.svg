<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="30" font-size="12" fill="#9AA0A6" text-anchor="middle">AST for:  2 + 3 * 4</text>

  <!-- root: + -->
  <rect x="300" y="50" width="120" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="80" font-size="15" fill="#202124" text-anchor="middle">+  (Add)</text>

  <!-- left leaf: 2 -->
  <rect x="120" y="170" width="120" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="180" y="200" font-size="15" fill="#202124" text-anchor="middle">2</text>

  <!-- right: * -->
  <rect x="480" y="170" width="120" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="540" y="200" font-size="15" fill="#202124" text-anchor="middle">*  (Mul)</text>

  <!-- mul children -->
  <rect x="400" y="270" width="120" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="460" y="300" font-size="15" fill="#202124" text-anchor="middle">3</text>

  <rect x="560" y="270" width="120" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="620" y="300" font-size="15" fill="#202124" text-anchor="middle">4</text>

  <!-- edges -->
  <line x1="330" y1="100" x2="200" y2="168" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="100" x2="525" y2="168" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="515" y1="220" x2="475" y2="268" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="565" y1="220" x2="605" y2="268" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
