<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" font-size="15" font-weight="600" fill="#202124" text-anchor="middle">Two-phase commit (2PC)</text>

  <!-- Coordinator -->
  <rect x="285" y="50" width="150" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="74" font-size="15" text-anchor="middle" fill="#202124">Coordinator</text>
  <text x="360" y="94" font-size="12" text-anchor="middle" fill="#202124">drives the vote</text>

  <!-- Participants -->
  <rect x="40" y="190" width="150" height="56" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="115" y="214" font-size="15" text-anchor="middle" fill="#202124">Participant A</text>
  <text x="115" y="234" font-size="12" text-anchor="middle" fill="#202124">votes YES</text>

  <rect x="530" y="190" width="150" height="56" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="605" y="214" font-size="15" text-anchor="middle" fill="#202124">Participant B</text>
  <text x="605" y="234" font-size="12" text-anchor="middle" fill="#202124">votes YES</text>

  <!-- Phase 1 arrows -->
  <text x="55" y="150" font-size="12" fill="#9AA0A6">Phase 1: prepare</text>
  <line x1="320" y1="106" x2="150" y2="188" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="190" y="150" font-size="11" text-anchor="middle" fill="#202124">prepare?</text>
  <line x1="400" y1="106" x2="570" y2="188" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="150" font-size="11" text-anchor="middle" fill="#202124">prepare?</text>

  <!-- Phase 2 commit -->
  <rect x="285" y="330" width="150" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="354" font-size="15" text-anchor="middle" fill="#202124">All YES</text>
  <text x="360" y="374" font-size="12" text-anchor="middle" fill="#202124">commit to all</text>

  <line x1="150" y1="246" x2="320" y2="328" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="296" font-size="11" text-anchor="middle" fill="#202124">YES vote</text>
  <line x1="570" y1="246" x2="400" y2="328" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="525" y="296" font-size="11" text-anchor="middle" fill="#202124">YES vote</text>

  <text x="360" y="406" font-size="12" fill="#9AA0A6" text-anchor="middle">Phase 2: commit (any NO -&gt; abort all)</text>

  <!-- blocking warning -->
  <rect x="500" y="60" width="170" height="40" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="585" y="84" font-size="12" text-anchor="middle" fill="#202124">crash here = blocked</text>
</svg>
