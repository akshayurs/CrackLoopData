<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" font-size="15" font-weight="600" fill="#202124" text-anchor="middle">Raft: election then log replication</text>

  <!-- Phase 1: election -->
  <text x="40" y="62" font-size="12" fill="#9AA0A6">1. Election</text>
  <rect x="40" y="72" width="150" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="115" y="96" font-size="15" text-anchor="middle" fill="#202124">Candidate</text>
  <text x="115" y="116" font-size="12" text-anchor="middle" fill="#202124">timeout fires</text>

  <rect x="285" y="72" width="150" height="56" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="96" font-size="15" text-anchor="middle" fill="#202124">Follower</text>
  <text x="360" y="116" font-size="12" text-anchor="middle" fill="#202124">grants vote</text>

  <rect x="530" y="72" width="150" height="56" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="605" y="96" font-size="15" text-anchor="middle" fill="#202124">Follower</text>
  <text x="605" y="116" font-size="12" text-anchor="middle" fill="#202124">grants vote</text>

  <line x1="190" y1="92" x2="283" y2="92" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="237" y="86" font-size="11" text-anchor="middle" fill="#202124">RequestVote</text>
  <line x1="190" y1="110" x2="528" y2="110" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- becomes leader -->
  <line x1="115" y1="128" x2="115" y2="172" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="178" y="154" font-size="11" text-anchor="middle" fill="#202124">majority -&gt; leader</text>

  <!-- Phase 2: replication -->
  <text x="40" y="208" font-size="12" fill="#9AA0A6">2. Replication</text>
  <rect x="40" y="218" width="150" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="115" y="242" font-size="15" text-anchor="middle" fill="#202124">Leader</text>
  <text x="115" y="262" font-size="12" text-anchor="middle" fill="#202124">appends entry</text>

  <rect x="285" y="218" width="150" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="242" font-size="15" text-anchor="middle" fill="#202124">Follower log</text>
  <text x="360" y="262" font-size="12" text-anchor="middle" fill="#202124">writes entry</text>

  <rect x="530" y="218" width="150" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="605" y="242" font-size="15" text-anchor="middle" fill="#202124">Follower log</text>
  <text x="605" y="262" font-size="12" text-anchor="middle" fill="#202124">writes entry</text>

  <line x1="190" y1="238" x2="283" y2="238" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="237" y="232" font-size="11" text-anchor="middle" fill="#202124">AppendEntries</text>
  <line x1="190" y1="256" x2="528" y2="256" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- commit -->
  <rect x="285" y="320" width="150" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="344" font-size="15" text-anchor="middle" fill="#202124">Committed</text>
  <text x="360" y="364" font-size="12" text-anchor="middle" fill="#202124">majority acked</text>

  <line x1="360" y1="274" x2="360" y2="318" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="300" font-size="11" text-anchor="middle" fill="#202124">acks -&gt; apply</text>
</svg>
