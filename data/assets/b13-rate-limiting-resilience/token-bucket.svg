<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Token bucket: refill steadily, spend per request</text>

  <!-- Refiller -->
  <rect x="40" y="70" width="160" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="120" y="96" text-anchor="middle" font-size="15" fill="#202124">Refiller</text>
  <text x="120" y="116" text-anchor="middle" font-size="12" fill="#5F6368">+r tokens/sec</text>

  <!-- Bucket -->
  <rect x="280" y="60" width="160" height="120" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="92" text-anchor="middle" font-size="15" fill="#202124">Bucket</text>
  <text x="360" y="116" text-anchor="middle" font-size="12" fill="#5F6368">capacity = B</text>
  <text x="360" y="138" text-anchor="middle" font-size="12" fill="#5F6368">(burst size)</text>
  <text x="360" y="162" text-anchor="middle" font-size="12" fill="#5F6368">drops extra tokens</text>

  <!-- Request -->
  <rect x="40" y="240" width="160" height="60" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="120" y="266" text-anchor="middle" font-size="15" fill="#202124">Incoming request</text>
  <text x="120" y="286" text-anchor="middle" font-size="12" fill="#5F6368">needs 1 token</text>

  <!-- Allow -->
  <rect x="520" y="70" width="160" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="600" y="96" text-anchor="middle" font-size="15" fill="#202124">Allow</text>
  <text x="600" y="116" text-anchor="middle" font-size="12" fill="#5F6368">token available</text>

  <!-- Reject -->
  <rect x="520" y="240" width="160" height="60" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="600" y="266" text-anchor="middle" font-size="15" fill="#202124">Reject (429)</text>
  <text x="600" y="286" text-anchor="middle" font-size="12" fill="#5F6368">bucket empty</text>

  <!-- Arrows -->
  <line x1="200" y1="100" x2="278" y2="100" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="270" x2="358" y2="200" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="290" y="240" text-anchor="middle" font-size="11" fill="#5F6368">take token</text>
  <line x1="440" y1="110" x2="518" y2="100" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="92" text-anchor="middle" font-size="11" fill="#5F6368">tokens > 0</text>
  <line x1="420" y1="180" x2="518" y2="265" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="475" y="225" text-anchor="middle" font-size="11" fill="#5F6368">tokens = 0</text>
</svg>
