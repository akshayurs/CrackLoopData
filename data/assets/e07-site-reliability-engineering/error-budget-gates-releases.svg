<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="15" fill="#202124" font-weight="600">Error Budget Gates Releases</text>

  <!-- SLO box -->
  <rect x="40" y="60" width="180" height="64" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="130" y="88" text-anchor="middle" font-size="15" fill="#202124">SLO: 99.9%</text>
  <text x="130" y="108" text-anchor="middle" font-size="12" fill="#202124">Budget = 0.1%</text>

  <!-- Measure -->
  <rect x="270" y="60" width="180" height="64" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="88" text-anchor="middle" font-size="15" fill="#202124">Measure SLIs</text>
  <text x="360" y="108" text-anchor="middle" font-size="12" fill="#202124">over 28 days</text>

  <!-- Budget remaining -->
  <rect x="500" y="60" width="180" height="64" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="590" y="88" text-anchor="middle" font-size="15" fill="#202124">Budget left?</text>
  <text x="590" y="108" text-anchor="middle" font-size="12" fill="#202124">spent vs allowed</text>

  <line x1="220" y1="92" x2="266" y2="92" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="92" x2="496" y2="92" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Two outcomes -->
  <line x1="590" y1="124" x2="590" y2="160" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="590" y1="160" x2="230" y2="160" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="590" y1="160" x2="590" y2="230" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="230" y1="160" x2="230" y2="230" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="226" x2="590" y2="230" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="120" y="230" width="220" height="64" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="230" y="258" text-anchor="middle" font-size="15" fill="#202124">Budget remains</text>
  <text x="230" y="278" text-anchor="middle" font-size="12" fill="#202124">ship features fast</text>

  <rect x="480" y="230" width="220" height="64" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="590" y="258" text-anchor="middle" font-size="15" fill="#202124">Budget exhausted</text>
  <text x="590" y="278" text-anchor="middle" font-size="12" fill="#202124">freeze, fix reliability</text>

  <text x="380" y="152" text-anchor="middle" font-size="11" fill="#5F6368">yes</text>
  <text x="610" y="200" text-anchor="middle" font-size="11" fill="#5F6368">no</text>
</svg>
