<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="15" fill="#202124" font-weight="600">The SRE Feedback Loop</text>

  <rect x="30" y="70" width="120" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="90" y="105" text-anchor="middle" font-size="15" fill="#202124">Monitor</text>

  <rect x="180" y="70" width="120" height="60" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="240" y="105" text-anchor="middle" font-size="15" fill="#202124">Alert</text>

  <rect x="330" y="70" width="120" height="60" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="390" y="105" text-anchor="middle" font-size="15" fill="#202124">Respond</text>

  <rect x="480" y="70" width="120" height="60" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="540" y="98" text-anchor="middle" font-size="15" fill="#202124">Postmortem</text>
  <text x="540" y="116" text-anchor="middle" font-size="12" fill="#202124">blameless</text>

  <rect x="285" y="210" width="150" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="245" text-anchor="middle" font-size="15" fill="#202124">Improve</text>

  <line x1="150" y1="100" x2="176" y2="100" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="100" x2="326" y2="100" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="100" x2="476" y2="100" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="540" y1="130" x2="540" y2="240" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="540" y1="240" x2="439" y2="240" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="285" y1="240" x2="90" y2="240" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="90" y1="240" x2="90" y2="134" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="180" y="232" text-anchor="middle" font-size="11" fill="#5F6368">feeds back</text>
</svg>
