<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="15" fill="#202124" font-weight="600">Reducing Toil Through Automation</text>

  <text x="180" y="62" text-anchor="middle" font-size="12" fill="#5F6368">Before: manual toil</text>
  <text x="540" y="62" text-anchor="middle" font-size="12" fill="#5F6368">After: automated</text>

  <!-- Before column -->
  <rect x="80" y="80" width="200" height="50" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="180" y="110" text-anchor="middle" font-size="14" fill="#202124">Page wakes human</text>

  <rect x="80" y="150" width="200" height="50" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="180" y="180" text-anchor="middle" font-size="14" fill="#202124">Run runbook by hand</text>

  <rect x="80" y="220" width="200" height="50" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="180" y="250" text-anchor="middle" font-size="14" fill="#202124">Repeat next week</text>

  <line x1="180" y1="130" x2="180" y2="146" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="200" x2="180" y2="216" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- transform arrow -->
  <line x1="290" y1="175" x2="436" y2="175" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="363" y="166" text-anchor="middle" font-size="11" fill="#5F6368">codify fix</text>

  <!-- After column -->
  <rect x="440" y="80" width="200" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="540" y="110" text-anchor="middle" font-size="14" fill="#202124">Detect automatically</text>

  <rect x="440" y="150" width="200" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="540" y="180" text-anchor="middle" font-size="14" fill="#202124">Self-heal script runs</text>

  <rect x="440" y="220" width="200" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="540" y="244" text-anchor="middle" font-size="14" fill="#202124">Engineer freed</text>
  <text x="540" y="262" text-anchor="middle" font-size="12" fill="#202124">does project work</text>

  <line x1="540" y1="130" x2="540" y2="146" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="200" x2="540" y2="216" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
