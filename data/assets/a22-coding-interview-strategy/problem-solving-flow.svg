<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#202124" font-weight="600">The repeatable loop for any coding problem</text>

  <!-- Row 1 -->
  <rect x="40" y="56" width="150" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="115" y="80" text-anchor="middle" font-size="15" fill="#202124">1. Clarify</text>
  <text x="115" y="98" text-anchor="middle" font-size="12" fill="#202124">inputs, limits</text>

  <rect x="285" y="56" width="150" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="80" text-anchor="middle" font-size="15" fill="#202124">2. Examples</text>
  <text x="360" y="98" text-anchor="middle" font-size="12" fill="#202124">tiny + edge</text>

  <rect x="530" y="56" width="150" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="605" y="80" text-anchor="middle" font-size="15" fill="#202124">3. Brute force</text>
  <text x="605" y="98" text-anchor="middle" font-size="12" fill="#202124">state O()</text>

  <line x1="190" y1="84" x2="283" y2="84" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="435" y1="84" x2="528" y2="84" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- down connector -->
  <line x1="605" y1="112" x2="605" y2="148" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2 (right to left) -->
  <rect x="530" y="150" width="150" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="605" y="174" text-anchor="middle" font-size="15" fill="#202124">4. Optimize</text>
  <text x="605" y="192" text-anchor="middle" font-size="12" fill="#202124">find the cue</text>

  <rect x="285" y="150" width="150" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="174" text-anchor="middle" font-size="15" fill="#202124">5. Code</text>
  <text x="360" y="192" text-anchor="middle" font-size="12" fill="#202124">narrate it</text>

  <rect x="40" y="150" width="150" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="115" y="174" text-anchor="middle" font-size="15" fill="#202124">6. Test</text>
  <text x="115" y="192" text-anchor="middle" font-size="12" fill="#202124">dry-run edges</text>

  <line x1="528" y1="178" x2="437" y2="178" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="283" y1="178" x2="192" y2="178" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- loop back arrow -->
  <line x1="115" y1="206" x2="115" y2="248" stroke="#EA4335" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="250" width="640" height="44" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="360" y="277" text-anchor="middle" font-size="13" fill="#202124">Bug found? Loop back to Examples or Optimize, never silently fix</text>

  <text x="360" y="328" text-anchor="middle" font-size="13" fill="#202124">Talk through every box out loud. The path matters as much as the answer.</text>
</svg>
