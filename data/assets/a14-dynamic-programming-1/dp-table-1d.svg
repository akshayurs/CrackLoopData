<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="34" font-size="15" fill="#202124" text-anchor="middle">dp[i] = dp[i-1] + dp[i-2]   (climbing stairs)</text>

  <!-- index labels -->
  <text x="80"  y="80" font-size="12" fill="#9AA0A6" text-anchor="middle">i=0</text>
  <text x="170" y="80" font-size="12" fill="#9AA0A6" text-anchor="middle">i=1</text>
  <text x="260" y="80" font-size="12" fill="#9AA0A6" text-anchor="middle">i=2</text>
  <text x="350" y="80" font-size="12" fill="#9AA0A6" text-anchor="middle">i=3</text>
  <text x="440" y="80" font-size="12" fill="#9AA0A6" text-anchor="middle">i=4</text>
  <text x="530" y="80" font-size="12" fill="#9AA0A6" text-anchor="middle">i=5</text>

  <!-- cells: known (green) then computing (blue) then unfilled (neutral) -->
  <rect x="50"  y="92" width="60" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="80"  y="123" font-size="15" fill="#202124" text-anchor="middle">1</text>

  <rect x="140" y="92" width="60" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="170" y="123" font-size="15" fill="#202124" text-anchor="middle">1</text>

  <rect x="230" y="92" width="60" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="260" y="123" font-size="15" fill="#202124" text-anchor="middle">2</text>

  <rect x="320" y="92" width="60" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="350" y="123" font-size="15" fill="#202124" text-anchor="middle">3</text>

  <rect x="410" y="92" width="60" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="440" y="118" font-size="15" fill="#202124" text-anchor="middle">3+2</text>
  <text x="440" y="134" font-size="11" fill="#202124" text-anchor="middle">=5 now</text>

  <rect x="500" y="92" width="60" height="50" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="530" y="123" font-size="15" fill="#9AA0A6" text-anchor="middle">?</text>

  <!-- dependency arrows feeding i=4 -->
  <path d="M 350 142 Q 380 175 440 150" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 260 142 Q 330 200 438 152" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="200" font-size="11" fill="#5F6368" text-anchor="middle">uses two earlier cells</text>

  <!-- direction -->
  <line x1="60" y1="240" x2="540" y2="240" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="262" font-size="12" fill="#202124" text-anchor="middle">fill left to right</text>

  <!-- legend -->
  <rect x="590" y="100" width="16" height="16" rx="3" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="612" y="113" font-size="12" fill="#202124">done</text>
  <rect x="590" y="124" width="16" height="16" rx="3" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="612" y="137" font-size="12" fill="#202124">filling</text>
</svg>
