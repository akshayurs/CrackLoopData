<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Draft -->
  <rect x="30" y="60" width="140" height="50" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="100" y="82" text-anchor="middle" font-size="15" fill="#202124">Draft</text>
  <text x="100" y="100" text-anchor="middle" font-size="12" fill="#202124">author writes</text>

  <!-- Review -->
  <rect x="220" y="60" width="140" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="290" y="82" text-anchor="middle" font-size="15" fill="#202124">In Review</text>
  <text x="290" y="100" text-anchor="middle" font-size="12" fill="#202124">feedback &amp; debate</text>

  <!-- Accepted -->
  <rect x="410" y="60" width="140" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="480" y="82" text-anchor="middle" font-size="15" fill="#202124">Accepted</text>
  <text x="480" y="100" text-anchor="middle" font-size="12" fill="#202124">decision made</text>

  <!-- Implemented -->
  <rect x="600" y="60" width="110" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="655" y="82" text-anchor="middle" font-size="15" fill="#202124">Implemented</text>
  <text x="655" y="100" text-anchor="middle" font-size="12" fill="#202124">shipped</text>

  <!-- Rejected -->
  <rect x="220" y="190" width="140" height="50" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="290" y="212" text-anchor="middle" font-size="15" fill="#202124">Rejected</text>
  <text x="290" y="230" text-anchor="middle" font-size="12" fill="#202124">or withdrawn</text>

  <!-- arrows -->
  <line x1="170" y1="85" x2="218" y2="85" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="85" x2="408" y2="85" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="85" x2="598" y2="85" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- review -> rejected -->
  <line x1="290" y1="110" x2="290" y2="188" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="150" font-size="11" fill="#5F6368">no consensus</text>

  <!-- review loop back (revise) -->
  <path d="M250,60 C230,30 160,30 130,58" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="160" y="28" font-size="11" fill="#5F6368">revise</text>
</svg>
