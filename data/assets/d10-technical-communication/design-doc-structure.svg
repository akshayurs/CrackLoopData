<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Title box -->
  <rect x="250" y="20" width="220" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="40" text-anchor="middle" font-size="15" fill="#202124">Title + Metadata</text>
  <text x="360" y="56" text-anchor="middle" font-size="12" fill="#202124">author, date, status</text>

  <!-- Context -->
  <rect x="250" y="90" width="220" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="110" text-anchor="middle" font-size="15" fill="#202124">Context</text>
  <text x="360" y="126" text-anchor="middle" font-size="12" fill="#202124">problem &amp; background</text>

  <!-- Goals / Non-goals -->
  <rect x="90" y="160" width="250" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="215" y="180" text-anchor="middle" font-size="15" fill="#202124">Goals</text>
  <text x="215" y="196" text-anchor="middle" font-size="12" fill="#202124">what success means</text>

  <rect x="380" y="160" width="250" height="44" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="505" y="180" text-anchor="middle" font-size="15" fill="#202124">Non-Goals</text>
  <text x="505" y="196" text-anchor="middle" font-size="12" fill="#202124">explicitly out of scope</text>

  <!-- Proposed design -->
  <rect x="250" y="230" width="220" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="250" text-anchor="middle" font-size="15" fill="#202124">Proposed Design</text>
  <text x="360" y="266" text-anchor="middle" font-size="12" fill="#202124">the core of the doc</text>

  <!-- Alternatives -->
  <rect x="250" y="300" width="220" height="44" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="320" text-anchor="middle" font-size="15" fill="#202124">Alternatives</text>
  <text x="360" y="336" text-anchor="middle" font-size="12" fill="#202124">what else, why not</text>

  <!-- Risks -->
  <rect x="250" y="370" width="220" height="44" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="390" text-anchor="middle" font-size="15" fill="#202124">Risks</text>
  <text x="360" y="406" text-anchor="middle" font-size="12" fill="#202124">what could go wrong</text>

  <!-- Rollout -->
  <rect x="250" y="430" width="220" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="453" text-anchor="middle" font-size="15" fill="#202124">Rollout &amp; Rollback</text>

  <!-- arrows -->
  <line x1="360" y1="64" x2="360" y2="88" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="134" x2="360" y2="158" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="215" y1="204" x2="320" y2="228" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="505" y1="204" x2="400" y2="228" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="274" x2="360" y2="298" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="344" x2="360" y2="368" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="414" x2="360" y2="428" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
