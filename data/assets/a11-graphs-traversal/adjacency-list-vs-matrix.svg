<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Same graph, two representations (vertices 0,1,2,3)</text>

  <!-- The graph -->
  <text x="120" y="58" text-anchor="middle" font-size="12" fill="#202124" font-weight="bold">Graph (undirected)</text>
  <circle cx="70" cy="100" r="18" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="70" y="105" text-anchor="middle" font-size="13" fill="#202124">0</text>
  <circle cx="170" cy="100" r="18" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="170" y="105" text-anchor="middle" font-size="13" fill="#202124">1</text>
  <circle cx="70" cy="200" r="18" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="70" y="205" text-anchor="middle" font-size="13" fill="#202124">2</text>
  <circle cx="170" cy="200" r="18" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="170" y="205" text-anchor="middle" font-size="13" fill="#202124">3</text>
  <line x1="88" y1="100" x2="152" y2="100" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="70" y1="118" x2="70" y2="182" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="170" y1="118" x2="170" y2="182" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="85" y1="115" x2="155" y2="185" stroke="#5F6368" stroke-width="1.5"/>

  <!-- Adjacency list -->
  <text x="350" y="58" text-anchor="middle" font-size="12" fill="#202124" font-weight="bold">Adjacency list</text>
  <rect x="270" y="74" width="160" height="120" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="285" y="98" font-size="12" fill="#202124">0 -&gt; [1, 2]</text>
  <text x="285" y="124" font-size="12" fill="#202124">1 -&gt; [0, 3]</text>
  <text x="285" y="150" font-size="12" fill="#202124">2 -&gt; [0, 3]</text>
  <text x="285" y="176" font-size="12" fill="#202124">3 -&gt; [1, 2]</text>
  <text x="350" y="216" text-anchor="middle" font-size="11" fill="#202124">Space O(V+E) · good for sparse</text>
  <text x="350" y="232" text-anchor="middle" font-size="11" fill="#202124">List neighbors: O(degree)</text>

  <!-- Adjacency matrix -->
  <text x="585" y="58" text-anchor="middle" font-size="12" fill="#202124" font-weight="bold">Adjacency matrix</text>
  <rect x="505" y="74" width="160" height="120" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="585" y="96" text-anchor="middle" font-size="12" fill="#202124" font-family="monospace">    0 1 2 3</text>
  <text x="585" y="116" text-anchor="middle" font-size="12" fill="#202124" font-family="monospace">0 [ 0 1 1 0 ]</text>
  <text x="585" y="134" text-anchor="middle" font-size="12" fill="#202124" font-family="monospace">1 [ 1 0 0 1 ]</text>
  <text x="585" y="152" text-anchor="middle" font-size="12" fill="#202124" font-family="monospace">2 [ 1 0 0 1 ]</text>
  <text x="585" y="170" text-anchor="middle" font-size="12" fill="#202124" font-family="monospace">3 [ 0 1 1 0 ]</text>
  <text x="585" y="216" text-anchor="middle" font-size="11" fill="#202124">Space O(V²) · good for dense</text>
  <text x="585" y="232" text-anchor="middle" font-size="11" fill="#202124">Edge query u-v: O(1)</text>

  <text x="360" y="320" text-anchor="middle" font-size="12" fill="#202124">List = "who are my neighbors?" cheap. Matrix = "is u joined to v?" cheap.</text>
</svg>
