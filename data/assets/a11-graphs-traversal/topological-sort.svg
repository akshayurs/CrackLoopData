<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Topological sort of a DAG (course prerequisites)</text>

  <!-- DAG nodes -->
  <circle cx="90" cy="120" r="22" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="90" y="125" text-anchor="middle" font-size="13">A</text>
  <circle cx="230" cy="80" r="22" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="230" y="85" text-anchor="middle" font-size="13">B</text>
  <circle cx="230" cy="170" r="22" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="230" y="175" text-anchor="middle" font-size="13">C</text>
  <circle cx="380" cy="120" r="22" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="380" y="125" text-anchor="middle" font-size="13">D</text>
  <circle cx="520" cy="120" r="22" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="520" y="125" text-anchor="middle" font-size="13">E</text>

  <!-- directed edges -->
  <line x1="110" y1="108" x2="210" y2="88" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="110" y1="132" x2="210" y2="162" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="252" y1="90" x2="360" y2="112" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="252" y1="160" x2="360" y2="128" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="402" y1="120" x2="498" y2="120" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="305" y="230" text-anchor="middle" font-size="12" fill="#202124">Edge X → Y means "X must come before Y"</text>

  <!-- result order -->
  <text x="120" y="265" font-size="12" fill="#202124" font-weight="bold">A valid order:</text>
  <rect x="230" y="250" width="40" height="26" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="250" y="268" text-anchor="middle" font-size="13">A</text>
  <rect x="290" y="250" width="40" height="26" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="310" y="268" text-anchor="middle" font-size="13">B</text>
  <rect x="350" y="250" width="40" height="26" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="370" y="268" text-anchor="middle" font-size="13">C</text>
  <rect x="410" y="250" width="40" height="26" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="430" y="268" text-anchor="middle" font-size="13">D</text>
  <rect x="470" y="250" width="40" height="26" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="490" y="268" text-anchor="middle" font-size="13">E</text>
  <line x1="270" y1="263" x2="290" y2="263" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="263" x2="350" y2="263" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="263" x2="410" y2="263" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="263" x2="470" y2="263" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="360" y="305" text-anchor="middle" font-size="11" fill="#202124">Every arrow points left-to-right. (B before C, or C before B — both fine.)</text>
</svg>
