<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- LEFT: choreography -->
  <text x="180" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Choreography</text>
  <text x="180" y="46" text-anchor="middle" font-size="11" fill="#5F6368">services react to each other's events</text>

  <rect x="60" y="70" width="120" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="120" y="97" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Order</text>

  <rect x="180" y="160" width="120" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="240" y="187" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Payment</text>

  <rect x="60" y="250" width="120" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="120" y="277" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Inventory</text>

  <rect x="60" y="330" width="120" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="120" y="357" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Shipping</text>

  <line x1="155" y1="114" x2="215" y2="160" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="138" text-anchor="middle" font-size="10" fill="#5F6368">OrderPlaced</text>
  <line x1="215" y1="204" x2="150" y2="250" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="215" y="232" text-anchor="middle" font-size="10" fill="#5F6368">Paid</text>
  <line x1="120" y1="294" x2="120" y2="330" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="155" y="316" text-anchor="middle" font-size="10" fill="#5F6368">Reserved</text>

  <!-- divider -->
  <line x1="360" y1="40" x2="360" y2="380" stroke="#9AA0A6" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- RIGHT: orchestration -->
  <text x="540" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Orchestration</text>
  <text x="540" y="46" text-anchor="middle" font-size="11" fill="#5F6368">one coordinator drives the steps</text>

  <rect x="470" y="70" width="140" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="540" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Orchestrator</text>
  <text x="540" y="110" text-anchor="middle" font-size="11" fill="#5F6368">owns the flow</text>

  <rect x="410" y="200" width="120" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="470" y="227" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Payment</text>

  <rect x="550" y="200" width="120" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="610" y="227" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Inventory</text>

  <rect x="480" y="300" width="120" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="540" y="327" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Shipping</text>

  <line x1="500" y1="120" x2="470" y2="200" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="120" x2="610" y2="200" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="120" x2="540" y2="300" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="170" text-anchor="middle" font-size="10" fill="#5F6368">command + reply</text>

  <text x="180" y="392" text-anchor="middle" font-size="10" fill="#5F6368">No central brain · harder to trace</text>
  <text x="540" y="392" text-anchor="middle" font-size="10" fill="#5F6368">Central brain · easy to see flow</text>
</svg>
