<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Two pointers converging from both ends</text>
  <text x="360" y="52" text-anchor="middle" font-size="12" fill="#5F6368">Sorted array, target sum = 12</text>

  <!-- Array cells -->
  <rect x="60"  y="110" width="80" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="100" y="146" text-anchor="middle" font-size="18" fill="#202124">2</text>

  <rect x="160" y="110" width="80" height="60" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="200" y="146" text-anchor="middle" font-size="18" fill="#202124">4</text>

  <rect x="260" y="110" width="80" height="60" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="300" y="146" text-anchor="middle" font-size="18" fill="#202124">5</text>

  <rect x="360" y="110" width="80" height="60" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="400" y="146" text-anchor="middle" font-size="18" fill="#202124">7</text>

  <rect x="460" y="110" width="80" height="60" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="500" y="146" text-anchor="middle" font-size="18" fill="#202124">9</text>

  <rect x="560" y="110" width="80" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="600" y="146" text-anchor="middle" font-size="18" fill="#202124">11</text>

  <!-- left pointer -->
  <text x="100" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#4285F4">left</text>
  <line x1="100" y1="225" x2="100" y2="180" stroke="#4285F4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="240" x2="220" y2="240" stroke="#4285F4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="170" y="234" text-anchor="middle" font-size="11" fill="#4285F4">sum too small, move right</text>

  <!-- right pointer -->
  <text x="600" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#34A853">right</text>
  <line x1="600" y1="225" x2="600" y2="180" stroke="#34A853" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="266" x2="480" y2="266" stroke="#34A853" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="282" text-anchor="middle" font-size="11" fill="#34A853">sum too big, move left</text>
</svg>
