<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Variable window: expand right, shrink left</text>
  <text x="360" y="48" text-anchor="middle" font-size="12" fill="#5F6368">Longest substring with no repeat char: "a b c a"</text>

  <!-- Row 1: expand -->
  <text x="40" y="92" font-size="13" font-weight="600" fill="#4285F4">1. Expand</text>
  <rect x="150" y="70" width="70" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="185" y="101" text-anchor="middle" font-size="18" fill="#202124">a</text>
  <rect x="230" y="70" width="70" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="265" y="101" text-anchor="middle" font-size="18" fill="#202124">b</text>
  <rect x="310" y="70" width="70" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="345" y="101" text-anchor="middle" font-size="18" fill="#202124">c</text>
  <rect x="390" y="70" width="70" height="50" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="425" y="101" text-anchor="middle" font-size="18" fill="#202124">a</text>
  <text x="490" y="101" font-size="12" fill="#5F6368">window "abc" is valid</text>

  <!-- Row 2: violation -->
  <text x="40" y="184" font-size="13" font-weight="600" fill="#EA4335">2. Add 'a'</text>
  <rect x="150" y="162" width="70" height="50" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="185" y="193" text-anchor="middle" font-size="18" fill="#202124">a</text>
  <rect x="230" y="162" width="70" height="50" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="265" y="193" text-anchor="middle" font-size="18" fill="#202124">b</text>
  <rect x="310" y="162" width="70" height="50" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="345" y="193" text-anchor="middle" font-size="18" fill="#202124">c</text>
  <rect x="390" y="162" width="70" height="50" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="425" y="193" text-anchor="middle" font-size="18" fill="#202124">a</text>
  <text x="490" y="193" font-size="12" fill="#EA4335">'a' repeats: invalid</text>

  <!-- Row 3: shrink -->
  <text x="40" y="276" font-size="13" font-weight="600" fill="#FBBC04">3. Shrink</text>
  <rect x="150" y="254" width="70" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="185" y="285" text-anchor="middle" font-size="18" fill="#202124">a</text>
  <rect x="230" y="254" width="70" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="265" y="285" text-anchor="middle" font-size="18" fill="#202124">b</text>
  <rect x="310" y="254" width="70" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="345" y="285" text-anchor="middle" font-size="18" fill="#202124">c</text>
  <rect x="390" y="254" width="70" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="425" y="285" text-anchor="middle" font-size="18" fill="#202124">a</text>
  <text x="490" y="285" font-size="12" fill="#5F6368">drop left 'a', valid again</text>

  <!-- left/right markers -->
  <line x1="185" y1="330" x2="185" y2="312" stroke="#FBBC04" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="185" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#FBBC04">left moves right</text>
  <line x1="425" y1="330" x2="425" y2="312" stroke="#34A853" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="425" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#34A853">right</text>

  <text x="360" y="396" text-anchor="middle" font-size="12" fill="#5F6368">right always advances; left only catches up to fix the invariant</text>
</svg>
