<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="600" fill="#202124">Step 1 — Sort intervals by start</text>

  <!-- sorted bars -->
  <rect x="60" y="44" width="120" height="26" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="120" y="62" font-size="12" fill="#202124" text-anchor="middle">[1, 3]</text>

  <rect x="150" y="80" width="110" height="26" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="205" y="98" font-size="12" fill="#202124" text-anchor="middle">[2, 6]</text>

  <rect x="360" y="44" width="90" height="26" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="405" y="62" font-size="12" fill="#202124" text-anchor="middle">[8, 10]</text>

  <rect x="430" y="80" width="110" height="26" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="485" y="98" font-size="12" fill="#202124" text-anchor="middle">[9, 12]</text>

  <line x1="20" y1="130" x2="700" y2="130" stroke="#9AA0A6" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="20" y="160" font-size="15" font-weight="600" fill="#202124">Step 2 — Sweep left to right, merge if overlap</text>

  <!-- decision boxes -->
  <rect x="40" y="180" width="180" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="130" y="201" font-size="13" font-weight="600" fill="#202124" text-anchor="middle">[1,3] vs [2,6]</text>
  <text x="130" y="219" font-size="11" fill="#202124" text-anchor="middle">2 ≤ 3 → overlap</text>

  <rect x="270" y="180" width="180" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="201" font-size="13" font-weight="600" fill="#202124" text-anchor="middle">merge → [1,6]</text>
  <text x="360" y="219" font-size="11" fill="#202124" text-anchor="middle">end = max(3,6)</text>

  <rect x="500" y="180" width="180" height="50" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="590" y="201" font-size="13" font-weight="600" fill="#202124" text-anchor="middle">[1,6] vs [8,10]</text>
  <text x="590" y="219" font-size="11" fill="#202124" text-anchor="middle">8 &gt; 6 → gap, keep</text>

  <line x1="220" y1="205" x2="266" y2="205" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="205" x2="496" y2="205" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="20" y1="262" x2="700" y2="262" stroke="#9AA0A6" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="20" y="292" font-size="15" font-weight="600" fill="#202124">Result — non-overlapping intervals</text>

  <rect x="60" y="308" width="200" height="30" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="160" y="328" font-size="13" fill="#202124" text-anchor="middle">[1, 6]</text>

  <rect x="300" y="308" width="120" height="30" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="328" font-size="13" fill="#202124" text-anchor="middle">[8, 10]</text>

  <rect x="460" y="308" width="160" height="30" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="540" y="328" font-size="13" fill="#202124" text-anchor="middle">[9, 12]</text>
</svg>
