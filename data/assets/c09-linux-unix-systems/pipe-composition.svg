<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <rect x="20" y="70" width="140" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="90" y="95" font-size="15" fill="#202124" text-anchor="middle">cat access.log</text>
  <text x="90" y="115" font-size="12" fill="#5F6368" text-anchor="middle">emit lines</text>

  <rect x="200" y="70" width="140" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="270" y="95" font-size="15" fill="#202124" text-anchor="middle">grep 500</text>
  <text x="270" y="115" font-size="12" fill="#5F6368" text-anchor="middle">filter rows</text>

  <rect x="380" y="70" width="140" height="60" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="450" y="95" font-size="15" fill="#202124" text-anchor="middle">awk '{print $7}'</text>
  <text x="450" y="115" font-size="12" fill="#5F6368" text-anchor="middle">pick column</text>

  <rect x="560" y="70" width="140" height="60" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="630" y="95" font-size="15" fill="#202124" text-anchor="middle">sort | uniq -c</text>
  <text x="630" y="115" font-size="12" fill="#5F6368" text-anchor="middle">count</text>

  <line x1="160" y1="100" x2="198" y2="100" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="179" y="92" font-size="11" fill="#5F6368" text-anchor="middle">|</text>
  <line x1="340" y1="100" x2="378" y2="100" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="359" y="92" font-size="11" fill="#5F6368" text-anchor="middle">|</text>
  <line x1="520" y1="100" x2="558" y2="100" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="539" y="92" font-size="11" fill="#5F6368" text-anchor="middle">|</text>

  <text x="360" y="30" font-size="15" fill="#202124" text-anchor="middle" font-weight="bold">stdout of each feeds stdin of the next</text>
  <text x="360" y="170" font-size="12" fill="#5F6368" text-anchor="middle">Small tools, each does one thing, joined by pipes</text>
</svg>
