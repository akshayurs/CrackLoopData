<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <rect x="290" y="20" width="140" height="56" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="44" font-size="15" fill="#202124" text-anchor="middle">init / systemd</text>
  <text x="360" y="63" font-size="12" fill="#5F6368" text-anchor="middle">PID 1</text>

  <rect x="200" y="140" width="140" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="270" y="164" font-size="15" fill="#202124" text-anchor="middle">bash (shell)</text>
  <text x="270" y="183" font-size="12" fill="#5F6368" text-anchor="middle">PID 4012</text>

  <rect x="400" y="140" width="140" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="470" y="164" font-size="15" fill="#202124" text-anchor="middle">nginx master</text>
  <text x="470" y="183" font-size="12" fill="#5F6368" text-anchor="middle">PID 800</text>

  <rect x="120" y="270" width="140" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="190" y="294" font-size="15" fill="#202124" text-anchor="middle">python app</text>
  <text x="190" y="313" font-size="12" fill="#5F6368" text-anchor="middle">PID 4099</text>

  <rect x="400" y="270" width="140" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="470" y="294" font-size="15" fill="#202124" text-anchor="middle">nginx worker</text>
  <text x="470" y="313" font-size="12" fill="#5F6368" text-anchor="middle">PID 801</text>

  <line x1="330" y1="76" x2="280" y2="138" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="76" x2="460" y2="138" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="255" y1="196" x2="200" y2="268" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="196" x2="470" y2="268" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="580" y="270" width="120" height="56" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="640" y="294" font-size="15" fill="#202124" text-anchor="middle">SIGTERM</text>
  <text x="640" y="313" font-size="12" fill="#5F6368" text-anchor="middle">graceful stop</text>
  <line x1="578" y1="298" x2="542" y2="298" stroke="#EA4335" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="360" y="350" font-size="12" fill="#5F6368" text-anchor="middle">fork creates children; signals (kill PID) are delivered to a process by the kernel</text>
</svg>
