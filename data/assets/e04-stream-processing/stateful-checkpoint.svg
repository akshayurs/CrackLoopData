<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- source -->
  <rect x="20" y="120" width="130" height="60" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="85" y="148" font-size="15" fill="#202124" text-anchor="middle">Source</text>
  <text x="85" y="166" font-size="12" fill="#202124" text-anchor="middle">Kafka topic</text>

  <!-- operator -->
  <rect x="250" y="110" width="170" height="80" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="335" y="140" font-size="15" fill="#202124" text-anchor="middle">Stateful op</text>
  <text x="335" y="160" font-size="12" fill="#202124" text-anchor="middle">running count</text>
  <text x="335" y="177" font-size="11" fill="#9AA0A6" text-anchor="middle">offset + state</text>

  <!-- sink -->
  <rect x="540" y="120" width="150" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="615" y="148" font-size="15" fill="#202124" text-anchor="middle">Sink</text>
  <text x="615" y="166" font-size="12" fill="#202124" text-anchor="middle">idempotent</text>

  <line x1="150" y1="150" x2="248" y2="150" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="150" x2="538" y2="150" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- checkpoint store -->
  <rect x="250" y="250" width="170" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="335" y="272" font-size="14" fill="#202124" text-anchor="middle">Checkpoint</text>
  <text x="335" y="289" font-size="11" fill="#202124" text-anchor="middle">durable snapshot</text>
  <line x1="335" y1="190" x2="335" y2="248" stroke="#FBBC04" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="350" y="225" font-size="11" fill="#9AA0A6">snapshot</text>

  <!-- restore arrow -->
  <path d="M250 275 Q150 275 150 182" fill="none" stroke="#FBBC04" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="120" y="240" font-size="11" fill="#9AA0A6">restore</text>
</svg>
