<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" fill="#202124" font-weight="bold">Union-Find: path compression flattens the tree</text>

  <text x="150" y="58" font-size="13" fill="#9AA0A6" text-anchor="middle" font-weight="bold">Before: tall chain</text>
  <text x="540" y="58" font-size="13" fill="#9AA0A6" text-anchor="middle" font-weight="bold">After find(D): flat</text>

  <!-- BEFORE: chain A<-B<-C<-D -->
  <circle cx="150" cy="100" r="26" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="150" y="105" font-size="15" fill="#202124" text-anchor="middle">A</text>
  <circle cx="150" cy="170" r="26" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="150" y="175" font-size="15" fill="#202124" text-anchor="middle">B</text>
  <circle cx="150" cy="240" r="26" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="150" y="245" font-size="15" fill="#202124" text-anchor="middle">C</text>
  <circle cx="150" cy="310" r="26" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="150" y="315" font-size="15" fill="#202124" text-anchor="middle">D</text>
  <line x1="150" y1="184" x2="150" y2="126" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="254" x2="150" y2="196" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="324" x2="150" y2="266" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="195" y="105" font-size="11" fill="#9AA0A6">root</text>

  <!-- divider -->
  <line x1="360" y1="70" x2="360" y2="330" stroke="#9AA0A6" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- AFTER: A root, B C D all point to A -->
  <circle cx="540" cy="100" r="26" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="540" y="105" font-size="15" fill="#202124" text-anchor="middle">A</text>
  <circle cx="440" cy="270" r="26" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="440" y="275" font-size="15" fill="#202124" text-anchor="middle">B</text>
  <circle cx="540" cy="270" r="26" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="540" y="275" font-size="15" fill="#202124" text-anchor="middle">C</text>
  <circle cx="640" cy="270" r="26" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="640" y="275" font-size="15" fill="#202124" text-anchor="middle">D</text>
  <line x1="452" y1="252" x2="522" y2="120" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="244" x2="540" y2="130" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="628" y1="252" x2="558" y2="120" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="585" y="105" font-size="11" fill="#9AA0A6">root</text>
</svg>
