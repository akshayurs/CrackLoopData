<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="20" y="28" font-size="15" fill="#202124" font-weight="bold">Minimum spanning tree (green = chosen edges)</text>
  <text x="20" y="48" font-size="12" fill="#9AA0A6">5 nodes, 4 tree edges, total weight = 1+2+2+3 = 8</text>

  <!-- edges: draw lines first so nodes sit on top -->
  <!-- A-B 2 (in MST) -->
  <line x1="140" y1="120" x2="320" y2="90" stroke="#34A853" stroke-width="3"/>
  <text x="225" y="95" font-size="12" fill="#34A853" font-weight="bold">2</text>
  <!-- A-C 3 (in MST) -->
  <line x1="140" y1="120" x2="300" y2="250" stroke="#34A853" stroke-width="3"/>
  <text x="205" y="200" font-size="12" fill="#34A853" font-weight="bold">3</text>
  <!-- B-C 6 (not in MST) -->
  <line x1="320" y1="90" x2="300" y2="250" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="330" y="180" font-size="12" fill="#9AA0A6">6</text>
  <!-- B-D 1 (in MST) -->
  <line x1="320" y1="90" x2="500" y2="120" stroke="#34A853" stroke-width="3"/>
  <text x="410" y="95" font-size="12" fill="#34A853" font-weight="bold">1</text>
  <!-- D-E 2 (in MST) -->
  <line x1="500" y1="120" x2="560" y2="250" stroke="#34A853" stroke-width="3"/>
  <text x="545" y="195" font-size="12" fill="#34A853" font-weight="bold">2</text>
  <!-- C-E 7 (not in MST) -->
  <line x1="300" y1="250" x2="560" y2="250" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="425" y="270" font-size="12" fill="#9AA0A6">7</text>

  <!-- nodes -->
  <circle cx="140" cy="120" r="28" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="140" y="125" font-size="15" fill="#202124" text-anchor="middle">A</text>
  <circle cx="320" cy="90" r="28" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="320" y="95" font-size="15" fill="#202124" text-anchor="middle">B</text>
  <circle cx="300" cy="250" r="28" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="300" y="255" font-size="15" fill="#202124" text-anchor="middle">C</text>
  <circle cx="500" cy="120" r="28" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="500" y="125" font-size="15" fill="#202124" text-anchor="middle">D</text>
  <circle cx="560" cy="250" r="28" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="560" y="255" font-size="15" fill="#202124" text-anchor="middle">E</text>
</svg>
