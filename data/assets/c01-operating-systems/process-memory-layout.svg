<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Process Virtual Memory Layout</text>
  <text x="245" y="52" text-anchor="middle" font-size="12" fill="#9AA0A6">low addresses (0x0)</text>
  <text x="245" y="400" text-anchor="middle" font-size="12" fill="#9AA0A6">high addresses</text>

  <!-- Text -->
  <rect x="160" y="60" width="170" height="46" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="245" y="82" text-anchor="middle" font-size="15" fill="#202124">Text (code)</text>
  <text x="245" y="99" text-anchor="middle" font-size="12" fill="#9AA0A6">machine instructions</text>

  <!-- Data -->
  <rect x="160" y="116" width="170" height="46" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="245" y="138" text-anchor="middle" font-size="15" fill="#202124">Data + BSS</text>
  <text x="245" y="155" text-anchor="middle" font-size="12" fill="#9AA0A6">globals / statics</text>

  <!-- Heap -->
  <rect x="160" y="172" width="170" height="60" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="245" y="196" text-anchor="middle" font-size="15" fill="#202124">Heap</text>
  <text x="245" y="213" text-anchor="middle" font-size="12" fill="#9AA0A6">malloc / new</text>

  <!-- grows arrows -->
  <line x1="350" y1="178" x2="350" y2="232" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="208" font-size="11" fill="#5F6368">grows up</text>

  <!-- gap -->
  <rect x="160" y="242" width="170" height="60" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="245" y="276" text-anchor="middle" font-size="13" fill="#9AA0A6">free gap</text>

  <line x1="350" y1="296" x2="350" y2="318" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="316" font-size="11" fill="#5F6368">grows down</text>

  <!-- Stack -->
  <rect x="160" y="312" width="170" height="60" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="245" y="336" text-anchor="middle" font-size="15" fill="#202124">Stack</text>
  <text x="245" y="353" text-anchor="middle" font-size="12" fill="#9AA0A6">call frames / locals</text>

  <!-- side notes -->
  <text x="470" y="86" font-size="12" fill="#202124">read-only, shared</text>
  <text x="470" y="142" font-size="12" fill="#202124">fixed at load time</text>
  <text x="470" y="205" font-size="12" fill="#202124">dynamic, you free it</text>
  <text x="470" y="345" font-size="12" fill="#202124">auto freed on return</text>
</svg>
