<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Process State Machine</text>

  <!-- New -->
  <rect x="40" y="140" width="120" height="50" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="100" y="170" text-anchor="middle" font-size="15" fill="#202124">New</text>

  <!-- Ready -->
  <rect x="250" y="140" width="120" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="310" y="170" text-anchor="middle" font-size="15" fill="#202124">Ready</text>

  <!-- Running -->
  <rect x="460" y="60" width="120" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="520" y="90" text-anchor="middle" font-size="15" fill="#202124">Running</text>

  <!-- Waiting -->
  <rect x="460" y="220" width="120" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="520" y="250" text-anchor="middle" font-size="15" fill="#202124">Waiting</text>

  <!-- Terminated -->
  <rect x="600" y="140" width="100" height="50" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="650" y="165" text-anchor="middle" font-size="14" fill="#202124">Terminated</text>

  <!-- New -> Ready -->
  <line x1="160" y1="165" x2="248" y2="165" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="170" y="157" font-size="11" fill="#5F6368">admitted</text>

  <!-- Ready -> Running -->
  <line x1="370" y1="155" x2="458" y2="95" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="115" font-size="11" fill="#5F6368">dispatch</text>

  <!-- Running -> Ready (preempt) -->
  <line x1="458" y1="105" x2="372" y2="160" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="138" font-size="11" fill="#5F6368">preempt</text>

  <!-- Running -> Waiting -->
  <line x1="520" y1="110" x2="520" y2="218" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="528" y="168" font-size="11" fill="#5F6368">I/O wait</text>

  <!-- Waiting -> Ready -->
  <line x1="460" y1="240" x2="372" y2="185" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="225" font-size="11" fill="#5F6368">I/O done</text>

  <!-- Running -> Terminated -->
  <line x1="580" y1="100" x2="640" y2="138" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="120" font-size="11" fill="#5F6368">exit</text>

  <text x="360" y="315" text-anchor="middle" font-size="12" fill="#9AA0A6">Only one process per CPU core is Running at a time; the rest sit in Ready or Waiting.</text>
</svg>
