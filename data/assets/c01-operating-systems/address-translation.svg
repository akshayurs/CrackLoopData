<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Virtual to Physical Address Translation</text>

  <!-- Virtual address -->
  <rect x="30" y="60" width="150" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="105" y="84" text-anchor="middle" font-size="15" fill="#202124">Virtual addr</text>
  <text x="105" y="102" text-anchor="middle" font-size="12" fill="#9AA0A6">page # + offset</text>

  <!-- TLB -->
  <rect x="250" y="60" width="150" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="325" y="84" text-anchor="middle" font-size="15" fill="#202124">TLB</text>
  <text x="325" y="102" text-anchor="middle" font-size="12" fill="#9AA0A6">cache of mappings</text>

  <!-- Page table -->
  <rect x="250" y="190" width="150" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="325" y="214" text-anchor="middle" font-size="15" fill="#202124">Page table</text>
  <text x="325" y="232" text-anchor="middle" font-size="12" fill="#9AA0A6">in RAM</text>

  <!-- Physical -->
  <rect x="500" y="60" width="170" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="585" y="84" text-anchor="middle" font-size="15" fill="#202124">Physical addr</text>
  <text x="585" y="102" text-anchor="middle" font-size="12" fill="#9AA0A6">frame # + offset</text>

  <!-- Page fault -->
  <rect x="500" y="190" width="170" height="56" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="585" y="214" text-anchor="middle" font-size="15" fill="#202124">Page fault</text>
  <text x="585" y="232" text-anchor="middle" font-size="12" fill="#9AA0A6">load from disk</text>

  <!-- arrows -->
  <line x1="180" y1="88" x2="248" y2="88" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="80" x2="498" y2="80" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="412" y="72" font-size="11" fill="#34A853">hit</text>

  <line x1="325" y1="116" x2="325" y2="188" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="335" y="156" font-size="11" fill="#EA4335">miss</text>

  <line x1="400" y1="210" x2="498" y2="210" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="408" y="202" font-size="11" fill="#EA4335">not present</text>

  <line x1="400" y1="225" x2="470" y2="105" stroke="#5F6368" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="430" y="170" font-size="11" fill="#5F6368">present</text>

  <text x="105" y="300" font-size="12" fill="#202124">CPU emits virtual address every load/store.</text>
  <text x="105" y="320" font-size="12" fill="#202124">TLB hit is ~1 cycle; a page fault costs millions of cycles.</text>
</svg>
