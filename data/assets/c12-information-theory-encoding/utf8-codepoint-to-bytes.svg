<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">UTF-8: code point U+20AC (€) to 3 bytes</text>

  <!-- char -->
  <rect x="40" y="60" width="140" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="110" y="86" text-anchor="middle" font-size="15" fill="#202124">Character €</text>
  <text x="110" y="106" text-anchor="middle" font-size="12" fill="#202124">U+20AC</text>

  <!-- bits -->
  <rect x="280" y="60" width="200" height="60" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="380" y="86" text-anchor="middle" font-size="15" fill="#202124">Binary value</text>
  <text x="380" y="106" text-anchor="middle" font-size="12" fill="#202124">0010 0000 1010 1100</text>

  <line x1="180" y1="90" x2="278" y2="90" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- range chooser -->
  <rect x="540" y="60" width="150" height="60" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="615" y="86" text-anchor="middle" font-size="15" fill="#202124">In range</text>
  <text x="615" y="106" text-anchor="middle" font-size="12" fill="#202124">=&gt; 3-byte form</text>

  <line x1="480" y1="90" x2="538" y2="90" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- bytes -->
  <text x="360" y="175" text-anchor="middle" font-size="13" fill="#202124">Spread bits into a 3-byte template</text>

  <rect x="80" y="200" width="170" height="80" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="165" y="228" text-anchor="middle" font-size="15" fill="#202124">Byte 1 (lead)</text>
  <text x="165" y="250" text-anchor="middle" font-size="12" fill="#202124">1110 0010</text>
  <text x="165" y="268" text-anchor="middle" font-size="11" fill="#202124">prefix 1110</text>

  <rect x="275" y="200" width="170" height="80" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="228" text-anchor="middle" font-size="15" fill="#202124">Byte 2 (cont.)</text>
  <text x="360" y="250" text-anchor="middle" font-size="12" fill="#202124">1000 0010</text>
  <text x="360" y="268" text-anchor="middle" font-size="11" fill="#202124">prefix 10</text>

  <rect x="470" y="200" width="170" height="80" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="555" y="228" text-anchor="middle" font-size="15" fill="#202124">Byte 3 (cont.)</text>
  <text x="555" y="250" text-anchor="middle" font-size="12" fill="#202124">1010 1100</text>
  <text x="555" y="268" text-anchor="middle" font-size="11" fill="#202124">prefix 10</text>

  <line x1="380" y1="120" x2="200" y2="198" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="120" x2="360" y2="198" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="120" x2="540" y2="198" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="360" y="320" text-anchor="middle" font-size="12" fill="#202124">Lead byte says "3 bytes"; each 10xx byte is clearly a continuation</text>
</svg>
