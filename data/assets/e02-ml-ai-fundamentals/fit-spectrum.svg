<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <!-- Underfit -->
  <rect x="20" y="20" width="200" height="180" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="120" y="44" text-anchor="middle" font-size="15" fill="#202124">Underfit</text>
  <text x="120" y="62" text-anchor="middle" font-size="12" fill="#202124">too simple</text>
  <!-- scatter -->
  <circle cx="60" cy="160" r="3" fill="#202124"/>
  <circle cx="90" cy="130" r="3" fill="#202124"/>
  <circle cx="120" cy="150" r="3" fill="#202124"/>
  <circle cx="150" cy="110" r="3" fill="#202124"/>
  <circle cx="180" cy="120" r="3" fill="#202124"/>
  <line x1="50" y1="150" x2="190" y2="120" stroke="#EA4335" stroke-width="2"/>

  <!-- Good fit -->
  <rect x="260" y="20" width="200" height="180" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="44" text-anchor="middle" font-size="15" fill="#202124">Good fit</text>
  <text x="360" y="62" text-anchor="middle" font-size="12" fill="#202124">generalizes</text>
  <circle cx="300" cy="160" r="3" fill="#202124"/>
  <circle cx="330" cy="135" r="3" fill="#202124"/>
  <circle cx="360" cy="145" r="3" fill="#202124"/>
  <circle cx="390" cy="115" r="3" fill="#202124"/>
  <circle cx="420" cy="120" r="3" fill="#202124"/>
  <path d="M295,158 Q360,120 425,118" fill="none" stroke="#34A853" stroke-width="2"/>

  <!-- Overfit -->
  <rect x="500" y="20" width="200" height="180" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="600" y="44" text-anchor="middle" font-size="15" fill="#202124">Overfit</text>
  <text x="600" y="62" text-anchor="middle" font-size="12" fill="#202124">memorizes noise</text>
  <circle cx="540" cy="160" r="3" fill="#202124"/>
  <circle cx="570" cy="135" r="3" fill="#202124"/>
  <circle cx="600" cy="145" r="3" fill="#202124"/>
  <circle cx="630" cy="115" r="3" fill="#202124"/>
  <circle cx="660" cy="120" r="3" fill="#202124"/>
  <path d="M538,162 Q555,120 570,135 Q585,150 600,145 Q615,140 630,113 Q645,100 662,121" fill="none" stroke="#FBBC04" stroke-width="2"/>

  <text x="360" y="235" text-anchor="middle" font-size="12" fill="#5F6368">high bias  &#8592;----------  sweet spot  ----------&#8594;  high variance</text>
</svg>
