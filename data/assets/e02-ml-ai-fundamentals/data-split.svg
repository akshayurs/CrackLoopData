<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="680" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="45" text-anchor="middle" font-size="15" fill="#202124">All labeled data (100%)</text>

  <!-- Train 60 -->
  <rect x="20" y="100" width="408" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="224" y="122" text-anchor="middle" font-size="15" fill="#202124">Train (60%)</text>
  <text x="224" y="140" text-anchor="middle" font-size="12" fill="#202124">fit the model</text>

  <!-- Validation 20 -->
  <rect x="436" y="100" width="124" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="498" y="122" text-anchor="middle" font-size="15" fill="#202124">Val (20%)</text>
  <text x="498" y="140" text-anchor="middle" font-size="12" fill="#202124">tune</text>

  <!-- Test 20 -->
  <rect x="568" y="100" width="132" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="634" y="122" text-anchor="middle" font-size="15" fill="#202124">Test (20%)</text>
  <text x="634" y="140" text-anchor="middle" font-size="12" fill="#202124">final, once</text>

  <line x1="200" y1="60" x2="200" y2="96" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="498" y1="60" x2="498" y2="96" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="634" y1="60" x2="634" y2="96" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="360" y="190" text-anchor="middle" font-size="12" fill="#5F6368">Test set stays locked until the very end</text>
</svg>
