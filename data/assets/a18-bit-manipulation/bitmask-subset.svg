<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#202124" font-weight="600">Integer as a set: {apple, milk} from 4 items</text>

  <!-- item labels row -->
  <text x="110" y="70" text-anchor="middle" font-size="12" fill="#5F6368">bit 3</text>
  <text x="250" y="70" text-anchor="middle" font-size="12" fill="#5F6368">bit 2</text>
  <text x="390" y="70" text-anchor="middle" font-size="12" fill="#5F6368">bit 1</text>
  <text x="530" y="70" text-anchor="middle" font-size="12" fill="#5F6368">bit 0</text>

  <!-- item names -->
  <text x="110" y="92" text-anchor="middle" font-size="13" fill="#202124">eggs</text>
  <text x="250" y="92" text-anchor="middle" font-size="13" fill="#202124">bread</text>
  <text x="390" y="92" text-anchor="middle" font-size="13" fill="#202124">milk</text>
  <text x="530" y="92" text-anchor="middle" font-size="13" fill="#202124">apple</text>

  <!-- bit cells -->
  <rect x="60" y="105" width="100" height="60" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="110" y="143" text-anchor="middle" font-size="24" fill="#202124" font-family="monospace">0</text>

  <rect x="200" y="105" width="100" height="60" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="250" y="143" text-anchor="middle" font-size="24" fill="#202124" font-family="monospace">0</text>

  <rect x="340" y="105" width="100" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="390" y="143" text-anchor="middle" font-size="24" fill="#202124" font-family="monospace">1</text>

  <rect x="480" y="105" width="100" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="530" y="143" text-anchor="middle" font-size="24" fill="#202124" font-family="monospace">1</text>

  <!-- value -->
  <line x1="360" y1="175" x2="360" y2="205" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="220" y="210" width="280" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="234" text-anchor="middle" font-size="13" fill="#202124">binary 0011  =  decimal 3</text>
  <text x="360" y="254" text-anchor="middle" font-size="12" fill="#5F6368">one int stores the whole set</text>

  <text x="360" y="300" text-anchor="middle" font-size="12" fill="#5F6368">add milk: mask | (1 &lt;&lt; 1) &#160;&#160; check apple: mask &amp; (1 &lt;&lt; 0)</text>
</svg>
