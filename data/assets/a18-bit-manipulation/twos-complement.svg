<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#202124" font-weight="600">Two's complement of -5 (8-bit)</text>

  <!-- Step 1: +5 -->
  <rect x="60" y="55" width="600" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="90" y="78" font-size="13" fill="#202124" font-weight="600">Start: +5</text>
  <text x="300" y="90" text-anchor="middle" font-size="20" fill="#202124" font-family="monospace">0 0 0 0 0 1 0 1</text>

  <line x1="360" y1="118" x2="360" y2="146" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="375" y="138" font-size="11" fill="#5F6368">invert all bits (NOT)</text>

  <!-- Step 2: ~5 -->
  <rect x="60" y="150" width="600" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="90" y="173" font-size="13" fill="#202124" font-weight="600">~5</text>
  <text x="300" y="185" text-anchor="middle" font-size="20" fill="#202124" font-family="monospace">1 1 1 1 1 0 1 0</text>

  <line x1="360" y1="213" x2="360" y2="241" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="375" y="233" font-size="11" fill="#5F6368">add 1</text>

  <!-- Step 3: -5 -->
  <rect x="60" y="245" width="600" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="90" y="268" font-size="13" fill="#202124" font-weight="600">Result: -5</text>
  <text x="300" y="280" text-anchor="middle" font-size="20" fill="#202124" font-family="monospace">1 1 1 1 1 0 1 1</text>

  <text x="360" y="335" text-anchor="middle" font-size="12" fill="#5F6368">Leftmost bit = 1 means negative</text>
</svg>
