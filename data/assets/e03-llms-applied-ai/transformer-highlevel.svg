<svg viewBox="0 0 720 230" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Tokens -->
  <rect x="20" y="90" width="120" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="80" y="114" font-size="15" fill="#202124" text-anchor="middle">Tokens</text>
  <text x="80" y="132" font-size="12" fill="#202124" text-anchor="middle">word pieces</text>

  <!-- Embeddings -->
  <rect x="180" y="90" width="120" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="240" y="114" font-size="15" fill="#202124" text-anchor="middle">Embeddings</text>
  <text x="240" y="132" font-size="12" fill="#202124" text-anchor="middle">+ position</text>

  <!-- Attention stack -->
  <rect x="340" y="40" width="160" height="156" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="420" y="64" font-size="15" fill="#202124" text-anchor="middle">Attention layers</text>
  <rect x="360" y="78" width="120" height="30" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="1"/>
  <text x="420" y="98" font-size="12" fill="#202124" text-anchor="middle">self-attention</text>
  <rect x="360" y="116" width="120" height="30" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="1"/>
  <text x="420" y="136" font-size="12" fill="#202124" text-anchor="middle">feed-forward</text>
  <text x="420" y="170" font-size="12" fill="#202124" text-anchor="middle">x N stacked</text>

  <!-- Next token -->
  <rect x="540" y="90" width="160" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="620" y="114" font-size="15" fill="#202124" text-anchor="middle">Next token</text>
  <text x="620" y="132" font-size="12" fill="#202124" text-anchor="middle">probabilities</text>

  <!-- arrows -->
  <line x1="140" y1="118" x2="178" y2="118" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="118" x2="338" y2="118" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="118" x2="538" y2="118" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
