<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <rect x="30" y="40" width="150" height="56" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="105" y="64" text-anchor="middle" font-size="15" fill="#202124">main</text>
  <text x="105" y="83" text-anchor="middle" font-size="12" fill="#202124">protected</text>

  <rect x="30" y="180" width="150" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="105" y="204" text-anchor="middle" font-size="15" fill="#202124">feature branch</text>
  <text x="105" y="223" text-anchor="middle" font-size="12" fill="#202124">your commits</text>

  <rect x="270" y="180" width="150" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="345" y="204" text-anchor="middle" font-size="15" fill="#202124">push + open PR</text>
  <text x="345" y="223" text-anchor="middle" font-size="12" fill="#202124">remote</text>

  <rect x="510" y="180" width="150" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="585" y="204" text-anchor="middle" font-size="15" fill="#202124">review + CI</text>
  <text x="585" y="223" text-anchor="middle" font-size="12" fill="#202124">checks pass</text>

  <rect x="510" y="40" width="150" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="585" y="64" text-anchor="middle" font-size="15" fill="#202124">merge to main</text>
  <text x="585" y="83" text-anchor="middle" font-size="12" fill="#202124">delete branch</text>

  <line x1="105" y1="180" x2="105" y2="96" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="142" text-anchor="middle" font-size="11" fill="#5F6368">branch off</text>
  <line x1="180" y1="208" x2="270" y2="208" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="208" x2="510" y2="208" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="585" y1="180" x2="585" y2="96" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="635" y="142" text-anchor="middle" font-size="11" fill="#5F6368">approved</text>
</svg>
