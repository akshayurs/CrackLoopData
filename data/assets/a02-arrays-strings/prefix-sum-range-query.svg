<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Prefix sums turn range-sum into one subtraction</text>

  <!-- original array -->
  <text x="60" y="72" text-anchor="middle" font-size="12" fill="#5F6368">nums</text>
  <rect x="100" y="55" width="70" height="44" rx="6" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="135" y="82" text-anchor="middle" font-size="15" fill="#202124">3</text>
  <rect x="170" y="55" width="70" height="44" rx="6" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="205" y="82" text-anchor="middle" font-size="15" fill="#202124">1</text>
  <rect x="240" y="55" width="70" height="44" rx="6" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="275" y="82" text-anchor="middle" font-size="15" fill="#202124">4</text>
  <rect x="310" y="55" width="70" height="44" rx="6" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="345" y="82" text-anchor="middle" font-size="15" fill="#202124">1</text>
  <rect x="380" y="55" width="70" height="44" rx="6" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="415" y="82" text-anchor="middle" font-size="15" fill="#202124">5</text>
  <rect x="450" y="55" width="70" height="44" rx="6" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="485" y="82" text-anchor="middle" font-size="15" fill="#202124">9</text>

  <text x="135" y="118" text-anchor="middle" font-size="11" fill="#5F6368">0</text>
  <text x="205" y="118" text-anchor="middle" font-size="11" fill="#5F6368">1</text>
  <text x="275" y="118" text-anchor="middle" font-size="11" fill="#5F6368">2</text>
  <text x="345" y="118" text-anchor="middle" font-size="11" fill="#5F6368">3</text>
  <text x="415" y="118" text-anchor="middle" font-size="11" fill="#5F6368">4</text>
  <text x="485" y="118" text-anchor="middle" font-size="11" fill="#5F6368">5</text>

  <!-- prefix array -->
  <text x="60" y="172" text-anchor="middle" font-size="12" fill="#5F6368">prefix</text>
  <rect x="65" y="155" width="70" height="44" rx="6" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="100" y="182" text-anchor="middle" font-size="15" fill="#202124">0</text>
  <rect x="135" y="155" width="70" height="44" rx="6" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="170" y="182" text-anchor="middle" font-size="15" fill="#202124">3</text>
  <rect x="205" y="155" width="70" height="44" rx="6" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="240" y="182" text-anchor="middle" font-size="15" fill="#202124">4</text>
  <rect x="275" y="155" width="70" height="44" rx="6" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="310" y="182" text-anchor="middle" font-size="15" fill="#202124">8</text>
  <rect x="345" y="155" width="70" height="44" rx="6" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="380" y="182" text-anchor="middle" font-size="15" fill="#202124">9</text>
  <rect x="415" y="155" width="70" height="44" rx="6" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="450" y="182" text-anchor="middle" font-size="15" fill="#202124">14</text>
  <rect x="485" y="155" width="70" height="44" rx="6" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="520" y="182" text-anchor="middle" font-size="15" fill="#202124">23</text>

  <text x="100" y="218" text-anchor="middle" font-size="11" fill="#5F6368">0</text>
  <text x="170" y="218" text-anchor="middle" font-size="11" fill="#5F6368">1</text>
  <text x="240" y="218" text-anchor="middle" font-size="11" fill="#5F6368">2</text>
  <text x="310" y="218" text-anchor="middle" font-size="11" fill="#5F6368">3</text>
  <text x="380" y="218" text-anchor="middle" font-size="11" fill="#5F6368">4</text>
  <text x="450" y="218" text-anchor="middle" font-size="11" fill="#5F6368">5</text>
  <text x="520" y="218" text-anchor="middle" font-size="11" fill="#5F6368">6</text>

  <text x="595" y="182" text-anchor="middle" font-size="12" fill="#5F6368">prefix[k] = sum</text>
  <text x="595" y="198" text-anchor="middle" font-size="12" fill="#5F6368">of first k</text>

  <!-- query box -->
  <rect x="120" y="255" width="480" height="90" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="282" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">Range sum of indices 3..4 (the 1 and 5)</text>
  <text x="360" y="308" text-anchor="middle" font-size="13" fill="#202124">prefix[5] - prefix[3]  =  14 - 8  =  6</text>
  <text x="360" y="330" text-anchor="middle" font-size="12" fill="#5F6368">O(1) per query after O(n) one-time build</text>
</svg>
