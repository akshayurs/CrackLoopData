<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- The ring -->
  <circle cx="280" cy="210" r="150" fill="none" stroke="#9AA0A6" stroke-width="2"/>
  <text x="280" y="210" text-anchor="middle" font-size="12" fill="#9AA0A6">hash ring 0 .. 2^32-1</text>

  <!-- Nodes on ring -->
  <circle cx="280" cy="60" r="22" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="280" y="64" text-anchor="middle" font-size="13" fill="#202124">Node A</text>

  <circle cx="430" cy="210" r="22" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="430" y="214" text-anchor="middle" font-size="13" fill="#202124">Node B</text>

  <circle cx="280" cy="360" r="22" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="280" y="364" text-anchor="middle" font-size="13" fill="#202124">Node C</text>

  <circle cx="130" cy="210" r="22" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="130" y="214" text-anchor="middle" font-size="13" fill="#202124">Node A'</text>

  <!-- vnode label -->
  <text x="130" y="245" text-anchor="middle" font-size="11" fill="#34A853">virtual node</text>

  <!-- Keys -->
  <circle cx="360" cy="110" r="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="92" text-anchor="middle" font-size="11" fill="#202124">key1</text>

  <circle cx="380" cy="300" r="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="395" y="320" text-anchor="middle" font-size="11" fill="#202124">key2</text>

  <!-- Assignment arrows: key walks clockwise to next node -->
  <path d="M366,103 Q410,80 430,188" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M375,293 Q360,250 360,232" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="120" font-size="11" fill="#5F6368">walk clockwise</text>

  <!-- Side note box -->
  <rect x="540" y="150" width="160" height="120" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="620" y="178" text-anchor="middle" font-size="13" fill="#202124">Add/remove node</text>
  <text x="620" y="200" text-anchor="middle" font-size="12" fill="#202124">only neighbor's</text>
  <text x="620" y="218" text-anchor="middle" font-size="12" fill="#202124">keys move</text>
  <text x="620" y="244" text-anchor="middle" font-size="12" fill="#34A853">~1/N reshuffled</text>
</svg>
