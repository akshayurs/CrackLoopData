<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#EA4335"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#202124" font-weight="600">BST search for 7 — follow the red path</text>

  <!-- edges (grey) -->
  <line x1="360" y1="80" x2="240" y2="150" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="360" y1="80" x2="480" y2="150" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="240" y1="180" x2="160" y2="250" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="240" y1="180" x2="320" y2="250" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="480" y1="180" x2="560" y2="250" stroke="#5F6368" stroke-width="1.5"/>

  <!-- red search path overlay -->
  <line x1="360" y1="80" x2="240" y2="150" stroke="#EA4335" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="180" x2="320" y2="250" stroke="#EA4335" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- nodes -->
  <circle cx="360" cy="65" r="24" fill="#FCE8E6" stroke="#EA4335" stroke-width="2"/>
  <text x="360" y="71" text-anchor="middle" font-size="15" fill="#202124">10</text>
  <text x="360" y="46" text-anchor="middle" font-size="11" fill="#EA4335">7&lt;10 → left</text>

  <circle cx="240" cy="165" r="24" fill="#FCE8E6" stroke="#EA4335" stroke-width="2"/>
  <text x="240" y="171" text-anchor="middle" font-size="15" fill="#202124">5</text>
  <text x="186" y="150" text-anchor="middle" font-size="11" fill="#EA4335">7&gt;5 → right</text>

  <circle cx="480" cy="165" r="24" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="480" y="171" text-anchor="middle" font-size="15" fill="#202124">15</text>

  <circle cx="160" cy="265" r="24" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="160" y="271" text-anchor="middle" font-size="15" fill="#202124">3</text>

  <circle cx="320" cy="265" r="24" fill="#E6F4EA" stroke="#34A853" stroke-width="2.5"/>
  <text x="320" y="271" text-anchor="middle" font-size="15" fill="#202124">7</text>
  <text x="320" y="306" text-anchor="middle" font-size="11" fill="#34A853">found</text>

  <circle cx="560" cy="265" r="24" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="560" y="271" text-anchor="middle" font-size="15" fill="#202124">20</text>
</svg>
