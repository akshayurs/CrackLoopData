<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">URL shortener: read-heavy, redirect-fast</text>

  <!-- Client -->
  <rect x="30" y="160" width="130" height="56" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="95" y="184" text-anchor="middle" font-size="15" fill="#202124">Client</text>
  <text x="95" y="202" text-anchor="middle" font-size="12" fill="#5F6368">GET /aZ4x</text>

  <!-- LB -->
  <rect x="200" y="160" width="130" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="265" y="184" text-anchor="middle" font-size="15" fill="#202124">Load balancer</text>
  <text x="265" y="202" text-anchor="middle" font-size="12" fill="#5F6368">+ CDN edge</text>

  <!-- App -->
  <rect x="370" y="160" width="130" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="435" y="184" text-anchor="middle" font-size="15" fill="#202124">Redirect svc</text>
  <text x="435" y="202" text-anchor="middle" font-size="12" fill="#5F6368">stateless</text>

  <!-- Cache -->
  <rect x="540" y="70" width="150" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="615" y="94" text-anchor="middle" font-size="15" fill="#202124">Redis cache</text>
  <text x="615" y="112" text-anchor="middle" font-size="12" fill="#5F6368">hot codes, 90%+ hit</text>

  <!-- KV store -->
  <rect x="540" y="160" width="150" height="56" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="615" y="184" text-anchor="middle" font-size="15" fill="#202124">KV store</text>
  <text x="615" y="202" text-anchor="middle" font-size="12" fill="#5F6368">code to URL</text>

  <!-- ID gen -->
  <rect x="370" y="280" width="130" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="435" y="304" text-anchor="middle" font-size="15" fill="#202124">ID generator</text>
  <text x="435" y="322" text-anchor="middle" font-size="12" fill="#5F6368">base62 / Snowflake</text>

  <!-- arrows -->
  <line x1="160" y1="188" x2="198" y2="188" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="188" x2="368" y2="188" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="170" x2="538" y2="110" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="535" y="140" text-anchor="middle" font-size="11" fill="#5F6368">read</text>
  <line x1="500" y1="188" x2="538" y2="188" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="180" text-anchor="middle" font-size="11" fill="#5F6368">miss</text>
  <line x1="435" y1="216" x2="435" y2="278" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="468" y="250" text-anchor="middle" font-size="11" fill="#5F6368">on write</text>
</svg>
