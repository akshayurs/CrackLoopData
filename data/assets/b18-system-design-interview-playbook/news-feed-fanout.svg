<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">News feed: fan-out on write vs read</text>

  <!-- Post -->
  <rect x="40" y="60" width="150" height="56" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="115" y="84" text-anchor="middle" font-size="15" fill="#202124">User posts</text>
  <text x="115" y="102" text-anchor="middle" font-size="12" fill="#5F6368">write tweet</text>

  <!-- Post svc -->
  <rect x="250" y="60" width="150" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="325" y="84" text-anchor="middle" font-size="15" fill="#202124">Post service</text>
  <text x="325" y="102" text-anchor="middle" font-size="12" fill="#5F6368">store in DB</text>

  <!-- Fanout svc -->
  <rect x="460" y="60" width="160" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="540" y="84" text-anchor="middle" font-size="15" fill="#202124">Fan-out worker</text>
  <text x="540" y="102" text-anchor="middle" font-size="12" fill="#5F6368">async, queue</text>

  <!-- Push path -->
  <rect x="430" y="170" width="230" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="545" y="192" text-anchor="middle" font-size="15" fill="#202124">Push: precompute feeds</text>
  <text x="545" y="210" text-anchor="middle" font-size="12" fill="#5F6368">write to N follower caches</text>

  <!-- Follower caches -->
  <rect x="430" y="250" width="105" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="482" y="278" text-anchor="middle" font-size="13" fill="#202124">Feed cache A</text>
  <rect x="555" y="250" width="105" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="607" y="278" text-anchor="middle" font-size="13" fill="#202124">Feed cache B</text>

  <!-- Pull path for celebs -->
  <rect x="60" y="250" width="280" height="50" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="200" y="272" text-anchor="middle" font-size="15" fill="#202124">Pull: celebrities (millions of followers)</text>
  <text x="200" y="290" text-anchor="middle" font-size="12" fill="#5F6368">merge at read time</text>

  <!-- Reader -->
  <rect x="250" y="340" width="220" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="362" text-anchor="middle" font-size="15" fill="#202124">Reader: GET /feed</text>
  <text x="360" y="380" text-anchor="middle" font-size="12" fill="#5F6368">merge push + pull</text>

  <!-- arrows -->
  <line x1="190" y1="88" x2="248" y2="88" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="88" x2="458" y2="88" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="545" y1="116" x2="545" y2="168" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="220" x2="490" y2="248" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="220" x2="600" y2="248" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="482" y1="300" x2="420" y2="345" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="300" x2="300" y2="338" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
