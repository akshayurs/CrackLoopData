<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">The 8-step interview framework</text>

  <!-- 1 -->
  <rect x="250" y="55" width="220" height="48" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="78" text-anchor="middle" font-size="15" fill="#202124">1. Clarify &amp; scope</text>
  <text x="360" y="95" text-anchor="middle" font-size="12" fill="#5F6368">functional + non-functional</text>

  <!-- 2 -->
  <rect x="250" y="118" width="220" height="48" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="141" text-anchor="middle" font-size="15" fill="#202124">2. Capacity estimate</text>
  <text x="360" y="158" text-anchor="middle" font-size="12" fill="#5F6368">QPS, storage, bandwidth</text>

  <!-- 3 -->
  <rect x="250" y="181" width="220" height="48" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="204" text-anchor="middle" font-size="15" fill="#202124">3. Define API</text>
  <text x="360" y="221" text-anchor="middle" font-size="12" fill="#5F6368">endpoints + contracts</text>

  <!-- 4 -->
  <rect x="250" y="244" width="220" height="48" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="267" text-anchor="middle" font-size="15" fill="#202124">4. Data model</text>
  <text x="360" y="284" text-anchor="middle" font-size="12" fill="#5F6368">tables, keys, access</text>

  <!-- 5 -->
  <rect x="250" y="307" width="220" height="48" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="330" text-anchor="middle" font-size="15" fill="#202124">5. High-level design</text>
  <text x="360" y="347" text-anchor="middle" font-size="12" fill="#5F6368">draw the boxes</text>

  <!-- 6 -->
  <rect x="250" y="370" width="220" height="48" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="393" text-anchor="middle" font-size="15" fill="#202124">6. Deep dive</text>
  <text x="360" y="410" text-anchor="middle" font-size="12" fill="#5F6368">one component, hard part</text>

  <!-- 7+8 side note -->
  <rect x="490" y="307" width="200" height="48" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="590" y="330" text-anchor="middle" font-size="15" fill="#202124">7. Find bottlenecks</text>
  <text x="590" y="347" text-anchor="middle" font-size="12" fill="#5F6368">scale the hot path</text>

  <rect x="490" y="370" width="200" height="48" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="590" y="393" text-anchor="middle" font-size="15" fill="#202124">8. Trade-offs</text>
  <text x="590" y="410" text-anchor="middle" font-size="12" fill="#5F6368">justify choices</text>

  <!-- vertical arrows 1->6 -->
  <line x1="360" y1="103" x2="360" y2="116" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="166" x2="360" y2="179" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="229" x2="360" y2="242" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="292" x2="360" y2="305" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="355" x2="360" y2="368" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 6 -> 7 -> 8 -->
  <line x1="470" y1="394" x2="488" y2="394" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="368" x2="590" y2="357" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="120" y="240" text-anchor="middle" font-size="12" fill="#5F6368">Spend ~5 min</text>
  <text x="120" y="258" text-anchor="middle" font-size="12" fill="#5F6368">on steps 1-4,</text>
  <text x="120" y="276" text-anchor="middle" font-size="12" fill="#5F6368">then go deep.</text>
</svg>
