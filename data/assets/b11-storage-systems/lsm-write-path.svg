<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Write entry -->
  <rect x="20" y="30" width="150" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="95" y="54" text-anchor="middle" font-size="15" fill="#202124">Write request</text>
  <text x="95" y="72" text-anchor="middle" font-size="12" fill="#202124">key = value</text>

  <!-- WAL -->
  <rect x="20" y="140" width="150" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="95" y="164" text-anchor="middle" font-size="15" fill="#202124">WAL (on disk)</text>
  <text x="95" y="182" text-anchor="middle" font-size="12" fill="#202124">append-only log</text>

  <!-- Memtable -->
  <rect x="270" y="30" width="160" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="350" y="54" text-anchor="middle" font-size="15" fill="#202124">Memtable</text>
  <text x="350" y="72" text-anchor="middle" font-size="12" fill="#202124">sorted, in RAM</text>

  <!-- Flush -->
  <rect x="270" y="150" width="160" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="350" y="174" text-anchor="middle" font-size="15" fill="#202124">Flush when full</text>
  <text x="350" y="192" text-anchor="middle" font-size="12" fill="#202124">write SSTable</text>

  <!-- SSTables -->
  <rect x="520" y="30" width="170" height="56" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="605" y="54" text-anchor="middle" font-size="15" fill="#202124">SSTable L0</text>
  <text x="605" y="72" text-anchor="middle" font-size="12" fill="#202124">immutable, sorted</text>

  <rect x="520" y="110" width="170" height="48" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="605" y="139" text-anchor="middle" font-size="14" fill="#202124">SSTable L1</text>

  <rect x="520" y="180" width="170" height="48" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="605" y="209" text-anchor="middle" font-size="14" fill="#202124">SSTable L2 ...</text>

  <!-- Compaction -->
  <rect x="270" y="270" width="420" height="56" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="480" y="294" text-anchor="middle" font-size="15" fill="#202124">Compaction (background)</text>
  <text x="480" y="312" text-anchor="middle" font-size="12" fill="#202124">merge, drop tombstones, rewrite levels</text>

  <!-- arrows -->
  <line x1="95" y1="86" x2="95" y2="140" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="105" y="116" font-size="11" fill="#5F6368">durable</text>
  <line x1="170" y1="58" x2="270" y2="58" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="86" x2="350" y2="150" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="178" x2="520" y2="60" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="605" y1="86" x2="605" y2="110" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="605" y1="158" x2="605" y2="180" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="605" y1="228" x2="605" y2="270" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
