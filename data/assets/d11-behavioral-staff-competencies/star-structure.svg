<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="34" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">STAR answer structure</text>

  <rect x="24" y="70" width="150" height="80" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="99" y="104" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Situation</text>
  <text x="99" y="126" text-anchor="middle" font-size="12" fill="#202124">set the scene</text>

  <rect x="200" y="70" width="150" height="80" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="275" y="104" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Task</text>
  <text x="275" y="126" text-anchor="middle" font-size="12" fill="#202124">your goal</text>

  <rect x="376" y="70" width="150" height="80" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="451" y="104" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Action</text>
  <text x="451" y="126" text-anchor="middle" font-size="12" fill="#202124">what YOU did</text>

  <rect x="552" y="70" width="150" height="80" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="627" y="104" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Result</text>
  <text x="627" y="126" text-anchor="middle" font-size="12" fill="#202124">impact + numbers</text>

  <line x1="174" y1="110" x2="198" y2="110" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="110" x2="374" y2="110" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="526" y1="110" x2="550" y2="110" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="100" y="190" text-anchor="middle" font-size="11" fill="#5F6368">~15%</text>
  <text x="275" y="190" text-anchor="middle" font-size="11" fill="#5F6368">~10%</text>
  <text x="451" y="190" text-anchor="middle" font-size="11" fill="#5F6368">~60% (spend here)</text>
  <text x="627" y="190" text-anchor="middle" font-size="11" fill="#5F6368">~15%</text>
</svg>
