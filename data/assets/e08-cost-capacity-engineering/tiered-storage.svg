<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Tiered Storage — data ages from Hot to Cold</text>

  <!-- Hot -->
  <rect x="40" y="80" width="180" height="100" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="130" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Hot</text>
  <text x="130" y="134" text-anchor="middle" font-size="12" fill="#202124">SSD / standard</text>
  <text x="130" y="152" text-anchor="middle" font-size="12" fill="#202124">ms reads, $$$/GB</text>
  <text x="130" y="170" text-anchor="middle" font-size="12" fill="#202124">last ~30 days</text>

  <!-- Warm -->
  <rect x="270" y="80" width="180" height="100" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Warm</text>
  <text x="360" y="134" text-anchor="middle" font-size="12" fill="#202124">infrequent access</text>
  <text x="360" y="152" text-anchor="middle" font-size="12" fill="#202124">cheap store, fee/read</text>
  <text x="360" y="170" text-anchor="middle" font-size="12" fill="#202124">30–180 days</text>

  <!-- Cold -->
  <rect x="500" y="80" width="180" height="100" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="590" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Cold / Archive</text>
  <text x="590" y="134" text-anchor="middle" font-size="12" fill="#202124">tape-like, ¢/GB</text>
  <text x="590" y="152" text-anchor="middle" font-size="12" fill="#202124">hrs to restore</text>
  <text x="590" y="170" text-anchor="middle" font-size="12" fill="#202124">180 days+</text>

  <line x1="220" y1="130" x2="268" y2="130" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="130" x2="498" y2="130" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="244" y="120" text-anchor="middle" font-size="11" fill="#5F6368">age out</text>
  <text x="474" y="120" text-anchor="middle" font-size="11" fill="#5F6368">age out</text>

  <text x="360" y="225" text-anchor="middle" font-size="12" fill="#202124">Lifecycle policy moves objects automatically as access cools</text>
  <text x="360" y="248" text-anchor="middle" font-size="12" fill="#9AA0A6">cost per GB drops ~10x each step; restore latency rises</text>
</svg>
