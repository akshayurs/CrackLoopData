<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Autoscaling Capacity vs Daily Demand</text>

  <!-- axes -->
  <line x1="70" y1="300" x2="680" y2="300" stroke="#9AA0A6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="70" y1="300" x2="70" y2="60" stroke="#9AA0A6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="680" y="322" text-anchor="end" font-size="12" fill="#202124">time of day</text>
  <text x="58" y="70" text-anchor="end" font-size="12" fill="#202124">load</text>

  <!-- demand curve (smooth daily wave) -->
  <path d="M70,260 C160,255 200,120 290,110 C360,103 380,250 470,255 C540,258 560,150 650,140"
        fill="none" stroke="#4285F4" stroke-width="2.5"/>
  <!-- capacity step function tracking it with headroom -->
  <path d="M70,250 L150,250 L150,150 L250,150 L250,90 L360,90 L360,250 L470,250 L470,135 L600,135 L600,130 L650,130"
        fill="none" stroke="#34A853" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- fixed provisioning line (peak) -->
  <line x1="70" y1="90" x2="650" y2="90" stroke="#EA4335" stroke-width="1.5" stroke-dasharray="2,4"/>

  <!-- legend -->
  <rect x="90" y="60" width="18" height="3" fill="#4285F4"/>
  <text x="114" y="64" font-size="12" fill="#202124">demand</text>
  <rect x="200" y="60" width="18" height="3" fill="#34A853"/>
  <text x="224" y="64" font-size="12" fill="#202124">autoscaled capacity (+headroom)</text>
  <rect x="490" y="60" width="18" height="3" fill="#EA4335"/>
  <text x="514" y="64" font-size="12" fill="#202124">fixed at peak (wasteful)</text>

  <text x="305" y="78" text-anchor="middle" font-size="11" fill="#EA4335">paid even when idle &#8595;</text>
</svg>
