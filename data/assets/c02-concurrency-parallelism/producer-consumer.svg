<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Producer–consumer with a bounded buffer</text>

  <!-- Producers -->
  <rect x="30" y="90" width="150" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="105" y="117" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Producer</text>

  <rect x="30" y="150" width="150" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="105" y="177" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Producer</text>

  <!-- Buffer -->
  <rect x="270" y="95" width="180" height="100" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">Bounded buffer</text>
  <rect x="290" y="135" width="32" height="44" rx="4" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <rect x="328" y="135" width="32" height="44" rx="4" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <rect x="366" y="135" width="32" height="44" rx="4" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.5"/>
  <rect x="404" y="135" width="32" height="44" rx="4" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="212" text-anchor="middle" font-size="11" fill="#5F6368">capacity = N (fixed)</text>

  <!-- Consumers -->
  <rect x="540" y="90" width="150" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="615" y="117" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Consumer</text>

  <rect x="540" y="150" width="150" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="615" y="177" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Consumer</text>

  <!-- arrows in -->
  <line x1="180" y1="112" x2="268" y2="130" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="172" x2="268" y2="155" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="225" y="100" text-anchor="middle" font-size="11" fill="#5F6368">put</text>

  <!-- arrows out -->
  <line x1="452" y1="130" x2="538" y2="112" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="452" y1="155" x2="538" y2="172" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="495" y="100" text-anchor="middle" font-size="11" fill="#5F6368">take</text>

  <!-- block notes -->
  <text x="105" y="250" text-anchor="middle" font-size="11" fill="#EA4335">block if full</text>
  <text x="615" y="250" text-anchor="middle" font-size="11" fill="#EA4335">block if empty</text>
  <text x="360" y="288" text-anchor="middle" font-size="12" fill="#9AA0A6">Condition variables wake blocked threads when state changes</text>
</svg>
