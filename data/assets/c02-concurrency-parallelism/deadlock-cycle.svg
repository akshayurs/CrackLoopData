<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Deadlock: a cycle in the wait-for graph</text>

  <!-- Thread 1 -->
  <rect x="120" y="70" width="180" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="210" y="95" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Thread 1</text>
  <text x="210" y="113" text-anchor="middle" font-size="12" fill="#5F6368">holds Lock A</text>

  <!-- Lock B -->
  <rect x="460" y="70" width="180" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="550" y="95" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Lock B</text>
  <text x="550" y="113" text-anchor="middle" font-size="12" fill="#5F6368">held by Thread 2</text>

  <!-- Thread 2 -->
  <rect x="460" y="260" width="180" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="550" y="285" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Thread 2</text>
  <text x="550" y="303" text-anchor="middle" font-size="12" fill="#5F6368">holds Lock B</text>

  <!-- Lock A -->
  <rect x="120" y="260" width="180" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="210" y="285" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Lock A</text>
  <text x="210" y="303" text-anchor="middle" font-size="12" fill="#5F6368">held by Thread 1</text>

  <!-- T1 waits for B -->
  <line x1="300" y1="98" x2="460" y2="98" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="90" text-anchor="middle" font-size="11" fill="#EA4335">waits for</text>

  <!-- B -> T2 (held by) -->
  <line x1="550" y1="126" x2="550" y2="260" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- T2 waits for A -->
  <line x1="460" y1="288" x2="300" y2="288" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="280" text-anchor="middle" font-size="11" fill="#EA4335">waits for</text>

  <!-- A -> T1 (held by) -->
  <line x1="210" y1="260" x2="210" y2="126" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="360" y="360" text-anchor="middle" font-size="12" fill="#9AA0A6">Cycle closes → neither can proceed</text>
</svg>
