<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="15" fill="#202124" font-weight="bold">Floyd cycle detection (tortoise &amp; hare)</text>

  <!-- straight tail -->
  <rect x="30" y="120" width="80" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="70" y="150" font-size="15" fill="#202124" text-anchor="middle">A</text>

  <rect x="160" y="120" width="80" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="200" y="150" font-size="15" fill="#202124" text-anchor="middle">B</text>

  <!-- cycle nodes -->
  <rect x="300" y="120" width="80" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="340" y="150" font-size="15" fill="#202124" text-anchor="middle">C</text>

  <rect x="450" y="60" width="80" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="490" y="90" font-size="15" fill="#202124" text-anchor="middle">D</text>

  <rect x="450" y="190" width="80" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="490" y="220" font-size="15" fill="#202124" text-anchor="middle">F</text>

  <rect x="590" y="120" width="80" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="630" y="150" font-size="15" fill="#202124" text-anchor="middle">E</text>

  <!-- arrows -->
  <line x1="110" y1="145" x2="156" y2="145" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="145" x2="296" y2="145" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="135" x2="448" y2="92" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="92" x2="598" y2="130" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="610" y1="170" x2="528" y2="208" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="220" x2="378" y2="162" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="200" y="105" font-size="11" fill="#9AA0A6" text-anchor="middle">straight tail</text>
  <text x="490" y="160" font-size="11" fill="#9AA0A6" text-anchor="middle">loop</text>

  <text x="30" y="280" font-size="12" fill="#202124">slow moves 1 step, fast moves 2 steps; if they meet, a cycle exists</text>
</svg>
