<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Deployment -->
  <rect x="270" y="20" width="180" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="46" text-anchor="middle" font-size="15" fill="#202124">Deployment</text>
  <text x="360" y="64" text-anchor="middle" font-size="12" fill="#5F6368">rollout + version</text>

  <!-- ReplicaSet -->
  <rect x="270" y="130" width="180" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="156" text-anchor="middle" font-size="15" fill="#202124">ReplicaSet</text>
  <text x="360" y="174" text-anchor="middle" font-size="12" fill="#5F6368">keep N copies</text>

  <!-- Pods -->
  <rect x="120" y="250" width="130" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="185" y="283" text-anchor="middle" font-size="15" fill="#202124">Pod</text>
  <rect x="295" y="250" width="130" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="283" text-anchor="middle" font-size="15" fill="#202124">Pod</text>
  <rect x="470" y="250" width="130" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="535" y="283" text-anchor="middle" font-size="15" fill="#202124">Pod</text>

  <!-- Service -->
  <rect x="270" y="350" width="180" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="376" text-anchor="middle" font-size="15" fill="#202124">Service</text>
  <text x="360" y="394" text-anchor="middle" font-size="12" fill="#5F6368">stable address</text>

  <!-- Arrows: Deployment -> ReplicaSet -->
  <line x1="360" y1="80" x2="360" y2="128" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="370" y="108" font-size="11" fill="#5F6368">manages</text>

  <!-- ReplicaSet -> Pods -->
  <line x1="330" y1="190" x2="200" y2="248" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="190" x2="360" y2="248" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="190" x2="520" y2="248" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="395" y="222" font-size="11" fill="#5F6368">creates</text>

  <!-- Service -> Pods (selector) -->
  <line x1="320" y1="350" x2="200" y2="308" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="350" x2="360" y2="308" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="350" x2="520" y2="308" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="405" y="332" font-size="11" fill="#5F6368">selects</text>
</svg>
