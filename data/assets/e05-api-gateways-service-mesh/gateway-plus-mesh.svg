<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="30" y="170" width="110" height="55" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="85" y="203" font-size="15" fill="#202124" text-anchor="middle">Client</text>

  <!-- Gateway (edge) -->
  <rect x="185" y="155" width="130" height="85" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="250" y="190" font-size="15" fill="#202124" text-anchor="middle">API Gateway</text>
  <text x="250" y="210" font-size="12" fill="#202124" text-anchor="middle">edge / N-S</text>

  <!-- Mesh boundary -->
  <rect x="360" y="40" width="330" height="320" rx="8" fill="none" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="525" y="62" font-size="12" fill="#9AA0A6" text-anchor="middle">service mesh (east-west)</text>

  <!-- Svc A -->
  <rect x="390" y="90" width="120" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="450" y="116" font-size="14" fill="#202124" text-anchor="middle">Svc A</text>
  <text x="450" y="134" font-size="11" fill="#202124" text-anchor="middle">+ sidecar</text>

  <!-- Svc B -->
  <rect x="540" y="200" width="120" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="600" y="226" font-size="14" fill="#202124" text-anchor="middle">Svc B</text>
  <text x="600" y="244" font-size="11" fill="#202124" text-anchor="middle">+ sidecar</text>

  <!-- Svc C -->
  <rect x="390" y="280" width="120" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="450" y="306" font-size="14" fill="#202124" text-anchor="middle">Svc C</text>
  <text x="450" y="324" font-size="11" fill="#202124" text-anchor="middle">+ sidecar</text>

  <!-- arrows -->
  <line x1="140" y1="197" x2="183" y2="197" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="315" y1="180" x2="388" y2="125" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="150" font-size="11" fill="#5F6368" text-anchor="middle">enters mesh</text>

  <line x1="510" y1="135" x2="555" y2="198" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="555" y1="260" x2="500" y2="300" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="608" y="300" font-size="11" fill="#5F6368" text-anchor="middle">mTLS</text>
</svg>
