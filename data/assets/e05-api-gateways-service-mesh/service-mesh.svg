<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Control plane -->
  <rect x="230" y="20" width="260" height="55" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="44" font-size="15" fill="#202124" text-anchor="middle">Control plane (Istio)</text>
  <text x="360" y="63" font-size="12" fill="#202124" text-anchor="middle">config + certs to all proxies</text>

  <!-- Pod A -->
  <rect x="40" y="170" width="250" height="120" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <rect x="60" y="195" width="95" height="70" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="107" y="234" font-size="14" fill="#202124" text-anchor="middle">App A</text>
  <rect x="175" y="195" width="95" height="70" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="222" y="226" font-size="13" fill="#202124" text-anchor="middle">Sidecar</text>
  <text x="222" y="244" font-size="12" fill="#202124" text-anchor="middle">Envoy</text>

  <!-- Pod B -->
  <rect x="430" y="170" width="250" height="120" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <rect x="450" y="195" width="95" height="70" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="497" y="226" font-size="13" fill="#202124" text-anchor="middle">Sidecar</text>
  <text x="497" y="244" font-size="12" fill="#202124" text-anchor="middle">Envoy</text>
  <rect x="565" y="195" width="95" height="70" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="612" y="234" font-size="14" fill="#202124" text-anchor="middle">App B</text>

  <!-- proxy to proxy -->
  <line x1="270" y1="230" x2="448" y2="230" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="220" font-size="11" fill="#5F6368" text-anchor="middle">mTLS, retries</text>

  <!-- control plane to proxies -->
  <line x1="290" y1="75" x2="222" y2="193" stroke="#5F6368" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="430" y1="75" x2="497" y2="193" stroke="#5F6368" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="360" y="340" font-size="12" fill="#5F6368" text-anchor="middle">east-west traffic (service to service)</text>
</svg>
