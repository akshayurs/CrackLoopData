<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="120" y="30" font-size="14" font-weight="bold" fill="#202124" text-anchor="middle">Documents</text>
  <text x="500" y="30" font-size="14" font-weight="bold" fill="#202124" text-anchor="middle">Inverted index</text>

  <!-- Documents -->
  <rect x="30" y="50" width="180" height="46" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="120" y="72" font-size="15" fill="#202124" text-anchor="middle">Doc 1</text>
  <text x="120" y="89" font-size="12" fill="#202124" text-anchor="middle">"fast red car"</text>

  <rect x="30" y="120" width="180" height="46" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="120" y="142" font-size="15" fill="#202124" text-anchor="middle">Doc 2</text>
  <text x="120" y="159" font-size="12" fill="#202124" text-anchor="middle">"red bike"</text>

  <rect x="30" y="190" width="180" height="46" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="120" y="212" font-size="15" fill="#202124" text-anchor="middle">Doc 3</text>
  <text x="120" y="229" font-size="12" fill="#202124" text-anchor="middle">"fast train"</text>

  <!-- Term -> postings -->
  <rect x="360" y="50" width="120" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="420" y="75" font-size="15" fill="#202124" text-anchor="middle">"fast"</text>
  <rect x="520" y="50" width="170" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="605" y="75" font-size="13" fill="#202124" text-anchor="middle">[Doc 1, Doc 3]</text>

  <rect x="360" y="110" width="120" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="420" y="135" font-size="15" fill="#202124" text-anchor="middle">"red"</text>
  <rect x="520" y="110" width="170" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="605" y="135" font-size="13" fill="#202124" text-anchor="middle">[Doc 1, Doc 2]</text>

  <rect x="360" y="170" width="120" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="420" y="195" font-size="15" fill="#202124" text-anchor="middle">"car"</text>
  <rect x="520" y="170" width="170" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="605" y="195" font-size="13" fill="#202124" text-anchor="middle">[Doc 1]</text>

  <rect x="360" y="230" width="120" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="420" y="255" font-size="15" fill="#202124" text-anchor="middle">"bike"</text>
  <rect x="520" y="230" width="170" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="605" y="255" font-size="13" fill="#202124" text-anchor="middle">[Doc 2]</text>

  <rect x="360" y="290" width="120" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="420" y="315" font-size="15" fill="#202124" text-anchor="middle">"train"</text>
  <rect x="520" y="290" width="170" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="605" y="315" font-size="13" fill="#202124" text-anchor="middle">[Doc 3]</text>

  <!-- arrows term->posting -->
  <line x1="480" y1="70" x2="518" y2="70" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="130" x2="518" y2="130" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="190" x2="518" y2="190" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="250" x2="518" y2="250" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="310" x2="518" y2="310" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- build arrow -->
  <line x1="215" y1="143" x2="355" y2="143" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="285" y="135" font-size="11" fill="#5F6368" text-anchor="middle">analyze + invert</text>
</svg>
