<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <rect x="60" y="30" width="140" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="130" y="58" text-anchor="middle" font-size="15" fill="#202124">Client</text>

  <rect x="520" y="30" width="140" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="590" y="58" text-anchor="middle" font-size="15" fill="#202124">Server</text>

  <line x1="130" y1="74" x2="130" y2="400" stroke="#9AA0A6" stroke-width="1.5"/>
  <line x1="590" y1="74" x2="590" y2="400" stroke="#9AA0A6" stroke-width="1.5"/>

  <line x1="130" y1="110" x2="590" y2="110" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="103" text-anchor="middle" font-size="12" fill="#202124">ClientHello (ciphers, random)</text>

  <line x1="590" y1="150" x2="130" y2="150" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="143" text-anchor="middle" font-size="12" fill="#202124">ServerHello + certificate</text>

  <rect x="240" y="180" width="240" height="64" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#202124">Verify cert chain</text>
  <text x="360" y="225" text-anchor="middle" font-size="11" fill="#5F6368">leaf to intermediate to root CA</text>

  <line x1="130" y1="290" x2="590" y2="290" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="283" text-anchor="middle" font-size="12" fill="#202124">key exchange (ECDHE)</text>

  <rect x="220" y="315" width="280" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="340" text-anchor="middle" font-size="13" fill="#202124">shared session key derived</text>

  <line x1="130" y1="385" x2="590" y2="385" stroke="#34A853" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="378" text-anchor="middle" font-size="12" fill="#34A853">encrypted application data</text>
</svg>
