<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">KMP failure function for pattern "ABABC"</text>

  <!-- index row -->
  <text x="70" y="78" text-anchor="end" font-size="12" fill="#9AA0A6">index i</text>
  <text x="70" y="118" text-anchor="end" font-size="12" fill="#9AA0A6">char</text>
  <text x="70" y="158" text-anchor="end" font-size="12" fill="#9AA0A6">lps[i]</text>

  <!-- 5 columns -->
  <!-- col template: x positions 100,220,340,460,580 width 110 -->
  <g font-size="14" fill="#202124">
    <!-- headers -->
    <rect x="100" y="60" width="110" height="32" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
    <text x="155" y="82" text-anchor="middle">0</text>
    <rect x="220" y="60" width="110" height="32" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
    <text x="275" y="82" text-anchor="middle">1</text>
    <rect x="340" y="60" width="110" height="32" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
    <text x="395" y="82" text-anchor="middle">2</text>
    <rect x="460" y="60" width="110" height="32" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
    <text x="515" y="82" text-anchor="middle">3</text>
    <rect x="580" y="60" width="110" height="32" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
    <text x="635" y="82" text-anchor="middle">4</text>

    <!-- char row -->
    <rect x="100" y="100" width="110" height="32" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
    <text x="155" y="122" text-anchor="middle">A</text>
    <rect x="220" y="100" width="110" height="32" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
    <text x="275" y="122" text-anchor="middle">B</text>
    <rect x="340" y="100" width="110" height="32" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
    <text x="395" y="122" text-anchor="middle">A</text>
    <rect x="460" y="100" width="110" height="32" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
    <text x="515" y="122" text-anchor="middle">B</text>
    <rect x="580" y="100" width="110" height="32" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
    <text x="635" y="122" text-anchor="middle">C</text>

    <!-- lps row -->
    <rect x="100" y="140" width="110" height="32" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
    <text x="155" y="162" text-anchor="middle">0</text>
    <rect x="220" y="140" width="110" height="32" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
    <text x="275" y="162" text-anchor="middle">0</text>
    <rect x="340" y="140" width="110" height="32" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
    <text x="395" y="162" text-anchor="middle">1</text>
    <rect x="460" y="140" width="110" height="32" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
    <text x="515" y="162" text-anchor="middle">2</text>
    <rect x="580" y="140" width="110" height="32" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
    <text x="635" y="162" text-anchor="middle">0</text>
  </g>

  <text x="360" y="215" text-anchor="middle" font-size="13" fill="#202124">lps[i] = length of the longest proper prefix that is also a suffix of pattern[0..i]</text>

  <!-- explanation box -->
  <rect x="120" y="240" width="480" height="90" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="360" y="268" text-anchor="middle" font-size="13" fill="#202124" font-weight="bold">On a mismatch at pattern index j</text>
  <text x="360" y="292" text-anchor="middle" font-size="12" fill="#202124">don't reset to 0 — jump to lps[j-1]</text>
  <text x="360" y="314" text-anchor="middle" font-size="12" fill="#202124">the text pointer never moves backward</text>
</svg>
