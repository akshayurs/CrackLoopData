<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Trie storing: cat, car, can, dog</text>

  <!-- root -->
  <rect x="320" y="50" width="80" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="75" text-anchor="middle" font-size="14" fill="#202124">root</text>

  <!-- level 1: c , d -->
  <rect x="200" y="140" width="60" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="230" y="165" text-anchor="middle" font-size="14" fill="#202124">c</text>

  <rect x="500" y="140" width="60" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="530" y="165" text-anchor="middle" font-size="14" fill="#202124">d</text>

  <!-- level 2: a , o -->
  <rect x="200" y="230" width="60" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="230" y="255" text-anchor="middle" font-size="14" fill="#202124">a</text>

  <rect x="500" y="230" width="60" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="530" y="255" text-anchor="middle" font-size="14" fill="#202124">o</text>

  <!-- level 3: t r n (under a) ; g (under o) -->
  <rect x="100" y="330" width="60" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="130" y="350" text-anchor="middle" font-size="14" fill="#202124">t</text>
  <text x="130" y="364" text-anchor="middle" font-size="11" fill="#34A853">cat ✓</text>

  <rect x="200" y="330" width="60" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="230" y="350" text-anchor="middle" font-size="14" fill="#202124">r</text>
  <text x="230" y="364" text-anchor="middle" font-size="11" fill="#34A853">car ✓</text>

  <rect x="300" y="330" width="60" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="330" y="350" text-anchor="middle" font-size="14" fill="#202124">n</text>
  <text x="330" y="364" text-anchor="middle" font-size="11" fill="#34A853">can ✓</text>

  <rect x="500" y="330" width="60" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="530" y="350" text-anchor="middle" font-size="14" fill="#202124">g</text>
  <text x="530" y="364" text-anchor="middle" font-size="11" fill="#34A853">dog ✓</text>

  <!-- edges root -> c, d -->
  <line x1="345" y1="90" x2="245" y2="140" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="375" y1="90" x2="515" y2="140" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- c -> a , d -> o -->
  <line x1="230" y1="180" x2="230" y2="230" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="180" x2="530" y2="230" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- a -> t r n -->
  <line x1="215" y1="270" x2="140" y2="330" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="270" x2="230" y2="330" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="245" y1="270" x2="320" y2="330" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- o -> g -->
  <line x1="530" y1="270" x2="530" y2="330" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="360" y="405" text-anchor="middle" font-size="12" fill="#9AA0A6">green = end-of-word marker; "ca" prefix is shared by cat/car/can</text>
</svg>
