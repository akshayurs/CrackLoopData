<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">fib(4) call tree — each node is a stack frame</text>

  <!-- Level 0 -->
  <rect x="310" y="50" width="100" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="75" text-anchor="middle" font-size="15" fill="#202124">fib(4)</text>

  <!-- Level 1 -->
  <rect x="170" y="140" width="100" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="220" y="165" text-anchor="middle" font-size="15" fill="#202124">fib(3)</text>

  <rect x="450" y="140" width="100" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="500" y="165" text-anchor="middle" font-size="15" fill="#202124">fib(2)</text>

  <!-- Level 2 -->
  <rect x="70" y="230" width="100" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="120" y="255" text-anchor="middle" font-size="15" fill="#202124">fib(2)</text>

  <rect x="250" y="230" width="100" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="300" y="255" text-anchor="middle" font-size="15" fill="#202124">fib(1)=1</text>

  <rect x="400" y="230" width="100" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="450" y="255" text-anchor="middle" font-size="15" fill="#202124">fib(1)=1</text>

  <rect x="540" y="230" width="100" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="590" y="255" text-anchor="middle" font-size="15" fill="#202124">fib(0)=0</text>

  <!-- Level 3 -->
  <rect x="20" y="330" width="100" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="70" y="355" text-anchor="middle" font-size="15" fill="#202124">fib(1)=1</text>

  <rect x="150" y="330" width="100" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="200" y="355" text-anchor="middle" font-size="15" fill="#202124">fib(0)=0</text>

  <!-- edges -->
  <line x1="335" y1="90" x2="240" y2="140" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="385" y1="90" x2="480" y2="140" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="195" y1="180" x2="140" y2="230" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="245" y1="180" x2="290" y2="230" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="480" y1="180" x2="450" y2="230" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="180" x2="580" y2="230" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="95" y1="270" x2="80" y2="330" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="145" y1="270" x2="190" y2="330" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="660" y="355" text-anchor="middle" font-size="12" fill="#34A853">green = base case</text>
</svg>
