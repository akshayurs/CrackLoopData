<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Subsets of [1,2,3] — choose / skip each item</text>

  <!-- root -->
  <rect x="305" y="44" width="110" height="38" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="68" text-anchor="middle" font-size="14" fill="#202124">{ } start</text>

  <!-- level 1 : decide on 1 -->
  <rect x="150" y="130" width="110" height="38" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="205" y="154" text-anchor="middle" font-size="14" fill="#202124">{1}</text>

  <rect x="470" y="130" width="110" height="38" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="525" y="154" text-anchor="middle" font-size="14" fill="#202124">{ }</text>

  <!-- level 2 : decide on 2 -->
  <rect x="60" y="220" width="100" height="38" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="110" y="244" text-anchor="middle" font-size="14" fill="#202124">{1,2}</text>

  <rect x="240" y="220" width="100" height="38" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="290" y="244" text-anchor="middle" font-size="14" fill="#202124">{1}</text>

  <rect x="430" y="220" width="100" height="38" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="480" y="244" text-anchor="middle" font-size="14" fill="#202124">{2}</text>

  <!-- level 3 : leaves under {1,2} -->
  <rect x="30" y="320" width="100" height="38" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="80" y="344" text-anchor="middle" font-size="13" fill="#202124">{1,2,3}</text>

  <rect x="150" y="320" width="100" height="38" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="200" y="344" text-anchor="middle" font-size="13" fill="#202124">{1,2}</text>

  <!-- pruned subtree marker -->
  <rect x="540" y="320" width="150" height="50" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="615" y="340" text-anchor="middle" font-size="12" fill="#EA4335">pruned branch</text>
  <text x="615" y="357" text-anchor="middle" font-size="11" fill="#202124">cut by constraint</text>

  <!-- edges -->
  <line x1="335" y1="82" x2="240" y2="130" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270" y="106" text-anchor="middle" font-size="11" fill="#5F6368">take 1</text>
  <line x1="385" y1="82" x2="490" y2="130" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="455" y="106" text-anchor="middle" font-size="11" fill="#5F6368">skip 1</text>

  <line x1="185" y1="168" x2="130" y2="220" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="225" y1="168" x2="285" y2="220" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="168" x2="490" y2="220" stroke="#EA4335" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <line x1="95" y1="258" x2="80" y2="320" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="125" y1="258" x2="195" y2="320" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="258" x2="585" y2="320" stroke="#EA4335" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
</svg>
