<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#202124" font-weight="600">Fast exponentiation: compute 3^13 by squaring</text>
  <text x="360" y="48" text-anchor="middle" font-size="12" fill="#5F6368">13 in binary = 1101, so 3^13 = 3^8 . 3^4 . 3^1</text>

  <!-- Top row: powers of 3 built by repeated squaring -->
  <rect x="50"  y="78" width="120" height="48" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="110" y="100" text-anchor="middle" font-size="14" fill="#202124">3^1 = 3</text>
  <text x="110" y="118" text-anchor="middle" font-size="11" fill="#5F6368">base</text>

  <rect x="220" y="78" width="120" height="48" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="280" y="100" text-anchor="middle" font-size="14" fill="#202124">3^2 = 9</text>
  <text x="280" y="118" text-anchor="middle" font-size="11" fill="#5F6368">square</text>

  <rect x="390" y="78" width="120" height="48" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="450" y="100" text-anchor="middle" font-size="14" fill="#202124">3^4 = 81</text>
  <text x="450" y="118" text-anchor="middle" font-size="11" fill="#5F6368">square</text>

  <rect x="560" y="78" width="120" height="48" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="620" y="100" text-anchor="middle" font-size="14" fill="#202124">3^8 = 6561</text>
  <text x="620" y="118" text-anchor="middle" font-size="11" fill="#5F6368">square</text>

  <line x1="170" y1="102" x2="218" y2="102" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="102" x2="388" y2="102" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="102" x2="558" y2="102" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="194" y="94" text-anchor="middle" font-size="11" fill="#4285F4">x^2</text>
  <text x="364" y="94" text-anchor="middle" font-size="11" fill="#4285F4">x^2</text>
  <text x="534" y="94" text-anchor="middle" font-size="11" fill="#4285F4">x^2</text>

  <!-- Bit row: which squares get multiplied in -->
  <text x="360" y="178" text-anchor="middle" font-size="12" fill="#202124" font-weight="600">Multiply in the squares where the bit is 1</text>

  <rect x="50"  y="194" width="120" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="110" y="214" text-anchor="middle" font-size="13" fill="#202124">bit=1 -&gt; use 3^1</text>
  <text x="110" y="231" text-anchor="middle" font-size="11" fill="#5F6368">x3</text>

  <rect x="220" y="194" width="120" height="44" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="280" y="214" text-anchor="middle" font-size="13" fill="#202124">bit=0 -&gt; skip 3^2</text>
  <text x="280" y="231" text-anchor="middle" font-size="11" fill="#5F6368">x1</text>

  <rect x="390" y="194" width="120" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="450" y="214" text-anchor="middle" font-size="13" fill="#202124">bit=1 -&gt; use 3^4</text>
  <text x="450" y="231" text-anchor="middle" font-size="11" fill="#5F6368">x81</text>

  <rect x="560" y="194" width="120" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="620" y="214" text-anchor="middle" font-size="13" fill="#202124">bit=1 -&gt; use 3^8</text>
  <text x="620" y="231" text-anchor="middle" font-size="11" fill="#5F6368">x6561</text>

  <!-- Result -->
  <rect x="210" y="284" width="300" height="52" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="306" text-anchor="middle" font-size="14" fill="#202124">3 x 81 x 6561 = 1594323 = 3^13</text>
  <text x="360" y="324" text-anchor="middle" font-size="11" fill="#5F6368">4 multiplies, not 12</text>

  <line x1="110" y1="238" x2="330" y2="284" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="238" x2="390" y2="284" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="238" x2="430" y2="284" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="360" y="366" text-anchor="middle" font-size="11" fill="#5F6368">Each bit doubles the exponent, so n needs only log2(n) squarings.</text>
</svg>
