<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#202124" font-weight="600">Sieve of Eratosthenes up to 30</text>

  <!-- Legend -->
  <rect x="120" y="40" width="18" height="18" rx="4" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="146" y="54" font-size="11" fill="#202124">prime</text>
  <rect x="220" y="40" width="18" height="18" rx="4" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="246" y="54" font-size="11" fill="#202124">crossed out (composite)</text>
  <rect x="420" y="40" width="18" height="18" rx="4" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="446" y="54" font-size="11" fill="#202124">not 1</text>

  <!-- Grid: numbers 1..30 in 6 columns -->
  <!-- Helper layout: x = 90 + col*90 (col 0..5), y = 90 + row*44 (row 0..4) -->

  <!-- Row 0: 1 2 3 4 5 6 -->
  <rect x="90"  y="78" width="64" height="34" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="122" y="100" text-anchor="middle" font-size="13" fill="#202124">1</text>
  <rect x="180" y="78" width="64" height="34" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="212" y="100" text-anchor="middle" font-size="13" fill="#202124">2</text>
  <rect x="270" y="78" width="64" height="34" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="302" y="100" text-anchor="middle" font-size="13" fill="#202124">3</text>
  <rect x="360" y="78" width="64" height="34" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="392" y="100" text-anchor="middle" font-size="13" fill="#202124">4</text>
  <rect x="450" y="78" width="64" height="34" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="482" y="100" text-anchor="middle" font-size="13" fill="#202124">5</text>
  <rect x="540" y="78" width="64" height="34" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="572" y="100" text-anchor="middle" font-size="13" fill="#202124">6</text>

  <!-- Row 1: 7 8 9 10 11 12 -->
  <rect x="90"  y="122" width="64" height="34" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="122" y="144" text-anchor="middle" font-size="13" fill="#202124">7</text>
  <rect x="180" y="122" width="64" height="34" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="212" y="144" text-anchor="middle" font-size="13" fill="#202124">8</text>
  <rect x="270" y="122" width="64" height="34" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="302" y="144" text-anchor="middle" font-size="13" fill="#202124">9</text>
  <rect x="360" y="122" width="64" height="34" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="392" y="144" text-anchor="middle" font-size="13" fill="#202124">10</text>
  <rect x="450" y="122" width="64" height="34" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="482" y="144" text-anchor="middle" font-size="13" fill="#202124">11</text>
  <rect x="540" y="122" width="64" height="34" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="572" y="144" text-anchor="middle" font-size="13" fill="#202124">12</text>

  <!-- Row 2: 13 14 15 16 17 18 -->
  <rect x="90"  y="166" width="64" height="34" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="122" y="188" text-anchor="middle" font-size="13" fill="#202124">13</text>
  <rect x="180" y="166" width="64" height="34" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="212" y="188" text-anchor="middle" font-size="13" fill="#202124">14</text>
  <rect x="270" y="166" width="64" height="34" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="302" y="188" text-anchor="middle" font-size="13" fill="#202124">15</text>
  <rect x="360" y="166" width="64" height="34" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="392" y="188" text-anchor="middle" font-size="13" fill="#202124">16</text>
  <rect x="450" y="166" width="64" height="34" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="482" y="188" text-anchor="middle" font-size="13" fill="#202124">17</text>
  <rect x="540" y="166" width="64" height="34" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="572" y="188" text-anchor="middle" font-size="13" fill="#202124">18</text>

  <!-- Row 3: 19 20 21 22 23 24 -->
  <rect x="90"  y="210" width="64" height="34" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="122" y="232" text-anchor="middle" font-size="13" fill="#202124">19</text>
  <rect x="180" y="210" width="64" height="34" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="212" y="232" text-anchor="middle" font-size="13" fill="#202124">20</text>
  <rect x="270" y="210" width="64" height="34" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="302" y="232" text-anchor="middle" font-size="13" fill="#202124">21</text>
  <rect x="360" y="210" width="64" height="34" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="392" y="232" text-anchor="middle" font-size="13" fill="#202124">22</text>
  <rect x="450" y="210" width="64" height="34" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="482" y="232" text-anchor="middle" font-size="13" fill="#202124">23</text>
  <rect x="540" y="210" width="64" height="34" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="572" y="232" text-anchor="middle" font-size="13" fill="#202124">24</text>

  <!-- Row 4: 25 26 27 28 29 30 -->
  <rect x="90"  y="254" width="64" height="34" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="122" y="276" text-anchor="middle" font-size="13" fill="#202124">25</text>
  <rect x="180" y="254" width="64" height="34" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="212" y="276" text-anchor="middle" font-size="13" fill="#202124">26</text>
  <rect x="270" y="254" width="64" height="34" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="302" y="276" text-anchor="middle" font-size="13" fill="#202124">27</text>
  <rect x="360" y="254" width="64" height="34" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="392" y="276" text-anchor="middle" font-size="13" fill="#202124">28</text>
  <rect x="450" y="254" width="64" height="34" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="482" y="276" text-anchor="middle" font-size="13" fill="#202124">29</text>
  <rect x="540" y="254" width="64" height="34" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="572" y="276" text-anchor="middle" font-size="13" fill="#202124">30</text>

  <text x="360" y="318" text-anchor="middle" font-size="13" fill="#202124">Start at 2, cross out every multiple. Then 3, then 5. Survivors are prime.</text>
  <text x="360" y="340" text-anchor="middle" font-size="11" fill="#5F6368">Once you pass sqrt(30) about 5.5, all composites are already crossed out.</text>
</svg>
