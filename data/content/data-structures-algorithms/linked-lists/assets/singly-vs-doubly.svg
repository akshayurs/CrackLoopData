<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="15" fill="#202124" font-weight="bold">Singly linked list (one-way)</text>

  <!-- singly nodes -->
  <g>
    <rect x="20" y="50" width="120" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
    <line x1="100" y1="50" x2="100" y2="106" stroke="#4285F4" stroke-width="1.5"/>
    <text x="60" y="84" font-size="15" fill="#202124" text-anchor="middle">10</text>
    <text x="120" y="84" font-size="12" fill="#202124" text-anchor="middle">next</text>

    <rect x="200" y="50" width="120" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
    <line x1="280" y1="50" x2="280" y2="106" stroke="#4285F4" stroke-width="1.5"/>
    <text x="240" y="84" font-size="15" fill="#202124" text-anchor="middle">20</text>
    <text x="300" y="84" font-size="12" fill="#202124" text-anchor="middle">next</text>

    <rect x="380" y="50" width="120" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
    <line x1="460" y1="50" x2="460" y2="106" stroke="#4285F4" stroke-width="1.5"/>
    <text x="420" y="84" font-size="15" fill="#202124" text-anchor="middle">30</text>
    <text x="480" y="84" font-size="12" fill="#202124" text-anchor="middle">next</text>

    <text x="560" y="84" font-size="13" fill="#9AA0A6" text-anchor="middle">null</text>

    <line x1="140" y1="78" x2="196" y2="78" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="320" y1="78" x2="376" y2="78" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="500" y1="78" x2="540" y2="78" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <text x="20" y="170" font-size="15" fill="#202124" font-weight="bold">Doubly linked list (two-way)</text>

  <!-- doubly nodes -->
  <g>
    <rect x="60" y="195" width="150" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
    <line x1="105" y1="195" x2="105" y2="251" stroke="#34A853" stroke-width="1.5"/>
    <line x1="165" y1="195" x2="165" y2="251" stroke="#34A853" stroke-width="1.5"/>
    <text x="82" y="229" font-size="11" fill="#202124" text-anchor="middle">prev</text>
    <text x="135" y="229" font-size="15" fill="#202124" text-anchor="middle">10</text>
    <text x="188" y="229" font-size="11" fill="#202124" text-anchor="middle">next</text>

    <rect x="290" y="195" width="150" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
    <line x1="335" y1="195" x2="335" y2="251" stroke="#34A853" stroke-width="1.5"/>
    <line x1="395" y1="195" x2="395" y2="251" stroke="#34A853" stroke-width="1.5"/>
    <text x="312" y="229" font-size="11" fill="#202124" text-anchor="middle">prev</text>
    <text x="365" y="229" font-size="15" fill="#202124" text-anchor="middle">20</text>
    <text x="418" y="229" font-size="11" fill="#202124" text-anchor="middle">next</text>

    <rect x="520" y="195" width="150" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
    <line x1="565" y1="195" x2="565" y2="251" stroke="#34A853" stroke-width="1.5"/>
    <line x1="625" y1="195" x2="625" y2="251" stroke="#34A853" stroke-width="1.5"/>
    <text x="542" y="229" font-size="11" fill="#202124" text-anchor="middle">prev</text>
    <text x="595" y="229" font-size="15" fill="#202124" text-anchor="middle">30</text>
    <text x="648" y="229" font-size="11" fill="#202124" text-anchor="middle">next</text>

    <line x1="210" y1="216" x2="286" y2="216" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="290" y1="236" x2="214" y2="236" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="440" y1="216" x2="516" y2="216" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="520" y1="236" x2="444" y2="236" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <text x="135" y="285" font-size="11" fill="#9AA0A6" text-anchor="middle">prev = null</text>
  <text x="595" y="285" font-size="11" fill="#9AA0A6" text-anchor="middle">next = null</text>
</svg>
