<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="15" fill="#202124" font-weight="bold">In-place reversal: rewiring one pointer</text>

  <text x="20" y="70" font-size="13" fill="#202124" font-weight="bold">Before this step</text>
  <rect x="120" y="85" width="90" height="50" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="165" y="115" font-size="15" fill="#202124" text-anchor="middle">prev</text>
  <rect x="280" y="85" width="90" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="325" y="115" font-size="15" fill="#202124" text-anchor="middle">curr</text>
  <rect x="440" y="85" width="90" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="485" y="115" font-size="15" fill="#202124" text-anchor="middle">next</text>

  <line x1="280" y1="110" x2="216" y2="110" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="370" y1="110" x2="436" y2="110" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="20" y="200" font-size="13" fill="#202124" font-weight="bold">After: curr.next points back</text>
  <rect x="120" y="215" width="90" height="50" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="165" y="245" font-size="15" fill="#202124" text-anchor="middle">prev</text>
  <rect x="280" y="215" width="90" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="325" y="245" font-size="15" fill="#202124" text-anchor="middle">curr</text>
  <rect x="440" y="215" width="90" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="485" y="245" font-size="15" fill="#202124" text-anchor="middle">next</text>

  <line x1="280" y1="240" x2="216" y2="240" stroke="#EA4335" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="248" y="290" font-size="11" fill="#EA4335" text-anchor="middle">reversed link</text>

  <text x="20" y="320" font-size="12" fill="#202124">Save next, flip curr.next to prev, then slide prev and curr forward by one</text>
</svg>
