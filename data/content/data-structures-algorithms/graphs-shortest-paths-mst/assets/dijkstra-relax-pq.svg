<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" fill="#202124" font-weight="bold">Dijkstra: pop cheapest, relax its edges</text>

  <!-- graph nodes -->
  <circle cx="120" cy="120" r="34" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="120" y="118" font-size="15" fill="#202124" text-anchor="middle">S</text>
  <text x="120" y="135" font-size="12" fill="#9AA0A6" text-anchor="middle">d=0</text>

  <circle cx="300" cy="70" r="34" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="300" y="68" font-size="15" fill="#202124" text-anchor="middle">A</text>
  <text x="300" y="85" font-size="12" fill="#9AA0A6" text-anchor="middle">d=2</text>

  <circle cx="300" cy="200" r="34" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="300" y="198" font-size="15" fill="#202124" text-anchor="middle">B</text>
  <text x="300" y="215" font-size="12" fill="#9AA0A6" text-anchor="middle">d=5</text>

  <circle cx="480" cy="120" r="34" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="480" y="118" font-size="15" fill="#202124" text-anchor="middle">C</text>
  <text x="480" y="135" font-size="12" fill="#9AA0A6" text-anchor="middle">d=4</text>

  <!-- edges -->
  <line x1="151" y1="106" x2="270" y2="80" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="82" font-size="11" fill="#9AA0A6">2</text>
  <line x1="151" y1="134" x2="270" y2="190" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="178" font-size="11" fill="#9AA0A6">5</text>
  <line x1="332" y1="82" x2="452" y2="108" stroke="#34A853" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="395" y="86" font-size="11" fill="#34A853">2 (relax!)</text>
  <line x1="332" y1="190" x2="452" y2="135" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="395" y="185" font-size="11" fill="#9AA0A6">3</text>

  <!-- priority queue -->
  <rect x="560" y="60" width="140" height="240" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="630" y="82" font-size="13" fill="#202124" text-anchor="middle" font-weight="bold">min-heap PQ</text>
  <rect x="575" y="95" width="110" height="34" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="630" y="117" font-size="13" fill="#202124" text-anchor="middle">(C, 4) ↑ top</text>
  <rect x="575" y="135" width="110" height="34" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="630" y="157" font-size="13" fill="#202124" text-anchor="middle">(B, 5)</text>
  <text x="630" y="200" font-size="11" fill="#9AA0A6" text-anchor="middle">pop min,</text>
  <text x="630" y="216" font-size="11" fill="#9AA0A6" text-anchor="middle">push improved</text>
  <text x="630" y="232" font-size="11" fill="#9AA0A6" text-anchor="middle">neighbors</text>
</svg>
