<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">BFS vs DFS — same graph, start at A</text>

  <!-- BFS side -->
  <text x="180" y="54" text-anchor="middle" font-size="13" fill="#202124" font-weight="bold">BFS (queue) — level by level</text>
  <!-- nodes -->
  <circle cx="180" cy="90" r="18" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="180" y="95" text-anchor="middle" font-size="13">A</text>
  <circle cx="120" cy="160" r="18" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="120" y="165" text-anchor="middle" font-size="13">B</text>
  <circle cx="240" cy="160" r="18" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="240" y="165" text-anchor="middle" font-size="13">C</text>
  <circle cx="120" cy="230" r="18" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="120" y="235" text-anchor="middle" font-size="13">D</text>
  <circle cx="240" cy="230" r="18" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/><text x="240" y="235" text-anchor="middle" font-size="13">E</text>
  <line x1="168" y1="104" x2="132" y2="146" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="192" y1="104" x2="228" y2="146" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="120" y1="178" x2="120" y2="212" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="240" y1="178" x2="240" y2="212" stroke="#5F6368" stroke-width="1.5"/>
  <text x="180" y="290" text-anchor="middle" font-size="12" fill="#202124" font-weight="bold">Visit order: A, B, C, D, E</text>
  <text x="180" y="310" text-anchor="middle" font-size="11" fill="#202124">closest first → shortest unweighted path</text>

  <!-- divider -->
  <line x1="360" y1="50" x2="360" y2="320" stroke="#9AA0A6" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- DFS side -->
  <text x="540" y="54" text-anchor="middle" font-size="13" fill="#202124" font-weight="bold">DFS (stack) — deep then back</text>
  <circle cx="540" cy="90" r="18" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="540" y="95" text-anchor="middle" font-size="13">A</text>
  <circle cx="480" cy="160" r="18" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="480" y="165" text-anchor="middle" font-size="13">B</text>
  <circle cx="600" cy="160" r="18" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="600" y="165" text-anchor="middle" font-size="13">C</text>
  <circle cx="480" cy="230" r="18" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="480" y="235" text-anchor="middle" font-size="13">D</text>
  <circle cx="600" cy="230" r="18" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="600" y="235" text-anchor="middle" font-size="13">E</text>
  <line x1="528" y1="104" x2="492" y2="146" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="552" y1="104" x2="588" y2="146" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="480" y1="178" x2="480" y2="212" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="600" y1="178" x2="600" y2="212" stroke="#5F6368" stroke-width="1.5"/>
  <text x="540" y="290" text-anchor="middle" font-size="12" fill="#202124" font-weight="bold">Visit order: A, B, D, C, E</text>
  <text x="540" y="310" text-anchor="middle" font-size="11" fill="#202124">follow one branch to the end first</text>

  <text x="360" y="352" text-anchor="middle" font-size="12" fill="#202124">Both are O(V+E). Only the data structure (queue vs stack) differs.</text>
</svg>
