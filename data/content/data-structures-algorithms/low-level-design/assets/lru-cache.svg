<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="15" fill="#202124" font-weight="bold">LRU cache = HashMap + Doubly-Linked List</text>

  <!-- HashMap -->
  <rect x="30" y="70" width="150" height="200" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="105" y="92" font-size="13" fill="#202124" text-anchor="middle" font-weight="bold">HashMap</text>
  <text x="105" y="108" font-size="11" fill="#9AA0A6" text-anchor="middle">key &#8594; node</text>

  <rect x="50" y="120" width="110" height="32" rx="6" fill="#FFFFFF" stroke="#4285F4" stroke-width="1.5"/>
  <text x="105" y="141" font-size="12" fill="#202124" text-anchor="middle">A &#8594; *</text>
  <rect x="50" y="160" width="110" height="32" rx="6" fill="#FFFFFF" stroke="#4285F4" stroke-width="1.5"/>
  <text x="105" y="181" font-size="12" fill="#202124" text-anchor="middle">B &#8594; *</text>
  <rect x="50" y="200" width="110" height="32" rx="6" fill="#FFFFFF" stroke="#4285F4" stroke-width="1.5"/>
  <text x="105" y="221" font-size="12" fill="#202124" text-anchor="middle">C &#8594; *</text>

  <!-- DLL header -->
  <text x="450" y="60" font-size="12" fill="#9AA0A6" text-anchor="middle">most recent &#8592;&#8594; least recent</text>

  <!-- DLL nodes -->
  <rect x="300" y="120" width="90" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="345" y="142" font-size="13" fill="#202124" text-anchor="middle">A</text>
  <text x="345" y="159" font-size="11" fill="#9AA0A6" text-anchor="middle">val 1</text>

  <rect x="430" y="120" width="90" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="475" y="142" font-size="13" fill="#202124" text-anchor="middle">B</text>
  <text x="475" y="159" font-size="11" fill="#9AA0A6" text-anchor="middle">val 2</text>

  <rect x="560" y="120" width="90" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="605" y="142" font-size="13" fill="#202124" text-anchor="middle">C</text>
  <text x="605" y="159" font-size="11" fill="#9AA0A6" text-anchor="middle">val 3 (LRU)</text>

  <!-- DLL forward arrows -->
  <line x1="390" y1="138" x2="428" y2="138" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="138" x2="558" y2="138" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- DLL backward arrows -->
  <line x1="428" y1="155" x2="390" y2="155" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="558" y1="155" x2="520" y2="155" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- map to node pointers -->
  <line x1="160" y1="136" x2="298" y2="136" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="160" y1="176" x2="428" y2="150" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="160" y1="216" x2="558" y2="158" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- evict note -->
  <rect x="500" y="220" width="170" height="60" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="585" y="244" font-size="12" fill="#202124" text-anchor="middle">Evict from tail</text>
  <text x="585" y="262" font-size="11" fill="#9AA0A6" text-anchor="middle">O(1) remove</text>
  <line x1="605" y1="170" x2="595" y2="218" stroke="#EA4335" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- get/put note -->
  <rect x="30" y="300" width="640" height="44" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="350" y="327" font-size="12" fill="#202124" text-anchor="middle">get/put: map lookup O(1), then move node to head O(1)</text>
</svg>
