<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="15" fill="#202124" font-weight="bold">Parking lot class diagram</text>

  <!-- ParkingLot -->
  <rect x="270" y="55" width="180" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="80" font-size="13" fill="#202124" text-anchor="middle" font-weight="bold">ParkingLot</text>
  <text x="360" y="99" font-size="11" fill="#9AA0A6" text-anchor="middle">park / unpark</text>

  <!-- Level -->
  <rect x="270" y="160" width="180" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="185" font-size="13" fill="#202124" text-anchor="middle" font-weight="bold">Level</text>
  <text x="360" y="204" font-size="11" fill="#9AA0A6" text-anchor="middle">floor of spots</text>

  <!-- Spot -->
  <rect x="270" y="265" width="180" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="290" font-size="13" fill="#202124" text-anchor="middle" font-weight="bold">ParkingSpot</text>
  <text x="360" y="309" font-size="11" fill="#9AA0A6" text-anchor="middle">size, isFree</text>

  <!-- Vehicle abstract -->
  <rect x="510" y="265" width="180" height="60" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="600" y="290" font-size="13" fill="#202124" text-anchor="middle" font-weight="bold">Vehicle (abstract)</text>
  <text x="600" y="309" font-size="11" fill="#9AA0A6" text-anchor="middle">size</text>

  <!-- Vehicle subclasses -->
  <rect x="490" y="360" width="120" height="42" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="550" y="386" font-size="12" fill="#202124" text-anchor="middle">Car</text>
  <rect x="625" y="360" width="80" height="42" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="665" y="386" font-size="12" fill="#202124" text-anchor="middle">Bus</text>

  <!-- Ticket -->
  <rect x="30" y="265" width="180" height="60" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="120" y="290" font-size="13" fill="#202124" text-anchor="middle" font-weight="bold">Ticket</text>
  <text x="120" y="309" font-size="11" fill="#9AA0A6" text-anchor="middle">entry time, fee</text>

  <!-- compositions -->
  <line x1="360" y1="115" x2="360" y2="158" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="395" y="142" font-size="11" fill="#9AA0A6" text-anchor="middle">1..*</text>
  <line x1="360" y1="220" x2="360" y2="263" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="395" y="247" font-size="11" fill="#9AA0A6" text-anchor="middle">1..*</text>

  <!-- spot holds vehicle -->
  <line x1="450" y1="295" x2="508" y2="295" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="479" y="285" font-size="11" fill="#9AA0A6" text-anchor="middle">holds</text>

  <!-- inheritance -->
  <line x1="560" y1="358" x2="585" y2="327" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="358" x2="615" y2="327" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ticket issued by lot -->
  <line x1="270" y1="295" x2="212" y2="295" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="241" y="285" font-size="11" fill="#9AA0A6" text-anchor="middle">issues</text>
</svg>
