<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="15" fill="#202124" font-weight="bold">Elevator state machine</text>

  <!-- IDLE -->
  <rect x="290" y="60" width="140" height="56" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="84" font-size="14" fill="#202124" text-anchor="middle" font-weight="bold">IDLE</text>
  <text x="360" y="102" font-size="11" fill="#9AA0A6" text-anchor="middle">doors closed</text>

  <!-- MOVING UP -->
  <rect x="60" y="180" width="160" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="140" y="204" font-size="14" fill="#202124" text-anchor="middle" font-weight="bold">MOVING UP</text>
  <text x="140" y="222" font-size="11" fill="#9AA0A6" text-anchor="middle">serving up queue</text>

  <!-- MOVING DOWN -->
  <rect x="500" y="180" width="160" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="580" y="204" font-size="14" fill="#202124" text-anchor="middle" font-weight="bold">MOVING DOWN</text>
  <text x="580" y="222" font-size="11" fill="#9AA0A6" text-anchor="middle">serving down queue</text>

  <!-- DOORS OPEN -->
  <rect x="290" y="180" width="140" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="204" font-size="14" fill="#202124" text-anchor="middle" font-weight="bold">DOORS OPEN</text>
  <text x="360" y="222" font-size="11" fill="#9AA0A6" text-anchor="middle">load/unload</text>

  <!-- transitions -->
  <line x1="300" y1="110" x2="170" y2="178" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="140" font-size="11" fill="#9AA0A6" text-anchor="middle">request above</text>

  <line x1="420" y1="110" x2="550" y2="178" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="140" font-size="11" fill="#9AA0A6" text-anchor="middle">request below</text>

  <line x1="220" y1="200" x2="288" y2="200" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="254" y="172" font-size="11" fill="#9AA0A6" text-anchor="middle">arrive</text>

  <line x1="500" y1="208" x2="432" y2="208" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="466" y="230" font-size="11" fill="#9AA0A6" text-anchor="middle">arrive</text>

  <line x1="360" y1="178" x2="360" y2="118" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="150" font-size="11" fill="#9AA0A6" text-anchor="middle">queue empty</text>

  <!-- doors open back to moving -->
  <line x1="345" y1="236" x2="180" y2="270" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="375" y1="236" x2="540" y2="270" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="120" y="262" width="480" height="44" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="289" font-size="12" fill="#202124" text-anchor="middle">after timeout, resume in same direction if more requests remain</text>
</svg>
