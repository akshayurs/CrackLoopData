<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Level 0 -->
  <rect x="310" y="30" width="100" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="52" font-size="15" fill="#202124" text-anchor="middle">n</text>
  <text x="360" y="68" font-size="12" fill="#202124" text-anchor="middle">cost n</text>
  <text x="560" y="56" font-size="12" fill="#34A853" text-anchor="start">work = n</text>

  <!-- Level 1 -->
  <rect x="180" y="140" width="100" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="230" y="162" font-size="15" fill="#202124" text-anchor="middle">n/2</text>
  <text x="230" y="178" font-size="12" fill="#202124" text-anchor="middle">cost n/2</text>
  <rect x="440" y="140" width="100" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="490" y="162" font-size="15" fill="#202124" text-anchor="middle">n/2</text>
  <text x="490" y="178" font-size="12" fill="#202124" text-anchor="middle">cost n/2</text>
  <text x="560" y="166" font-size="12" fill="#34A853" text-anchor="start">work = n</text>

  <line x1="345" y1="74" x2="240" y2="138" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="375" y1="74" x2="480" y2="138" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Level 2 -->
  <rect x="110" y="250" width="76" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="148" y="275" font-size="13" fill="#202124" text-anchor="middle">n/4</text>
  <rect x="240" y="250" width="76" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="278" y="275" font-size="13" fill="#202124" text-anchor="middle">n/4</text>
  <rect x="404" y="250" width="76" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="442" y="275" font-size="13" fill="#202124" text-anchor="middle">n/4</text>
  <rect x="534" y="250" width="76" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="572" y="275" font-size="13" fill="#202124" text-anchor="middle">n/4</text>
  <text x="640" y="274" font-size="12" fill="#34A853" text-anchor="middle">n</text>

  <line x1="215" y1="184" x2="160" y2="248" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="245" y1="184" x2="278" y2="248" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="184" x2="442" y2="248" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="505" y1="184" x2="560" y2="248" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="360" y="335" font-size="13" fill="#202124" text-anchor="middle">… log₂n levels …</text>
  <text x="360" y="375" font-size="14" fill="#202124" text-anchor="middle">each level costs n → total = n × log₂n</text>
  <text x="360" y="398" font-size="14" fill="#EA4335" text-anchor="middle" font-weight="bold">T(n) = O(n log n)</text>
</svg>
