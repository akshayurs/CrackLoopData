<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="180" y="28" text-anchor="middle" font-size="15" fill="#202124" font-weight="600">Balanced — height ≈ log n</text>
  <text x="540" y="28" text-anchor="middle" font-size="15" fill="#202124" font-weight="600">Skewed — height = n</text>

  <!-- divider -->
  <line x1="360" y1="50" x2="360" y2="360" stroke="#9AA0A6" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- BALANCED edges -->
  <line x1="180" y1="80" x2="110" y2="140" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="180" y1="80" x2="250" y2="140" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="110" y1="160" x2="70" y2="220" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="110" y1="160" x2="150" y2="220" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="250" y1="160" x2="210" y2="220" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="250" y1="160" x2="290" y2="220" stroke="#5F6368" stroke-width="1.5"/>

  <!-- BALANCED nodes -->
  <circle cx="180" cy="75" r="20" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="180" y="80" text-anchor="middle" font-size="13" fill="#202124">4</text>
  <circle cx="110" cy="150" r="20" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="110" y="155" text-anchor="middle" font-size="13" fill="#202124">2</text>
  <circle cx="250" cy="150" r="20" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="250" y="155" text-anchor="middle" font-size="13" fill="#202124">6</text>
  <circle cx="70" cy="230" r="20" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="70" y="235" text-anchor="middle" font-size="13" fill="#202124">1</text>
  <circle cx="150" cy="230" r="20" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="150" y="235" text-anchor="middle" font-size="13" fill="#202124">3</text>
  <circle cx="210" cy="230" r="20" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="210" y="235" text-anchor="middle" font-size="13" fill="#202124">5</text>
  <circle cx="290" cy="230" r="20" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="290" y="235" text-anchor="middle" font-size="13" fill="#202124">7</text>

  <text x="180" y="300" text-anchor="middle" font-size="12" fill="#202124">7 nodes, height 2</text>
  <text x="180" y="320" text-anchor="middle" font-size="12" fill="#34A853">search ≈ 3 steps</text>

  <!-- SKEWED edges -->
  <line x1="470" y1="80" x2="510" y2="140" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="510" y1="160" x2="550" y2="220" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="550" y1="240" x2="590" y2="300" stroke="#5F6368" stroke-width="1.5"/>

  <!-- SKEWED nodes -->
  <circle cx="470" cy="75" r="20" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="470" y="80" text-anchor="middle" font-size="13" fill="#202124">1</text>
  <circle cx="510" cy="150" r="20" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="510" y="155" text-anchor="middle" font-size="13" fill="#202124">2</text>
  <circle cx="550" cy="230" r="20" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="550" y="235" text-anchor="middle" font-size="13" fill="#202124">3</text>
  <circle cx="590" cy="310" r="20" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/><text x="590" y="315" text-anchor="middle" font-size="13" fill="#202124">4</text>

  <text x="540" y="350" text-anchor="middle" font-size="12" fill="#202124">n nodes, height n−1</text>
  <text x="540" y="370" text-anchor="middle" font-size="12" fill="#EA4335">search ≈ n steps (a list)</text>
</svg>
