<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#202124" font-weight="600">Binary tree — visit order per traversal</text>

  <!-- edges -->
  <line x1="200" y1="90" x2="120" y2="160" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="200" y1="90" x2="280" y2="160" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="120" y1="190" x2="70" y2="250" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="120" y1="190" x2="170" y2="250" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="280" y1="190" x2="330" y2="250" stroke="#5F6368" stroke-width="1.5"/>

  <!-- nodes -->
  <circle cx="200" cy="90" r="26" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="200" y="96" text-anchor="middle" font-size="15" fill="#202124">F</text>

  <circle cx="120" cy="175" r="26" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="120" y="181" text-anchor="middle" font-size="15" fill="#202124">B</text>

  <circle cx="280" cy="175" r="26" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="280" y="181" text-anchor="middle" font-size="15" fill="#202124">G</text>

  <circle cx="70" cy="265" r="26" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="70" y="271" text-anchor="middle" font-size="15" fill="#202124">A</text>

  <circle cx="170" cy="265" r="26" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="170" y="271" text-anchor="middle" font-size="15" fill="#202124">D</text>

  <circle cx="330" cy="265" r="26" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="330" y="271" text-anchor="middle" font-size="15" fill="#202124">I</text>

  <!-- legend -->
  <rect x="450" y="70" width="230" height="220" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="565" y="96" text-anchor="middle" font-size="13" fill="#202124" font-weight="600">Visit sequence</text>

  <text x="470" y="128" font-size="12" fill="#34A853" font-weight="600">In-order (L,N,R):</text>
  <text x="470" y="146" font-size="12" fill="#202124">A  B  D  F  G  I  (sorted)</text>

  <text x="470" y="178" font-size="12" fill="#4285F4" font-weight="600">Pre-order (N,L,R):</text>
  <text x="470" y="196" font-size="12" fill="#202124">F  B  A  D  G  I</text>

  <text x="470" y="228" font-size="12" fill="#EA4335" font-weight="600">Post-order (L,R,N):</text>
  <text x="470" y="246" font-size="12" fill="#202124">A  D  B  I  G  F</text>

  <text x="470" y="278" font-size="12" fill="#FBBC04" font-weight="600">Level-order: F B G A D I</text>
</svg>
