<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#202124" font-weight="600">Cue in the problem maps to technique</text>

  <!-- left column: cues (neutral), right column: techniques (primary) -->
  <!-- Row 1 -->
  <rect x="30" y="52" width="270" height="46" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="165" y="80" text-anchor="middle" font-size="13" fill="#202124">contiguous subarray / window</text>
  <rect x="430" y="52" width="260" height="46" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="560" y="80" text-anchor="middle" font-size="13" fill="#202124">Sliding window</text>
  <line x1="300" y1="75" x2="428" y2="75" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <rect x="30" y="108" width="270" height="46" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="165" y="136" text-anchor="middle" font-size="13" fill="#202124">sorted array / pair sum</text>
  <rect x="430" y="108" width="260" height="46" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="560" y="136" text-anchor="middle" font-size="13" fill="#202124">Two pointers</text>
  <line x1="300" y1="131" x2="428" y2="131" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 3 -->
  <rect x="30" y="164" width="270" height="46" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="165" y="192" text-anchor="middle" font-size="13" fill="#202124">seen-before / dedupe / count</text>
  <rect x="430" y="164" width="260" height="46" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="560" y="192" text-anchor="middle" font-size="13" fill="#202124">Hash map / set</text>
  <line x1="300" y1="187" x2="428" y2="187" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 4 -->
  <rect x="30" y="220" width="270" height="46" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="165" y="248" text-anchor="middle" font-size="13" fill="#202124">shortest path / level order</text>
  <rect x="430" y="220" width="260" height="46" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="560" y="248" text-anchor="middle" font-size="13" fill="#202124">BFS on graph</text>
  <line x1="300" y1="243" x2="428" y2="243" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 5 -->
  <rect x="30" y="276" width="270" height="46" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="165" y="304" text-anchor="middle" font-size="13" fill="#202124">count ways / min cost / overlap</text>
  <rect x="430" y="276" width="260" height="46" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="560" y="304" text-anchor="middle" font-size="13" fill="#202124">Dynamic programming</text>
  <line x1="300" y1="299" x2="428" y2="299" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 6 -->
  <rect x="30" y="332" width="270" height="46" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="165" y="360" text-anchor="middle" font-size="13" fill="#202124">top K / k-th / running max</text>
  <rect x="430" y="332" width="260" height="46" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="560" y="360" text-anchor="middle" font-size="13" fill="#202124">Heap / priority queue</text>
  <line x1="300" y1="355" x2="428" y2="355" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="360" y="404" text-anchor="middle" font-size="13" fill="#202124">Read the cue on the left, name the technique on the right before you code.</text>
</svg>
