<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- STACK side -->
  <text x="170" y="34" font-size="16" font-weight="600" fill="#202124" text-anchor="middle">Stack — LIFO</text>
  <text x="170" y="54" font-size="12" fill="#5F6368" text-anchor="middle">push / pop at the TOP</text>

  <!-- stack cells, top at the top -->
  <rect x="110" y="120" width="120" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="170" y="148" font-size="15" fill="#202124" text-anchor="middle">30  (top)</text>

  <rect x="110" y="170" width="120" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="170" y="198" font-size="15" fill="#202124" text-anchor="middle">20</text>

  <rect x="110" y="220" width="120" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="170" y="248" font-size="15" fill="#202124" text-anchor="middle">10  (bottom)</text>

  <!-- push arrow in -->
  <line x1="170" y1="90" x2="170" y2="116" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="100" font-size="11" fill="#34A853" text-anchor="middle">push 30</text>
  <!-- pop arrow out -->
  <line x1="240" y1="142" x2="300" y2="142" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="290" y="132" font-size="11" fill="#EA4335" text-anchor="middle">pop → 30</text>

  <!-- divider -->
  <line x1="360" y1="70" x2="360" y2="360" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- QUEUE side -->
  <text x="540" y="34" font-size="16" font-weight="600" fill="#202124" text-anchor="middle">Queue — FIFO</text>
  <text x="540" y="54" font-size="12" fill="#5F6368" text-anchor="middle">enqueue at back, dequeue at front</text>

  <rect x="420" y="170" width="80" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="460" y="198" font-size="15" fill="#202124" text-anchor="middle">10</text>

  <rect x="500" y="170" width="80" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="540" y="198" font-size="15" fill="#202124" text-anchor="middle">20</text>

  <rect x="580" y="170" width="80" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="620" y="198" font-size="15" fill="#202124" text-anchor="middle">30</text>

  <text x="460" y="240" font-size="12" fill="#5F6368" text-anchor="middle">front</text>
  <text x="620" y="240" font-size="12" fill="#5F6368" text-anchor="middle">back</text>

  <!-- dequeue out front -->
  <line x1="418" y1="192" x2="370" y2="192" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="395" y="156" font-size="11" fill="#EA4335" text-anchor="middle">dequeue</text>
  <text x="395" y="282" font-size="11" fill="#EA4335" text-anchor="middle">→ 10</text>

  <!-- enqueue in back -->
  <line x1="660" y1="192" x2="690" y2="192" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="690" y1="120" x2="690" y2="190" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="690" y1="120" x2="662" y2="120" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="110" font-size="11" fill="#34A853" text-anchor="middle">enqueue 40</text>

  <text x="360" y="395" font-size="12" fill="#5F6368" text-anchor="middle">All ops O(1) — both structures touch only one end (queue touches both ends, but each in O(1)).</text>
</svg>
