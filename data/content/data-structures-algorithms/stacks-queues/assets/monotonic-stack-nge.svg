<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="30" font-size="16" font-weight="600" fill="#202124" text-anchor="middle">Monotonic stack — Next Greater Element</text>
  <text x="360" y="50" font-size="12" fill="#5F6368" text-anchor="middle">Input: [2, 1, 5, 3]   stack holds indices, values decreasing top→bottom</text>

  <!-- input array -->
  <rect x="150" y="72" width="60" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="180" y="98" font-size="15" fill="#202124" text-anchor="middle">2</text>
  <rect x="210" y="72" width="60" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="240" y="98" font-size="15" fill="#202124" text-anchor="middle">1</text>
  <rect x="270" y="72" width="60" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="300" y="98" font-size="15" fill="#202124" text-anchor="middle">5</text>
  <rect x="330" y="72" width="60" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="98" font-size="15" fill="#202124" text-anchor="middle">3</text>

  <!-- step rows -->
  <text x="60" y="160" font-size="13" font-weight="600" fill="#202124">see 2</text>
  <rect x="150" y="140" width="80" height="36" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="190" y="163" font-size="13" fill="#202124" text-anchor="middle">[2]</text>
  <text x="300" y="163" font-size="12" fill="#5F6368">stack empty → push 2</text>

  <text x="60" y="216" font-size="13" font-weight="600" fill="#202124">see 1</text>
  <rect x="150" y="196" width="80" height="36" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="190" y="219" font-size="13" fill="#202124" text-anchor="middle">[2, 1]</text>
  <text x="300" y="219" font-size="12" fill="#5F6368">1 &lt; 2 → just push 1</text>

  <text x="60" y="272" font-size="13" font-weight="600" fill="#202124">see 5</text>
  <rect x="150" y="252" width="80" height="36" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="190" y="275" font-size="13" fill="#202124" text-anchor="middle">[5]</text>
  <text x="300" y="275" font-size="12" fill="#EA4335">5 &gt; 1, 5 &gt; 2 → pop both: NGE(1)=5, NGE(2)=5</text>

  <text x="60" y="328" font-size="13" font-weight="600" fill="#202124">see 3</text>
  <rect x="150" y="308" width="80" height="36" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="190" y="331" font-size="13" fill="#202124" text-anchor="middle">[5, 3]</text>
  <text x="300" y="331" font-size="12" fill="#5F6368">3 &lt; 5 → push 3; leftovers have no NGE</text>

  <!-- result -->
  <text x="360" y="385" font-size="13" font-weight="600" fill="#202124" text-anchor="middle">Result: NGE = [5, 5, -1, -1]</text>

  <line x1="190" y1="178" x2="190" y2="194" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="190" y1="234" x2="190" y2="250" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="190" y1="290" x2="190" y2="306" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="360" y="425" font-size="12" fill="#5F6368" text-anchor="middle">Each index is pushed once and popped once → O(n) total, not O(n²).</text>
</svg>
