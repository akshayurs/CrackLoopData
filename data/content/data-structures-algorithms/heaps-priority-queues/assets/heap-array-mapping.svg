<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Binary heap as a tree</text>

  <!-- Tree nodes -->
  <g>
    <circle cx="360" cy="62" r="22" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
    <text x="360" y="60" text-anchor="middle" font-size="15" fill="#202124">9</text>
    <text x="360" y="75" text-anchor="middle" font-size="11" fill="#9AA0A6">i=0</text>

    <circle cx="240" cy="132" r="22" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
    <text x="240" y="130" text-anchor="middle" font-size="15" fill="#202124">7</text>
    <text x="240" y="145" text-anchor="middle" font-size="11" fill="#9AA0A6">i=1</text>

    <circle cx="480" cy="132" r="22" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
    <text x="480" y="130" text-anchor="middle" font-size="15" fill="#202124">8</text>
    <text x="480" y="145" text-anchor="middle" font-size="11" fill="#9AA0A6">i=2</text>

    <circle cx="180" cy="202" r="22" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
    <text x="180" y="200" text-anchor="middle" font-size="15" fill="#202124">3</text>
    <text x="180" y="215" text-anchor="middle" font-size="11" fill="#9AA0A6">i=3</text>

    <circle cx="300" cy="202" r="22" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
    <text x="300" y="200" text-anchor="middle" font-size="15" fill="#202124">6</text>
    <text x="300" y="215" text-anchor="middle" font-size="11" fill="#9AA0A6">i=4</text>

    <circle cx="540" cy="202" r="22" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
    <text x="540" y="200" text-anchor="middle" font-size="15" fill="#202124">5</text>
    <text x="540" y="215" text-anchor="middle" font-size="11" fill="#9AA0A6">i=5</text>
  </g>

  <!-- Tree edges -->
  <line x1="345" y1="78" x2="255" y2="116" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="375" y1="78" x2="465" y2="116" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="226" y1="148" x2="194" y2="186" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="254" y1="148" x2="286" y2="186" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="480" y1="154" x2="540" y2="186" stroke="#5F6368" stroke-width="1.5"/>

  <!-- Array row -->
  <text x="360" y="266" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Stored as a flat array (level by level)</text>
  <g>
    <rect x="150" y="284" width="60" height="44" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
    <text x="180" y="311" text-anchor="middle" font-size="15" fill="#202124">9</text>
    <text x="180" y="344" text-anchor="middle" font-size="11" fill="#9AA0A6">0</text>

    <rect x="210" y="284" width="60" height="44" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
    <text x="240" y="311" text-anchor="middle" font-size="15" fill="#202124">7</text>
    <text x="240" y="344" text-anchor="middle" font-size="11" fill="#9AA0A6">1</text>

    <rect x="270" y="284" width="60" height="44" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
    <text x="300" y="311" text-anchor="middle" font-size="15" fill="#202124">8</text>
    <text x="300" y="344" text-anchor="middle" font-size="11" fill="#9AA0A6">2</text>

    <rect x="330" y="284" width="60" height="44" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
    <text x="360" y="311" text-anchor="middle" font-size="15" fill="#202124">3</text>
    <text x="360" y="344" text-anchor="middle" font-size="11" fill="#9AA0A6">3</text>

    <rect x="390" y="284" width="60" height="44" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
    <text x="420" y="311" text-anchor="middle" font-size="15" fill="#202124">6</text>
    <text x="420" y="344" text-anchor="middle" font-size="11" fill="#9AA0A6">4</text>

    <rect x="450" y="284" width="60" height="44" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
    <text x="480" y="311" text-anchor="middle" font-size="15" fill="#202124">5</text>
    <text x="480" y="344" text-anchor="middle" font-size="11" fill="#9AA0A6">5</text>
  </g>

  <!-- Index math note -->
  <rect x="540" y="284" width="170" height="44" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="625" y="304" text-anchor="middle" font-size="12" fill="#202124">left=2i+1, right=2i+2</text>
  <text x="625" y="320" text-anchor="middle" font-size="12" fill="#202124">parent=(i-1)/2</text>
</svg>
