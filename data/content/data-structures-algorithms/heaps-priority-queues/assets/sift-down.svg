  <circle cx="430" cy="128" r="20" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="430" y="133" text-anchor="middle" font-size="14" fill="#202124">7</text>
  <circle cx="550" cy="128" r="20" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="550" y="133" text-anchor="middle" font-size="14" fill="#202124">5</text>
  <circle cx="390" cy="192" r="20" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="390" y="197" text-anchor="middle" font-size="14" fill="#202124">3</text>
  <circle cx="470" cy="192" r="20" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
