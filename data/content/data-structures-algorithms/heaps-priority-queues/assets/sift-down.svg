  <line x1="108" y1="146" x2="92" y2="178" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="132" y1="146" x2="148" y2="178" stroke="#5F6368" stroke-width="1.5"/>

  <!-- arrow to step 2 -->
  <line x1="280" y1="128" x2="330" y2="128" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="118" text-anchor="middle" font-size="11" fill="#5F6368">swap 8</text>

  <!-- Step 2 -->
  <text x="490" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">2. Swap with larger child</text>
  <circle cx="490" cy="64" r="20" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
