  <circle cx="80" cy="192" r="20" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="80" y="197" text-anchor="middle" font-size="14" fill="#202124">3</text>
  <circle cx="160" cy="192" r="20" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
