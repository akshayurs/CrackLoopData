  <!-- Step 3 -->
  <text x="360" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">3. 5 has no larger child below — heap property restored</text>
  <circle cx="360" cy="312" r="20" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="317" text-anchor="middle" font-size="14" fill="#202124">8</text>
  <circle cx="300" cy="376" r="20" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
