<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Rehash when load factor crosses the threshold</text>

  <!-- BEFORE: small table, getting full -->
  <text x="160" y="64" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">Before: 4 slots, 3 used</text>

  <rect x="100" y="80"  width="120" height="30" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="160" y="100" text-anchor="middle" font-size="12" fill="#202124">"cat"</text>
  <rect x="100" y="114" width="120" height="30" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="160" y="134" text-anchor="middle" font-size="12" fill="#202124">"dog"</text>
  <rect x="100" y="148" width="120" height="30" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="160" y="168" text-anchor="middle" font-size="12" fill="#202124">empty</text>
  <rect x="100" y="182" width="120" height="30" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="160" y="202" text-anchor="middle" font-size="12" fill="#202124">"fox"</text>

  <text x="160" y="240" text-anchor="middle" font-size="12" fill="#EA4335" font-weight="600">load factor = 3/4 = 0.75</text>
  <text x="160" y="258" text-anchor="middle" font-size="11" fill="#5F6368">hits threshold, grow + rehash</text>

  <!-- arrow across -->
  <line x1="232" y1="146" x2="328" y2="146" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="136" text-anchor="middle" font-size="11" fill="#5F6368">resize x2</text>

  <!-- AFTER: bigger table -->
  <text x="500" y="64" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">After: 8 slots, 3 used</text>

  <rect x="440" y="80"  width="120" height="26" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="500" y="98" text-anchor="middle" font-size="12" fill="#202124">"dog"</text>
  <rect x="440" y="110" width="120" height="26" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="500" y="128" text-anchor="middle" font-size="12" fill="#202124">empty</text>
  <rect x="440" y="140" width="120" height="26" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="500" y="158" text-anchor="middle" font-size="12" fill="#202124">"fox"</text>
  <rect x="440" y="170" width="120" height="26" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="500" y="188" text-anchor="middle" font-size="12" fill="#202124">empty</text>
  <rect x="440" y="200" width="120" height="26" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="500" y="218" text-anchor="middle" font-size="12" fill="#202124">"cat"</text>
  <rect x="440" y="230" width="120" height="26" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="500" y="248" text-anchor="middle" font-size="12" fill="#202124">empty</text>

  <text x="500" y="288" text-anchor="middle" font-size="12" fill="#34A853" font-weight="600">load factor = 3/8 = 0.375</text>
  <text x="500" y="306" text-anchor="middle" font-size="11" fill="#5F6368">every key re-placed by new index</text>
</svg>
