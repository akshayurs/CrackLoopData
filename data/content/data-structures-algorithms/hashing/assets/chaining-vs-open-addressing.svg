<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Two ways to resolve collisions</text>

  <!-- LEFT: Separate chaining -->
  <text x="180" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">Separate chaining</text>

  <!-- bucket array -->
  <rect x="60" y="80"  width="120" height="34" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="120" y="102" text-anchor="middle" font-size="12" fill="#202124">bucket 0</text>
  <rect x="60" y="124" width="120" height="34" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="120" y="146" text-anchor="middle" font-size="12" fill="#202124">bucket 1</text>
  <rect x="60" y="168" width="120" height="34" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="120" y="190" text-anchor="middle" font-size="12" fill="#202124">bucket 2</text>
  <rect x="60" y="212" width="120" height="34" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="120" y="234" text-anchor="middle" font-size="12" fill="#202124">bucket 3</text>

  <!-- chain on bucket 1 -->
  <rect x="210" y="124" width="80" height="34" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="250" y="146" text-anchor="middle" font-size="12" fill="#202124">"cat"</text>
  <rect x="312" y="124" width="80" height="34" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="352" y="146" text-anchor="middle" font-size="12" fill="#202124">"dog"</text>
  <line x1="180" y1="141" x2="208" y2="141" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="290" y1="141" x2="310" y2="141" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- single entry on bucket 3 -->
  <rect x="210" y="212" width="80" height="34" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="250" y="234" text-anchor="middle" font-size="12" fill="#202124">"fox"</text>
  <line x1="180" y1="229" x2="208" y2="229" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="200" y="288" text-anchor="middle" font-size="11" fill="#5F6368">collisions form a linked list</text>

  <!-- RIGHT: Open addressing -->
  <text x="560" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">Open addressing</text>

  <rect x="500" y="80"  width="120" height="34" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="560" y="102" text-anchor="middle" font-size="12" fill="#202124">slot 0: empty</text>
  <rect x="500" y="124" width="120" height="34" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="560" y="146" text-anchor="middle" font-size="12" fill="#202124">slot 1: "cat"</text>
  <rect x="500" y="168" width="120" height="34" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="560" y="190" text-anchor="middle" font-size="12" fill="#202124">slot 2: "dog"</text>
  <rect x="500" y="212" width="120" height="34" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="560" y="234" text-anchor="middle" font-size="12" fill="#202124">slot 3: "fox"</text>

  <!-- probe arrow: dog wanted slot 1, bumped to 2 -->
  <line x1="630" y1="141" x2="660" y2="141" stroke="#34A853" stroke-width="1.5"/>
  <line x1="660" y1="141" x2="660" y2="185" stroke="#34A853" stroke-width="1.5"/>
  <line x1="660" y1="185" x2="624" y2="185" stroke="#34A853" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="688" y="166" text-anchor="middle" font-size="11" fill="#34A853">probe</text>

  <text x="560" y="288" text-anchor="middle" font-size="11" fill="#5F6368">collisions probe the next slot</text>
</svg>
