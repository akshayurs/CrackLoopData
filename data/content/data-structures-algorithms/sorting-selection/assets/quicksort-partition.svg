<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Quicksort: partition around a pivot</text>

  <!-- Unpartitioned array -->
  <text x="60" y="74" text-anchor="middle" font-size="11" fill="#9AA0A6">before</text>
  <rect x="120" y="56" width="48" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="144" y="79" text-anchor="middle" font-size="14" fill="#202124">3</text>
  <rect x="172" y="56" width="48" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="196" y="79" text-anchor="middle" font-size="14" fill="#202124">7</text>
  <rect x="224" y="56" width="48" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="248" y="79" text-anchor="middle" font-size="14" fill="#202124">1</text>
  <rect x="276" y="56" width="48" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="300" y="79" text-anchor="middle" font-size="14" fill="#202124">8</text>
  <rect x="328" y="56" width="48" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="352" y="79" text-anchor="middle" font-size="14" fill="#202124">2</text>
  <rect x="380" y="56" width="48" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="404" y="79" text-anchor="middle" font-size="14" fill="#202124">6</text>
  <rect x="432" y="56" width="48" height="36" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="456" y="79" text-anchor="middle" font-size="14" fill="#202124">5</text>
  <text x="456" y="110" text-anchor="middle" font-size="11" fill="#FBBC04">pivot</text>

  <!-- arrow down -->
  <line x1="300" y1="120" x2="300" y2="160" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="145" text-anchor="middle" font-size="11" fill="#5F6368">partition: smaller left, larger right</text>

  <!-- Partitioned array -->
  <text x="60" y="204" text-anchor="middle" font-size="11" fill="#9AA0A6">after</text>
  <rect x="120" y="186" width="48" height="36" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="144" y="209" text-anchor="middle" font-size="14" fill="#202124">3</text>
  <rect x="172" y="186" width="48" height="36" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="196" y="209" text-anchor="middle" font-size="14" fill="#202124">1</text>
  <rect x="224" y="186" width="48" height="36" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="248" y="209" text-anchor="middle" font-size="14" fill="#202124">2</text>
  <rect x="276" y="186" width="48" height="36" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="300" y="209" text-anchor="middle" font-size="14" fill="#202124">5</text>
  <rect x="328" y="186" width="48" height="36" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="352" y="209" text-anchor="middle" font-size="14" fill="#202124">8</text>
  <rect x="380" y="186" width="48" height="36" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="404" y="209" text-anchor="middle" font-size="14" fill="#202124">7</text>
  <rect x="432" y="186" width="48" height="36" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="456" y="209" text-anchor="middle" font-size="14" fill="#202124">6</text>

  <!-- braces -->
  <text x="220" y="244" text-anchor="middle" font-size="11" fill="#4285F4">&lt; pivot</text>
  <text x="300" y="244" text-anchor="middle" font-size="11" fill="#FBBC04">in place</text>
  <text x="404" y="244" text-anchor="middle" font-size="11" fill="#34A853">&gt; pivot</text>

  <!-- recurse -->
  <line x1="220" y1="252" x2="220" y2="288" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="404" y1="252" x2="404" y2="288" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="140" y="290" width="160" height="34" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="220" y="312" text-anchor="middle" font-size="13" fill="#202124">recurse left</text>

  <rect x="324" y="290" width="160" height="34" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="404" y="312" text-anchor="middle" font-size="13" fill="#202124">recurse right</text>

  <text x="360" y="346" text-anchor="middle" font-size="11" fill="#9AA0A6">pivot is already in its final sorted position</text>
</svg>
