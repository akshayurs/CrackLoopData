<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Contiguous memory and random access</text>

  <!-- contiguous cells -->
  <rect x="40"  y="55" width="80" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="80"  y="80" text-anchor="middle" font-size="15" fill="#202124">10</text>
  <text x="80"  y="100" text-anchor="middle" font-size="11" fill="#5F6368">addr 100</text>

  <rect x="120" y="55" width="80" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="160" y="80" text-anchor="middle" font-size="15" fill="#202124">20</text>
  <text x="160" y="100" text-anchor="middle" font-size="11" fill="#5F6368">addr 104</text>

  <rect x="200" y="55" width="80" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="240" y="80" text-anchor="middle" font-size="15" fill="#202124">30</text>
  <text x="240" y="100" text-anchor="middle" font-size="11" fill="#5F6368">addr 108</text>

  <rect x="280" y="55" width="80" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="320" y="80" text-anchor="middle" font-size="15" fill="#202124">40</text>
  <text x="320" y="100" text-anchor="middle" font-size="11" fill="#5F6368">addr 112</text>

  <rect x="360" y="55" width="80" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="400" y="80" text-anchor="middle" font-size="15" fill="#202124">50</text>
  <text x="400" y="100" text-anchor="middle" font-size="11" fill="#5F6368">addr 116</text>

  <text x="560" y="78" text-anchor="middle" font-size="12" fill="#5F6368">index i lives at</text>
  <text x="560" y="96" text-anchor="middle" font-size="12" fill="#202124">base + i x size</text>

  <text x="240" y="138" text-anchor="middle" font-size="12" fill="#5F6368">one formula, O(1) jump to any cell</text>

  <!-- doubling: before -->
  <text x="360" y="195" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Dynamic array doubling on overflow</text>

  <rect x="40" y="215" width="40" height="44" rx="6" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <rect x="80" y="215" width="40" height="44" rx="6" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <rect x="120" y="215" width="40" height="44" rx="6" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <rect x="160" y="215" width="40" height="44" rx="6" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="120" y="278" text-anchor="middle" font-size="12" fill="#5F6368">cap 4, full</text>

  <line x1="210" y1="237" x2="288" y2="237" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="249" y="228" text-anchor="middle" font-size="11" fill="#5F6368">push, no room</text>

  <!-- after: copy into 2x buffer -->
  <rect x="300" y="215" width="40" height="44" rx="6" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <rect x="340" y="215" width="40" height="44" rx="6" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <rect x="380" y="215" width="40" height="44" rx="6" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <rect x="420" y="215" width="40" height="44" rx="6" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <rect x="460" y="215" width="40" height="44" rx="6" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <rect x="500" y="215" width="40" height="44" rx="6" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <rect x="540" y="215" width="40" height="44" rx="6" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <rect x="580" y="215" width="40" height="44" rx="6" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="400" y="278" text-anchor="middle" font-size="12" fill="#5F6368">copy 4 elements</text>
  <text x="560" y="278" text-anchor="middle" font-size="12" fill="#5F6368">cap 8, spare room</text>

  <text x="360" y="335" text-anchor="middle" font-size="12" fill="#5F6368">Each resize is O(n), but it happens rarely</text>
  <text x="360" y="358" text-anchor="middle" font-size="12" fill="#202124">Cost spread over many pushes = O(1) amortized append</text>
</svg>
