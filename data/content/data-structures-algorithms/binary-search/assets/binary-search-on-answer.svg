<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#202124" font-weight="600">Binary search on the answer: a monotonic FALSE then TRUE line</text>

  <!-- The candidate-answer line -->
  <line x1="80" y1="120" x2="640" y2="120" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="80" y="148" text-anchor="middle" font-size="11" fill="#202124">small candidate</text>
  <text x="640" y="148" text-anchor="middle" font-size="11" fill="#202124">large candidate</text>

  <!-- FALSE region -->
  <rect x="80" y="100" width="280" height="40" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="220" y="124" text-anchor="middle" font-size="13" fill="#202124">predicate = FALSE</text>

  <!-- TRUE region -->
  <rect x="360" y="100" width="280" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="500" y="124" text-anchor="middle" font-size="13" fill="#202124">predicate = TRUE</text>

  <!-- boundary marker -->
  <line x1="360" y1="80" x2="360" y2="160" stroke="#4285F4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="300" y="56" width="120" height="32" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="77" text-anchor="middle" font-size="12" fill="#202124">first TRUE = answer</text>

  <!-- search probes below -->
  <text x="40" y="206" font-size="12" fill="#202124" font-weight="600">Probe</text>
  <rect x="140" y="188" width="120" height="38" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="200" y="208" text-anchor="middle" font-size="12" fill="#202124">test mid</text>
  <text x="200" y="221" text-anchor="middle" font-size="11" fill="#202124">FALSE: go right</text>

  <line x1="260" y1="207" x2="320" y2="207" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="320" y="188" width="120" height="38" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="380" y="208" text-anchor="middle" font-size="12" fill="#202124">test mid</text>
  <text x="380" y="221" text-anchor="middle" font-size="11" fill="#202124">TRUE: keep, go left</text>

  <line x1="440" y1="207" x2="500" y2="207" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="500" y="188" width="120" height="38" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="560" y="212" text-anchor="middle" font-size="12" fill="#202124">converge to first TRUE</text>

  <text x="360" y="276" text-anchor="middle" font-size="13" fill="#202124">We binary-search candidate answers, not array slots: find where FALSE flips to TRUE.</text>
  <text x="360" y="300" text-anchor="middle" font-size="12" fill="#202124">Works whenever check(x) is monotonic, i.e. once true it stays true.</text>
</svg>
