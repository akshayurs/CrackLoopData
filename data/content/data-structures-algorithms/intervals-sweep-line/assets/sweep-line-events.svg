<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="600" fill="#202124">Meetings as start / end events on one timeline</text>

  <!-- timeline -->
  <line x1="60" y1="200" x2="680" y2="200" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="688" y="204" font-size="11" fill="#5F6368">time</text>

  <!-- tick positions -->
  <!-- events: +0, +5, -10(end of [0,30]? simplify) use intervals [0,30],[5,10],[15,20] -->

  <!-- start events (green) and end events (red), drawn as small boxes above the line -->
  <rect x="80" y="150" width="70" height="26" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="115" y="168" font-size="12" fill="#202124" text-anchor="middle">+1 start</text>
  <line x1="115" y1="176" x2="115" y2="200" stroke="#9AA0A6" stroke-width="1"/>
  <text x="115" y="218" font-size="11" fill="#202124" text-anchor="middle">t=0</text>

  <rect x="200" y="150" width="70" height="26" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="235" y="168" font-size="12" fill="#202124" text-anchor="middle">+1 start</text>
  <line x1="235" y1="176" x2="235" y2="200" stroke="#9AA0A6" stroke-width="1"/>
  <text x="235" y="218" font-size="11" fill="#202124" text-anchor="middle">t=5</text>

  <rect x="320" y="150" width="70" height="26" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="355" y="168" font-size="12" fill="#202124" text-anchor="middle">−1 end</text>
  <line x1="355" y1="176" x2="355" y2="200" stroke="#9AA0A6" stroke-width="1"/>
  <text x="355" y="218" font-size="11" fill="#202124" text-anchor="middle">t=10</text>

  <rect x="440" y="150" width="70" height="26" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="475" y="168" font-size="12" fill="#202124" text-anchor="middle">+1 start</text>
  <line x1="475" y1="176" x2="475" y2="200" stroke="#9AA0A6" stroke-width="1"/>
  <text x="475" y="218" font-size="11" fill="#202124" text-anchor="middle">t=15</text>

  <rect x="560" y="150" width="70" height="26" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="595" y="168" font-size="12" fill="#202124" text-anchor="middle">−1 end</text>
  <line x1="595" y1="176" x2="595" y2="200" stroke="#9AA0A6" stroke-width="1"/>
  <text x="595" y="218" font-size="11" fill="#202124" text-anchor="middle">t=20</text>

  <!-- running counter row -->
  <text x="20" y="262" font-size="15" font-weight="600" fill="#202124">Running count (rooms in use) after each event</text>

  <rect x="80" y="278" width="70" height="30" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="115" y="298" font-size="13" fill="#202124" text-anchor="middle">1</text>

  <rect x="200" y="278" width="70" height="30" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="235" y="298" font-size="13" fill="#202124" text-anchor="middle">2 ← peak</text>

  <rect x="320" y="278" width="70" height="30" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="355" y="298" font-size="13" fill="#202124" text-anchor="middle">1</text>

  <rect x="440" y="278" width="70" height="30" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="475" y="298" font-size="13" fill="#202124" text-anchor="middle">2 ← peak</text>

  <rect x="560" y="278" width="70" height="30" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="595" y="298" font-size="13" fill="#202124" text-anchor="middle">1</text>

  <text x="20" y="346" font-size="13" fill="#202124">Answer = highest count ever seen = 2 rooms</text>
</svg>
