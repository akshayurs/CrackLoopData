<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Level 0 -->
  <rect x="320" y="20" width="80" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="47" font-size="15" fill="#202124" text-anchor="middle">fib(5)</text>

  <!-- Level 1 -->
  <rect x="180" y="120" width="80" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="220" y="147" font-size="15" fill="#202124" text-anchor="middle">fib(4)</text>

  <rect x="460" y="120" width="80" height="44" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="500" y="143" font-size="15" fill="#202124" text-anchor="middle">fib(3)</text>
  <text x="500" y="158" font-size="11" fill="#202124" text-anchor="middle">cache hit</text>

  <!-- Level 2 -->
  <rect x="80" y="220" width="80" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="120" y="247" font-size="15" fill="#202124" text-anchor="middle">fib(3)</text>

  <rect x="240" y="220" width="80" height="44" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="280" y="243" font-size="15" fill="#202124" text-anchor="middle">fib(2)</text>
  <text x="280" y="258" font-size="11" fill="#202124" text-anchor="middle">cache hit</text>

  <!-- Level 3 -->
  <rect x="20" y="330" width="80" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="60" y="357" font-size="15" fill="#202124" text-anchor="middle">fib(2)</text>

  <rect x="140" y="330" width="80" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="180" y="353" font-size="15" fill="#202124" text-anchor="middle">fib(1)</text>
  <text x="180" y="368" font-size="11" fill="#202124" text-anchor="middle">base</text>

  <rect x="280" y="330" width="80" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="320" y="353" font-size="15" fill="#202124" text-anchor="middle">fib(1)</text>
  <text x="320" y="368" font-size="11" fill="#202124" text-anchor="middle">base</text>

  <!-- edges -->
  <line x1="345" y1="64" x2="240" y2="120" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="375" y1="64" x2="490" y2="120" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="205" y1="164" x2="135" y2="220" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="235" y1="164" x2="275" y2="220" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="105" y1="264" x2="65" y2="330" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="135" y1="264" x2="180" y2="330" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="264" x2="320" y2="330" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="520" y="300" width="16" height="16" rx="3" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="544" y="313" font-size="12" fill="#202124">repeat = served from cache</text>
  <rect x="520" y="330" width="16" height="16" rx="3" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="544" y="343" font-size="12" fill="#202124">base case</text>
</svg>
