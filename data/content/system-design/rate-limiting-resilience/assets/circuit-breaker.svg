<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Circuit breaker state machine</text>

  <!-- Closed -->
  <rect x="60" y="120" width="170" height="80" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="145" y="152" text-anchor="middle" font-size="15" fill="#202124">CLOSED</text>
  <text x="145" y="174" text-anchor="middle" font-size="12" fill="#5F6368">calls pass through</text>
  <text x="145" y="192" text-anchor="middle" font-size="12" fill="#5F6368">counting failures</text>

  <!-- Open -->
  <rect x="490" y="120" width="170" height="80" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="575" y="152" text-anchor="middle" font-size="15" fill="#202124">OPEN</text>
  <text x="575" y="174" text-anchor="middle" font-size="12" fill="#5F6368">fail fast, no calls</text>
  <text x="575" y="192" text-anchor="middle" font-size="12" fill="#5F6368">wait cooldown</text>

  <!-- Half-open -->
  <rect x="275" y="250" width="170" height="80" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="282" text-anchor="middle" font-size="15" fill="#202124">HALF-OPEN</text>
  <text x="360" y="304" text-anchor="middle" font-size="12" fill="#5F6368">let a few probes</text>
  <text x="360" y="322" text-anchor="middle" font-size="12" fill="#5F6368">through</text>

  <!-- Closed -> Open -->
  <line x1="230" y1="150" x2="488" y2="150" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="140" text-anchor="middle" font-size="11" fill="#5F6368">failures over threshold</text>

  <!-- Open -> Half-open -->
  <line x1="500" y1="200" x2="430" y2="258" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="240" text-anchor="middle" font-size="11" fill="#5F6368">cooldown elapsed</text>

  <!-- Half-open -> Closed -->
  <line x1="290" y1="258" x2="180" y2="202" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="248" text-anchor="middle" font-size="11" fill="#5F6368">probe ok</text>

  <!-- Half-open -> Open -->
  <line x1="445" y1="285" x2="560" y2="202" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="280" text-anchor="middle" font-size="11" fill="#5F6368">probe fails</text>
</svg>
