<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Bulkhead: isolated pools, one flood stays local</text>

  <!-- Incoming -->
  <rect x="40" y="150" width="150" height="60" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="115" y="176" text-anchor="middle" font-size="15" fill="#202124">Incoming traffic</text>
  <text x="115" y="196" text-anchor="middle" font-size="12" fill="#5F6368">mixed callers</text>

  <!-- Pool A -->
  <rect x="280" y="60" width="180" height="70" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="370" y="90" text-anchor="middle" font-size="15" fill="#202124">Pool A: payments</text>
  <text x="370" y="112" text-anchor="middle" font-size="12" fill="#5F6368">20 threads, healthy</text>

  <!-- Pool B (overloaded) -->
  <rect x="280" y="160" width="180" height="70" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="370" y="190" text-anchor="middle" font-size="15" fill="#202124">Pool B: search</text>
  <text x="370" y="212" text-anchor="middle" font-size="12" fill="#5F6368">20 threads, saturated</text>

  <!-- Pool C -->
  <rect x="280" y="260" width="180" height="70" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="370" y="290" text-anchor="middle" font-size="15" fill="#202124">Pool C: reports</text>
  <text x="370" y="312" text-anchor="middle" font-size="12" fill="#5F6368">20 threads, healthy</text>

  <!-- Outcome -->
  <rect x="540" y="150" width="150" height="70" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="615" y="180" text-anchor="middle" font-size="15" fill="#202124">A and C OK</text>
  <text x="615" y="202" text-anchor="middle" font-size="12" fill="#5F6368">only B degrades</text>

  <!-- Arrows -->
  <line x1="190" y1="170" x2="278" y2="95" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="190" y1="180" x2="278" y2="190" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="190" y1="190" x2="278" y2="290" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="95" x2="540" y2="170" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="290" x2="540" y2="200" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
