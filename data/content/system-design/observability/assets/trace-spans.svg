<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- time axis -->
  <text x="40" y="30" font-size="12" fill="#202124">time</text>
  <line x1="80" y1="25" x2="690" y2="25" stroke="#9AA0A6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- root span -->
  <rect x="80" y="50" width="600" height="46" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="95" y="72" font-size="15" fill="#202124">GET /checkout</text>
  <text x="95" y="89" font-size="12" fill="#202124">root span  120 ms</text>

  <!-- child: auth -->
  <rect x="110" y="110" width="150" height="42" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="120" y="130" font-size="13" fill="#202124">auth-check</text>
  <text x="120" y="146" font-size="12" fill="#202124">15 ms</text>

  <!-- child: cart svc -->
  <rect x="280" y="110" width="380" height="42" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="290" y="130" font-size="13" fill="#202124">cart-service</text>
  <text x="290" y="146" font-size="12" fill="#202124">90 ms</text>

  <!-- grandchild: db query (slow) -->
  <rect x="310" y="166" width="300" height="42" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="320" y="186" font-size="13" fill="#202124">db-query  (slow)</text>
  <text x="320" y="202" font-size="12" fill="#202124">70 ms</text>

  <!-- grandchild: cache -->
  <rect x="620" y="166" width="40" height="42" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="640" y="190" font-size="11" text-anchor="middle" fill="#202124">cache</text>

  <!-- parent-child arrows -->
  <line x1="120" y1="96" x2="120" y2="110" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="96" x2="300" y2="110" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="152" x2="330" y2="166" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="152" x2="640" y2="166" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- legend -->
  <text x="80" y="245" font-size="12" fill="#202124">Each bar = one span. Width = duration. Nesting = parent/child calls.</text>
  <text x="80" y="268" font-size="12" fill="#202124">All spans share one trace ID. The red span is the latency culprit.</text>
</svg>
