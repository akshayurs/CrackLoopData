<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="80" y1="40" x2="80" y2="240" stroke="#9AA0A6" stroke-width="1.5"/>
  <line x1="80" y1="240" x2="680" y2="240" stroke="#9AA0A6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="20" y="50" font-size="12" fill="#202124">budget</text>
  <text x="20" y="66" font-size="12" fill="#202124">left</text>
  <text x="650" y="262" font-size="12" fill="#202124">time</text>

  <!-- 100% / 0% labels -->
  <text x="50" y="55" font-size="11" fill="#202124">100%</text>
  <text x="58" y="244" font-size="11" fill="#202124">0%</text>

  <!-- ideal slow burn line -->
  <line x1="80" y1="50" x2="660" y2="240" stroke="#34A853" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="430" y="150" font-size="12" fill="#34A853">ideal slow burn</text>

  <!-- fast burn line -->
  <line x1="80" y1="50" x2="300" y2="240" stroke="#EA4335" stroke-width="2.5"/>
  <text x="150" y="130" font-size="12" fill="#EA4335">fast burn (incident)</text>

  <!-- budget exhausted marker -->
  <circle cx="300" cy="240" r="5" fill="#EA4335"/>
  <text x="250" y="262" font-size="11" fill="#EA4335">budget gone</text>

  <!-- decision boxes -->
  <rect x="120" y="285" width="240" height="42" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="240" y="305" text-anchor="middle" font-size="13" fill="#202124">Fast burn -&gt; page now</text>
  <text x="240" y="321" text-anchor="middle" font-size="12" fill="#202124">freeze risky deploys</text>

  <rect x="400" y="285" width="240" height="42" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="520" y="305" text-anchor="middle" font-size="13" fill="#202124">Budget healthy</text>
  <text x="520" y="321" text-anchor="middle" font-size="12" fill="#202124">ship features freely</text>
</svg>
