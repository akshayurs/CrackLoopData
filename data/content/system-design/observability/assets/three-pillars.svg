<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Source -->
  <rect x="270" y="20" width="180" height="50" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="42" text-anchor="middle" font-size="15" fill="#202124">Your Service</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#202124">emits telemetry</text>

  <!-- Arrows down -->
  <line x1="360" y1="70" x2="130" y2="120" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="70" x2="360" y2="120" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="70" x2="590" y2="120" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Logs -->
  <rect x="40" y="125" width="180" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="130" y="150" text-anchor="middle" font-size="15" fill="#202124">Logs</text>
  <text x="130" y="170" text-anchor="middle" font-size="12" fill="#202124">discrete events</text>

  <!-- Metrics -->
  <rect x="270" y="125" width="180" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="150" text-anchor="middle" font-size="15" fill="#202124">Metrics</text>
  <text x="360" y="170" text-anchor="middle" font-size="12" fill="#202124">numbers over time</text>

  <!-- Traces -->
  <rect x="500" y="125" width="180" height="60" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="590" y="150" text-anchor="middle" font-size="15" fill="#202124">Traces</text>
  <text x="590" y="170" text-anchor="middle" font-size="12" fill="#202124">request journey</text>

  <!-- Question each answers -->
  <rect x="40" y="215" width="180" height="50" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="130" y="237" text-anchor="middle" font-size="12" fill="#202124">"what exactly</text>
  <text x="130" y="254" text-anchor="middle" font-size="12" fill="#202124">happened?"</text>

  <rect x="270" y="215" width="180" height="50" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="237" text-anchor="middle" font-size="12" fill="#202124">"is something</text>
  <text x="360" y="254" text-anchor="middle" font-size="12" fill="#202124">wrong?"</text>

  <rect x="500" y="215" width="180" height="50" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="590" y="237" text-anchor="middle" font-size="12" fill="#202124">"where is it</text>
  <text x="590" y="254" text-anchor="middle" font-size="12" fill="#202124">slow?"</text>

  <line x1="130" y1="185" x2="130" y2="215" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="185" x2="360" y2="215" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="185" x2="590" y2="215" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Unify -->
  <rect x="230" y="300" width="260" height="45" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="328" text-anchor="middle" font-size="15" fill="#202124">Correlate by trace ID</text>

  <line x1="130" y1="265" x2="280" y2="300" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="265" x2="360" y2="300" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="265" x2="440" y2="300" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
