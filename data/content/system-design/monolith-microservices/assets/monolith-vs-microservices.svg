<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="180" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Monolith</text>
  <text x="540" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Microservices</text>

  <!-- Monolith side: one big box with internal modules -->
  <rect x="40" y="50" width="280" height="270" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="180" y="74" text-anchor="middle" font-size="13" fill="#202124">Single deployable</text>

  <rect x="70" y="90" width="100" height="44" rx="8" fill="#FFFFFF" stroke="#4285F4" stroke-width="1.5"/>
  <text x="120" y="117" text-anchor="middle" font-size="12" fill="#202124">Orders</text>
  <rect x="190" y="90" width="100" height="44" rx="8" fill="#FFFFFF" stroke="#4285F4" stroke-width="1.5"/>
  <text x="240" y="117" text-anchor="middle" font-size="12" fill="#202124">Payments</text>
  <rect x="70" y="146" width="100" height="44" rx="8" fill="#FFFFFF" stroke="#4285F4" stroke-width="1.5"/>
  <text x="120" y="173" text-anchor="middle" font-size="12" fill="#202124">Users</text>
  <rect x="190" y="146" width="100" height="44" rx="8" fill="#FFFFFF" stroke="#4285F4" stroke-width="1.5"/>
  <text x="240" y="173" text-anchor="middle" font-size="12" fill="#202124">Inventory</text>

  <rect x="90" y="250" width="180" height="50" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="180" y="280" text-anchor="middle" font-size="12" fill="#202124">One shared DB</text>

  <line x1="180" y1="190" x2="180" y2="248" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Microservices side: separate boxes each with own DB -->
  <rect x="400" y="60" width="120" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="460" y="87" text-anchor="middle" font-size="12" fill="#202124">Orders svc</text>
  <rect x="560" y="60" width="120" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="620" y="87" text-anchor="middle" font-size="12" fill="#202124">Payments svc</text>
  <rect x="400" y="180" width="120" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="460" y="207" text-anchor="middle" font-size="12" fill="#202124">Users svc</text>
  <rect x="560" y="180" width="120" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="620" y="207" text-anchor="middle" font-size="12" fill="#202124">Inventory svc</text>

  <rect x="410" y="116" width="100" height="38" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="460" y="139" text-anchor="middle" font-size="11" fill="#202124">DB</text>
  <rect x="570" y="116" width="100" height="38" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="620" y="139" text-anchor="middle" font-size="11" fill="#202124">DB</text>
  <rect x="410" y="236" width="100" height="38" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="460" y="259" text-anchor="middle" font-size="11" fill="#202124">DB</text>
  <rect x="570" y="236" width="100" height="38" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="620" y="259" text-anchor="middle" font-size="11" fill="#202124">DB</text>

  <line x1="460" y1="104" x2="460" y2="114" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="104" x2="620" y2="114" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="224" x2="460" y2="234" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="224" x2="620" y2="234" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="520" y1="82" x2="558" y2="82" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="76" text-anchor="middle" font-size="11" fill="#5F6368">network</text>

  <text x="540" y="312" text-anchor="middle" font-size="12" fill="#202124">Many deployables, own DB each</text>
</svg>
