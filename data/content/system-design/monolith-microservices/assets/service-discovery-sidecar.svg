<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Service Discovery via Sidecar</text>

  <!-- Registry -->
  <rect x="270" y="50" width="180" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="74" text-anchor="middle" font-size="13" fill="#202124">Service registry</text>
  <text x="360" y="92" text-anchor="middle" font-size="11" fill="#5F6368">Consul / etcd</text>

  <!-- Caller pod -->
  <rect x="40" y="170" width="260" height="150" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="170" y="192" text-anchor="middle" font-size="13" fill="#202124">Order pod</text>
  <rect x="65" y="210" width="100" height="90" rx="8" fill="#FFFFFF" stroke="#4285F4" stroke-width="1.5"/>
  <text x="115" y="258" text-anchor="middle" font-size="12" fill="#202124">App</text>
  <rect x="180" y="210" width="100" height="90" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="230" y="252" text-anchor="middle" font-size="12" fill="#202124">Sidecar</text>
  <text x="230" y="268" text-anchor="middle" font-size="11" fill="#5F6368">proxy</text>
  <line x1="165" y1="255" x2="178" y2="255" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="172" y="232" text-anchor="middle" font-size="11" fill="#5F6368">localhost</text>

  <!-- Callee pod -->
  <rect x="420" y="170" width="260" height="150" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="550" y="192" text-anchor="middle" font-size="13" fill="#202124">Payment pod</text>
  <rect x="440" y="210" width="100" height="90" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="490" y="252" text-anchor="middle" font-size="12" fill="#202124">Sidecar</text>
  <text x="490" y="268" text-anchor="middle" font-size="11" fill="#5F6368">proxy</text>
  <rect x="555" y="210" width="100" height="90" rx="8" fill="#FFFFFF" stroke="#4285F4" stroke-width="1.5"/>
  <text x="605" y="258" text-anchor="middle" font-size="12" fill="#202124">App</text>
  <line x1="540" y1="255" x2="553" y2="255" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- registry lookups -->
  <line x1="230" y1="210" x2="300" y2="108" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="225" y="150" text-anchor="middle" font-size="11" fill="#5F6368">resolve+health</text>
  <line x1="490" y1="210" x2="420" y2="108" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="150" text-anchor="middle" font-size="11" fill="#5F6368">register</text>

  <!-- sidecar to sidecar -->
  <line x1="280" y1="255" x2="438" y2="255" stroke="#4285F4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="246" text-anchor="middle" font-size="11" fill="#5F6368">mTLS, retries, LB</text>

  <text x="360" y="352" text-anchor="middle" font-size="12" fill="#202124">App talks to local proxy, proxy handles discovery and routing</text>
</svg>
