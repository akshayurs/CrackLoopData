<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Leader-Follower vs Leaderless Replication</text>

  <!-- LEADER-FOLLOWER -->
  <text x="180" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">Leader-follower</text>

  <rect x="40" y="80" width="80" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="80" y="105" text-anchor="middle" font-size="13" fill="#202124">Client</text>

  <rect x="140" y="80" width="100" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="190" y="100" text-anchor="middle" font-size="13" fill="#202124">Leader</text>
  <text x="190" y="115" text-anchor="middle" font-size="11" fill="#5F6368">all writes</text>

  <line x1="120" y1="100" x2="138" y2="100" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="129" y="92" text-anchor="middle" font-size="10" fill="#5F6368">write</text>

  <rect x="120" y="180" width="100" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="170" y="202" text-anchor="middle" font-size="13" fill="#202124">Follower 1</text>
  <text x="170" y="218" text-anchor="middle" font-size="11" fill="#5F6368">reads</text>

  <rect x="120" y="244" width="100" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="170" y="266" text-anchor="middle" font-size="13" fill="#202124">Follower 2</text>
  <text x="170" y="282" text-anchor="middle" font-size="11" fill="#5F6368">reads</text>

  <line x1="190" y1="120" x2="170" y2="178" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="190" y1="120" x2="178" y2="242" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="235" y="160" text-anchor="middle" font-size="10" fill="#5F6368">replicate</text>

  <text x="170" y="320" text-anchor="middle" font-size="11" fill="#202124">One writer. Followers may lag.</text>

  <!-- LEADERLESS -->
  <text x="540" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">Leaderless (Dynamo-style)</text>

  <rect x="430" y="80" width="80" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="470" y="105" text-anchor="middle" font-size="13" fill="#202124">Client</text>

  <rect x="430" y="180" width="80" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="470" y="206" text-anchor="middle" font-size="13" fill="#202124">Node 1</text>

  <rect x="540" y="180" width="80" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="580" y="206" text-anchor="middle" font-size="13" fill="#202124">Node 2</text>

  <rect x="485" y="244" width="80" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="525" y="270" text-anchor="middle" font-size="13" fill="#202124">Node 3</text>

  <line x1="470" y1="120" x2="470" y2="178" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="120" x2="575" y2="178" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="120" x2="520" y2="242" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="630" y="150" text-anchor="middle" font-size="10" fill="#5F6368">write to many</text>

  <text x="525" y="320" text-anchor="middle" font-size="11" fill="#202124">Any node takes writes.</text>
  <text x="525" y="336" text-anchor="middle" font-size="11" fill="#5F6368">Quorums settle conflicts.</text>

  <line x1="360" y1="70" x2="360" y2="340" stroke="#9AA0A6" stroke-width="1" stroke-dasharray="4 4"/>
</svg>
