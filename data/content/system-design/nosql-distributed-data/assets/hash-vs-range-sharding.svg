<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Hash vs Range Sharding</text>

  <!-- HASH side -->
  <text x="180" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">Hash sharding</text>
  <rect x="60" y="78" width="240" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="180" y="100" text-anchor="middle" font-size="13" fill="#202124">key &#8594; hash(key) mod N</text>
  <text x="180" y="116" text-anchor="middle" font-size="11" fill="#5F6368">scatters keys evenly</text>

  <rect x="50" y="160" width="80" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="90" y="186" text-anchor="middle" font-size="13" fill="#202124">Node A</text>
  <text x="90" y="204" text-anchor="middle" font-size="11" fill="#5F6368">k7, k2, k9</text>

  <rect x="140" y="160" width="80" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="180" y="186" text-anchor="middle" font-size="13" fill="#202124">Node B</text>
  <text x="180" y="204" text-anchor="middle" font-size="11" fill="#5F6368">k1, k5, k8</text>

  <rect x="230" y="160" width="80" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="270" y="186" text-anchor="middle" font-size="13" fill="#202124">Node C</text>
  <text x="270" y="204" text-anchor="middle" font-size="11" fill="#5F6368">k3, k4, k6</text>

  <line x1="180" y1="122" x2="90" y2="158" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="122" x2="180" y2="158" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="122" x2="270" y2="158" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="180" y="252" text-anchor="middle" font-size="11" fill="#34A853">Even load. No range scans.</text>

  <!-- RANGE side -->
  <text x="540" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">Range sharding</text>
  <rect x="420" y="78" width="240" height="44" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="540" y="100" text-anchor="middle" font-size="13" fill="#202124">key &#8594; sorted ranges</text>
  <text x="540" y="116" text-anchor="middle" font-size="11" fill="#5F6368">contiguous, ordered</text>

  <rect x="410" y="160" width="80" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="450" y="186" text-anchor="middle" font-size="13" fill="#202124">Node A</text>
  <text x="450" y="204" text-anchor="middle" font-size="11" fill="#5F6368">a&#8211;h</text>

  <rect x="500" y="160" width="80" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="540" y="186" text-anchor="middle" font-size="13" fill="#202124">Node B</text>
  <text x="540" y="204" text-anchor="middle" font-size="11" fill="#5F6368">i&#8211;p</text>

  <rect x="590" y="160" width="80" height="60" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="630" y="186" text-anchor="middle" font-size="13" fill="#202124">Node C</text>
  <text x="630" y="204" text-anchor="middle" font-size="11" fill="#5F6368">q&#8211;z (hot)</text>

  <line x1="540" y1="122" x2="450" y2="158" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="122" x2="540" y2="158" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="122" x2="630" y2="158" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="540" y="252" text-anchor="middle" font-size="11" fill="#202124">Range scans easy.</text>
  <text x="540" y="268" text-anchor="middle" font-size="11" fill="#EA4335">But recent keys = hot partition.</text>

  <line x1="360" y1="70" x2="360" y2="290" stroke="#9AA0A6" stroke-width="1" stroke-dasharray="4 4"/>
</svg>
