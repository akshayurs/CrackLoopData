<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Quorum: R + W &gt; N guarantees overlap</text>
  <text x="360" y="48" text-anchor="middle" font-size="12" fill="#5F6368">N = 3 replicas, W = 2, R = 2  &#8594;  2 + 2 &gt; 3</text>

  <!-- WRITE row -->
  <text x="90" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">Write (W=2)</text>
  <rect x="40" y="104" width="80" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="80" y="130" text-anchor="middle" font-size="13" fill="#202124">R1</text>
  <text x="80" y="148" text-anchor="middle" font-size="11" fill="#34A853">v2 &#10003;</text>

  <rect x="150" y="104" width="80" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="190" y="130" text-anchor="middle" font-size="13" fill="#202124">R2</text>
  <text x="190" y="148" text-anchor="middle" font-size="11" fill="#34A853">v2 &#10003;</text>

  <rect x="260" y="104" width="80" height="56" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="300" y="130" text-anchor="middle" font-size="13" fill="#202124">R3</text>
  <text x="300" y="148" text-anchor="middle" font-size="11" fill="#9AA0A6">v1 (old)</text>

  <text x="500" y="136" text-anchor="middle" font-size="12" fill="#202124">Write acked after 2 of 3 store v2</text>

  <!-- READ row -->
  <text x="90" y="220" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">Read (R=2)</text>
  <rect x="40" y="232" width="80" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="80" y="258" text-anchor="middle" font-size="13" fill="#202124">R1</text>
  <text x="80" y="276" text-anchor="middle" font-size="11" fill="#4285F4">v2</text>

  <rect x="150" y="232" width="80" height="56" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="190" y="258" text-anchor="middle" font-size="13" fill="#202124">R2</text>
  <text x="190" y="276" text-anchor="middle" font-size="11" fill="#9AA0A6">v2</text>

  <rect x="260" y="232" width="80" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="300" y="258" text-anchor="middle" font-size="13" fill="#202124">R3</text>
  <text x="300" y="276" text-anchor="middle" font-size="11" fill="#4285F4">v1 (old)</text>

  <text x="500" y="252" text-anchor="middle" font-size="12" fill="#202124">Read any 2 &#8594; at least one has v2</text>
  <text x="500" y="270" text-anchor="middle" font-size="12" fill="#5F6368">Newest wins (version / timestamp)</text>

  <!-- overlap note -->
  <rect x="120" y="330" width="480" height="48" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="352" text-anchor="middle" font-size="13" fill="#202124">Because W + R &gt; N, the write set and read set must share a node.</text>
  <text x="360" y="370" text-anchor="middle" font-size="12" fill="#5F6368">That shared node carries the latest value, so reads never miss it.</text>
</svg>
