<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Read-your-writes broken by replication lag</text>

  <!-- Client -->
  <rect x="40" y="120" width="110" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="95" y="148" text-anchor="middle" font-size="15" fill="#202124">Client</text>
  <text x="95" y="167" text-anchor="middle" font-size="12" fill="#202124">posts comment</text>

  <!-- Leader -->
  <rect x="290" y="60" width="140" height="70" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="90" text-anchor="middle" font-size="15" fill="#202124">Leader</text>
  <text x="360" y="110" text-anchor="middle" font-size="12" fill="#202124">has new comment</text>

  <!-- Follower -->
  <rect x="290" y="180" width="140" height="70" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="360" y="210" text-anchor="middle" font-size="15" fill="#202124">Follower</text>
  <text x="360" y="230" text-anchor="middle" font-size="12" fill="#202124">still old (lag)</text>

  <!-- Result -->
  <rect x="560" y="180" width="130" height="70" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="625" y="210" text-anchor="middle" font-size="15" fill="#202124">Read returns</text>
  <text x="625" y="230" text-anchor="middle" font-size="12" fill="#202124">nothing!</text>

  <!-- write -->
  <line x1="150" y1="135" x2="285" y2="95" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="105" font-size="11" fill="#5F6368">1. write</text>

  <!-- replicate (lagging) -->
  <line x1="360" y1="130" x2="360" y2="178" stroke="#5F6368" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="370" y="158" font-size="11" fill="#5F6368">lagging replicate</text>

  <!-- read -->
  <line x1="150" y1="165" x2="285" y2="215" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="195" y="205" font-size="11" fill="#5F6368">2. read</text>

  <line x1="430" y1="215" x2="555" y2="215" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="205" font-size="11" fill="#5F6368">3. stale</text>
</svg>
