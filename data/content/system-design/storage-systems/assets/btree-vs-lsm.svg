<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- B-tree side -->
  <text x="180" y="28" text-anchor="middle" font-size="15" fill="#202124">B-tree (update in place)</text>
  <rect x="60" y="44" width="240" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="180" y="71" text-anchor="middle" font-size="14" fill="#202124">Write seeks to page</text>

  <rect x="60" y="108" width="240" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="180" y="135" text-anchor="middle" font-size="14" fill="#202124">Rewrite whole page</text>

  <rect x="60" y="172" width="240" height="48" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="180" y="192" text-anchor="middle" font-size="13" fill="#202124">Fast point reads</text>
  <text x="180" y="210" text-anchor="middle" font-size="12" fill="#202124">low read amp</text>

  <rect x="60" y="240" width="240" height="48" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="180" y="260" text-anchor="middle" font-size="13" fill="#202124">Random writes</text>
  <text x="180" y="278" text-anchor="middle" font-size="12" fill="#202124">higher write amp</text>

  <!-- LSM side -->
  <text x="540" y="28" text-anchor="middle" font-size="15" fill="#202124">LSM-tree (append + merge)</text>
  <rect x="420" y="44" width="240" height="44" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="540" y="71" text-anchor="middle" font-size="14" fill="#202124">Append to memtable</text>

  <rect x="420" y="108" width="240" height="44" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="540" y="135" text-anchor="middle" font-size="14" fill="#202124">Sequential disk writes</text>

  <rect x="420" y="172" width="240" height="48" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="540" y="192" text-anchor="middle" font-size="13" fill="#202124">Fast writes</text>
  <text x="540" y="210" text-anchor="middle" font-size="12" fill="#202124">low write amp at ingest</text>

  <rect x="420" y="240" width="240" height="48" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="540" y="260" text-anchor="middle" font-size="13" fill="#202124">Reads hit many SSTables</text>
  <text x="540" y="278" text-anchor="middle" font-size="12" fill="#202124">read + compaction amp</text>

  <line x1="180" y1="88" x2="180" y2="108" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="152" x2="180" y2="172" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="88" x2="540" y2="108" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="152" x2="540" y2="172" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
