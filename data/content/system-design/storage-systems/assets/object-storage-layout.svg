<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="40" y="130" width="140" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="110" y="155" text-anchor="middle" font-size="15" fill="#202124">Client</text>
  <text x="110" y="173" text-anchor="middle" font-size="12" fill="#202124">PUT / GET key</text>

  <!-- Bucket / namespace -->
  <rect x="240" y="40" width="200" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="340" y="65" text-anchor="middle" font-size="15" fill="#202124">Bucket</text>
  <text x="340" y="83" text-anchor="middle" font-size="12" fill="#202124">flat key namespace</text>

  <!-- Metadata / index -->
  <rect x="240" y="135" width="200" height="60" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="340" y="160" text-anchor="middle" font-size="15" fill="#202124">Index service</text>
  <text x="340" y="178" text-anchor="middle" font-size="12" fill="#202124">key to object map</text>

  <!-- Object -->
  <rect x="240" y="230" width="200" height="60" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="340" y="255" text-anchor="middle" font-size="15" fill="#202124">Object + metadata</text>
  <text x="340" y="273" text-anchor="middle" font-size="12" fill="#202124">opaque blob</text>

  <!-- Replicas / shards -->
  <rect x="510" y="40" width="170" height="50" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="595" y="70" text-anchor="middle" font-size="14" fill="#202124">Storage node A</text>

  <rect x="510" y="110" width="170" height="50" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="595" y="140" text-anchor="middle" font-size="14" fill="#202124">Storage node B</text>

  <rect x="510" y="180" width="170" height="50" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="595" y="210" text-anchor="middle" font-size="14" fill="#202124">Storage node C</text>

  <text x="595" y="262" text-anchor="middle" font-size="12" fill="#202124">replicas / erasure shards</text>
  <text x="595" y="280" text-anchor="middle" font-size="12" fill="#202124">across AZs</text>

  <!-- arrows -->
  <line x1="180" y1="150" x2="240" y2="70" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="160" x2="240" y2="165" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="195" x2="340" y2="230" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="255" x2="510" y2="85" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="255" x2="510" y2="135" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="255" x2="510" y2="205" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
