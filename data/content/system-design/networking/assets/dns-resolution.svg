<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="40" y="160" width="140" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="110" y="182" font-size="15" fill="#202124" text-anchor="middle">Browser</text>
  <text x="110" y="200" font-size="12" fill="#202124" text-anchor="middle">+ stub resolver</text>

  <!-- Recursive resolver -->
  <rect x="270" y="160" width="160" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="350" y="182" font-size="15" fill="#202124" text-anchor="middle">Recursive</text>
  <text x="350" y="200" font-size="12" fill="#202124" text-anchor="middle">resolver (ISP)</text>

  <!-- Root -->
  <rect x="540" y="20" width="140" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="610" y="42" font-size="15" fill="#202124" text-anchor="middle">Root</text>
  <text x="610" y="60" font-size="12" fill="#202124" text-anchor="middle">.</text>

  <!-- TLD -->
  <rect x="540" y="160" width="140" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="610" y="182" font-size="15" fill="#202124" text-anchor="middle">TLD</text>
  <text x="610" y="200" font-size="12" fill="#202124" text-anchor="middle">.com</text>

  <!-- Authoritative -->
  <rect x="540" y="300" width="140" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="610" y="322" font-size="15" fill="#202124" text-anchor="middle">Authoritative</text>
  <text x="610" y="340" font-size="12" fill="#202124" text-anchor="middle">example.com</text>

  <!-- Browser -> resolver -->
  <line x1="180" y1="178" x2="270" y2="178" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="225" y="170" font-size="11" fill="#202124" text-anchor="middle">query</text>
  <line x1="270" y1="196" x2="180" y2="196" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="225" y="212" font-size="11" fill="#202124" text-anchor="middle">IP answer</text>

  <!-- resolver -> root -->
  <line x1="430" y1="170" x2="540" y2="60" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="105" font-size="11" fill="#202124" text-anchor="middle">.com NS?</text>

  <!-- resolver -> TLD -->
  <line x1="430" y1="185" x2="540" y2="185" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="485" y="178" font-size="11" fill="#202124" text-anchor="middle">example.com NS?</text>

  <!-- resolver -> authoritative -->
  <line x1="430" y1="200" x2="540" y2="320" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="270" font-size="11" fill="#202124" text-anchor="middle">A record?</text>
</svg>
