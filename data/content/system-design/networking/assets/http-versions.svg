<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- HTTP/1.1 -->
  <text x="120" y="30" font-size="15" fill="#202124" text-anchor="middle" font-weight="bold">HTTP/1.1</text>
  <text x="120" y="48" font-size="12" fill="#202124" text-anchor="middle">1 req per conn, head-of-line</text>
  <rect x="40" y="70" width="160" height="36" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="120" y="93" font-size="13" fill="#202124" text-anchor="middle">Req A</text>
  <rect x="40" y="116" width="160" height="36" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="120" y="139" font-size="13" fill="#202124" text-anchor="middle">Req B (waits)</text>
  <rect x="40" y="162" width="160" height="36" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="120" y="185" font-size="13" fill="#202124" text-anchor="middle">Req C (waits)</text>

  <!-- HTTP/2 -->
  <text x="360" y="30" font-size="15" fill="#202124" text-anchor="middle" font-weight="bold">HTTP/2</text>
  <text x="360" y="48" font-size="12" fill="#202124" text-anchor="middle">multiplexed over 1 TCP conn</text>
  <rect x="280" y="70" width="160" height="128" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="92" font-size="13" fill="#202124" text-anchor="middle">Single TCP</text>
  <rect x="296" y="104" width="128" height="24" rx="6" fill="#fff" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="121" font-size="12" fill="#202124" text-anchor="middle">stream A</text>
  <rect x="296" y="134" width="128" height="24" rx="6" fill="#fff" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="151" font-size="12" fill="#202124" text-anchor="middle">stream B</text>
  <rect x="296" y="164" width="128" height="24" rx="6" fill="#fff" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="181" font-size="12" fill="#202124" text-anchor="middle">stream C</text>
  <text x="360" y="218" font-size="11" fill="#EA4335" text-anchor="middle">TCP loss stalls all</text>

  <!-- HTTP/3 -->
  <text x="600" y="30" font-size="15" fill="#202124" text-anchor="middle" font-weight="bold">HTTP/3 (QUIC)</text>
  <text x="600" y="48" font-size="12" fill="#202124" text-anchor="middle">streams over UDP, independent</text>
  <rect x="520" y="70" width="160" height="128" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="600" y="92" font-size="13" fill="#202124" text-anchor="middle">Single QUIC/UDP</text>
  <rect x="536" y="104" width="128" height="24" rx="6" fill="#fff" stroke="#34A853" stroke-width="1.5"/>
  <text x="600" y="121" font-size="12" fill="#202124" text-anchor="middle">stream A</text>
  <rect x="536" y="134" width="128" height="24" rx="6" fill="#fff" stroke="#34A853" stroke-width="1.5"/>
  <text x="600" y="151" font-size="12" fill="#202124" text-anchor="middle">stream B</text>
  <rect x="536" y="164" width="128" height="24" rx="6" fill="#fff" stroke="#34A853" stroke-width="1.5"/>
  <text x="600" y="181" font-size="12" fill="#202124" text-anchor="middle">stream C</text>
  <text x="600" y="218" font-size="11" fill="#34A853" text-anchor="middle">loss stalls 1 stream only</text>

  <!-- Setup cost row -->
  <rect x="40" y="270" width="640" height="120" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="294" font-size="14" fill="#202124" text-anchor="middle" font-weight="bold">Connection setup round-trips</text>
  <text x="160" y="330" font-size="13" fill="#202124" text-anchor="middle">1.1 / 2 (TLS 1.3):</text>
  <text x="160" y="350" font-size="12" fill="#202124" text-anchor="middle">TCP 1 RTT + TLS 1 RTT</text>
  <text x="160" y="368" font-size="12" fill="#202124" text-anchor="middle">= 2 RTT</text>
  <text x="540" y="330" font-size="13" fill="#202124" text-anchor="middle">3 / QUIC:</text>
  <text x="540" y="350" font-size="12" fill="#202124" text-anchor="middle">handshake + TLS combined</text>
  <text x="540" y="368" font-size="12" fill="#202124" text-anchor="middle">= 1 RTT (0-RTT resume)</text>
</svg>
