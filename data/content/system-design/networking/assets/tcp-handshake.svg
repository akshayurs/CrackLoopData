<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Lifelines -->
  <rect x="120" y="20" width="160" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="200" y="45" font-size="15" fill="#202124" text-anchor="middle">Client</text>
  <line x1="200" y1="60" x2="200" y2="330" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="4 4"/>

  <rect x="440" y="20" width="160" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="520" y="45" font-size="15" fill="#202124" text-anchor="middle">Server</text>
  <line x1="520" y1="60" x2="520" y2="330" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- SYN -->
  <line x1="200" y1="100" x2="520" y2="120" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="100" font-size="12" fill="#202124" text-anchor="middle">1. SYN (seq=x)</text>

  <!-- SYN-ACK -->
  <line x1="520" y1="170" x2="200" y2="190" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="170" font-size="12" fill="#202124" text-anchor="middle">2. SYN-ACK (seq=y, ack=x+1)</text>

  <!-- ACK -->
  <line x1="200" y1="240" x2="520" y2="260" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="240" font-size="12" fill="#202124" text-anchor="middle">3. ACK (ack=y+1)</text>

  <!-- Established -->
  <rect x="280" y="290" width="160" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="313" font-size="13" fill="#202124" text-anchor="middle">Connection ready</text>
</svg>
