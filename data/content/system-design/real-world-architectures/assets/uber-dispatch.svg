<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Uber dispatch: geospatial sharding by cell</text>

  <!-- rider -->
  <rect x="40" y="50" width="150" height="46" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="115" y="73" text-anchor="middle" font-size="15" fill="#202124">Rider request</text>
  <text x="115" y="89" text-anchor="middle" font-size="12" fill="#202124">lat / lng</text>

  <line x1="190" y1="73" x2="245" y2="73" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- geo index -->
  <rect x="250" y="50" width="170" height="46" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="335" y="73" text-anchor="middle" font-size="14" fill="#202124">Geo index (H3)</text>
  <text x="335" y="89" text-anchor="middle" font-size="12" fill="#202124">lat/lng to cell id</text>

  <line x1="420" y1="73" x2="475" y2="73" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- dispatch -->
  <rect x="480" y="50" width="190" height="46" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="575" y="73" text-anchor="middle" font-size="14" fill="#202124">Dispatch (Ringpop)</text>
  <text x="575" y="89" text-anchor="middle" font-size="12" fill="#202124">routes to shard</text>

  <line x1="575" y1="96" x2="575" y2="130" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="118" text-anchor="middle" font-size="11" fill="#5F6368">by cell id</text>

  <!-- shards -->
  <rect x="120" y="135" width="150" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="195" y="158" text-anchor="middle" font-size="14" fill="#202124">Shard: cell A</text>
  <text x="195" y="174" text-anchor="middle" font-size="12" fill="#202124">drivers nearby</text>

  <rect x="300" y="135" width="150" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="375" y="158" text-anchor="middle" font-size="14" fill="#202124">Shard: cell B</text>
  <text x="375" y="174" text-anchor="middle" font-size="12" fill="#202124">drivers nearby</text>

  <rect x="480" y="135" width="150" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="555" y="158" text-anchor="middle" font-size="14" fill="#202124">Shard: cell C</text>
  <text x="555" y="174" text-anchor="middle" font-size="12" fill="#202124">drivers nearby</text>

  <line x1="500" y1="120" x2="375" y2="135" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- match -->
  <line x1="375" y1="185" x2="375" y2="225" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="255" y="230" width="240" height="48" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="375" y="253" text-anchor="middle" font-size="14" fill="#202124">Match best driver</text>
  <text x="375" y="269" text-anchor="middle" font-size="12" fill="#202124">ETA, supply/demand</text>

  <!-- driver location stream -->
  <rect x="40" y="320" width="280" height="56" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="180" y="343" text-anchor="middle" font-size="13" fill="#202124">Drivers ping location every ~4s</text>
  <text x="180" y="361" text-anchor="middle" font-size="12" fill="#202124">updates in-memory geo index</text>
  <line x1="180" y1="320" x2="290" y2="96" stroke="#5F6368" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <rect x="400" y="320" width="280" height="56" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="540" y="343" text-anchor="middle" font-size="13" fill="#202124">Hot cells (airport, surge)</text>
  <text x="540" y="361" text-anchor="middle" font-size="12" fill="#202124">need re-sharding / rebalance</text>
</svg>
