<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Netflix: control plane (AWS) + data plane (CDN)</text>

  <!-- client -->
  <rect x="290" y="48" width="140" height="46" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="71" text-anchor="middle" font-size="15" fill="#202124">Client app</text>
  <text x="360" y="87" text-anchor="middle" font-size="12" fill="#202124">TV / phone</text>

  <!-- API gateway -->
  <line x1="360" y1="94" x2="360" y2="125" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="270" y="130" width="180" height="46" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="153" text-anchor="middle" font-size="15" fill="#202124">API gateway (Zuul)</text>
  <text x="360" y="169" text-anchor="middle" font-size="12" fill="#202124">edge routing</text>

  <!-- microservices row -->
  <line x1="300" y1="176" x2="180" y2="215" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="176" x2="360" y2="215" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="176" x2="540" y2="215" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="90" y="220" width="160" height="46" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="170" y="243" text-anchor="middle" font-size="14" fill="#202124">Auth service</text>
  <text x="170" y="259" text-anchor="middle" font-size="12" fill="#202124">+ Hystrix</text>

  <rect x="280" y="220" width="160" height="46" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="243" text-anchor="middle" font-size="14" fill="#202124">Recommend</text>
  <text x="360" y="259" text-anchor="middle" font-size="12" fill="#202124">personalize</text>

  <rect x="470" y="220" width="160" height="46" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="550" y="243" text-anchor="middle" font-size="14" fill="#202124">Playback API</text>
  <text x="550" y="259" text-anchor="middle" font-size="12" fill="#202124">picks server</text>

  <!-- video bytes path -->
  <line x1="550" y1="266" x2="550" y2="305" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="288" text-anchor="middle" font-size="11" fill="#5F6368">returns URL</text>
  <rect x="450" y="310" width="200" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="550" y="333" text-anchor="middle" font-size="14" fill="#202124">Open Connect</text>
  <text x="550" y="349" text-anchor="middle" font-size="12" fill="#202124">CDN box at ISP</text>

  <line x1="450" y1="335" x2="360" y2="94" stroke="#5F6368" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="300" y="320" text-anchor="middle" font-size="11" fill="#5F6368">video bytes direct</text>

  <!-- chaos -->
  <rect x="90" y="380" width="540" height="44" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="360" y="402" text-anchor="middle" font-size="13" fill="#202124">Chaos Monkey kills instances in prod to prove resilience</text>
  <text x="360" y="418" text-anchor="middle" font-size="12" fill="#202124">failures are routine, not rare</text>
</svg>
