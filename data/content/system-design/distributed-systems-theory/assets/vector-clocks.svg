<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" font-size="15" font-weight="600" fill="#202124" text-anchor="middle">Vector clocks order events across nodes</text>

  <!-- node A timeline -->
  <text x="40" y="90" font-size="13" fill="#9AA0A6">Node A</text>
  <line x1="100" y1="100" x2="680" y2="100" stroke="#9AA0A6" stroke-width="1.5"/>
  <!-- node B timeline -->
  <text x="40" y="260" font-size="13" fill="#9AA0A6">Node B</text>
  <line x1="100" y1="270" x2="680" y2="270" stroke="#9AA0A6" stroke-width="1.5"/>

  <!-- A events -->
  <rect x="150" y="76" width="90" height="48" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="195" y="96" font-size="13" text-anchor="middle" fill="#202124">a1</text>
  <text x="195" y="114" font-size="12" text-anchor="middle" fill="#202124">[1,0]</text>

  <rect x="450" y="76" width="90" height="48" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="495" y="96" font-size="13" text-anchor="middle" fill="#202124">a2</text>
  <text x="495" y="114" font-size="12" text-anchor="middle" fill="#202124">[2,0]</text>

  <!-- B events -->
  <rect x="300" y="246" width="90" height="48" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="345" y="266" font-size="13" text-anchor="middle" fill="#202124">b1</text>
  <text x="345" y="284" font-size="12" text-anchor="middle" fill="#202124">[1,1]</text>

  <rect x="560" y="246" width="90" height="48" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="605" y="266" font-size="13" text-anchor="middle" fill="#202124">b2</text>
  <text x="605" y="284" font-size="12" text-anchor="middle" fill="#202124">[2,2]</text>

  <!-- message a1 -> b1 -->
  <line x1="240" y1="110" x2="300" y2="250" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="190" font-size="11" fill="#202124">msg carries [1,0]</text>

  <!-- message a2 -> b2 -->
  <line x1="540" y1="110" x2="560" y2="250" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="190" font-size="11" fill="#202124">msg carries [2,0]</text>

  <text x="360" y="340" font-size="12" fill="#9AA0A6" text-anchor="middle">a1 -&gt; b1 (causal); a2 and b1 concurrent (neither dominates)</text>
</svg>
