<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Row 1: inputs -->
  <rect x="20" y="40" width="150" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="95" y="66" text-anchor="middle" font-size="15" fill="#202124">Users / DAU</text>
  <text x="95" y="86" text-anchor="middle" font-size="12" fill="#202124">starting point</text>

  <rect x="210" y="40" width="150" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="285" y="66" text-anchor="middle" font-size="15" fill="#202124">Actions / user</text>
  <text x="285" y="86" text-anchor="middle" font-size="12" fill="#202124">reads + writes</text>

  <rect x="400" y="40" width="150" height="60" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="475" y="66" text-anchor="middle" font-size="15" fill="#202124">Avg QPS</text>
  <text x="475" y="86" text-anchor="middle" font-size="12" fill="#202124">/ 86,400 s</text>

  <rect x="560" y="40" width="140" height="60" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="630" y="66" text-anchor="middle" font-size="15" fill="#202124">Peak QPS</text>
  <text x="630" y="86" text-anchor="middle" font-size="12" fill="#202124">x safety factor</text>

  <line x1="170" y1="70" x2="210" y2="70" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="70" x2="400" y2="70" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="70" x2="560" y2="70" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2: outputs -->
  <rect x="120" y="170" width="150" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="195" y="196" text-anchor="middle" font-size="15" fill="#202124">Storage</text>
  <text x="195" y="216" text-anchor="middle" font-size="12" fill="#202124">writes x size x yrs</text>

  <rect x="300" y="170" width="150" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="375" y="196" text-anchor="middle" font-size="15" fill="#202124">Bandwidth</text>
  <text x="375" y="216" text-anchor="middle" font-size="12" fill="#202124">QPS x payload</text>

  <rect x="480" y="170" width="150" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="555" y="196" text-anchor="middle" font-size="15" fill="#202124">Memory / Cache</text>
  <text x="555" y="216" text-anchor="middle" font-size="12" fill="#202124">hot set x size</text>

  <line x1="475" y1="100" x2="195" y2="170" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="100" x2="375" y2="170" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="100" x2="555" y2="170" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
