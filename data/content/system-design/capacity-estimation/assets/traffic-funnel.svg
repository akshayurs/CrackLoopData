<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5F6368"/>
    </marker>
  </defs>

  <rect x="210" y="20" width="300" height="55" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="44" text-anchor="middle" font-size="15" fill="#202124">100M daily users</text>
  <text x="360" y="63" text-anchor="middle" font-size="12" fill="#202124">DAU</text>

  <rect x="235" y="105" width="250" height="55" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="129" text-anchor="middle" font-size="15" fill="#202124">1B requests / day</text>
  <text x="360" y="148" text-anchor="middle" font-size="12" fill="#202124">10 actions each</text>

  <rect x="260" y="190" width="200" height="55" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="214" text-anchor="middle" font-size="15" fill="#202124">~12K avg QPS</text>
  <text x="360" y="233" text-anchor="middle" font-size="12" fill="#202124">divide by 86,400</text>

  <rect x="285" y="270" width="150" height="45" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="360" y="298" text-anchor="middle" font-size="15" fill="#202124">~36K peak QPS</text>

  <line x1="360" y1="75" x2="360" y2="105" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="95" font-size="11" fill="#5F6368">x actions</text>
  <line x1="360" y1="160" x2="360" y2="190" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="180" font-size="11" fill="#5F6368">spread over day</text>
  <line x1="360" y1="245" x2="360" y2="270" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="262" font-size="11" fill="#5F6368">x3 peak factor</text>
</svg>
