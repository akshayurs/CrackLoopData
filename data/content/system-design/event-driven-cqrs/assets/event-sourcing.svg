<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Event sourcing: log is the source of truth</text>

  <!-- Command -->
  <rect x="30" y="60" width="130" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="95" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">Command</text>
  <text x="95" y="100" text-anchor="middle" font-size="11" fill="#5F6368">Withdraw $50</text>

  <!-- Validate / decide -->
  <rect x="200" y="60" width="130" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="265" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">Decide</text>
  <text x="265" y="100" text-anchor="middle" font-size="11" fill="#5F6368">validate rules</text>

  <!-- Append event -->
  <rect x="370" y="55" width="320" height="60" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="530" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">Event log (append-only)</text>
  <text x="530" y="100" text-anchor="middle" font-size="11" fill="#5F6368">Opened · Deposited · Withdrawn</text>

  <line x1="160" y1="85" x2="200" y2="85" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="85" x2="370" y2="85" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="48" text-anchor="middle" font-size="11" fill="#5F6368">emit fact</text>

  <!-- Projections row -->
  <text x="360" y="165" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Replay events to build state (projections)</text>

  <rect x="60" y="190" width="160" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="140" y="213" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Balance view</text>
  <text x="140" y="231" text-anchor="middle" font-size="11" fill="#5F6368">current = $X</text>

  <rect x="280" y="190" width="160" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="213" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Statement view</text>
  <text x="360" y="231" text-anchor="middle" font-size="11" fill="#5F6368">monthly rows</text>

  <rect x="500" y="190" width="160" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="580" y="213" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Fraud view</text>
  <text x="580" y="231" text-anchor="middle" font-size="11" fill="#5F6368">rebuilt later</text>

  <line x1="450" y1="115" x2="140" y2="190" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="115" x2="360" y2="190" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="115" x2="580" y2="190" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="360" y="300" text-anchor="middle" font-size="11" fill="#5F6368">State is derived, not stored. Drop a view and rebuild it by replaying the log.</text>
  <text x="360" y="322" text-anchor="middle" font-size="11" fill="#5F6368">Events are immutable facts in the past tense; you never overwrite them.</text>
</svg>
