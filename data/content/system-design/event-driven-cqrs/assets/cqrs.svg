<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">CQRS: split the write model from the read models</text>

  <!-- Client -->
  <rect x="290" y="50" width="140" height="46" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">Client</text>

  <!-- WRITE side -->
  <text x="175" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#4285F4">WRITE side (commands)</text>
  <rect x="80" y="145" width="190" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="175" y="167" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Command handler</text>
  <text x="175" y="185" text-anchor="middle" font-size="11" fill="#5F6368">validate · enforce rules</text>

  <rect x="80" y="225" width="190" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="175" y="247" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Write store</text>
  <text x="175" y="265" text-anchor="middle" font-size="11" fill="#5F6368">normalized / event log</text>

  <line x1="330" y1="80" x2="200" y2="145" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="235" y="118" text-anchor="middle" font-size="11" fill="#5F6368">command</text>
  <line x1="175" y1="195" x2="175" y2="225" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- READ side -->
  <text x="545" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#34A853">READ side (queries)</text>
  <rect x="450" y="145" width="190" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="545" y="167" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Query handler</text>
  <text x="545" y="185" text-anchor="middle" font-size="11" fill="#5F6368">no business logic</text>

  <rect x="450" y="225" width="190" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="545" y="247" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Read store(s)</text>
  <text x="545" y="265" text-anchor="middle" font-size="11" fill="#5F6368">denormalized views</text>

  <line x1="390" y1="80" x2="520" y2="145" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="118" text-anchor="middle" font-size="11" fill="#5F6368">query</text>
  <line x1="545" y1="225" x2="545" y2="195" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- sync arrow -->
  <line x1="270" y1="250" x2="450" y2="250" stroke="#5F6368" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="360" y="240" text-anchor="middle" font-size="11" fill="#5F6368">events / replication</text>
  <text x="360" y="296" text-anchor="middle" font-size="11" fill="#EA4335">async gap = eventual consistency</text>

  <text x="360" y="335" text-anchor="middle" font-size="11" fill="#5F6368">Write side optimizes for correctness; read side optimizes for query shape and speed.</text>
  <text x="360" y="356" text-anchor="middle" font-size="11" fill="#5F6368">Many read models can subscribe to the same write-side stream.</text>
</svg>
