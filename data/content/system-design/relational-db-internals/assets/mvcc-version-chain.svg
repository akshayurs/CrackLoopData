<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#202124">Row id = 7  (version chain, newest left)</text>

  <!-- Versions -->
  <rect x="40" y="60" width="180" height="70" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="130" y="84" text-anchor="middle" font-size="15" fill="#202124">balance = 300</text>
  <text x="130" y="104" text-anchor="middle" font-size="12" fill="#202124">created by txn 90</text>
  <text x="130" y="120" text-anchor="middle" font-size="12" fill="#202124">deleted by: none</text>

  <rect x="270" y="60" width="180" height="70" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="84" text-anchor="middle" font-size="15" fill="#202124">balance = 200</text>
  <text x="360" y="104" text-anchor="middle" font-size="12" fill="#202124">created by txn 70</text>
  <text x="360" y="120" text-anchor="middle" font-size="12" fill="#202124">deleted by txn 90</text>

  <rect x="500" y="60" width="180" height="70" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="590" y="84" text-anchor="middle" font-size="15" fill="#202124">balance = 100</text>
  <text x="590" y="104" text-anchor="middle" font-size="12" fill="#202124">created by txn 40</text>
  <text x="590" y="120" text-anchor="middle" font-size="12" fill="#202124">deleted by txn 70</text>

  <!-- chain pointers -->
  <line x1="270" y1="95" x2="220" y2="95" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="95" x2="450" y2="95" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="150" text-anchor="middle" font-size="11" fill="#5F6368">older</text>
  <text x="475" y="150" text-anchor="middle" font-size="11" fill="#5F6368">older</text>

  <!-- Snapshots -->
  <rect x="40" y="220" width="200" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="140" y="244" text-anchor="middle" font-size="15" fill="#202124">Txn 95 snapshot</text>
  <text x="140" y="264" text-anchor="middle" font-size="12" fill="#202124">sees 90 → reads 300</text>

  <rect x="270" y="220" width="200" height="60" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="370" y="244" text-anchor="middle" font-size="15" fill="#202124">Txn 80 snapshot</text>
  <text x="370" y="264" text-anchor="middle" font-size="12" fill="#202124">90 invisible → reads 200</text>

  <rect x="500" y="220" width="180" height="60" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="590" y="244" text-anchor="middle" font-size="15" fill="#202124">Txn 50 snapshot</text>
  <text x="590" y="264" text-anchor="middle" font-size="12" fill="#202124">reads 100</text>

  <line x1="140" y1="220" x2="135" y2="130" stroke="#34A853" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="220" x2="362" y2="130" stroke="#FBBC04" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="220" x2="590" y2="130" stroke="#EA4335" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="360" y="335" text-anchor="middle" font-size="12" fill="#202124">Each reader sees the newest version committed before its snapshot — no read locks.</text>
  <text x="360" y="358" text-anchor="middle" font-size="11" fill="#9AA0A6">Dead versions (visible to no one) are reclaimed later by vacuum / purge.</text>
</svg>
