<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#202124">Commit path: log first, pages later</text>

  <!-- Step 1 -->
  <rect x="30" y="60" width="150" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="105" y="86" text-anchor="middle" font-size="15" fill="#202124">Modify page</text>
  <text x="105" y="105" text-anchor="middle" font-size="12" fill="#202124">in buffer pool</text>

  <!-- Step 2 -->
  <rect x="230" y="60" width="150" height="60" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="305" y="86" text-anchor="middle" font-size="15" fill="#202124">Append to WAL</text>
  <text x="305" y="105" text-anchor="middle" font-size="12" fill="#202124">change record</text>

  <!-- Step 3 -->
  <rect x="430" y="60" width="150" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="505" y="86" text-anchor="middle" font-size="15" fill="#202124">fsync WAL</text>
  <text x="505" y="105" text-anchor="middle" font-size="12" fill="#202124">to disk</text>

  <!-- Step 4 -->
  <rect x="610" y="60" width="90" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="655" y="86" text-anchor="middle" font-size="15" fill="#202124">COMMIT</text>
  <text x="655" y="105" text-anchor="middle" font-size="12" fill="#202124">ack client</text>

  <line x1="180" y1="90" x2="230" y2="90" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="90" x2="430" y2="90" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="90" x2="610" y2="90" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Later flush -->
  <rect x="230" y="200" width="200" height="60" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="330" y="226" text-anchor="middle" font-size="15" fill="#202124">Checkpoint</text>
  <text x="330" y="245" text-anchor="middle" font-size="12" fill="#202124">flush dirty pages</text>

  <rect x="490" y="200" width="200" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="590" y="226" text-anchor="middle" font-size="15" fill="#202124">Data files</text>
  <text x="590" y="245" text-anchor="middle" font-size="12" fill="#202124">on disk</text>

  <line x1="105" y1="120" x2="290" y2="200" stroke="#5F6368" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="430" y1="230" x2="490" y2="230" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="170" y="175" text-anchor="middle" font-size="11" fill="#5F6368">async, seconds–minutes later</text>
  <text x="360" y="298" text-anchor="middle" font-size="11" fill="#9AA0A6">Crash before flush? Replay WAL to rebuild the pages.</text>
</svg>
