<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Topic "orders" — 3 partitions, 1 consumer group</text>

  <!-- Partitions -->
  <rect x="40" y="60" width="300" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="55" y="80" font-size="13" font-weight="600" fill="#202124">Partition 0</text>
  <text x="55" y="98" font-size="11" fill="#5F6368">m0 m3 m6 m9  (append-only)</text>

  <rect x="40" y="130" width="300" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="55" y="150" font-size="13" font-weight="600" fill="#202124">Partition 1</text>
  <text x="55" y="168" font-size="11" fill="#5F6368">m1 m4 m7 ...</text>

  <rect x="40" y="200" width="300" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="55" y="220" font-size="13" font-weight="600" fill="#202124">Partition 2</text>
  <text x="55" y="238" font-size="11" fill="#5F6368">m2 m5 m8 ...</text>

  <!-- Consumers -->
  <rect x="500" y="60" width="180" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="590" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Consumer A</text>
  <text x="590" y="99" text-anchor="middle" font-size="11" fill="#5F6368">owns P0</text>

  <rect x="500" y="130" width="180" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="590" y="152" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Consumer B</text>
  <text x="590" y="169" text-anchor="middle" font-size="11" fill="#5F6368">owns P1</text>

  <rect x="500" y="200" width="180" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="590" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Consumer C</text>
  <text x="590" y="239" text-anchor="middle" font-size="11" fill="#5F6368">owns P2</text>

  <line x1="340" y1="85" x2="500" y2="85" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="155" x2="500" y2="155" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="225" x2="500" y2="225" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="420" y="300" text-anchor="middle" font-size="12" fill="#5F6368">Each partition has exactly one owner in the group — that is how order is kept per partition.</text>
  <text x="420" y="320" text-anchor="middle" font-size="12" fill="#5F6368">More consumers than partitions = some sit idle.</text>
</svg>
