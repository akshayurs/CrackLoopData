<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">At-least-once + idempotent consumer = effective exactly-once</text>

  <!-- Step boxes -->
  <rect x="30" y="70" width="150" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="105" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">1. Process msg</text>
  <text x="105" y="112" text-anchor="middle" font-size="11" fill="#5F6368">do the work</text>

  <rect x="220" y="70" width="150" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="295" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">2. Write result</text>
  <text x="295" y="112" text-anchor="middle" font-size="11" fill="#5F6368">+ msg id (dedupe)</text>

  <rect x="410" y="70" width="150" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="485" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">3. Commit offset</text>
  <text x="485" y="112" text-anchor="middle" font-size="11" fill="#5F6368">ack the broker</text>

  <line x1="180" y1="98" x2="220" y2="98" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="98" x2="410" y2="98" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Crash branch -->
  <rect x="410" y="180" width="150" height="56" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="485" y="204" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Crash before 3</text>
  <text x="485" y="222" text-anchor="middle" font-size="11" fill="#5F6368">offset not committed</text>

  <rect x="220" y="180" width="150" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="295" y="204" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">4. Redeliver</text>
  <text x="295" y="222" text-anchor="middle" font-size="11" fill="#5F6368">same msg again</text>

  <rect x="30" y="180" width="150" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="105" y="204" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">5. Dedupe skips</text>
  <text x="105" y="222" text-anchor="middle" font-size="11" fill="#5F6368">id already seen</text>

  <line x1="485" y1="126" x2="485" y2="180" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="208" x2="370" y2="208" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="220" y1="208" x2="180" y2="208" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="360" y="300" text-anchor="middle" font-size="12" fill="#5F6368">At-most-once: commit offset BEFORE work — fast, but a crash loses the message.</text>
  <text x="360" y="322" text-anchor="middle" font-size="12" fill="#5F6368">At-least-once: commit AFTER work — never lose, but may duplicate.</text>
  <text x="360" y="344" text-anchor="middle" font-size="12" fill="#5F6368">Exactly-once effect: at-least-once delivery + idempotent / deduped write.</text>
</svg>
