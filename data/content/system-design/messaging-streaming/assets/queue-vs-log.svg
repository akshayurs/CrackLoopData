<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- LEFT: classic queue -->
  <text x="180" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Classic queue (delete on read)</text>

  <rect x="40" y="55" width="120" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="100" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Producer</text>

  <rect x="40" y="140" width="280" height="60" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="180" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Queue</text>
  <text x="180" y="186" text-anchor="middle" font-size="11" fill="#5F6368">msg removed once consumed</text>

  <rect x="200" y="55" width="120" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="260" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Consumer</text>

  <line x1="100" y1="99" x2="120" y2="140" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="140" x2="260" y2="99" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="180" y="232" text-anchor="middle" font-size="11" fill="#5F6368">Read = consume. Gone after ack.</text>

  <!-- divider -->
  <line x1="360" y1="50" x2="360" y2="340" stroke="#9AA0A6" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- RIGHT: append-only log -->
  <text x="540" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Append-only log (keep on read)</text>

  <rect x="400" y="65" width="280" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="540" y="92" text-anchor="middle" font-size="12" fill="#202124">0  1  2  3  4  5  6  →  append</text>

  <rect x="400" y="170" width="120" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="460" y="192" text-anchor="middle" font-size="12" font-weight="600" fill="#202124">Reader A</text>
  <text x="460" y="208" text-anchor="middle" font-size="11" fill="#5F6368">offset 6</text>

  <rect x="560" y="170" width="120" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="620" y="192" text-anchor="middle" font-size="12" font-weight="600" fill="#202124">Reader B</text>
  <text x="620" y="208" text-anchor="middle" font-size="11" fill="#5F6368">offset 2</text>

  <line x1="450" y1="109" x2="460" y2="170" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="610" y1="109" x2="620" y2="170" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="540" y="262" text-anchor="middle" font-size="11" fill="#5F6368">Many readers, each at own offset.</text>
  <text x="540" y="282" text-anchor="middle" font-size="11" fill="#5F6368">Replay by rewinding the offset.</text>
  <text x="540" y="302" text-anchor="middle" font-size="11" fill="#5F6368">Data stays until retention expires.</text>
</svg>
