<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Clients -->
  <rect x="40" y="150" width="120" height="60" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="100" y="178" font-size="15" text-anchor="middle" fill="#202124">Clients</text>
  <text x="100" y="196" font-size="12" text-anchor="middle" fill="#5F6368">many users</text>

  <!-- Load balancer -->
  <rect x="280" y="145" width="150" height="70" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="355" y="172" font-size="15" font-weight="bold" text-anchor="middle" fill="#202124">Load Balancer</text>
  <text x="355" y="190" font-size="12" text-anchor="middle" fill="#5F6368">one virtual IP</text>
  <text x="355" y="206" font-size="12" text-anchor="middle" fill="#5F6368">picks a server</text>

  <line x1="160" y1="180" x2="280" y2="180" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Server pool -->
  <rect x="560" y="40" width="130" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="625" y="64" font-size="15" text-anchor="middle" fill="#202124">Server 1</text>
  <text x="625" y="82" font-size="12" text-anchor="middle" fill="#34A853">healthy</text>

  <rect x="560" y="150" width="130" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="625" y="174" font-size="15" text-anchor="middle" fill="#202124">Server 2</text>
  <text x="625" y="192" font-size="12" text-anchor="middle" fill="#34A853">healthy</text>

  <rect x="560" y="260" width="130" height="56" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="625" y="284" font-size="15" text-anchor="middle" fill="#202124">Server 3</text>
  <text x="625" y="302" font-size="12" text-anchor="middle" fill="#EA4335">DOWN, removed</text>

  <line x1="430" y1="170" x2="560" y2="78" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="180" x2="560" y2="178" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="195" x2="560" y2="285" stroke="#EA4335" stroke-width="1.5" stroke-dasharray="5 4"/>

  <text x="495" y="118" font-size="11" text-anchor="middle" fill="#5F6368">health checks</text>
</svg>
