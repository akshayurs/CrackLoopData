<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="290" y="20" width="140" height="48" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="42" font-size="15" fill="#202124" text-anchor="middle">Client</text>
  <text x="360" y="60" font-size="12" fill="#202124" text-anchor="middle">one of three styles</text>

  <!-- arrows to each style -->
  <line x1="320" y1="68" x2="130" y2="120" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="68" x2="360" y2="120" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="68" x2="590" y2="120" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- REST -->
  <rect x="40" y="122" width="180" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="130" y="146" font-size="15" fill="#202124" text-anchor="middle">REST</text>
  <text x="130" y="166" font-size="12" fill="#202124" text-anchor="middle">JSON over HTTP</text>

  <rect x="40" y="200" width="180" height="120" rx="8" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="130" y="224" font-size="12" fill="#202124" text-anchor="middle">Resources + verbs</text>
  <text x="130" y="246" font-size="12" fill="#202124" text-anchor="middle">Human readable</text>
  <text x="130" y="268" font-size="12" fill="#202124" text-anchor="middle">Cacheable</text>
  <text x="130" y="290" font-size="12" fill="#202124" text-anchor="middle">Over/under fetch</text>

  <!-- gRPC -->
  <rect x="270" y="122" width="180" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="146" font-size="15" fill="#202124" text-anchor="middle">gRPC</text>
  <text x="360" y="166" font-size="12" fill="#202124" text-anchor="middle">Protobuf over HTTP/2</text>

  <rect x="270" y="200" width="180" height="120" rx="8" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="224" font-size="12" fill="#202124" text-anchor="middle">Binary + typed</text>
  <text x="360" y="246" font-size="12" fill="#202124" text-anchor="middle">Fast, streaming</text>
  <text x="360" y="268" font-size="12" fill="#202124" text-anchor="middle">Code-gen stubs</text>
  <text x="360" y="290" font-size="12" fill="#202124" text-anchor="middle">Not browser-native</text>

  <!-- GraphQL -->
  <rect x="500" y="122" width="180" height="60" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="590" y="146" font-size="15" fill="#202124" text-anchor="middle">GraphQL</text>
  <text x="590" y="166" font-size="12" fill="#202124" text-anchor="middle">Query language</text>

  <rect x="500" y="200" width="180" height="120" rx="8" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="590" y="224" font-size="12" fill="#202124" text-anchor="middle">Client picks fields</text>
  <text x="590" y="246" font-size="12" fill="#202124" text-anchor="middle">One round trip</text>
  <text x="590" y="268" font-size="12" fill="#202124" text-anchor="middle">Single endpoint</text>
  <text x="590" y="290" font-size="12" fill="#202124" text-anchor="middle">Hard to cache</text>
</svg>
