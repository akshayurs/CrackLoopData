<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="40" y="40" width="150" height="50" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="115" y="62" font-size="15" fill="#202124" text-anchor="middle">Client</text>
  <text x="115" y="80" font-size="12" fill="#202124" text-anchor="middle">retries on timeout</text>

  <!-- Server -->
  <rect x="285" y="40" width="150" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="62" font-size="15" fill="#202124" text-anchor="middle">Server</text>
  <text x="360" y="80" font-size="12" fill="#202124" text-anchor="middle">checks key store</text>

  <!-- Key store -->
  <rect x="530" y="40" width="150" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="605" y="62" font-size="15" fill="#202124" text-anchor="middle">Key store</text>
  <text x="605" y="80" font-size="12" fill="#202124" text-anchor="middle">key &#8594; saved result</text>

  <!-- Request 1 -->
  <line x1="190" y1="120" x2="285" y2="120" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="237" y="113" font-size="11" fill="#202124" text-anchor="middle">POST key=abc</text>

  <line x1="435" y1="120" x2="530" y2="120" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="482" y="113" font-size="11" fill="#202124" text-anchor="middle">lookup abc</text>

  <rect x="500" y="140" width="180" height="44" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="590" y="166" font-size="12" fill="#202124" text-anchor="middle">miss &#8594; do work, save</text>

  <line x1="285" y1="200" x2="190" y2="200" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="237" y="193" font-size="11" fill="#202124" text-anchor="middle">200 result</text>

  <!-- divider -->
  <line x1="40" y1="232" x2="680" y2="232" stroke="#9AA0A6" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="360" y="252" font-size="12" fill="#9AA0A6" text-anchor="middle">--- retry: same key ---</text>

  <!-- Request 2 (retry) -->
  <line x1="190" y1="290" x2="285" y2="290" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="237" y="283" font-size="11" fill="#202124" text-anchor="middle">POST key=abc</text>

  <line x1="435" y1="290" x2="530" y2="290" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="482" y="283" font-size="11" fill="#202124" text-anchor="middle">lookup abc</text>

  <rect x="500" y="310" width="180" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="590" y="336" font-size="12" fill="#202124" text-anchor="middle">hit &#8594; return saved</text>

  <line x1="285" y1="372" x2="190" y2="372" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="237" y="365" font-size="11" fill="#202124" text-anchor="middle">same 200, no double charge</text>
</svg>
