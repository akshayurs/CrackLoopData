<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- sorted dataset -->
  <text x="40" y="40" font-size="13" fill="#202124">Rows sorted by (created_at, id)</text>
  <rect x="40" y="54" width="640" height="46" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="120" y="82" font-size="12" fill="#202124" text-anchor="middle">id 10 ... 25</text>
  <text x="290" y="82" font-size="12" fill="#202124" text-anchor="middle">id 26 ... 40</text>
  <text x="470" y="82" font-size="12" fill="#202124" text-anchor="middle">id 41 ... 55</text>
  <text x="620" y="82" font-size="12" fill="#202124" text-anchor="middle">...</text>
  <line x1="210" y1="54" x2="210" y2="100" stroke="#9AA0A6" stroke-width="1"/>
  <line x1="380" y1="54" x2="380" y2="100" stroke="#9AA0A6" stroke-width="1"/>
  <line x1="555" y1="54" x2="555" y2="100" stroke="#9AA0A6" stroke-width="1"/>

  <!-- page 1 -->
  <rect x="40" y="150" width="180" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="130" y="174" font-size="14" fill="#202124" text-anchor="middle">Page 1 request</text>
  <text x="130" y="194" font-size="12" fill="#202124" text-anchor="middle">limit=15, no cursor</text>

  <rect x="40" y="232" width="180" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="130" y="256" font-size="14" fill="#202124" text-anchor="middle">Returns rows</text>
  <text x="130" y="276" font-size="12" fill="#202124" text-anchor="middle">next_cursor = id 25</text>

  <line x1="130" y1="206" x2="130" y2="232" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- arrow carry cursor -->
  <line x1="220" y1="260" x2="290" y2="260" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="255" y="252" font-size="11" fill="#202124" text-anchor="middle">cursor</text>

  <!-- page 2 -->
  <rect x="290" y="150" width="180" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="380" y="174" font-size="14" fill="#202124" text-anchor="middle">Page 2 request</text>
  <text x="380" y="194" font-size="12" fill="#202124" text-anchor="middle">WHERE id &gt; 25</text>

  <rect x="290" y="232" width="180" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="380" y="256" font-size="14" fill="#202124" text-anchor="middle">Returns rows</text>
  <text x="380" y="276" font-size="12" fill="#202124" text-anchor="middle">next_cursor = id 40</text>

  <line x1="380" y1="206" x2="380" y2="232" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="260" x2="540" y2="260" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="505" y="252" font-size="11" fill="#202124" text-anchor="middle">cursor</text>

  <!-- page 3 -->
  <rect x="540" y="150" width="140" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="610" y="174" font-size="14" fill="#202124" text-anchor="middle">Page 3</text>
  <text x="610" y="194" font-size="12" fill="#202124" text-anchor="middle">WHERE id &gt; 40</text>

  <rect x="540" y="232" width="140" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="610" y="264" font-size="12" fill="#202124" text-anchor="middle">always O(limit)</text>
  <line x1="610" y1="206" x2="610" y2="232" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
