<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Cache hierarchy: closest is fastest</text>

  <!-- Browser -->
  <rect x="40" y="60" width="160" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="120" y="86" text-anchor="middle" font-size="15" fill="#202124">Browser cache</text>
  <text x="120" y="106" text-anchor="middle" font-size="12" fill="#5F6368">~0 ms (on device)</text>

  <!-- CDN -->
  <rect x="280" y="60" width="160" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="86" text-anchor="middle" font-size="15" fill="#202124">CDN edge</text>
  <text x="360" y="106" text-anchor="middle" font-size="12" fill="#5F6368">~10-50 ms</text>

  <!-- App local -->
  <rect x="520" y="60" width="160" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#202124">App local cache</text>
  <text x="600" y="106" text-anchor="middle" font-size="12" fill="#5F6368">~100 ns (in process)</text>

  <!-- Distributed cache -->
  <rect x="280" y="190" width="160" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="216" text-anchor="middle" font-size="15" fill="#202124">Distributed cache</text>
  <text x="360" y="236" text-anchor="middle" font-size="12" fill="#5F6368">~0.5-2 ms (Redis)</text>

  <!-- DB -->
  <rect x="280" y="290" width="160" height="60" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="360" y="316" text-anchor="middle" font-size="15" fill="#202124">Database</text>
  <text x="360" y="336" text-anchor="middle" font-size="12" fill="#5F6368">~5-30 ms (source)</text>

  <!-- Arrows: browser -> CDN -> app -->
  <line x1="200" y1="90" x2="278" y2="90" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="90" x2="518" y2="90" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="80" text-anchor="middle" font-size="11" fill="#5F6368">miss</text>
  <text x="240" y="80" text-anchor="middle" font-size="11" fill="#5F6368">miss</text>

  <!-- app -> distributed -->
  <line x1="600" y1="120" x2="600" y2="220" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="600" y1="220" x2="442" y2="220" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="180" text-anchor="middle" font-size="11" fill="#5F6368">miss</text>

  <!-- distributed -> db -->
  <line x1="360" y1="250" x2="360" y2="288" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="395" y="274" text-anchor="middle" font-size="11" fill="#5F6368">miss</text>
</svg>
