<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Cache stampede: hot key expires, all miss at once</text>

  <!-- Requests -->
  <rect x="40" y="70" width="120" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="100" y="95" text-anchor="middle" font-size="14" fill="#202124">Request 1</text>
  <rect x="40" y="130" width="120" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="100" y="155" text-anchor="middle" font-size="14" fill="#202124">Request 2</text>
  <rect x="40" y="190" width="120" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="100" y="215" text-anchor="middle" font-size="14" fill="#202124">Request 3</text>
  <text x="100" y="262" text-anchor="middle" font-size="13" fill="#5F6368">... thousands</text>

  <!-- Expired cache -->
  <rect x="270" y="120" width="160" height="70" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="350" y="150" text-anchor="middle" font-size="15" fill="#202124">Cache key</text>
  <text x="350" y="170" text-anchor="middle" font-size="12" fill="#5F6368">EXPIRED (miss)</text>

  <!-- DB overload -->
  <rect x="540" y="120" width="150" height="70" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="615" y="150" text-anchor="middle" font-size="15" fill="#202124">Database</text>
  <text x="615" y="170" text-anchor="middle" font-size="12" fill="#EA4335">overloaded</text>

  <!-- arrows requests -> cache -->
  <line x1="160" y1="90" x2="268" y2="135" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="160" y1="150" x2="268" y2="152" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="160" y1="210" x2="268" y2="172" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- arrows cache -> db (the stampede) -->
  <line x1="430" y1="135" x2="538" y2="138" stroke="#EA4335" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="155" x2="538" y2="155" stroke="#EA4335" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="175" x2="538" y2="172" stroke="#EA4335" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="484" y="115" text-anchor="middle" font-size="11" fill="#EA4335">all recompute</text>

  <!-- fix note -->
  <text x="360" y="300" text-anchor="middle" font-size="13" fill="#34A853">Fix: single-flight lock or stale-while-revalidate</text>
  <text x="360" y="320" text-anchor="middle" font-size="11" fill="#5F6368">so only ONE request rebuilds the key</text>
</svg>
