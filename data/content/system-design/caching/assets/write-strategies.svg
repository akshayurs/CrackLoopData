<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Three write strategies</text>

  <!-- ===== Write-through ===== -->
  <text x="120" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">Write-through</text>
  <rect x="50" y="80" width="140" height="46" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="120" y="108" text-anchor="middle" font-size="14" fill="#202124">App writes</text>

  <rect x="50" y="160" width="140" height="46" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="120" y="188" text-anchor="middle" font-size="14" fill="#202124">Cache</text>

  <rect x="50" y="240" width="140" height="46" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="120" y="268" text-anchor="middle" font-size="14" fill="#202124">Database</text>

  <line x1="120" y1="126" x2="120" y2="158" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="206" x2="120" y2="238" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="148" font-size="11" fill="#5F6368">sync</text>
  <text x="150" y="228" font-size="11" fill="#5F6368">sync</text>

  <!-- ===== Write-back ===== -->
  <text x="360" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">Write-back</text>
  <rect x="290" y="80" width="140" height="46" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="108" text-anchor="middle" font-size="14" fill="#202124">App writes</text>

  <rect x="290" y="160" width="140" height="46" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="188" text-anchor="middle" font-size="14" fill="#202124">Cache</text>

  <rect x="290" y="240" width="140" height="46" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="360" y="268" text-anchor="middle" font-size="14" fill="#202124">Database</text>

  <line x1="360" y1="126" x2="360" y2="158" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="206" x2="360" y2="238" stroke="#5F6368" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="390" y="148" font-size="11" fill="#5F6368">fast</text>
  <text x="390" y="228" font-size="11" fill="#5F6368">async</text>

  <!-- ===== Write-around ===== -->
  <text x="600" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">Write-around</text>
  <rect x="530" y="80" width="140" height="46" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="600" y="108" text-anchor="middle" font-size="14" fill="#202124">App writes</text>

  <rect x="530" y="160" width="140" height="46" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="600" y="184" text-anchor="middle" font-size="14" fill="#202124">Cache</text>
  <text x="600" y="200" text-anchor="middle" font-size="11" fill="#9AA0A6">skipped</text>

  <rect x="530" y="240" width="140" height="46" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="600" y="268" text-anchor="middle" font-size="14" fill="#202124">Database</text>

  <line x1="600" y1="126" x2="600" y2="238" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="630" y="186" font-size="11" fill="#5F6368">direct</text>
</svg>
