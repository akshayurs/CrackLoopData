<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="180" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Vertical (scale up)</text>
  <text x="540" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Horizontal (scale out)</text>

  <!-- Vertical: one box growing -->
  <rect x="120" y="270" width="120" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="180" y="295" text-anchor="middle" font-size="13" fill="#202124">small server</text>

  <line x1="180" y1="265" x2="180" y2="215" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="245" text-anchor="middle" font-size="11" fill="#5F6368">add CPU/RAM</text>

  <rect x="105" y="120" width="150" height="80" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="180" y="155" text-anchor="middle" font-size="15" fill="#202124">bigger server</text>
  <text x="180" y="178" text-anchor="middle" font-size="12" fill="#5F6368">one machine</text>

  <text x="180" y="340" text-anchor="middle" font-size="11" fill="#5F6368">simple, but hits a ceiling</text>

  <!-- Horizontal: many boxes -->
  <rect x="420" y="270" width="100" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="470" y="295" text-anchor="middle" font-size="13" fill="#202124">one server</text>

  <line x1="525" y1="290" x2="575" y2="290" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="270" text-anchor="middle" font-size="11" fill="#5F6368">add more</text>

  <rect x="470" y="120" width="90" height="45" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="515" y="147" text-anchor="middle" font-size="13" fill="#202124">node 1</text>
  <rect x="470" y="175" width="90" height="45" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="515" y="202" text-anchor="middle" font-size="13" fill="#202124">node 2</text>
  <rect x="575" y="120" width="90" height="45" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="620" y="147" text-anchor="middle" font-size="13" fill="#202124">node 3</text>
  <rect x="575" y="175" width="90" height="45" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="620" y="202" text-anchor="middle" font-size="13" fill="#202124">node 4</text>

  <text x="540" y="340" text-anchor="middle" font-size="11" fill="#5F6368">harder, but scales far</text>
</svg>
