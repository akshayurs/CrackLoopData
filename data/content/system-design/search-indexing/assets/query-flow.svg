<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Query -->
  <rect x="30" y="50" width="120" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="90" y="74" font-size="15" fill="#202124" text-anchor="middle">Query</text>
  <text x="90" y="92" font-size="12" fill="#202124" text-anchor="middle">"Fast Cars"</text>

  <!-- Analyze -->
  <rect x="190" y="50" width="120" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="250" y="74" font-size="15" fill="#202124" text-anchor="middle">Analyze</text>
  <text x="250" y="92" font-size="12" fill="#202124" text-anchor="middle">[fast, car]</text>

  <!-- Match -->
  <rect x="350" y="50" width="120" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="410" y="74" font-size="15" fill="#202124" text-anchor="middle">Match</text>
  <text x="410" y="92" font-size="12" fill="#202124" text-anchor="middle">posting lists</text>

  <!-- Rank -->
  <rect x="510" y="50" width="120" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="570" y="74" font-size="15" fill="#202124" text-anchor="middle">Rank</text>
  <text x="570" y="92" font-size="12" fill="#202124" text-anchor="middle">BM25 score</text>

  <line x1="150" y1="78" x2="188" y2="78" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="78" x2="348" y2="78" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="78" x2="508" y2="78" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="250" y="40" font-size="11" fill="#5F6368" text-anchor="middle">lowercase, stem, stopwords</text>
  <text x="410" y="40" font-size="11" fill="#5F6368" text-anchor="middle">find candidate docs</text>

  <!-- Results -->
  <rect x="510" y="160" width="120" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="570" y="184" font-size="15" fill="#202124" text-anchor="middle">Top-N</text>
  <text x="570" y="202" font-size="12" fill="#202124" text-anchor="middle">sorted results</text>
  <line x1="570" y1="106" x2="570" y2="158" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="360" y="240" font-size="12" fill="#202124" text-anchor="middle">Same analyzer runs at index time and query time, so tokens line up.</text>
</svg>
