<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Index box -->
  <rect x="280" y="20" width="160" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="42" font-size="15" fill="#202124" text-anchor="middle">Index "products"</text>
  <text x="360" y="59" font-size="12" fill="#202124" text-anchor="middle">2 shards, 1 replica</text>

  <line x1="240" y1="64" x2="160" y2="100" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="64" x2="560" y2="100" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="90" font-size="11" fill="#5F6368" text-anchor="middle">split by hash(doc id)</text>

  <!-- Node A -->
  <rect x="40" y="110" width="280" height="130" rx="8" fill="none" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="180" y="132" font-size="14" font-weight="bold" fill="#202124" text-anchor="middle">Node A</text>
  <rect x="70" y="150" width="100" height="70" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="120" y="180" font-size="14" fill="#202124" text-anchor="middle">Shard 0</text>
  <text x="120" y="198" font-size="11" fill="#202124" text-anchor="middle">primary</text>
  <rect x="190" y="150" width="100" height="70" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="240" y="180" font-size="14" fill="#202124" text-anchor="middle">Shard 1</text>
  <text x="240" y="198" font-size="11" fill="#202124" text-anchor="middle">replica</text>

  <!-- Node B -->
  <rect x="400" y="110" width="280" height="130" rx="8" fill="none" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="540" y="132" font-size="14" font-weight="bold" fill="#202124" text-anchor="middle">Node B</text>
  <rect x="430" y="150" width="100" height="70" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="480" y="180" font-size="14" fill="#202124" text-anchor="middle">Shard 1</text>
  <text x="480" y="198" font-size="11" fill="#202124" text-anchor="middle">primary</text>
  <rect x="550" y="150" width="100" height="70" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="600" y="180" font-size="14" fill="#202124" text-anchor="middle">Shard 0</text>
  <text x="600" y="198" font-size="11" fill="#202124" text-anchor="middle">replica</text>

  <!-- replication arrows -->
  <line x1="170" y1="185" x2="548" y2="185" stroke="#5F6368" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="430" y1="205" x2="292" y2="205" stroke="#5F6368" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="360" y="255" font-size="11" fill="#5F6368" text-anchor="middle">primary copies to replica</text>

  <!-- Shard = segments -->
  <rect x="190" y="300" width="340" height="80" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="322" font-size="13" font-weight="bold" fill="#202124" text-anchor="middle">One shard = one Lucene index = many segments</text>
  <rect x="210" y="335" width="80" height="32" rx="6" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="250" y="356" font-size="12" fill="#202124" text-anchor="middle">seg 1</text>
  <rect x="300" y="335" width="80" height="32" rx="6" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="340" y="356" font-size="12" fill="#202124" text-anchor="middle">seg 2</text>
  <rect x="390" y="335" width="80" height="32" rx="6" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="430" y="356" font-size="12" fill="#202124" text-anchor="middle">seg 3</text>
  <text x="495" y="356" font-size="12" fill="#202124" text-anchor="middle">...</text>

  <line x1="120" y1="220" x2="300" y2="298" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
