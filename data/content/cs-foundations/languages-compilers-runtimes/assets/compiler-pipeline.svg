<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Front end -->
  <text x="150" y="30" font-size="12" fill="#9AA0A6" text-anchor="middle">FRONT END</text>
  <text x="430" y="30" font-size="12" fill="#9AA0A6" text-anchor="middle">MIDDLE END</text>
  <text x="630" y="30" font-size="12" fill="#9AA0A6" text-anchor="middle">BACK END</text>

  <rect x="20" y="50" width="120" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="80" y="74" font-size="15" fill="#202124" text-anchor="middle">Source code</text>
  <text x="80" y="92" font-size="12" fill="#202124" text-anchor="middle">text</text>

  <rect x="20" y="150" width="120" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="80" y="174" font-size="15" fill="#202124" text-anchor="middle">Lexer</text>
  <text x="80" y="192" font-size="12" fill="#202124" text-anchor="middle">tokens</text>

  <rect x="20" y="250" width="120" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="80" y="274" font-size="15" fill="#202124" text-anchor="middle">Parser</text>
  <text x="80" y="292" font-size="12" fill="#202124" text-anchor="middle">AST</text>

  <rect x="300" y="250" width="120" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="274" font-size="15" fill="#202124" text-anchor="middle">Semantic</text>
  <text x="360" y="292" font-size="12" fill="#202124" text-anchor="middle">type check</text>

  <rect x="300" y="150" width="120" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="174" font-size="15" fill="#202124" text-anchor="middle">IR gen</text>
  <text x="360" y="192" font-size="12" fill="#202124" text-anchor="middle">intermediate</text>

  <rect x="300" y="50" width="120" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="74" font-size="15" fill="#202124" text-anchor="middle">Optimizer</text>
  <text x="360" y="92" font-size="12" fill="#202124" text-anchor="middle">passes</text>

  <rect x="580" y="50" width="120" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="640" y="74" font-size="15" fill="#202124" text-anchor="middle">Code gen</text>
  <text x="640" y="92" font-size="12" fill="#202124" text-anchor="middle">assembly</text>

  <rect x="580" y="150" width="120" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="640" y="174" font-size="15" fill="#202124" text-anchor="middle">Machine code</text>
  <text x="640" y="192" font-size="12" fill="#202124" text-anchor="middle">binary</text>

  <!-- arrows -->
  <line x1="80" y1="106" x2="80" y2="148" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="80" y1="206" x2="80" y2="248" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="278" x2="298" y2="278" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="248" x2="360" y2="208" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="148" x2="360" y2="108" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="78" x2="578" y2="78" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="106" x2="640" y2="148" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
