<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- shared source -->
  <rect x="300" y="20" width="120" height="50" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="50" font-size="15" fill="#202124" text-anchor="middle">Source code</text>

  <!-- INTERPRETER column -->
  <text x="120" y="105" font-size="12" fill="#9AA0A6" text-anchor="middle">INTERPRETER</text>
  <rect x="40" y="120" width="160" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="120" y="150" font-size="15" fill="#202124" text-anchor="middle">Walk AST</text>
  <rect x="40" y="220" width="160" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="120" y="244" font-size="15" fill="#202124" text-anchor="middle">Run each node</text>
  <text x="120" y="262" font-size="12" fill="#202124" text-anchor="middle">no machine code</text>

  <!-- AOT column -->
  <text x="360" y="105" font-size="12" fill="#9AA0A6" text-anchor="middle">AHEAD-OF-TIME</text>
  <rect x="280" y="120" width="160" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="150" font-size="15" fill="#202124" text-anchor="middle">Compile early</text>
  <rect x="280" y="220" width="160" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="244" font-size="15" fill="#202124" text-anchor="middle">Native binary</text>
  <text x="360" y="262" font-size="12" fill="#202124" text-anchor="middle">run directly</text>

  <!-- JIT column -->
  <text x="600" y="105" font-size="12" fill="#9AA0A6" text-anchor="middle">JIT</text>
  <rect x="520" y="120" width="160" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="600" y="144" font-size="15" fill="#202124" text-anchor="middle">Interpret first</text>
  <text x="600" y="162" font-size="12" fill="#202124" text-anchor="middle">profile hot code</text>
  <rect x="520" y="220" width="160" height="50" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="600" y="244" font-size="15" fill="#202124" text-anchor="middle">Compile hot paths</text>
  <text x="600" y="262" font-size="12" fill="#202124" text-anchor="middle">at runtime</text>

  <rect x="520" y="310" width="160" height="46" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="600" y="338" font-size="15" fill="#202124" text-anchor="middle">Fast native</text>

  <!-- arrows from source -->
  <line x1="320" y1="70" x2="160" y2="118" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="70" x2="360" y2="118" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="70" x2="560" y2="118" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="120" y1="170" x2="120" y2="218" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="170" x2="360" y2="218" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="170" x2="600" y2="218" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="270" x2="600" y2="308" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
