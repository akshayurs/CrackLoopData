<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="360" y="40" font-size="15" fill="#202124" text-anchor="middle" font-weight="bold">-rwxr-xr--   (mode 754)</text>

  <rect x="80" y="80" width="80" height="56" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="120" y="104" font-size="15" fill="#202124" text-anchor="middle">type</text>
  <text x="120" y="123" font-size="12" fill="#5F6368" text-anchor="middle">- file</text>

  <rect x="180" y="80" width="140" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="250" y="104" font-size="15" fill="#202124" text-anchor="middle">user  rwx</text>
  <text x="250" y="123" font-size="12" fill="#5F6368" text-anchor="middle">owner = 7</text>

  <rect x="340" y="80" width="140" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="410" y="104" font-size="15" fill="#202124" text-anchor="middle">group  r-x</text>
  <text x="410" y="123" font-size="12" fill="#5F6368" text-anchor="middle">group = 5</text>

  <rect x="500" y="80" width="140" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="570" y="104" font-size="15" fill="#202124" text-anchor="middle">other  r--</text>
  <text x="570" y="123" font-size="12" fill="#5F6368" text-anchor="middle">world = 4</text>

  <text x="250" y="185" font-size="13" fill="#202124" text-anchor="middle">r=4  w=2  x=1</text>
  <text x="250" y="205" font-size="12" fill="#5F6368" text-anchor="middle">4+2+1 = 7</text>

  <text x="410" y="185" font-size="13" fill="#202124" text-anchor="middle">r=4  -  x=1</text>
  <text x="410" y="205" font-size="12" fill="#5F6368" text-anchor="middle">4+0+1 = 5</text>

  <text x="570" y="185" font-size="13" fill="#202124" text-anchor="middle">r=4  -  -</text>
  <text x="570" y="205" font-size="12" fill="#5F6368" text-anchor="middle">4+0+0 = 4</text>

  <rect x="180" y="235" width="460" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="410" y="260" font-size="13" fill="#202124" text-anchor="middle">chmod 754 file   sets owner=rwx, group=r-x, other=r--</text>
</svg>
