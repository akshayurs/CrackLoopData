<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Lost update: count starts at 0, both add 1, ends at 1</text>

  <!-- time arrow -->
  <line x1="360" y1="50" x2="360" y2="330" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="372" y="64" font-size="11" fill="#9AA0A6">time ↓</text>

  <!-- Thread A column header -->
  <rect x="40" y="48" width="240" height="34" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="160" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Thread A</text>

  <!-- Thread B column header -->
  <rect x="440" y="48" width="240" height="34" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="560" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Thread B</text>

  <!-- A reads -->
  <rect x="40" y="100" width="240" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="160" y="118" text-anchor="middle" font-size="13" fill="#202124">read count = 0</text>
  <text x="160" y="133" text-anchor="middle" font-size="11" fill="#5F6368">tmp_A = 0</text>

  <!-- B reads -->
  <rect x="440" y="160" width="240" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="560" y="178" text-anchor="middle" font-size="13" fill="#202124">read count = 0</text>
  <text x="560" y="193" text-anchor="middle" font-size="11" fill="#5F6368">tmp_B = 0</text>

  <!-- A writes -->
  <rect x="40" y="220" width="240" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="160" y="238" text-anchor="middle" font-size="13" fill="#202124">write count = 1</text>
  <text x="160" y="253" text-anchor="middle" font-size="11" fill="#5F6368">tmp_A + 1</text>

  <!-- B writes -->
  <rect x="440" y="280" width="240" height="40" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="560" y="298" text-anchor="middle" font-size="13" fill="#202124">write count = 1</text>
  <text x="560" y="313" text-anchor="middle" font-size="11" fill="#5F6368">overwrites A!</text>

  <!-- interleave arrows -->
  <line x1="280" y1="120" x2="440" y2="178" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="240" x2="440" y2="298" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
