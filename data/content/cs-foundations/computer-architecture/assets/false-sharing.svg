<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#202124">False Sharing: two cores, one 64-byte cache line</text>

  <!-- Core 1 -->
  <rect x="50" y="60" width="180" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="140" y="86" text-anchor="middle" font-size="15">Core 1</text>
  <text x="140" y="106" text-anchor="middle" font-size="12">writes counterA</text>

  <!-- Core 2 -->
  <rect x="490" y="60" width="180" height="60" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="580" y="86" text-anchor="middle" font-size="15">Core 2</text>
  <text x="580" y="106" text-anchor="middle" font-size="12">writes counterB</text>

  <!-- cache line -->
  <rect x="240" y="180" width="240" height="70" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="172" text-anchor="middle" font-size="12" fill="#5F6368">one 64-byte cache line</text>
  <line x1="360" y1="180" x2="360" y2="250" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="300" y="210" text-anchor="middle" font-size="13">counterA</text>
  <text x="300" y="232" text-anchor="middle" font-size="11" fill="#5F6368">bytes 0-7</text>
  <text x="420" y="210" text-anchor="middle" font-size="13">counterB</text>
  <text x="420" y="232" text-anchor="middle" font-size="11" fill="#5F6368">bytes 8-15</text>

  <!-- arrows -->
  <line x1="140" y1="120" x2="270" y2="180" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="120" x2="450" y2="180" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- invalidation -->
  <line x1="250" y1="215" x2="60" y2="125" stroke="#EA4335" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="470" y1="215" x2="660" y2="125" stroke="#EA4335" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="360" y="300" text-anchor="middle" font-size="12" fill="#202124">Each write invalidates the other core's copy of the whole line (red dashes), so the line</text>
  <text x="360" y="320" text-anchor="middle" font-size="12" fill="#202124">ping-pongs between caches even though the two variables are never truly shared.</text>
</svg>
