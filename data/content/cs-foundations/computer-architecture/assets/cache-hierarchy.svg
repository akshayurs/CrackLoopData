<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">CPU Cache Hierarchy (closer = faster, smaller)</text>

  <!-- Core / registers -->
  <rect x="40" y="60" width="150" height="70" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="115" y="90" text-anchor="middle" font-size="15" fill="#202124">CPU Core</text>
  <text x="115" y="110" text-anchor="middle" font-size="12" fill="#202124">registers ~0.3ns</text>

  <!-- L1 -->
  <rect x="230" y="60" width="150" height="70" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="305" y="90" text-anchor="middle" font-size="15" fill="#202124">L1 cache</text>
  <text x="305" y="110" text-anchor="middle" font-size="12" fill="#202124">~32KB · ~1ns</text>

  <!-- L2 -->
  <rect x="420" y="60" width="150" height="70" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="495" y="90" text-anchor="middle" font-size="15" fill="#202124">L2 cache</text>
  <text x="495" y="110" text-anchor="middle" font-size="12" fill="#202124">~512KB · ~4ns</text>

  <!-- L3 -->
  <rect x="230" y="180" width="150" height="70" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="305" y="210" text-anchor="middle" font-size="15" fill="#202124">L3 cache</text>
  <text x="305" y="230" text-anchor="middle" font-size="12" fill="#202124">~32MB · ~12ns</text>

  <!-- DRAM -->
  <rect x="420" y="180" width="150" height="70" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="495" y="210" text-anchor="middle" font-size="15" fill="#202124">Main memory</text>
  <text x="495" y="230" text-anchor="middle" font-size="12" fill="#202124">GBs · ~100ns</text>

  <!-- SSD -->
  <rect x="420" y="290" width="150" height="55" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="495" y="315" text-anchor="middle" font-size="15" fill="#202124">SSD</text>
  <text x="495" y="333" text-anchor="middle" font-size="12" fill="#202124">TBs · ~100us</text>

  <!-- arrows -->
  <line x1="190" y1="95" x2="228" y2="95" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="95" x2="418" y2="95" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="495" y1="130" x2="350" y2="178" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="215" x2="418" y2="215" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="495" y1="250" x2="495" y2="288" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="630" y="120" text-anchor="middle" font-size="11" fill="#5F6368">miss falls</text>
  <text x="630" y="135" text-anchor="middle" font-size="11" fill="#5F6368">to next level</text>
</svg>
