<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <!-- VM stack -->
  <text x="180" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Virtual Machines</text>

  <rect x="40" y="50" width="130" height="46" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="105" y="78" text-anchor="middle" font-size="13" fill="#202124">App A</text>
  <rect x="190" y="50" width="130" height="46" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="255" y="78" text-anchor="middle" font-size="13" fill="#202124">App B</text>

  <rect x="40" y="104" width="130" height="46" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="105" y="132" text-anchor="middle" font-size="13" fill="#202124">Guest OS</text>
  <rect x="190" y="104" width="130" height="46" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="255" y="132" text-anchor="middle" font-size="13" fill="#202124">Guest OS</text>

  <rect x="40" y="158" width="280" height="46" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="180" y="186" text-anchor="middle" font-size="14" fill="#202124">Hypervisor</text>

  <rect x="40" y="212" width="280" height="44" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="180" y="239" text-anchor="middle" font-size="14" fill="#202124">Host OS</text>
  <rect x="40" y="264" width="280" height="44" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="180" y="291" text-anchor="middle" font-size="14" fill="#202124">Hardware</text>

  <text x="180" y="340" text-anchor="middle" font-size="12" fill="#5F6368">heavy, full OS each, GBs, slow boot</text>

  <!-- Container stack -->
  <text x="540" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Containers</text>

  <rect x="400" y="50" width="90" height="46" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="445" y="78" text-anchor="middle" font-size="13" fill="#202124">App A</text>
  <rect x="500" y="50" width="90" height="46" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="545" y="78" text-anchor="middle" font-size="13" fill="#202124">App B</text>
  <rect x="600" y="50" width="90" height="46" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="645" y="78" text-anchor="middle" font-size="13" fill="#202124">App C</text>

  <rect x="400" y="104" width="290" height="46" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="545" y="132" text-anchor="middle" font-size="14" fill="#202124">Container Runtime</text>

  <rect x="400" y="158" width="290" height="46" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="545" y="186" text-anchor="middle" font-size="14" fill="#202124">Shared Host OS Kernel</text>

  <rect x="400" y="212" width="290" height="44" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="545" y="239" text-anchor="middle" font-size="14" fill="#202124">Hardware</text>

  <text x="545" y="340" text-anchor="middle" font-size="12" fill="#5F6368">light, share kernel, MBs, ms start</text>
</svg>
