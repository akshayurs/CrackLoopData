<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">TCP/IP layers and encapsulation</text>

  <!-- Layer column -->
  <rect x="30" y="50" width="180" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="120" y="72" text-anchor="middle" font-size="15" fill="#202124">Application</text>
  <text x="120" y="90" text-anchor="middle" font-size="12" fill="#202124">HTTP, DNS</text>

  <rect x="30" y="120" width="180" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="120" y="142" text-anchor="middle" font-size="15" fill="#202124">Transport</text>
  <text x="120" y="160" text-anchor="middle" font-size="12" fill="#202124">TCP, UDP</text>

  <rect x="30" y="190" width="180" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="120" y="212" text-anchor="middle" font-size="15" fill="#202124">Internet</text>
  <text x="120" y="230" text-anchor="middle" font-size="12" fill="#202124">IP</text>

  <rect x="30" y="260" width="180" height="50" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="120" y="282" text-anchor="middle" font-size="15" fill="#202124">Link</text>
  <text x="120" y="300" text-anchor="middle" font-size="12" fill="#202124">Ethernet, WiFi</text>

  <!-- down arrow -->
  <line x1="120" y1="100" x2="120" y2="118" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="170" x2="120" y2="188" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="240" x2="120" y2="258" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Encapsulation column -->
  <text x="490" y="44" text-anchor="middle" font-size="12" fill="#202124">headers added going down</text>

  <rect x="380" y="55" width="120" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="440" y="79" text-anchor="middle" font-size="12" fill="#202124">Data</text>

  <rect x="320" y="125" width="60" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="350" y="149" text-anchor="middle" font-size="11" fill="#202124">TCP</text>
  <rect x="380" y="125" width="120" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="440" y="149" text-anchor="middle" font-size="12" fill="#202124">Data</text>
  <text x="350" y="118" text-anchor="middle" font-size="11" fill="#202124">Segment</text>

  <rect x="260" y="195" width="60" height="40" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="290" y="219" text-anchor="middle" font-size="11" fill="#202124">IP</text>
  <rect x="320" y="195" width="60" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="350" y="219" text-anchor="middle" font-size="11" fill="#202124">TCP</text>
  <rect x="380" y="195" width="120" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="440" y="219" text-anchor="middle" font-size="12" fill="#202124">Data</text>
  <text x="290" y="188" text-anchor="middle" font-size="11" fill="#202124">Packet</text>

  <rect x="200" y="265" width="60" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="230" y="289" text-anchor="middle" font-size="11" fill="#202124">Eth</text>
  <rect x="260" y="265" width="60" height="40" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="290" y="289" text-anchor="middle" font-size="11" fill="#202124">IP</text>
  <rect x="320" y="265" width="60" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="350" y="289" text-anchor="middle" font-size="11" fill="#202124">TCP</text>
  <rect x="380" y="265" width="120" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="440" y="289" text-anchor="middle" font-size="12" fill="#202124">Data</text>
  <rect x="500" y="265" width="50" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="525" y="289" text-anchor="middle" font-size="11" fill="#202124">FCS</text>
  <text x="230" y="258" text-anchor="middle" font-size="11" fill="#202124">Frame</text>

  <line x1="600" y1="60" x2="600" y2="300" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="650" y="180" text-anchor="middle" font-size="11" fill="#202124" transform="rotate(90 650 180)">wraps as it descends</text>
</svg>
