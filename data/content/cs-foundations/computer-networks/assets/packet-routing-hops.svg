<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">A packet routed hop by hop</text>

  <!-- Host A -->
  <rect x="30" y="120" width="120" height="55" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="90" y="143" text-anchor="middle" font-size="15" fill="#202124">Host A</text>
  <text x="90" y="162" text-anchor="middle" font-size="12" fill="#202124">10.0.1.5</text>

  <!-- Router 1 -->
  <rect x="200" y="120" width="120" height="55" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="260" y="143" text-anchor="middle" font-size="15" fill="#202124">Router 1</text>
  <text x="260" y="162" text-anchor="middle" font-size="12" fill="#202124">home gateway</text>

  <!-- Router 2 (ISP/core) -->
  <rect x="370" y="120" width="120" height="55" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="430" y="143" text-anchor="middle" font-size="15" fill="#202124">Router 2</text>
  <text x="430" y="162" text-anchor="middle" font-size="12" fill="#202124">ISP core</text>

  <!-- Router 3 -->
  <rect x="540" y="120" width="120" height="55" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="600" y="143" text-anchor="middle" font-size="15" fill="#202124">Router 3</text>
  <text x="600" y="162" text-anchor="middle" font-size="12" fill="#202124">dest network</text>

  <!-- Host B -->
  <rect x="540" y="230" width="120" height="55" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="600" y="253" text-anchor="middle" font-size="15" fill="#202124">Host B</text>
  <text x="600" y="272" text-anchor="middle" font-size="12" fill="#202124">93.184.0.9</text>

  <!-- arrows -->
  <line x1="150" y1="147" x2="198" y2="147" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="147" x2="368" y2="147" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="147" x2="538" y2="147" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="175" x2="600" y2="228" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="174" y="110" text-anchor="middle" font-size="11" fill="#202124">next hop</text>
  <text x="344" y="110" text-anchor="middle" font-size="11" fill="#202124">next hop</text>
  <text x="514" y="110" text-anchor="middle" font-size="11" fill="#202124">next hop</text>

  <text x="360" y="305" text-anchor="middle" font-size="12" fill="#202124">Dest IP stays fixed; each router picks the next hop from its routing table; MAC changes each hop</text>
</svg>
