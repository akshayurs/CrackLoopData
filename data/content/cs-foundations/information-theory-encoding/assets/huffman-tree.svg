<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Huffman tree: frequent symbols get shorter codes</text>

  <!-- edges (drawn first) -->
  <line x1="360" y1="80" x2="220" y2="150" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="360" y1="80" x2="500" y2="150" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="500" y1="180" x2="400" y2="250" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="500" y1="180" x2="600" y2="250" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="400" y1="280" x2="320" y2="340" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="400" y1="280" x2="480" y2="340" stroke="#5F6368" stroke-width="1.5"/>

  <!-- edge labels -->
  <text x="280" y="120" text-anchor="middle" font-size="11" fill="#202124">0</text>
  <text x="440" y="120" text-anchor="middle" font-size="11" fill="#202124">1</text>
  <text x="440" y="220" text-anchor="middle" font-size="11" fill="#202124">0</text>
  <text x="560" y="220" text-anchor="middle" font-size="11" fill="#202124">1</text>
  <text x="350" y="315" text-anchor="middle" font-size="11" fill="#202124">0</text>
  <text x="450" y="315" text-anchor="middle" font-size="11" fill="#202124">1</text>

  <!-- root -->
  <circle cx="360" cy="70" r="22" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="360" y="74" text-anchor="middle" font-size="12" fill="#202124">100</text>

  <!-- A leaf -->
  <rect x="170" y="150" width="100" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="220" y="174" text-anchor="middle" font-size="15" fill="#202124">A  freq 50</text>
  <text x="220" y="194" text-anchor="middle" font-size="12" fill="#202124">code 0</text>

  <!-- internal -->
  <circle cx="500" cy="165" r="22" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="500" y="169" text-anchor="middle" font-size="12" fill="#202124">50</text>

  <!-- B leaf -->
  <rect x="550" y="250" width="100" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="600" y="274" text-anchor="middle" font-size="15" fill="#202124">B  freq 25</text>
  <text x="600" y="294" text-anchor="middle" font-size="12" fill="#202124">code 11</text>

  <!-- internal 2 -->
  <circle cx="400" cy="265" r="22" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="400" y="269" text-anchor="middle" font-size="12" fill="#202124">25</text>

  <!-- C leaf -->
  <rect x="270" y="340" width="100" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="320" y="362" text-anchor="middle" font-size="14" fill="#202124">C  freq 15</text>
  <text x="320" y="380" text-anchor="middle" font-size="11" fill="#202124">code 100</text>

  <!-- D leaf -->
  <rect x="430" y="340" width="100" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="480" y="362" text-anchor="middle" font-size="14" fill="#202124">D  freq 10</text>
  <text x="480" y="380" text-anchor="middle" font-size="11" fill="#202124">code 101</text>
</svg>
