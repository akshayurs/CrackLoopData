<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Same message: JSON (text + keys) vs Protobuf (tags + bytes)</text>

  <!-- JSON side -->
  <rect x="40" y="60" width="300" height="190" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="190" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">JSON</text>
  <text x="60" y="116" font-size="12" fill="#202124">{</text>
  <text x="74" y="138" font-size="12" fill="#202124">"id": 42,</text>
  <text x="74" y="160" font-size="12" fill="#202124">"name": "Ada",</text>
  <text x="74" y="182" font-size="12" fill="#202124">"active": true</text>
  <text x="60" y="204" font-size="12" fill="#202124">}</text>
  <text x="190" y="234" text-anchor="middle" font-size="12" fill="#202124">~41 bytes, keys repeated</text>

  <!-- Protobuf side -->
  <rect x="380" y="60" width="300" height="190" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="530" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Protobuf wire</text>
  <text x="400" y="120" font-size="12" fill="#202124">08 2A        (tag 1, id=42)</text>
  <text x="400" y="148" font-size="12" fill="#202124">12 03 41 64 61 (tag 2, "Ada")</text>
  <text x="400" y="176" font-size="12" fill="#202124">18 01        (tag 3, active)</text>
  <text x="530" y="216" text-anchor="middle" font-size="12" fill="#202124">~10 bytes, no field names</text>

  <line x1="340" y1="155" x2="378" y2="155" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="359" y="148" text-anchor="middle" font-size="11" fill="#202124">encode</text>

  <!-- schema box -->
  <rect x="220" y="290" width="280" height="70" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="316" text-anchor="middle" font-size="14" fill="#202124">.proto schema maps</text>
  <text x="360" y="338" text-anchor="middle" font-size="12" fill="#202124">tag number to field name + type</text>

  <line x1="530" y1="250" x2="430" y2="288" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
