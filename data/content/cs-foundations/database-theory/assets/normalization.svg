<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Splitting one wide table into related tables</text>

  <!-- Wide table (warning) -->
  <rect x="40" y="60" width="280" height="120" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="180" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Orders (wide)</text>
  <text x="180" y="110" text-anchor="middle" font-size="12" fill="#202124">order_id, cust_name</text>
  <text x="180" y="130" text-anchor="middle" font-size="12" fill="#202124">cust_email, product</text>
  <text x="180" y="150" text-anchor="middle" font-size="12" fill="#202124">price, qty</text>
  <text x="180" y="170" text-anchor="middle" font-size="12" fill="#EA4335">repeats customer data</text>

  <!-- Arrow -->
  <line x1="330" y1="120" x2="400" y2="120" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="365" y="112" text-anchor="middle" font-size="11" fill="#202124">normalize</text>

  <!-- Customers (primary) -->
  <rect x="420" y="60" width="260" height="80" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="550" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Customers</text>
  <text x="550" y="108" text-anchor="middle" font-size="12" fill="#202124">cust_id (PK)</text>
  <text x="550" y="126" text-anchor="middle" font-size="12" fill="#202124">name, email</text>

  <!-- Products (success) -->
  <rect x="420" y="160" width="260" height="80" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="550" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Products</text>
  <text x="550" y="208" text-anchor="middle" font-size="12" fill="#202124">product_id (PK)</text>
  <text x="550" y="226" text-anchor="middle" font-size="12" fill="#202124">name, price</text>

  <!-- Orders (neutral) -->
  <rect x="420" y="260" width="260" height="80" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="550" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Orders</text>
  <text x="550" y="308" text-anchor="middle" font-size="12" fill="#202124">order_id (PK)</text>
  <text x="550" y="326" text-anchor="middle" font-size="12" fill="#202124">cust_id (FK), product_id (FK), qty</text>

  <!-- FK links -->
  <line x1="550" y1="260" x2="550" y2="142" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="260" x2="600" y2="242" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="255" text-anchor="middle" font-size="11" fill="#202124">FK refs</text>
</svg>
