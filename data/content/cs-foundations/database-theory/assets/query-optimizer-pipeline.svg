<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">From SQL text to a running plan</text>

  <!-- SQL -->
  <rect x="20" y="60" width="120" height="60" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="80" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">SQL text</text>
  <text x="80" y="107" text-anchor="middle" font-size="12" fill="#202124">SELECT ...</text>

  <!-- Parse -->
  <rect x="170" y="60" width="120" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="230" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Parse</text>
  <text x="230" y="107" text-anchor="middle" font-size="12" fill="#202124">+ validate</text>

  <!-- Logical plan -->
  <rect x="320" y="60" width="120" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="380" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Logical plan</text>
  <text x="380" y="103" text-anchor="middle" font-size="12" fill="#202124">relational algebra</text>

  <!-- Optimize -->
  <rect x="470" y="60" width="120" height="60" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="530" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Cost-based</text>
  <text x="530" y="103" text-anchor="middle" font-size="12" fill="#202124">optimize</text>

  <!-- Stats feeding optimizer -->
  <rect x="470" y="170" width="120" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="530" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Statistics</text>
  <text x="530" y="217" text-anchor="middle" font-size="12" fill="#202124">row counts, histograms</text>
  <line x1="530" y1="170" x2="530" y2="122" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Physical plan -->
  <rect x="320" y="170" width="120" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="380" y="194" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Physical plan</text>
  <text x="380" y="213" text-anchor="middle" font-size="12" fill="#202124">scans, joins</text>

  <!-- Execute -->
  <rect x="170" y="170" width="120" height="60" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="230" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Execute</text>
  <text x="230" y="217" text-anchor="middle" font-size="12" fill="#202124">return rows</text>

  <!-- Arrows top row -->
  <line x1="140" y1="90" x2="170" y2="90" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="290" y1="90" x2="320" y2="90" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="90" x2="470" y2="90" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- down -->
  <line x1="530" y1="120" x2="530" y2="135" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="530" y1="135" x2="450" y2="135" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="450" y1="135" x2="450" y2="160" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="450" y1="160" x2="430" y2="180" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- bottom row leftward -->
  <line x1="320" y1="200" x2="290" y2="200" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
