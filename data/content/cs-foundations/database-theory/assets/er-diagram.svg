<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">A small ER diagram (entities and relationships)</text>

  <!-- Customer -->
  <rect x="40" y="70" width="200" height="100" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="140" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Customer</text>
  <line x1="40" y1="106" x2="240" y2="106" stroke="#4285F4" stroke-width="1"/>
  <text x="140" y="126" text-anchor="middle" font-size="12" fill="#202124">cust_id (PK)</text>
  <text x="140" y="146" text-anchor="middle" font-size="12" fill="#202124">name, email</text>

  <!-- Product -->
  <rect x="480" y="70" width="200" height="100" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="580" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Product</text>
  <line x1="480" y1="106" x2="680" y2="106" stroke="#34A853" stroke-width="1"/>
  <text x="580" y="126" text-anchor="middle" font-size="12" fill="#202124">product_id (PK)</text>
  <text x="580" y="146" text-anchor="middle" font-size="12" fill="#202124">name, price</text>

  <!-- Order -->
  <rect x="40" y="220" width="200" height="100" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="140" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Order</text>
  <line x1="40" y1="256" x2="240" y2="256" stroke="#9AA0A6" stroke-width="1"/>
  <text x="140" y="276" text-anchor="middle" font-size="12" fill="#202124">order_id (PK)</text>
  <text x="140" y="296" text-anchor="middle" font-size="12" fill="#202124">cust_id (FK), date</text>

  <!-- OrderLine (junction) -->
  <rect x="480" y="220" width="200" height="100" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="580" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">OrderLine</text>
  <line x1="480" y1="256" x2="680" y2="256" stroke="#FBBC04" stroke-width="1"/>
  <text x="580" y="276" text-anchor="middle" font-size="12" fill="#202124">order_id (FK)</text>
  <text x="580" y="296" text-anchor="middle" font-size="12" fill="#202124">product_id (FK), qty</text>

  <!-- Customer 1 - many Order -->
  <line x1="140" y1="170" x2="140" y2="220" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="195" y="198" text-anchor="middle" font-size="11" fill="#202124">1 to many</text>

  <!-- Order 1 - many OrderLine -->
  <line x1="240" y1="270" x2="480" y2="270" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="262" text-anchor="middle" font-size="11" fill="#202124">1 to many</text>

  <!-- Product 1 - many OrderLine -->
  <line x1="580" y1="170" x2="580" y2="220" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="635" y="198" text-anchor="middle" font-size="11" fill="#202124">1 to many</text>
</svg>
