<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="180" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">The Stack</text>
  <text x="540" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">The Heap</text>

  <!-- Stack frames -->
  <rect x="60" y="50" width="240" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="180" y="72" text-anchor="middle" font-size="14" fill="#202124">main() frame</text>
  <text x="180" y="90" text-anchor="middle" font-size="12" fill="#202124">locals, return addr</text>

  <rect x="60" y="110" width="240" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="180" y="132" text-anchor="middle" font-size="14" fill="#202124">parse() frame</text>
  <text x="180" y="150" text-anchor="middle" font-size="12" fill="#202124">ptr, count</text>

  <rect x="60" y="170" width="240" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="180" y="192" text-anchor="middle" font-size="14" fill="#202124">read() frame (top)</text>
  <text x="180" y="210" text-anchor="middle" font-size="12" fill="#202124">grows downward</text>

  <text x="180" y="245" text-anchor="middle" font-size="12" fill="#9AA0A6">push/pop, LIFO, fast</text>
  <text x="180" y="263" text-anchor="middle" font-size="12" fill="#9AA0A6">freed automatically on return</text>

  <!-- Heap objects -->
  <rect x="420" y="50" width="110" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="475" y="80" text-anchor="middle" font-size="13" fill="#202124">Object A</text>

  <rect x="560" y="50" width="110" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="615" y="80" text-anchor="middle" font-size="13" fill="#202124">Buffer</text>

  <rect x="420" y="120" width="110" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="475" y="150" text-anchor="middle" font-size="13" fill="#202124">Object B</text>

  <rect x="560" y="120" width="110" height="50" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="615" y="150" text-anchor="middle" font-size="13" fill="#202124">free hole</text>

  <text x="540" y="200" text-anchor="middle" font-size="12" fill="#9AA0A6">scattered, any-order alloc/free</text>
  <text x="540" y="218" text-anchor="middle" font-size="12" fill="#9AA0A6">slower, can fragment</text>

  <!-- pointer from stack into heap -->
  <line x1="300" y1="135" x2="418" y2="75" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="100" text-anchor="middle" font-size="11" fill="#5F6368">ptr -&gt; heap</text>

  <text x="360" y="320" text-anchor="middle" font-size="12" fill="#202124">Stack holds the pointer; the heap holds the big data it points to.</text>
</svg>
