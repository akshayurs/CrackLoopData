<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Mark &amp; Sweep: before vs after</text>

  <!-- BEFORE -->
  <text x="180" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#202124">Before (after marking)</text>

  <rect x="120" y="75" width="120" height="44" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="180" y="102" text-anchor="middle" font-size="13" fill="#202124">Roots</text>

  <rect x="60" y="150" width="110" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="115" y="177" text-anchor="middle" font-size="13" fill="#202124">A (marked)</text>

  <rect x="190" y="150" width="110" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="245" y="177" text-anchor="middle" font-size="13" fill="#202124">B (marked)</text>

  <rect x="60" y="225" width="110" height="44" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="115" y="252" text-anchor="middle" font-size="13" fill="#202124">C (garbage)</text>

  <rect x="190" y="225" width="110" height="44" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="245" y="252" text-anchor="middle" font-size="13" fill="#202124">D (garbage)</text>

  <line x1="160" y1="119" x2="120" y2="148" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="119" x2="240" y2="148" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="252" text-anchor="middle" font-size="11" fill="#9AA0A6">unreachable</text>

  <!-- AFTER -->
  <text x="540" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#202124">After (sweep)</text>

  <rect x="480" y="75" width="120" height="44" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="540" y="102" text-anchor="middle" font-size="13" fill="#202124">Roots</text>

  <rect x="420" y="150" width="110" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="475" y="177" text-anchor="middle" font-size="13" fill="#202124">A (kept)</text>

  <rect x="550" y="150" width="110" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="605" y="177" text-anchor="middle" font-size="13" fill="#202124">B (kept)</text>

  <rect x="420" y="225" width="110" height="44" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="475" y="252" text-anchor="middle" font-size="13" fill="#9AA0A6">free</text>

  <rect x="550" y="225" width="110" height="44" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="605" y="252" text-anchor="middle" font-size="13" fill="#9AA0A6">free</text>

  <line x1="520" y1="119" x2="480" y2="148" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="119" x2="600" y2="148" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="305" y1="172" x2="415" y2="172" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="160" text-anchor="middle" font-size="11" fill="#5F6368">collect</text>

  <text x="360" y="320" text-anchor="middle" font-size="12" fill="#202124">Mark from roots, then free everything left unmarked.</text>
  <text x="360" y="342" text-anchor="middle" font-size="12" fill="#9AA0A6">Note: gaps remain (fragmentation) unless we also compact.</text>
</svg>
