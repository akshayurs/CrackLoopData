<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Generational GC</text>

  <!-- Young gen -->
  <rect x="50" y="60" width="300" height="160" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="200" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#202124">Young generation</text>

  <rect x="70" y="100" width="120" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="130" y="127" text-anchor="middle" font-size="13" fill="#202124">Eden</text>

  <rect x="210" y="100" width="55" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="237" y="127" text-anchor="middle" font-size="12" fill="#202124">S0</text>

  <rect x="275" y="100" width="55" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="302" y="127" text-anchor="middle" font-size="12" fill="#202124">S1</text>

  <text x="200" y="180" text-anchor="middle" font-size="12" fill="#9AA0A6">most objects die here</text>
  <text x="200" y="200" text-anchor="middle" font-size="12" fill="#9AA0A6">minor GC: frequent, fast</text>

  <!-- Old gen -->
  <rect x="430" y="60" width="240" height="160" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="550" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#202124">Old generation</text>

  <rect x="450" y="100" width="200" height="44" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="550" y="127" text-anchor="middle" font-size="13" fill="#202124">long-lived objects</text>

  <text x="550" y="180" text-anchor="middle" font-size="12" fill="#9AA0A6">survivors get promoted</text>
  <text x="550" y="200" text-anchor="middle" font-size="12" fill="#9AA0A6">major GC: rare, slower</text>

  <!-- promotion arrow -->
  <line x1="352" y1="140" x2="428" y2="140" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="128" text-anchor="middle" font-size="11" fill="#5F6368">promote</text>

  <text x="360" y="270" text-anchor="middle" font-size="12" fill="#202124">New objects start in Eden; survivors hop S0/S1, then promote to Old.</text>
  <text x="360" y="292" text-anchor="middle" font-size="12" fill="#9AA0A6">Weak generational hypothesis: most objects die young, so scan young often.</text>
</svg>
