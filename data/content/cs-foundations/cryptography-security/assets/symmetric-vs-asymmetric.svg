<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="180" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Symmetric</text>
  <text x="180" y="46" text-anchor="middle" font-size="12" fill="#5F6368">one shared key</text>

  <rect x="40" y="70" width="120" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="100" y="95" text-anchor="middle" font-size="15" fill="#202124">Alice</text>
  <text x="100" y="114" text-anchor="middle" font-size="12" fill="#5F6368">key K</text>

  <rect x="200" y="70" width="120" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="260" y="95" text-anchor="middle" font-size="15" fill="#202124">Bob</text>
  <text x="260" y="114" text-anchor="middle" font-size="12" fill="#5F6368">same key K</text>

  <line x1="160" y1="98" x2="200" y2="98" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="180" y="160" text-anchor="middle" font-size="11" fill="#5F6368">encrypt + decrypt</text>
  <text x="180" y="178" text-anchor="middle" font-size="11" fill="#5F6368">with K (fast, AES)</text>
  <text x="180" y="210" text-anchor="middle" font-size="11" fill="#EA4335">problem: how share K?</text>

  <text x="530" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Asymmetric</text>
  <text x="530" y="46" text-anchor="middle" font-size="12" fill="#5F6368">key pair</text>

  <rect x="390" y="70" width="120" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="450" y="95" text-anchor="middle" font-size="15" fill="#202124">Alice</text>
  <text x="450" y="114" text-anchor="middle" font-size="12" fill="#5F6368">Bob's public key</text>

  <rect x="550" y="70" width="120" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="610" y="95" text-anchor="middle" font-size="15" fill="#202124">Bob</text>
  <text x="610" y="114" text-anchor="middle" font-size="12" fill="#5F6368">private key</text>

  <line x1="510" y1="98" x2="550" y2="98" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="160" text-anchor="middle" font-size="11" fill="#5F6368">encrypt with public</text>
  <text x="530" y="178" text-anchor="middle" font-size="11" fill="#5F6368">decrypt with private (slow, RSA/ECC)</text>
  <text x="530" y="210" text-anchor="middle" font-size="11" fill="#34A853">no shared secret needed</text>

  <rect x="120" y="260" width="480" height="70" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Hybrid (real world)</text>
  <text x="360" y="310" text-anchor="middle" font-size="12" fill="#5F6368">asymmetric to share a random K, then symmetric for the data</text>
</svg>
