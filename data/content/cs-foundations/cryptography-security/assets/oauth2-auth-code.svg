<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="130" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="105" y="62" text-anchor="middle" font-size="14" fill="#202124">User</text>
  <text x="105" y="80" text-anchor="middle" font-size="11" fill="#5F6368">browser</text>

  <rect x="295" y="40" width="130" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="62" text-anchor="middle" font-size="14" fill="#202124">App</text>
  <text x="360" y="80" text-anchor="middle" font-size="11" fill="#5F6368">client</text>

  <rect x="550" y="40" width="130" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="615" y="62" text-anchor="middle" font-size="14" fill="#202124">Auth Server</text>
  <text x="615" y="80" text-anchor="middle" font-size="11" fill="#5F6368">e.g. Google</text>

  <line x1="170" y1="125" x2="295" y2="125" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="232" y="118" text-anchor="middle" font-size="11" fill="#202124">1. login</text>

  <line x1="295" y1="165" x2="170" y2="165" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="232" y="158" text-anchor="middle" font-size="11" fill="#202124">2. redirect</text>

  <line x1="170" y1="205" x2="550" y2="205" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="198" text-anchor="middle" font-size="11" fill="#202124">3. consent (user approves)</text>

  <line x1="550" y1="245" x2="170" y2="245" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="238" text-anchor="middle" font-size="11" fill="#202124">4. redirect with auth code</text>

  <line x1="170" y1="285" x2="295" y2="285" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="232" y="278" text-anchor="middle" font-size="11" fill="#202124">5. code</text>

  <line x1="425" y1="325" x2="550" y2="325" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="488" y="318" text-anchor="middle" font-size="11" fill="#202124">6. code + secret</text>

  <line x1="550" y1="365" x2="425" y2="365" stroke="#34A853" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="488" y="358" text-anchor="middle" font-size="11" fill="#34A853">7. access + ID token</text>

  <rect x="160" y="395" width="400" height="36" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="418" text-anchor="middle" font-size="12" fill="#202124">tokens never pass through the user's browser</text>
</svg>
