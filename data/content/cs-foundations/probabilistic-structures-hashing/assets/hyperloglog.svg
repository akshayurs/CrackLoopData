<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Input -->
  <rect x="30" y="50" width="120" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="90" y="75" text-anchor="middle" font-size="14" fill="#202124">item</text>

  <!-- Hash -->
  <rect x="190" y="50" width="120" height="40" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="250" y="68" text-anchor="middle" font-size="13" fill="#202124">hash(item)</text>
  <text x="250" y="84" text-anchor="middle" font-size="11" fill="#9AA0A6">64-bit value</text>
  <path d="M150,70 L188,70" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Split -->
  <rect x="190" y="120" width="120" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="250" y="143" text-anchor="middle" font-size="12" fill="#202124">first bits = bucket</text>
  <rect x="190" y="166" width="120" height="36" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="250" y="189" text-anchor="middle" font-size="12" fill="#202124">rest = count zeros</text>
  <path d="M250,90 L250,118" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Buckets / registers -->
  <text x="500" y="44" text-anchor="middle" font-size="12" fill="#9AA0A6">registers (m buckets, keep max run of leading zeros)</text>
  <g font-size="14" fill="#202124">
    <rect x="380" y="60" width="48" height="48" rx="4" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="404" y="89" text-anchor="middle">3</text>
    <rect x="436" y="60" width="48" height="48" rx="4" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="460" y="89" text-anchor="middle">5</text>
    <rect x="492" y="60" width="48" height="48" rx="4" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="516" y="89" text-anchor="middle">2</text>
    <rect x="548" y="60" width="48" height="48" rx="4" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="572" y="89" text-anchor="middle">4</text>
    <rect x="604" y="60" width="48" height="48" rx="4" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="628" y="89" text-anchor="middle">6</text>
  </g>
  <path d="M310,138 Q345,120 378,100" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M310,184 Q400,160 458,110" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Estimate -->
  <rect x="380" y="170" width="290" height="120" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="525" y="200" text-anchor="middle" font-size="13" fill="#202124">Combine registers (harmonic mean)</text>
  <text x="525" y="226" text-anchor="middle" font-size="13" fill="#202124">estimate distinct count</text>
  <text x="525" y="256" text-anchor="middle" font-size="13" fill="#34A853">~12 KB tracks billions</text>
  <text x="525" y="278" text-anchor="middle" font-size="12" fill="#9AA0A6">error around 2%</text>
</svg>
