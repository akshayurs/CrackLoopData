<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Input -->
  <rect x="40" y="40" width="120" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="100" y="65" text-anchor="middle" font-size="14" fill="#202124">add "cat"</text>

  <!-- Hash functions -->
  <rect x="220" y="20" width="90" height="32" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="265" y="41" text-anchor="middle" font-size="13" fill="#202124">h1</text>
  <rect x="220" y="64" width="90" height="32" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="265" y="85" text-anchor="middle" font-size="13" fill="#202124">h2</text>
  <rect x="220" y="108" width="90" height="32" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="265" y="129" text-anchor="middle" font-size="13" fill="#202124">h3</text>

  <path d="M160,58 Q190,40 218,36" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M160,62 L218,78" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M160,66 Q190,100 218,122" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bit array -->
  <text x="380" y="200" font-size="12" fill="#9AA0A6">bit array (m bits)</text>
  <g font-size="13" fill="#202124">
    <rect x="380" y="210" width="34" height="34" rx="4" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="397" y="232" text-anchor="middle">0</text>
    <rect x="414" y="210" width="34" height="34" rx="4" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="431" y="232" text-anchor="middle">1</text>
    <rect x="448" y="210" width="34" height="34" rx="4" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="465" y="232" text-anchor="middle">0</text>
    <rect x="482" y="210" width="34" height="34" rx="4" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="499" y="232" text-anchor="middle">1</text>
    <rect x="516" y="210" width="34" height="34" rx="4" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="533" y="232" text-anchor="middle">0</text>
    <rect x="550" y="210" width="34" height="34" rx="4" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="567" y="232" text-anchor="middle">0</text>
    <rect x="584" y="210" width="34" height="34" rx="4" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/><text x="601" y="232" text-anchor="middle">1</text>
    <rect x="618" y="210" width="34" height="34" rx="4" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/><text x="635" y="232" text-anchor="middle">0</text>
  </g>

  <!-- arrows from hashes to set bits -->
  <path d="M310,36 Q360,120 431,208" fill="none" stroke="#34A853" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M310,80 Q400,140 499,208" fill="none" stroke="#34A853" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M310,124 Q450,160 601,208" fill="none" stroke="#34A853" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="160" font-size="11" fill="#34A853">set bits to 1</text>

  <!-- Verdict box -->
  <rect x="40" y="270" width="640" height="60" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="360" y="296" text-anchor="middle" font-size="13" fill="#202124">Query: all k bits set =&gt; "maybe present" (could be false positive)</text>
  <text x="360" y="318" text-anchor="middle" font-size="13" fill="#202124">Any bit 0 =&gt; "definitely absent" (never a false negative)</text>
</svg>
