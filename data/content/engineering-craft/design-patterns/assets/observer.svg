<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Subject -->
  <rect x="40" y="120" width="200" height="90" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="140" y="152" text-anchor="middle" font-size="15" fill="#202124">Subject</text>
  <text x="140" y="172" text-anchor="middle" font-size="12" fill="#202124">OrderTopic</text>
  <text x="140" y="192" text-anchor="middle" font-size="12" fill="#202124">notify()</text>

  <!-- Observers -->
  <rect x="500" y="20" width="180" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="590" y="55" text-anchor="middle" font-size="13" fill="#202124">EmailService</text>

  <rect x="500" y="130" width="180" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="590" y="165" text-anchor="middle" font-size="13" fill="#202124">InventoryService</text>

  <rect x="500" y="240" width="180" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="590" y="275" text-anchor="middle" font-size="13" fill="#202124">AnalyticsService</text>

  <!-- Arrows: subject notifies observers -->
  <line x1="240" y1="150" x2="498" y2="55" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="165" x2="498" y2="160" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="180" x2="498" y2="265" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="110" text-anchor="middle" font-size="11" fill="#5F6368">publishes event</text>
</svg>
