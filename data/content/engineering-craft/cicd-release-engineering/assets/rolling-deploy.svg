<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Batch labels -->
  <text x="60" y="30" font-size="13" fill="#202124" text-anchor="middle" font-weight="bold">Start</text>
  <text x="290" y="30" font-size="13" fill="#202124" text-anchor="middle" font-weight="bold">Batch 1</text>
  <text x="520" y="30" font-size="13" fill="#202124" text-anchor="middle" font-weight="bold">Done</text>

  <!-- Helper: 4 instances per column -->
  <!-- Stage 0: all old -->
  <g>
    <rect x="20" y="50" width="80" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
    <text x="60" y="75" font-size="13" fill="#202124" text-anchor="middle">v1</text>
    <rect x="20" y="100" width="80" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
    <text x="60" y="125" font-size="13" fill="#202124" text-anchor="middle">v1</text>
    <rect x="20" y="150" width="80" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
    <text x="60" y="175" font-size="13" fill="#202124" text-anchor="middle">v1</text>
    <rect x="20" y="200" width="80" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
    <text x="60" y="225" font-size="13" fill="#202124" text-anchor="middle">v1</text>
  </g>

  <!-- Stage 1: top two new -->
  <g>
    <rect x="250" y="50" width="80" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
    <text x="290" y="75" font-size="13" fill="#202124" text-anchor="middle">v2</text>
    <rect x="250" y="100" width="80" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
    <text x="290" y="125" font-size="13" fill="#202124" text-anchor="middle">v2</text>
    <rect x="250" y="150" width="80" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
    <text x="290" y="175" font-size="13" fill="#202124" text-anchor="middle">v1</text>
    <rect x="250" y="200" width="80" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
    <text x="290" y="225" font-size="13" fill="#202124" text-anchor="middle">v1</text>
  </g>

  <!-- Stage 2: all new -->
  <g>
    <rect x="480" y="50" width="80" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
    <text x="520" y="75" font-size="13" fill="#202124" text-anchor="middle">v2</text>
    <rect x="480" y="100" width="80" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
    <text x="520" y="125" font-size="13" fill="#202124" text-anchor="middle">v2</text>
    <rect x="480" y="150" width="80" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
    <text x="520" y="175" font-size="13" fill="#202124" text-anchor="middle">v2</text>
    <rect x="480" y="200" width="80" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
    <text x="520" y="225" font-size="13" fill="#202124" text-anchor="middle">v2</text>
  </g>

  <!-- Arrows -->
  <line x1="105" y1="145" x2="245" y2="145" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="335" y1="145" x2="475" y2="145" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="175" y="135" font-size="11" fill="#202124" text-anchor="middle">replace 2</text>
  <text x="405" y="135" font-size="11" fill="#202124" text-anchor="middle">replace 2</text>

  <text x="360" y="268" font-size="11" fill="#202124" text-anchor="middle">Capacity stays up the whole time; both versions run together mid-roll</text>
</svg>
