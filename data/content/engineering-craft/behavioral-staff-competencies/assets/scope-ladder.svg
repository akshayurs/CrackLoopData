<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="32" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Scope ladder: where your impact lands</text>

  <rect x="60" y="210" width="200" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="160" y="236" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Mid / SDE2</text>
  <text x="160" y="256" text-anchor="middle" font-size="12" fill="#202124">delivers own tasks</text>

  <rect x="260" y="130" width="200" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="156" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Senior</text>
  <text x="360" y="176" text-anchor="middle" font-size="12" fill="#202124">leads the team</text>

  <rect x="460" y="50" width="200" height="60" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="560" y="76" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Staff</text>
  <text x="560" y="96" text-anchor="middle" font-size="12" fill="#202124">moves the org</text>

  <line x1="200" y1="210" x2="300" y2="192" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="130" x2="500" y2="112" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="40" y="270" text-anchor="middle" font-size="11" fill="#5F6368">individual</text>
  <text x="40" y="190" text-anchor="middle" font-size="11" fill="#5F6368">team</text>
  <text x="40" y="110" text-anchor="middle" font-size="11" fill="#5F6368">org</text>
  <line x1="40" y1="200" x2="40" y2="60" stroke="#9AA0A6" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
