<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- commits row -->
  <rect x="40" y="40" width="150" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="115" y="65" text-anchor="middle" font-size="15" fill="#202124">commit C1</text>
  <text x="115" y="84" text-anchor="middle" font-size="12" fill="#202124">"init"</text>

  <rect x="290" y="40" width="150" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="365" y="65" text-anchor="middle" font-size="15" fill="#202124">commit C2</text>
  <text x="365" y="84" text-anchor="middle" font-size="12" fill="#202124">"add login"</text>

  <!-- parent link -->
  <line x1="290" y1="70" x2="200" y2="70" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="60" text-anchor="middle" font-size="11" fill="#5F6368">parent</text>

  <!-- tree -->
  <rect x="290" y="160" width="150" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="365" y="185" text-anchor="middle" font-size="15" fill="#202124">tree</text>
  <text x="365" y="204" text-anchor="middle" font-size="12" fill="#202124">directory snapshot</text>

  <line x1="365" y1="160" x2="365" y2="100" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="408" y="135" text-anchor="middle" font-size="11" fill="#5F6368">points to</text>

  <!-- blobs -->
  <rect x="200" y="280" width="150" height="55" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="275" y="305" text-anchor="middle" font-size="15" fill="#202124">blob</text>
  <text x="275" y="323" text-anchor="middle" font-size="12" fill="#202124">login.js bytes</text>

  <rect x="400" y="280" width="150" height="55" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="475" y="305" text-anchor="middle" font-size="15" fill="#202124">blob</text>
  <text x="475" y="323" text-anchor="middle" font-size="12" fill="#202124">README bytes</text>

  <line x1="320" y1="280" x2="350" y2="220" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="455" y1="280" x2="385" y2="220" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- branch ref -->
  <rect x="500" y="40" width="150" height="60" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="575" y="65" text-anchor="middle" font-size="15" fill="#202124">ref: main</text>
  <text x="575" y="84" text-anchor="middle" font-size="12" fill="#202124">just a pointer</text>
  <line x1="500" y1="70" x2="440" y2="70" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
