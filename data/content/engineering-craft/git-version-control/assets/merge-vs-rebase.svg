<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="15" fill="#202124" font-weight="bold">MERGE: keeps both lines, adds a merge commit</text>

  <rect x="40" y="50" width="90" height="44" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="85" y="77" text-anchor="middle" font-size="13" fill="#202124">A</text>
  <rect x="170" y="50" width="90" height="44" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="215" y="77" text-anchor="middle" font-size="13" fill="#202124">B (main)</text>

  <rect x="170" y="120" width="90" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="215" y="147" text-anchor="middle" font-size="13" fill="#202124">C (feat)</text>

  <rect x="330" y="85" width="110" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="385" y="112" text-anchor="middle" font-size="13" fill="#202124">M merge</text>

  <line x1="170" y1="72" x2="130" y2="72" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="170" y1="142" x2="125" y2="90" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="100" x2="262" y2="78" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="112" x2="262" y2="144" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="20" y="240" font-size="15" fill="#202124" font-weight="bold">REBASE: replays feature commits onto main, straight line</text>

  <rect x="40" y="260" width="90" height="44" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="85" y="287" text-anchor="middle" font-size="13" fill="#202124">A</text>
  <rect x="170" y="260" width="90" height="44" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="215" y="287" text-anchor="middle" font-size="13" fill="#202124">B (main)</text>
  <rect x="300" y="260" width="110" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="355" y="287" text-anchor="middle" font-size="13" fill="#202124">C' (feat)</text>

  <line x1="170" y1="282" x2="130" y2="282" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="282" x2="262" y2="282" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="355" y="335" text-anchor="middle" font-size="11" fill="#5F6368">C rewritten as C' (new hash)</text>
</svg>
