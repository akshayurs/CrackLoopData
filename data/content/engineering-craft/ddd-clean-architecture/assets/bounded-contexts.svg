<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Sales context -->
  <rect x="40" y="60" width="180" height="90" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="130" y="92" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Sales</text>
  <text x="130" y="113" text-anchor="middle" font-size="12" fill="#202124">Customer = lead</text>
  <text x="130" y="131" text-anchor="middle" font-size="12" fill="#202124">Order = cart</text>

  <!-- Shipping context -->
  <rect x="500" y="60" width="180" height="90" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="590" y="92" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Shipping</text>
  <text x="590" y="113" text-anchor="middle" font-size="12" fill="#202124">Customer = address</text>
  <text x="590" y="131" text-anchor="middle" font-size="12" fill="#202124">Order = parcel</text>

  <!-- Billing context -->
  <rect x="270" y="220" width="180" height="90" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="252" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Billing</text>
  <text x="360" y="273" text-anchor="middle" font-size="12" fill="#202124">Customer = payer</text>
  <text x="360" y="291" text-anchor="middle" font-size="12" fill="#202124">Order = invoice</text>

  <!-- Relationships -->
  <line x1="220" y1="105" x2="500" y2="105" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="95" text-anchor="middle" font-size="11" fill="#5F6368">OrderPlaced event</text>

  <line x1="180" y1="150" x2="300" y2="220" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="200" text-anchor="middle" font-size="11" fill="#5F6368">customer-supplier</text>

  <line x1="540" y1="150" x2="430" y2="220" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="200" text-anchor="middle" font-size="11" fill="#5F6368">anti-corruption</text>

  <text x="360" y="40" text-anchor="middle" font-size="13" fill="#5F6368">Same word "Customer" means different things per context</text>
</svg>
