<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Domain core -->
  <rect x="280" y="170" width="160" height="100" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="205" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Domain Core</text>
  <text x="360" y="228" text-anchor="middle" font-size="12" fill="#202124">entities, rules</text>
  <text x="360" y="246" text-anchor="middle" font-size="12" fill="#202124">no framework</text>

  <!-- Ports (on the edge of core) -->
  <rect x="180" y="195" width="100" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="230" y="218" text-anchor="middle" font-size="13" fill="#202124">Driving Port</text>
  <text x="230" y="235" text-anchor="middle" font-size="11" fill="#202124">use-case API</text>

  <rect x="440" y="195" width="100" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="490" y="218" text-anchor="middle" font-size="13" fill="#202124">Driven Port</text>
  <text x="490" y="235" text-anchor="middle" font-size="11" fill="#202124">repo interface</text>

  <!-- Driving adapters (left) -->
  <rect x="30" y="60" width="120" height="55" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="90" y="83" text-anchor="middle" font-size="13" fill="#202124">REST API</text>
  <text x="90" y="101" text-anchor="middle" font-size="11" fill="#202124">adapter</text>

  <rect x="30" y="325" width="120" height="55" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="90" y="348" text-anchor="middle" font-size="13" fill="#202124">CLI / Test</text>
  <text x="90" y="366" text-anchor="middle" font-size="11" fill="#202124">adapter</text>

  <!-- Driven adapters (right) -->
  <rect x="570" y="60" width="120" height="55" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="630" y="83" text-anchor="middle" font-size="13" fill="#202124">Postgres</text>
  <text x="630" y="101" text-anchor="middle" font-size="11" fill="#202124">adapter</text>

  <rect x="570" y="325" width="120" height="55" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="630" y="348" text-anchor="middle" font-size="13" fill="#202124">Kafka / Email</text>
  <text x="630" y="366" text-anchor="middle" font-size="11" fill="#202124">adapter</text>

  <!-- Arrows: driving adapters -> driving port -->
  <line x1="150" y1="88" x2="225" y2="195" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="352" x2="225" y2="245" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrows: driven port -> driven adapters -->
  <line x1="540" y1="210" x2="572" y2="100" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="230" x2="572" y2="340" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Ports into core -->
  <line x1="280" y1="220" x2="280" y2="220" stroke="#5F6368" stroke-width="1.5"/>

  <text x="360" y="40" text-anchor="middle" font-size="13" fill="#5F6368">Outside calls in through ports; core depends on no one</text>
  <text x="90" y="135" text-anchor="middle" font-size="11" fill="#5F6368">driving side</text>
  <text x="630" y="135" text-anchor="middle" font-size="11" fill="#5F6368">driven side</text>
</svg>
