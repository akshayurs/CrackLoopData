<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Concentric layers as nested rounded rects -->
  <rect x="60" y="40" width="500" height="340" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="310" y="64" text-anchor="middle" font-size="13" fill="#202124" font-weight="bold">Frameworks &amp; Drivers</text>
  <text x="310" y="82" text-anchor="middle" font-size="11" fill="#202124">web, db, kafka</text>

  <rect x="120" y="100" width="380" height="240" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="310" y="124" text-anchor="middle" font-size="13" fill="#202124" font-weight="bold">Interface Adapters</text>
  <text x="310" y="142" text-anchor="middle" font-size="11" fill="#202124">controllers, gateways</text>

  <rect x="180" y="160" width="260" height="120" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="310" y="184" text-anchor="middle" font-size="13" fill="#202124" font-weight="bold">Application</text>
  <text x="310" y="202" text-anchor="middle" font-size="11" fill="#202124">use cases</text>

  <rect x="230" y="218" width="160" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="310" y="240" text-anchor="middle" font-size="13" fill="#202124" font-weight="bold">Entities</text>
  <text x="310" y="257" text-anchor="middle" font-size="11" fill="#202124">domain rules</text>

  <!-- Dependency rule arrow -->
  <line x1="650" y1="380" x2="650" y2="60" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="668" y="220" text-anchor="middle" font-size="12" fill="#5F6368" transform="rotate(90 668 220)">dependencies point inward</text>

  <text x="310" y="405" text-anchor="middle" font-size="12" fill="#5F6368">Inner layers know nothing about outer layers</text>
</svg>
