<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#202124">Locating a bottleneck (top down)</text>

  <!-- 1 -->
  <rect x="260" y="44" width="200" height="46" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="64" text-anchor="middle" font-size="13" fill="#202124">1. Define SLO</text>
  <text x="360" y="80" text-anchor="middle" font-size="11" fill="#202124">p99 &lt; 200ms?</text>

  <line x1="360" y1="90" x2="360" y2="110" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2 -->
  <rect x="260" y="110" width="200" height="46" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="130" text-anchor="middle" font-size="13" fill="#202124">2. Measure end-to-end</text>
  <text x="360" y="146" text-anchor="middle" font-size="11" fill="#202124">trace the request</text>

  <line x1="360" y1="156" x2="360" y2="176" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3 -->
  <rect x="260" y="176" width="200" height="46" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="196" text-anchor="middle" font-size="13" fill="#202124">3. Find biggest span</text>
  <text x="360" y="212" text-anchor="middle" font-size="11" fill="#202124">USE: util / sat / err</text>

  <line x1="360" y1="222" x2="360" y2="242" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4 -->
  <rect x="260" y="242" width="200" height="46" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="262" text-anchor="middle" font-size="13" fill="#202124">4. Profile that span</text>
  <text x="360" y="278" text-anchor="middle" font-size="11" fill="#202124">CPU / alloc / IO wait</text>

  <line x1="360" y1="288" x2="360" y2="308" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5 -->
  <rect x="260" y="308" width="200" height="46" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="328" text-anchor="middle" font-size="13" fill="#202124">5. Fix, re-measure</text>
  <text x="360" y="344" text-anchor="middle" font-size="11" fill="#202124">verify, repeat</text>

  <!-- loop back arrow -->
  <line x1="460" y1="331" x2="560" y2="331" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="560" y1="331" x2="560" y2="133" stroke="#5F6368" stroke-width="1.5"/>
  <line x1="560" y1="133" x2="460" y2="133" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="575" y="235" font-size="11" fill="#9AA0A6">next</text>
  <text x="575" y="251" font-size="11" fill="#9AA0A6">bottleneck</text>
</svg>
