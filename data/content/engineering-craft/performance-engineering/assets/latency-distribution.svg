<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#202124">Latency distribution (long right tail)</text>

  <!-- axes -->
  <line x1="70" y1="60" x2="70" y2="260" stroke="#9AA0A6" stroke-width="1.5"/>
  <line x1="70" y1="260" x2="690" y2="260" stroke="#9AA0A6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="30" y="64" font-size="11" fill="#202124">count</text>
  <text x="640" y="282" font-size="12" fill="#202124">latency (ms)</text>

  <!-- distribution curve: tall hump near left, long tail right -->
  <path d="M70,260 C150,260 150,90 220,90 C300,90 320,200 420,225 C520,248 600,256 690,259"
        fill="none" stroke="#4285F4" stroke-width="2.5"/>

  <!-- p50 -->
  <line x1="200" y1="90" x2="200" y2="260" stroke="#34A853" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="200" y="305" text-anchor="middle" font-size="12" fill="#34A853">p50</text>
  <text x="200" y="322" text-anchor="middle" font-size="11" fill="#202124">40ms</text>

  <!-- p95 -->
  <line x1="420" y1="225" x2="420" y2="260" stroke="#FBBC04" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="420" y="305" text-anchor="middle" font-size="12" fill="#FBBC04">p95</text>
  <text x="420" y="322" text-anchor="middle" font-size="11" fill="#202124">180ms</text>

  <!-- p99 -->
  <line x1="560" y1="252" x2="560" y2="260" stroke="#EA4335" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="560" y="305" text-anchor="middle" font-size="12" fill="#EA4335">p99</text>
  <text x="560" y="322" text-anchor="middle" font-size="11" fill="#202124">900ms</text>

  <!-- tail callout -->
  <line x1="610" y1="150" x2="600" y2="255" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="615" y="140" font-size="12" fill="#EA4335">the tail hurts</text>
  <text x="615" y="156" font-size="11" fill="#202124">few but slow</text>

  <!-- mean marker -->
  <text x="300" y="90" font-size="11" fill="#9AA0A6">avg hides the tail</text>
</svg>
