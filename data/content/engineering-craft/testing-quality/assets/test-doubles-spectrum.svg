<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="15" fill="#202124">From dumbest to smartest</text>

  <!-- spectrum line -->
  <line x1="40" y1="70" x2="690" y2="70" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Dummy -->
  <rect x="30" y="100" width="120" height="80" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="90" y="135" text-anchor="middle" font-size="15" fill="#202124">Dummy</text>
  <text x="90" y="155" text-anchor="middle" font-size="12" fill="#202124">filler only</text>

  <!-- Stub -->
  <rect x="170" y="100" width="120" height="80" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="230" y="135" text-anchor="middle" font-size="15" fill="#202124">Stub</text>
  <text x="230" y="155" text-anchor="middle" font-size="12" fill="#202124">canned answers</text>

  <!-- Spy -->
  <rect x="310" y="100" width="120" height="80" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="370" y="135" text-anchor="middle" font-size="15" fill="#202124">Spy</text>
  <text x="370" y="155" text-anchor="middle" font-size="12" fill="#202124">records calls</text>

  <!-- Fake -->
  <rect x="450" y="100" width="120" height="80" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="510" y="135" text-anchor="middle" font-size="15" fill="#202124">Fake</text>
  <text x="510" y="155" text-anchor="middle" font-size="12" fill="#202124">working shortcut</text>

  <!-- Mock -->
  <rect x="590" y="100" width="120" height="80" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="650" y="135" text-anchor="middle" font-size="15" fill="#202124">Mock</text>
  <text x="650" y="155" text-anchor="middle" font-size="12" fill="#202124">asserts calls</text>

  <text x="90" y="235" text-anchor="middle" font-size="11" fill="#5F6368">no behavior</text>
  <text x="290" y="235" text-anchor="middle" font-size="11" fill="#5F6368">feeds state</text>
  <text x="510" y="235" text-anchor="middle" font-size="11" fill="#5F6368">real-ish logic</text>
  <text x="650" y="235" text-anchor="middle" font-size="11" fill="#5F6368">checks behavior</text>
</svg>
