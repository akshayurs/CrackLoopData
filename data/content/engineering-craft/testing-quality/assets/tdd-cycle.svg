<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Red -->
  <rect x="280" y="30" width="160" height="80" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="360" y="65" text-anchor="middle" font-size="15" fill="#202124">Red</text>
  <text x="360" y="85" text-anchor="middle" font-size="12" fill="#202124">failing test first</text>

  <!-- Green -->
  <rect x="500" y="200" width="160" height="80" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="580" y="235" text-anchor="middle" font-size="15" fill="#202124">Green</text>
  <text x="580" y="255" text-anchor="middle" font-size="12" fill="#202124">make it pass</text>

  <!-- Refactor -->
  <rect x="60" y="200" width="160" height="80" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="140" y="235" text-anchor="middle" font-size="15" fill="#202124">Refactor</text>
  <text x="140" y="255" text-anchor="middle" font-size="12" fill="#202124">clean it up</text>

  <!-- arrows in a loop -->
  <line x1="440" y1="95" x2="540" y2="195" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="140" text-anchor="middle" font-size="11" fill="#5F6368">write code</text>

  <line x1="500" y1="265" x2="220" y2="265" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="285" text-anchor="middle" font-size="11" fill="#5F6368">tests still green</text>

  <line x1="160" y1="195" x2="290" y2="105" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="190" y="140" text-anchor="middle" font-size="11" fill="#5F6368">next test</text>
</svg>
