<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <rect x="20" y="80" width="140" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="90" y="106" font-size="15" fill="#202124" text-anchor="middle">Reproduce</text>
  <text x="90" y="124" font-size="12" fill="#202124" text-anchor="middle">make it happen</text>

  <rect x="200" y="80" width="140" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="270" y="106" font-size="15" fill="#202124" text-anchor="middle">Isolate</text>
  <text x="270" y="124" font-size="12" fill="#202124" text-anchor="middle">narrow the area</text>

  <rect x="380" y="80" width="140" height="60" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="450" y="106" font-size="15" fill="#202124" text-anchor="middle">Hypothesize</text>
  <text x="450" y="124" font-size="12" fill="#202124" text-anchor="middle">guess the cause</text>

  <rect x="560" y="80" width="140" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="630" y="106" font-size="15" fill="#202124" text-anchor="middle">Test</text>
  <text x="630" y="124" font-size="12" fill="#202124" text-anchor="middle">prove or kill it</text>

  <line x1="160" y1="110" x2="198" y2="110" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="110" x2="378" y2="110" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="110" x2="558" y2="110" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M630,140 L630,185 L90,185 L90,142" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="200" font-size="11" fill="#5F6368" text-anchor="middle">wrong guess: loop back with new info</text>
</svg>
