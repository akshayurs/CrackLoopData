<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Open PR -->
  <rect x="20" y="70" width="120" height="60" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="80" y="95" text-anchor="middle" font-size="15" fill="#202124">Open PR</text>
  <text x="80" y="113" text-anchor="middle" font-size="12" fill="#202124">author</text>

  <!-- Review -->
  <rect x="180" y="70" width="120" height="60" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="240" y="95" text-anchor="middle" font-size="15" fill="#202124">Review</text>
  <text x="240" y="113" text-anchor="middle" font-size="12" fill="#202124">reviewer reads</text>

  <!-- Address -->
  <rect x="340" y="70" width="120" height="60" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="400" y="95" text-anchor="middle" font-size="15" fill="#202124">Address</text>
  <text x="400" y="113" text-anchor="middle" font-size="12" fill="#202124">author fixes</text>

  <!-- Approve -->
  <rect x="500" y="70" width="120" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="560" y="95" text-anchor="middle" font-size="15" fill="#202124">Approve</text>
  <text x="560" y="113" text-anchor="middle" font-size="12" fill="#202124">LGTM</text>

  <!-- Merge -->
  <rect x="600" y="10" width="100" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="650" y="37" text-anchor="middle" font-size="15" fill="#202124">Merge</text>

  <!-- arrows -->
  <line x1="140" y1="100" x2="178" y2="100" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="100" x2="338" y2="100" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="100" x2="498" y2="100" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- approve to merge -->
  <line x1="600" y1="80" x2="640" y2="56" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- loop back: address -> review -->
  <path d="M400,70 C400,40 240,40 240,68" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="38" text-anchor="middle" font-size="11" fill="#5F6368">re-review</text>
</svg>
