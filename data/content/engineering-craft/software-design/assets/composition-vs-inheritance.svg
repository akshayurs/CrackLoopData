<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="180" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Inheritance</text>
  <text x="540" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Composition</text>

  <!-- Inheritance tree -->
  <rect x="115" y="50" width="130" height="44" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="180" y="77" text-anchor="middle" font-size="15" fill="#202124">Bird</text>

  <rect x="40" y="150" width="130" height="44" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="105" y="177" text-anchor="middle" font-size="15" fill="#202124">FlyingBird</text>

  <rect x="190" y="150" width="130" height="44" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="255" y="177" text-anchor="middle" font-size="15" fill="#202124">SwimmingBird</text>

  <line x1="150" y1="94" x2="110" y2="148" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="210" y1="94" x2="250" y2="148" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="100" y="250" width="160" height="60" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="180" y="276" text-anchor="middle" font-size="14" fill="#202124">Penguin?</text>
  <text x="180" y="294" text-anchor="middle" font-size="12" fill="#202124">swims + can't fly</text>
  <line x1="105" y1="194" x2="160" y2="248" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="255" y1="194" x2="200" y2="248" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="180" y="340" text-anchor="middle" font-size="11" fill="#EA4335">tree breaks down</text>

  <!-- Composition -->
  <rect x="470" y="50" width="140" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="540" y="77" text-anchor="middle" font-size="15" fill="#202124">Bird</text>

  <rect x="400" y="170" width="130" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="465" y="197" text-anchor="middle" font-size="14" fill="#202124">FlyBehavior</text>

  <rect x="550" y="170" width="130" height="44" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="615" y="197" text-anchor="middle" font-size="14" fill="#202124">SwimBehavior</text>

  <line x1="510" y1="94" x2="475" y2="168" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="94" x2="610" y2="168" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="130" text-anchor="middle" font-size="11" fill="#34A853">has-a (plug in)</text>

  <rect x="470" y="270" width="140" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="540" y="296" text-anchor="middle" font-size="14" fill="#202124">Penguin</text>
  <text x="540" y="314" text-anchor="middle" font-size="12" fill="#202124">Swim + NoFly</text>
  <line x1="465" y1="214" x2="525" y2="268" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="615" y1="214" x2="555" y2="268" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
