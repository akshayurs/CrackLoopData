<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="180" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Tight coupling</text>
  <text x="540" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Loose coupling</text>

  <!-- Tight: order knows DB directly -->
  <rect x="60" y="60" width="130" height="48" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="125" y="83" text-anchor="middle" font-size="15" fill="#202124">OrderService</text>
  <text x="125" y="99" text-anchor="middle" font-size="12" fill="#202124">calls concrete</text>

  <rect x="60" y="160" width="130" height="48" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="125" y="183" text-anchor="middle" font-size="15" fill="#202124">MySQLStore</text>
  <text x="125" y="199" text-anchor="middle" font-size="12" fill="#202124">concrete class</text>

  <line x1="125" y1="108" x2="125" y2="158" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="138" text-anchor="middle" font-size="11" fill="#EA4335">hard-wired</text>

  <rect x="60" y="260" width="130" height="48" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="125" y="283" text-anchor="middle" font-size="15" fill="#202124">Email SMTP</text>
  <text x="125" y="299" text-anchor="middle" font-size="12" fill="#202124">new MySQLStore</text>
  <line x1="190" y1="84" x2="280" y2="276" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Loose: order -> interface -> impls -->
  <rect x="420" y="60" width="130" height="48" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="485" y="83" text-anchor="middle" font-size="15" fill="#202124">OrderService</text>
  <text x="485" y="99" text-anchor="middle" font-size="12" fill="#202124">calls interface</text>

  <rect x="420" y="160" width="130" height="48" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="485" y="183" text-anchor="middle" font-size="15" fill="#202124">Store</text>
  <text x="485" y="199" text-anchor="middle" font-size="12" fill="#202124">interface</text>

  <line x1="485" y1="108" x2="485" y2="158" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="485" y="138" text-anchor="middle" font-size="11" fill="#34A853">depends on</text>

  <rect x="350" y="260" width="120" height="48" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="410" y="288" text-anchor="middle" font-size="14" fill="#202124">MySQLStore</text>

  <rect x="500" y="260" width="120" height="48" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="560" y="288" text-anchor="middle" font-size="14" fill="#202124">InMemoryStore</text>

  <line x1="450" y1="208" x2="420" y2="258" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="208" x2="555" y2="258" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="485" y="240" text-anchor="middle" font-size="11" fill="#9AA0A6">swappable</text>
</svg>
