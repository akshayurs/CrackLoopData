<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- event time axis -->
  <text x="20" y="40" font-size="15" fill="#202124">Event time</text>
  <text x="20" y="58" font-size="11" fill="#9AA0A6">when it happened</text>
  <line x1="20" y1="90" x2="700" y2="90" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="120" cy="90" r="6" fill="#4285F4"/>
  <circle cx="240" cy="90" r="6" fill="#4285F4"/>
  <circle cx="360" cy="90" r="6" fill="#4285F4"/>
  <circle cx="480" cy="90" r="6" fill="#EA4335"/>
  <text x="480" y="78" font-size="11" fill="#EA4335" text-anchor="middle">late event</text>

  <!-- processing time axis -->
  <text x="20" y="180" font-size="15" fill="#202124">Processing time</text>
  <text x="20" y="198" font-size="11" fill="#9AA0A6">when engine sees it</text>
  <line x1="20" y1="230" x2="700" y2="230" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="120" cy="230" r="6" fill="#4285F4"/>
  <circle cx="240" cy="230" r="6" fill="#4285F4"/>
  <circle cx="360" cy="230" r="6" fill="#4285F4"/>
  <circle cx="640" cy="230" r="6" fill="#EA4335"/>
  <text x="640" y="218" font-size="11" fill="#EA4335" text-anchor="middle">arrives late</text>

  <!-- watermark box -->
  <rect x="430" y="280" width="180" height="44" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="520" y="300" font-size="14" fill="#202124" text-anchor="middle">Watermark</text>
  <text x="520" y="317" font-size="11" fill="#202124" text-anchor="middle">"done up to T"</text>
  <line x1="520" y1="230" x2="520" y2="280" stroke="#34A853" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
