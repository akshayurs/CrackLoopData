<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- event stream timeline -->
  <text x="20" y="28" font-size="12" fill="#202124">event stream (time →)</text>
  <line x1="20" y1="55" x2="700" y2="55" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="70" cy="55" r="5" fill="#4285F4"/>
  <circle cx="150" cy="55" r="5" fill="#4285F4"/>
  <circle cx="230" cy="55" r="5" fill="#4285F4"/>
  <circle cx="340" cy="55" r="5" fill="#4285F4"/>
  <circle cx="430" cy="55" r="5" fill="#4285F4"/>
  <circle cx="560" cy="55" r="5" fill="#4285F4"/>
  <circle cx="630" cy="55" r="5" fill="#4285F4"/>

  <!-- tumbling -->
  <text x="20" y="105" font-size="15" fill="#202124">Tumbling</text>
  <rect x="120" y="120" width="160" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <rect x="280" y="120" width="160" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <rect x="440" y="120" width="160" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="200" y="145" font-size="12" fill="#202124" text-anchor="middle">window 1</text>
  <text x="360" y="145" font-size="12" fill="#202124" text-anchor="middle">window 2</text>
  <text x="520" y="145" font-size="12" fill="#202124" text-anchor="middle">window 3</text>

  <!-- sliding -->
  <text x="20" y="210" font-size="15" fill="#202124">Sliding</text>
  <rect x="120" y="225" width="160" height="28" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <rect x="200" y="258" width="160" height="28" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <rect x="280" y="225" width="160" height="28" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="200" y="244" font-size="12" fill="#202124" text-anchor="middle">overlap</text>
  <text x="280" y="277" font-size="12" fill="#202124" text-anchor="middle">overlap</text>

  <!-- session -->
  <text x="20" y="325" font-size="15" fill="#202124">Session</text>
  <rect x="120" y="305" width="120" height="40" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <rect x="430" y="305" width="200" height="40" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="180" y="330" font-size="12" fill="#202124" text-anchor="middle">activity</text>
  <text x="530" y="330" font-size="12" fill="#202124" text-anchor="middle">activity</text>
  <text x="335" y="330" font-size="11" fill="#9AA0A6" text-anchor="middle">gap</text>
</svg>
