<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Clients -->
  <rect x="30" y="140" width="120" height="60" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="90" y="166" font-size="15" fill="#202124" text-anchor="middle">Clients</text>
  <text x="90" y="186" font-size="12" fill="#202124" text-anchor="middle">web / mobile</text>

  <!-- Gateway -->
  <rect x="250" y="110" width="170" height="120" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="335" y="140" font-size="15" fill="#202124" text-anchor="middle">API Gateway</text>
  <text x="335" y="164" font-size="12" fill="#202124" text-anchor="middle">TLS termination</text>
  <text x="335" y="182" font-size="12" fill="#202124" text-anchor="middle">authn / rate limit</text>
  <text x="335" y="200" font-size="12" fill="#202124" text-anchor="middle">routing</text>

  <!-- Services -->
  <rect x="540" y="40" width="150" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="615" y="74" font-size="15" fill="#202124" text-anchor="middle">Orders svc</text>

  <rect x="540" y="150" width="150" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="615" y="184" font-size="15" fill="#202124" text-anchor="middle">Users svc</text>

  <rect x="540" y="260" width="150" height="60" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="615" y="294" font-size="15" fill="#202124" text-anchor="middle">Payments svc</text>

  <!-- Arrows -->
  <line x1="150" y1="170" x2="248" y2="170" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="199" y="160" font-size="11" fill="#5F6368" text-anchor="middle">HTTPS</text>

  <line x1="420" y1="150" x2="538" y2="75" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="170" x2="538" y2="180" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="195" x2="538" y2="285" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="360" y="330" font-size="12" fill="#5F6368" text-anchor="middle">north-south traffic (client to system)</text>
</svg>
