<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">MapReduce Word Count</text>

  <!-- Input -->
  <rect x="20" y="60" width="120" height="90" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="80" y="95" text-anchor="middle" font-size="15" fill="#202124">Input split</text>
  <text x="80" y="118" text-anchor="middle" font-size="12" fill="#202124">"cat dog cat"</text>
  <text x="80" y="136" text-anchor="middle" font-size="12" fill="#202124">"dog cat"</text>

  <!-- Map -->
  <rect x="200" y="50" width="120" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="260" y="72" text-anchor="middle" font-size="15" fill="#202124">Map</text>
  <text x="260" y="90" text-anchor="middle" font-size="12" fill="#202124">cat:1 dog:1 cat:1</text>

  <rect x="200" y="120" width="120" height="50" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="260" y="142" text-anchor="middle" font-size="15" fill="#202124">Map</text>
  <text x="260" y="160" text-anchor="middle" font-size="12" fill="#202124">dog:1 cat:1</text>

  <!-- Shuffle -->
  <rect x="380" y="80" width="120" height="80" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="440" y="108" text-anchor="middle" font-size="15" fill="#202124">Shuffle</text>
  <text x="440" y="128" text-anchor="middle" font-size="12" fill="#202124">cat:[1,1,1]</text>
  <text x="440" y="146" text-anchor="middle" font-size="12" fill="#202124">dog:[1,1]</text>

  <!-- Reduce -->
  <rect x="560" y="50" width="120" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="620" y="72" text-anchor="middle" font-size="15" fill="#202124">Reduce</text>
  <text x="620" y="90" text-anchor="middle" font-size="12" fill="#202124">cat: 3</text>

  <rect x="560" y="120" width="120" height="50" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="620" y="142" text-anchor="middle" font-size="15" fill="#202124">Reduce</text>
  <text x="620" y="160" text-anchor="middle" font-size="12" fill="#202124">dog: 2</text>

  <!-- Arrows -->
  <line x1="140" y1="90" x2="198" y2="72" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="120" x2="198" y2="142" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="78" x2="378" y2="105" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="145" x2="378" y2="125" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="108" x2="558" y2="78" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="130" x2="558" y2="145" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="170" y="78" text-anchor="middle" font-size="11" fill="#5F6368">parse</text>
  <text x="350" y="78" text-anchor="middle" font-size="11" fill="#5F6368">group key</text>
  <text x="530" y="98" text-anchor="middle" font-size="11" fill="#5F6368">sum</text>

  <text x="360" y="220" text-anchor="middle" font-size="12" fill="#5F6368">Map runs in parallel; shuffle groups by key; reduce aggregates each key</text>
</svg>
