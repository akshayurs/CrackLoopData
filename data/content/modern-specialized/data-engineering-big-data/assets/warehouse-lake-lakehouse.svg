<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Warehouse vs Lake vs Lakehouse</text>

  <!-- Warehouse -->
  <rect x="30" y="55" width="190" height="200" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="125" y="82" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Warehouse</text>
  <text x="125" y="108" text-anchor="middle" font-size="12" fill="#202124">Structured tables</text>
  <text x="125" y="130" text-anchor="middle" font-size="12" fill="#202124">Schema on write</text>
  <text x="125" y="152" text-anchor="middle" font-size="12" fill="#202124">Fast SQL / BI</text>
  <text x="125" y="174" text-anchor="middle" font-size="12" fill="#202124">Costly storage</text>
  <text x="125" y="210" text-anchor="middle" font-size="12" fill="#5F6368">Snowflake,</text>
  <text x="125" y="228" text-anchor="middle" font-size="12" fill="#5F6368">BigQuery</text>

  <!-- Lake -->
  <rect x="265" y="55" width="190" height="200" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="82" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Lake</text>
  <text x="360" y="108" text-anchor="middle" font-size="12" fill="#202124">Any raw files</text>
  <text x="360" y="130" text-anchor="middle" font-size="12" fill="#202124">Schema on read</text>
  <text x="360" y="152" text-anchor="middle" font-size="12" fill="#202124">Cheap, flexible</text>
  <text x="360" y="174" text-anchor="middle" font-size="12" fill="#202124">No ACID, messy</text>
  <text x="360" y="210" text-anchor="middle" font-size="12" fill="#5F6368">S3, HDFS</text>
  <text x="360" y="228" text-anchor="middle" font-size="12" fill="#5F6368">+ Parquet</text>

  <!-- Lakehouse -->
  <rect x="500" y="55" width="190" height="200" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="595" y="82" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Lakehouse</text>
  <text x="595" y="108" text-anchor="middle" font-size="12" fill="#202124">Lake + ACID</text>
  <text x="595" y="130" text-anchor="middle" font-size="12" fill="#202124">Table format layer</text>
  <text x="595" y="152" text-anchor="middle" font-size="12" fill="#202124">SQL + ML on one</text>
  <text x="595" y="174" text-anchor="middle" font-size="12" fill="#202124">Cheap + governed</text>
  <text x="595" y="210" text-anchor="middle" font-size="12" fill="#5F6368">Delta, Iceberg,</text>
  <text x="595" y="228" text-anchor="middle" font-size="12" fill="#5F6368">Hudi</text>

  <line x1="220" y1="290" x2="265" y2="290" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="455" y1="290" x2="500" y2="290" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="295" text-anchor="middle" font-size="11" fill="#5F6368">evolution</text>
  <text x="595" y="295" text-anchor="middle" font-size="11" fill="#5F6368">merge of both</text>
</svg>
