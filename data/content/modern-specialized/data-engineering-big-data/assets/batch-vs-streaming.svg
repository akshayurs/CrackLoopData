<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Batch row -->
  <text x="360" y="30" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Batch pipeline (runs on a schedule)</text>

  <rect x="20" y="50" width="120" height="55" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="80" y="75" text-anchor="middle" font-size="15" fill="#202124">Sources</text>
  <text x="80" y="93" text-anchor="middle" font-size="12" fill="#202124">logs, DBs</text>

  <rect x="190" y="50" width="120" height="55" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="250" y="75" text-anchor="middle" font-size="15" fill="#202124">Land in lake</text>
  <text x="250" y="93" text-anchor="middle" font-size="12" fill="#202124">hourly dump</text>

  <rect x="360" y="50" width="120" height="55" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="420" y="75" text-anchor="middle" font-size="15" fill="#202124">Spark job</text>
  <text x="420" y="93" text-anchor="middle" font-size="12" fill="#202124">2am nightly</text>

  <rect x="530" y="50" width="120" height="55" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="590" y="75" text-anchor="middle" font-size="15" fill="#202124">Warehouse</text>
  <text x="590" y="93" text-anchor="middle" font-size="12" fill="#202124">dashboards</text>

  <line x1="140" y1="77" x2="188" y2="77" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="77" x2="358" y2="77" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="77" x2="528" y2="77" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="130" text-anchor="middle" font-size="12" fill="#5F6368">High latency (minutes to hours), high throughput, simple to reason about</text>

  <!-- divider -->
  <line x1="20" y1="170" x2="700" y2="170" stroke="#9AA0A6" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Streaming row -->
  <text x="360" y="210" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">Streaming pipeline (runs continuously)</text>

  <rect x="20" y="230" width="120" height="55" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="80" y="255" text-anchor="middle" font-size="15" fill="#202124">Events</text>
  <text x="80" y="273" text-anchor="middle" font-size="12" fill="#202124">clicks, IoT</text>

  <rect x="190" y="230" width="120" height="55" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="250" y="255" text-anchor="middle" font-size="15" fill="#202124">Kafka</text>
  <text x="250" y="273" text-anchor="middle" font-size="12" fill="#202124">event log</text>

  <rect x="360" y="230" width="120" height="55" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="420" y="255" text-anchor="middle" font-size="15" fill="#202124">Stream proc</text>
  <text x="420" y="273" text-anchor="middle" font-size="12" fill="#202124">Flink, windows</text>

  <rect x="530" y="230" width="120" height="55" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="590" y="255" text-anchor="middle" font-size="15" fill="#202124">Live sink</text>
  <text x="590" y="273" text-anchor="middle" font-size="12" fill="#202124">alerts, cache</text>

  <line x1="140" y1="257" x2="188" y2="257" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="257" x2="358" y2="257" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="257" x2="528" y2="257" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="320" text-anchor="middle" font-size="12" fill="#5F6368">Low latency (ms to seconds), unbounded data, harder: ordering and state</text>
</svg>
