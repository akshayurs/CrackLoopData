<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <text x="180" y="28" font-size="15" fill="#202124" text-anchor="middle" font-weight="bold">Containers</text>
  <text x="540" y="28" font-size="15" fill="#202124" text-anchor="middle" font-weight="bold">Virtual Machines</text>

  <!-- Container stack -->
  <rect x="40" y="50" width="90" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="85" y="74" font-size="12" fill="#202124" text-anchor="middle">App A</text>
  <rect x="145" y="50" width="90" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="190" y="74" font-size="12" fill="#202124" text-anchor="middle">App B</text>
  <rect x="250" y="50" width="90" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="295" y="74" font-size="12" fill="#202124" text-anchor="middle">App C</text>

  <rect x="40" y="100" width="300" height="40" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="190" y="124" font-size="13" fill="#202124" text-anchor="middle">Container runtime</text>

  <rect x="40" y="150" width="300" height="40" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="190" y="174" font-size="13" fill="#202124" text-anchor="middle">Host OS kernel (shared)</text>

  <rect x="40" y="200" width="300" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="190" y="224" font-size="13" fill="#202124" text-anchor="middle">Physical hardware</text>

  <text x="190" y="270" font-size="12" fill="#202124" text-anchor="middle">No guest OS, MBs, boots in ms</text>

  <!-- VM stack -->
  <rect x="400" y="50" width="90" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="445" y="74" font-size="12" fill="#202124" text-anchor="middle">App A</text>
  <rect x="505" y="50" width="90" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="550" y="74" font-size="12" fill="#202124" text-anchor="middle">App B</text>
  <rect x="610" y="50" width="90" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="655" y="74" font-size="12" fill="#202124" text-anchor="middle">App C</text>

  <rect x="400" y="100" width="90" height="40" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="445" y="124" font-size="12" fill="#202124" text-anchor="middle">Guest OS</text>
  <rect x="505" y="100" width="90" height="40" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="550" y="124" font-size="12" fill="#202124" text-anchor="middle">Guest OS</text>
  <rect x="610" y="100" width="90" height="40" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="655" y="124" font-size="12" fill="#202124" text-anchor="middle">Guest OS</text>

  <rect x="400" y="150" width="300" height="40" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="550" y="174" font-size="13" fill="#202124" text-anchor="middle">Hypervisor</text>

  <rect x="400" y="200" width="300" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="550" y="224" font-size="13" fill="#202124" text-anchor="middle">Physical hardware</text>

  <text x="550" y="270" font-size="12" fill="#202124" text-anchor="middle">Full OS each, GBs, boots in sec</text>
</svg>