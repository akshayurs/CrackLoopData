<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="220" y="30" font-size="15" fill="#202124" text-anchor="middle" font-weight="bold">Image = stacked read-only layers</text>

  <!-- writable layer on top -->
  <rect x="90" y="50" width="260" height="40" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="220" y="75" font-size="13" fill="#202124" text-anchor="middle">Writable layer (container)</text>

  <!-- read-only layers -->
  <rect x="90" y="100" width="260" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="220" y="125" font-size="13" fill="#202124" text-anchor="middle">COPY app code</text>

  <rect x="90" y="150" width="260" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="220" y="175" font-size="13" fill="#202124" text-anchor="middle">RUN pip install</text>

  <rect x="90" y="200" width="260" height="40" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="220" y="225" font-size="13" fill="#202124" text-anchor="middle">RUN apt-get deps</text>

  <rect x="90" y="250" width="260" height="40" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="220" y="275" font-size="13" fill="#202124" text-anchor="middle">Base image: ubuntu</text>

  <text x="220" y="320" font-size="12" fill="#202124" text-anchor="middle">union filesystem merges them</text>
  <text x="220" y="338" font-size="12" fill="#202124" text-anchor="middle">into one view</text>

  <!-- sharing -->
  <line x1="350" y1="270" x2="470" y2="200" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="248" font-size="11" fill="#5F6368" text-anchor="middle">shared</text>

  <rect x="470" y="120" width="200" height="160" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="570" y="150" font-size="13" fill="#202124" text-anchor="middle" font-weight="bold">Other images</text>
  <text x="570" y="180" font-size="12" fill="#202124" text-anchor="middle">reuse same base</text>
  <text x="570" y="205" font-size="12" fill="#202124" text-anchor="middle">layers on disk</text>
  <text x="570" y="230" font-size="12" fill="#202124" text-anchor="middle">+ in registry</text>
  <text x="570" y="255" font-size="12" fill="#202124" text-anchor="middle">stored once</text>
</svg>