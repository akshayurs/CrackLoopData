<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Namespaces group -->
  <rect x="30" y="40" width="300" height="190" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="180" y="62" font-size="15" fill="#202124" text-anchor="middle" font-weight="bold">Namespaces</text>
  <text x="180" y="80" font-size="12" fill="#202124" text-anchor="middle">what the process can SEE</text>

  <rect x="50" y="95" width="120" height="38" rx="8" fill="#FFFFFF" stroke="#4285F4" stroke-width="1.5"/>
  <text x="110" y="119" font-size="12" fill="#202124" text-anchor="middle">PID + Mount</text>

  <rect x="190" y="95" width="120" height="38" rx="8" fill="#FFFFFF" stroke="#4285F4" stroke-width="1.5"/>
  <text x="250" y="119" font-size="12" fill="#202124" text-anchor="middle">Network + UTS</text>

  <rect x="50" y="145" width="120" height="38" rx="8" fill="#FFFFFF" stroke="#4285F4" stroke-width="1.5"/>
  <text x="110" y="169" font-size="12" fill="#202124" text-anchor="middle">User + IPC</text>

  <rect x="190" y="145" width="120" height="38" rx="8" fill="#FFFFFF" stroke="#4285F4" stroke-width="1.5"/>
  <text x="250" y="169" font-size="12" fill="#202124" text-anchor="middle">Cgroup ns</text>

  <!-- cgroups group -->
  <rect x="390" y="40" width="300" height="190" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="540" y="62" font-size="15" fill="#202124" text-anchor="middle" font-weight="bold">cgroups</text>
  <text x="540" y="80" font-size="12" fill="#202124" text-anchor="middle">what it can USE</text>

  <rect x="410" y="95" width="120" height="38" rx="8" fill="#FFFFFF" stroke="#34A853" stroke-width="1.5"/>
  <text x="470" y="119" font-size="12" fill="#202124" text-anchor="middle">CPU shares</text>

  <rect x="550" y="95" width="120" height="38" rx="8" fill="#FFFFFF" stroke="#34A853" stroke-width="1.5"/>
  <text x="610" y="119" font-size="12" fill="#202124" text-anchor="middle">Memory cap</text>

  <rect x="410" y="145" width="120" height="38" rx="8" fill="#FFFFFF" stroke="#34A853" stroke-width="1.5"/>
  <text x="470" y="169" font-size="12" fill="#202124" text-anchor="middle">Disk I/O</text>

  <rect x="550" y="145" width="120" height="38" rx="8" fill="#FFFFFF" stroke="#34A853" stroke-width="1.5"/>
  <text x="610" y="169" font-size="12" fill="#202124" text-anchor="middle">PIDs limit</text>

  <!-- arrows down -->
  <line x1="180" y1="230" x2="330" y2="285" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="230" x2="390" y2="285" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Container result -->
  <rect x="240" y="290" width="240" height="50" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="360" y="312" font-size="15" fill="#202124" text-anchor="middle" font-weight="bold">A Container</text>
  <text x="360" y="330" font-size="12" fill="#202124" text-anchor="middle">one isolated, limited process</text>
</svg>