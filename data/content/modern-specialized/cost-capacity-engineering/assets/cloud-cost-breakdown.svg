<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="360" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Monthly Cloud Bill — by Resource Type</text>

  <!-- Compute -->
  <rect x="40" y="70" width="150" height="80" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="115" y="102" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Compute</text>
  <text x="115" y="124" text-anchor="middle" font-size="12" fill="#202124">VMs, containers</text>
  <text x="115" y="140" text-anchor="middle" font-size="12" fill="#4285F4">~50%</text>

  <!-- Storage -->
  <rect x="210" y="70" width="150" height="80" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="285" y="102" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Storage</text>
  <text x="285" y="124" text-anchor="middle" font-size="12" fill="#202124">disks, objects</text>
  <text x="285" y="140" text-anchor="middle" font-size="12" fill="#34A853">~20%</text>

  <!-- Network in-region -->
  <rect x="380" y="70" width="150" height="80" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="455" y="102" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Network</text>
  <text x="455" y="124" text-anchor="middle" font-size="12" fill="#202124">in-region</text>
  <text x="455" y="140" text-anchor="middle" font-size="12" fill="#FBBC04">~10%</text>

  <!-- Egress -->
  <rect x="550" y="70" width="150" height="80" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="625" y="102" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Egress</text>
  <text x="625" y="124" text-anchor="middle" font-size="12" fill="#202124">data leaving</text>
  <text x="625" y="140" text-anchor="middle" font-size="12" fill="#EA4335">the surprise</text>

  <!-- Other / managed services -->
  <rect x="210" y="200" width="320" height="70" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="370" y="230" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Managed services + licenses</text>
  <text x="370" y="252" text-anchor="middle" font-size="12" fill="#202124">DBs, queues, LBs, support — ~20%</text>

  <line x1="115" y1="150" x2="320" y2="200" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="455" y1="150" x2="420" y2="200" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
