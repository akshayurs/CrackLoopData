<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Query -->
  <rect x="20" y="80" width="110" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="75" y="104" font-size="15" fill="#202124" text-anchor="middle">User query</text>
  <text x="75" y="122" font-size="12" fill="#202124" text-anchor="middle">plain text</text>

  <!-- Embed -->
  <rect x="170" y="80" width="110" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="225" y="104" font-size="15" fill="#202124" text-anchor="middle">Embed</text>
  <text x="225" y="122" font-size="12" fill="#202124" text-anchor="middle">to vector</text>

  <!-- Retrieve -->
  <rect x="320" y="80" width="110" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="375" y="104" font-size="15" fill="#202124" text-anchor="middle">Retrieve</text>
  <text x="375" y="122" font-size="12" fill="#202124" text-anchor="middle">top-k chunks</text>

  <!-- Vector DB -->
  <rect x="320" y="10" width="110" height="44" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="375" y="37" font-size="13" fill="#202124" text-anchor="middle">Vector DB</text>

  <!-- Augment -->
  <rect x="470" y="80" width="110" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="525" y="104" font-size="15" fill="#202124" text-anchor="middle">Augment</text>
  <text x="525" y="122" font-size="12" fill="#202124" text-anchor="middle">build prompt</text>

  <!-- Generate -->
  <rect x="610" y="80" width="100" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="660" y="104" font-size="15" fill="#202124" text-anchor="middle">Generate</text>
  <text x="660" y="122" font-size="12" fill="#202124" text-anchor="middle">LLM answer</text>

  <!-- arrows -->
  <line x1="130" y1="108" x2="168" y2="108" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="108" x2="318" y2="108" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="108" x2="468" y2="108" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="108" x2="608" y2="108" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="375" y1="54" x2="375" y2="78" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="392" y="70" font-size="11" fill="#5F6368" text-anchor="start">similar</text>
</svg>
