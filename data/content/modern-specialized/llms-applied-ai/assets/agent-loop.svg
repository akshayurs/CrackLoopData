<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <!-- Goal -->
  <rect x="20" y="100" width="120" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="80" y="124" font-size="15" fill="#202124" text-anchor="middle">Goal</text>
  <text x="80" y="142" font-size="12" fill="#202124" text-anchor="middle">user task</text>

  <!-- Think -->
  <rect x="200" y="100" width="120" height="56" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="260" y="124" font-size="15" fill="#202124" text-anchor="middle">Think</text>
  <text x="260" y="142" font-size="12" fill="#202124" text-anchor="middle">plan next step</text>

  <!-- Call tool -->
  <rect x="380" y="100" width="120" height="56" rx="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="440" y="124" font-size="15" fill="#202124" text-anchor="middle">Call tool</text>
  <text x="440" y="142" font-size="12" fill="#202124" text-anchor="middle">API / search</text>

  <!-- Observe -->
  <rect x="380" y="20" width="120" height="56" rx="8" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="440" y="44" font-size="15" fill="#202124" text-anchor="middle">Observe</text>
  <text x="440" y="62" font-size="12" fill="#202124" text-anchor="middle">tool result</text>

  <!-- Done -->
  <rect x="560" y="100" width="120" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="620" y="124" font-size="15" fill="#202124" text-anchor="middle">Answer</text>
  <text x="620" y="142" font-size="12" fill="#202124" text-anchor="middle">when done</text>

  <!-- arrows -->
  <line x1="140" y1="128" x2="198" y2="128" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="128" x2="378" y2="128" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="100" x2="440" y2="78" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- observe back to think -->
  <path d="M380,48 L260,48 L260,98" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="42" font-size="11" fill="#5F6368" text-anchor="middle">loop</text>
  <!-- think to done -->
  <path d="M260,156 L260,210 L620,210 L620,158" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="228" font-size="11" fill="#5F6368" text-anchor="middle">goal reached</text>
</svg>
