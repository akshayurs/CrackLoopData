<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-line, #5F6368)"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--dg-accent, #0C8F88)"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="16" fill="var(--dg-ink, #202124)" font-weight="600">Inside a DBMS: how a query becomes data</text>

  <!-- Client app (neutral) -->
  <rect x="270" y="52" width="180" height="44" rx="8" fill="var(--dg-fill, #F1F3F4)" stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5"/>
  <text x="360" y="79" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)">Client app</text>

  <line x1="360" y1="96" x2="360" y2="122" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="113" font-size="12" fill="var(--dg-muted, #5F6368)">SQL text</text>

  <!-- Query processor (accent) -->
  <rect x="200" y="122" width="320" height="62" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="360" y="147" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Query processor</text>
  <text x="360" y="167" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">parser -&gt; optimizer -&gt; executor</text>

  <line x1="360" y1="184" x2="360" y2="212" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="203" font-size="12" fill="var(--dg-muted, #5F6368)">plan &#183; page reads/writes</text>

  <!-- Storage engine (accent) -->
  <rect x="200" y="212" width="320" height="62" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="360" y="237" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Storage engine</text>
  <text x="360" y="257" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">buffer pool (RAM) + data files</text>

  <!-- Transaction manager (accent) -->
  <rect x="548" y="212" width="150" height="62" rx="8" fill="var(--dg-accent-bg, #E3F3F1)" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5"/>
  <text x="623" y="237" text-anchor="middle" font-size="13" fill="var(--dg-ink, #202124)" font-weight="600">Txn manager</text>
  <text x="623" y="257" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">write-ahead log</text>

  <line x1="548" y1="243" x2="522" y2="243" stroke="var(--dg-accent, #0C8F88)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="535" y="290" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">commit / recover</text>

  <line x1="360" y1="274" x2="360" y2="304" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Disk (neutral) -->
  <g stroke="var(--dg-stroke, #9AA0A6)" stroke-width="1.5" fill="var(--dg-fill, #F1F3F4)">
    <path d="M300,318 a60,14 0 0 1 120,0 v40 a60,14 0 0 1 -120,0 z"/>
    <ellipse cx="360" cy="318" rx="60" ry="14"/>
  </g>
  <text x="360" y="345" text-anchor="middle" font-size="12" fill="var(--dg-ink, #202124)">disk (durable)</text>

  <!-- return path -->
  <path d="M200,243 H150 V74 H268" fill="none" stroke="var(--dg-line, #5F6368)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="158" y="160" font-size="12" fill="var(--dg-muted, #5F6368)" transform="rotate(-90 158,160)">result rows</text>

  <text x="360" y="410" text-anchor="middle" font-size="12" fill="var(--dg-muted, #5F6368)">Query text goes down; rows come back up. The log makes commits survive a crash.</text>
</svg>
